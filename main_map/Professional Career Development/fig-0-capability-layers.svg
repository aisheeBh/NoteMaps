<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>The layers of professional capability</title>
  <desc>Four stacked layers rising from knowledge through skill and competence to expertise, flanked by two columns, judgement and character, that run through every layer.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
  </defs>

  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">The layers of professional capability</text>

  <!-- side columns -->
  <rect x="20" y="70" width="140" height="470" fill="url(#lines)" stroke="#222222" stroke-width="2.5"/>
  <rect x="27" y="250" width="126" height="110" fill="#FFFFFF" stroke="#8B0000" stroke-width="1.5"/>
  <text x="90" y="290" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">CHARACTER</text>
  <text x="90" y="312" text-anchor="middle" font-size="13" fill="#111111">integrity,</text>
  <text x="90" y="330" text-anchor="middle" font-size="13" fill="#111111">ethics, care</text>

  <rect x="800" y="70" width="140" height="470" fill="url(#lines)" stroke="#222222" stroke-width="2.5"/>
  <rect x="807" y="250" width="126" height="110" fill="#FFFFFF" stroke="#8B0000" stroke-width="1.5"/>
  <text x="870" y="290" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">JUDGEMENT</text>
  <text x="870" y="312" text-anchor="middle" font-size="13" fill="#111111">deciding well</text>
  <text x="870" y="330" text-anchor="middle" font-size="13" fill="#111111">under uncertainty</text>

  <!-- layers (pyramid) -->
  <polygon points="170,540 790,540 760,430 200,430" fill="url(#hatch)" stroke="#222222" stroke-width="2.5"/>
  <polygon points="200,425 760,425 730,315 230,315" fill="url(#dots)" stroke="#222222" stroke-width="2.5"/>
  <polygon points="230,310 730,310 700,200 260,200" fill="url(#cross)" stroke="#222222" stroke-width="2.5"/>
  <polygon points="260,195 700,195 660,80 300,80" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>

  <g text-anchor="middle" fill="#111111">
    <rect x="330" y="455" width="300" height="62" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1.5"/>
    <text x="480" y="480" font-size="18" font-weight="bold">KNOWLEDGE</text>
    <text x="480" y="502" font-size="14">knowing that and knowing why</text>

    <rect x="330" y="340" width="300" height="62" fill="#FFFFFF" stroke="#7A5200" stroke-width="1.5"/>
    <text x="480" y="365" font-size="18" font-weight="bold">SKILL</text>
    <text x="480" y="387" font-size="14">knowing how: reliable performance</text>

    <rect x="310" y="225" width="340" height="62" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1.5"/>
    <text x="480" y="250" font-size="18" font-weight="bold">COMPETENCE</text>
    <text x="480" y="272" font-size="14">performing to standard in real settings</text>
  </g>
  <text x="480" y="122" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">EXPERTISE</text>
  <text x="480" y="146" text-anchor="middle" font-size="14" fill="#FFFFFF">consistently superior performance;</text>
  <text x="480" y="166" text-anchor="middle" font-size="14" fill="#FFFFFF">adapts to problems never met before</text>

  <text x="480" y="580" text-anchor="middle" font-size="13" fill="#333333">Each layer depends on the one beneath it; character and judgement shape how every layer is used.</text>
</svg>
