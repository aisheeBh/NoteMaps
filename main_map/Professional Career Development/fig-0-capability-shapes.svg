<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>Four shapes of professional capability</title>
  <desc>I-shaped: one deep specialism with little breadth. Generalist: broad but shallow. T-shaped: broad plus one deep specialism. Pi-shaped: broad plus two deep specialisms.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Breadth and depth: four shapes of capability</text>

  <!-- axis hints -->
  <text x="480" y="66" text-anchor="middle" font-size="14" fill="#333333">horizontal bar = breadth across fields · vertical bar = depth in a field</text>

  <!-- I-shaped -->
  <rect x="40" y="90" width="200" height="330" fill="#FAFAFA" stroke="#555555" stroke-width="1"/>
  <rect x="122" y="120" width="36" height="270" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <text x="140" y="448" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">I-shaped</text>
  <text x="140" y="470" text-anchor="middle" font-size="14" fill="#111111">deep, narrow</text>
  <text x="140" y="490" text-anchor="middle" font-size="14" fill="#111111">the pure specialist</text>

  <!-- generalist -->
  <rect x="270" y="90" width="200" height="330" fill="#FAFAFA" stroke="#555555" stroke-width="1"/>
  <rect x="290" y="120" width="160" height="36" fill="url(#hatch)" stroke="#222222" stroke-width="2"/>
  <text x="370" y="448" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Dash-shaped</text>
  <text x="370" y="470" text-anchor="middle" font-size="14" fill="#111111">broad, shallow</text>
  <text x="370" y="490" text-anchor="middle" font-size="14" fill="#111111">the pure generalist</text>

  <!-- T-shaped -->
  <rect x="500" y="90" width="200" height="330" fill="#FAFAFA" stroke="#555555" stroke-width="1"/>
  <rect x="520" y="120" width="160" height="36" fill="url(#hatch)" stroke="#222222" stroke-width="2"/>
  <rect x="582" y="156" width="36" height="234" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <text x="600" y="448" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">T-shaped</text>
  <text x="600" y="470" text-anchor="middle" font-size="14" fill="#111111">broad + one deep</text>
  <text x="600" y="490" text-anchor="middle" font-size="14" fill="#111111">specialism</text>

  <!-- Pi-shaped -->
  <rect x="730" y="90" width="200" height="330" fill="#FAFAFA" stroke="#555555" stroke-width="1"/>
  <rect x="750" y="120" width="160" height="36" fill="url(#hatch)" stroke="#222222" stroke-width="2"/>
  <rect x="772" y="156" width="36" height="234" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <rect x="852" y="156" width="36" height="180" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <text x="830" y="448" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Pi-shaped</text>
  <text x="830" y="470" text-anchor="middle" font-size="14" fill="#111111">broad + two deep</text>
  <text x="830" y="490" text-anchor="middle" font-size="14" fill="#111111">specialisms</text>
</svg>
