<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>From demonstrated to speculative claims</title>
  <desc>Three adjoining bands from left to right: demonstrated, extrapolated and speculative, with confidence decreasing to the right. Under each are example claims and the appropriate response: act, prepare, consider.</desc>

  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">How much evidence stands behind a claim?</text>
  <rect x="40" y="80" width="280" height="300" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5" />
  <rect x="56" y="96" width="248" height="268" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/>
  <text x="180" y="128" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">DEMONSTRATED</text>
  <text x="70" y="172" font-size="15" fill="#111111">- Olympiad gold-medal scores</text>
  <text x="70" y="206" font-size="15" fill="#111111">- Professional exam passes</text>
  <text x="70" y="240" font-size="15" fill="#111111">- Near-zero on new puzzles</text>
  <text x="180" y="330" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Response: act on it</text>
  <rect x="340" y="80" width="280" height="300" fill="url(#dots)" stroke="#7A5200" stroke-width="2.5" stroke-dasharray="8 4"/>
  <rect x="356" y="96" width="248" height="268" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="480" y="128" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">EXTRAPOLATED</text>
  <text x="370" y="172" font-size="15" fill="#111111">- Task length keeps doubling</text>
  <text x="370" y="206" font-size="15" fill="#111111">- Scaling keeps paying off</text>
  <text x="370" y="240" font-size="15" fill="#111111">- Costs keep falling</text>
  <text x="480" y="330" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Response: prepare scenarios</text>
  <rect x="640" y="80" width="280" height="300" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="656" y="96" width="248" height="268" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
  <text x="780" y="128" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">SPECULATIVE</text>
  <text x="670" y="172" font-size="15" fill="#111111">- Self-improvement explosion</text>
  <text x="670" y="206" font-size="15" fill="#111111">- AGI in a named year</text>
  <text x="670" y="240" font-size="15" fill="#111111">- Machine consciousness</text>
  <text x="780" y="330" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Response: consider, test</text>
  <line x1="60" y1="420" x2="900" y2="420" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="60" y="446" font-size="15" fill="#111111">measured now, reproducible</text>
  <text x="900" y="446" text-anchor="end" font-size="15" fill="#111111">rests on assumptions</text>
  <text x="480" y="486" text-anchor="middle" font-size="13" fill="#333333">Examples are typical claims of 2025 and 2026; their placement can move as evidence accumulates.</text>
</svg>
