<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Shipping-fee rules as a decision tree</title>
  <desc>A hand-built decision tree. First question: weight over 30 kg? If yes, heavy-goods rate. If no, destination: international gives 18.00; domestic leads to weight up to 2 kg? If no, 7.00. If yes, member? Yes gives free shipping, no gives 3.50.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Five rules, one path for every parcel</text>

  <!-- question nodes -->
  <g font-size="16" fill="#111111">
    <rect x="370" y="64" width="220" height="50" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
    <text x="480" y="95" text-anchor="middle" font-weight="bold">Weight over 30 kg?</text>

    <rect x="490" y="174" width="200" height="50" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
    <text x="590" y="205" text-anchor="middle" font-weight="bold">Destination?</text>

    <rect x="330" y="284" width="220" height="50" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
    <text x="440" y="315" text-anchor="middle" font-weight="bold">Weight up to 2 kg?</text>

    <rect x="160" y="394" width="180" height="50" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
    <text x="250" y="425" text-anchor="middle" font-weight="bold">Member?</text>
  </g>

  <!-- outcomes -->
  <g font-size="16" fill="#111111">
    <rect x="130" y="174" width="220" height="50" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
    <text x="240" y="205" text-anchor="middle" font-weight="bold">Heavy-goods rate</text>

    <rect x="740" y="284" width="160" height="50" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
    <text x="820" y="315" text-anchor="middle" font-weight="bold">18.00</text>

    <rect x="490" y="394" width="160" height="50" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
    <text x="570" y="425" text-anchor="middle" font-weight="bold">7.00</text>

    <rect x="60" y="494" width="150" height="50" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
    <text x="135" y="525" text-anchor="middle" font-weight="bold">Free</text>

    <rect x="290" y="494" width="150" height="50" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
    <text x="365" y="525" text-anchor="middle" font-weight="bold">3.50</text>
  </g>

  <!-- edges -->
  <g stroke="#222222" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M430 114 L280 172"/>
    <path d="M530 114 L580 172"/>
    <path d="M640 224 L800 282"/>
    <path d="M560 224 L460 282"/>
    <path d="M490 334 L560 392"/>
    <path d="M390 334 L270 392"/>
    <path d="M220 444 L150 492"/>
    <path d="M280 444 L350 492"/>
  </g>
  <g font-size="15" fill="#111111">
    <rect x="322" y="128" width="40" height="22" fill="#FFFFFF"/><text x="342" y="144" text-anchor="middle">yes</text>
    <rect x="566" y="128" width="34" height="22" fill="#FFFFFF"/><text x="583" y="144" text-anchor="middle">no</text>
    <rect x="706" y="236" width="110" height="22" fill="#FFFFFF"/><text x="761" y="252" text-anchor="middle">international</text>
    <rect x="452" y="236" width="86" height="22" fill="#FFFFFF"/><text x="495" y="252" text-anchor="middle">domestic</text>
    <rect x="530" y="350" width="34" height="22" fill="#FFFFFF"/><text x="547" y="366" text-anchor="middle">no</text>
    <rect x="300" y="350" width="40" height="22" fill="#FFFFFF"/><text x="320" y="366" text-anchor="middle">yes</text>
    <rect x="136" y="446" width="40" height="22" fill="#FFFFFF"/><text x="156" y="462" text-anchor="middle">yes</text>
    <rect x="326" y="446" width="34" height="22" fill="#FFFFFF"/><text x="343" y="462" text-anchor="middle">no</text>
  </g>

  <text x="480" y="568" text-anchor="middle" font-size="13" fill="#333333">Illustrative fees. The tree and the decision table express the same logic.</text>
</svg>
