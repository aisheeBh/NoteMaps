<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Words in an embedding space</title>
  <desc>A schematic two-dimensional map of word embeddings. Four clusters: food words such as mango, banana and rice; finance words such as loan, interest and bank; legal words such as contract, clause and court; city names such as Mumbai, Delhi and Chennai. Parallel arrows from man to woman and from king to queen show that a consistent direction can capture a relationship.</desc>

  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Similar uses, nearby positions</text>
  <ellipse cx="230" cy="170" rx="150" ry="80" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="185" y="60" width="90" height="24" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1.5"/>
  <text x="230" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">FOOD</text>
  <rect x="156" y="140" width="54" height="22" fill="#FFFFFF" stroke="#666666" stroke-width="1"/>
  <circle cx="150" cy="151" r="4" fill="#111111"/>
  <text x="162" y="156" font-size="15" fill="#111111">mango</text>
  <rect x="236" y="125" width="63" height="22" fill="#FFFFFF" stroke="#666666" stroke-width="1"/>
  <circle cx="230" cy="136" r="4" fill="#111111"/>
  <text x="242" y="141" font-size="15" fill="#111111">banana</text>
  <rect x="186" y="185" width="46" height="22" fill="#FFFFFF" stroke="#666666" stroke-width="1"/>
  <circle cx="180" cy="196" r="4" fill="#111111"/>
  <text x="192" y="201" font-size="15" fill="#111111">rice</text>
  <rect x="266" y="175" width="72" height="22" fill="#FFFFFF" stroke="#666666" stroke-width="1"/>
  <circle cx="260" cy="186" r="4" fill="#111111"/>
  <text x="272" y="191" font-size="15" fill="#111111">chapati</text>
  <ellipse cx="700" cy="160" rx="160" ry="85" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
  <rect x="655" y="45" width="90" height="24" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1.5"/>
  <text x="700" y="63" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">FINANCE</text>
  <rect x="616" y="125" width="46" height="22" fill="#FFFFFF" stroke="#666666" stroke-width="1"/>
  <circle cx="610" cy="136" r="4" fill="#111111"/>
  <text x="622" y="141" font-size="15" fill="#111111">loan</text>
  <rect x="706" y="110" width="80" height="22" fill="#FFFFFF" stroke="#666666" stroke-width="1"/>
  <circle cx="700" cy="121" r="4" fill="#111111"/>
  <text x="712" y="126" font-size="15" fill="#111111">interest</text>
  <rect x="666" y="175" width="46" height="22" fill="#FFFFFF" stroke="#666666" stroke-width="1"/>
  <circle cx="660" cy="186" r="4" fill="#111111"/>
  <text x="672" y="191" font-size="15" fill="#111111">bank</text>
  <rect x="751" y="160" width="72" height="22" fill="#FFFFFF" stroke="#666666" stroke-width="1"/>
  <circle cx="745" cy="171" r="4" fill="#111111"/>
  <text x="757" y="176" font-size="15" fill="#111111">deposit</text>
  <ellipse cx="700" cy="400" rx="160" ry="80" fill="url(#dots)" stroke="#7A5200" stroke-width="2.5"/>
  <rect x="655" y="290" width="90" height="24" fill="#FFFFFF" stroke="#7A5200" stroke-width="1.5"/>
  <text x="700" y="308" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">LAW</text>
  <rect x="606" y="370" width="80" height="22" fill="#FFFFFF" stroke="#666666" stroke-width="1"/>
  <circle cx="600" cy="381" r="4" fill="#111111"/>
  <text x="612" y="386" font-size="15" fill="#111111">contract</text>
  <rect x="716" y="355" width="63" height="22" fill="#FFFFFF" stroke="#666666" stroke-width="1"/>
  <circle cx="710" cy="366" r="4" fill="#111111"/>
  <text x="722" y="371" font-size="15" fill="#111111">clause</text>
  <rect x="666" y="415" width="54" height="22" fill="#FFFFFF" stroke="#666666" stroke-width="1"/>
  <circle cx="660" cy="426" r="4" fill="#111111"/>
  <text x="672" y="431" font-size="15" fill="#111111">court</text>
  <rect x="756" y="400" width="72" height="22" fill="#FFFFFF" stroke="#666666" stroke-width="1"/>
  <circle cx="750" cy="411" r="4" fill="#111111"/>
  <text x="762" y="416" font-size="15" fill="#111111">verdict</text>
  <ellipse cx="230" cy="410" rx="150" ry="75" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5"/>
  <rect x="185" y="305" width="90" height="24" fill="#FFFFFF" stroke="#8B0000" stroke-width="1.5"/>
  <text x="230" y="323" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">CITIES</text>
  <rect x="146" y="380" width="63" height="22" fill="#FFFFFF" stroke="#666666" stroke-width="1"/>
  <circle cx="140" cy="391" r="4" fill="#111111"/>
  <text x="152" y="396" font-size="15" fill="#111111">Mumbai</text>
  <rect x="246" y="365" width="54" height="22" fill="#FFFFFF" stroke="#666666" stroke-width="1"/>
  <circle cx="240" cy="376" r="4" fill="#111111"/>
  <text x="252" y="381" font-size="15" fill="#111111">Delhi</text>
  <rect x="196" y="425" width="72" height="22" fill="#FFFFFF" stroke="#666666" stroke-width="1"/>
  <circle cx="190" cy="436" r="4" fill="#111111"/>
  <text x="202" y="441" font-size="15" fill="#111111">Chennai</text>
  <rect x="281" y="405" width="46" height="22" fill="#FFFFFF" stroke="#666666" stroke-width="1"/>
  <circle cx="275" cy="416" r="4" fill="#111111"/>
  <text x="287" y="421" font-size="15" fill="#111111">Pune</text>
  <circle cx="370" cy="250" r="5" fill="#111111"/>
  <text x="360" y="255" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">man</text>
  <circle cx="470" cy="222" r="5" fill="#111111"/>
  <text x="480" y="227" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">woman</text>
  <circle cx="370" cy="320" r="5" fill="#111111"/>
  <text x="360" y="325" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">king</text>
  <circle cx="470" cy="292" r="5" fill="#111111"/>
  <text x="480" y="297" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">queen</text>
  <line x1="375" y1="249" x2="463" y2="224" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="375" y1="319" x2="463" y2="294" stroke="#111111" stroke-width="2.5" stroke-dasharray="8 4" marker-end="url(#arrow)"/>
  <text x="420" y="276" text-anchor="middle" font-size="14" fill="#111111">same direction: a learned relationship</text>
  <text x="480" y="520" text-anchor="middle" font-size="15" fill="#111111">Real embeddings have hundreds of dimensions; this is a two-dimensional sketch.</text>
  <text x="480" y="546" text-anchor="middle" font-size="13" fill="#333333">Schematic positions, not computed from a real model.</text>
</svg>
