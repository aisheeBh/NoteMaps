<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Role and autonomy together</title>
  <desc>A grid with role on the horizontal axis, predictive, generative and agentic, and autonomy on the vertical axis, from adviser at the bottom to acting alone at the top. Example systems are placed in cells. Shading darkens towards the top right, where controls must be strongest: an agent acting alone.</desc>

  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">The more a system acts, and the more alone, the tighter the controls</text>
  <rect x="40" y="80" width="160" height="120" fill="#F2F2F2" stroke="#333333"/>
  <text x="120" y="145" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">ACTS ALONE</text>
  <rect x="200" y="80" width="240" height="120" fill="url(#hatch)" stroke="#333333" stroke-width="1.5"/>
  <rect x="218" y="118" width="204" height="44" fill="#FFFFFF" stroke="#666666" stroke-width="1"/>
  <text x="320" y="145" text-anchor="middle" font-size="15" fill="#111111">automatic fraud block</text>
  <rect x="440" y="80" width="240" height="120" fill="url(#hatch)" stroke="#333333" stroke-width="1.5"/>
  <rect x="458" y="118" width="204" height="44" fill="#FFFFFF" stroke="#666666" stroke-width="1"/>
  <text x="560" y="145" text-anchor="middle" font-size="15" fill="#111111">auto-sent replies</text>
  <rect x="680" y="80" width="240" height="120" fill="url(#lines)" stroke="#333333" stroke-width="1.5"/>
  <rect x="698" y="118" width="204" height="44" fill="#FFFFFF" stroke="#666666" stroke-width="1"/>
  <text x="800" y="145" text-anchor="middle" font-size="15" fill="#111111">agent paying invoices</text>
  <rect x="40" y="200" width="160" height="120" fill="#F2F2F2" stroke="#333333"/>
  <text x="120" y="265" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">ACTS, SUPERVISED</text>
  <rect x="200" y="200" width="240" height="120" fill="url(#dots)" stroke="#333333" stroke-width="1.5"/>
  <rect x="218" y="238" width="204" height="44" fill="#FFFFFF" stroke="#666666" stroke-width="1"/>
  <text x="320" y="265" text-anchor="middle" font-size="15" fill="#111111">credit decision, reviewed</text>
  <rect x="440" y="200" width="240" height="120" fill="url(#dots)" stroke="#333333" stroke-width="1.5"/>
  <rect x="458" y="238" width="204" height="44" fill="#FFFFFF" stroke="#666666" stroke-width="1"/>
  <text x="560" y="265" text-anchor="middle" font-size="15" fill="#111111">drafts published after check</text>
  <rect x="680" y="200" width="240" height="120" fill="url(#hatch)" stroke="#333333" stroke-width="1.5"/>
  <rect x="698" y="238" width="204" height="44" fill="#FFFFFF" stroke="#666666" stroke-width="1"/>
  <text x="800" y="265" text-anchor="middle" font-size="15" fill="#111111">agent with step approval</text>
  <rect x="40" y="320" width="160" height="120" fill="#F2F2F2" stroke="#333333"/>
  <text x="120" y="385" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">ADVISES</text>
  <rect x="200" y="320" width="240" height="120" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <rect x="218" y="358" width="204" height="44" fill="#FFFFFF" stroke="#666666" stroke-width="1"/>
  <text x="320" y="385" text-anchor="middle" font-size="15" fill="#111111">risk score for an officer</text>
  <rect x="440" y="320" width="240" height="120" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <rect x="458" y="358" width="204" height="44" fill="#FFFFFF" stroke="#666666" stroke-width="1"/>
  <text x="560" y="385" text-anchor="middle" font-size="15" fill="#111111">draft for a person to edit</text>
  <rect x="680" y="320" width="240" height="120" fill="url(#dots)" stroke="#333333" stroke-width="1.5"/>
  <rect x="698" y="358" width="204" height="44" fill="#FFFFFF" stroke="#666666" stroke-width="1"/>
  <text x="800" y="385" text-anchor="middle" font-size="15" fill="#111111">agent proposes a plan</text>
  <text x="320" y="468" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">PREDICTIVE</text>
  <text x="560" y="468" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">GENERATIVE</text>
  <text x="800" y="468" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">AGENTIC</text>
  <line x1="200" y1="488" x2="920" y2="488" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="560" y="510" text-anchor="middle" font-size="15" fill="#111111">from estimating, to creating, to doing</text>
  <text x="480" y="548" text-anchor="middle" font-size="13" fill="#333333">Illustrative placements; permissions, approvals and logging matter most towards the top right.</text>
</svg>
