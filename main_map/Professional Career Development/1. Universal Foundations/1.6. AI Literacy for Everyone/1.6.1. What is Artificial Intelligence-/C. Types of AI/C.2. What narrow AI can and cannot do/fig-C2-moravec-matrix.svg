<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Moravec's paradox as a two-by-two matrix</title>
  <desc>Rows show difficulty for people, columns difficulty for machines. Hard for people but easy for machines: chess, arithmetic, searching millions of records. Easy for people but hard for machines: walking over rubble, folding laundry, everyday common sense. Easy for both: reading a printed postcode. Hard for both: open-ended scientific discovery, long-range strategy in a novel situation.</desc>
  <defs>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">What is hard for people is not what is hard for machines</text>

  <text x="390" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">EASY FOR MACHINES</text>
  <text x="730" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">HARD FOR MACHINES</text>
  <text x="120" y="210" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">HARD FOR</text>
  <text x="120" y="232" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">PEOPLE</text>
  <text x="120" y="420" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">EASY FOR</text>
  <text x="120" y="442" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">PEOPLE</text>

  <!-- top-left: paradox side 1 -->
  <rect x="220" y="100" width="340" height="210" fill="url(#dots)" stroke="#7A5200" stroke-width="2.5" stroke-dasharray="8 4"/>
  <rect x="240" y="120" width="300" height="170" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="390" y="148" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">The paradox, side one</text>
  <text x="260" y="180" font-size="15" fill="#111111">chess and Go at world level</text>
  <text x="260" y="206" font-size="15" fill="#111111">long arithmetic, exact recall</text>
  <text x="260" y="232" font-size="15" fill="#111111">searching millions of records</text>
  <text x="260" y="258" font-size="15" fill="#111111">spotting fraud patterns</text>

  <!-- top-right -->
  <rect x="560" y="100" width="340" height="210" fill="#F2F2F2" stroke="#333333" stroke-width="1.5"/>
  <text x="730" y="148" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Hard for both</text>
  <text x="580" y="180" font-size="15" fill="#111111">open-ended scientific discovery</text>
  <text x="580" y="206" font-size="15" fill="#111111">strategy in a truly novel crisis</text>
  <text x="580" y="232" font-size="15" fill="#111111">judging what goals are worth</text>
  <text x="580" y="258" font-size="15" fill="#111111">pursuing</text>

  <!-- bottom-left -->
  <rect x="220" y="310" width="340" height="210" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="390" y="358" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Easy for both</text>
  <text x="240" y="390" font-size="15" fill="#111111">reading a printed postcode</text>
  <text x="240" y="416" font-size="15" fill="#111111">sorting emails into folders</text>
  <text x="240" y="442" font-size="15" fill="#111111">recognising a familiar face</text>

  <!-- bottom-right: paradox side 2 -->
  <rect x="560" y="310" width="340" height="210" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="580" y="330" width="300" height="170" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
  <text x="730" y="358" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">The paradox, side two</text>
  <text x="600" y="390" font-size="15" fill="#111111">walking over rubble</text>
  <text x="600" y="416" font-size="15" fill="#111111">folding laundry, tying laces</text>
  <text x="600" y="442" font-size="15" fill="#111111">everyday common sense</text>
  <text x="600" y="468" font-size="15" fill="#111111">grasping an unfamiliar object</text>

  <text x="480" y="560" text-anchor="middle" font-size="15" fill="#111111">Skills that evolution polished over millions of years feel effortless to people and are hard to engineer.</text>
  <text x="480" y="588" text-anchor="middle" font-size="13" fill="#333333">Examples are typical placements; some are shifting as methods improve.</text>
</svg>
