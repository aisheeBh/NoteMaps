<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>One artificial neuron</title>
  <desc>Two inputs, 0.8 and 0.2, are multiplied by weights 0.5 and minus 1.0, summed with a bias of 0.1 to give 0.3, and passed through an activation function. With ReLU the output is 0.3.</desc>

  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker></defs>

  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Weigh, add, activate</text>
  <circle cx="130" cy="170" r="44" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <text x="130" y="166" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">input x1</text>
  <text x="130" y="188" text-anchor="middle" font-size="16" fill="#111111">0.8</text>
  <line x1="176" y1="170" x2="402" y2="230" stroke="#1F3B5C" stroke-width="4"  marker-end="url(#arrow)"/>
  <rect x="215" y="174" width="110" height="26" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="270" y="192" text-anchor="middle" font-size="15" fill="#111111">w1 = 0.5</text>
  <circle cx="130" cy="330" r="44" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <text x="130" y="326" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">input x2</text>
  <text x="130" y="348" text-anchor="middle" font-size="16" fill="#111111">0.2</text>
  <line x1="176" y1="330" x2="402" y2="270" stroke="#1F3B5C" stroke-width="2.5" stroke-dasharray="10 6" marker-end="url(#arrow)"/>
  <rect x="215" y="298" width="110" height="26" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="270" y="316" text-anchor="middle" font-size="15" fill="#111111">w2 = -1.0</text>
  <rect x="380" y="420" width="120" height="44" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="440" y="448" text-anchor="middle" font-size="16" fill="#111111">bias b = 0.1</text>
  <line x1="440" y1="420" x2="440" y2="312" stroke="#7A5200" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="460" cy="250" r="58" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="3"/>
  <text x="460" y="242" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">SUM</text>
  <text x="460" y="266" text-anchor="middle" font-size="15" fill="#111111">0.4 - 0.2 + 0.1</text>
  <text x="535" y="340" font-size="17" font-weight="bold" fill="#111111">sum = 0.3</text>
  <line x1="518" y1="250" x2="596" y2="250" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="600" y="195" width="150" height="110" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="675" y="228" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">ACTIVATION</text>
  <path d="M625 285 L675 285 L725 240" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <text x="650" y="270" text-anchor="middle" font-size="14" fill="#FFFFFF">ReLU</text>
  <line x1="750" y1="250" x2="818" y2="250" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="822" y="215" width="110" height="70" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="877" y="244" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">OUTPUT</text>
  <text x="877" y="268" text-anchor="middle" font-size="16" fill="#111111">0.3</text>
  <text x="480" y="500" text-anchor="middle" font-size="15" fill="#111111">Training changes only the weights and the bias; the arithmetic stays the same.</text>
  <text x="480" y="528" text-anchor="middle" font-size="13" fill="#333333">Illustrative numbers.</text>
</svg>
