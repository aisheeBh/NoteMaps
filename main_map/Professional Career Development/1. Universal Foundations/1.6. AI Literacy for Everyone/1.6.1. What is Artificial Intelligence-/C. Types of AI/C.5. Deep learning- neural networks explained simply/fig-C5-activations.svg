<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Three activation functions</title>
  <desc>Three small charts of output against input. Step jumps from 0 to 1 at zero. Sigmoid rises smoothly from 0 to 1 in an S-shape. ReLU is zero for negative inputs and rises in a straight line for positive inputs.</desc>

  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">How strongly a neuron responds to its summed input</text>
  <rect x="60" y="80" width="240" height="220" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <line x1="180.0" y1="80" x2="180.0" y2="300" stroke="#AAAAAA" stroke-width="1"/>
  <line x1="60" y1="270" x2="300" y2="270" stroke="#AAAAAA" stroke-width="1"/>
  <path d="M60 270 L180.0 270 L180.0 110 L300 110" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <text x="186.0" y="290" font-size="13" fill="#333333">0</text>
  <text x="180.0" y="334" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">Step</text>
  <text x="180.0" y="358" text-anchor="middle" font-size="15" fill="#111111">on or off</text>
  <text x="180.0" y="380" text-anchor="middle" font-size="15" fill="#111111">perceptron, 1958</text>
