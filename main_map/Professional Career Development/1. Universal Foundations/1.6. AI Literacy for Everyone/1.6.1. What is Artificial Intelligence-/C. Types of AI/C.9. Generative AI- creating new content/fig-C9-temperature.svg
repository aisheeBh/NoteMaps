<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Temperature reshapes the same scores</title>
  <desc>Three groups of bars for temperatures 0.5, 1.0 and 2.0, each showing the probabilities of tea, coffee and juice. At 0.5 tea dominates at 0.87; at 1.0 tea is 0.67; at 2.0 the bars are more even, tea 0.51, coffee 0.31, juice 0.19.</desc>

  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">"I would like a cup of ..." at three temperatures</text>
  <line x1="100" y1="420" x2="900" y2="420" stroke="#E0E0E0"/>
  <text x="90" y="425" text-anchor="end" font-size="14" fill="#111111">0.00</text>
  <line x1="100" y1="340" x2="900" y2="340" stroke="#E0E0E0"/>
  <text x="90" y="345" text-anchor="end" font-size="14" fill="#111111">0.25</text>
  <line x1="100" y1="260" x2="900" y2="260" stroke="#E0E0E0"/>
  <text x="90" y="265" text-anchor="end" font-size="14" fill="#111111">0.50</text>
  <line x1="100" y1="180" x2="900" y2="180" stroke="#E0E0E0"/>
  <text x="90" y="185" text-anchor="end" font-size="14" fill="#111111">0.75</text>
  <line x1="100" y1="100" x2="900" y2="100" stroke="#E0E0E0"/>
  <text x="90" y="105" text-anchor="end" font-size="14" fill="#111111">1.00</text>
  <line x1="100" y1="420" x2="900" y2="420" stroke="#222222" stroke-width="2.5"/>
  <text x="44" y="260" text-anchor="middle" font-size="15" fill="#111111" transform="rotate(-90 44 260)">Probability of being chosen</text>
  <rect x="150" y="143" width="56" height="277" fill="url(#hatch)" stroke="#111111" stroke-width="1.5"/>
  <rect x="148" y="117" width="60" height="20" fill="#FFFFFF"/>
  <text x="178" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">0.87</text>
  <text x="178" y="440" text-anchor="middle" font-size="14" fill="#111111">tea</text>
  <rect x="216" y="382" width="56" height="38" fill="url(#dots)" stroke="#111111" stroke-width="1.5"/>
  <rect x="214" y="356" width="60" height="20" fill="#FFFFFF"/>
  <text x="244" y="371" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">0.12</text>
  <text x="244" y="440" text-anchor="middle" font-size="14" fill="#111111">coffee</text>
  <rect x="282" y="415" width="56" height="5" fill="url(#cross)" stroke="#111111" stroke-width="1.5"/>
  <rect x="280" y="389" width="60" height="20" fill="#FFFFFF"/>
  <text x="310" y="404" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">0.02</text>
  <text x="310" y="440" text-anchor="middle" font-size="14" fill="#111111">juice</text>
  <text x="244" y="468" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">T = 0.5</text>
  <rect x="410" y="207" width="56" height="213" fill="url(#hatch)" stroke="#111111" stroke-width="1.5"/>
  <rect x="408" y="181" width="60" height="20" fill="#FFFFFF"/>
  <text x="438" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">0.67</text>
  <text x="438" y="440" text-anchor="middle" font-size="14" fill="#111111">tea</text>
  <rect x="476" y="342" width="56" height="78" fill="url(#dots)" stroke="#111111" stroke-width="1.5"/>
  <rect x="474" y="316" width="60" height="20" fill="#FFFFFF"/>
  <text x="504" y="331" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">0.24</text>
  <text x="504" y="440" text-anchor="middle" font-size="14" fill="#111111">coffee</text>
  <rect x="542" y="391" width="56" height="29" fill="url(#cross)" stroke="#111111" stroke-width="1.5"/>
  <rect x="540" y="365" width="60" height="20" fill="#FFFFFF"/>
  <text x="570" y="380" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">0.09</text>
  <text x="570" y="440" text-anchor="middle" font-size="14" fill="#111111">juice</text>
  <text x="504" y="468" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">T = 1.0</text>
  <rect x="670" y="258" width="56" height="162" fill="url(#hatch)" stroke="#111111" stroke-width="1.5"/>
  <rect x="668" y="232" width="60" height="20" fill="#FFFFFF"/>
  <text x="698" y="247" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">0.51</text>
  <text x="698" y="440" text-anchor="middle" font-size="14" fill="#111111">tea</text>
  <rect x="736" y="322" width="56" height="98" fill="url(#dots)" stroke="#111111" stroke-width="1.5"/>
  <rect x="734" y="296" width="60" height="20" fill="#FFFFFF"/>
  <text x="764" y="311" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">0.31</text>
  <text x="764" y="440" text-anchor="middle" font-size="14" fill="#111111">coffee</text>
  <rect x="802" y="360" width="56" height="60" fill="url(#cross)" stroke="#111111" stroke-width="1.5"/>
  <rect x="800" y="334" width="60" height="20" fill="#FFFFFF"/>
  <text x="830" y="349" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">0.19</text>
  <text x="830" y="440" text-anchor="middle" font-size="14" fill="#111111">juice</text>
  <text x="764" y="468" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">T = 2.0</text>
  <text x="480" y="500" text-anchor="middle" font-size="13" fill="#333333">Computed from raw scores 2.0, 1.0 and 0.0; illustrative scores, not from a real model.</text>
</svg>
