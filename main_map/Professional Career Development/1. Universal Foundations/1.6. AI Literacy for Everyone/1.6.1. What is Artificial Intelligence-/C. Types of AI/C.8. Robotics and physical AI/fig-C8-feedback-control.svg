<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Proportional control of a robot joint</title>
  <desc>Joint angle against time under proportional control with gain 0.5 per second, starting at 60 degrees with a target of 90 degrees. The angle rises quickly at first and then ever more slowly as the error shrinks, approaching 90 degrees. The commanded speed falls from 15 degrees per second.</desc>

  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">The smaller the error, the gentler the correction</text>
  <line x1="110" y1="420" x2="880" y2="420" stroke="#E0E0E0"/>
  <text x="100" y="425" text-anchor="end" font-size="14" fill="#111111">50°</text>
  <line x1="110" y1="354" x2="880" y2="354" stroke="#E0E0E0"/>
  <text x="100" y="359" text-anchor="end" font-size="14" fill="#111111">60°</text>
  <line x1="110" y1="288" x2="880" y2="288" stroke="#E0E0E0"/>
  <text x="100" y="293" text-anchor="end" font-size="14" fill="#111111">70°</text>
  <line x1="110" y1="222" x2="880" y2="222" stroke="#E0E0E0"/>
  <text x="100" y="227" text-anchor="end" font-size="14" fill="#111111">80°</text>
  <line x1="110" y1="156" x2="880" y2="156" stroke="#E0E0E0"/>
  <text x="100" y="161" text-anchor="end" font-size="14" fill="#111111">90°</text>
  <line x1="110" y1="90" x2="880" y2="90" stroke="#E0E0E0"/>
  <text x="100" y="95" text-anchor="end" font-size="14" fill="#111111">100°</text>
  <text x="110" y="444" text-anchor="middle" font-size="14" fill="#111111">0 s</text>
  <text x="302" y="444" text-anchor="middle" font-size="14" fill="#111111">2 s</text>
  <text x="495" y="444" text-anchor="middle" font-size="14" fill="#111111">4 s</text>
  <text x="688" y="444" text-anchor="middle" font-size="14" fill="#111111">6 s</text>
  <text x="880" y="444" text-anchor="middle" font-size="14" fill="#111111">8 s</text>
  <line x1="110" y1="420" x2="900" y2="420" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="110" y1="420" x2="110" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="495" y="474" text-anchor="middle" font-size="16" fill="#111111">Time</text>
  <text x="50" y="255" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 50 255)">Joint angle</text>
  <line x1="110" y1="156" x2="880" y2="156" stroke="#111111" stroke-width="2.5" stroke-dasharray="10 6"/>
  <rect x="730" y="124" width="150" height="24" fill="#FFFFFF"/><text x="876" y="142" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">target 90°</text>
