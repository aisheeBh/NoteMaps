L846.3 160.3 L851.1 160.2 L855.9 160.1 L860.8 160.0 L865.6 159.9 L870.4 159.8 L875.2 159.7 L880.0 159.6" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <circle cx="110" cy="354" r="7" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="3"/>
  <rect x="122" y="364" width="202" height="24" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <text x="127" y="381" font-size="14" fill="#111111">error 30°: command 15°/s</text>
  <circle cx="302" cy="229" r="7" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="3"/>
  <rect x="314" y="239" width="210" height="24" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <text x="320" y="256" font-size="14" fill="#111111">error 11°: command 5.5°/s</text>
  <circle cx="591" cy="172" r="7" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="3"/>
  <rect x="603" y="182" width="218" height="24" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <text x="608" y="199" font-size="14" fill="#111111">error 2.5°: command 1.2°/s</text>
  <text x="480" y="500" text-anchor="middle" font-size="13" fill="#333333">Computed for command = 0.5 per second x error, starting at 60°; real joints add inertia, friction and limits.</text>
</svg>
