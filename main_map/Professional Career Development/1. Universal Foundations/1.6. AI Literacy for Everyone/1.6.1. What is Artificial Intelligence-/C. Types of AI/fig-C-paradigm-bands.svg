<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Dominant AI techniques over time</title>
  <desc>Four horizontal bands across a timeline from 1950 to 2030: symbolic AI from 1950, statistical machine learning from about 1990, deep learning from about 2012 and foundation models from about 2020. Each band is thick during its period of dominance and continues as a thinner band afterwards, showing that earlier techniques remain in use.</desc>

  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">New techniques were added; old ones stayed in use</text>
  <line x1="120" y1="80" x2="120" y2="400" stroke="#E0E0E0"/>
  <text x="120" y="424" text-anchor="middle" font-size="14" fill="#111111">1950</text>
  <line x1="218" y1="80" x2="218" y2="400" stroke="#E0E0E0"/>
  <text x="218" y="424" text-anchor="middle" font-size="14" fill="#111111">1960</text>
  <line x1="315" y1="80" x2="315" y2="400" stroke="#E0E0E0"/>
  <text x="315" y="424" text-anchor="middle" font-size="14" fill="#111111">1970</text>
  <line x1="412" y1="80" x2="412" y2="400" stroke="#E0E0E0"/>
  <text x="412" y="424" text-anchor="middle" font-size="14" fill="#111111">1980</text>
  <line x1="510" y1="80" x2="510" y2="400" stroke="#E0E0E0"/>
  <text x="510" y="424" text-anchor="middle" font-size="14" fill="#111111">1990</text>
  <line x1="608" y1="80" x2="608" y2="400" stroke="#E0E0E0"/>
  <text x="608" y="424" text-anchor="middle" font-size="14" fill="#111111">2000</text>
  <line x1="705" y1="80" x2="705" y2="400" stroke="#E0E0E0"/>
  <text x="705" y="424" text-anchor="middle" font-size="14" fill="#111111">2010</text>
  <line x1="802" y1="80" x2="802" y2="400" stroke="#E0E0E0"/>
  <text x="802" y="424" text-anchor="middle" font-size="14" fill="#111111">2020</text>
  <line x1="900" y1="80" x2="900" y2="400" stroke="#E0E0E0"/>
  <text x="900" y="424" text-anchor="middle" font-size="14" fill="#111111">2030</text>
  <rect x="120" y="100" width="390" height="50" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5"/>
  <rect x="510" y="118" width="390" height="14" fill="url(#lines)" stroke="#8B0000" stroke-width="1.5"/>
  <rect x="128" y="72" width="274" height="24" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
  <text x="136" y="89" font-size="15" font-weight="bold" fill="#111111">Symbolic: rules, logic, search</text>
  <rect x="510" y="180" width="214" height="50" fill="url(#dots)" stroke="#7A5200" stroke-width="2.5"/>
  <rect x="724" y="198" width="176" height="14" fill="url(#dots)" stroke="#7A5200" stroke-width="1.5"/>
  <rect x="518" y="152" width="257" height="24" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="526" y="169" font-size="15" font-weight="bold" fill="#111111">Statistical machine learning</text>
  <rect x="724" y="260" width="78" height="50" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
  <rect x="802" y="278" width="98" height="14" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/>
  <rect x="732" y="232" width="128" height="24" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="740" y="249" font-size="15" font-weight="bold" fill="#111111">Deep learning</text>
  <rect x="802" y="340" width="98" height="50" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="632" y="312" width="162" height="24" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/>
  <text x="640" y="329" font-size="15" font-weight="bold" fill="#111111">Foundation models</text>
  <text x="480" y="458" text-anchor="middle" font-size="15" fill="#111111">Each technique dominated research for a period and stayed in use afterwards.</text>
  <text x="480" y="500" text-anchor="middle" font-size="13" fill="#333333">Schematic; start dates are approximate and the eras overlapped.</text>
</svg>
