<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>A grid world and its learned policy</title>
  <desc>A five by four grid. The agent starts at the bottom left. The goal, worth plus 10, is at the top right. A hazard worth minus 10 lies in the middle of the top row region, and a wall blocks one cell. Each step costs minus 1. Arrows in each cell show the learned policy, which routes the agent along the bottom and right side around the hazard to the goal.</desc>

  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Each step costs 1; the goal pays 10; the hazard costs 10</text>
  <rect x="150" y="80" width="100" height="100" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <line x1="174" y1="130" x2="226" y2="130" stroke="#1F3B5C" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="250" y="80" width="100" height="100" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <line x1="274" y1="130" x2="326" y2="130" stroke="#1F3B5C" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="350" y="80" width="100" height="100" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <line x1="374" y1="130" x2="426" y2="130" stroke="#1F3B5C" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="450" y="80" width="100" height="100" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <line x1="474" y1="130" x2="526" y2="130" stroke="#1F3B5C" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="550" y="80" width="100" height="100" fill="url(#cross)" stroke="#333333" stroke-width="2"/>
  <rect x="562.0" y="108.0" width="76" height="44" fill="#FFFFFF" stroke="#1E5E24" stroke-width="2"/>
  <text x="600.0" y="127.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">GOAL</text>
  <text x="600.0" y="146.0" text-anchor="middle" font-size="15" fill="#111111">+10</text>
  <rect x="150" y="180" width="100" height="100" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <line x1="200" y1="256" x2="200" y2="204" stroke="#1F3B5C" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="250" y="180" width="100" height="100" fill="#555555" stroke="#333333" stroke-width="2"/>
  <text x="300.0" y="236.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">WALL</text>
  <rect x="350" y="180" width="100" height="100" fill="url(#lines)" stroke="#333333" stroke-width="2"/>
  <rect x="358.0" y="208.0" width="84" height="44" fill="#FFFFFF" stroke="#8B0000" stroke-width="2"/>
  <text x="400.0" y="227.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">HAZARD</text>
  <text x="400.0" y="246.0" text-anchor="middle" font-size="15" fill="#111111">-10</text>
  <rect x="450" y="180" width="100" height="100" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <line x1="500" y1="256" x2="500" y2="204" stroke="#1F3B5C" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="550" y="180" width="100" height="100" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <line x1="600" y1="256" x2="600" y2="204" stroke="#1F3B5C" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="150" y="280" width="100" height="100" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <line x1="174" y1="330" x2="226" y2="330" stroke="#1F3B5C" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="250" y="280" width="100" height="100" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <line x1="274" y1="330" x2="326" y2="330" stroke="#1F3B5C" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="350" y="280" width="100" height="100" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <line x1="374" y1="330" x2="426" y2="330" stroke="#1F3B5C" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="450" y="280" width="100" height="100" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <line x1="474" y1="330" x2="526" y2="330" stroke="#1F3B5C" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="550" y="280" width="100" height="100" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <line x1="600" y1="356" x2="600" y2="304" stroke="#1F3B5C" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="150" y="380" width="100" height="100" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <line x1="174" y1="430" x2="226" y2="430" stroke="#1F3B5C" stroke-width="4" marker-end="url(#arrow)"/>
  <circle cx="172" cy="402" r="13" fill="#1F3B5C" stroke="#000000" stroke-width="1.5"/>
  <text x="172" y="407" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">A</text>
  <rect x="250" y="380" width="100" height="100" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <line x1="274" y1="430" x2="326" y2="430" stroke="#1F3B5C" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="350" y="380" width="100" height="100" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <line x1="374" y1="430" x2="426" y2="430" stroke="#1F3B5C" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="450" y="380" width="100" height="100" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <line x1="474" y1="430" x2="526" y2="430" stroke="#1F3B5C" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="550" y="380" width="100" height="100" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <line x1="600" y1="456" x2="600" y2="404" stroke="#1F3B5C" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="150" y="510" font-size="15" fill="#111111">A = agent start. Arrows: the best action learned in each square.</text>
  <text x="150" y="534" font-size="15" fill="#111111">A shortest safe route: along the bottom row, then up the right edge: 7 steps, return 10 - 7 = +3.</text>
  <text x="150" y="558" font-size="15" fill="#111111">Early in learning, random moves often hit the hazard; experience teaches the agent to avoid it.</text>
  <text x="480" y="606" text-anchor="middle" font-size="13" fill="#333333">Illustrative environment; undiscounted return shown for simplicity.</text>
</svg>
