<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The confusion matrix and derived rates</title>
  <desc>A two-by-two grid. Columns are the actual outcome, yes or no; rows are the prediction, yes or no. The cells are true positive, false positive, false negative and true negative. To the right, formulas show true positive rate as true positives over all actual yes, false positive rate as false positives over all actual no, and positive predictive value as true positives over all predicted yes.</desc>
  <defs>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Comparing predictions with what actually happened</text>

  <text x="345" y="80" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Actual outcome</text>
  <text x="245" y="108" text-anchor="middle" font-size="16" fill="#111111">Yes</text>
  <text x="445" y="108" text-anchor="middle" font-size="16" fill="#111111">No</text>
  <text x="40" y="300" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111" transform="rotate(-90 40 300)">Prediction</text>
  <text x="105" y="210" text-anchor="middle" font-size="16" fill="#111111">Yes</text>
  <text x="105" y="400" text-anchor="middle" font-size="16" fill="#111111">No</text>

  <rect x="145" y="120" width="200" height="180" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="345" y="120" width="200" height="180" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="145" y="300" width="200" height="180" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="345" y="300" width="200" height="180" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>

  <g text-anchor="middle" fill="#111111">
    <rect x="165" y="172" width="160" height="76" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/>
    <text x="245" y="200" font-size="17" font-weight="bold">True positive</text>
    <text x="245" y="224" font-size="14">correct yes</text>
    <rect x="365" y="172" width="160" height="76" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
    <text x="445" y="200" font-size="17" font-weight="bold">False positive</text>
    <text x="445" y="224" font-size="14">wrongly flagged</text>
    <rect x="165" y="352" width="160" height="76" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
    <text x="245" y="380" font-size="17" font-weight="bold">False negative</text>
    <text x="245" y="404" font-size="14">wrongly missed</text>
    <rect x="365" y="352" width="160" height="76" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/>
    <text x="445" y="380" font-size="17" font-weight="bold">True negative</text>
    <text x="445" y="404" font-size="14">correct no</text>
  </g>

  <rect x="590" y="120" width="340" height="360" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="760" y="152" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Rates used in fairness tests</text>
  <g font-size="15" fill="#111111">
    <text x="610" y="194" font-weight="bold">True positive rate</text>
    <text x="610" y="216">TP ÷ all actual yes (column 1)</text>
    <text x="610" y="258" font-weight="bold">False positive rate</text>
    <text x="610" y="280">FP ÷ all actual no (column 2)</text>
    <text x="610" y="322" font-weight="bold">Positive predictive value</text>
    <text x="610" y="344">TP ÷ all predicted yes (row 1)</text>
    <text x="610" y="386" font-weight="bold">Selection rate</text>
    <text x="610" y="408">all predicted yes ÷ everyone</text>
    <text x="610" y="450" font-weight="bold">Base rate</text>
    <text x="610" y="472">all actual yes ÷ everyone</text>
  </g>

  <text x="480" y="530" text-anchor="middle" font-size="15" fill="#111111">Group fairness tests compute these rates separately for each group and compare them.</text>
  <text x="480" y="560" text-anchor="middle" font-size="14" fill="#111111">Error rates read down the columns; predictive value reads along the top row.</text>
</svg>
