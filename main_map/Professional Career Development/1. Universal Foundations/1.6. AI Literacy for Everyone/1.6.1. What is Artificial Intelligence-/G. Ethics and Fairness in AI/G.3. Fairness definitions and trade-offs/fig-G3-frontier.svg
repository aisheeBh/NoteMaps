<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The fairness-accuracy frontier</title>
  <desc>A curve bending from high accuracy with a large fairness gap on the left to lower accuracy with a small gap on the right. Along its first part, large reductions in the fairness gap cost little accuracy; further along, each extra gain costs more. Points below the curve are inferior models that could be improved on both counts.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Trading accuracy for fairness: cheap at first, costly later</text>

  <line x1="120" y1="460" x2="900" y2="460" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="460" x2="120" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="510" y="500" text-anchor="middle" font-size="16" fill="#111111">Fairness: smaller gap in error rates between groups</text>
  <text x="70" y="265" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 70 265)">Accuracy on historical data</text>

  <path d="M170 110 C 400 116, 560 140, 650 190 S 820 330, 860 430" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <circle cx="170" cy="110" r="9" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <circle cx="520" cy="140" r="9" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="3"/>
  <circle cx="830" cy="380" r="9" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="3"/>

  <rect x="150" y="122" width="210" height="48" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
  <text x="160" y="142" font-size="14" fill="#111111">Unconstrained model:</text>
  <text x="160" y="162" font-size="14" fill="#111111">most accurate, least fair</text>

  <rect x="290" y="186" width="230" height="48" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
  <text x="300" y="206" font-size="14" fill="#111111">Often a good compromise:</text>
  <text x="300" y="226" font-size="14" fill="#111111">much fairer, slightly less accurate</text>

  <rect x="610" y="392" width="220" height="48" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
  <text x="620" y="412" font-size="14" fill="#111111">Strict equality: each further</text>
  <text x="620" y="432" font-size="14" fill="#111111">gain costs much accuracy</text>

  <g fill="#E6E6E6" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 3">
    <circle cx="300" cy="300" r="8"/><circle cx="380" cy="350" r="8"/><circle cx="460" cy="280" r="8"/><circle cx="250" cy="390" r="8"/><circle cx="560" cy="330" r="8"/>
  </g>
  <rect x="220" y="410" width="300" height="28" fill="#FFFFFF"/>
  <text x="230" y="430" font-size="14" fill="#111111">Inferior models: improvable on both</text>
  <text x="700" y="160" font-size="15" font-weight="bold" fill="#111111">The frontier</text>

  <text x="480" y="540" text-anchor="middle" font-size="14" fill="#111111">"Accuracy" is measured against past labels; if those are biased, part of the loss is bias removed.</text>
  <text x="480" y="566" text-anchor="middle" font-size="13" fill="#333333">Schematic; the shape varies by problem and is not plotted from a single dataset.</text>
</svg>
