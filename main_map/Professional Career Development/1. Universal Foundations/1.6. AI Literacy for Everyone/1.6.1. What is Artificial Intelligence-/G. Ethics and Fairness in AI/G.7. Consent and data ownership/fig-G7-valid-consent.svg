<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The five conditions of valid consent</title>
  <desc>Five columns, one per condition: freely given, specific, informed, unambiguous and withdrawable. Each shows a test question and a typical failure. All five must hold for consent to be valid.</desc>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Valid consent needs all five conditions</text>

  <g font-size="14" fill="#111111" text-anchor="middle">
    <rect x="24" y="64" width="176" height="64" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
    <text x="112" y="102" font-size="17" font-weight="bold" fill="#FFFFFF">Freely given</text>
    <rect x="204" y="64" width="176" height="64" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
    <text x="292" y="102" font-size="17" font-weight="bold">Specific</text>
    <rect x="384" y="64" width="176" height="64" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="2.5"/>
    <text x="472" y="102" font-size="17" font-weight="bold">Informed</text>
    <rect x="564" y="64" width="176" height="64" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
    <text x="652" y="102" font-size="17" font-weight="bold">Unambiguous</text>
    <rect x="744" y="64" width="192" height="64" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
    <text x="840" y="102" font-size="17" font-weight="bold">Withdrawable</text>
  </g>

  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="112" y="162" font-weight="bold">Test</text>
    <text x="112" y="184">Can the person say</text><text x="112" y="204">no without penalty?</text>
    <text x="292" y="162" font-weight="bold">Test</text>
    <text x="292" y="184">Is each purpose</text><text x="292" y="204">agreed separately?</text>
    <text x="472" y="162" font-weight="bold">Test</text>
    <text x="472" y="184">Does the person know</text><text x="472" y="204">who, what and why?</text>
    <text x="652" y="162" font-weight="bold">Test</text>
    <text x="652" y="184">Was there a clear,</text><text x="652" y="204">positive act?</text>
    <text x="840" y="162" font-weight="bold">Test</text>
    <text x="840" y="184">Is leaving as easy</text><text x="840" y="204">as agreeing?</text>
  </g>

  <line x1="24" y1="236" x2="936" y2="236" stroke="#888888" stroke-width="1.5" stroke-dasharray="3 4"/>

  <g font-size="14" fill="#111111" text-anchor="middle">
    <rect x="24" y="256" width="176" height="150" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
    <rect x="34" y="296" width="156" height="100" fill="#FFFFFF"/>
    <text x="112" y="282" font-weight="bold">Typical failure</text>
    <text x="112" y="318">Service refused</text><text x="112" y="338">unless the person</text><text x="112" y="358">accepts unrelated</text><text x="112" y="378">uses</text>

    <rect x="204" y="256" width="176" height="150" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
    <rect x="214" y="296" width="156" height="100" fill="#FFFFFF"/>
    <text x="292" y="282" font-weight="bold">Typical failure</text>
    <text x="292" y="318">One box covering</text><text x="292" y="338">all purposes,</text><text x="292" y="358">including future</text><text x="292" y="378">ones</text>

    <rect x="384" y="256" width="176" height="150" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
    <rect x="394" y="296" width="156" height="100" fill="#FFFFFF"/>
    <text x="472" y="282" font-weight="bold">Typical failure</text>
    <text x="472" y="318">AI training</text><text x="472" y="338">buried on page</text><text x="472" y="358">nine of the</text><text x="472" y="378">terms</text>

    <rect x="564" y="256" width="176" height="150" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
    <rect x="574" y="296" width="156" height="100" fill="#FFFFFF"/>
    <text x="652" y="282" font-weight="bold">Typical failure</text>
    <text x="652" y="318">Pre-ticked box,</text><text x="652" y="338">scrolling or</text><text x="652" y="358">silence treated</text><text x="652" y="378">as agreement</text>

    <rect x="744" y="256" width="192" height="150" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
    <rect x="754" y="296" width="172" height="100" fill="#FFFFFF"/>
    <text x="840" y="282" font-weight="bold">Typical failure</text>
    <text x="840" y="318">Withdrawal needs</text><text x="840" y="338">a letter or deleting</text><text x="840" y="358">the whole account</text>
  </g>

  <rect x="24" y="436" width="912" height="62" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="2.5"/>
  <text x="480" y="464" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">If any one condition fails, the agreement is not valid consent.</text>
  <text x="480" y="486" text-anchor="middle" font-size="14" fill="#111111">Another lawful basis may still be available, but it must be chosen honestly, not as a fallback.</text>
  <text x="480" y="534" text-anchor="middle" font-size="13" fill="#333333">Conditions as set out in the General Data Protection Regulation; examples are typical, not drawn from a single case.</text>
</svg>
