<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>An acceptable average concealing unequal error rates</title>
  <desc>A bar chart of the share of photographs wrongly rejected by an automated checker. The overall bar is 6 per cent and lies under an acceptability line of 8 per cent. Separate bars for four groups range from 3 per cent for lighter-skinned men to 19 per cent for darker-skinned women, which is far above the line. Figures are illustrative.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Share of good photographs wrongly rejected</text>

  <line x1="120" y1="460" x2="900" y2="460" stroke="#222222" stroke-width="2.5"/>
  <line x1="120" y1="460" x2="120" y2="80" stroke="#222222" stroke-width="2.5"/>
  <g font-size="14" fill="#111111" text-anchor="end">
    <text x="110" y="465">0 %</text><text x="110" y="365">5 %</text><text x="110" y="265">10 %</text><text x="110" y="165">15 %</text>
  </g>
  <g stroke="#CCCCCC" stroke-width="1" stroke-dasharray="3 4">
    <line x1="120" y1="360" x2="900" y2="360"/><line x1="120" y1="260" x2="900" y2="260"/><line x1="120" y1="160" x2="900" y2="160"/>
  </g>
  <text x="50" y="270" text-anchor="middle" font-size="15" fill="#111111" transform="rotate(-90 50 270)">Wrongly rejected</text>

  <!-- acceptability line at 8% => y = 460 - 8*20 = 300 -->
  <line x1="120" y1="300" x2="900" y2="300" stroke="#222222" stroke-width="2.5" stroke-dasharray="10 6"/>
  <rect x="128" y="270" width="200" height="24" fill="#FFFFFF"/>
  <text x="132" y="288" text-anchor="start" font-size="14" font-weight="bold" fill="#111111">"Acceptable" limit: 8 %</text>

  <!-- overall 6% => height 120, y 340 -->
  <rect x="150" y="340" width="110" height="120" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <text x="205" y="330" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">6 %</text>
  <text x="205" y="484" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Overall</text>

  <line x1="290" y1="90" x2="290" y2="520" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- lighter men 3% -->
  <rect x="320" y="400" width="110" height="60" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="375" y="390" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">3 %</text>
  <text x="375" y="484" text-anchor="middle" font-size="14" fill="#111111">Lighter-skinned</text>
  <text x="375" y="502" text-anchor="middle" font-size="14" fill="#111111">men</text>

  <!-- lighter women 5% -->
  <rect x="460" y="360" width="110" height="100" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="515" y="350" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">5 %</text>
  <text x="515" y="484" text-anchor="middle" font-size="14" fill="#111111">Lighter-skinned</text>
  <text x="515" y="502" text-anchor="middle" font-size="14" fill="#111111">women</text>

  <!-- darker men 11% -->
  <rect x="600" y="240" width="110" height="220" fill="url(#lines)" stroke="#8B0000" stroke-width="2"/>
  <text x="655" y="230" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">11 %</text>
  <text x="655" y="484" text-anchor="middle" font-size="14" fill="#111111">Darker-skinned</text>
  <text x="655" y="502" text-anchor="middle" font-size="14" fill="#111111">men</text>

  <!-- darker women 19% => height 380 y 80 -->
  <rect x="740" y="80" width="110" height="380" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5"/>
  <rect x="757" y="104" width="76" height="26" fill="#FFFFFF"/>
  <text x="795" y="123" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">19 %</text>
  <text x="795" y="484" text-anchor="middle" font-size="14" fill="#111111">Darker-skinned</text>
  <text x="795" y="502" text-anchor="middle" font-size="14" fill="#111111">women</text>

  <text x="480" y="548" text-anchor="middle" font-size="14" fill="#111111">The overall rate passes the test; two groups fail it badly.</text>
  <text x="480" y="570" text-anchor="middle" font-size="13" fill="#333333">Illustrative figures, chosen to show the pattern; not the results of any single test.</text>
</svg>
