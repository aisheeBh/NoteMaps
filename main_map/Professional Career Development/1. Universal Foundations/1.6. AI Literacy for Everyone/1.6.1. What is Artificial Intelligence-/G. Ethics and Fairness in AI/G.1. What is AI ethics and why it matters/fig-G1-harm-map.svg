<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Mapping harms by severity and reach</title>
  <desc>A two-by-two grid. The horizontal axis is the number of people affected, from few to many. The vertical axis is severity for each person, from minor to grave. Examples are placed in each quadrant, and the top-right quadrant, grave harm to many, needs the strongest safeguards.</desc>
  <defs>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Severity for each person against number of people affected</text>

  <rect x="140" y="70" width="380" height="230" fill="#F2F2F2" stroke="#222222" stroke-width="2"/>
  <rect x="520" y="70" width="380" height="230" fill="url(#lines)" stroke="#222222" stroke-width="2"/>
  <rect x="140" y="300" width="380" height="230" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <rect x="520" y="300" width="380" height="230" fill="url(#dots)" stroke="#222222" stroke-width="2"/>

  <rect x="165" y="88" width="330" height="190" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
  <text x="330" y="116" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Grave, few</text>
  <text x="330" y="146" text-anchor="middle" font-size="14" fill="#111111">A wrongful arrest from a</text>
  <text x="330" y="166" text-anchor="middle" font-size="14" fill="#111111">mistaken identification</text>
  <text x="330" y="200" text-anchor="middle" font-size="14" fill="#111111">A misdiagnosis for a rare</text>
  <text x="330" y="220" text-anchor="middle" font-size="14" fill="#111111">condition in a small group</text>
  <text x="330" y="256" text-anchor="middle" font-size="14" font-style="italic" fill="#111111">Needs case-by-case redress</text>

  <rect x="545" y="88" width="330" height="190" fill="#FFFFFF" stroke="#8B0000" stroke-width="2"/>
  <text x="710" y="116" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Grave, many</text>
  <text x="710" y="146" text-anchor="middle" font-size="14" fill="#111111">A national benefits model that</text>
  <text x="710" y="166" text-anchor="middle" font-size="14" fill="#111111">wrongly accuses thousands</text>
  <text x="710" y="200" text-anchor="middle" font-size="14" fill="#111111">A grading model that caps</text>
  <text x="710" y="220" text-anchor="middle" font-size="14" fill="#111111">a whole cohort's results</text>
  <text x="710" y="256" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Strongest safeguards needed</text>

  <rect x="165" y="318" width="330" height="190" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
  <text x="330" y="346" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Minor, few</text>
  <text x="330" y="376" text-anchor="middle" font-size="14" fill="#111111">An odd film recommendation</text>
  <text x="330" y="396" text-anchor="middle" font-size="14" fill="#111111">for one household</text>
  <text x="330" y="430" text-anchor="middle" font-size="14" fill="#111111">A mistranslated menu item</text>
  <text x="330" y="486" text-anchor="middle" font-size="14" font-style="italic" fill="#111111">Ordinary quality management</text>

  <rect x="545" y="318" width="330" height="190" fill="#FFFFFF" stroke="#7A5200" stroke-width="1.5"/>
  <text x="710" y="346" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Minor, many</text>
  <text x="710" y="376" text-anchor="middle" font-size="14" fill="#111111">Voice assistants that mishear</text>
  <text x="710" y="396" text-anchor="middle" font-size="14" fill="#111111">an accent millions speak</text>
  <text x="710" y="430" text-anchor="middle" font-size="14" fill="#111111">Search images that stereotype</text>
  <text x="710" y="450" text-anchor="middle" font-size="14" fill="#111111">a profession</text>
  <text x="710" y="486" text-anchor="middle" font-size="14" font-style="italic" fill="#111111">Small harms add up</text>

  <line x1="140" y1="560" x2="910" y2="560" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="586" text-anchor="middle" font-size="16" fill="#111111">Number of people affected: few to many</text>
  <line x1="110" y1="530" x2="110" y2="70" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="80" y="300" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 80 300)">Severity for each person: minor to grave</text>
  <text x="480" y="610" text-anchor="middle" font-size="13" fill="#333333">Schematic; examples are typical cases, not plotted measurements. Reversibility also matters: an unreversed harm is graver.</text>
</svg>
