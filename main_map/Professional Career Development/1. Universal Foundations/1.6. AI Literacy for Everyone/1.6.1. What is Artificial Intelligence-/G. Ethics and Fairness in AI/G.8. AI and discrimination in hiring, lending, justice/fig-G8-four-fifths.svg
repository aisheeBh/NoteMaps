<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Selection rates and the four-fifths threshold</title>
  <desc>Two bars show shortlisting rates: Group X at 50 per cent and Group Y at 30 per cent. A dashed line marks 40 per cent, which is four-fifths of Group X's rate. Group Y's bar falls below the line, giving an impact ratio of 0.60. Figures are illustrative.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Checking a screening tool against the four-fifths rule</text>

  <line x1="120" y1="440" x2="640" y2="440" stroke="#222222" stroke-width="2.5"/>
  <line x1="120" y1="440" x2="120" y2="80" stroke="#222222" stroke-width="2.5"/>
  <g font-size="14" fill="#111111" text-anchor="end">
    <text x="112" y="444">0 %</text><text x="112" y="344">20 %</text><text x="112" y="244">40 %</text><text x="112" y="144">60 %</text>
  </g>
  <g stroke="#CCCCCC" stroke-dasharray="3 4"><line x1="120" y1="340" x2="640" y2="340"/><line x1="120" y1="140" x2="640" y2="140"/></g>
  <text x="62" y="260" text-anchor="middle" font-size="15" fill="#111111" transform="rotate(-90 62 260)">Share shortlisted</text>

  <!-- 5px per % : 50% = 250 -> y 190 ; 30% = 150 -> y 290 ; 40% line y 240 -->
  <rect x="170" y="190" width="150" height="250" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
  <text x="245" y="180" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">50 %</text>
  <text x="245" y="466" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Group X</text>
  <text x="245" y="486" text-anchor="middle" font-size="14" fill="#111111">300 of 600</text>

  <rect x="400" y="290" width="150" height="150" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="475" y="280" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">30 %</text>
  <text x="475" y="466" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Group Y</text>
  <text x="475" y="486" text-anchor="middle" font-size="14" fill="#111111">120 of 400</text>

  <line x1="120" y1="240" x2="640" y2="240" stroke="#222222" stroke-width="3" stroke-dasharray="10 6"/>
  <rect x="330" y="214" width="230" height="22" fill="#FFFFFF"/>
  <text x="335" y="231" font-size="14" font-weight="bold" fill="#111111">Four-fifths line: 40 %</text>

  <rect x="670" y="140" width="260" height="230" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="800" y="172" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Impact ratio</text>
  <text x="800" y="210" text-anchor="middle" font-size="15" fill="#111111">Group Y rate ÷ Group X rate</text>
  <text x="800" y="240" text-anchor="middle" font-size="15" fill="#111111">= 30 % ÷ 50 %</text>
  <text x="800" y="284" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">= 0.60</text>
  <text x="800" y="320" text-anchor="middle" font-size="14" fill="#111111">Below 0.80: investigate</text>
  <text x="800" y="342" text-anchor="middle" font-size="14" fill="#111111">which features drive the gap</text>

  <text x="480" y="520" text-anchor="middle" font-size="13" fill="#333333">Illustrative figures; the rule is a screening heuristic, not proof of discrimination.</text>
</svg>
