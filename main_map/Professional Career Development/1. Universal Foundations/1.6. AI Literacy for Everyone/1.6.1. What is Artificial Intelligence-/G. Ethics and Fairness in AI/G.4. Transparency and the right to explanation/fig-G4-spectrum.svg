<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>A spectrum of model transparency</title>
  <desc>A horizontal arrow runs from opaque on the left to fully interpretable on the right. Five kinds of model are placed along it: a large language model, a deep image classifier, a large ensemble of decision trees, a small decision tree, and a points-based scorecard. Beneath, a note says that the most suitable explanation method changes along the spectrum, from post-hoc and counterfactual explanations on the left to the model itself on the right.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">From black box to glass box</text>

  <line x1="60" y1="120" x2="900" y2="120" stroke="#222222" stroke-width="4" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="60" y="96" font-size="17" font-weight="bold" fill="#111111">Opaque</text>
  <text x="900" y="96" text-anchor="end" font-size="17" font-weight="bold" fill="#111111">Fully interpretable</text>

  <g font-size="14" fill="#111111" text-anchor="middle">
    <rect x="40" y="160" width="160" height="110" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
    <text x="120" y="194" fill="#FFFFFF" font-weight="bold" font-size="15">Large language</text>
    <text x="120" y="214" fill="#FFFFFF" font-weight="bold" font-size="15">model</text>
    <text x="120" y="244" fill="#FFFFFF">billions of parameters</text>

    <rect x="220" y="160" width="160" height="110" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
    <text x="300" y="194" font-weight="bold" font-size="15">Deep image</text>
    <text x="300" y="214" font-weight="bold" font-size="15">classifier</text>
    <text x="300" y="244">millions of parameters</text>

    <rect x="400" y="160" width="160" height="110" rx="8" fill="#F2F2F2" stroke="#333333" stroke-width="2"/>
    <text x="480" y="194" font-weight="bold" font-size="15">Ensemble of</text>
    <text x="480" y="214" font-weight="bold" font-size="15">many trees</text>
    <text x="480" y="244">hundreds of trees</text>

    <rect x="580" y="160" width="160" height="110" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="2" stroke-dasharray="8 4"/>
    <text x="660" y="194" font-weight="bold" font-size="15">Small decision</text>
    <text x="660" y="214" font-weight="bold" font-size="15">tree</text>
    <text x="660" y="244">a few readable rules</text>

    <rect x="760" y="160" width="160" height="110" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
    <text x="840" y="194" font-weight="bold" font-size="15">Points-based</text>
    <text x="840" y="214" font-weight="bold" font-size="15">scorecard</text>
    <text x="840" y="244">add up five scores</text>
  </g>

  <rect x="40" y="300" width="520" height="120" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="300" y="328" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Explanation must be added afterwards</text>
  <text x="300" y="354" text-anchor="middle" font-size="14" fill="#111111">feature attribution, saliency maps,</text>
  <text x="300" y="374" text-anchor="middle" font-size="14" fill="#111111">counterfactuals, example cases</text>
  <text x="300" y="400" text-anchor="middle" font-size="14" font-style="italic" fill="#111111">approximate: may not match what the model did</text>

  <rect x="580" y="300" width="340" height="120" fill="#FFFFFF" stroke="#1E5E24" stroke-width="2"/>
  <text x="750" y="328" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">The model is the explanation</text>
  <text x="750" y="354" text-anchor="middle" font-size="14" fill="#111111">rules or weights can be read</text>
  <text x="750" y="374" text-anchor="middle" font-size="14" fill="#111111">and checked directly</text>
  <text x="750" y="400" text-anchor="middle" font-size="14" font-style="italic" fill="#111111">faithful by construction</text>

  <text x="480" y="460" text-anchor="middle" font-size="14" fill="#111111">For tables of structured data, models near the right often perform about as well as those on the left.</text>
  <text x="480" y="490" text-anchor="middle" font-size="13" fill="#333333">Placement is indicative; transparency also depends on documentation and access, not only on model type.</text>
</svg>
