<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>An inverted index</title>
  <desc>Left: three short documents. Document 1, Jaguar top speed in the wild. Document 2, Jaguar car models and prices. Document 3, Cheetah top speed record. Right: an index listing each word with the documents containing it: jaguar 1 and 2; top 1 and 3; speed 1 and 3; car 2; cheetah 3. Bottom: the query jaguar top speed is answered by intersecting the lists, giving document 1 as the only document containing all three words.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" fill="#111111" font-weight="bold">Looking up words instead of reading every page</text>
  <text x="200" y="84" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Documents (crawled pages)</text>
  <rect x="40" y="100" width="320" height="74" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="200" y="132.25" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Document 1</text>
  <text x="200" y="152.25" text-anchor="middle" font-size="15" fill="#111111">Jaguar top speed in the wild</text>
  <rect x="40" y="192" width="320" height="74" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="200" y="224.25" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Document 2</text>
  <text x="200" y="244.25" text-anchor="middle" font-size="15" fill="#111111">Jaguar car models and prices</text>
  <rect x="40" y="284" width="320" height="74" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="200" y="316.25" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Document 3</text>
  <text x="200" y="336.25" text-anchor="middle" font-size="15" fill="#111111">Cheetah top speed record</text>
  <line x1="370" y1="230" x2="450" y2="230" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="410" y="214" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">index</text>
  <text x="690" y="84" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Inverted index (word → documents)</text>
  <rect x="470" y="100" width="180" height="38" rx="4" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="560" y="125" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">jaguar</text>
  <rect x="660" y="100" width="260" height="38" rx="4" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="790" y="125" text-anchor="middle" font-size="16" fill="#111111">documents 1, 2</text>
  <rect x="470" y="144" width="180" height="38" rx="4" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="560" y="169" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">top</text>
  <rect x="660" y="144" width="260" height="38" rx="4" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="790" y="169" text-anchor="middle" font-size="16" fill="#111111">documents 1, 3</text>
  <rect x="470" y="188" width="180" height="38" rx="4" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="560" y="213" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">speed</text>
  <rect x="660" y="188" width="260" height="38" rx="4" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="790" y="213" text-anchor="middle" font-size="16" fill="#111111">documents 1, 3</text>
  <rect x="470" y="232" width="180" height="38" rx="4" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="560" y="257" text-anchor="middle" font-size="16" fill="#111111">car</text>
  <rect x="660" y="232" width="260" height="38" rx="4" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="790" y="257" text-anchor="middle" font-size="16" fill="#111111">document 2</text>
  <rect x="470" y="276" width="180" height="38" rx="4" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="560" y="301" text-anchor="middle" font-size="16" fill="#111111">cheetah</text>
  <rect x="660" y="276" width="260" height="38" rx="4" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="790" y="301" text-anchor="middle" font-size="16" fill="#111111">document 3</text>
  <rect x="470" y="320" width="180" height="38" rx="4" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="560" y="345" text-anchor="middle" font-size="16" fill="#111111">record</text>
  <rect x="660" y="320" width="260" height="38" rx="4" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="790" y="345" text-anchor="middle" font-size="16" fill="#111111">document 3</text>
  <rect x="150" y="400" width="660" height="70" rx="6" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="480" y="429.95" text-anchor="middle" font-size="17" fill="#000000" font-weight="bold">Query: jaguar top speed</text>
  <text x="480" y="451.95" text-anchor="middle" font-size="17" fill="#000000">jaguar {1, 2} ∩ top {1, 3} ∩ speed {1, 3} = {1}</text>
  <rect x="330" y="490" width="300" height="50" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="480" y="520.6" text-anchor="middle" font-size="16" fill="#000000" font-weight="bold">Candidate: Document 1</text>
  <line x1="480" y1="470" x2="480" y2="488" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="566" text-anchor="middle" font-size="13" fill="#333333">Illustrative; real indexes also store word positions and counts, and partial matches are retrieved and ranked too.</text>
</svg>
