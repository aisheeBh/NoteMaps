<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Fastest route on a small network</title>
  <desc>Five junctions: Home, A, B, C and Office. Roads with travel times in minutes: Home to A 8, Home to B 5, B to A 2, A to Office 9, B to C 10, A to C 4, C to Office 3. The fastest route Home, B, A, C, Office totals 14 minutes and is drawn with thick lines. The direct-looking route Home, A, Office takes 17 minutes.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" fill="#111111" font-weight="bold">Fastest route: Home → B → A → C → Office = 14 minutes</text>
  <line x1="120" y1="280" x2="420" y2="140" stroke="#555555" stroke-width="2.5" stroke-dasharray="8 6"/>
  <circle cx="270" cy="210" r="20" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="270" y="216" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">8</text>
  <line x1="120" y1="280" x2="330" y2="420" stroke="#1F3B5C" stroke-width="8"/>
  <circle cx="225" cy="350" r="20" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="225" y="356" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">5</text>
  <line x1="330" y1="420" x2="420" y2="140" stroke="#1F3B5C" stroke-width="8"/>
  <circle cx="375" cy="280" r="20" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="375" y="286" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">2</text>
  <line x1="420" y1="140" x2="850" y2="200" stroke="#555555" stroke-width="2.5" stroke-dasharray="8 6"/>
  <circle cx="635" cy="170" r="20" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="635" y="176" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">9</text>
  <line x1="330" y1="420" x2="640" y2="330" stroke="#555555" stroke-width="2.5" stroke-dasharray="8 6"/>
  <circle cx="485" cy="375" r="20" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="485" y="381" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">10</text>
  <line x1="420" y1="140" x2="640" y2="330" stroke="#1F3B5C" stroke-width="8"/>
  <circle cx="530" cy="235" r="20" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="530" y="241" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">4</text>
  <line x1="640" y1="330" x2="850" y2="200" stroke="#1F3B5C" stroke-width="8"/>
  <circle cx="745" cy="265" r="20" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="745" y="271" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">3</text>
  <rect x="65" y="250" width="110" height="60" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="120" y="275.25" text-anchor="middle" font-size="15" fill="#FFFFFF" font-weight="bold">Home</text>
  <text x="120" y="295.25" text-anchor="middle" font-size="15" fill="#FFFFFF">0 min</text>
  <rect x="385" y="110" width="70" height="60" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="420" y="135.25" text-anchor="middle" font-size="15" fill="#000000" font-weight="bold">A</text>
  <text x="420" y="155.25" text-anchor="middle" font-size="15" fill="#000000">7 min</text>
  <rect x="295" y="390" width="70" height="60" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="330" y="415.25" text-anchor="middle" font-size="15" fill="#000000" font-weight="bold">B</text>
  <text x="330" y="435.25" text-anchor="middle" font-size="15" fill="#000000">5 min</text>
  <rect x="605" y="300" width="70" height="60" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="640" y="325.25" text-anchor="middle" font-size="15" fill="#000000" font-weight="bold">C</text>
  <text x="640" y="345.25" text-anchor="middle" font-size="15" fill="#000000">11 min</text>
  <rect x="795" y="170" width="110" height="60" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="850" y="195.25" text-anchor="middle" font-size="15" fill="#FFFFFF" font-weight="bold">Office</text>
  <text x="850" y="215.25" text-anchor="middle" font-size="15" fill="#FFFFFF">14 min</text>
  <rect x="322.8" y="469" width="314.4" height="44" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="480" y="485" text-anchor="middle" font-size="15" fill="#111111">Bold roads: fastest route (14 min).</text>
  <text x="480" y="504" text-anchor="middle" font-size="15" fill="#111111">Home → A → Office would take 17 min.</text>
  <text x="480" y="530" text-anchor="middle" font-size="13" fill="#333333">Illustrative figures; times in minutes, with the best arrival time shown at each junction.</text>
</svg>
