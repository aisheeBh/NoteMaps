<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Fraud score bands and actions</title>
  <desc>A horizontal scale of fraud risk scores from 0 to 999 is divided into five bands: approve from 0 to 600, approve and monitor from 600 to 750, step-up authentication from 750 to 900, decline from 900 to 970, and block the card above 970. Beneath, notes explain that most transactions fall in the lowest band and that the middle bands handle uncertain cases with little cost to genuine customers.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" fill="#111111" font-weight="bold">One score, five possible actions</text>
  <rect x="60.0" y="120" width="504.5" height="90" fill="#D3ECD3" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="564.5" y="120" width="126.1" height="90" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="690.6" y="120" width="126.1" height="90" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="816.8" y="120" width="58.9" height="90" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="875.6" y="120" width="24.4" height="90" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <line x1="60" y1="210" x2="60" y2="218" stroke="#222222" stroke-width="2"/>
  <text x="60" y="236" text-anchor="middle" font-size="14" fill="#111111">0</text>
  <line x1="564.505" y1="210" x2="564.505" y2="218" stroke="#222222" stroke-width="2"/>
  <text x="564.505" y="236" text-anchor="middle" font-size="14" fill="#111111">600</text>
  <line x1="690.631" y1="210" x2="690.631" y2="218" stroke="#222222" stroke-width="2"/>
  <text x="690.631" y="236" text-anchor="middle" font-size="14" fill="#111111">750</text>
  <line x1="816.757" y1="210" x2="816.757" y2="218" stroke="#222222" stroke-width="2"/>
  <text x="816.757" y="236" text-anchor="middle" font-size="14" fill="#111111">900</text>
  <line x1="875.616" y1="210" x2="875.616" y2="218" stroke="#222222" stroke-width="2"/>
  <text x="873.616" y="236" text-anchor="end" font-size="14" fill="#111111">970</text>
  <line x1="900" y1="210" x2="900" y2="218" stroke="#222222" stroke-width="2"/>
  <text x="902" y="236" text-anchor="start" font-size="14" fill="#111111">999</text>
  <text x="312.252" y="172" text-anchor="middle" font-size="18" fill="#111111" font-weight="bold">Approve</text>
  <text x="627.568" y="172" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Monitor</text>
  <rect x="718.894" y="155" width="69.6" height="24" fill="#FFFFFF"/>
  <text x="753.694" y="172" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Step-up</text>
  <rect x="815.236" y="91" width="61.9" height="22" fill="#FFFFFF"/>
  <text x="846.186" y="106" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Decline</text>
  <rect x="869.182" y="71" width="46.5" height="22" fill="#FFFFFF"/>
  <text x="892.432" y="86" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Block</text>
  <line x1="846.186" y1="112" x2="846.186" y2="120" stroke="#222222" stroke-width="1.5"/>
  <line x1="888.228" y1="92" x2="888.228" y2="120" stroke="#222222" stroke-width="1.5"/>
  <text x="480" y="266" text-anchor="middle" font-size="15" fill="#111111">Fraud risk score</text>
  <rect x="60" y="330" width="260" height="70" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="190" y="360.25" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Most transactions</text>
  <text x="190" y="380.25" text-anchor="middle" font-size="15" fill="#111111">no friction at all</text>
  <rect x="350" y="330" width="260" height="70" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="480" y="360.25" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Uncertain cases</text>
  <text x="480" y="380.25" text-anchor="middle" font-size="15" fill="#111111">a few seconds of app approval</text>
  <rect x="640" y="330" width="260" height="70" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="770" y="360.25" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Highest scores</text>
  <text x="770" y="380.25" text-anchor="middle" font-size="15" fill="#111111">refused, or card blocked</text>
  <line x1="190" y1="330" x2="312.252" y2="250" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="330" x2="753.694" y2="250" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="770" y1="330" x2="858.799" y2="250" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="480" y="440" text-anchor="middle" font-size="15" fill="#111111">The bank chooses the band edges and may move them during an attack or a busy season.</text>
  <text x="480" y="500" text-anchor="middle" font-size="13" fill="#333333">Illustrative scale and band edges; real systems differ by bank, channel and country.</text>
</svg>
