<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Daily steps and risk of death</title>
  <desc>A curve shows relative risk of death falling steeply as daily steps rise from about 2,000 to 6,000, then flattening. A shaded band marks a plateau between about 6,000 and 8,000 steps for adults aged 60 and over; a second, dashed band marks about 8,000 to 10,000 steps for younger adults. A note says that 10,000 steps was a marketing figure.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" fill="#111111" font-weight="bold">Benefit rises steeply at first, then levels off</text>
  <rect x="373.3" y="90" width="126.7" height="350" fill="url(#cross)" opacity="0.8"/>
  <rect x="500.0" y="90" width="126.7" height="350" fill="url(#dots)" opacity="0.8"/>
  <line x1="120" y1="440" x2="880" y2="440" stroke="#222222" stroke-width="2.5"/>
  <line x1="120" y1="440" x2="120" y2="80" stroke="#222222" stroke-width="2.5"/>
  <line x1="120" y1="440" x2="120" y2="446" stroke="#222222" stroke-width="2"/>
  <text x="120" y="464" text-anchor="middle" font-size="14" fill="#111111">2,000</text>
  <line x1="246.667" y1="440" x2="246.667" y2="446" stroke="#222222" stroke-width="2"/>
  <text x="246.667" y="464" text-anchor="middle" font-size="14" fill="#111111">4,000</text>
  <line x1="373.333" y1="440" x2="373.333" y2="446" stroke="#222222" stroke-width="2"/>
  <text x="373.333" y="464" text-anchor="middle" font-size="14" fill="#111111">6,000</text>
  <line x1="500" y1="440" x2="500" y2="446" stroke="#222222" stroke-width="2"/>
  <text x="500" y="464" text-anchor="middle" font-size="14" fill="#111111">8,000</text>
  <line x1="626.667" y1="440" x2="626.667" y2="446" stroke="#222222" stroke-width="2"/>
  <text x="626.667" y="464" text-anchor="middle" font-size="14" fill="#111111">10,000</text>
  <line x1="753.333" y1="440" x2="753.333" y2="446" stroke="#222222" stroke-width="2"/>
  <text x="753.333" y="464" text-anchor="middle" font-size="14" fill="#111111">12,000</text>
  <line x1="880" y1="440" x2="880" y2="446" stroke="#222222" stroke-width="2"/>
  <text x="880" y="464" text-anchor="middle" font-size="14" fill="#111111">14,000</text>
  <text x="500" y="492" text-anchor="middle" font-size="15" fill="#111111">Average daily steps</text>
  <text x="60" y="265" text-anchor="middle" font-size="15" fill="#111111" transform="rotate(-90 60 265)">Relative risk of death</text>
  <text x="110" y="138.75" text-anchor="end" font-size="14" fill="#111111">higher</text>
  <text x="110" y="379.375" text-anchor="end" font-size="14" fill="#111111">lower</text>
  <path d="M120.0 111.9 L126.3 123.5 L132.7 134.7 L139.0 145.3 L145.3 155.5 L151.7 165.2 L158.0 174.5 L164.3 183.4 L170.7 191.9 L177.0 200.0 L183.3 207.8 L189.7 215.2 L196.0 222.2 L202.3 229.0 L208.7 235.5 L215.0 241.6 L221.3 247.5 L227.7 253.2 L234.0 258.6 L240.3 263.7 L246.7 268.6 L253.0 273.3 L259.3 277.8 L265.7 282.1 L272.0 286.2 L278.3 290.1 L284.7 293.9 L291.0 297.4 L297.3 300.9 L303.7 304.1 L310.0 307.2 L316.3 310.2 L322.7 313.1 L329.0 315.8 L335.3 318.4 L341.7 320.9 L348.0 323.3 L354.3 325.5 L360.7 327.7 L367.0 329.8 L373.3 331.8 L379.7 333.7 L386.0 335.5 L392.3 337.2 L398.7 338.8 L405.0 340.4 L411.3 341.9 L417.7 343.4 L424.0 344.8 L430.3 346.1 L436.7 347.3 L443.0 348.5 L449.3 349.7 L455.7 350.8 L462.0 351.8 L468.3 352.8 L474.7 353.8 L481.0 354.7 L487.3 355.6 L493.7 356.4 L500.0 357.2 L506.3 358.0 L512.7 358.7 L519.0 359.4 L525.3 360.1 L531.7 360.7 L538.0 361.3 L544.3 361.9 L550.7 362.4 L557.0 363.0 L563.3 363.5 L569.7 364.0 L576.0 364.4 L582.3 364.9 L588.7 365.3 L595.0 365.7 L601.3 366.1 L607.7 366.4 L614.0 366.8 L620.3 367.1 L626.7 367.5 L633.0 367.8 L639.3 368.1 L645.7 368.3 L652.0 368.6 L658.3 368.9 L664.7 369.1 L671.0 369.3 L677.3 369.6 L683.7 369.8 L690.0 370.0 L696.3 370.2 L702.7 370.4 L709.0 370.5 L715.3 370.7 L721.7 370.9 L728.0 371.0 L734.3 371.2 L740.7 371.3 L747.0 371.5 L753.3 371.6 L759.7 371.7 L766.0 371.8 L772.3 371.9 L778.7 372.1 L785.0 372.2 L791.3 372.3 L797.7 372.3 L804.0 372.4 L810.3 372.5 L816.7 372.6 L823.0 372.7 L829.3 372.8 L835.7 372.8 L842.0 372.9 L848.3 373.0 L854.7 373.0 L861.0 373.1 L867.3 373.1 L873.7 373.2 L880.0 373.3" fill="none" stroke="#222222" stroke-width="3.5"/>
  <rect x="386.467" y="101" width="100.4" height="22" fill="#FFFFFF"/>
  <text x="436.667" y="116" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">plateau, 60+</text>
  <rect x="493.883" y="127" width="138.9" height="22" fill="#FFFFFF"/>
  <text x="563.333" y="142" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">plateau, under 60</text>
  <line x1="626.7" y1="90" x2="626.7" y2="440" stroke="#222222" stroke-width="2" stroke-dasharray="2 4"/>
  <rect x="684.613" y="162.5" width="137.44" height="42" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="753.333" y="177.5" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">10,000: a 1960s</text>
  <text x="753.333" y="195.5" text-anchor="middle" font-size="14" fill="#111111">marketing figure</text>
  <text x="480" y="525" text-anchor="middle" font-size="13" fill="#333333">Schematic curve summarising pooled observational studies; not plotted from a single dataset.</text>
</svg>
