  <line x1="90" y1="400" x2="90" y2="80" stroke="#222222" stroke-width="2.5"/>
  <line x1="90" y1="400" x2="90" y2="406" stroke="#222222" stroke-width="2"/>
  <text x="90" y="424" text-anchor="middle" font-size="14" fill="#111111">0 s</text>
  <line x1="225" y1="400" x2="225" y2="406" stroke="#222222" stroke-width="2"/>
  <text x="225" y="424" text-anchor="middle" font-size="14" fill="#111111">1 s</text>
  <line x1="360" y1="400" x2="360" y2="406" stroke="#222222" stroke-width="2"/>
  <text x="360" y="424" text-anchor="middle" font-size="14" fill="#111111">2 s</text>
  <line x1="495" y1="400" x2="495" y2="406" stroke="#222222" stroke-width="2"/>
  <text x="495" y="424" text-anchor="middle" font-size="14" fill="#111111">3 s</text>
  <line x1="630" y1="400" x2="630" y2="406" stroke="#222222" stroke-width="2"/>
  <text x="630" y="424" text-anchor="middle" font-size="14" fill="#111111">4 s</text>
  <line x1="765" y1="400" x2="765" y2="406" stroke="#222222" stroke-width="2"/>
  <text x="765" y="424" text-anchor="middle" font-size="14" fill="#111111">5 s</text>
  <line x1="900" y1="400" x2="900" y2="406" stroke="#222222" stroke-width="2"/>
  <text x="900" y="424" text-anchor="middle" font-size="14" fill="#111111">6 s</text>
