<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>A spectrum of pricing practices</title>
  <desc>A horizontal arrow runs from one price for everyone on the left to an individual price for each person on the right. Along it sit five practices: uniform pricing, time-based pricing, demand-based dynamic pricing, segment pricing, and personalised pricing. Below the arrow, notes say that transparency and shopper acceptance generally fall, and the use of personal data rises, towards the right.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" fill="#111111" font-weight="bold">From one price for all to a price for each person</text>
  <line x1="60" y1="150" x2="900" y2="150" stroke="#222222" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="70" y="190" width="150" height="70" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="145" y="220.25" text-anchor="middle" font-size="15" fill="#000000" font-weight="bold">Uniform</text>
  <text x="145" y="240.25" text-anchor="middle" font-size="15" fill="#000000">same price for all</text>
  <line x1="145" y1="150" x2="145" y2="190" stroke="#222222" stroke-width="2"/>
  <circle cx="145" cy="150" r="7" fill="#222222"/>
  <rect x="240" y="190" width="150" height="70" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="315" y="220.25" text-anchor="middle" font-size="15" fill="#000000" font-weight="bold">Time-based</text>
  <text x="315" y="240.25" text-anchor="middle" font-size="15" fill="#000000">off-peak fares</text>
  <line x1="315" y1="150" x2="315" y2="190" stroke="#222222" stroke-width="2"/>
  <circle cx="315" cy="150" r="7" fill="#222222"/>
  <rect x="410" y="190" width="150" height="70" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="485" y="220.25" text-anchor="middle" font-size="15" fill="#000000" font-weight="bold">Demand-based</text>
  <text x="485" y="240.25" text-anchor="middle" font-size="15" fill="#000000">surge, flights</text>
  <line x1="485" y1="150" x2="485" y2="190" stroke="#222222" stroke-width="2"/>
  <circle cx="485" cy="150" r="7" fill="#222222"/>
  <rect x="580" y="190" width="150" height="70" rx="6" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="655" y="220.25" text-anchor="middle" font-size="15" fill="#000000" font-weight="bold">Segment</text>
  <text x="655" y="240.25" text-anchor="middle" font-size="15" fill="#000000">student discounts</text>
  <line x1="655" y1="150" x2="655" y2="190" stroke="#222222" stroke-width="2"/>
  <circle cx="655" cy="150" r="7" fill="#222222"/>
  <rect x="750" y="190" width="150" height="70" rx="6" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="825" y="220.25" text-anchor="middle" font-size="15" fill="#000000" font-weight="bold">Personalised</text>
  <text x="825" y="240.25" text-anchor="middle" font-size="15" fill="#000000">price from your data</text>
  <line x1="825" y1="150" x2="825" y2="190" stroke="#222222" stroke-width="2"/>
  <circle cx="825" cy="150" r="7" fill="#222222"/>
  <text x="60" y="128" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">One price for everyone</text>
  <text x="900" y="128" text-anchor="end" font-size="15" fill="#111111" font-weight="bold">A price for each person</text>
  <text x="480" y="310" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Transparency to the shopper</text>
  <line x1="140" y1="326" x2="820" y2="326" stroke="#222222" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="130" y="331" text-anchor="end" font-size="14" fill="#111111">high</text>
  <text x="830" y="331" text-anchor="start" font-size="14" fill="#111111">low</text>
  <text x="480" y="366" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Typical shopper acceptance</text>
  <line x1="140" y1="382" x2="820" y2="382" stroke="#222222" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="130" y="387" text-anchor="end" font-size="14" fill="#111111">high</text>
  <text x="830" y="387" text-anchor="start" font-size="14" fill="#111111">low if hidden</text>
  <text x="480" y="422" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Personal data used</text>
  <line x1="140" y1="438" x2="820" y2="438" stroke="#222222" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="130" y="443" text-anchor="end" font-size="14" fill="#111111">none</text>
  <text x="830" y="443" text-anchor="start" font-size="14" fill="#111111">extensive</text>
  <text x="480" y="500" text-anchor="middle" font-size="13" fill="#333333">Schematic; acceptance and legality depend on context, disclosure and jurisdiction.</text>
</svg>
