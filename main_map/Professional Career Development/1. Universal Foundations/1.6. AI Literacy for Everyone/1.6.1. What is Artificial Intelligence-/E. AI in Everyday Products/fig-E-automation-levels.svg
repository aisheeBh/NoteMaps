<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Levels of automation in everyday AI</title>
  <desc>Five ascending steps from left to right: inform, suggest, act with confirmation, act with easy undo, and act alone. Each step has an everyday example: a likely-spam label, next-word suggestions, a Did you make this payment message, autocorrect and the junk folder, and a card blocked automatically. An arrow beneath shows that the cost of an error landing on the user rises towards the right.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" fill="#111111" font-weight="bold">From informing the user to acting alone</text>
  <rect x="40" y="330" width="166" height="90" rx="4" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="123" y="358" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Inform</text>
  <text x="123" y="384" text-anchor="middle" font-size="14" fill="#111111">"Likely spam" label;</text>
  <text x="123" y="404" text-anchor="middle" font-size="14" fill="#111111">unusual sign-in notice</text>
  <rect x="216" y="275" width="166" height="145" rx="4" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="299" y="303" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Suggest</text>
  <text x="299" y="329" text-anchor="middle" font-size="14" fill="#111111">next-word suggestions;</text>
  <text x="299" y="349" text-anchor="middle" font-size="14" fill="#111111">recommended films</text>
  <rect x="392" y="220" width="166" height="200" rx="4" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="475" y="248" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Act with</text>
  <text x="475" y="268" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">confirmation</text>
  <text x="475" y="290" text-anchor="middle" font-size="14" fill="#111111">"Did you make</text>
  <text x="475" y="310" text-anchor="middle" font-size="14" fill="#111111">this payment?"</text>
  <rect x="568" y="165" width="166" height="255" rx="4" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="651" y="193" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Act, easy undo</text>
  <text x="651" y="219" text-anchor="middle" font-size="14" fill="#111111">autocorrect;</text>
  <text x="651" y="239" text-anchor="middle" font-size="14" fill="#111111">junk folder</text>
  <rect x="744" y="110" width="166" height="310" rx="4" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="827" y="138" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Act alone</text>
  <text x="827" y="164" text-anchor="middle" font-size="14" fill="#111111">card blocked;</text>
  <text x="827" y="184" text-anchor="middle" font-size="14" fill="#111111">message auto-sent</text>
  <line x1="60" y1="460" x2="900" y2="460" stroke="#222222" stroke-width="3.5" marker-end="url(#arrow)"/>
  <text x="60" y="488" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">Human stays in charge</text>
  <text x="900" y="488" text-anchor="end" font-size="15" fill="#111111" font-weight="bold">Errors land directly on the user</text>
  <text x="480" y="535" text-anchor="middle" font-size="13" fill="#333333">Schematic; the same product may use different levels for different decisions.</text>
</svg>
