<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 636" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Layers of the AI value chain and the new work each creates</title>
  <desc>Six stacked layers from bottom infrastructure to top governance. Physical infrastructure: data-centre technicians, electricians, cooling engineers. Data: annotators, raters, moderators, expert trainers. Models: machine-learning engineers, researchers, MLOps engineers. Applications: AI product managers, solutions architects, conversation designers. Use in organisations: automation specialists and augmented existing roles. Governance: responsible-AI leads, auditors, red teamers, chief AI officers.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" font-size="22" text-anchor="middle" fill="#111111" font-weight="bold">New work at every layer of the AI value chain</text>
  <rect x="40" y="70" width="270" height="72" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2"/>
  <rect x="52" y="88" width="246" height="36" fill="#FFFFFF" stroke="none"/>
  <text x="175" y="111" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Governance</text>
  <rect x="310" y="70" width="610" height="72" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="330" y="102" font-size="15" text-anchor="start" fill="#111111">Responsible-AI leads, AI risk officers, model auditors, red teamers,</text>
  <text x="330" y="120" font-size="15" text-anchor="start" fill="#111111">chief AI officers</text>
  <rect x="40" y="156" width="270" height="72" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
  <rect x="52" y="174" width="246" height="36" fill="#FFFFFF" stroke="none"/>
  <text x="175" y="197" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Use in organisations</text>
  <rect x="310" y="156" width="610" height="72" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="330" y="197" font-size="15" text-anchor="start" fill="#111111">Automation specialists; the far larger mass of augmented existing roles</text>
  <rect x="40" y="242" width="270" height="72" rx="0" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
  <rect x="52" y="260" width="246" height="36" fill="#FFFFFF" stroke="none"/>
  <text x="175" y="283" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Applications</text>
  <rect x="310" y="242" width="610" height="72" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="330" y="274" font-size="15" text-anchor="start" fill="#111111">AI product managers, solutions architects, forward-deployed engineers,</text>
  <text x="330" y="292" font-size="15" text-anchor="start" fill="#111111">conversation designers</text>
  <rect x="40" y="328" width="270" height="72" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="52" y="346" width="246" height="36" fill="#FFFFFF" stroke="none"/>
  <text x="175" y="369" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Models</text>
  <rect x="310" y="328" width="610" height="72" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="330" y="369" font-size="15" text-anchor="start" fill="#111111">Machine-learning engineers, AI researchers, MLOps engineers, evaluators</text>
  <rect x="40" y="414" width="270" height="72" rx="0" fill="#F2F2F2" stroke="#333333" stroke-width="2"/>
  <rect x="52" y="432" width="246" height="36" fill="#FFFFFF" stroke="none"/>
  <text x="175" y="455" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Data</text>
  <rect x="310" y="414" width="610" height="72" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="330" y="455" font-size="15" text-anchor="start" fill="#111111">Annotators, human-feedback raters, content moderators, expert trainers</text>
  <rect x="40" y="500" width="270" height="72" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <rect x="52" y="518" width="246" height="36" fill="#FFFFFF" stroke="none"/>
  <text x="175" y="541" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Physical infrastructure</text>
  <rect x="310" y="500" width="610" height="72" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="330" y="532" font-size="15" text-anchor="start" fill="#111111">Data-centre technicians, electricians, cooling and grid engineers,</text>
  <text x="330" y="550" font-size="15" text-anchor="start" fill="#111111">construction trades</text>
  <text x="480" y="620" font-size="13" text-anchor="middle" fill="#333333">Layers run from physical infrastructure (bottom) to governance (top).</text>
</svg>
