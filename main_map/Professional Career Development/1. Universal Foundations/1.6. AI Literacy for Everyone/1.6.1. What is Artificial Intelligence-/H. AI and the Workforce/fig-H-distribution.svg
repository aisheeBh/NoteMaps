<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>How AI's gains and losses may be distributed</title>
  <desc>Two columns. Who may gain: less experienced workers using AI to spread expert know-how, workers in durable and care roles as demand shifts, high-skill workers who complement AI, owners of AI capital, advanced economies with infrastructure. Who may lose: entry-level workers in exposed digital tasks, clerical and routine writing workers, outsourcing hubs, workers without access to training, labour as a share of income if AI substitutes for labour.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" font-size="22" text-anchor="middle" fill="#111111" font-weight="bold">Possible winners and losers</text>
  <rect x="30" y="70" width="440" height="48" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="38" y="78" width="424" height="32" fill="#FFFFFF" stroke="none"/>
  <text x="250" y="99" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Who may gain</text>
  <rect x="30" y="134" width="440" height="33" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="42" y="156" font-size="15" text-anchor="start" fill="#111111">Less experienced workers whose output rises with AI</text>
  <rect x="30" y="177" width="440" height="33" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="42" y="199" font-size="15" text-anchor="start" fill="#111111">Workers in care, trades and other durable roles</text>
  <rect x="30" y="220" width="440" height="33" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="42" y="242" font-size="15" text-anchor="start" fill="#111111">High-skill workers who complement AI</text>
  <rect x="30" y="263" width="440" height="33" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="42" y="285" font-size="15" text-anchor="start" fill="#111111">Owners of AI capital</text>
  <rect x="30" y="306" width="440" height="33" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="42" y="328" font-size="15" text-anchor="start" fill="#111111">Economies with infrastructure and skills</text>
  <rect x="490" y="70" width="440" height="48" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5"/>
  <rect x="498" y="78" width="424" height="32" fill="#FFFFFF" stroke="none"/>
  <text x="710" y="99" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Who may lose</text>
  <rect x="490" y="134" width="440" height="33" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="502" y="156" font-size="15" text-anchor="start" fill="#111111">Entry-level workers in codified digital tasks</text>
  <rect x="490" y="177" width="440" height="33" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="502" y="199" font-size="15" text-anchor="start" fill="#111111">Clerical and routine writing workers</text>
  <rect x="490" y="220" width="440" height="33" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="502" y="242" font-size="15" text-anchor="start" fill="#111111">Outsourcing hubs for back-office work</text>
  <rect x="490" y="263" width="440" height="33" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="502" y="285" font-size="15" text-anchor="start" fill="#111111">Workers without access to training</text>
  <rect x="490" y="306" width="440" height="52" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="502" y="328" font-size="15" text-anchor="start" fill="#111111">Labour's share of income, if AI substitutes for</text>
  <text x="502" y="347" font-size="15" text-anchor="start" fill="#111111">labour</text>
  <text x="480" y="464" font-size="13" text-anchor="middle" fill="#333333">Possibilities, not predictions; outcomes depend on adoption and policy.</text>
</svg>
