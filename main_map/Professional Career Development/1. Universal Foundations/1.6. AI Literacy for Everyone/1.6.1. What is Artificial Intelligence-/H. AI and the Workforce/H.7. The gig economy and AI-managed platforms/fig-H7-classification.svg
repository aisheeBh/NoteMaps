<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 464" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Legal approaches to classifying platform workers</title>
  <desc>Four bands from least to most protection. Independent contractor with minimal rules. California Proposition 22: contractor with limited guaranteed benefits. UK worker status: minimum wage and paid holiday. Employment, including the EU presumption of employment where facts show direction and control.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" font-size="22" text-anchor="middle" fill="#111111" font-weight="bold">From contractor to employee: approaches to platform work</text>
  <rect x="40" y="70" width="290" height="72" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <rect x="52" y="88" width="266" height="36" fill="#FFFFFF" stroke="none"/>
  <text x="185" y="111" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Contractor, minimal rules</text>
  <rect x="330" y="70" width="590" height="72" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="350" y="111" font-size="15" text-anchor="start" fill="#111111">No minimum pay, leave or pension; worker bears all costs and risk.</text>
  <rect x="40" y="156" width="290" height="72" rx="0" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
  <rect x="52" y="174" width="266" height="36" fill="#FFFFFF" stroke="none"/>
  <text x="185" y="188" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Contractor with limited</text>
  <text x="185" y="206" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">benefits</text>
  <rect x="330" y="156" width="590" height="72" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="350" y="188" font-size="15" text-anchor="start" fill="#111111">California Proposition 22: contractor status with an earnings</text>
  <text x="350" y="206" font-size="15" text-anchor="start" fill="#111111">guarantee and healthcare stipend.</text>
  <rect x="40" y="242" width="290" height="72" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="52" y="260" width="266" height="36" fill="#FFFFFF" stroke="none"/>
  <text x="185" y="283" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Intermediate status</text>
  <rect x="330" y="242" width="590" height="72" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="350" y="274" font-size="15" text-anchor="start" fill="#111111">UK worker status after Uber v Aslam (2021): minimum wage and paid</text>
  <text x="350" y="292" font-size="15" text-anchor="start" fill="#111111">holiday, fewer rights than employees.</text>
  <rect x="40" y="328" width="290" height="72" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
  <rect x="52" y="346" width="266" height="36" fill="#FFFFFF" stroke="none"/>
  <text x="185" y="369" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Presumption of employment</text>
  <rect x="330" y="328" width="590" height="72" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="350" y="360" font-size="15" text-anchor="start" fill="#111111">Spain Rider Law (2021) and EU directive (2024): assumed employee where</text>
  <text x="350" y="378" font-size="15" text-anchor="start" fill="#111111">facts show direction and control.</text>
  <text x="480" y="448" font-size="13" text-anchor="middle" fill="#333333">Simplified; national rules differ in detail.</text>
</svg>
