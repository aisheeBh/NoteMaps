<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Degree of algorithmic control over work</title>
  <desc>A horizontal spectrum from advisory tools to full algorithmic management. Advisory: writing suggestions. Directed: warehouse pick-rate prompts. Evaluated: call-centre tone scoring. Allocating work and pay: ride-hailing dispatch and pricing. Full management: automated deactivation of platform workers.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" font-size="22" text-anchor="middle" fill="#111111" font-weight="bold">How much of the manager's role has been handed to software</text>
  <text x="80" y="80" font-size="16" text-anchor="start" fill="#111111" font-weight="bold">Advisory tool</text>
  <text x="880" y="80" font-size="16" text-anchor="end" fill="#111111" font-weight="bold">Full algorithmic management</text>
  <line x1="90" y1="96" x2="870" y2="96" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="80" y="194" width="800" height="32" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <line x1="128" y1="194" x2="128" y2="180" stroke="#333333" stroke-width="1.5"/>
  <rect x="43" y="132" width="170" height="48" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="128" y="152" font-size="15" text-anchor="middle" fill="#111111">Writing suggestions</text>
  <text x="128" y="171" font-size="15" text-anchor="middle" fill="#111111">in an office tool</text>
  <circle cx="128" cy="210" r="7" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="304" y1="226" x2="304" y2="240" stroke="#333333" stroke-width="1.5"/>
  <rect x="219" y="240" width="170" height="48" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="304" y="260" font-size="15" text-anchor="middle" fill="#111111">Warehouse pick-rate</text>
  <text x="304" y="279" font-size="15" text-anchor="middle" fill="#111111">prompts</text>
  <circle cx="304" cy="210" r="7" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="480" y1="194" x2="480" y2="180" stroke="#333333" stroke-width="1.5"/>
  <rect x="395" y="132" width="170" height="48" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="480" y="152" font-size="15" text-anchor="middle" fill="#111111">Call-centre tone</text>
  <text x="480" y="171" font-size="15" text-anchor="middle" fill="#111111">scoring</text>
  <circle cx="480" cy="210" r="7" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="656" y1="226" x2="656" y2="240" stroke="#333333" stroke-width="1.5"/>
  <rect x="571" y="240" width="170" height="67" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="656" y="260" font-size="15" text-anchor="middle" fill="#111111">Dispatch and</text>
  <text x="656" y="279" font-size="15" text-anchor="middle" fill="#111111">pricing of</text>
  <text x="656" y="298" font-size="15" text-anchor="middle" fill="#111111">ride-hailing</text>
  <circle cx="656" cy="210" r="7" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="832" y1="194" x2="832" y2="180" stroke="#333333" stroke-width="1.5"/>
  <rect x="747" y="132" width="170" height="48" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="832" y="152" font-size="15" text-anchor="middle" fill="#111111">Automated</text>
  <text x="832" y="171" font-size="15" text-anchor="middle" fill="#111111">deactivation</text>
  <circle cx="832" cy="210" r="7" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
  <text x="480" y="404" font-size="13" text-anchor="middle" fill="#333333">Schematic ordering; real systems combine several levels.</text>
</svg>
