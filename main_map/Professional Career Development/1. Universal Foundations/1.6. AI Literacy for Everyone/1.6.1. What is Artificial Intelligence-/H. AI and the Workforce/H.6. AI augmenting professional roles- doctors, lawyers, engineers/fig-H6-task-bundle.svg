<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>How AI support is distributed across professional tasks</title>
  <desc>Six task types in two groups. Where AI is strong: perceiving (reading scans, documents, drawings), analysing (comparing with rules and precedent), drafting (notes, contracts, reports). Where the professional leads: deciding under uncertainty, communicating and persuading, taking responsibility by signing and certifying.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" font-size="22" text-anchor="middle" fill="#111111" font-weight="bold">Where AI helps and where the professional leads</text>
  <rect x="30" y="70" width="133" height="68" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="38" y="88" width="117" height="32" fill="#FFFFFF" stroke="none"/>
  <text x="97" y="109" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Perceiving</text>
  <rect x="30" y="154" width="133" height="90" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="42" y="176" font-size="15" text-anchor="start" fill="#111111">Scans,</text>
  <text x="42" y="195" font-size="15" text-anchor="start" fill="#111111">documents,</text>
  <text x="42" y="214" font-size="15" text-anchor="start" fill="#111111">drawings,</text>
  <text x="42" y="233" font-size="15" text-anchor="start" fill="#111111">data</text>
  <rect x="30" y="254" width="133" height="33" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="42" y="276" font-size="15" text-anchor="start" fill="#111111">AI: strong</text>
  <rect x="183" y="70" width="133" height="68" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="191" y="88" width="117" height="32" fill="#FFFFFF" stroke="none"/>
  <text x="250" y="109" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Analysing</text>
  <rect x="183" y="154" width="133" height="71" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="195" y="176" font-size="15" text-anchor="start" fill="#111111">Comparison</text>
  <text x="195" y="195" font-size="15" text-anchor="start" fill="#111111">with rules</text>
  <text x="195" y="214" font-size="15" text-anchor="start" fill="#111111">and precedent</text>
  <rect x="183" y="235" width="133" height="52" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="195" y="257" font-size="15" text-anchor="start" fill="#111111">AI: strong,</text>
  <text x="195" y="276" font-size="15" text-anchor="start" fill="#111111">with checking</text>
  <rect x="337" y="70" width="133" height="68" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
  <rect x="345" y="88" width="117" height="32" fill="#FFFFFF" stroke="none"/>
  <text x="403" y="109" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Drafting</text>
  <rect x="337" y="154" width="133" height="71" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="349" y="176" font-size="15" text-anchor="start" fill="#111111">Notes,</text>
  <text x="349" y="195" font-size="15" text-anchor="start" fill="#111111">contracts,</text>
  <text x="349" y="214" font-size="15" text-anchor="start" fill="#111111">specifications</text>
  <rect x="337" y="235" width="133" height="52" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="349" y="257" font-size="15" text-anchor="start" fill="#111111">AI: strong,</text>
  <text x="349" y="276" font-size="15" text-anchor="start" fill="#111111">with checking</text>
  <rect x="490" y="70" width="133" height="68" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5"/>
  <rect x="498" y="88" width="117" height="32" fill="#FFFFFF" stroke="none"/>
  <text x="557" y="109" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Deciding</text>
  <rect x="490" y="154" width="133" height="71" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="502" y="176" font-size="15" text-anchor="start" fill="#111111">Choosing</text>
  <text x="502" y="195" font-size="15" text-anchor="start" fill="#111111">under</text>
  <text x="502" y="214" font-size="15" text-anchor="start" fill="#111111">uncertainty</text>
  <rect x="490" y="235" width="133" height="52" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="502" y="257" font-size="15" text-anchor="start" fill="#111111">Professional</text>
  <text x="502" y="276" font-size="15" text-anchor="start" fill="#111111">leads</text>
  <rect x="643" y="70" width="133" height="68" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5"/>
  <rect x="651" y="88" width="117" height="32" fill="#FFFFFF" stroke="none"/>
  <text x="710" y="109" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Advising</text>
  <rect x="643" y="154" width="133" height="71" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="655" y="176" font-size="15" text-anchor="start" fill="#111111">Explaining,</text>
  <text x="655" y="195" font-size="15" text-anchor="start" fill="#111111">comforting,</text>
  <text x="655" y="214" font-size="15" text-anchor="start" fill="#111111">negotiating</text>
  <rect x="643" y="235" width="133" height="52" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="655" y="257" font-size="15" text-anchor="start" fill="#111111">Professional</text>
  <text x="655" y="276" font-size="15" text-anchor="start" fill="#111111">leads</text>
  <rect x="797" y="70" width="133" height="68" rx="0" fill="#1F3B5C" stroke="#000000" stroke-width="2.5"/>
  <rect x="805" y="78" width="117" height="52" fill="#FFFFFF" stroke="none"/>
  <text x="863" y="99" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Taking</text>
  <text x="863" y="119" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">responsibility</text>
  <rect x="797" y="154" width="133" height="71" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="809" y="176" font-size="15" text-anchor="start" fill="#111111">Signing,</text>
  <text x="809" y="195" font-size="15" text-anchor="start" fill="#111111">certifying,</text>
  <text x="809" y="214" font-size="15" text-anchor="start" fill="#111111">consenting</text>
  <rect x="797" y="235" width="133" height="52" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="809" y="257" font-size="15" text-anchor="start" fill="#111111">Professional</text>
  <text x="809" y="276" font-size="15" text-anchor="start" fill="#111111">only</text>
  <text x="480" y="364" font-size="13" text-anchor="middle" fill="#333333">Schematic; the balance varies by profession and task.</text>
</svg>
