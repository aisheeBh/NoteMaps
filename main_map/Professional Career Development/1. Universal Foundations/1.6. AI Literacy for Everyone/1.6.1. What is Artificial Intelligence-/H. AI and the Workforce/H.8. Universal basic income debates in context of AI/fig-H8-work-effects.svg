<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Reported work effects in three cash experiments</title>
  <desc>Three columns. Finland 2017-2018: about 2,000 unemployed adults, 560 euros a month for two years; small positive employment effect, wellbeing improved. Alaska Permanent Fund Dividend: no effect on overall employment, more part-time work. OpenResearch 2024: about 3,000 low-income adults, 1,000 dollars a month for three years; about 1.3 fewer working hours per week and employment 2 percentage points lower.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" font-size="22" text-anchor="middle" fill="#111111" font-weight="bold">What the experiments found on work</text>
  <rect x="30" y="70" width="287" height="48" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
  <rect x="38" y="78" width="271" height="32" fill="#FFFFFF" stroke="none"/>
  <text x="173" y="99" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Finland (2017-2018)</text>
  <rect x="30" y="134" width="287" height="33" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="42" y="156" font-size="15" text-anchor="start" fill="#111111">About 2,000 unemployed adults</text>
  <rect x="30" y="177" width="287" height="33" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="42" y="199" font-size="15" text-anchor="start" fill="#111111">EUR 560 a month for two years</text>
  <rect x="30" y="220" width="287" height="33" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="42" y="242" font-size="15" text-anchor="start" fill="#111111">Work: small positive effect</text>
  <rect x="30" y="263" width="287" height="33" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="42" y="285" font-size="15" text-anchor="start" fill="#111111">Wellbeing: improved</text>
  <rect x="337" y="70" width="287" height="48" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="345" y="78" width="271" height="32" fill="#FFFFFF" stroke="none"/>
  <text x="480" y="99" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Alaska dividend (since 1982)</text>
  <rect x="337" y="134" width="287" height="33" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="349" y="156" font-size="15" text-anchor="start" fill="#111111">All residents; annual payment</text>
  <rect x="337" y="177" width="287" height="33" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="349" y="199" font-size="15" text-anchor="start" fill="#111111">Not enough to live on</text>
  <rect x="337" y="220" width="287" height="52" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="349" y="242" font-size="15" text-anchor="start" fill="#111111">Work: no effect on total</text>
  <text x="349" y="261" font-size="15" text-anchor="start" fill="#111111">employment</text>
  <rect x="337" y="282" width="287" height="33" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="349" y="304" font-size="15" text-anchor="start" fill="#111111">More part-time work</text>
  <rect x="643" y="70" width="287" height="48" rx="0" fill="url(#dots)" stroke="#7A5200" stroke-width="2.5"/>
  <rect x="651" y="78" width="271" height="32" fill="#FFFFFF" stroke="none"/>
  <text x="787" y="99" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">OpenResearch (2024)</text>
  <rect x="643" y="134" width="287" height="33" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="655" y="156" font-size="15" text-anchor="start" fill="#111111">About 3,000 low-income adults</text>
  <rect x="643" y="177" width="287" height="33" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="655" y="199" font-size="15" text-anchor="start" fill="#111111">US$1,000 a month for three years</text>
  <rect x="643" y="220" width="287" height="52" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="655" y="242" font-size="15" text-anchor="start" fill="#111111">Work: about 1.3 fewer hours a</text>
  <text x="655" y="261" font-size="15" text-anchor="start" fill="#111111">week</text>
  <rect x="643" y="282" width="287" height="33" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="655" y="304" font-size="15" text-anchor="start" fill="#111111">Employment about 2 points lower</text>
  <text x="480" y="404" font-size="13" text-anchor="middle" fill="#333333">Summaries of published results; designs, populations and payment sizes differ, so effects are not directly comparable.</text>
</svg>
