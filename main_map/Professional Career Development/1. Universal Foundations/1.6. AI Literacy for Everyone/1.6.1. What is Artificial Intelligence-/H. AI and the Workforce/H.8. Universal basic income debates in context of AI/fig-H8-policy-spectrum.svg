<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Policy responses to AI-driven displacement by dependence on work</title>
  <desc>A horizontal spectrum from responses tied to work to responses independent of work. Retraining and wage insurance, earned income credits, job guarantee, stronger unemployment insurance, universal basic services, negative income tax, universal basic income.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" font-size="22" text-anchor="middle" fill="#111111" font-weight="bold">Income-support responses, from work-linked to work-independent</text>
  <text x="80" y="80" font-size="16" text-anchor="start" fill="#111111" font-weight="bold">Tied to work</text>
  <text x="880" y="80" font-size="16" text-anchor="end" fill="#111111" font-weight="bold">Independent of work</text>
  <line x1="90" y1="96" x2="870" y2="96" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="80" y="194" width="800" height="32" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <line x1="120" y1="194" x2="120" y2="180" stroke="#333333" stroke-width="1.5"/>
  <rect x="40" y="132" width="160" height="48" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="120" y="152" font-size="15" text-anchor="middle" fill="#111111">Retraining and</text>
  <text x="120" y="171" font-size="15" text-anchor="middle" fill="#111111">wage insurance</text>
  <circle cx="120" cy="210" r="7" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="240" y1="226" x2="240" y2="240" stroke="#333333" stroke-width="1.5"/>
  <rect x="160" y="240" width="160" height="48" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="240" y="260" font-size="15" text-anchor="middle" fill="#111111">Earned income tax</text>
  <text x="240" y="279" font-size="15" text-anchor="middle" fill="#111111">credit</text>
  <circle cx="240" cy="210" r="7" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="368" y1="194" x2="368" y2="180" stroke="#333333" stroke-width="1.5"/>
  <rect x="288" y="151" width="160" height="29" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="368" y="171" font-size="15" text-anchor="middle" fill="#111111">Job guarantee</text>
  <circle cx="368" cy="210" r="7" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="480" y1="226" x2="480" y2="240" stroke="#333333" stroke-width="1.5"/>
  <rect x="400" y="240" width="160" height="67" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="480" y="260" font-size="15" text-anchor="middle" fill="#111111">Stronger</text>
  <text x="480" y="279" font-size="15" text-anchor="middle" fill="#111111">unemployment</text>
  <text x="480" y="298" font-size="15" text-anchor="middle" fill="#111111">insurance</text>
  <circle cx="480" cy="210" r="7" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="608" y1="194" x2="608" y2="180" stroke="#333333" stroke-width="1.5"/>
  <rect x="528" y="132" width="160" height="48" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="608" y="152" font-size="15" text-anchor="middle" fill="#111111">Universal basic</text>
  <text x="608" y="171" font-size="15" text-anchor="middle" fill="#111111">services</text>
  <circle cx="608" cy="210" r="7" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="736" y1="226" x2="736" y2="240" stroke="#333333" stroke-width="1.5"/>
  <rect x="656" y="240" width="160" height="48" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="736" y="260" font-size="15" text-anchor="middle" fill="#111111">Negative income</text>
  <text x="736" y="279" font-size="15" text-anchor="middle" fill="#111111">tax</text>
  <circle cx="736" cy="210" r="7" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="840" y1="194" x2="840" y2="180" stroke="#333333" stroke-width="1.5"/>
  <rect x="760" y="132" width="160" height="48" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="840" y="152" font-size="15" text-anchor="middle" fill="#111111">Universal basic</text>
  <text x="840" y="171" font-size="15" text-anchor="middle" fill="#111111">income</text>
  <circle cx="840" cy="210" r="7" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
  <text x="480" y="404" font-size="13" text-anchor="middle" fill="#333333">Schematic ordering; real schemes mix features.</text>
</svg>
