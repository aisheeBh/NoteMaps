<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Task shift in a plant as automation advances</title>
  <desc>Two columns: tasks that shrink with automation (manual handling, routine assembly, manual inspection, line tending) and tasks that grow (maintenance and troubleshooting, robot programming, data analysis, quality engineering, supervising several machines).</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" font-size="22" text-anchor="middle" fill="#111111" font-weight="bold">How tasks shift in a manufacturing plant</text>
  <rect x="30" y="70" width="440" height="48" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5"/>
  <rect x="38" y="78" width="424" height="32" fill="#FFFFFF" stroke="none"/>
  <text x="250" y="99" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Tasks that shrink</text>
  <rect x="30" y="134" width="440" height="33" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="42" y="156" font-size="15" text-anchor="start" fill="#111111">Manual handling and carrying</text>
  <rect x="30" y="177" width="440" height="33" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="42" y="199" font-size="15" text-anchor="start" fill="#111111">Routine assembly</text>
  <rect x="30" y="220" width="440" height="33" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="42" y="242" font-size="15" text-anchor="start" fill="#111111">Manual inspection</text>
  <rect x="30" y="263" width="440" height="33" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="42" y="285" font-size="15" text-anchor="start" fill="#111111">Tending a single machine</text>
  <rect x="490" y="70" width="440" height="48" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="498" y="78" width="424" height="32" fill="#FFFFFF" stroke="none"/>
  <text x="710" y="99" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Tasks that grow</text>
  <rect x="490" y="134" width="440" height="33" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="502" y="156" font-size="15" text-anchor="start" fill="#111111">Maintenance and troubleshooting</text>
  <rect x="490" y="177" width="440" height="33" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="502" y="199" font-size="15" text-anchor="start" fill="#111111">Robot and cell programming</text>
  <rect x="490" y="220" width="440" height="33" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="502" y="242" font-size="15" text-anchor="start" fill="#111111">Data analysis and process tuning</text>
  <rect x="490" y="263" width="440" height="33" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="502" y="285" font-size="15" text-anchor="start" fill="#111111">Quality engineering</text>
  <rect x="490" y="306" width="440" height="33" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="502" y="328" font-size="15" text-anchor="start" fill="#111111">Supervising several machines</text>
  <text x="480" y="404" font-size="13" text-anchor="middle" fill="#333333">Schematic; the balance varies by product and plant.</text>
</svg>
