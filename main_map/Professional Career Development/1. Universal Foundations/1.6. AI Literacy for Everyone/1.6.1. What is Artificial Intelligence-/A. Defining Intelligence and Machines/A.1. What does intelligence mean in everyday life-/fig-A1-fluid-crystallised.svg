<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Fluid and crystallised abilities across the lifespan</title>
  <desc>Schematic curves. Fluid reasoning rises to a peak in early adulthood and then declines slowly; crystallised knowledge keeps rising into middle age and declines only late in life.</desc>
