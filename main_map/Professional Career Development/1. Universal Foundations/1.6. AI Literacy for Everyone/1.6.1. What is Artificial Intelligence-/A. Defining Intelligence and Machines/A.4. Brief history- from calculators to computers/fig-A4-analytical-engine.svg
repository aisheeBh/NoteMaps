<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The Analytical Engine and the modern computer</title>
  <desc>Four parts of Babbage's design mapped to modern equivalents: punched cards to program and input, the store to memory, the mill to the processor, the printer and plotter to output. Arrows show cards feeding the mill, the mill exchanging numbers with the store, and results going to the printer.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Babbage's design (1834 onwards) and its modern equivalents</text>
  <text x="250" y="92" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Analytical Engine</text>
  <text x="720" y="92" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Modern computer</text>
  <rect x="100" y="115" width="300" height="76" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="108" y="123" width="284" height="60" fill="#FFFFFF"/>
  <text x="250.0" y="148.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Punched cards</text>
  <text x="250.0" y="168.2" text-anchor="middle" font-size="15" fill="#111111">operations and numbers</text>
  <rect x="570" y="115" width="300" height="76" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="720.0" y="148.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Program and input</text>
  <text x="720.0" y="168.2" text-anchor="middle" font-size="15" fill="#111111">software, keyboard, files</text>
  <line x1="410" y1="153" x2="560" y2="153" stroke="#222222" stroke-width="2" stroke-dasharray="10 6" marker-end="url(#arrow)"/>
  <text x="485" y="145" text-anchor="middle" font-size="14" fill="#111111">becomes</text>
  <rect x="100" y="215" width="300" height="76" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="108" y="223" width="284" height="60" fill="#FFFFFF"/>
  <text x="250.0" y="248.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">The store</text>
  <text x="250.0" y="268.2" text-anchor="middle" font-size="15" fill="#111111">about 1,000 large numbers</text>
  <rect x="570" y="215" width="300" height="76" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="720.0" y="248.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Memory</text>
  <text x="720.0" y="268.2" text-anchor="middle" font-size="15" fill="#111111">RAM and storage</text>
  <line x1="410" y1="253" x2="560" y2="253" stroke="#222222" stroke-width="2" stroke-dasharray="10 6" marker-end="url(#arrow)"/>
  <text x="485" y="245" text-anchor="middle" font-size="14" fill="#111111">becomes</text>
  <rect x="100" y="315" width="300" height="76" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="108" y="323" width="284" height="60" fill="#FFFFFF"/>
  <text x="250.0" y="348.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">The mill</text>
  <text x="250.0" y="368.2" text-anchor="middle" font-size="15" fill="#111111">arithmetic and comparison</text>
  <rect x="570" y="315" width="300" height="76" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="720.0" y="348.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Processor</text>
  <text x="720.0" y="368.2" text-anchor="middle" font-size="15" fill="#111111">CPU, executing instructions</text>
  <line x1="410" y1="353" x2="560" y2="353" stroke="#222222" stroke-width="2" stroke-dasharray="10 6" marker-end="url(#arrow)"/>
  <text x="485" y="345" text-anchor="middle" font-size="14" fill="#111111">becomes</text>
  <rect x="100" y="415" width="300" height="76" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="108" y="423" width="284" height="60" fill="#FFFFFF"/>
  <text x="250.0" y="448.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Printer and plotter</text>
  <text x="250.0" y="468.2" text-anchor="middle" font-size="15" fill="#111111">results on paper</text>
  <rect x="570" y="415" width="300" height="76" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="720.0" y="448.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Output</text>
  <text x="720.0" y="468.2" text-anchor="middle" font-size="15" fill="#111111">screen, printer, network</text>
  <line x1="410" y1="453" x2="560" y2="453" stroke="#222222" stroke-width="2" stroke-dasharray="10 6" marker-end="url(#arrow)"/>
  <text x="485" y="445" text-anchor="middle" font-size="14" fill="#111111">becomes</text>
  <text x="480" y="545" text-anchor="middle" font-size="13" fill="#333333">Store capacity is Babbage's planned figure; the engine was never completed.</text>
</svg>
