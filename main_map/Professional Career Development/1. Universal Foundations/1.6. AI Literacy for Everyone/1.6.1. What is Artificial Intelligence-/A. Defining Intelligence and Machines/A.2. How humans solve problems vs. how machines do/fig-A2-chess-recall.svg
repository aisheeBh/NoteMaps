<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Recall of chess positions by masters and novices</title>
  <desc>Schematic bar chart. With positions from real games, masters recall far more pieces than novices. With randomly placed pieces, the difference largely disappears.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Expertise is stored patterns, not a better memory</text>
  <line x1="140" y1="430" x2="860" y2="430" stroke="#222222" stroke-width="2.5"/>
  <line x1="140" y1="430" x2="140" y2="100" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="80" y="280" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 80 280)">Pieces recalled correctly</text>
  <rect x="220" y="175.0" width="100" height="255.0" fill="#1F3B5C" stroke="#000000" stroke-width="2.5"/>
  <text x="270" y="165.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Master</text>
  <rect x="350" y="364.0" width="100" height="66.0" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="400" y="354.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Novice</text>
  <text x="335" y="460" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Positions from real games</text>
  <rect x="560" y="370.0" width="100" height="60.0" fill="#1F3B5C" stroke="#000000" stroke-width="2.5"/>
  <text x="610" y="360.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Master</text>
  <rect x="690" y="379.0" width="100" height="51.0" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="740" y="369.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Novice</text>
  <text x="675" y="460" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Randomly placed pieces</text>
  <rect x="640" y="90" width="280" height="70" rx="6" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="780.0" y="120.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Advantage vanishes</text>
  <text x="780.0" y="140.2" text-anchor="middle" font-size="15" fill="#111111">when patterns are absent</text>
  <text x="480" y="526" text-anchor="middle" font-size="13" fill="#333333">Schematic of the pattern reported by Chase and Simon (1973); bar heights are illustrative, not the published values.</text>
</svg>
