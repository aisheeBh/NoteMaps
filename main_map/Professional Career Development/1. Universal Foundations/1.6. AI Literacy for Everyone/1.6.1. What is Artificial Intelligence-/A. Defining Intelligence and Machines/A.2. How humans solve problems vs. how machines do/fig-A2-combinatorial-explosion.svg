<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The combinatorial explosion</title>
  <desc>Bar chart on a logarithmic scale of the number of possible orders for visiting n stops, n factorial, from 5 stops (120) to 20 stops (about 2.4 times ten to the eighteen).</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Possible orders of visiting n stops (n!)</text>
  <line x1="150" y1="440" x2="900" y2="440" stroke="#222222" stroke-width="2.5"/>
  <line x1="150" y1="440" x2="150" y2="90" stroke="#222222" stroke-width="2.5"/>
  <line x1="144" y1="440.0" x2="150" y2="440.0" stroke="#222222" stroke-width="2"/>
  <line x1="150" y1="440.0" x2="900" y2="440.0" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="140" y="445.0" text-anchor="end" font-size="14" fill="#111111">1</text>
  <line x1="144" y1="384.7" x2="150" y2="384.7" stroke="#222222" stroke-width="2"/>
  <line x1="150" y1="384.7" x2="900" y2="384.7" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="140" y="389.7" text-anchor="end" font-size="14" fill="#111111">thousand</text>
  <line x1="144" y1="329.5" x2="150" y2="329.5" stroke="#222222" stroke-width="2"/>
  <line x1="150" y1="329.5" x2="900" y2="329.5" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="140" y="334.5" text-anchor="end" font-size="14" fill="#111111">million</text>
  <line x1="144" y1="274.2" x2="150" y2="274.2" stroke="#222222" stroke-width="2"/>
  <line x1="150" y1="274.2" x2="900" y2="274.2" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="140" y="279.2" text-anchor="end" font-size="14" fill="#111111">billion</text>
  <line x1="144" y1="218.9" x2="150" y2="218.9" stroke="#222222" stroke-width="2"/>
  <line x1="150" y1="218.9" x2="900" y2="218.9" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="140" y="223.9" text-anchor="end" font-size="14" fill="#111111">trillion</text>
  <line x1="144" y1="163.7" x2="150" y2="163.7" stroke="#222222" stroke-width="2"/>
  <line x1="150" y1="163.7" x2="900" y2="163.7" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="140" y="168.7" text-anchor="end" font-size="14" fill="#111111">10¹⁵</text>
  <line x1="144" y1="108.4" x2="150" y2="108.4" stroke="#222222" stroke-width="2"/>
  <line x1="150" y1="108.4" x2="900" y2="108.4" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="140" y="113.4" text-anchor="end" font-size="14" fill="#111111">10¹⁸</text>
  <rect x="190" y="401.7" width="80" height="38.3" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="230.0" y="464" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">5 stops</text>
  <rect x="178" y="367.7" width="104" height="24" fill="#FFFFFF"/>
  <text x="230.0" y="385.7" text-anchor="middle" font-size="14" fill="#111111">120</text>
  <rect x="290" y="355.2" width="80" height="84.8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="330.0" y="464" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">8 stops</text>
  <rect x="278" y="321.2" width="104" height="24" fill="#FFFFFF"/>
  <text x="330.0" y="339.2" text-anchor="middle" font-size="14" fill="#111111">40,320</text>
  <rect x="390" y="319.2" width="80" height="120.8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="430.0" y="464" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">10 stops</text>
  <rect x="378" y="285.2" width="104" height="24" fill="#FFFFFF"/>
  <text x="430.0" y="303.2" text-anchor="middle" font-size="14" fill="#111111">3,628,800</text>
  <rect x="490" y="280.1" width="80" height="159.9" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="530.0" y="464" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">12 stops</text>
  <rect x="478" y="246.1" width="104" height="24" fill="#FFFFFF"/>
  <text x="530.0" y="264.1" text-anchor="middle" font-size="14" fill="#111111">4.8×10⁸</text>
  <rect x="590" y="216.8" width="80" height="223.2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="630.0" y="464" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">15 stops</text>
  <rect x="578" y="182.8" width="104" height="24" fill="#FFFFFF"/>
  <text x="630.0" y="200.8" text-anchor="middle" font-size="14" fill="#111111">1.3×10¹²</text>
  <rect x="690" y="148.8" width="80" height="291.2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="730.0" y="464" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">18 stops</text>
  <rect x="678" y="114.8" width="104" height="24" fill="#FFFFFF"/>
  <text x="730.0" y="132.8" text-anchor="middle" font-size="14" fill="#111111">6.4×10¹⁵</text>
  <rect x="790" y="101.3" width="80" height="338.7" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="830.0" y="464" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">20 stops</text>
  <rect x="778" y="67.3" width="104" height="24" fill="#FFFFFF"/>
  <text x="830.0" y="85.3" text-anchor="middle" font-size="14" fill="#111111">2.4×10¹⁸</text>
  <text x="520" y="492" text-anchor="middle" font-size="15" fill="#111111">Each added stop multiplies the possibilities; each gridline is a thousand times the one below</text>
  <text x="480" y="526" text-anchor="middle" font-size="13" fill="#333333">Values are exact factorials; the vertical axis is logarithmic.</text>
</svg>
