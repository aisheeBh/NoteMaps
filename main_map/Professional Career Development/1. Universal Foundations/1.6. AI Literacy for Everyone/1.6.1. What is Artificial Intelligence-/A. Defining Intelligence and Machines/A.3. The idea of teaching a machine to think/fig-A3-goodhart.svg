  <rect x="560" y="90" width="250" height="50" rx="6" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1.5"/>
  <text x="685.0" y="110.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Measured score</text>
  <text x="685.0" y="130.2" text-anchor="middle" font-size="15" fill="#111111">e.g. clicks, approval</text>
  <line x1="700" y1="140" x2="696.0" y2="172.0" stroke="#1F3B5C" stroke-width="1.5"/>
  <rect x="170" y="180" width="220" height="50" rx="6" fill="#FFFFFF" stroke="#7A5200" stroke-width="1.5"/>
  <text x="280.0" y="200.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Real goal</text>
  <text x="280.0" y="220.2" text-anchor="middle" font-size="15" fill="#111111">e.g. useful service</text>
  <line x1="300" y1="230" x2="336.0" y2="330.4" stroke="#7A5200" stroke-width="1.5"/>
  <line x1="444.0" y1="440" x2="444.0" y2="150" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/>
  <rect x="354.0" y="392" width="180" height="32" rx="6" fill="#FFFFFF" stroke="#666666" stroke-width="1"/>
  <text x="444.0" y="412.9" text-anchor="middle" font-size="14" fill="#111111">gaming begins</text>
  <text x="480" y="526" text-anchor="middle" font-size="13" fill="#333333">Schematic; not plotted from a single dataset.</text>
</svg>
