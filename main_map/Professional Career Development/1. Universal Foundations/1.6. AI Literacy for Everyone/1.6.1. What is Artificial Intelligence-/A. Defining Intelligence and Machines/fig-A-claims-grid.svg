<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Generality and mind as separate questions</title>
  <desc>A two-by-two grid. Horizontal: narrow to general competence. Vertical: without a mind (weak AI claim) to with a mind (strong AI claim). Bottom left: narrow tools such as spam filters and chess engines. Bottom right: broad, capable systems with no mind, the working assumption for today's general assistants. Top left: a narrow system with experiences, possible on some theories, no known examples. Top right: general intelligence with a mind, the science-fiction picture, entirely hypothetical.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">How general is it? Does it have a mind?</text>
  <rect x="200" y="90" width="350" height="200" rx="6" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="375.0" y="175.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Narrow, with a mind</text>
  <text x="375.0" y="195.2" text-anchor="middle" font-size="15" fill="#111111">possible on some theories;</text>
  <text x="375.0" y="215.2" text-anchor="middle" font-size="15" fill="#111111">no known example</text>
  <rect x="570" y="90" width="350" height="200" rx="6" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="745.0" y="175.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">General, with a mind</text>
  <text x="745.0" y="195.2" text-anchor="middle" font-size="15" fill="#111111">the science-fiction picture;</text>
  <text x="745.0" y="215.2" text-anchor="middle" font-size="15" fill="#111111">entirely hypothetical</text>
  <rect x="200" y="310" width="350" height="200" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="208" y="318" width="334" height="184" fill="#FFFFFF"/>
  <text x="375.0" y="395.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Narrow, without a mind</text>
  <text x="375.0" y="415.2" text-anchor="middle" font-size="15" fill="#111111">spam filters, chess engines,</text>
  <text x="375.0" y="435.2" text-anchor="middle" font-size="15" fill="#111111">fraud scores</text>
  <rect x="570" y="310" width="350" height="200" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="745.0" y="395.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Broad, without a mind</text>
  <text x="745.0" y="415.2" text-anchor="middle" font-size="15" fill="#FFFFFF">the working assumption for</text>
  <text x="745.0" y="435.2" text-anchor="middle" font-size="15" fill="#FFFFFF">today's general assistants</text>
  <line x1="180" y1="510" x2="180" y2="80" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="150" y="300" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111" transform="rotate(-90 150 300)">Weak AI claim → strong AI claim</text>
  <line x1="200" y1="530" x2="930" y2="530" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="560" y="556" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Narrow competence → general competence</text>
  <text x="480" y="588" text-anchor="middle" font-size="13" fill="#333333">Placements of real systems reflect mainstream scientific opinion; the upper row has no accepted examples.</text>
</svg>
