<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The last mile of reliability</title>
  <desc>Schematic bar chart of the relative effort to reach successive reliability levels: 90 per cent requires modest effort, 99 per cent several times more, 99.9 per cent many times more, and 99.99 per cent more still.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Each extra 'nine' of reliability costs more</text>
  <line x1="120" y1="440" x2="880" y2="440" stroke="#222222" stroke-width="2.5"/>
  <rect x="170" y="416.0" width="120" height="24.0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="230" y="466" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">90 %</text>
  <text x="230" y="486" text-anchor="middle" font-size="14" fill="#111111">1 in 10 fails</text>
  <rect x="350" y="365.0" width="120" height="75.0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="410" y="466" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">99 %</text>
  <text x="410" y="486" text-anchor="middle" font-size="14" fill="#111111">1 in 100 fails</text>
  <rect x="530" y="275.0" width="120" height="165.0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="590" y="466" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">99.9 %</text>
  <text x="590" y="486" text-anchor="middle" font-size="14" fill="#111111">1 in 1,000 fails</text>
  <rect x="710" y="155.0" width="120" height="285.0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="770" y="466" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">99.99 %</text>
  <text x="770" y="486" text-anchor="middle" font-size="14" fill="#111111">1 in 10,000 fails</text>
  <text x="80" y="290" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 80 290)">Relative effort and cost</text>
  <rect x="160" y="100" width="260" height="70" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="290.0" y="130.4" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Prototype territory</text>
  <text x="290.0" y="149.4" text-anchor="middle" font-size="14" fill="#111111">fast early progress</text>
  <rect x="560" y="70" width="300" height="56" rx="6" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="710.0" y="93.4" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Production territory</text>
  <text x="710.0" y="112.4" text-anchor="middle" font-size="14" fill="#111111">data, testing, human review</text>
  <text x="480" y="526" text-anchor="middle" font-size="13" fill="#333333">Schematic; not plotted from a single dataset. The shape is typical of engineering for high reliability.</text>
</svg>
