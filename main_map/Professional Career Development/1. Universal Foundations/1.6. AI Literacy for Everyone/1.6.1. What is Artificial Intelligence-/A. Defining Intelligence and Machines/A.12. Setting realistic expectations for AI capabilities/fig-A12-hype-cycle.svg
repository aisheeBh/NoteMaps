  <text x="763.0" y="147.8" text-anchor="middle" font-size="14" fill="#111111">Plateau of</text>
  <text x="763.0" y="166.8" text-anchor="middle" font-size="14" fill="#111111">productivity</text>
  <text x="480" y="526" text-anchor="middle" font-size="13" fill="#333333">Schematic of a model popularised by Gartner; many technologies do not follow this path.</text>
</svg>
