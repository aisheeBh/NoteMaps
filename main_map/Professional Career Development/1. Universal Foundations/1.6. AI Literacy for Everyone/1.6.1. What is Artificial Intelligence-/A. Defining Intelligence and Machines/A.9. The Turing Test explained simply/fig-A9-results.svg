<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Results of the 2025 three-party Turing Test</title>
  <desc>Bar chart of the percentage of games in which each AI witness was judged to be the human: GPT-4.5 with persona prompt 73 per cent; LLaMa-3.1-405B with persona prompt 56 per cent; ELIZA 23 per cent; GPT-4o with minimal prompt 21 per cent. Reference lines at 50 per cent, indistinguishable from chance, and 30 per cent, Turing's 1950 benchmark.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">How often each AI was judged to be the human (%)</text>
  <line x1="130" y1="450" x2="900" y2="450" stroke="#222222" stroke-width="2.5"/>
  <line x1="130" y1="450" x2="130" y2="90" stroke="#222222" stroke-width="2.5"/>
  <text x="120" y="455.0" text-anchor="end" font-size="14" fill="#111111">0</text>
  <line x1="124" y1="450.0" x2="130" y2="450.0" stroke="#222222" stroke-width="2"/>
  <text x="120" y="365.0" text-anchor="end" font-size="14" fill="#111111">25</text>
  <line x1="124" y1="360.0" x2="130" y2="360.0" stroke="#222222" stroke-width="2"/>
  <text x="120" y="275.0" text-anchor="end" font-size="14" fill="#111111">50</text>
  <line x1="124" y1="270.0" x2="130" y2="270.0" stroke="#222222" stroke-width="2"/>
  <text x="120" y="185.0" text-anchor="end" font-size="14" fill="#111111">75</text>
  <line x1="124" y1="180.0" x2="130" y2="180.0" stroke="#222222" stroke-width="2"/>
  <text x="120" y="95.0" text-anchor="end" font-size="14" fill="#111111">100</text>
  <line x1="124" y1="90.0" x2="130" y2="90.0" stroke="#222222" stroke-width="2"/>
  <rect x="190" y="187.2" width="110" height="262.8" fill="#1F3B5C" stroke="#000000" stroke-width="2.5"/>
  <rect x="215" y="155.2" width="60" height="26" fill="#FFFFFF"/>
  <text x="245" y="175.2" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">73</text>
  <text x="245" y="474" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">GPT-4.5</text>
  <text x="245" y="494" text-anchor="middle" font-size="14" fill="#111111">with persona</text>
  <rect x="365" y="248.4" width="110" height="201.6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="390" y="216.4" width="60" height="26" fill="#FFFFFF"/>
  <text x="420" y="236.4" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">56</text>
  <text x="420" y="474" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">LLaMa-3.1-405B</text>
  <text x="420" y="494" text-anchor="middle" font-size="14" fill="#111111">with persona</text>
  <rect x="540" y="367.2" width="110" height="82.8" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="565" y="335.2" width="60" height="26" fill="#FFFFFF"/>
  <text x="595" y="355.2" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">23</text>
  <text x="595" y="474" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">ELIZA</text>
  <text x="595" y="494" text-anchor="middle" font-size="14" fill="#111111">1966 program</text>
  <rect x="715" y="374.4" width="110" height="75.6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="740" y="342.4" width="60" height="26" fill="#FFFFFF"/>
  <text x="770" y="362.4" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">21</text>
  <text x="770" y="474" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">GPT-4o</text>
  <text x="770" y="494" text-anchor="middle" font-size="14" fill="#111111">minimal prompt</text>
  <line x1="130" y1="270.0" x2="900" y2="270.0" stroke="#222222" stroke-width="2" stroke-dasharray="10 6"/>
  <rect x="742" y="244.0" width="156" height="22" fill="#FFFFFF"/>
  <text x="896" y="261.0" text-anchor="end" font-size="14" font-weight="bold" fill="#111111">50: chance level</text>
  <line x1="130" y1="342.0" x2="900" y2="342.0" stroke="#222222" stroke-width="2" stroke-dasharray="2 4"/>
  <rect x="702" y="316.0" width="196" height="22" fill="#FFFFFF"/>
  <text x="896" y="333.0" text-anchor="end" font-size="14" font-weight="bold" fill="#111111">30: Turing's benchmark</text>
  <text x="480" y="545" text-anchor="middle" font-size="13" fill="#333333">Data reported by Jones and Bergen (2025), University of California, San Diego; five-minute games.</text>
</svg>
