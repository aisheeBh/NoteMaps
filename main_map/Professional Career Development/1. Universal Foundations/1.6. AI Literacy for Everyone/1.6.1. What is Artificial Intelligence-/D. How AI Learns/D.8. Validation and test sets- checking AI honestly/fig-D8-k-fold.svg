<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Five-fold cross-validation</title>
  <desc>The data is divided into five equal folds. In each of five rounds a different fold is held back for checking while the other four are used for training. The five scores are averaged.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" font-size="22" font-weight="bold" fill="#111111" text-anchor="middle">Five-fold cross-validation: every example is checked once</text>
  <text x="40" y="114" font-size="16" font-weight="bold" fill="#111111">Round 1</text>
  <rect x="150" y="80" width="118" height="52" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="164" y="94" width="90" height="24" fill="#FFFFFF"/>
  <text x="209" y="112" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">Check</text>
  <rect x="274" y="80" width="118" height="52" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/>
  <rect x="288" y="94" width="90" height="24" fill="#FFFFFF"/>
  <text x="333" y="112" font-size="15" fill="#111111" text-anchor="middle">Train</text>
  <rect x="398" y="80" width="118" height="52" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/>
  <rect x="412" y="94" width="90" height="24" fill="#FFFFFF"/>
  <text x="457" y="112" font-size="15" fill="#111111" text-anchor="middle">Train</text>
  <rect x="522" y="80" width="118" height="52" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/>
  <rect x="536" y="94" width="90" height="24" fill="#FFFFFF"/>
  <text x="581" y="112" font-size="15" fill="#111111" text-anchor="middle">Train</text>
  <rect x="646" y="80" width="118" height="52" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/>
  <rect x="660" y="94" width="90" height="24" fill="#FFFFFF"/>
  <text x="705" y="112" font-size="15" fill="#111111" text-anchor="middle">Train</text>
  <line x1="772" y1="106" x2="806" y2="106" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="816" y="112" font-size="16" fill="#111111">Score 84%</text>
  <text x="40" y="186" font-size="16" font-weight="bold" fill="#111111">Round 2</text>
  <rect x="150" y="152" width="118" height="52" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/>
  <rect x="164" y="166" width="90" height="24" fill="#FFFFFF"/>
  <text x="209" y="184" font-size="15" fill="#111111" text-anchor="middle">Train</text>
  <rect x="274" y="152" width="118" height="52" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="288" y="166" width="90" height="24" fill="#FFFFFF"/>
  <text x="333" y="184" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">Check</text>
  <rect x="398" y="152" width="118" height="52" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/>
  <rect x="412" y="166" width="90" height="24" fill="#FFFFFF"/>
  <text x="457" y="184" font-size="15" fill="#111111" text-anchor="middle">Train</text>
  <rect x="522" y="152" width="118" height="52" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/>
  <rect x="536" y="166" width="90" height="24" fill="#FFFFFF"/>
  <text x="581" y="184" font-size="15" fill="#111111" text-anchor="middle">Train</text>
  <rect x="646" y="152" width="118" height="52" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/>
  <rect x="660" y="166" width="90" height="24" fill="#FFFFFF"/>
  <text x="705" y="184" font-size="15" fill="#111111" text-anchor="middle">Train</text>
  <line x1="772" y1="178" x2="806" y2="178" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="816" y="184" font-size="16" fill="#111111">Score 86%</text>
  <text x="40" y="258" font-size="16" font-weight="bold" fill="#111111">Round 3</text>
  <rect x="150" y="224" width="118" height="52" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/>
  <rect x="164" y="238" width="90" height="24" fill="#FFFFFF"/>
  <text x="209" y="256" font-size="15" fill="#111111" text-anchor="middle">Train</text>
  <rect x="274" y="224" width="118" height="52" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/>
  <rect x="288" y="238" width="90" height="24" fill="#FFFFFF"/>
  <text x="333" y="256" font-size="15" fill="#111111" text-anchor="middle">Train</text>
  <rect x="398" y="224" width="118" height="52" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="412" y="238" width="90" height="24" fill="#FFFFFF"/>
  <text x="457" y="256" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">Check</text>
  <rect x="522" y="224" width="118" height="52" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/>
  <rect x="536" y="238" width="90" height="24" fill="#FFFFFF"/>
  <text x="581" y="256" font-size="15" fill="#111111" text-anchor="middle">Train</text>
  <rect x="646" y="224" width="118" height="52" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/>
  <rect x="660" y="238" width="90" height="24" fill="#FFFFFF"/>
  <text x="705" y="256" font-size="15" fill="#111111" text-anchor="middle">Train</text>
  <line x1="772" y1="250" x2="806" y2="250" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="816" y="256" font-size="16" fill="#111111">Score 83%</text>
  <text x="40" y="330" font-size="16" font-weight="bold" fill="#111111">Round 4</text>
  <rect x="150" y="296" width="118" height="52" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/>
  <rect x="164" y="310" width="90" height="24" fill="#FFFFFF"/>
  <text x="209" y="328" font-size="15" fill="#111111" text-anchor="middle">Train</text>
  <rect x="274" y="296" width="118" height="52" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/>
  <rect x="288" y="310" width="90" height="24" fill="#FFFFFF"/>
  <text x="333" y="328" font-size="15" fill="#111111" text-anchor="middle">Train</text>
  <rect x="398" y="296" width="118" height="52" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/>
  <rect x="412" y="310" width="90" height="24" fill="#FFFFFF"/>
  <text x="457" y="328" font-size="15" fill="#111111" text-anchor="middle">Train</text>
  <rect x="522" y="296" width="118" height="52" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="536" y="310" width="90" height="24" fill="#FFFFFF"/>
  <text x="581" y="328" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">Check</text>
  <rect x="646" y="296" width="118" height="52" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/>
  <rect x="660" y="310" width="90" height="24" fill="#FFFFFF"/>
  <text x="705" y="328" font-size="15" fill="#111111" text-anchor="middle">Train</text>
  <line x1="772" y1="322" x2="806" y2="322" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="816" y="328" font-size="16" fill="#111111">Score 87%</text>
  <text x="40" y="402" font-size="16" font-weight="bold" fill="#111111">Round 5</text>
  <rect x="150" y="368" width="118" height="52" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/>
  <rect x="164" y="382" width="90" height="24" fill="#FFFFFF"/>
  <text x="209" y="400" font-size="15" fill="#111111" text-anchor="middle">Train</text>
  <rect x="274" y="368" width="118" height="52" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/>
  <rect x="288" y="382" width="90" height="24" fill="#FFFFFF"/>
  <text x="333" y="400" font-size="15" fill="#111111" text-anchor="middle">Train</text>
  <rect x="398" y="368" width="118" height="52" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/>
  <rect x="412" y="382" width="90" height="24" fill="#FFFFFF"/>
  <text x="457" y="400" font-size="15" fill="#111111" text-anchor="middle">Train</text>
  <rect x="522" y="368" width="118" height="52" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/>
  <rect x="536" y="382" width="90" height="24" fill="#FFFFFF"/>
  <text x="581" y="400" font-size="15" fill="#111111" text-anchor="middle">Train</text>
  <rect x="646" y="368" width="118" height="52" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="660" y="382" width="90" height="24" fill="#FFFFFF"/>
  <text x="705" y="400" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">Check</text>
  <line x1="772" y1="394" x2="806" y2="394" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="816" y="400" font-size="16" fill="#111111">Score 85%</text>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="209" y="72">Fold 1</text><text x="333" y="72">Fold 2</text><text x="457" y="72">Fold 3</text><text x="581" y="72">Fold 4</text><text x="705" y="72">Fold 5</text>
  </g>
  <rect x="560" y="448" width="370" height="54" fill="#FFFFFF" stroke="#555555" stroke-width="1.5"/>
  <text x="745" y="471" font-size="16" fill="#111111" text-anchor="middle">Average 85%, range 83 to 87%</text>
  <text x="745" y="492" font-size="15" fill="#111111" text-anchor="middle">The spread shows how stable the estimate is</text>
  <text x="40" y="540" font-size="13" fill="#333333">Illustrative figures.</text>
</svg>
