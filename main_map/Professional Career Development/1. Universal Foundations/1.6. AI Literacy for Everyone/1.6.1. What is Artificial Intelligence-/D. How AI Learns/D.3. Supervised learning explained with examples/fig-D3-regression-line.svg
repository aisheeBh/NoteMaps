<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Fitting a line to predict a number</title>
  <desc>Past flat sales plotted by floor area and price, with a straight line fitted through them. The line is used to predict the price of a new 100 square metre flat.</desc>
  <text x="480" y="40" font-size="22" font-weight="bold" fill="#111111" text-anchor="middle">Regression: learning a line that predicts a number</text>
  <line x1="130" y1="80" x2="130" y2="450" stroke="#222222" stroke-width="2"/>
  <line x1="130" y1="450" x2="890" y2="450" stroke="#222222" stroke-width="2"/>
  <text x="510" y="510" font-size="16" fill="#111111" text-anchor="middle">Floor area (square metres)</text>
  <text x="58" y="265" font-size="16" fill="#111111" text-anchor="middle" transform="rotate(-90 58 265)">Sale price (thousands)</text>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <line x1="130" y1="450" x2="130" y2="458" stroke="#222222"/><text x="130" y="478">40</text>
    <line x1="280" y1="450" x2="280" y2="458" stroke="#222222"/><text x="280" y="478">60</text>
    <line x1="430" y1="450" x2="430" y2="458" stroke="#222222"/><text x="430" y="478">80</text>
    <line x1="580" y1="450" x2="580" y2="458" stroke="#222222"/><text x="580" y="478">100</text>
    <line x1="730" y1="450" x2="730" y2="458" stroke="#222222"/><text x="730" y="478">120</text>
    <line x1="880" y1="450" x2="880" y2="458" stroke="#222222"/><text x="880" y="478">140</text>
  </g>
  <g font-size="14" fill="#111111" text-anchor="end">
    <line x1="122" y1="450" x2="130" y2="450" stroke="#222222"/><text x="116" y="455">100</text>
    <line x1="122" y1="360" x2="130" y2="360" stroke="#222222"/><text x="116" y="365">200</text>
    <line x1="122" y1="270" x2="130" y2="270" stroke="#222222"/><text x="116" y="275">300</text>
    <line x1="122" y1="180" x2="130" y2="180" stroke="#222222"/><text x="116" y="185">400</text>
    <line x1="122" y1="90" x2="130" y2="90" stroke="#222222"/><text x="116" y="95">500</text>
  </g>
  <circle cx="386" cy="273" r="7" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <circle cx="216" cy="326" r="7" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <circle cx="529" cy="249" r="7" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <circle cx="510" cy="244" r="7" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <circle cx="193" cy="373" r="7" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <circle cx="229" cy="348" r="7" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <circle cx="454" cy="264" r="7" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <circle cx="318" cy="331" r="7" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <circle cx="591" cy="190" r="7" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <circle cx="435" cy="288" r="7" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <circle cx="826" cy="89" r="7" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <circle cx="363" cy="289" r="7" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <circle cx="265" cy="322" r="7" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <circle cx="718" cy="161" r="7" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <circle cx="289" cy="361" r="7" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <circle cx="419" cy="301" r="7" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <circle cx="537" cy="232" r="7" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <circle cx="307" cy="320" r="7" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <circle cx="627" cy="228" r="7" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <circle cx="563" cy="222" r="7" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <circle cx="473" cy="277" r="7" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <circle cx="639" cy="161" r="7" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <circle cx="332" cy="342" r="7" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <circle cx="758" cy="175" r="7" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <circle cx="660" cy="213" r="7" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <circle cx="247" cy="276" r="7" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <line x1="145" y1="382" x2="865" y2="122" stroke="#111111" stroke-width="3.5"/>
  <line x1="580" y1="450" x2="580" y2="225" stroke="#7A5200" stroke-width="2.5" stroke-dasharray="2 4"/>
  <line x1="130" y1="225" x2="580" y2="225" stroke="#7A5200" stroke-width="2.5" stroke-dasharray="2 4"/>
  <rect x="571" y="216" width="18" height="18" fill="#FFE6A8" stroke="#7A5200" stroke-width="2.5"/>
  <rect x="150" y="96" width="330" height="72" fill="#FFFFFF" stroke="#555555" stroke-width="1.5"/>
  <text x="162" y="120" font-size="15" fill="#111111">Learned line:</text>
  <text x="162" y="142" font-size="15" fill="#111111">price = 50 + 3 x area</text>
  <text x="162" y="162" font-size="15" fill="#111111">(thousands; area in square metres)</text>
  <rect x="598" y="255" width="250" height="48" fill="#FFFFFF" stroke="#555555" stroke-width="1.5"/>
  <text x="608" y="275" font-size="15" fill="#111111">New flat, 100 square metres:</text>
  <text x="608" y="295" font-size="15" fill="#111111">predicted price about 350</text>
  <g font-size="15" fill="#111111">
    <circle cx="160" cy="540" r="7" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/><text x="176" y="546">Past sale (labelled example)</text>
    <rect x="431" y="531" width="18" height="18" fill="#FFE6A8" stroke="#7A5200" stroke-width="2.5"/><text x="458" y="546">Prediction for a new case</text>
  </g>
  <text x="900" y="572" font-size="13" fill="#333333" text-anchor="end">Illustrative figures.</text>
</svg>
