<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Precision and recall as the decision threshold changes</title>
  <desc>As the score threshold for flagging a case rises from low to high, recall falls because fewer real positives are caught, while precision rises because the flagged cases are more often correct. Low thresholds suit tasks where missing a case is costly; high thresholds suit tasks where false alarms are costly.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
  </defs>
  <text x="480" y="40" font-size="22" font-weight="bold" fill="#111111" text-anchor="middle">Moving the threshold trades recall for precision</text>
  <line x1="120" y1="80" x2="120" y2="420" stroke="#222222" stroke-width="2"/>
  <line x1="120" y1="420" x2="880" y2="420" stroke="#222222" stroke-width="2"/>
  <g font-size="14" fill="#111111" text-anchor="end">
    <line x1="112" y1="420" x2="120" y2="420" stroke="#222222"/><text x="106" y="425">0%</text>
    <line x1="112" y1="338" x2="120" y2="338" stroke="#222222"/><text x="106" y="342">25%</text>
    <line x1="112" y1="255" x2="120" y2="255" stroke="#222222"/><text x="106" y="260">50%</text>
    <line x1="112" y1="172" x2="120" y2="172" stroke="#222222"/><text x="106" y="178">75%</text>
    <line x1="112" y1="90" x2="120" y2="90" stroke="#222222"/><text x="106" y="95">100%</text>
  </g>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <line x1="120" y1="420" x2="120" y2="428" stroke="#222222"/><text x="120" y="448">0.0</text>
    <line x1="268" y1="420" x2="268" y2="428" stroke="#222222"/><text x="268" y="448">0.2</text>
    <line x1="416" y1="420" x2="416" y2="428" stroke="#222222"/><text x="416" y="448">0.4</text>
    <line x1="564" y1="420" x2="564" y2="428" stroke="#222222"/><text x="564" y="448">0.6</text>
    <line x1="712" y1="420" x2="712" y2="428" stroke="#222222"/><text x="712" y="448">0.8</text>
    <line x1="860" y1="420" x2="860" y2="428" stroke="#222222"/><text x="860" y="448">1.0</text>
  </g>
