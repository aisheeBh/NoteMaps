  <polyline points="120.0,385.9 127.4,385.3 134.8,384.6 142.2,383.9 149.6,383.1 157.0,382.2 164.4,381.3 171.8,380.3 179.2,379.3 186.6,378.2 194.0,377.0 201.4,375.7 208.8,374.3 216.2,372.8 223.6,371.2 231.0,369.4 238.4,367.6 245.8,365.7 253.2,363.6 260.6,361.3 268.0,359.0 275.4,356.5 282.8,353.8 290.2,351.0 297.6,348.0 305.0,344.8 312.4,341.5 319.8,338.0 327.2,334.3 334.6,330.4 342.0,326.4 349.4,322.2 356.8,317.8 364.2,313.2 371.6,308.5 379.0,303.6 386.4,298.5 393.8,293.3 401.2,288.0 408.6,282.6 416.0,277.1 423.4,271.4 430.8,265.7 438.2,260.0 445.6,254.2 453.0,248.4 460.4,242.6 467.8,236.8 475.2,231.1 482.6,225.4 490.0,219.7 497.4,214.2 504.8,208.8 512.2,203.5 519.6,198.3 527.0,193.2 534.4,188.3 541.8,183.6 549.2,179.0 556.6,174.6 564.0,170.4 571.4,166.4 578.8,162.5 586.2,158.8 593.6,155.3 601.0,152.0 608.4,148.8 615.8,145.8 623.2,143.0 630.6,140.3 638.0,137.8 645.4,135.5 652.8,133.2 660.2,131.1 667.6,129.2 675.0,127.4 682.4,125.6 689.8,124.0 697.2,122.5 704.6,121.1 712.0,119.8 719.4,118.6 726.8,117.5 734.2,116.5 741.6,115.5 749.0,114.6 756.4,113.7 763.8,112.9 771.2,112.2 778.6,111.5 786.0,110.9 793.4,110.3 800.8,109.8 808.2,109.3 815.6,108.8 823.0,108.4 830.4,108.0 837.8,107.7 845.2,107.3 852.6,107.0 860.0,106.7" fill="none" stroke="#7A5200" stroke-width="4" stroke-dasharray="10 6"/>
  <rect x="135" y="117" width="190" height="26" fill="#FFFFFF"/>
  <text x="145" y="136" font-size="16" fill="#111111">Recall: share caught</text>
  <rect x="135" y="392" width="250" height="26" fill="#FFFFFF"/>
  <text x="145" y="411" font-size="16" fill="#111111">Precision: share of flags correct</text>
  <rect x="140" y="456" width="300" height="48" fill="#FFFFFF" stroke="#555555" stroke-width="1.5"/>
  <text x="290" y="476" font-size="15" fill="#111111" text-anchor="middle">Low threshold: flag more cases.</text>
  <text x="290" y="495" font-size="15" fill="#111111" text-anchor="middle">Few missed, many false alarms.</text>
  <rect x="560" y="456" width="300" height="48" fill="#FFFFFF" stroke="#555555" stroke-width="1.5"/>
  <text x="710" y="476" font-size="15" fill="#111111" text-anchor="middle">High threshold: flag fewer cases.</text>
  <text x="710" y="495" font-size="15" fill="#111111" text-anchor="middle">Few false alarms, many missed.</text>
  <text x="500" y="530" font-size="16" fill="#111111" text-anchor="middle">Score threshold above which a case is flagged</text>
  <text x="480" y="553" font-size="13" fill="#333333" text-anchor="middle">Schematic with illustrative shapes.</text>
</svg>
