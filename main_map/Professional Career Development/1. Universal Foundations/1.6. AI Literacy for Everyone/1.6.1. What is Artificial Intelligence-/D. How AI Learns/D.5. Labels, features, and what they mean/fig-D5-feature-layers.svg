<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Hand-made features compared with features learned in layers</title>
  <desc>Top row: in traditional machine learning, people design features from raw data before a model learns from them. Bottom row: in deep learning, the network learns features itself, layer by layer, from pixels to edges to shapes to object parts to a label.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" font-size="22" font-weight="bold" fill="#111111" text-anchor="middle">Who designs the features?</text>
  <text x="40" y="92" font-size="18" font-weight="bold" fill="#111111">Traditional machine learning: people design features</text>
  <rect x="40" y="110" width="190" height="110" fill="#E6E6E6" stroke="#222222" stroke-width="2"/>
  <rect x="50" y="122" width="170" height="86" fill="#FFFFFF"/>
  <text x="135" y="146" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">Raw data</text>
  <text x="135" y="170" font-size="15" fill="#111111" text-anchor="middle">pixels, text,</text>
  <text x="135" y="192" font-size="15" fill="#111111" text-anchor="middle">records</text>
  <line x1="232" y1="165" x2="272" y2="165" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="280" y="110" width="190" height="110" fill="url(#dots)" stroke="#222222" stroke-width="2"/>
  <rect x="290" y="122" width="170" height="86" fill="#FFFFFF"/>
  <text x="375" y="146" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">People design</text>
  <text x="375" y="170" font-size="15" fill="#111111" text-anchor="middle">features: ratios,</text>
  <text x="375" y="192" font-size="15" fill="#111111" text-anchor="middle">counts, flags</text>
  <line x1="472" y1="165" x2="512" y2="165" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="520" y="110" width="190" height="110" fill="url(#hatch)" stroke="#222222" stroke-width="2"/>
  <rect x="530" y="122" width="170" height="86" fill="#FFFFFF"/>
  <text x="615" y="146" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">Model learns</text>
  <text x="615" y="170" font-size="15" fill="#111111" text-anchor="middle">weights for</text>
  <text x="615" y="192" font-size="15" fill="#111111" text-anchor="middle">each feature</text>
  <line x1="712" y1="165" x2="752" y2="165" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="760" y="110" width="190" height="110" fill="url(#cross)" stroke="#222222" stroke-width="2"/>
  <rect x="770" y="122" width="170" height="86" fill="#FFFFFF"/>
  <text x="855" y="146" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">Prediction</text>
  <text x="855" y="170" font-size="15" fill="#111111" text-anchor="middle">a label</text>
  <text x="855" y="192" font-size="15" fill="#111111" text-anchor="middle">or number</text>
  <text x="40" y="282" font-size="18" font-weight="bold" fill="#111111">Deep learning: the network learns features in layers</text>
  <rect x="40" y="300" width="160" height="110" fill="url(#hatch)" stroke="#222222" stroke-width="2"/>
  <rect x="50" y="312" width="140" height="86" fill="#FFFFFF"/>
  <text x="120" y="336" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">Pixels</text>
  <text x="120" y="360" font-size="15" fill="#111111" text-anchor="middle">brightness</text>
  <text x="120" y="382" font-size="15" fill="#111111" text-anchor="middle">values</text>
  <line x1="202" y1="355" x2="228" y2="355" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="230" y="300" width="160" height="110" fill="url(#hatch)" stroke="#222222" stroke-width="2"/>
  <rect x="240" y="312" width="140" height="86" fill="#FFFFFF"/>
  <text x="310" y="336" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">Layer 1</text>
  <text x="310" y="360" font-size="15" fill="#111111" text-anchor="middle">edges and</text>
  <text x="310" y="382" font-size="15" fill="#111111" text-anchor="middle">colour patches</text>
  <line x1="392" y1="355" x2="418" y2="355" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="420" y="300" width="160" height="110" fill="url(#hatch)" stroke="#222222" stroke-width="2"/>
  <rect x="430" y="312" width="140" height="86" fill="#FFFFFF"/>
  <text x="500" y="336" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">Layer 2</text>
  <text x="500" y="360" font-size="15" fill="#111111" text-anchor="middle">textures and</text>
  <text x="500" y="382" font-size="15" fill="#111111" text-anchor="middle">simple shapes</text>
  <line x1="582" y1="355" x2="608" y2="355" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="610" y="300" width="160" height="110" fill="url(#hatch)" stroke="#222222" stroke-width="2"/>
  <rect x="620" y="312" width="140" height="86" fill="#FFFFFF"/>
  <text x="690" y="336" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">Layer 3</text>
  <text x="690" y="360" font-size="15" fill="#111111" text-anchor="middle">parts: eyes,</text>
  <text x="690" y="382" font-size="15" fill="#111111" text-anchor="middle">ears, wheels</text>
  <line x1="772" y1="355" x2="798" y2="355" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="800" y="300" width="160" height="110" fill="#1F3B5C" stroke="#222222" stroke-width="2"/>
  <rect x="810" y="312" width="140" height="86" fill="#FFFFFF"/>
  <text x="880" y="336" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">Output</text>
  <text x="880" y="360" font-size="15" fill="#111111" text-anchor="middle">label:</text>
  <text x="880" y="382" font-size="15" fill="#111111" text-anchor="middle">cat</text>
  <line x1="230" y1="440" x2="790" y2="440" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="466" font-size="15" fill="#111111" text-anchor="middle">From simple, local patterns to complex, meaningful ones</text>
  <rect x="60" y="490" width="840" height="70" fill="#FFFFFF" stroke="#555555" stroke-width="1.5"/>
  <text x="480" y="518" font-size="15" fill="#111111" text-anchor="middle">Both approaches still need labels to learn the final task; deep learning removes the need</text>
  <text x="480" y="542" font-size="15" fill="#111111" text-anchor="middle">to hand-design features, at the cost of far more data and computing, and less transparency.</text>
  <text x="480" y="586" font-size="13" fill="#333333" text-anchor="middle">Schematic; layer contents simplified from published visualisations of image networks.</text>
</svg>
