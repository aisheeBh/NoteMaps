<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Catastrophic forgetting and the effect of replay</title>
  <desc>Paired bars show performance on an old task A and a new task B. After learning only task A, performance on A is high. After then training naively on task B, performance on B is high but performance on A collapses. When old examples are replayed during training on B, performance on both tasks stays high.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
  </defs>
  <text x="480" y="40" font-size="22" font-weight="bold" fill="#111111" text-anchor="middle">Learning something new can erase something old</text>
  <line x1="120" y1="80" x2="120" y2="420" stroke="#222222" stroke-width="2"/>
  <line x1="120" y1="420" x2="900" y2="420" stroke="#222222" stroke-width="2"/>
  <text x="60" y="250" font-size="16" fill="#111111" text-anchor="middle" transform="rotate(-90 60 250)">Performance</text>
  <line x1="112" y1="420" x2="120" y2="420" stroke="#222222"/><text x="106" y="425" font-size="14" fill="#111111" text-anchor="end">0%</text>
  <line x1="112" y1="340" x2="120" y2="340" stroke="#222222"/><text x="106" y="345" font-size="14" fill="#111111" text-anchor="end">25%</text>
  <line x1="112" y1="260" x2="120" y2="260" stroke="#222222"/><text x="106" y="265" font-size="14" fill="#111111" text-anchor="end">50%</text>
  <line x1="112" y1="180" x2="120" y2="180" stroke="#222222"/><text x="106" y="185" font-size="14" fill="#111111" text-anchor="end">75%</text>
  <line x1="112" y1="100" x2="120" y2="100" stroke="#222222"/><text x="106" y="105" font-size="14" fill="#111111" text-anchor="end">100%</text>
  <rect x="180" y="126" width="80" height="294" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="220" y="118" font-size="15" fill="#111111" text-anchor="middle">92%</text>
  <text x="265" y="446" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">Task A only</text>
  <rect x="430" y="298" width="80" height="122" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="470" y="290" font-size="15" fill="#111111" text-anchor="middle">38%</text>
  <rect x="520" y="129" width="80" height="291" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <text x="560" y="121" font-size="15" fill="#111111" text-anchor="middle">91%</text>
  <text x="515" y="446" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">Then B, naive</text>
  <rect x="680" y="145" width="80" height="275" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="720" y="137" font-size="15" fill="#111111" text-anchor="middle">86%</text>
  <rect x="770" y="135" width="80" height="285" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <text x="810" y="127" font-size="15" fill="#111111" text-anchor="middle">89%</text>
  <text x="765" y="446" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">Then B, with replay</text>
  <g font-size="15" fill="#111111">
    <rect x="180" y="470" width="22" height="18" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/><text x="210" y="484">Old task A</text>
    <rect x="340" y="470" width="22" height="18" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/><text x="370" y="484">New task B</text>
  </g>
  <rect x="290" y="200" width="200" height="48" fill="#FFFFFF" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="390" y="220" font-size="15" fill="#111111" text-anchor="middle">Old skill collapses:</text>
  <text x="390" y="240" font-size="15" fill="#111111" text-anchor="middle">catastrophic forgetting</text>
  <text x="480" y="540" font-size="13" fill="#333333" text-anchor="middle">Illustrative figures; the size of the effect depends on the model, the tasks and the method.</text>
</svg>
