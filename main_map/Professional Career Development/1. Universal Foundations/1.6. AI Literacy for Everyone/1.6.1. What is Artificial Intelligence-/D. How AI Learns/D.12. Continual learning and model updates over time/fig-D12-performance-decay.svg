<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Model performance over two years with and without retraining</title>
  <desc>A model that is never updated slowly loses accuracy as the world drifts, then drops sharply after a sudden change at month 14. A model retrained every six months recovers after each retraining, and recovers from the sudden change at the next retraining, sooner if monitoring triggers an early update.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
  </defs>
  <text x="480" y="40" font-size="22" font-weight="bold" fill="#111111" text-anchor="middle">Models decay as the world changes; updates restore them</text>
  <line x1="120" y1="80" x2="120" y2="420" stroke="#222222" stroke-width="2"/>
  <line x1="120" y1="420" x2="880" y2="420" stroke="#222222" stroke-width="2"/>
  <text x="60" y="250" font-size="16" fill="#111111" text-anchor="middle" transform="rotate(-90 60 250)">Accuracy in use</text>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <line x1="120" y1="420" x2="120" y2="428" stroke="#222222"/><text x="120" y="448">0</text>
    <line x1="310" y1="420" x2="310" y2="428" stroke="#222222"/><text x="310" y="448">6</text>
    <line x1="500" y1="420" x2="500" y2="428" stroke="#222222"/><text x="500" y="448">12</text>
    <line x1="690" y1="420" x2="690" y2="428" stroke="#222222"/><text x="690" y="448">18</text>
    <line x1="880" y1="420" x2="880" y2="428" stroke="#222222"/><text x="880" y="448">24</text>
  </g>
  <g font-size="14" fill="#111111" text-anchor="end">
    <line x1="112" y1="420" x2="120" y2="420" stroke="#222222"/><text x="106" y="425">60%</text>
    <line x1="112" y1="326" x2="120" y2="326" stroke="#222222"/><text x="106" y="331">70%</text>
    <line x1="112" y1="231" x2="120" y2="231" stroke="#222222"/><text x="106" y="236">80%</text>
    <line x1="112" y1="137" x2="120" y2="137" stroke="#222222"/><text x="106" y="142">90%</text>
  </g>
