  <polyline points="120.0,142.8 127.4,145.3 134.8,147.7 142.2,150.2 149.6,152.7 157.0,155.2 164.4,157.6 171.8,160.1 179.2,162.6 186.6,165.1 194.0,167.5 201.4,170.0 208.8,172.5 216.2,175.0 223.6,177.4 231.0,179.9 238.4,182.4 245.8,184.9 253.2,187.3 260.6,189.8 268.0,192.3 275.4,194.8 282.8,197.2 290.2,199.7 297.6,202.2 305.0,204.7 312.4,207.2 319.8,209.6 327.2,212.1 334.6,214.6 342.0,217.0 349.4,219.5 356.8,222.0 364.2,224.5 371.6,227.0 379.0,229.4 386.4,231.9 393.8,234.4 401.2,236.8 408.6,239.3 416.0,241.8 423.4,244.3 430.8,246.7 438.2,249.2 445.6,251.7 453.0,254.2 460.4,256.6 467.8,259.1 475.2,261.6 482.6,264.1 490.0,266.5 497.4,269.0 504.8,271.5 512.2,274.0 519.6,276.4 527.0,278.9 534.4,281.4 541.8,283.9 549.2,286.3 556.6,288.8 564.0,291.3 571.4,293.8 578.8,296.2 586.2,298.7 593.6,301.2 601.0,303.7 608.4,306.1 615.8,308.6 623.2,311.1 630.6,313.6 638.0,316.1 645.4,318.5 652.8,321.0 660.2,323.5 667.6,325.9 675.0,328.4 682.4,330.9 689.8,333.4 697.2,335.8 704.6,338.3 712.0,340.8 719.4,343.3 726.8,345.8 734.2,348.2 741.6,350.7 749.0,353.2 756.4,355.6 763.8,358.1 771.2,360.6 778.6,363.1 786.0,365.6 793.4,368.0 800.8,370.5 808.2,373.0 815.6,375.4 823.0,377.9 830.4,380.4 837.8,382.9 845.2,385.4 852.6,387.8 860.0,390.3" fill="none" stroke="#8B0000" stroke-width="4" stroke-dasharray="10 6"/>
  <rect x="600" y="192" width="260" height="26" fill="#FFFFFF"/>
  <text x="610" y="211" font-size="16" fill="#111111">Errors scattered at random</text>
  <rect x="380" y="352" width="290" height="48" fill="#FFFFFF"/>
  <text x="390" y="372" font-size="16" fill="#111111">Errors with a pattern: one</text>
  <text x="390" y="392" font-size="16" fill="#111111">category often given another's label</text>
  <text x="500" y="482" font-size="16" fill="#111111" text-anchor="middle">Share of training examples with a wrong label</text>
  <text x="480" y="540" font-size="13" fill="#333333" text-anchor="middle">Schematic with illustrative values; the exact effect depends on the model, the task and the amount of data.</text>
</svg>
