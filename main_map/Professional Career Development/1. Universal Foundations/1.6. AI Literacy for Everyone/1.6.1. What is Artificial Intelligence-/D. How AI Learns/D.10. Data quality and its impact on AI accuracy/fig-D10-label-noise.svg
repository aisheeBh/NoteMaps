<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>How the share of wrong labels affects accuracy</title>
  <desc>Accuracy on correctly labelled new data falls as the share of wrong training labels rises. Errors scattered at random reduce accuracy gradually. Errors that follow a pattern, such as one category regularly mislabelled as another, reduce it much faster.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
  </defs>
  <text x="480" y="40" font-size="22" font-weight="bold" fill="#111111" text-anchor="middle">Wrong labels cost accuracy, and patterned errors cost most</text>
  <line x1="120" y1="80" x2="120" y2="420" stroke="#222222" stroke-width="2"/>
  <line x1="120" y1="420" x2="880" y2="420" stroke="#222222" stroke-width="2"/>
  <text x="60" y="250" font-size="16" fill="#111111" text-anchor="middle" transform="rotate(-90 60 250)">Accuracy on new data</text>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <line x1="120" y1="420" x2="120" y2="428" stroke="#222222"/><text x="120" y="448">0%</text>
    <line x1="243" y1="420" x2="243" y2="428" stroke="#222222"/><text x="243" y="448">5%</text>
    <line x1="367" y1="420" x2="367" y2="428" stroke="#222222"/><text x="367" y="448">10%</text>
    <line x1="490" y1="420" x2="490" y2="428" stroke="#222222"/><text x="490" y="448">15%</text>
    <line x1="613" y1="420" x2="613" y2="428" stroke="#222222"/><text x="613" y="448">20%</text>
    <line x1="737" y1="420" x2="737" y2="428" stroke="#222222"/><text x="737" y="448">25%</text>
    <line x1="860" y1="420" x2="860" y2="428" stroke="#222222"/><text x="860" y="448">30%</text>
  </g>
  <g font-size="14" fill="#111111" text-anchor="end">
    <line x1="112" y1="420" x2="120" y2="420" stroke="#222222"/><text x="106" y="425">50%</text>
    <line x1="112" y1="354" x2="120" y2="354" stroke="#222222"/><text x="106" y="359">60%</text>
    <line x1="112" y1="288" x2="120" y2="288" stroke="#222222"/><text x="106" y="293">70%</text>
    <line x1="112" y1="222" x2="120" y2="222" stroke="#222222"/><text x="106" y="227">80%</text>
    <line x1="112" y1="156" x2="120" y2="156" stroke="#222222"/><text x="106" y="161">90%</text>
    <line x1="112" y1="90" x2="120" y2="90" stroke="#222222"/><text x="106" y="95">100%</text>
  </g>
