<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Error measured in three places</title>
  <desc>Three bars show a model's error on its training data, on held-back test data and in real use at a new site months later. Error rises at each step. The first difference is the generalisation gap; the second is the deployment gap caused by changes between test data and real use.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" font-size="22" font-weight="bold" fill="#111111" text-anchor="middle">The same model, measured in three places</text>
  <line x1="140" y1="80" x2="140" y2="420" stroke="#222222" stroke-width="2"/>
  <line x1="140" y1="420" x2="880" y2="420" stroke="#222222" stroke-width="2"/>
  <text x="80" y="250" font-size="16" fill="#111111" text-anchor="middle" transform="rotate(-90 80 250)">Error rate</text>
  <line x1="132" y1="420" x2="140" y2="420" stroke="#222222"/><text x="126" y="425" font-size="14" fill="#111111" text-anchor="end">0%</text>
  <line x1="132" y1="340" x2="140" y2="340" stroke="#222222"/><text x="126" y="345" font-size="14" fill="#111111" text-anchor="end">5%</text>
  <line x1="132" y1="260" x2="140" y2="260" stroke="#222222"/><text x="126" y="265" font-size="14" fill="#111111" text-anchor="end">10%</text>
  <line x1="132" y1="180" x2="140" y2="180" stroke="#222222"/><text x="126" y="185" font-size="14" fill="#111111" text-anchor="end">15%</text>
  <line x1="132" y1="100" x2="140" y2="100" stroke="#222222"/><text x="126" y="105" font-size="14" fill="#111111" text-anchor="end">20%</text>
  <rect x="200" y="356" width="140" height="64" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="270" y="346" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">4%</text>
  <text x="270" y="446" font-size="15" fill="#111111" text-anchor="middle">On training data</text>
  <rect x="430" y="276" width="140" height="144" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
  <text x="500" y="266" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">9%</text>
  <text x="500" y="446" font-size="15" fill="#111111" text-anchor="middle">On held-back test data</text>
  <rect x="660" y="148" width="140" height="272" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5"/>
  <text x="730" y="138" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">17%</text>
  <text x="730" y="446" font-size="15" fill="#111111" text-anchor="middle">At a new site, months later</text>
  <path d="M345 356 C 380 330, 400 300, 425 284" fill="none" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="300" y="196" width="220" height="48" fill="#FFFFFF" stroke="#555555" stroke-width="1.5"/>
  <text x="410" y="216" font-size="15" fill="#111111" text-anchor="middle">Generalisation gap:</text>
  <text x="410" y="236" font-size="15" fill="#111111" text-anchor="middle">new examples, same source</text>
  <path d="M575 284 C 610 250, 640 190, 655 160" fill="none" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="640" y="54" width="250" height="48" fill="#FFFFFF" stroke="#555555" stroke-width="1.5"/>
  <text x="765" y="74" font-size="15" fill="#111111" text-anchor="middle">Deployment gap: new place,</text>
  <text x="765" y="94" font-size="15" fill="#111111" text-anchor="middle">new time, new conditions</text>
  <text x="480" y="490" font-size="15" fill="#111111" text-anchor="middle">Training error says what was absorbed; test error estimates generalisation;</text>
  <text x="480" y="512" font-size="15" fill="#111111" text-anchor="middle">only measurement in real use shows what the system actually delivers.</text>
  <text x="480" y="548" font-size="13" fill="#333333" text-anchor="middle">Illustrative figures.</text>
</svg>
