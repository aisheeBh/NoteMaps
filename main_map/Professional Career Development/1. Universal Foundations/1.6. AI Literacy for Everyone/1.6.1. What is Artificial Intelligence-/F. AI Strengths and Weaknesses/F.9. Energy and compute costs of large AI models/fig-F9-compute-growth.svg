<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Training compute of landmark AI systems on a logarithmic scale</title>
  <desc>Approximate points on a logarithmic vertical axis: an image network of 2012 at about 10 to the 17, the Transformer of 2017 at about 10 to the 19, a large language model of 2020 at about 10 to the 23, and a frontier model of 2023 at about 10 to the 25. A rising line connects them.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Each step up the axis is a hundred times more calculation</text>
  <line x1="120" y1="470" x2="900" y2="470" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="470" x2="120" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="52" y="270" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 52 270)">Training compute (operations, log scale)</text>
  <g font-size="14" fill="#111111" text-anchor="end">
    <text x="110" y="435">10^17</text><text x="110" y="355">10^19</text><text x="110" y="275">10^21</text><text x="110" y="195">10^23</text><text x="110" y="115">10^25</text>
  </g>
  <g stroke="#BBBBBB" stroke-width="1" stroke-dasharray="2 4">
    <line x1="120" y1="430" x2="880" y2="430"/><line x1="120" y1="350" x2="880" y2="350"/><line x1="120" y1="270" x2="880" y2="270"/><line x1="120" y1="190" x2="880" y2="190"/><line x1="120" y1="110" x2="880" y2="110"/>
  </g>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="200" y="492">2012</text><text x="380" y="492">2017</text><text x="620" y="492">2020</text><text x="820" y="492">2023</text>
  </g>
  <text x="500" y="524" text-anchor="middle" font-size="16" fill="#111111">Year of the system</text>
  <path d="M200 402 L 380 350 L 620 172 L 820 112" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <circle cx="200" cy="402" r="8" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <circle cx="380" cy="350" r="8" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <circle cx="620" cy="172" r="8" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <circle cx="820" cy="112" r="8" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <rect x="215" y="360" width="150" height="46" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="225" y="380" font-size="15" font-weight="bold" fill="#111111">Image network</text>
  <text x="225" y="398" font-size="14" fill="#111111">about 5 x 10^17</text>
  <rect x="395" y="290" width="170" height="46" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="405" y="310" font-size="15" font-weight="bold" fill="#111111">Transformer</text>
  <text x="405" y="328" font-size="14" fill="#111111">about 10^19</text>
  <rect x="440" y="190" width="170" height="46" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="450" y="210" font-size="15" font-weight="bold" fill="#111111">Large language model</text>
  <text x="450" y="228" font-size="14" fill="#111111">about 3 x 10^23</text>
  <rect x="640" y="130" width="230" height="46" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="650" y="150" font-size="15" font-weight="bold" fill="#111111">Frontier model (estimate)</text>
  <text x="650" y="168" font-size="14" fill="#111111">order of 10^25; not disclosed</text>
  <text x="480" y="548" text-anchor="middle" font-size="13" fill="#333333">Approximate orders of magnitude from public estimates; values rounded and the latest figure is an outside estimate.</text>
</svg>
