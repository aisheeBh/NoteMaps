<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Boden's three kinds of creativity</title>
  <desc>A conceptual space drawn as a region. Combinational creativity links two distant points inside it; exploratory creativity moves to an unvisited corner inside it; transformational creativity redraws the boundary to create a new, larger space.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#EEF4FA"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9BB3CC" stroke-width="1.2"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Three ways of being creative within and beyond a conceptual space</text>
  <ellipse cx="420" cy="290" rx="380" ry="210" fill="#FFFFFF" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="640" y="70" width="290" height="44" fill="#FFFFFF" stroke="#7A5200" stroke-width="1.5"/>
  <text x="785" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">TRANSFORMATIONAL</text>
  <text x="785" y="106" text-anchor="middle" font-size="14" fill="#111111">the rules change; a new, larger space</text>
  <line x1="700" y1="114" x2="690" y2="150" stroke="#7A5200" stroke-width="1.5" marker-end="url(#arrow)"/>
  <ellipse cx="380" cy="300" rx="260" ry="150" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="3"/>
  <rect x="250" y="160" width="260" height="26" fill="#FFFFFF"/>
  <text x="380" y="179" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Existing conceptual space</text>
  <circle cx="220" cy="260" r="8" fill="#1F3B5C"/>
  <circle cx="470" cy="360" r="8" fill="#1F3B5C"/>
  <path d="M228 262 C 300 230, 420 300, 462 355" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="250" y="380" width="200" height="44" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="350" y="398" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">COMBINATIONAL</text>
  <text x="350" y="416" text-anchor="middle" font-size="14" fill="#111111">link two distant ideas</text>
  <circle cx="400" cy="250" r="6" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <path d="M406 248 L 560 230" fill="none" stroke="#222222" stroke-width="2.5" stroke-dasharray="2 4" marker-end="url(#arrow)"/>
  <circle cx="575" cy="228" r="8" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <rect x="500" y="250" width="210" height="44" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="605" y="268" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">EXPLORATORY</text>
  <text x="605" y="286" text-anchor="middle" font-size="14" fill="#111111">reach an unvisited corner</text>
  <rect x="40" y="470" width="880" height="56" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
  <text x="480" y="492" text-anchor="middle" font-size="15" fill="#111111">Current generative AI: strong at combining and exploring well-represented spaces;</text>
  <text x="480" y="512" text-anchor="middle" font-size="15" fill="#111111">rare and weak at transforming the space or judging which new idea is valuable.</text>
  <text x="480" y="548" text-anchor="middle" font-size="13" fill="#333333">Schematic based on Margaret Boden's account of creativity (1990).</text>
</svg>
