<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Dividing creative and caring work between people and AI</title>
  <desc>A two-by-two matrix. Horizontal axis: originality and judgement needed, low to high. Vertical axis: genuine human connection needed, low to high. Low-low: AI drafts with spot checks. High originality, low connection: AI widens options, person selects. Low originality, high connection: AI helps prepare, person delivers. High-high: person leads throughout.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Who should lead the work?</text>
  <rect x="160" y="70" width="360" height="220" fill="#F2F2F2" stroke="#222222" stroke-width="1.5"/>
  <rect x="520" y="70" width="360" height="220" fill="url(#hatch)" stroke="#222222" stroke-width="1.5"/>
  <rect x="160" y="290" width="360" height="220" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <rect x="520" y="290" width="360" height="220" fill="#F2F2F2" stroke="#222222" stroke-width="1.5"/>
  <rect x="190" y="110" width="300" height="140" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="340" y="138" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">AI helps prepare;</text>
  <text x="340" y="158" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">a person delivers</text>
  <text x="340" y="188" text-anchor="middle" font-size="14" fill="#111111">e.g. a redundancy meeting,</text>
  <text x="340" y="206" text-anchor="middle" font-size="14" fill="#111111">rehearsed with an AI partner</text>
  <rect x="550" y="110" width="300" height="140" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="700" y="138" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">A person leads throughout</text>
  <text x="700" y="168" text-anchor="middle" font-size="14" fill="#111111">e.g. grief counselling,</text>
  <text x="700" y="186" text-anchor="middle" font-size="14" fill="#111111">leading a team through crisis;</text>
  <text x="700" y="204" text-anchor="middle" font-size="14" fill="#111111">AI at most for background</text>
  <rect x="190" y="330" width="300" height="140" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="340" y="358" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">AI drafts;</text>
  <text x="340" y="378" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">people spot-check</text>
  <text x="340" y="408" text-anchor="middle" font-size="14" fill="#111111">e.g. catalogue descriptions,</text>
  <text x="340" y="426" text-anchor="middle" font-size="14" fill="#111111">routine notices</text>
  <rect x="550" y="330" width="300" height="140" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="700" y="358" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">AI widens options;</text>
  <text x="700" y="378" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">a person selects and refines</text>
  <text x="700" y="408" text-anchor="middle" font-size="14" fill="#111111">e.g. brand concepts,</text>
  <text x="700" y="426" text-anchor="middle" font-size="14" fill="#111111">headline options, design variants</text>
  <line x1="160" y1="530" x2="890" y2="530" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="520" y="558" text-anchor="middle" font-size="16" fill="#111111">Originality and judgement needed: low to high</text>
  <line x1="140" y1="510" x2="140" y2="62" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="105" y="290" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 105 290)">Genuine human connection needed: low to high</text>
  <text x="480" y="588" text-anchor="middle" font-size="13" fill="#333333">A decision aid; real tasks sit on a continuum and need case-by-case judgement.</text>
</svg>
