<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>A model's ROC curve compared with individual human readers</title>
  <desc>Schematic receiver operating characteristic plot. The model's curve bows towards the top-left corner. Six human readers appear as single points, most lying just below the curve. The diagonal line marks chance performance.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Each reader is a point; the model is a whole curve</text>
  <rect x="140" y="70" width="440" height="440" fill="#FAFAFA" stroke="#222222" stroke-width="2"/>
  <line x1="140" y1="510" x2="580" y2="70" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="430" y="300" font-size="14" fill="#111111" transform="rotate(-45 430 300)">chance</text>
  <path d="M140 510 C 150 300, 200 140, 320 105 C 420 82, 500 74, 580 70" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <g fill="#FFFFFF" stroke="#000000" stroke-width="2.5">
    <rect x="186" y="186" width="12" height="12"/>
    <rect x="206" y="160" width="12" height="12"/>
    <rect x="236" y="150" width="12" height="12"/>
    <rect x="260" y="128" width="12" height="12"/>
    <rect x="176" y="236" width="12" height="12"/>
    <rect x="296" y="140" width="12" height="12"/>
  </g>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="140" y="532">0</text><text x="360" y="532">0.5</text><text x="580" y="532">1</text>
    <text x="124" y="515" text-anchor="end">0</text><text x="124" y="295" text-anchor="end">0.5</text><text x="124" y="75" text-anchor="end">1</text>
  </g>
  <text x="360" y="560" text-anchor="middle" font-size="16" fill="#111111">False-positive rate (1 minus specificity)</text>
  <text x="80" y="290" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 80 290)">Sensitivity</text>
  <rect x="610" y="90" width="320" height="64" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="622" y="112" font-size="15" font-weight="bold" fill="#111111">Model (solid curve)</text>
  <text x="622" y="130" font-size="14" fill="#111111">every possible threshold;</text>
  <text x="622" y="146" font-size="14" fill="#111111">area under it summarises separation</text>
  <line x1="610" y1="120" x2="420" y2="86" stroke="#1F3B5C" stroke-width="1"/>
  <rect x="610" y="190" width="320" height="64" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="622" y="212" font-size="15" font-weight="bold" fill="#111111">Human readers (squares)</text>
  <text x="622" y="230" font-size="14" fill="#111111">each works at one implicit threshold;</text>
  <text x="622" y="246" font-size="14" fill="#111111">points below the curve are beaten</text>
  <line x1="610" y1="222" x2="310" y2="150" stroke="#222222" stroke-width="1"/>
  <rect x="610" y="300" width="320" height="110" fill="#FFFFFF" stroke="#555555" stroke-width="1" stroke-dasharray="8 4"/>
  <text x="622" y="322" font-size="15" font-weight="bold" fill="#111111">Questions the plot hides</text>
  <text x="622" y="344" font-size="14" fill="#111111">Which readers, with what context?</text>
  <text x="622" y="364" font-size="14" fill="#111111">Which data, from which sites?</text>
  <text x="622" y="384" font-size="14" fill="#111111">What does a positive mean at</text>
  <text x="622" y="400" font-size="14" fill="#111111">the real prevalence?</text>
  <text x="480" y="590" text-anchor="middle" font-size="13" fill="#333333">Schematic; not plotted from a single dataset.</text>
</svg>
