<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Reliability falls as facts become rarer while fluency stays constant</title>
  <desc>Schematic: the horizontal axis runs from facts seen very often in training to facts seen once or never. The solid line shows accuracy, which falls steadily. The dashed line shows how fluent and confident the answer sounds, which stays high and flat. The gap between them widens as facts get rarer.</desc>
  <defs>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">The gap between sounding right and being right</text>
  <polygon points="300,140 880,140 880,380 300,230" fill="url(#lines)" opacity="0.8"/>
  <line x1="100" y1="440" x2="900" y2="440" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="100" y1="440" x2="100" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="500" y="486" text-anchor="middle" font-size="16" fill="#111111">Rarity of the fact in the training data</text>
  <text x="130" y="462" font-size="14" fill="#111111">seen very often</text>
  <text x="880" y="462" text-anchor="end" font-size="14" fill="#111111">seen once or never</text>
  <text x="50" y="255" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 50 255)">Level</text>
  <line x1="100" y1="140" x2="880" y2="140" stroke="#222222" stroke-width="3" stroke-dasharray="10 6"/>
  <path d="M100 150 C 300 160, 420 220, 540 290 C 640 345, 760 375, 880 385" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <rect x="130" y="76" width="340" height="46" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="142" y="96" font-size="15" font-weight="bold" fill="#111111">Fluency and confidence of the answer</text>
  <text x="142" y="114" font-size="14" fill="#111111">high whether or not the fact is known</text>
  <rect x="140" y="320" width="270" height="46" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="152" y="340" font-size="15" font-weight="bold" fill="#111111">Accuracy of the answer</text>
  <text x="152" y="358" font-size="14" fill="#111111">falls as facts become rarer</text>
  <line x1="300" y1="320" x2="330" y2="205" stroke="#1F3B5C" stroke-width="1"/>
  <rect x="600" y="196" width="270" height="46" fill="#FFFFFF" stroke="#8B0000" stroke-width="1.5"/>
  <text x="612" y="216" font-size="15" font-weight="bold" fill="#111111">Hidden gap</text>
  <text x="612" y="234" font-size="14" fill="#111111">confident text that is wrong</text>
  <text x="480" y="526" text-anchor="middle" font-size="13" fill="#333333">Schematic; not plotted from a single dataset.</text>
</svg>
