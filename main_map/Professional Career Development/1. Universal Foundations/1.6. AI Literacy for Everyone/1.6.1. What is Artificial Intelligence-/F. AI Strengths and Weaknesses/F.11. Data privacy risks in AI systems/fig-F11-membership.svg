<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Confidence on training records and on new records</title>
  <desc>Schematic: two bell-shaped distributions of a model's confidence. Confidence on records the model was trained on is concentrated near the top; confidence on new records is lower and more spread out. An attacker's threshold between the two separates many members from non-members.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Overconfidence on seen records gives them away</text>
  <line x1="100" y1="430" x2="900" y2="430" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="100" y1="430" x2="100" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="500" y="474" text-anchor="middle" font-size="16" fill="#111111">Model's confidence in its prediction</text>
  <text x="50" y="250" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 50 250)">Share of records</text>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="100" y="452">0</text><text x="500" y="452">0.5</text><text x="880" y="452">1</text>
  </g>
  <path d="M110 428 C 200 424, 280 250, 420 235 C 520 225, 600 330, 720 410 C 760 424, 820 427, 860 428" fill="none" stroke="#222222" stroke-width="3" stroke-dasharray="10 6"/>
  <path d="M440 428 C 560 424, 640 200, 760 130 C 820 110, 860 160, 880 428" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <line x1="710" y1="430" x2="710" y2="95" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="560" y="76" width="300" height="46" fill="#FFFFFF" stroke="#8B0000" stroke-width="1.5"/>
  <text x="572" y="96" font-size="15" font-weight="bold" fill="#111111">Attacker's rule</text>
  <text x="572" y="114" font-size="14" fill="#111111">above the line: "was in the training data"</text>
  <rect x="130" y="150" width="270" height="62" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="142" y="170" font-size="15" font-weight="bold" fill="#111111">New records (dashed)</text>
  <text x="142" y="188" font-size="14" fill="#111111">lower, more spread-out confidence;</text>
  <text x="142" y="204" font-size="14" fill="#111111">few exceed the line</text>
  <line x1="300" y1="212" x2="330" y2="260" stroke="#222222" stroke-width="1"/>
  <rect x="230" y="296" width="260" height="62" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="242" y="316" font-size="15" font-weight="bold" fill="#111111">Training records (solid)</text>
  <text x="242" y="334" font-size="14" fill="#111111">very high confidence; most</text>
  <text x="242" y="350" font-size="14" fill="#111111">exceed the line</text>
  <line x1="490" y1="330" x2="640" y2="280" stroke="#1F3B5C" stroke-width="1"/>
  <text x="480" y="516" text-anchor="middle" font-size="13" fill="#333333">Schematic of an overfitted model; not plotted from a single dataset.</text>
</svg>
