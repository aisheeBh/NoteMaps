<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Human vigilance and machine consistency over a long monitoring shift</title>
  <desc>Schematic: the share of rare signals detected by a human monitor falls within the first half-hour and stays lower; a fixed automated system stays flat, at a level set by its own design.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Attention over a long monitoring shift</text>
  <line x1="100" y1="440" x2="900" y2="440" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="100" y1="440" x2="100" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="500" y="486" text-anchor="middle" font-size="16" fill="#111111">Time on task (hours)</text>
  <text x="50" y="255" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 50 255)">Share of rare signals detected</text>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="100" y="460">0</text><text x="300" y="460">1</text><text x="500" y="460">2</text><text x="700" y="460">3</text><text x="880" y="460">4</text>
  </g>
  <line x1="200" y1="440" x2="200" y2="90" stroke="#888888" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="206" y="100" font-size="14" fill="#111111">about 30 minutes</text>
  <path d="M100 130 C 150 135, 180 200, 230 240 C 300 280, 500 300, 880 310" fill="none" stroke="#222222" stroke-width="3" stroke-dasharray="10 6"/>
  <line x1="100" y1="185" x2="880" y2="185" stroke="#1F3B5C" stroke-width="4"/>
  <rect x="520" y="330" width="340" height="46" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="532" y="350" font-size="15" font-weight="bold" fill="#111111">Human monitor</text>
  <text x="532" y="368" font-size="14" fill="#111111">detection falls early, then stays lower</text>
  <rect x="520" y="115" width="340" height="46" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="532" y="135" font-size="15" font-weight="bold" fill="#111111">Fixed automated system</text>
  <text x="532" y="153" font-size="14" fill="#111111">flat, at a level set by its design</text>
  <text x="480" y="520" text-anchor="middle" font-size="13" fill="#333333">Schematic of a well-replicated pattern; not plotted from a single dataset. A system's level may be above or below a fresh person's.</text>
</svg>
