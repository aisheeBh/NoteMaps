<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Graceful and brittle decline in performance</title>
  <desc>Schematic: as conditions move further from the familiar, a skilled person's performance declines gradually; a brittle AI system stays high and then drops sharply past an invisible boundary, while its confidence stays high.</desc>
  <defs>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Gradual decline versus sudden collapse</text>
  <rect x="560" y="70" width="330" height="370" fill="url(#lines)" opacity="0.6"/>
  <rect x="600" y="78" width="250" height="40" fill="#FFFFFF" stroke="#8B0000" stroke-width="1.5"/>
  <text x="725" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Beyond the training data</text>
  <text x="725" y="112" text-anchor="middle" font-size="14" fill="#111111">(edge cases)</text>
  <line x1="100" y1="440" x2="900" y2="440" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="100" y1="440" x2="100" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="500" y="476" text-anchor="middle" font-size="16" fill="#111111">Distance from familiar conditions</text>
  <text x="50" y="255" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 50 255)">Performance</text>
  <path d="M100 150 C 300 165, 500 230, 880 330" fill="none" stroke="#222222" stroke-width="3" stroke-dasharray="10 6"/>
  <path d="M100 120 L 540 125 C 570 128, 580 380, 620 400 L 880 410" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <line x1="560" y1="440" x2="560" y2="70" stroke="#555555" stroke-width="1.5" stroke-dasharray="2 4"/>
  <rect x="130" y="180" width="270" height="46" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="142" y="200" font-size="15" font-weight="bold" fill="#111111">Skilled person (graceful)</text>
  <text x="142" y="218" font-size="14" fill="#111111">slows, hedges, asks for help</text>
  <rect x="130" y="70" width="300" height="40" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="142" y="88" font-size="15" font-weight="bold" fill="#111111">Brittle AI system</text>
  <text x="142" y="104" font-size="14" fill="#111111">excellent until an invisible boundary</text>
  <rect x="640" y="345" width="240" height="40" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1.5"/>
  <text x="760" y="362" text-anchor="middle" font-size="14" fill="#111111">sudden collapse, while</text>
  <text x="760" y="378" text-anchor="middle" font-size="14" fill="#111111">confidence often stays high</text>
  <text x="480" y="520" text-anchor="middle" font-size="13" fill="#333333">Schematic; not plotted from a single dataset. Real systems and people vary.</text>
</svg>
