<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Notable AI models by region, 2024 and 2025</title>
  <desc>Grouped bar chart. United States: about 40 notable models in 2024 and 50 in 2025. China: about 15 in 2024 and 30 in 2025. Europe: about 3 in 2024 and 2 in 2025.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">The United States leads; China is catching up fast</text>

  <rect x="330" y="54" width="22" height="16" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/>
  <text x="360" y="67" font-size="14" fill="#111111">2024</text>
  <rect x="430" y="54" width="22" height="16" fill="#1F3B5C" stroke="#000000" stroke-width="1.5"/>
  <text x="460" y="67" font-size="14" fill="#111111">2025</text>

  <!-- axis: 0 at y=420, 50 at y=120 (6 px per model) -->
  <line x1="140" y1="420" x2="860" y2="420" stroke="#222222" stroke-width="2.5"/>
  <line x1="140" y1="420" x2="140" y2="100" stroke="#222222" stroke-width="2.5"/>
  <g font-size="14" fill="#111111" text-anchor="end">
    <text x="130" y="424">0</text><text x="130" y="364">10</text><text x="130" y="304">20</text><text x="130" y="244">30</text><text x="130" y="184">40</text><text x="130" y="124">50</text>
  </g>
  <g stroke="#CCCCCC" stroke-width="1" stroke-dasharray="3 4">
    <line x1="140" y1="360" x2="860" y2="360"/><line x1="140" y1="300" x2="860" y2="300"/><line x1="140" y1="240" x2="860" y2="240"/><line x1="140" y1="180" x2="860" y2="180"/><line x1="140" y1="120" x2="860" y2="120"/>
  </g>
  <text x="70" y="260" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 70 260)">Notable models</text>

  <!-- US -->
  <rect x="200" y="180" width="80" height="240" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
  <rect x="290" y="120" width="80" height="300" fill="#1F3B5C" stroke="#000000" stroke-width="2.5"/>
  <!-- China -->
  <rect x="440" y="330" width="80" height="90" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
  <rect x="530" y="240" width="80" height="180" fill="#1F3B5C" stroke="#000000" stroke-width="2.5"/>
  <!-- Europe -->
  <rect x="680" y="402" width="80" height="18" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
  <rect x="770" y="408" width="80" height="12" fill="#1F3B5C" stroke="#000000" stroke-width="2.5"/>

  <g font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">
    <text x="240" y="170">about 40</text><text x="330" y="110">50</text>
    <text x="480" y="320">about 15</text><text x="570" y="230">30</text>
    <text x="720" y="392">about 3</text><text x="810" y="398">2</text>
  </g>
  <g font-size="17" font-weight="bold" fill="#111111" text-anchor="middle">
    <text x="285" y="448">United States</text><text x="525" y="448">China</text><text x="765" y="448">Europe</text>
  </g>

  <text x="480" y="490" text-anchor="middle" font-size="15" fill="#111111">More than 90% of notable models now come from companies rather than universities.</text>
  <text x="480" y="522" text-anchor="middle" font-size="13" fill="#333333">Counts as reported in Stanford's AI Index (2025 and 2026 editions); selection criteria are the Index's own.</text>
</svg>
