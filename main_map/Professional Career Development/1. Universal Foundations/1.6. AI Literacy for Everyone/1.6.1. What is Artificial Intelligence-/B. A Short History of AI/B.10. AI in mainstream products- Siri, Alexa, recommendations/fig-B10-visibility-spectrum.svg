<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>How visible consumer AI features were to their users</title>
  <desc>A spectrum from invisible to conversational. Invisible: fraud detection and spam filtering. Shaping: search ranking, recommendations and social feeds. Assisting: autocorrect, smart reply, photo search and face unlock. Conversational: Siri, Alexa and Google Assistant. Below the spectrum, two notes: invisible features were adopted easily but escaped scrutiny; conversational ones attracted attention and higher expectations.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">From background helpers to talking assistants</text>

  <line x1="60" y1="110" x2="900" y2="110" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="60" y="92" font-size="16" font-weight="bold" fill="#111111">less visible to the user</text>
  <text x="900" y="92" text-anchor="end" font-size="16" font-weight="bold" fill="#111111">more visible to the user</text>

  <rect x="60" y="140" width="190" height="200" fill="#E6E6E6" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/>
  <rect x="270" y="140" width="190" height="200" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <rect x="480" y="140" width="190" height="200" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="690" y="140" width="210" height="200" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>

  <g font-size="17" font-weight="bold" text-anchor="middle">
    <text x="155" y="170" fill="#111111">Invisible</text>
    <text x="365" y="170" fill="#111111">Shaping</text>
    <rect x="500" y="152" width="150" height="26" fill="#FFFFFF"/><text x="575" y="170" fill="#111111">Assisting</text>
    <text x="795" y="170" fill="#FFFFFF">Conversational</text>
  </g>
  <g font-size="15" text-anchor="middle" fill="#111111">
    <text x="155" y="210">fraud detection</text><text x="155" y="236">spam filtering</text><text x="155" y="262">network security</text>
    <text x="365" y="210">search ranking</text><text x="365" y="236">recommendations</text><text x="365" y="262">social feeds</text>
  </g>
  <rect x="495" y="192" width="160" height="104" fill="#FFFFFF"/>
  <g font-size="15" text-anchor="middle" fill="#111111">
    <text x="575" y="212">autocorrect</text><text x="575" y="238">smart reply</text><text x="575" y="264">photo search</text><text x="575" y="290">face unlock</text>
  </g>
  <g font-size="15" text-anchor="middle" fill="#FFFFFF">
    <text x="795" y="210">Siri</text><text x="795" y="236">Alexa</text><text x="795" y="262">Google Assistant</text>
  </g>

  <rect x="60" y="370" width="400" height="90" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="260" y="398" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Adopted easily, little noticed</text>
  <text x="260" y="422" text-anchor="middle" font-size="14" fill="#111111">rarely called AI; decisions shape what</text>
  <text x="260" y="442" text-anchor="middle" font-size="14" fill="#111111">people see without much scrutiny</text>

  <rect x="500" y="370" width="400" height="90" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="700" y="398" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Highly visible, highly judged</text>
  <text x="700" y="422" text-anchor="middle" font-size="14" fill="#111111">promoted as AI; every failure noticed;</text>
  <text x="700" y="442" text-anchor="middle" font-size="14" fill="#111111">expectations often above capability</text>

  <text x="480" y="510" text-anchor="middle" font-size="13" fill="#333333">Conceptual spectrum of consumer AI features from the late 1990s to the late 2010s.</text>
</svg>
