<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Expectations and funding around the first AI winter</title>
  <desc>Schematic chart from 1955 to 1985. Public expectations rise steeply in the 1960s, ahead of results. Funding follows with a lag, peaks around 1970, then falls after the ALPAC report, the Mansfield Amendment and the Lighthill report. Both stay low in the late 1970s and recover in the early 1980s with expert systems.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Expectations ran ahead; funding followed, then fell</text>

  <rect x="580" y="70" width="170" height="370" fill="url(#hatch)" opacity="0.45"/>
  <rect x="598" y="404" width="134" height="26" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="665" y="422" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">first winter</text>

  <line x1="120" y1="440" x2="900" y2="440" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="440" x2="120" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="70" y="260" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 70 260)">Relative level</text>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="120" y="462">1955</text><text x="246.7" y="462">1960</text><text x="373.3" y="462">1965</text>
    <text x="500" y="462">1970</text><text x="626.7" y="462">1975</text><text x="753.3" y="462">1980</text><text x="880" y="462">1985</text>
  </g>

  <g stroke="#555555" stroke-width="1.5" stroke-dasharray="3 4">
    <line x1="398.7" y1="80" x2="398.7" y2="440"/>
    <line x1="474.7" y1="80" x2="474.7" y2="440"/>
    <line x1="576" y1="80" x2="576" y2="440"/>
  </g>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <rect x="345" y="478" width="108" height="22" fill="#FFFFFF"/><text x="398.7" y="494">1966 ALPAC</text>
    <rect x="420" y="504" width="112" height="22" fill="#FFFFFF"/><text x="474.7" y="520">1969 Mansfield</text>
    <rect x="520" y="478" width="114" height="22" fill="#FFFFFF"/><text x="576" y="494">1973 Lighthill</text>
  </g>

  <path d="M120 400 C 250 300, 330 110, 420 110 C 500 110, 540 330, 620 360 C 700 380, 760 300, 880 160" fill="none" stroke="#7A5200" stroke-width="4" stroke-dasharray="10 6"/>
  <path d="M120 420 C 260 380, 380 170, 480 160 C 560 155, 580 360, 640 380 C 720 395, 780 330, 880 220" fill="none" stroke="#1F3B5C" stroke-width="4"/>

  <rect x="190" y="150" width="200" height="44" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="290" y="169" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Public expectations</text>
  <text x="290" y="187" text-anchor="middle" font-size="14" fill="#111111">rise ahead of results</text>

  <rect x="250" y="330" width="170" height="44" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="335" y="349" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Funding</text>
  <text x="335" y="367" text-anchor="middle" font-size="14" fill="#111111">follows with a lag</text>

  <rect x="760" y="110" width="140" height="44" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="830" y="129" text-anchor="middle" font-size="14" fill="#111111">recovery with</text>
  <text x="830" y="147" text-anchor="middle" font-size="14" fill="#111111">expert systems</text>

  <text x="480" y="548" text-anchor="middle" font-size="13" fill="#333333">Schematic; not plotted from a single dataset. Funding patterns differed between countries and research areas.</text>
</svg>
