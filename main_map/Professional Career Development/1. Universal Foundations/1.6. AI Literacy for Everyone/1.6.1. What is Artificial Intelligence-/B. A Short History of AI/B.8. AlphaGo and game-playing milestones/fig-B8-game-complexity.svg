<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Number of legal positions in four games and when machines beat the best humans</title>
  <desc>Horizontal bars on a scale of powers of ten. Noughts and crosses has about ten to the power 3.7 legal positions; draughts about ten to the 20; chess about ten to the 44; Go about ten to the 170. Machines reached the top human level in draughts in 1994, chess in 1997 and Go in 2016.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Go is astronomically larger than chess</text>
  <text x="480" y="64" text-anchor="middle" font-size="15" fill="#111111">Bar length = the power of ten in the number of legal positions</text>

  <line x1="200" y1="400" x2="880" y2="400" stroke="#222222" stroke-width="2"/>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <line x1="200" y1="400" x2="200" y2="408" stroke="#222222"/><text x="200" y="426">10^0</text>
    <line x1="350" y1="400" x2="350" y2="408" stroke="#222222"/><text x="350" y="426">10^40</text>
    <line x1="500" y1="400" x2="500" y2="408" stroke="#222222"/><text x="500" y="426">10^80</text>
    <line x1="650" y1="400" x2="650" y2="408" stroke="#222222"/><text x="650" y="426">10^120</text>
    <line x1="800" y1="400" x2="800" y2="408" stroke="#222222"/><text x="800" y="426">10^160</text>
  </g>
  <line x1="500" y1="90" x2="500" y2="400" stroke="#555555" stroke-width="1.5" stroke-dasharray="3 4"/>
  <rect x="440" y="440" width="120" height="44" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
  <text x="500" y="459" text-anchor="middle" font-size="14" fill="#111111">atoms in the</text>
  <text x="500" y="477" text-anchor="middle" font-size="14" fill="#111111">universe, 10^80</text>

  <g font-size="16" font-weight="bold" fill="#111111" text-anchor="end">
    <text x="188" y="126">Noughts and crosses</text>
    <text x="188" y="196">Draughts</text>
    <text x="188" y="266">Chess</text>
    <text x="188" y="336">Go (19 by 19)</text>
  </g>

  <rect x="200" y="106" width="14" height="30" fill="#E6E6E6" stroke="#222222" stroke-width="2"/>
  <rect x="200" y="176" width="75" height="30" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
  <rect x="200" y="246" width="165" height="30" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="200" y="316" width="637.5" height="30" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>

  <g fill="#FFFFFF">
    <rect x="222" y="110" width="270" height="22"/><rect x="283" y="180" width="300" height="22"/><rect x="373" y="250" width="300" height="22"/>
  </g>
  <g font-size="14" fill="#111111">
    <text x="226" y="126">about 5,500 positions; trivial for machines</text>
    <text x="287" y="196">about 10^20; Chinook title 1994, solved 2007</text>
    <text x="377" y="266">about 10^44; Deep Blue beats Kasparov, 1997</text>
  </g>
  <rect x="470" y="320" width="350" height="22" fill="#FFFFFF"/>
  <text x="645" y="336" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">about 2 x 10^170; AlphaGo, 2016</text>

  <text x="480" y="530" text-anchor="middle" font-size="13" fill="#333333">Position counts are published estimates; chess estimates range from about 10^43 to 10^47 depending on method.</text>
</svg>
