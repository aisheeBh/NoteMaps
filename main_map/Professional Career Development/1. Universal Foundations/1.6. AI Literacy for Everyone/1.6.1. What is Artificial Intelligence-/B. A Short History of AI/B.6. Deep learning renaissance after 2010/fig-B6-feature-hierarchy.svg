<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Features learned at increasing depth</title>
  <desc>Five stages from left to right: raw pixels; early layers detecting edges; middle layers detecting textures and simple shapes; later layers detecting parts such as eyes and wheels; final layers recognising whole objects such as a face or a car. Arrows show each stage built from the one before.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Each layer builds richer features from the one below</text>

  <!-- stage boxes -->
  <g stroke="#222222" stroke-width="2" fill="#FFFFFF">
    <rect x="30" y="90" width="160" height="230"/>
    <rect x="215" y="90" width="160" height="230"/>
    <rect x="400" y="90" width="160" height="230"/>
    <rect x="585" y="90" width="160" height="230"/>
    <rect x="770" y="90" width="160" height="230" stroke="#000000" stroke-width="3"/>
  </g>

  <!-- stage 1: pixel grid -->
  <g stroke="#555555" stroke-width="1">
    <rect x="60" y="130" width="100" height="100" fill="url(#dots)"/>
    <line x1="80" y1="130" x2="80" y2="230"/><line x1="100" y1="130" x2="100" y2="230"/><line x1="120" y1="130" x2="120" y2="230"/><line x1="140" y1="130" x2="140" y2="230"/>
    <line x1="60" y1="150" x2="160" y2="150"/><line x1="60" y1="170" x2="160" y2="170"/><line x1="60" y1="190" x2="160" y2="190"/><line x1="60" y1="210" x2="160" y2="210"/>
  </g>
  <rect x="80" y="150" width="20" height="20" fill="#1F3B5C"/><rect x="120" y="190" width="20" height="20" fill="#1F3B5C"/><rect x="100" y="170" width="20" height="20" fill="#555555"/>

  <!-- stage 2: edges -->
  <g stroke="#111111" stroke-width="4">
    <line x1="240" y1="140" x2="290" y2="140"/>
    <line x1="315" y1="125" x2="315" y2="175"/>
    <line x1="240" y1="230" x2="285" y2="185"/>
    <line x1="310" y1="190" x2="355" y2="235"/>
  </g>

  <!-- stage 3: textures and shapes -->
  <circle cx="445" cy="150" r="24" fill="none" stroke="#111111" stroke-width="3.5"/>
  <path d="M495 130 L535 130 L535 170" fill="none" stroke="#111111" stroke-width="3.5"/>
  <path d="M425 205 l10 20 l10 -20 l10 20 l10 -20 l10 20" fill="none" stroke="#111111" stroke-width="3"/>
  <rect x="495" y="200" width="40" height="30" fill="none" stroke="#111111" stroke-width="3.5"/>

  <!-- stage 4: parts -->
  <ellipse cx="625" cy="150" rx="22" ry="13" fill="none" stroke="#111111" stroke-width="3.5"/>
  <circle cx="625" cy="150" r="6" fill="#111111"/>
  <circle cx="700" cy="150" r="20" fill="none" stroke="#111111" stroke-width="5"/>
  <circle cx="700" cy="150" r="6" fill="#111111"/>
  <path d="M610 215 Q 630 235 650 215" fill="none" stroke="#111111" stroke-width="3.5"/>
  <rect x="680" y="200" width="40" height="28" fill="none" stroke="#111111" stroke-width="3.5"/>
  <line x1="700" y1="200" x2="700" y2="228" stroke="#111111" stroke-width="2"/>

  <!-- stage 5: objects -->
  <circle cx="815" cy="160" r="34" fill="none" stroke="#111111" stroke-width="3.5"/>
  <circle cx="803" cy="152" r="4" fill="#111111"/><circle cx="827" cy="152" r="4" fill="#111111"/>
  <path d="M803 172 Q 815 182 827 172" fill="none" stroke="#111111" stroke-width="3"/>
  <path d="M855 225 L870 205 L905 205 L918 225 Z" fill="none" stroke="#111111" stroke-width="3"/>
  <rect x="845" y="225" width="80" height="18" fill="none" stroke="#111111" stroke-width="3"/>
  <circle cx="862" cy="247" r="8" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <circle cx="908" cy="247" r="8" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>

  <!-- labels -->
  <g font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">
    <text x="110" y="285">Raw pixels</text>
    <text x="295" y="285">Edges</text>
    <text x="480" y="285">Shapes, textures</text>
    <text x="665" y="285">Parts</text>
    <text x="850" y="285">Objects</text>
  </g>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="110" y="306">input image</text>
    <text x="295" y="306">early layers</text>
    <text x="480" y="306">middle layers</text>
    <text x="665" y="306">later layers</text>
    <text x="850" y="306">final layers</text>
  </g>

  <!-- arrows -->
  <g stroke="#222222" stroke-width="2.5">
    <line x1="190" y1="205" x2="211" y2="205" marker-end="url(#arrow)"/>
    <line x1="375" y1="205" x2="396" y2="205" marker-end="url(#arrow)"/>
    <line x1="560" y1="205" x2="581" y2="205" marker-end="url(#arrow)"/>
    <line x1="745" y1="205" x2="766" y2="205" marker-end="url(#arrow)"/>
  </g>

  <!-- depth bar -->
  <line x1="60" y1="370" x2="900" y2="370" stroke="#1F3B5C" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="330" y="356" width="300" height="28" fill="#FFFFFF"/>
  <text x="480" y="376" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">increasing depth and abstraction</text>

  <rect x="90" y="410" width="780" height="70" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="480" y="438" text-anchor="middle" font-size="15" fill="#111111">None of these features is programmed. Each emerges because it helps the final layer</text>
  <text x="480" y="462" text-anchor="middle" font-size="15" fill="#111111">reduce its error on the labelled training images.</text>

  <text x="480" y="530" text-anchor="middle" font-size="13" fill="#333333">Simplified drawing of the pattern repeatedly found when researchers visualised trained image networks.</text>
</svg>
