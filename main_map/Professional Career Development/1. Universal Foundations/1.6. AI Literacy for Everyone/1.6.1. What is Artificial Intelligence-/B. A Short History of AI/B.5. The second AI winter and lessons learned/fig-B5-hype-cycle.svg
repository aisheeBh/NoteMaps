<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The expert-systems era on the hype-cycle curve</title>
  <desc>A hype-cycle curve rises to a peak of inflated expectations, falls into a trough of disillusionment and climbs gently to a plateau. Expert-system events are placed along it: early systems such as XCON around 1980 as the trigger, the boom and LISP machines around 1984 to 1986 at the peak, the collapse of 1987 to 1993 in the trough, and rules engines in ordinary business software from the later 1990s on the slope and plateau.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Expert systems through the hype cycle</text>

  <line x1="100" y1="450" x2="900" y2="450" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="100" y1="450" x2="100" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="500" y="476" text-anchor="middle" font-size="16" fill="#111111">Time</text>
  <text x="60" y="260" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 60 260)">Expectations</text>

  <path d="M110 430 C 200 420, 230 110, 290 105 C 350 100, 380 390, 460 390 C 540 390, 600 300, 700 285 C 780 275, 840 275, 890 275" fill="none" stroke="#1F3B5C" stroke-width="4.5"/>

  <g stroke="#555555" stroke-width="1.5" stroke-dasharray="3 4">
    <line x1="220" y1="450" x2="220" y2="300"/>
    <line x1="360" y1="450" x2="360" y2="300"/>
    <line x1="560" y1="450" x2="560" y2="350"/>
    <line x1="720" y1="450" x2="720" y2="300"/>
  </g>

  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="160" y="500" font-weight="bold">Trigger</text>
    <text x="290" y="500" font-weight="bold">Peak</text>
    <text x="460" y="500" font-weight="bold">Trough</text>
    <text x="640" y="500" font-weight="bold">Slope</text>
    <text x="810" y="500" font-weight="bold">Plateau</text>
  </g>

  <circle cx="190" cy="330" r="8" fill="#111111"/>
  <rect x="112" y="340" width="100" height="44" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="162" y="359" text-anchor="middle" font-size="14" fill="#111111">XCON and</text>
  <text x="162" y="377" text-anchor="middle" font-size="14" fill="#111111">MYCIN</text>

  <circle cx="290" cy="105" r="8" fill="#111111"/>
  <rect x="310" y="76" width="210" height="44" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="415" y="95" text-anchor="middle" font-size="14" fill="#111111">1984-86: start-ups, LISP</text>
  <text x="415" y="113" text-anchor="middle" font-size="14" fill="#111111">machines, national plans</text>

  <circle cx="460" cy="390" r="8" fill="#111111"/>
  <rect x="380" y="402" width="160" height="44" fill="#FFFFFF" stroke="#8B0000" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="460" y="421" text-anchor="middle" font-size="14" fill="#111111">1987-93: collapse,</text>
  <text x="460" y="439" text-anchor="middle" font-size="14" fill="#111111">"AI" stigmatised</text>

  <circle cx="640" cy="298" r="8" fill="#111111"/>
  <rect x="560" y="200" width="170" height="44" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="645" y="219" text-anchor="middle" font-size="14" fill="#111111">rebranded as</text>
  <text x="645" y="237" text-anchor="middle" font-size="14" fill="#111111">business rules</text>

  <circle cx="820" cy="275" r="8" fill="#111111"/>
  <rect x="740" y="180" width="160" height="62" fill="#FFFFFF" stroke="#1E5E24" stroke-width="2"/>
  <text x="820" y="199" text-anchor="middle" font-size="14" fill="#111111">rules engines inside</text>
  <text x="820" y="217" text-anchor="middle" font-size="14" fill="#111111">everyday software,</text>
  <text x="820" y="235" text-anchor="middle" font-size="14" fill="#111111">rarely called AI</text>

  <text x="480" y="540" text-anchor="middle" font-size="15" fill="#111111">Phases follow Gartner's 1995 model; the curve is a heuristic, not a measured trend.</text>
  <text x="480" y="566" text-anchor="middle" font-size="13" fill="#333333">Schematic; not plotted from a single dataset.</text>
</svg>
