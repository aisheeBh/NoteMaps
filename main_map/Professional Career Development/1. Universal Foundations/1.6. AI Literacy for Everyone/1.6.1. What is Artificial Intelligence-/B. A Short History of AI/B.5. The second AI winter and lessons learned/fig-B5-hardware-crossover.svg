<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Specialised LISP machines against general-purpose computers</title>
  <desc>Schematic chart from 1980 to 1992. Performance per dollar for running AI software rises slowly for specialised LISP machines and rapidly for general-purpose workstations and personal computers, which overtake the LISP machines around 1987, when the LISP machine market collapses.</desc>
  <defs>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">General-purpose computers improved faster than specialised ones</text>

  <rect x="565" y="70" width="315" height="370" fill="url(#lines)" opacity="0.45"/>
  <rect x="640" y="400" width="190" height="28" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
  <text x="735" y="420" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">market collapse</text>

  <line x1="120" y1="440" x2="900" y2="440" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="440" x2="120" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="70" y="255" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 70 255)">AI performance per dollar</text>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="120" y="462">1980</text><text x="250" y="462">1982</text><text x="380" y="462">1984</text>
    <text x="510" y="462">1986</text><text x="640" y="462">1988</text><text x="770" y="462">1990</text><text x="880" y="462">1992</text>
  </g>

  <path d="M120 330 C 300 300, 600 270, 880 245" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <path d="M120 420 C 400 410, 520 330, 600 270 C 680 210, 780 130, 880 85" fill="none" stroke="#7A5200" stroke-width="4" stroke-dasharray="10 6"/>

  <circle cx="575" cy="279" r="9" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <line x1="575" y1="268" x2="520" y2="200" stroke="#222222" stroke-width="1.5"/>
  <rect x="380" y="160" width="190" height="44" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="475" y="179" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">crossover,</text>
  <text x="475" y="197" text-anchor="middle" font-size="14" fill="#111111">about 1987</text>

  <rect x="160" y="262" width="260" height="44" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="290" y="281" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">LISP machines</text>
  <text x="290" y="299" text-anchor="middle" font-size="14" fill="#111111">small runs, slow improvement</text>

  <rect x="180" y="356" width="300" height="44" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="330" y="375" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">General workstations and PCs</text>
  <text x="330" y="393" text-anchor="middle" font-size="14" fill="#111111">mass-market chips, fast improvement</text>

  <text x="480" y="500" text-anchor="middle" font-size="15" fill="#111111">Once ordinary machines ran AI software well, buyers no longer needed a separate, costly computer.</text>
  <text x="480" y="536" text-anchor="middle" font-size="13" fill="#333333">Schematic; not plotted from a single dataset. The crossover date is approximate.</text>
</svg>
