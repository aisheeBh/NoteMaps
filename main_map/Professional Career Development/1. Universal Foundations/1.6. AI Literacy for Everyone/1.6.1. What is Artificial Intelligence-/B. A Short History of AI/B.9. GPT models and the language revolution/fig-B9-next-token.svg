<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Next-token probabilities after a prompt</title>
  <desc>The prompt reads: The patient was given. Horizontal bars show illustrative probabilities a language model might assign to the next token: antibiotics 22 per cent, a 18, oxygen 12, medication 10, the 8, an 6, fluids 5, and all other tokens together 19. One token is chosen, appended, and the process repeats.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">A language model scores every possible next token</text>

  <rect x="60" y="64" width="380" height="44" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="250" y="93" text-anchor="middle" font-size="18" fill="#111111">"The patient was given ..."</text>
  <line x1="440" y1="86" x2="500" y2="86" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="505" y="64" width="400" height="44" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="705" y="93" text-anchor="middle" font-size="16" fill="#111111">probability for each candidate next token</text>

  <g font-size="16" fill="#111111" text-anchor="end">
    <text x="230" y="153">antibiotics</text>
    <text x="230" y="193">a</text>
    <text x="230" y="233">oxygen</text>
    <text x="230" y="273">medication</text>
    <text x="230" y="313">the</text>
    <text x="230" y="353">an</text>
    <text x="230" y="393">fluids</text>
    <text x="230" y="433">all others</text>
  </g>
  <!-- scale: 1% = 25px, start x=245 -->
  <rect x="245" y="134" width="550" height="26" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <rect x="245" y="174" width="450" height="26" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="245" y="214" width="300" height="26" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="245" y="254" width="250" height="26" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="245" y="294" width="200" height="26" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="245" y="334" width="150" height="26" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="245" y="374" width="125" height="26" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="245" y="414" width="475" height="26" fill="#E6E6E6" stroke="#555555" stroke-width="2" stroke-dasharray="2 4"/>

  <g font-size="15" font-weight="bold" fill="#111111">
    <text x="805" y="153">22%  chosen</text>
    <text x="705" y="193">18%</text>
    <text x="555" y="233">12%</text>
    <text x="505" y="273">10%</text>
    <text x="455" y="313">8%</text>
    <text x="405" y="353">6%</text>
    <text x="380" y="393">5%</text>
    <text x="730" y="433">19%, thousands of tokens</text>
  </g>

  <rect x="120" y="462" width="720" height="34" fill="#FFFFFF" stroke="#1E5E24" stroke-width="2"/>
  <text x="480" y="485" text-anchor="middle" font-size="15" fill="#111111">The chosen token is appended to the text, and the model predicts again, one token at a time.</text>

  <text x="480" y="536" text-anchor="middle" font-size="13" fill="#333333">Illustrative probabilities, not taken from a real model.</text>
</svg>
