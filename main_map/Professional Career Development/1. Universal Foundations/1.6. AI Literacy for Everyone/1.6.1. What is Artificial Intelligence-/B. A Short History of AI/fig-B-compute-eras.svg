<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Two eras of growth in training computation</title>
  <desc>Schematic chart on a logarithmic scale from 1950 to 2025. Before about 2010 the computation used to train notable AI systems rises along a gentle line, doubling roughly every 20 months. After about 2010 the line becomes much steeper, doubling roughly every six months. Two published estimates are marked: AlexNet in 2012 at about 5 times 10 to the 17 operations and GPT-3 in 2020 at about 3 times 10 to the 23.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Training computation took off after 2010</text>
  <text x="480" y="60" text-anchor="middle" font-size="15" fill="#111111">Each gridline is 100,000 times the one below</text>

  <rect x="728" y="80" width="152" height="360" fill="url(#hatch)" opacity="0.4"/>

  <line x1="120" y1="440" x2="900" y2="440" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="440" x2="120" y2="72" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g stroke="#CCCCCC" stroke-width="1" stroke-dasharray="3 4">
    <line x1="120" y1="395" x2="880" y2="395"/><line x1="120" y1="320" x2="880" y2="320"/><line x1="120" y1="245" x2="880" y2="245"/>
    <line x1="120" y1="170" x2="880" y2="170"/><line x1="120" y1="95" x2="880" y2="95"/>
  </g>
  <g font-size="14" fill="#111111" text-anchor="end">
    <text x="112" y="399">10^5</text><text x="112" y="324">10^10</text><text x="112" y="249">10^15</text><text x="112" y="174">10^20</text><text x="112" y="99">10^25</text>
  </g>
  <text x="50" y="260" text-anchor="middle" font-size="15" fill="#111111" transform="rotate(-90 50 260)">Operations used in training</text>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="120" y="462">1950</text><text x="221" y="462">1960</text><text x="322" y="462">1970</text><text x="424" y="462">1980</text>
    <text x="525" y="462">1990</text><text x="626" y="462">2000</text><text x="728" y="462">2010</text><text x="829" y="462">2020</text>
  </g>

  <line x1="140" y1="410" x2="728" y2="245" stroke="#7A5200" stroke-width="4" stroke-dasharray="10 6"/>
  <line x1="728" y1="245" x2="880" y2="95" stroke="#1F3B5C" stroke-width="5"/>

  <circle cx="748" cy="204" r="8" fill="#111111"/>
  <rect x="600" y="186" width="136" height="26" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="668" y="204" text-anchor="middle" font-size="14" fill="#111111">AlexNet, 2012</text>
  <circle cx="829" cy="117" r="8" fill="#111111"/>
  <rect x="680" y="104" width="130" height="26" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="745" y="122" text-anchor="middle" font-size="14" fill="#111111">GPT-3, 2020</text>

  <rect x="250" y="270" width="300" height="44" fill="#FFFFFF" stroke="#7A5200" stroke-width="1.5"/>
  <text x="400" y="289" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Before 2010: doubling about</text>
  <text x="400" y="307" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">every 20 months</text>

  <rect x="740" y="300" width="140" height="62" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="810" y="320" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">After 2010:</text>
  <text x="810" y="338" text-anchor="middle" font-size="14" fill="#111111">doubling about</text>
  <text x="810" y="354" text-anchor="middle" font-size="14" fill="#111111">every 6 months</text>

  <text x="480" y="500" text-anchor="middle" font-size="15" fill="#111111">The steeper era reflects GPUs, data centres and far larger budgets for single training runs.</text>
  <text x="480" y="536" text-anchor="middle" font-size="13" fill="#333333">Schematic trend lines based on a 2022 analysis of notable systems; the two marked points use published estimates.</text>
</svg>
