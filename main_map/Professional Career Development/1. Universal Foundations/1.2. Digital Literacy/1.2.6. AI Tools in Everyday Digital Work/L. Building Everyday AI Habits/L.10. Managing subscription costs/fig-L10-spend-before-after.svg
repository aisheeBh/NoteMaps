<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Monthly AI spending before and after consolidation</title>
  <desc>Two stacked bars. Before: core assistant 20, second assistant 20, premium upgrade 80, writing tool 12, transcription 15, image generator 10, research tool 20, total 177. After: core assistant 20 and transcription 15, total 35.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Monthly AI spending before and after consolidation</text>
  <text x="246" y="160" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Before</text>
  <rect x="260" y="120" width="67" height="70" rx="0" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <rect x="327" y="120" width="67" height="70" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="1.5" stroke-dasharray="3 3"/>
  <rect x="395" y="120" width="269" height="70" rx="0" fill="#E6E6E6" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="529" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">premium upgrade 80</text>
  <rect x="664" y="120" width="40" height="70" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="1.5" stroke-dasharray="3 3"/>
  <rect x="705" y="120" width="51" height="70" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="1.5"/>
  <rect x="755" y="120" width="34" height="70" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="1.5" stroke-dasharray="3 3"/>
  <rect x="789" y="120" width="67" height="70" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="864" y="160" text-anchor="start" font-size="14" font-weight="bold" fill="#111111">177 </text>
  <text x="246" y="370" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">After</text>
  <rect x="260" y="330" width="67" height="70" rx="0" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <rect x="327" y="330" width="51" height="70" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="1.5"/>
  <text x="386" y="370" text-anchor="start" font-size="14" font-weight="bold" fill="#111111">35 </text>
  <line x1="260" y1="410" x2="900" y2="410" stroke="#222222" stroke-width="1.5"/>
  <line x1="260" y1="410" x2="260" y2="415" stroke="#222222" stroke-width="1.5"/>
  <text x="260" y="432" text-anchor="middle" font-size="13" fill="#111111">0</text>
  <line x1="428" y1="410" x2="428" y2="415" stroke="#222222" stroke-width="1.5"/>
  <text x="428" y="432" text-anchor="middle" font-size="13" fill="#111111">50</text>
  <line x1="597" y1="410" x2="597" y2="415" stroke="#222222" stroke-width="1.5"/>
  <text x="597" y="432" text-anchor="middle" font-size="13" fill="#111111">100</text>
  <line x1="765" y1="410" x2="765" y2="415" stroke="#222222" stroke-width="1.5"/>
  <text x="765" y="432" text-anchor="middle" font-size="13" fill="#111111">150</text>
  <rect x="30" y="456" width="26" height="18" rx="0" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="64" y="470" text-anchor="start" font-size="14" fill="#111111">core assistant</text>
  <rect x="178" y="456" width="26" height="18" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="1.5"/>
  <text x="212" y="470" text-anchor="start" font-size="14" fill="#111111">specialist kept</text>
  <rect x="333" y="456" width="26" height="18" rx="0" fill="#E6E6E6" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="367" y="470" text-anchor="start" font-size="14" fill="#111111">unreversed upgrade</text>
  <rect x="509" y="456" width="26" height="18" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="543" y="470" text-anchor="start" font-size="14" fill="#111111">overlapping or rarely used</text>
  <text x="480" y="524" text-anchor="middle" font-size="13" fill="#333333">Illustrative figures from the worked example; any currency.</text>
</svg>
