  <rect x="540" y="194" width="100" height="54" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <rect x="640" y="194" width="100" height="54" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <rect x="752" y="206" width="26" height="30" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="786" y="226" text-anchor="start" font-size="14" fill="#111111">overlap x3</text>
  <text x="226" y="280" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Making slides</text>
  <rect x="240" y="248" width="100" height="54" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <rect x="340" y="248" width="100" height="54" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <rect x="440" y="248" width="100" height="54" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <rect x="470" y="258" width="40" height="34" rx="4" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <rect x="540" y="248" width="100" height="54" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <rect x="640" y="248" width="100" height="54" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <rect x="670" y="258" width="40" height="34" rx="4" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <rect x="752" y="260" width="26" height="30" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="786" y="280" text-anchor="start" font-size="14" fill="#111111">overlap</text>
  <text x="226" y="334" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Transcribing interviews</text>
  <rect x="240" y="302" width="100" height="54" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <rect x="340" y="302" width="100" height="54" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <rect x="440" y="302" width="100" height="54" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <rect x="540" y="302" width="100" height="54" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <rect x="570" y="312" width="40" height="34" rx="4" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <rect x="640" y="302" width="100" height="54" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <rect x="752" y="314" width="26" height="30" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="1.5"/>
  <text x="786" y="334" text-anchor="start" font-size="14" fill="#111111">one tool</text>
  <text x="226" y="388" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Research briefs</text>
  <rect x="240" y="356" width="100" height="54" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <rect x="270" y="366" width="40" height="34" rx="4" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <rect x="340" y="356" width="100" height="54" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <rect x="370" y="366" width="40" height="34" rx="4" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <rect x="440" y="356" width="100" height="54" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <rect x="540" y="356" width="100" height="54" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <rect x="640" y="356" width="100" height="54" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <rect x="752" y="368" width="26" height="30" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="786" y="388" text-anchor="start" font-size="14" fill="#111111">overlap</text>
  <text x="226" y="442" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Checking figures</text>
  <rect x="240" y="410" width="100" height="54" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <rect x="340" y="410" width="100" height="54" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <rect x="440" y="410" width="100" height="54" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <rect x="540" y="410" width="100" height="54" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <rect x="640" y="410" width="100" height="54" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <rect x="752" y="422" width="26" height="30" rx="0" fill="#E6E6E6" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="786" y="442" text-anchor="start" font-size="14" fill="#111111">gap: done by hand</text>
  <text x="480" y="504" text-anchor="middle" font-size="15" font-style="italic" fill="#111111">Rows with several filled cells are overlap to consolidate; an empty row may be a deliberate choice.</text>
  <text x="480" y="584" text-anchor="middle" font-size="13" fill="#333333">Illustrative grid for one person; the tools and tasks are examples.</text>
</svg>
