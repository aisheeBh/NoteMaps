<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Where the time goes: one task, with and without AI</title>
  <desc>Three horizontal bars. Without AI the task takes 50 minutes of writing. The naive view of AI counts only 2 minutes of generation. The full picture with AI adds preparation 8, waiting 2, review 10, correction 12, iteration 5 and later rework 3, totalling 40 minutes, a net saving of 10 minutes.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Where the time goes: one task, with and without AI</text>
  <text x="246" y="153" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Without AI</text>
  <rect x="260" y="120" width="582" height="56" rx="0" fill="#E6E6E6" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="551" y="153" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">writing and editing 50</text>
  <text x="850" y="153" text-anchor="start" font-size="14" font-weight="bold" fill="#111111">50 min</text>
  <text x="246" y="256" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">With AI:</text>
  <text x="246" y="274" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">naive view</text>
  <rect x="260" y="232" width="23" height="56" rx="0" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="291" y="265" text-anchor="start" font-size="14" font-weight="bold" fill="#111111">2 min</text>
  <text x="246" y="368" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">With AI:</text>
  <text x="246" y="386" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">full picture</text>
  <rect x="260" y="344" width="93" height="56" rx="0" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="1.5"/>
  <text x="307" y="377" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">prep 8</text>
  <rect x="353" y="344" width="23" height="56" rx="0" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <rect x="376" y="344" width="116" height="56" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/>
  <rect x="395" y="361" width="79" height="21" fill="#FFFFFF"/>
  <text x="435" y="377" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">review 10</text>
  <rect x="493" y="344" width="140" height="56" rx="0" fill="url(#dots)" stroke="#7A5200" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="519" y="361" width="87" height="21" fill="#FFFFFF"/>
  <text x="563" y="377" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">correct 12</text>
  <rect x="632" y="344" width="58" height="56" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="1.5"/>
  <rect x="691" y="344" width="35" height="56" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="733" y="377" text-anchor="start" font-size="14" font-weight="bold" fill="#111111">40 min</text>
  <line x1="260" y1="410" x2="900" y2="410" stroke="#222222" stroke-width="1.5"/>
  <line x1="260" y1="410" x2="260" y2="415" stroke="#222222" stroke-width="1.5"/>
  <text x="260" y="432" text-anchor="middle" font-size="13" fill="#111111">0</text>
  <line x1="376" y1="410" x2="376" y2="415" stroke="#222222" stroke-width="1.5"/>
  <text x="376" y="432" text-anchor="middle" font-size="13" fill="#111111">10</text>
  <line x1="493" y1="410" x2="493" y2="415" stroke="#222222" stroke-width="1.5"/>
  <text x="493" y="432" text-anchor="middle" font-size="13" fill="#111111">20</text>
  <line x1="609" y1="410" x2="609" y2="415" stroke="#222222" stroke-width="1.5"/>
  <text x="609" y="432" text-anchor="middle" font-size="13" fill="#111111">30</text>
  <line x1="725" y1="410" x2="725" y2="415" stroke="#222222" stroke-width="1.5"/>
  <text x="725" y="432" text-anchor="middle" font-size="13" fill="#111111">40</text>
  <line x1="842" y1="410" x2="842" y2="415" stroke="#222222" stroke-width="1.5"/>
  <text x="842" y="432" text-anchor="middle" font-size="13" fill="#111111">50</text>
  <rect x="30" y="456" width="26" height="18" rx="0" fill="#E6E6E6" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="64" y="470" text-anchor="start" font-size="14" fill="#111111">unaided work</text>
  <rect x="164" y="456" width="26" height="18" rx="0" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="1.5"/>
  <text x="198" y="470" text-anchor="start" font-size="14" fill="#111111">preparation</text>
  <rect x="291" y="456" width="26" height="18" rx="0" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="325" y="470" text-anchor="start" font-size="14" fill="#111111">waiting</text>
  <rect x="390" y="456" width="26" height="18" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/>
  <text x="424" y="470" text-anchor="start" font-size="14" fill="#111111">review</text>
  <rect x="482" y="456" width="26" height="18" rx="0" fill="url(#dots)" stroke="#7A5200" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="516" y="470" text-anchor="start" font-size="14" fill="#111111">correction</text>
  <rect x="602" y="456" width="26" height="18" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="1.5"/>
  <text x="636" y="470" text-anchor="start" font-size="14" fill="#111111">iteration</text>
  <rect x="715" y="456" width="26" height="18" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="749" y="470" text-anchor="start" font-size="14" fill="#111111">later rework</text>
  <text x="480" y="524" text-anchor="middle" font-size="13" fill="#333333">Illustrative figures for a single report section; the net saving is 50 − 40 = 10 minutes.</text>
</svg>
