<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 658" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>From raw model to generative AI product</title>
  <desc>Six stacked layers: user interface at the top, then guardrails and checks, tools and connectors, retrieval of documents, system prompt and settings, and the trained model at the base.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">From raw model to generative AI product</text>
  <rect x="160" y="71" width="770" height="85" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="180" y="120" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Interface</text>
  <text x="405" y="109" text-anchor="start" font-size="14.5" fill="#111111">Chat box, side panel, voice or button where the user makes a</text>
  <text x="405" y="128" text-anchor="start" font-size="14.5" fill="#111111">request.</text>
  <rect x="160" y="166" width="770" height="85" rx="8" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="180" y="215" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Guardrails and checks</text>
  <text x="405" y="204" text-anchor="start" font-size="14.5" fill="#111111">Rules that block, filter or escalate inputs and outputs; human</text>
  <text x="405" y="223" text-anchor="start" font-size="14.5" fill="#111111">approval steps.</text>
  <rect x="160" y="262" width="770" height="85" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="180" y="310" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Tools and connectors</text>
  <text x="405" y="300" text-anchor="start" font-size="14.5" fill="#111111">Calculators, code execution, search, email, calendars and</text>
  <text x="405" y="319" text-anchor="start" font-size="14.5" fill="#111111">business systems.</text>
  <rect x="160" y="357" width="770" height="85" rx="8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="172" y="366" width="745" height="67" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="180" y="406" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Retrieval</text>
  <text x="405" y="395" text-anchor="start" font-size="14.5" fill="#111111">Search over trusted documents, passages supplied to the model</text>
  <text x="405" y="414" text-anchor="start" font-size="14.5" fill="#111111">as context.</text>
  <rect x="160" y="452" width="770" height="85" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="180" y="491" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">System prompt and</text>
  <text x="180" y="511" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">settings</text>
  <text x="405" y="490" text-anchor="start" font-size="14.5" fill="#111111">Hidden instructions, temperature, output format, model</text>
  <text x="405" y="510" text-anchor="start" font-size="14.5" fill="#111111">version.</text>
  <rect x="160" y="548" width="770" height="85" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="180" y="596" text-anchor="start" font-size="17" font-weight="bold" fill="#FFFFFF">Trained model</text>
  <text x="405" y="586" text-anchor="start" font-size="14.5" fill="#FFFFFF">The large language model itself: learned parameters that</text>
  <text x="405" y="605" text-anchor="start" font-size="14.5" fill="#FFFFFF">generate tokens.</text>
  <line x1="80" y1="626" x2="80" y2="78" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <rect x="18" y="106" width="124" height="44" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="80" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">What the user</text>
  <text x="80" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">sees</text>
  <rect x="18" y="550" width="124" height="44" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="80" y="566" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">What does the</text>
  <text x="80" y="584" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">generating</text>
</svg>
