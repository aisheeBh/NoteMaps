<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Where behaviour comes from</title>
  <desc>Two panels. Traditional software: people write rules, the computer executes them, giving exact repeatable output. Generative AI: data trains a model, prompts steer it, giving flexible but probabilistic output.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Where behaviour comes from</text>
  <rect x="24" y="70" width="447" height="238" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="24" y="70" width="447" height="38" rx="8" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="248" y="98" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Traditional software</text>
  <circle cx="40" cy="131" r="3.2" fill="#111111"/>
  <text x="50" y="136" text-anchor="start" font-size="14" fill="#111111">Programmers analyse the problem and write exact steps.</text>
  <circle cx="40" cy="158" r="3.2" fill="#111111"/>
  <text x="50" y="162" text-anchor="start" font-size="14" fill="#111111">The computer executes the code literally.</text>
  <circle cx="40" cy="184" r="3.2" fill="#111111"/>
  <text x="50" y="189" text-anchor="start" font-size="14" fill="#111111">Same input gives the same output, every time.</text>
  <circle cx="40" cy="210" r="3.2" fill="#111111"/>
  <text x="50" y="216" text-anchor="start" font-size="14" fill="#111111">Every result traces to a line of code.</text>
  <circle cx="40" cy="237" r="3.2" fill="#111111"/>
  <text x="50" y="242" text-anchor="start" font-size="14" fill="#111111">Unanticipated input produces an error.</text>
  <rect x="489" y="70" width="447" height="238" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="489" y="70" width="447" height="38" rx="8" fill="#FFFFFF" stroke="#7A5200" stroke-width="2"/>
  <text x="712" y="98" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Generative AI</text>
  <circle cx="505" cy="131" r="3.2" fill="#111111"/>
  <text x="515" y="136" text-anchor="start" font-size="14" fill="#111111">Engineers train a model on vast example data.</text>
  <circle cx="505" cy="158" r="3.2" fill="#111111"/>
  <text x="515" y="162" text-anchor="start" font-size="14" fill="#111111">Behaviour lives in billions of learned parameters.</text>
  <circle cx="505" cy="184" r="3.2" fill="#111111"/>
  <text x="515" y="189" text-anchor="start" font-size="14" fill="#111111">Plain-language prompts steer the model at use time.</text>
  <circle cx="505" cy="210" r="3.2" fill="#111111"/>
  <text x="515" y="216" text-anchor="start" font-size="14" fill="#111111">Replies vary and cannot be traced line by line.</text>
  <circle cx="505" cy="237" r="3.2" fill="#111111"/>
  <text x="515" y="242" text-anchor="start" font-size="14" fill="#111111">Unanticipated input still gets a fluent attempt.</text>
</svg>
