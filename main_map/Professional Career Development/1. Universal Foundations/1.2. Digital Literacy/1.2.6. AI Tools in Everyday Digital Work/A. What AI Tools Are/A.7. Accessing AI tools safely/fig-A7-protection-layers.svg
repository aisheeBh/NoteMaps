<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 658" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Layers of protection for safe access</title>
  <desc>Six layers: approved tools catalogue; identity with single sign-on and phishing-resistant MFA; managed devices and browsers with extension allow-lists; network and cloud controls on unapproved AI sites; data-loss prevention and restricted app consent; logging, monitoring and response.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Layers of protection for safe access</text>
  <rect x="160" y="71" width="770" height="85" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="180" y="120" text-anchor="start" font-size="17" font-weight="bold" fill="#FFFFFF">Approved tools</text>
  <text x="405" y="109" text-anchor="start" font-size="14.5" fill="#FFFFFF">A clear catalogue of permitted tools, plans and uses, with a</text>
  <text x="405" y="128" text-anchor="start" font-size="14.5" fill="#FFFFFF">route to request more.</text>
  <rect x="160" y="166" width="770" height="85" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="180" y="215" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Identity</text>
  <text x="405" y="204" text-anchor="start" font-size="14.5" fill="#111111">Single sign-on, phishing-resistant MFA, automatic removal of</text>
  <text x="405" y="223" text-anchor="start" font-size="14.5" fill="#111111">leavers.</text>
  <rect x="160" y="262" width="770" height="85" rx="8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="172" y="271" width="745" height="67" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="180" y="310" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Devices and browsers</text>
  <text x="405" y="300" text-anchor="start" font-size="14.5" fill="#111111">Managed, updated devices; approved extensions only;</text>
  <text x="405" y="319" text-anchor="start" font-size="14.5" fill="#111111">conditional access.</text>
  <rect x="160" y="357" width="770" height="85" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="180" y="396" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Network and cloud</text>
  <text x="180" y="416" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">controls</text>
  <text x="405" y="395" text-anchor="start" font-size="14.5" fill="#111111">Warn about or block unapproved AI sites; inspect risky</text>
  <text x="405" y="414" text-anchor="start" font-size="14.5" fill="#111111">uploads.</text>
  <rect x="160" y="452" width="770" height="85" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="180" y="501" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Data controls</text>
  <text x="405" y="490" text-anchor="start" font-size="14.5" fill="#111111">Data-loss prevention on prompts and uploads; restricted app</text>
  <text x="405" y="510" text-anchor="start" font-size="14.5" fill="#111111">consent.</text>
  <rect x="160" y="548" width="770" height="85" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="180" y="586" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Monitoring and</text>
  <text x="180" y="606" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">response</text>
  <text x="405" y="586" text-anchor="start" font-size="14.5" fill="#111111">Logs of who used what; alerts; a fast route to report and</text>
  <text x="405" y="605" text-anchor="start" font-size="14.5" fill="#111111">contain incidents.</text>
  <line x1="80" y1="626" x2="80" y2="78" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <rect x="18" y="106" width="124" height="26" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="80" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Prevent</text>
  <rect x="18" y="550" width="124" height="44" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="80" y="566" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Detect and</text>
  <text x="80" y="584" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">respond</text>
</svg>
