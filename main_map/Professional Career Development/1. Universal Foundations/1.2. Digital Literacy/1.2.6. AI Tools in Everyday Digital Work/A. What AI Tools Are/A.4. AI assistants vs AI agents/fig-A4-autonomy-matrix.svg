<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>How much autonomy suits the task</title>
  <desc>Two by two grid. Horizontal axis reversibility of actions, irreversible to easily reversed. Vertical axis stakes, low to high. Top left high stakes irreversible: assistant only or approval for every action. Top right high stakes reversible: supervised agent with checkpoints. Bottom left low stakes irreversible: supervised agent with confirmation. Bottom right low stakes reversible: autonomous agent with logging.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">How much autonomy suits the task</text>
  <rect x="176" y="82" width="358" height="198" rx="8" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="187" y="148" width="337" height="69" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="355" y="169" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Assistant, or approve every action</text>
  <text x="355" y="190" text-anchor="middle" font-size="14.5" fill="#111111">Payments, legal filings, deleting data,</text>
  <text x="355" y="209" text-anchor="middle" font-size="14.5" fill="#111111">messages to clients.</text>
  <rect x="546" y="82" width="358" height="198" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="725" y="169" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Supervised agent with checkpoints</text>
  <text x="725" y="190" text-anchor="middle" font-size="14.5" fill="#111111">Editing shared documents, changing</text>
  <text x="725" y="209" text-anchor="middle" font-size="14.5" fill="#111111">configurations with rollback.</text>
  <rect x="176" y="292" width="358" height="198" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="355" y="379" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Agent with confirmation gates</text>
  <text x="355" y="400" text-anchor="middle" font-size="14.5" fill="#111111">Sending routine internal messages, placing</text>
  <text x="355" y="419" text-anchor="middle" font-size="14.5" fill="#111111">small orders.</text>
  <rect x="546" y="292" width="358" height="198" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="725" y="379" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Autonomous agent with logging</text>
  <text x="725" y="400" text-anchor="middle" font-size="14.5" fill="#111111">Gathering research, tidying files, drafting</text>
  <text x="725" y="419" text-anchor="middle" font-size="14.5" fill="#111111">for later review.</text>
  <line x1="170" y1="512" x2="910" y2="512" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="540" y="542" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Reversibility of the actions</text>
  <text x="170" y="542" text-anchor="start" font-size="14" fill="#111111">Irreversible</text>
  <text x="910" y="542" text-anchor="end" font-size="14" fill="#111111">Easily undone</text>
  <line x1="154" y1="496" x2="154" y2="76" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="126" y="286" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111" transform="rotate(-90 126 286)">Stakes of an error</text>
  <text x="100" y="496" text-anchor="start" font-size="14" fill="#111111" transform="rotate(-90 100 496)">Low</text>
  <text x="100" y="76" text-anchor="end" font-size="14" fill="#111111" transform="rotate(-90 100 76)">High</text>
</svg>
