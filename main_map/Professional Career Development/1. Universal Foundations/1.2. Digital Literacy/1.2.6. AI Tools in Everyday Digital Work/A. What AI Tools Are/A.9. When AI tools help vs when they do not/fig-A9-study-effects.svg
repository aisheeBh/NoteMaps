<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 578" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Measured effects of AI assistance</title>
  <desc>Horizontal bars, positive meaning faster or more productive: writing time saved 40 per cent; support issues per hour plus 14 per cent; novice support agents plus 34 per cent; consulting speed inside the frontier plus 25 per cent; small coding task 56 per cent faster; experienced developers on familiar code 19 per cent slower.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Measured effects of AI assistance</text>
  <text x="480" y="66" text-anchor="middle" font-size="15" font-style="italic" fill="#111111">Different tasks, measures and tools: patterns, not comparable numbers</text>
  <text x="326" y="111" text-anchor="end" font-size="14.5" fill="#111111">Writing tasks: time saved (Noy and</text>
  <text x="326" y="129" text-anchor="end" font-size="14.5" fill="#111111">Zhang, 2023)</text>
  <rect x="508" y="96" width="224" height="38" rx="2" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="742" y="120" text-anchor="start" font-size="14.5" font-weight="bold" fill="#111111">+40%</text>
  <text x="326" y="173" text-anchor="end" font-size="14.5" fill="#111111">Support issues resolved per hour,</text>
  <text x="326" y="191" text-anchor="end" font-size="14.5" fill="#111111">all agents (2023)</text>
  <rect x="508" y="158" width="78" height="38" rx="2" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="596" y="182" text-anchor="start" font-size="14.5" font-weight="bold" fill="#111111">+14%</text>
  <text x="326" y="244" text-anchor="end" font-size="14.5" fill="#111111">Same study, novice agents</text>
  <rect x="508" y="220" width="190" height="38" rx="2" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <text x="708" y="244" text-anchor="start" font-size="14.5" font-weight="bold" fill="#111111">+34%</text>
  <text x="326" y="297" text-anchor="end" font-size="14.5" fill="#111111">Consulting tasks inside the</text>
  <text x="326" y="315" text-anchor="end" font-size="14.5" fill="#111111">frontier: speed (2023)</text>
  <rect x="508" y="282" width="140" height="38" rx="2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="658" y="306" text-anchor="start" font-size="14.5" font-weight="bold" fill="#111111">+25%</text>
  <text x="326" y="359" text-anchor="end" font-size="14.5" fill="#111111">Small coding task: speed (Peng,</text>
  <text x="326" y="377" text-anchor="end" font-size="14.5" fill="#111111">2023)</text>
  <rect x="508" y="344" width="314" height="38" rx="2" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="832" y="368" text-anchor="start" font-size="14.5" font-weight="bold" fill="#111111">+56%</text>
  <text x="326" y="421" text-anchor="end" font-size="14.5" fill="#111111">Experts on familiar codebases (METR,</text>
  <text x="326" y="439" text-anchor="end" font-size="14.5" fill="#111111">2025)</text>
  <rect x="402" y="406" width="106" height="38" rx="2" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="353" y="414" width="43" height="22" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="392" y="430" text-anchor="end" font-size="14.5" font-weight="bold" fill="#111111">-19%</text>
  <line x1="508" y1="86" x2="508" y2="468" stroke="#222222" stroke-width="2"/>
  <line x1="340" y1="468" x2="900" y2="468" stroke="#222222" stroke-width="2"/>
  <line x1="340" y1="468" x2="340" y2="474" stroke="#222222" stroke-width="1.5"/>
  <text x="340" y="490" text-anchor="middle" font-size="13.5" fill="#111111">-30%</text>
  <line x1="508" y1="468" x2="508" y2="474" stroke="#222222" stroke-width="1.5"/>
  <text x="508" y="490" text-anchor="middle" font-size="13.5" fill="#111111">0%</text>
  <line x1="676" y1="468" x2="676" y2="474" stroke="#222222" stroke-width="1.5"/>
  <text x="676" y="490" text-anchor="middle" font-size="13.5" fill="#111111">30%</text>
  <line x1="844" y1="468" x2="844" y2="474" stroke="#222222" stroke-width="1.5"/>
  <text x="844" y="490" text-anchor="middle" font-size="13.5" fill="#111111">60%</text>
  <text x="620" y="516" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Change in speed or output with AI (per cent)</text>
  <text x="480" y="562" text-anchor="middle" font-size="13" font-style="italic" fill="#111111">Positive values: faster or more output. Negative: slower.</text>
</svg>
