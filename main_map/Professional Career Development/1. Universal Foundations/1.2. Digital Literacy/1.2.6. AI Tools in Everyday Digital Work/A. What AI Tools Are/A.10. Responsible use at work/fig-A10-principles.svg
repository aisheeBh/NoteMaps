<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Seven principles of responsible use</title>
  <desc>Seven bands, each pairing a principle with the behaviour it requires: accountability, accuracy, transparency, confidentiality, fairness, respect for rights, human oversight.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Seven principles of responsible use</text>
  <rect x="30" y="71" width="900" height="69" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="50" y="112" text-anchor="start" font-size="17" font-weight="bold" fill="#FFFFFF">Accountability</text>
  <text x="275" y="111" text-anchor="start" font-size="14.5" fill="#FFFFFF">Own every output adopted and every action taken in your name.</text>
  <rect x="30" y="150" width="900" height="69" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="50" y="191" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Accuracy</text>
  <text x="275" y="190" text-anchor="start" font-size="14.5" fill="#111111">Verify in proportion to the stakes before relying on or sharing.</text>
  <rect x="30" y="229" width="900" height="69" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="50" y="270" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Transparency</text>
  <text x="275" y="259" text-anchor="start" font-size="14.5" fill="#111111">Disclose AI use where rules require it or the audience relies on</text>
  <text x="275" y="278" text-anchor="start" font-size="14.5" fill="#111111">authorship.</text>
  <rect x="30" y="308" width="900" height="69" rx="8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="42" y="317" width="875" height="51" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="50" y="349" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Confidentiality</text>
  <text x="275" y="348" text-anchor="start" font-size="14.5" fill="#111111">Enter only data that policy and law allow, in approved tools.</text>
  <rect x="30" y="388" width="900" height="69" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="50" y="428" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Fairness</text>
  <text x="275" y="427" text-anchor="start" font-size="14.5" fill="#111111">Test for unfair effects; never let unvalidated tools rank people.</text>
  <rect x="30" y="467" width="900" height="69" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="50" y="507" text-anchor="start" font-size="17" font-weight="bold" fill="#222222">Respect for rights</text>
  <text x="275" y="506" text-anchor="start" font-size="14.5" fill="#222222">Respect copyright, likeness and dignity; no fake media of real people.</text>
  <rect x="30" y="546" width="900" height="69" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="50" y="586" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Human oversight</text>
  <text x="275" y="585" text-anchor="start" font-size="14.5" fill="#111111">People make and explain decisions that affect people.</text>
</svg>
