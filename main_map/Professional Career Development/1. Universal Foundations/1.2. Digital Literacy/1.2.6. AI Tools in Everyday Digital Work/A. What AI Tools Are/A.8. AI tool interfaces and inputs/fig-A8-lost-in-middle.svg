<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 516" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Where in a long input the answer sits</title>
  <desc>Schematic bars showing higher accuracy when the relevant document is at the start or end of a long input and lower accuracy when it is in the middle.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Where in a long input the answer sits</text>
  <text x="480" y="66" text-anchor="middle" font-size="15" font-style="italic" fill="#111111">Pattern reported by Liu and colleagues (2023)</text>
  <text x="326" y="120" text-anchor="end" font-size="14.5" fill="#111111">Relevant passage at the start</text>
  <rect x="340" y="96" width="420" height="38" rx="2" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="770" y="120" text-anchor="start" font-size="14.5" font-weight="bold" fill="#111111">higher</text>
  <text x="326" y="182" text-anchor="end" font-size="14.5" fill="#111111">Early in the input</text>
  <rect x="340" y="158" width="353" height="38" rx="2" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="703" y="182" text-anchor="start" font-size="14.5" font-weight="bold" fill="#111111"></text>
  <text x="326" y="244" text-anchor="end" font-size="14.5" fill="#111111">In the middle</text>
  <rect x="340" y="220" width="291" height="38" rx="2" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="641" y="244" text-anchor="start" font-size="14.5" font-weight="bold" fill="#111111">lowest</text>
  <text x="326" y="306" text-anchor="end" font-size="14.5" fill="#111111">Late in the input</text>
  <rect x="340" y="282" width="336" height="38" rx="2" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="686" y="306" text-anchor="start" font-size="14.5" font-weight="bold" fill="#111111"></text>
  <text x="326" y="368" text-anchor="end" font-size="14.5" fill="#111111">At the end</text>
  <rect x="340" y="344" width="403" height="38" rx="2" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="753" y="368" text-anchor="start" font-size="14.5" font-weight="bold" fill="#111111">higher</text>
  <line x1="340" y1="86" x2="340" y2="406" stroke="#222222" stroke-width="2"/>
  <line x1="340" y1="406" x2="900" y2="406" stroke="#222222" stroke-width="2"/>
  <text x="620" y="454" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Answer accuracy (schematic)</text>
  <text x="480" y="500" text-anchor="middle" font-size="13" font-style="italic" fill="#111111">Schematic; not plotted from a single dataset. Newer models show a weaker dip.</text>
</svg>
