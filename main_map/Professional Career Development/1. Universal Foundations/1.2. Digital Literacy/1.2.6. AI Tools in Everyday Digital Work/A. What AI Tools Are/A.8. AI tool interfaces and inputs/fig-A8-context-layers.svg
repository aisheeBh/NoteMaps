<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 746" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>What the model receives for one reply</title>
  <desc>Stacked layers assembled into the context: system prompt; organisation settings; custom instructions and memory; project files; conversation history; current request; attachments; retrieved content and tool results.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">What the model receives for one reply</text>
  <rect x="160" y="71" width="770" height="84" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="180" y="119" text-anchor="start" font-size="17" font-weight="bold" fill="#FFFFFF">System prompt</text>
  <text x="405" y="109" text-anchor="start" font-size="14.5" fill="#FFFFFF">Hidden product instructions: role, rules, safety limits, date,</text>
  <text x="405" y="128" text-anchor="start" font-size="14.5" fill="#FFFFFF">tools.</text>
  <rect x="160" y="165" width="770" height="84" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="180" y="213" text-anchor="start" font-size="17" font-weight="bold" fill="#222222">Organisation settings</text>
  <text x="405" y="212" text-anchor="start" font-size="14.5" fill="#222222">Policies set by administrators in business tools.</text>
  <rect x="160" y="260" width="770" height="84" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="180" y="298" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Instructions and</text>
  <text x="180" y="318" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">memory</text>
  <text x="405" y="307" text-anchor="start" font-size="14.5" fill="#111111">Saved preferences and facts remembered from earlier chats.</text>
  <rect x="160" y="354" width="770" height="84" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="180" y="402" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Project files</text>
  <text x="405" y="401" text-anchor="start" font-size="14.5" fill="#111111">Reference documents attached to the workspace.</text>
  <rect x="160" y="448" width="770" height="84" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="180" y="496" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Conversation history</text>
  <text x="405" y="495" text-anchor="start" font-size="14.5" fill="#111111">Earlier messages, sometimes summarised or truncated.</text>
  <rect x="160" y="542" width="770" height="84" rx="8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="172" y="551" width="745" height="66" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="180" y="581" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Retrieved content and</text>
  <text x="180" y="601" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">tool results</text>
  <text x="405" y="580" text-anchor="start" font-size="14.5" fill="#111111">Search passages, connected documents, calculation and code</text>
  <text x="405" y="599" text-anchor="start" font-size="14.5" fill="#111111">outputs.</text>
  <rect x="160" y="637" width="770" height="84" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="180" y="675" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Current request and</text>
  <text x="180" y="695" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">attachments</text>
  <text x="405" y="684" text-anchor="start" font-size="14.5" fill="#111111">What the user typed, said, selected or uploaded.</text>
  <line x1="80" y1="714" x2="80" y2="78" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <rect x="18" y="106" width="124" height="62" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="80" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Mostly</text>
  <text x="80" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">invisible to</text>
  <text x="80" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">the user</text>
  <rect x="18" y="638" width="124" height="44" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="80" y="654" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Mostly chosen</text>
  <text x="80" y="672" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">by the user</text>
</svg>
