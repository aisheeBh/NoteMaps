<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Problems in AI assistant answers to news questions</title>
  <desc>Horizontal bars from the 2025 EBU and BBC study: 45 per cent of answers had at least one significant issue; about 31 per cent had significant sourcing problems; about 20 per cent had major accuracy problems; the worst-performing assistant had significant issues in about 76 per cent of answers.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Problems in AI assistant answers to news questions</text>
  <text x="480" y="66" text-anchor="middle" font-size="15" font-style="italic" fill="#111111">22 public-service media organisations, 18 countries, 14 languages (2025)</text>
  <text x="326" y="111" text-anchor="end" font-size="14.5" fill="#111111">Any significant issue, all</text>
  <text x="326" y="129" text-anchor="end" font-size="14.5" fill="#111111">assistants</text>
  <rect x="340" y="96" width="252" height="38" rx="2" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="602" y="120" text-anchor="start" font-size="14.5" font-weight="bold" fill="#111111">45%</text>
  <text x="326" y="182" text-anchor="end" font-size="14.5" fill="#111111">Significant sourcing problems</text>
  <rect x="340" y="158" width="174" height="38" rx="2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="524" y="182" text-anchor="start" font-size="14.5" font-weight="bold" fill="#111111">about 31%</text>
  <text x="326" y="244" text-anchor="end" font-size="14.5" fill="#111111">Major accuracy problems</text>
  <rect x="340" y="220" width="112" height="38" rx="2" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="462" y="244" text-anchor="start" font-size="14.5" font-weight="bold" fill="#111111">about 20%</text>
  <text x="326" y="297" text-anchor="end" font-size="14.5" fill="#111111">Any significant issue, worst</text>
  <text x="326" y="315" text-anchor="end" font-size="14.5" fill="#111111">assistant</text>
  <rect x="340" y="282" width="426" height="38" rx="2" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="776" y="306" text-anchor="start" font-size="14.5" font-weight="bold" fill="#111111">about 76%</text>
  <line x1="340" y1="86" x2="340" y2="344" stroke="#222222" stroke-width="2"/>
  <line x1="340" y1="344" x2="900" y2="344" stroke="#222222" stroke-width="2"/>
  <line x1="340" y1="344" x2="340" y2="350" stroke="#222222" stroke-width="1.5"/>
  <text x="340" y="366" text-anchor="middle" font-size="13.5" fill="#111111">0%</text>
  <line x1="480" y1="344" x2="480" y2="350" stroke="#222222" stroke-width="1.5"/>
  <text x="480" y="366" text-anchor="middle" font-size="13.5" fill="#111111">25%</text>
  <line x1="620" y1="344" x2="620" y2="350" stroke="#222222" stroke-width="1.5"/>
  <text x="620" y="366" text-anchor="middle" font-size="13.5" fill="#111111">50%</text>
  <line x1="760" y1="344" x2="760" y2="350" stroke="#222222" stroke-width="1.5"/>
  <text x="760" y="366" text-anchor="middle" font-size="13.5" fill="#111111">75%</text>
  <line x1="900" y1="344" x2="900" y2="350" stroke="#222222" stroke-width="1.5"/>
  <text x="900" y="366" text-anchor="middle" font-size="13.5" fill="#111111">100%</text>
  <text x="620" y="392" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Share of answers assessed</text>
  <text x="480" y="444" text-anchor="middle" font-size="13" font-style="italic" fill="#111111">News questions only; tools change quickly, so read as kinds of failure, not current rates.</text>
</svg>
