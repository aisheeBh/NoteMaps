<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Four clusters of AI literacy</title>
  <desc>Four stacked clusters: understanding, using, evaluating and shaping AI, with the domains each contains.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Four clusters of AI literacy</text>
  <rect x="160" y="71" width="770" height="88" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="180" y="121" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Understanding</text>
  <text x="405" y="111" text-anchor="start" font-size="14.5" fill="#111111">What AI is; how machine learning and language models work;</text>
  <text x="405" y="130" text-anchor="start" font-size="14.5" fill="#111111">what generative AI produces.</text>
  <rect x="160" y="170" width="770" height="88" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="180" y="220" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Using</text>
  <text x="405" y="209" text-anchor="start" font-size="14.5" fill="#111111">Effective tool use; AI in the workplace; agents and</text>
  <text x="405" y="228" text-anchor="start" font-size="14.5" fill="#111111">assistants; the AI-augmented professional.</text>
  <rect x="160" y="268" width="770" height="88" rx="8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="172" y="277" width="745" height="70" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="180" y="318" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Evaluating</text>
  <text x="405" y="308" text-anchor="start" font-size="14.5" fill="#111111">Critical thinking about claims; ethics and bias; privacy and</text>
  <text x="405" y="327" text-anchor="start" font-size="14.5" fill="#111111">data rights; safety and risk.</text>
  <rect x="160" y="366" width="770" height="88" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="180" y="417" text-anchor="start" font-size="17" font-weight="bold" fill="#FFFFFF">Shaping</text>
  <text x="405" y="406" text-anchor="start" font-size="14.5" fill="#FFFFFF">Society and the future of work; governance and policy;</text>
  <text x="405" y="425" text-anchor="start" font-size="14.5" fill="#FFFFFF">participation in decisions about AI.</text>
  <line x1="80" y1="448" x2="80" y2="78" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <rect x="18" y="106" width="124" height="26" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="80" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Knowing</text>
  <rect x="18" y="390" width="124" height="26" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="80" y="406" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Influencing</text>
</svg>
