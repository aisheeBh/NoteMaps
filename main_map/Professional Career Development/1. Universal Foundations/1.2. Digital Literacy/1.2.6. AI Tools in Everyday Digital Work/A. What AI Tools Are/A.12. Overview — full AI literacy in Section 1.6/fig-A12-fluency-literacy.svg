<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Tool fluency and AI literacy</title>
  <desc>Two panels. Tool fluency: knows where features are, effective prompts, fast on familiar tasks, knowledge dates with the product. AI literacy: knows how AI produces outputs and fails, judges task fit, verifies, protects data and people, transfers across products.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Tool fluency and AI literacy</text>
  <rect x="24" y="70" width="447" height="238" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="24" y="70" width="447" height="38" rx="8" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="248" y="98" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Tool fluency</text>
  <circle cx="40" cy="131" r="3.2" fill="#111111"/>
  <text x="50" y="136" text-anchor="start" font-size="14" fill="#111111">Knows where the features are</text>
  <circle cx="40" cy="158" r="3.2" fill="#111111"/>
  <text x="50" y="162" text-anchor="start" font-size="14" fill="#111111">Has prompts that work for familiar tasks</text>
  <circle cx="40" cy="184" r="3.2" fill="#111111"/>
  <text x="50" y="189" text-anchor="start" font-size="14" fill="#111111">Fast on routine work</text>
  <circle cx="40" cy="210" r="3.2" fill="#111111"/>
  <text x="50" y="216" text-anchor="start" font-size="14" fill="#111111">Knowledge dates when the product changes</text>
  <circle cx="40" cy="237" r="3.2" fill="#111111"/>
  <text x="50" y="242" text-anchor="start" font-size="14" fill="#111111">May miss failures, risks and others' rights</text>
  <rect x="489" y="70" width="447" height="238" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <rect x="489" y="70" width="447" height="38" rx="8" fill="#FFFFFF" stroke="#1E5E24" stroke-width="3"/>
  <text x="712" y="98" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">AI literacy</text>
  <circle cx="505" cy="131" r="3.2" fill="#111111"/>
  <text x="515" y="136" text-anchor="start" font-size="14" fill="#111111">Knows how AI produces outputs and why it fails</text>
  <circle cx="505" cy="158" r="3.2" fill="#111111"/>
  <text x="515" y="162" text-anchor="start" font-size="14" fill="#111111">Judges whether a task suits AI</text>
  <circle cx="505" cy="184" r="3.2" fill="#111111"/>
  <text x="515" y="189" text-anchor="start" font-size="14" fill="#111111">Verifies in proportion to the stakes</text>
  <circle cx="505" cy="210" r="3.2" fill="#111111"/>
  <text x="515" y="216" text-anchor="start" font-size="14" fill="#111111">Protects data and the people affected</text>
  <circle cx="505" cy="237" r="3.2" fill="#111111"/>
  <text x="515" y="242" text-anchor="start" font-size="14" fill="#111111">Transfers across products and years</text>
</svg>
