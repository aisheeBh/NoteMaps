<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Information classes and where they may go</title>
  <desc>Four stacked classes from public to restricted, each stating permitted AI tools: public anywhere; internal approved business tools; confidential approved tools if policy allows; restricted only with specific approval or local tools.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Information classes and where they may go</text>
  <rect x="160" y="71" width="770" height="94" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="180" y="124" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Public</text>
  <text x="405" y="113" text-anchor="start" font-size="14.5" fill="#111111">Published material. Any tool, including consumer tools with</text>
  <text x="405" y="132" text-anchor="start" font-size="14.5" fill="#111111">training switched off.</text>
  <rect x="160" y="174" width="770" height="94" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="180" y="227" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Internal</text>
  <text x="405" y="226" text-anchor="start" font-size="14.5" fill="#111111">Everyday internal content. Approved business AI tools only.</text>
  <rect x="160" y="278" width="770" height="94" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="180" y="331" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Confidential</text>
  <text x="405" y="320" text-anchor="start" font-size="14.5" fill="#111111">Client documents, contracts, forecasts. Approved tools, where</text>
  <text x="405" y="339" text-anchor="start" font-size="14.5" fill="#111111">policy allows, minimised.</text>
  <rect x="160" y="382" width="770" height="94" rx="8" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="172" y="390" width="745" height="76" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="180" y="434" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Restricted</text>
  <text x="405" y="424" text-anchor="start" font-size="14.5" fill="#111111">Health records, payroll, merger plans, credentials. Specific</text>
  <text x="405" y="443" text-anchor="start" font-size="14.5" fill="#111111">approval and safeguards, or local tools only.</text>
  <line x1="80" y1="468" x2="80" y2="78" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <rect x="18" y="106" width="124" height="44" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="80" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Least care</text>
  <text x="80" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">needed</text>
  <rect x="18" y="392" width="124" height="44" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="80" y="408" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Most care</text>
  <text x="80" y="426" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">needed</text>
</svg>
