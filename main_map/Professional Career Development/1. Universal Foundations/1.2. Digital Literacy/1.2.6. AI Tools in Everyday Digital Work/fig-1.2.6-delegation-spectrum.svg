<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The spectrum of delegation in everyday AI tools</title>
  <desc>Four bands from left to right: the tool suggests, drafts, transforms in place, and acts on the person's behalf. Below, the point of human judgement moves from every small choice to a single decision before release, while the reach of an unnoticed error grows.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="44" font-size="22" font-weight="bold" fill="#111111" text-anchor="middle">From suggesting to acting</text>

  <!-- Band 1: suggests (white) -->
  <rect x="32" y="72" width="214" height="250" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <!-- Band 2: drafts (hatch) -->
  <rect x="258" y="72" width="214" height="250" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <!-- Band 3: transforms (dots) -->
  <rect x="484" y="72" width="214" height="250" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <!-- Band 4: acts (lines) -->
  <rect x="710" y="72" width="218" height="250" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>

  <!-- White backings for text -->
  <rect x="270" y="84" width="190" height="226" fill="#FFFFFF"/>
  <rect x="496" y="84" width="190" height="226" fill="#FFFFFF"/>
  <rect x="722" y="84" width="194" height="226" fill="#FFFFFF"/>

  <g font-size="20" font-weight="bold" fill="#111111" text-anchor="middle">
    <text x="139" y="112">1. Suggests</text>
    <text x="365" y="112">2. Drafts</text>
    <text x="591" y="112">3. Transforms</text>
    <text x="819" y="112">4. Acts</text>
  </g>
  <g font-size="15" fill="#111111" text-anchor="middle">
    <text x="139" y="140">Person accepts or</text>
    <text x="139" y="160">rejects each offer</text>
    <text x="365" y="140">Tool writes a first</text>
    <text x="365" y="160">version to review</text>
    <text x="591" y="140">Tool edits existing</text>
    <text x="591" y="160">work in place</text>
    <text x="819" y="140">Tool sends, files,</text>
    <text x="819" y="160">books or changes</text>
  </g>
  <g font-size="14" fill="#111111" text-anchor="middle" font-style="italic">
    <text x="139" y="200">spelling fixes</text>
    <text x="139" y="222">next-word prompts</text>
    <text x="139" y="244">suggested replies</text>
    <text x="365" y="200">email and memo drafts</text>
    <text x="365" y="222">meeting summaries</text>
    <text x="365" y="244">first-cut formulas</text>
    <text x="591" y="200">rewritten sections</text>
    <text x="591" y="222">cleaned data tables</text>
    <text x="591" y="244">restyled slide decks</text>
    <text x="819" y="200">replies sent unaided</text>
    <text x="819" y="222">calendar bookings</text>
    <text x="819" y="244">multi-step tasks</text>
  </g>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="139" y="292">Check: at each choice</text>
    <text x="365" y="292">Check: whole draft</text>
    <text x="591" y="292">Check: what changed</text>
    <text x="819" y="292">Check: before it runs</text>
  </g>

  <!-- Autonomy arrow -->
  <line x1="40" y1="364" x2="916" y2="364" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="40" y="352" font-size="15" fill="#111111">Low autonomy</text>
  <text x="916" y="352" font-size="15" fill="#111111" text-anchor="end">High autonomy</text>

  <!-- Two consequence rows -->
  <text x="40" y="408" font-size="16" font-weight="bold" fill="#111111">Human judgement</text>
  <text x="40" y="430" font-size="15" fill="#111111">many small decisions while working</text>
  <text x="916" y="430" font-size="15" fill="#111111" text-anchor="end">one large decision before release</text>
  <line x1="300" y1="425" x2="640" y2="425" stroke="#222222" stroke-width="2" stroke-dasharray="10 6" marker-end="url(#arrow)"/>

  <text x="40" y="474" font-size="16" font-weight="bold" fill="#111111">Reach of an unnoticed error</text>
  <text x="40" y="496" font-size="15" fill="#111111">one word or phrase</text>
  <text x="916" y="496" font-size="15" fill="#111111" text-anchor="end">a sent message, a changed record</text>
  <line x1="200" y1="491" x2="660" y2="491" stroke="#222222" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#arrow)"/>

  <text x="480" y="528" font-size="13" fill="#333333" text-anchor="middle">Schematic; bands overlap in real products, and one product may work in several bands.</text>
</svg>
