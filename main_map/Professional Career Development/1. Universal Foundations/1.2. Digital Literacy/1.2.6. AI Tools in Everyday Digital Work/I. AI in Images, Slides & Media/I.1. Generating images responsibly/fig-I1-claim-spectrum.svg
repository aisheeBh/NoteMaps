<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>The claim an image makes</title>
<desc>Six kinds of generated image arranged from those that claim nothing about reality to those that claim to show a real person.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<pattern id="grey" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#E6E6E6"/><circle cx="5" cy="5" r="1" fill="#666666"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40.0" font-size="22" font-weight="bold" text-anchor="middle" fill="#111111">What a generated image implicitly claims</text>
<text x="480.0" y="64.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#333333">The further right, the more disclosure, consent and checking are needed</text>
<rect x="24.0" y="100" width="142.0" height="220" rx="6" fill="#F2F2F2" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/>
<rect x="25.5" y="101.5" width="139.0" height="10" fill="url(#grey)"/>
<text x="95.0" y="134.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">Icon or pattern</text>
<text x="95.0" y="161.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">Claims nothing</text>
<text x="95.0" y="186.2" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">e.g. a</text>
<text x="95.0" y="204.4" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">background</text>
<text x="95.0" y="222.6" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">texture, a</text>
<text x="95.0" y="240.8" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">slide divider</text>
<rect x="178.0" y="100" width="142.0" height="220" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="249.0" y="124.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">Obvious</text>
<text x="249.0" y="143.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">illustration</text>
<text x="249.0" y="170.5" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">Claims an idea</text>
<text x="249.0" y="195.7" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">e.g. a cartoon</text>
<text x="249.0" y="213.9" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">of a team</text>
<text x="249.0" y="232.1" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">climbing a</text>
<text x="249.0" y="250.3" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">graph</text>
<rect x="332.0" y="100" width="142.0" height="220" rx="6" fill="#EAF2FA" stroke="#1F3B5C" stroke-width="2"/>
<rect x="334.0" y="102" width="138.0" height="10" fill="url(#hatch)"/>
<text x="403.0" y="134.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">Stylised</text>
<text x="403.0" y="153.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">realism</text>
<text x="403.0" y="180.5" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">Claims a mood</text>
<text x="403.0" y="205.7" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">e.g. painterly</text>
<text x="403.0" y="223.9" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">office scene,</text>
<text x="403.0" y="242.1" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">no real place</text>
<rect x="486.0" y="100" width="142.0" height="220" rx="6" fill="#FFF6DD" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<rect x="488.0" y="102" width="138.0" height="10" fill="url(#dots)"/>
<text x="557.0" y="134.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">Photoreal,</text>
<text x="557.0" y="153.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">invented people</text>
<text x="557.0" y="180.5" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">Invites belief</text>
<text x="557.0" y="198.7" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">that the scene</text>
<text x="557.0" y="216.9" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">was</text>
<text x="557.0" y="235.1" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">photographed</text>
<rect x="640.0" y="100" width="142.0" height="220" rx="6" fill="#FCEDED" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<rect x="642.5" y="102.5" width="137.0" height="10" fill="url(#lines)"/>
<text x="711.0" y="134.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">Photoreal real</text>
<text x="711.0" y="153.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">place or event</text>
<text x="711.0" y="180.5" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">Can be read as</text>
<text x="711.0" y="198.7" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">a record of</text>
<text x="711.0" y="216.9" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">something that</text>
<text x="711.0" y="235.1" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">happened</text>
<rect x="794.0" y="100" width="142.0" height="220" rx="6" fill="#FCEDED" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<rect x="796.5" y="102.5" width="137.0" height="10" fill="url(#lines)"/>
<text x="865.0" y="134.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">Real person's</text>
<text x="865.0" y="153.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">likeness</text>
<text x="865.0" y="180.5" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">Claims a real</text>
<text x="865.0" y="198.7" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">person was</text>
<text x="865.0" y="216.9" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">there or did</text>
<text x="865.0" y="235.1" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">this</text>
<line x1="40" y1="350" x2="920" y2="350" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
<text x="40.0" y="376.0" font-size="15" font-weight="bold" text-anchor="start" fill="#111111">Little implied claim</text>
<text x="920.0" y="376.0" font-size="15" font-weight="bold" text-anchor="end" fill="#111111">Strong implied claim</text>
<text x="480.0" y="416.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#333333" font-style="italic">Schematic; positions are a guide to judgement, not fixed categories.</text>
</svg>