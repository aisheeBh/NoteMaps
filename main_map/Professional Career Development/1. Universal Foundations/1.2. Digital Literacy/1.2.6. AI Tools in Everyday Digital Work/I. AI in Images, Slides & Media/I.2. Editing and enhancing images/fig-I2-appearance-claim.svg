<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Changing appearance versus changing claims</title>
<desc>Two-by-two matrix of edits by how much they change appearance and whether they change what the image claims happened.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<pattern id="grey" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#E6E6E6"/><circle cx="5" cy="5" r="1" fill="#666666"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40.0" font-size="22" font-weight="bold" text-anchor="middle" fill="#111111">Two separate questions about every edit</text>
<rect x="156" y="96" width="368.0" height="193.0" rx="6" fill="#FCEDED" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<rect x="158.5" y="98.5" width="363.0" height="10" fill="url(#lines)"/>
<text x="340.0" y="130.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">Small but deceptive</text>
<text x="340.0" y="157.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">Removing a damp patch from a listing</text>
<text x="340.0" y="182.2" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">Adding one person to a group</text>
<text x="340.0" y="207.4" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">Erasing a logo from evidence</text>
<rect x="536.0" y="96" width="368.0" height="193.0" rx="6" fill="#FCEDED" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<rect x="538.5" y="98.5" width="363.0" height="10" fill="url(#lines)"/>
<text x="720.0" y="130.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">Large and deceptive</text>
<text x="720.0" y="157.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">Replacing the setting</text>
<text x="720.0" y="182.2" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">Altering a face or body</text>
<text x="720.0" y="207.4" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">Composite presented as one moment</text>
<rect x="156" y="301.0" width="368.0" height="193.0" rx="6" fill="#EEF7EE" stroke="#1E5E24" stroke-width="3"/>
<rect x="159" y="304.0" width="362.0" height="10" fill="url(#cross)"/>
<text x="340.0" y="335.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">Routine correction</text>
<text x="340.0" y="362.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">Exposure, white balance, crop</text>
<text x="340.0" y="387.2" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">Dust and sensor-spot removal</text>
<text x="340.0" y="412.4" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">Mild noise reduction</text>
<rect x="536.0" y="301.0" width="368.0" height="193.0" rx="6" fill="#FFF6DD" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<rect x="538.0" y="303.0" width="364.0" height="10" fill="url(#dots)"/>
<text x="720.0" y="335.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">Visible but honest</text>
<text x="720.0" y="362.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">Strong stylistic grade</text>
<text x="720.0" y="387.2" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">Background swapped for a clearly studio look</text>
<text x="720.0" y="412.4" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">Labelled colourisation</text>
<line x1="150" y1="514" x2="910" y2="514" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="150.0" y="536.0" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Small change to appearance</text>
<text x="910.0" y="536.0" font-size="14" font-weight="normal" text-anchor="end" fill="#111111">Large change to appearance</text>
<text x="530.0" y="536.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">How different does it look?</text>
<line x1="136" y1="500" x2="136" y2="90" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="128.0" y="500.0" font-size="14" font-weight="normal" text-anchor="end" fill="#111111">Claim unchanged</text>
<text x="128.0" y="104.0" font-size="14" font-weight="normal" text-anchor="end" fill="#111111">Claim changed</text>
<text x="128.0" y="255.0" font-size="15" font-weight="bold" text-anchor="end" fill="#111111">Does it</text>
<text x="128.0" y="274.5" font-size="15" font-weight="bold" text-anchor="end" fill="#111111">change what</text>
<text x="128.0" y="294.0" font-size="15" font-weight="bold" text-anchor="end" fill="#111111">the image</text>
<text x="128.0" y="313.5" font-size="15" font-weight="bold" text-anchor="end" fill="#111111">asserts?</text>
<text x="480.0" y="586.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#333333" font-style="italic">Schematic; the claim test matters more than the size of the change.</text>
</svg>