<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>An asset record for generated media</title>
<desc>The fields of a record kept with each published generated or AI-edited asset, grouped into five layers.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<pattern id="grey" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#E6E6E6"/><circle cx="5" cy="5" r="1" fill="#666666"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40.0" font-size="22" font-weight="bold" text-anchor="middle" fill="#111111">What an asset record holds</text>
<rect x="24" y="86.0" width="912" height="75.6" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<text x="48.0" y="128.8" font-size="16" font-weight="bold" text-anchor="start" fill="#FFFFFF">Identity</text>
<text x="224.0" y="128.8" font-size="14" font-weight="normal" text-anchor="start" fill="#FFFFFF">Asset name, version, owner, date, where it is used</text>
<rect x="24" y="169.6" width="912" height="75.6" rx="6" fill="#EAF2FA" stroke="#1F3B5C" stroke-width="2"/>
<rect x="26" y="171.6" width="14" height="71.6" fill="url(#hatch)"/>
<text x="48.0" y="212.4" font-size="16" font-weight="bold" text-anchor="start" fill="#111111">Origin</text>
<text x="224.0" y="203.3" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Tool and model version, prompt or instruction, reference images, source files, digital</text>
<text x="224.0" y="221.5" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">source type</text>
<rect x="24" y="253.2" width="912" height="75.6" rx="6" fill="#FFF6DD" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<rect x="26" y="255.2" width="14" height="71.6" fill="url(#dots)"/>
<text x="48.0" y="296.0" font-size="16" font-weight="bold" text-anchor="start" fill="#111111">Human work</text>
<text x="224.0" y="296.0" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Edits made, by whom; human-authored elements such as text, layout, photography</text>
<rect x="24" y="336.8" width="912" height="75.6" rx="6" fill="#EEF7EE" stroke="#1E5E24" stroke-width="3"/>
<rect x="27" y="339.8" width="14" height="69.6" fill="url(#cross)"/>
<text x="48.0" y="379.6" font-size="16" font-weight="bold" text-anchor="start" fill="#111111">Checks</text>
<text x="224.0" y="379.6" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Quality, accessibility, rights and brand checks; reviewer and tier; disclosure wording</text>
<rect x="24" y="420.4" width="912" height="75.6" rx="6" fill="#F2F2F2" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/>
<rect x="25.5" y="421.9" width="14" height="72.6" fill="url(#grey)"/>
<text x="48.0" y="463.2" font-size="16" font-weight="bold" text-anchor="start" fill="#111111">Life cycle</text>
<text x="224.0" y="463.2" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Licence limits, expiry or review date, withdrawal route, related assets</text>
<text x="480.0" y="526.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#333333" font-style="italic">Fields can live in a digital asset management system, a shared spreadsheet or embedded metadata.</text>
</svg>