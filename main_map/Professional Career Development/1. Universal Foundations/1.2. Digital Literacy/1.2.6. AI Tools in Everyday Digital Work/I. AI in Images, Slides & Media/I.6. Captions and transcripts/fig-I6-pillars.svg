<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Four dimensions of caption quality</title>
<desc>Accuracy, synchronicity, completeness and placement, with a typical failure of each.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<pattern id="grey" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#E6E6E6"/><circle cx="5" cy="5" r="1" fill="#666666"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40.0" font-size="22" font-weight="bold" text-anchor="middle" fill="#111111">Four dimensions of caption quality</text>
<text x="480.0" y="64.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#333333">After the dimensions set by the US communications regulator for television captions in 2014</text>
<rect x="24.0" y="90" width="216.0" height="262" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<text x="132.0" y="114.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Accuracy</text>
<text x="132.0" y="142.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#FFFFFF">Words, names, numbers</text>
<text x="132.0" y="162.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#FFFFFF">and punctuation correct</text>
<text x="132.0" y="188.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#FFFFFF">Fault: 'sixty' shown as</text>
<text x="132.0" y="208.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#FFFFFF">'sixteen'</text>
<rect x="256.0" y="90" width="216.0" height="262" rx="6" fill="#EAF2FA" stroke="#1F3B5C" stroke-width="2"/>
<rect x="258.0" y="92" width="212.0" height="10" fill="url(#hatch)"/>
<text x="364.0" y="124.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">Synchronicity</text>
<text x="364.0" y="152.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">Appears with the</text>
<text x="364.0" y="172.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">speech, stays long</text>
<text x="364.0" y="191.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">enough to read</text>
<text x="364.0" y="218.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">Fault: captions lag by</text>
<text x="364.0" y="237.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">three seconds</text>
<rect x="488.0" y="90" width="216.0" height="262" rx="6" fill="#FFF6DD" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<rect x="490.0" y="92" width="212.0" height="10" fill="url(#dots)"/>
<text x="596.0" y="124.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">Completeness</text>
<text x="596.0" y="152.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">Runs from start to end,</text>
<text x="596.0" y="172.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">includes meaningful</text>
<text x="596.0" y="191.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">sounds</text>
<text x="596.0" y="218.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">Fault: last minute</text>
<text x="596.0" y="237.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">uncaptioned</text>
<rect x="720.0" y="90" width="216.0" height="262" rx="6" fill="#EEF7EE" stroke="#1E5E24" stroke-width="3"/>
<rect x="723.0" y="93" width="210.0" height="10" fill="url(#cross)"/>
<text x="828.0" y="124.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">Placement</text>
<text x="828.0" y="152.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">Does not hide faces,</text>
<text x="828.0" y="172.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">names or on-screen text</text>
<text x="828.0" y="198.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">Fault: caption over a</text>
<text x="828.0" y="218.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">lower-third name</text>
</svg>