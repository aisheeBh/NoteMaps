<text x="480.0" y="301.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">one section of</text>
<text x="480.0" y="319.2" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">slides</text>
