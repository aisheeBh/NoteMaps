<line x1="670" y1="330" x2="797" y2="370" stroke="#222222" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="24" y="92" width="280" height="110" rx="6" fill="#FFF6DD" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<rect x="26" y="94" width="276" height="10" fill="url(#dots)"/>
<text x="164.0" y="126.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">Executive summary slide</text>
<text x="164.0" y="153.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">States the governing message and</text>
<text x="164.0" y="171.2" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">the three key lines</text>
<rect x="656" y="92" width="280" height="110" rx="6" fill="#EEF7EE" stroke="#1E5E24" stroke-width="3"/>
<rect x="659" y="95" width="274" height="10" fill="url(#cross)"/>
<text x="796.0" y="126.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">Section title slides</text>
<text x="796.0" y="153.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">Each key line becomes an action</text>
<text x="796.0" y="171.2" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">title for its section</text>
<text x="480.0" y="546.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#333333" font-style="italic">Structure after Barbara Minto's pyramid principle; the number of key lines varies, often three to five.</text>
</svg>