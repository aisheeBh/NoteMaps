<text x="672.5" y="419.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">data,</text>
<text x="672.5" y="436.4" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">example,</text>
