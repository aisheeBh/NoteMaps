<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>A storyline pyramid</title>
<desc>A pyramid with one governing message at the top, three key lines beneath and supporting evidence at the base, mapped to slides.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<pattern id="grey" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#E6E6E6"/><circle cx="5" cy="5" r="1" fill="#666666"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40.0" font-size="22" font-weight="bold" text-anchor="middle" fill="#111111">A deck is a pyramid before it is a set of slides</text>
<text x="480.0" y="64.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#333333">Message first, then the lines that support it, then the evidence</text>
<polygon points="480,90 600,210 360,210" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<text x="480.0" y="175.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Governing</text>
<text x="480.0" y="195.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">message</text>
<rect x="210" y="240" width="160" height="90" rx="6" fill="#EAF2FA" stroke="#1F3B5C" stroke-width="2"/>
<rect x="212" y="242" width="156" height="10" fill="url(#hatch)"/>
<text x="290.0" y="274.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">Key line 1</text>
<text x="290.0" y="301.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">one section of</text>
<text x="290.0" y="319.2" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">slides</text>
<line x1="480" y1="210" x2="290" y2="240" stroke="#222222" stroke-width="2"/>
<rect x="400" y="240" width="160" height="90" rx="6" fill="#EAF2FA" stroke="#1F3B5C" stroke-width="2"/>
<rect x="402" y="242" width="156" height="10" fill="url(#hatch)"/>
