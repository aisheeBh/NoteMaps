<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Three ways to title a slide</title>
<desc>Comparison of a topic title, an action title and an assertion-evidence slide, with what each tells the audience.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<pattern id="grey" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#E6E6E6"/><circle cx="5" cy="5" r="1" fill="#666666"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40.0" font-size="22" font-weight="bold" text-anchor="middle" fill="#111111">The same slide, titled three ways</text>
<text x="480.0" y="64.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#333333">Read only the titles of a deck: do they tell the argument?</text>
<rect x="24.0" y="90" width="293.3333333333333" height="296" rx="6" fill="#F2F2F2" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/>
<rect x="25.5" y="91.5" width="290.3333333333333" height="10" fill="url(#grey)"/>
<text x="170.7" y="124.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">Topic title</text>
<text x="170.7" y="152.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">"Q3 customer churn"</text>
<text x="170.7" y="179.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">Names the subject only</text>
<text x="170.7" y="205.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">Audience must work out the point</text>
<text x="170.7" y="232.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">Typical of AI first drafts</text>
<rect x="333.3333333333333" y="90" width="293.3333333333333" height="296" rx="6" fill="#EAF2FA" stroke="#1F3B5C" stroke-width="2"/>
<rect x="335.3333333333333" y="92" width="289.3333333333333" height="10" fill="url(#hatch)"/>
<text x="480.0" y="124.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">Action title</text>
<text x="480.0" y="152.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">"Churn rose to 6% in Q3, driven</text>
<text x="480.0" y="172.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">by small-business accounts"</text>
<text x="480.0" y="198.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">States the conclusion</text>
<text x="480.0" y="225.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">Titles alone tell the story</text>
<rect x="642.6666666666666" y="90" width="293.3333333333333" height="296" rx="6" fill="#EEF7EE" stroke="#1E5E24" stroke-width="3"/>
<rect x="645.6666666666666" y="93" width="287.3333333333333" height="10" fill="url(#cross)"/>
<text x="789.3" y="124.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">Assertion-evidence</text>
<text x="789.3" y="152.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">Sentence headline as the</text>
<text x="789.3" y="172.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">assertion</text>
<text x="789.3" y="198.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">Body is visual evidence: a chart,</text>
<text x="789.3" y="218.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">photo or diagram</text>
<text x="789.3" y="244.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">Few or no bullets</text>
<text x="480.0" y="416.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#333333" font-style="italic">Example figures are illustrative.</text>
</svg>