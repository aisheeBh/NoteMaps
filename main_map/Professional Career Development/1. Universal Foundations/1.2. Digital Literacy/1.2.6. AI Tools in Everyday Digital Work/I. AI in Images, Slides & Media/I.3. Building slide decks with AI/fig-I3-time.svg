<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Where the time goes in an AI-assisted deck</title>
<desc>Illustrative bars showing time spent on each stage of building a twelve-slide deck with and without AI assistance.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<pattern id="grey" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#E6E6E6"/><circle cx="5" cy="5" r="1" fill="#666666"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40.0" font-size="22" font-weight="bold" text-anchor="middle" fill="#111111">Where the effort goes: a 12-slide update (illustrative figures)</text>
<text x="480.0" y="64.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#333333">AI shrinks drafting; it does not shrink thinking, and it enlarges checking</text>
<text x="312.0" y="120.0" font-size="15" font-weight="normal" text-anchor="end" fill="#111111">Without AI: storyline</text>
<rect x="324" y="100.0" width="139.5" height="30.0" fill="url(#hatch)" stroke="#222222" stroke-width="1.5"/>
<rect x="469.5" y="104.0" width="56" height="22" fill="#FFFFFF"/>
<text x="473.5" y="120.0" font-size="14" font-weight="bold" text-anchor="start" fill="#111111">45 min</text>
<text x="312.0" y="170.0" font-size="15" font-weight="normal" text-anchor="end" fill="#111111">Without AI: drafting slides</text>
<rect x="324" y="150.0" width="372.0" height="30.0" fill="url(#hatch)" stroke="#222222" stroke-width="1.5"/>
<rect x="702.0" y="154.0" width="64" height="22" fill="#FFFFFF"/>
<text x="706.0" y="170.0" font-size="14" font-weight="bold" text-anchor="start" fill="#111111">120 min</text>
<text x="312.0" y="220.0" font-size="15" font-weight="normal" text-anchor="end" fill="#111111">Without AI: checking</text>
<rect x="324" y="200.0" width="93.0" height="30.0" fill="url(#hatch)" stroke="#222222" stroke-width="1.5"/>
<rect x="423.0" y="204.0" width="56" height="22" fill="#FFFFFF"/>
<text x="427.0" y="220.0" font-size="14" font-weight="bold" text-anchor="start" fill="#111111">30 min</text>
<text x="312.0" y="270.0" font-size="15" font-weight="normal" text-anchor="end" fill="#111111">With AI: storyline</text>
<rect x="324" y="250.0" width="139.5" height="30.0" fill="url(#dots)" stroke="#222222" stroke-width="1.5"/>
<rect x="469.5" y="254.0" width="152" height="22" fill="#FFFFFF"/>
<text x="473.5" y="270.0" font-size="14" font-weight="bold" text-anchor="start" fill="#111111">45 min - unchanged</text>
<text x="312.0" y="320.0" font-size="15" font-weight="normal" text-anchor="end" fill="#111111">With AI: generating and rebuilding</text>
<rect x="324" y="300.0" width="155.0" height="30.0" fill="url(#dots)" stroke="#222222" stroke-width="1.5"/>
<rect x="485.0" y="304.0" width="56" height="22" fill="#FFFFFF"/>
<text x="489.0" y="320.0" font-size="14" font-weight="bold" text-anchor="start" fill="#111111">50 min</text>
<text x="312.0" y="370.0" font-size="15" font-weight="normal" text-anchor="end" fill="#111111">With AI: checking</text>
<rect x="324" y="350.0" width="155.0" height="30.0" fill="url(#dots)" stroke="#222222" stroke-width="1.5"/>
<rect x="485.0" y="354.0" width="192" height="22" fill="#FFFFFF"/>
<text x="489.0" y="370.0" font-size="14" font-weight="bold" text-anchor="start" fill="#111111">50 min - more, not less</text>
<line x1="324" y1="92" x2="324" y2="400" stroke="#222222" stroke-width="2"/>
<text x="480.0" y="456.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#333333" font-style="italic">Illustrative figures for a single case; actual times vary widely by person, tool and content.</text>
</svg>