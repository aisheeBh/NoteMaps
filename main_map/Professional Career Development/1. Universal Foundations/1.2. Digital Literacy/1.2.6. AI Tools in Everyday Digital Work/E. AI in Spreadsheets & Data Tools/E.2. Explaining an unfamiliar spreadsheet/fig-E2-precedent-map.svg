<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>A precedent map for one critical output</title>
  <desc>A tree tracing the forecast cost at completion back to its sources: a summary formula fed by three calculation blocks for labour, materials and overheads. Labour depends on a rate table and an hours extract. Materials depend on a hidden sheet holding a manual override. Overheads depend on an external linked file on a personal drive that last updated five months earlier.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">Tracing one critical output back to its sources</text>
  <rect x="330" y="60" width="300" height="70" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="480" y="92" text-anchor="middle" font-size="17" fill="#FFFFFF" font-weight="bold">Forecast cost at completion</text>
  <text x="480" y="111" text-anchor="middle" font-size="14" fill="#FFFFFF">Summary!F4</text>
  <rect x="40" y="190" width="250" height="70" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="165" y="222" text-anchor="middle" font-size="16" fill="#000000" font-weight="bold">Labour cost</text>
  <text x="165" y="240" text-anchor="middle" font-size="14" fill="#000000">Calc_Labour!H60</text>
  <rect x="355" y="190" width="250" height="70" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="480" y="222" text-anchor="middle" font-size="16" fill="#000000" font-weight="bold">Materials cost</text>
  <text x="480" y="240" text-anchor="middle" font-size="14" fill="#000000">Calc_Materials!K45</text>
  <rect x="670" y="190" width="250" height="70" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="795" y="222" text-anchor="middle" font-size="16" fill="#000000" font-weight="bold">Overheads</text>
  <text x="795" y="240" text-anchor="middle" font-size="14" fill="#000000">Calc_Overheads!D20</text>
  <line x1="165" y1="188" x2="430" y2="132" stroke="#222222" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="480" y1="188" x2="480" y2="132" stroke="#222222" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="795" y1="188" x2="530" y2="132" stroke="#222222" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="40" y="330" width="120" height="80" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="100" y="366" text-anchor="middle" font-size="15" fill="#000000" font-weight="bold">Rate table</text>
  <text x="100" y="384" text-anchor="middle" font-size="13" fill="#000000">Rates!A:D</text>
  <rect x="170" y="330" width="120" height="80" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="230" y="366" text-anchor="middle" font-size="15" fill="#000000" font-weight="bold">Hours</text>
  <text x="230" y="384" text-anchor="middle" font-size="13" fill="#000000">Extract sheet</text>
  <rect x="355" y="330" width="250" height="80" rx="6" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="480" y="356" text-anchor="middle" font-size="15" fill="#000000" font-weight="bold">Hidden sheet: Adj</text>
  <text x="480" y="376" text-anchor="middle" font-size="14" fill="#000000">manual override typed in,</text>
  <text x="480" y="394" text-anchor="middle" font-size="14" fill="#000000">undocumented</text>
  <rect x="670" y="330" width="250" height="80" rx="6" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="795" y="356" text-anchor="middle" font-size="15" fill="#000000" font-weight="bold">External file</text>
  <text x="795" y="376" text-anchor="middle" font-size="14" fill="#000000">link to a personal drive; last</text>
  <text x="795" y="394" text-anchor="middle" font-size="14" fill="#000000">updated five months ago</text>
  <line x1="100" y1="328" x2="140" y2="262" stroke="#222222" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="230" y1="328" x2="190" y2="262" stroke="#222222" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="480" y1="328" x2="480" y2="262" stroke="#222222" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="795" y1="328" x2="795" y2="262" stroke="#222222" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="40" y="450" width="880" height="80" rx="6" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="480" y="486" text-anchor="middle" font-size="16" fill="#000000">The formulas on this path were explained accurately by an AI assistant. The two material problems</text>
  <text x="480" y="506" text-anchor="middle" font-size="16" fill="#000000">were the hidden override and the stale link, found by tracing and surveying.</text>
  <text x="480.0" y="564" text-anchor="middle" font-size="13" fill="#333333">Illustrative workbook, based on the inherited-forecast case study.</text>
</svg>
