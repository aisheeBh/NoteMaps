<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Costs and revenue against the number of attendees</title>
  <desc>Line chart from 0 to 200 attendees. A flat dotted line shows fixed costs of 12,000 pounds. A dashed line rising from 12,000 shows total costs, increasing by 60 pounds per attendee. A solid line from zero shows revenue at 150 pounds per attendee. Revenue crosses total costs at about 133 attendees, the break-even point, rounded up to 134. Loss area to the left, profit area to the right.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">Break-even: revenue meets total costs at 134 attendees</text>
  <line x1="120" y1="460" x2="880" y2="460" stroke="#222222" stroke-width="2"/>
  <line x1="120" y1="460" x2="120" y2="92" stroke="#222222" stroke-width="2"/>
  <line x1="120.0" y1="460" x2="120.0" y2="466" stroke="#222222" stroke-width="2"/>
  <text x="120.0" y="484" text-anchor="middle" font-size="14" fill="#111111">0</text>
  <line x1="310.0" y1="460" x2="310.0" y2="466" stroke="#222222" stroke-width="2"/>
  <text x="310.0" y="484" text-anchor="middle" font-size="14" fill="#111111">50</text>
  <line x1="500.0" y1="460" x2="500.0" y2="466" stroke="#222222" stroke-width="2"/>
  <text x="500.0" y="484" text-anchor="middle" font-size="14" fill="#111111">100</text>
  <line x1="690.0" y1="460" x2="690.0" y2="466" stroke="#222222" stroke-width="2"/>
  <text x="690.0" y="484" text-anchor="middle" font-size="14" fill="#111111">150</text>
  <line x1="880.0" y1="460" x2="880.0" y2="466" stroke="#222222" stroke-width="2"/>
  <text x="880.0" y="484" text-anchor="middle" font-size="14" fill="#111111">200</text>
  <line x1="114" y1="460.0" x2="120" y2="460.0" stroke="#222222" stroke-width="2"/>
  <text x="110" y="465.0" text-anchor="end" font-size="14" fill="#111111">£0</text>
  <line x1="114" y1="340.0" x2="120" y2="340.0" stroke="#222222" stroke-width="2"/>
  <text x="110" y="345.0" text-anchor="end" font-size="14" fill="#111111">£10,000</text>
  <line x1="114" y1="220.0" x2="120" y2="220.0" stroke="#222222" stroke-width="2"/>
  <text x="110" y="225.0" text-anchor="end" font-size="14" fill="#111111">£20,000</text>
  <line x1="114" y1="100.0" x2="120" y2="100.0" stroke="#222222" stroke-width="2"/>
  <text x="110" y="105.0" text-anchor="end" font-size="14" fill="#111111">£30,000</text>
  <text x="500.0" y="510" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Number of attendees</text>
  <path d="M120.0 316.0 L880.0 316.0" fill="none" stroke="#222222" stroke-width="2.5" stroke-dasharray="2 4"/>
  <path d="M120.0 316.0 L880.0 172.0" fill="none" stroke="#222222" stroke-width="3" stroke-dasharray="10 6"/>
  <path d="M120.0 460.0 L880.0 100.0" fill="none" stroke="#222222" stroke-width="3"/>
  <text x="864.8" y="104.0" text-anchor="end" font-size="15" fill="#111111" font-weight="bold">Revenue £150 each</text>
  <text x="872.4" y="198.0" text-anchor="end" font-size="15" fill="#111111" font-weight="bold">Total costs</text>
  <text x="872.4" y="338.0" text-anchor="end" font-size="15" fill="#111111" font-weight="bold">Fixed costs £12,000</text>
  <circle cx="626.7" cy="220.0" r="7" fill="#111111"/>
  <line x1="626.6666666666667" y1="220.0" x2="626.6666666666667" y2="460" stroke="#222222" stroke-width="1.5" stroke-dasharray="2 4"/>
  <rect x="477" y="162" width="140" height="44" fill="#FFFFFF" stroke="#333333"/>
  <text x="546.6666666666667" y="180.0" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Break-even</text>
  <text x="546.6666666666667" y="199.0" text-anchor="middle" font-size="14" fill="#111111">133.3 → 134</text>
  <text x="310.0" y="305.2" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Loss</text>
  <text x="811.6" y="160.0" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Profit</text>
  <text x="480.0" y="546" text-anchor="middle" font-size="13" fill="#333333">Illustrative figures from the worked example.</text>
</svg>
