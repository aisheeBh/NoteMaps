<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Matching the depth of review to the consequence of an error</title>
  <desc>A staircase of four steps from low to high consequence. Personal or exploratory work: automatic signals and a quick look. Internal team reporting: plus data checks and AI review. Management and external reporting: plus analytical review and reconciliation. Regulatory, financial statements, pricing and decisions about people: plus independent peer review, testing and sign-off.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">Review depth rises with the consequence of an error</text>
  <rect x="50" y="360" width="205" height="110" rx="6" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="152" y="392" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">Personal or</text>
  <text x="152" y="412" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">exploratory</text>
  <text x="152" y="432" text-anchor="middle" font-size="14" fill="#222222">Automatic signals, a</text>
  <text x="152" y="450" text-anchor="middle" font-size="14" fill="#222222">quick look</text>
  <rect x="265" y="275" width="205" height="195" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="368" y="349" text-anchor="middle" font-size="16" fill="#000000" font-weight="bold">Internal team</text>
  <text x="368" y="370" text-anchor="middle" font-size="16" fill="#000000" font-weight="bold">reporting</text>
  <text x="368" y="389" text-anchor="middle" font-size="14" fill="#000000">+ data checks and AI</text>
  <text x="368" y="408" text-anchor="middle" font-size="14" fill="#000000">review</text>
  <rect x="480" y="190" width="205" height="280" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="582" y="306" text-anchor="middle" font-size="16" fill="#000000" font-weight="bold">Management and</text>
  <text x="582" y="328" text-anchor="middle" font-size="16" fill="#000000" font-weight="bold">external reports</text>
  <text x="582" y="346" text-anchor="middle" font-size="14" fill="#000000">+ analytical review,</text>
  <text x="582" y="366" text-anchor="middle" font-size="14" fill="#000000">reconciliation</text>
  <rect x="695" y="105" width="205" height="365" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="798" y="254" text-anchor="middle" font-size="16" fill="#FFFFFF" font-weight="bold">Regulatory, pricing,</text>
  <text x="798" y="274" text-anchor="middle" font-size="16" fill="#FFFFFF" font-weight="bold">decisions about</text>
  <text x="798" y="296" text-anchor="middle" font-size="16" fill="#FFFFFF" font-weight="bold">people</text>
  <text x="798" y="314" text-anchor="middle" font-size="14" fill="#FFFFFF">+ independent review,</text>
  <text x="798" y="334" text-anchor="middle" font-size="14" fill="#FFFFFF">testing, sign-off</text>
  <line x1="50" y1="500" x2="900" y2="500" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="475" y="528" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Consequence of an undetected error</text>
  <text x="480.0" y="552" text-anchor="middle" font-size="13" fill="#333333">Schematic; the boundaries between levels are set by each organisation.</text>
</svg>
