<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Expected share of each leading digit under Benford's law</title>
  <desc>Bar chart of the expected share of leading digits 1 to 9: 30.1, 17.6, 12.5, 9.7, 7.9, 6.7, 5.8, 5.1 and 4.6 per cent, each bar labelled with its value.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">Benford's law: expected share of each leading digit</text>
  <line x1="110" y1="440" x2="890" y2="440" stroke="#222222" stroke-width="2"/>
  <line x1="110" y1="440" x2="110" y2="100" stroke="#222222" stroke-width="2"/>
  <line x1="104" y1="440.0" x2="110" y2="440.0" stroke="#222222" stroke-width="2"/>
  <text x="100" y="445.0" text-anchor="end" font-size="14" fill="#111111">0%</text>
  <line x1="104" y1="392.8571428571429" x2="110" y2="392.8571428571429" stroke="#222222" stroke-width="2"/>
  <text x="100" y="397.8571428571429" text-anchor="end" font-size="14" fill="#111111">5%</text>
  <line x1="104" y1="345.7142857142857" x2="110" y2="345.7142857142857" stroke="#222222" stroke-width="2"/>
  <text x="100" y="350.7142857142857" text-anchor="end" font-size="14" fill="#111111">10%</text>
  <line x1="104" y1="298.57142857142856" x2="110" y2="298.57142857142856" stroke="#222222" stroke-width="2"/>
  <text x="100" y="303.57142857142856" text-anchor="end" font-size="14" fill="#111111">15%</text>
  <line x1="104" y1="251.42857142857144" x2="110" y2="251.42857142857144" stroke="#222222" stroke-width="2"/>
  <text x="100" y="256.42857142857144" text-anchor="end" font-size="14" fill="#111111">20%</text>
  <line x1="104" y1="204.28571428571428" x2="110" y2="204.28571428571428" stroke="#222222" stroke-width="2"/>
  <text x="100" y="209.28571428571428" text-anchor="end" font-size="14" fill="#111111">25%</text>
  <line x1="104" y1="157.14285714285717" x2="110" y2="157.14285714285717" stroke="#222222" stroke-width="2"/>
  <text x="100" y="162.14285714285717" text-anchor="end" font-size="14" fill="#111111">30%</text>
  <line x1="104" y1="110.0" x2="110" y2="110.0" stroke="#222222" stroke-width="2"/>
  <text x="100" y="115.0" text-anchor="end" font-size="14" fill="#111111">35%</text>
  <rect x="122.0" y="156.2" width="62.7" height="283.8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="153.33333333333334" y="148.17171837396057" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">30.1%</text>
  <text x="153.33333333333334" y="464" text-anchor="middle" font-size="15" fill="#111111">1</text>
  <rect x="208.7" y="274.0" width="62.7" height="166.0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="240.00000000000003" y="265.9710986046434" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">17.6%</text>
  <text x="240.00000000000003" y="464" text-anchor="middle" font-size="15" fill="#111111">2</text>
  <rect x="295.3" y="322.2" width="62.7" height="117.8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="326.6666666666667" y="314.2006197693172" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">12.5%</text>
  <text x="326.6666666666667" y="464" text-anchor="middle" font-size="15" fill="#111111">3</text>
  <rect x="382.0" y="348.6" width="62.7" height="91.4" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="413.3333333333333" y="340.6277020209754" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">9.7%</text>
  <text x="413.3333333333333" y="464" text-anchor="middle" font-size="15" fill="#111111">4</text>
  <rect x="468.7" y="365.3" width="62.7" height="74.7" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="500.0" y="357.34339658366804" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">7.9%</text>
  <text x="500.0" y="464" text-anchor="middle" font-size="15" fill="#111111">5</text>
  <rect x="555.3" y="376.9" width="62.7" height="63.1" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="586.6666666666667" y="368.8787412054218" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">6.7%</text>
  <text x="586.6666666666667" y="464" text-anchor="middle" font-size="15" fill="#111111">6</text>
  <rect x="642.0" y="385.3" width="62.7" height="54.7" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="673.3333333333334" y="377.3218785638954" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">5.8%</text>
  <text x="673.3333333333334" y="464" text-anchor="middle" font-size="15" fill="#111111">7</text>
  <rect x="728.7" y="391.8" width="62.7" height="48.2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="760.0000000000001" y="383.77047883532623" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">5.1%</text>
  <text x="760.0000000000001" y="464" text-anchor="middle" font-size="15" fill="#111111">8</text>
  <rect x="815.3" y="396.9" width="62.7" height="43.1" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="846.6666666666667" y="388.85722318564916" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">4.6%</text>
  <text x="846.6666666666667" y="464" text-anchor="middle" font-size="15" fill="#111111">9</text>
  <text x="500.0" y="492" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Leading digit</text>
  <text x="50" y="275.0" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold" transform="rotate(-90 50 275.0)">Expected share</text>
  <text x="480.0" y="528" text-anchor="middle" font-size="13" fill="#333333">Computed from log₁₀(1 + 1/d). Applies only to data spanning several orders of magnitude.</text>
</svg>
