  <text x="622.0" y="282" text-anchor="middle" font-size="14" fill="#111111">29 airport journeys (legitimate)</text>
  <rect x="556.2" y="160.0" width="8" height="8" fill="#111111"/>
  <rect x="556.2" y="169.0" width="8" height="8" fill="#111111"/>
  <rect x="556.2" y="178.0" width="8" height="8" fill="#111111"/>
  <rect x="556.2" y="187.0" width="8" height="8" fill="#111111"/>
  <rect x="556.2" y="196.0" width="8" height="8" fill="#111111"/>
