  <text x="480.0" y="440" text-anchor="middle" font-size="13" fill="#333333">Illustrative figures from the worked example; points are jittered vertically so that they can be seen.</text>
  <text x="480.0" y="466" text-anchor="middle" font-size="14" fill="#333333">The duplicated batch in week 7 does not appear here: each duplicate is an ordinary amount.</text>
