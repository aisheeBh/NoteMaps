  <text x="565.0" y="354" text-anchor="middle" font-size="14" fill="#111111">£100</text>
  <line x1="660.0" y1="330" x2="660.0" y2="336" stroke="#222222" stroke-width="2"/>
  <text x="660.0" y="354" text-anchor="middle" font-size="14" fill="#111111">£120</text>
  <line x1="755.0" y1="330" x2="755.0" y2="336" stroke="#222222" stroke-width="2"/>
  <text x="755.0" y="354" text-anchor="middle" font-size="14" fill="#111111">£140</text>
