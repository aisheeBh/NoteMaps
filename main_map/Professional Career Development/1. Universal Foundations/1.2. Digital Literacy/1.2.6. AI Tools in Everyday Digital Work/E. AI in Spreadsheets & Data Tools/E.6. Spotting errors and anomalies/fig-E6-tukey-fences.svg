  <line x1="223.0" y1="200" x2="223.0" y2="260" stroke="#222222" stroke-width="3"/>
  <line x1="99.5" y1="230" x2="175.5" y2="230" stroke="#222222" stroke-width="2"/>
  <line x1="308.5" y1="230" x2="498.5" y2="230" stroke="#222222" stroke-width="2"/>
