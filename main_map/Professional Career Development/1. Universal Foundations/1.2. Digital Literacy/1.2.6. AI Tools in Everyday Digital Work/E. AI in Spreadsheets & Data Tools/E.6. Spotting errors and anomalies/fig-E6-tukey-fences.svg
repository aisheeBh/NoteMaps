  <text x="90.0" y="354" text-anchor="middle" font-size="14" fill="#111111">£0</text>
  <line x1="185.0" y1="330" x2="185.0" y2="336" stroke="#222222" stroke-width="2"/>
  <text x="185.0" y="354" text-anchor="middle" font-size="14" fill="#111111">£20</text>
  <line x1="280.0" y1="330" x2="280.0" y2="336" stroke="#222222" stroke-width="2"/>
  <text x="280.0" y="354" text-anchor="middle" font-size="14" fill="#111111">£40</text>
