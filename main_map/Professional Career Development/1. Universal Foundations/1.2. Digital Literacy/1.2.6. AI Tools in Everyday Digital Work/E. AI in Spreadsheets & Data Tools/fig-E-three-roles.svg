<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Three ways AI takes part in spreadsheet work</title>
  <desc>A horizontal spectrum from deterministic on the left to non-deterministic on the right. Left: AI writes the method, such as formulas, queries, pivots and scripts, which an engine computes. Middle: AI acts in the workbook, creating sheets, formulas, values and formatting. Right: AI computes or narrates directly, such as stated numbers, in-cell AI functions and narrative summaries. Under each, the main check: read, test and reconcile; review every change; recompute by another route.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">Three ways AI takes part: from deterministic to non-deterministic</text>
  <rect x="40" y="90" width="280" height="210" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="180" y="172" text-anchor="middle" font-size="18" fill="#000000" font-weight="bold">AI writes the method</text>
  <text x="180" y="192" text-anchor="middle" font-size="15" fill="#000000">Formulas, query steps, pivots,</text>
  <text x="180" y="212" text-anchor="middle" font-size="15" fill="#000000">scripts; an engine computes</text>
  <text x="180" y="232" text-anchor="middle" font-size="15" fill="#000000">every row</text>
  <rect x="40" y="320" width="280" height="80" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="180" y="366" text-anchor="middle" font-size="15" fill="#000000">Check: read, test, reconcile</text>
  <rect x="340" y="90" width="280" height="210" rx="6" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="480" y="172" text-anchor="middle" font-size="18" fill="#000000" font-weight="bold">AI acts in the workbook</text>
  <text x="480" y="192" text-anchor="middle" font-size="15" fill="#000000">Agents create sheets, enter</text>
  <text x="480" y="212" text-anchor="middle" font-size="15" fill="#000000">formulas and values, restructure</text>
  <text x="480" y="232" text-anchor="middle" font-size="15" fill="#000000">and format</text>
  <rect x="340" y="320" width="280" height="80" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="480" y="356" text-anchor="middle" font-size="15" fill="#000000">Check: compare versions; review</text>
  <text x="480" y="376" text-anchor="middle" font-size="15" fill="#000000">every change</text>
  <rect x="640" y="90" width="280" height="210" rx="6" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="780" y="182" text-anchor="middle" font-size="18" fill="#000000" font-weight="bold">AI computes or narrates</text>
  <text x="780" y="202" text-anchor="middle" font-size="15" fill="#000000">Stated numbers, in-cell AI</text>
  <text x="780" y="222" text-anchor="middle" font-size="15" fill="#000000">functions, narrative summaries</text>
  <rect x="640" y="320" width="280" height="80" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="780" y="356" text-anchor="middle" font-size="15" fill="#000000">Check: recompute by another</text>
  <text x="780" y="376" text-anchor="middle" font-size="15" fill="#000000">route; freeze and record</text>
  <line x1="40" y1="450" x2="920" y2="450" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="40" y="480" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">Deterministic: same input, same result</text>
  <text x="920" y="480" text-anchor="end" font-size="15" fill="#111111" font-weight="bold">Non-deterministic: may vary between runs</text>
  <text x="480" y="515" text-anchor="middle" font-size="15" fill="#111111" font-style="italic">Trust for figures falls from left to right</text>
  <text x="480.0" y="548" text-anchor="middle" font-size="13" fill="#333333">Schematic.</text>
</svg>
