<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The same question asked repeatedly, compared with a saved method rerun</title>
  <desc>Dot plot of ten reruns of a monthly churn calculation. Re-asking a chat assistant gives values scattered between 3.7 and 4.2 per cent depending on the definitions it chooses. Rerunning a saved method gives 3.8 per cent every time.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">Ten reruns of one September churn figure</text>
  <text x="280" y="156" text-anchor="end" font-size="16" fill="#111111" font-weight="bold">Re-asking a chat assistant</text>
  <line x1="300" y1="150" x2="900" y2="150" stroke="#999999" stroke-width="1"/>
  <circle cx="660.0" cy="150.0" r="6" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <circle cx="480.0" cy="150.0" r="6" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <circle cx="480.0" cy="137.0" r="6" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <circle cx="660.0" cy="137.0" r="6" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <circle cx="540.0" cy="150.0" r="6" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <circle cx="420.0" cy="150.0" r="6" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <circle cx="720.0" cy="150.0" r="6" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <circle cx="480.0" cy="124.0" r="6" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <circle cx="600.0" cy="150.0" r="6" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <circle cx="660.0" cy="124.0" r="6" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <text x="280" y="296" text-anchor="end" font-size="16" fill="#111111" font-weight="bold">Rerunning a saved method</text>
  <line x1="300" y1="290" x2="900" y2="290" stroke="#999999" stroke-width="1"/>
  <circle cx="474.0" cy="290.0" r="5" fill="#111111"/>
  <circle cx="486.0" cy="290.0" r="5" fill="#111111"/>
  <circle cx="474.0" cy="279.0" r="5" fill="#111111"/>
  <circle cx="486.0" cy="279.0" r="5" fill="#111111"/>
  <circle cx="474.0" cy="268.0" r="5" fill="#111111"/>
  <circle cx="486.0" cy="268.0" r="5" fill="#111111"/>
  <circle cx="474.0" cy="257.0" r="5" fill="#111111"/>
  <circle cx="486.0" cy="257.0" r="5" fill="#111111"/>
  <circle cx="474.0" cy="246.0" r="5" fill="#111111"/>
  <circle cx="486.0" cy="246.0" r="5" fill="#111111"/>
  <text x="570.0000000000001" y="182" text-anchor="middle" font-size="14" fill="#111111">Spread from definitions chosen differently each time</text>
  <text x="493.9999999999999" y="320" text-anchor="start" font-size="14" fill="#111111" font-weight="bold">Identical every rerun: 3.8%</text>
  <line x1="300" y1="380" x2="900" y2="380" stroke="#222222" stroke-width="2"/>
  <line x1="300.0" y1="380" x2="300.0" y2="386" stroke="#222222" stroke-width="2"/>
  <text x="300.0" y="404" text-anchor="middle" font-size="14" fill="#111111">3.5%</text>
  <line x1="420.0000000000001" y1="380" x2="420.0000000000001" y2="386" stroke="#222222" stroke-width="2"/>
  <text x="420.0000000000001" y="404" text-anchor="middle" font-size="14" fill="#111111">3.7%</text>
  <line x1="540.0" y1="380" x2="540.0" y2="386" stroke="#222222" stroke-width="2"/>
  <text x="540.0" y="404" text-anchor="middle" font-size="14" fill="#111111">3.9%</text>
  <line x1="659.9999999999998" y1="380" x2="659.9999999999998" y2="386" stroke="#222222" stroke-width="2"/>
  <text x="659.9999999999998" y="404" text-anchor="middle" font-size="14" fill="#111111">4.1%</text>
  <line x1="779.9999999999999" y1="380" x2="779.9999999999999" y2="386" stroke="#222222" stroke-width="2"/>
  <text x="779.9999999999999" y="404" text-anchor="middle" font-size="14" fill="#111111">4.3%</text>
  <line x1="900.0" y1="380" x2="900.0" y2="386" stroke="#222222" stroke-width="2"/>
  <text x="900.0" y="404" text-anchor="middle" font-size="14" fill="#111111">4.5%</text>
  <text x="600.0" y="432" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Reported churn for September</text>
  <text x="480.0" y="465" text-anchor="middle" font-size="13" fill="#333333">Illustrative figures.</text>
</svg>
