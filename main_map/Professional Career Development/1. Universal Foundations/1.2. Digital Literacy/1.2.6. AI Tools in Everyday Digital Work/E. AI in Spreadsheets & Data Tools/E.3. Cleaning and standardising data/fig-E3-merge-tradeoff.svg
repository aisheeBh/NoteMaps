<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The trade-off between merging too much and too little</title>
  <desc>Schematic chart. Horizontal axis: how strict the matching rule is, from loose to strict. A falling solid line shows false merges, high when the rule is loose and low when strict. A rising dashed line shows missed duplicates, low when loose and high when strict. A shaded middle band marks pairs flagged for human review.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">Matching strictness: false merges against missed duplicates</text>
  <rect x="406" y="110" width="187" height="340" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="405" y="122" width="190" height="48" fill="#FFFFFF"/>
  <text x="500.0" y="142" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Uncertain band:</text>
  <text x="500.0" y="162" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">flag for review</text>
  <line x1="110" y1="450" x2="890" y2="450" stroke="#222222" stroke-width="2"/>
  <line x1="110" y1="450" x2="110" y2="110" stroke="#222222" stroke-width="2"/>
