  <text x="130" y="320" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">False merges</text>
  <text x="130" y="339" text-anchor="start" font-size="14" fill="#111111">(different entities combined)</text>
  <text x="870" y="320" text-anchor="end" font-size="15" fill="#111111" font-weight="bold">Missed duplicates</text>
  <text x="870" y="339" text-anchor="end" font-size="14" fill="#111111">(one entity left as several)</text>
  <text x="110" y="474" text-anchor="start" font-size="14" fill="#111111">Loose rule</text>
  <text x="890" y="474" text-anchor="end" font-size="14" fill="#111111">Strict rule</text>
  <text x="500.0" y="500" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">How strict the matching rule is</text>
  <text x="60" y="280.0" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold" transform="rotate(-90 60 280.0)">Number of errors</text>
  <text x="480.0" y="545" text-anchor="middle" font-size="13" fill="#333333">Schematic; not plotted from a single dataset. Where the band sits depends on the cost of each kind of error.</text>
</svg>
