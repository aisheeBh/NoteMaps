  <text x="40" y="488" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">Problems fixed:</text>
  <text x="40" y="516" text-anchor="start" font-size="14" fill="#111111">• Name variants, stray spaces</text>
  <text x="490" y="516" text-anchor="start" font-size="14" fill="#111111">• Leading zeros lost; scientific notation</text>
  <text x="40" y="540" text-anchor="start" font-size="14" fill="#111111">• Mixed date formats; day-month order</text>
  <text x="490" y="540" text-anchor="start" font-size="14" fill="#111111">• Same country written three ways</text>
  <text x="40" y="564" text-anchor="start" font-size="14" fill="#111111">• Number stored as text; inconsistent decimals</text>
