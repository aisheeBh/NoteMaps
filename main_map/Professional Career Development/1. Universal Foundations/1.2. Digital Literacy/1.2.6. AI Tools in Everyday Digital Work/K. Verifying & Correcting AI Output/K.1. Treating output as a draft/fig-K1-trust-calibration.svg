<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Calibrated trust, overtrust and distrust</title>
  <desc>A square chart. Horizontal axis: how trustworthy the tool actually is for the task. Vertical axis: how much the user trusts it. The diagonal is calibrated trust. The region above the diagonal is overtrust, leading to misuse; the region below is distrust, leading to disuse.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="40" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">Trust should track the tool's real trustworthiness</text>
  <polygon points="150,480 150,80 690,80" fill="url(#lines)" opacity="0.55"/>
  <polygon points="150,480 690,480 690,80" fill="url(#hatch)" opacity="0.55"/>
  <line x1="150" y1="480" x2="700" y2="480" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="150" y1="480" x2="150" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="150" y1="480" x2="690" y2="80" stroke="#222222" stroke-width="4"/>
  <rect x="190.0" y="148" width="220" height="86" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
  <text x="300" y="170" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">OVERTRUST</text>
  <text x="300" y="194" text-anchor="middle" font-size="15" fill="#111111">relies on it more than</text>
  <text x="300" y="218" text-anchor="middle" font-size="15" fill="#111111">it deserves: misuse</text>
  <rect x="450.0" y="378" width="220" height="86" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
  <text x="560" y="400" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">DISTRUST</text>
  <text x="560" y="424" text-anchor="middle" font-size="15" fill="#111111">relies on it less than</text>
  <text x="560" y="448" text-anchor="middle" font-size="15" fill="#111111">it deserves: disuse</text>
  <rect x="452" y="232" width="188" height="56" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="546" y="255" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">CALIBRATED TRUST</text>
  <text x="546" y="278" text-anchor="middle" font-size="15" fill="#111111">on the diagonal</text>
  <text x="420" y="515" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">How trustworthy the tool really is for this task</text>
  <text x="100" y="280" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111" transform="rotate(-90 100 280)">How much the user trusts it</text>
  <rect x="718" y="110" width="218" height="330" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="827.0" y="199.5" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Why drafts help</text>
  <text x="827.0" y="222.5" text-anchor="middle" font-size="15" fill="#111111">Treating output as a</text>
  <text x="827.0" y="242.7" text-anchor="middle" font-size="15" fill="#111111">draft keeps trust</text>
  <text x="827.0" y="263.0" text-anchor="middle" font-size="15" fill="#111111">near the diagonal:</text>
  <text x="827.0" y="283.2" text-anchor="middle" font-size="15" fill="#111111"></text>
  <text x="827.0" y="303.5" text-anchor="middle" font-size="15" fill="#111111">each check is new</text>
  <text x="827.0" y="323.7" text-anchor="middle" font-size="15" fill="#111111">evidence about how</text>
  <text x="827.0" y="344.0" text-anchor="middle" font-size="15" fill="#111111">reliable the tool is</text>
  <text x="827.0" y="364.2" text-anchor="middle" font-size="15" fill="#111111">for this kind of task</text>
  <text x="480.0" y="548" text-anchor="middle" font-size="14" fill="#333333" font-style="italic">Schematic, after Lee and See (2004); not plotted from data.</text>
</svg>
