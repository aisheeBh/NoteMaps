<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>From disuse to abuse: four relationships with automation</title>
  <desc>A horizontal spectrum of four relationships with an automated tool, after Parasuraman and Riley (1997): disuse, appropriate use, misuse and abuse, with an everyday example of each.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="40" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">Four relationships with an automated tool</text>
  <rect x="28.0" y="80" width="214.0" height="190" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="135.0" y="114" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">Disuse</text>
  <text x="135.0" y="138.3" text-anchor="middle" font-size="15" fill="#222222">Rejects useful help</text>
  <text x="135.0" y="158.6" text-anchor="middle" font-size="15" fill="#222222"></text>
  <text x="135.0" y="178.8" text-anchor="middle" font-size="15" fill="#222222">e.g. retypes a reliable</text>
  <text x="135.0" y="199.1" text-anchor="middle" font-size="15" fill="#222222">transcript by hand</text>
  <text x="135.0" y="219.3" text-anchor="middle" font-size="15" fill="#222222">out of suspicion</text>
  <rect x="258.0" y="80" width="214.0" height="190" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="365.0" y="114" text-anchor="middle" font-size="18" fill="#111111" font-weight="bold">Appropriate use</text>
  <text x="365.0" y="138.3" text-anchor="middle" font-size="15" fill="#111111">Relies where reliable,</text>
  <text x="365.0" y="158.6" text-anchor="middle" font-size="15" fill="#111111">checks where not</text>
  <text x="365.0" y="178.8" text-anchor="middle" font-size="15" fill="#111111"></text>
  <text x="365.0" y="199.1" text-anchor="middle" font-size="15" fill="#111111">e.g. uses the summary,</text>
  <text x="365.0" y="219.3" text-anchor="middle" font-size="15" fill="#111111">verifies the figures</text>
  <rect x="488.0" y="80" width="214.0" height="190" rx="8" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="595.0" y="114" text-anchor="middle" font-size="18" fill="#111111" font-weight="bold">Misuse</text>
  <text x="595.0" y="138.3" text-anchor="middle" font-size="15" fill="#111111">Over-relies; stops</text>
  <text x="595.0" y="158.6" text-anchor="middle" font-size="15" fill="#111111">checking</text>
  <text x="595.0" y="178.8" text-anchor="middle" font-size="15" fill="#111111"></text>
  <text x="595.0" y="199.1" text-anchor="middle" font-size="15" fill="#111111">e.g. forwards an AI</text>
  <text x="595.0" y="219.3" text-anchor="middle" font-size="15" fill="#111111">answer unread</text>
  <rect x="718.0" y="80" width="214.0" height="190" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="825.0" y="114" text-anchor="middle" font-size="18" fill="#111111" font-weight="bold">Abuse</text>
  <text x="825.0" y="138.3" text-anchor="middle" font-size="15" fill="#111111">Deploys automation</text>
  <text x="825.0" y="158.6" text-anchor="middle" font-size="15" fill="#111111">without regard for</text>
  <text x="825.0" y="178.8" text-anchor="middle" font-size="15" fill="#111111">the people affected</text>
  <text x="825.0" y="199.1" text-anchor="middle" font-size="15" fill="#111111"></text>
  <text x="825.0" y="219.3" text-anchor="middle" font-size="15" fill="#111111">e.g. auto-sends replies</text>
  <text x="825.0" y="239.6" text-anchor="middle" font-size="15" fill="#111111">no one reviews</text>
  <line x1="60" y1="305" x2="900" y2="305" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="480" y="332" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">increasing reliance and decreasing human checking</text>
  <text x="480.0" y="356" text-anchor="middle" font-size="14" fill="#333333" font-style="italic">After Parasuraman and Riley (1997).</text>
</svg>
