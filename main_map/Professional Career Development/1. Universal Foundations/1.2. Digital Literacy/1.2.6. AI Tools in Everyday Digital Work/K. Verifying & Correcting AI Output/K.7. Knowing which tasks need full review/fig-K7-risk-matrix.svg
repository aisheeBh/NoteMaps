<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Consequence and likelihood of error decide the level of review</title>
  <desc>A three-by-three grid. Horizontal axis: likelihood that the output contains an error, low, medium or high. Vertical axis: consequence if an error reaches the reader, low, medium or high. Cells show the recommended review level, from glance in the low-low corner to full review with independent checking in the high-high corner.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="40" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">Consequence and likelihood decide the level of review</text>
  <rect x="230" y="90" width="228" height="132" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="344.0" y="161.5" text-anchor="middle" font-size="17" fill="#111111">Targeted</text>
  <rect x="466" y="90" width="228" height="132" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="580.0" y="161.5" text-anchor="middle" font-size="17" fill="#111111">Full</text>
  <rect x="702" y="90" width="228" height="132" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="816.0" y="150.1" text-anchor="middle" font-size="17" fill="#111111">Full plus</text>
  <text x="816.0" y="173.0" text-anchor="middle" font-size="17" fill="#111111">independent</text>
  <rect x="230" y="230" width="228" height="132" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="344.0" y="301.5" text-anchor="middle" font-size="17" fill="#111111">Spot-check</text>
  <rect x="466" y="230" width="228" height="132" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="580.0" y="301.5" text-anchor="middle" font-size="17" fill="#111111">Targeted</text>
  <rect x="702" y="230" width="228" height="132" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="816.0" y="301.5" text-anchor="middle" font-size="17" fill="#111111">Full</text>
  <rect x="230" y="370" width="228" height="132" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="344.0" y="441.5" text-anchor="middle" font-size="17" fill="#222222">Glance</text>
  <rect x="466" y="370" width="228" height="132" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="580.0" y="441.5" text-anchor="middle" font-size="17" fill="#111111">Spot-check</text>
  <rect x="702" y="370" width="228" height="132" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="816.0" y="441.5" text-anchor="middle" font-size="17" fill="#111111">Targeted</text>
  <text x="344.0" y="532" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Low</text>
  <text x="580.0" y="532" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Medium</text>
  <text x="816.0" y="532" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">High</text>
  <text x="580.0" y="562" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Likelihood that the output contains an error</text>
  <text x="214" y="162.0" text-anchor="end" font-size="16" fill="#111111" font-weight="bold">High</text>
  <text x="214" y="302.0" text-anchor="end" font-size="16" fill="#111111" font-weight="bold">Medium</text>
  <text x="214" y="442.0" text-anchor="end" font-size="16" fill="#111111" font-weight="bold">Low</text>
  <text x="70" y="300.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111" transform="rotate(-90 70 300.0)">Consequence if an error gets through</text>
  <text x="480.0" y="584" text-anchor="middle" font-size="14" fill="#333333" font-style="italic">Schematic decision aid; reversibility, audience and reviewer expertise shift a task up or down.</text>
</svg>
