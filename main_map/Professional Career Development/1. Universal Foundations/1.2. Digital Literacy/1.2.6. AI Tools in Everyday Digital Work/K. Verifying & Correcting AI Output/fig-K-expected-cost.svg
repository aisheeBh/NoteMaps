<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Expected cost of three ways of handling one output</title>
  <desc>Bars comparing expected total cost, in minutes-equivalent, for a client document: no review has low checking cost but high expected error cost; targeted review has moderate checking cost and low expected error cost, the lowest total; full independent review has the highest checking cost and very low error cost. Illustrative figures.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="40" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">Checking cost plus expected error cost</text>
  <rect x="150" y="400.0" width="160" height="0.0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="150" y="124.0" width="160" height="276.0" fill="url(#lines)" stroke="#8B0000" stroke-width="2"/>
  <rect x="180" y="90.0" width="100" height="26" fill="#FFFFFF"/>
  <text x="230" y="110.0" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">total 120</text>
  <text x="230" y="424" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">No review</text>
  <rect x="390" y="365.5" width="160" height="34.5" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="390" y="310.3" width="160" height="55.199999999999996" fill="url(#lines)" stroke="#8B0000" stroke-width="2"/>
  <rect x="420" y="276.3" width="100" height="26" fill="#FFFFFF"/>
  <text x="470" y="296.3" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">total 39</text>
  <text x="470" y="424" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Targeted review</text>
  <rect x="630" y="262.0" width="160" height="138.0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="630" y="248.2" width="160" height="13.799999999999999" fill="url(#lines)" stroke="#8B0000" stroke-width="2"/>
  <rect x="660" y="214.2" width="100" height="26" fill="#FFFFFF"/>
  <text x="710" y="234.2" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">total 66</text>
  <text x="710" y="424" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Full independent review</text>
  <rect x="166" y="230" width="128" height="50" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
  <text x="230" y="251" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">expected</text>
  <text x="230" y="271" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">error cost</text>
  <rect x="646" y="318" width="128" height="50" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="710" y="339" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">checking</text>
  <text x="710" y="359" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">time</text>
  <line x1="110" y1="400" x2="900" y2="400" stroke="#222222" stroke-width="2"/>
  <text x="480.0" y="482" text-anchor="middle" font-size="14" fill="#333333" font-style="italic">Illustrative figures, in minutes-equivalent; the cheapest total depends on error likelihood and cost.</text>
</svg>
