<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>One written date, several possible readings</title>
  <desc>The numeric date 04/05/2026 at 09:00 can be read as 4 May or 5 April depending on convention, and the time can refer to different moments depending on time zone. Relative dates such as next Friday depend on when the text was written.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="40" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">One written date, several possible readings</text>
  <rect x="330" y="66" width="300" height="66" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="480.0" y="106.2" text-anchor="middle" font-size="22" fill="#FFFFFF">04/05/2026 09:00</text>
  <rect x="28" y="186" width="280" height="120" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="168.0" y="221.5" text-anchor="middle" font-size="18" fill="#111111" font-weight="bold">4 May 2026</text>
  <text x="168.0" y="245.8" text-anchor="middle" font-size="15" fill="#111111">Day first convention</text>
  <text x="168.0" y="266.0" text-anchor="middle" font-size="15" fill="#111111">(United Kingdom, India,</text>
  <text x="168.0" y="286.3" text-anchor="middle" font-size="15" fill="#111111">much of the world)</text>
  <rect x="340" y="186" width="280" height="120" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="480.0" y="231.6" text-anchor="middle" font-size="18" fill="#111111" font-weight="bold">5 April 2026</text>
  <text x="480.0" y="255.9" text-anchor="middle" font-size="15" fill="#111111">Month first convention</text>
  <text x="480.0" y="276.1" text-anchor="middle" font-size="15" fill="#111111">(United States)</text>
  <rect x="652" y="186" width="280" height="120" rx="8" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="792.0" y="221.5" text-anchor="middle" font-size="18" fill="#111111" font-weight="bold">Which 09:00?</text>
  <text x="792.0" y="245.8" text-anchor="middle" font-size="15" fill="#111111">09:00 where? London,</text>
  <text x="792.0" y="266.0" text-anchor="middle" font-size="15" fill="#111111">New York and Mumbai</text>
  <text x="792.0" y="286.3" text-anchor="middle" font-size="15" fill="#111111">differ by hours</text>
  <line x1="480" y1="134" x2="168" y2="182" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="134" x2="480" y2="182" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="134" x2="792" y2="182" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="28" y="330" width="904" height="90" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="480.0" y="360.3" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Unambiguous</text>
  <text x="480.0" y="383.2" text-anchor="middle" font-size="15" fill="#111111">Safe form: 4 May 2026, 09:00 UK time (BST)  -  month written as a word, time zone stated,</text>
  <text x="480.0" y="403.5" text-anchor="middle" font-size="15" fill="#111111">relative words such as next Friday replaced by a date</text>
  <text x="480.0" y="450" text-anchor="middle" font-size="14" fill="#333333" font-style="italic">The numeric style shown is common in generated text that mixes sources from different countries.</text>
</svg>
