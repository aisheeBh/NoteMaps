<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 512" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>A ladder of ways to test an instruction</title>
  <desc>Six steps rising from left to right, each giving stronger evidence that an instruction is safe and correct: read and explain, check against official documentation, preview or dry run, run on a copy, pilot on a small real subset, and full run with monitoring and a rollback plan.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="40" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">Stronger evidence at each step</text>
  <rect x="34" y="334" width="142" height="106" rx="6" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="105.0" y="364" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">Read and</text>
  <text x="105.0" y="386" text-anchor="middle" font-size="15" fill="#222222">explain each step</text>
  <text x="105.0" y="422" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">1</text>
  <rect x="188" y="286" width="142" height="154" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="259.0" y="316" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Check official</text>
  <text x="259.0" y="338" text-anchor="middle" font-size="15" fill="#111111">documentation</text>
  <text x="259.0" y="422" text-anchor="middle" font-size="18" fill="#111111" font-weight="bold">2</text>
  <rect x="342" y="238" width="142" height="202" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="413.0" y="268" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Preview or</text>
  <text x="413.0" y="290" text-anchor="middle" font-size="15" fill="#111111">dry run</text>
  <text x="413.0" y="422" text-anchor="middle" font-size="18" fill="#111111" font-weight="bold">3</text>
  <rect x="496" y="190" width="142" height="250" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="567.0" y="220" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Run on a</text>
  <text x="567.0" y="242" text-anchor="middle" font-size="15" fill="#111111">copy or sandbox</text>
  <text x="567.0" y="422" text-anchor="middle" font-size="18" fill="#111111" font-weight="bold">4</text>
  <rect x="650" y="142" width="142" height="298" rx="6" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="721.0" y="172" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Pilot on a</text>
  <text x="721.0" y="194" text-anchor="middle" font-size="15" fill="#111111">small real subset</text>
  <text x="721.0" y="422" text-anchor="middle" font-size="18" fill="#111111" font-weight="bold">5</text>
  <rect x="804" y="94" width="142" height="346" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="875.0" y="124" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Full run,</text>
  <text x="875.0" y="146" text-anchor="middle" font-size="15" fill="#111111">monitor, rollback</text>
  <text x="875.0" y="422" text-anchor="middle" font-size="18" fill="#111111" font-weight="bold">6</text>
  <line x1="60" y1="470" x2="900" y2="470" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="492" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">more effort, stronger evidence that the instruction does what it claims</text>
</svg>
