<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Traditions of checking that AI verification inherits</title>
  <desc>A horizontal timeline of checking traditions: proofreading and the printer's reader from early printing; magazine fact-checking departments from the 1920s; statistical quality control from the 1920s and 1930s; maker-checker controls in banking; software verification and validation from the 1970s; automation oversight in aviation and medicine from the 1980s and 1990s; and verification of generative AI output from 2022.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="40" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">Traditions of checking that AI verification inherits</text>
  <line x1="40" y1="250" x2="920" y2="250" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="108" cy="250" r="9" fill="#000000"/>
  <rect x="26.0" y="92" width="164" height="104" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="108.0" y="128.9" text-anchor="middle" font-size="16" fill="#222222" font-weight="bold">Printing era</text>
  <text x="108.0" y="150.5" text-anchor="middle" font-size="15" fill="#222222">Proofreaders and</text>
  <text x="108.0" y="170.8" text-anchor="middle" font-size="15" fill="#222222">printers' readers</text>
  <line x1="108" y1="196" x2="108" y2="240" stroke="#222222" stroke-width="1.5"/>
  <circle cx="232" cy="250" r="9" fill="#000000"/>
  <rect x="150.0" y="304" width="164" height="104" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="232.0" y="340.9" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">1920s</text>
  <text x="232.0" y="362.6" text-anchor="middle" font-size="15" fill="#111111">Magazine fact-</text>
  <text x="232.0" y="382.8" text-anchor="middle" font-size="15" fill="#111111">checking desks</text>
  <line x1="232" y1="260" x2="232" y2="304" stroke="#222222" stroke-width="1.5"/>
  <circle cx="356" cy="250" r="9" fill="#000000"/>
  <rect x="274.0" y="92" width="164" height="104" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="356.0" y="128.9" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">1920s-1930s</text>
  <text x="356.0" y="150.5" text-anchor="middle" font-size="15" fill="#111111">Statistical</text>
  <text x="356.0" y="170.8" text-anchor="middle" font-size="15" fill="#111111">quality control</text>
  <line x1="356" y1="196" x2="356" y2="240" stroke="#222222" stroke-width="1.5"/>
  <circle cx="480" cy="250" r="9" fill="#000000"/>
  <rect x="398.0" y="304" width="164" height="104" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="480.0" y="340.9" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">20th century</text>
  <text x="480.0" y="362.6" text-anchor="middle" font-size="15" fill="#111111">Maker-checker</text>
  <text x="480.0" y="382.8" text-anchor="middle" font-size="15" fill="#111111">in banking</text>
  <line x1="480" y1="260" x2="480" y2="304" stroke="#222222" stroke-width="1.5"/>
  <circle cx="604" cy="250" r="9" fill="#000000"/>
  <rect x="522.0" y="92" width="164" height="104" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="604.0" y="128.9" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">1970s</text>
  <text x="604.0" y="150.5" text-anchor="middle" font-size="15" fill="#111111">Software verification</text>
  <text x="604.0" y="170.8" text-anchor="middle" font-size="15" fill="#111111">and validation</text>
  <line x1="604" y1="196" x2="604" y2="240" stroke="#222222" stroke-width="1.5"/>
  <circle cx="728" cy="250" r="9" fill="#000000"/>
  <rect x="646.0" y="304" width="164" height="104" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="728.0" y="340.9" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">1980s-1990s</text>
  <text x="728.0" y="362.6" text-anchor="middle" font-size="15" fill="#111111">Automation oversight</text>
  <text x="728.0" y="382.8" text-anchor="middle" font-size="15" fill="#111111">in aviation, medicine</text>
  <line x1="728" y1="260" x2="728" y2="304" stroke="#222222" stroke-width="1.5"/>
  <circle cx="852" cy="250" r="9" fill="#000000"/>
  <rect x="770.0" y="92" width="164" height="104" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="852.0" y="128.9" text-anchor="middle" font-size="16" fill="#FFFFFF" font-weight="bold">2022 onward</text>
  <text x="852.0" y="150.5" text-anchor="middle" font-size="15" fill="#FFFFFF">Checking generative</text>
  <text x="852.0" y="170.8" text-anchor="middle" font-size="15" fill="#FFFFFF">AI output</text>
  <line x1="852" y1="196" x2="852" y2="240" stroke="#222222" stroke-width="1.5"/>
  <text x="480.0" y="452" text-anchor="middle" font-size="14" fill="#333333" font-style="italic">Dates are approximate starting points; each tradition continues today.</text>
</svg>
