<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>How figures drift when a tool rewrites or summarises</title>
  <desc>Five rows, each pairing what a source said with what a generated summary said: a range collapsed to its upper bound, a qualifier dropped, a percentage change confused with a percentage-point change, a period changed, and units changed.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="40" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">Figures drift when text is rewritten</text>
  <text x="150" y="88" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Kind of drift</text>
  <text x="450" y="88" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Source said</text>
  <text x="760" y="88" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Generated text said</text>
  <rect x="28" y="104" width="244" height="62" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="150.0" y="140.2" text-anchor="middle" font-size="16" fill="#222222">Range collapsed</text>
  <rect x="296" y="104" width="308" height="62" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="450.0" y="140.2" text-anchor="middle" font-size="16" fill="#111111">costs of 2 to 3 million</text>
  <rect x="628" y="104" width="304" height="62" rx="8" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="780.0" y="140.2" text-anchor="middle" font-size="16" fill="#111111">costs of 3 million</text>
  <line x1="606" y1="135" x2="626" y2="135" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="28" y="180" width="244" height="62" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="150.0" y="216.2" text-anchor="middle" font-size="16" fill="#222222">Qualifier dropped</text>
  <rect x="296" y="180" width="308" height="62" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="450.0" y="216.2" text-anchor="middle" font-size="16" fill="#111111">up to 40% faster</text>
  <rect x="628" y="180" width="304" height="62" rx="8" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="780.0" y="216.2" text-anchor="middle" font-size="16" fill="#111111">40% faster</text>
  <line x1="606" y1="211" x2="626" y2="211" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="28" y="256" width="244" height="62" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="150.0" y="292.2" text-anchor="middle" font-size="16" fill="#222222">Points become per cent</text>
  <rect x="296" y="256" width="308" height="62" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="450.0" y="292.2" text-anchor="middle" font-size="16" fill="#111111">rose from 10% to 12%</text>
  <rect x="628" y="256" width="304" height="62" rx="8" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="780.0" y="292.2" text-anchor="middle" font-size="16" fill="#111111">rose by 2%</text>
  <line x1="606" y1="287" x2="626" y2="287" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="28" y="332" width="244" height="62" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="150.0" y="368.2" text-anchor="middle" font-size="16" fill="#222222">Period shifted</text>
  <rect x="296" y="332" width="308" height="62" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="450.0" y="368.2" text-anchor="middle" font-size="16" fill="#111111">in the first half of 2025</text>
  <rect x="628" y="332" width="304" height="62" rx="8" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="780.0" y="368.2" text-anchor="middle" font-size="16" fill="#111111">in 2025</text>
  <line x1="606" y1="363" x2="626" y2="363" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="28" y="408" width="244" height="62" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="150.0" y="444.2" text-anchor="middle" font-size="16" fill="#222222">Unit changed</text>
  <rect x="296" y="408" width="308" height="62" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="450.0" y="444.2" text-anchor="middle" font-size="16" fill="#111111">4,000 hours of effort</text>
  <rect x="628" y="408" width="304" height="62" rx="8" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="780.0" y="444.2" text-anchor="middle" font-size="16" fill="#111111">4,000 days of effort</text>
  <line x1="606" y1="439" x2="626" y2="439" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480.0" y="500" text-anchor="middle" font-size="14" fill="#333333" font-style="italic">Illustrative examples. Each change is small, fluent and easy to miss.</text>
</svg>
