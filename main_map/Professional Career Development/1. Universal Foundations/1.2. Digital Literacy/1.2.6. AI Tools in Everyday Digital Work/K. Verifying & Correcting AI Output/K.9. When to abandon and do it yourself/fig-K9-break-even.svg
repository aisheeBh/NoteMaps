<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Cumulative time with the tool and without it</title>
  <desc>A schematic line chart of cumulative minutes spent against rounds of work. Writing the piece yourself takes a steady 45 minutes in total, shown as a horizontal dashed line. Using the tool starts low, at 10 minutes for the first draft and check, then rises by about 12 minutes with each correction round. The tool line crosses the do-it-yourself line after about three correction rounds.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="40" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">When correction rounds overtake doing it yourself</text>
  <line x1="130" y1="440" x2="874" y2="440" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="130" y1="440" x2="130" y2="88" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="118" y="445.0" text-anchor="end" font-size="15" fill="#111111">0</text>
  <text x="118" y="360.0" text-anchor="end" font-size="15" fill="#111111">20</text>
  <line x1="130" y1="355.0" x2="860" y2="355.0" stroke="#999999" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="118" y="275.0" text-anchor="end" font-size="15" fill="#111111">40</text>
  <line x1="130" y1="270.0" x2="860" y2="270.0" stroke="#999999" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="118" y="190.0" text-anchor="end" font-size="15" fill="#111111">60</text>
  <line x1="130" y1="185.0" x2="860" y2="185.0" stroke="#999999" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="118" y="105.0" text-anchor="end" font-size="15" fill="#111111">80</text>
  <line x1="130" y1="100.0" x2="860" y2="100.0" stroke="#999999" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="130.0" y="464" text-anchor="middle" font-size="15" fill="#111111">0</text>
  <text x="276.0" y="464" text-anchor="middle" font-size="15" fill="#111111">1</text>
  <text x="422.0" y="464" text-anchor="middle" font-size="15" fill="#111111">2</text>
  <text x="568.0" y="464" text-anchor="middle" font-size="15" fill="#111111">3</text>
  <text x="714.0" y="464" text-anchor="middle" font-size="15" fill="#111111">4</text>
  <text x="860.0" y="464" text-anchor="middle" font-size="15" fill="#111111">5</text>
  <line x1="130" y1="248.75" x2="860" y2="248.75" stroke="#1E5E24" stroke-width="3.5" stroke-dasharray="10 6"/>
  <rect x="673.5" y="258.75" width="232" height="26" fill="#FFFFFF"/>
  <text x="677.5" y="277.75" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">Writing it yourself: 45 min</text>
  <path d="M130.0,397.5 L276.0,346.5 L422.0,295.5 L568.0,244.5 L714.0,193.5 L860.0,142.5" fill="none" stroke="#1F3B5C" stroke-width="3.5"/>
  <circle cx="130.0" cy="397.5" r="5" fill="#1F3B5C"/>
  <circle cx="276.0" cy="346.5" r="5" fill="#1F3B5C"/>
  <circle cx="422.0" cy="295.5" r="5" fill="#1F3B5C"/>
  <circle cx="568.0" cy="244.5" r="5" fill="#1F3B5C"/>
  <circle cx="714.0" cy="193.5" r="5" fill="#1F3B5C"/>
  <circle cx="860.0" cy="142.5" r="5" fill="#1F3B5C"/>
  <text x="283.3" y="389.0" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">With the tool: draft, check,</text>
  <text x="283.3" y="411.0" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">then +12 min per round</text>
  <line x1="555.8333333333333" y1="242.75" x2="555.8333333333333" y2="440" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="567.8333333333333" y="376" width="184" height="46" rx="6" fill="#FFFFFF" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="659.8333333333333" y="394" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Break-even after</text>
  <text x="659.8333333333333" y="414" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">about 3 rounds</text>
  <text x="495.0" y="494" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Correction rounds after the first draft</text>
  <text x="66" y="270.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111" transform="rotate(-90 66 270.0)">Cumulative minutes</text>
  <text x="480.0" y="526" text-anchor="middle" font-size="14" fill="#333333" font-style="italic">Schematic with illustrative figures; real times vary widely by task and person.</text>
</svg>
