<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Tool fit and verification cost</title>
  <desc>A two-by-two grid. Horizontal axis: how costly it is to verify the output, low or high. Vertical axis: how well the tool fits the task, good or poor. Good fit and cheap verification: use the tool. Good fit but costly verification: use it only if verification is planned and resourced. Poor fit and cheap verification: try briefly, abandon quickly. Poor fit and costly verification: do it yourself.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="40" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">Tool fit and the cost of checking decide</text>
  <text x="385.0" y="86" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Cheap to verify</text>
  <text x="745.0" y="86" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Costly to verify</text>
  <text x="120" y="195.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111" transform="rotate(-90 120 195.0)">Tool fits the task</text>
  <text x="120" y="395.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111" transform="rotate(-90 120 395.0)">Poor fit</text>
  <rect x="210" y="100" width="350" height="190" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="385.0" y="160.0" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">USE THE TOOL</text>
  <text x="385.0" y="183.0" text-anchor="middle" font-size="15" fill="#111111">Reformatting, first drafts</text>
  <text x="385.0" y="203.2" text-anchor="middle" font-size="15" fill="#111111">of routine messages</text>
  <text x="385.0" y="223.5" text-anchor="middle" font-size="15" fill="#111111"></text>
  <text x="385.0" y="243.7" text-anchor="middle" font-size="15" fill="#111111">Clear time saving</text>
  <rect x="570" y="100" width="350" height="190" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="745.0" y="149.9" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">USE WITH PLANNED CHECKS</text>
  <text x="745.0" y="172.9" text-anchor="middle" font-size="15" fill="#111111">Long summaries, analysis</text>
  <text x="745.0" y="193.1" text-anchor="middle" font-size="15" fill="#111111">of many documents</text>
  <text x="745.0" y="213.4" text-anchor="middle" font-size="15" fill="#111111"></text>
  <text x="745.0" y="233.6" text-anchor="middle" font-size="15" fill="#111111">Only if checking is</text>
  <text x="745.0" y="253.9" text-anchor="middle" font-size="15" fill="#111111">planned and resourced</text>
  <rect x="210" y="300" width="350" height="190" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="385.0" y="349.9" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">TRY, THEN DECIDE FAST</text>
  <text x="385.0" y="372.8" text-anchor="middle" font-size="15" fill="#111111">Unusual formats,</text>
  <text x="385.0" y="393.1" text-anchor="middle" font-size="15" fill="#111111">niche requests</text>
  <text x="385.0" y="413.3" text-anchor="middle" font-size="15" fill="#111111"></text>
  <text x="385.0" y="433.6" text-anchor="middle" font-size="15" fill="#111111">Try briefly; abandon</text>
  <text x="385.0" y="453.8" text-anchor="middle" font-size="15" fill="#111111">quickly if it fails</text>
  <rect x="570" y="300" width="350" height="190" rx="8" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="745.0" y="349.9" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">DO IT YOURSELF</text>
  <text x="745.0" y="372.8" text-anchor="middle" font-size="15" fill="#111111">Bespoke judgement, niche</text>
  <text x="745.0" y="393.1" text-anchor="middle" font-size="15" fill="#111111">facts, relationship-</text>
  <text x="745.0" y="413.3" text-anchor="middle" font-size="15" fill="#111111">critical writing</text>
  <text x="745.0" y="433.6" text-anchor="middle" font-size="15" fill="#111111"></text>
  <text x="745.0" y="453.8" text-anchor="middle" font-size="15" fill="#111111">Faster and safer by hand</text>
  <text x="480.0" y="534" text-anchor="middle" font-size="14" fill="#333333" font-style="italic">Schematic decision aid; fit and verification cost are judged for the specific task, not the tool in general.</text>
</svg>
