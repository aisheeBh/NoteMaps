<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Three pause points in an AI-assisted task</title>
  <desc>A horizontal timeline of an AI-assisted task with three pause points. Brief, before prompting: decide the review level, gather sources, note what must be in the output. Check, after generation: run the planned checks against sources. Release, before sending or sharing: a final pass on names, numbers, dates, promises and recipients.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="40" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">Three pause points in an AI-assisted task</text>
  <line x1="40" y1="120" x2="920" y2="120" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="170" cy="120" r="16" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <text x="170" y="82" text-anchor="middle" font-size="18" fill="#111111" font-weight="bold">BRIEF</text>
  <text x="170" y="160" text-anchor="middle" font-size="15" fill="#222222" font-style="italic">before prompting</text>
  <circle cx="480" cy="120" r="16" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <text x="480" y="82" text-anchor="middle" font-size="18" fill="#111111" font-weight="bold">CHECK</text>
  <text x="480" y="160" text-anchor="middle" font-size="15" fill="#222222" font-style="italic">after generation</text>
  <circle cx="790" cy="120" r="16" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <text x="790" y="82" text-anchor="middle" font-size="18" fill="#111111" font-weight="bold">RELEASE</text>
  <text x="790" y="160" text-anchor="middle" font-size="15" fill="#222222" font-style="italic">before sending</text>
  <rect x="40" y="180" width="260" height="150" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="170.0" y="213" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Brief</text>
  <text x="170.0" y="235.9" text-anchor="middle" font-size="15" fill="#111111">Choose the review level</text>
  <text x="170.0" y="256.2" text-anchor="middle" font-size="15" fill="#111111">Gather the sources</text>
  <text x="170.0" y="276.4" text-anchor="middle" font-size="15" fill="#111111">Note what must be in it</text>
  <text x="170.0" y="296.7" text-anchor="middle" font-size="15" fill="#111111">Note what must not be</text>
  <rect x="350" y="180" width="260" height="150" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="480.0" y="213" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Check</text>
  <text x="480.0" y="235.9" text-anchor="middle" font-size="15" fill="#111111">Read it all</text>
  <text x="480.0" y="256.2" text-anchor="middle" font-size="15" fill="#111111">Run the planned checks</text>
  <text x="480.0" y="276.4" text-anchor="middle" font-size="15" fill="#111111">against the sources</text>
  <text x="480.0" y="296.7" text-anchor="middle" font-size="15" fill="#111111">Correct and re-check</text>
  <rect x="660" y="180" width="260" height="150" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="790.0" y="213" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Release</text>
  <text x="790.0" y="235.9" text-anchor="middle" font-size="15" fill="#111111">Names, numbers, dates</text>
  <text x="790.0" y="256.2" text-anchor="middle" font-size="15" fill="#111111">Promises and claims</text>
  <text x="790.0" y="276.4" text-anchor="middle" font-size="15" fill="#111111">Recipients and</text>
  <text x="790.0" y="296.7" text-anchor="middle" font-size="15" fill="#111111">attachments</text>
  <text x="480.0" y="372" text-anchor="middle" font-size="14" fill="#333333" font-style="italic">Each pause takes seconds to minutes; together they turn checking from an intention into a habit.</text>
</svg>
