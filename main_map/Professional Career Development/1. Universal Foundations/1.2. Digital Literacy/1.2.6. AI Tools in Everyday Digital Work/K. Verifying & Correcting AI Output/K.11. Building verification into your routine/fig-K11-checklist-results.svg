<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Results of the surgical safety checklist study</title>
  <desc>Paired bars from a 2009 study in eight hospitals in eight cities worldwide. Death rate fell from 1.5 per cent before the checklist to 0.8 per cent after. Rate of inpatient complications fell from 11.0 per cent to 7.0 per cent.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="40" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">Before and after a surgical safety checklist (2009)</text>
  <rect x="150" y="327.0" width="120" height="33.0" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5"/>
  <rect x="170" y="293.0" width="80" height="26" fill="#FFFFFF"/>
  <text x="210" y="313.0" text-anchor="middle" font-size="18" fill="#111111" font-weight="bold">1.5%</text>
  <text x="210" y="382" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Before</text>
  <rect x="300" y="342.4" width="120" height="17.6" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="320" y="308.4" width="80" height="26" fill="#FFFFFF"/>
  <text x="360" y="328.4" text-anchor="middle" font-size="18" fill="#111111" font-weight="bold">0.8%</text>
  <text x="360" y="382" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">After</text>
  <text x="285" y="410" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Deaths</text>
  <rect x="510" y="118.0" width="120" height="242.0" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5"/>
  <rect x="530" y="84.0" width="80" height="26" fill="#FFFFFF"/>
  <text x="570" y="104.0" text-anchor="middle" font-size="18" fill="#111111" font-weight="bold">11.0%</text>
  <text x="570" y="382" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Before</text>
  <rect x="660" y="206.0" width="120" height="154.0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="680" y="172.0" width="80" height="26" fill="#FFFFFF"/>
  <text x="720" y="192.0" text-anchor="middle" font-size="18" fill="#111111" font-weight="bold">7.0%</text>
  <text x="720" y="382" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">After</text>
  <text x="645" y="410" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Complications</text>
  <line x1="110" y1="360" x2="860" y2="360" stroke="#222222" stroke-width="2"/>
  <text x="480.0" y="440" text-anchor="middle" font-size="14" fill="#333333" font-style="italic">Rates reported by Haynes and colleagues (2009) across eight hospitals; before and after comparison, not a randomised trial.</text>
</svg>
