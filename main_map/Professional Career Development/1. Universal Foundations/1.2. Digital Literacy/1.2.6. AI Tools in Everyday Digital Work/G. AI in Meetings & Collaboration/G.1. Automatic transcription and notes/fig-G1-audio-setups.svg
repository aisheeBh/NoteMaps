<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Recording set-ups and transcription difficulty</title>
<desc>Schematic ranking of meeting audio set-ups from easiest to hardest to transcribe.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480" y="44" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">How hard each set-up makes transcription (schematic)</text>
<line x1="290" y1="74" x2="290" y2="460" stroke="#222222" stroke-width="2"/>
<text x="278" y="107.66666666666667" font-size="15" text-anchor="end" font-weight="normal" fill="#111111">Headset, one person</text>
<text x="278" y="125.66666666666667" font-size="15" text-anchor="end" font-weight="normal" fill="#111111">per device</text>
<rect x="290" y="92.03333333333333" width="101.66666666666667" height="39.266666666666666" rx="2" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
<text x="399.6666666666667" y="116.66666666666667" font-size="15" text-anchor="start" font-weight="bold" fill="#111111">Easiest</text>
<text x="278" y="171.0" font-size="15" text-anchor="end" font-weight="normal" fill="#111111">Laptop microphone,</text>
<text x="278" y="189.0" font-size="15" text-anchor="end" font-weight="normal" fill="#111111">quiet home office</text>
<rect x="290" y="155.36666666666667" width="203.33333333333334" height="39.266666666666666" rx="2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
<text x="501.33333333333337" y="180.0" font-size="15" text-anchor="start" font-weight="bold" fill="#111111"></text>
<text x="278" y="234.33333333333334" font-size="15" text-anchor="end" font-weight="normal" fill="#111111">Conference microphone</text>
<text x="278" y="252.33333333333334" font-size="15" text-anchor="end" font-weight="normal" fill="#111111">array, hybrid room</text>
<rect x="290" y="218.70000000000002" width="264.3333333333333" height="39.266666666666666" rx="2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
<text x="562.3333333333333" y="243.33333333333334" font-size="15" text-anchor="start" font-weight="bold" fill="#111111"></text>
<text x="278" y="297.6666666666667" font-size="15" text-anchor="end" font-weight="normal" fill="#111111">One laptop microphone</text>
<text x="278" y="315.6666666666667" font-size="15" text-anchor="end" font-weight="normal" fill="#111111">for a whole room</text>
<rect x="290" y="282.03333333333336" width="406.6666666666667" height="39.266666666666666" rx="2" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<text x="704.6666666666667" y="306.6666666666667" font-size="15" text-anchor="start" font-weight="bold" fill="#111111"></text>
<text x="278" y="361.00000000000006" font-size="15" text-anchor="end" font-weight="normal" fill="#111111">Phone on the table,</text>
<text x="278" y="379.00000000000006" font-size="15" text-anchor="end" font-weight="normal" fill="#111111">face-to-face meeting</text>
<rect x="290" y="345.36666666666673" width="447.3333333333333" height="39.266666666666666" rx="2" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<text x="745.3333333333333" y="370.00000000000006" font-size="15" text-anchor="start" font-weight="bold" fill="#111111"></text>
<text x="278" y="424.33333333333337" font-size="15" text-anchor="end" font-weight="normal" fill="#111111">Several open laptops</text>
<text x="278" y="442.33333333333337" font-size="15" text-anchor="end" font-weight="normal" fill="#111111">in one room, echo</text>
<rect x="290" y="408.70000000000005" width="528.6666666666666" height="39.266666666666666" rx="2" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
<text x="826.6666666666666" y="433.33333333333337" font-size="15" text-anchor="start" font-weight="bold" fill="#111111">Hardest</text>
<text x="40" y="516" font-size="13" text-anchor="start" font-weight="normal" fill="#333333" font-style="italic">Schematic ranking for illustration; not plotted from a single dataset. Bar length = relative difficulty.</text>
</svg>