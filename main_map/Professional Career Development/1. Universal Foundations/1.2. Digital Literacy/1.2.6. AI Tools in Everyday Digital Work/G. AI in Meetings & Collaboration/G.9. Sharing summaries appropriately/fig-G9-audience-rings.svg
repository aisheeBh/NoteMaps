<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Audience rings for a meeting record</title>
<desc>Concentric rings from participants at the centre to external parties and organisation-wide search at the edge, with what each should receive.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">The further out, the less of the record</text>
<circle cx="300" cy="318" r="250" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
<circle cx="300" cy="318" r="195" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<circle cx="300" cy="318" r="140" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
<circle cx="300" cy="318" r="80" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
<rect x="224.2" y="79" width="151.6" height="24" fill="#FFFFFF" rx="3"/>
<text x="300" y="96" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">External, search</text>
<rect x="224.2" y="133" width="151.6" height="24" fill="#FFFFFF" rx="3"/>
<text x="300" y="150" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Team, management</text>
<rect x="254.3" y="189" width="91.39999999999999" height="24" fill="#FFFFFF" rx="3"/>
<text x="300" y="206" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Absentees</text>
<rect x="241.4" y="293" width="117.19999999999999" height="24" fill="#FFFFFF" rx="3"/>
<text x="300" y="310" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Participants</text>
<text x="590" y="150" font-size="16" text-anchor="start" font-weight="bold" fill="#111111">Participants</text>
<text x="590" y="172" font-size="15" text-anchor="start" font-weight="normal" fill="#111111">Reviewed summary; transcript on request</text>
<text x="590" y="222" font-size="16" text-anchor="start" font-weight="bold" fill="#111111">Invited absentees</text>
<text x="590" y="244" font-size="15" text-anchor="start" font-weight="normal" fill="#111111">Reviewed summary</text>
<text x="590" y="294" font-size="16" text-anchor="start" font-weight="bold" fill="#111111">Wider team, management</text>
<text x="590" y="316" font-size="15" text-anchor="start" font-weight="normal" fill="#111111">Decisions, actions, status, risks</text>
<text x="590" y="366" font-size="16" text-anchor="start" font-weight="bold" fill="#111111">External parties</text>
<text x="590" y="388" font-size="15" text-anchor="start" font-weight="normal" fill="#111111">Agreed outcomes and commitments only</text>
<text x="590" y="438" font-size="16" text-anchor="start" font-weight="bold" fill="#111111">Organisation-wide search</text>
<text x="590" y="460" font-size="15" text-anchor="start" font-weight="normal" fill="#111111">Only curated, published records</text>
</svg>