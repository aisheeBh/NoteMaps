<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Delay between speech and text</title>
<desc>Schematic timeline: a spoken sentence and when it reaches readers through automatic captions, interpreting, human captioning and translated captions.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">When a spoken sentence reaches the reader (schematic)</text>
<text x="286" y="117" font-size="15" text-anchor="end" font-weight="bold" fill="#111111">Speaker says the sentence</text>
<rect x="300.0" y="98" width="180.0" height="30" rx="3" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
<text x="286" y="175" font-size="15" text-anchor="end" font-weight="bold" fill="#111111">Automatic captions</text>
<rect x="348.0" y="156" width="192.0" height="30" rx="3" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
<text x="286" y="233" font-size="15" text-anchor="end" font-weight="bold" fill="#111111">Sign language interpreter</text>
<rect x="360.0" y="214" width="203.99999999999997" height="30" rx="3" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
<text x="286" y="291" font-size="15" text-anchor="end" font-weight="bold" fill="#111111">Human captioner (CART)</text>
<rect x="384.0" y="272" width="228.0" height="30" rx="3" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<text x="286" y="349" font-size="15" text-anchor="end" font-weight="bold" fill="#111111">Translated captions</text>
<rect x="432.0" y="330" width="264.00000000000006" height="30" rx="3" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
<text x="286" y="407" font-size="15" text-anchor="end" font-weight="bold" fill="#111111">Conversation moves on</text>
<rect x="672.0" y="388" width="228.0" height="30" rx="3" fill="#E6E6E6" stroke="#666666" stroke-width="2" stroke-dasharray="2 4"/>
<line x1="300" y1="450" x2="900" y2="450" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="600.0" y="478" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Time</text>
<text x="40" y="505" font-size="13" text-anchor="start" font-weight="normal" fill="#333333" font-style="italic">Schematic: relative order only; actual delays vary by system, connection and speaker.</text>
</svg>