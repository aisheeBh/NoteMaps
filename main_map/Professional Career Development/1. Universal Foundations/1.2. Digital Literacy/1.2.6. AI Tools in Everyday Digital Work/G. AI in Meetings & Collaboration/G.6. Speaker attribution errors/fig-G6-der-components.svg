<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Components of diarisation error</title>
<desc>Stacked bar of 600 seconds of speech split into correctly attributed, confused and missed speech, plus false alarm.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">What makes up the diarisation error rate</text>
<rect x="60" y="110" width="663.0" height="70" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
<rect x="723.0" y="110" width="78.0" height="70" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
<rect x="801.0" y="110" width="23.400000000000002" height="70" rx="0" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<rect x="834.4" y="110" width="15.600000000000001" height="70" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
<rect x="220" y="130" width="140" height="28" fill="#FFFFFF" rx="3"/>
<text x="290" y="150" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Correct: 510 s</text>
<line x1="762.0" y1="182" x2="762.0" y2="214" stroke="#333333" stroke-width="1.5"/>
<text x="762.0" y="230" font-size="15" text-anchor="end" font-weight="bold" fill="#111111">Confusion: 60 s</text>
<line x1="812.7" y1="182" x2="812.7" y2="259" stroke="#333333" stroke-width="1.5"/>
<text x="812.7" y="275" font-size="15" text-anchor="end" font-weight="bold" fill="#111111">Missed: 18 s</text>
<line x1="842.1999999999999" y1="182" x2="842.1999999999999" y2="304" stroke="#333333" stroke-width="1.5"/>
<text x="842.1999999999999" y="320" font-size="15" text-anchor="end" font-weight="bold" fill="#111111">False alarm: 12 s (non-speech)</text>
<text x="60" y="96" font-size="15" text-anchor="start" font-weight="bold" fill="#111111">Total speech: 600 seconds</text>
<text x="40" y="365" font-size="15" text-anchor="start" font-weight="bold" fill="#111111">DER = (18 + 12 + 60) / 600 = 0.15. Figures from the formula example (illustrative).</text>
</svg>