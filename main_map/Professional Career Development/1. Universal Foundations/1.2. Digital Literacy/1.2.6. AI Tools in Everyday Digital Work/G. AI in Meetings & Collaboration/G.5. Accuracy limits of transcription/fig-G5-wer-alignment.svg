<text x="830.0" y="128" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">of</text>
<rect x="800" y="180" width="60" height="44" rx="4" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
<rect x="805" y="190" width="50" height="24" fill="#FFFFFF" rx="3"/>
