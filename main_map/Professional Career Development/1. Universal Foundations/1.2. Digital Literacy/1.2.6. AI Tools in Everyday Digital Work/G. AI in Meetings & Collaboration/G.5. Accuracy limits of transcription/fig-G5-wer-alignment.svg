<rect x="866" y="100" width="60" height="44" rx="4" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="896.0" y="128" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">July</text>
<rect x="866" y="180" width="60" height="44" rx="4" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="896.0" y="208" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">July</text>
<text x="40" y="340" font-size="16" text-anchor="start" font-weight="bold" fill="#111111">S = substitution (2);  I = insertion (1);  D = deletion (1)</text>
<text x="40" y="368" font-size="16" text-anchor="start" font-weight="bold" fill="#111111">WER = (2 + 1 + 1) / 11 reference words = 0.36</text>
<text x="40" y="430" font-size="13" text-anchor="start" font-weight="normal" fill="#333333" font-style="italic">Constructed example. Only two of the four errors (can't, fifteen) change the meaning.</text>
</svg>