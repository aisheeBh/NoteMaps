<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Transcripts held at any one time</title>
<desc>Bar chart of transcripts held under 30-day, 120-day and no-expiry settings for 400 meetings a week.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480" y="44" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">Transcripts held at any one time (400 meetings a week)</text>
<line x1="260" y1="74" x2="260" y2="340" stroke="#222222" stroke-width="2"/>
<text x="248" y="128.33333333333334" font-size="15" text-anchor="end" font-weight="normal" fill="#111111">30-day expiry</text>
<rect x="260" y="101.33333333333334" width="11.452631578947368" height="44" rx="2" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
<text x="279.4526315789474" y="128.33333333333334" font-size="15" text-anchor="start" font-weight="bold" fill="#111111">about 1,700</text>
<text x="248" y="215.00000000000003" font-size="15" text-anchor="end" font-weight="normal" fill="#111111">120-day expiry</text>
<rect x="260" y="188.00000000000003" width="46.21473684210526" height="44" rx="2" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<text x="314.21473684210525" y="215.00000000000003" font-size="15" text-anchor="start" font-weight="bold" fill="#111111">about 6,860</text>
<text x="248" y="292.6666666666667" font-size="15" text-anchor="end" font-weight="normal" fill="#111111">No expiry, after</text>
<text x="248" y="310.6666666666667" font-size="15" text-anchor="end" font-weight="normal" fill="#111111">three years</text>
<rect x="260" y="274.6666666666667" width="420.37894736842105" height="44" rx="2" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
<text x="688.378947368421" y="301.6666666666667" font-size="15" text-anchor="start" font-weight="bold" fill="#111111">about 62,400 and growing</text>
<text x="40" y="396" font-size="13" text-anchor="start" font-weight="normal" fill="#333333" font-style="italic">Illustrative figures: meetings per week x weeks retained.</text>
</svg>