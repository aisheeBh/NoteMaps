<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Depths of reading a thread</title>
  <desc>Four layers from shallowest to deepest: the AI summary, the summary plus the latest message, the key messages traced from the summary, and the full thread. An arrow at the side indicates rising effort and reliability with depth.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Depths of reading a thread</text>
  <rect x="150" y="66" width="786" height="72" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="172" y="96" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">1. Summary only</text>
  <text x="172" y="118" text-anchor="start" font-size="14.5" fill="#111111">Fine for awareness of threads that do not need action from the reader</text>
  <rect x="150" y="148" width="786" height="72" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="172" y="178" text-anchor="start" font-size="16" font-weight="bold" fill="#000000">2. Summary + latest message</text>
  <text x="172" y="200" text-anchor="start" font-size="14.5" fill="#000000">The latest message shows the current state; checks for staleness</text>
  <rect x="150" y="230" width="786" height="72" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="159" y="239" width="768" height="54" rx="4" fill="#FFFFFF"/>
  <text x="172" y="260" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">3. Summary + traced key messages</text>
  <text x="172" y="282" text-anchor="start" font-size="14.5" fill="#111111">Each decision and action checked against the message it came from</text>
  <rect x="150" y="312" width="786" height="72" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="172" y="342" text-anchor="start" font-size="16" font-weight="bold" fill="#FFFFFF">4. Full thread</text>
  <text x="172" y="364" text-anchor="start" font-size="14.5" fill="#FFFFFF">Needed before signing, approving, disputing or speaking for the group</text>
  <line x1="90" y1="70" x2="90" y2="380" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="28" y="195" width="124" height="48" fill="#FFFFFF"/>
  <text x="90" y="211" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">More effort,</text>
  <text x="90" y="229" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">more reliable</text>
  <text x="480" y="424" text-anchor="middle" font-size="13" fill="#333333">Choose the depth by what the reader must do next, not by the length of the thread.</text>
</svg>
