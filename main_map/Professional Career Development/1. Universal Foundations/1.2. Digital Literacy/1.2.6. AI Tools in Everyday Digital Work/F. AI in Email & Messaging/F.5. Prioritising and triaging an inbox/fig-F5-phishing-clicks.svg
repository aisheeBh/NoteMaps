<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Click-through rates in an AI spear-phishing experiment</title>
  <desc>Horizontal bars showing click-through rates from a 2024 human-subject study: control group generic phishing emails 12 per cent; emails written by human experts 54 per cent; fully AI-automated emails 54 per cent; AI emails with a human in the loop 56 per cent.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Click-through rates in an AI spear-phishing experiment</text>
  <text x="310" y="106" text-anchor="end" font-size="15" fill="#111111">Control: generic phishing email</text>
  <rect x="324" y="86" width="62" height="36" rx="3" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="396" y="110" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">12%</text>
  <text x="310" y="168" text-anchor="end" font-size="15" fill="#111111">Written by human experts</text>
  <rect x="324" y="148" width="279" height="36" rx="3" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="613" y="172" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">54%</text>
  <text x="310" y="230" text-anchor="end" font-size="15" fill="#111111">Fully automated by AI</text>
  <rect x="324" y="210" width="279" height="36" rx="3" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5"/>
  <text x="613" y="234" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">54%</text>
  <text x="310" y="292" text-anchor="end" font-size="15" fill="#111111">AI with a human in the loop</text>
  <rect x="324" y="272" width="289" height="36" rx="3" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
  <text x="623" y="296" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">56%</text>
  <line x1="324" y1="76" x2="324" y2="328" stroke="#222222" stroke-width="2"/>
  <text x="480" y="388" text-anchor="middle" font-size="13" fill="#333333">Heiding and colleagues (2024): personalised emails built from public information about each participant; a small study of</text>
  <text x="480" y="404" text-anchor="middle" font-size="13" fill="#333333">volunteers.</text>
</svg>
