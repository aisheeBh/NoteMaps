<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Senders overestimate how well tone survives email</title>
  <desc>Two horizontal bars: senders predicted that about 78 per cent of recipients would correctly identify whether their email statements were sarcastic or serious; recipients actually identified about 56 per cent correctly, close to the 50 per cent expected by chance.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Senders overestimate how well tone survives email</text>
  <text x="340" y="97" text-anchor="end" font-size="15" fill="#111111">Senders' prediction of recipients'</text>
  <text x="340" y="115" text-anchor="end" font-size="15" fill="#111111">accuracy</text>
  <rect x="354" y="86" width="379" height="36" rx="3" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="743" y="110" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">about 78%</text>
  <text x="340" y="168" text-anchor="end" font-size="15" fill="#111111">Recipients' actual accuracy</text>
  <rect x="354" y="148" width="272" height="36" rx="3" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5"/>
  <text x="636" y="172" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">about 56%</text>
  <text x="340" y="230" text-anchor="end" font-size="15" fill="#111111">Chance (guessing)</text>
  <rect x="354" y="210" width="243" height="36" rx="3" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="607" y="234" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">50%</text>
  <line x1="354" y1="76" x2="354" y2="266" stroke="#222222" stroke-width="2"/>
  <text x="480" y="314" text-anchor="middle" font-size="13" fill="#333333">Approximate values from Kruger and colleagues (2005), sarcasm-or-serious statements sent by email; values rounded.</text>
</svg>
