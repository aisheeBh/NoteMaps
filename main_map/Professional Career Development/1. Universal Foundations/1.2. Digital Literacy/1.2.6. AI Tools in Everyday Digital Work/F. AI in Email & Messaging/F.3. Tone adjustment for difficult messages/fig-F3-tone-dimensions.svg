<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Five dimensions of tone in a written message</title>
  <desc>Five boxes naming dimensions of tone, each with its two extremes: formality, warmth, directness, confidence and emotional intensity, plus a sixth box noting that tone is judged by the reader.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Five dimensions of tone in a written message</text>
  <rect x="24" y="70" width="292" height="152" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="170" y="127" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Formality</text>
  <text x="170" y="157" text-anchor="middle" font-size="14.5" fill="#000000">Casual ... formal: word choice,</text>
  <text x="170" y="176" text-anchor="middle" font-size="14.5" fill="#000000">greetings, contractions</text>
  <rect x="334" y="70" width="292" height="152" rx="6" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="343" y="79" width="274" height="134" rx="4" fill="#FFFFFF"/>
  <text x="480" y="127" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Warmth</text>
  <text x="480" y="157" text-anchor="middle" font-size="14.5" fill="#111111">Cold ... warm: interest in the</text>
  <text x="480" y="176" text-anchor="middle" font-size="14.5" fill="#111111">reader as a person</text>
  <rect x="644" y="70" width="292" height="152" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="653" y="79" width="274" height="134" rx="4" fill="#FFFFFF"/>
  <text x="790" y="127" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Directness</text>
  <text x="790" y="157" text-anchor="middle" font-size="14.5" fill="#111111">Hinted ... stated plainly: how</text>
  <text x="790" y="176" text-anchor="middle" font-size="14.5" fill="#111111">clearly the point is made</text>
  <rect x="24" y="240" width="292" height="152" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="33" y="249" width="274" height="134" rx="4" fill="#FFFFFF"/>
  <text x="170" y="297" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Confidence</text>
  <text x="170" y="327" text-anchor="middle" font-size="14.5" fill="#111111">Hedged ... assured: qualifiers,</text>
  <text x="170" y="346" text-anchor="middle" font-size="14.5" fill="#111111">apologies, certainty</text>
  <rect x="334" y="240" width="292" height="152" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="343" y="249" width="274" height="134" rx="4" fill="#FFFFFF"/>
  <text x="480" y="297" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Intensity</text>
  <text x="480" y="327" text-anchor="middle" font-size="14.5" fill="#111111">Calm ... heated: emphasis,</text>
  <text x="480" y="346" text-anchor="middle" font-size="14.5" fill="#111111">capitals, exclamation, blame</text>
  <rect x="644" y="240" width="292" height="152" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="790" y="288" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Judged by the reader</text>
  <text x="790" y="317" text-anchor="middle" font-size="14.5" fill="#FFFFFF">Tone is what the recipient</text>
  <text x="790" y="336" text-anchor="middle" font-size="14.5" fill="#FFFFFF">perceives, not what the sender</text>
  <text x="790" y="355" text-anchor="middle" font-size="14.5" fill="#FFFFFF">intended</text>
</svg>
