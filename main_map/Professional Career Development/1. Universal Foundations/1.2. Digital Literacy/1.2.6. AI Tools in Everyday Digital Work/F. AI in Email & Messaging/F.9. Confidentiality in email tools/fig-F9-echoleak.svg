<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>How a single crafted email could leak data through an AI assistant</title>
  <desc>Five stages of the EchoLeak attack disclosed in June 2025: an attacker sends an ordinary-looking email with hidden instructions; the email sits unread in the mailbox; the user later asks the assistant a question and the assistant retrieves the email as context; the hidden instructions make the assistant gather sensitive data; the data is embedded in a link or image address that sends it to the attacker.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">How a single crafted email could leak data through an AI assistant</text>
  <rect x="24" y="75" width="155" height="225" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="33" y="84" width="137" height="207" rx="4" fill="#FFFFFF"/>
  <text x="102" y="106" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">1. Crafted</text>
  <text x="102" y="126" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">email</text>
  <text x="102" y="156" text-anchor="middle" font-size="14.5" fill="#111111">Looks routine;</text>
  <text x="102" y="174" text-anchor="middle" font-size="14.5" fill="#111111">contains hidden</text>
  <text x="102" y="193" text-anchor="middle" font-size="14.5" fill="#111111">instructions</text>
  <line x1="182" y1="188" x2="210" y2="188" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="213" y="75" width="155" height="225" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="291" y="106" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">2. Sits in</text>
  <text x="291" y="126" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">mailbox</text>
  <text x="291" y="156" text-anchor="middle" font-size="14.5" fill="#111111">No click needed;</text>
  <text x="291" y="174" text-anchor="middle" font-size="14.5" fill="#111111">user may never</text>
  <text x="291" y="193" text-anchor="middle" font-size="14.5" fill="#111111">open it</text>
  <line x1="371" y1="188" x2="399" y2="188" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="402" y="75" width="155" height="225" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="480" y="106" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">3. Retrieved</text>
  <text x="480" y="126" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">as context</text>
  <text x="480" y="156" text-anchor="middle" font-size="14.5" fill="#000000">User asks the</text>
  <text x="480" y="174" text-anchor="middle" font-size="14.5" fill="#000000">assistant an</text>
  <text x="480" y="193" text-anchor="middle" font-size="14.5" fill="#000000">unrelated</text>
  <text x="480" y="212" text-anchor="middle" font-size="14.5" fill="#000000">question</text>
  <line x1="561" y1="188" x2="589" y2="188" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="592" y="75" width="155" height="225" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="601" y="84" width="137" height="207" rx="4" fill="#FFFFFF"/>
  <text x="669" y="106" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">4.</text>
  <text x="669" y="126" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Instructions</text>
  <text x="669" y="146" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">obeyed</text>
  <text x="669" y="176" text-anchor="middle" font-size="14.5" fill="#111111">Assistant</text>
  <text x="669" y="194" text-anchor="middle" font-size="14.5" fill="#111111">gathers</text>
  <text x="669" y="213" text-anchor="middle" font-size="14.5" fill="#111111">sensitive</text>
  <text x="669" y="232" text-anchor="middle" font-size="14.5" fill="#111111">internal data</text>
  <line x1="750" y1="188" x2="778" y2="188" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="781" y="75" width="155" height="225" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="790" y="84" width="137" height="207" rx="4" fill="#FFFFFF"/>
  <text x="858" y="106" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">5. Data sent</text>
  <text x="858" y="126" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">out</text>
  <text x="858" y="156" text-anchor="middle" font-size="14.5" fill="#111111">Hidden in a link</text>
  <text x="858" y="174" text-anchor="middle" font-size="14.5" fill="#111111">or image address</text>
  <text x="858" y="193" text-anchor="middle" font-size="14.5" fill="#111111">to the attacker</text>
  <text x="480" y="338" text-anchor="middle" font-size="13" fill="#333333">Based on the EchoLeak vulnerability in Microsoft 365 Copilot (June 2025), fixed by Microsoft before disclosure; no exploitation</text>
  <text x="480" y="354" text-anchor="middle" font-size="13" fill="#333333">in the wild was reported.</text>
</svg>
