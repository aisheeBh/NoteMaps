<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>What machine translation of correspondence most often loses</title>
  <desc>Six boxes listing what translation of emails and messages most often loses or distorts: register and respect forms, names and titles, gender, idioms and humour, dates and numbers, and negation and conditions.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">What machine translation of correspondence most often loses</text>
  <rect x="24" y="70" width="292" height="145" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="33" y="79" width="274" height="127" rx="4" fill="#FFFFFF"/>
  <text x="170" y="114" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Register and respect forms</text>
  <text x="170" y="144" text-anchor="middle" font-size="14.5" fill="#111111">Polite and familiar forms (Sie/du,</text>
  <text x="170" y="163" text-anchor="middle" font-size="14.5" fill="#111111">vous/tu, aap/tum, Japanese keigo)</text>
  <text x="170" y="181" text-anchor="middle" font-size="14.5" fill="#111111">chosen wrongly</text>
  <rect x="334" y="70" width="292" height="145" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="343" y="79" width="274" height="127" rx="4" fill="#FFFFFF"/>
  <text x="480" y="124" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Names and titles</text>
  <text x="480" y="153" text-anchor="middle" font-size="14.5" fill="#111111">Names translated as words; titles</text>
  <text x="480" y="172" text-anchor="middle" font-size="14.5" fill="#111111">and order of names changed</text>
  <rect x="644" y="70" width="292" height="145" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="653" y="79" width="274" height="127" rx="4" fill="#FFFFFF"/>
  <text x="790" y="124" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Gender</text>
  <text x="790" y="153" text-anchor="middle" font-size="14.5" fill="#111111">Gender-neutral source becomes 'he'</text>
  <text x="790" y="172" text-anchor="middle" font-size="14.5" fill="#111111">or 'she' by stereotype</text>
  <rect x="24" y="233" width="292" height="145" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="33" y="242" width="274" height="127" rx="4" fill="#FFFFFF"/>
  <text x="170" y="287" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Idioms and humour</text>
  <text x="170" y="316" text-anchor="middle" font-size="14.5" fill="#111111">Read literally; irony and jokes</text>
  <text x="170" y="335" text-anchor="middle" font-size="14.5" fill="#111111">lost or reversed</text>
  <rect x="334" y="233" width="292" height="145" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="343" y="242" width="274" height="127" rx="4" fill="#FFFFFF"/>
  <text x="480" y="287" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Dates and numbers</text>
  <text x="480" y="316" text-anchor="middle" font-size="14.5" fill="#111111">03/04 read as 3 April or 4 March;</text>
  <text x="480" y="335" text-anchor="middle" font-size="14.5" fill="#111111">decimal commas and points swapped</text>
  <rect x="644" y="233" width="292" height="145" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="653" y="242" width="274" height="127" rx="4" fill="#FFFFFF"/>
  <text x="790" y="287" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Negation and conditions</text>
  <text x="790" y="316" text-anchor="middle" font-size="14.5" fill="#111111">'Not unless' and 'only if'</text>
  <text x="790" y="335" text-anchor="middle" font-size="14.5" fill="#111111">weakened or dropped</text>
  <text x="480" y="424" text-anchor="middle" font-size="13" fill="#333333">Each loss can leave a fluent, grammatical translation that says something different from the original.</text>
</svg>
