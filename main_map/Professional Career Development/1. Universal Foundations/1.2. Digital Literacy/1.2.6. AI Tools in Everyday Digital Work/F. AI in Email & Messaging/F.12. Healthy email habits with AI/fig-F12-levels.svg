<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Levels at which email habits are set</title>
  <desc>Four layers from personal to organisational: personal settings and routines; personal norms with close colleagues; team agreements on response times and channels; and organisational policy and culture, including leaders' behaviour and any right-to-disconnect rules.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Levels at which email habits are set</text>
  <rect x="60" y="66" width="840" height="72" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="82" y="96" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">Personal settings</text>
  <text x="82" y="118" text-anchor="start" font-size="14.5" fill="#111111">Notifications, digests, send-later, filters, batched sessions</text>
  <rect x="60" y="148" width="840" height="72" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="82" y="178" text-anchor="start" font-size="16" font-weight="bold" fill="#000000">Personal norms</text>
  <text x="82" y="200" text-anchor="start" font-size="14.5" fill="#000000">What one promises about response times; when one is offline</text>
  <rect x="60" y="230" width="840" height="72" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="69" y="239" width="822" height="54" rx="4" fill="#FFFFFF"/>
  <text x="82" y="260" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">Team agreements</text>
  <text x="82" y="282" text-anchor="start" font-size="14.5" fill="#111111">Channels for urgent matters; expected reply times; fewer copies</text>
  <rect x="60" y="312" width="840" height="72" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="82" y="342" text-anchor="start" font-size="16" font-weight="bold" fill="#FFFFFF">Organisational culture</text>
  <text x="82" y="364" text-anchor="start" font-size="14.5" fill="#FFFFFF">Leaders' behaviour, policies, right-to-disconnect rules</text>
  <text x="480" y="424" text-anchor="middle" font-size="13" fill="#333333">Personal discipline rarely survives a team culture that rewards instant replies.</text>
</svg>
