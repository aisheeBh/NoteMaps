  <text x="180.8" y="462.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Trigger</text>
  <text x="287.2" y="80.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Peak of inflated expectations</text>
  <text x="424.0" y="462.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Trough of disillusionment</text>
  <text x="626.4" y="380.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">Slope of enlightenment</text>
  <text x="880.0" y="240.0" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Plateau of productivity</text>
  <circle cx="287.2" cy="125.0" r="8" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <rect x="439.2" y="130.0" width="300.0" height="64.0" rx="8" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="447.2" y="140.1" width="284.0" height="45.4" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="589.2" y="157.6" text-anchor="middle" font-size="14.5" fill="#111111">Decisions made here tend to</text>
  <text x="589.2" y="176.5" text-anchor="middle" font-size="14.5" fill="#111111">overestimate benefit, ignore cost</text>
  <line x1="439.2" y1="162.0" x2="299.2" y2="129.0" stroke="#222222" stroke-width="1.5"/>
  <text x="480.0" y="522.0" text-anchor="middle" font-size="13.5" font-style="italic" fill="#333333">Schematic, after Gartner's hype cycle (1995); a descriptive pattern, not a law.</text>
</svg>
