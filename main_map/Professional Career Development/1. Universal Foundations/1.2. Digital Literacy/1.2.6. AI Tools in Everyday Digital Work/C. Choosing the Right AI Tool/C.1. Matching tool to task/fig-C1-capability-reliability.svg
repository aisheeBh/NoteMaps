<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Capability against reliability over repeated attempts</title>
  <desc>Line chart over 1 to 10 attempts. Pass at k, at least one success, rises towards 100 percent. Pass power k, all attempts succeed, falls: for a 90 percent tool to about 35 percent at ten attempts, for a 70 percent tool to about 3 percent.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">One good answer is not the same as a dependable tool</text>
  <line x1="120.0" y1="460.0" x2="900.0" y2="460.0" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="120.0" y1="460.0" x2="120.0" y2="80.0" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="510.0" y="504.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Number of attempts at the same task (k)</text>
  <text x="76.0" y="270.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111" transform="rotate(-90 76 270.0)">Probability</text>
  <text x="110.0" y="456.0" text-anchor="end" font-size="14" fill="#111111">0%</text>
  <text x="110.0" y="94.0" text-anchor="end" font-size="14" fill="#111111">100%</text>
  <text x="120.0" y="482.0" text-anchor="middle" font-size="14" fill="#111111">1</text>
  <text x="204.4" y="482.0" text-anchor="middle" font-size="14" fill="#111111">2</text>
  <text x="288.9" y="482.0" text-anchor="middle" font-size="14" fill="#111111">3</text>
  <text x="373.3" y="482.0" text-anchor="middle" font-size="14" fill="#111111">4</text>
  <text x="457.8" y="482.0" text-anchor="middle" font-size="14" fill="#111111">5</text>
  <text x="542.2" y="482.0" text-anchor="middle" font-size="14" fill="#111111">6</text>
  <text x="626.7" y="482.0" text-anchor="middle" font-size="14" fill="#111111">7</text>
  <text x="711.1" y="482.0" text-anchor="middle" font-size="14" fill="#111111">8</text>
  <text x="795.6" y="482.0" text-anchor="middle" font-size="14" fill="#111111">9</text>
  <text x="880.0" y="482.0" text-anchor="middle" font-size="14" fill="#111111">10</text>
  <line x1="120.0" y1="367.5" x2="880.0" y2="367.5" stroke="#999999" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="110.0" y="372.5" text-anchor="end" font-size="14" fill="#111111">25%</text>
  <line x1="120.0" y1="275.0" x2="880.0" y2="275.0" stroke="#999999" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="110.0" y="280.0" text-anchor="end" font-size="14" fill="#111111">50%</text>
  <line x1="120.0" y1="182.5" x2="880.0" y2="182.5" stroke="#999999" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="110.0" y="187.5" text-anchor="end" font-size="14" fill="#111111">75%</text>
  <path d="M120.0 127.0 L204.4 93.7 L288.9 90.4 L373.3 90.0 L457.8 90.0 L542.2 90.0 L626.7 90.0 L711.1 90.0 L795.6 90.0 L880.0 90.0" fill="none" stroke="#111111" stroke-width="3.5"/>
  <circle cx="120.0" cy="127.0" r="4" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <circle cx="204.4" cy="93.7" r="4" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <circle cx="288.9" cy="90.4" r="4" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <circle cx="373.3" cy="90.0" r="4" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <circle cx="457.8" cy="90.0" r="4" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <circle cx="542.2" cy="90.0" r="4" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <circle cx="626.7" cy="90.0" r="4" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <circle cx="711.1" cy="90.0" r="4" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <circle cx="795.6" cy="90.0" r="4" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <circle cx="880.0" cy="90.0" r="4" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <path d="M120.0 127.0 L204.4 160.3 L288.9 190.3 L373.3 217.2 L457.8 241.5 L542.2 263.4 L626.7 283.0 L711.1 300.7 L795.6 316.7 L880.0 331.0" fill="none" stroke="#111111" stroke-width="3.5" stroke-dasharray="10 6"/>
  <circle cx="120.0" cy="127.0" r="4" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <circle cx="204.4" cy="160.3" r="4" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <circle cx="288.9" cy="190.3" r="4" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <circle cx="373.3" cy="217.2" r="4" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <circle cx="457.8" cy="241.5" r="4" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <circle cx="542.2" cy="263.4" r="4" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <circle cx="626.7" cy="283.0" r="4" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <circle cx="711.1" cy="300.7" r="4" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <circle cx="795.6" cy="316.7" r="4" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <circle cx="880.0" cy="331.0" r="4" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <path d="M120.0 201.0 L204.4 278.7 L288.9 333.1 L373.3 371.2 L457.8 397.8 L542.2 416.5 L626.7 429.5 L711.1 438.7 L795.6 445.1 L880.0 449.5" fill="none" stroke="#111111" stroke-width="3.5" stroke-dasharray="2 4"/>
  <circle cx="120.0" cy="201.0" r="4" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <circle cx="204.4" cy="278.7" r="4" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <circle cx="288.9" cy="333.1" r="4" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <circle cx="373.3" cy="371.2" r="4" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <circle cx="457.8" cy="397.8" r="4" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <circle cx="542.2" cy="416.5" r="4" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <circle cx="626.7" cy="429.5" r="4" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <circle cx="711.1" cy="438.7" r="4" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <circle cx="795.6" cy="445.1" r="4" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <circle cx="880.0" cy="449.5" r="4" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <text x="874.0" y="76.0" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">At least one success (pass@k), 90% tool</text>
  <text x="660.4" y="272.3" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">All succeed (pass^k), 90% tool</text>
  <text x="880.0" y="317.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">35%</text>
  <text x="145.3" y="430.4" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">All succeed (pass^k), 70% tool</text>
  <text x="480.0" y="540.0" text-anchor="middle" font-size="13.5" font-style="italic" fill="#333333">Computed assuming independent attempts with fixed per-attempt success.</text>
</svg>
