<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Spectrum from general to specialised tools</title>
  <desc>Five boxes left to right: bare general assistant; configured general assistant; enterprise assistant with connectors; domain-grounded tool; vertical workflow product. Beneath, an arrow shows breadth decreasing to the right and depth of domain grounding increasing to the right.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">From general to specialised: five positions</text>
  <rect x="36.0" y="90.0" width="164.0" height="170.0" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="118.0" y="151.8" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Bare general</text>
  <text x="118.0" y="170.6" text-anchor="middle" font-size="14.5" fill="#111111">Any request;</text>
  <text x="118.0" y="189.5" text-anchor="middle" font-size="14.5" fill="#111111">model memory</text>
  <text x="118.0" y="208.3" text-anchor="middle" font-size="14.5" fill="#111111">and web search</text>
  <rect x="220.0" y="90.0" width="164.0" height="170.0" rx="8" fill="#F2F2F2" stroke="#555555" stroke-width="1.5"/>
  <text x="302.0" y="151.8" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Configured</text>
  <text x="302.0" y="170.6" text-anchor="middle" font-size="14.5" fill="#111111">Instructions,</text>
  <text x="302.0" y="189.5" text-anchor="middle" font-size="14.5" fill="#111111">projects and</text>
  <text x="302.0" y="208.3" text-anchor="middle" font-size="14.5" fill="#111111">reference files</text>
  <rect x="404.0" y="90.0" width="164.0" height="170.0" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="486.0" y="151.8" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Connected</text>
  <text x="486.0" y="170.6" text-anchor="middle" font-size="14.5" fill="#111111">Enterprise</text>
  <text x="486.0" y="189.5" text-anchor="middle" font-size="14.5" fill="#111111">assistant linked to</text>
  <text x="486.0" y="208.3" text-anchor="middle" font-size="14.5" fill="#111111">company data</text>
  <rect x="588.0" y="90.0" width="164.0" height="170.0" rx="8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="596.0" y="134.3" width="148.0" height="83.1" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="670.0" y="151.8" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Domain-grounded</text>
  <text x="670.0" y="170.6" text-anchor="middle" font-size="14.5" fill="#111111">Licensed or</text>
  <text x="670.0" y="189.5" text-anchor="middle" font-size="14.5" fill="#111111">curated domain</text>
  <text x="670.0" y="208.3" text-anchor="middle" font-size="14.5" fill="#111111">sources</text>
  <rect x="772.0" y="90.0" width="164.0" height="170.0" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="854.0" y="151.8" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Vertical workflow</text>
  <text x="854.0" y="170.6" text-anchor="middle" font-size="14.5" fill="#FFFFFF">Inside the</text>
  <text x="854.0" y="189.5" text-anchor="middle" font-size="14.5" fill="#FFFFFF">profession's</text>
  <text x="854.0" y="208.3" text-anchor="middle" font-size="14.5" fill="#FFFFFF">working system</text>
  <line x1="202.0" y1="175.0" x2="218.0" y2="175.0" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="386.0" y1="175.0" x2="402.0" y2="175.0" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570.0" y1="175.0" x2="586.0" y2="175.0" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="754.0" y1="175.0" x2="770.0" y2="175.0" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="60.0" y1="320.0" x2="900.0" y2="320.0" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="480.0" y="306.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Depth of domain grounding and workflow fit increases</text>
  <line x1="900.0" y1="380.0" x2="60.0" y2="380.0" stroke="#222222" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#arrow)"/>
  <text x="480.0" y="366.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Breadth of tasks and speed of model upgrades increase</text>
  <text x="480.0" y="420.0" text-anchor="middle" font-size="15" fill="#111111">Cost per user and switching effort generally rise towards the right.</text>
</svg>
