<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Shortlist coverage</title>
  <desc>Grid of five jobs as columns: drafting and analysis, work in documents and mail, transcription, legal research, outage cover; and four shortlist tools as rows: primary assistant, built-in assistant, transcription specialist, legal specialist. Each job has exactly one primary tool marked, with the built-in assistant also marked as outage cover.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">One tool per job, every job covered</text>
  <text x="350.0" y="96.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Drafting and</text>
  <text x="350.0" y="116.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">analysis</text>
  <text x="470.0" y="96.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">In documents</text>
  <text x="470.0" y="116.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">and mail</text>
  <text x="590.0" y="96.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Transcription</text>
  <text x="590.0" y="116.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111"></text>
  <text x="710.0" y="96.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Legal</text>
  <text x="710.0" y="116.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">research</text>
  <text x="830.0" y="96.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Outage</text>
  <text x="830.0" y="116.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">cover</text>
  <rect x="290.0" y="130.0" width="600.0" height="56.0" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="276.0" y="163.0" text-anchor="end" font-size="15.5" fill="#111111">Primary assistant</text>
  <circle cx="350.0" cy="158.0" r="11" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <rect x="290.0" y="186.0" width="600.0" height="56.0" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="276.0" y="219.0" text-anchor="end" font-size="15.5" fill="#111111">Built-in assistant</text>
  <circle cx="470.0" cy="214.0" r="11" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <circle cx="830.0" cy="214.0" r="11" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <rect x="290.0" y="242.0" width="600.0" height="56.0" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="276.0" y="275.0" text-anchor="end" font-size="15.5" fill="#111111">Transcription specialist</text>
  <circle cx="590.0" cy="270.0" r="11" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <rect x="290.0" y="298.0" width="600.0" height="56.0" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="276.0" y="331.0" text-anchor="end" font-size="15.5" fill="#111111">Legal specialist</text>
  <circle cx="710.0" cy="326.0" r="11" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <line x1="410.0" y1="130.0" x2="410.0" y2="354.0" stroke="#999999" stroke-width="1"/>
  <line x1="530.0" y1="130.0" x2="530.0" y2="354.0" stroke="#999999" stroke-width="1"/>
  <line x1="650.0" y1="130.0" x2="650.0" y2="354.0" stroke="#999999" stroke-width="1"/>
  <line x1="770.0" y1="130.0" x2="770.0" y2="354.0" stroke="#999999" stroke-width="1"/>
  <text x="480.0" y="400.0" text-anchor="middle" font-size="15" fill="#111111">Filled circle: the tool's main job.   Open circle: fallback role.</text>
  <text x="480.0" y="440.0" text-anchor="middle" font-size="13.5" font-style="italic" fill="#333333">Illustrative shortlist of four tools.</text>
</svg>
