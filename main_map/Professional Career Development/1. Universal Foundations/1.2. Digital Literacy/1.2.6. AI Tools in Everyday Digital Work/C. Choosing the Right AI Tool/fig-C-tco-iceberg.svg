<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Total cost of ownership iceberg</title>
  <desc>An iceberg at a waterline. Above the water, small: licence and usage fees. Below the water, larger: set-up and integration; governance and reviews; training and change; checking and correcting outputs, the largest; risk of errors and incidents; exit and switching.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">The licence fee is the visible tip of an AI tool's cost</text>
  <path d="M380 170 L480 90 L580 170 Z" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="3"/>
  <rect x="400.0" y="128.0" width="160.0" height="34.0" rx="4" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="480.0" y="151.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Licences, usage</text>
  <line x1="40.0" y1="175.0" x2="920.0" y2="175.0" stroke="#1F3B5C" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="910.0" y="165.0" text-anchor="end" font-size="14" font-weight="bold" fill="#111111">Waterline: what the price list shows</text>
  <path d="M380 178 L120 300 L170 520 L480 570 L790 520 L840 300 L580 178 Z" fill="#F2F2F2" stroke="#1F3B5C" stroke-width="2.5"/>
  <rect x="315.0" y="208.0" width="330.0" height="42.0" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="480.0" y="234.4" text-anchor="middle" font-size="15.5" fill="#111111">Set-up and integration</text>
  <rect x="315.0" y="258.0" width="330.0" height="42.0" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="480.0" y="284.4" text-anchor="middle" font-size="15.5" fill="#111111">Governance and reviews</text>
  <rect x="315.0" y="308.0" width="330.0" height="42.0" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="480.0" y="334.4" text-anchor="middle" font-size="15.5" fill="#111111">Training and change</text>
  <rect x="290.0" y="363.0" width="380.0" height="42.0" rx="8" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="298.0" y="370.9" width="364.0" height="27.5" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="480.0" y="389.4" text-anchor="middle" font-size="15.5" fill="#111111">Checking and correcting outputs</text>
  <rect x="315.0" y="423.0" width="330.0" height="42.0" rx="8" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="323.0" y="430.9" width="314.0" height="27.5" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="480.0" y="449.4" text-anchor="middle" font-size="15.5" fill="#111111">Risk of errors and incidents</text>
  <rect x="315.0" y="478.0" width="330.0" height="42.0" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="480.0" y="504.4" text-anchor="middle" font-size="15.5" fill="#111111">Exit and switching</text>
  <text x="480.0" y="586.0" text-anchor="middle" font-size="12" fill="#111111"></text>
</svg>
