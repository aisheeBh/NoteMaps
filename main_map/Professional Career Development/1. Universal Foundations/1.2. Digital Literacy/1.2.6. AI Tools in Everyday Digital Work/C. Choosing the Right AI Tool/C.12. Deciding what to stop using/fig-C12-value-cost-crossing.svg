  <circle cx="629.2" cy="251.2" r="8" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <line x1="629.2" y1="261.2" x2="629.2" y2="440.0" stroke="#222222" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="629.2" y="428.0" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Should stop here</text>
  <line x1="826.8" y1="110.0" x2="826.8" y2="440.0" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="818.8" y="124.0" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Usually stopped here,</text>
  <text x="818.8" y="144.0" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">if at all</text>
  <text x="287.2" y="165.4" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Value</text>
  <text x="310.0" y="330.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">Cost: subscription, corrections, risk</text>
  <text x="480.0" y="522.0" text-anchor="middle" font-size="13.5" font-style="italic" fill="#333333">Schematic; not plotted from a single dataset. Sunk set-up costs are excluded.</text>
</svg>
