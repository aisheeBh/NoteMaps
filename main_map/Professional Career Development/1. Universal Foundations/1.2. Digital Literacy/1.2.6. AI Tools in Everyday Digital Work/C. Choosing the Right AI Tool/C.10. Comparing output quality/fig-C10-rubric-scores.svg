<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Rubric scores by criterion</title>
  <desc>Grouped horizontal bars for four criteria. Faithfulness, weight 40 percent: A 3.5, B 3.3. Completeness, 30 percent: A 3.3, B 3.4. Clarity, 20 percent: A 3.0, B 3.6. Format compliance, 10 percent: A 3.2, B 3.4. Weighted means A 3.3, B 3.4.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Where each assistant is stronger</text>
  <text x="250.0" y="114.0" text-anchor="end" font-size="16" font-weight="bold" fill="#111111">Faithfulness (40%)</text>
  <rect x="265.0" y="84.0" width="420.0" height="28.0" rx="3" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="693.0" y="104.0" text-anchor="start" font-size="14.5" font-weight="bold" fill="#111111">A 3.5</text>
  <rect x="265.0" y="118.0" width="396.0" height="28.0" rx="3" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="669.0" y="138.0" text-anchor="start" font-size="14.5" font-weight="bold" fill="#111111">B 3.3</text>
  <text x="250.0" y="212.0" text-anchor="end" font-size="16" font-weight="bold" fill="#111111">Completeness (30%)</text>
  <rect x="265.0" y="182.0" width="396.0" height="28.0" rx="3" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="669.0" y="202.0" text-anchor="start" font-size="14.5" font-weight="bold" fill="#111111">A 3.3</text>
  <rect x="265.0" y="216.0" width="408.0" height="28.0" rx="3" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="681.0" y="236.0" text-anchor="start" font-size="14.5" font-weight="bold" fill="#111111">B 3.4</text>
  <text x="250.0" y="310.0" text-anchor="end" font-size="16" font-weight="bold" fill="#111111">Clarity (20%)</text>
  <rect x="265.0" y="280.0" width="360.0" height="28.0" rx="3" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="633.0" y="300.0" text-anchor="start" font-size="14.5" font-weight="bold" fill="#111111">A 3.0</text>
  <rect x="265.0" y="314.0" width="432.0" height="28.0" rx="3" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="705.0" y="334.0" text-anchor="start" font-size="14.5" font-weight="bold" fill="#111111">B 3.6</text>
  <text x="250.0" y="408.0" text-anchor="end" font-size="16" font-weight="bold" fill="#111111">Format (10%)</text>
  <rect x="265.0" y="378.0" width="384.0" height="28.0" rx="3" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="657.0" y="398.0" text-anchor="start" font-size="14.5" font-weight="bold" fill="#111111">A 3.2</text>
  <rect x="265.0" y="412.0" width="408.0" height="28.0" rx="3" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="681.0" y="432.0" text-anchor="start" font-size="14.5" font-weight="bold" fill="#111111">B 3.4</text>
  <text x="480.0" y="490.0" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#111111">Weighted means: A 3.3, B 3.4 out of 4 — but B made three critical errors, A none.</text>
  <rect x="300.0" y="512.0" width="28.0" height="18.0" rx="2" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="336.0" y="526.0" text-anchor="start" font-size="14" fill="#111111">Assistant A</text>
  <rect x="520.0" y="512.0" width="28.0" height="18.0" rx="2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="556.0" y="526.0" text-anchor="start" font-size="14" fill="#111111">Assistant B</text>
  <text x="480.0" y="552.0" text-anchor="middle" font-size="13.5" font-style="italic" fill="#333333">Illustrative figures from the worked example.</text>
</svg>
