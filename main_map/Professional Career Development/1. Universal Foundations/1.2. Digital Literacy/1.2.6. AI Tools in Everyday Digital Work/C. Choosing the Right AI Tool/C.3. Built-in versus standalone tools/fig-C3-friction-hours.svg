<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Weekly team hours by route</title>
  <desc>Bar chart of weekly hours for 300 email-thread summaries. Built-in assistant: 7.5 hours base time plus 3 hours correction, 10.5 hours in total. Standalone assistant: 20 hours base time plus 1.5 hours correction, 21.5 hours in total.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Friction outweighs a small accuracy advantage</text>
  <text x="250.0" y="140.0" text-anchor="end" font-size="16" font-weight="bold" fill="#111111">Built-in assistant</text>
  <rect x="265.0" y="110.0" width="195.0" height="50.0" rx="3" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="460.0" y="110.0" width="78.0" height="50.0" rx="3" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="548.0" y="141.0" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">10.5 h</text>
  <text x="250.0" y="250.0" text-anchor="end" font-size="16" font-weight="bold" fill="#111111">Standalone assistant</text>
  <rect x="265.0" y="220.0" width="520.0" height="50.0" rx="3" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="785.0" y="220.0" width="39.0" height="50.0" rx="3" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="834.0" y="251.0" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">21.5 h</text>
  <text x="362.5" y="141.0" text-anchor="middle" font-size="14" fill="#111111"></text>
  <rect x="265.0" y="340.0" width="30.0" height="22.0" rx="3" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="305.0" y="357.0" text-anchor="start" font-size="15" fill="#111111">Base time including review</text>
  <rect x="560.0" y="340.0" width="30.0" height="22.0" rx="3" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="600.0" y="357.0" text-anchor="start" font-size="15" fill="#111111">Time correcting errors</text>
  <text x="480.0" y="414.0" text-anchor="middle" font-size="13.5" font-style="italic" fill="#333333">Illustrative figures from the worked example: 300 summaries a week.</text>
</svg>
