<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 344" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Hallucinated or misgrounded answers in legal research tools</title>
  <desc>Horizontal bars from a 2024 Stanford University study of more than 200 legal queries. Lexis+ AI: about 17 percent of queries. Westlaw AI-Assisted Research: about 33 percent. GPT-4 without legal database retrieval: about 43 percent.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Hallucinated or misgrounded answers in legal research tools</text>
  <text x="326" y="106" text-anchor="end" font-size="15" fill="#111111">Lexis+ AI</text>
  <rect x="340" y="88" width="177" height="32" rx="2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="527" y="110" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">about 17%</text>
  <text x="326" y="164" text-anchor="end" font-size="15" fill="#111111">Westlaw AI-Assisted Research</text>
  <rect x="340" y="146" width="343" height="32" rx="2" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="693" y="168" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">about 33%</text>
  <text x="326" y="222" text-anchor="end" font-size="15" fill="#111111">GPT-4, general model</text>
  <rect x="340" y="204" width="447" height="32" rx="2" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="797" y="226" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">about 43%</text>
  <line x1="340" y1="72" x2="340" y2="258" stroke="#222222" stroke-width="2"/>
  <text x="480" y="334" text-anchor="middle" font-size="13.5" font-style="italic" fill="#333333">updated.</text>
  <text x="480" y="316" text-anchor="middle" font-size="13.5" font-style="italic" fill="#333333">Magesh and colleagues, Stanford University (2024; Journal of Empirical Legal Studies, 2025). Products have since been</text>
</svg>
