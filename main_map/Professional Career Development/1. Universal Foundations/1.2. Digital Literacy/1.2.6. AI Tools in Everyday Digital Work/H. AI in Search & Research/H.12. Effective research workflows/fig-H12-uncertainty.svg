<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Uncertainty across the stages of research</title>
  <desc>Schematic chart. Horizontal axis: six stages, initiation, selection, exploration, formulation, collection, presentation. Vertical axis: felt uncertainty. A solid line rises from initiation, dips slightly at selection, peaks during exploration, then falls after formulation. A dashed line shows premature closure: uncertainty falls sharply at exploration when a fluent AI answer arrives, before any focus has formed.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Uncertainty across the stages of research</text>
  <line x1="110" y1="430" x2="900" y2="430" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="110" y1="430" x2="110" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="495" y="470" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Stage of research</text>
  <text x="60" y="255" text-anchor="middle" font-size="16" font-weight="bold" transform="rotate(-90 60 255)" fill="#111111">Felt uncertainty</text>
  <text x="100" y="426" text-anchor="end" font-size="14" fill="#111111">Low</text>
  <text x="100" y="90" text-anchor="end" font-size="14" fill="#111111">High</text>
  <path d="M110 220 L264 255 L418 132 L572 272 L726 332 L880 367" fill="none" stroke="#111111" stroke-width="3"/>
  <rect x="445" y="91" width="106" height="24" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="449" y="108" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">Typical path</text>
  <path d="M110 220 L264 255 L364 213 L433 360 L880 388" fill="none" stroke="#111111" stroke-width="3" stroke-dasharray="10 6"/>
  <rect x="491" y="378" width="213" height="43" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="495" y="395" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">Premature closure after a</text>
  <text x="495" y="414" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">fluent AI answer</text>
  <text x="480" y="530" text-anchor="middle" font-size="13.5" font-style="italic" fill="#333333">Schematic, after Kuhlthau's Information Search Process (1991); not plotted from data.</text>
  <text x="110" y="452" text-anchor="start" font-size="13.5" fill="#111111">Initiation</text>
  <text x="264" y="452" text-anchor="middle" font-size="13.5" fill="#111111">Selection</text>
  <text x="418" y="452" text-anchor="middle" font-size="13.5" fill="#111111">Exploration</text>
  <text x="572" y="452" text-anchor="middle" font-size="13.5" fill="#111111">Formulation</text>
  <text x="726" y="452" text-anchor="middle" font-size="13.5" fill="#111111">Collection</text>
  <text x="880" y="452" text-anchor="end" font-size="13.5" fill="#111111">Presentation</text>
</svg>
