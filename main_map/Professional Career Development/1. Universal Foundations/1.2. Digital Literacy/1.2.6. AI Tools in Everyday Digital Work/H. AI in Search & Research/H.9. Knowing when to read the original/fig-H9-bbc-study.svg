<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 344" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Problems in AI answers about BBC news content</title>
  <desc>Horizontal bars from a BBC study published in February 2025. Answers with significant issues of any kind: 51 percent. Answers citing BBC content that introduced factual errors: 19 percent. Quotations from BBC articles that were altered or not present in the cited article: 13 percent.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Problems in AI answers about BBC news content</text>
  <text x="446" y="106" text-anchor="end" font-size="15" fill="#111111">Answers with significant issues of any kind</text>
  <rect x="460" y="88" width="329" height="32" rx="2" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="799" y="110" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">51%</text>
  <text x="446" y="155" text-anchor="end" font-size="15" fill="#111111">Answers citing BBC content that introduced factual</text>
  <text x="446" y="174" text-anchor="end" font-size="15" fill="#111111">errors</text>
  <rect x="460" y="146" width="123" height="32" rx="2" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="593" y="168" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">19%</text>
  <text x="446" y="213" text-anchor="end" font-size="15" fill="#111111">Quotations altered or absent from the cited</text>
  <text x="446" y="232" text-anchor="end" font-size="15" fill="#111111">article</text>
  <rect x="460" y="204" width="84" height="32" rx="2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="554" y="226" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">13%</text>
  <line x1="460" y1="72" x2="460" y2="258" stroke="#222222" stroke-width="2"/>
  <text x="480" y="334" text-anchor="middle" font-size="13.5" font-style="italic" fill="#333333">BBC study of ChatGPT, Copilot, Gemini and Perplexity answering 100 news questions, published February 2025.</text>
</svg>
