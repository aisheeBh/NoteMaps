<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>What can be reconstructed over time</title>
  <desc>Schematic chart. Horizontal axis: time since the research, from days to a year. Vertical axis: share of sources and reasons that can be reconstructed. A dashed curve, memory alone, falls quickly from high to low within weeks. A solid line, with a trail, stays high throughout.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">What can be reconstructed over time</text>
  <line x1="110" y1="430" x2="900" y2="430" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="110" y1="430" x2="110" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="495" y="470" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Time since the research</text>
  <text x="60" y="255" text-anchor="middle" font-size="16" font-weight="bold" transform="rotate(-90 60 255)" fill="#111111">Sources and reasons recoverable</text>
  <text x="110" y="452" text-anchor="start" font-size="14" fill="#111111">Days</text>
  <text x="880" y="452" text-anchor="end" font-size="14" fill="#111111">A year</text>
  <text x="100" y="426" text-anchor="end" font-size="14" fill="#111111">None</text>
  <text x="100" y="90" text-anchor="end" font-size="14" fill="#111111">All</text>
  <path d="M110 98 L880 115" fill="none" stroke="#111111" stroke-width="3"/>
  <rect x="530" y="77" width="180" height="24" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="534" y="94" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">With a research trail</text>
  <path d="M110 98 L187 231 L264 308 L341 352 L418 378 L495 392 L572 401 L649 406 L726 409 L803 410 L880 411" fill="none" stroke="#111111" stroke-width="3" stroke-dasharray="10 6"/>
  <rect x="245" y="256" width="106" height="24" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="249" y="272" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">Memory alone</text>
  <text x="480" y="530" text-anchor="middle" font-size="13.5" font-style="italic" fill="#333333">Schematic; not plotted from a single dataset. Reasons for choices typically fade faster than the facts themselves.</text>
</svg>
