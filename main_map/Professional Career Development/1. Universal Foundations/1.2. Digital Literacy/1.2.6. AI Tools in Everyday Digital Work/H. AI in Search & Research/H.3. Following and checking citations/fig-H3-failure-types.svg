<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Seven ways a citation can fail</title>
  <desc>Three columns. Source problems: fabricated source; misattributed source. Support problems: unsupported claim; partially supported claim; distorted claim. Status problems: stale or invalid source; circular citation.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Seven ways a citation can fail</text>
  <rect x="24" y="70" width="292" height="240" rx="8" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="170" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">The source is wrong</text>
  <line x1="38" y1="116" x2="302" y2="116" stroke="#555555" stroke-width="1.2"/>
  <text x="170" y="140" text-anchor="middle" font-size="14.5" fill="#111111">Fabricated: the source does not</text>
  <text x="170" y="159" text-anchor="middle" font-size="14.5" fill="#111111">exist</text>
  <text x="170" y="190" text-anchor="middle" font-size="14.5" fill="#111111">Misattributed: real content, wrong</text>
  <text x="170" y="209" text-anchor="middle" font-size="14.5" fill="#111111">author, outlet, date or copy</text>
  <rect x="334" y="70" width="292" height="240" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="480" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">The support is wrong</text>
  <line x1="348" y1="116" x2="612" y2="116" stroke="#555555" stroke-width="1.2"/>
  <text x="480" y="140" text-anchor="middle" font-size="14.5" fill="#111111">Unsupported: the source does not</text>
  <text x="480" y="159" text-anchor="middle" font-size="14.5" fill="#111111">say it</text>
  <text x="480" y="190" text-anchor="middle" font-size="14.5" fill="#111111">Partly supported: some of the</text>
  <text x="480" y="209" text-anchor="middle" font-size="14.5" fill="#111111">sentence was added</text>
  <text x="480" y="240" text-anchor="middle" font-size="14.5" fill="#111111">Distorted: strength, scope or</text>
  <text x="480" y="259" text-anchor="middle" font-size="14.5" fill="#111111">conditions changed</text>
  <rect x="644" y="70" width="292" height="240" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="790" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#222222">The status is wrong</text>
  <line x1="658" y1="116" x2="922" y2="116" stroke="#555555" stroke-width="1.2"/>
  <text x="790" y="140" text-anchor="middle" font-size="14.5" fill="#222222">Stale or invalid: retracted,</text>
  <text x="790" y="159" text-anchor="middle" font-size="14.5" fill="#222222">overruled, superseded or corrected</text>
  <text x="790" y="190" text-anchor="middle" font-size="14.5" fill="#222222">Circular: a restatement of</text>
  <text x="790" y="209" text-anchor="middle" font-size="14.5" fill="#222222">another, unnamed original</text>
  <text x="480" y="360" text-anchor="middle" font-size="13.5" font-style="italic" fill="#333333">Moving from left to right, failures become harder to detect by opening the link.</text>
</svg>
