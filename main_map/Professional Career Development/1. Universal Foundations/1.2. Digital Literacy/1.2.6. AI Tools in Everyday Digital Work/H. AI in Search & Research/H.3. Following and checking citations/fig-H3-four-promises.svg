<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 456" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The four promises of a citation</title>
  <desc>Four stacked layers, each a check that can fail. Exists: the source can be found. Is the one: right author, title, date, publisher and version. Supports: the passage states the claim in context. Valid: not retracted, overruled, superseded or corrected. An arrow on the right shows the checks become subtler and the failures more common moving down.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">The four promises of a citation</text>
  <rect x="50" y="72" width="680" height="78" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="390" y="103" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">1. Exists</text>
  <text x="390" y="130" text-anchor="middle" font-size="14.5" fill="#111111">The source can be found at all</text>
  <rect x="50" y="162" width="680" height="78" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="390" y="193" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">2. Is the one described</text>
  <text x="390" y="220" text-anchor="middle" font-size="14.5" fill="#111111">Right author, title, date, publisher, version; the original, not a copy</text>
  <rect x="50" y="252" width="680" height="78" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="390" y="283" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">3. Supports the claim</text>
  <text x="390" y="310" text-anchor="middle" font-size="14.5" fill="#111111">The passage states the claim, in context, with the same strength and scope</text>
  <rect x="50" y="342" width="680" height="78" rx="8" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="390" y="373" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">4. Is still valid</text>
  <text x="390" y="400" text-anchor="middle" font-size="14.5" fill="#111111">Not retracted, overruled, superseded, withdrawn or corrected</text>
  <line x1="775" y1="76" x2="775" y2="420" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="868" y="96" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#111111">Easy to check</text>
  <text x="868" y="382" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#111111">Subtle; often</text>
  <text x="868" y="401" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#111111">skipped</text>
</svg>
