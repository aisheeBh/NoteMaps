<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 402" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Fabricated and erroneous references generated by ChatGPT</title>
  <desc>Horizontal bars. GPT-3.5: 55 percent of references fabricated; 43 percent of real references contained substantive errors. GPT-4: 18 percent fabricated; 24 percent of real references contained substantive errors.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Fabricated and erroneous references generated by ChatGPT</text>
  <text x="426" y="106" text-anchor="end" font-size="15" fill="#111111">GPT-3.5: references fabricated</text>
  <rect x="440" y="88" width="355" height="32" rx="2" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="805" y="110" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">55%</text>
  <text x="426" y="155" text-anchor="end" font-size="15" fill="#111111">GPT-3.5: real references with substantive</text>
  <text x="426" y="174" text-anchor="end" font-size="15" fill="#111111">errors</text>
  <rect x="440" y="146" width="278" height="32" rx="2" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="728" y="168" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">43%</text>
  <text x="426" y="222" text-anchor="end" font-size="15" fill="#111111">GPT-4: references fabricated</text>
  <rect x="440" y="204" width="116" height="32" rx="2" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="566" y="226" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">18%</text>
  <text x="426" y="280" text-anchor="end" font-size="15" fill="#111111">GPT-4: real references with substantive errors</text>
  <rect x="440" y="262" width="155" height="32" rx="2" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="605" y="284" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">24%</text>
  <line x1="440" y1="72" x2="440" y2="316" stroke="#222222" stroke-width="2"/>
  <text x="480" y="392" text-anchor="middle" font-size="13.5" font-style="italic" fill="#333333">Walters and Wilder (2023), Scientific Reports: 636 references in 84 short literature reviews, generated without web search.</text>
</svg>
