<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 335" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Where human effort goes in each era of research</title>
  <desc>Four columns, one per era. Catalogues and indexes: effort on locating material, often through a librarian. Online databases: effort on query skill in specialist vocabularies. Web search: effort on choosing among many results of uneven quality. Answers and agents: effort on verifying and auditing composed outputs whose sources may be unseen.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Where human effort goes in each era of research</text>
  <rect x="24" y="70" width="214" height="205" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="131" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#222222">Catalogues and</text>
  <text x="131" y="122" text-anchor="middle" font-size="17" font-weight="bold" fill="#222222">indexes</text>
  <line x1="38" y1="138" x2="224" y2="138" stroke="#555555" stroke-width="1.2"/>
  <text x="131" y="162" text-anchor="middle" font-size="14.5" fill="#222222">Locating material</text>
  <text x="131" y="193" text-anchor="middle" font-size="14.5" fill="#222222">Librarians mediate</text>
  <text x="131" y="224" text-anchor="middle" font-size="14.5" fill="#222222">Judging is visible</text>
  <rect x="256" y="70" width="214" height="205" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="364" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Online databases</text>
  <line x1="270" y1="116" x2="457" y2="116" stroke="#555555" stroke-width="1.2"/>
  <text x="364" y="140" text-anchor="middle" font-size="14.5" fill="#111111">Query skill</text>
  <text x="364" y="171" text-anchor="middle" font-size="14.5" fill="#111111">Specialist vocabularies</text>
  <text x="364" y="202" text-anchor="middle" font-size="14.5" fill="#111111">Trained intermediaries</text>
  <rect x="489" y="70" width="214" height="205" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="596" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Web search</text>
  <line x1="503" y1="116" x2="690" y2="116" stroke="#555555" stroke-width="1.2"/>
  <text x="596" y="140" text-anchor="middle" font-size="14.5" fill="#111111">Choosing among many</text>
  <text x="596" y="159" text-anchor="middle" font-size="14.5" fill="#111111">results</text>
  <text x="596" y="190" text-anchor="middle" font-size="14.5" fill="#111111">Judging uneven sources</text>
  <text x="596" y="221" text-anchor="middle" font-size="14.5" fill="#111111">Everyone searches</text>
  <rect x="722" y="70" width="214" height="205" rx="8" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="829" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Answers and agents</text>
  <line x1="736" y1="116" x2="922" y2="116" stroke="#555555" stroke-width="1.2"/>
  <text x="829" y="140" text-anchor="middle" font-size="14.5" fill="#111111">Verifying composed</text>
  <text x="829" y="159" text-anchor="middle" font-size="14.5" fill="#111111">answers</text>
  <text x="829" y="190" text-anchor="middle" font-size="14.5" fill="#111111">Auditing long reports</text>
  <text x="829" y="221" text-anchor="middle" font-size="14.5" fill="#111111">Sources often unseen</text>
  <text x="480" y="325" text-anchor="middle" font-size="13.5" font-style="italic" fill="#333333">Each era moved effort from finding towards judging; judging became less visible, not easier.</text>
</svg>
