<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 402" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Court decisions involving AI-fabricated material, 2026</title>
  <desc>Horizontal bars for four dates in 2026 showing the cumulative number of court decisions worldwide recorded in a public database: about 1,490 in May; 1,624 on 18 June; 1,668 on 2 July; 2,041 on 14 September.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Court decisions involving AI-fabricated material, 2026</text>
  <text x="246" y="106" text-anchor="end" font-size="15" fill="#111111">May 2026</text>
  <rect x="260" y="88" width="372" height="32" rx="2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="642" y="110" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">about 1,490</text>
  <text x="246" y="164" text-anchor="end" font-size="15" fill="#111111">18 June 2026</text>
  <rect x="260" y="146" width="406" height="32" rx="2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="676" y="168" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">1,624</text>
  <text x="246" y="222" text-anchor="end" font-size="15" fill="#111111">2 July 2026</text>
  <rect x="260" y="204" width="417" height="32" rx="2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="687" y="226" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">1,668</text>
  <text x="246" y="280" text-anchor="end" font-size="15" fill="#111111">14 September 2026</text>
  <rect x="260" y="262" width="510" height="32" rx="2" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="780" y="284" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">2,041</text>
  <line x1="260" y1="72" x2="260" y2="316" stroke="#222222" stroke-width="2"/>
  <text x="480" y="392" text-anchor="middle" font-size="13.5" font-style="italic" fill="#333333">database maintained by Damien Charlotin.</text>
  <text x="480" y="374" text-anchor="middle" font-size="13.5" font-style="italic" fill="#333333">Cumulative decisions worldwide in which a court found or implied reliance on AI-fabricated material, as recorded in the</text>
</svg>
