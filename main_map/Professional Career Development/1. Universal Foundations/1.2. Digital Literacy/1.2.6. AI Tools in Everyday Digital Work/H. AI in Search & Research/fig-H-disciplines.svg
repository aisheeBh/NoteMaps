<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 362" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The disciplines of AI-assisted research</title>
  <desc>Four columns. Evidence over eloquence: decompose answers into claims; check citations; expect fabrication. Provenance and independence: trace to origin; count only independent sources; profile the source set. Synthesis and judgement: weigh, explain disagreement, state confidence; read originals of what is quoted, decisive or binding; treat agents as a start. Process and memory: keep a trail; keep search skills; use governed workflows.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">The disciplines of AI-assisted research</text>
  <rect x="24" y="70" width="214" height="262" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="131" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Evidence over</text>
  <text x="131" y="122" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">eloquence</text>
  <line x1="38" y1="138" x2="224" y2="138" stroke="#555555" stroke-width="1.2"/>
  <text x="131" y="162" text-anchor="middle" font-size="14.5" fill="#111111">Decompose answers into</text>
  <text x="131" y="181" text-anchor="middle" font-size="14.5" fill="#111111">claims</text>
  <text x="131" y="212" text-anchor="middle" font-size="14.5" fill="#111111">Check every decisive</text>
  <text x="131" y="231" text-anchor="middle" font-size="14.5" fill="#111111">citation</text>
  <text x="131" y="262" text-anchor="middle" font-size="14.5" fill="#111111">Expect fabrication</text>
  <rect x="256" y="70" width="214" height="262" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="364" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Provenance and</text>
  <text x="364" y="122" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">independence</text>
  <line x1="270" y1="138" x2="457" y2="138" stroke="#555555" stroke-width="1.2"/>
  <text x="364" y="162" text-anchor="middle" font-size="14.5" fill="#111111">Trace facts to their</text>
  <text x="364" y="181" text-anchor="middle" font-size="14.5" fill="#111111">origin</text>
  <text x="364" y="212" text-anchor="middle" font-size="14.5" fill="#111111">Count only independent</text>
  <text x="364" y="231" text-anchor="middle" font-size="14.5" fill="#111111">sources</text>
  <text x="364" y="262" text-anchor="middle" font-size="14.5" fill="#111111">Profile the source set</text>
  <text x="364" y="281" text-anchor="middle" font-size="14.5" fill="#111111">for bias</text>
  <rect x="489" y="70" width="214" height="262" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="596" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Synthesis and</text>
  <text x="596" y="122" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">judgement</text>
  <line x1="503" y1="138" x2="690" y2="138" stroke="#555555" stroke-width="1.2"/>
  <text x="596" y="162" text-anchor="middle" font-size="14.5" fill="#111111">Weigh and explain</text>
  <text x="596" y="181" text-anchor="middle" font-size="14.5" fill="#111111">disagreement</text>
  <text x="596" y="212" text-anchor="middle" font-size="14.5" fill="#111111">Read originals that</text>
  <text x="596" y="231" text-anchor="middle" font-size="14.5" fill="#111111">matter</text>
  <text x="596" y="262" text-anchor="middle" font-size="14.5" fill="#111111">Treat agents as a start</text>
  <rect x="722" y="70" width="214" height="262" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="829" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Process and memory</text>
  <line x1="736" y1="116" x2="922" y2="116" stroke="#FFFFFF" stroke-width="1.2"/>
  <text x="829" y="140" text-anchor="middle" font-size="14.5" fill="#FFFFFF">Keep a research trail</text>
  <text x="829" y="171" text-anchor="middle" font-size="14.5" fill="#FFFFFF">Keep search skills alive</text>
  <text x="829" y="202" text-anchor="middle" font-size="14.5" fill="#FFFFFF">Work in a governed</text>
  <text x="829" y="221" text-anchor="middle" font-size="14.5" fill="#FFFFFF">workflow</text>
</svg>
