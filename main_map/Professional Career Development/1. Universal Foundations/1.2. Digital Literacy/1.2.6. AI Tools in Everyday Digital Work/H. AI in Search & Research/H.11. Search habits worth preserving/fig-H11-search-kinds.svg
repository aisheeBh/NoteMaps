<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Three kinds of search activity</title>
  <desc>A spectrum from lookup to investigate. Lookup: finding a known fact or document; AI answers or direct search suit it. Learn: building understanding; AI for orientation, then reading sources. Investigate: analysing and synthesising over time; needs the searcher's own judgement, many searches and sources.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Three kinds of search activity</text>
  <line x1="60" y1="230" x2="900" y2="230" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="900" y1="230" x2="60" y2="230" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="60" y="260" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">Precise, quick</text>
  <text x="900" y="260" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Open-ended, long</text>
  <line x1="129" y1="230" x2="129" y2="190" stroke="#222222" stroke-width="1.5"/>
  <circle cx="129" cy="230" r="7" fill="#111111"/>
  <rect x="34" y="70" width="190" height="120" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="129" y="105" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#111111">Lookup</text>
  <text x="129" y="130" text-anchor="middle" font-size="13.5" fill="#111111">A known fact or</text>
  <text x="129" y="148" text-anchor="middle" font-size="13.5" fill="#111111">document. AI or direct</text>
  <text x="129" y="165" text-anchor="middle" font-size="13.5" fill="#111111">search.</text>
  <line x1="480" y1="230" x2="480" y2="278" stroke="#222222" stroke-width="1.5"/>
  <circle cx="480" cy="230" r="7" fill="#111111"/>
  <rect x="385" y="278" width="190" height="120" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="480" y="322" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#111111">Learn</text>
  <text x="480" y="347" text-anchor="middle" font-size="13.5" fill="#111111">Build understanding. AI</text>
  <text x="480" y="365" text-anchor="middle" font-size="13.5" fill="#111111">to orient, then read.</text>
  <line x1="831" y1="230" x2="831" y2="190" stroke="#222222" stroke-width="1.5"/>
  <circle cx="831" cy="230" r="7" fill="#111111"/>
  <rect x="736" y="70" width="190" height="120" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="831" y="114" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#FFFFFF">Investigate</text>
  <text x="831" y="139" text-anchor="middle" font-size="13.5" fill="#FFFFFF">Analyse and synthesise.</text>
  <text x="831" y="157" text-anchor="middle" font-size="13.5" fill="#FFFFFF">The searcher leads.</text>
  <text x="480" y="470" text-anchor="middle" font-size="13.5" font-style="italic" fill="#333333">After Marchionini (2006).</text>
</svg>
