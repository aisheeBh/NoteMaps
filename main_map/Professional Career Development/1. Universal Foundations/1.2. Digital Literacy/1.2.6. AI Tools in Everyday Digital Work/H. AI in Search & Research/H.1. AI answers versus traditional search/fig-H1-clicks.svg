<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 344" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Clicks to sources with and without an AI summary</title>
  <desc>Horizontal bars. Pages without an AI summary: an ordinary result was clicked in about 15 percent of visits. Pages with an AI summary: about 8 percent. Links inside the AI summary: about 1 percent.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Clicks to sources with and without an AI summary</text>
  <text x="426" y="106" text-anchor="end" font-size="15" fill="#111111">No AI summary: clicked an ordinary result</text>
  <rect x="440" y="88" width="350" height="32" rx="2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="800" y="110" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">about 15%</text>
  <text x="426" y="164" text-anchor="end" font-size="15" fill="#111111">AI summary shown: clicked an ordinary result</text>
  <rect x="440" y="146" width="187" height="32" rx="2" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="637" y="168" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">about 8%</text>
  <text x="426" y="213" text-anchor="end" font-size="15" fill="#111111">AI summary shown: clicked a link inside the</text>
  <text x="426" y="232" text-anchor="end" font-size="15" fill="#111111">summary</text>
  <rect x="440" y="204" width="23" height="32" rx="2" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="473" y="226" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">about 1%</text>
  <line x1="440" y1="72" x2="440" y2="258" stroke="#222222" stroke-width="2"/>
  <text x="480" y="334" text-anchor="middle" font-size="13.5" font-style="italic" fill="#333333">Pew Research Center analysis of about 69,000 Google searches by about 900 US adults, March 2025. Share of visits.</text>
</svg>
