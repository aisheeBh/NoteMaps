<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Matching the mode to the question</title>
  <desc>Two by two grid. Horizontal axis: how settled the answer is, settled to contested or changing. Vertical axis: does the source matter, no to yes. Top left: go to the authoritative document. Top right: search widely, then read the primary sources. Bottom left: an AI answer is efficient. Bottom right: AI to map the positions, then sample sources.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Matching the mode to the question</text>
  <rect x="176" y="82" width="358" height="198" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="355" y="164" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Go to the document</text>
  <text x="355" y="191" text-anchor="middle" font-size="14.5" fill="#111111">Regulations, standards, filed accounts,</text>
  <text x="355" y="210" text-anchor="middle" font-size="14.5" fill="#111111">contracts. Search or official site.</text>
  <rect x="546" y="82" width="358" height="198" rx="8" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="554" y="145" width="342" height="75" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="725" y="164" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Search widely, read originals</text>
  <text x="725" y="191" text-anchor="middle" font-size="14.5" fill="#111111">Current rules, figures and disputed</text>
  <text x="725" y="210" text-anchor="middle" font-size="14.5" fill="#111111">evidence. AI only as a lead.</text>
  <rect x="176" y="292" width="358" height="198" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="355" y="374" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">AI answer is efficient</text>
  <text x="355" y="401" text-anchor="middle" font-size="14.5" fill="#111111">Definitions, explanations, stable everyday</text>
  <text x="355" y="420" text-anchor="middle" font-size="14.5" fill="#111111">facts.</text>
  <rect x="546" y="292" width="358" height="198" rx="8" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="554" y="355" width="342" height="75" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="725" y="374" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">AI to map, then sample</text>
  <text x="725" y="401" text-anchor="middle" font-size="14.5" fill="#111111">Debates and recent trends where a rough</text>
  <text x="725" y="420" text-anchor="middle" font-size="14.5" fill="#111111">picture is enough.</text>
  <line x1="170" y1="512" x2="910" y2="512" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="540" y="542" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">How settled the answer is</text>
  <text x="170" y="542" text-anchor="start" font-size="14" fill="#111111">Settled</text>
  <text x="910" y="542" text-anchor="end" font-size="14" fill="#111111">Contested or changing</text>
  <line x1="154" y1="496" x2="154" y2="76" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="126" y="286" text-anchor="middle" font-size="16" font-weight="bold" transform="rotate(-90 126 286)" fill="#111111">Does the source itself matter?</text>
  <text x="100" y="496" text-anchor="start" font-size="14" transform="rotate(-90 100 496)" fill="#111111">No</text>
  <text x="100" y="76" text-anchor="end" font-size="14" transform="rotate(-90 100 76)" fill="#111111">Yes</text>
</svg>
