<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>What to hand to an AI organiser</title>
  <desc>A scale from safest to delegate to least safe: capturing tasks from messages, organising and tagging them, proposing a schedule, booking time automatically, and deciding priorities. The person should retain the decision about what matters.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">What to hand to an AI organiser</text>
  <line x1="60" y1="275" x2="905" y2="275" stroke="#222222" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="60" y1="265" x2="60" y2="285" stroke="#222222" stroke-width="4"/>
  <text x="60" y="303" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">Safe to delegate</text>
  <text x="905" y="303" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Keep for the person</text>
  <circle cx="70" cy="275" r="9" fill="#111111"/>
  <line x1="70" y1="266" x2="70" y2="235" stroke="#222222" stroke-width="1.5"/>
  <rect x="26" y="115" width="180" height="120" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="116" y="159" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Capture</text>
  <text x="116" y="183" text-anchor="middle" font-size="13.5" fill="#000000">Tasks from emails and</text>
  <text x="116" y="200" text-anchor="middle" font-size="13.5" fill="#000000">notes</text>
  <circle cx="250" cy="275" r="9" fill="#111111"/>
  <line x1="250" y1="284" x2="250" y2="320" stroke="#222222" stroke-width="1.5"/>
  <rect x="160" y="320" width="180" height="120" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="250" y="372" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Organise</text>
  <text x="250" y="396" text-anchor="middle" font-size="13.5" fill="#000000">Group, tag, add dates</text>
  <circle cx="439" cy="275" r="9" fill="#111111"/>
  <line x1="439" y1="266" x2="439" y2="235" stroke="#222222" stroke-width="1.5"/>
  <rect x="349" y="115" width="180" height="120" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="439" y="167" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Propose a schedule</text>
  <text x="439" y="191" text-anchor="middle" font-size="13.5" fill="#000000">Draft plan for review</text>
  <circle cx="611" cy="275" r="9" fill="#111111"/>
  <line x1="611" y1="284" x2="611" y2="320" stroke="#222222" stroke-width="1.5"/>
  <rect x="521" y="320" width="180" height="120" rx="6" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="611" y="364" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Book automatically</text>
  <text x="611" y="388" text-anchor="middle" font-size="13.5" fill="#000000">Within rules the</text>
  <text x="611" y="405" text-anchor="middle" font-size="13.5" fill="#000000">person set</text>
  <circle cx="742" cy="275" r="9" fill="#111111"/>
  <line x1="742" y1="266" x2="742" y2="235" stroke="#222222" stroke-width="1.5"/>
  <rect x="652" y="115" width="180" height="120" rx="6" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="742" y="159" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Decide priorities</text>
  <text x="742" y="183" text-anchor="middle" font-size="13.5" fill="#000000">What matters most,</text>
  <text x="742" y="200" text-anchor="middle" font-size="13.5" fill="#000000">and what to drop</text>
  <text x="480" y="506" text-anchor="middle" font-size="13" fill="#333333">Delegation is safest where errors are visible and cheap to reverse.</text>
</svg>
