<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 645" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The parts of a personal AI workflow</title>
  <desc>Six layers of a workflow: the trigger and inputs; the instruction template; the tool and context it uses; the quality gate where a person or rule checks the output; the output and where it goes; and the log and review of how well it works.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">The parts of a personal AI workflow</text>
  <rect x="40" y="82" width="880" height="79" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="58" y="128" text-anchor="start" font-size="17" font-weight="bold" fill="#FFFFFF">Trigger and inputs</text>
  <text x="310" y="126" text-anchor="start" font-size="15" fill="#FFFFFF">When the workflow runs and what material it needs, in what form.</text>
  <rect x="40" y="169" width="880" height="79" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="58" y="214" text-anchor="start" font-size="17" font-weight="bold" fill="#000000">Instruction template</text>
  <text x="310" y="214" text-anchor="start" font-size="15" fill="#000000">A tested, reusable prompt with slots for the variable parts.</text>
  <rect x="40" y="256" width="880" height="79" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="58" y="302" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Tool and context</text>
  <text x="310" y="291" text-anchor="start" font-size="15" fill="#111111">Which approved tool, with which standing instructions and reference</text>
  <text x="310" y="310" text-anchor="start" font-size="15" fill="#111111">files.</text>
  <rect x="40" y="343" width="880" height="79" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="50" y="351" width="860" height="63" fill="#FFFFFF" rx="4"/>
  <text x="58" y="388" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Quality gate</text>
  <text x="310" y="378" text-anchor="start" font-size="15" fill="#111111">The specific checks before the output is used: facts, numbers, tone,</text>
  <text x="310" y="397" text-anchor="start" font-size="15" fill="#111111">commitments.</text>
  <rect x="40" y="430" width="880" height="79" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="58" y="476" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Output and destination</text>
  <text x="310" y="474" text-anchor="start" font-size="15" fill="#111111">Format, where it goes, who sees it, and whether it is labelled.</text>
  <rect x="40" y="517" width="880" height="79" rx="6" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="58" y="562" text-anchor="start" font-size="17" font-weight="bold" fill="#000000">Log and review</text>
  <text x="310" y="562" text-anchor="start" font-size="15" fill="#000000">Time taken, corrections needed, problems found; reviewed monthly.</text>
  <text x="480" y="631" text-anchor="middle" font-size="13" fill="#333333">A workflow is a prompt plus the checks, context and measurement around it.</text>
</svg>
