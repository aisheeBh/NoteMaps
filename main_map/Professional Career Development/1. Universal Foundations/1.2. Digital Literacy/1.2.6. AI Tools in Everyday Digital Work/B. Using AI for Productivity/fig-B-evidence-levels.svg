<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 485" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Why measured gains shrink as the frame widens</title>
  <desc>Four stacked bands from narrowest to widest frame of measurement: single tasks in experiments, often showing gains of 25 to 55 per cent; real jobs in field experiments, often 10 to 30 per cent on targeted work; whole jobs in large surveys, a few per cent of working hours; and whole economies, estimates ranging from well under 1 per cent to several per cent of extra output over a decade.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Why measured gains shrink as the frame widens</text>
  <rect x="130" y="82" width="790" height="82" rx="6" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="140" y="90" width="770" height="66" fill="#FFFFFF" rx="4"/>
  <text x="148" y="119" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Selected tasks (lab</text>
  <text x="148" y="139" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">experiments)</text>
  <text x="400" y="119" text-anchor="start" font-size="15" fill="#111111">Well-defined tasks chosen to suit AI: gains often 25-55% in</text>
  <text x="400" y="138" text-anchor="start" font-size="15" fill="#111111">time or quality.</text>
  <rect x="130" y="172" width="790" height="82" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="140" y="180" width="770" height="66" fill="#FFFFFF" rx="4"/>
  <text x="148" y="210" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Targeted work (field</text>
  <text x="148" y="230" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">experiments)</text>
  <text x="400" y="209" text-anchor="start" font-size="15" fill="#111111">Real work in one function, such as support or coding: gains</text>
  <text x="400" y="228" text-anchor="start" font-size="15" fill="#111111">often 10-30%.</text>
  <rect x="130" y="263" width="790" height="82" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="140" y="271" width="770" height="66" fill="#FFFFFF" rx="4"/>
  <text x="148" y="310" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Whole jobs (large surveys)</text>
  <text x="400" y="300" text-anchor="start" font-size="15" fill="#111111">All of a worker's tasks, including those AI does not touch:</text>
  <text x="400" y="319" text-anchor="start" font-size="15" fill="#111111">a few per cent of hours saved.</text>
  <rect x="130" y="354" width="790" height="82" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="148" y="391" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Whole economies (macro</text>
  <text x="148" y="411" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">estimates)</text>
  <text x="400" y="390" text-anchor="start" font-size="15" fill="#111111">Forecasts range from well under 1% to several per cent of</text>
  <text x="400" y="409" text-anchor="start" font-size="15" fill="#111111">extra output over a decade.</text>
  <line x1="85" y1="88" x2="85" y2="430" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="62" y="259" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111" transform="rotate(-90 62 259)">Wider frame</text>
  <text x="480" y="471" text-anchor="middle" font-size="13" fill="#333333">Schematic summary of studies from 2023 to 2026; ranges are indicative, not from a single dataset.</text>
</svg>
