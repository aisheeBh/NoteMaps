<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Where coding assistance tends to help most</title>
  <desc>A two-by-two grid. Horizontal axis: how large and unfamiliar to the tool the codebase is. Vertical axis: the person's expertise. Novice with small, standard code: large speed gains but high risk of unnoticed errors. Expert with small, standard code: large, safe gains. Novice with large, specialised code: risky; needs guidance and review. Expert with large, specialised code: gains uncertain; the 2025 trial found a slowdown.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Where coding assistance tends to help most</text>
  <rect x="156" y="92" width="366" height="199" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="339" y="184" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Large, safe gains</text>
  <text x="339" y="209" text-anchor="middle" font-size="14" fill="#000000">Scripts, boilerplate, standard tasks</text>
  <rect x="534" y="92" width="366" height="199" rx="6" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="716" y="175" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Gains uncertain</text>
  <text x="716" y="200" text-anchor="middle" font-size="14" fill="#000000">Deep context matters; 2025 trial found a</text>
  <text x="716" y="218" text-anchor="middle" font-size="14" fill="#000000">slowdown</text>
  <rect x="156" y="303" width="366" height="199" rx="6" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="339" y="395" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Fast but errors go unnoticed</text>
  <text x="339" y="420" text-anchor="middle" font-size="14" fill="#000000">Needs tests and someone to review</text>
  <rect x="534" y="303" width="366" height="199" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="542" y="374" width="350" height="56" fill="#FFFFFF" stroke="none" rx="4"/>
  <text x="716" y="395" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Risky without guidance</text>
  <text x="716" y="420" text-anchor="middle" font-size="14" fill="#111111">Mentoring, review, small steps</text>
  <line x1="150" y1="508" x2="917" y2="508" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="150" y1="508" x2="150" y2="74" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="154" y="532" text-anchor="start" font-size="14" fill="#111111">Small, standard</text>
  <text x="905" y="532" text-anchor="end" font-size="14" fill="#111111">Large, specialised</text>
  <text x="528" y="558" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Size and specialisation of the codebase</text>
  <text x="132" y="502" text-anchor="start" font-size="14" fill="#111111" transform="rotate(-90 132 502)">Novice</text>
  <text x="132" y="90" text-anchor="end" font-size="14" fill="#111111" transform="rotate(-90 132 90)">Expert</text>
  <text x="100" y="297" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111" transform="rotate(-90 100 297)">Person's expertise</text>
  <text x="480" y="586" text-anchor="middle" font-size="13" fill="#333333">A summary of patterns across studies to 2026; individual results vary widely.</text>
</svg>
