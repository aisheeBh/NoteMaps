<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Four outcomes of using AI on a task</title>
  <desc>A two-by-two grid. Horizontal axis: change in time taken, from slower to faster. Vertical axis: change in quality, from worse to better. Faster and better: tasks inside the frontier, used well. Slower and better: AI as critic or second reader. Faster and worse: unchecked output and work shifted to others. Slower and worse: tasks outside the frontier, or misuse.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Four outcomes of using AI on a task</text>
  <rect x="156" y="92" width="366" height="199" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="339" y="175" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Slower and better</text>
  <text x="339" y="200" text-anchor="middle" font-size="14" fill="#000000">AI as critic, second reader, sparring</text>
  <text x="339" y="218" text-anchor="middle" font-size="14" fill="#000000">partner</text>
  <rect x="534" y="92" width="366" height="199" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="716" y="184" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Faster and better</text>
  <text x="716" y="209" text-anchor="middle" font-size="14" fill="#000000">Inside the frontier, used with checks</text>
  <rect x="156" y="303" width="366" height="199" rx="6" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="339" y="395" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Slower and worse</text>
  <text x="339" y="420" text-anchor="middle" font-size="14" fill="#000000">Outside the frontier, or misuse</text>
  <rect x="534" y="303" width="366" height="199" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="542" y="374" width="350" height="56" fill="#FFFFFF" stroke="none" rx="4"/>
  <text x="716" y="395" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Faster and worse</text>
  <text x="716" y="420" text-anchor="middle" font-size="14" fill="#111111">Unchecked output; costs shifted to others</text>
  <line x1="150" y1="508" x2="917" y2="508" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="150" y1="508" x2="150" y2="74" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="154" y="532" text-anchor="start" font-size="14" fill="#111111">Slower</text>
  <text x="905" y="532" text-anchor="end" font-size="14" fill="#111111">Faster</text>
  <text x="528" y="558" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Time taken</text>
  <text x="132" y="502" text-anchor="start" font-size="14" fill="#111111" transform="rotate(-90 132 502)">Worse</text>
  <text x="132" y="90" text-anchor="end" font-size="14" fill="#111111" transform="rotate(-90 132 90)">Better</text>
  <text x="100" y="297" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111" transform="rotate(-90 100 297)">Quality of the result</text>
  <text x="480" y="586" text-anchor="middle" font-size="13" fill="#333333">Only measurement of both time and quality shows which box a task is really in.</text>
</svg>
