<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 645" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The parts of an image prompt</title>
  <desc>Six bands describing an image prompt: subject, setting, style, composition, lighting and mood, and format. Each removes one kind of guess from the generated image.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">The parts of an image prompt</text>
  <rect x="40" y="82" width="880" height="79" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="58" y="128" text-anchor="start" font-size="17" font-weight="bold" fill="#FFFFFF">Subject</text>
  <text x="310" y="117" text-anchor="start" font-size="15" fill="#FFFFFF">Who or what, doing what: "two engineers reviewing a wind-turbine</text>
  <text x="310" y="136" text-anchor="start" font-size="15" fill="#FFFFFF">blade".</text>
  <rect x="40" y="169" width="880" height="79" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="58" y="214" text-anchor="start" font-size="17" font-weight="bold" fill="#000000">Setting</text>
  <text x="310" y="214" text-anchor="start" font-size="15" fill="#000000">Where and when: "in a bright factory hall, daytime".</text>
  <rect x="40" y="256" width="880" height="79" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="50" y="264" width="860" height="63" fill="#FFFFFF" rx="4"/>
  <text x="58" y="302" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Style</text>
  <text x="310" y="291" text-anchor="start" font-size="15" fill="#111111">Medium and look: photograph, flat vector illustration, watercolour,</text>
  <text x="310" y="310" text-anchor="start" font-size="15" fill="#111111">isometric diagram.</text>
  <rect x="40" y="343" width="880" height="79" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="58" y="388" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Composition</text>
  <text x="310" y="378" text-anchor="start" font-size="15" fill="#111111">Viewpoint and framing: wide shot, close-up, from above, space left for</text>
  <text x="310" y="397" text-anchor="start" font-size="15" fill="#111111">a headline.</text>
  <rect x="40" y="430" width="880" height="79" rx="6" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="58" y="476" text-anchor="start" font-size="17" font-weight="bold" fill="#000000">Lighting and mood</text>
  <text x="310" y="474" text-anchor="start" font-size="15" fill="#000000">Soft daylight, dramatic contrast; calm, energetic, serious.</text>
  <rect x="40" y="517" width="880" height="79" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="58" y="562" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Format</text>
  <text x="310" y="552" text-anchor="start" font-size="15" fill="#111111">Aspect ratio and use: 16:9 slide, 1:1 social post, A4 portrait; brand</text>
  <text x="310" y="571" text-anchor="start" font-size="15" fill="#111111">colours.</text>
  <text x="480" y="631" text-anchor="middle" font-size="13" fill="#333333">What the prompt leaves out, the model fills with its most typical choices.</text>
</svg>
