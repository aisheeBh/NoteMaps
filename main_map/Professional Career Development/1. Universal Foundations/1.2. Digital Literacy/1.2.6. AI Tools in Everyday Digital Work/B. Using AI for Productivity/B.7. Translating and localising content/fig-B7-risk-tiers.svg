<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>How much human expertise a translation needs</title>
  <desc>A two-by-two grid. Horizontal axis: audience, from internal to external or public. Vertical axis: consequence of an error. Internal and low consequence: machine translation for gist. External and low consequence: machine translation with light post-editing. Internal and high consequence: full post-editing by a qualified linguist. External and high consequence: professional translation, review and, where required, certification.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">How much human expertise a translation needs</text>
  <rect x="156" y="92" width="366" height="199" rx="6" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="339" y="184" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Full post-editing by a linguist</text>
  <text x="339" y="209" text-anchor="middle" font-size="14" fill="#000000">Policies, safety procedures, HR decisions</text>
  <rect x="534" y="92" width="366" height="199" rx="6" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="716" y="175" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Professional translation and review</text>
  <text x="716" y="200" text-anchor="middle" font-size="14" fill="#000000">Contracts, medical, legal, regulatory,</text>
  <text x="716" y="218" text-anchor="middle" font-size="14" fill="#000000">safety</text>
  <rect x="156" y="303" width="366" height="199" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="339" y="395" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Machine output for gist</text>
  <text x="339" y="420" text-anchor="middle" font-size="14" fill="#000000">Reading a supplier email, scanning a report</text>
  <rect x="534" y="303" width="366" height="199" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="716" y="395" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Machine output, light post-edit</text>
  <text x="716" y="420" text-anchor="middle" font-size="14" fill="#000000">Routine support replies, knowledge articles</text>
  <line x1="150" y1="508" x2="917" y2="508" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="150" y1="508" x2="150" y2="74" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="154" y="532" text-anchor="start" font-size="14" fill="#111111">Internal</text>
  <text x="905" y="532" text-anchor="end" font-size="14" fill="#111111">External or public</text>
  <text x="528" y="558" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Audience</text>
  <text x="132" y="502" text-anchor="start" font-size="14" fill="#111111" transform="rotate(-90 132 502)">Low</text>
  <text x="132" y="90" text-anchor="end" font-size="14" fill="#111111" transform="rotate(-90 132 90)">High</text>
  <text x="100" y="297" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111" transform="rotate(-90 100 297)">Consequence of an error</text>
  <text x="480" y="586" text-anchor="middle" font-size="13" fill="#333333">Marketing and brand content needs local review even where the consequence seems low.</text>
</svg>
