<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Discussion, decision and action</title>
  <desc>Three columns. Discussion: what was said, options considered, concerns raised. Decision: what was agreed, by whom, with any conditions. Action: one owner, a specific task and a date. AI tools are most reliable at the first and least reliable at distinguishing the second and third.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Discussion, decision and action</text>
  <rect x="40" y="80" width="264" height="270" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="172" y="114" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Discussion</text>
  <text x="58" y="148" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">•</text>
  <text x="72" y="148" text-anchor="start" font-size="15" fill="#111111">Options and arguments</text>
  <text x="72" y="168" text-anchor="start" font-size="15" fill="#111111">raised</text>
  <text x="58" y="196" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">•</text>
  <text x="72" y="196" text-anchor="start" font-size="15" fill="#111111">Concerns and questions</text>
  <text x="58" y="223" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">•</text>
  <text x="72" y="223" text-anchor="start" font-size="15" fill="#111111">Information shared</text>
  <text x="58" y="250" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">•</text>
  <text x="72" y="250" text-anchor="start" font-size="15" fill="#111111">Often summarised well by</text>
  <text x="72" y="270" text-anchor="start" font-size="15" fill="#111111">AI</text>
  <line x1="308" y1="215" x2="344" y2="215" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="348" y="80" width="264" height="270" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="358" y="90" width="244" height="250" fill="#FFFFFF" rx="4"/>
  <text x="480" y="114" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Decision</text>
  <text x="366" y="148" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">•</text>
  <text x="380" y="148" text-anchor="start" font-size="15" fill="#111111">What was agreed</text>
  <text x="366" y="176" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">•</text>
  <text x="380" y="176" text-anchor="start" font-size="15" fill="#111111">Who had authority to</text>
  <text x="380" y="196" text-anchor="start" font-size="15" fill="#111111">agree</text>
  <text x="366" y="223" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">•</text>
  <text x="380" y="223" text-anchor="start" font-size="15" fill="#111111">Conditions and exceptions</text>
  <text x="366" y="250" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">•</text>
  <text x="380" y="250" text-anchor="start" font-size="15" fill="#111111">Often confused with</text>
  <text x="380" y="270" text-anchor="start" font-size="15" fill="#111111">suggestions</text>
  <line x1="616" y1="215" x2="652" y2="215" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="656" y="80" width="264" height="270" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="788" y="114" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Action</text>
  <text x="674" y="148" text-anchor="start" font-size="15" font-weight="bold" fill="#FFFFFF">•</text>
  <text x="688" y="148" text-anchor="start" font-size="15" fill="#FFFFFF">One named owner</text>
  <text x="674" y="176" text-anchor="start" font-size="15" font-weight="bold" fill="#FFFFFF">•</text>
  <text x="688" y="176" text-anchor="start" font-size="15" fill="#FFFFFF">A specific deliverable</text>
  <text x="674" y="204" text-anchor="start" font-size="15" font-weight="bold" fill="#FFFFFF">•</text>
  <text x="688" y="204" text-anchor="start" font-size="15" fill="#FFFFFF">A date</text>
  <text x="674" y="231" text-anchor="start" font-size="15" font-weight="bold" fill="#FFFFFF">•</text>
  <text x="688" y="231" text-anchor="start" font-size="15" fill="#FFFFFF">Often missing owner or</text>
  <text x="688" y="250" text-anchor="start" font-size="15" fill="#FFFFFF">date</text>
  <text x="480" y="386" text-anchor="middle" font-size="13" fill="#333333">A tentative remark such as "maybe we should" is not a decision, and "someone should" is not an action.</text>
</svg>
