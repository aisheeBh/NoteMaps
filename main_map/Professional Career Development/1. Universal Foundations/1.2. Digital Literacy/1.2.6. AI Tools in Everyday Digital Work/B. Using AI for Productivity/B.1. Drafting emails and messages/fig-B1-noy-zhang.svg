<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Writing with and without ChatGPT (Noy and Zhang, 2023)</title>
  <desc>Bar chart of results from an experiment with 453 college-educated professionals: with ChatGPT access, time taken on writing tasks fell by about 40 per cent and graded quality rose by about 18 per cent.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Writing with and without ChatGPT (Noy and Zhang, 2023)</text>
  <text x="328" y="136" text-anchor="end" font-size="15" fill="#111111">Time taken (change)</text>
  <rect x="340" y="112" width="328" height="38" rx="2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="678" y="136" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">about 40% less</text>
  <text x="328" y="239" text-anchor="end" font-size="15" fill="#111111">Graded quality (change)</text>
  <rect x="340" y="215" width="148" height="38" rx="2" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="498" y="239" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">about 18% higher</text>
  <line x1="340" y1="74" x2="340" y2="289" stroke="#222222" stroke-width="2"/>
  <line x1="340" y1="289" x2="750" y2="289" stroke="#222222" stroke-width="1.5"/>
  <line x1="340" y1="289" x2="340" y2="295" stroke="#222222" stroke-width="1.5"/>
  <text x="340" y="311" text-anchor="middle" font-size="13" fill="#111111">0</text>
  <line x1="422" y1="289" x2="422" y2="295" stroke="#222222" stroke-width="1.5"/>
  <text x="422" y="311" text-anchor="middle" font-size="13" fill="#111111">10</text>
  <line x1="504" y1="289" x2="504" y2="295" stroke="#222222" stroke-width="1.5"/>
  <text x="504" y="311" text-anchor="middle" font-size="13" fill="#111111">20</text>
  <line x1="586" y1="289" x2="586" y2="295" stroke="#222222" stroke-width="1.5"/>
  <text x="586" y="311" text-anchor="middle" font-size="13" fill="#111111">30</text>
  <line x1="668" y1="289" x2="668" y2="295" stroke="#222222" stroke-width="1.5"/>
  <text x="668" y="311" text-anchor="middle" font-size="13" fill="#111111">40</text>
  <line x1="750" y1="289" x2="750" y2="295" stroke="#222222" stroke-width="1.5"/>
  <text x="750" y="311" text-anchor="middle" font-size="13" fill="#111111">50</text>
  <text x="545" y="333" text-anchor="middle" font-size="14" fill="#111111">Size of change relative to the control group (per cent)</text>
  <text x="480" y="366" text-anchor="middle" font-size="13" fill="#333333">Mid-length occupational writing tasks, including a delicate email; graded by professionals in the same occupations.</text>
</svg>
