<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 405" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The pyramid structure of an argument</title>
  <desc>Three stacked bands: at the top a single governing message; beneath it three to five key supporting points that are mutually exclusive and collectively exhaustive; beneath those the evidence, data and examples supporting each point.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">The pyramid structure of an argument</text>
  <rect x="130" y="82" width="790" height="86" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="148" y="131" text-anchor="start" font-size="17" font-weight="bold" fill="#FFFFFF">Governing message</text>
  <text x="400" y="120" text-anchor="start" font-size="15" fill="#FFFFFF">The one answer the reader most needs: the recommendation or</text>
  <text x="400" y="140" text-anchor="start" font-size="15" fill="#FFFFFF">conclusion, stated first.</text>
  <rect x="130" y="176" width="790" height="86" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="140" y="184" width="770" height="70" fill="#FFFFFF" rx="4"/>
  <text x="148" y="225" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Key supporting points</text>
  <text x="400" y="214" text-anchor="start" font-size="15" fill="#111111">Three to five reasons or components, each a full sentence,</text>
  <text x="400" y="234" text-anchor="start" font-size="15" fill="#111111">together mutually exclusive and collectively exhaustive.</text>
  <rect x="130" y="270" width="790" height="86" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="148" y="319" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Evidence</text>
  <text x="400" y="308" text-anchor="start" font-size="15" fill="#111111">Data, examples, analysis and sources that support each key</text>
  <text x="400" y="328" text-anchor="start" font-size="15" fill="#111111">point, grouped under the point they prove.</text>
  <line x1="85" y1="350" x2="85" y2="88" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="62" y="219" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111" transform="rotate(-90 62 219)">Build bottom-up</text>
  <text x="480" y="391" text-anchor="middle" font-size="13" fill="#333333">After Barbara Minto's pyramid principle: think bottom-up, present top-down.</text>
</svg>
