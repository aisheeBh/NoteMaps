<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>AI assistants answering from news content (EBU and BBC, 2025)</title>
  <desc>Bar chart: of more than 3,000 responses from four AI assistants evaluated by journalists, 45 per cent had at least one significant issue, 31 per cent had serious sourcing problems and 20 per cent had major accuracy issues.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">AI assistants answering from news content (EBU and BBC, 2025)</text>
  <text x="328" y="122" text-anchor="end" font-size="15" fill="#111111">At least one significant issue</text>
  <rect x="340" y="98" width="308" height="38" rx="2" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="658" y="122" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">45%</text>
  <text x="328" y="198" text-anchor="end" font-size="15" fill="#111111">Serious sourcing problems</text>
  <rect x="340" y="174" width="212" height="38" rx="2" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="562" y="198" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">31%</text>
  <text x="328" y="272" text-anchor="end" font-size="15" fill="#111111">Major accuracy issues</text>
  <rect x="340" y="248" width="137" height="38" rx="2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="487" y="272" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">20%</text>
  <line x1="340" y1="74" x2="340" y2="309" stroke="#222222" stroke-width="2"/>
  <line x1="340" y1="309" x2="750" y2="309" stroke="#222222" stroke-width="1.5"/>
  <line x1="340" y1="309" x2="340" y2="315" stroke="#222222" stroke-width="1.5"/>
  <text x="340" y="331" text-anchor="middle" font-size="13" fill="#111111">0</text>
  <line x1="477" y1="309" x2="477" y2="315" stroke="#222222" stroke-width="1.5"/>
  <text x="477" y="331" text-anchor="middle" font-size="13" fill="#111111">20</text>
  <line x1="613" y1="309" x2="613" y2="315" stroke="#222222" stroke-width="1.5"/>
  <text x="613" y="331" text-anchor="middle" font-size="13" fill="#111111">40</text>
  <line x1="750" y1="309" x2="750" y2="315" stroke="#222222" stroke-width="1.5"/>
  <text x="750" y="331" text-anchor="middle" font-size="13" fill="#111111">60</text>
  <text x="545" y="353" text-anchor="middle" font-size="14" fill="#111111">Share of evaluated responses (per cent)</text>
  <text x="480" y="386" text-anchor="middle" font-size="13" fill="#333333">22 public-service broadcasters, 18 countries, 14 languages; responses assessed by professional journalists.</text>
</svg>
