<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Swiss cheese</title>
<desc>Five vertical slices representing layers of protection: law, contract, technology, organisation, individual. Each slice has holes. An arrow labelled hazard passes through holes that happen to line up in all five, ending at harm: confidential data reaches a consumer AI tool. Example gaps listed beneath each slice.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">Layers of protection and how a harm passes through</text>
<path d="M160 90 Q200 80 240 90 L240 400 Q200 410 160 400 Z" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
<ellipse cx="200" cy="150" rx="14" ry="13" fill="#FFFFFF" stroke="#7A5200" stroke-width="1.5"/>
<ellipse cx="200" cy="300" rx="22" ry="20" fill="#FFFFFF" stroke="#7A5200" stroke-width="1.5"/>
<ellipse cx="200" cy="360" rx="14" ry="13" fill="#FFFFFF" stroke="#7A5200" stroke-width="1.5"/>
<text x="200" y="430" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Law</text>
<text x="200" y="452" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111">rules exist but</text>
<text x="200" y="470" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111">are not</text>
<text x="200" y="488" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111">enforced in the</text>
<text x="200" y="506" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111">moment</text>
<path d="M300 90 Q340 80 380 90 L380 400 Q340 410 300 400 Z" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
<ellipse cx="340" cy="200" rx="14" ry="13" fill="#FFFFFF" stroke="#7A5200" stroke-width="1.5"/>
<ellipse cx="340" cy="300" rx="22" ry="20" fill="#FFFFFF" stroke="#7A5200" stroke-width="1.5"/>
<ellipse cx="340" cy="370" rx="14" ry="13" fill="#FFFFFF" stroke="#7A5200" stroke-width="1.5"/>
<text x="340" y="430" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Contract</text>
<text x="340" y="452" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111">NDA silent on</text>
<text x="340" y="470" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111">AI</text>
<path d="M440 90 Q480 80 520 90 L520 400 Q480 410 440 400 Z" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
<ellipse cx="480" cy="130" rx="14" ry="13" fill="#FFFFFF" stroke="#7A5200" stroke-width="1.5"/>
<ellipse cx="480" cy="300" rx="22" ry="20" fill="#FFFFFF" stroke="#7A5200" stroke-width="1.5"/>
<ellipse cx="480" cy="350" rx="14" ry="13" fill="#FFFFFF" stroke="#7A5200" stroke-width="1.5"/>
<text x="480" y="430" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Technology</text>
<text x="480" y="452" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111">no block on</text>
<text x="480" y="470" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111">consumer sites</text>
<path d="M580 90 Q620 80 660 90 L660 400 Q620 410 580 400 Z" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
<ellipse cx="620" cy="220" rx="14" ry="13" fill="#FFFFFF" stroke="#7A5200" stroke-width="1.5"/>
<ellipse cx="620" cy="300" rx="22" ry="20" fill="#FFFFFF" stroke="#7A5200" stroke-width="1.5"/>
<ellipse cx="620" cy="375" rx="14" ry="13" fill="#FFFFFF" stroke="#7A5200" stroke-width="1.5"/>
<text x="620" y="430" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Organisation</text>
<text x="620" y="452" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111">policy unknown</text>
<text x="620" y="470" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111">to staff</text>
<path d="M720 90 Q760 80 800 90 L800 400 Q760 410 720 400 Z" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
<ellipse cx="760" cy="170" rx="14" ry="13" fill="#FFFFFF" stroke="#7A5200" stroke-width="1.5"/>
<ellipse cx="760" cy="300" rx="22" ry="20" fill="#FFFFFF" stroke="#7A5200" stroke-width="1.5"/>
<ellipse cx="760" cy="355" rx="14" ry="13" fill="#FFFFFF" stroke="#7A5200" stroke-width="1.5"/>
<text x="760" y="430" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Individual</text>
<text x="760" y="452" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111">rushed, no</text>
<text x="760" y="470" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111">personal rule</text>
<line x1="60" y1="300" x2="812" y2="300" stroke="#8B0000" stroke-width="4" stroke-dasharray="10 6" marker-end="url(#arrow)"/>
<rect x="65" y="269" width="60.400000000000006" height="23.5" fill="#FFFFFF" stroke="none"/>
<text x="70" y="285.0" font-size="15" text-anchor="start" font-weight="bold" fill="#111111">Hazard</text>
<rect x="815" y="245" width="125" height="110" rx="8" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<text x="877.5" y="277.59999999999997" font-size="14" text-anchor="middle" font-weight="bold" fill="#000000">Harm</text>
<text x="877.5" y="295.79999999999995" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">data reaches</text>
<text x="877.5" y="313.99999999999994" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">a consumer</text>
<text x="877.5" y="332.19999999999993" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">AI tool</text>
<text x="480.0" y="545" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">Schematic, after James Reason's model; each hole is a gap in one layer.</text>
</svg>
