<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Custom assistant</title>
<desc>A custom assistant has four parts: instructions, knowledge files, tools and actions, and an audience. Any user in the audience can ask or trick it into revealing instructions and file contents, and actions send data to external services. Conclusion: treat contents as visible to every user.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">Inside a custom assistant</text>
<rect x="330" y="90" width="300" height="300" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="480" y="118" font-size="18" text-anchor="middle" font-weight="bold" fill="#111111">Custom assistant</text>
<rect x="355" y="140" width="250" height="62" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
<text x="480.0" y="176.6" font-size="16" text-anchor="middle" font-weight="bold" fill="#000000">Instructions</text>
<rect x="355" y="218" width="250" height="62" rx="8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
<rect x="406.0" y="234.6" width="148.0" height="28.8" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="480.0" y="254.6" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">Knowledge files</text>
<rect x="355" y="296" width="250" height="62" rx="8" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<rect x="397.2" y="312.6" width="165.60000000000002" height="28.8" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="480.0" y="332.6" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">Tools and actions</text>
<rect x="40" y="160" width="220" height="150" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
<text x="150.0" y="211.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#000000">Audience</text>
<text x="150.0" y="230.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">creator, team,</text>
<text x="150.0" y="250.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">organisation</text>
<text x="150.0" y="269.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">or public</text>
<line x1="262" y1="235" x2="328" y2="235" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<rect x="700" y="120" width="220" height="110" rx="8" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<text x="810.0" y="152.6" font-size="14" text-anchor="middle" font-weight="bold" fill="#000000">Extraction</text>
<text x="810.0" y="170.79999999999998" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">users ask or trick it</text>
<text x="810.0" y="189.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">into revealing files</text>
<text x="810.0" y="207.2" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">and instructions</text>
<line x1="608" y1="200" x2="698" y2="175" stroke="#222222" stroke-width="2.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
<rect x="700" y="270" width="220" height="110" rx="8" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<text x="810.0" y="311.7" font-size="14" text-anchor="middle" font-weight="bold" fill="#000000">External services</text>
<text x="810.0" y="329.9" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">actions send data</text>
<text x="810.0" y="348.09999999999997" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">to other companies</text>
<line x1="608" y1="327" x2="698" y2="325" stroke="#222222" stroke-width="2.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
<rect x="230" y="430" width="500" height="60" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<text x="480.0" y="455.5" font-size="15" text-anchor="middle" font-weight="bold" fill="#FFFFFF">Treat every file and instruction as</text>
<text x="480.0" y="475.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#FFFFFF">visible to everyone who can use it</text>
</svg>
