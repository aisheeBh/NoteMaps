<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Deletion stages</title>
<desc>Five stages left to right: user presses delete; soft deletion hides the item; retention window keeps it for a stated period; purge removes it from live systems; backup expiry removes remaining copies. A legal hold can stop the process at the retention window.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">From pressing delete to gone from every copy</text>
<rect x="30" y="110" width="160" height="100" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<text x="110.0" y="155.5" font-size="15" text-anchor="middle" font-weight="bold" fill="#FFFFFF">Press delete</text>
<text x="110.0" y="175.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#FFFFFF">user action</text>
<line x1="192" y1="160" x2="214" y2="160" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="216" y="110" width="160" height="100" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
<text x="296.0" y="145.75" font-size="15" text-anchor="middle" font-weight="bold" fill="#000000">Soft deletion</text>
<text x="296.0" y="165.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">hidden, still</text>
<text x="296.0" y="184.75" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">stored</text>
<line x1="378" y1="160" x2="400" y2="160" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="402" y="110" width="160" height="100" rx="8" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<rect x="410.0" y="126.75" width="144" height="66.5" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="482.0" y="145.75" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Retention window</text>
<text x="482.0" y="165.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">often about 30</text>
<text x="482.0" y="184.75" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">days</text>
<line x1="564" y1="160" x2="586" y2="160" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="588" y="110" width="160" height="100" rx="8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
<rect x="610.5" y="126.75" width="115.00000000000001" height="66.5" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="668.0" y="145.75" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Purge</text>
<text x="668.0" y="165.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">removed from</text>
<text x="668.0" y="184.75" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">live systems</text>
<line x1="750" y1="160" x2="772" y2="160" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="774" y="110" width="160" height="100" rx="8" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
<rect x="782.0" y="126.75" width="144" height="66.5" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="854.0" y="145.75" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Backup expiry</text>
<text x="854.0" y="165.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">remaining copies</text>
<text x="854.0" y="184.75" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">age out</text>
<line x1="30" y1="250" x2="910" y2="250" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="470" y="276" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">time after pressing delete</text>
<rect x="330" y="320" width="300" height="80" rx="8" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<text x="480.0" y="355.5" font-size="15" text-anchor="middle" font-weight="bold" fill="#000000">Legal hold or flag</text>
<text x="480.0" y="375.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">suspends deletion indefinitely</text>
<line x1="480" y1="318" x2="480" y2="214" stroke="#222222" stroke-width="2.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
<text x="480.0" y="470" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">Schematic; periods vary by provider, plan and legal obligations.</text>
</svg>
