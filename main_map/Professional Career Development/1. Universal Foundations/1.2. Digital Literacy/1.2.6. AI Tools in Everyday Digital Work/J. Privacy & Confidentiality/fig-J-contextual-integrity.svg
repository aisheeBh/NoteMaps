<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Contextual integrity</title>
<desc>A table-like figure with five parameters as rows: sender, recipient, subject, information type, transmission principle. Column one, the original clinical context: nurse; care team; patient; health information; clinical confidentiality. Column two, the new flow: the same nurse; an AI provider, its reviewers and possibly future models; the same patient; the same health information; consumer terms allowing storage and review. Recipient and transmission principle are marked changed, so the flow breaks the context's norms.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">Five parameters of an information flow</text>
<rect x="250" y="80" width="290" height="50" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
<text x="395.0" y="110.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#000000">Original context: clinic</text>
<rect x="560" y="80" width="290" height="50" rx="8" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<rect x="589.75" y="91.25" width="230.50000000000003" height="27.5" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="705.0" y="110.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">New flow: consumer chatbot</text>
<rect x="40" y="145" width="200" height="58" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<text x="140.0" y="179.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#FFFFFF">Sender</text>
<rect x="250" y="145" width="290" height="58" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="395.0" y="179.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">nurse</text>
<rect x="560" y="145" width="290" height="58" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="705.0" y="179.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">same nurse</text>
<text x="905" y="179" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">same</text>
<rect x="40" y="217" width="200" height="58" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<text x="140.0" y="251.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#FFFFFF">Recipient</text>
<rect x="250" y="217" width="290" height="58" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="395.0" y="251.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">the care team</text>
<rect x="560" y="217" width="290" height="58" rx="8" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<text x="705.0" y="241.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">AI provider, reviewers, future</text>
<text x="705.0" y="261.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">models</text>
<text x="905" y="251" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">changed</text>
<rect x="40" y="289" width="200" height="58" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<text x="140.0" y="323.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#FFFFFF">Subject</text>
<rect x="250" y="289" width="290" height="58" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="395.0" y="323.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">the patient</text>
<rect x="560" y="289" width="290" height="58" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="705.0" y="323.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">the same patient</text>
<text x="905" y="323" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">same</text>
<rect x="40" y="361" width="200" height="58" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<text x="140.0" y="385.5" font-size="15" text-anchor="middle" font-weight="bold" fill="#FFFFFF">Information</text>
<text x="140.0" y="405.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#FFFFFF">type</text>
<rect x="250" y="361" width="290" height="58" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="395.0" y="395.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">health information</text>
<rect x="560" y="361" width="290" height="58" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="705.0" y="395.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">the same health information</text>
<text x="905" y="395" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">same</text>
<rect x="40" y="433" width="200" height="58" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<text x="140.0" y="457.5" font-size="15" text-anchor="middle" font-weight="bold" fill="#FFFFFF">Transmission</text>
<text x="140.0" y="477.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#FFFFFF">principle</text>
<rect x="250" y="433" width="290" height="58" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="395.0" y="467.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">clinical confidentiality</text>
<rect x="560" y="433" width="290" height="58" rx="8" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<text x="705.0" y="457.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">consumer terms: storage,</text>
<text x="705.0" y="477.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">review</text>
<text x="905" y="467" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">changed</text>
<text x="480" y="530" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">Two parameters break the norms of the clinical context, so the flow violates contextual integrity.</text>
</svg>
