<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Consent spectrum</title>
<desc>Five consent designs from weakest to strongest protection: no choice offered; opt-out buried in menus; prominent opt-out; opt-in; contractual exclusion. Users included by default fall from all to none.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">Consent designs for training on user content</text>
<line x1="60" y1="110" x2="900" y2="110" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="55" y="79" width="152.8" height="23.5" fill="#FFFFFF" stroke="none"/>
<text x="60" y="95.0" font-size="15" text-anchor="start" font-weight="bold" fill="#111111">Weaker protection</text>
<rect x="735.4" y="79" width="169.60000000000002" height="23.5" fill="#FFFFFF" stroke="none"/>
<text x="900" y="95.0" font-size="15" text-anchor="end" font-weight="bold" fill="#111111">Stronger protection</text>
<rect x="40" y="140" width="160" height="64" rx="8" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<rect x="74.875" y="158.25" width="90.25" height="27.5" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="120.0" y="177.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">No choice</text>
<rect x="40" y="214" width="160" height="80" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="120.0" y="249.8" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">use stated in</text>
<text x="120.0" y="268.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">terms; no control</text>
<text x="120" y="330" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">Included by default:</text>
<text x="120" y="352" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">all users</text>
<rect x="220" y="140" width="160" height="64" rx="8" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<rect x="234.25" y="158.25" width="131.5" height="27.5" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="300.0" y="177.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Buried opt-out</text>
<rect x="220" y="214" width="160" height="80" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="300.0" y="249.8" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">switch deep in</text>
<text x="300.0" y="268.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">menus, vague label</text>
<text x="300" y="330" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">Included by default:</text>
<text x="300" y="352" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">nearly all</text>
<rect x="400" y="140" width="160" height="64" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
<text x="480.0" y="167.5" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">Prominent</text>
<text x="480.0" y="187.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">opt-out</text>
<rect x="400" y="214" width="160" height="80" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="480.0" y="249.8" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">clear switch at</text>
<text x="480.0" y="268.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">sign-up or notice</text>
<text x="480" y="330" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">Included by default:</text>
<text x="480" y="352" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">most users</text>
<rect x="580" y="140" width="160" height="64" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
<text x="660.0" y="177.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#000000">Opt-in</text>
<rect x="580" y="214" width="160" height="80" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="660.0" y="249.8" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">used only if the</text>
<text x="660.0" y="268.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">user agrees</text>
<text x="660" y="330" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">Included by default:</text>
<text x="660" y="352" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">a minority</text>
<rect x="760" y="140" width="160" height="64" rx="8" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
<rect x="786.625" y="148.5" width="106.75000000000001" height="47.0" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="840.0" y="167.5" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Contractual</text>
<text x="840.0" y="187.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">exclusion</text>
<rect x="760" y="214" width="160" height="80" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="840.0" y="249.8" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">business terms</text>
<text x="840.0" y="268.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">forbid training</text>
<text x="840" y="330" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">Included by default:</text>
<text x="840" y="352" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">none</text>
<text x="480" y="410" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">Only the right-hand design is an enforceable promise rather than a setting.</text>
</svg>
