<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Know-how spectrum</title>
<desc>A horizontal spectrum from free to use to must not leave the permitted circle. Items placed left to right: own general expertise; public facts about a client; firm's methods and templates; client documents under NDA; trade secrets and source code; privileged advice and inside information.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">Where common kinds of work information sit</text>
<rect x="60" y="100" width="840" height="34" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
<rect x="65" y="76" width="220.00000000000003" height="23.5" fill="#FFFFFF" stroke="none"/>
<text x="70" y="92.0" font-size="15" text-anchor="start" font-weight="bold" fill="#111111">Free to use in most tools</text>
<rect x="574.2" y="76" width="320.8" height="23.5" fill="#FFFFFF" stroke="none"/>
<text x="890" y="92.0" font-size="15" text-anchor="end" font-weight="bold" fill="#111111">Must stay inside the permitted circle</text>
<line x1="125" y1="134" x2="125" y2="170" stroke="#333333" stroke-width="2"/>
<rect x="60" y="172" width="130" height="100" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
<text x="125.0" y="217.8" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">Own general</text>
<text x="125.0" y="236.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">expertise</text>
<line x1="265" y1="134" x2="265" y2="170" stroke="#333333" stroke-width="2"/>
<line x1="265" y1="170" x2="265" y2="290" stroke="#333333" stroke-width="2" stroke-dasharray="2 4"/>
<rect x="200" y="290" width="130" height="100" rx="8" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
<rect x="208.0" y="317.8" width="114" height="44.4" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="265.0" y="335.79999999999995" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">Public facts</text>
<text x="265.0" y="353.99999999999994" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">about a client</text>
<line x1="405" y1="134" x2="405" y2="170" stroke="#333333" stroke-width="2"/>
<rect x="340" y="172" width="130" height="100" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
<text x="405.0" y="217.8" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">Firm's methods</text>
<text x="405.0" y="236.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">and templates</text>
<line x1="545" y1="134" x2="545" y2="170" stroke="#333333" stroke-width="2"/>
<line x1="545" y1="170" x2="545" y2="290" stroke="#333333" stroke-width="2" stroke-dasharray="2 4"/>
<rect x="480" y="290" width="130" height="100" rx="8" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<rect x="488.0" y="308.7" width="114" height="62.599999999999994" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="545.0" y="326.7" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">Client</text>
<text x="545.0" y="344.9" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">documents under</text>
<text x="545.0" y="363.09999999999997" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">NDA</text>
<line x1="685" y1="134" x2="685" y2="170" stroke="#333333" stroke-width="2"/>
<rect x="620" y="172" width="130" height="100" rx="8" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<rect x="628.0" y="199.8" width="114" height="44.4" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="685.0" y="217.8" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">Trade secrets</text>
<text x="685.0" y="236.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">and source code</text>
<line x1="825" y1="134" x2="825" y2="170" stroke="#333333" stroke-width="2"/>
<line x1="825" y1="170" x2="825" y2="290" stroke="#333333" stroke-width="2" stroke-dasharray="2 4"/>
<rect x="760" y="290" width="130" height="100" rx="8" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<text x="825.0" y="326.7" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">Privileged</text>
<text x="825.0" y="344.9" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">advice; inside</text>
<text x="825.0" y="363.09999999999997" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">information</text>
<text x="480" y="440" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">General skill travels with the person; specific content stays with its owner.</text>
</svg>
