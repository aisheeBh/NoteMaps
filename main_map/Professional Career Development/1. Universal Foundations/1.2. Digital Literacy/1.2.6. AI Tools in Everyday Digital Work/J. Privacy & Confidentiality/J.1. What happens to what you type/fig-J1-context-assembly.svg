<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Context assembly</title>
<desc>The context sent to the model on one turn: provider system instructions, the user's custom instructions, saved memory, retrieved files and search results, earlier conversation turns, and the new message. It goes to the model, whose weights are unchanged; the service stores the conversation.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">What the model receives on turn five of a chat</text>
<rect x="40" y="80" width="560" height="440" rx="10" fill="#FFFFFF" stroke="#222222" stroke-width="2.5"/>
<text x="320" y="106" font-size="17" text-anchor="middle" font-weight="bold" fill="#111111">Context window for one request</text>
<rect x="60" y="122" width="520" height="58" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
<text x="320.0" y="146.5" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">Provider system instructions</text>
<text x="320.0" y="166.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">set by the provider, unseen by user</text>
<rect x="60" y="186" width="520" height="58" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="320.0" y="210.5" font-size="15" text-anchor="middle" font-weight="bold" fill="#000000">Custom instructions</text>
<text x="320.0" y="230.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">user's standing preferences and profile</text>
<rect x="60" y="250" width="520" height="58" rx="8" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<rect x="188.25" y="255.5" width="263.5" height="47.0" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="320.0" y="274.5" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Memory entries</text>
<text x="320.0" y="294.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">facts saved from earlier chats</text>
<rect x="60" y="314" width="520" height="58" rx="8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
<rect x="155.25" y="319.5" width="329.5" height="47.0" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="320.0" y="338.5" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Retrieved content</text>
<text x="320.0" y="358.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">uploaded files, search results, emails</text>
<rect x="60" y="378" width="520" height="58" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
<text x="320.0" y="402.5" font-size="15" text-anchor="middle" font-weight="bold" fill="#000000">Conversation history</text>
<text x="320.0" y="422.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">turns one to four, re-sent in full</text>
<rect x="60" y="442" width="520" height="58" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<text x="320.0" y="466.5" font-size="15" text-anchor="middle" font-weight="bold" fill="#FFFFFF">New message</text>
<text x="320.0" y="486.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#FFFFFF">turn five, the only part just typed</text>
<rect x="680" y="200" width="240" height="110" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<text x="800.0" y="239.79999999999998" font-size="16" text-anchor="middle" font-weight="bold" fill="#FFFFFF">Model</text>
<text x="800.0" y="260.59999999999997" font-size="16" text-anchor="middle" font-weight="normal" fill="#FFFFFF">computes an answer</text>
<text x="800.0" y="281.4" font-size="16" text-anchor="middle" font-weight="normal" fill="#FFFFFF">weights unchanged</text>
<line x1="600" y1="300" x2="676" y2="260" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="680" y="360" width="240" height="110" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
<text x="800.0" y="399.8" font-size="16" text-anchor="middle" font-weight="bold" fill="#000000">Service</text>
<text x="800.0" y="420.6" font-size="16" text-anchor="middle" font-weight="normal" fill="#000000">stores prompt, files,</text>
<text x="800.0" y="441.40000000000003" font-size="16" text-anchor="middle" font-weight="normal" fill="#000000">answer and logs</text>
<line x1="800" y1="310" x2="800" y2="356" stroke="#222222" stroke-width="2" stroke-dasharray="10 6" marker-end="url(#arrow)"/>
<text x="480.0" y="545" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">Only the bottom band was typed on this turn; everything above it is added by the service.</text>
</svg>
