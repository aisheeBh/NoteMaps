<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Friction</title>
<desc>Two paths from the moment of need. Approved path: pinned enterprise assistant, placeholder snippet ready, one click, signed in automatically. Risky path: personal account signed out on work devices, consumer app removed from the work phone profile, separate browser profile required. The approved path has fewer steps.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">Making the approved path the easy one</text>
<rect x="360" y="76" width="240" height="56" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<text x="480.0" y="109.95" font-size="17" text-anchor="middle" font-weight="bold" fill="#FFFFFF">Moment of need</text>
<rect x="40" y="170" width="400" height="56" rx="8" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
<rect x="117.6" y="183.6" width="244.8" height="28.8" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="240.0" y="203.6" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">Approved path: fewer steps</text>
<rect x="520" y="170" width="400" height="56" rx="8" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<rect x="615.2" y="183.6" width="209.60000000000002" height="28.8" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="720.0" y="203.6" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">Risky path: more steps</text>
<line x1="420" y1="134" x2="260" y2="166" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="540" y1="134" x2="700" y2="166" stroke="#222222" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
<rect x="60" y="244" width="360" height="46" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
<text x="240.0" y="272.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">Enterprise assistant pinned</text>
<rect x="540" y="244" width="360" height="46" rx="8" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<text x="720.0" y="272.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">Personal account signed out</text>
<rect x="60" y="302" width="360" height="46" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
<text x="240.0" y="330.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">Signed in automatically</text>
<rect x="540" y="302" width="360" height="46" rx="8" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<text x="720.0" y="330.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">Consumer app not on work phone</text>
<rect x="60" y="360" width="360" height="46" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
<text x="240.0" y="388.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">Placeholder snippets ready</text>
<rect x="540" y="360" width="360" height="46" rx="8" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<text x="720.0" y="388.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">Separate browser profile needed</text>
<rect x="60" y="418" width="360" height="46" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
<text x="240.0" y="446.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">Workspace banner confirms approval</text>
<rect x="540" y="418" width="360" height="46" rx="8" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<text x="720.0" y="446.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">Approved-tools reminder on login</text>
<text x="480.0" y="505" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">Illustrative arrangements; available controls depend on the organisation's systems.</text>
</svg>
