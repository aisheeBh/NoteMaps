<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Iterative drift</title>
  <desc>Meaning retained declines across successive rewrites when each rewrite starts from the previous one, but stays near the original when each starts from the original.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Rewriting a rewrite: how meaning drifts</text>
  <line x1="140" y1="440" x2="720" y2="440" stroke="#222222" stroke-width="2.5"/>
  <line x1="140" y1="440" x2="140" y2="100" stroke="#222222" stroke-width="2.5"/>
  <text x="140" y="466" text-anchor="middle" font-size="14" fill="#111111">Original</text>
  <text x="280" y="466" text-anchor="middle" font-size="14" fill="#111111">Rewrite 1</text>
  <text x="420" y="466" text-anchor="middle" font-size="14" fill="#111111">Rewrite 2</text>
  <text x="560" y="466" text-anchor="middle" font-size="14" fill="#111111">Rewrite 3</text>
  <text x="700" y="466" text-anchor="middle" font-size="14" fill="#111111">Rewrite 4</text>
  <text x="128" y="445" text-anchor="end" font-size="14" fill="#111111">0%</text>
  <text x="128" y="285" text-anchor="end" font-size="14" fill="#111111">50%</text>
  <text x="128" y="125" text-anchor="end" font-size="14" fill="#111111">100%</text>
  <text x="70" y="270" text-anchor="middle" font-size="15" fill="#111111" transform="rotate(-90 70 270)">Meaning retained</text>
  <path d="M140 120 L280 136 L420 136 L560 139 L700 136" fill="none" stroke="#1E5E24" stroke-width="3.5"/>
  <path d="M140 120 L280 146 L420 174 L560 203 L700 229" fill="none" stroke="#8B0000" stroke-width="3.5" stroke-dasharray="10 6"/>
  <rect x="720" y="100" width="220" height="64" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="830" y="127" text-anchor="middle" font-size="15" fill="#111111">Each rewrite made</text>
  <text x="830" y="146" text-anchor="middle" font-size="15" fill="#111111">from the original</text>
  <rect x="720" y="200" width="220" height="64" rx="6" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="830" y="227" text-anchor="middle" font-size="15" fill="#111111">Each rewrite made</text>
  <text x="830" y="246" text-anchor="middle" font-size="15" fill="#111111">from the last one</text>
  <text x="480" y="528" text-anchor="middle" font-size="13" fill="#333333">Schematic; not plotted from a single dataset.</text>
</svg>
