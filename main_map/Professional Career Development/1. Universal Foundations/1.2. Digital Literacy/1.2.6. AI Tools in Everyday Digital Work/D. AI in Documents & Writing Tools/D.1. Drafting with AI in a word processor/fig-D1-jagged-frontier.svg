<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Effects of AI assistance inside and outside the frontier</title>
  <desc>Inside the AI capability frontier, consultants with GPT-4 completed about 12 percent more tasks, worked about 25 percent faster and produced output rated over 40 percent higher in quality. On a task outside the frontier they were about 19 percentage points less likely to be correct.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Same tool, opposite effects: the jagged frontier</text>
  <line x1="470" y1="80" x2="470" y2="470" stroke="#222222" stroke-width="2.5"/>
  <text x="470" y="500" text-anchor="middle" font-size="14" fill="#111111">no difference</text>
  <rect x="470" y="110" width="84" height="48" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <text x="456" y="140" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Tasks completed (inside)</text>
  <text x="564" y="140" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">+12%</text>
  <rect x="470" y="198" width="175" height="48" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <text x="456" y="228" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Speed (inside)</text>
  <text x="655" y="228" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">+25% faster</text>
  <rect x="470" y="286" width="280" height="48" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <text x="456" y="316" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Rated quality (inside)</text>
  <text x="760" y="316" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">over +40%</text>
  <rect x="337" y="374" width="133" height="48" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="484" y="404" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">Correct answers (outside)</text>
  <text x="327" y="404" text-anchor="end" font-size="16" font-weight="bold" fill="#111111">−19 points</text>
  <text x="670" y="90" text-anchor="middle" font-size="14" font-style="italic" fill="#111111">AI group better →</text>
  <text x="270" y="90" text-anchor="middle" font-size="14" font-style="italic" fill="#111111">← AI group worse</text>
  <text x="480" y="540" text-anchor="middle" font-size="13" fill="#333333">Approximate effects for GPT-4 users versus controls, Dell'Acqua and colleagues (2023), 758 consultants.</text>
</svg>
