<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Typical length change when translating from English</title>
  <desc>Illustrative ranges: German, French and Spanish usually longer than English, often by roughly a fifth to a third; Chinese and Japanese usually take fewer characters. Ranges vary by text type.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Length change from English (illustrative)</text>
  <line x1="480" y1="80" x2="480" y2="450" stroke="#222222" stroke-width="2.5"/>
  <text x="480" y="475" text-anchor="middle" font-size="14" fill="#111111">same length as English</text>
  <rect x="600" y="100" width="90" height="40" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="40" y="126" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">German</text>
  <text x="702" y="126" text-anchor="start" font-size="15" fill="#111111">+20% to +35%</text>
  <rect x="570" y="170" width="90" height="40" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="40" y="196" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">French</text>
  <text x="672" y="196" text-anchor="start" font-size="15" fill="#111111">+15% to +30%</text>
  <rect x="570" y="240" width="90" height="40" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="40" y="266" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">Spanish</text>
  <text x="672" y="266" text-anchor="start" font-size="15" fill="#111111">+15% to +30%</text>
  <rect x="240" y="310" width="120" height="40" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="40" y="336" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">Chinese (characters)</text>
  <text x="494" y="336" text-anchor="start" font-size="15" fill="#111111">-40% to -20%</text>
  <rect x="270" y="380" width="150" height="40" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="40" y="406" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">Japanese (characters)</text>
  <text x="494" y="406" text-anchor="start" font-size="15" fill="#111111">-35% to -10%</text>
  <text x="480" y="520" text-anchor="middle" font-size="13" fill="#333333">Illustrative rule-of-thumb ranges; actual change depends on text type, terminology and layout.</text>
</svg>
