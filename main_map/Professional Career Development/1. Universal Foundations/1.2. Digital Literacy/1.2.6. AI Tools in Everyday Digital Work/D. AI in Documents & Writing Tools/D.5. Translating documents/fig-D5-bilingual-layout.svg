<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Bilingual side-by-side review layout</title>
  <desc>A two-column table with numbered segments: source text on the left, translation on the right, and a reviewer comment column flagging a number check and a term check.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Side-by-side review: source and translation aligned</text>
  <rect x="30" y="80" width="60" height="50" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="60" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">No.</text>
  <rect x="90" y="80" width="340" height="50" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="260" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Source (Spanish)</text>
  <rect x="430" y="80" width="340" height="50" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="600" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Translation (English)</text>
  <rect x="770" y="80" width="160" height="50" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="850" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Reviewer note</text>
  <rect x="30" y="130" width="60" height="90" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="60" y="180" text-anchor="middle" font-size="15" fill="#111111">1</text>
  <rect x="90" y="130" width="340" height="90" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="260" y="180" text-anchor="middle" font-size="15" fill="#111111">Hallazgo 3: conciliación bancaria</text>
  <rect x="430" y="130" width="340" height="90" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="600" y="180" text-anchor="middle" font-size="15" fill="#111111">Finding 3: bank reconciliation</text>
  <rect x="770" y="130" width="160" height="90" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="850" y="180" text-anchor="middle" font-size="15" fill="#111111">Term OK</text>
  <rect x="30" y="220" width="60" height="90" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="60" y="270" text-anchor="middle" font-size="15" fill="#111111">2</text>
  <rect x="90" y="220" width="340" height="90" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="260" y="270" text-anchor="middle" font-size="15" fill="#111111">Importe: 1.250.000 €</text>
  <rect x="430" y="220" width="340" height="90" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="600" y="270" text-anchor="middle" font-size="15" fill="#111111">Amount: €1,250,000</text>
  <rect x="770" y="220" width="160" height="90" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="850" y="270" text-anchor="middle" font-size="15" fill="#111111">Number checked</text>
  <rect x="30" y="310" width="60" height="90" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="60" y="360" text-anchor="middle" font-size="15" fill="#111111">3</text>
  <rect x="90" y="310" width="340" height="90" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="260" y="360" text-anchor="middle" font-size="15" fill="#111111">Se recomienda valorar el proceso</text>
  <rect x="430" y="310" width="340" height="90" rx="0" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="600" y="360" text-anchor="middle" font-size="15" fill="#111111">We require the process to be assessed</text>
  <rect x="770" y="310" width="160" height="90" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="778" y="330" width="144" height="49" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
  <text x="850" y="350" text-anchor="middle" font-size="15" fill="#111111">Strength changed:</text>
  <text x="850" y="369" text-anchor="middle" font-size="15" fill="#111111">fix</text>
  <rect x="30" y="400" width="60" height="90" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="60" y="450" text-anchor="middle" font-size="15" fill="#111111">4</text>
  <rect x="90" y="400" width="340" height="90" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="260" y="450" text-anchor="middle" font-size="15" fill="#111111">[Tabla en imagen]</text>
  <rect x="430" y="400" width="340" height="90" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="600" y="450" text-anchor="middle" font-size="15" fill="#111111">[Image table, untranslated]</text>
  <rect x="770" y="400" width="160" height="90" rx="0" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="778" y="420" width="144" height="49" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="850" y="440" text-anchor="middle" font-size="15" fill="#111111">Re-type and</text>
  <text x="850" y="459" text-anchor="middle" font-size="15" fill="#111111">translate</text>
  <text x="480" y="530" text-anchor="middle" font-size="13" fill="#333333">Illustrative example; content and figures invented for demonstration.</text>
</svg>
