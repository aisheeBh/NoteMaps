<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Which document parts survive automatic translation</title>
  <desc>Three groups. Usually reliable: body paragraphs, headings with styles, simple tables, lists. Check carefully: footnotes, headers and footers, complex tables, cross-reference fields, tracked changes. Often lost or untranslated: text in images, charts, scanned pages, text boxes and embedded objects.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">What survives a one-click document translation</text>
  <rect x="30" y="80" width="285" height="70" rx="6" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="38" y="98" width="269" height="32" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/>
  <text x="172" y="121" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Usually reliable</text>
  <rect x="45" y="170" width="255" height="54" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="172" y="202" text-anchor="middle" font-size="15" fill="#111111">Body paragraphs</text>
  <rect x="45" y="236" width="255" height="54" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="172" y="268" text-anchor="middle" font-size="15" fill="#111111">Headings with styles</text>
  <rect x="45" y="302" width="255" height="54" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="172" y="334" text-anchor="middle" font-size="15" fill="#111111">Simple tables</text>
  <rect x="45" y="368" width="255" height="54" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="172" y="400" text-anchor="middle" font-size="15" fill="#111111">Bulleted and numbered lists</text>
  <rect x="335" y="80" width="285" height="70" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="343" y="98" width="269" height="32" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="478" y="121" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Check carefully</text>
  <rect x="350" y="170" width="255" height="54" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="478" y="202" text-anchor="middle" font-size="15" fill="#111111">Footnotes and endnotes</text>
  <rect x="350" y="236" width="255" height="54" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="478" y="268" text-anchor="middle" font-size="15" fill="#111111">Headers and footers</text>
  <rect x="350" y="302" width="255" height="54" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="478" y="334" text-anchor="middle" font-size="15" fill="#111111">Complex or merged tables</text>
  <rect x="350" y="368" width="255" height="54" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="478" y="400" text-anchor="middle" font-size="15" fill="#111111">Cross-reference fields</text>
  <rect x="350" y="434" width="255" height="54" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="478" y="466" text-anchor="middle" font-size="15" fill="#111111">Tracked changes and comments</text>
  <rect x="640" y="80" width="285" height="70" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="648" y="98" width="269" height="32" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
  <text x="782" y="121" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Often lost or untranslated</text>
  <rect x="655" y="170" width="255" height="54" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="782" y="202" text-anchor="middle" font-size="15" fill="#111111">Text inside images</text>
  <rect x="655" y="236" width="255" height="54" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="782" y="268" text-anchor="middle" font-size="15" fill="#111111">Charts and diagrams</text>
  <rect x="655" y="302" width="255" height="54" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="782" y="334" text-anchor="middle" font-size="15" fill="#111111">Scanned pages</text>
  <rect x="655" y="368" width="255" height="54" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="782" y="400" text-anchor="middle" font-size="15" fill="#111111">Text boxes and shapes</text>
  <rect x="655" y="434" width="255" height="54" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="782" y="466" text-anchor="middle" font-size="15" fill="#111111">Embedded objects</text>
  <text x="480" y="530" text-anchor="middle" font-size="13" fill="#333333">Schematic summary of typical behaviour; results vary by tool and file.</text>
</svg>
