<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The path of an in-document AI request</title>
  <desc>Five stages from left to right: collection of request, document, referenced files and organisational content; transmission to the provider; processing by the model; return of output; retention of logs. Under each, the decision that governs confidentiality.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Where document content travels</text>
  <rect x="24" y="90" width="168" height="170" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="108" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">1 Collection</text>
  <text x="108" y="176" text-anchor="middle" font-size="14" fill="#111111">request, document,</text>
  <text x="108" y="194" text-anchor="middle" font-size="14" fill="#111111">referenced files,</text>
  <text x="108" y="212" text-anchor="middle" font-size="14" fill="#111111">retrieved content</text>
  <line x1="192" y1="175" x2="210" y2="175" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="24" y="300" width="168" height="130" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="108" y="339" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Decided by</text>
  <text x="108" y="363" text-anchor="middle" font-size="14" fill="#111111">What is included?</text>
  <text x="108" y="381" text-anchor="middle" font-size="14" fill="#111111">Hidden layers?</text>
  <text x="108" y="399" text-anchor="middle" font-size="14" fill="#111111">Overshared files?</text>
  <line x1="108" y1="260" x2="108" y2="300" stroke="#222222" stroke-width="1.5" stroke-dasharray="3 4"/>
  <rect x="210" y="90" width="168" height="170" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="218" y="138" width="152" height="72" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="294" y="159" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">2 Transmission</text>
  <text x="294" y="185" text-anchor="middle" font-size="14" fill="#111111">to the provider's</text>
  <text x="294" y="203" text-anchor="middle" font-size="14" fill="#111111">service</text>
  <line x1="378" y1="175" x2="396" y2="175" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="210" y="300" width="168" height="130" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="294" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Decided by</text>
  <text x="294" y="372" text-anchor="middle" font-size="14" fill="#111111">Which account and</text>
  <text x="294" y="390" text-anchor="middle" font-size="14" fill="#111111">contract?</text>
  <line x1="294" y1="260" x2="294" y2="300" stroke="#222222" stroke-width="1.5" stroke-dasharray="3 4"/>
  <rect x="396" y="90" width="168" height="170" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="480" y="159" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">3 Processing</text>
  <text x="480" y="185" text-anchor="middle" font-size="14" fill="#FFFFFF">the model generates</text>
  <text x="480" y="203" text-anchor="middle" font-size="14" fill="#FFFFFF">a response</text>
  <line x1="564" y1="175" x2="582" y2="175" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="396" y="300" width="168" height="130" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="480" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Decided by</text>
  <text x="480" y="372" text-anchor="middle" font-size="14" fill="#111111">Training use</text>
  <text x="480" y="390" text-anchor="middle" font-size="14" fill="#111111">excluded?</text>
  <line x1="480" y1="260" x2="480" y2="300" stroke="#222222" stroke-width="1.5" stroke-dasharray="3 4"/>
  <rect x="582" y="90" width="168" height="170" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="666" y="159" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">4 Return</text>
  <text x="666" y="185" text-anchor="middle" font-size="14" fill="#111111">output in document</text>
  <text x="666" y="203" text-anchor="middle" font-size="14" fill="#111111">or panel</text>
  <line x1="750" y1="175" x2="768" y2="175" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="582" y="300" width="168" height="130" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="666" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Decided by</text>
  <text x="666" y="372" text-anchor="middle" font-size="14" fill="#111111">Label inherited?</text>
  <text x="666" y="390" text-anchor="middle" font-size="14" fill="#111111">Injected content?</text>
  <line x1="666" y1="260" x2="666" y2="300" stroke="#222222" stroke-width="1.5" stroke-dasharray="3 4"/>
  <rect x="768" y="90" width="168" height="170" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="776" y="147" width="152" height="54" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="852" y="168" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">5 Retention</text>
  <text x="852" y="194" text-anchor="middle" font-size="14" fill="#111111">logs and history</text>
  <rect x="768" y="300" width="168" height="130" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="852" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Decided by</text>
  <text x="852" y="372" text-anchor="middle" font-size="14" fill="#111111">How long, who can</text>
  <text x="852" y="390" text-anchor="middle" font-size="14" fill="#111111">see?</text>
  <line x1="852" y1="260" x2="852" y2="300" stroke="#222222" stroke-width="1.5" stroke-dasharray="3 4"/>
  <rect x="24" y="460" width="912" height="60" rx="6" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="480" y="494" text-anchor="middle" font-size="15" fill="#222222">Confidentiality is decided at every stage, not only at the moment of typing the request.</text>
</svg>
