<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Balance of AI and human effort across the life cycle</title>
  <desc>Stacked bars for eight stages. AI share is small for request and plan, largest for gather, draft and review, zero for approve, small for distribute and maintain. Human share is the remainder.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Who does the work at each stage</text>
  <rect x="70" y="110" width="80" height="288" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <rect x="70" y="398" width="80" height="32" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="110" y="454" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Request</text>
  <rect x="175" y="110" width="80" height="256" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <rect x="175" y="366" width="80" height="64" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="215" y="454" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Plan</text>
  <rect x="280" y="110" width="80" height="160" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <rect x="280" y="270" width="80" height="160" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="320" y="454" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Gather</text>
  <rect x="385" y="110" width="80" height="128" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <rect x="385" y="238" width="80" height="192" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="425" y="454" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Draft</text>
  <rect x="490" y="110" width="80" height="192" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <rect x="490" y="302" width="80" height="128" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="530" y="454" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Review</text>
  <rect x="595" y="110" width="80" height="320" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <text x="635" y="454" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Approve</text>
  <rect x="700" y="110" width="80" height="240" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <rect x="700" y="350" width="80" height="80" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="740" y="454" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Distribute</text>
  <rect x="805" y="110" width="80" height="224" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <rect x="805" y="334" width="80" height="96" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="845" y="454" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Maintain</text>
  <line x1="60" y1="430" x2="920" y2="430" stroke="#222222" stroke-width="2.5"/>
  <rect x="250" y="476" width="22" height="22" fill="#1F3B5C"/>
  <text x="282" y="493" text-anchor="start" font-size="15" fill="#111111">human effort</text>
  <rect x="500" y="476" width="22" height="22" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
  <text x="532" y="493" text-anchor="start" font-size="15" fill="#111111">AI contribution</text>
  <text x="480" y="540" text-anchor="middle" font-size="13" fill="#333333">Schematic shares for a typical AI-assisted workflow; not measured values.</text>
</svg>
