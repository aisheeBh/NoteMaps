<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Direct formatting compared with styles</title>
  <desc>Left: a page where headings are bold enlarged text, so the navigation pane is empty. Right: the same page with heading styles, so the navigation pane lists the headings and a table of contents can be generated.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Looks the same; works differently</text>
  <rect x="40" y="70" width="420" height="40" rx="6" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="250" y="96" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Direct formatting</text>
  <rect x="40" y="120" width="140" height="330" fill="#F2F2F2" stroke="#666666" stroke-width="1"/>
  <text x="110" y="142" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Navigation pane</text>
  <rect x="190" y="120" width="270" height="330" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="205" y="158" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Summary</text>
  <text x="420" y="158" text-anchor="end" font-size="13" font-style="italic" fill="#333333">bold 16pt</text>
  <line x1="205" y1="178" x2="440" y2="178" stroke="#BBBBBB" stroke-width="5"/>
  <line x1="205" y1="196" x2="410" y2="196" stroke="#BBBBBB" stroke-width="5"/>
  <line x1="205" y1="214" x2="380" y2="214" stroke="#BBBBBB" stroke-width="5"/>
  <text x="205" y="258" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Findings</text>
  <text x="420" y="258" text-anchor="end" font-size="13" font-style="italic" fill="#333333">bold 16pt</text>
  <line x1="205" y1="278" x2="440" y2="278" stroke="#BBBBBB" stroke-width="5"/>
  <line x1="205" y1="296" x2="410" y2="296" stroke="#BBBBBB" stroke-width="5"/>
  <line x1="205" y1="314" x2="380" y2="314" stroke="#BBBBBB" stroke-width="5"/>
  <text x="205" y="358" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Risks</text>
  <text x="420" y="358" text-anchor="end" font-size="13" font-style="italic" fill="#333333">bold 16pt</text>
  <line x1="205" y1="378" x2="440" y2="378" stroke="#BBBBBB" stroke-width="5"/>
  <line x1="205" y1="396" x2="410" y2="396" stroke="#BBBBBB" stroke-width="5"/>
  <line x1="205" y1="414" x2="380" y2="414" stroke="#BBBBBB" stroke-width="5"/>
  <text x="110" y="280" text-anchor="middle" font-size="14" font-style="italic" fill="#111111">(empty)</text>
  <rect x="500" y="70" width="420" height="40" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="710" y="96" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Heading styles</text>
  <rect x="500" y="120" width="140" height="330" fill="#F2F2F2" stroke="#666666" stroke-width="1"/>
  <text x="570" y="142" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Navigation pane</text>
  <rect x="650" y="120" width="270" height="330" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="665" y="158" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Summary</text>
  <text x="880" y="158" text-anchor="end" font-size="13" font-style="italic" fill="#333333">Heading 1</text>
  <line x1="665" y1="178" x2="900" y2="178" stroke="#BBBBBB" stroke-width="5"/>
  <line x1="665" y1="196" x2="870" y2="196" stroke="#BBBBBB" stroke-width="5"/>
  <line x1="665" y1="214" x2="840" y2="214" stroke="#BBBBBB" stroke-width="5"/>
  <text x="515" y="170" text-anchor="start" font-size="14" fill="#111111">› Summary</text>
  <text x="665" y="258" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Findings</text>
  <text x="880" y="258" text-anchor="end" font-size="13" font-style="italic" fill="#333333">Heading 1</text>
  <line x1="665" y1="278" x2="900" y2="278" stroke="#BBBBBB" stroke-width="5"/>
  <line x1="665" y1="296" x2="870" y2="296" stroke="#BBBBBB" stroke-width="5"/>
  <line x1="665" y1="314" x2="840" y2="314" stroke="#BBBBBB" stroke-width="5"/>
  <text x="515" y="270" text-anchor="start" font-size="14" fill="#111111">› Findings</text>
  <text x="665" y="358" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Risks</text>
  <text x="880" y="358" text-anchor="end" font-size="13" font-style="italic" fill="#333333">Heading 1</text>
  <line x1="665" y1="378" x2="900" y2="378" stroke="#BBBBBB" stroke-width="5"/>
  <line x1="665" y1="396" x2="870" y2="396" stroke="#BBBBBB" stroke-width="5"/>
  <line x1="665" y1="414" x2="840" y2="414" stroke="#BBBBBB" stroke-width="5"/>
  <text x="515" y="370" text-anchor="start" font-size="14" fill="#111111">› Risks</text>
  <rect x="40" y="470" width="420" height="60" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="48" y="476" width="404" height="46" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
  <text x="250" y="495" text-anchor="middle" font-size="14" fill="#111111">No navigation, no table of contents,</text>
  <text x="250" y="513" text-anchor="middle" font-size="14" fill="#111111">invisible to screen readers</text>
  <rect x="500" y="470" width="420" height="60" rx="6" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="508" y="476" width="404" height="46" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/>
  <text x="710" y="495" text-anchor="middle" font-size="14" fill="#111111">Navigable, automatic table of contents,</text>
  <text x="710" y="513" text-anchor="middle" font-size="14" fill="#111111">announced by screen readers</text>
</svg>
