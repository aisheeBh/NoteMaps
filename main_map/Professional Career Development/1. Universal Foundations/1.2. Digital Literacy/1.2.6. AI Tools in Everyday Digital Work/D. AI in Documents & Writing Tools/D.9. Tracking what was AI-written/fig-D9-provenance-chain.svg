<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>A provenance chain</title>
  <desc>Five linked stages for one section: sources supplied, AI draft, author revision, fact check, approval, each with what is recorded.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Provenance chain for one section</text>
  <rect x="30" y="140" width="166" height="170" rx="6" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="113" y="209" text-anchor="middle" font-size="17" font-weight="bold" fill="#222222">Sources</text>
  <text x="113" y="237" text-anchor="middle" font-size="14" fill="#222222">Dataset and two</text>
  <text x="113" y="255" text-anchor="middle" font-size="14" fill="#222222">reports supplied</text>
  <line x1="196" y1="225" x2="216" y2="225" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="216" y="140" width="166" height="170" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="224" y="187" width="150" height="74" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="299" y="209" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">AI draft</text>
  <text x="299" y="237" text-anchor="middle" font-size="14" fill="#111111">Tool and date</text>
  <text x="299" y="255" text-anchor="middle" font-size="14" fill="#111111">recorded; v0.3</text>
  <line x1="382" y1="225" x2="402" y2="225" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="402" y="140" width="166" height="170" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="485" y="209" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Author revision</text>
  <text x="485" y="237" text-anchor="middle" font-size="14" fill="#111111">Tracked changes;</text>
  <text x="485" y="255" text-anchor="middle" font-size="14" fill="#111111">v0.4</text>
  <line x1="568" y1="225" x2="588" y2="225" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="588" y="140" width="166" height="170" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="596" y="178" width="150" height="92" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="671" y="200" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Fact check</text>
  <text x="671" y="227" text-anchor="middle" font-size="14" fill="#111111">Figures</text>
  <text x="671" y="246" text-anchor="middle" font-size="14" fill="#111111">recalculated by a</text>
  <text x="671" y="264" text-anchor="middle" font-size="14" fill="#111111">second analyst</text>
  <line x1="754" y1="225" x2="774" y2="225" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="774" y="140" width="166" height="170" rx="6" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="782" y="196" width="150" height="55" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/>
  <text x="857" y="218" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Approval</text>
  <text x="857" y="246" text-anchor="middle" font-size="14" fill="#111111">Signed off by lead</text>
  <rect x="30" y="360" width="900" height="90" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="480" y="399" text-anchor="middle" font-size="16" fill="#111111">Each link answers a later question: where did this come from, who changed it,</text>
  <text x="480" y="420" text-anchor="middle" font-size="16" fill="#111111">who checked it, and who stood behind it?</text>
  <text x="480" y="500" text-anchor="middle" font-size="13" fill="#333333">Illustrative example.</text>
</svg>
