  <rect x="769" y="335" width="16" height="16" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <circle cx="80" cy="505" r="8" fill="#1F3B5C"/>
  <text x="96" y="510" text-anchor="start" font-size="15" fill="#111111">writers from group 1</text>
  <rect x="352" y="497" width="16" height="16" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="378" y="510" text-anchor="start" font-size="15" fill="#111111">writers from group 2</text>
  <text x="480" y="545" text-anchor="middle" font-size="13" fill="#333333">Schematic, after the direction of findings in the 2024 and 2025 studies described in the text; points are not data.</text>
</svg>
