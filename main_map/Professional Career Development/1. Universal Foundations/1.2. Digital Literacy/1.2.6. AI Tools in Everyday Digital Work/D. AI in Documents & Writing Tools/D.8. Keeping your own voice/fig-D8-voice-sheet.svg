<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>A personal voice sheet</title>
  <desc>An example voice sheet listing adjectives, preferred and avoided words, sentence habits, openings and closings, and a sample line.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Voice sheet (example)</text>
  <rect x="60" y="70" width="840" height="500" rx="4" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <rect x="80" y="90" width="250" height="48" rx="2" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="205" y="119" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Voice in three words</text>
  <rect x="340" y="90" width="540" height="48" rx="2" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="352" y="118" text-anchor="start" font-size="15" fill="#111111">Direct, concrete, dry</text>
  <rect x="80" y="148" width="250" height="48" rx="2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="88" y="157" width="234" height="29" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="205" y="177" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Prefer</text>
  <rect x="340" y="148" width="540" height="48" rx="2" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="352" y="176" text-anchor="start" font-size="15" fill="#111111">use, start, problem, about, I think</text>
  <rect x="80" y="206" width="250" height="48" rx="2" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="205" y="235" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Avoid</text>
  <rect x="340" y="206" width="540" height="48" rx="2" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="352" y="234" text-anchor="start" font-size="15" fill="#111111">leverage, robust, exciting, delve, going forward</text>
  <rect x="80" y="264" width="250" height="48" rx="2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="88" y="273" width="234" height="29" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="205" y="293" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Sentences</text>
  <rect x="340" y="264" width="540" height="48" rx="2" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="352" y="292" text-anchor="start" font-size="15" fill="#111111">Mostly short; one idea each; occasional fragment</text>
  <rect x="80" y="322" width="250" height="48" rx="2" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="205" y="351" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Openings</text>
  <rect x="340" y="322" width="540" height="48" rx="2" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="352" y="350" text-anchor="start" font-size="15" fill="#111111">Straight to the point; no greeting paragraph</text>
  <rect x="80" y="380" width="250" height="48" rx="2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="88" y="389" width="234" height="29" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="205" y="409" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Closings</text>
  <rect x="340" y="380" width="540" height="48" rx="2" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="352" y="408" text-anchor="start" font-size="15" fill="#111111">A question or a clear next step; no stock sign-off</text>
  <rect x="80" y="438" width="250" height="48" rx="2" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="205" y="467" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Spelling</text>
  <rect x="340" y="438" width="540" height="48" rx="2" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="352" y="466" text-anchor="start" font-size="15" fill="#111111">British; numbers as figures</text>
  <rect x="80" y="496" width="250" height="48" rx="2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="88" y="505" width="234" height="29" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="205" y="525" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Sample line</text>
  <rect x="340" y="496" width="540" height="48" rx="2" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="352" y="524" text-anchor="start" font-size="15" fill="#111111">"Two weeks late, but intact."</text>
  <text x="480" y="590" text-anchor="middle" font-size="13" fill="#333333">Illustrative example.</text>
</svg>
