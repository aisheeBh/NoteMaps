<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Reliability of AI review across error types</title>
  <desc>Schematic ranking: high for spelling, grammar and term consistency; moderate for clarity and internal contradictions; low for real-world facts, names in templates, domain correctness and what is missing.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">What AI review catches, and what it misses</text>
  <text x="310" y="92" text-anchor="end" font-size="15" fill="#111111">Spelling and punctuation</text>
  <rect x="320" y="74" width="360" height="37" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <text x="690" y="98" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">high</text>
  <text x="310" y="147" text-anchor="end" font-size="15" fill="#111111">Grammar</text>
  <rect x="320" y="129" width="340" height="37" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <text x="670" y="152" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">high</text>
  <text x="310" y="202" text-anchor="end" font-size="15" fill="#111111">Consistency of terms</text>
  <rect x="320" y="184" width="300" height="37" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <text x="630" y="208" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">high</text>
  <text x="310" y="257" text-anchor="end" font-size="15" fill="#111111">Clarity and wordiness</text>
  <rect x="320" y="239" width="260" height="37" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="590" y="262" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">moderate</text>
  <text x="310" y="312" text-anchor="end" font-size="15" fill="#111111">Internal contradictions</text>
  <rect x="320" y="294" width="200" height="37" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="530" y="318" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">moderate, if asked</text>
  <text x="310" y="367" text-anchor="end" font-size="15" fill="#111111">Real-word errors in context</text>
  <rect x="320" y="349" width="160" height="37" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="490" y="372" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">low to moderate</text>
  <text x="310" y="422" text-anchor="end" font-size="15" fill="#111111">Names in reused templates</text>
  <rect x="320" y="404" width="60" height="37" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="390" y="428" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">low</text>
  <text x="310" y="477" text-anchor="end" font-size="15" fill="#111111">Real-world facts</text>
  <rect x="320" y="459" width="80" height="37" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="410" y="482" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">low</text>
  <text x="310" y="532" text-anchor="end" font-size="15" fill="#111111">What is missing</text>
  <rect x="320" y="514" width="60" height="37" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="390" y="538" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">low, unless asked</text>
  <text x="480" y="590" text-anchor="middle" font-size="13" fill="#333333">Schematic; not plotted from a single dataset.</text>
</svg>
