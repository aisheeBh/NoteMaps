<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Framing and AI feedback</title>
  <desc>Schematic bars showing feedback on the same text becoming more positive when the user says they wrote it or like it, and more critical when asked to act as a sceptical reviewer.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Same text, different framing, different verdict</text>
  <text x="560" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Share of feedback that is positive</text>
  <text x="410" y="122" text-anchor="end" font-size="15" fill="#111111">"I wrote this and I'm pleased with it"</text>
  <rect x="420" y="104" width="340" height="72" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <text x="770" y="145" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">mostly praise</text>
  <text x="410" y="212" text-anchor="end" font-size="15" fill="#111111">"Please review this" (neutral)</text>
  <rect x="420" y="194" width="220" height="72" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="650" y="235" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">mixed</text>
  <text x="410" y="302" text-anchor="end" font-size="15" fill="#111111">"Act as a sceptical reviewer; list problems"</text>
  <rect x="420" y="284" width="80" height="72" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="510" y="325" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">mostly critique</text>
  <text x="480" y="405" text-anchor="middle" font-size="13" fill="#333333">Schematic, after the direction of findings reported by Sharma and colleagues (2023); not their data.</text>
</svg>
