<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The parts of a well-formed action point</title>
  <desc>An action card with a central action statement surrounded by owner, due date, done-criterion, condition, source and obligation strength, with an example for each.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Anatomy of an action point</text>
  <rect x="300" y="230" width="360" height="120" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="480" y="282" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">WHAT: the action</text>
  <text x="480" y="311" text-anchor="middle" font-size="16" fill="#FFFFFF">Reconcile the supplier ledger</text>
  <rect x="40" y="90" width="240" height="110" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="160" y="138" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">OWNER</text>
  <text x="160" y="164" text-anchor="middle" font-size="14" fill="#111111">Head of Accounts Payable</text>
  <rect x="360" y="80" width="240" height="110" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="480" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">WHEN</text>
  <text x="480" y="154" text-anchor="middle" font-size="14" fill="#111111">By 31 December</text>
  <rect x="680" y="90" width="240" height="110" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="800" y="129" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">DONE-CRITERION</text>
  <text x="800" y="155" text-anchor="middle" font-size="14" fill="#111111">Differences over £500</text>
  <text x="800" y="173" text-anchor="middle" font-size="14" fill="#111111">investigated and documented</text>
  <rect x="40" y="420" width="240" height="110" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="48" y="438" width="224" height="72" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="160" y="459" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">CONDITION</text>
  <text x="160" y="485" text-anchor="middle" font-size="14" fill="#111111">After the new system goes</text>
  <text x="160" y="503" text-anchor="middle" font-size="14" fill="#111111">live</text>
  <rect x="360" y="440" width="240" height="110" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="368" y="467" width="224" height="54" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="480" y="488" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">SOURCE</text>
  <text x="480" y="514" text-anchor="middle" font-size="14" fill="#111111">Finding 4.2, page 17, quoted</text>
  <rect x="680" y="420" width="240" height="110" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="800" y="459" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">STRENGTH</text>
  <text x="800" y="485" text-anchor="middle" font-size="14" fill="#111111">Mandatory: management</text>
  <text x="800" y="503" text-anchor="middle" font-size="14" fill="#111111">response accepted</text>
  <line x1="280" y1="170" x2="320" y2="230" stroke="#222222" stroke-width="2"/>
  <line x1="480" y1="190" x2="480" y2="230" stroke="#222222" stroke-width="2"/>
  <line x1="680" y1="170" x2="640" y2="230" stroke="#222222" stroke-width="2"/>
  <line x1="280" y1="440" x2="320" y2="350" stroke="#222222" stroke-width="2"/>
  <line x1="480" y1="440" x2="480" y2="350" stroke="#222222" stroke-width="2"/>
  <line x1="680" y1="440" x2="640" y2="350" stroke="#222222" stroke-width="2"/>
  <text x="480" y="585" text-anchor="middle" font-size="13" fill="#333333">A blank field is shown as NOT STATED and resolved by a person, never filled in by the tool.</text>
</svg>
