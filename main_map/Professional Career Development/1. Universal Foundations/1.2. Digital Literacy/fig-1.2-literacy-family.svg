<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>The family of literacies behind digital literacy</title>
<desc>Three overlapping circles - computer literacy, information literacy and media literacy - whose shared centre is digital literacy, with data literacy and AI literacy as later extensions.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">The literacies that converge in digital literacy</text>
<circle cx="360" cy="250" r="160" fill="url(#hatch)" fill-opacity="0.55" stroke="#1F3B5C" stroke-width="3"/>
<circle cx="600" cy="250" r="160" fill="url(#dots)" fill-opacity="0.55" stroke="#7A5200" stroke-width="2.5" stroke-dasharray="10 6"/>
<circle cx="480" cy="420" r="160" fill="url(#cross)" fill-opacity="0.55" stroke="#1E5E24" stroke-width="2.5" stroke-dasharray="2 4"/>
<rect x="215" y="172" width="170" height="72" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
<text x="300" y="190" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">COMPUTER / ICT</text>
<text x="300" y="210" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">operating devices</text>
<text x="300" y="230" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">and software</text>
<rect x="575" y="172" width="170" height="72" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
<text x="660" y="190" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">INFORMATION</text>
<text x="660" y="210" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">finding, judging,</text>
<text x="660" y="230" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">using information</text>
<rect x="380" y="482" width="200" height="72" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
<text x="480" y="500" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">MEDIA</text>
<text x="480" y="520" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">understanding messages,</text>
<text x="480" y="540" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">producers and influence</text>
<rect x="390" y="290" width="180" height="56" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
<text x="480" y="314" font-size="18" text-anchor="middle" font-weight="bold" fill="#FFFFFF">DIGITAL</text>
<text x="480" y="336" font-size="18" text-anchor="middle" font-weight="bold" fill="#FFFFFF">LITERACY</text>
<rect x="760" y="420" width="176" height="120" fill="#F2F2F2" stroke="#333333" stroke-width="1.5"/>
<text x="848" y="446" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Later extensions</text>
<text x="848" y="474" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">data literacy</text>
<text x="848" y="500" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">AI literacy</text>
<text x="848" y="526" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">(2010s onward)</text>
<line x1="760" y1="480" x2="600" y2="380" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="420" width="176" height="120" fill="#F2F2F2" stroke="#333333" stroke-width="1.5"/>
<text x="112" y="446" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Roots</text>
<text x="112" y="474" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">computer literacy 1980s</text>
<text x="112" y="500" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">information literacy 1974</text>
<text x="112" y="526" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">media literacy 1930s on</text>
<text x="480" y="590" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">Schematic: the overlaps are conceptual, not measured.</text>
</svg>
