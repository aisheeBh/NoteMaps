<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Half-splitting a chain of components</title>
  <desc>A chain of eight components carries sound from a meeting application to a person's ears. Test 1 at the middle shows the fault lies in the second half. Test 2 splits that half and shows the fault in its first part. Test 3 isolates the faulty component, the Bluetooth link, in three tests instead of up to seven.</desc>
  <defs>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Finding a fault by halving the search</text>
  <g font-size="13" fill="#111111" text-anchor="middle">
    <rect x="30" y="80" width="100" height="56" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="2"/><text x="80" y="104">Meeting</text><text x="80" y="122">app</text>
    <rect x="145" y="80" width="100" height="56" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="2"/><text x="195" y="104">App audio</text><text x="195" y="122">settings</text>
    <rect x="260" y="80" width="100" height="56" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="2"/><text x="310" y="104">System</text><text x="310" y="122">sound</text>
    <rect x="375" y="80" width="100" height="56" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="2"/><text x="425" y="104">Audio</text><text x="425" y="122">driver</text>
    <rect x="490" y="80" width="100" height="56" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="2"/><text x="540" y="104">Bluetooth</text><text x="540" y="122">radio</text>
    <rect x="605" y="80" width="100" height="56" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="3" stroke-dasharray="3 3"/><rect x="612" y="92" width="86" height="34" fill="#FFFFFF"/><text x="655" y="106">Bluetooth</text><text x="655" y="121">pairing</text>
    <rect x="720" y="80" width="100" height="56" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="2"/><text x="770" y="104">Headset</text><text x="770" y="122">battery</text>
    <rect x="835" y="80" width="100" height="56" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="2"/><text x="885" y="104">Headset</text><text x="885" y="122">speakers</text>
  </g>
  <g stroke="#222222" stroke-width="2">
    <line x1="130" y1="108" x2="145" y2="108"/><line x1="245" y1="108" x2="260" y2="108"/><line x1="360" y1="108" x2="375" y2="108"/><line x1="475" y1="108" x2="490" y2="108"/><line x1="590" y1="108" x2="605" y2="108"/><line x1="705" y1="108" x2="720" y2="108"/><line x1="820" y1="108" x2="835" y2="108"/>
  </g>

  <!-- test 1 -->
  <line x1="482" y1="142" x2="482" y2="200" stroke="#1F3B5C" stroke-width="3"/>
  <rect x="30" y="205" width="905" height="70" rx="6" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="45" y="232" font-size="16" font-weight="bold" fill="#111111">Test 1 (middle): does sound play through the laptop's own speakers?</text>
  <text x="45" y="258" font-size="15" fill="#111111">Yes → the first half works; the fault is in the right-hand half.</text>

  <!-- test 2 -->
  <line x1="712" y1="142" x2="712" y2="200" stroke="#1F3B5C" stroke-width="3" stroke-dasharray="10 6"/>
  <rect x="30" y="305" width="905" height="70" rx="6" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="45" y="332" font-size="16" font-weight="bold" fill="#111111">Test 2: does the headset work with another device?</text>
  <text x="45" y="358" font-size="15" fill="#111111">Yes → headset battery and speakers are fine; the fault is in the Bluetooth radio or pairing.</text>

  <!-- test 3 -->
  <line x1="597" y1="142" x2="597" y2="200" stroke="#1F3B5C" stroke-width="3" stroke-dasharray="2 4"/>
  <rect x="30" y="405" width="905" height="70" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="45" y="432" font-size="16" font-weight="bold" fill="#111111">Test 3: do other Bluetooth devices work with the laptop?</text>
  <text x="45" y="458" font-size="15" fill="#111111">Yes → the radio works; the pairing is faulty. Remove and re-pair the headset.</text>

  <g font-size="14" font-weight="bold" fill="#111111" text-anchor="middle"><text x="470" y="170">T1</text><text x="723" y="170">T2</text><text x="609" y="170">T3</text></g>
  <text x="480" y="515" text-anchor="middle" font-size="16" fill="#111111">Eight components, three tests: about log₂(8) = 3.</text>
</svg>
