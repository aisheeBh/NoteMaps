<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Checking from the physical layer upwards</title>
  <desc>A stack of six layers with example checks, read from bottom to top: physical (power, cables, lights), device and driver (is the device recognised), operating system (settings, updates, space), network (connected, to what), application (settings, version, account in the app), user and account (permissions, password, licence). An arrow shows the order of checking, upward from physical.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Troubleshooting by layers</text>
  <g font-size="16">
    <rect x="160" y="70" width="700" height="62" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
    <text x="180" y="98" font-weight="bold" fill="#111111">6. User and account</text><text x="180" y="120" font-size="14" fill="#111111">permissions, password expiry, licence, multi-factor prompt</text>
    <rect x="160" y="140" width="700" height="62" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
    <text x="180" y="168" font-weight="bold" fill="#111111">5. Application</text><text x="180" y="190" font-size="14" fill="#111111">app settings, version, sign-in within the app, cache</text>
    <rect x="160" y="210" width="700" height="62" fill="#F2F2F2" stroke="#333333" stroke-width="2"/>
    <text x="180" y="238" font-weight="bold" fill="#111111">4. Network</text><text x="180" y="260" font-size="14" fill="#111111">connected? to the right network? other sites and devices working?</text>
    <rect x="160" y="280" width="700" height="62" fill="#F2F2F2" stroke="#333333" stroke-width="2"/>
    <text x="180" y="308" font-weight="bold" fill="#111111">3. Operating system</text><text x="180" y="330" font-size="14" fill="#111111">settings, pending updates, free storage, airplane mode</text>
    <rect x="160" y="350" width="700" height="62" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
    <text x="180" y="378" font-weight="bold" fill="#111111">2. Device and driver</text><text x="180" y="400" font-size="14" fill="#111111">is the device detected and enabled? driver loaded?</text>
    <rect x="160" y="420" width="700" height="62" fill="#1F3B5C" stroke="#000000" stroke-width="2.5"/>
    <text x="180" y="448" font-weight="bold" fill="#FFFFFF">1. Physical</text><text x="180" y="470" font-size="14" fill="#FFFFFF">power, cables firmly in, switches, indicator lights, right port</text>
  </g>
  <line x1="100" y1="480" x2="100" y2="80" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="80" y="280" text-anchor="middle" font-size="15" fill="#111111" transform="rotate(-90 80 280)">check in this order</text>
  <text x="510" y="520" text-anchor="middle" font-size="15" fill="#111111">Cheap, quick checks at the bottom rule out the commonest causes first.</text>
</svg>
