<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Annual footprint of a laptop by years kept</title>
  <desc>Stacked bars for a laptop kept 2, 3, 4, 5 and 6 years, assuming 300 kilograms of embodied emissions and 20 kilograms per year from use. The embodied share per year falls from 150 to 50 kilograms while the use share stays at 20, so totals fall from 170 to 120, 95, 80 and 70 kilograms a year.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Keep it longer, spread the manufacturing footprint</text>
  <!-- scale: 2 px per kg; baseline 450 -->
  <line x1="120" y1="450" x2="820" y2="450" stroke="#222222" stroke-width="2.5"/>
  <line x1="120" y1="450" x2="120" y2="90" stroke="#222222" stroke-width="2.5"/>
  <g font-size="14" fill="#111111" text-anchor="end"><text x="112" y="454">0</text><text x="112" y="354">50</text><text x="112" y="254">100</text><text x="112" y="154">150</text></g>
  <g stroke="#BBBBBB" stroke-dasharray="3 4"><line x1="120" y1="350" x2="820" y2="350"/><line x1="120" y1="250" x2="820" y2="250"/><line x1="120" y1="150" x2="820" y2="150"/></g>
  <text x="62" y="270" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 62 270)">kg CO₂e per year</text>

  <!-- bars: use (20kg=40px) bottom dots; embodied above hatch -->
  <g stroke-width="2">
    <rect x="160" y="410" width="90" height="40" fill="url(#dots)" stroke="#7A5200"/><rect x="160" y="110" width="90" height="300" fill="url(#hatch)" stroke="#1F3B5C"/>
    <rect x="290" y="410" width="90" height="40" fill="url(#dots)" stroke="#7A5200"/><rect x="290" y="210" width="90" height="200" fill="url(#hatch)" stroke="#1F3B5C"/>
    <rect x="420" y="410" width="90" height="40" fill="url(#dots)" stroke="#7A5200"/><rect x="420" y="260" width="90" height="150" fill="url(#hatch)" stroke="#1F3B5C"/>
    <rect x="550" y="410" width="90" height="40" fill="url(#dots)" stroke="#7A5200"/><rect x="550" y="290" width="90" height="120" fill="url(#hatch)" stroke="#1F3B5C"/>
    <rect x="680" y="410" width="90" height="40" fill="url(#dots)" stroke="#7A5200"/><rect x="680" y="310" width="90" height="100" fill="url(#hatch)" stroke="#1F3B5C"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">
    <text x="205" y="100">170</text><text x="335" y="200">120</text><text x="465" y="250">95</text><text x="595" y="280">80</text><text x="725" y="300">70</text>
  </g>
  <g font-size="15" fill="#111111" text-anchor="middle">
    <text x="205" y="475">2 years</text><text x="335" y="475">3 years</text><text x="465" y="475">4 years</text><text x="595" y="475">5 years</text><text x="725" y="475">6 years</text>
  </g>
  <!-- legend with patterns and words -->
  <rect x="610" y="90" width="26" height="20" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="644" y="106" font-size="15" fill="#111111">manufacturing share per year</text>
  <rect x="610" y="122" width="26" height="20" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
  <text x="644" y="138" font-size="15" fill="#111111">use (electricity) per year</text>
  <text x="920" y="530" text-anchor="end" font-size="13" fill="#111111">Illustrative: 300 kg embodied, 20 kg a year in use; real figures vary by model and electricity grid.</text>
</svg>
