<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The life of an accessory</title>
  <desc>Six stages arranged in a loop: choose from an approved catalogue; tag and record; issue to a desk or person; maintain with cleaning and firmware updates; return when a person leaves or the desk changes; then either redeploy back to issue, or recycle through the supplier at end of life.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Accessories: choose, record, use, reuse, recycle</text>
  <g font-size="15" fill="#111111" text-anchor="middle">
    <rect x="60" y="90" width="230" height="80" rx="10" fill="#1F3B5C" stroke="#000000" stroke-width="2.5"/>
    <text x="175" y="125" font-weight="bold" fill="#FFFFFF">1. Choose</text><text x="175" y="148" fill="#FFFFFF">approved, open standards</text>
    <rect x="365" y="90" width="230" height="80" rx="10" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
    <text x="480" y="125" font-weight="bold">2. Tag and record</text><text x="480" y="148">owner, location, warranty</text>
    <rect x="670" y="90" width="230" height="80" rx="10" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
    <text x="785" y="125" font-weight="bold">3. Issue</text><text x="785" y="148">to a desk or a person</text>
    <rect x="670" y="290" width="230" height="80" rx="10" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
    <text x="785" y="325" font-weight="bold">4. Maintain</text><text x="785" y="348">clean, update firmware</text>
    <rect x="365" y="290" width="230" height="80" rx="10" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
    <text x="480" y="325" font-weight="bold">5. Return</text><text x="480" y="348">leaver or desk change</text>
    <rect x="60" y="290" width="230" height="80" rx="10" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
    <rect x="80" y="303" width="190" height="54" fill="#FFFFFF"/>
    <text x="175" y="325" font-weight="bold">6. Recycle</text><text x="175" y="348">via supplier take-back</text>
  </g>
  <g stroke="#222222" stroke-width="2.5" fill="none">
    <line x1="292" y1="130" x2="361" y2="130" marker-end="url(#arrow)"/>
    <line x1="597" y1="130" x2="666" y2="130" marker-end="url(#arrow)"/>
    <line x1="785" y1="172" x2="785" y2="286" marker-end="url(#arrow)"/>
    <line x1="668" y1="330" x2="599" y2="330" marker-end="url(#arrow)"/>
    <line x1="363" y1="330" x2="294" y2="330" marker-end="url(#arrow)"/>
    <path d="M480 372 C 480 440, 700 440, 760 374" stroke-dasharray="10 6" marker-end="url(#arrow)"/>
  </g>
  <rect x="500" y="430" width="200" height="26" fill="#FFFFFF"/>
  <text x="600" y="448" text-anchor="middle" font-size="15" fill="#111111">redeploy if still good</text>
  <text x="480" y="500" text-anchor="middle" font-size="15" fill="#111111">Most accessories outlive the laptop they were bought with; reuse comes before recycling.</text>
</svg>
