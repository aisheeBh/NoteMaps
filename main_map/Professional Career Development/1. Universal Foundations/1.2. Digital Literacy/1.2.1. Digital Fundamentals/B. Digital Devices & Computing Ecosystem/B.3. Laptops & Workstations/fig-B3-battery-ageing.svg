<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Battery capacity fade with charge cycles</title>
  <desc>Three schematic curves of remaining battery capacity against charge cycles. Under cool, moderate use capacity declines slowly and stays above 80 percent for many cycles. Kept at full charge constantly, it declines faster. Kept hot, it declines fastest and crosses 80 percent early.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">How lithium-ion laptop batteries lose capacity</text>
  <line x1="120" y1="450" x2="760" y2="450" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="450" x2="120" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="440" y="495" text-anchor="middle" font-size="16" fill="#111111">Charge cycles and time in use</text>
  <text x="62" y="270" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 62 270)">Remaining capacity</text>
  <g font-size="14" fill="#111111" text-anchor="end"><text x="112" y="104">100%</text><text x="112" y="214">80%</text><text x="112" y="324">60%</text></g>
  <line x1="120" y1="210" x2="760" y2="210" stroke="#8B0000" stroke-width="1.5" stroke-dasharray="3 3"/>
  <rect x="128" y="218" width="250" height="22" fill="#FFFFFF"/>
  <text x="134" y="234" font-size="14" fill="#111111">common replacement threshold</text>

  <path d="M120 100 C 300 120, 500 160, 740 200" fill="none" stroke="#1E5E24" stroke-width="3.5"/>
  <path d="M120 100 C 280 140, 460 210, 740 270" fill="none" stroke="#1F3B5C" stroke-width="3.5" stroke-dasharray="10 6"/>
  <path d="M120 100 C 240 170, 400 280, 740 380" fill="none" stroke="#8B0000" stroke-width="3.5" stroke-dasharray="2 4"/>

  <g font-size="15" fill="#111111">
    <text x="770" y="196">cool, partial</text><text x="770" y="214">charging</text>
    <text x="770" y="266">kept at 100%</text><text x="770" y="284">all day</text>
    <text x="770" y="376">hot: vents</text><text x="770" y="394">blocked, car</text>
  </g>
  <text x="920" y="540" text-anchor="end" font-size="13" fill="#111111">Schematic; not plotted from a single dataset. Real rates vary with cell chemistry and design.</text>
</svg>
