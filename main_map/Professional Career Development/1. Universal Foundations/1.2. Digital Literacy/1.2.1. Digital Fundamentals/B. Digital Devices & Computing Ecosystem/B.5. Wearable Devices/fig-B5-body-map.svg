<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Where wearable devices are worn</title>
  <desc>A simple human figure with labels pointing to the head (smart glasses and XR headsets: cameras, displays, eye tracking), ears (hearables: microphones, motion), upper arm or abdomen skin (glucose monitors and cardiac patches), chest (safety badges and chest straps), wrist (smartwatches and fitness bands: motion, optical heart rate, ECG, GNSS), finger (smart rings and ring scanners), torso and back (exoskeletons and smart clothing).</desc>
  <text x="480" y="38" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Wearables around the body</text>
  <!-- figure -->
  <circle cx="480" cy="120" r="42" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <rect x="440" y="104" width="80" height="16" rx="6" fill="#1F3B5C"/>
  <rect x="434" y="118" width="10" height="18" rx="3" fill="#BCD5EE" stroke="#1F3B5C"/>
  <rect x="516" y="118" width="10" height="18" rx="3" fill="#BCD5EE" stroke="#1F3B5C"/>
  <path d="M430 170 L530 170 L555 360 L405 360 Z" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <line x1="430" y1="175" x2="360" y2="330" stroke="#111111" stroke-width="10" stroke-linecap="round"/>
  <line x1="530" y1="175" x2="600" y2="330" stroke="#111111" stroke-width="10" stroke-linecap="round"/>
  <line x1="450" y1="360" x2="440" y2="560" stroke="#111111" stroke-width="12" stroke-linecap="round"/>
  <line x1="510" y1="360" x2="520" y2="560" stroke="#111111" stroke-width="12" stroke-linecap="round"/>
  <rect x="587" y="292" width="26" height="22" rx="4" fill="#1F3B5C" stroke="#000000"/>
  <circle cx="358" cy="340" r="7" fill="#FFE6A8" stroke="#7A5200" stroke-width="2"/>
  <rect x="460" y="200" width="40" height="22" rx="4" fill="#D3ECD3" stroke="#1E5E24" stroke-width="2"/>
  <circle cx="437" cy="215" r="9" fill="#F6CACA" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="415" y="250" width="130" height="80" fill="none" stroke="#555555" stroke-width="2" stroke-dasharray="10 6"/>

  <g stroke="#333333" stroke-width="1.5">
    <line x1="520" y1="110" x2="640" y2="80"/>
    <line x1="434" y1="128" x2="330" y2="128"/>
    <line x1="437" y1="215" x2="330" y2="215"/>
    <line x1="500" y1="210" x2="640" y2="190"/>
    <line x1="613" y1="303" x2="660" y2="300"/>
    <line x1="358" y1="340" x2="330" y2="380"/>
    <line x1="545" y1="300" x2="560" y2="430"/>
  </g>
  <g font-size="15" fill="#111111">
    <text x="648" y="76" font-weight="bold">Smart glasses, XR headsets</text>
    <text x="648" y="96">cameras, displays, eye tracking</text>
    <text x="648" y="186" font-weight="bold">Chest: safety badges, straps</text>
    <text x="648" y="206">location, heart rate, gas alarms</text>
    <text x="668" y="296" font-weight="bold">Wrist: watches, bands</text>
    <text x="668" y="316">motion, optical heart rate,</text>
    <text x="668" y="336">ECG, SpO2, GNSS</text>
    <text x="570" y="440" font-weight="bold">Torso and back:</text>
    <text x="570" y="460">exoskeletons, smart clothing</text>
  </g>
  <g font-size="15" fill="#111111" text-anchor="end">
    <text x="322" y="124" font-weight="bold">Ears: hearables</text>
    <text x="322" y="144">microphones, motion</text>
    <text x="322" y="211" font-weight="bold">Skin: glucose monitors,</text>
    <text x="322" y="231">cardiac patches</text>
    <text x="322" y="384" font-weight="bold">Finger: smart rings,</text>
    <text x="322" y="404">ring scanners</text>
  </g>
</svg>
