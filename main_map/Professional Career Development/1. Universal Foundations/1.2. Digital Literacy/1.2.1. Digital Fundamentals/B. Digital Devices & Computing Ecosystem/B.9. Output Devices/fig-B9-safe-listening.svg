<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Safe weekly listening time by sound level</title>
  <desc>Bars show weekly safe listening time using a reference of 80 decibels for 40 hours, halving for each 3 decibel increase: 40 hours at 80 dB, 20 at 83, 10 at 86, 5 at 89, 2.5 at 92, 1.25 at 95, and about 20 minutes at 101 dB.</desc>
  <defs>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Louder means much less safe listening time</text>
  <line x1="120" y1="450" x2="900" y2="450" stroke="#222222" stroke-width="2.5"/>
  <line x1="120" y1="450" x2="120" y2="70" stroke="#222222" stroke-width="2.5"/>
  <text x="65" y="260" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 65 260)">Safe hours per week</text>
  <g font-size="14" fill="#111111" text-anchor="end"><text x="112" y="454">0</text><text x="112" y="364">10</text><text x="112" y="274">20</text><text x="112" y="184">30</text><text x="112" y="94">40</text></g>
  <!-- scale 9 px per hour: 40h=360 -->
  <rect x="150" y="90" width="70" height="360" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="255" y="270" width="70" height="180" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="360" y="360" width="70" height="90" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="465" y="405" width="70" height="45" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="570" y="427.5" width="70" height="22.5" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="675" y="439" width="70" height="11" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="780" y="447" width="70" height="3" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="185" y="82">40 h</text><text x="290" y="262">20 h</text><text x="395" y="352">10 h</text>
    <text x="500" y="397">5 h</text><text x="605" y="419">2.5 h</text><text x="710" y="431">1.25 h</text><text x="815" y="439">≈ 20 min</text>
  </g>
  <g font-size="15" fill="#111111" text-anchor="middle" font-weight="bold">
    <text x="185" y="475">80 dB</text><text x="290" y="475">83 dB</text><text x="395" y="475">86 dB</text>
    <text x="500" y="475">89 dB</text><text x="605" y="475">92 dB</text><text x="710" y="475">95 dB</text><text x="815" y="475">101 dB</text>
  </g>
  <text x="510" y="505" text-anchor="middle" font-size="15" fill="#111111">Sound level at the ear</text>
  <text x="920" y="530" text-anchor="end" font-size="13" fill="#111111">Calculated from 80 dB for 40 hours a week, halving per 3 dB; a rule of thumb, not a personal limit.</text>
</svg>
