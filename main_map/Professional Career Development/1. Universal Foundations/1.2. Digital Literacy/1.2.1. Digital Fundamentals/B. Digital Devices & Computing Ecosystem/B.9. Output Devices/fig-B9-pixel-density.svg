<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Low and high pixel density</title>
  <desc>Two enlarged views of the letter A drawn on pixel grids of the same physical size. On the left, a coarse grid of large square pixels gives a jagged, blocky letter, labelled about 80 pixels per inch. On the right, a fine grid with four times as many pixels gives a smoother letter, labelled about 160 pixels per inch.</desc>
  <text x="480" y="38" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Same area, more pixels: smoother text</text>
  <!-- coarse grid 8x8 cells of 40px -->
  <g transform="translate(90,80)">
    <rect width="320" height="320" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
    <g fill="#1F3B5C">
      <rect x="120" y="0" width="80" height="40"/>
      <rect x="80" y="40" width="40" height="40"/><rect x="200" y="40" width="40" height="40"/>
      <rect x="80" y="80" width="40" height="40"/><rect x="200" y="80" width="40" height="40"/>
      <rect x="40" y="120" width="40" height="40"/><rect x="240" y="120" width="40" height="40"/>
      <rect x="40" y="160" width="240" height="40"/>
      <rect x="40" y="200" width="40" height="40"/><rect x="240" y="200" width="40" height="40"/>
      <rect x="0" y="240" width="40" height="40"/><rect x="280" y="240" width="40" height="40"/>
      <rect x="0" y="280" width="40" height="40"/><rect x="280" y="280" width="40" height="40"/>
    </g>
    <g stroke="#BBBBBB" stroke-width="1">
      <path d="M40 0V320M80 0V320M120 0V320M160 0V320M200 0V320M240 0V320M280 0V320M0 40H320M0 80H320M0 120H320M0 160H320M0 200H320M0 240H320M0 280H320"/>
    </g>
  </g>
  <text x="250" y="440" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">≈ 80 PPI</text>
  <text x="250" y="465" text-anchor="middle" font-size="15" fill="#111111">27-inch Full HD: jagged edges</text>

  <!-- fine grid 16x16 cells of 20px -->
  <g transform="translate(550,80)">
    <rect width="320" height="320" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
    <g fill="#1F3B5C">
      <rect x="140" y="0" width="40" height="20"/>
      <rect x="120" y="20" width="80" height="20"/>
      <rect x="120" y="40" width="20" height="20"/><rect x="180" y="40" width="20" height="20"/>
      <rect x="100" y="60" width="20" height="40"/><rect x="200" y="60" width="20" height="40"/>
      <rect x="80" y="100" width="20" height="40"/><rect x="220" y="100" width="20" height="40"/>
      <rect x="60" y="140" width="20" height="20"/><rect x="240" y="140" width="20" height="20"/>
      <rect x="60" y="160" width="200" height="30"/>
      <rect x="40" y="190" width="20" height="50"/><rect x="260" y="190" width="20" height="50"/>
      <rect x="20" y="240" width="20" height="40"/><rect x="280" y="240" width="20" height="40"/>
      <rect x="0" y="280" width="20" height="40"/><rect x="300" y="280" width="20" height="40"/>
    </g>
    <g stroke="#DDDDDD" stroke-width="0.8">
      <path d="M20 0V320M40 0V320M60 0V320M80 0V320M100 0V320M120 0V320M140 0V320M160 0V320M180 0V320M200 0V320M220 0V320M240 0V320M260 0V320M280 0V320M300 0V320M0 20H320M0 40H320M0 60H320M0 80H320M0 100H320M0 120H320M0 140H320M0 160H320M0 180H320M0 200H320M0 220H320M0 240H320M0 260H320M0 280H320M0 300H320"/>
    </g>
  </g>
  <text x="710" y="440" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">≈ 160 PPI</text>
  <text x="710" y="465" text-anchor="middle" font-size="15" fill="#111111">27-inch 4K: smoother edges</text>
  <text x="920" y="505" text-anchor="end" font-size="13" fill="#111111">Schematic enlargement; real pixels are far smaller.</text>
</svg>
