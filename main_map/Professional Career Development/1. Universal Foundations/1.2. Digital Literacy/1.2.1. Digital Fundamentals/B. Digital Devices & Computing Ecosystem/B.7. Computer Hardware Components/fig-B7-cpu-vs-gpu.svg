<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>CPU cores compared with GPU cores</title>
  <desc>Left: a CPU drawn as eight large cores with a large shared cache, good at varied, step-by-step work. Right: a GPU drawn as a dense grid of many small cores, good at doing the same simple operation on many data items at once.</desc>
  <text x="480" y="38" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Few powerful cores or many simple ones</text>
  <!-- CPU -->
  <rect x="60" y="70" width="380" height="330" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <text x="250" y="100" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">CPU</text>
  <g fill="#1F3B5C" stroke="#000000" stroke-width="1.5">
    <rect x="85" y="115" width="75" height="75"/><rect x="170" y="115" width="75" height="75"/><rect x="255" y="115" width="75" height="75"/><rect x="340" y="115" width="75" height="75"/>
    <rect x="85" y="200" width="75" height="75"/><rect x="170" y="200" width="75" height="75"/><rect x="255" y="200" width="75" height="75"/><rect x="340" y="200" width="75" height="75"/>
  </g>
  <g font-size="14" fill="#FFFFFF" text-anchor="middle">
    <text x="122" y="157">core</text><text x="207" y="157">core</text><text x="292" y="157">core</text><text x="377" y="157">core</text>
    <text x="122" y="242">core</text><text x="207" y="242">core</text><text x="292" y="242">core</text><text x="377" y="242">core</text>
  </g>
  <rect x="85" y="290" width="330" height="90" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="250" y="342" text-anchor="middle" font-size="16" fill="#111111">large shared cache</text>
  <!-- GPU -->
  <rect x="520" y="70" width="380" height="330" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <text x="710" y="100" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">GPU</text>
  <g fill="#BCD5EE" stroke="#1F3B5C" stroke-width="1">
    <rect x="545" y="115" width="330" height="265" fill="#FFFFFF" stroke="none"/>
  </g>
  <g id="row" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="1">
    <rect x="545" y="115" width="16" height="16"/><rect x="566" y="115" width="16" height="16"/><rect x="587" y="115" width="16" height="16"/><rect x="608" y="115" width="16" height="16"/><rect x="629" y="115" width="16" height="16"/><rect x="650" y="115" width="16" height="16"/><rect x="671" y="115" width="16" height="16"/><rect x="692" y="115" width="16" height="16"/><rect x="713" y="115" width="16" height="16"/><rect x="734" y="115" width="16" height="16"/><rect x="755" y="115" width="16" height="16"/><rect x="776" y="115" width="16" height="16"/><rect x="797" y="115" width="16" height="16"/><rect x="818" y="115" width="16" height="16"/><rect x="839" y="115" width="16" height="16"/><rect x="860" y="115" width="15" height="16"/>
  </g>
  <use href="#row" y="21"/><use href="#row" y="42"/><use href="#row" y="63"/><use href="#row" y="84"/><use href="#row" y="105"/><use href="#row" y="126"/><use href="#row" y="147"/><use href="#row" y="168"/><use href="#row" y="189"/><use href="#row" y="210"/><use href="#row" y="231"/><use href="#row" y="252"/>
  <rect x="610" y="230" width="200" height="30" fill="#FFFFFF" stroke="#1F3B5C"/>
  <text x="710" y="251" text-anchor="middle" font-size="15" fill="#111111">thousands of small cores</text>

  <g font-size="15" fill="#111111" text-anchor="middle">
    <text x="250" y="435" font-weight="bold">Varied, step-by-step work</text>
    <text x="250" y="458">operating system, office apps, logic</text>
    <text x="710" y="435" font-weight="bold">Same operation on many data items</text>
    <text x="710" y="458">pixels, video, AI arithmetic</text>
  </g>
  <text x="920" y="505" text-anchor="end" font-size="13" fill="#111111">Schematic; core counts and areas not to scale.</text>
</svg>
