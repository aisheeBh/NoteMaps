<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The bathtub curve</title>
  <desc>Failure rate against device age. The classic bathtub curve starts high with early failures from manufacturing defects, falls to a low steady rate in mid-life, then rises as parts wear out. A second line shows the pattern often seen in field studies of disks, where failure rates rise steadily with age rather than staying flat.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">When storage devices fail</text>
  <line x1="120" y1="440" x2="860" y2="440" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="440" x2="120" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="490" y="480" text-anchor="middle" font-size="16" fill="#111111">Age of device</text>
  <text x="65" y="260" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 65 260)">Failure rate</text>

  <path d="M130 110 C 170 300, 230 360, 320 370 L 600 370 C 690 370, 760 300, 820 140" fill="none" stroke="#1F3B5C" stroke-width="3.5"/>
  <path d="M130 300 C 250 320, 400 300, 560 270 C 680 245, 760 210, 820 180" fill="none" stroke="#8B0000" stroke-width="3" stroke-dasharray="10 6"/>

  <g font-size="15" fill="#111111">
    <rect x="160" y="96" width="190" height="44" fill="#FFFFFF"/>
    <text x="170" y="114" font-weight="bold">early failures</text>
    <text x="170" y="133">manufacturing defects</text>
    <rect x="370" y="380" width="200" height="44" fill="#FFFFFF"/>
    <text x="380" y="398" font-weight="bold">useful life</text>
    <text x="380" y="417">low, steady random rate</text>
    <rect x="620" y="96" width="190" height="44" fill="#FFFFFF"/>
    <text x="630" y="114" font-weight="bold">wear-out</text>
    <text x="630" y="133">ageing parts fail</text>
    <rect x="430" y="176" width="250" height="44" fill="#FFFFFF"/>
    <text x="440" y="194">often seen in field data:</text>
    <text x="440" y="213">rates rise steadily with age</text>
  </g>
  <text x="920" y="525" text-anchor="end" font-size="13" fill="#111111">Schematic; not plotted from a single dataset.</text>
</svg>
