<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>False acceptance against false rejection</title>
  <desc>Error rate against decision threshold, from lenient to strict. The false acceptance rate falls as the threshold becomes stricter; the false rejection rate rises. The curves cross at the equal error rate. A strict setting suits payments; a lenient setting suits phone unlocking with a PIN fallback.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Biometric thresholds: two kinds of error</text>
  <line x1="130" y1="450" x2="820" y2="450" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="130" y1="450" x2="130" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="475" y="510" text-anchor="middle" font-size="16" fill="#111111">Decision threshold (lenient → strict)</text>
  <text x="75" y="265" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 75 265)">Error rate</text>
  <path d="M140 100 C 300 140, 380 380, 800 440" fill="none" stroke="#8B0000" stroke-width="3.5" stroke-dasharray="10 6"/>
  <path d="M140 440 C 560 380, 640 140, 800 100" fill="none" stroke="#1F3B5C" stroke-width="3.5"/>
  <circle cx="478" cy="330" r="9" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <rect x="408" y="346" width="140" height="26" fill="#FFFFFF"/>
  <text x="478" y="364" text-anchor="middle" font-size="14" fill="#111111">equal error rate</text>
  <rect x="150" y="70" width="230" height="26" fill="#FFFFFF"/>
  <text x="160" y="89" font-size="15" fill="#111111">false acceptance (impostors)</text>
  <rect x="600" y="70" width="230" height="26" fill="#FFFFFF"/>
  <text x="610" y="89" font-size="15" fill="#111111">false rejection (genuine users)</text>
  <line x1="300" y1="450" x2="300" y2="460" stroke="#222222" stroke-width="2"/>
  <text x="300" y="476" text-anchor="middle" font-size="14" fill="#111111">phone unlock</text>
  <line x1="700" y1="450" x2="700" y2="460" stroke="#222222" stroke-width="2"/>
  <text x="700" y="476" text-anchor="middle" font-size="14" fill="#111111">payment approval</text>
  <text x="920" y="540" text-anchor="end" font-size="13" fill="#111111">Schematic; not plotted from a single dataset.</text>
</svg>
