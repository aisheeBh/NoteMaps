<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Three eras of the information gateway</title>
  <desc>Three stacked horizontal bands along a timeline from 1993 to 2026: directory and portal era, 1993 to 2000, with Mosaic, Yahoo and AltaVista; search-and-browser era, 2000 to 2022, with PageRank, search advertising, Firefox, Chrome and smartphones; answer-and-agent era from 2023, with AI summaries, chat search and browsing agents. Each later era is drawn on top of the earlier ones.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Three eras of the information gateway</text>
  <line x1="80.0" y1="470.0" x2="900.0" y2="470.0" stroke="#111111" stroke-width="2"/>
  <line x1="80.0" y1="465.0" x2="80.0" y2="478.0" stroke="#111111" stroke-width="2"/>
  <text x="80.0" y="498.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">1993</text>
  <line x1="248.8" y1="465.0" x2="248.8" y2="478.0" stroke="#111111" stroke-width="2"/>
  <text x="248.8" y="498.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">2000</text>
  <line x1="441.8" y1="465.0" x2="441.8" y2="478.0" stroke="#111111" stroke-width="2"/>
  <text x="441.8" y="498.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">2008</text>
  <line x1="610.6" y1="465.0" x2="610.6" y2="478.0" stroke="#111111" stroke-width="2"/>
  <text x="610.6" y="498.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">2015</text>
  <line x1="803.5" y1="465.0" x2="803.5" y2="478.0" stroke="#111111" stroke-width="2"/>
  <text x="803.5" y="498.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">2023</text>
  <line x1="875.9" y1="465.0" x2="875.9" y2="478.0" stroke="#111111" stroke-width="2"/>
  <text x="875.9" y="498.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">2026</text>
  <rect x="80.0" y="330.0" width="820.0" height="90.0" rx="4" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <rect x="248.8" y="220.0" width="651.2" height="90.0" rx="4" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="803.5" y="110.0" width="96.5" height="90.0" rx="4" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <rect x="92.0" y="342" width="364.0" height="60" fill="#FFFFFF"/>
  <text x="102.0" y="368.0" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Directory and portal era</text>
  <text x="102.0" y="390.0" text-anchor="start" font-size="14" fill="#111111">browse categories; Mosaic, Yahoo, AltaVista</text>
  <rect x="260.8" y="232" width="420.0" height="60" fill="#FFFFFF"/>
  <text x="270.8" y="258.0" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Search-and-browser era</text>
  <text x="270.8" y="280.0" text-anchor="start" font-size="14" fill="#111111">query and ten links; PageRank, ads, Chrome, phones</text>
  <text x="791.5" y="150.0" text-anchor="end" font-size="17" font-weight="bold" fill="#111111">Answer and agent era</text>
  <text x="791.5" y="172.0" text-anchor="end" font-size="14" fill="#111111">AI summaries, chat search, browsing agents</text>
  <text x="851.8" y="162.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">AI</text>
  <text x="480.0" y="540.0" text-anchor="middle" font-size="13" fill="#333333">Each era adds a layer on top of the earlier ones rather than replacing them.</text>
</svg>
