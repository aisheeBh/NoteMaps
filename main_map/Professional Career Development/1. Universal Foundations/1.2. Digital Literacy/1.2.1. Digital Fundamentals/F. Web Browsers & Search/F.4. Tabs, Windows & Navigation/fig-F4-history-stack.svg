<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Session history truncation</title>
  <desc>Two rows of boxes. Before: Search, Judgment A, Judgment B with the pointer back on Search. After opening Judgment C from Search: Search, Judgment C; entries A and B are discarded from the tab history but remain in global history.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">A new navigation discards the forward entries</text>
  <text x="60.0" y="100.0" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Before: after pressing Back twice</text>
  <rect x="60.0" y="120.0" width="200.0" height="70.0" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="160.0" y="149.4" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Search</text>
  <text x="160.0" y="170.2" text-anchor="middle" font-size="16" fill="#FFFFFF">current</text>
  <rect x="300.0" y="120.0" width="200.0" height="70.0" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="400.0" y="149.4" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Judgment A</text>
  <text x="400.0" y="170.2" text-anchor="middle" font-size="16" fill="#000000">forward entry</text>
  <line x1="260.0" y1="155.0" x2="298.0" y2="155.0" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="540.0" y="120.0" width="200.0" height="70.0" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="640.0" y="149.4" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Judgment B</text>
  <text x="640.0" y="170.2" text-anchor="middle" font-size="16" fill="#000000">forward entry</text>
  <line x1="500.0" y1="155.0" x2="538.0" y2="155.0" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="160.0" y="220.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">pointer here</text>
  <text x="60.0" y="290.0" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">After: opening Judgment C from Search</text>
  <rect x="60.0" y="310.0" width="200.0" height="70.0" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="160.0" y="339.4" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Search</text>
  <text x="160.0" y="360.2" text-anchor="middle" font-size="16" fill="#000000">earlier entry</text>
  <rect x="300.0" y="310.0" width="200.0" height="70.0" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="400.0" y="339.4" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Judgment C</text>
  <text x="400.0" y="360.2" text-anchor="middle" font-size="16" fill="#FFFFFF">current</text>
  <line x1="260.0" y1="345.0" x2="298.0" y2="345.0" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="540.0" y="310.0" width="200.0" height="70.0" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="590.2" y="321.4" width="99.5" height="47.6" fill="#FFFFFF"/>
  <text x="640.0" y="339.4" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">A and B</text>
  <text x="640.0" y="360.2" text-anchor="middle" font-size="16" fill="#111111">discarded</text>
  <rect x="560.0" y="410.0" width="340.0" height="50.0" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="730.0" y="439.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Still listed in global history (Ctrl+H)</text>
  <line x1="640.0" y1="382.0" x2="680.0" y2="408.0" stroke="#222222" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="480.0" y="488.0" text-anchor="middle" font-size="13" fill="#333333">Each tab keeps its own list; Forward is impossible once later entries are discarded.</text>
</svg>
