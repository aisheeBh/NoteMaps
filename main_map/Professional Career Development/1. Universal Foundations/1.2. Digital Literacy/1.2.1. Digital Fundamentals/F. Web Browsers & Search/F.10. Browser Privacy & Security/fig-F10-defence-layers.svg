<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Layers of browser defence</title>
  <desc>Concentric layers from outside in: network protections (HTTPS, HSTS, certificate checks), reputation services (Safe Browsing, SmartScreen), the user decision layer (permissions, warnings, password manager and passkeys), page isolation (same-origin policy, site isolation), and the sandbox protecting the device and its files at the centre. Automatic updates repair every layer.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Defence in depth: each layer assumes the others may fail</text>
  <rect x="40.0" y="70.0" width="880.0" height="480.0" rx="14" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <rect x="298.0" y="78" width="364.0" height="26" fill="#FFFFFF"/>
  <text x="480.0" y="97.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Network: HTTPS, HSTS, certificate checks</text>
  <rect x="100.0" y="120.0" width="760.0" height="390.0" rx="14" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="255.0" y="128" width="450.0" height="26" fill="#FFFFFF"/>
  <text x="480.0" y="147.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Reputation: Safe Browsing and SmartScreen warnings</text>
  <rect x="160.0" y="170.0" width="640.0" height="300.0" rx="14" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="229.2" y="178" width="501.6" height="26" fill="#FFFFFF"/>
  <text x="480.0" y="197.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">User decisions: permissions, download warnings, passkeys</text>
  <rect x="220.0" y="220.0" width="520.0" height="210.0" rx="14" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="255.0" y="228" width="450.0" height="26" fill="#FFFFFF"/>
  <text x="480.0" y="247.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Page isolation: same-origin policy, site isolation</text>
  <rect x="290.0" y="275.0" width="380.0" height="130.0" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="480.0" y="313.6" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Sandbox</text>
  <text x="480.0" y="334.4" text-anchor="middle" font-size="16" fill="#FFFFFF">restricted processes protect</text>
  <text x="480.0" y="355.2" text-anchor="middle" font-size="16" fill="#FFFFFF">the device, files and</text>
  <text x="480.0" y="376.0" text-anchor="middle" font-size="16" fill="#FFFFFF">other applications</text>
  <rect x="300.0" y="560.0" width="360.0" height="32.0" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="480.0" y="580.2" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">Automatic updates repair every layer</text>
</svg>
