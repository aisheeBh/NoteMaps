<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Five capabilities of skilled browser and search use</title>
  <desc>Five connected boxes: Operate (fluent use of the browser), Find (choosing sources and formulating queries), Judge (evaluating results and AI answers), Protect (privacy and security) and Adapt (keeping pace with change). Operate supports Find, Find feeds Judge, Protect surrounds all three, and Adapt renews them all.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Five capabilities of skilled browser and search use</text>
  <rect x="40.0" y="70.0" width="880.0" height="330.0" rx="12" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="320" y="80" width="320" height="28" fill="#FFFFFF"/>
  <text x="480.0" y="100.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">PROTECT: privacy and security throughout</text>
  <rect x="80.0" y="140.0" width="240.0" height="200.0" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="200.0" y="213.6" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">OPERATE</text>
  <text x="200.0" y="234.4" text-anchor="middle" font-size="16" fill="#000000">interface, tabs,</text>
  <text x="200.0" y="255.2" text-anchor="middle" font-size="16" fill="#000000">profiles, settings,</text>
  <text x="200.0" y="276.0" text-anchor="middle" font-size="16" fill="#000000">saved pages</text>
  <rect x="360.0" y="140.0" width="240.0" height="200.0" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="480.0" y="213.6" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">FIND</text>
  <text x="480.0" y="234.4" text-anchor="middle" font-size="16" fill="#FFFFFF">sources, queries,</text>
  <text x="480.0" y="255.2" text-anchor="middle" font-size="16" fill="#FFFFFF">operators, enterprise</text>
  <text x="480.0" y="276.0" text-anchor="middle" font-size="16" fill="#FFFFFF">search</text>
  <rect x="640.0" y="140.0" width="240.0" height="200.0" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="760.0" y="213.6" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">JUDGE</text>
  <text x="760.0" y="234.4" text-anchor="middle" font-size="16" fill="#000000">adverts vs results,</text>
  <text x="760.0" y="255.2" text-anchor="middle" font-size="16" fill="#000000">source and date,</text>
  <text x="760.0" y="276.0" text-anchor="middle" font-size="16" fill="#000000">verify AI answers</text>
  <line x1="322.0" y1="240.0" x2="358.0" y2="240.0" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="602.0" y1="240.0" x2="638.0" y2="240.0" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="160.0" y="430.0" width="640.0" height="70.0" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="193.6" y="441.4" width="572.8" height="47.6" fill="#FFFFFF"/>
  <text x="480.0" y="459.4" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">ADAPT</text>
  <text x="480.0" y="480.2" text-anchor="middle" font-size="16" fill="#111111">assess new AI, privacy and platform changes; adopt in stages</text>
  <line x1="200.0" y1="428.0" x2="200.0" y2="402.0" stroke="#222222" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <line x1="480.0" y1="428.0" x2="480.0" y2="402.0" stroke="#222222" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <line x1="760.0" y1="428.0" x2="760.0" y2="402.0" stroke="#222222" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="480.0" y="540.0" text-anchor="middle" font-size="13" fill="#333333">The capabilities multiply: weakness in one undermines the others.</text>
</svg>
