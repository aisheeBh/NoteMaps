<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>AI summaries and clicks</title>
  <desc>Grouped bars from Pew Research Center, March 2025 browsing data: share of results-page visits with a click on a traditional result, 15 per cent without an AI summary and 8 per cent with one; clicks on links inside the AI summary, 1 per cent; sessions ending after the page, 16 per cent without and 26 per cent with an AI summary.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Google results pages with and without an AI summary</text>
  <text x="380.0" y="107.0" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Clicked a result: no AI summary</text>
  <rect x="390.0" y="80.0" width="220.0" height="44.0" rx="2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="618.0" y="107.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">15%</text>
  <text x="380.0" y="177.0" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Clicked a result: with AI summary</text>
  <rect x="390.0" y="150.0" width="117.3" height="44.0" rx="2" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="515.3" y="177.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">8%</text>
  <text x="380.0" y="247.0" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Clicked a link inside the summary</text>
  <rect x="390.0" y="220.0" width="14.7" height="44.0" rx="2" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="412.7" y="247.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">1%</text>
  <text x="380.0" y="317.0" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Session ended: no AI summary</text>
  <rect x="390.0" y="290.0" width="234.7" height="44.0" rx="2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="632.7" y="317.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">16%</text>
  <text x="380.0" y="387.0" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Session ended: with AI summary</text>
  <rect x="390.0" y="360.0" width="381.3" height="44.0" rx="2" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="779.3" y="387.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">26%</text>
  <text x="480.0" y="485.0" text-anchor="middle" font-size="13" fill="#333333">Source: Pew Research Center analysis of about 69,000 searches by 900 US adults, March 2025 (published July 2025).</text>
</svg>
