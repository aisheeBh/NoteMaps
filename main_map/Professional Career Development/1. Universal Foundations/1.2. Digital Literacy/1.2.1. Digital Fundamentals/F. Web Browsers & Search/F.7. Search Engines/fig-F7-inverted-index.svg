<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Inverted index</title>
  <desc>Left: three documents with their text. Right: an inverted index listing terms expense, claim, travel, policy, form and booking with the document numbers containing each. A query expense claim intersects the lists to find document 3.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">From documents to an inverted index</text>
  <rect x="40.0" y="80.0" width="260.0" height="96.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="170.0" y="113.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Doc 1</text>
  <text x="170.0" y="132.5" text-anchor="middle" font-size="15" fill="#000000">Expense policy:</text>
  <text x="170.0" y="152.0" text-anchor="middle" font-size="15" fill="#000000">travel expense limits</text>
  <rect x="40.0" y="200.0" width="260.0" height="96.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="170.0" y="233.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Doc 2</text>
  <text x="170.0" y="252.5" text-anchor="middle" font-size="15" fill="#000000">Travel booking</text>
  <text x="170.0" y="272.0" text-anchor="middle" font-size="15" fill="#000000">guide</text>
  <rect x="40.0" y="320.0" width="260.0" height="96.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="170.0" y="353.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Doc 3</text>
  <text x="170.0" y="372.5" text-anchor="middle" font-size="15" fill="#000000">Expense claim</text>
  <text x="170.0" y="392.0" text-anchor="middle" font-size="15" fill="#000000">form</text>
  <line x1="310.0" y1="260.0" x2="400.0" y2="260.0" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="332.8" y="237.0" width="44.5" height="19.0" fill="#FFFFFF"/>
  <text x="355.0" y="250.0" text-anchor="middle" font-size="13" fill="#111111">index</text>
  <text x="560.0" y="80.0" text-anchor="middle" font-size="16" fill="#111111"></text>
  <text x="430.0" y="80.0" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">Term</text>
  <text x="620.0" y="80.0" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">Documents containing it</text>
  <rect x="420.0" y="92.0" width="180.0" height="34.0" rx="2" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="448.0" y="115.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">booking</text>
  <rect x="600.0" y="92.0" width="300.0" height="34.0" rx="2" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="615.0" y="115.0" text-anchor="start" font-size="15" fill="#111111">Doc 2</text>
  <rect x="420.0" y="132.0" width="180.0" height="34.0" rx="2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="440" y="138" width="100" height="22" fill="#FFFFFF"/>
  <text x="448.0" y="155.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">claim</text>
  <rect x="600.0" y="132.0" width="300.0" height="34.0" rx="2" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="615.0" y="155.0" text-anchor="start" font-size="15" fill="#111111">Doc 3</text>
  <rect x="420.0" y="172.0" width="180.0" height="34.0" rx="2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="440" y="178" width="100" height="22" fill="#FFFFFF"/>
  <text x="448.0" y="195.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">expense</text>
  <rect x="600.0" y="172.0" width="300.0" height="34.0" rx="2" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="615.0" y="195.0" text-anchor="start" font-size="15" fill="#111111">Doc 1, Doc 3</text>
  <rect x="420.0" y="212.0" width="180.0" height="34.0" rx="2" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="448.0" y="235.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">form</text>
  <rect x="600.0" y="212.0" width="300.0" height="34.0" rx="2" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="615.0" y="235.0" text-anchor="start" font-size="15" fill="#111111">Doc 3</text>
  <rect x="420.0" y="252.0" width="180.0" height="34.0" rx="2" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="448.0" y="275.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">guide</text>
  <rect x="600.0" y="252.0" width="300.0" height="34.0" rx="2" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="615.0" y="275.0" text-anchor="start" font-size="15" fill="#111111">Doc 2</text>
  <rect x="420.0" y="292.0" width="180.0" height="34.0" rx="2" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="448.0" y="315.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">limits</text>
  <rect x="600.0" y="292.0" width="300.0" height="34.0" rx="2" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="615.0" y="315.0" text-anchor="start" font-size="15" fill="#111111">Doc 1</text>
  <rect x="420.0" y="332.0" width="180.0" height="34.0" rx="2" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="448.0" y="355.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">policy</text>
  <rect x="600.0" y="332.0" width="300.0" height="34.0" rx="2" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="615.0" y="355.0" text-anchor="start" font-size="15" fill="#111111">Doc 1</text>
  <rect x="420.0" y="372.0" width="180.0" height="34.0" rx="2" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="448.0" y="395.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">travel</text>
  <rect x="600.0" y="372.0" width="300.0" height="34.0" rx="2" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="615.0" y="395.0" text-anchor="start" font-size="15" fill="#111111">Doc 1, Doc 2</text>
  <rect x="420.0" y="430.0" width="480.0" height="70.0" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="660.0" y="459.4" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Query "expense claim"</text>
  <text x="660.0" y="480.2" text-anchor="middle" font-size="16" fill="#000000">{Doc 1, Doc 3} AND {Doc 3} = Doc 3</text>
</svg>
