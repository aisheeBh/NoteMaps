<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>PageRank three-page example</title>
  <desc>Three circles A, B and C. A links to B and C, B links to C, C links to A. Scores: A about 0.39, B about 0.21, C about 0.40, with damping factor 0.85.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">PageRank in a three-page web (damping 0.85)</text>
  <line x1="438.9" y1="186.4" x2="285.8" y2="359.6" stroke="#222222" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="531.6" y1="177.2" x2="674.1" y2="338.3" stroke="#222222" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="298.0" y1="400.0" x2="640.0" y2="400.0" stroke="#222222" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="657.1" y1="361.3" x2="514.6" y2="200.2" stroke="#222222" stroke-width="2.2" marker-end="url(#arrow)"/>
  <circle cx="480" cy="140" r="62" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="480.0" y="136.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Page A</text>
  <text x="480.0" y="160.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">PR = 0.39</text>
  <circle cx="250" cy="400" r="48" fill="#FFFFFF" stroke="#333333" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="250.0" y="396.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Page B</text>
  <text x="250.0" y="420.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">PR = 0.21</text>
  <circle cx="710" cy="400" r="64" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="710.0" y="396.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Page C</text>
  <text x="710.0" y="420.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">PR = 0.40</text>
  <text x="300.0" y="250.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">A links to B</text>
  <text x="625.0" y="250.0" text-anchor="start" font-size="14" font-weight="bold" fill="#111111">A links to C</text>
  <text x="480.0" y="445.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">B links to C</text>
  <text x="535.0" y="305.0" text-anchor="end" font-size="14" font-weight="bold" fill="#111111">C links to A</text>
  <text x="480.0" y="500.0" text-anchor="middle" font-size="13" fill="#333333">Each page passes 0.85 of its score, split equally among its outgoing links; scores sum to 1.</text>
</svg>
