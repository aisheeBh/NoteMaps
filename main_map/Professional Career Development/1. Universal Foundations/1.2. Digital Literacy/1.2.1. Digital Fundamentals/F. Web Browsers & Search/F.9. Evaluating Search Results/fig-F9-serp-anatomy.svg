<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Anatomy of a results page</title>
  <desc>A schematic results page from top to bottom: search box, sponsored results, AI-generated summary, featured snippet, People also ask, organic results, with a knowledge panel on the right. Each element is labelled as paid, generated by the engine, or published by a source.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">A modern results page: who controls each element?</text>
  <rect x="60.0" y="60.0" width="600.0" height="40.0" rx="6" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="360.0" y="84.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#222222">Search box: query</text>
  <rect x="60.0" y="110.0" width="600.0" height="70.0" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="263.8" y="121.4" width="192.3" height="47.6" fill="#FFFFFF"/>
  <text x="360.0" y="139.4" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Sponsored results</text>
  <text x="360.0" y="160.2" text-anchor="middle" font-size="16" fill="#111111">paid by advertisers</text>
  <text x="672.0" y="150.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">PAID</text>
  <rect x="60.0" y="190.0" width="600.0" height="90.0" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="194.2" y="211.4" width="331.5" height="47.6" fill="#FFFFFF"/>
  <text x="360.0" y="229.4" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">AI-generated summary</text>
  <text x="360.0" y="250.2" text-anchor="middle" font-size="16" fill="#111111">written by the engine from sources</text>
  <text x="672.0" y="240.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">GENERATED</text>
  <rect x="60.0" y="290.0" width="600.0" height="60.0" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="222.1" y="296.4" width="275.8" height="47.6" fill="#FFFFFF"/>
  <text x="360.0" y="314.4" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Featured snippet</text>
  <text x="360.0" y="335.2" text-anchor="middle" font-size="16" fill="#111111">excerpt chosen by the engine</text>
  <text x="672.0" y="325.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">SELECTED</text>
  <rect x="60.0" y="360.0" width="600.0" height="60.0" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="217.4" y="366.4" width="285.1" height="47.6" fill="#FFFFFF"/>
  <text x="360.0" y="384.4" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">People also ask</text>
  <text x="360.0" y="405.2" text-anchor="middle" font-size="16" fill="#111111">questions with short excerpts</text>
  <text x="672.0" y="395.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">SELECTED</text>
  <rect x="60.0" y="430.0" width="600.0" height="150.0" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="360.0" y="499.4" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Organic results</text>
  <text x="360.0" y="520.2" text-anchor="middle" font-size="16" fill="#000000">title, address, snippet per source</text>
  <text x="672.0" y="510.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">RANKED</text>
  <rect x="790.0" y="110.0" width="140.0" height="230.0" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="860.0" y="180.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Knowledge</text>
  <text x="860.0" y="200.2" text-anchor="middle" font-size="15" fill="#000000">panel</text>
  <text x="860.0" y="219.8" text-anchor="middle" font-size="15" fill="#000000"></text>
  <text x="860.0" y="239.2" text-anchor="middle" font-size="15" fill="#000000">facts from</text>
  <text x="860.0" y="258.8" text-anchor="middle" font-size="15" fill="#000000">the engine's</text>
  <text x="860.0" y="278.2" text-anchor="middle" font-size="15" fill="#000000">knowledge base</text>
  <text x="860.0" y="360.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">GENERATED</text>
  <text x="480.0" y="620.0" text-anchor="middle" font-size="13" fill="#333333">Layouts vary by query, device and engine; for commercial queries several advertisements may precede the first organic result.</text>
</svg>
