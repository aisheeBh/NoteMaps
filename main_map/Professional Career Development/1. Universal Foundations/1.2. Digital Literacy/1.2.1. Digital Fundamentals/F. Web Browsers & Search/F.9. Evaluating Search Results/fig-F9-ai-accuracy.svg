<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>AI answer accuracy 2025</title>
  <desc>Horizontal bars. Tow Center March 2025: AI search tools collectively incorrect in over 60 per cent of queries; best tool 37 per cent; worst tool 94 per cent. EBU and BBC October 2025: 45 per cent of responses with a significant issue; 31 per cent serious sourcing problems; 20 per cent major accuracy problems.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Reported problem rates in 2025 evaluations of AI answers</text>
  <text x="40.0" y="85.0" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">Tow Center, Columbia University (March 2025): identifying news sources</text>
  <text x="360.0" y="122.0" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">All eight tools combined</text>
  <rect x="370.0" y="100.0" width="288.0" height="34.0" rx="2" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="666.0" y="122.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">over 60% incorrect</text>
  <text x="360.0" y="168.0" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Best tool (Perplexity)</text>
  <rect x="370.0" y="146.0" width="177.6" height="34.0" rx="2" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="555.6" y="168.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">37% incorrect</text>
  <text x="360.0" y="214.0" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Worst tool (Grok 3)</text>
  <rect x="370.0" y="192.0" width="451.2" height="34.0" rx="2" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="829.2" y="214.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">94% incorrect</text>
  <text x="40.0" y="305.0" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">EBU and BBC (October 2025): answers to news questions, 18 countries</text>
  <text x="360.0" y="342.0" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">At least one significant issue</text>
  <rect x="370.0" y="320.0" width="216.0" height="34.0" rx="2" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="594.0" y="342.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">45%</text>
  <text x="360.0" y="388.0" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Serious sourcing problems</text>
  <rect x="370.0" y="366.0" width="148.8" height="34.0" rx="2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="526.8" y="388.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">31%</text>
  <text x="360.0" y="434.0" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Major accuracy problems</text>
  <rect x="370.0" y="412.0" width="96.0" height="34.0" rx="2" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="474.0" y="434.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">20%</text>
  <text x="480.0" y="540.0" text-anchor="middle" font-size="13" fill="#333333">Products change frequently; figures describe the versions tested at the time.</text>
</svg>
