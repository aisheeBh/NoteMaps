<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Parts of a desktop browser window</title>
  <desc>Schematic browser window with labels: tab strip, navigation buttons, address bar with site-information icon and page actions, extensions and profile icons, main menu, bookmarks bar, content area, side panel and status bubble showing a link destination.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">The main parts of a desktop browser window</text>
  <rect x="60.0" y="110.0" width="840.0" height="420.0" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <rect x="60.0" y="110.0" width="840.0" height="44.0" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <rect x="72.0" y="118.0" width="150.0" height="30.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="147.0" y="136.9" text-anchor="middle" font-size="13" fill="#000000">Report - Q3</text>
  <rect x="230.0" y="118.0" width="150.0" height="30.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="305.0" y="136.9" text-anchor="middle" font-size="13" fill="#000000">Inbox</text>
  <rect x="388.0" y="118.0" width="34.0" height="30.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="405.0" y="137.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">+</text>
  <rect x="60.0" y="154.0" width="840.0" height="52.0" rx="0" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="70.0" y="164.0" width="110.0" height="32.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="125.0" y="184.2" text-anchor="middle" font-size="14" fill="#000000">&lt;  &gt;  reload</text>
  <rect x="190.0" y="164.0" width="470.0" height="32.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="425.0" y="184.2" text-anchor="middle" font-size="14" fill="#000000">i   reports.example.com/q3            star</text>
  <rect x="670.0" y="164.0" width="170.0" height="32.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="755.0" y="183.9" text-anchor="middle" font-size="13" fill="#000000">ext  down  profile</text>
  <rect x="850.0" y="164.0" width="40.0" height="32.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="870.0" y="184.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">...</text>
  <rect x="60.0" y="206.0" width="840.0" height="30.0" rx="0" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="80.0" y="226.0" text-anchor="start" font-size="14" fill="#111111">Bookmarks bar:  Payroll   Wiki   Expenses</text>
  <rect x="60.0" y="236.0" width="620.0" height="294.0" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="370.0" y="360.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Content area (viewport)</text>
  <text x="370.0" y="386.0" text-anchor="middle" font-size="15" fill="#111111">controlled by the website</text>
  <rect x="680.0" y="236.0" width="220.0" height="294.0" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="700.0" y="360.0" width="180.0" height="50.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="790.0" y="380.1" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">Side panel</text>
  <text x="790.0" y="398.3" text-anchor="middle" font-size="14" fill="#000000">tools, AI, lists</text>
  <rect x="70.0" y="490.0" width="300.0" height="30.0" rx="6" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="220.0" y="508.9" text-anchor="middle" font-size="13" fill="#000000">https://payroll.example.com/approve</text>
  <text x="440.0" y="138.0" text-anchor="start" font-size="14" font-weight="bold" fill="#111111">&lt;- Tab strip: one tab per page</text>
  <text x="125.0" y="84.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Navigation</text>
  <line x1="125.0" y1="89.0" x2="125.0" y2="164.0" stroke="#333333" stroke-width="1.2"/>
  <text x="210.0" y="64.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Site information</text>
  <line x1="210.0" y1="69.0" x2="210.0" y2="164.0" stroke="#333333" stroke-width="1.2"/>
  <text x="490.0" y="84.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Address bar</text>
  <line x1="490.0" y1="89.0" x2="490.0" y2="164.0" stroke="#333333" stroke-width="1.2"/>
  <text x="755.0" y="64.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Extensions, downloads, profile</text>
  <line x1="755.0" y1="69.0" x2="755.0" y2="164.0" stroke="#333333" stroke-width="1.2"/>
  <text x="870.0" y="84.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Main menu</text>
  <line x1="870.0" y1="89.0" x2="870.0" y2="164.0" stroke="#333333" stroke-width="1.2"/>
  <text x="220.0" y="565.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Status bubble: real destination of a hovered link</text>
  <line x1="220.0" y1="550.0" x2="220.0" y2="522.0" stroke="#333333" stroke-width="1.2"/>
  <text x="480.0" y="590.0" text-anchor="middle" font-size="13" fill="#333333">Layouts vary slightly between browsers; the functions are common to all.</text>
</svg>
