<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Anatomy of a Set-Cookie header</title>
  <desc>The header Set-Cookie: __Host-sid=9f2c7a; Path=/; Max-Age=1800; Secure; HttpOnly; SameSite=Strict split into labelled parts: name and value, path, lifetime, Secure, HttpOnly and SameSite, each with its purpose.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">The parts of a Set-Cookie header</text>
  <text x="40.0" y="130.0" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">Set-Cookie:</text>
  <rect x="40.0" y="150.0" width="175.0" height="50.0" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="127.5" y="179.2" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">__Host-sid=9f2c7a</text>
  <rect x="225.0" y="150.0" width="85.0" height="50.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="267.5" y="179.2" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">Path=/</text>
  <rect x="320.0" y="150.0" width="150.0" height="50.0" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="338.3" y="163.2" width="113.4" height="24.2" fill="#FFFFFF"/>
  <text x="395.0" y="179.2" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Max-Age=1800</text>
  <rect x="480.0" y="150.0" width="95.0" height="50.0" rx="6" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="495.1" y="163.2" width="64.7" height="24.2" fill="#FFFFFF"/>
  <text x="527.5" y="179.2" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Secure</text>
  <rect x="585.0" y="150.0" width="110.0" height="50.0" rx="6" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="599.5" y="163.2" width="81.0" height="24.2" fill="#FFFFFF"/>
  <text x="640.0" y="179.2" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">HttpOnly</text>
  <rect x="705.0" y="150.0" width="165.0" height="50.0" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="718.6" y="163.2" width="137.8" height="24.2" fill="#FFFFFF"/>
  <text x="787.5" y="179.2" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">SameSite=Strict</text>
  <line x1="127.5" y1="202.0" x2="127.5" y2="260.0" stroke="#333333" stroke-width="1.5"/>
  <text x="127.5" y="280.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Name = value</text>
  <text x="127.5" y="300.0" text-anchor="middle" font-size="14" fill="#111111">prefix binds it to</text>
  <text x="127.5" y="318.0" text-anchor="middle" font-size="14" fill="#111111">this exact host</text>
  <line x1="267.5" y1="202.0" x2="267.5" y2="340.0" stroke="#333333" stroke-width="1.5"/>
  <text x="267.5" y="360.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Scope</text>
  <text x="267.5" y="380.0" text-anchor="middle" font-size="14" fill="#111111">which paths</text>
  <text x="267.5" y="398.0" text-anchor="middle" font-size="14" fill="#111111">receive it</text>
  <line x1="395.0" y1="202.0" x2="395.0" y2="260.0" stroke="#333333" stroke-width="1.5"/>
  <text x="395.0" y="280.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Lifetime</text>
  <text x="395.0" y="300.0" text-anchor="middle" font-size="14" fill="#111111">deleted after</text>
  <text x="395.0" y="318.0" text-anchor="middle" font-size="14" fill="#111111">30 minutes</text>
  <line x1="527.5" y1="202.0" x2="527.5" y2="340.0" stroke="#333333" stroke-width="1.5"/>
  <text x="527.5" y="360.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Secure</text>
  <text x="527.5" y="380.0" text-anchor="middle" font-size="14" fill="#111111">HTTPS only</text>
  <line x1="640.0" y1="202.0" x2="640.0" y2="260.0" stroke="#333333" stroke-width="1.5"/>
  <text x="640.0" y="280.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">HttpOnly</text>
  <text x="640.0" y="300.0" text-anchor="middle" font-size="14" fill="#111111">hidden from</text>
  <text x="640.0" y="318.0" text-anchor="middle" font-size="14" fill="#111111">page scripts</text>
  <line x1="787.5" y1="202.0" x2="787.5" y2="340.0" stroke="#333333" stroke-width="1.5"/>
  <text x="787.5" y="360.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">SameSite</text>
  <text x="787.5" y="380.0" text-anchor="middle" font-size="14" fill="#111111">not sent on</text>
  <text x="787.5" y="398.0" text-anchor="middle" font-size="14" fill="#111111">cross-site requests</text>
  <text x="480.0" y="490.0" text-anchor="middle" font-size="13" fill="#333333">A well-protected session cookie: short-lived, encrypted-only, script-proof and not sent cross-site.</text>
</svg>
