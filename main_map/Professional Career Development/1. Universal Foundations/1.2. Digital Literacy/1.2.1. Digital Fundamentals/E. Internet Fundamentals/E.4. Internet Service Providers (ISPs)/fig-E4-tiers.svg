<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>ISP hierarchy</title>
  <desc>A three-level pyramid. Tier 1 global networks at the top peer with each other and sell transit. Tier 2 regional networks in the middle peer widely and buy some transit from Tier 1. Tier 3 access ISPs at the bottom buy transit and serve homes and small businesses. Money for transit flows upwards; content and cloud networks sit alongside, peering directly with many ISPs.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">The ISP hierarchy: transit is bought from the tier above</text>
  <path d="M330 80 L530 80 L610 220 L250 220 Z" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="430" y="140" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">Tier 1</text>
  <text x="430" y="165" text-anchor="middle" font-size="15" fill="#FFFFFF">global backbones</text>
  <text x="430" y="188" text-anchor="middle" font-size="15" fill="#FFFFFF">peer with every Tier 1</text>
  <path d="M250 230 L610 230 L690 370 L170 370 Z" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="330" y="270" width="200" height="60" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="430.0" y="295.25" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Tier 2</text>
  <text x="430.0" y="315.25" text-anchor="middle" font-size="15" fill="#111111">national and regional</text>
  <path d="M170 380 L690 380 L770 520 L90 520 Z" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <text x="430" y="435" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">Tier 3</text>
  <text x="430" y="460" text-anchor="middle" font-size="15" fill="#111111">local and access ISPs</text>
  <text x="430" y="483" text-anchor="middle" font-size="15" fill="#111111">serve homes and small firms</text>
  <line x1="60" y1="515" x2="60" y2="100" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="80" y="105" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">transit is paid</text>
  <text x="80" y="125" text-anchor="start" font-size="14" fill="#111111">upwards to the tier above</text>
  <rect x="760" y="150" width="180" height="110" rx="8" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="799.625" y="165.25" width="100.75000000000001" height="21" fill="#FFFFFF"/>
  <text x="850.0" y="180.25" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Content and</text>
  <rect x="787.25" y="185.25" width="125.50000000000001" height="21" fill="#FFFFFF"/>
  <text x="850.0" y="200.25" text-anchor="middle" font-size="15" fill="#111111">cloud networks</text>
  <rect x="791.375" y="205.25" width="117.25000000000001" height="21" fill="#FFFFFF"/>
  <text x="850.0" y="220.25" text-anchor="middle" font-size="15" fill="#111111">peer directly</text>
  <rect x="787.25" y="225.25" width="125.50000000000001" height="21" fill="#FFFFFF"/>
  <text x="850.0" y="240.25" text-anchor="middle" font-size="15" fill="#111111">with many ISPs</text>
  <line x1="758" y1="230" x2="620" y2="300" stroke="#222222" stroke-width="2.5" stroke-dasharray="8 5"/>
  <line x1="800" y1="262" x2="720" y2="440" stroke="#222222" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="480.0" y="560" text-anchor="middle" font-size="13" fill="#333333">Simplified model; real networks overlap the tiers and many relationships are mixed.</text>
</svg>
