<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Registrable domain</title>
  <desc>Four host names, each split into a subdomain part on the left, the registrable domain highlighted, and the public suffix on the right. Examples: www.example.co.uk owned by example.co.uk; royalmail.parcel-update.help owned by parcel-update.help; login.mybank.com.secure-verify.co owned by secure-verify.co; mail.agency.gov.in owned by agency.gov.in.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Read from the right to find who controls the address</text>
  <text x="140" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">subdomain: anything the owner likes</text>
  <text x="560" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">registrable domain</text>
  <text x="800" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">public suffix</text>
  <rect x="20" y="90" width="380" height="46" rx="2" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="210.0" y="118.6" text-anchor="middle" font-size="16" fill="#222222">www.</text>
  <rect x="400" y="90" width="320" height="46" rx="2" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="560.0" y="118.95" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">example</text>
  <rect x="720" y="90" width="150" height="46" rx="2" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="795.0" y="118.6" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">.co.uk</text>
  <text x="445" y="158" text-anchor="start" font-size="14" font-weight="bold" fill="#111111">Owner: example.co.uk</text>
  <rect x="20" y="190" width="380" height="46" rx="2" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="210.0" y="218.6" text-anchor="middle" font-size="16" fill="#222222">royalmail.</text>
  <rect x="400" y="190" width="320" height="46" rx="2" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="560.0" y="218.95" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">parcel-update</text>
  <rect x="720" y="190" width="150" height="46" rx="2" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="795.0" y="218.6" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">.help</text>
  <text x="445" y="258" text-anchor="start" font-size="14" font-weight="bold" fill="#111111">Owner: parcel-update.help, not the postal service</text>
  <rect x="20" y="290" width="380" height="46" rx="2" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="210.0" y="318.6" text-anchor="middle" font-size="16" fill="#222222">login.mybank.com.</text>
  <rect x="400" y="290" width="320" height="46" rx="2" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="560.0" y="318.95" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">secure-verify</text>
  <rect x="720" y="290" width="150" height="46" rx="2" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="795.0" y="318.6" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">.co</text>
  <text x="445" y="358" text-anchor="start" font-size="14" font-weight="bold" fill="#111111">Owner: secure-verify.co, not the bank</text>
  <rect x="20" y="390" width="380" height="46" rx="2" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="210.0" y="418.6" text-anchor="middle" font-size="16" fill="#222222">mail.</text>
  <rect x="400" y="390" width="320" height="46" rx="2" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="560.0" y="418.95" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">agency</text>
  <rect x="720" y="390" width="150" height="46" rx="2" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="795.0" y="418.6" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">.gov.in</text>
  <text x="445" y="458" text-anchor="start" font-size="14" font-weight="bold" fill="#111111">Owner: agency.gov.in, a government body</text>
  <text x="480.0" y="525" text-anchor="middle" font-size="13" fill="#333333">The public suffix is the ending under which names are registered, such as .com, .co.uk or .gov.in.</text>
</svg>
