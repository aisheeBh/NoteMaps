<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>TTL and cache expiry</title>
  <desc>Timeline. At hour 0 the owner changes the record from the old address to the new. Three resolvers had cached the old answer at different times with a TTL of 24 hours, so they keep returning the old address until their cached copies expire, at different times up to 24 hours later. With a 5-minute TTL set in advance, all caches refresh within minutes.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">A DNS change reaches users as caches expire</text>
  <line x1="170" y1="450" x2="890" y2="450" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="170.0" y1="445" x2="170.0" y2="455" stroke="#222222" stroke-width="2"/>
  <text x="170.0" y="475" text-anchor="middle" font-size="14" fill="#111111">0 h</text>
  <line x1="350.0" y1="445" x2="350.0" y2="455" stroke="#222222" stroke-width="2"/>
  <text x="350.0" y="475" text-anchor="middle" font-size="14" fill="#111111">6 h</text>
  <line x1="530.0" y1="445" x2="530.0" y2="455" stroke="#222222" stroke-width="2"/>
  <text x="530.0" y="475" text-anchor="middle" font-size="14" fill="#111111">12 h</text>
  <line x1="710.0" y1="445" x2="710.0" y2="455" stroke="#222222" stroke-width="2"/>
  <text x="710.0" y="475" text-anchor="middle" font-size="14" fill="#111111">18 h</text>
  <line x1="890.0" y1="445" x2="890.0" y2="455" stroke="#222222" stroke-width="2"/>
  <text x="890.0" y="475" text-anchor="middle" font-size="14" fill="#111111">24 h</text>
  <text x="530.0" y="500" text-anchor="middle" font-size="15" fill="#111111">Hours after the record is changed</text>
  <line x1="170.0" y1="80" x2="170.0" y2="450" stroke="#8B0000" stroke-width="3" stroke-dasharray="8 5"/>
  <rect x="111.1" y="61" width="117.80000000000001" height="21" fill="#FFFFFF"/>
  <text x="170.0" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">record changed</text>
  <text x="158" y="138" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Resolver A</text>
  <text x="158" y="156" text-anchor="end" font-size="13" fill="#111111">cached 2 h before</text>
  <rect x="170.0" y="120" width="660.0" height="36" fill="url(#lines)" stroke="#8B0000" stroke-width="2"/>
  <rect x="830.0" y="120" width="60.0" height="36" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
  <rect x="452.65" y="130" width="94.7" height="21" fill="#FFFFFF"/>
  <text x="500.0" y="144" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">old address</text>
  <text x="158" y="208" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Resolver B</text>
  <text x="158" y="226" text-anchor="end" font-size="13" fill="#111111">cached 14 h before</text>
  <rect x="170.0" y="190" width="300.0" height="36" fill="url(#lines)" stroke="#8B0000" stroke-width="2"/>
  <rect x="470.0" y="190" width="420.0" height="36" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
  <rect x="272.65" y="200" width="94.7" height="21" fill="#FFFFFF"/>
  <text x="320.0" y="214" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">old address</text>
  <rect x="632.65" y="200" width="94.7" height="21" fill="#FFFFFF"/>
  <text x="680.0" y="214" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">new address</text>
  <text x="158" y="278" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Resolver C</text>
  <text x="158" y="296" text-anchor="end" font-size="13" fill="#111111">cached 23 h before</text>
  <rect x="170.0" y="260" width="30.0" height="36" fill="url(#lines)" stroke="#8B0000" stroke-width="2"/>
  <rect x="200.0" y="260" width="690.0" height="36" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
  <rect x="497.65" y="270" width="94.7" height="21" fill="#FFFFFF"/>
  <text x="545.0" y="284" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">new address</text>
  <text x="158" y="348" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">TTL lowered</text>
  <text x="158" y="366" text-anchor="end" font-size="13" fill="#111111">to 5 min in advance</text>
  <rect x="170.0" y="330" width="3" height="36" fill="url(#lines)" stroke="#8B0000" stroke-width="2"/>
  <rect x="172.499" y="330" width="717.501" height="36" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
  <rect x="382.54999999999995" y="340" width="294.90000000000003" height="21" fill="#FFFFFF"/>
  <text x="530.0" y="354" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">new address within about five minutes</text>
  <text x="208.0" y="334" text-anchor="middle" font-size="1" fill="#111111"></text>
  <text x="480.0" y="540" text-anchor="middle" font-size="13" fill="#333333">Illustrative TTL of 24 hours for the first three rows; lined bars = old answer still cached, crossed bars = new answer.</text>
</svg>
