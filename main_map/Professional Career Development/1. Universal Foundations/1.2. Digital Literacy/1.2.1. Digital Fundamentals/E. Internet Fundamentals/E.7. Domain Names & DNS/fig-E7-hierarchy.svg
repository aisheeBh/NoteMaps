<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Domain name hierarchy</title>
  <desc>A tree with the unnamed root at the top; beneath it top-level domains .com, .org, .uk and .in; beneath .org the domain example.org; beneath .uk the category co.uk and the domain shop.co.uk; beneath example.org the subdomains www and mail. The fully qualified name www.example.org is read from right to left as root, org, example, www.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">The DNS tree: authority flows down from the root</text>
  <rect x="420" y="65" width="120" height="50" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="480.0" y="85.1" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Root</text>
  <text x="480.0" y="106.1" text-anchor="middle" font-size="16" fill="#FFFFFF">( . )</text>
  <rect x="70" y="170" width="120" height="48" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="130.0" y="199.6" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">.com</text>
  <line x1="480" y1="117" x2="130" y2="168" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="280" y="170" width="120" height="48" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="340.0" y="199.6" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">.org</text>
  <line x1="480" y1="117" x2="340" y2="168" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="540" y="170" width="120" height="48" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="600.0" y="199.6" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">.uk</text>
  <line x1="480" y1="117" x2="600" y2="168" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="750" y="170" width="120" height="48" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="810.0" y="199.6" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">.in</text>
  <line x1="480" y1="117" x2="810" y2="168" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="250" y="280" width="180" height="48" rx="8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="286.6" y="293.6" width="106.80000000000001" height="22" fill="#FFFFFF"/>
  <text x="340.0" y="309.6" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">example.org</text>
  <line x1="340" y1="220" x2="340" y2="278" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="510" y="280" width="130" height="48" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="575.0" y="309.6" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">co.uk</text>
  <line x1="600" y1="220" x2="575" y2="278" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="510" y="390" width="180" height="48" rx="8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="551.0" y="403.6" width="98.0" height="22" fill="#FFFFFF"/>
  <text x="600.0" y="419.6" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">shop.co.uk</text>
  <line x1="575" y1="330" x2="600" y2="388" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="180" y="390" width="120" height="48" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="240.0" y="419.6" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">www</text>
  <rect x="330" y="390" width="120" height="48" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="390.0" y="419.6" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">mail</text>
  <line x1="310" y1="330" x2="240" y2="388" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="370" y1="330" x2="390" y2="388" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="780" y="300" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">Levels</text>
  <text x="780" y="325" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">Root</text>
  <text x="780" y="343" text-anchor="start" font-size="14" fill="#111111">top of the tree</text>
  <text x="780" y="367" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">Top-level domain</text>
  <text x="780" y="385" text-anchor="start" font-size="14" fill="#111111">run by a registry</text>
  <text x="780" y="409" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">Registered domain</text>
  <text x="780" y="427" text-anchor="start" font-size="14" fill="#111111">held by a registrant</text>
  <text x="780" y="451" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">Subdomains</text>
  <text x="780" y="469" text-anchor="start" font-size="14" fill="#111111">created by the owner</text>
  <rect x="110" y="475" width="620" height="60" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="420.0" y="500.1" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">www . example . org .</text>
  <text x="420.0" y="521.1" text-anchor="middle" font-size="16" fill="#111111">read right to left: root, then org, then example, then www</text>
  <text x="480.0" y="565" text-anchor="middle" font-size="13" fill="#333333">Simplified; the real tree has over a thousand top-level domains and hundreds of millions of registered names.</text>
</svg>
