<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Adaptive bitrate streaming</title>
  <desc>Schematic chart over two minutes. A dashed line shows available throughput rising, dropping sharply in the middle and recovering. A solid stepped line shows the video quality chosen for each segment: it steps down to a lower quality during the drop instead of stalling, and back up afterwards.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Quality steps down and up to follow the network</text>
  <line x1="130" y1="440" x2="890" y2="440" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="130" y1="440" x2="130" y2="110" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="510.0" y="480" text-anchor="middle" font-size="15" fill="#111111">Time (segments of a few seconds each)</text>
  <text x="70" y="275.0" text-anchor="middle" font-size="15" fill="#111111" transform="rotate(-90 70 275.0)">Rate (Mbit/s)</text>
  <line x1="130" y1="220.0" x2="890" y2="220.0" stroke="#999999" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="120" y="225.0" text-anchor="end" font-size="14" font-weight="bold" fill="#111111">1080p</text>
  <line x1="130" y1="302.5" x2="890" y2="302.5" stroke="#999999" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="120" y="307.5" text-anchor="end" font-size="14" font-weight="bold" fill="#111111">720p</text>
  <line x1="130" y1="371.25" x2="890" y2="371.25" stroke="#999999" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="120" y="376.25" text-anchor="end" font-size="14" font-weight="bold" fill="#111111">480p</text>
  <line x1="130" y1="412.5" x2="890" y2="412.5" stroke="#999999" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="120" y="417.5" text-anchor="end" font-size="14" font-weight="bold" fill="#111111">360p</text>
  <path d="M130.0 192.5 L180.7 165.0 L231.3 137.5 L282.0 151.2 L332.7 178.8 L383.3 247.5 L434.0 352.0 L484.7 363.0 L535.3 357.5 L586.0 316.2 L636.7 261.2 L687.3 192.5 L738.0 165.0 L788.7 137.5 L839.3 151.2 L890.0 165.0" fill="none" stroke="#7A5200" stroke-width="3" stroke-dasharray="10 6"/>
  <path d="M130.0 220.0 L180.7 220.0 L180.7 220.0 180.7 220.0 L231.3 220.0 L231.3 220.0 231.3 220.0 L282.0 220.0 L282.0 220.0 282.0 220.0 L332.7 220.0 L332.7 220.0 332.7 220.0 L383.3 220.0 L383.3 302.5 383.3 302.5 L434.0 302.5 L434.0 371.2 434.0 371.2 L484.7 371.2 L484.7 371.2 484.7 371.2 L535.3 371.2 L535.3 371.2 535.3 371.2 L586.0 371.2 L586.0 371.2 586.0 371.2 L636.7 371.2 L636.7 302.5 636.7 302.5 L687.3 302.5 L687.3 220.0 687.3 220.0 L738.0 220.0 L738.0 220.0 738.0 220.0 L788.7 220.0 L788.7 220.0 788.7 220.0 L839.3 220.0 L839.3 220.0 839.3 220.0 L890.0 220.0 " fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <rect x="184.79999999999995" y="109.5" width="164.0" height="21" fill="#FFFFFF"/>
  <text x="266.79999999999995" y="123.5" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">available throughput</text>
  <rect x="679.1" y="230.0" width="117.80000000000001" height="21" fill="#FFFFFF"/>
  <text x="738.0" y="244.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">quality chosen</text>
  <rect x="324.34999999999997" y="393.0" width="325.70000000000005" height="21" fill="#FFFFFF"/>
  <text x="487.2" y="407.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">drop: quality lowered, playback continues</text>
  <text x="480.0" y="525" text-anchor="middle" font-size="13" fill="#333333">Schematic; quality ladders and switching rules differ between services.</text>
</svg>
