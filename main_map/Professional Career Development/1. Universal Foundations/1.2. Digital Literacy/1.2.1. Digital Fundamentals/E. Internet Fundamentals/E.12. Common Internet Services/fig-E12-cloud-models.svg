  <rect x="227.8" y="109.55" width="124.4" height="19" fill="#FFFFFF"/>
  <text x="290.0" y="122.55" text-anchor="middle" font-size="13" fill="#111111">Users and access</text>
  <rect x="210" y="147" width="160" height="46" rx="3" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="270.7" y="161.55" width="38.6" height="19" fill="#FFFFFF"/>
  <text x="290.0" y="174.55" text-anchor="middle" font-size="13" fill="#111111">Data</text>
