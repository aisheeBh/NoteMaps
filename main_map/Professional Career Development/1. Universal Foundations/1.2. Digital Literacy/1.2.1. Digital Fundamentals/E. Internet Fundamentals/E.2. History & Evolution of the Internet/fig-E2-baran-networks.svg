<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Centralised, decentralised and distributed networks</title>
  <desc>Three panels after Paul Baran. Centralised: all nodes connect to one hub. Decentralised: several hubs each with their own cluster of nodes, linked together. Distributed: a mesh in which each node links to several neighbours, giving many alternative paths.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Three ways to connect the same nodes</text>
  <text x="165" y="90" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">Centralised</text>
  <text x="165" y="470" text-anchor="middle" font-size="15" fill="#111111">one hub: lose it, lose all</text>
  <text x="480" y="90" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">Decentralised</text>
  <text x="480" y="470" text-anchor="middle" font-size="15" fill="#111111">several hubs: lose one, lose a region</text>
  <text x="795" y="90" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">Distributed</text>
  <text x="795" y="470" text-anchor="middle" font-size="15" fill="#111111">mesh: many alternative paths</text>
