<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>IPv6 notation</title>
  <desc>An IPv6 address in full, eight groups of four hexadecimal digits, then with leading zeros removed, then with the run of zero groups replaced by a double colon, giving 2001:db8::ff00:42:8329.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Shortening an IPv6 address in two steps</text>
  <text x="60" y="88" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">1. Full form: eight groups of four hexadecimal digits (16 bits each)</text>
  <rect x="60" y="100" width="86" height="46" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="103.0" y="128.95" text-anchor="middle" font-size="17" fill="#111111">2001</text>
  <text x="155" y="130" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">:</text>
  <rect x="164" y="100" width="86" height="46" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="207.0" y="128.95" text-anchor="middle" font-size="17" fill="#111111">0db8</text>
  <text x="259" y="130" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">:</text>
  <rect x="268" y="100" width="86" height="46" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="311.0" y="128.95" text-anchor="middle" font-size="17" fill="#222222">0000</text>
  <text x="363" y="130" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">:</text>
  <rect x="372" y="100" width="86" height="46" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="415.0" y="128.95" text-anchor="middle" font-size="17" fill="#222222">0000</text>
  <text x="467" y="130" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">:</text>
  <rect x="476" y="100" width="86" height="46" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="519.0" y="128.95" text-anchor="middle" font-size="17" fill="#222222">0000</text>
  <text x="571" y="130" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">:</text>
  <rect x="580" y="100" width="86" height="46" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="623.0" y="128.95" text-anchor="middle" font-size="17" fill="#111111">ff00</text>
  <text x="675" y="130" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">:</text>
  <rect x="684" y="100" width="86" height="46" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="727.0" y="128.95" text-anchor="middle" font-size="17" fill="#111111">0042</text>
  <text x="779" y="130" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">:</text>
  <rect x="788" y="100" width="86" height="46" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="831.0" y="128.95" text-anchor="middle" font-size="17" fill="#111111">8329</text>
  <text x="60" y="198" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">2. Drop leading zeros in each group</text>
  <rect x="60" y="210" width="86" height="46" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="103.0" y="238.95" text-anchor="middle" font-size="17" fill="#111111">2001</text>
  <text x="155" y="240" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">:</text>
  <rect x="164" y="210" width="86" height="46" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="207.0" y="238.95" text-anchor="middle" font-size="17" fill="#111111">db8</text>
  <text x="259" y="240" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">:</text>
  <rect x="268" y="210" width="86" height="46" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="311.0" y="238.95" text-anchor="middle" font-size="17" fill="#222222">0</text>
  <text x="363" y="240" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">:</text>
  <rect x="372" y="210" width="86" height="46" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="415.0" y="238.95" text-anchor="middle" font-size="17" fill="#222222">0</text>
  <text x="467" y="240" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">:</text>
  <rect x="476" y="210" width="86" height="46" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="519.0" y="238.95" text-anchor="middle" font-size="17" fill="#222222">0</text>
  <text x="571" y="240" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">:</text>
  <rect x="580" y="210" width="86" height="46" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="623.0" y="238.95" text-anchor="middle" font-size="17" fill="#111111">ff00</text>
  <text x="675" y="240" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">:</text>
  <rect x="684" y="210" width="86" height="46" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="727.0" y="238.95" text-anchor="middle" font-size="17" fill="#111111">42</text>
  <text x="779" y="240" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">:</text>
  <rect x="788" y="210" width="86" height="46" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="831.0" y="238.95" text-anchor="middle" font-size="17" fill="#111111">8329</text>
  <text x="60" y="308" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">3. Replace one run of all-zero groups with a double colon</text>
  <rect x="60" y="320" width="560" height="60" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="340.0" y="358.4" text-anchor="middle" font-size="24" font-weight="bold" fill="#FFFFFF">2001:db8::ff00:42:8329</text>
  <rect x="650" y="320" width="250" height="60" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="775.0" y="345.25" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Same address,</text>
  <text x="775.0" y="365.25" text-anchor="middle" font-size="15" fill="#111111">much shorter</text>
  <text x="60" y="430" text-anchor="start" font-size="15" fill="#111111">Rule: the double colon may appear only once, otherwise the number of missing groups would be ambiguous.</text>
  <text x="60" y="455" text-anchor="start" font-size="15" fill="#111111">Other examples: ::1 is the loopback address; 2001:db8::/32 is reserved for documentation.</text>
  <text x="480.0" y="505" text-anchor="middle" font-size="13" fill="#333333">128 bits = 8 groups x 16 bits; each hexadecimal digit stands for 4 bits.</text>
</svg>
