<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Round trips before first data</title>
  <desc>Three timelines comparing set-up round trips before the first request can be sent. TCP plus TLS 1.2 needs three round trips; TCP plus TLS 1.3 needs two; QUIC needs one, because transport and encryption are negotiated together.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Round trips before the first request can be sent</text>
  <text x="200" y="133" text-anchor="end" font-size="17" font-weight="bold" fill="#111111">TCP + TLS 1.2</text>
  <rect x="215" y="100" width="164" height="52" rx="3" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="238.375" y="116.25" width="117.25000000000001" height="21" fill="#FFFFFF"/>
  <text x="297.0" y="131.25" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">TCP handshake</text>
  <rect x="385" y="100" width="164" height="52" rx="3" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="416.625" y="116.25" width="100.75000000000001" height="21" fill="#FFFFFF"/>
  <text x="467.0" y="131.25" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">TLS round 1</text>
  <rect x="555" y="100" width="164" height="52" rx="3" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="586.625" y="116.25" width="100.75000000000001" height="21" fill="#FFFFFF"/>
  <text x="637.0" y="131.25" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">TLS round 2</text>
  <rect x="725" y="100" width="150" height="52" rx="3" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="800.0" y="121.25" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Request</text>
  <text x="800.0" y="141.25" text-anchor="middle" font-size="15" fill="#FFFFFF">sent</text>
  <text x="890" y="133" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">3 RTT</text>
  <text x="200" y="238" text-anchor="end" font-size="17" font-weight="bold" fill="#111111">TCP + TLS 1.3</text>
  <rect x="215" y="205" width="164" height="52" rx="3" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="238.375" y="221.25" width="117.25000000000001" height="21" fill="#FFFFFF"/>
  <text x="297.0" y="236.25" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">TCP handshake</text>
  <rect x="385" y="205" width="164" height="52" rx="3" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="433.125" y="221.25" width="67.75" height="21" fill="#FFFFFF"/>
  <text x="467.0" y="236.25" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">TLS 1.3</text>
  <rect x="555" y="205" width="150" height="52" rx="3" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="630.0" y="226.25" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Request</text>
  <text x="630.0" y="246.25" text-anchor="middle" font-size="15" fill="#FFFFFF">sent</text>
  <text x="720" y="238" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">2 RTT</text>
  <text x="200" y="343" text-anchor="end" font-size="17" font-weight="bold" fill="#111111">QUIC</text>
  <rect x="215" y="310" width="164" height="52" rx="3" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="221.875" y="326.25" width="150.25" height="21" fill="#FFFFFF"/>
  <text x="297.0" y="341.25" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">QUIC with TLS 1.3</text>
  <rect x="385" y="310" width="150" height="52" rx="3" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="460.0" y="331.25" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Request</text>
  <text x="460.0" y="351.25" text-anchor="middle" font-size="15" fill="#FFFFFF">sent</text>
  <text x="550" y="343" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">1 RTT</text>
  <line x1="215" y1="405" x2="875" y2="405" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="215" y="427" text-anchor="middle" font-size="14" fill="#111111">0 RTT</text>
  <text x="385" y="427" text-anchor="middle" font-size="14" fill="#111111">1 RTT</text>
  <text x="555" y="427" text-anchor="middle" font-size="14" fill="#111111">2 RTT</text>
  <text x="725" y="427" text-anchor="middle" font-size="14" fill="#111111">3 RTT</text>
  <text x="480" y="460" text-anchor="middle" font-size="15" fill="#111111">RTT = one round-trip time between client and server</text>
  <text x="480.0" y="488" text-anchor="middle" font-size="13" fill="#333333">Excludes the optional zero-round-trip resumption available for repeat connections.</text>
</svg>
