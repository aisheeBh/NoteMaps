<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>3-2-1 backup rule</title>
  <desc>Three copies of data: the original on a laptop, a second copy on an external drive at home, and a third copy off-site in cloud backup or offline storage. Two different storage types, one off-site. A note says the offline or immutable copy survives ransomware.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">The 3-2-1 backup rule</text>
  <rect x="60" y="110" width="250" height="110" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="185.0" y="150.25" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Copy 1</text>
  <text x="185.0" y="170.25" text-anchor="middle" font-size="15" fill="#FFFFFF">original data</text>
  <text x="185.0" y="190.25" text-anchor="middle" font-size="15" fill="#FFFFFF">laptop or server</text>
  <rect x="355" y="110" width="250" height="110" rx="8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="450.25" y="135.25" width="59.50000000000001" height="21" fill="#FFFFFF"/>
  <text x="480.0" y="150.25" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Copy 2</text>
  <rect x="417.25" y="155.25" width="125.50000000000001" height="21" fill="#FFFFFF"/>
  <text x="480.0" y="170.25" text-anchor="middle" font-size="15" fill="#111111">external drive</text>
  <rect x="400.75" y="175.25" width="158.5" height="21" fill="#FFFFFF"/>
  <text x="480.0" y="190.25" text-anchor="middle" font-size="15" fill="#111111">or network storage</text>
  <rect x="650" y="110" width="250" height="110" rx="8" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="745.25" y="135.25" width="59.50000000000001" height="21" fill="#FFFFFF"/>
  <text x="775.0" y="150.25" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Copy 3</text>
  <rect x="691.625" y="155.25" width="166.75" height="21" fill="#FFFFFF"/>
  <text x="775.0" y="170.25" text-anchor="middle" font-size="15" fill="#111111">off-site or offline</text>
  <rect x="666.875" y="175.25" width="216.25000000000003" height="21" fill="#FFFFFF"/>
  <text x="775.0" y="190.25" text-anchor="middle" font-size="15" fill="#111111">cloud backup, locked copy</text>
  <line x1="312" y1="165" x2="353" y2="165" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="607" y1="165" x2="648" y2="165" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="185" y="275" text-anchor="middle" font-size="40" font-weight="bold" fill="#111111">3</text>
  <text x="185" y="305" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">copies in total</text>
  <text x="480" y="275" text-anchor="middle" font-size="40" font-weight="bold" fill="#111111">2</text>
  <text x="480" y="305" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">different storage types</text>
  <text x="775" y="275" text-anchor="middle" font-size="40" font-weight="bold" fill="#111111">1</text>
  <text x="775" y="305" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">copy off-site or offline</text>
  <rect x="60" y="350" width="840" height="80" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="480.0" y="385.25" text-anchor="middle" font-size="15" fill="#111111">Ransomware encrypts everything it can reach, including attached drives and synced folders.</text>
  <text x="480.0" y="405.25" text-anchor="middle" font-size="15" fill="#111111">Only an offline or immutable copy is certain to survive; test restoring it regularly.</text>
  <text x="480.0" y="485" text-anchor="middle" font-size="13" fill="#333333">Synchronised folders mirror deletions and encryption; they are not backups unless versions are kept.</text>
</svg>
