<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Elaborative retrieval with weak and strong cues</title>
  <desc>Two network panels. Left: strong cue toast leads directly to bread. Right: weak cue basket activates picnic, sandwich, bakery and loaf before reaching bread, creating several extra routes to the target.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">A weak cue forces a wider search that adds routes</text>
  <rect x="30" y="70" width="330" height="400" rx="8" fill="#FAFAFA" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <rect x="390" y="70" width="540" height="400" rx="8" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="195" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">STRONG CUE</text>
  <text x="195" y="120" text-anchor="middle" font-size="14" fill="#111111">narrow search</text>
  <text x="660" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">WEAK CUE</text>
  <text x="660" y="120" text-anchor="middle" font-size="14" fill="#111111">wide search, many links</text>
  <rect x="115" y="180" width="160" height="50" rx="6" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="195.0" y="210.9" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">toast</text>
  <rect x="115" y="360" width="160" height="50" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="195.0" y="390.9" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">bread</text>
  <line x1="195" y1="230" x2="195" y2="356" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="128.5" y="283" width="133.0" height="26" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="195" y="300" text-anchor="middle" font-size="14" fill="#111111">one direct route</text>
  <rect x="420" y="170" width="150" height="50" rx="6" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="495.0" y="200.9" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">basket</text>
  <rect x="740" y="400" width="150" height="50" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="815.0" y="430.9" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">bread</text>
  <rect x="600" y="128" width="120" height="44" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="660.0" y="155.2" text-anchor="middle" font-size="15" fill="#111111">picnic</text>
  <rect x="750" y="228" width="120" height="44" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="810.0" y="255.2" text-anchor="middle" font-size="15" fill="#111111">sandwich</text>
  <rect x="395" y="268" width="120" height="44" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="455.0" y="295.2" text-anchor="middle" font-size="15" fill="#111111">wicker</text>
  <rect x="500" y="328" width="120" height="44" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="560.0" y="355.2" text-anchor="middle" font-size="15" fill="#111111">bakery</text>
  <rect x="630" y="278" width="120" height="44" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="690.0" y="305.2" text-anchor="middle" font-size="15" fill="#111111">loaf</text>
  <line x1="570" y1="180" x2="596" y2="162" stroke="#222222" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="480" y1="220" x2="462" y2="264" stroke="#222222" stroke-width="2.2" stroke-dasharray="2 4" marker-end="url(#arrow)"/>
  <line x1="520" y1="220" x2="548" y2="324" stroke="#222222" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="720" y1="162" x2="786" y2="224" stroke="#222222" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="815" y1="272" x2="822" y2="396" stroke="#222222" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="620" y1="340" x2="640" y2="324" stroke="#222222" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="715" y1="322" x2="770" y2="396" stroke="#222222" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="420.9" y="324" width="68.2" height="25" fill="#FFFFFF" stroke="#666666" stroke-width="1"/>
  <text x="455" y="340" text-anchor="middle" font-size="13" fill="#111111">dead end</text>
  <text x="480" y="500" text-anchor="middle" font-size="16" fill="#111111">Each activated idea becomes an extra route back to the target at the next test.</text>
  <text x="480.0" y="528" text-anchor="middle" font-size="13" fill="#333333">Illustrative; based on the elaborative retrieval account of cue-strength effects.</text>
</svg>
