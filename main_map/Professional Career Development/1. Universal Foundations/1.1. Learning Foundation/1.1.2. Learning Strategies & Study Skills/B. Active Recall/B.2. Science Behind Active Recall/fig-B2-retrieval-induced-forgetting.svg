<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Retrieval-induced forgetting</title>
  <desc>Bar chart, illustrative: practised items recalled best, items from unpractised categories at baseline, and unpractised items from practised categories recalled below baseline.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Practising some items can suppress their competitors</text>
  <line x1="140" y1="420" x2="880" y2="420" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="140" y1="420" x2="140" y2="90" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="510.0" y="454" text-anchor="middle" font-size="16" fill="#111111"></text>
  <text x="82" y="255.0" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 82 255.0)">Final recall (illustrative)</text>
  <rect x="200" y="195.0" width="150" height="225.0" rx="0" fill="url(#hatch)" stroke="#000000" stroke-width="2"/>
  <text x="275" y="446" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Practised items</text>
  <text x="275" y="466" text-anchor="middle" font-size="14" fill="#111111">FRUIT - orange</text>
  <rect x="430" y="285.0" width="150" height="135.0" rx="0" fill="#E6E6E6" stroke="#666666" stroke-width="2" stroke-dasharray="2 4"/>
  <text x="505" y="446" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Unpractised, unpractised</text>
  <text x="505" y="466" text-anchor="middle" font-size="14" fill="#111111">category: DRINK - vodka</text>
  <rect x="660" y="315.0" width="150" height="105.0" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="735" y="446" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Unpractised, practised</text>
  <text x="735" y="466" text-anchor="middle" font-size="14" fill="#111111">category: FRUIT - banana</text>
  <line x1="190" y1="285.0" x2="860" y2="285.0" stroke="#222222" stroke-width="2" stroke-dasharray="10 6"/>
  <rect x="793.5" y="256.0" width="72.5" height="26" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="860" y="273.0" text-anchor="end" font-size="14" fill="#111111">baseline</text>
  <rect x="676.1" y="353" width="117.8" height="26" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
  <text x="735" y="370" text-anchor="middle" font-size="14" fill="#111111">below baseline</text>
  <text x="480.0" y="525" text-anchor="middle" font-size="13" fill="#333333">Pattern first reported by Anderson, Bjork and Bjork (1994); bar heights are illustrative.</text>
</svg>
