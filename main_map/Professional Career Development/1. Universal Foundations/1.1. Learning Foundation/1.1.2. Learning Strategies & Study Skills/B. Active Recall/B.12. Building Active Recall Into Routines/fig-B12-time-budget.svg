<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Weekly time budget for a recall routine</title>
  <desc>Horizontal stacked bar totalling 170 minutes: morning cards 75 minutes, after-meeting recall 40 minutes, evening summaries 25 minutes, Friday brain dump and check 30 minutes.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">170 minutes a week, mostly in idle moments</text>
  <rect x="80" y="120" width="352.9" height="80" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="226.2" y="148" width="60.6" height="27" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="256.5" y="166" text-anchor="middle" font-size="15" fill="#111111">75 min</text>
  <text x="256.5" y="236" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Morning cards</text>
  <rect x="432.9" y="120" width="188.2" height="80" rx="0" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="496.8" y="148" width="60.6" height="27" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="527.1" y="166" text-anchor="middle" font-size="15" fill="#111111">40 min</text>
  <text x="527.1" y="236" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">After meetings</text>
  <rect x="621.2" y="120" width="117.6" height="80" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
  <rect x="649.7" y="148" width="60.6" height="27" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="680.0" y="166" text-anchor="middle" font-size="15" fill="#111111">25 min</text>
  <text x="680.0" y="236" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Evening summaries</text>
  <rect x="738.8" y="120" width="141.2" height="80" rx="0" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <rect x="779.1" y="148" width="60.6" height="27" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="809.4" y="166" text-anchor="middle" font-size="15" fill="#111111">30 min</text>
  <text x="809.4" y="236" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Friday dump</text>
  <line x1="80.0" y1="270" x2="80.0" y2="280" stroke="#222222" stroke-width="2"/>
  <text x="80.0" y="298" text-anchor="middle" font-size="14" fill="#111111">0</text>
  <line x1="315.3" y1="270" x2="315.3" y2="280" stroke="#222222" stroke-width="2"/>
  <text x="315.3" y="298" text-anchor="middle" font-size="14" fill="#111111">50</text>
  <line x1="550.6" y1="270" x2="550.6" y2="280" stroke="#222222" stroke-width="2"/>
  <text x="550.6" y="298" text-anchor="middle" font-size="14" fill="#111111">100</text>
  <line x1="785.9" y1="270" x2="785.9" y2="280" stroke="#222222" stroke-width="2"/>
  <text x="785.9" y="298" text-anchor="middle" font-size="14" fill="#111111">150</text>
  <line x1="880.0" y1="270" x2="880.0" y2="280" stroke="#222222" stroke-width="2"/>
  <text x="880.0" y="298" text-anchor="middle" font-size="14" fill="#111111">170</text>
  <line x1="80" y1="270" x2="880" y2="270" stroke="#222222" stroke-width="2"/>
  <text x="480" y="330" text-anchor="middle" font-size="15" fill="#111111">Minutes per week</text>
  <text x="480.0" y="380" text-anchor="middle" font-size="13" fill="#333333">Values from the worked example in the text.</text>
</svg>
