  <rect x="744" y="234" width="130" height="50" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="809.0" y="254.9" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Shutdown recall</text>
  <text x="809.0" y="272.9" text-anchor="middle" font-size="14" fill="#000000">5 min</text>
  <rect x="744" y="296" width="130" height="92" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="809.0" y="328.9" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">WEEKLY</text>
  <text x="809.0" y="346.9" text-anchor="middle" font-size="14" fill="#FFFFFF">cumulative</text>
  <text x="809.0" y="364.9" text-anchor="middle" font-size="14" fill="#FFFFFF">recall + gap list</text>
  <rect x="70" y="420" width="814" height="60" rx="6" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="250" y="433" width="454" height="34" rx="3" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <text x="477" y="456" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">MONTHLY: cue-free audit, pruning, routine review</text>
  <text x="480.0" y="520" text-anchor="middle" font-size="13" fill="#333333">Times are typical, not prescriptive; the smallest version of each block should survive a busy day.</text>
