<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Recall routines at three time scales</title>
  <desc>A week grid with five weekday columns. Each day shows small daily recall blocks: morning cards, after-meeting recall and shutdown recall. Friday also has a larger weekly cumulative recall block. Below the grid, a monthly bar shows a recall audit and pruning on the first working day of the month.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Daily, weekly and monthly recall</text>
  <rect x="70" y="70" width="150" height="330" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="145" y="94" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Mon</text>
  <rect x="80" y="110" width="130" height="50" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="145.0" y="130.9" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Morning cards</text>
  <text x="145.0" y="148.9" text-anchor="middle" font-size="14" fill="#000000">10-15 min</text>
  <rect x="80" y="172" width="130" height="50" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="145.0" y="192.9" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">After meetings</text>
  <text x="145.0" y="210.9" text-anchor="middle" font-size="14" fill="#000000">2 min each</text>
  <rect x="80" y="234" width="130" height="50" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="145.0" y="254.9" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Shutdown recall</text>
  <text x="145.0" y="272.9" text-anchor="middle" font-size="14" fill="#000000">5 min</text>
  <rect x="236" y="70" width="150" height="330" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
