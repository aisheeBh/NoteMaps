<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Felt knowledge versus recalled knowledge</title>
  <desc>Schematic paired bars: after re-reading, judged knowledge is high but actual recall a week later is much lower; after recall practice, judged knowledge is moderate and actual recall is closer to it and higher.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Feeling of knowing versus what can be produced</text>
  <line x1="130" y1="440" x2="900" y2="440" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="130" y1="440" x2="130" y2="90" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="515.0" y="474" text-anchor="middle" font-size="16" fill="#111111"></text>
  <text x="72" y="265.0" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 72 265.0)">Percentage of material</text>
  <line x1="130" y1="357.5" x2="880" y2="357.5" stroke="#888888" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="120" y="362.5" text-anchor="end" font-size="14" fill="#111111">25</text>
  <line x1="130" y1="275.0" x2="880" y2="275.0" stroke="#888888" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="120" y="280.0" text-anchor="end" font-size="14" fill="#111111">50</text>
  <line x1="130" y1="192.5" x2="880" y2="192.5" stroke="#888888" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="120" y="197.5" text-anchor="end" font-size="14" fill="#111111">75</text>
  <line x1="130" y1="110.0" x2="880" y2="110.0" stroke="#888888" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="120" y="115.0" text-anchor="end" font-size="14" fill="#111111">100</text>
  <rect x="220" y="159.5" width="110" height="280.5" rx="0" fill="#E6E6E6" stroke="#333333" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="350" y="308.0" width="110" height="132.0" rx="0" fill="url(#hatch)" stroke="#000000" stroke-width="2"/>
  <rect x="227.4" y="128.5" width="95.2" height="26" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="275" y="145.5" text-anchor="middle" font-size="14" fill="#111111">feels known</text>
  <rect x="346.1" y="277.0" width="117.8" height="26" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="405" y="294.0" text-anchor="middle" font-size="14" fill="#111111">recalled later</text>
  <text x="340" y="470" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">After re-reading</text>
  <rect x="560" y="225.5" width="110" height="214.5" rx="0" fill="#E6E6E6" stroke="#333333" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="690" y="242.0" width="110" height="198.0" rx="0" fill="url(#hatch)" stroke="#000000" stroke-width="2"/>
  <rect x="567.4" y="194.5" width="95.2" height="26" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="615" y="211.5" text-anchor="middle" font-size="14" fill="#111111">feels known</text>
  <rect x="686.1" y="211.0" width="117.8" height="26" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="745" y="228.0" text-anchor="middle" font-size="14" fill="#111111">recalled later</text>
  <text x="680" y="470" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">After recall practice</text>
  <rect x="349" y="94" width="263.1" height="27" fill="#FFFFFF" stroke="#8B0000" stroke-width="1.5"/>
  <text x="355" y="112" font-size="15" fill="#111111">large gap = illusion of knowing</text>
  <text x="480.0" y="525" text-anchor="middle" font-size="13" fill="#333333">Schematic of a well-replicated pattern; values are illustrative, not plotted from a single dataset.</text>
</svg>
