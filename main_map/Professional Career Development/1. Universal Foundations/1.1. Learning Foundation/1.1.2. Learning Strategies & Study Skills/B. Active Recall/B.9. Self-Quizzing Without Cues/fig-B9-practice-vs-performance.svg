<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Cues during practice and performance</title>
  <desc>Two-by-two grid: columns practice and performance; rows cues present and cues removed. Practice with cues: easy, weak learning. Practice without cues: effortful, durable knowledge. Performance with cues: checklists reduce errors. Performance without cues: risky under pressure. Best combination highlighted: practise without cues, perform with cues.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Practise without cues; perform with them</text>
  <text x="380" y="92" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">PRACTICE</text>
  <text x="380" y="112" text-anchor="middle" font-size="14" fill="#111111">building knowledge</text>
  <text x="700" y="92" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">PERFORMANCE</text>
  <text x="700" y="112" text-anchor="middle" font-size="14" fill="#111111">doing the real task</text>
  <text x="130" y="195" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Cues</text>
  <text x="130" y="217" text-anchor="middle" font-size="16" fill="#111111">present</text>
  <text x="130" y="375" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Cues</text>
  <text x="130" y="397" text-anchor="middle" font-size="16" fill="#111111">removed</text>
  <rect x="230" y="128" width="300" height="160" rx="4" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="276.8" y="186" width="206.4" height="47" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="380" y="204" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Easy, feels good</text>
  <text x="380" y="224" text-anchor="middle" font-size="15" fill="#111111">weak, cue-bound learning</text>
  <rect x="540" y="128" width="300" height="160" rx="4" fill="url(#cross)" stroke="#1E5E24" stroke-width="4"/>
  <rect x="599.0" y="186" width="182.1" height="47" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="690" y="204" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">BEST FOR WORK</text>
  <text x="690" y="224" text-anchor="middle" font-size="15" fill="#111111">checklists cut errors</text>
  <rect x="230" y="308" width="300" height="160" rx="4" fill="url(#cross)" stroke="#1E5E24" stroke-width="4"/>
  <rect x="272.8" y="366" width="214.5" height="47" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="380" y="384" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">BEST FOR LEARNING</text>
  <text x="380" y="404" text-anchor="middle" font-size="15" fill="#111111">effortful, durable recall</text>
  <rect x="540" y="308" width="300" height="160" rx="4" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="603.0" y="366" width="174.0" height="47" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="690" y="384" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Risky under pressure</text>
  <text x="690" y="404" text-anchor="middle" font-size="15" fill="#111111">omissions, slips</text>
  <text x="480.0" y="540" text-anchor="middle" font-size="13" fill="#333333">The expert pattern combines the two BEST cells: recall first, then a cue-based check.</text>
</svg>
