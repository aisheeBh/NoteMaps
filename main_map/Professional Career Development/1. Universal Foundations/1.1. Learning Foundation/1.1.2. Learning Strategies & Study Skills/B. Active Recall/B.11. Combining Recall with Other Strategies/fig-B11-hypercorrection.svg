<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Hypercorrection effect</title>
  <desc>Schematic rising line: the probability that an initial error is corrected on a later retest increases with the confidence the learner had in that error.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Confident errors are corrected best</text>
  <line x1="140" y1="400" x2="880" y2="400" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="140" y1="400" x2="140" y2="90" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="510.0" y="434" text-anchor="middle" font-size="16" fill="#111111"></text>
  <text x="82" y="245.0" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 82 245.0)">Correction retained at retest</text>
  <text x="510" y="446" text-anchor="middle" font-size="16" fill="#111111">Confidence in the original wrong answer</text>
  <text x="200" y="422" text-anchor="middle" font-size="14" fill="#111111">very low</text>
  <text x="360" y="422" text-anchor="middle" font-size="14" fill="#111111">low</text>
  <text x="520" y="422" text-anchor="middle" font-size="14" fill="#111111">medium</text>
  <text x="680" y="422" text-anchor="middle" font-size="14" fill="#111111">high</text>
  <text x="840" y="422" text-anchor="middle" font-size="14" fill="#111111">very high</text>
  <path d="M200 295.0 L360 265.0 L520 235.0 L680 196.0 L840 166.0" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <circle cx="200" cy="295.0" r="7" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <circle cx="360" cy="265.0" r="7" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <circle cx="520" cy="235.0" r="7" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <circle cx="680" cy="196.0" r="7" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <circle cx="840" cy="166.0" r="7" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <rect x="176.6" y="133" width="306.8" height="44" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="330" y="150" text-anchor="middle" font-size="14" fill="#111111">surprise at being confidently</text>
  <text x="330" y="168" text-anchor="middle" font-size="14" fill="#111111">wrong draws attention to the correction</text>
  <text x="480.0" y="505" text-anchor="middle" font-size="13" fill="#333333">Schematic of the pattern reported by Butterfield and Metcalfe (2001); values illustrative.</text>
</svg>
