<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Successive relearning</title>
  <desc>Schematic bar chart: number of recall attempts needed to reach criterion in the first learning session and in four later relearning sessions spread over weeks, decreasing from many attempts to about one.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Each relearning session needs fewer attempts</text>
  <line x1="140" y1="400" x2="880" y2="400" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="140" y1="400" x2="140" y2="90" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="510.0" y="434" text-anchor="middle" font-size="16" fill="#111111"></text>
  <text x="82" y="245.0" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 82 245.0)">Attempts to reach criterion</text>
  <rect x="190" y="125.0" width="90" height="275.0" rx="0" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <text x="235" y="424" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Initial</text>
  <text x="235" y="444" text-anchor="middle" font-size="13" fill="#111111"></text>
  <rect x="330" y="257.0" width="90" height="143.0" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="375" y="424" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Relearn 1</text>
  <text x="375" y="444" text-anchor="middle" font-size="13" fill="#111111">days later</text>
  <rect x="470" y="301.0" width="90" height="99.0" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="515" y="424" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Relearn 2</text>
  <text x="515" y="444" text-anchor="middle" font-size="13" fill="#111111">a week later</text>
  <rect x="610" y="323.0" width="90" height="77.0" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="655" y="424" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Relearn 3</text>
  <text x="655" y="444" text-anchor="middle" font-size="13" fill="#111111">weeks later</text>
  <rect x="750" y="334.0" width="90" height="66.0" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="795" y="424" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Relearn 4</text>
  <text x="795" y="444" text-anchor="middle" font-size="13" fill="#111111">weeks later</text>
  <rect x="528.2" y="123" width="223.7" height="44" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="640" y="140" text-anchor="middle" font-size="14" fill="#111111">retrieval gets easier as</text>
  <text x="640" y="158" text-anchor="middle" font-size="14" fill="#111111">storage strength accumulates</text>
  <text x="480.0" y="505" text-anchor="middle" font-size="13" fill="#333333">Schematic of the pattern in successive-relearning studies; values illustrative.</text>
</svg>
