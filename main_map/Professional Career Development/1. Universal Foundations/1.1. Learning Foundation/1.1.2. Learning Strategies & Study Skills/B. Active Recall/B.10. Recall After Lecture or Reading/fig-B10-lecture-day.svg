<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Recall moments around a lecture</title>
  <desc>Horizontal timeline from 10:00 to 09:00 the next day: lecture 10:00 to 10:50; exit recall at 10:50 for two minutes; question to lecturer; evening recall at 19:00 before notes; comparison with notes; next-morning recall at 09:00 before the next session.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">One lecture, three retrievals</text>
  <line x1="60" y1="250" x2="900" y2="250" stroke="#222222" stroke-width="3"/>
  <rect x="90" y="90" width="150" height="120" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="165.0" y="145.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">LECTURE</text>
  <text x="165.0" y="165.2" text-anchor="middle" font-size="15" fill="#111111">50 minutes</text>
  <line x1="165.0" y1="210" x2="165.0" y2="250" stroke="#222222" stroke-width="2"/>
  <circle cx="165.0" cy="250" r="8" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="165.0" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">10:00</text>
  <rect x="270" y="290" width="150" height="110" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="345.0" y="330.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">EXIT RECALL</text>
  <text x="345.0" y="350.2" text-anchor="middle" font-size="15" fill="#FFFFFF">2 min: 3 points,</text>
  <text x="345.0" y="370.2" text-anchor="middle" font-size="15" fill="#FFFFFF">1 question</text>
  <line x1="345.0" y1="290" x2="345.0" y2="250" stroke="#222222" stroke-width="2"/>
  <circle cx="345.0" cy="250" r="8" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="345.0" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">10:50</text>
  <rect x="470" y="90" width="170" height="120" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="555.0" y="135.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">EVENING RECALL</text>
  <text x="555.0" y="155.2" text-anchor="middle" font-size="15" fill="#FFFFFF">8 min, notes closed,</text>
  <text x="555.0" y="175.2" text-anchor="middle" font-size="15" fill="#FFFFFF">then compare</text>
  <line x1="555.0" y1="210" x2="555.0" y2="250" stroke="#222222" stroke-width="2"/>
  <circle cx="555.0" cy="250" r="8" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="555.0" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">19:00</text>
  <rect x="720" y="290" width="150" height="110" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="795.0" y="330.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">PRE-SESSION</text>
  <text x="795.0" y="350.2" text-anchor="middle" font-size="15" fill="#FFFFFF">RECALL</text>
  <text x="795.0" y="370.2" text-anchor="middle" font-size="15" fill="#FFFFFF">4 min</text>
  <line x1="795.0" y1="290" x2="795.0" y2="250" stroke="#222222" stroke-width="2"/>
  <circle cx="795.0" cy="250" r="8" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="795.0" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">09:00 next day</text>
  <rect x="379.1" y="422" width="481.8" height="27" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="620" y="440" text-anchor="middle" font-size="15" fill="#111111">notes are opened only AFTER each recall, as the answer key</text>
</svg>
