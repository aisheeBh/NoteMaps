<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Three lengths of closed-book summary</title>
  <desc>Three stacked panels of increasing size: one sentence tests the main claim; one paragraph adds reasons and evidence; one page adds structure, limits and implications.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Sentence, paragraph, page</text>
  <rect x="60" y="80" width="360" height="58" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <text x="240" y="115.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">ONE SENTENCE</text>
  <text x="460" y="105.0" font-size="16" font-weight="bold" fill="#111111">Tests: is the main claim grasped?</text>
  <text x="460" y="127.0" font-size="14" fill="#111111">Gist only; fastest; good daily check</text>
  <rect x="60" y="164" width="360" height="94" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="240" y="217.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">ONE PARAGRAPH</text>
  <text x="460" y="207.0" font-size="16" font-weight="bold" fill="#111111">Tests: claim + main reasons + key evidence</text>
  <text x="460" y="229.0" font-size="14" fill="#111111">Most common study format</text>
  <rect x="60" y="284" width="360" height="148" rx="6" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
  <rect x="150" y="342.0" width="180" height="32" rx="3" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="240" y="364.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">ONE PAGE</text>
  <text x="460" y="354.0" font-size="16" font-weight="bold" fill="#111111">Tests: the full argument, its limits and implications</text>
  <text x="460" y="376.0" font-size="14" fill="#111111">Before an exam, a briefing or a decision</text>
  <text x="480.0" y="520" text-anchor="middle" font-size="13" fill="#333333">Shorter limits force harder choices about what matters; longer ones test structure and nuance.</text>
</svg>
