<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Macrorules condense a text into its gist</title>
  <desc>A funnel: a full paragraph about cost cutting at the top; delete trivial and redundant parts; generalise lists into categories; select or construct a topic sentence; at the bottom a one-sentence gist.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">From full text to gist</text>
  <rect x="80" y="70" width="800" height="100" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="100" y="98" font-size="15" fill="#111111">Last year the firm cut marketing by 12%, travel by 30% and training by 20%. As noted,</text>
  <text x="100" y="120" font-size="15" fill="#111111">travel fell sharply. The CFO, who joined in March, said the cuts protected margins, which</text>
  <text x="100" y="142" font-size="15" fill="#111111">rose two points even though revenue was flat. (A similar pattern was seen in 2015.)</text>
  <rect x="130.0" y="196" width="700" height="52" rx="6" fill="#E6E6E6" stroke="#666666" stroke-width="2" stroke-dasharray="2 4"/>
  <text x="480" y="218" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">DELETE</text>
  <text x="480" y="238" text-anchor="middle" font-size="14" fill="#111111">trivial and redundant: the CFO's start date, 'as noted', the 2015 aside</text>
  <rect x="180.0" y="282" width="600" height="52" rx="6" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="480" y="304" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">GENERALISE</text>
  <text x="480" y="324" text-anchor="middle" font-size="14" fill="#111111">marketing, travel, training -&gt; discretionary spending</text>
  <rect x="230.0" y="368" width="500" height="52" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="480" y="390" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">SELECT / CONSTRUCT</text>
  <text x="480" y="410" text-anchor="middle" font-size="14" fill="#111111">state the implicit main point as a topic sentence</text>
  <line x1="480" y1="170" x2="480" y2="194" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="480" y1="248" x2="480" y2="280" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="480" y1="334" x2="480" y2="366" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="480" y1="420" x2="480" y2="452" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="230" y="454" width="500" height="80" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="480.0" y="479.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">GIST</text>
  <text x="480.0" y="499.2" text-anchor="middle" font-size="15" fill="#000000">Discretionary spending cuts raised margins</text>
  <text x="480.0" y="519.2" text-anchor="middle" font-size="15" fill="#000000">by two points despite flat revenue.</text>
  <text x="480.0" y="575" text-anchor="middle" font-size="13" fill="#333333">Operations after Kintsch and van Dijk (1978); example text invented for illustration.</text>
</svg>
