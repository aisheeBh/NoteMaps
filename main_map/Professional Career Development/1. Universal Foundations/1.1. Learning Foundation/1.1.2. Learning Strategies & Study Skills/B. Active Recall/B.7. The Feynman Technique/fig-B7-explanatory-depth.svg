<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Illusion of explanatory depth</title>
  <desc>Schematic line chart of self-rated understanding at three points: initial rating high, rating after writing an explanation much lower, rating after answering diagnostic questions slightly lower still. A comparison line for factual knowledge stays nearly flat.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Confidence falls once an explanation is attempted</text>
  <line x1="140" y1="420" x2="880" y2="420" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="140" y1="420" x2="140" y2="90" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="510.0" y="454" text-anchor="middle" font-size="16" fill="#111111"></text>
  <text x="82" y="255.0" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 82 255.0)">Self-rated understanding</text>
  <text x="250" y="446" text-anchor="middle" font-size="15" fill="#111111">Initial</text>
  <text x="250" y="465" text-anchor="middle" font-size="15" fill="#111111">rating</text>
  <text x="500" y="446" text-anchor="middle" font-size="15" fill="#111111">After writing an</text>
  <text x="500" y="465" text-anchor="middle" font-size="15" fill="#111111">explanation</text>
  <text x="750" y="446" text-anchor="middle" font-size="15" fill="#111111">After diagnostic</text>
  <text x="750" y="465" text-anchor="middle" font-size="15" fill="#111111">questions</text>
  <path d="M250 176.8 L500 285.6 L750 298.4" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <path d="M250 202.4 L500 215.2 L750 215.2" fill="none" stroke="#222222" stroke-width="3" stroke-dasharray="10 6"/>
  <circle cx="250" cy="176.8" r="7" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <circle cx="500" cy="285.6" r="7" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <circle cx="750" cy="298.4" r="7" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <circle cx="250" cy="202.4" r="6" fill="#FFFFFF" stroke="#222222" stroke-width="2.5"/>
  <circle cx="500" cy="215.2" r="6" fill="#FFFFFF" stroke="#222222" stroke-width="2.5"/>
  <circle cx="750" cy="215.2" r="6" fill="#FFFFFF" stroke="#222222" stroke-width="2.5"/>
  <rect x="562.2" y="158.2" width="155.6" height="44" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="640" y="175.2" text-anchor="middle" font-size="14" fill="#111111">Knowledge of facts:</text>
  <text x="640" y="193.2" text-anchor="middle" font-size="14" fill="#111111">confidence holds</text>
  <rect x="538.4" y="340.6" width="163.2" height="44" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="620" y="357.6" text-anchor="middle" font-size="14" fill="#111111">How devices work:</text>
  <text x="620" y="375.6" text-anchor="middle" font-size="14" fill="#111111">confidence collapses</text>
  <text x="480.0" y="525" text-anchor="middle" font-size="13" fill="#333333">Schematic of the pattern reported by Rozenblit and Keil (2002); values illustrative.</text>
</svg>
