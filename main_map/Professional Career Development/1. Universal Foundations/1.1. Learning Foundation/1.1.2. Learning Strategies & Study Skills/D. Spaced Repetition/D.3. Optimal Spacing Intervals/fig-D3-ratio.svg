<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Optimal gap as a share of the retention interval</title>
  <desc>The best gap expressed as a percentage of the retention interval falls from roughly twenty to forty percent for retention intervals of about a week to roughly five to ten percent for a retention interval of a year.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">Longer goals need longer gaps, but a smaller share</text>
  <line x1="150" y1="420" x2="860" y2="420" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="150" y1="344" x2="860" y2="344" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="150" y1="269" x2="860" y2="269" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="150" y1="193" x2="860" y2="193" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="150" y1="118" x2="860" y2="118" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="150" y1="420" x2="870" y2="420" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="150" y1="420" x2="150" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="202" y1="420" x2="202" y2="426" stroke="#222222" stroke-width="1.5"/>
  <text x="202" y="444" text-anchor="middle" font-size="14" fill="#111111">1 wk</text>
  <line x1="450" y1="420" x2="450" y2="426" stroke="#222222" stroke-width="1.5"/>
  <text x="450" y="444" text-anchor="middle" font-size="14" fill="#111111">5 wk</text>
  <line x1="557" y1="420" x2="557" y2="426" stroke="#222222" stroke-width="1.5"/>
  <text x="557" y="444" text-anchor="middle" font-size="14" fill="#111111">10 wk</text>
  <line x1="702" y1="420" x2="702" y2="426" stroke="#222222" stroke-width="1.5"/>
  <text x="702" y="444" text-anchor="middle" font-size="14" fill="#111111">6 mo</text>
  <line x1="805" y1="420" x2="805" y2="426" stroke="#222222" stroke-width="1.5"/>
  <text x="805" y="444" text-anchor="middle" font-size="14" fill="#111111">1 yr</text>
  <line x1="144" y1="420" x2="150" y2="420" stroke="#222222" stroke-width="1.5"/>
  <text x="140" y="425" text-anchor="end" font-size="14" fill="#111111">0</text>
  <line x1="144" y1="344" x2="150" y2="344" stroke="#222222" stroke-width="1.5"/>
  <text x="140" y="349" text-anchor="end" font-size="14" fill="#111111">10</text>
  <line x1="144" y1="269" x2="150" y2="269" stroke="#222222" stroke-width="1.5"/>
  <text x="140" y="274" text-anchor="end" font-size="14" fill="#111111">20</text>
  <line x1="144" y1="193" x2="150" y2="193" stroke="#222222" stroke-width="1.5"/>
  <text x="140" y="198" text-anchor="end" font-size="14" fill="#111111">30</text>
  <line x1="144" y1="118" x2="150" y2="118" stroke="#222222" stroke-width="1.5"/>
  <text x="140" y="123" text-anchor="end" font-size="14" fill="#111111">40</text>
  <text x="505" y="472" text-anchor="middle" font-size="16" fill="#111111">Retention interval (days, logarithmic scale)</text>
  <text x="88" y="250" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 88 250)">Best gap as % of retention interval</text>
