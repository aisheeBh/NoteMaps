L262.1 314.2 L254.5 313.3 L247.0 312.3 L239.5 311.4 L232.0 310.4 L224.4 309.5 L216.9 308.6 L209.4 307.6 L201.9 306.7 Z" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="346" y="123" width="160" height="25" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="426" y="140" text-anchor="middle" font-size="15" fill="#111111">range of best gaps</text>
  <rect x="531" y="200" width="343" height="24" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="702" y="216" text-anchor="middle" font-size="14" fill="#111111">e.g. 1-year goal: gap of about 3 to 5 weeks</text>
  <text x="480" y="520" text-anchor="middle" font-size="13" fill="#333333">Schematic band summarising published estimates; individual studies and materials vary.</text>
</svg>
