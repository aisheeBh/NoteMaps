  <line x1="150" y1="165" x2="860" y2="165" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="150" y1="80" x2="860" y2="80" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="150" y1="420" x2="870" y2="420" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="150" y1="420" x2="150" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="150" y1="420" x2="150" y2="426" stroke="#222222" stroke-width="1.5"/>
  <text x="150" y="444" text-anchor="middle" font-size="14" fill="#111111">70</text>
  <line x1="272" y1="420" x2="272" y2="426" stroke="#222222" stroke-width="1.5"/>
  <text x="272" y="444" text-anchor="middle" font-size="14" fill="#111111">75</text>
  <line x1="395" y1="420" x2="395" y2="426" stroke="#222222" stroke-width="1.5"/>
  <text x="395" y="444" text-anchor="middle" font-size="14" fill="#111111">80</text>
  <line x1="517" y1="420" x2="517" y2="426" stroke="#222222" stroke-width="1.5"/>
  <text x="517" y="444" text-anchor="middle" font-size="14" fill="#111111">85</text>
  <line x1="640" y1="420" x2="640" y2="426" stroke="#222222" stroke-width="1.5"/>
  <text x="640" y="444" text-anchor="middle" font-size="14" fill="#111111">90</text>
  <line x1="762" y1="420" x2="762" y2="426" stroke="#222222" stroke-width="1.5"/>
  <text x="762" y="444" text-anchor="middle" font-size="14" fill="#111111">95</text>
  <line x1="860" y1="420" x2="860" y2="426" stroke="#222222" stroke-width="1.5"/>
  <text x="860" y="444" text-anchor="middle" font-size="14" fill="#111111">99</text>
  <line x1="144" y1="420" x2="150" y2="420" stroke="#222222" stroke-width="1.5"/>
  <text x="140" y="425" text-anchor="end" font-size="14" fill="#111111">0</text>
  <line x1="144" y1="378" x2="150" y2="378" stroke="#222222" stroke-width="1.5"/>
  <text x="140" y="382" text-anchor="end" font-size="14" fill="#111111">1</text>
  <line x1="144" y1="335" x2="150" y2="335" stroke="#222222" stroke-width="1.5"/>
  <text x="140" y="340" text-anchor="end" font-size="14" fill="#111111">2</text>
