  <text x="140" y="255" text-anchor="end" font-size="14" fill="#111111">4</text>
  <line x1="144" y1="165" x2="150" y2="165" stroke="#222222" stroke-width="1.5"/>
  <text x="140" y="170" text-anchor="end" font-size="14" fill="#111111">6</text>
  <line x1="144" y1="80" x2="150" y2="80" stroke="#222222" stroke-width="1.5"/>
  <text x="140" y="85" text-anchor="end" font-size="14" fill="#111111">8</text>
  <text x="505" y="472" text-anchor="middle" font-size="16" fill="#111111">Target probability of recall at each review (%)</text>
  <text x="88" y="250" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 88 250)">Reviews needed (relative to 90%)</text>
