<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Choosing a spacing approach by horizon and volume</title>
  <desc>A two-by-two matrix. Horizontal axis: how long the knowledge must last, from days to years. Vertical axis: how much material, from little to a great deal. Little material for days: a short review plan. A great deal for days: spaced review calendar before the deadline. Little material for years: occasional use and a few long-interval reviews. A great deal for years: spaced-repetition software with a sustainable daily habit.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="34" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">Matching the approach to the horizon and the volume</text>
  <rect x="200" y="70" width="320" height="190" rx="0" fill="#F2F2F2" stroke="#222222" stroke-width="2"/>
  <rect x="520" y="70" width="320" height="190" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="3"/>
  <rect x="200" y="260" width="320" height="190" rx="0" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <rect x="520" y="260" width="320" height="190" rx="0" fill="#F2F2F2" stroke="#222222" stroke-width="2"/>
  <rect x="230" y="115" width="260.0" height="100" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="360" y="150" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Spaced review calendar</text>
  <text x="360" y="174" text-anchor="middle" font-size="15" fill="#111111">back from the deadline;</text>
  <text x="360" y="198" text-anchor="middle" font-size="15" fill="#111111">retrieval, not re-reading</text>
  <rect x="550.0" y="115" width="260.0" height="100" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="680" y="150" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Spaced-repetition software</text>
  <text x="680" y="174" text-anchor="middle" font-size="15" fill="#111111">with a budget-first</text>
  <text x="680" y="198" text-anchor="middle" font-size="15" fill="#111111">daily habit</text>
  <rect x="230" y="305.0" width="260.0" height="100" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="360" y="340" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">A few reviews before use;</text>
  <text x="360" y="364" text-anchor="middle" font-size="15" fill="#111111">massing acceptable for</text>
  <text x="360" y="388" text-anchor="middle" font-size="15" fill="#111111">a one-off need</text>
  <rect x="550.0" y="305.0" width="260.0" height="100" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="680" y="340" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Use in real work, plus</text>
  <text x="680" y="364" text-anchor="middle" font-size="15" fill="#111111">occasional long-interval</text>
  <text x="680" y="388" text-anchor="middle" font-size="15" fill="#111111">reviews or a small deck</text>
  <line x1="200" y1="470" x2="840" y2="470" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="498" text-anchor="middle" font-size="16" fill="#111111">How long the knowledge must last: days to years</text>
  <line x1="180" y1="450" x2="180" y2="70" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="155" y="260" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 155 260)">Volume of material: little to a great deal</text>
  <text x="480" y="528" text-anchor="middle" font-size="13" fill="#333333">Schematic guide; boundaries between quadrants are gradual.</text>
</svg>
