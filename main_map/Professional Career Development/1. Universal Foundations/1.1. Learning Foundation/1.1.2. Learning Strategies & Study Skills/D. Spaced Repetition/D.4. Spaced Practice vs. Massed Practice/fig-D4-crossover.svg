  <line x1="140" y1="420" x2="890" y2="420" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="140" y1="420" x2="140" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="140" y1="420" x2="140" y2="426" stroke="#222222" stroke-width="1.5"/>
