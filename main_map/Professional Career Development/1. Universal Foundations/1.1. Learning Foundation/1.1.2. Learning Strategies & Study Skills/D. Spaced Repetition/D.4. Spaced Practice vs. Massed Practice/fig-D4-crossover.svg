  <line x1="362" y1="420" x2="362" y2="426" stroke="#222222" stroke-width="1.5"/>
  <text x="362" y="444" text-anchor="middle" font-size="14" fill="#111111">end of training</text>
  <line x1="584" y1="420" x2="584" y2="426" stroke="#222222" stroke-width="1.5"/>
  <text x="584" y="444" text-anchor="middle" font-size="14" fill="#111111">1 month</text>
  <line x1="880" y1="420" x2="880" y2="426" stroke="#222222" stroke-width="1.5"/>
