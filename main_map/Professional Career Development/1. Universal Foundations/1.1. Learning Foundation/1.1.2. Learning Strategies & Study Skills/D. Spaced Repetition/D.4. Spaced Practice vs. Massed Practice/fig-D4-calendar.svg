  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Cramming and spaced schedules on a four-week calendar</title>
  <desc>Two four-week calendars with the same twelve hours of study. In the cramming plan, all twelve hours fall in the last three days before the exam. In the spaced plan, sessions of one to two hours are spread across all four weeks with a short final review.</desc>
