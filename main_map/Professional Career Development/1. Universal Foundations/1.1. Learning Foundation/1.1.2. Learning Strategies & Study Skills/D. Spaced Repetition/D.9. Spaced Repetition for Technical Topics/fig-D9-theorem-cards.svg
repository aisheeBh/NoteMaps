<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Four cards from one theorem</title>
  <desc>The mean value theorem turned into four focused cards: the statement, the role of each hypothesis, a counterexample when a hypothesis fails, and the geometric idea of the proof.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="34" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">One theorem, four angles: the mean value theorem</text>
  <text x="250" y="68" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Statement</text>
  <rect x="30" y="80" width="440" height="190" rx="8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
  <rect x="40" y="90" width="420" height="170" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="250" y="120" text-anchor="middle" font-size="15" fill="#111111">f continuous on [a, b], differentiable</text>
  <text x="250" y="142" text-anchor="middle" font-size="15" fill="#111111">on (a, b). Then there is c in (a, b)</text>
  <text x="250" y="164" text-anchor="middle" font-size="15" fill="#111111">with f'(c) equal to ... ?</text>
  <line x1="54" y1="200" x2="446" y2="200" stroke="#999999" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="250" y="226" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">(f(b) - f(a)) / (b - a)</text>
  <text x="710" y="68" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Hypotheses</text>
  <rect x="490" y="80" width="440" height="190" rx="8" fill="url(#dots)" stroke="#7A5200" stroke-width="2.5" stroke-dasharray="8 4"/>
  <rect x="500" y="90" width="420" height="170" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="710" y="120" text-anchor="middle" font-size="15" fill="#111111">Which hypothesis fails for</text>
  <text x="710" y="142" text-anchor="middle" font-size="15" fill="#111111">f(x) = |x| on [-1, 1], and</text>
  <text x="710" y="164" text-anchor="middle" font-size="15" fill="#111111">does the conclusion still hold?</text>
  <line x1="514" y1="200" x2="906" y2="200" stroke="#999999" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="710" y="226" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">not differentiable at 0;</text>
  <text x="710" y="246" text-anchor="middle" font-size="14" fill="#111111">no such c exists</text>
  <text x="250" y="308" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Meaning</text>
  <rect x="30" y="320" width="440" height="190" rx="8" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="40" y="330" width="420" height="170" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/>
  <text x="250" y="360" text-anchor="middle" font-size="15" fill="#111111">Geometrically, what does the</text>
  <text x="250" y="382" text-anchor="middle" font-size="15" fill="#111111">theorem guarantee?</text>
  <line x1="54" y1="440" x2="446" y2="440" stroke="#999999" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="250" y="466" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">some tangent is parallel</text>
  <text x="250" y="486" text-anchor="middle" font-size="14" fill="#111111">to the chord from a to b</text>
  <text x="710" y="308" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Proof idea</text>
  <rect x="490" y="320" width="440" height="190" rx="8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
  <rect x="500" y="330" width="420" height="170" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="710" y="360" text-anchor="middle" font-size="15" fill="#111111">Which earlier theorem is applied</text>
  <text x="710" y="382" text-anchor="middle" font-size="15" fill="#111111">to f minus the chord line?</text>
  <line x1="514" y1="440" x2="906" y2="440" stroke="#999999" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="710" y="466" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Rolle's theorem</text>
  <text x="480" y="530" text-anchor="middle" font-size="13" fill="#333333">Illustrative cards; each is small, but together they capture statement, conditions, meaning and proof.</text>
</svg>
