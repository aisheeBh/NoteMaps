<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Recall probability under half-life regression</title>
  <desc>Predicted probability of recall falls by half every half-life. Curves are shown for half-lives of 2 days, 8 days and 30 days over 30 days.</desc>
