<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The bifurcation model of retrieval</title>
  <desc>Item memory strengths before practice form one distribution. After restudy, the whole distribution shifts modestly to the right. After retrieval without feedback, items that were retrieved shift far to the right, while items that were not retrieved stay where they were, so the distribution splits in two.</desc>
