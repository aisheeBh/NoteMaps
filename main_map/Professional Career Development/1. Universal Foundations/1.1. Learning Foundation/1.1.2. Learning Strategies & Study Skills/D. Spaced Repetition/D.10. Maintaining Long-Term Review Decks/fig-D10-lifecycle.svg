  <line x1="292" y1="420" x2="292" y2="426" stroke="#222222" stroke-width="1.5"/>
  <text x="292" y="444" text-anchor="middle" font-size="14" fill="#111111">1</text>
  <line x1="434" y1="420" x2="434" y2="426" stroke="#222222" stroke-width="1.5"/>
  <text x="434" y="444" text-anchor="middle" font-size="14" fill="#111111">2</text>
  <line x1="576" y1="420" x2="576" y2="426" stroke="#222222" stroke-width="1.5"/>
