<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Rewriting confusable cards</title>
  <desc>Left: two near-identical cards on the look-alike drug names hydroxyzine and hydralazine invite confusion. Right: rewritten cards that name the contrast explicitly and add a distinguishing cue, plus a third card that asks directly for the difference.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">Confusable cards and their rewritten versions</text>
  <text x="240" y="80" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Before: easily confused</text>
  <text x="720" y="80" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">After: contrast built in</text>
  <rect x="40" y="95" width="400" height="110" rx="8" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="50" y="105" width="380" height="90" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
  <text x="60" y="129" text-anchor="start" font-size="14" fill="#111111">Q: Hydroxyzine is used for?</text>
  <text x="60" y="183" text-anchor="start" font-size="14" fill="#111111" font-weight="bold">A: itching and anxiety</text>
  <rect x="40" y="225" width="400" height="110" rx="8" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="50" y="235" width="380" height="90" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
  <text x="60" y="259" text-anchor="start" font-size="14" fill="#111111">Q: Hydralazine is used for?</text>
  <text x="60" y="313" text-anchor="start" font-size="14" fill="#111111" font-weight="bold">A: high blood pressure</text>
  <rect x="520" y="95" width="400" height="110" rx="8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
  <rect x="530" y="105" width="380" height="90" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="540" y="129" text-anchor="start" font-size="14" fill="#111111">Q: Hydroxyzine (an antihistamine):</text>
  <text x="540" y="149" text-anchor="start" font-size="14" fill="#111111">main uses?</text>
  <text x="540" y="183" text-anchor="start" font-size="14" fill="#111111" font-weight="bold">A: itching, anxiety</text>
  <rect x="520" y="225" width="400" height="110" rx="8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
  <rect x="530" y="235" width="380" height="90" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="540" y="259" text-anchor="start" font-size="14" fill="#111111">Q: Hydralazine (a vasodilator):</text>
  <text x="540" y="279" text-anchor="start" font-size="14" fill="#111111">main use?</text>
  <text x="540" y="313" text-anchor="start" font-size="14" fill="#111111" font-weight="bold">A: high blood pressure</text>
  <rect x="520" y="355" width="400" height="110" rx="8" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="530" y="365" width="380" height="90" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/>
  <text x="540" y="389" text-anchor="start" font-size="14" fill="#111111">Q: Hydroxyzine or hydralazine:</text>
  <text x="540" y="409" text-anchor="start" font-size="14" fill="#111111">which one lowers blood pressure?</text>
  <text x="540" y="443" text-anchor="start" font-size="14" fill="#111111" font-weight="bold">A: hydralazine</text>
  <text x="240" y="400" text-anchor="middle" font-size="15" fill="#111111">Same form, different answers:</text>
  <text x="240" y="422" text-anchor="middle" font-size="15" fill="#111111">the learner guesses from the shape</text>
  <text x="480" y="520" text-anchor="middle" font-size="13" fill="#333333">Illustrative cards on a pair of look-alike drug names; clinical detail simplified.</text>
</svg>
