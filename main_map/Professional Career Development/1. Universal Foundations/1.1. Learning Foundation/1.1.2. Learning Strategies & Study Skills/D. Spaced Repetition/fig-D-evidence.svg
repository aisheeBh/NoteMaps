<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Confidence in the main claims about spaced repetition</title>
  <desc>Horizontal bars rating confidence in eight claims. Very high: spacing beats massing for retention; spaced retrieval beats spaced restudy. High: optimal gaps grow with retention interval; adaptive scheduling beats fixed schedules in prediction. Moderate: benefits for complex skills; spaced reinforcement improves workplace behaviour. Low or unsettled: expanding beats uniform gaps; specific products cause exam success.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="34" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">What the evidence supports, and how firmly</text>
  <text x="440" y="96" text-anchor="end" font-size="15" fill="#111111">Spacing beats massing for long-term retention</text>
  <rect x="455" y="78" width="380" height="28" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="843" y="80" width="84" height="24" fill="#FFFFFF"/>
  <text x="849" y="97" text-anchor="start" font-size="14" fill="#111111" font-weight="bold">very high</text>
  <text x="440" y="148" text-anchor="end" font-size="15" fill="#111111">Spaced retrieval beats spaced re-reading</text>
  <rect x="455" y="130" width="380" height="28" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="843" y="132" width="84" height="24" fill="#FFFFFF"/>
  <text x="849" y="149" text-anchor="start" font-size="14" fill="#111111" font-weight="bold">very high</text>
  <text x="440" y="200" text-anchor="end" font-size="15" fill="#111111">Best gap grows with how long knowledge must last</text>
  <rect x="455" y="182" width="285" height="28" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
  <rect x="748" y="184" width="44" height="24" fill="#FFFFFF"/>
  <text x="754" y="201" text-anchor="start" font-size="14" fill="#111111" font-weight="bold">high</text>
  <text x="440" y="252" text-anchor="end" font-size="15" fill="#111111">Adaptive models predict forgetting better than fixed rules</text>
  <rect x="455" y="234" width="285" height="28" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
  <rect x="748" y="236" width="44" height="24" fill="#FFFFFF"/>
  <text x="754" y="253" text-anchor="start" font-size="14" fill="#111111" font-weight="bold">high</text>
  <text x="440" y="304" text-anchor="end" font-size="15" fill="#111111">Spacing improves complex skills and transfer</text>
  <rect x="455" y="286" width="190" height="28" rx="0" fill="url(#dots)" stroke="#7A5200" stroke-width="2.5" stroke-dasharray="8 4"/>
  <rect x="653" y="288" width="76" height="24" fill="#FFFFFF"/>
  <text x="659" y="305" text-anchor="start" font-size="14" fill="#111111" font-weight="bold">moderate</text>
  <text x="440" y="356" text-anchor="end" font-size="15" fill="#111111">Spaced reinforcement changes workplace behaviour</text>
  <rect x="455" y="338" width="190" height="28" rx="0" fill="url(#dots)" stroke="#7A5200" stroke-width="2.5" stroke-dasharray="8 4"/>
  <rect x="653" y="340" width="76" height="24" fill="#FFFFFF"/>
  <text x="659" y="357" text-anchor="start" font-size="14" fill="#111111" font-weight="bold">moderate</text>
  <text x="440" y="408" text-anchor="end" font-size="15" fill="#111111">Expanding gaps beat equal gaps</text>
  <rect x="455" y="390" width="95" height="28" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="558" y="392" width="140" height="24" fill="#FFFFFF"/>
  <text x="564" y="409" text-anchor="start" font-size="14" fill="#111111" font-weight="bold">low or unsettled</text>
  <text x="440" y="460" text-anchor="end" font-size="15" fill="#111111">Particular apps or decks cause exam success</text>
  <rect x="455" y="442" width="95" height="28" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="558" y="444" width="140" height="24" fill="#FFFFFF"/>
  <text x="564" y="461" text-anchor="start" font-size="14" fill="#111111" font-weight="bold">low or unsettled</text>
  <text x="480" y="520" text-anchor="middle" font-size="13" fill="#333333">Judgement summarising meta-analyses, trials and benchmarks described in the text.</text>
</svg>
