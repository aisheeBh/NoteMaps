  <text x="263" y="454" text-anchor="middle" font-size="14" fill="#111111">5</text>
  <line x1="387" y1="430" x2="387" y2="436" stroke="#222222" stroke-width="1.5"/>
  <text x="387" y="454" text-anchor="middle" font-size="14" fill="#111111">10</text>
  <line x1="510" y1="430" x2="510" y2="436" stroke="#222222" stroke-width="1.5"/>
  <text x="510" y="454" text-anchor="middle" font-size="14" fill="#111111">15</text>
  <line x1="633" y1="430" x2="633" y2="436" stroke="#222222" stroke-width="1.5"/>
