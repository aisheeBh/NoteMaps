<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Exponential and power-law forgetting</title>
  <desc>Two curves start at the same level and pass through the same point at one day. The exponential curve keeps falling at a constant proportional rate and approaches zero; the power curve falls faster at first but then flattens and keeps a long tail of retention.</desc>
