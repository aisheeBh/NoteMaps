  <text x="288" y="454" text-anchor="middle" font-size="14" fill="#111111">10</text>
  <line x1="436" y1="430" x2="436" y2="436" stroke="#222222" stroke-width="1.5"/>
  <text x="436" y="454" text-anchor="middle" font-size="14" fill="#111111">20</text>
