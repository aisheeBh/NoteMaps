<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The questions used to judge how far a strategy's benefits generalise</title>
  <desc>A strategy at the centre is surrounded by four questions of generality: learners, materials, criterion tasks and learning conditions, each with examples of what to check. Below, a fifth practical question, cost, decides whether the strategy is adopted. Together they produce a judgement of utility.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Does the benefit generalise?</text>

  <!-- connectors -->
  <line x1="400" y1="250" x2="330" y2="200" stroke="#333333" stroke-width="2"/>
  <line x1="560" y1="250" x2="630" y2="200" stroke="#333333" stroke-width="2"/>
  <line x1="400" y1="300" x2="330" y2="350" stroke="#333333" stroke-width="2"/>
  <line x1="560" y1="300" x2="630" y2="350" stroke="#333333" stroke-width="2"/>

  <!-- centre -->
  <rect x="380" y="230" width="200" height="90" rx="10" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="480" y="270" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">A STRATEGY</text>
  <text x="480" y="296" text-anchor="middle" font-size="15" fill="#FFFFFF">under evaluation</text>

  <!-- four question boxes -->
  <g fill="#111111">
    <rect x="30" y="66" width="320" height="150" rx="8" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2.5"/>
    <rect x="30" y="66" width="320" height="40" rx="8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
    <rect x="44" y="72" width="292" height="28" fill="#FFFFFF"/>
    <text x="190" y="92" text-anchor="middle" font-size="18" font-weight="bold">1. LEARNERS</text>
    <text x="50" y="136" font-size="15">Ages and levels of education?</text>
    <text x="50" y="160" font-size="15">High and low prior knowledge?</text>
    <text x="50" y="184" font-size="15">Different abilities?</text>

    <rect x="610" y="66" width="320" height="150" rx="8" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2.5"/>
    <rect x="610" y="66" width="320" height="40" rx="8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
    <rect x="624" y="72" width="292" height="28" fill="#FFFFFF"/>
    <text x="770" y="92" text-anchor="middle" font-size="18" font-weight="bold">2. MATERIALS</text>
    <text x="630" y="136" font-size="15">Facts and vocabulary?</text>
    <text x="630" y="160" font-size="15">Concepts and procedures?</text>
    <text x="630" y="184" font-size="15">Texts, diagrams, problems?</text>

    <rect x="30" y="334" width="320" height="150" rx="8" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2.5"/>
    <rect x="30" y="334" width="320" height="40" rx="8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
    <rect x="44" y="340" width="292" height="28" fill="#FFFFFF"/>
    <text x="190" y="360" text-anchor="middle" font-size="18" font-weight="bold">3. CRITERION TASKS</text>
    <text x="50" y="404" font-size="15">Delayed, not only immediate?</text>
    <text x="50" y="428" font-size="15">Problem-solving and transfer?</text>
    <text x="50" y="452" font-size="15">Performance at work?</text>

    <rect x="610" y="334" width="320" height="150" rx="8" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2.5"/>
    <rect x="610" y="334" width="320" height="40" rx="8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
    <rect x="624" y="340" width="292" height="28" fill="#FFFFFF"/>
    <text x="770" y="360" text-anchor="middle" font-size="18" font-weight="bold">4. CONDITIONS</text>
    <text x="630" y="404" font-size="15">Real courses and workplaces?</text>
    <text x="630" y="428" font-size="15">Imperfect execution?</text>
    <text x="630" y="452" font-size="15">Varying amounts of practice?</text>
  </g>

  <!-- cost and utility -->
  <line x1="480" y1="320" x2="480" y2="510" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="150" y="516" width="300" height="80" rx="8" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="166" y="526" width="268" height="60" fill="#FFFFFF"/>
  <text x="300" y="550" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">5. COST</text>
  <text x="300" y="574" text-anchor="middle" font-size="15" fill="#111111">time, training, discipline</text>
  <line x1="450" y1="556" x2="502" y2="556" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="510" y="516" width="300" height="80" rx="8" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="526" y="526" width="268" height="60" fill="#FFFFFF"/>
  <text x="660" y="550" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">UTILITY</text>
  <text x="660" y="574" text-anchor="middle" font-size="15" fill="#111111">benefit, breadth, practicality</text>
</svg>
