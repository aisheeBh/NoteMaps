<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Assessment calendar for a twelve-week plan</title>
  <desc>Five rows across weeks 0 to 13. Baseline: one diagnostic in week 0. Session checks: short checks in every study week. Weekly cumulative checks: one each week from 1 to 12, except mock weeks. Milestone mocks: weeks 4, 8 and 11. Final assessment: week 13. Each milestone is followed by weeks in which its results can be acted on.</desc>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Five layers of checks across twelve weeks</text>
