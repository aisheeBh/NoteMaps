<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Self-scores and manager scores on a memo</title>
  <desc>Dot plot for four rubric criteria scored 1 to 4. Clear recommendation: self 4, manager 3. Evidence and analysis: both 3. Options compared: self 3, manager 2. Risks and next steps: both 2. The learner's over-scoring is confined to the two criteria about decisiveness and comparison.</desc>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Where self-judgement and the manager's judgement differ</text>
  <g stroke="#DDDDDD" stroke-width="1">
    <line x1="400" y1="80" x2="400" y2="400"/><line x1="530" y1="80" x2="530" y2="400"/>
    <line x1="660" y1="80" x2="660" y2="400"/><line x1="790" y1="80" x2="790" y2="400"/>
  </g>
  <g font-size="15" fill="#111111" text-anchor="middle">
    <text x="400" y="425">1</text><text x="530" y="425">2</text><text x="660" y="425">3</text><text x="790" y="425">4</text>
  </g>
  <text x="595" y="452" text-anchor="middle" font-size="16" fill="#111111">Rubric level</text>
  <g font-size="16" fill="#111111" text-anchor="end">
    <text x="370" y="125">Clear recommendation</text>
    <text x="370" y="205">Evidence and analysis</text>
    <text x="370" y="285">Options compared</text>
    <text x="370" y="365">Risks and next steps</text>
  </g>
  <line x1="660" y1="120" x2="790" y2="120" stroke="#8B0000" stroke-width="3" stroke-dasharray="3 3"/>
  <line x1="530" y1="280" x2="660" y2="280" stroke="#8B0000" stroke-width="3" stroke-dasharray="3 3"/>
  <g stroke="#111111" stroke-width="2.5">
    <circle cx="790" cy="120" r="11" fill="#FFFFFF"/>
    <rect x="649" y="109" width="22" height="22" fill="#111111"/>
    <circle cx="645" cy="200" r="11" fill="#FFFFFF"/>
    <rect x="664" y="189" width="22" height="22" fill="#111111"/>
    <circle cx="660" cy="280" r="11" fill="#FFFFFF"/>
    <rect x="519" y="269" width="22" height="22" fill="#111111"/>
    <circle cx="515" cy="360" r="11" fill="#FFFFFF"/>
    <rect x="534" y="349" width="22" height="22" fill="#111111"/>
  </g>
  <g font-size="14" fill="#111111">
    <text x="808" y="118">self 4</text><text x="808" y="136">manager 3</text>
    <text x="700" y="205">both 3</text>
    <text x="680" y="278">self 3</text><text x="680" y="296">manager 2</text>
    <text x="570" y="365">both 2</text>
  </g>
  <rect x="60" y="460" width="840" height="1" fill="#FFFFFF"/>
  <circle cx="90" cy="478" r="9" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
  <text x="106" y="483" font-size="14" fill="#111111">self-score</text>
  <rect x="200" y="469" width="18" height="18" fill="#111111"/>
  <text x="226" y="483" font-size="14" fill="#111111">manager's score</text>
</svg>
