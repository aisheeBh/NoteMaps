<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Item characteristic curves</title>
  <desc>Probability of a correct answer plotted against ability from minus 3 to plus 3. An easy item with difficulty minus 1 and guessing 0.2 rises early. A hard item with difficulty plus 1.5, higher discrimination and guessing 0.2 rises later and more steeply. Both curves start near the guessing level of 0.2 on the left. The difficulty of each item is where its curve is halfway between the guessing level and 1.</desc>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">How the chance of success rises with ability for two items</text>
  <g stroke="#DDDDDD" stroke-width="1">
    <line x1="120" y1="368.0" x2="840" y2="368.0"/>
    <line x1="120" y1="296.0" x2="840" y2="296.0"/>
    <line x1="120" y1="224.0" x2="840" y2="224.0"/>
    <line x1="120" y1="152.0" x2="840" y2="152.0"/>
    <line x1="120" y1="80.0" x2="840" y2="80.0"/>
  </g>
  <line x1="120" y1="440" x2="840" y2="440" stroke="#222222" stroke-width="2.5"/>
  <line x1="120" y1="440" x2="120" y2="70" stroke="#222222" stroke-width="2.5"/>
  <g font-size="14" fill="#111111" text-anchor="end">
    <text x="110" y="445.0">0.0</text>
    <text x="110" y="373.0">0.2</text>
    <text x="110" y="301.0">0.4</text>
    <text x="110" y="229.0">0.6</text>
    <text x="110" y="157.0">0.8</text>
    <text x="110" y="85.0">1.0</text>
  </g>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="120" y="462">-3</text>
    <text x="240" y="462">-2</text>
    <text x="360" y="462">-1</text>
    <text x="480" y="462">0</text>
    <text x="600" y="462">+1</text>
    <text x="720" y="462">+2</text>
    <text x="840" y="462">+3</text>
  </g>
  <text x="480" y="492" text-anchor="middle" font-size="16" fill="#111111">Ability (theta)</text>
  <text x="50" y="255" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 50 255)">Probability of a correct answer</text>
