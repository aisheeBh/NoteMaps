<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Question-bank scores compared with unseen-item scores</title>
  <desc>Schematic. Over repeated passes through the same question bank, the score on the bank rises steeply towards 95 percent. The score on unseen items of the same type rises more slowly and levels off near 70 percent, close to the pass mark. The vertical gap between the two lines is the illusion created by recognising familiar items.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Familiar items flatter; unseen items tell the truth</text>
  <line x1="110" y1="440" x2="880" y2="440" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="110" y1="440" x2="110" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="50" y="255" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 50 255)">Score</text>
  <g font-size="14" fill="#111111" text-anchor="end">
    <text x="100" y="445">40%</text><text x="100" y="365">60%</text><text x="100" y="285">80%</text><text x="100" y="205">100%</text>
  </g>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="160" y="462">pass 1</text><text x="340" y="462">pass 2</text><text x="520" y="462">pass 3</text><text x="700" y="462">pass 4</text>
  </g>
  <text x="480" y="490" text-anchor="middle" font-size="16" fill="#111111">Repeated passes through the same question bank</text>
  <line x1="110" y1="325" x2="860" y2="325" stroke="#555555" stroke-width="1.5" stroke-dasharray="2 4"/>
  <rect x="116" y="304" width="110" height="18" fill="#FFFFFF"/><text x="120" y="318" font-size="14" fill="#111111">pass mark 70%</text>
  <path d="M160 375 C 300 300, 420 250, 520 235 S 700 222, 820 220 L 820 322 C 700 324, 600 330, 520 336 S 300 355, 160 375 Z" fill="url(#lines)" opacity="0.7"/>
  <path d="M160 375 C 300 300, 420 250, 520 235 S 700 222, 820 220" fill="none" stroke="#7A5200" stroke-width="4" stroke-dasharray="10 6"/>
  <path d="M160 375 C 300 355, 420 342, 520 336 S 700 324, 820 322" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <rect x="560" y="186" width="250" height="24" fill="#FFFFFF"/>
  <text x="566" y="204" font-size="16" font-weight="bold" fill="#111111">Score on the familiar bank</text>
  <rect x="560" y="344" width="250" height="24" fill="#FFFFFF"/>
  <text x="566" y="362" font-size="16" font-weight="bold" fill="#111111">Score on unseen items</text>
  <rect x="610" y="262" width="170" height="44" fill="#FFFFFF" stroke="#8B0000" stroke-width="1.5"/>
  <text x="695" y="281" text-anchor="middle" font-size="14" fill="#111111">gap = recognition,</text>
  <text x="695" y="298" text-anchor="middle" font-size="14" fill="#111111">not capability</text>
  <text x="110" y="525" font-size="13" fill="#333333">Schematic; not plotted from a single dataset.</text>
</svg>
