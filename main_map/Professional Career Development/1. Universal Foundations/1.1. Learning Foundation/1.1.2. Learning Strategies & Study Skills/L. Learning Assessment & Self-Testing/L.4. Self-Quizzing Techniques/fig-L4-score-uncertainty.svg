<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Uncertainty of an 80 percent quiz score by number of items</title>
  <desc>Approximate 95 percent ranges for a learner who answers 80 percent of items correctly. With 5 items the range runs from about 45 to 100 percent; with 10 items from about 55 to 100; with 20 items from about 62 to 98; with 40 items from about 67 to 93; with 80 items from about 71 to 89. Ranges calculated from the standard error of a proportion.</desc>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">The same 80% score, measured with more and more items</text>
  <line x1="120" y1="440" x2="880" y2="440" stroke="#222222" stroke-width="2.5"/>
  <line x1="120" y1="440" x2="120" y2="70" stroke="#222222" stroke-width="2.5"/>
  <g stroke="#DDDDDD" stroke-width="1">
    <line x1="120" y1="80" x2="880" y2="80"/><line x1="120" y1="140" x2="880" y2="140"/>
    <line x1="120" y1="260" x2="880" y2="260"/><line x1="120" y1="320" x2="880" y2="320"/>
    <line x1="120" y1="380" x2="880" y2="380"/>
  </g>
  <g font-size="14" fill="#111111" text-anchor="end">
    <text x="110" y="445">40%</text><text x="110" y="385">50%</text><text x="110" y="325">60%</text>
    <text x="110" y="265">70%</text><text x="110" y="205">80%</text><text x="110" y="145">90%</text><text x="110" y="85">100%</text>
  </g>
  <text x="50" y="260" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 50 260)">Plausible true level</text>
  <line x1="120" y1="200" x2="880" y2="200" stroke="#1F3B5C" stroke-width="2" stroke-dasharray="10 6"/>
  <rect x="770" y="204" width="104" height="20" fill="#FFFFFF"/>
  <text x="776" y="219" font-size="14" fill="#111111">observed 80%</text>
  <g stroke="#111111" stroke-width="4">
    <line x1="210" y1="80" x2="210" y2="410"/><line x1="190" y1="410" x2="230" y2="410"/>
    <line x1="350" y1="80" x2="350" y2="350"/><line x1="330" y1="350" x2="370" y2="350"/>
    <line x1="490" y1="92" x2="490" y2="308"/><line x1="470" y1="92" x2="510" y2="92"/><line x1="470" y1="308" x2="510" y2="308"/>
    <line x1="630" y1="122" x2="630" y2="278"/><line x1="610" y1="122" x2="650" y2="122"/><line x1="610" y1="278" x2="650" y2="278"/>
    <line x1="770" y1="146" x2="770" y2="254"/><line x1="750" y1="146" x2="790" y2="146"/><line x1="750" y1="254" x2="790" y2="254"/>
  </g>
  <g fill="#FFFFFF" stroke="#111111" stroke-width="2.5">
    <circle cx="210" cy="200" r="8"/><circle cx="350" cy="200" r="8"/><circle cx="490" cy="200" r="8"/>
    <circle cx="630" cy="200" r="8"/><circle cx="770" cy="200" r="8"/>
  </g>
  <g font-size="15" fill="#111111" text-anchor="middle">
    <text x="210" y="465">5 items</text><text x="350" y="465">10 items</text><text x="490" y="465">20 items</text>
    <text x="630" y="465">40 items</text><text x="770" y="465">80 items</text>
  </g>
  <g font-size="14" fill="#111111">
    <text x="236" y="400">about 45% to 100%</text>
    <text x="376" y="345">55% to 100%</text>
    <text x="516" y="300">62% to 98%</text>
    <text x="656" y="272">67% to 93%</text>
    <text x="796" y="250">71% to 89%</text>
  </g>
  <text x="480" y="495" text-anchor="middle" font-size="16" fill="#111111">Number of items in the quiz</text>
  <text x="120" y="535" font-size="13" fill="#333333">Approximate 95% ranges, p = 0.8, from SE = square root of p(1 - p)/n; capped at 100%. Real items are not fully independent.</text>
</svg>
