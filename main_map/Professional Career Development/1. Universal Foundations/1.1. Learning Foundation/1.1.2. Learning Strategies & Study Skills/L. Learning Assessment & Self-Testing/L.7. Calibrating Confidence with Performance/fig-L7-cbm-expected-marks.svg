<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Expected marks under certainty-based marking</title>
  <desc>Expected mark plotted against the probability of being right, from 0 to 1, for the three certainty levels. Level 1 rises gently from 0 to 1. Level 2 rises from minus 2 to plus 2. Level 3 rises steeply from minus 6 to plus 3. Level 1 is best below a probability of about 0.67, level 2 between about 0.67 and 0.8, and level 3 above 0.8.</desc>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Honest certainty pays best under certainty-based marking</text>
  <rect x="120" y="70" width="480" height="370" fill="#F2F2F2"/>
  <rect x="600" y="70" width="96" height="370" fill="#E6E6E6"/>
  <rect x="696" y="70" width="144" height="370" fill="#D9D9D9"/>
  <text x="360" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">level 1 best</text>
  <text x="648" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">level 2</text>
  <text x="768" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">level 3 best</text>
  <line x1="120" y1="440" x2="840" y2="440" stroke="#222222" stroke-width="2.5"/>
  <line x1="120" y1="440" x2="120" y2="70" stroke="#222222" stroke-width="2.5"/>
  <line x1="120" y1="200" x2="840" y2="200" stroke="#555555" stroke-width="1.5"/>
  <g font-size="14" fill="#111111" text-anchor="end">
    <text x="110" y="85">+3</text><text x="110" y="125">+2</text><text x="110" y="165">+1</text><text x="110" y="205">0</text>
    <text x="110" y="285">-2</text><text x="110" y="365">-4</text><text x="110" y="445">-6</text>
  </g>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="120" y="462">0</text><text x="264" y="462">0.2</text><text x="408" y="462">0.4</text><text x="552" y="462">0.6</text>
    <text x="696" y="462">0.8</text><text x="840" y="462">1.0</text>
  </g>
  <text x="480" y="492" text-anchor="middle" font-size="16" fill="#111111">Probability that the answer is right</text>
  <text x="50" y="255" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 50 255)">Expected mark</text>
  <line x1="600" y1="70" x2="600" y2="440" stroke="#111111" stroke-width="1.5" stroke-dasharray="2 4"/>
  <line x1="696" y1="70" x2="696" y2="440" stroke="#111111" stroke-width="1.5" stroke-dasharray="2 4"/>
  <line x1="120" y1="200" x2="840" y2="160" stroke="#1E5E24" stroke-width="4"/>
  <line x1="120" y1="280" x2="840" y2="120" stroke="#1F3B5C" stroke-width="4" stroke-dasharray="10 6"/>
  <line x1="120" y1="440" x2="840" y2="80" stroke="#8B0000" stroke-width="4" stroke-dasharray="3 4"/>
  <rect x="160" y="128" width="150" height="22" fill="#FFFFFF"/>
  <text x="166" y="144" font-size="15" font-weight="bold" fill="#111111">Level 1: 1 / 0</text>
  <rect x="160" y="290" width="160" height="22" fill="#FFFFFF"/>
  <text x="166" y="306" font-size="15" font-weight="bold" fill="#111111">Level 2: 2 / -2</text>
  <rect x="300" y="370" width="160" height="22" fill="#FFFFFF"/>
  <text x="306" y="386" font-size="15" font-weight="bold" fill="#111111">Level 3: 3 / -6</text>
  <rect x="540" y="400" width="54" height="22" fill="#FFFFFF"/>
  <text x="567" y="416" text-anchor="middle" font-size="14" fill="#111111">0.67</text>
  <rect x="700" y="400" width="44" height="22" fill="#FFFFFF"/>
  <text x="722" y="416" text-anchor="middle" font-size="14" fill="#111111">0.8</text>
  <text x="120" y="530" font-size="13" fill="#333333">Marks shown as "if right / if wrong". Lines computed from the scheme; the upper envelope is the best choice at each probability.</text>
</svg>
