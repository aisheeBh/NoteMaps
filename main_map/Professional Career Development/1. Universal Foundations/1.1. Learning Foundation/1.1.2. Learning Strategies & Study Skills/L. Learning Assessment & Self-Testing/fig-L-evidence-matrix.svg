<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Evidence by fidelity and independence</title>
  <desc>A two by two field. Horizontal axis: independence of the judgement, from self-judged to independently judged. Vertical axis: fidelity to real use, from low to high. Low fidelity, self-judged: feeling of familiarity, self-quiz marked by oneself. Low fidelity, independent: automated quiz, peer-marked short answers. High fidelity, self-judged: own review of real work against a rubric, timed mock marked by oneself. High fidelity, independent: expert observation of real work, client and outcome data, externally marked mock. Arrows suggest using cheap evidence often and strong evidence occasionally.</desc>
  <defs>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Cheap evidence to steer, strong evidence to confirm</text>
  <rect x="180" y="70" width="340" height="220" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="520" y="70" width="340" height="220" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="180" y="290" width="340" height="220" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <rect x="520" y="290" width="340" height="220" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <g font-size="15" fill="#111111">
    <rect x="205" y="95" width="290" height="170" fill="#FFFFFF" stroke="#1F3B5C"/>
    <text x="350" y="122" text-anchor="middle" font-size="17" font-weight="bold">Realistic, self-judged</text>
    <text x="220" y="152">own review of real work</text>
    <text x="220" y="172">against a rubric;</text>
    <text x="220" y="196">timed mock, self-marked</text>
    <text x="220" y="232" font-style="italic">valuable if marking is strict</text>
    <rect x="545" y="95" width="290" height="170" fill="#FFFFFF" stroke="#1E5E24" stroke-width="2"/>
    <text x="690" y="122" text-anchor="middle" font-size="17" font-weight="bold">Realistic, independent</text>
    <text x="560" y="152">expert observation of real work;</text>
    <text x="560" y="176">client and outcome data;</text>
    <text x="560" y="200">externally marked mock</text>
    <text x="560" y="232" font-style="italic">strongest, costly, occasional</text>
    <rect x="205" y="315" width="290" height="170" fill="#FFFFFF" stroke="#666666"/>
    <text x="350" y="342" text-anchor="middle" font-size="17" font-weight="bold">Simplified, self-judged</text>
    <text x="220" y="372">feeling of familiarity;</text>
    <text x="220" y="396">self-quiz marked by oneself</text>
    <text x="220" y="432" font-style="italic">cheap, frequent, easily fooled</text>
    <rect x="545" y="315" width="290" height="170" fill="#FFFFFF" stroke="#7A5200"/>
    <text x="690" y="342" text-anchor="middle" font-size="17" font-weight="bold">Simplified, independent</text>
    <text x="560" y="372">automated quiz with a key;</text>
    <text x="560" y="396">peer-marked short answers</text>
    <text x="560" y="432" font-style="italic">cheap, honest within its scope</text>
  </g>
  <text x="350" y="540" text-anchor="middle" font-size="16" fill="#111111">Judged by the learner</text>
  <text x="690" y="540" text-anchor="middle" font-size="16" fill="#111111">Judged independently</text>
  <text x="520" y="575" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Independence of the judgement</text>
  <text x="165" y="185" text-anchor="end" font-size="16" fill="#111111">High</text>
  <text x="165" y="405" text-anchor="end" font-size="16" fill="#111111">Low</text>
  <text x="50" y="290" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111" transform="rotate(-90 50 290)">Fidelity to real use</text>
</svg>
