<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Assessments from formative to summative</title>
  <desc>A horizontal continuum. At the formative end are a question asked during study, a self-quiz and a code review or coaching session. In the middle are a progress test, a mock examination and graded coursework. At the summative end are a final examination, a professional certification and a licensing examination. Stakes and the need for reliability rise from left to right; detail and speed of feedback rise from right to left.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
    <linearGradient id="grad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#D3ECD3"/>
      <stop offset="0.5" stop-color="#F2F2F2"/>
      <stop offset="1" stop-color="#1F3B5C"/>
    </linearGradient>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">From formative to summative: stakes rise, feedback thins</text>
  <rect x="60" y="250" width="840" height="36" fill="url(#grad)" stroke="#222222" stroke-width="2"/>
  <text x="70" y="110" font-size="18" font-weight="bold" fill="#111111">FORMATIVE</text>
  <text x="900" y="110" text-anchor="end" font-size="18" font-weight="bold" fill="#111111">SUMMATIVE</text>
  <g font-size="15" fill="#111111" text-anchor="middle">
    <line x1="140" y1="250" x2="140" y2="200" stroke="#222222" stroke-width="1.5"/>
    <rect x="70" y="140" width="140" height="58" fill="#FFFFFF" stroke="#1E5E24" stroke-width="2"/>
    <text x="140" y="164">Question during</text><text x="140" y="184">study</text>
    <line x1="290" y1="286" x2="290" y2="330" stroke="#222222" stroke-width="1.5"/>
    <rect x="220" y="332" width="140" height="58" fill="#FFFFFF" stroke="#1E5E24" stroke-width="2"/>
    <text x="290" y="356">Self-quiz</text><text x="290" y="376">after a delay</text>
    <line x1="290" y1="250" x2="290" y2="200" stroke="#222222" stroke-width="1.5"/>
    <rect x="220" y="140" width="140" height="58" fill="#FFFFFF" stroke="#1E5E24" stroke-width="2"/>
    <text x="290" y="164">Code review,</text><text x="290" y="184">coaching</text>
    <line x1="440" y1="286" x2="440" y2="330" stroke="#222222" stroke-width="1.5"/>
    <rect x="370" y="332" width="140" height="58" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
    <text x="440" y="356">Progress</text><text x="440" y="376">test</text>
    <line x1="520" y1="250" x2="520" y2="200" stroke="#222222" stroke-width="1.5"/>
    <rect x="450" y="140" width="140" height="58" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
    <text x="520" y="164">Mock exam</text><text x="520" y="184">(interim)</text>
    <line x1="600" y1="286" x2="600" y2="330" stroke="#222222" stroke-width="1.5"/>
    <rect x="530" y="332" width="140" height="58" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
    <text x="600" y="356">Graded</text><text x="600" y="376">coursework</text>
    <line x1="680" y1="250" x2="680" y2="200" stroke="#222222" stroke-width="1.5"/>
    <rect x="610" y="140" width="140" height="58" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="3"/>
    <text x="680" y="164">Final</text><text x="680" y="184">examination</text>
    <line x1="760" y1="286" x2="760" y2="330" stroke="#222222" stroke-width="1.5"/>
    <rect x="690" y="332" width="140" height="58" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="3"/>
    <text x="760" y="356">Professional</text><text x="760" y="376">certification</text>
    <line x1="840" y1="250" x2="840" y2="200" stroke="#222222" stroke-width="1.5"/>
    <rect x="770" y="140" width="140" height="58" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="3"/>
    <text x="840" y="164">Licensing</text><text x="840" y="184">examination</text>
  </g>
  <line x1="120" y1="440" x2="860" y2="440" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="490" y="430" text-anchor="middle" font-size="16" fill="#111111">stakes, standardisation and need for reliability rise</text>
  <line x1="860" y1="490" x2="120" y2="490" stroke="#222222" stroke-width="2.5" stroke-dasharray="10 6" marker-end="url(#arrow)"/>
  <text x="490" y="480" text-anchor="middle" font-size="16" fill="#111111">detail, speed and usefulness of feedback rise</text>
  <text x="60" y="535" font-size="13" fill="#333333">Placement is typical, not fixed: the same instrument moves along the line depending on how its result is used.</text>
</svg>
