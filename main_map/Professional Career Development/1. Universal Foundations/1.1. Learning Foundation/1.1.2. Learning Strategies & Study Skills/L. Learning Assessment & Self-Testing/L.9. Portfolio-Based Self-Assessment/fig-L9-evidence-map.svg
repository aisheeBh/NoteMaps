<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Portfolio evidence mapped against competence areas</title>
  <desc>A grid with five competence areas as rows (A knowledge, B design, C leadership, D communication, E professional commitment) and six pieces of evidence as columns (four design projects, a graduate mentoring record and a CPD log). Filled circles mark strong evidence, half circles partial evidence, empty cells none. Rows A and B are well covered; row C has a single partial mark; rows D and E have only partial marks. Annotations flag C as thin and D and E as partial.</desc>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Which competences does the evidence actually show?</text>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="345" y="80">Bridge</text><text x="345" y="98">design</text>
    <text x="435" y="80">Flood</text><text x="435" y="98">scheme</text>
    <text x="525" y="80">Road</text><text x="525" y="98">junction</text>
    <text x="615" y="80">Drainage</text><text x="615" y="98">study</text>
    <text x="705" y="80">Mentoring</text><text x="705" y="98">graduate</text>
    <text x="795" y="80">CPD</text><text x="795" y="98">log</text>
  </g>
  <g font-size="15" fill="#111111">
    <text x="40" y="146">A Knowledge and understanding</text>
    <text x="40" y="216">B Design and development</text>
    <text x="40" y="286">C Responsibility and leadership</text>
    <text x="40" y="356">D Communication</text>
    <text x="40" y="426">E Professional commitment</text>
  </g>
  <g stroke="#BBBBBB" stroke-width="1">
    <line x1="300" y1="110" x2="840" y2="110"/><line x1="300" y1="180" x2="840" y2="180"/>
    <line x1="300" y1="250" x2="840" y2="250"/><line x1="300" y1="320" x2="840" y2="320"/>
    <line x1="300" y1="390" x2="840" y2="390"/><line x1="300" y1="460" x2="840" y2="460"/>
    <line x1="300" y1="110" x2="300" y2="460"/><line x1="390" y1="110" x2="390" y2="460"/>
    <line x1="480" y1="110" x2="480" y2="460"/><line x1="570" y1="110" x2="570" y2="460"/>
    <line x1="660" y1="110" x2="660" y2="460"/><line x1="750" y1="110" x2="750" y2="460"/>
    <line x1="840" y1="110" x2="840" y2="460"/>
  </g>
  <g fill="#1F3B5C" stroke="#000000" stroke-width="1.5">
    <circle cx="345" cy="145" r="14"/><circle cx="435" cy="145" r="14"/><circle cx="525" cy="145" r="14"/><circle cx="615" cy="145" r="14"/>
    <circle cx="345" cy="215" r="14"/><circle cx="435" cy="215" r="14"/><circle cx="525" cy="215" r="14"/><circle cx="615" cy="215" r="14"/>
  </g>
  <g stroke="#000000" stroke-width="1.5">
    <circle cx="705" cy="285" r="14" fill="#FFFFFF"/><path d="M705 271 A14 14 0 0 0 705 299 Z" fill="#1F3B5C"/>
    <circle cx="435" cy="355" r="14" fill="#FFFFFF"/><path d="M435 341 A14 14 0 0 0 435 369 Z" fill="#1F3B5C"/>
    <circle cx="795" cy="425" r="14" fill="#FFFFFF"/><path d="M795 411 A14 14 0 0 0 795 439 Z" fill="#1F3B5C"/>
  </g>
  <g font-size="14" fill="#111111">
    <rect x="848" y="272" width="104" height="26" fill="#F6CACA" stroke="#8B0000" stroke-dasharray="3 3"/>
    <text x="856" y="290" font-weight="bold">thin: a gap</text>
    <rect x="848" y="342" width="104" height="26" fill="#FFE6A8" stroke="#7A5200" stroke-dasharray="8 4"/>
    <text x="856" y="360" font-weight="bold">partial</text>
    <rect x="848" y="412" width="104" height="26" fill="#FFE6A8" stroke="#7A5200" stroke-dasharray="8 4"/>
    <text x="856" y="430" font-weight="bold">partial</text>
    <rect x="848" y="132" width="104" height="26" fill="#D3ECD3" stroke="#1E5E24"/>
    <text x="856" y="150" font-weight="bold">strong</text>
    <rect x="848" y="202" width="104" height="26" fill="#D3ECD3" stroke="#1E5E24"/>
    <text x="856" y="220" font-weight="bold">strong</text>
  </g>
  <circle cx="60" cy="505" r="12" fill="#1F3B5C" stroke="#000000" stroke-width="1.5"/>
  <text x="80" y="510" font-size="14" fill="#111111">strong evidence</text>
  <circle cx="230" cy="505" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/><path d="M230 493 A12 12 0 0 0 230 517 Z" fill="#1F3B5C"/>
  <text x="250" y="510" font-size="14" fill="#111111">partial evidence</text>
  <rect x="400" y="493" width="24" height="24" fill="#FFFFFF" stroke="#BBBBBB"/>
  <text x="432" y="510" font-size="14" fill="#111111">empty cell: no evidence</text>
</svg>
