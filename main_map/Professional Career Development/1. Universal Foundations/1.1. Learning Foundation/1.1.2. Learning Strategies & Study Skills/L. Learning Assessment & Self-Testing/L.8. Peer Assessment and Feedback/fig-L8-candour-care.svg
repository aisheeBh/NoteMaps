<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Care and directness in feedback</title>
  <desc>A two by two grid after Kim Scott. Horizontal axis: directness about the work, low to high. Vertical axis: care for the person, low to high. High care and high directness: candid, helpful feedback. High care and low directness: ruinous empathy, kind but useless. Low care and high directness: obnoxious aggression, accurate but resented. Low care and low directness: manipulative insincerity, vague and political.</desc>
  <defs>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Feedback that helps combines care with directness</text>
  <rect x="180" y="70" width="340" height="220" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="520" y="70" width="340" height="220" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="180" y="290" width="340" height="220" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <rect x="520" y="290" width="340" height="220" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <g font-size="15" fill="#111111">
    <rect x="205" y="100" width="290" height="160" fill="#FFFFFF" stroke="#7A5200"/>
    <text x="350" y="128" text-anchor="middle" font-size="18" font-weight="bold">Ruinous empathy</text>
    <text x="350" y="158" text-anchor="middle">"Looks great, nice work!"</text>
    <text x="350" y="190" text-anchor="middle">kind, but the author learns</text>
    <text x="350" y="211" text-anchor="middle">nothing; problems persist</text>
    <rect x="545" y="100" width="290" height="160" fill="#FFFFFF" stroke="#1E5E24" stroke-width="2"/>
    <text x="690" y="128" text-anchor="middle" font-size="18" font-weight="bold">Candid and helpful</text>
    <text x="690" y="158" text-anchor="middle">"The numbers on slide 6 do not</text>
    <text x="690" y="179" text-anchor="middle">reconcile; here is where. The</text>
    <text x="690" y="200" text-anchor="middle">structure works well, keep it."</text>
    <text x="690" y="232" text-anchor="middle">the author can act on it</text>
    <rect x="205" y="320" width="290" height="160" fill="#FFFFFF" stroke="#666666"/>
    <text x="350" y="348" text-anchor="middle" font-size="18" font-weight="bold">Manipulative insincerity</text>
    <text x="350" y="378" text-anchor="middle">vague praise to the face,</text>
    <text x="350" y="399" text-anchor="middle">criticism elsewhere</text>
    <text x="350" y="431" text-anchor="middle">destroys trust in review</text>
    <rect x="545" y="320" width="290" height="160" fill="#FFFFFF" stroke="#8B0000" stroke-width="2"/>
    <text x="690" y="348" text-anchor="middle" font-size="18" font-weight="bold">Obnoxious aggression</text>
    <text x="690" y="378" text-anchor="middle">"This is sloppy. Did you</text>
    <text x="690" y="399" text-anchor="middle">even check it?"</text>
    <text x="690" y="431" text-anchor="middle">accurate, but provokes</text>
    <text x="690" y="452" text-anchor="middle">defensiveness</text>
  </g>
  <text x="350" y="540" text-anchor="middle" font-size="16" fill="#111111">Low</text>
  <text x="690" y="540" text-anchor="middle" font-size="16" fill="#111111">High</text>
  <text x="520" y="575" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Directness about the work</text>
  <text x="165" y="185" text-anchor="end" font-size="16" fill="#111111">High</text>
  <text x="165" y="405" text-anchor="end" font-size="16" fill="#111111">Low</text>
  <text x="50" y="290" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111" transform="rotate(-90 50 290)">Care for the person</text>
</svg>
