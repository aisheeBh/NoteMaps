<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The chain from knowing a strategy to using it habitually</title>
  <desc>Five bars of decreasing height show schematically how many learners remain at each link: knows the strategy, believes it works, commits to using it, has a concrete plan, uses it habitually. Beneath each gap a label names the typical loss: fluency makes it seem unnecessary, effort feels like failure, no link to real situations, and habit and pressure pull back to old methods. Schematic; not plotted from a single dataset.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
  </defs>

  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">From knowing a strategy to using it</text>
  <text x="480" y="62" text-anchor="middle" font-size="15" fill="#111111">Learners remaining at each link</text>

  <!-- baseline -->
  <line x1="40" y1="380" x2="920" y2="380" stroke="#222222" stroke-width="2"/>

  <!-- bars: width 130, gap 47 ; x = 50, 227, 404, 581, 758 -->
  <rect x="50" y="100" width="140" height="280" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="227" y="160" width="140" height="220" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="404" y="220" width="140" height="160" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="581" y="270" width="140" height="110" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="758" y="310" width="140" height="70" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>

  <!-- bar labels on white backing -->
  <g font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">
    <rect x="60" y="112" width="120" height="28" fill="#FFFFFF"/>
    <text x="120" y="132">KNOWS</text>
    <rect x="237" y="172" width="120" height="28" fill="#FFFFFF"/>
    <text x="297" y="192">BELIEVES</text>
    <rect x="414" y="232" width="120" height="28" fill="#FFFFFF"/>
    <text x="474" y="252">COMMITS</text>
    <rect x="591" y="282" width="120" height="28" fill="#FFFFFF"/>
    <text x="651" y="302">PLANS</text>
    <rect x="768" y="322" width="120" height="28" fill="#FFFFFF"/>
    <text x="828" y="342">USES IT</text>
  </g>

  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="120" y="402">what it is,</text>
    <text x="120" y="420">how to do it</text>
    <text x="297" y="402">it works for</text>
    <text x="297" y="420">me, here</text>
    <text x="474" y="402">will bear</text>
    <text x="474" y="420">the effort</text>
    <text x="651" y="402">if-then links</text>
    <text x="651" y="420">to real situations</text>
    <text x="828" y="402">habitually,</text>
    <text x="828" y="420">under pressure</text>
  </g>

  <!-- losses -->
  <g font-size="14" fill="#111111" text-anchor="middle">
    <rect x="130" y="446" width="170" height="64" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
    <rect x="140" y="454" width="150" height="48" fill="#FFFFFF"/>
    <text x="215" y="474">fluency makes it</text>
    <text x="215" y="494">seem unnecessary</text>

    <rect x="307" y="446" width="170" height="64" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
    <rect x="317" y="454" width="150" height="48" fill="#FFFFFF"/>
    <text x="392" y="474">effort is read</text>
    <text x="392" y="494">as failure</text>

    <rect x="484" y="446" width="170" height="64" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
    <rect x="494" y="454" width="150" height="48" fill="#FFFFFF"/>
    <text x="569" y="474">no moment or</text>
    <text x="569" y="494">cue to use it</text>

    <rect x="661" y="446" width="170" height="64" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
    <rect x="671" y="454" width="150" height="48" fill="#FFFFFF"/>
    <text x="746" y="474">deadlines pull</text>
    <text x="746" y="494">back to old habits</text>
  </g>
  <text x="40" y="560" font-size="14" font-style="italic" fill="#111111">Schematic; bar heights illustrate attrition and are not plotted from a single dataset.</text>
</svg>
