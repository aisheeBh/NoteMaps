<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Lure intrusions after multiple-choice practice</title>
  <desc>Schematic bars: after multiple-choice practice without feedback, a noticeable share of later answers are lures seen on the practice test, rising with the number of options; with feedback these intrusions fall to a small fraction.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" fill="#111111" font-weight="bold">Multiple-choice lures can plant errors; feedback removes most</text>
  <line x1="140" y1="420" x2="700" y2="420" stroke="#222222" stroke-width="2.5"/>
  <line x1="140" y1="420" x2="140" y2="77" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="82" y="258" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 82 257.5)">Later answers that were lures (%)</text>
  <text x="131" y="425" text-anchor="end" font-size="14" fill="#111111">0</text>
  <text x="131" y="344" text-anchor="end" font-size="14" fill="#111111">5</text>
  <line x1="140" y1="339" x2="700" y2="339" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="131" y="262" text-anchor="end" font-size="14" fill="#111111">10</text>
  <line x1="140" y1="258" x2="700" y2="258" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="131" y="181" text-anchor="end" font-size="14" fill="#111111">15</text>
  <line x1="140" y1="176" x2="700" y2="176" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="131" y="100" text-anchor="end" font-size="14" fill="#111111">20</text>
  <line x1="140" y1="95" x2="700" y2="95" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <rect x="156" y="339" width="74" height="81" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="236" y="404" width="74" height="16" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="233" y="446" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">2 options</text>
  <rect x="343" y="274" width="74" height="146" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="423" y="388" width="74" height="32" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="420" y="446" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">4 options</text>
  <rect x="530" y="225" width="74" height="195" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="610" y="388" width="74" height="32" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="607" y="446" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">6 options</text>
  <rect x="730" y="120" width="28" height="22" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="768" y="137" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">No feedback</text>
  <rect x="730" y="160" width="28" height="22" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="768" y="177" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">Feedback after</text>
  <text x="768" y="197" text-anchor="start" font-size="14" fill="#111111">each answer</text>
  <rect x="722" y="240" width="214" height="130" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="829" y="282" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">More lures seen,</text>
  <text x="829" y="301" text-anchor="middle" font-size="15" fill="#111111">more lures later</text>
  <text x="829" y="320" text-anchor="middle" font-size="15" fill="#111111">produced — unless</text>
  <text x="829" y="339" text-anchor="middle" font-size="15" fill="#111111">feedback corrects</text>
  <text x="420" y="490" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Options per practice question</text>
  <text x="480" y="528" text-anchor="middle" font-size="13" fill="#333333">Schematic of the pattern reported by Roediger and Marsh (2005) and Butler and Roediger (2008); values are illustrative.</text>
</svg>
