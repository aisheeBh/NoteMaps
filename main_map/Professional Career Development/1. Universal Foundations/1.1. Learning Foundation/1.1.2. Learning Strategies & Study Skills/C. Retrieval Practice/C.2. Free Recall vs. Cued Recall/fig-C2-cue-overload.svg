<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Cue overload</title>
  <desc>Schematic curve: as the number of items associated with a single cue rises from one to twenty, the probability of recalling any one item from that cue falls steeply and then levels off. A distinctive cue sits at the left; a broad heading at the right.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" fill="#111111" font-weight="bold">One cue, many items: each becomes harder to reach</text>
  <line x1="140" y1="430" x2="860" y2="430" stroke="#222222" stroke-width="2.5"/>
  <line x1="140" y1="430" x2="140" y2="72" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="82" y="260" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 82 260.0)">Chance of recalling a given item</text>
  <text x="131" y="435" text-anchor="end" font-size="14" fill="#111111">0.00</text>
  <text x="131" y="350" text-anchor="end" font-size="14" fill="#111111">0.25</text>
  <line x1="140" y1="345" x2="860" y2="345" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="131" y="265" text-anchor="end" font-size="14" fill="#111111">0.50</text>
  <line x1="140" y1="260" x2="860" y2="260" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="131" y="180" text-anchor="end" font-size="14" fill="#111111">0.75</text>
  <line x1="140" y1="175" x2="860" y2="175" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="131" y="95" text-anchor="end" font-size="14" fill="#111111">1.00</text>
  <line x1="140" y1="90" x2="860" y2="90" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <path d="M140.0 124.0 L147.2 139.5 L154.4 153.4 L161.6 166.1 L168.8 177.7 L176.0 188.3 L183.2 198.0 L190.4 207.0 L197.6 215.4 L204.8 223.1 L212.0 230.3 L219.2 237.0 L226.4 243.2 L233.6 249.1 L240.8 254.6 L248.0 259.8 L255.2 264.7 L262.4 269.3 L269.6 273.7 L276.8 277.8 L284.0 281.7 L291.2 285.5 L298.4 289.0 L305.6 292.4 L312.8 295.6 L320.0 298.7 L327.2 301.6 L334.4 304.4 L341.6 307.1 L348.8 309.7 L356.0 312.1 L363.2 314.5 L370.4 316.8 L377.6 319.0 L384.8 321.1 L392.0 323.1 L399.2 325.0 L406.4 326.9 L413.6 328.7 L420.8 330.5 L428.0 332.2 L435.2 333.8 L442.4 335.4 L449.6 336.9 L456.8 338.4 L464.0 339.8 L471.2 341.2 L478.4 342.6 L485.6 343.9 L492.8 345.2 L500.0 346.4 L507.2 347.6 L514.4 348.8 L521.6 349.9 L528.8 351.0 L536.0 352.1 L543.2 353.1 L550.4 354.1 L557.6 355.1 L564.8 356.1 L572.0 357.0 L579.2 357.9 L586.4 358.8 L593.6 359.7 L600.8 360.5 L608.0 361.4 L615.2 362.2 L622.4 363.0 L629.6 363.7 L636.8 364.5 L644.0 365.2 L651.2 365.9 L658.4 366.7 L665.6 367.3 L672.8 368.0 L680.0 368.7 L687.2 369.3 L694.4 370.0 L701.6 370.6 L708.8 371.2 L716.0 371.8 L723.2 372.4 L730.4 372.9 L737.6 373.5 L744.8 374.0 L752.0 374.6 L759.2 375.1 L766.4 375.6 L773.6 376.1 L780.8 376.6 L788.0 377.1 L795.2 377.6 L802.4 378.1 L809.6 378.6 L816.8 379.0 L824.0 379.5 L831.2 379.9 L838.4 380.3 L845.6 380.8 L852.8 381.2 L860.0 381.6" fill="none" stroke="#1F3B5C" stroke-width="3.5"/>
  <text x="140" y="455" text-anchor="middle" font-size="14" fill="#111111">1</text>
  <text x="292" y="455" text-anchor="middle" font-size="14" fill="#111111">5</text>
  <text x="481" y="455" text-anchor="middle" font-size="14" fill="#111111">10</text>
  <text x="671" y="455" text-anchor="middle" font-size="14" fill="#111111">15</text>
  <text x="860" y="455" text-anchor="middle" font-size="14" fill="#111111">20</text>
  <text x="500" y="485" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Number of items sharing the same cue</text>
  <circle cx="140" cy="124" r="7" fill="#1F3B5C"/>
  <rect x="190" y="110" width="250" height="64" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="315" y="138" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Distinctive cue</text>
  <text x="315" y="157" text-anchor="middle" font-size="15" fill="#111111">e.g. "the Leeds liquidity case"</text>
  <circle cx="860" cy="382" r="7" fill="#FFFFFF" stroke="#8B0000" stroke-width="3"/>
  <rect x="600" y="220" width="250" height="64" rx="6" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="725" y="248" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Overloaded cue</text>
  <text x="725" y="267" text-anchor="middle" font-size="15" fill="#111111">e.g. "risk" or "governance"</text>
  <line x1="725" y1="284" x2="854" y2="370" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <text x="480" y="528" text-anchor="middle" font-size="13" fill="#333333">Schematic of the cue-overload principle (Watkins and Watkins, 1975); not plotted from a single dataset.</text>
</svg>
