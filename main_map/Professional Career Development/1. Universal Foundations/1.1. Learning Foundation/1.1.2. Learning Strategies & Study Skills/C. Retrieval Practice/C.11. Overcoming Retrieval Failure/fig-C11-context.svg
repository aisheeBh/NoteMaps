<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Context-dependent recall</title>
  <desc>Schematic grouped bars in the pattern of Godden and Baddeley 1975: words learned on land are recalled better on land than underwater; words learned underwater are recalled better underwater than on land.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" fill="#111111" font-weight="bold">Matching contexts help recall</text>
  <line x1="140" y1="420" x2="690" y2="420" stroke="#222222" stroke-width="2.5"/>
  <line x1="140" y1="420" x2="140" y2="77" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="82" y="258" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 82 257.5)">Words recalled (relative %)</text>
  <text x="131" y="425" text-anchor="end" font-size="14" fill="#111111">0</text>
  <text x="131" y="344" text-anchor="end" font-size="14" fill="#111111">25</text>
  <line x1="140" y1="339" x2="690" y2="339" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="131" y="262" text-anchor="end" font-size="14" fill="#111111">50</text>
  <line x1="140" y1="258" x2="690" y2="258" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="131" y="181" text-anchor="end" font-size="14" fill="#111111">75</text>
  <line x1="140" y1="176" x2="690" y2="176" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="131" y="100" text-anchor="end" font-size="14" fill="#111111">100</text>
  <line x1="140" y1="95" x2="690" y2="95" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <rect x="170" y="95" width="104" height="325" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="280" y="192" width="104" height="228" rx="0" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="278" y="446" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Learned on land</text>
  <rect x="446" y="186" width="104" height="234" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="556" y="111" width="104" height="309" rx="0" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="552" y="446" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Learned underwater</text>
  <rect x="196" y="69" width="53" height="24" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="222" y="83" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">match</text>
  <rect x="581" y="85" width="53" height="24" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="608" y="99" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">match</text>
  <rect x="725" y="140" width="28" height="22" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="763" y="157" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">Recalled on land</text>
  <rect x="725" y="180" width="28" height="22" rx="0" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="763" y="197" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">Recalled underwater</text>
  <rect x="718" y="240" width="222" height="140" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="829" y="287" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Everyday context</text>
  <text x="829" y="306" text-anchor="middle" font-size="15" fill="#111111">effects are smaller;</text>
  <text x="829" y="325" text-anchor="middle" font-size="15" fill="#111111">mental reinstatement</text>
  <text x="829" y="344" text-anchor="middle" font-size="15" fill="#111111">reduces them</text>
  <text x="480" y="525" text-anchor="middle" font-size="13" fill="#333333">Schematic in the pattern reported by Godden and Baddeley (1975); values scaled for illustration.</text>
</svg>
