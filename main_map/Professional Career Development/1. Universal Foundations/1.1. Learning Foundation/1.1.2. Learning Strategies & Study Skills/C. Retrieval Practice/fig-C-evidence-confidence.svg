<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Confidence in the main claims about retrieval practice</title>
  <desc>Horizontal bars of evidence confidence, from contested to well established. Well established: retrieval beats restudy for retention; feedback amplifies; benefit emerges with delay; classroom quizzing works; low-stakes quizzes reduce anxiety. Qualified: transfer to new questions; benefits for untested material. Contested: complex procedures; mathematics.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" fill="#111111" font-weight="bold">How sure is the field?</text>
  <line x1="567" y1="80" x2="567" y2="520" stroke="#999999" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="567" y="540" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">contested</text>
  <line x1="713" y1="80" x2="713" y2="520" stroke="#999999" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="713" y="540" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">qualified</text>
  <line x1="860" y1="80" x2="860" y2="520" stroke="#999999" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="860" y="540" text-anchor="end" font-size="14" fill="#111111" font-weight="bold">well established</text>
  <line x1="420" y1="80" x2="420" y2="520" stroke="#222222" stroke-width="2.5"/>
  <text x="408" y="114" text-anchor="end" font-size="15" fill="#111111">Retrieval beats restudy for retention</text>
  <rect x="420" y="94" width="440" height="28" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="408" y="161" text-anchor="end" font-size="15" fill="#111111">Benefit grows with delay</text>
  <rect x="420" y="141" width="440" height="28" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="408" y="208" text-anchor="end" font-size="15" fill="#111111">Feedback amplifies the effect</text>
  <rect x="420" y="188" width="440" height="28" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="408" y="255" text-anchor="end" font-size="15" fill="#111111">Classroom quizzing works</text>
  <rect x="420" y="235" width="440" height="28" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="408" y="302" text-anchor="end" font-size="15" fill="#111111">Low-stakes quizzes reduce anxiety</text>
  <rect x="420" y="282" width="381" height="28" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="408" y="349" text-anchor="end" font-size="15" fill="#111111">Transfer to new questions</text>
  <rect x="420" y="329" width="293" height="28" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="408" y="396" text-anchor="end" font-size="15" fill="#111111">Benefits for untested material</text>
  <rect x="420" y="376" width="220" height="28" rx="0" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="408" y="443" text-anchor="end" font-size="15" fill="#111111">Large effects for complex procedures</text>
  <rect x="420" y="423" width="161" height="28" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="408" y="490" text-anchor="end" font-size="15" fill="#111111">Robust effects in mathematics</text>
  <rect x="420" y="470" width="132" height="28" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="480" y="585" text-anchor="middle" font-size="13" fill="#333333">Author judgement summarising the reviews and meta-analyses described in the text.</text>
</svg>
