<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Composition of a cumulative weekly quiz</title>
  <desc>Stacked bars for weeks 1 to 10 of a course, each a 10-item quiz. Week 1 is all current-unit items. From week 2 the share of earlier-unit items grows, settling at 4 current and 6 earlier items from week 4 onwards; the earlier items are spread across all previous units.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" fill="#111111" font-weight="bold">Every weekly quiz reaches back across the whole course</text>
  <line x1="140" y1="420" x2="820" y2="420" stroke="#222222" stroke-width="2.5"/>
  <line x1="140" y1="420" x2="140" y2="82" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="82" y="260" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 82 260.0)">Items in a 10-item quiz</text>
  <text x="131" y="425" text-anchor="end" font-size="14" fill="#111111">0</text>
  <text x="131" y="361" text-anchor="end" font-size="14" fill="#111111">2</text>
  <line x1="140" y1="356" x2="820" y2="356" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="131" y="297" text-anchor="end" font-size="14" fill="#111111">4</text>
  <line x1="140" y1="292" x2="820" y2="292" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="131" y="233" text-anchor="end" font-size="14" fill="#111111">6</text>
  <line x1="140" y1="228" x2="820" y2="228" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="131" y="169" text-anchor="end" font-size="14" fill="#111111">8</text>
  <line x1="140" y1="164" x2="820" y2="164" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="131" y="105" text-anchor="end" font-size="14" fill="#111111">10</text>
  <line x1="140" y1="100" x2="820" y2="100" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <rect x="150" y="100" width="48" height="320" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="174" y="445" text-anchor="middle" font-size="14" fill="#111111">1</text>
  <rect x="218" y="228" width="48" height="192" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="218" y="100" width="48" height="128" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="242" y="445" text-anchor="middle" font-size="14" fill="#111111">2</text>
  <text x="242" y="92" text-anchor="middle" font-size="13" fill="#111111">1</text>
  <rect x="286" y="260" width="48" height="160" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="286" y="100" width="48" height="160" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="310" y="445" text-anchor="middle" font-size="14" fill="#111111">3</text>
  <text x="310" y="92" text-anchor="middle" font-size="13" fill="#111111">2</text>
  <rect x="354" y="292" width="48" height="128" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="354" y="100" width="48" height="192" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="378" y="445" text-anchor="middle" font-size="14" fill="#111111">4</text>
  <text x="378" y="92" text-anchor="middle" font-size="13" fill="#111111">3</text>
  <rect x="422" y="292" width="48" height="128" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="422" y="100" width="48" height="192" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="446" y="445" text-anchor="middle" font-size="14" fill="#111111">5</text>
  <text x="446" y="92" text-anchor="middle" font-size="13" fill="#111111">4</text>
  <rect x="490" y="292" width="48" height="128" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="490" y="100" width="48" height="192" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="514" y="445" text-anchor="middle" font-size="14" fill="#111111">6</text>
  <text x="514" y="92" text-anchor="middle" font-size="13" fill="#111111">5</text>
  <rect x="558" y="292" width="48" height="128" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="558" y="100" width="48" height="192" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="582" y="445" text-anchor="middle" font-size="14" fill="#111111">7</text>
  <text x="582" y="92" text-anchor="middle" font-size="13" fill="#111111">6</text>
  <rect x="626" y="292" width="48" height="128" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="626" y="100" width="48" height="192" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="650" y="445" text-anchor="middle" font-size="14" fill="#111111">8</text>
  <text x="650" y="92" text-anchor="middle" font-size="13" fill="#111111">7</text>
  <rect x="694" y="292" width="48" height="128" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="694" y="100" width="48" height="192" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="718" y="445" text-anchor="middle" font-size="14" fill="#111111">9</text>
  <text x="718" y="92" text-anchor="middle" font-size="13" fill="#111111">8</text>
  <rect x="762" y="292" width="48" height="128" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="762" y="100" width="48" height="192" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="786" y="445" text-anchor="middle" font-size="14" fill="#111111">10</text>
  <text x="786" y="92" text-anchor="middle" font-size="13" fill="#111111">9</text>
  <text x="480" y="475" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Week of the course</text>
  <text x="480" y="68" text-anchor="middle" font-size="13" fill="#111111" font-style="italic">number above each bar: earlier units sampled</text>
  <rect x="845" y="170" width="28" height="22" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="845" y="215" text-anchor="start" font-size="14" fill="#111111">current</text>
  <text x="845" y="233" text-anchor="start" font-size="14" fill="#111111">unit</text>
  <rect x="845" y="270" width="28" height="22" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="845" y="315" text-anchor="start" font-size="14" fill="#111111">earlier</text>
  <text x="845" y="333" text-anchor="start" font-size="14" fill="#111111">units</text>
  <text x="480" y="525" text-anchor="middle" font-size="13" fill="#333333">Illustrative allocation: recent share falls from 100% to 40%, earlier items spread across all previous units.</text>
</svg>
