<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Retrieval practice versus concept mapping</title>
  <desc>Schematic grouped bars in the pattern of Karpicke and Blunt 2011: on verbatim questions and on inference questions a week later, retrieval practice outperformed elaborative concept mapping and repeated study.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" fill="#111111" font-weight="bold">Retrieving a text beat mapping it — on facts and on inferences</text>
  <line x1="140" y1="420" x2="690" y2="420" stroke="#222222" stroke-width="2.5"/>
  <line x1="140" y1="420" x2="140" y2="77" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="82" y="258" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 82 257.5)">Final test score (%)</text>
  <text x="131" y="425" text-anchor="end" font-size="14" fill="#111111">0</text>
  <text x="131" y="344" text-anchor="end" font-size="14" fill="#111111">25</text>
  <line x1="140" y1="339" x2="690" y2="339" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="131" y="262" text-anchor="end" font-size="14" fill="#111111">50</text>
  <line x1="140" y1="258" x2="690" y2="258" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="131" y="181" text-anchor="end" font-size="14" fill="#111111">75</text>
  <line x1="140" y1="176" x2="690" y2="176" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="131" y="100" text-anchor="end" font-size="14" fill="#111111">100</text>
  <line x1="140" y1="95" x2="690" y2="95" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <rect x="158" y="274" width="76" height="146" rx="0" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <rect x="240" y="241" width="76" height="179" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="322" y="192" width="76" height="228" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="278" y="446" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Verbatim questions</text>
  <rect x="432" y="290" width="76" height="130" rx="0" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <rect x="514" y="258" width="76" height="162" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="596" y="206" width="76" height="214" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="552" y="446" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Inference questions</text>
  <rect x="722" y="120" width="28" height="22" rx="0" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="760" y="137" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">Repeated study</text>
  <rect x="722" y="160" width="28" height="22" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="760" y="177" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">Concept mapping</text>
  <text x="760" y="197" text-anchor="start" font-size="14" fill="#111111">(text open)</text>
  <rect x="722" y="220" width="28" height="22" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="760" y="237" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">Retrieval practice</text>
  <text x="760" y="257" text-anchor="start" font-size="14" fill="#111111">(free recall)</text>
  <rect x="716" y="295" width="224" height="100" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="828" y="331" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Most students predicted</text>
  <text x="828" y="350" text-anchor="middle" font-size="15" fill="#111111">concept mapping</text>
  <text x="828" y="369" text-anchor="middle" font-size="15" fill="#111111">would win</text>
  <text x="480" y="525" text-anchor="middle" font-size="13" fill="#333333">Schematic in the pattern reported by Karpicke and Blunt (2011); heights are illustrative, not their data.</text>
</svg>
