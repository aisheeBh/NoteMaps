<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Successive relearning</title>
  <desc>Three spaced sessions. In each, the learner keeps retrieving an item until it has been recalled correctly twice. The number of attempts needed falls across sessions, from many in session 1 to few in session 3, showing growing memory strength.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" fill="#111111" font-weight="bold">Retrieve to criterion, return later, repeat</text>
  <rect x="70" y="90" width="250" height="300" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="195" y="122" text-anchor="middle" font-size="18" fill="#111111" font-weight="bold">Session 1</text>
  <text x="195" y="145" text-anchor="middle" font-size="15" fill="#111111">day 1</text>
  <rect x="100" y="170" width="30" height="24" rx="4" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="145" y="188" text-anchor="start" font-size="15" fill="#111111">wrong → feedback</text>
  <rect x="100" y="204" width="30" height="24" rx="4" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="145" y="222" text-anchor="start" font-size="15" fill="#111111">wrong → feedback</text>
  <rect x="100" y="238" width="30" height="24" rx="4" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="145" y="256" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">correct</text>
  <rect x="100" y="272" width="30" height="24" rx="4" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="145" y="290" text-anchor="start" font-size="15" fill="#111111">wrong → feedback</text>
  <rect x="100" y="306" width="30" height="24" rx="4" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="145" y="324" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">correct</text>
  <rect x="146" y="363" width="98" height="25" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="195" y="378" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">5 attempts</text>
  <line x1="325" y1="240" x2="355" y2="240" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="360" y="90" width="250" height="300" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="485" y="122" text-anchor="middle" font-size="18" fill="#111111" font-weight="bold">Session 2</text>
  <text x="485" y="145" text-anchor="middle" font-size="15" fill="#111111">day 3</text>
  <rect x="390" y="170" width="30" height="24" rx="4" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="435" y="188" text-anchor="start" font-size="15" fill="#111111">wrong → feedback</text>
  <rect x="390" y="204" width="30" height="24" rx="4" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="435" y="222" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">correct</text>
  <rect x="390" y="238" width="30" height="24" rx="4" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="435" y="256" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">correct</text>
  <rect x="436" y="363" width="98" height="25" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="485" y="378" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">3 attempts</text>
  <line x1="615" y1="240" x2="645" y2="240" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="650" y="90" width="250" height="300" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="775" y="122" text-anchor="middle" font-size="18" fill="#111111" font-weight="bold">Session 3</text>
  <text x="775" y="145" text-anchor="middle" font-size="15" fill="#111111">day 8</text>
  <rect x="680" y="170" width="30" height="24" rx="4" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="725" y="188" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">correct</text>
  <rect x="680" y="204" width="30" height="24" rx="4" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="725" y="222" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">correct</text>
  <rect x="726" y="363" width="98" height="25" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="775" y="378" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">2 attempts</text>
  <text x="480" y="425" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Criterion in each session: recalled correctly twice</text>
  <rect x="220" y="450" width="28" height="22" rx="4" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="258" y="467" text-anchor="start" font-size="15" fill="#111111">correct recall</text>
  <rect x="480" y="450" width="28" height="22" rx="4" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="518" y="467" text-anchor="start" font-size="15" fill="#111111">failed recall, answer then shown</text>
  <text x="480" y="510" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Fewer attempts are needed each time: the memory is getting stronger.</text>
  <text x="480" y="545" text-anchor="middle" font-size="13" fill="#333333">Illustrative sequence for one item; criterion and spacing vary in research and practice.</text>
</svg>
