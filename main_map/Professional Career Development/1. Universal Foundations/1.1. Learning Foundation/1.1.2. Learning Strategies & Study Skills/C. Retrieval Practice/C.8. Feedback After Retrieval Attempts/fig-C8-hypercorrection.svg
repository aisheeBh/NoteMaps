<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The hypercorrection effect</title>
  <desc>Schematic rising line: the probability that an error is corrected on a later test after feedback rises with the confidence the learner had in the original wrong answer.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" fill="#111111" font-weight="bold">Confident errors are the easiest to correct</text>
  <line x1="150" y1="420" x2="840" y2="420" stroke="#222222" stroke-width="2.5"/>
  <line x1="150" y1="420" x2="150" y2="82" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="92" y="260" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 92 260.0)">Errors corrected on later test (%)</text>
  <text x="141" y="425" text-anchor="end" font-size="14" fill="#111111">0</text>
  <text x="141" y="345" text-anchor="end" font-size="14" fill="#111111">25</text>
  <line x1="150" y1="340" x2="840" y2="340" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="141" y="265" text-anchor="end" font-size="14" fill="#111111">50</text>
  <line x1="150" y1="260" x2="840" y2="260" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="141" y="185" text-anchor="end" font-size="14" fill="#111111">75</text>
  <line x1="150" y1="180" x2="840" y2="180" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="141" y="105" text-anchor="end" font-size="14" fill="#111111">100</text>
  <line x1="150" y1="100" x2="840" y2="100" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <path d="M150.0 308.0 L322.5 276.0 L495.0 237.6 L667.5 202.4 L840.0 164.0" fill="none" stroke="#1F3B5C" stroke-width="3.5"/>
  <rect x="144" y="302" width="12" height="12" fill="#1F3B5C"/>
  <rect x="316" y="270" width="12" height="12" fill="#1F3B5C"/>
  <rect x="489" y="232" width="12" height="12" fill="#1F3B5C"/>
  <rect x="662" y="196" width="12" height="12" fill="#1F3B5C"/>
  <rect x="834" y="158" width="12" height="12" fill="#1F3B5C"/>
  <text x="150" y="448" text-anchor="middle" font-size="14" fill="#111111">very low</text>
  <text x="322" y="448" text-anchor="middle" font-size="14" fill="#111111">low</text>
  <text x="495" y="448" text-anchor="middle" font-size="14" fill="#111111">medium</text>
  <text x="668" y="448" text-anchor="middle" font-size="14" fill="#111111">high</text>
  <text x="840" y="448" text-anchor="middle" font-size="14" fill="#111111">very high</text>
  <text x="495" y="480" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Confidence in the original wrong answer</text>
  <rect x="190" y="120" width="300" height="80" rx="6" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="201" y="136" width="278" height="48" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="340" y="156" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Low-confidence error</text>
  <text x="340" y="175" text-anchor="middle" font-size="15" fill="#111111">often a guess; weakly corrected</text>
  <rect x="560" y="250" width="270" height="80" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="695" y="286" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">High-confidence error</text>
  <text x="695" y="305" text-anchor="middle" font-size="15" fill="#111111">surprise boosts the correction</text>
  <text x="480" y="528" text-anchor="middle" font-size="13" fill="#333333">Schematic of the pattern reported by Butterfield and Metcalfe (2001); not plotted from a single dataset.</text>
</svg>
