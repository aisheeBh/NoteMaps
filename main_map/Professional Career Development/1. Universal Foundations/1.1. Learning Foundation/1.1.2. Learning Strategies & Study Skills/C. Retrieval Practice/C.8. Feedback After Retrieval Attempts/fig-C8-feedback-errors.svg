<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Feedback after errors and after correct answers</title>
  <desc>Schematic grouped bars. For items first answered wrongly, later recall is very low with no feedback or verification only and much higher with the correct answer. For items first answered correctly, later recall is high in all three conditions.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" fill="#111111" font-weight="bold">Feedback earns its keep on the errors</text>
  <line x1="140" y1="420" x2="700" y2="420" stroke="#222222" stroke-width="2.5"/>
  <line x1="140" y1="420" x2="140" y2="77" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="82" y="258" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 82 257.5)">Recalled on the later test (%)</text>
  <text x="131" y="425" text-anchor="end" font-size="14" fill="#111111">0</text>
  <text x="131" y="344" text-anchor="end" font-size="14" fill="#111111">25</text>
  <line x1="140" y1="339" x2="700" y2="339" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="131" y="262" text-anchor="end" font-size="14" fill="#111111">50</text>
  <line x1="140" y1="258" x2="700" y2="258" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="131" y="181" text-anchor="end" font-size="14" fill="#111111">75</text>
  <line x1="140" y1="176" x2="700" y2="176" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="131" y="100" text-anchor="end" font-size="14" fill="#111111">100</text>
  <line x1="140" y1="95" x2="700" y2="95" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <rect x="163" y="394" width="74" height="26" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="243" y="388" width="74" height="32" rx="0" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="323" y="241" width="74" height="179" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="280" y="446" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Items first</text>
  <text x="280" y="465" text-anchor="middle" font-size="15" fill="#111111">answered wrongly</text>
  <rect x="443" y="160" width="74" height="260" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="523" y="160" width="74" height="260" rx="0" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="603" y="147" width="74" height="273" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="560" y="446" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Items first</text>
  <text x="560" y="465" text-anchor="middle" font-size="15" fill="#111111">answered correctly</text>
  <rect x="728" y="120" width="28" height="22" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="766" y="137" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">No feedback</text>
  <rect x="728" y="160" width="28" height="22" rx="0" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="766" y="177" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">Right / wrong only</text>
  <rect x="728" y="200" width="28" height="22" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="766" y="217" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">Correct answer</text>
  <text x="766" y="237" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">shown</text>
  <rect x="722" y="280" width="218" height="110" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="831" y="321" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Errors stay errors</text>
  <text x="831" y="340" text-anchor="middle" font-size="15" fill="#111111">unless the right</text>
  <text x="831" y="359" text-anchor="middle" font-size="15" fill="#111111">answer is supplied</text>
  <text x="480" y="528" text-anchor="middle" font-size="13" fill="#333333">Schematic of the pattern reported by Pashler, Cepeda, Wixted and Rohrer (2005); heights are illustrative.</text>
</svg>
