<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Seven sketchnote layouts</title>
  <desc>Thumbnail pages showing linear, vertical, radial, path, modular, skyscraper and popcorn layouts, each with the kind of content it suits.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Choose a layout that fits the content</text>
  <g fill="#FFFFFF" stroke="#222222" stroke-width="2">
    <rect x="40" y="60" width="190" height="180"/><rect x="265" y="60" width="190" height="180"/><rect x="490" y="60" width="190" height="180"/><rect x="715" y="60" width="190" height="180"/>
    <rect x="152" y="300" width="190" height="180"/><rect x="377" y="300" width="190" height="180"/><rect x="602" y="300" width="190" height="180"/>
  </g>
  <g fill="#BCD5EE" stroke="#1F3B5C" stroke-width="1.5">
    <rect x="55" y="75" width="70" height="30"/><rect x="145" y="75" width="70" height="30"/>
    <rect x="55" y="125" width="70" height="30"/><rect x="145" y="125" width="70" height="30"/>
    <rect x="55" y="175" width="70" height="30"/><rect x="145" y="175" width="70" height="30"/>
    <rect x="310" y="72" width="100" height="30"/><rect x="310" y="117" width="100" height="30"/><rect x="310" y="162" width="100" height="30"/><rect x="310" y="207" width="100" height="24"/>
  </g>
  <circle cx="585" cy="150" r="26" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <g fill="#BCD5EE" stroke="#1F3B5C" stroke-width="1.5">
    <rect x="505" y="72" width="50" height="26"/><rect x="615" y="72" width="50" height="26"/><rect x="505" y="200" width="50" height="26"/><rect x="615" y="200" width="50" height="26"/>
  </g>
  <g stroke="#222222" stroke-width="1.5"><line x1="565" y1="132" x2="540" y2="98"/><line x1="605" y1="132" x2="630" y2="98"/><line x1="565" y1="170" x2="540" y2="200"/><line x1="605" y1="170" x2="630" y2="200"/></g>
  <path d="M735 85 H880 Q895 85 895 105 Q895 125 880 125 H750 Q735 125 735 145 Q735 165 750 165 H880 Q895 165 895 185 Q895 205 880 205 H760" fill="none" stroke="#1F3B5C" stroke-width="3" marker-end="url(#arrow)"/>
  <g fill="#FFE6A8" stroke="#7A5200" stroke-width="1.5"><circle cx="760" cy="85" r="8"/><circle cx="850" cy="125" r="8"/><circle cx="790" cy="165" r="8"/><circle cx="860" cy="205" r="8"/></g>

  <g fill="#BCD5EE" stroke="#1F3B5C" stroke-width="1.5">
    <rect x="165" y="313" width="78" height="70"/><rect x="251" y="313" width="78" height="70"/><rect x="165" y="395" width="78" height="72"/><rect x="251" y="395" width="78" height="72"/>
    <rect x="390" y="313" width="50" height="154"/><rect x="447" y="313" width="50" height="154"/><rect x="504" y="313" width="50" height="154"/>
  </g>
  <g fill="#FFE6A8" stroke="#7A5200" stroke-width="1.5">
    <rect x="615" y="315" width="50" height="24"/><rect x="700" y="330" width="60" height="24"/><rect x="640" y="380" width="44" height="24"/><rect x="720" y="400" width="54" height="24"/><rect x="620" y="440" width="58" height="24"/>
  </g>
  <g stroke="#222222" stroke-width="1.2" stroke-dasharray="2 4"><line x1="665" y1="327" x2="700" y2="342"/><line x1="662" y1="404" x2="640" y2="440"/><line x1="684" y1="392" x2="720" y2="412"/></g>

  <g font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">
    <text x="135" y="262">Linear</text><text x="360" y="262">Vertical</text><text x="585" y="262">Radial</text><text x="810" y="262">Path</text>
    <text x="247" y="502">Modular</text><text x="472" y="502">Skyscraper</text><text x="697" y="502">Popcorn</text>
  </g>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="135" y="282">ordered talk, like text</text><text x="360" y="282">one stream, phone screen</text><text x="585" y="282">one central idea</text><text x="810" y="282">process or story</text>
    <text x="247" y="522">several topics or speakers</text><text x="472" y="522">side-by-side comparison</text><text x="697" y="522">unpredictable discussion</text>
  </g>
  <text x="480" y="550" text-anchor="middle" font-size="13" fill="#333333">Layout names follow Mike Rohde's descriptions of common sketchnote structures.</text>
</svg>
