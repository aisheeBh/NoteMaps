<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Elements of a multi-track timeline</title>
  <desc>A timeline from 2019 to 2025 with three tracks: client, supplier and regulator. Background bands mark three periods. Events appear as diamonds, a duration as a bar, and one arrow links a supplier event to a later client event. A key explains each element.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Anatomy of a multi-track timeline</text>

  <rect x="160" y="70" width="230" height="330" fill="#F2F2F2"/>
  <rect x="390" y="70" width="300" height="330" fill="#E6E6E6"/>
  <rect x="690" y="70" width="230" height="330" fill="#F2F2F2"/>
  <g font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">
    <text x="275" y="92">Period: design</text><text x="540" y="92">Period: construction</text><text x="805" y="92">Period: dispute</text>
  </g>

  <g font-size="16" font-weight="bold" fill="#111111" text-anchor="end">
    <text x="148" y="155">Client</text><text x="148" y="255">Supplier</text><text x="148" y="355">Regulator</text>
  </g>
  <g stroke="#666666" stroke-width="1" stroke-dasharray="2 4">
    <line x1="160" y1="150" x2="920" y2="150"/><line x1="160" y1="250" x2="920" y2="250"/><line x1="160" y1="350" x2="920" y2="350"/>
  </g>

  <path d="M250 140 l10 10 l-10 10 l-10 -10z" fill="#1F3B5C" stroke="#000000" stroke-width="1.5"/>
  <text x="250" y="132" text-anchor="middle" font-size="14" fill="#111111">contract signed</text>
  <path d="M780 140 l10 10 l-10 10 l-10 -10z" fill="#1F3B5C" stroke="#000000" stroke-width="1.5"/>
  <text x="800" y="132" text-anchor="middle" font-size="14" fill="#111111">payment withheld</text>

  <rect x="420" y="238" width="240" height="24" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="460" y="208" width="160" height="22" fill="#FFFFFF"/>
  <text x="540" y="224" text-anchor="middle" font-size="14" fill="#111111">deliveries (duration)</text>
  <path d="M660 240 l10 10 l-10 10 l-10 -10z" fill="#8B0000" stroke="#000000" stroke-width="1.5"/>
  <text x="660" y="284" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">deliveries stop</text>

  <path d="M330 340 l10 10 l-10 10 l-10 -10z" fill="#1F3B5C" stroke="#000000" stroke-width="1.5"/>
  <text x="330" y="382" text-anchor="middle" font-size="14" fill="#111111">permit granted</text>

  <path d="M672 242 C 700 210, 740 185, 772 157" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="740" y="196" width="125" height="22" fill="#FFFFFF"/>
  <text x="802" y="212" text-anchor="middle" font-size="14" fill="#111111">evidenced cause</text>

  <line x1="160" y1="420" x2="920" y2="420" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <line x1="180" y1="414" x2="180" y2="426" stroke="#222222" stroke-width="2"/><text x="180" y="444">2019</text>
    <line x1="300" y1="414" x2="300" y2="426" stroke="#222222" stroke-width="2"/><text x="300" y="444">2020</text>
    <line x1="420" y1="414" x2="420" y2="426" stroke="#222222" stroke-width="2"/><text x="420" y="444">2021</text>
    <line x1="540" y1="414" x2="540" y2="426" stroke="#222222" stroke-width="2"/><text x="540" y="444">2022</text>
    <line x1="660" y1="414" x2="660" y2="426" stroke="#222222" stroke-width="2"/><text x="660" y="444">2023</text>
    <line x1="780" y1="414" x2="780" y2="426" stroke="#222222" stroke-width="2"/><text x="780" y="444">2024</text>
    <line x1="900" y1="414" x2="900" y2="426" stroke="#222222" stroke-width="2"/><text x="900" y="444">2025</text>
  </g>

  <rect x="40" y="470" width="880" height="64" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <g font-size="14" fill="#111111">
    <path d="M62 482 l7 7 l-7 7 l-7 -7z" fill="#1F3B5C" stroke="#000000"/><text x="78" y="494">event (a moment)</text>
    <rect x="220" y="482" width="40" height="14" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/><text x="268" y="494">duration (a state)</text>
    <rect x="420" y="480" width="30" height="18" fill="#E6E6E6" stroke="#666666"/><text x="458" y="494">period band</text>
    <line x1="580" y1="489" x2="620" y2="489" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/><text x="630" y="494">causal link, only if evidenced</text>
    <text x="62" y="522">Rows are tracks (swimlanes) for each actor; the axis is scaled in years.</text>
  </g>
</svg>
