<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Incident periods</title>
  <desc>A scaled bar from 10:02 to 10:49 divided into four periods: onset 9 minutes, unnoticed 20 minutes, diagnosis 11 minutes and recovery 7 minutes. The unnoticed period is the longest.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Where the 47 minutes went</text>

  <rect x="60" y="120" width="153" height="70" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="213" y="120" width="340" height="70" fill="url(#lines)" stroke="#8B0000" stroke-width="3" stroke-dasharray="3 3"/>
  <rect x="553" y="120" width="187" height="70" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="740" y="120" width="119" height="70" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <g fill="#FFFFFF" stroke="#222222" stroke-width="1">
    <rect x="80" y="138" width="113" height="34"/><rect x="293" y="138" width="180" height="34"/><rect x="573" y="138" width="147" height="34"/><rect x="745" y="130" width="109" height="50"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">
    <text x="136" y="161">Onset 9 min</text><text x="383" y="161">Unnoticed 20 min</text><text x="646" y="161">Diagnosis 11 min</text><text x="799" y="152">Recovery</text><text x="799" y="172">7 min</text>
  </g>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <line x1="60" y1="190" x2="60" y2="215" stroke="#222222" stroke-width="2"/><text x="60" y="232">10:02</text>
    <line x1="213" y1="190" x2="213" y2="215" stroke="#222222" stroke-width="2"/><text x="213" y="232">10:11</text>
    <line x1="553" y1="190" x2="553" y2="215" stroke="#222222" stroke-width="2"/><text x="553" y="232">10:31</text>
    <line x1="740" y1="190" x2="740" y2="215" stroke="#222222" stroke-width="2"/><text x="740" y="232">10:42</text>
    <line x1="859" y1="190" x2="859" y2="215" stroke="#222222" stroke-width="2"/><text x="859" y="232">10:49</text>
  </g>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="136" y="100">change deployed</text>
    <text x="383" y="100">alert fired, nobody received it</text>
    <text x="646" y="100">on-call engineer investigates</text>
    <text x="799" y="100">rollback</text>
  </g>
  <rect x="180" y="275" width="600" height="70" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="3"/>
  <text x="480" y="303" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Largest share: the period before any person responded</text>
  <text x="480" y="328" text-anchor="middle" font-size="15" fill="#111111">Fix alert routing first; it targets 20 of the 47 minutes</text>
  <text x="480" y="395" text-anchor="middle" font-size="13" fill="#333333">Invented incident; segment widths are proportional to time.</text>
</svg>
