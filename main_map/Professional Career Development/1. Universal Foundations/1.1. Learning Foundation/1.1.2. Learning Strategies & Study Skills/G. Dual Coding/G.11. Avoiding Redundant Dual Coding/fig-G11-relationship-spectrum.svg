<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Spectrum of word-picture relationships</title>
  <desc>Six relationships placed along an arrow from harmful to most useful: conflicting, decorative, wasteful repetition, supportive repetition, elaborating, complementary. Each has a short example beneath.</desc>
  <defs>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">From harmful to helpful pairings</text>
  <line x1="40" y1="90" x2="920" y2="90" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="40" y="75" font-size="15" font-weight="bold" fill="#111111">harmful</text>
  <text x="910" y="75" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">most useful</text>

  <g font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">
    <rect x="30" y="115" width="140" height="70" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
    <rect x="40" y="132" width="120" height="36" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/><text x="100" y="156">Conflicting</text>
    <rect x="182" y="115" width="140" height="70" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
    <rect x="192" y="132" width="120" height="36" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/><text x="252" y="156">Decorative</text>
    <rect x="334" y="115" width="140" height="70" fill="#E6E6E6" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/>
    <rect x="344" y="125" width="120" height="50" fill="#FFFFFF" stroke="#666666" stroke-width="1"/><text x="404" y="146">Wasteful</text><text x="404" y="166">repetition</text>
    <rect x="486" y="115" width="140" height="70" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
    <rect x="496" y="125" width="120" height="50" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/><text x="556" y="146">Supportive</text><text x="556" y="166">repetition</text>
    <rect x="638" y="115" width="140" height="70" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
    <rect x="648" y="132" width="120" height="36" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/><text x="708" y="156">Elaborating</text>
    <rect x="790" y="115" width="140" height="70" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
    <rect x="796" y="132" width="128" height="36" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/><text x="860" y="156">Complementary</text>
  </g>

  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="100" y="215">chart falls,</text><text x="100" y="235">headline says</text><text x="100" y="255">"growth"</text>
    <text x="252" y="215">handshake photo</text><text x="252" y="235">on a contract-law</text><text x="252" y="255">slide</text>
    <text x="404" y="215">paragraph on</text><text x="404" y="235">screen read</text><text x="404" y="255">aloud verbatim</text>
    <text x="556" y="215">captions for a</text><text x="556" y="235">second-language</text><text x="556" y="255">viewer</text>
    <text x="708" y="215">graph beside a</text><text x="708" y="235">definition of</text><text x="708" y="255">compound interest</text>
    <text x="860" y="215">supplier map</text><text x="860" y="235">beside text on</text><text x="860" y="255">supply risk</text>
  </g>

  <g font-size="14" fill="#111111" text-anchor="middle" font-style="italic">
    <text x="100" y="295">misleads</text><text x="252" y="295">distracts</text><text x="404" y="295">adds load</text><text x="556" y="295">meets a need</text><text x="708" y="295">makes concrete</text><text x="860" y="295">adds information</text>
  </g>

  <rect x="140" y="330" width="680" height="70" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2.5"/>
  <text x="480" y="358" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Ask of every pairing: what does each part add?</text>
  <text x="480" y="383" text-anchor="middle" font-size="15" fill="#111111">Keep supportive repetition only while the learner needs it.</text>
  <text x="480" y="440" text-anchor="middle" font-size="13" fill="#333333">Placement along the arrow is schematic; effects depend on learner and context.</text>
</svg>
