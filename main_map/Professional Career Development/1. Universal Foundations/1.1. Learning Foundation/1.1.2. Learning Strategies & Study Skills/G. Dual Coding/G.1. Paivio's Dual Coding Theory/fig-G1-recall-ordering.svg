<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Predicted ordering of recall</title>
  <desc>Schematic stacked bars showing recall rising from abstract words (verbal code only), through concrete words (sometimes imaged), to concrete words with imagery instructions, to pictures (spontaneously named, so two codes).</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">More codes, better recall: the dual coding prediction</text>
  <line x1="120" y1="420" x2="900" y2="420" stroke="#222222" stroke-width="2.5"/>
  <line x1="120" y1="420" x2="120" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="70" y="250" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 70 250)">Relative recall</text>

  <rect x="160" y="330" width="140" height="90" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="345" y="270" width="140" height="150" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="345" y="250" width="140" height="20" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="530" y="240" width="140" height="180" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="530" y="180" width="140" height="60" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="715" y="230" width="140" height="190" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="715" y="110" width="140" height="120" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>

  <g font-size="15" fill="#111111" text-anchor="middle" font-weight="bold">
    <text x="230" y="446">Abstract words</text>
    <text x="415" y="446">Concrete words</text>
    <text x="600" y="446">Concrete words</text>
    <text x="785" y="446">Pictures</text>
  </g>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="230" y="466">verbal code only</text>
    <text x="415" y="466">sometimes imaged</text>
    <text x="600" y="466">plus imagery instruction</text>
    <text x="785" y="466">named spontaneously</text>
  </g>
  <rect x="150" y="90" width="290" height="70" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <rect x="166" y="104" width="28" height="18" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/>
  <text x="206" y="119" font-size="14" fill="#111111">contribution of verbal code</text>
  <rect x="166" y="132" width="28" height="18" fill="url(#dots)" stroke="#7A5200" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="206" y="147" font-size="14" fill="#111111">contribution of image code</text>
  <text x="480" y="515" text-anchor="middle" font-size="13" fill="#333333">Schematic of the predicted ordering; bar heights are illustrative, not plotted from a single dataset.</text>
</svg>
