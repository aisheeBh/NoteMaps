<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Truncated axis distortion</title>
  <desc>Left: revenue of 100 and 110 shown on an axis starting at zero; the bars look similar, a 10 per cent rise. Right: the same values on an axis starting at 95; the second bar looks three times as tall. The lie factor is 20.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Same data, different impression</text>
  <text x="240" y="76" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Axis from 0: honest</text>
  <text x="720" y="76" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Axis from 95: distorted</text>

  <line x1="100" y1="420" x2="400" y2="420" stroke="#222222" stroke-width="2.5"/>
  <line x1="100" y1="420" x2="100" y2="100" stroke="#222222" stroke-width="2.5"/>
  <g font-size="13" fill="#111111" text-anchor="end"><text x="92" y="424">0</text><text x="92" y="284">50</text><text x="92" y="144">100</text></g>
  <rect x="150" y="140" width="80" height="280" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="270" y="112" width="80" height="308" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <g font-size="15" fill="#111111" text-anchor="middle"><text x="190" y="130">100</text><text x="310" y="104">110</text><text x="190" y="444">2024</text><text x="310" y="444">2025</text></g>

  <line x1="580" y1="420" x2="880" y2="420" stroke="#222222" stroke-width="2.5"/>
  <line x1="580" y1="420" x2="580" y2="100" stroke="#222222" stroke-width="2.5"/>
  <g font-size="13" fill="#111111" text-anchor="end"><text x="572" y="424">95</text><text x="572" y="284">102.5</text><text x="572" y="144">110</text></g>
  <rect x="630" y="327" width="80" height="93" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="750" y="140" width="80" height="280" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <g font-size="15" fill="#111111" text-anchor="middle"><text x="670" y="317">100</text><text x="790" y="130">110</text><text x="670" y="444">2024</text><text x="790" y="444">2025</text></g>
  <path d="M574 405 l12 -6 M574 413 l12 -6" stroke="#8B0000" stroke-width="2"/>

  <rect x="120" y="462" width="250" height="34" fill="#FFFFFF" stroke="#1E5E24" stroke-width="3"/>
  <text x="245" y="485" text-anchor="middle" font-size="15" fill="#111111">looks like +10%, is +10%</text>
  <rect x="580" y="462" width="300" height="34" fill="#FFFFFF" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="730" y="485" text-anchor="middle" font-size="15" fill="#111111">looks like +200%, is +10%: lie factor 20</text>
  <text x="480" y="525" text-anchor="middle" font-size="13" fill="#333333">Illustrative revenue figures; bar lengths must start at zero to be compared correctly.</text>
</svg>
