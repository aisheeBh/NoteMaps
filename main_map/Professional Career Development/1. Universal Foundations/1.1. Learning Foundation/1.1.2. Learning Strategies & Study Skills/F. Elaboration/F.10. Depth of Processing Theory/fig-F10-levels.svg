<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Levels of processing for a single word</title>
  <desc>Four levels at which the word LIABILITY can be processed, from shallow structural processing (is it in capitals?) through phonemic (does it rhyme with ability?) and semantic (is it a kind of debt?) to elaborated semantic processing (how would it appear on our balance sheet?), with later memory rising with depth.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
  </defs>

  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">The same word processed at four depths</text>
  <text x="480" y="62" text-anchor="middle" font-size="15" fill="#111111">Word shown: LIABILITY</text>

  <g font-size="15" fill="#111111">
    <rect x="60" y="470" width="660" height="72" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="76" y="496" font-weight="bold">STRUCTURAL (shallowest)</text>
    <text x="76" y="520">"Is the word printed in capital letters?"</text>

    <rect x="60" y="380" width="660" height="72" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
    <text x="76" y="406" font-weight="bold">PHONEMIC</text>
    <text x="76" y="430">"Does it rhyme with ABILITY?"</text>

    <rect x="60" y="290" width="660" height="72" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
    <text x="76" y="316" font-weight="bold">SEMANTIC</text>
    <text x="76" y="340">"Is a liability a kind of obligation the firm owes?"</text>

    <rect x="60" y="180" width="660" height="92" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
    <rect x="72" y="190" width="636" height="72" fill="#FFFFFF"/>
    <text x="84" y="214" font-weight="bold">ELABORATED SEMANTIC (deepest)</text>
    <text x="84" y="238">"If the supplier demanded payment in 30 days, not 60,</text>
    <text x="84" y="256">what would happen to our payables and our cash?"</text>
  </g>

  <!-- memory bar on right -->
  <line x1="770" y1="540" x2="770" y2="140" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="800" y="120" font-size="15" font-weight="bold" fill="#111111">later memory</text>
  <rect x="790" y="490" width="40" height="40" fill="#E6E6E6" stroke="#666666" stroke-width="1"/>
  <rect x="790" y="395" width="40" height="45" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <rect x="790" y="285" width="40" height="70" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="790" y="170" width="40" height="100" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <text x="845" y="515" font-size="14" fill="#111111">poor</text>
  <text x="845" y="230" font-size="14" fill="#111111">best</text>

  <text x="480" y="568" text-anchor="middle" font-size="13" fill="#333333">Schematic after Craik and Lockhart (1972); bar sizes illustrate the typical ordering, not data.</text>
</svg>
