<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The expertise reversal effect</title>
  <desc>Schematic: for novices, studying and self-explaining worked examples produces more learning than solving problems unaided; as expertise grows, the advantage shrinks and reverses, so that for more expert learners, solving problems and elaborating their own solutions produces more learning.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">What helps novices can hold back the more expert</text>

  <line x1="130" y1="430" x2="880" y2="430" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="130" y1="430" x2="130" y2="80" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="505" y="470" text-anchor="middle" font-size="16" fill="#111111">Learner's expertise in the domain</text>
  <text x="80" y="255" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 80 255)">Learning from the session</text>
  <text x="170" y="455" font-size="14" fill="#111111">novice</text>
  <text x="790" y="455" font-size="14" fill="#111111">more expert</text>

  <!-- worked examples: solid, falling -->
  <path d="M160 160 C 360 170, 560 260, 840 330" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <!-- problem solving: dashed, rising -->
  <path d="M160 350 C 360 320, 560 230, 840 150" fill="none" stroke="#222222" stroke-width="4" stroke-dasharray="10 6"/>

  <rect x="170" y="100" width="300" height="46" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="182" y="120" font-size="15" font-weight="bold" fill="#111111">Worked examples + self-explanation</text>
  <text x="182" y="138" font-size="14" fill="#111111">best for novices</text>

  <rect x="560" y="96" width="300" height="46" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="572" y="116" font-size="15" font-weight="bold" fill="#111111">Solving + elaborating own solution</text>
  <text x="572" y="134" font-size="14" fill="#111111">best for the more expert</text>

  <line x1="540" y1="245" x2="540" y2="425" stroke="#555555" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="550" y="400" font-size="14" fill="#111111">crossover:</text>
  <text x="550" y="418" font-size="14" fill="#111111">fade the examples</text>

  <text x="480" y="530" text-anchor="middle" font-size="13" fill="#333333">Schematic of the pattern described by Kalyuga and colleagues; not plotted from a single dataset.</text>
</svg>
