<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Four ways of learning word pairs</title>
  <desc>Schematic of Bower and Winzenz (1970): recall of word pairs was lowest after rote repetition, higher after reading a sentence linking the words, and highest after generating one's own linking sentence or forming an interactive mental image.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
  </defs>

  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Generating a link, in words or in images, beats repeating the pair</text>
  <text x="480" y="62" text-anchor="middle" font-size="15" fill="#111111">Pair to learn: DOG - BICYCLE</text>

  <line x1="120" y1="420" x2="900" y2="420" stroke="#222222" stroke-width="2.5"/>
  <line x1="120" y1="420" x2="120" y2="90" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="70" y="255" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 70 255)">Pairs recalled later</text>

  <rect x="160" y="350" width="140" height="70" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <rect x="350" y="270" width="140" height="150" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="540" y="160" width="140" height="260" fill="url(#dots)" stroke="#7A5200" stroke-width="2.5"/>
  <rect x="730" y="140" width="140" height="280" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>

  <g text-anchor="middle" fill="#111111">
    <text x="230" y="448" font-size="15" font-weight="bold">Rote repetition</text>
    <text x="230" y="468" font-size="14">"dog-bicycle, dog-</text>
    <text x="230" y="486" font-size="14">bicycle..."</text>
    <text x="420" y="448" font-size="15" font-weight="bold">Read a sentence</text>
    <text x="420" y="468" font-size="14">"The dog rode</text>
    <text x="420" y="486" font-size="14">the bicycle."</text>
    <text x="610" y="448" font-size="15" font-weight="bold">Generate a sentence</text>
    <text x="610" y="468" font-size="14">learner writes their</text>
    <text x="610" y="486" font-size="14">own link</text>
    <text x="800" y="448" font-size="15" font-weight="bold">Interactive image</text>
    <text x="800" y="468" font-size="14">picture the dog</text>
    <text x="800" y="486" font-size="14">pedalling the bicycle</text>
  </g>

  <rect x="150" y="110" width="330" height="64" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
  <text x="162" y="134" font-size="14" fill="#111111">Verbal and visual links both work best</text>
  <text x="162" y="152" font-size="14" fill="#111111">when the learner creates them and the</text>
  <text x="162" y="170" font-size="14" fill="#111111">two items interact.</text>

  <text x="480" y="540" text-anchor="middle" font-size="13" fill="#333333">Schematic of the reported ordering; bar heights are illustrative, not data.</text>
</svg>
