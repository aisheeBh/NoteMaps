<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>A ladder of why-questions</title>
  <desc>Each rung answers the why-question of the rung below, climbing from a surface fact about bond prices to a bedrock principle about comparing returns; the climb stops when the answer is a principle already understood.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
  </defs>

  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Climbing a ladder of why-questions until the answer is bedrock</text>

  <!-- rungs as a staircase -->
  <g font-size="15" fill="#111111">
    <rect x="60" y="470" width="400" height="70" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
    <text x="76" y="496" font-weight="bold">FACT</text>
    <text x="76" y="520">When interest rates rise, existing bond prices fall.</text>

    <rect x="190" y="370" width="420" height="70" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
    <text x="206" y="396" font-weight="bold">WHY? 1</text>
    <text x="206" y="420">New bonds now pay more than the old ones.</text>

    <rect x="320" y="270" width="440" height="70" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
    <text x="336" y="296" font-weight="bold">WHY? 2</text>
    <text x="336" y="320">So nobody pays full price for the lower coupon.</text>

    <rect x="450" y="170" width="450" height="70" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
    <text x="466" y="196" font-weight="bold">WHY? 3</text>
    <text x="466" y="220">The price drops until both bonds yield the same.</text>

    <rect x="500" y="70" width="400" height="76" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
    <rect x="512" y="80" width="376" height="56" fill="#FFFFFF"/>
    <text x="524" y="102" font-weight="bold">BEDROCK PRINCIPLE</text>
    <text x="524" y="124">Investors compare returns: equal risk, equal yield.</text>
  </g>

  <path d="M260 470 L260 445" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M400 370 L400 345" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M540 270 L540 245" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M680 170 L680 151" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>

  <g font-size="14" fill="#111111">
    <text x="60" y="140">Stop climbing when the</text>
    <text x="60" y="158">answer is a principle the</text>
    <text x="60" y="176">learner already understands</text>
    <text x="60" y="194">and can apply elsewhere.</text>
  </g>
  <g font-size="14" fill="#111111">
    <text x="640" y="420">Each rung answers the</text>
    <text x="640" y="438">question asked of the</text>
    <text x="640" y="456">rung below it.</text>
  </g>

  <text x="480" y="580" text-anchor="middle" font-size="13" fill="#333333">Illustrative chain for fixed-rate bonds of equal risk; real pricing also reflects time to maturity.</text>
</svg>
