<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Structure mapping: water flow and electric circuits</title>
  <desc>Water-system objects map to circuit objects: pump to battery, pressure to voltage, flow rate to current, narrow pipe to resistor. Relations carry across; surface attributes such as wetness do not. One relation breaks: water can spill from an open pipe but current does not flow out of a cut wire.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">An analogy maps relations, not appearances</text>

  <text x="210" y="80" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">SOURCE (familiar): water pipes</text>
  <text x="750" y="80" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">TARGET (new): electric circuit</text>

  <g font-size="15" fill="#111111">
    <rect x="70" y="105" width="280" height="50" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
    <text x="86" y="136">Pump</text>
    <rect x="610" y="105" width="280" height="50" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
    <text x="626" y="136">Battery</text>

    <rect x="70" y="175" width="280" height="50" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
    <text x="86" y="206">Water pressure difference</text>
    <rect x="610" y="175" width="280" height="50" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
    <text x="626" y="206">Voltage</text>

    <rect x="70" y="245" width="280" height="50" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
    <text x="86" y="276">Flow rate</text>
    <rect x="610" y="245" width="280" height="50" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
    <text x="626" y="276">Current</text>

    <rect x="70" y="315" width="280" height="50" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
    <text x="86" y="346">Narrow pipe</text>
    <rect x="610" y="315" width="280" height="50" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
    <text x="626" y="346">Resistor</text>
  </g>
  <g stroke="#1E5E24" stroke-width="3.5">
    <line x1="350" y1="130" x2="604" y2="130" marker-end="url(#arrow)"/>
    <line x1="350" y1="200" x2="604" y2="200" marker-end="url(#arrow)"/>
    <line x1="350" y1="270" x2="604" y2="270" marker-end="url(#arrow)"/>
    <line x1="350" y1="340" x2="604" y2="340" marker-end="url(#arrow)"/>
  </g>
  <rect x="380" y="220" width="200" height="30" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1.5"/>
  <text x="480" y="241" text-anchor="middle" font-size="14" fill="#111111">relations carry across</text>

  <!-- relation box -->
  <rect x="70" y="390" width="820" height="56" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="480" y="414" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Mapped relation: more pressure (voltage) through the same narrowing (resistance) gives more flow (current)</text>
  <text x="480" y="434" text-anchor="middle" font-size="14" fill="#111111">This is the part of the analogy that teaches - it previews the relation later written as V = I x R</text>

  <!-- not mapped -->
  <rect x="70" y="470" width="390" height="70" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="86" y="494" font-size="15" font-weight="bold" fill="#111111">NOT MAPPED: surface attributes</text>
  <text x="86" y="516" font-size="14" fill="#111111">water is wet, visible, can be heard -</text>
  <text x="86" y="534" font-size="14" fill="#111111">irrelevant to circuits and correctly dropped</text>

  <rect x="500" y="470" width="390" height="70" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="516" y="494" font-size="15" font-weight="bold" fill="#111111">BREAKS: where the analogy misleads</text>
  <text x="516" y="516" font-size="14" fill="#111111">a cut pipe spills water; a cut wire</text>
  <text x="516" y="534" font-size="14" fill="#111111">does not leak current - flow simply stops</text>

  <text x="480" y="580" text-anchor="middle" font-size="13" fill="#333333">After Dedre Gentner's structure-mapping theory; the hydraulic analogy is simplified.</text>
</svg>
