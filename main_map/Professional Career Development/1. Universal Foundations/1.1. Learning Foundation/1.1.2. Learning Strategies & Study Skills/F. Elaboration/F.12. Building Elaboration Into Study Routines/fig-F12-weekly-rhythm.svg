<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>A weekly rhythm of elaboration</title>
  <desc>A week of study for a working professional: short weekday sessions each combine new material with elaboration prompts and a brief explain-from-memory close; a weekend integration session connects the week's topics, and a short check later tests the connections from memory.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
  </defs>

  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">A week with elaboration built in</text>

  <g font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">
    <text x="105" y="80">Mon</text><text x="225" y="80">Tue</text><text x="345" y="80">Wed</text>
    <text x="465" y="80">Thu</text><text x="585" y="80">Fri</text><text x="725" y="80">Sat</text><text x="865" y="80">Sun</text>
  </g>

  <!-- weekday sessions -->
  <g>
    <rect x="50" y="100" width="110" height="140" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
    <rect x="170" y="100" width="110" height="140" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
    <rect x="290" y="100" width="110" height="140" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
    <rect x="410" y="100" width="110" height="140" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
    <rect x="530" y="100" width="110" height="140" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  </g>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <rect x="58" y="130" width="94" height="80" fill="#FFFFFF"/>
    <text x="105" y="150">40 min:</text><text x="105" y="168">new topic</text><text x="105" y="186">+ why/how</text><text x="105" y="204">+ close</text>
    <rect x="178" y="130" width="94" height="80" fill="#FFFFFF"/>
    <text x="225" y="150">40 min:</text><text x="225" y="168">new topic</text><text x="225" y="186">+ examples</text><text x="225" y="204">+ close</text>
    <rect x="298" y="130" width="94" height="80" fill="#FFFFFF"/>
    <text x="345" y="150">40 min:</text><text x="345" y="168">problems</text><text x="345" y="186">+ explain</text><text x="345" y="204">steps</text>
    <rect x="418" y="130" width="94" height="80" fill="#FFFFFF"/>
    <text x="465" y="150">40 min:</text><text x="465" y="168">new topic</text><text x="465" y="186">+ analogy</text><text x="465" y="204">+ close</text>
    <text x="585" y="160">rest or</text><text x="585" y="178">light</text><text x="585" y="196">reading</text>
  </g>

  <!-- weekend integration -->
  <rect x="660" y="100" width="130" height="250" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="668" y="110" width="114" height="230" fill="#FFFFFF"/>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="725" y="134" font-weight="bold">INTEGRATION</text>
    <text x="725" y="154">75 min</text>
    <text x="725" y="182">explain the</text><text x="725" y="200">week from</text><text x="725" y="218">memory</text>
    <text x="725" y="246">compare and</text><text x="725" y="264">connect the</text><text x="725" y="282">topics</text>
    <text x="725" y="310">update notes</text>
  </g>

  <rect x="810" y="100" width="110" height="140" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
  <rect x="818" y="130" width="94" height="80" fill="#FFFFFF"/>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="865" y="150">15 min:</text><text x="865" y="168">plan next</text><text x="865" y="186">week's</text><text x="865" y="204">questions</text>
  </g>

  <!-- session anatomy -->
  <rect x="50" y="380" width="870" height="130" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="66" y="406" font-size="16" font-weight="bold" fill="#111111">Inside each weekday session</text>
  <g font-size="14" fill="#111111">
    <text x="66" y="434">5 min  BEFORE: brain-dump what I know; write 2 questions the material should answer</text>
    <text x="66" y="458">30 min DURING: pause after each section - explain it, ask why or how, connect to work</text>
    <text x="66" y="482">5 min  CLOSE: explain the session from memory in 5 sentences; mark what I could not explain</text>
  </g>

  <text x="480" y="540" text-anchor="middle" font-size="13" fill="#333333">An illustrative schedule; durations should be adapted to the learner's time and material.</text>
</svg>
