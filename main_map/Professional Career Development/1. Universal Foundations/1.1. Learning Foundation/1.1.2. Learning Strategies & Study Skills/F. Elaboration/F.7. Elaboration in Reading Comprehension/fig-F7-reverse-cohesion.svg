<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The reverse cohesion effect</title>
  <desc>Schematic of McNamara and colleagues (1996): on deep comprehension questions, low-knowledge readers did better with a highly cohesive text, while high-knowledge readers did better with a less cohesive text that forced them to make their own inferences.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">A gappier text can teach knowledgeable readers more</text>

  <line x1="140" y1="440" x2="860" y2="440" stroke="#222222" stroke-width="2.5"/>
  <line x1="140" y1="440" x2="140" y2="80" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="88" y="260" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 88 260)">Deep comprehension (inference questions)</text>

  <text x="280" y="470" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Highly cohesive text</text>
  <text x="280" y="490" text-anchor="middle" font-size="14" fill="#111111">links and steps spelled out</text>
  <text x="720" y="470" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Less cohesive text</text>
  <text x="720" y="490" text-anchor="middle" font-size="14" fill="#111111">reader must infer the links</text>

  <!-- low knowledge: solid falling -->
  <line x1="280" y1="290" x2="720" y2="390" stroke="#1F3B5C" stroke-width="4"/>
  <circle cx="280" cy="290" r="8" fill="#1F3B5C"/>
  <circle cx="720" cy="390" r="8" fill="#1F3B5C"/>
  <!-- high knowledge: dashed rising -->
  <line x1="280" y1="210" x2="720" y2="120" stroke="#222222" stroke-width="4" stroke-dasharray="10 6"/>
  <rect x="272" y="202" width="16" height="16" fill="#FFFFFF" stroke="#222222" stroke-width="2.5"/>
  <rect x="712" y="112" width="16" height="16" fill="#FFFFFF" stroke="#222222" stroke-width="2.5"/>

  <rect x="740" y="90" width="190" height="46" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="752" y="110" font-size="15" font-weight="bold" fill="#111111">High-knowledge</text>
  <text x="752" y="128" font-size="14" fill="#111111">readers: gain from gaps</text>

  <rect x="740" y="370" width="190" height="46" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="752" y="390" font-size="15" font-weight="bold" fill="#111111">Low-knowledge</text>
  <text x="752" y="408" font-size="14" fill="#111111">readers: lost in gaps</text>

  <text x="480" y="535" text-anchor="middle" font-size="13" fill="#333333">Schematic of the reported interaction; positions are illustrative, not data.</text>
</svg>
