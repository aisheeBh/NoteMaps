<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Evidence strength</title>
  <desc>Horizontal bars rating how firmly claims about interleaving are supported, from well established to unfavourable.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="38" font-size="24" text-anchor="middle" fill="#111111" font-weight="bold">How firmly is each claim supported?</text>
  <line x1="360.0" y1="70" x2="360.0" y2="545" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="360.0" y="565" font-size="14" text-anchor="middle" fill="#111111">unfavourable</text>
  <line x1="490.0" y1="70" x2="490.0" y2="545" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="490.0" y="565" font-size="14" text-anchor="middle" fill="#111111">contested</text>
  <line x1="620.0" y1="70" x2="620.0" y2="545" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="620.0" y="565" font-size="14" text-anchor="middle" fill="#111111">variable</text>
  <line x1="750.0" y1="70" x2="750.0" y2="545" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="750.0" y="565" font-size="14" text-anchor="middle" fill="#111111">supported</text>
  <line x1="880.0" y1="70" x2="880.0" y2="545" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="880.0" y="565" font-size="14" text-anchor="middle" fill="#111111">well established</text>
  <text x="346" y="106" font-size="15" text-anchor="end" fill="#111111" font-weight="bold">Confusable visual categories</text>
  <rect x="360" y="88" width="520.0" height="30" rx="0" fill="url(#hatch)" stroke="#222222" stroke-width="1.5"/>
  <text x="346" y="158" font-size="15" text-anchor="end" fill="#111111" font-weight="bold">Mathematics in classrooms</text>
  <rect x="360" y="140" width="520.0" height="30" rx="0" fill="url(#hatch)" stroke="#222222" stroke-width="1.5"/>
  <text x="346" y="210" font-size="15" text-anchor="end" fill="#111111" font-weight="bold">Learners misjudge the schedules</text>
  <rect x="360" y="192" width="520.0" height="30" rx="0" fill="url(#hatch)" stroke="#222222" stroke-width="1.5"/>
  <text x="346" y="262" font-size="15" text-anchor="end" fill="#111111" font-weight="bold">Second-language grammar choices</text>
  <rect x="360" y="244" width="390.0" height="30" rx="0" fill="url(#dots)" stroke="#222222" stroke-width="1.5"/>
  <text x="346" y="314" font-size="15" text-anchor="end" fill="#111111" font-weight="bold">Laboratory motor skills, adults</text>
  <rect x="360" y="296" width="390.0" height="30" rx="0" fill="url(#dots)" stroke="#222222" stroke-width="1.5"/>
  <text x="346" y="366" font-size="15" text-anchor="end" fill="#111111" font-weight="bold">Laboratory mathematics</text>
  <rect x="360" y="348" width="260.0" height="30" rx="0" fill="url(#dots)" stroke="#222222" stroke-width="1.5"/>
  <text x="346" y="418" font-size="15" text-anchor="end" fill="#111111" font-weight="bold">Field sports and children</text>
  <rect x="360" y="400" width="130.0" height="30" rx="0" fill="url(#lines)" stroke="#222222" stroke-width="1.5"/>
  <text x="346" y="470" font-size="15" text-anchor="end" fill="#111111" font-weight="bold">Year-long curriculum effects</text>
  <rect x="360" y="452" width="130.0" height="30" rx="0" fill="url(#lines)" stroke="#222222" stroke-width="1.5"/>
  <text x="346" y="522" font-size="15" text-anchor="end" fill="#111111" font-weight="bold">Word lists and whole texts</text>
  <rect x="360" y="504" width="14" height="30" rx="0" fill="url(#lines)" stroke="#222222" stroke-width="1.5"/>
  <text x="480.0" y="590" font-size="13" text-anchor="middle" fill="#333333">Summary judgement of the research described; positions are qualitative.</text>
</svg>
