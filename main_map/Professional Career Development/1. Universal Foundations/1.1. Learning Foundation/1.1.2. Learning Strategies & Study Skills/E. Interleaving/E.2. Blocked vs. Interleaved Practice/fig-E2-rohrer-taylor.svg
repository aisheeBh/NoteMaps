<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Rohrer and Taylor 2007 results</title>
  <desc>Bar chart: practice scores blocked 89 percent, mixed 60 percent; test one week later blocked 20 percent, mixed 63 percent.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="40" font-size="24" text-anchor="middle" fill="#111111" font-weight="bold">Practice and one-week test: blocked versus mixed</text>
  <line x1="140" y1="430" x2="700" y2="430" stroke="#222222" stroke-width="2.5"/>
  <line x1="140" y1="430" x2="140" y2="80" stroke="#222222" stroke-width="2.5"/>
  <line x1="134" y1="430.0" x2="140" y2="430.0" stroke="#222222" stroke-width="1.5"/>
  <text x="130" y="435.0" font-size="14" text-anchor="end" fill="#111111">0</text>
  <line x1="134" y1="345.0" x2="140" y2="345.0" stroke="#222222" stroke-width="1.5"/>
  <text x="130" y="350.0" font-size="14" text-anchor="end" fill="#111111">25</text>
  <line x1="140" y1="345.0" x2="700" y2="345.0" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="134" y1="260.0" x2="140" y2="260.0" stroke="#222222" stroke-width="1.5"/>
  <text x="130" y="265.0" font-size="14" text-anchor="end" fill="#111111">50</text>
  <line x1="140" y1="260.0" x2="700" y2="260.0" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="134" y1="175.0" x2="140" y2="175.0" stroke="#222222" stroke-width="1.5"/>
  <text x="130" y="180.0" font-size="14" text-anchor="end" fill="#111111">75</text>
  <line x1="140" y1="175.0" x2="700" y2="175.0" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="134" y1="90.0" x2="140" y2="90.0" stroke="#222222" stroke-width="1.5"/>
  <text x="130" y="95.0" font-size="14" text-anchor="end" fill="#111111">100</text>
  <line x1="140" y1="90.0" x2="700" y2="90.0" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="90" y="260.0" font-size="15" text-anchor="middle" fill="#111111" transform="rotate(-90 90 260.0)">Percentage correct</text>
  <rect x="187.0" y="127.39999999999998" width="90" height="302.6" rx="0" fill="url(#dots)" stroke="#222222" stroke-width="1.5"/>
  <rect x="208.0" y="101.39999999999998" width="48" height="20" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="232.0" y="117.39999999999998" font-size="15" text-anchor="middle" fill="#111111" font-weight="bold">89%</text>
  <rect x="283.0" y="226.0" width="90" height="204.0" rx="0" fill="url(#hatch)" stroke="#222222" stroke-width="1.5"/>
  <rect x="304.0" y="200.0" width="48" height="20" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="328.0" y="216.0" font-size="15" text-anchor="middle" fill="#111111" font-weight="bold">60%</text>
  <text x="280.0" y="454" font-size="15" text-anchor="middle" fill="#111111" font-weight="bold">During practice</text>
  <rect x="467.0" y="362.0" width="90" height="68.0" rx="0" fill="url(#dots)" stroke="#222222" stroke-width="1.5"/>
  <rect x="488.0" y="336.0" width="48" height="20" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="512.0" y="352.0" font-size="15" text-anchor="middle" fill="#111111" font-weight="bold">20%</text>
  <rect x="563.0" y="215.8" width="90" height="214.2" rx="0" fill="url(#hatch)" stroke="#222222" stroke-width="1.5"/>
  <rect x="584.0" y="189.8" width="48" height="20" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="608.0" y="205.8" font-size="15" text-anchor="middle" fill="#111111" font-weight="bold">63%</text>
  <text x="560.0" y="454" font-size="15" text-anchor="middle" fill="#111111" font-weight="bold">Test one week later</text>
  <rect x="730" y="200" width="26" height="20" rx="0" fill="url(#dots)" stroke="#222222" stroke-width="1.5"/>
  <text x="766" y="216" font-size="15" text-anchor="start" fill="#111111">Blocked practice</text>
  <rect x="730" y="240" width="26" height="20" rx="0" fill="url(#hatch)" stroke="#222222" stroke-width="1.5"/>
  <text x="766" y="256" font-size="15" text-anchor="start" fill="#111111">Mixed practice</text>
  <text x="730" y="300" font-size="14" text-anchor="start" fill="#111111">Approximate values</text>
  <text x="730" y="320" font-size="14" text-anchor="start" fill="#111111">Rohrer and Taylor (2007),</text>
  <text x="730" y="340" font-size="14" text-anchor="start" fill="#111111">volume problems for four</text>
  <text x="730" y="360" font-size="14" text-anchor="start" fill="#111111">unusual solids</text>
</svg>
