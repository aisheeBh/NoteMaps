<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Crossover</title>
  <desc>Schematic: blocked practice scores higher during practice; interleaved practice scores higher at a delayed test.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="40" font-size="24" text-anchor="middle" fill="#111111" font-weight="bold">Blocked leads in practice; interleaved leads later</text>
  <rect x="580" y="70" width="300" height="370" rx="0" fill="#F2F2F2" stroke="#555555" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="730" y="94" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">DELAYED TEST</text>
  <text x="730" y="114" font-size="14" text-anchor="middle" fill="#111111">days or weeks later, mixed items</text>
  <text x="330" y="94" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">PRACTICE SESSIONS</text>
  <line x1="90" y1="440" x2="900" y2="440" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="90" y1="440" x2="90" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="495" y="476" font-size="16" text-anchor="middle" fill="#111111">Time</text>
  <text x="44" y="255" font-size="16" text-anchor="middle" fill="#111111" transform="rotate(-90 44 255)">Accuracy</text>
  <path d="M100 400 C 200 260, 320 160, 560 140" fill="none" stroke="#222222" stroke-width="3" stroke-dasharray="10 6"/>
  <path d="M560 140 C 620 170, 680 320, 860 350" fill="none" stroke="#222222" stroke-width="3" stroke-dasharray="10 6"/>
  <circle cx="860" cy="350" r="6" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <path d="M100 410 C 250 380, 400 290, 560 250" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <path d="M560 250 C 650 240, 750 225, 860 215" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <circle cx="860" cy="215" r="6" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <rect x="106" y="126" width="230" height="46" rx="0" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="118" y="146" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">Blocked</text>
  <text x="118" y="164" font-size="14" text-anchor="start" fill="#111111">high, fast-rising practice scores</text>
  <rect x="300" y="318" width="250" height="46" rx="0" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="312" y="338" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">Interleaved</text>
  <text x="312" y="356" font-size="14" text-anchor="start" fill="#111111">lower, slower practice scores</text>
  <text x="740" y="385" font-size="14" text-anchor="middle" fill="#111111">blocked: large loss</text>
  <text x="740" y="195" font-size="14" text-anchor="middle" fill="#111111">interleaved: higher</text>
  <text x="480.0" y="520" font-size="13" text-anchor="middle" fill="#333333">Schematic of a frequently replicated pattern for confusable types; not plotted from a single dataset.</text>
</svg>
