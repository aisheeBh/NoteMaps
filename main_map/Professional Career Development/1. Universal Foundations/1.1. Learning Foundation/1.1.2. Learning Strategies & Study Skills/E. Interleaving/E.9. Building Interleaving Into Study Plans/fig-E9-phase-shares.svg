<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Share of mixed practice</title>
  <desc>Stacked bars for weeks one to ten. Mixed practice share rises from 20 percent in week one to 100 percent in weeks nine and ten; the rest is new learning with blocked practice.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="38" font-size="24" text-anchor="middle" fill="#111111" font-weight="bold">Mix early, mix more, mix last</text>
  <line x1="120" y1="420" x2="820" y2="420" stroke="#222222" stroke-width="2.5"/>
  <line x1="120" y1="420" x2="120" y2="75" stroke="#222222" stroke-width="2.5"/>
  <line x1="114" y1="420.0" x2="120" y2="420.0" stroke="#222222" stroke-width="1.5"/>
  <text x="110" y="425.0" font-size="14" text-anchor="end" fill="#111111">0%</text>
  <line x1="114" y1="335.0" x2="120" y2="335.0" stroke="#222222" stroke-width="1.5"/>
  <text x="110" y="340.0" font-size="14" text-anchor="end" fill="#111111">25%</text>
  <line x1="114" y1="250.0" x2="120" y2="250.0" stroke="#222222" stroke-width="1.5"/>
  <text x="110" y="255.0" font-size="14" text-anchor="end" fill="#111111">50%</text>
  <line x1="114" y1="165.0" x2="120" y2="165.0" stroke="#222222" stroke-width="1.5"/>
  <text x="110" y="170.0" font-size="14" text-anchor="end" fill="#111111">75%</text>
  <line x1="114" y1="80.0" x2="120" y2="80.0" stroke="#222222" stroke-width="1.5"/>
  <text x="110" y="85.0" font-size="14" text-anchor="end" fill="#111111">100%</text>
  <text x="58" y="250.0" font-size="15" text-anchor="middle" fill="#111111" transform="rotate(-90 58 250.0)">Share of practice time</text>
  <rect x="135" y="352.0" width="50" height="68.0" rx="0" fill="url(#hatch)" stroke="#222222" stroke-width="1.5"/>
  <rect x="135" y="80" width="50" height="272.0" rx="0" fill="url(#dots)" stroke="#222222" stroke-width="1.5"/>
  <text x="160" y="442" font-size="14" text-anchor="middle" fill="#111111" font-weight="bold">W1</text>
  <rect x="203" y="352.0" width="50" height="68.0" rx="0" fill="url(#hatch)" stroke="#222222" stroke-width="1.5"/>
  <rect x="203" y="80" width="50" height="272.0" rx="0" fill="url(#dots)" stroke="#222222" stroke-width="1.5"/>
  <text x="228" y="442" font-size="14" text-anchor="middle" fill="#111111" font-weight="bold">W2</text>
  <rect x="271" y="301.0" width="50" height="119.0" rx="0" fill="url(#hatch)" stroke="#222222" stroke-width="1.5"/>
  <rect x="271" y="80" width="50" height="221.0" rx="0" fill="url(#dots)" stroke="#222222" stroke-width="1.5"/>
  <text x="296" y="442" font-size="14" text-anchor="middle" fill="#111111" font-weight="bold">W3</text>
  <rect x="339" y="301.0" width="50" height="119.0" rx="0" fill="url(#hatch)" stroke="#222222" stroke-width="1.5"/>
  <rect x="339" y="80" width="50" height="221.0" rx="0" fill="url(#dots)" stroke="#222222" stroke-width="1.5"/>
  <text x="364" y="442" font-size="14" text-anchor="middle" fill="#111111" font-weight="bold">W4</text>
  <rect x="407" y="250.0" width="50" height="170.0" rx="0" fill="url(#hatch)" stroke="#222222" stroke-width="1.5"/>
  <rect x="407" y="80" width="50" height="170.0" rx="0" fill="url(#dots)" stroke="#222222" stroke-width="1.5"/>
  <text x="432" y="442" font-size="14" text-anchor="middle" fill="#111111" font-weight="bold">W5</text>
  <rect x="475" y="250.0" width="50" height="170.0" rx="0" fill="url(#hatch)" stroke="#222222" stroke-width="1.5"/>
  <rect x="475" y="80" width="50" height="170.0" rx="0" fill="url(#dots)" stroke="#222222" stroke-width="1.5"/>
  <text x="500" y="442" font-size="14" text-anchor="middle" fill="#111111" font-weight="bold">W6</text>
  <rect x="543" y="148.0" width="50" height="272.0" rx="0" fill="url(#hatch)" stroke="#222222" stroke-width="1.5"/>
  <rect x="543" y="80" width="50" height="68.0" rx="0" fill="url(#dots)" stroke="#222222" stroke-width="1.5"/>
  <text x="568" y="442" font-size="14" text-anchor="middle" fill="#111111" font-weight="bold">W7</text>
  <rect x="611" y="148.0" width="50" height="272.0" rx="0" fill="url(#hatch)" stroke="#222222" stroke-width="1.5"/>
  <rect x="611" y="80" width="50" height="68.0" rx="0" fill="url(#dots)" stroke="#222222" stroke-width="1.5"/>
  <text x="636" y="442" font-size="14" text-anchor="middle" fill="#111111" font-weight="bold">W8</text>
  <rect x="679" y="80.0" width="50" height="340.0" rx="0" fill="url(#hatch)" stroke="#222222" stroke-width="1.5"/>
  <text x="704" y="442" font-size="14" text-anchor="middle" fill="#111111" font-weight="bold">W9</text>
  <rect x="747" y="80.0" width="50" height="340.0" rx="0" fill="url(#hatch)" stroke="#222222" stroke-width="1.5"/>
  <text x="772" y="442" font-size="14" text-anchor="middle" fill="#111111" font-weight="bold">W10</text>
  <line x1="135" y1="460" x2="525" y2="460" stroke="#222222" stroke-width="2"/>
  <text x="330.0" y="482" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Build</text>
  <line x1="543" y1="460" x2="661" y2="460" stroke="#222222" stroke-width="2"/>
  <text x="602.0" y="482" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Mix</text>
  <line x1="679" y1="460" x2="797" y2="460" stroke="#222222" stroke-width="2"/>
  <text x="738.0" y="482" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Simulate</text>
  <rect x="836" y="160" width="26" height="20" rx="0" fill="url(#dots)" stroke="#222222" stroke-width="1.5"/>
  <text x="872" y="176" font-size="15" text-anchor="start" fill="#111111">New topics</text>
  <text x="872" y="196" font-size="15" text-anchor="start" fill="#111111">(blocked)</text>
  <rect x="836" y="260" width="26" height="20" rx="0" fill="url(#hatch)" stroke="#222222" stroke-width="1.5"/>
  <text x="872" y="276" font-size="15" text-anchor="start" fill="#111111">Mixed</text>
  <text x="872" y="296" font-size="15" text-anchor="start" fill="#111111">(unlabelled)</text>
  <text x="480.0" y="548" font-size="13" text-anchor="middle" fill="#333333">Illustrative proportions; research supports rising mixing but not these exact values.</text>
</svg>
