<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Classroom trial results</title>
  <desc>Bar chart: unannounced test about a month after practice, 61 percent correct for mostly interleaved classes and 38 percent for control classes.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="40" font-size="24" text-anchor="middle" fill="#111111" font-weight="bold">Unannounced test about one month later</text>
  <line x1="200" y1="430" x2="660" y2="430" stroke="#222222" stroke-width="2.5"/>
  <line x1="200" y1="430" x2="200" y2="80" stroke="#222222" stroke-width="2.5"/>
  <line x1="194" y1="430.0" x2="200" y2="430.0" stroke="#222222" stroke-width="1.5"/>
  <text x="190" y="435.0" font-size="14" text-anchor="end" fill="#111111">0</text>
  <line x1="194" y1="362.0" x2="200" y2="362.0" stroke="#222222" stroke-width="1.5"/>
  <text x="190" y="367.0" font-size="14" text-anchor="end" fill="#111111">20</text>
  <line x1="194" y1="294.0" x2="200" y2="294.0" stroke="#222222" stroke-width="1.5"/>
  <text x="190" y="299.0" font-size="14" text-anchor="end" fill="#111111">40</text>
  <line x1="194" y1="226.0" x2="200" y2="226.0" stroke="#222222" stroke-width="1.5"/>
  <text x="190" y="231.0" font-size="14" text-anchor="end" fill="#111111">60</text>
  <line x1="194" y1="158.0" x2="200" y2="158.0" stroke="#222222" stroke-width="1.5"/>
  <text x="190" y="163.0" font-size="14" text-anchor="end" fill="#111111">80</text>
  <line x1="194" y1="90.0" x2="200" y2="90.0" stroke="#222222" stroke-width="1.5"/>
  <text x="190" y="95.0" font-size="14" text-anchor="end" fill="#111111">100</text>
  <text x="145" y="260.0" font-size="15" text-anchor="middle" fill="#111111" transform="rotate(-90 145 260.0)">Percentage correct</text>
  <rect x="270" y="300.8" width="120" height="129.2" rx="0" fill="url(#dots)" stroke="#222222" stroke-width="2"/>
  <rect x="300" y="270.8" width="60" height="22" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="330" y="288.8" font-size="17" text-anchor="middle" fill="#111111" font-weight="bold">38%</text>
  <text x="330" y="456" font-size="15" text-anchor="middle" fill="#111111" font-weight="bold">Little interleaving</text>
  <rect x="470" y="222.6" width="120" height="207.4" rx="0" fill="url(#hatch)" stroke="#222222" stroke-width="2"/>
  <rect x="500" y="192.6" width="60" height="22" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="530" y="210.6" font-size="17" text-anchor="middle" fill="#111111" font-weight="bold">61%</text>
  <text x="530" y="456" font-size="15" text-anchor="middle" fill="#111111" font-weight="bold">Mostly interleaved</text>
  <text x="700" y="220" font-size="15" text-anchor="start" fill="#111111">54 seventh-grade classes,</text>
  <text x="700" y="242" font-size="15" text-anchor="start" fill="#111111">randomly assigned</text>
  <text x="700" y="274" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">Effect size d = 0.83</text>
  <text x="480.0" y="520" font-size="13" text-anchor="middle" fill="#333333">Rohrer, Dedrick, Hartwig and Cheung (2020).</text>
</svg>
