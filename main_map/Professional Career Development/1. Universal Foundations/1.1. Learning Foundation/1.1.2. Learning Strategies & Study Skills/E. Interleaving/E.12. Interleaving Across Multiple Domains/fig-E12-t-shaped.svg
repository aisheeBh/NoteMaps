<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>T-shaped professional</title>
  <desc>A T shape: a row of five domains of broad knowledge, a deep vertical bar under operations, and dashed arcs between domains labelled by shared structures such as base rate, bottleneck, feedback loop and selection bias.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="38" font-size="23" text-anchor="middle" fill="#111111" font-weight="bold">Depth in one domain, breadth linked by structure</text>
  <path d="M180 150 Q 229.0 60 278 150" fill="none" stroke="#222222" stroke-width="2.5" stroke-dasharray="8 5"/>
  <rect x="167.0" y="82" width="124" height="24" rx="0" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="229.0" y="99" font-size="14" text-anchor="middle" fill="#111111" font-weight="bold">base rate</text>
  <path d="M348 150 Q 397.0 60 446 150" fill="none" stroke="#222222" stroke-width="2.5" stroke-dasharray="8 5"/>
  <rect x="335.0" y="82" width="124" height="24" rx="0" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="397.0" y="99" font-size="14" text-anchor="middle" fill="#111111" font-weight="bold">bottleneck</text>
  <path d="M516 150 Q 565.0 60 614 150" fill="none" stroke="#222222" stroke-width="2.5" stroke-dasharray="8 5"/>
  <rect x="503.0" y="82" width="124" height="24" rx="0" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="565.0" y="99" font-size="14" text-anchor="middle" fill="#111111" font-weight="bold">feedback loop</text>
  <path d="M684 150 Q 733.0 60 782 150" fill="none" stroke="#222222" stroke-width="2.5" stroke-dasharray="8 5"/>
  <rect x="671.0" y="82" width="124" height="24" rx="0" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="733.0" y="99" font-size="14" text-anchor="middle" fill="#111111" font-weight="bold">selection bias</text>
  <rect x="70" y="150" width="150" height="70" rx="0" fill="url(#dots)" stroke="#222222" stroke-width="1.5"/>
  <rect x="90" y="172" width="110" height="26" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="145" y="191" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Finance</text>
  <rect x="238" y="150" width="150" height="70" rx="0" fill="url(#dots)" stroke="#222222" stroke-width="1.5"/>
  <rect x="258" y="172" width="110" height="26" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="313" y="191" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Data</text>
  <rect x="406" y="150" width="150" height="70" rx="0" fill="url(#dots)" stroke="#222222" stroke-width="1.5"/>
  <rect x="426" y="172" width="110" height="26" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="481" y="191" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Operations</text>
  <rect x="574" y="150" width="150" height="70" rx="0" fill="url(#dots)" stroke="#222222" stroke-width="1.5"/>
  <rect x="594" y="172" width="110" height="26" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="649" y="191" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Research</text>
  <rect x="742" y="150" width="150" height="70" rx="0" fill="url(#dots)" stroke="#222222" stroke-width="1.5"/>
  <rect x="762" y="172" width="110" height="26" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="817" y="191" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Law</text>
  <rect x="406" y="220" width="150" height="260" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="3"/>
  <rect x="416" y="320" width="130" height="50" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="481" y="340" font-size="15" text-anchor="middle" fill="#111111" font-weight="bold">Deep expertise:</text>
  <text x="481" y="360" font-size="15" text-anchor="middle" fill="#111111" font-weight="bold">operations</text>
  <rect x="70" y="300" width="300" height="80" rx="0" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="220.0" y="327.0" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Breadth</text>
  <text x="220.0" y="350.0" font-size="14" text-anchor="middle" fill="#111111">working knowledge of several</text>
  <text x="220.0" y="369.0" font-size="14" text-anchor="middle" fill="#111111">domains, linked by principles</text>
  <rect x="574" y="300" width="318" height="80" rx="0" fill="#FFFFFF" stroke="#222222" stroke-width="2.5"/>
  <text x="733.0" y="327.0" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Depth</text>
  <text x="733.0" y="350.0" font-size="14" text-anchor="middle" fill="#111111">rich schemas and reliable skill</text>
  <text x="733.0" y="369.0" font-size="14" text-anchor="middle" fill="#111111">built by long, focused practice</text>
  <text x="480.0" y="540" font-size="13" text-anchor="middle" fill="#333333">Arcs: structures recognised across domains through deliberate comparison. Illustrative profile.</text>
</svg>
