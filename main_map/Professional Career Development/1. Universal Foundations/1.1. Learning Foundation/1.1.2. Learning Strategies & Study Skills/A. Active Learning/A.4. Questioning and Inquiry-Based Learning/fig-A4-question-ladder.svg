<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Question depth ladder</title>
<desc>Five rising steps of question depth: recall, explain, apply, analyse, evaluate and design, each with a sample question stem.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">From shallow to deep questions</text>
<rect x="60" y="470" width="840" height="70" rx="4" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
<text x="84" y="512" font-size="17" text-anchor="start" font-weight="bold" fill="#111111">RECALL</text>
<text x="876" y="512" font-size="16" text-anchor="end" font-weight="normal" fill="#111111" font-style="italic">What is...? When...? Who...?</text>
<rect x="120" y="385" width="780" height="70" rx="4" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="144" y="427" font-size="17" text-anchor="start" font-weight="bold" fill="#111111">EXPLAIN</text>
<text x="876" y="427" font-size="16" text-anchor="end" font-weight="normal" fill="#111111" font-style="italic">Why...? How does X cause Y?</text>
<rect x="180" y="300" width="720" height="70" rx="4" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
<text x="204" y="342" font-size="17" text-anchor="start" font-weight="bold" fill="#111111">APPLY</text>
<text x="876" y="342" font-size="16" text-anchor="end" font-weight="normal" fill="#111111" font-style="italic">How would this work in...?</text>
<rect x="240" y="215" width="660" height="70" rx="4" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
<rect x="252" y="227" width="636" height="46" rx="4" fill="#FFFFFF"/>
<text x="264" y="257" font-size="17" text-anchor="start" font-weight="bold" fill="#111111">ANALYSE</text>
<text x="876" y="257" font-size="16" text-anchor="end" font-weight="normal" fill="#111111" font-style="italic">What is the evidence? How do X and Y differ?</text>
<rect x="300" y="130" width="600" height="70" rx="4" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<text x="324" y="172" font-size="17" text-anchor="start" font-weight="bold" fill="#FFFFFF">EVALUATE AND DESIGN</text>
<text x="876" y="172" font-size="16" text-anchor="end" font-weight="normal" fill="#FFFFFF" font-style="italic">Which is best, and why? What if...?</text>
<line x1="40" y1="540" x2="40" y2="110" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
<text x="24" y="330" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111" transform="rotate(-90 24 330)">deeper processing</text>
<text x="480" y="568" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">Shallow questions retrieve facts; deep questions demand reasoning and integration.</text>
</svg>
