<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Phases of teaching and their benefits</title>
<desc>Four rising steps: studying for oneself, expecting to teach, preparing to teach, teaching from memory with questions. Each adds a mechanism and a larger, more durable benefit.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">Each phase of teaching adds to learning</text>
<rect x="70" y="360" width="190" height="140" rx="4" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
<text x="165" y="390.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111111">STUDY FOR</text>
<text x="165" y="412.1" font-size="17" text-anchor="middle" font-weight="bold" fill="#111111">ONESELF</text>
<text x="165" y="450.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">baseline</text>
<rect x="270" y="275" width="190" height="225" rx="4" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="365" y="305.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111111">EXPECT</text>
<text x="365" y="327.1" font-size="17" text-anchor="middle" font-weight="bold" fill="#111111">TO TEACH</text>
<text x="365" y="365.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">+ organised,</text>
<text x="365" y="384.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">main-point study</text>
<rect x="470" y="190" width="190" height="310" rx="4" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
<text x="565" y="220.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#111111">PREPARE</text>
<text x="565" y="242.1" font-size="17" text-anchor="middle" font-weight="bold" fill="#111111">TO TEACH</text>
<text x="565" y="280.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">+ selecting,</text>
<text x="565" y="299.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">sequencing,</text>
<text x="565" y="319.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">examples</text>
<rect x="670" y="105" width="190" height="395" rx="4" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<text x="765" y="135.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#FFFFFF">TEACH FROM</text>
<text x="765" y="157.1" font-size="17" text-anchor="middle" font-weight="bold" fill="#FFFFFF">MEMORY</text>
<text x="765" y="195.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#FFFFFF">+ retrieval,</text>
<text x="765" y="214.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#FFFFFF">questions expose</text>
<text x="765" y="234.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#FFFFFF">gaps; most durable</text>
<line x1="900" y1="500" x2="900" y2="110" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
<text x="930" y="305" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111" transform="rotate(-90 930 305)">learning for the teacher</text>
<text x="480.0" y="540" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">Schematic summary of Bargh and Schul (1980), Nestojko et al. (2014), Fiorella and Mayer (2013), Koh et al. (2018).</text>
</svg>
