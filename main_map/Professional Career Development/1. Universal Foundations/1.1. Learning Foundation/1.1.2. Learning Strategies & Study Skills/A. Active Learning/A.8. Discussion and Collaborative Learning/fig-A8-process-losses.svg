<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Process losses and gains</title>
<desc>A waterfall chart: potential performance, minus coordination and motivation losses, plus gains from error correction and knowledge combination, giving actual performance.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">Group performance: potential, losses and gains</text>
<text x="480.0" y="64" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">After Ivan Steiner (1972), extended</text>
<rect x="90" y="120" width="100" height="300" rx="0" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
<text x="140" y="444.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">Potential</text>
<rect x="225" y="120.0" width="100" height="75.0" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<text x="275" y="444.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">minus</text>
<text x="275" y="462.2" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">coordination</text>
<text x="275" y="480.4" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">losses</text>
<rect x="360" y="195.0" width="100" height="45.0" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<text x="410" y="444.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">minus</text>
<text x="410" y="462.2" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">motivation</text>
<text x="410" y="480.4" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">losses</text>
<rect x="495" y="195.0" width="100" height="45.0" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
<text x="545" y="444.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">plus</text>
<text x="545" y="462.2" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">error</text>
<text x="545" y="480.4" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">correction</text>
<rect x="630" y="150.0" width="100" height="45.0" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
<text x="680" y="444.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">plus</text>
<text x="680" y="462.2" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">knowledge</text>
<text x="680" y="480.4" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">combination</text>
<rect x="765" y="150" width="100" height="270" rx="0" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<text x="815" y="444.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">Actual</text>
<line x1="70" y1="420" x2="900" y2="420" stroke="#333333" stroke-width="2"/>
<text x="480.0" y="510" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">Schematic: the balance of losses and gains depends on task design and facilitation.</text>
</svg>
