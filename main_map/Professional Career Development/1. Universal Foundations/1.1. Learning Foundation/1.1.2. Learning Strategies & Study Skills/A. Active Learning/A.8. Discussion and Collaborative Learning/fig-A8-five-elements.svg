<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Five elements of cooperative learning</title>
<desc>A central box labelled effective cooperative learning surrounded by five boxes: positive interdependence, individual accountability, promotive interaction, social skills, group processing.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">Five elements of effective cooperative learning</text>
<text x="480.0" y="64" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">After David and Roger Johnson</text>
<rect x="360" y="240" width="240" height="90" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<text x="480.0" y="279.9" font-size="17" text-anchor="middle" font-weight="normal" fill="#FFFFFF">Effective</text>
<text x="480.0" y="302.0" font-size="17" text-anchor="middle" font-weight="normal" fill="#FFFFFF">cooperative learning</text>
<rect x="80" y="110" width="240" height="100" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
<text x="200.0" y="145.75" font-size="15" text-anchor="middle" font-weight="bold" fill="#000000">POSITIVE</text>
<text x="200.0" y="165.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#000000">INTERDEPENDENCE</text>
<text x="200.0" y="184.75" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">success depends on all</text>
<rect x="640" y="110" width="240" height="100" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
<text x="760.0" y="145.75" font-size="15" text-anchor="middle" font-weight="bold" fill="#000000">INDIVIDUAL</text>
<text x="760.0" y="165.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#000000">ACCOUNTABILITY</text>
<text x="760.0" y="184.75" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">each person assessed</text>
<rect x="40" y="380" width="240" height="100" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
<text x="160.0" y="415.75" font-size="15" text-anchor="middle" font-weight="bold" fill="#000000">PROMOTIVE</text>
<text x="160.0" y="435.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#000000">INTERACTION</text>
<text x="160.0" y="454.75" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">help, explain, encourage</text>
<rect x="360" y="420" width="240" height="100" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
<text x="480.0" y="455.75" font-size="15" text-anchor="middle" font-weight="bold" fill="#000000">SOCIAL</text>
<text x="480.0" y="475.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#000000">SKILLS</text>
<text x="480.0" y="494.75" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">listen, disagree well</text>
<rect x="680" y="380" width="240" height="100" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
<text x="800.0" y="415.75" font-size="15" text-anchor="middle" font-weight="bold" fill="#000000">GROUP</text>
<text x="800.0" y="435.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#000000">PROCESSING</text>
<text x="800.0" y="454.75" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">reflect and adjust</text>
<line x1="320" y1="170" x2="380" y2="240" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="640" y1="170" x2="580" y2="240" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="280" y1="410" x2="360" y2="320" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="480" y1="420" x2="480" y2="332" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="680" y1="410" x2="600" y2="320" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
