<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Openness and guidance</title>
<desc>A chart with task openness on the horizontal axis and guidance on the vertical axis. Explicit instruction sits at low openness and high guidance; unguided discovery at high openness and low guidance, marked as a risk zone; guided active learning occupies a diagonal band, moving from guided micro-activities for novices to open problems with light guidance for experts.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">How open is the task, and how much guidance comes with it?</text>
<line x1="120" y1="520" x2="900" y2="520" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="120" y1="520" x2="120" y2="100" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="510.0" y="556" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">TASK OPENNESS: closed exercise to open, ill-structured problem</text>
<text x="90" y="310.0" font-size="15" text-anchor="middle" fill="#111111" transform="rotate(-90 90 310.0)">GUIDANCE: little to extensive</text>
<path d="M150 160 L300 140 L880 330 L880 420 L760 420 L150 240 Z" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
<rect x="150" y="112" width="220" height="60" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
<text x="260.0" y="137.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">Explanation and</text>
<text x="260.0" y="157.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">worked examples</text>
<rect x="240" y="200" width="200" height="50" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="340.0" y="230.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">Guided micro-activities</text>
<rect x="440" y="262" width="220" height="58" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="550.0" y="286.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">Scaffolded problems</text>
<text x="550.0" y="306.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">and cases</text>
<rect x="660" y="332" width="210" height="58" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="765.0" y="356.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">Open problems with</text>
<text x="765.0" y="376.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">light guidance</text>
<rect x="640" y="440" width="230" height="70" rx="8" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<rect x="648.0" y="452.8" width="214" height="44.4" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="755.0" y="470.79999999999995" font-size="14" text-anchor="middle" font-weight="bold" fill="#111111">RISK ZONE</text>
<text x="755.0" y="488.99999999999994" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">unguided discovery for novices</text>
<rect x="170.39999999999998" y="284" width="119.20000000000002" height="23.5" fill="#FFFFFF" stroke="none"/>
<text x="230" y="300.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">suits NOVICES</text>
<rect x="730.4" y="269" width="119.20000000000002" height="23.5" fill="#FFFFFF" stroke="none"/>
<text x="790" y="285.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">suits EXPERTS</text>
<text x="480.0" y="588" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">Schematic: the band shows where active designs work well; guidance fades as expertise grows.</text>
</svg>
