<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Theobald et al. 2020 achievement gaps</title>
<desc>Two pairs of bars. Exam gap: 0.62 SD under lecturing, 0.42 SD under active learning. Pass-rate gap: 7.1 percentage points under lecturing, 3.9 under active learning.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">Gaps between under-represented students and peers</text>
<text x="480.0" y="64" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">Smaller bars mean smaller gaps</text>
<text x="240" y="110" font-size="17" text-anchor="middle" font-weight="bold" fill="#111111">Exam-score gap (SD)</text>
<line x1="80" y1="420" x2="400" y2="420" stroke="#333333" stroke-width="2"/>
<rect x="120" y="172.0" width="100" height="248.0" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<rect x="147.07999999999998" y="143.0" width="45.84" height="24.8" fill="#FFFFFF" stroke="none"/>
<text x="170.0" y="160.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">0.62</text>
<text x="170.0" y="444.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">Lecturing</text>
<rect x="260" y="252.0" width="100" height="168.0" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
<rect x="287.08" y="223.0" width="45.84" height="24.8" fill="#FFFFFF" stroke="none"/>
<text x="310.0" y="240.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">0.42</text>
<text x="310.0" y="444.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">Active</text>
<text x="310.0" y="463.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">learning</text>
<text x="240" y="490" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">gap about 33% smaller</text>
<text x="720" y="110" font-size="17" text-anchor="middle" font-weight="bold" fill="#111111">Pass-rate gap (percentage points)</text>
<line x1="560" y1="420" x2="880" y2="420" stroke="#333333" stroke-width="2"/>
<rect x="600" y="178.60000000000002" width="100" height="241.39999999999998" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<rect x="631.56" y="149.60000000000002" width="36.88" height="24.8" fill="#FFFFFF" stroke="none"/>
<text x="650.0" y="166.60000000000002" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">7.1</text>
<text x="650.0" y="444.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">Lecturing</text>
<rect x="740" y="287.4" width="100" height="132.6" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
<rect x="771.56" y="258.4" width="36.88" height="24.8" fill="#FFFFFF" stroke="none"/>
<text x="790.0" y="275.4" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">3.9</text>
<text x="790.0" y="444.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">Active</text>
<text x="790.0" y="463.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">learning</text>
<text x="720" y="490" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">gap about 45% smaller</text>
<text x="480.0" y="528" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">Only high-intensity active learning narrowed gaps substantially. Source: Theobald et al., 2020.</text>
</svg>
