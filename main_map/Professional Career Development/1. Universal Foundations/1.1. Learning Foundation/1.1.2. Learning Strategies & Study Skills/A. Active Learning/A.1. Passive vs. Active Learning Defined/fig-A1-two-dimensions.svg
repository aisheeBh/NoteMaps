<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Behavioural and cognitive activity</title>
<desc>A two-by-two matrix: behavioural activity on the vertical axis, cognitive activity on the horizontal axis, with examples in each quadrant.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">Two kinds of "activity"</text>
<rect x="160" y="90" width="360" height="210" rx="8" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<text x="340.0" y="119.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#000000">BUSY WORK</text>
<text x="340.0" y="138.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">Copying slides, clicking through</text>
<text x="340.0" y="158.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">a tutorial, unstructured games</text>
<rect x="540" y="90" width="360" height="210" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
<text x="720.0" y="119.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#000000">HANDS-ON THINKING</text>
<text x="720.0" y="138.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">Solving problems and explaining</text>
<text x="720.0" y="158.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">the steps; building and testing</text>
<rect x="160" y="320" width="360" height="210" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
<text x="340.0" y="349.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">DISENGAGED RECEPTION</text>
<text x="340.0" y="368.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">Listening or reading</text>
<text x="340.0" y="388.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">while the mind drifts</text>
<rect x="540" y="320" width="360" height="210" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
<text x="720.0" y="349.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#000000">QUIET THINKING</text>
<text x="720.0" y="368.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">Silent self-questioning while</text>
<text x="720.0" y="388.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">reading; predicting a demo</text>
<text x="340.0" y="276" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">little learning</text>
<text x="720.0" y="276" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">strong learning</text>
<text x="340.0" y="506" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">little learning</text>
<text x="720.0" y="506" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">strong learning</text>
<line x1="160" y1="560" x2="900" y2="560" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="530" y="586" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">COGNITIVE ACTIVITY: low  to  high</text>
<line x1="120" y1="530" x2="120" y2="90" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="100" y="310" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111" transform="rotate(-90 100 310)">BEHAVIOURAL ACTIVITY: low  to  high</text>
</svg>
