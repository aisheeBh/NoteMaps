<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>The ICAP ladder</title>
<desc>Four rising steps: Passive, Active, Constructive, Interactive, each labelled with what the learner does and the underlying process.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">ICAP: four modes of engagement</text>
<text x="480.0" y="64" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">Expected learning rises with each step</text>
<rect x="60" y="370" width="196" height="170" rx="4" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
<text x="158" y="400" font-size="18" text-anchor="middle" font-weight="bold" fill="#111111">PASSIVE</text>
<text x="158" y="426.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111111">Receive:</text>
<text x="158" y="444.2" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">listen, watch, read</text>
<text x="158" y="472.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">Stored in isolation,</text>
<text x="158" y="490.2" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">if at all</text>
<rect x="260" y="280" width="196" height="260" rx="4" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<rect x="268" y="288" width="180" height="244" rx="4" fill="#FFFFFF"/>
<text x="358" y="310" font-size="18" text-anchor="middle" font-weight="bold" fill="#111111">ACTIVE</text>
<text x="358" y="336.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111111">Manipulate:</text>
<text x="358" y="354.2" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">copy, highlight,</text>
<text x="358" y="372.4" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">rewind, repeat</text>
<text x="358" y="400.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">Attention focused;</text>
<text x="358" y="418.2" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">prior knowledge</text>
<text x="358" y="436.4" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">activated</text>
<rect x="460" y="190" width="196" height="350" rx="4" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
<text x="558" y="220" font-size="18" text-anchor="middle" font-weight="bold" fill="#111111">CONSTRUCTIVE</text>
<text x="558" y="246.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111111">Go beyond:</text>
<text x="558" y="264.2" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">explain, predict,</text>
<text x="558" y="282.4" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">map, compare</text>
<text x="558" y="310.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">New inferences;</text>
<text x="558" y="328.2" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">knowledge</text>
<text x="558" y="346.4" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">integrated</text>
<rect x="660" y="100" width="196" height="440" rx="4" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<text x="758" y="130" font-size="18" text-anchor="middle" font-weight="bold" fill="#FFFFFF">INTERACTIVE</text>
<text x="758" y="156.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#FFFFFF">Co-construct:</text>
<text x="758" y="174.2" font-size="14" text-anchor="middle" font-weight="normal" fill="#FFFFFF">debate, build on</text>
<text x="758" y="192.4" font-size="14" text-anchor="middle" font-weight="normal" fill="#FFFFFF">a partner's ideas</text>
<text x="758" y="220.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#FFFFFF">Ideas challenged,</text>
<text x="758" y="238.2" font-size="14" text-anchor="middle" font-weight="normal" fill="#FFFFFF">extended and</text>
<text x="758" y="256.4" font-size="14" text-anchor="middle" font-weight="normal" fill="#FFFFFF">combined</text>
<line x1="895" y1="540" x2="895" y2="130" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
<text x="928" y="335" font-size="15" text-anchor="middle" fill="#111111" font-weight="bold" transform="rotate(-90 928 335)">deeper processing, more learning</text>
<text x="480.0" y="578" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">Order predicted by the ICAP hypothesis (Chi and Wylie, 2014); a framework, not a law.</text>
</svg>
