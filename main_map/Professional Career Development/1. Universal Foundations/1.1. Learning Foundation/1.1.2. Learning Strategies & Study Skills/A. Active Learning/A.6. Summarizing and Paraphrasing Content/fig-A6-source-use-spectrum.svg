<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Spectrum of source use</title>
<desc>Six positions from copying to synthesis, showing increasing transformation of the source and increasing comprehension required.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">From copying to synthesis</text>
<rect x="50" y="130" width="130" height="150" rx="6" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<text x="115" y="175" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">Copying</text>
<text x="115" y="230.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">source words,</text>
<text x="115" y="248.2" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">unmarked</text>
<rect x="195" y="130" width="130" height="150" rx="6" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
<text x="260" y="175" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">Quotation</text>
<text x="260" y="230.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">source words,</text>
<text x="260" y="248.2" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">attributed</text>
<rect x="340" y="130" width="130" height="150" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<rect x="348" y="138" width="114" height="134" rx="4" fill="#FFFFFF"/>
<text x="405" y="175.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">Patch-</text>
<text x="405" y="195.8" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">writing</text>
<text x="405" y="230.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">synonyms</text>
<text x="405" y="248.2" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">swapped</text>
<rect x="485" y="130" width="130" height="150" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
<text x="550" y="175" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">Paraphrase</text>
<text x="550" y="230.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">meaning in</text>
<text x="550" y="248.2" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">new words</text>
<rect x="630" y="130" width="130" height="150" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
<text x="695" y="175" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">Summary</text>
<text x="695" y="230.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">main ideas,</text>
<text x="695" y="248.2" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">condensed</text>
<rect x="775" y="130" width="130" height="150" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
<text x="840" y="175" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">Synthesis</text>
<text x="840" y="230.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">several sources</text>
<text x="840" y="248.2" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">integrated</text>
<line x1="50" y1="320" x2="910" y2="320" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
<text x="480" y="350" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">more transformation of the source, more comprehension required</text>
<text x="480" y="400.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">Only quotation, paraphrase, summary and synthesis are legitimate source use;</text>
<text x="480" y="419.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">patchwriting often signals a learner who has not yet understood.</text>
</svg>
