<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Surface versus structure</title>
<desc>Six problems shown twice. On the left, a novice groups them by surface features such as inclined planes and springs. On the right, an expert groups the same problems by principles such as conservation of energy and Newton second law.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">Same problems, two ways of grouping</text>
<text x="480.0" y="64" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">Pattern found by Chi, Feltovich and Glaser (1981)</text>
<text x="240" y="110" font-size="18" text-anchor="middle" font-weight="bold" fill="#111111">NOVICE: by surface</text>
<text x="720" y="110" font-size="18" text-anchor="middle" font-weight="bold" fill="#111111">EXPERT: by principle</text>
<rect x="60" y="130" width="360" height="170" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
<text x="240" y="158" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">Inclined planes</text>
<rect x="60" y="320" width="360" height="170" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
<text x="240" y="348" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">Springs</text>
<rect x="540" y="130" width="360" height="170" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
<text x="720" y="158" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">Conservation of energy</text>
<rect x="540" y="320" width="360" height="170" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
<text x="720" y="348" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">Newton's second law</text>
<rect x="110" y="190" width="80" height="80" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<text x="150.0" y="236.3" font-size="18" text-anchor="middle" font-weight="normal" fill="#FFFFFF">P1</text>
<rect x="220" y="190" width="80" height="80" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="260.0" y="236.3" font-size="18" text-anchor="middle" font-weight="normal" fill="#000000">P2</text>
<rect x="330" y="190" width="80" height="80" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="370.0" y="236.3" font-size="18" text-anchor="middle" font-weight="normal" fill="#000000">P3</text>
<rect x="110" y="380" width="80" height="80" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<text x="150.0" y="426.3" font-size="18" text-anchor="middle" font-weight="normal" fill="#FFFFFF">P4</text>
<rect x="220" y="380" width="80" height="80" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<text x="260.0" y="426.3" font-size="18" text-anchor="middle" font-weight="normal" fill="#FFFFFF">P5</text>
<rect x="330" y="380" width="80" height="80" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="370.0" y="426.3" font-size="18" text-anchor="middle" font-weight="normal" fill="#000000">P6</text>
<rect x="590" y="190" width="80" height="80" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<text x="630.0" y="236.3" font-size="18" text-anchor="middle" font-weight="normal" fill="#FFFFFF">P1</text>
<rect x="700" y="190" width="80" height="80" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<text x="740.0" y="236.3" font-size="18" text-anchor="middle" font-weight="normal" fill="#FFFFFF">P4</text>
<rect x="810" y="190" width="80" height="80" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<text x="850.0" y="236.3" font-size="18" text-anchor="middle" font-weight="normal" fill="#FFFFFF">P5</text>
<rect x="590" y="380" width="80" height="80" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="630.0" y="426.3" font-size="18" text-anchor="middle" font-weight="normal" fill="#000000">P2</text>
<rect x="700" y="380" width="80" height="80" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="740.0" y="426.3" font-size="18" text-anchor="middle" font-weight="normal" fill="#000000">P3</text>
<rect x="810" y="380" width="80" height="80" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="850.0" y="426.3" font-size="18" text-anchor="middle" font-weight="normal" fill="#000000">P6</text>
<text x="480.0" y="530" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">Problems P1 to P6; dark squares share one principle, white squares another. Novices mix them; experts separate them.</text>
</svg>
