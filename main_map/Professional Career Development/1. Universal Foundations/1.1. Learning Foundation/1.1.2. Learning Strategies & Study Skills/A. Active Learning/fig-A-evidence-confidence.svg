<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Evidence confidence</title>
<desc>Six claims about active learning, each with a confidence rating shown by filled circles: higher STEM exam performance and lower failure, high; producing beats reading in laboratory studies, high; larger benefits for disadvantaged students under intensive structured designs, moderate to high; learners underrate active learning, moderate to high; benefits in workplace training, moderate; whole problem-based curricula, mixed trade-offs.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">What the evidence supports, and how firmly</text>
<rect x="50" y="88" width="860" height="60" fill="#F2F2F2"/>
<text x="70" y="125" font-size="16" text-anchor="start" font-weight="normal" fill="#111111">Higher exam performance, lower failure (undergraduate STEM)</text>
<circle cx="760" cy="120" r="9" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<circle cx="788" cy="120" r="9" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<circle cx="816" cy="120" r="9" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<circle cx="844" cy="120" r="9" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<circle cx="872" cy="120" r="9" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<text x="70" y="193" font-size="16" text-anchor="start" font-weight="normal" fill="#111111">Producing, retrieving and explaining beat receiving (laboratory)</text>
<circle cx="760" cy="188" r="9" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<circle cx="788" cy="188" r="9" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<circle cx="816" cy="188" r="9" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<circle cx="844" cy="188" r="9" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<circle cx="872" cy="188" r="9" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<rect x="50" y="224" width="860" height="60" fill="#F2F2F2"/>
<text x="70" y="261" font-size="16" text-anchor="start" font-weight="normal" fill="#111111">Largest gains for disadvantaged students, if intensive</text>
<circle cx="760" cy="256" r="9" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<circle cx="788" cy="256" r="9" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<circle cx="816" cy="256" r="9" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<circle cx="844" cy="256" r="9" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<circle cx="872" cy="256" r="9" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="70" y="329" font-size="16" text-anchor="start" font-weight="normal" fill="#111111">Learners feel they learn less from active lessons</text>
<circle cx="760" cy="324" r="9" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<circle cx="788" cy="324" r="9" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<circle cx="816" cy="324" r="9" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<circle cx="844" cy="324" r="9" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<circle cx="872" cy="324" r="9" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<rect x="50" y="360" width="860" height="60" fill="#F2F2F2"/>
<text x="70" y="397" font-size="16" text-anchor="start" font-weight="normal" fill="#111111">Benefits in workplace and professional training</text>
<circle cx="760" cy="392" r="9" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<circle cx="788" cy="392" r="9" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<circle cx="816" cy="392" r="9" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<circle cx="844" cy="392" r="9" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<circle cx="872" cy="392" r="9" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="70" y="465" font-size="16" text-anchor="start" font-weight="normal" fill="#111111">Whole problem-based curricula: trade-offs, not a simple win</text>
<circle cx="760" cy="460" r="9" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<circle cx="788" cy="460" r="9" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<circle cx="816" cy="460" r="9" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<circle cx="844" cy="460" r="9" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<circle cx="872" cy="460" r="9" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="816" y="82" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Confidence</text>
<text x="480.0" y="540" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">Author's synthesis of meta-analyses and reviews; ratings are qualitative.</text>
</svg>
