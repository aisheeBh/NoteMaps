<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Matrix note example</title>
<desc>A table with three database options as columns and four attributes as rows: data model, scaling, consistency, typical use. One cell is left empty to show a gap revealed by the matrix.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">Matrix notes make comparisons and gaps visible</text>
<rect x="230" y="110" width="230" height="50" rx="0" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<text x="345.0" y="140.6" font-size="16" text-anchor="middle" font-weight="normal" fill="#FFFFFF">Relational</text>
<rect x="460" y="110" width="230" height="50" rx="0" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<text x="575.0" y="140.6" font-size="16" text-anchor="middle" font-weight="normal" fill="#FFFFFF">Document</text>
<rect x="690" y="110" width="230" height="50" rx="0" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<text x="805.0" y="140.6" font-size="16" text-anchor="middle" font-weight="normal" fill="#FFFFFF">Key-value</text>
<rect x="60" y="160" width="170" height="80" rx="0" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
<text x="145.0" y="205.6" font-size="16" text-anchor="middle" font-weight="normal" fill="#000000">Data model</text>
<rect x="230" y="160" width="230" height="80" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="345.0" y="205.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">tables, joins</text>
<rect x="460" y="160" width="230" height="80" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="575.0" y="205.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">JSON documents</text>
<rect x="690" y="160" width="230" height="80" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="805.0" y="205.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">key to value</text>
<rect x="60" y="240" width="170" height="80" rx="0" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
<text x="145.0" y="285.6" font-size="16" text-anchor="middle" font-weight="normal" fill="#000000">Scaling</text>
<rect x="230" y="240" width="230" height="80" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="345.0" y="285.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">mostly vertical</text>
<rect x="460" y="240" width="230" height="80" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="575.0" y="285.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">horizontal</text>
<rect x="690" y="240" width="230" height="80" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="805.0" y="285.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">horizontal</text>
<rect x="60" y="320" width="170" height="80" rx="0" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
<text x="145.0" y="365.6" font-size="16" text-anchor="middle" font-weight="normal" fill="#000000">Consistency</text>
<rect x="230" y="320" width="230" height="80" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="345.0" y="365.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">strong</text>
<rect x="460" y="320" width="230" height="80" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="575.0" y="365.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">tunable</text>
<rect x="690" y="320" width="230" height="80" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<rect x="743.375" y="336.5" width="123.25000000000001" height="47.0" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="805.0" y="355.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">GAP: not</text>
<text x="805.0" y="375.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">noted - check</text>
<rect x="60" y="400" width="170" height="80" rx="0" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
<text x="145.0" y="445.6" font-size="16" text-anchor="middle" font-weight="normal" fill="#000000">Typical use</text>
<rect x="230" y="400" width="230" height="80" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="345.0" y="445.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">transactions</text>
<rect x="460" y="400" width="230" height="80" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="575.0" y="445.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">flexible records</text>
<rect x="690" y="400" width="230" height="80" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="805.0" y="445.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">caching, sessions</text>
<text x="480.0" y="500" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">Illustrative content. Rows or columns can be covered for self-testing.</text>
</svg>
