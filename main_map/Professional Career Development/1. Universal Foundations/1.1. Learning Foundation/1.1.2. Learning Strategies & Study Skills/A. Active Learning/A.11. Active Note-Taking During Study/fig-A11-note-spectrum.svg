<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Note-taking spectrum</title>
<desc>Five positions from no notes to generative notes: no notes, verbatim transcription, selective copying, paraphrased and condensed notes, generative notes with questions and links.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">From transcription to generative notes</text>
<rect x="50" y="110" width="160" height="120" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
<text x="130.0" y="165.2" font-size="16" text-anchor="middle" font-weight="bold" fill="#222222">Listening</text>
<text x="130.0" y="186.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#222222">only</text>
<rect x="225" y="110" width="160" height="120" rx="8" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<text x="305.0" y="165.2" font-size="16" text-anchor="middle" font-weight="bold" fill="#000000">Verbatim</text>
<text x="305.0" y="186.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#000000">transcription</text>
<rect x="400" y="110" width="160" height="120" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="480.0" y="165.2" font-size="16" text-anchor="middle" font-weight="bold" fill="#000000">Selective</text>
<text x="480.0" y="186.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#000000">copying</text>
<rect x="575" y="110" width="160" height="120" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
<text x="655.0" y="165.2" font-size="16" text-anchor="middle" font-weight="bold" fill="#000000">Paraphrased,</text>
<text x="655.0" y="186.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#000000">condensed</text>
<rect x="750" y="110" width="160" height="120" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
<text x="830.0" y="154.79999999999998" font-size="16" text-anchor="middle" font-weight="bold" fill="#000000">Generative:</text>
<text x="830.0" y="175.6" font-size="16" text-anchor="middle" font-weight="normal" fill="#000000">questions,</text>
<text x="830.0" y="196.39999999999998" font-size="16" text-anchor="middle" font-weight="normal" fill="#000000">links, examples</text>
<line x1="50" y1="270" x2="910" y2="270" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
<text x="480" y="300" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">more transformation by the learner</text>
<text x="130" y="345.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">ICAP mode:</text>
<text x="130" y="364.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">passive</text>
<text x="305" y="345.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">ICAP mode:</text>
<text x="305" y="364.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">active</text>
<text x="480" y="345.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">ICAP mode:</text>
<text x="480" y="364.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">active</text>
<text x="655" y="345.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">ICAP mode:</text>
<text x="655" y="364.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">constructive</text>
<text x="830" y="345.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">ICAP mode:</text>
<text x="830" y="364.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">constructive</text>
<text x="480.0" y="460" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">Completeness often falls slightly from left to right; depth of processing rises.</text>
</svg>
