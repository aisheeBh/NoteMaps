<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Mapping versus retrieval</title>
<desc>Left: final test performance one week later was higher after retrieval practice than after concept mapping with the text open. Right: students predicted the opposite.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">Concept mapping with the text open versus retrieval practice</text>
<text x="480.0" y="64" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">Pattern reported by Karpicke and Blunt (2011)</text>
<text x="270" y="120" font-size="17" text-anchor="middle" font-weight="bold" fill="#111111">Actual learning one week later</text>
<line x1="110" y1="390" x2="430" y2="390" stroke="#333333" stroke-width="2"/>
<rect x="140" y="240" width="120" height="150" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
<rect x="280" y="160" width="120" height="230" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
<rect x="174.0" y="212" width="52.00000000000001" height="23.5" fill="#FFFFFF" stroke="none"/>
<text x="200" y="228.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">lower</text>
<rect x="309.8" y="132" width="60.400000000000006" height="23.5" fill="#FFFFFF" stroke="none"/>
<text x="340" y="148.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">higher</text>
<text x="200" y="414.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">Concept map,</text>
<text x="200" y="433.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">text open</text>
<text x="340" y="414.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">Retrieval</text>
<text x="340" y="433.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">practice</text>
<text x="690" y="120" font-size="17" text-anchor="middle" font-weight="bold" fill="#111111">Students' predicted learning</text>
<line x1="530" y1="390" x2="850" y2="390" stroke="#333333" stroke-width="2"/>
<rect x="560" y="160" width="120" height="230" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
<rect x="700" y="230" width="120" height="160" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
<rect x="589.8" y="132" width="60.400000000000006" height="23.5" fill="#FFFFFF" stroke="none"/>
<text x="620" y="148.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">higher</text>
<rect x="734.0" y="202" width="52.00000000000001" height="23.5" fill="#FFFFFF" stroke="none"/>
<text x="760" y="218.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">lower</text>
<text x="620" y="414.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">Concept map,</text>
<text x="620" y="433.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">text open</text>
<text x="760" y="414.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">Retrieval</text>
<text x="760" y="433.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">practice</text>
<text x="480.0" y="488" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">Schematic: shows direction of differences. Mapping from memory closes most of the gap (Blunt and Karpicke, 2014).</text>
</svg>
