<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Participation in adult learning by prior skill level</title>
<desc>Schematic bars showing participation in adult learning rising from low-skilled to high-skilled adults.</desc>
<defs>
  <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
  </pattern>
  <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
    <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
  </pattern>
  <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
    <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
  </pattern>
  <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
    <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
  </pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#222222"/>
  </marker>
</defs>
<text x="480" y="40" font-size="22" fill="#111111" text-anchor="middle" font-weight="bold">Who takes part in adult learning?</text>
<rect x="300" y="342.0" width="150" height="108.0" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<rect x="330" y="308.0" width="90" height="24" fill="#FFFFFF"/><text x="375.0" y="326.0" font-size="15" fill="#111111" text-anchor="middle" font-weight="bold">lowest</text>
<text x="375.0" y="478" font-size="16" fill="#111111" text-anchor="middle" font-weight="bold">Low skills</text>
<rect x="500" y="241.2" width="150" height="208.8" fill="url(#dots)" stroke="#7A5200" stroke-width="2.5" stroke-dasharray="8 4"/>
<rect x="530" y="207.2" width="90" height="24" fill="#FFFFFF"/><text x="575.0" y="225.20000000000002" font-size="15" fill="#111111" text-anchor="middle" font-weight="bold">middle</text>
<text x="575.0" y="478" font-size="16" fill="#111111" text-anchor="middle" font-weight="bold">Medium skills</text>
<rect x="700" y="133.2" width="150" height="316.8" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
<rect x="730" y="99.2" width="90" height="24" fill="#FFFFFF"/><text x="775.0" y="117.19999999999999" font-size="15" fill="#111111" text-anchor="middle" font-weight="bold">highest</text>
<text x="775.0" y="478" font-size="16" fill="#111111" text-anchor="middle" font-weight="bold">High skills</text>
<line x1="240" y1="450" x2="900" y2="450" stroke="#222222" stroke-width="2"/>
<line x1="240" y1="450" x2="240" y2="70" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="200" y="270.0" font-size="16" fill="#111111" text-anchor="middle" font-weight="bold" transform="rotate(-90 200 270.0)">Share taking part in a year</text>
<rect x="270" y="90" width="300" height="80" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
<text x="284" y="115" font-size="15" fill="#111111" text-anchor="start" font-weight="bold">Those who would gain most</text>
<text x="284" y="138" font-size="15" fill="#111111" text-anchor="start" font-weight="normal">take part least: less confidence,</text>
<text x="284" y="160" font-size="15" fill="#111111" text-anchor="start" font-weight="normal">time, information and support.</text>
<line x1="375" y1="170" x2="375" y2="302" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="570" y="512" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal">Prior skill level (tested literacy and numeracy)</text>
<text x="480" y="550" font-size="13" fill="#111111" text-anchor="middle" font-weight="normal">Schematic; the gradient recurs in every adult-skills survey, exact rates vary by country.</text>
</svg>
