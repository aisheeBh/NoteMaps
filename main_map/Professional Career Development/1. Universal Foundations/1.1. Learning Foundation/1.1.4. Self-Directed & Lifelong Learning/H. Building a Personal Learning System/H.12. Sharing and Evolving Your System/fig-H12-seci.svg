<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The SECI model of knowledge conversion</title>
  <desc>A two-by-two grid. Top left socialisation, tacit to tacit, through pairing and shadowing. Top right externalisation, tacit to explicit, through decision records and expert interviews. Bottom right combination, explicit to explicit, through assembling guides and handbooks. Bottom left internalisation, explicit to tacit, through practising from guides. Arrows run clockwise between the quadrants, forming a spiral.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">The SECI spiral of knowledge creation</text>
  <text x="330" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">to TACIT</text>
  <text x="630" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">to EXPLICIT</text>
  <text x="110" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111" transform="rotate(-90 110 220)">from TACIT</text>
  <text x="110" y="450" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111" transform="rotate(-90 110 450)">from EXPLICIT</text>
  <rect x="180" y="110" width="290" height="210" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="325" y="181" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">SOCIALISATION</text>
  <text x="325" y="200" text-anchor="middle" font-size="15" fill="#000000">shared experience</text>
  <text x="325" y="220" text-anchor="middle" font-size="15" fill="#000000"></text>
  <text x="325" y="240" text-anchor="middle" font-size="15" fill="#000000">pairing, shadowing,</text>
  <text x="325" y="260" text-anchor="middle" font-size="15" fill="#000000">sitting in on calls</text>
  <rect x="490" y="110" width="290" height="210" rx="8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="562" y="165" width="147" height="21" fill="#FFFFFF"/>
  <text x="635" y="181" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">EXTERNALISATION</text>
  <rect x="547" y="186" width="177" height="20" fill="#FFFFFF"/>
  <text x="635" y="200" text-anchor="middle" font-size="15" fill="#111111">articulating know-how</text>
  <rect x="630" y="206" width="10" height="20" fill="#FFFFFF"/>
  <text x="635" y="220" text-anchor="middle" font-size="15" fill="#111111"></text>
  <rect x="562" y="226" width="145" height="20" fill="#FFFFFF"/>
  <text x="635" y="240" text-anchor="middle" font-size="15" fill="#111111">decision records,</text>
  <rect x="550" y="246" width="169" height="20" fill="#FFFFFF"/>
  <text x="635" y="260" text-anchor="middle" font-size="15" fill="#111111">interviewing experts</text>
  <rect x="490" y="340" width="290" height="210" rx="8" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="580" y="395" width="110" height="21" fill="#FFFFFF"/>
  <text x="635" y="411" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">COMBINATION</text>
  <rect x="550" y="416" width="169" height="20" fill="#FFFFFF"/>
  <text x="635" y="430" text-anchor="middle" font-size="15" fill="#111111">assembling documents</text>
  <rect x="630" y="436" width="10" height="20" fill="#FFFFFF"/>
  <text x="635" y="450" text-anchor="middle" font-size="15" fill="#111111"></text>
  <rect x="558" y="456" width="153" height="20" fill="#FFFFFF"/>
  <text x="635" y="470" text-anchor="middle" font-size="15" fill="#111111">guides, handbooks,</text>
  <rect x="566" y="476" width="137" height="20" fill="#FFFFFF"/>
  <text x="635" y="490" text-anchor="middle" font-size="15" fill="#111111">onboarding paths</text>
  <rect x="180" y="340" width="290" height="210" rx="8" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="252" y="395" width="147" height="21" fill="#FFFFFF"/>
  <text x="325" y="411" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">INTERNALISATION</text>
  <rect x="252" y="416" width="145" height="20" fill="#FFFFFF"/>
  <text x="325" y="430" text-anchor="middle" font-size="15" fill="#111111">learning by doing</text>
  <rect x="320" y="436" width="10" height="20" fill="#FFFFFF"/>
  <text x="325" y="450" text-anchor="middle" font-size="15" fill="#111111"></text>
  <rect x="233" y="456" width="185" height="20" fill="#FFFFFF"/>
  <text x="325" y="470" text-anchor="middle" font-size="15" fill="#111111">practising from guides</text>
  <rect x="233" y="476" width="185" height="20" fill="#FFFFFF"/>
  <text x="325" y="490" text-anchor="middle" font-size="15" fill="#111111">until it becomes skill</text>
  <line x1="440" y1="215" x2="520" y2="215" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="635" y1="300" x2="635" y2="360" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="520" y1="445" x2="440" y2="445" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="325" y1="360" x2="325" y2="300" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="480" y="595" text-anchor="middle" font-size="13" font-style="italic" fill="#333333">After Nonaka and Takeuchi (1995); a design lens, not a precise theory.</text>
</svg>
