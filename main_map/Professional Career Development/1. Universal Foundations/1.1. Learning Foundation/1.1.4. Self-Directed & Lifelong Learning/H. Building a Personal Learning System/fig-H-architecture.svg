<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Architecture of a personal learning system</title>
  <desc>Seven component boxes arranged in a loop — inputs, capture, processing, practice, review, output and reflection — with arrows between them and a dashed arrow from reflection back to inputs. To the left, a vertical stack of five layers: purpose and philosophy at the top, then workflows, cadences, tools, and evidence at the bottom.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Seven components in a loop, five layers beneath</text>
  <rect x="40" y="90" width="230" height="74" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="155" y="133" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Purpose and philosophy</text>
  <rect x="40" y="182" width="230" height="74" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="155" y="225" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Workflows</text>
  <rect x="40" y="274" width="230" height="74" rx="8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="114" y="301" width="83" height="21" fill="#FFFFFF"/>
  <text x="155" y="317" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Cadences</text>
  <rect x="40" y="366" width="230" height="74" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="155" y="409" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Tools</text>
  <rect x="40" y="458" width="230" height="74" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="155" y="501" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Evidence</text>
  <text x="155" y="568" text-anchor="middle" font-size="14" font-style="italic" fill="#111111">design downwards, judge upwards</text>
  <line x1="676" y1="143" x2="716" y2="187" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="791" y1="233" x2="800" y2="327" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="775" y1="387" x2="749" y2="464" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="645" y1="491" x2="599" y2="491" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="493" y1="467" x2="467" y2="390" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="439" y1="331" x2="448" y2="237" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="188" x2="560" y2="145" stroke="#222222" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrow)"/>
  <rect x="550" y="104" width="140" height="52" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="620" y="135" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Inputs</text>
  <rect x="706" y="176" width="140" height="52" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="776" y="207" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Capture</text>
  <rect x="745" y="336" width="140" height="52" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="815" y="367" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Processing</text>
  <rect x="637" y="465" width="140" height="52" rx="8" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="668" y="482" width="78" height="20" fill="#FFFFFF"/>
  <text x="707" y="496" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Practice</text>
  <rect x="463" y="465" width="140" height="52" rx="8" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="502" y="482" width="61" height="20" fill="#FFFFFF"/>
  <text x="533" y="496" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Review</text>
  <rect x="355" y="336" width="140" height="52" rx="8" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="394" y="353" width="61" height="20" fill="#FFFFFF"/>
  <text x="425" y="367" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Output</text>
  <rect x="394" y="176" width="140" height="52" rx="8" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="416" y="193" width="95" height="20" fill="#FFFFFF"/>
  <text x="464" y="207" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Reflection</text>
  <rect x="525" y="282" width="190" height="76" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="620" y="315" text-anchor="middle" font-size="15" fill="#222222">capability</text>
  <text x="620" y="335" text-anchor="middle" font-size="15" fill="#222222">grows here</text>
  <text x="590" y="560" text-anchor="middle" font-size="14" font-style="italic" fill="#111111">reflection adjusts inputs and the design</text>
</svg>
