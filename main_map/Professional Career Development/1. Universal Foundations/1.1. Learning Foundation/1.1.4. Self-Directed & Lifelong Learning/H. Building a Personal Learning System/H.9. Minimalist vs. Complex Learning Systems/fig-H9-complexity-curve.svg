<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Learning produced as system complexity rises</title>
  <desc>Schematic chart with two inverted-U curves. Horizontal axis: system complexity from minimal to elaborate. Vertical axis: learning produced. The low-demand curve peaks early, at modest complexity, then falls. The high-demand curve peaks later and higher, at greater complexity. Regions to the left of each peak are labelled under-powered and to the right over-engineered.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Each level of demand has its own best complexity</text>
  <line x1="120" y1="450" x2="880" y2="450" stroke="#222222" stroke-width="2.5"/>
  <line x1="120" y1="450" x2="120" y2="90" stroke="#222222" stroke-width="2.5"/>
  <text x="495" y="496" text-anchor="middle" font-size="15" fill="#111111">System complexity</text>
  <text x="150" y="474" text-anchor="middle" font-size="14" fill="#111111">minimal</text>
  <text x="850" y="474" text-anchor="middle" font-size="14" fill="#111111">elaborate</text>
  <text x="70" y="275" text-anchor="middle" font-size="15" fill="#111111" transform="rotate(-90 70 275)">Learning produced</text>
  <polyline points="120,385 128,379 135,372 142,365 150,358 158,351 165,344 172,336 180,328 188,321 195,313 202,306 210,299 218,292 225,285 232,279 240,273 248,268 255,264 262,259 270,256 278,253 285,252 292,250 300,250 308,250 315,252 322,253 330,256 338,259 345,264 352,268 360,273 368,279 375,285 382,292 390,299 398,306 405,313 412,321 420,328 428,336 435,344 442,351 450,358 458,365 465,372 472,379 480,385 488,391 495,396 502,402 510,407 518,411 525,415 532,419 540,423 548,426 555,429 562,432 570,434 578,436 585,438 592,440 600,441 608,442 615,444 622,445 630,445 638,446 645,447 652,447 660,448 668,448 675,448 682,449 690,449 698,449 705,449 712,449 720,450 728,450 735,450 742,450 750,450 758,450 765,450 772,450 780,450 788,450 795,450 802,450 810,450 818,450 825,450 832,450 840,450 848,450 855,450 862,450 870,450" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <polyline points="120,445 128,445 135,444 142,443 150,442 158,441 165,440 172,439 180,437 188,436 195,434 202,432 210,430 218,427 225,425 232,422 240,419 248,416 255,413 262,409 270,405 278,401 285,397 292,392 300,387 308,381 315,376 322,370 330,364 338,357 345,350 352,343 360,336 368,328 375,321 382,313 390,304 398,296 405,288 412,279 420,270 428,262 435,253 442,245 450,236 458,228 465,219 472,211 480,203 488,196 495,189 502,182 510,175 518,169 525,164 532,159 540,154 548,150 555,147 562,144 570,142 578,141 585,140 592,140 600,141 608,142 615,144 622,146 630,149 638,153 645,157 652,162 660,167 668,173 675,180 682,186 690,193 698,201 705,209 712,217 720,225 728,233 735,242 742,250 750,259 758,268 765,276 772,285 780,293 788,302 795,310 802,318 810,326 818,333 825,341 832,348 840,355 848,361 855,368 862,374 870,380" fill="none" stroke="#7A5200" stroke-width="4" stroke-dasharray="10 6"/>
  <circle cx="300" cy="250" r="8" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <circle cx="590" cy="140" r="8" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <rect x="147" y="214" width="305" height="19" fill="#FFFFFF"/>
  <text x="300" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">low demand: best at modest complexity</text>
  <rect x="429" y="104" width="321" height="19" fill="#FFFFFF"/>
  <text x="590" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">high demand: best at greater complexity</text>
  <rect x="739" y="386" width="121" height="19" fill="#FFFFFF"/>
  <text x="800" y="400" text-anchor="middle" font-size="14" font-style="italic" fill="#111111">over-engineered</text>
  <rect x="743" y="404" width="114" height="19" fill="#FFFFFF"/>
  <text x="800" y="418" text-anchor="middle" font-size="14" font-style="italic" fill="#111111">for low demand</text>
  <rect x="177" y="386" width="106" height="19" fill="#FFFFFF"/>
  <text x="230" y="400" text-anchor="middle" font-size="14" font-style="italic" fill="#111111">under-powered</text>
  <rect x="169" y="404" width="121" height="19" fill="#FFFFFF"/>
  <text x="230" y="418" text-anchor="middle" font-size="14" font-style="italic" fill="#111111">for high demand</text>
  <text x="480" y="535" text-anchor="middle" font-size="13" font-style="italic" fill="#333333">Schematic; not plotted from a single dataset.</text>
</svg>
