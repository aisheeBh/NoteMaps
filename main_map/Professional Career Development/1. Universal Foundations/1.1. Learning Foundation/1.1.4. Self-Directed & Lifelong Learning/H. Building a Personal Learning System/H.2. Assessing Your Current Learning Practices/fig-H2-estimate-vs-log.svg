  <line x1="280" y1="470" x2="280" y2="476" stroke="#222222" stroke-width="1.5"/>
  <text x="280" y="494" text-anchor="middle" font-size="14" fill="#111111">0 h</text>
  <line x1="480" y1="470" x2="480" y2="476" stroke="#222222" stroke-width="1.5"/>
  <text x="480" y="494" text-anchor="middle" font-size="14" fill="#111111">1 h</text>
  <line x1="680" y1="470" x2="680" y2="476" stroke="#222222" stroke-width="1.5"/>
  <text x="680" y="494" text-anchor="middle" font-size="14" fill="#111111">2 h</text>
  <line x1="880" y1="470" x2="880" y2="476" stroke="#222222" stroke-width="1.5"/>
  <text x="880" y="494" text-anchor="middle" font-size="14" fill="#111111">3 h</text>
