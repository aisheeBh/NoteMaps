  <rect x="280" y="82" width="400" height="26" rx="0" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="690" y="101" text-anchor="start" font-size="14" fill="#111111">estimated 2.0</text>
  <rect x="280" y="114" width="380" height="26" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="670" y="133" text-anchor="start" font-size="14" font-weight="bold" fill="#111111">logged 1.9</text>
  <text x="268" y="200" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Podcasts</text>
  <rect x="280" y="160" width="400" height="26" rx="0" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="690" y="179" text-anchor="start" font-size="14" fill="#111111">estimated 2.0</text>
  <rect x="280" y="192" width="480" height="26" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="770" y="211" text-anchor="start" font-size="14" font-weight="bold" fill="#111111">logged 2.4</text>
  <text x="268" y="278" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Online course</text>
  <rect x="280" y="238" width="500" height="26" rx="0" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="790" y="257" text-anchor="start" font-size="14" fill="#111111">estimated 2.5</text>
  <rect x="280" y="270" width="120" height="26" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="410" y="289" text-anchor="start" font-size="14" font-weight="bold" fill="#111111">logged 0.6</text>
  <text x="268" y="356" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Regulation handbook</text>
  <rect x="280" y="316" width="200" height="26" rx="0" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="490" y="335" text-anchor="start" font-size="14" fill="#111111">estimated 1.0</text>
  <rect x="280" y="348" width="40" height="26" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="330" y="367" text-anchor="start" font-size="14" font-weight="bold" fill="#111111">logged 0.2</text>
  <text x="268" y="434" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Practice</text>
  <rect x="280" y="394" width="100" height="26" rx="0" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="390" y="413" text-anchor="start" font-size="14" fill="#111111">estimated 0.5</text>
  <rect x="280" y="426" width="20" height="26" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="310" y="445" text-anchor="start" font-size="14" font-weight="bold" fill="#111111">logged 0.1</text>
  <text x="480" y="528" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Total: estimated 8.0 hours, logged 5.2 hours; the shortfall falls on effortful activities</text>
