<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Illustrative allocation of learning time</title>
  <desc>Grouped bars for four groups of activity. Input-heavy pattern: inputs and capture 75 per cent, processing 10, practice and review 8, output and reflection 7. Balanced system: 33, 17, 30 and 20 per cent.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Where the learning hours go</text>
  <line x1="90" y1="440" x2="900" y2="440" stroke="#222222" stroke-width="2.5"/>
  <rect x="115" y="125.0" width="70" height="315.0" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="150" y="115" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">75%</text>
  <text x="150" y="462" text-anchor="middle" font-size="13" fill="#111111">input-heavy</text>
  <rect x="195" y="301.4" width="70" height="138.6" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <text x="230" y="291" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">33%</text>
  <text x="230" y="462" text-anchor="middle" font-size="13" fill="#111111">balanced</text>
  <text x="190" y="490" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Inputs and capture</text>
  <rect x="315" y="398.0" width="70" height="42.0" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="350" y="388" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">10%</text>
  <text x="350" y="462" text-anchor="middle" font-size="13" fill="#111111">input-heavy</text>
  <rect x="395" y="368.6" width="70" height="71.4" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <text x="430" y="359" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">17%</text>
  <text x="430" y="462" text-anchor="middle" font-size="13" fill="#111111">balanced</text>
  <text x="390" y="490" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Processing</text>
  <rect x="515" y="406.4" width="70" height="33.6" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="550" y="396" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">8%</text>
  <text x="550" y="462" text-anchor="middle" font-size="13" fill="#111111">input-heavy</text>
  <rect x="595" y="314.0" width="70" height="126.0" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <text x="630" y="304" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">30%</text>
  <text x="630" y="462" text-anchor="middle" font-size="13" fill="#111111">balanced</text>
  <text x="590" y="490" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Practice and review</text>
  <rect x="715" y="410.6" width="70" height="29.400000000000002" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="750" y="401" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">7%</text>
  <text x="750" y="462" text-anchor="middle" font-size="13" fill="#111111">input-heavy</text>
  <rect x="795" y="356.0" width="70" height="84.0" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <text x="830" y="346" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">20%</text>
  <text x="830" y="462" text-anchor="middle" font-size="13" fill="#111111">balanced</text>
  <text x="790" y="490" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Output and reflection</text>
  <text x="480" y="92" text-anchor="middle" font-size="15" fill="#111111">Share of weekly learning time; the same total hours in both patterns</text>
  <text x="480" y="540" text-anchor="middle" font-size="13" font-style="italic" fill="#333333">Illustrative allocation; not survey data.</text>
</svg>
