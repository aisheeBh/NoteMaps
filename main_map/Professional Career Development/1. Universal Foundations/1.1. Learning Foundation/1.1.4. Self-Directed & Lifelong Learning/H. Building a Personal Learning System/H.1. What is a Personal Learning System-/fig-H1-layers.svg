<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Five layers of a personal learning system</title>
  <desc>Five stacked layers: purpose and philosophy at the top, then workflows, cadences, tools and evidence. A downward arrow labelled design runs from purpose to tools; an upward arrow labelled judge runs from evidence to purpose.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Five layers of a personal learning system</text>
  <rect x="180.0" y="80" width="600" height="76" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="480" y="113" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Purpose and philosophy</text>
  <text x="480" y="134" text-anchor="middle" font-size="16" fill="#FFFFFF">why learn, what capability, which principles</text>
  <rect x="195.0" y="170" width="570" height="76" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="480" y="203" text-anchor="middle" font-size="17" font-weight="bold" fill="#000000">Workflows</text>
  <text x="480" y="224" text-anchor="middle" font-size="16" fill="#000000">the hand-offs between components</text>
  <rect x="210.0" y="260" width="540" height="76" rx="8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="436" y="277" width="88" height="22" fill="#FFFFFF"/>
  <text x="480" y="293" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Cadences</text>
  <rect x="267" y="299" width="426" height="21" fill="#FFFFFF"/>
  <text x="480" y="314" text-anchor="middle" font-size="16" fill="#111111">when each workflow runs: daily, weekly, quarterly</text>
  <rect x="225.0" y="350" width="510" height="76" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="480" y="383" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Tools</text>
  <text x="480" y="404" text-anchor="middle" font-size="16" fill="#111111">notebooks, apps, calendars that hold the artefacts</text>
  <rect x="240.0" y="440" width="480" height="76" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="480" y="473" text-anchor="middle" font-size="17" font-weight="bold" fill="#000000">Evidence</text>
  <text x="480" y="494" text-anchor="middle" font-size="16" fill="#000000">delayed tests, outputs, feedback, unaided tasks</text>
  <line x1="110" y1="100" x2="110" y2="470" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="110" y="515" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">DESIGN</text>
  <text x="110" y="535" text-anchor="middle" font-size="14" fill="#111111">top-down</text>
  <line x1="850" y1="470" x2="850" y2="100" stroke="#222222" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#arrow)"/>
  <text x="850" y="515" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">JUDGE</text>
  <text x="850" y="535" text-anchor="middle" font-size="14" fill="#111111">bottom-up</text>
</svg>
