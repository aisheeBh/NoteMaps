  <rect x="240" y="99" width="134" height="18" fill="#FFFFFF"/>
  <text x="308" y="112" text-anchor="middle" font-size="13" fill="#111111">highest-value work</text>
  <circle cx="169" cy="320" r="7" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <line x1="169.25" y1="328.00807293536263" x2="169.25" y2="346.00807293536263" stroke="#555555" stroke-width="1.5"/>
  <rect x="136" y="350" width="66" height="19" fill="#FFFFFF"/>
  <text x="169" y="364" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">PROCESS</text>
  <rect x="133" y="369" width="72" height="18" fill="#FFFFFF"/>
  <text x="169" y="382" text-anchor="middle" font-size="13" fill="#111111">own words</text>
  <circle cx="416" cy="281" r="7" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <line x1="416.12499999999994" y1="272.59686060564957" x2="416.12499999999994" y2="236.59686060564957" stroke="#555555" stroke-width="1.5"/>
  <rect x="383" y="215" width="66" height="19" fill="#FFFFFF"/>
