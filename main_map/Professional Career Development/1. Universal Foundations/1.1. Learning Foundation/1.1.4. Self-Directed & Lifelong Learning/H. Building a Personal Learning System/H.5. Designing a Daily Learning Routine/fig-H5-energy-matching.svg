  <line x1="900.0" y1="470" x2="900.0" y2="476" stroke="#222222" stroke-width="1.5"/>
  <text x="900" y="494" text-anchor="middle" font-size="13" fill="#111111">22:00</text>
  <text x="62" y="290" text-anchor="middle" font-size="15" fill="#111111">Alertness</text>
