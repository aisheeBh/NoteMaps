  <line x1="110" y1="470" x2="110" y2="90" stroke="#222222" stroke-width="2.5"/>
  <polyline points="110.0,365.5 122.3,359.6 134.7,352.1 147.0,342.6 159.4,331.0 171.7,317.0 184.1,300.9 196.4,282.8 208.8,263.2 221.1,242.5 233.4,221.7 245.8,201.6 258.1,183.3 270.5,167.8 282.8,155.9 295.2,148.5 307.5,146.0 319.8,148.5 332.2,155.9 344.5,167.8 356.9,183.3 369.2,201.6 381.6,221.7 393.9,242.7 406.2,263.9 418.6,284.7 430.9,305.2 443.3,325.6 455.6,345.9 468.0,365.6 480.3,382.9 492.7,395.4 505.0,400.8 517.3,398.2 529.7,388.4 542.0,373.5 554.4,356.2 566.7,338.1 579.1,320.4 591.4,303.5 603.8,287.8 616.1,274.1 628.4,263.3 640.8,256.3 653.1,254.0 665.5,256.4 677.8,263.3 690.2,274.1 702.5,287.5 714.8,306.7 727.2,326.1 739.5,344.5 751.9,361.3 764.2,376.1 776.6,388.7 788.9,399.3 801.2,408.2 813.6,415.7 825.9,422.1 838.3,427.9 850.6,433.1 863.0,438.0 875.3,442.8 887.7,447.4 900.0,451.9" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <line x1="110.0" y1="470" x2="110.0" y2="476" stroke="#222222" stroke-width="1.5"/>
