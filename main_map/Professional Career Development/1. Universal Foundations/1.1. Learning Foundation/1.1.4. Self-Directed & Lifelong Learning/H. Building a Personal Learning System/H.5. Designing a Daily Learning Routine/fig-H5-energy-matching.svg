  <rect x="370" y="234" width="93" height="18" fill="#FFFFFF"/>
  <text x="416" y="247" text-anchor="middle" font-size="13" fill="#111111">hard reading</text>
  <circle cx="515" cy="399" r="7" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <line x1="514.875" y1="407.35488754176515" x2="514.875" y2="425.35488754176515" stroke="#555555" stroke-width="1.5"/>
  <rect x="486" y="429" width="58" height="19" fill="#FFFFFF"/>
  <text x="515" y="443" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">REVIEW</text>
  <rect x="472" y="448" width="86" height="18" fill="#FFFFFF"/>
  <text x="515" y="461" text-anchor="middle" font-size="13" fill="#111111">short slots</text>
  <circle cx="653" cy="254" r="7" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <line x1="653.125" y1="245.9580491958986" x2="653.125" y2="209.9580491958986" stroke="#555555" stroke-width="1.5"/>
  <rect x="580" y="188" width="146" height="19" fill="#FFFFFF"/>
  <text x="653" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">ACQUIRE / PROCESS</text>
  <rect x="610" y="207" width="86" height="18" fill="#FFFFFF"/>
  <text x="653" y="220" text-anchor="middle" font-size="13" fill="#111111">second peak</text>
  <circle cx="791" cy="401" r="7" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <line x1="791.375" y1="409.19309598186294" x2="791.375" y2="427.19309598186294" stroke="#555555" stroke-width="1.5"/>
  <rect x="758" y="431" width="66" height="19" fill="#FFFFFF"/>
  <text x="791" y="445" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">REFLECT</text>
  <rect x="735" y="450" width="113" height="18" fill="#FFFFFF"/>
  <text x="791" y="463" text-anchor="middle" font-size="13" fill="#111111">brief look back</text>
  <text x="480" y="540" text-anchor="middle" font-size="13" font-style="italic" fill="#333333">Schematic; individual energy patterns vary and should be taken from one's own audit.</text>
</svg>
