  <rect x="597" y="253" width="19" height="38" rx="2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="643" y="253" width="19" height="38" rx="2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="689" y="253" width="19" height="38" rx="2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="758" y="253" width="19" height="38" rx="2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="804" y="253" width="19" height="38" rx="2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="850" y="253" width="19" height="38" rx="2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="236" y="335" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Output fragment</text>
  <text x="236" y="355" text-anchor="end" font-size="13" fill="#111111">weekly</text>
  <rect x="332" y="317" width="43" height="42" rx="3" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="493" y="317" width="43" height="42" rx="3" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="654" y="317" width="43" height="42" rx="3" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="815" y="317" width="43" height="42" rx="3" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="236" y="401" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Finished output</text>
  <text x="236" y="421" text-anchor="end" font-size="13" fill="#111111">monthly</text>
  <rect x="825" y="381" width="69" height="46" rx="3" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <text x="480" y="470" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Pruning of stale captures and unused review items: once a quarter</text>
  <text x="480" y="500" text-anchor="middle" font-size="13" font-style="italic" fill="#333333">Illustrative cadence; exact days vary with the routine.</text>
</svg>
