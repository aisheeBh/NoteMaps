<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Weighted scores for three candidate tools</title>
  <desc>Horizontal bars out of 100: Tool B plain-text notes app 83, Tool C paper notebook plus photos 69, Tool A all-in-one workspace 66. Tool B leads on portability with no weak criterion; Tool C on capture friction and cost; Tool A on retrieval.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Weighted scores out of 100</text>
  <text x="316" y="120" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Tool B: plain-text notes app</text>
  <rect x="330" y="90" width="465" height="46" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <text x="807" y="120" text-anchor="start" font-size="18" font-weight="bold" fill="#111111">83</text>
  <text x="338" y="160" text-anchor="start" font-size="14" fill="#111111">leads on portability; no weak criterion</text>
  <text x="316" y="220" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Tool C: paper plus phone photos</text>
  <rect x="330" y="190" width="386" height="46" rx="0" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="728" y="220" text-anchor="start" font-size="18" font-weight="bold" fill="#111111">69</text>
  <text x="338" y="260" text-anchor="start" font-size="14" fill="#111111">leads on capture friction and cost</text>
  <text x="316" y="320" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Tool A: all-in-one workspace</text>
  <rect x="330" y="290" width="370" height="46" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="712" y="320" text-anchor="start" font-size="18" font-weight="bold" fill="#111111">66</text>
  <text x="338" y="360" text-anchor="start" font-size="14" fill="#111111">leads on retrieval</text>
  <line x1="330" y1="80" x2="330" y2="400" stroke="#222222" stroke-width="2"/>
  <text x="330" y="420" text-anchor="middle" font-size="14" fill="#111111">0</text>
  <text x="610" y="420" text-anchor="middle" font-size="14" fill="#111111">50</text>
  <text x="890" y="420" text-anchor="middle" font-size="14" fill="#111111">100</text>
  <text x="480" y="452" text-anchor="middle" font-size="13" font-style="italic" fill="#333333">Scores from the worked example; a must-have failure would exclude a tool regardless of score.</text>
</svg>
