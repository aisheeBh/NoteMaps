  <line x1="867.2243186433545" y1="215.0" x2="572.7756813566455" y2="215.0" stroke="#555555" stroke-width="1.8" stroke-dasharray="3 3"/>
  <line x1="867.2243186433545" y1="385.0" x2="572.7756813566455" y2="385.00000000000006" stroke="#555555" stroke-width="1.8" stroke-dasharray="3 3"/>
  <line x1="720.0" y1="470.0" x2="572.7756813566455" y2="215.0" stroke="#555555" stroke-width="1.8" stroke-dasharray="3 3"/>
  <line x1="720.0" y1="130.0" x2="572.7756813566455" y2="385.00000000000006" stroke="#555555" stroke-width="1.8" stroke-dasharray="3 3"/>
  <line x1="867.2243186433545" y1="385.0" x2="572.7756813566455" y2="215.0" stroke="#555555" stroke-width="1.8" stroke-dasharray="3 3"/>
  <line x1="867.2243186433545" y1="215.0" x2="720.0" y2="470.0" stroke="#555555" stroke-width="1.8" stroke-dasharray="3 3"/>
  <rect x="658" y="108" width="124" height="44" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="720" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Capture app</text>
  <rect x="805" y="193" width="124" height="44" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="867" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Calendar</text>
  <rect x="805" y="363" width="124" height="44" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="867" y="390" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Flashcards</text>
  <rect x="658" y="448" width="124" height="44" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="720" y="475" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Editor</text>
  <rect x="511" y="363" width="124" height="44" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="573" y="390" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Reader</text>
  <rect x="511" y="193" width="124" height="44" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="573" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Journal</text>
  <rect x="645" y="274" width="150" height="52" rx="8" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="677" y="281" width="87" height="20" fill="#FFFFFF"/>
  <text x="720" y="296" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">item lost</text>
  <rect x="667" y="301" width="106" height="18" fill="#FFFFFF"/>
  <text x="720" y="314" text-anchor="middle" font-size="14" fill="#111111">between tools</text>
  <text x="720" y="532" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">many links, no home: items fall through</text>
  <line x1="480" y1="80" x2="480" y2="510" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/>
</svg>
