<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Ten years of system versions in the lawyer case study</title>
  <desc>A horizontal timeline of ten years. Version 1 trainee system, years 1 to 2. Version 2 associate system with minor changes, years 3 to 8, with a marker at year 8 labelled partnership: goals changed, missed major version. Version 3 partner system from year 9. Version 4 adds a renewable-energy sector focus at year 10.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">A system's versions across a career</text>
  <line x1="80" y1="330" x2="880" y2="330" stroke="#222222" stroke-width="2.5"/>
  <line x1="80.0" y1="330" x2="80.0" y2="338" stroke="#222222" stroke-width="1.5"/>
  <text x="120" y="358" text-anchor="middle" font-size="13" fill="#111111">Year 1</text>
  <line x1="160.0" y1="330" x2="160.0" y2="338" stroke="#222222" stroke-width="1.5"/>
  <text x="200" y="358" text-anchor="middle" font-size="13" fill="#111111">Year 2</text>
  <line x1="240.0" y1="330" x2="240.0" y2="338" stroke="#222222" stroke-width="1.5"/>
  <text x="280" y="358" text-anchor="middle" font-size="13" fill="#111111">Year 3</text>
  <line x1="320.0" y1="330" x2="320.0" y2="338" stroke="#222222" stroke-width="1.5"/>
  <text x="360" y="358" text-anchor="middle" font-size="13" fill="#111111">Year 4</text>
  <line x1="400.0" y1="330" x2="400.0" y2="338" stroke="#222222" stroke-width="1.5"/>
  <text x="440" y="358" text-anchor="middle" font-size="13" fill="#111111">Year 5</text>
  <line x1="480.0" y1="330" x2="480.0" y2="338" stroke="#222222" stroke-width="1.5"/>
  <text x="520" y="358" text-anchor="middle" font-size="13" fill="#111111">Year 6</text>
  <line x1="560.0" y1="330" x2="560.0" y2="338" stroke="#222222" stroke-width="1.5"/>
  <text x="600" y="358" text-anchor="middle" font-size="13" fill="#111111">Year 7</text>
  <line x1="640.0" y1="330" x2="640.0" y2="338" stroke="#222222" stroke-width="1.5"/>
  <text x="680" y="358" text-anchor="middle" font-size="13" fill="#111111">Year 8</text>
  <line x1="720.0" y1="330" x2="720.0" y2="338" stroke="#222222" stroke-width="1.5"/>
  <text x="760" y="358" text-anchor="middle" font-size="13" fill="#111111">Year 9</text>
  <line x1="800.0" y1="330" x2="800.0" y2="338" stroke="#222222" stroke-width="1.5"/>
  <text x="840" y="358" text-anchor="middle" font-size="13" fill="#111111">Year 10</text>
  <line x1="880.0" y1="330" x2="880.0" y2="338" stroke="#222222" stroke-width="1.5"/>
  <rect x="80" y="140" width="154" height="110" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="157" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Version 1</text>
  <text x="157" y="191" text-anchor="middle" font-size="14" fill="#000000">trainee</text>
  <text x="157" y="209" text-anchor="middle" font-size="14" fill="#000000">flashcards,</text>
  <text x="157" y="228" text-anchor="middle" font-size="14" fill="#000000">mock exams</text>
  <rect x="240" y="140" width="394" height="110" rx="8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="385" y="167" width="104" height="20" fill="#FFFFFF"/>
  <text x="437" y="181" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Version 2.x</text>
  <rect x="332" y="187" width="210" height="18" fill="#FFFFFF"/>
  <text x="437" y="200" text-anchor="middle" font-size="14" fill="#111111">associate: precedent notes,</text>
  <rect x="328" y="205" width="218" height="18" fill="#FFFFFF"/>
  <text x="437" y="218" text-anchor="middle" font-size="14" fill="#111111">deal lessons; minor versions</text>
  <rect x="640" y="140" width="74" height="110" rx="8" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="659" y="167" width="36" height="20" fill="#FFFFFF"/>
  <text x="677" y="181" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">2.x</text>
  <rect x="653" y="187" width="47" height="18" fill="#FFFFFF"/>
  <text x="677" y="200" text-anchor="middle" font-size="14" fill="#111111">still</text>
  <rect x="646" y="205" width="62" height="18" fill="#FFFFFF"/>
  <text x="677" y="218" text-anchor="middle" font-size="14" fill="#111111">running</text>
  <rect x="720" y="140" width="74" height="110" rx="8" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="743" y="176" width="27" height="20" fill="#FFFFFF"/>
  <text x="757" y="191" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">V3</text>
  <rect x="726" y="196" width="62" height="18" fill="#FFFFFF"/>
  <text x="757" y="209" text-anchor="middle" font-size="14" fill="#111111">partner</text>
  <rect x="800" y="140" width="80" height="110" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="840" y="191" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">V4</text>
  <text x="840" y="209" text-anchor="middle" font-size="14" fill="#000000">sector</text>
  <line x1="640.0" y1="300" x2="640.0" y2="256" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="400" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Partnership: goals changed,</text>
  <text x="640" y="422" text-anchor="middle" font-size="14" fill="#111111">major version missed for a year</text>
  <line x1="640.0" y1="330" x2="640.0" y2="382" stroke="#222222" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="480" y="480" text-anchor="middle" font-size="13" font-style="italic" fill="#333333">Minor versions and patches occurred within each period; only major changes are shown.</text>
</svg>
