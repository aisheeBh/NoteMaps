<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Sources of three weekly learning hours</title>
  <desc>Horizontal stacked bar of 240 planned minutes: embedded 60, fragments 50, paired 40, protected 90. Below, realised time at 0.75 adherence is 180 minutes. Pruning is shown as freeing time rather than using it.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Where 240 planned minutes a week come from</text>
  <rect x="100" y="110" width="189" height="90" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="194" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Embed</text>
  <text x="194" y="170" text-anchor="middle" font-size="15" fill="#000000">60 min</text>
  <text x="194" y="226" text-anchor="middle" font-size="13" fill="#111111">4 x 15 min after meetings</text>
  <rect x="289" y="110" width="158" height="90" rx="8" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="327" y="135" width="83" height="21" fill="#FFFFFF"/>
  <text x="368" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Fragment</text>
  <rect x="339" y="156" width="58" height="20" fill="#FFFFFF"/>
  <text x="368" y="170" text-anchor="middle" font-size="15" fill="#111111">50 min</text>
  <text x="368" y="226" text-anchor="middle" font-size="13" fill="#111111">5 x 10 min review</text>
  <rect x="446" y="110" width="126" height="90" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="509" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#222222">Pair</text>
  <text x="509" y="170" text-anchor="middle" font-size="15" fill="#222222">40 min</text>
  <text x="510" y="226" text-anchor="middle" font-size="13" fill="#111111">4 x 10 min audio</text>
  <rect x="572" y="110" width="284" height="90" rx="8" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="677" y="135" width="74" height="21" fill="#FFFFFF"/>
  <text x="714" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Protect</text>
  <rect x="685" y="156" width="58" height="20" fill="#FFFFFF"/>
  <text x="714" y="170" text-anchor="middle" font-size="15" fill="#111111">90 min</text>
  <text x="714" y="226" text-anchor="middle" font-size="13" fill="#111111">2 x 45 min mornings</text>
  <line x1="100" y1="250" x2="856.0" y2="250" stroke="#555555" stroke-width="1.5"/>
  <text x="478" y="280" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">240 minutes planned</text>
  <rect x="100" y="310" width="567" height="56" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="384" y="343" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">About 180 minutes realised at 0.75 adherence</text>
  <text x="681" y="344" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">= 3 hours</text>
  <text x="480" y="420" text-anchor="middle" font-size="13" font-style="italic" fill="#333333">Pruning four newsletters and one recurring meeting freed more time than it used.</text>
</svg>
