<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Productivity gains from an AI assistant by agent experience</title>
  <desc>Vertical bars of the increase in issues resolved per hour after AI access: about 34% for novice and lower-skilled agents, about 14% on average across all agents, and close to zero for the most experienced and skilled agents.</desc>
  <defs>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Who gained most from an AI assistant in customer support</text>
  <!-- scale 0..40% => y 380..80 (7.5 px per %) -->
  <line x1="150" y1="80" x2="150" y2="380" stroke="#222222" stroke-width="2"/>
  <line x1="150" y1="380" x2="850" y2="380" stroke="#222222" stroke-width="2"/>
  <g font-size="14" fill="#111111" text-anchor="end">
    <text x="140" y="385">0%</text><text x="140" y="310">10%</text><text x="140" y="235">20%</text><text x="140" y="160">30%</text><text x="140" y="85">40%</text>
  </g>
  <g stroke="#CCCCCC" stroke-width="1">
    <line x1="150" y1="305" x2="850" y2="305"/><line x1="150" y1="230" x2="850" y2="230"/><line x1="150" y1="155" x2="850" y2="155"/>
  </g>
  <rect x="220" y="125" width="150" height="255" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <text x="295" y="115" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">about 34%</text>
  <rect x="425" y="275" width="150" height="105" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="500" y="265" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">about 14%</text>
  <rect x="630" y="376" width="150" height="4" fill="#E6E6E6" stroke="#666666" stroke-width="1.5"/>
  <text x="705" y="364" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">little or none</text>
  <g font-size="15" fill="#111111" text-anchor="middle">
    <text x="295" y="404">Novice and</text><text x="295" y="422">lower-skilled agents</text>
    <text x="500" y="404">All agents</text><text x="500" y="422">(average)</text>
    <text x="705" y="404">Most experienced</text><text x="705" y="422">and skilled agents</text>
  </g>
  <text x="40" y="230" text-anchor="middle" font-size="15" fill="#111111" transform="rotate(-90 40 230)">Rise in issues resolved per hour</text>
  <text x="480" y="462" text-anchor="middle" font-size="13" fill="#333333">Approximate values reported by Brynjolfsson, Li and Raymond for over 5,000 agents at one company.</text>
</svg>
