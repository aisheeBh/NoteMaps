<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Six kinds of Socratic question</title>
  <desc>A central claim surrounded by six question types, each with an example: clarification, assumptions, reasons and evidence, viewpoints, implications, and questions about the question.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Six ways to question a claim</text>

  <!-- connectors -->
  <g stroke="#333333" stroke-width="2">
    <line x1="480" y1="300" x2="190" y2="140"/>
    <line x1="480" y1="300" x2="770" y2="140"/>
    <line x1="480" y1="300" x2="130" y2="320"/>
    <line x1="480" y1="300" x2="830" y2="320"/>
    <line x1="480" y1="300" x2="190" y2="490"/>
    <line x1="480" y1="300" x2="770" y2="490"/>
  </g>

  <!-- centre -->
  <rect x="345" y="250" width="270" height="100" rx="12" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="480" y="282" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">THE CLAIM</text>
  <text x="480" y="306" text-anchor="middle" font-size="15" fill="#FFFFFF">"We should cut the price</text>
  <text x="480" y="326" text-anchor="middle" font-size="15" fill="#FFFFFF">to win market share."</text>

  <g font-size="14" fill="#111111">
    <!-- top left: clarification -->
    <rect x="40" y="70" width="300" height="100" rx="10" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
    <rect x="52" y="80" width="276" height="80" fill="#FFFFFF"/>
    <text x="62" y="102" font-size="16" font-weight="bold">1. CLARIFICATION</text>
    <text x="62" y="124">"Share of what market,</text>
    <text x="62" y="144">measured how?"</text>
    <!-- top right: assumptions -->
    <rect x="620" y="70" width="300" height="100" rx="10" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
    <rect x="632" y="80" width="276" height="80" fill="#FFFFFF"/>
    <text x="642" y="102" font-size="16" font-weight="bold">2. ASSUMPTIONS</text>
    <text x="642" y="124">"What are you assuming</text>
    <text x="642" y="144">about how buyers choose?"</text>
    <!-- mid left: reasons -->
    <rect x="20" y="270" width="290" height="100" rx="10" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
    <rect x="32" y="280" width="266" height="80" fill="#FFFFFF"/>
    <text x="42" y="302" font-size="16" font-weight="bold">3. REASONS, EVIDENCE</text>
    <text x="42" y="324">"What data shows price</text>
    <text x="42" y="344">is why we lose deals?"</text>
    <!-- mid right: viewpoints -->
    <rect x="650" y="270" width="290" height="100" rx="10" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
    <rect x="662" y="280" width="266" height="80" fill="#FFFFFF"/>
    <text x="672" y="302" font-size="16" font-weight="bold">4. VIEWPOINTS</text>
    <text x="672" y="324">"How would a competitor</text>
    <text x="672" y="344">or the finance team see it?"</text>
    <!-- bottom left: implications -->
    <rect x="40" y="440" width="300" height="100" rx="10" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
    <rect x="52" y="450" width="276" height="80" fill="#FFFFFF"/>
    <text x="62" y="472" font-size="16" font-weight="bold">5. IMPLICATIONS</text>
    <text x="62" y="494">"If rivals match the cut,</text>
    <text x="62" y="514">what happens to margin?"</text>
    <!-- bottom right: question about question -->
    <rect x="620" y="440" width="300" height="100" rx="10" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
    <rect x="632" y="450" width="276" height="80" fill="#FFFFFF"/>
    <text x="642" y="472" font-size="16" font-weight="bold">6. THE QUESTION ITSELF</text>
    <text x="642" y="494">"Is market share the</text>
    <text x="642" y="514">right goal at all?"</text>
  </g>
  <text x="480" y="580" text-anchor="middle" font-size="13" fill="#333333">Question types adapted from Richard Paul's taxonomy of Socratic questions.</text>
</svg>
