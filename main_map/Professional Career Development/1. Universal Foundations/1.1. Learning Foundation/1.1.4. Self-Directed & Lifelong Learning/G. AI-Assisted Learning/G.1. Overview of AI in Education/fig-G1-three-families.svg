<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Three families of educational AI</title>
  <desc>Three stacked layers: rule-based tutors from the 1970s at the base, predictive machine learning from the 2000s in the middle and generative AI from 2022 on top. Each layer lists what it contributes. A bracket on the right shows that modern hybrid tutors draw on all three.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
  </defs>

  <text x="480" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Three families of educational AI</text>

  <!-- Top layer: generative -->
  <rect x="40" y="80" width="700" height="120" rx="10" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="60" y="94" width="660" height="92" fill="#FFFFFF"/>
  <text x="80" y="122" font-size="19" font-weight="bold" fill="#111111">GENERATIVE AI (from 2022)</text>
  <text x="80" y="148" font-size="15" fill="#111111">Contributes: open dialogue, explanation at any level, unlimited practice,</text>
  <text x="80" y="170" font-size="15" fill="#111111">role-play. Typical failure: fluent but false content; gives answers.</text>

  <!-- Middle layer: predictive ML -->
  <rect x="40" y="220" width="700" height="120" rx="10" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="60" y="234" width="660" height="92" fill="#FFFFFF"/>
  <text x="80" y="262" font-size="19" font-weight="bold" fill="#111111">PREDICTIVE MACHINE LEARNING (from 2000s)</text>
  <text x="80" y="288" font-size="15" fill="#111111">Contributes: what to study next, when to review, who may struggle.</text>
  <text x="80" y="310" font-size="15" fill="#111111">Typical failure: opaque reasoning; bias learned from past data.</text>

  <!-- Bottom layer: rule-based -->
  <rect x="40" y="360" width="700" height="120" rx="10" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="60" y="374" width="660" height="92" fill="#FFFFFF"/>
  <text x="80" y="402" font-size="19" font-weight="bold" fill="#111111">RULE-BASED TUTORS (from 1970s)</text>
  <text x="80" y="428" font-size="15" fill="#111111">Contributes: step-by-step pedagogy, precise feedback, learner models.</text>
  <text x="80" y="450" font-size="15" fill="#111111">Typical failure: narrow domain; costly to author; rigid.</text>

  <!-- Bracket -->
  <path d="M770 90 H800 V470 H770" fill="none" stroke="#222222" stroke-width="3"/>
  <line x1="800" y1="280" x2="830" y2="280" stroke="#222222" stroke-width="3"/>
  <rect x="832" y="215" width="112" height="130" rx="10" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="888" y="250" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">MODERN</text>
  <text x="888" y="272" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">HYBRID</text>
  <text x="888" y="294" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">TUTORS</text>
  <text x="888" y="320" text-anchor="middle" font-size="14" fill="#FFFFFF">draw on all</text>
  <text x="888" y="338" text-anchor="middle" font-size="14" fill="#FFFFFF">three</text>

  <text x="480" y="515" text-anchor="middle" font-size="13" fill="#333333">Dates mark when each family became prominent in education; all three remain in use.</text>
</svg>
