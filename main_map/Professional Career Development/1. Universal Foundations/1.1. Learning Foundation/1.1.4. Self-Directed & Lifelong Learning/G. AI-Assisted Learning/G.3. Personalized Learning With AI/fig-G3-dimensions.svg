<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Dimensions of personalisation grouped by strength of evidence</title>
  <desc>Three bands. Strong evidence, adapting to what the learner knows: pace, sequence, difficulty, support, feedback, review timing. Moderate evidence, adapting to purpose and setting: goals, context of examples. Weak or negative evidence, adapting to preference: learning styles, favourite topics only, engagement-maximising content.</desc>
  <defs>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">What to fit to the learner, by strength of evidence</text>

  <!-- Band 1 strong -->
  <rect x="30" y="60" width="900" height="170" rx="10" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="46" y="72" width="420" height="30" fill="#FFFFFF"/>
  <text x="56" y="94" font-size="18" font-weight="bold" fill="#111111">STRONG: adapt to what the learner knows</text>
  <g font-size="16" fill="#111111" text-anchor="middle">
    <rect x="50" y="118" width="135" height="44" rx="6" fill="#FFFFFF" stroke="#333333"/><text x="117" y="146">Pace</text>
    <rect x="198" y="118" width="135" height="44" rx="6" fill="#FFFFFF" stroke="#333333"/><text x="265" y="146">Sequence</text>
    <rect x="346" y="118" width="135" height="44" rx="6" fill="#FFFFFF" stroke="#333333"/><text x="413" y="146">Difficulty</text>
    <rect x="494" y="118" width="135" height="44" rx="6" fill="#FFFFFF" stroke="#333333"/><text x="561" y="146">Support</text>
    <rect x="642" y="118" width="135" height="44" rx="6" fill="#FFFFFF" stroke="#333333"/><text x="709" y="146">Feedback</text>
    <rect x="790" y="118" width="125" height="44" rx="6" fill="#FFFFFF" stroke="#333333"/><text x="852" y="146">Review timing</text>
  </g>
  <rect x="46" y="178" width="600" height="30" fill="#FFFFFF"/>
  <text x="56" y="199" font-size="15" fill="#111111">Basis: measured performance. Roots: tutoring, mastery learning, adaptive practice.</text>

  <!-- Band 2 moderate -->
  <rect x="30" y="250" width="900" height="130" rx="10" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="46" y="262" width="440" height="30" fill="#FFFFFF"/>
  <text x="56" y="284" font-size="18" font-weight="bold" fill="#111111">MODERATE: adapt to purpose and setting</text>
  <g font-size="16" fill="#111111" text-anchor="middle">
    <rect x="50" y="306" width="200" height="44" rx="6" fill="#FFFFFF" stroke="#333333"/><text x="150" y="334">Goals</text>
    <rect x="270" y="306" width="240" height="44" rx="6" fill="#FFFFFF" stroke="#333333"/><text x="390" y="334">Context of examples</text>
  </g>
  <rect x="530" y="306" width="385" height="44" fill="#FFFFFF"/>
  <text x="540" y="326" font-size="15" fill="#111111">Helps when context clarifies structure;</text>
  <text x="540" y="345" font-size="15" fill="#111111">vary contexts later for transfer.</text>

  <!-- Band 3 weak -->
  <rect x="30" y="400" width="900" height="120" rx="10" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="46" y="412" width="520" height="30" fill="#FFFFFF"/>
  <text x="56" y="434" font-size="18" font-weight="bold" fill="#111111">WEAK OR NEGATIVE: adapt to preference</text>
  <g font-size="16" fill="#111111" text-anchor="middle">
    <rect x="50" y="456" width="230" height="44" rx="6" fill="#FFFFFF" stroke="#333333"/><text x="165" y="484">Learning styles</text>
    <rect x="300" y="456" width="250" height="44" rx="6" fill="#FFFFFF" stroke="#333333"/><text x="425" y="484">Favourite topics only</text>
    <rect x="570" y="456" width="345" height="44" rx="6" fill="#FFFFFF" stroke="#333333"/><text x="742" y="484">Engagement-maximising content</text>
  </g>
  <text x="480" y="548" text-anchor="middle" font-size="13" fill="#333333">Grouping summarises the balance of research evidence; it is not a ranking from a single study.</text>
</svg>
