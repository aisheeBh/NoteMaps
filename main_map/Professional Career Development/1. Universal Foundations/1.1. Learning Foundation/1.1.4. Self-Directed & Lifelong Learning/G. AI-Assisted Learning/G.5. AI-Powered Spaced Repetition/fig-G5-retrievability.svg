  <line x1="110" y1="127.5" x2="198.7" y2="127.5" stroke="#555555" stroke-width="1.5" stroke-dasharray="2 4"/><line x1="198.7" y1="127.5" x2="198.7" y2="460" stroke="#555555" stroke-width="1.5" stroke-dasharray="2 4"/><circle cx="198.7" cy="127.5" r="7" fill="#000000"/><text x="100" y="132.5" text-anchor="end" font-size="14" fill="#111111">95%</text><line x1="110" y1="175.0" x2="302.5" y2="175.0" stroke="#555555" stroke-width="1.5" stroke-dasharray="2 4"/><line x1="302.5" y1="175.0" x2="302.5" y2="460" stroke="#555555" stroke-width="1.5" stroke-dasharray="2 4"/><circle cx="302.5" cy="175.0" r="7" fill="#000000"/><text x="100" y="180.0" text-anchor="end" font-size="14" fill="#111111">90%</text><line x1="110" y1="270.0" x2="571.6" y2="270.0" stroke="#555555" stroke-width="1.5" stroke-dasharray="2 4"/><line x1="571.6" y1="270.0" x2="571.6" y2="460" stroke="#555555" stroke-width="1.5" stroke-dasharray="2 4"/><circle cx="571.6" cy="270.0" r="7" fill="#000000"/><text x="100" y="275.0" text-anchor="end" font-size="14" fill="#111111">80%</text><rect x="210.7" y="93.5" width="250" height="24" fill="#FFFFFF"/><text x="214.7" y="111.5" font-size="15" fill="#111111">Target 95%: review at about 4.6 days</text><rect x="314.5" y="141.0" width="250" height="24" fill="#FFFFFF"/><text x="318.5" y="159.0" font-size="15" fill="#111111">Target 90%: review at 10 days (= stability)</text><rect x="583.6" y="236.0" width="250" height="24" fill="#FFFFFF"/><text x="587.6" y="254.0" font-size="15" fill="#111111">Target 80%: review at about 24 days</text>
  <rect x="640" y="380" width="230" height="26" fill="#FFFFFF"/>
  <text x="650" y="398" font-size="15" font-weight="bold" fill="#111111">Item stability: 10 days</text>
  <text x="480" y="545" text-anchor="middle" font-size="13" fill="#333333">Curve computed from the FSRS power forgetting curve, R = (1 + 19/81 x t/S) to the power -0.5, with S = 10 days.</text>
</svg>
