<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Recall probability after a review and the interval set by desired retention</title>
  <desc>A forgetting curve for an item with stability of 10 days, falling from 100% recall just after review. Dotted guide lines show that a target of 95% recall gives a review after about 4.6 days, a target of 90% after 10 days and a target of 80% after about 24 days.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">The target retention decides when the next review falls</text>
  <line x1="110" y1="460" x2="900" y2="460" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="110" y1="460" x2="110" y2="70" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="100" y="85.0" text-anchor="end" font-size="14" fill="#111111">100%</text>
  <text x="100" y="465.0" text-anchor="end" font-size="14" fill="#111111">60%</text>
  <line x1="110.0" y1="460" x2="110.0" y2="467" stroke="#222222" stroke-width="2"/><text x="110.0" y="486" text-anchor="middle" font-size="14" fill="#111111">0</text><line x1="302.5" y1="460" x2="302.5" y2="467" stroke="#222222" stroke-width="2"/><text x="302.5" y="486" text-anchor="middle" font-size="14" fill="#111111">10</text><line x1="495.0" y1="460" x2="495.0" y2="467" stroke="#222222" stroke-width="2"/><text x="495.0" y="486" text-anchor="middle" font-size="14" fill="#111111">20</text><line x1="687.5" y1="460" x2="687.5" y2="467" stroke="#222222" stroke-width="2"/><text x="687.5" y="486" text-anchor="middle" font-size="14" fill="#111111">30</text><line x1="880.0" y1="460" x2="880.0" y2="467" stroke="#222222" stroke-width="2"/><text x="880.0" y="486" text-anchor="middle" font-size="14" fill="#111111">40</text>
  <text x="500" y="514" text-anchor="middle" font-size="16" fill="#111111">Days since last review</text>
  <text x="36" y="270" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 36 270)">Probability of recall</text>
