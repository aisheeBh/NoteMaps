<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The learning roadmap as a cycle of design, use and revision</title>
  <desc>Four phases around a cycle: design (destination, map, prerequisites, sequence, milestones, resources, time), use (learning and practice along the route), evidence (milestones show what has been achieved), and revision (pace, method, resources, route or destination changed). Around the cycle sit the influences of the domain, mentors and community, and the visible form of the roadmap.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
  </defs>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">A roadmap is a cycle, not a document</text>
  <circle cx="480" cy="320" r="195" fill="none" stroke="#333333" stroke-width="3" stroke-dasharray="1 0"/>
  <path d="M617 172 L625 189 L608 181 z" fill="#222222"/>
  <path d="M628 457 L611 465 L619 448 z" fill="#222222"/>
  <path d="M343 468 L335 451 L352 459 z" fill="#222222"/>
  <path d="M332 183 L349 175 L341 192 z" fill="#222222"/>
  <rect x="375" y="83" width="210" height="84" rx="12" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <rect x="385" y="91" width="190" height="68" rx="6" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="480" y="115" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">DESIGN</text>
  <text x="480" y="135" text-anchor="middle" font-size="13" fill="#111111">destination, map,</text>
  <text x="480" y="151" text-anchor="middle" font-size="13" fill="#111111">sequence, milestones</text>
  <rect x="570" y="278" width="210" height="84" rx="12" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="580" y="286" width="190" height="68" rx="6" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="675" y="310" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">USE</text>
  <text x="675" y="330" text-anchor="middle" font-size="13" fill="#111111">learning and practice</text>
  <text x="675" y="346" text-anchor="middle" font-size="13" fill="#111111">along the route</text>
  <rect x="375" y="473" width="210" height="84" rx="12" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <rect x="385" y="481" width="190" height="68" rx="6" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="480" y="505" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">EVIDENCE</text>
  <text x="480" y="525" text-anchor="middle" font-size="13" fill="#111111">milestones show</text>
  <text x="480" y="541" text-anchor="middle" font-size="13" fill="#111111">what is achieved</text>
  <rect x="180" y="278" width="210" height="84" rx="12" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="190" y="286" width="190" height="68" rx="6" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="285" y="310" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">REVISION</text>
  <text x="285" y="330" text-anchor="middle" font-size="13" fill="#111111">pace, method, route</text>
  <text x="285" y="346" text-anchor="middle" font-size="13" fill="#111111">or destination</text>
  <rect x="410" y="280" width="140" height="80" rx="40" fill="#FAFAFA" stroke="#555555" stroke-width="1.2" stroke-dasharray="2 4"/>
  <text x="480" y="314" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">The roadmap</text>
  <text x="480" y="332" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">document</text>
  <text x="70" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Domain</text>
  <text x="70" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">structure</text>
  <text x="890" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Mentors and</text>
  <text x="890" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">community</text>
  <text x="70" y="520" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Visible</text>
  <text x="70" y="538" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">one-page form</text>
  <text x="890" y="520" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Shared and</text>
  <text x="890" y="538" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">versioned</text>
  <line x1="110" y1="140" x2="300" y2="220" stroke="#555555" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <line x1="850" y1="140" x2="660" y2="220" stroke="#555555" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <line x1="110" y1="500" x2="300" y2="420" stroke="#555555" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <line x1="850" y1="500" x2="660" y2="420" stroke="#555555" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
</svg>