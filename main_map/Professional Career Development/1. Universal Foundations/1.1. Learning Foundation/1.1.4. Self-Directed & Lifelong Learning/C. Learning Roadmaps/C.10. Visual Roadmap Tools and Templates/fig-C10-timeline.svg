<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>A timeline roadmap with parallel stages and milestones</title>
  <desc>Twelve months across the top. Bars show foundations in months one to three, core services in months three to six, infrastructure as code in months six to nine, and operations in months nine to twelve, with a parallel bar for weekly lab practice throughout and a certification study bar in months seven and eight. Diamonds mark quarterly milestone projects.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
  </defs>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Timeline view: when each stage happens</text>
  <line x1="230" y1="70" x2="230" y2="400" stroke="#DDDDDD" stroke-width="1"/>
  <line x1="288" y1="70" x2="288" y2="400" stroke="#DDDDDD" stroke-width="1"/>
  <line x1="345" y1="70" x2="345" y2="400" stroke="#DDDDDD" stroke-width="1"/>
  <line x1="402" y1="70" x2="402" y2="400" stroke="#DDDDDD" stroke-width="1"/>
  <line x1="460" y1="70" x2="460" y2="400" stroke="#DDDDDD" stroke-width="1"/>
  <line x1="518" y1="70" x2="518" y2="400" stroke="#DDDDDD" stroke-width="1"/>
  <line x1="575" y1="70" x2="575" y2="400" stroke="#DDDDDD" stroke-width="1"/>
  <line x1="632" y1="70" x2="632" y2="400" stroke="#DDDDDD" stroke-width="1"/>
  <line x1="690" y1="70" x2="690" y2="400" stroke="#DDDDDD" stroke-width="1"/>
  <line x1="748" y1="70" x2="748" y2="400" stroke="#DDDDDD" stroke-width="1"/>
  <line x1="805" y1="70" x2="805" y2="400" stroke="#DDDDDD" stroke-width="1"/>
  <line x1="862" y1="70" x2="862" y2="400" stroke="#DDDDDD" stroke-width="1"/>
  <line x1="920" y1="70" x2="920" y2="400" stroke="#DDDDDD" stroke-width="1"/>
  <text x="259" y="82" text-anchor="middle" font-size="13" fill="#111111">M1</text>
  <text x="316" y="82" text-anchor="middle" font-size="13" fill="#111111">M2</text>
  <text x="374" y="82" text-anchor="middle" font-size="13" fill="#111111">M3</text>
  <text x="431" y="82" text-anchor="middle" font-size="13" fill="#111111">M4</text>
  <text x="489" y="82" text-anchor="middle" font-size="13" fill="#111111">M5</text>
  <text x="546" y="82" text-anchor="middle" font-size="13" fill="#111111">M6</text>
  <text x="604" y="82" text-anchor="middle" font-size="13" fill="#111111">M7</text>
  <text x="661" y="82" text-anchor="middle" font-size="13" fill="#111111">M8</text>
  <text x="719" y="82" text-anchor="middle" font-size="13" fill="#111111">M9</text>
  <text x="776" y="82" text-anchor="middle" font-size="13" fill="#111111">M10</text>
  <text x="834" y="82" text-anchor="middle" font-size="13" fill="#111111">M11</text>
  <text x="891" y="82" text-anchor="middle" font-size="13" fill="#111111">M12</text>
  <text x="216" y="126" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Foundations</text>
  <rect x="232" y="108" width="168" height="28" rx="4" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="216" y="172" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Core services</text>
  <rect x="404" y="154" width="168" height="28" rx="4" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="216" y="218" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Infrastructure as code</text>
  <rect x="577" y="200" width="168" height="28" rx="4" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="216" y="264" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Operations and security</text>
  <rect x="750" y="246" width="168" height="28" rx="4" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="216" y="310" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Lab practice, weekly</text>
  <rect x="232" y="292" width="686" height="28" rx="4" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="216" y="356" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Certification study</text>
  <rect x="634" y="338" width="111" height="28" rx="4" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="216" y="398" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Milestones</text>
  <rect x="390" y="382" width="20" height="20" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" transform="rotate(45 400 392)"/>
  <text x="400" y="426" text-anchor="middle" font-size="14" fill="#111111">M1 project</text>
  <rect x="563" y="382" width="20" height="20" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" transform="rotate(45 573 392)"/>
  <text x="573" y="426" text-anchor="middle" font-size="14" fill="#111111">M2 project</text>
  <rect x="736" y="382" width="20" height="20" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" transform="rotate(45 746 392)"/>
  <text x="746" y="426" text-anchor="middle" font-size="14" fill="#111111">M3 project + exam</text>
  <circle cx="918" cy="392" r="12" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="918" y="426" text-anchor="end" font-size="14" fill="#111111">Destination</text>
  <text x="936" y="448" text-anchor="end" font-size="13" fill="#333333">Dates are estimates; the chart is revised at each milestone.</text>
</svg>