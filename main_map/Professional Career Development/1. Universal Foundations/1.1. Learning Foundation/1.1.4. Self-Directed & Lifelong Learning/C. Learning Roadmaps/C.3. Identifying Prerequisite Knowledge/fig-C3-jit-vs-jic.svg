<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Just-in-case and just-in-time placement of prerequisites over time</title>
  <desc>Two twelve-week timelines. Just-in-case: a five-week foundations block, then real tasks from week five. Just-in-time: a short core of minimum viable prerequisites, then real tasks from week one, each preceded by a small slice of the foundation it needs, with a consolidation pass in weeks ten and eleven.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
  </defs>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Where the foundations go: two placements of prerequisites</text>
  <text x="24" y="118" font-size="16" font-weight="bold" fill="#111111">Just-in-case</text>
  <rect x="150" y="95" width="321" height="40" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="240" y="104.0" width="141" height="22" fill="#FFFFFF" stroke="none"/>
  <text x="310" y="120.0" text-anchor="middle" font-size="14" fill="#111111">Foundations block</text>
  <rect x="471" y="95" width="449" height="40" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
  <rect x="568" y="104.0" width="255" height="22" fill="#FFFFFF" stroke="none"/>
  <text x="695" y="120.0" text-anchor="middle" font-size="14" fill="#111111">Real tasks, applying foundations</text>
  <line x1="471" y1="150" x2="471" y2="85" stroke="#111111" stroke-width="3"/>
  <text x="471" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">First real task: week 5</text>
  <text x="270" y="170" text-anchor="middle" font-size="14" fill="#111111">dropout risk; inert knowledge</text>
  <text x="24" y="268" font-size="16" font-weight="bold" fill="#111111">Just-in-time</text>
  <text x="24" y="288" font-size="16" font-weight="bold" fill="#111111">with core</text>
  <rect x="150" y="245" width="64" height="40" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="214" y="245" width="19" height="40" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="233" y="245" width="96" height="40" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
  <rect x="268" y="254.0" width="27" height="22" fill="#FFFFFF" stroke="none"/>
  <text x="282" y="270.0" text-anchor="middle" font-size="14" fill="#111111">T1</text>
  <rect x="342" y="245" width="19" height="40" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="362" y="245" width="96" height="40" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
  <rect x="396" y="254.0" width="27" height="22" fill="#FFFFFF" stroke="none"/>
  <text x="410" y="270.0" text-anchor="middle" font-size="14" fill="#111111">T2</text>
  <rect x="471" y="245" width="19" height="40" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="490" y="245" width="96" height="40" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
  <rect x="525" y="254.0" width="27" height="22" fill="#FFFFFF" stroke="none"/>
  <text x="538" y="270.0" text-anchor="middle" font-size="14" fill="#111111">T3</text>
  <rect x="599" y="245" width="19" height="40" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="618" y="245" width="96" height="40" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
  <rect x="653" y="254.0" width="27" height="22" fill="#FFFFFF" stroke="none"/>
  <text x="667" y="270.0" text-anchor="middle" font-size="14" fill="#111111">T4</text>
  <rect x="740" y="245" width="103" height="40" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="744" y="254.0" width="96" height="22" fill="#FFFFFF" stroke="none"/>
  <text x="792" y="270.0" text-anchor="middle" font-size="14" fill="#111111">Consolidate</text>
  <rect x="856" y="245" width="64" height="40" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
  <rect x="874" y="254.0" width="27" height="22" fill="#FFFFFF" stroke="none"/>
  <text x="888" y="270.0" text-anchor="middle" font-size="14" fill="#111111">T5</text>
  <line x1="214" y1="300" x2="214" y2="235" stroke="#111111" stroke-width="3"/>
  <text x="214" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">First real task: week 1</text>
  <text x="182" y="230" text-anchor="middle" font-size="13" fill="#111111">core</text>
  <text x="464" y="340" text-anchor="middle" font-size="14" fill="#111111">a thin slice of foundation just before each task</text>
  <line x1="150" y1="380" x2="930" y2="380" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="150" y1="380" x2="150" y2="388" stroke="#222222" stroke-width="2"/>
  <text x="150" y="406" text-anchor="middle" font-size="14" fill="#111111">0</text>
  <line x1="278" y1="380" x2="278" y2="388" stroke="#222222" stroke-width="2"/>
  <text x="278" y="406" text-anchor="middle" font-size="14" fill="#111111">2</text>
  <line x1="407" y1="380" x2="407" y2="388" stroke="#222222" stroke-width="2"/>
  <text x="407" y="406" text-anchor="middle" font-size="14" fill="#111111">4</text>
  <line x1="535" y1="380" x2="535" y2="388" stroke="#222222" stroke-width="2"/>
  <text x="535" y="406" text-anchor="middle" font-size="14" fill="#111111">6</text>
  <line x1="663" y1="380" x2="663" y2="388" stroke="#222222" stroke-width="2"/>
  <text x="663" y="406" text-anchor="middle" font-size="14" fill="#111111">8</text>
  <line x1="792" y1="380" x2="792" y2="388" stroke="#222222" stroke-width="2"/>
  <text x="792" y="406" text-anchor="middle" font-size="14" fill="#111111">10</text>
  <line x1="920" y1="380" x2="920" y2="388" stroke="#222222" stroke-width="2"/>
  <text x="920" y="406" text-anchor="middle" font-size="14" fill="#111111">12</text>
  <text x="535" y="430" text-anchor="middle" font-size="15" fill="#111111">Weeks</text>
  <rect x="150" y="470" width="36" height="22" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="196" y="486" font-size="14" fill="#111111">Foundations / prerequisites</text>
  <rect x="410" y="470" width="36" height="22" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
  <text x="456" y="486" font-size="14" fill="#111111">Real tasks</text>
  <rect x="670" y="470" width="36" height="22" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
  <text x="716" y="486" font-size="14" fill="#111111">Systematic consolidation</text>
  <text x="936" y="536" text-anchor="end" font-size="13" fill="#333333">Schematic; durations illustrative.</text>
</svg>