<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Perceived and actual learning after fluent and disfluent delivery of the same content</title>
  <desc>Two pairs of bars. Learners who watched a fluent speaker judged their learning clearly higher than those who watched a disfluent speaker. On the actual test, the two groups scored about the same.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
  </defs>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Same content, different delivery: feeling versus learning</text>
  <line x1="120" y1="400" x2="880" y2="400" stroke="#222222" stroke-width="2"/>
  <rect x="120" y="100" width="100" height="300" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
  <rect x="240" y="210" width="100" height="190" fill="url(#dots)" stroke="#7A5200" stroke-width="2.5" stroke-dasharray="8 4"/>
  <rect x="128" y="110" width="84" height="24" fill="#FFFFFF" stroke="none"/>
  <text x="170" y="127" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Fluent</text>
  <rect x="248" y="220" width="84" height="24" fill="#FFFFFF" stroke="none"/>
  <text x="290" y="237" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Disfluent</text>
  <text x="230" y="430" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Judged learning</text>
  <rect x="530" y="180" width="100" height="220" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
  <rect x="650" y="185" width="100" height="215" fill="url(#dots)" stroke="#7A5200" stroke-width="2.5" stroke-dasharray="8 4"/>
  <rect x="538" y="190" width="84" height="24" fill="#FFFFFF" stroke="none"/>
  <text x="580" y="207" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Fluent</text>
  <rect x="658" y="195" width="84" height="24" fill="#FFFFFF" stroke="none"/>
  <text x="700" y="212" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Disfluent</text>
  <text x="640" y="430" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Actual test score</text>
  <text x="230" y="80" text-anchor="middle" font-size="15" fill="#111111">Clear gap: fluent feels better</text>
  <text x="640" y="160" text-anchor="middle" font-size="15" fill="#111111">About the same</text>
  <text x="480" y="460" text-anchor="middle" font-size="14" fill="#111111">After Carpenter, Wilford, Kornell and Mullaney (2013).</text>
  <text x="480" y="482" text-anchor="middle" font-size="13" fill="#333333">Schematic; bar heights show the direction of the findings, not exact values.</text>
</svg>