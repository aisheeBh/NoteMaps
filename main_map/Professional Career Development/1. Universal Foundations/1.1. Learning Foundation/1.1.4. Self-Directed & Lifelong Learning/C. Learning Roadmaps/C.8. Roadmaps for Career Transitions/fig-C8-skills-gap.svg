<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Sorting the target role's skills against what a career changer already has</title>
  <desc>Four columns for a teacher moving into instructional design. Transferable as is: writing assessments, explaining complex ideas, managing groups. Transferable with translation: lesson planning as learning design, formative assessment as embedded knowledge checks, differentiation as audience analysis. To build: authoring tools, working with subject experts, evaluating business impact. To unlearn: expecting a fixed timetable, designing for a captive audience.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
  </defs>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Four bins for every skill the target role needs</text>
  <rect x="24" y="70" width="214" height="310" rx="10" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <rect x="34" y="80" width="194" height="52" rx="4" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="131" y="101" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">TRANSFERABLE</text>
  <text x="131" y="121" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">AS IS</text>
  <rect x="36" y="160" width="190" height="40" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
  <text x="131" y="185" text-anchor="middle" font-size="14" fill="#111111">Writing assessments</text>
  <rect x="36" y="214" width="190" height="40" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
  <text x="131" y="239" text-anchor="middle" font-size="14" fill="#111111">Explaining complex ideas</text>
  <rect x="36" y="268" width="190" height="40" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
  <text x="131" y="293" text-anchor="middle" font-size="14" fill="#111111">Managing group sessions</text>
  <rect x="256" y="70" width="214" height="310" rx="10" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="266" y="80" width="194" height="52" rx="4" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="363" y="101" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">TRANSFERABLE WITH</text>
  <text x="363" y="121" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">TRANSLATION</text>
  <rect x="268" y="160" width="190" height="56" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
  <text x="363" y="183" text-anchor="middle" font-size="14" fill="#111111">Lesson planning →</text>
  <text x="363" y="201" text-anchor="middle" font-size="14" fill="#111111">learning design</text>
  <rect x="268" y="230" width="190" height="56" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
  <text x="363" y="253" text-anchor="middle" font-size="14" fill="#111111">Formative assessment →</text>
  <text x="363" y="271" text-anchor="middle" font-size="14" fill="#111111">knowledge checks</text>
  <rect x="268" y="300" width="190" height="56" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
  <text x="363" y="323" text-anchor="middle" font-size="14" fill="#111111">Differentiation →</text>
  <text x="363" y="341" text-anchor="middle" font-size="14" fill="#111111">audience analysis</text>
  <rect x="488" y="70" width="214" height="310" rx="10" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="498" y="80" width="194" height="52" rx="4" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="595" y="101" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">TO BUILD</text>
  <rect x="500" y="160" width="190" height="40" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
  <text x="595" y="185" text-anchor="middle" font-size="14" fill="#111111">E-learning authoring tools</text>
  <rect x="500" y="214" width="190" height="40" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
  <text x="595" y="239" text-anchor="middle" font-size="14" fill="#111111">Working with subject experts</text>
  <rect x="500" y="268" width="190" height="40" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
  <text x="595" y="293" text-anchor="middle" font-size="14" fill="#111111">Evaluating business impact</text>
  <rect x="720" y="70" width="214" height="310" rx="10" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="730" y="80" width="194" height="52" rx="4" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="827" y="101" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">TO UNLEARN</text>
  <rect x="732" y="160" width="190" height="40" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
  <text x="827" y="185" text-anchor="middle" font-size="14" fill="#111111">Expecting a fixed timetable</text>
  <rect x="732" y="214" width="190" height="56" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
  <text x="827" y="237" text-anchor="middle" font-size="14" fill="#111111">Designing for a captive</text>
  <text x="827" y="255" text-anchor="middle" font-size="14" fill="#111111">audience</text>
  <text x="480" y="414" text-anchor="middle" font-size="14" fill="#111111">Example: a secondary-school teacher moving into corporate instructional design.</text>
</svg>