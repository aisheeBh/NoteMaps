<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 574" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>A skills heat map comparing current and target proficiency</title>
  <desc>Seven skills of a junior pricing analyst, each rated on a five-level scale. Hatched cells show current proficiency; a heavy outlined cell marked T shows the target. The gap and the evidence behind each rating are listed on the right. The largest gaps are in elasticity estimation, anomaly judgement and test design.</desc>
