<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>A domain decomposed into capability areas, skills and sub-skills</title>
  <desc>Customer success management is broken into four capability areas. One area, account health and retention, is broken into three skills. One skill, forecasting renewal risk, is broken into three sub-skills, and one sub-skill into a single element.</desc>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">From domain to element: five levels of a skill map</text>

  <!-- level labels -->
  <g font-size="15" font-weight="bold" fill="#111111">
    <text x="24" y="91">DOMAIN</text>
    <text x="24" y="191">CAPABILITY</text><text x="24" y="209">AREA</text>
    <text x="24" y="301">SKILL</text>
    <text x="24" y="411">SUB-SKILL</text>
    <text x="24" y="521">ELEMENT</text>
  </g>
  <g stroke="#CCCCCC" stroke-width="1" stroke-dasharray="3 4">
    <line x1="24" y1="140" x2="936" y2="140"/><line x1="24" y1="250" x2="936" y2="250"/>
    <line x1="24" y1="355" x2="936" y2="355"/><line x1="24" y1="465" x2="936" y2="465"/>
  </g>

  <!-- connectors -->
  <g stroke="#333333" stroke-width="1.8" fill="none">
    <path d="M540 108 L540 130 L235 130 L235 170"/><path d="M540 130 L445 130 L445 170"/>
    <path d="M540 130 L655 130 L655 170"/><path d="M540 130 L850 130 L850 170"/>
    <path d="M235 222 L235 240 L235 278"/><path d="M235 240 L445 240 L445 278"/><path d="M235 240 L655 240 L655 278"/>
    <path d="M235 324 L235 348 L235 386"/><path d="M235 348 L445 348 L445 386"/><path d="M235 348 L655 348 L655 386"/>
    <path d="M445 432 L445 496"/>
  </g>

  <!-- domain -->
  <rect x="400" y="64" width="280" height="44" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="540" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Customer success management</text>

  <!-- areas -->
  <g stroke-width="2">
    <rect x="150" y="170" width="170" height="52" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="3"/>
    <rect x="360" y="170" width="170" height="52" rx="8" fill="#FFFFFF" stroke="#333333"/>
    <rect x="570" y="170" width="170" height="52" rx="8" fill="#FFFFFF" stroke="#333333"/>
    <rect x="770" y="170" width="160" height="52" rx="8" fill="#FFFFFF" stroke="#333333"/>
  </g>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="235" y="192" font-weight="bold">Account health</text><text x="235" y="210" font-weight="bold">and retention</text>
    <text x="445" y="192">Onboarding</text><text x="445" y="210">customers</text>
    <text x="655" y="192">Commercial</text><text x="655" y="210">growth</text>
    <text x="850" y="192">Voice of the</text><text x="850" y="210">customer</text>
  </g>

  <!-- skills -->
  <rect x="150" y="278" width="170" height="46" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="3"/>
  <rect x="360" y="278" width="170" height="46" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <rect x="570" y="278" width="170" height="46" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="235" y="298" font-weight="bold">Forecasting</text><text x="235" y="315" font-weight="bold">renewal risk</text>
    <text x="445" y="298">Running health</text><text x="445" y="315">reviews</text>
    <text x="655" y="298">Handling</text><text x="655" y="315">escalations</text>
  </g>

  <!-- sub-skills -->
  <rect x="150" y="386" width="170" height="46" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <rect x="360" y="386" width="170" height="46" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="3"/>
  <rect x="570" y="386" width="170" height="46" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="235" y="406">Mapping the</text><text x="235" y="423">buying committee</text>
    <text x="445" y="406" font-weight="bold">Reading usage data</text><text x="445" y="423" font-weight="bold">for warning signs</text>
    <text x="655" y="406">Weighing contract</text><text x="655" y="423">and budget timing</text>
  </g>

  <!-- element -->
  <rect x="300" y="496" width="290" height="46" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="445" y="516" text-anchor="middle" font-size="14" fill="#111111">Knowing which usage metrics</text>
  <text x="445" y="533" text-anchor="middle" font-size="14" fill="#111111">predict churn for this product</text>

  <!-- right annotation -->
  <g font-size="14" fill="#111111">
    <text x="780" y="300">Right grain for a skill:</text>
    <text x="780" y="320">practised in a session,</text>
    <text x="780" y="340">shown in a short task</text>
  </g>
  <text x="936" y="580" text-anchor="end" font-size="13" fill="#333333">Only one branch is expanded at each level.</text>
</svg>
