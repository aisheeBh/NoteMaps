<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Planned, actual and forecast progress for one learner</title>
  <desc>Milestones reached against weeks. The planned line rises steadily to the destination at week 40. The actual line rises more slowly and stalls between weeks 16 and 22. A forecast wedge, based on the recent rate, projects arrival between weeks 50 and 62.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
  </defs>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Re-forecasting from the actual rate of progress</text>
  <line x1="130" y1="470" x2="900" y2="470" stroke="#DDDDDD" stroke-width="1"/>
  <text x="120" y="475" text-anchor="end" font-size="14" fill="#111111">0</text>
  <line x1="130" y1="394" x2="900" y2="394" stroke="#DDDDDD" stroke-width="1"/>
  <text x="120" y="399" text-anchor="end" font-size="14" fill="#111111">1</text>
  <line x1="130" y1="318" x2="900" y2="318" stroke="#DDDDDD" stroke-width="1"/>
  <text x="120" y="323" text-anchor="end" font-size="14" fill="#111111">2</text>
  <line x1="130" y1="242" x2="900" y2="242" stroke="#DDDDDD" stroke-width="1"/>
  <text x="120" y="247" text-anchor="end" font-size="14" fill="#111111">3</text>
  <line x1="130" y1="166" x2="900" y2="166" stroke="#DDDDDD" stroke-width="1"/>
  <text x="120" y="171" text-anchor="end" font-size="14" fill="#111111">4</text>
  <line x1="130" y1="90" x2="900" y2="90" stroke="#DDDDDD" stroke-width="1"/>
  <text x="120" y="95" text-anchor="end" font-size="14" fill="#111111">Dest.</text>
  <line x1="130" y1="470" x2="910" y2="470" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="130" y1="470" x2="130" y2="70" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="130" y="492" text-anchor="middle" font-size="14" fill="#111111">0</text>
  <text x="240" y="492" text-anchor="middle" font-size="14" fill="#111111">10</text>
  <text x="350" y="492" text-anchor="middle" font-size="14" fill="#111111">20</text>
  <text x="460" y="492" text-anchor="middle" font-size="14" fill="#111111">30</text>
  <text x="570" y="492" text-anchor="middle" font-size="14" fill="#111111">40</text>
  <text x="680" y="492" text-anchor="middle" font-size="14" fill="#111111">50</text>
  <text x="790" y="492" text-anchor="middle" font-size="14" fill="#111111">60</text>
  <text x="900" y="492" text-anchor="middle" font-size="14" fill="#111111">70</text>
  <text x="515" y="518" text-anchor="middle" font-size="15" fill="#111111">Weeks</text>
  <text x="40" y="280" text-anchor="middle" font-size="15" fill="#111111" transform="rotate(-90 40 280)">Milestones reached</text>
  <polygon points="438,295 680,90 812,90" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <line x1="130" y1="470" x2="570" y2="90" stroke="#1F3B5C" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="394" y="196" text-anchor="end" font-size="15" font-weight="bold" fill="#1F3B5C">Planned</text>
  <polyline points="130,470 196,424 262,379 306,348 372,341 438,295" fill="none" stroke="#111111" stroke-width="4"/>
  <text x="449" y="325" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">Actual to date</text>
  <text x="339" y="371" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">stall</text>
  <line x1="570" y1="90" x2="570" y2="470" stroke="#1F3B5C" stroke-width="1.5" stroke-dasharray="3 4"/>
  <text x="570" y="78" text-anchor="middle" font-size="14" fill="#111111">planned arrival</text>
  <text x="757" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">forecast: weeks 50–62</text>
  <text x="680" y="196" text-anchor="start" font-size="14" fill="#111111">forecast from</text>
  <text x="680" y="214" text-anchor="start" font-size="14" fill="#111111">recent rate</text>
  <text x="936" y="548" text-anchor="end" font-size="13" fill="#333333">Illustrative data for one learner.</text>
</svg>