<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The version history of a shared role roadmap</title>
  <desc>A timeline of releases over two years. Version 1.0.0 is the first release. Patch releases 1.0.1 and 1.1.1 replace resources. Minor releases 1.1.0 and 1.2.0 add a testing stage and an optional streaming branch. Major release 2.0.0 follows a platform change that alters the route for everyone. Larger markers indicate larger changes.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
  </defs>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Versions record how a shared roadmap evolves</text>
  <line x1="60" y1="250" x2="920" y2="250" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="64" y="234" width="32" height="32" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <line x1="80" y1="230" x2="80" y2="208" stroke="#555555" stroke-width="1.2"/>
  <text x="80" y="186" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">1.0.0</text>
  <text x="80" y="204" text-anchor="middle" font-size="13" fill="#111111">first release</text>
  <circle cx="176" cy="250" r="8" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
  <line x1="176" y1="270" x2="176" y2="284" stroke="#555555" stroke-width="1.2"/>
  <text x="176" y="304" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">1.0.1</text>
  <text x="176" y="322" text-anchor="middle" font-size="13" fill="#111111">broken resource replaced</text>
  <rect x="292" y="238" width="24" height="24" fill="#FFE6A8" stroke="#7A5200" stroke-width="2.5" transform="rotate(45 304 250)"/>
  <line x1="304" y1="230" x2="304" y2="208" stroke="#555555" stroke-width="1.2"/>
  <text x="304" y="186" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">1.1.0</text>
  <text x="304" y="204" text-anchor="middle" font-size="13" fill="#111111">testing stage added</text>
  <circle cx="416" cy="250" r="8" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
  <line x1="416" y1="270" x2="416" y2="284" stroke="#555555" stroke-width="1.2"/>
  <text x="416" y="304" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">1.1.1</text>
  <text x="416" y="322" text-anchor="middle" font-size="13" fill="#111111">course updated</text>
  <rect x="532" y="238" width="24" height="24" fill="#FFE6A8" stroke="#7A5200" stroke-width="2.5" transform="rotate(45 544 250)"/>
  <line x1="544" y1="230" x2="544" y2="208" stroke="#555555" stroke-width="1.2"/>
  <text x="544" y="186" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">1.2.0</text>
  <text x="544" y="204" text-anchor="middle" font-size="13" fill="#111111">optional streaming branch</text>
  <rect x="704" y="234" width="32" height="32" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <line x1="720" y1="270" x2="720" y2="284" stroke="#555555" stroke-width="1.2"/>
  <text x="720" y="304" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">2.0.0</text>
  <text x="720" y="322" text-anchor="middle" font-size="13" fill="#111111">platform change</text>
  <text x="720" y="338" text-anchor="middle" font-size="13" fill="#111111">route redrawn</text>
  <circle cx="832" cy="250" r="8" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
  <line x1="832" y1="230" x2="832" y2="208" stroke="#555555" stroke-width="1.2"/>
  <text x="832" y="186" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">2.0.1</text>
  <text x="832" y="204" text-anchor="middle" font-size="13" fill="#111111">links fixed</text>
  <text x="80" y="370" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Year 1</text>
  <text x="480" y="370" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Year 2</text>
  <rect x="160" y="400" width="640" height="70" rx="8" fill="#FFFFFF" stroke="#555555" stroke-width="1.2"/>
  <rect x="180" y="416" width="20" height="20" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <text x="208" y="432" text-anchor="start" font-size="14" fill="#111111">MAJOR: destination or route</text>
  <rect x="430" y="418" width="16" height="16" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" transform="rotate(45 438 426)"/>
  <text x="456" y="432" text-anchor="start" font-size="14" fill="#111111">MINOR: stage added or moved</text>
  <circle cx="190" cy="452" r="7" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <text x="208" y="457" text-anchor="start" font-size="14" fill="#111111">PATCH: resource or wording fixed</text>
</svg>