<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>An original roadmap, its forks and contributions flowing back</title>
  <desc>A central horizontal line is the original shared roadmap, released in successive versions. Two forks branch off: one for a team using a different cloud platform, one for a learner targeting a specialism. Dashed arrows show improvements from the forks contributed back to the original, and an update from the original being pulled into the first fork.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
  </defs>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Forks adapt a roadmap; contributions improve the original</text>
  <line x1="60" y1="240" x2="900" y2="240" stroke="#1F3B5C" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="66" y="222" width="68" height="36" rx="18" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="100" y="246" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">1.0</text>
  <rect x="296" y="222" width="68" height="36" rx="18" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="330" y="246" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">1.1</text>
  <rect x="526" y="222" width="68" height="36" rx="18" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="560" y="246" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">1.2</text>
  <rect x="756" y="222" width="68" height="36" rx="18" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="790" y="246" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">2.0</text>
  <text x="60" y="284" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">ORIGINAL shared roadmap</text>
  <path d="M150 230 C 200 140, 240 120, 300 120 L 860 120" fill="none" stroke="#7A5200" stroke-width="4" stroke-dasharray="10 6"/>
  <text x="520" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">FORK A: a team on a different cloud platform</text>
  <path d="M380 250 C 430 340, 470 360, 530 360 L 860 360" fill="none" stroke="#1E5E24" stroke-width="4" stroke-dasharray="2 5"/>
  <text x="690" y="392" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">FORK B: a learner targeting a specialism</text>
  <path d="M470 126 C 500 170, 520 200, 548 220" fill="none" stroke="#222222" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="440" y="172" text-anchor="end" font-size="13" fill="#111111">contribution</text>
  <text x="440" y="190" text-anchor="end" font-size="13" fill="#111111">back</text>
  <path d="M700 354 C 730 310, 760 280, 778 262" fill="none" stroke="#222222" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="760" y="318" text-anchor="start" font-size="13" fill="#111111">contribution</text>
  <text x="760" y="336" text-anchor="start" font-size="13" fill="#111111">back</text>
  <path d="M800 222 C 810 190, 820 160, 830 128" fill="none" stroke="#222222" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="846" y="182" text-anchor="start" font-size="13" fill="#111111">update</text>
  <text x="846" y="200" text-anchor="start" font-size="13" fill="#111111">pulled in</text>
  <text x="936" y="460" text-anchor="end" font-size="13" fill="#333333">Each fork records its source, licence and changes.</text>
</svg>