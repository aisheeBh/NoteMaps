<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The anatomy of a learning roadmap</title>
  <desc>A route runs from the learner's starting point on the left to a destination on the right, across a map of the field's skills. Four milestones mark evidence of progress. Resources support each stage, time runs along the bottom, and a review loop feeds results back into the route.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
    <marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F3B5C"/></marker>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">A roadmap: a route across a map, gated by evidence</text>

  <!-- skill map background -->
  <rect x="150" y="70" width="660" height="290" rx="14" fill="#F7F7F7" stroke="#666666" stroke-width="1.2" stroke-dasharray="2 4"/>
  <text x="166" y="94" font-size="15" font-weight="bold" fill="#333333">SKILL MAP: the field's components and their links</text>
  <g fill="#FFFFFF" stroke="#666666" stroke-width="1.2" stroke-dasharray="2 4">
    <circle cx="250" cy="140" r="14"/><circle cx="360" cy="320" r="14"/><circle cx="470" cy="130" r="14"/>
    <circle cx="560" cy="320" r="14"/><circle cx="690" cy="130" r="14"/><circle cx="760" cy="320" r="14"/>
  </g>
  <g stroke="#999999" stroke-width="1" stroke-dasharray="2 4">
    <line x1="250" y1="140" x2="470" y2="130"/><line x1="360" y1="320" x2="560" y2="320"/>
    <line x1="470" y1="130" x2="690" y2="130"/><line x1="560" y1="320" x2="760" y2="320"/>
  </g>

  <!-- start -->
  <circle cx="90" cy="225" r="48" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
  <rect x="44" y="208" width="92" height="36" fill="#FFFFFF" stroke="none"/>
  <text x="90" y="224" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">STARTING</text>
  <text x="90" y="241" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">POINT</text>

  <!-- destination -->
  <rect x="816" y="170" width="132" height="110" rx="10" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="822" y="196" width="120" height="58" fill="#FFFFFF" stroke="none"/>
  <text x="882" y="216" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">DESTINATION</text>
  <text x="882" y="234" text-anchor="middle" font-size="14" fill="#111111">target</text>
  <text x="882" y="250" text-anchor="middle" font-size="14" fill="#111111">capability</text>

  <!-- route -->
  <path d="M138 225 C 220 225, 230 200, 300 200 S 400 260, 470 250 S 580 190, 640 200 S 760 240, 812 226" fill="none" stroke="#1F3B5C" stroke-width="5" marker-end="url(#arrowr)"/>
  <text x="545" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F3B5C">ROUTE (sequence)</text>

  <!-- milestones -->
  <g font-size="14" fill="#111111" text-anchor="middle">
    <rect x="288" y="188" width="24" height="24" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" transform="rotate(45 300 200)"/>
    <text x="300" y="236" font-weight="bold">M1</text>
    <rect x="458" y="238" width="24" height="24" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" transform="rotate(45 470 250)"/>
    <text x="470" y="286" font-weight="bold">M2</text>
    <rect x="628" y="188" width="24" height="24" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" transform="rotate(45 640 200)"/>
    <text x="640" y="236" font-weight="bold">M3</text>
    <rect x="748" y="220" width="24" height="24" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" transform="rotate(45 760 232)"/>
    <text x="760" y="268" font-weight="bold">M4</text>
  </g>
  <rect x="560" y="76" width="240" height="24" fill="#F7F7F7" stroke="none"/>
  <text x="790" y="94" text-anchor="end" font-size="14" fill="#111111">Diamonds: milestones of evidence</text>

  <!-- resources -->
  <rect x="150" y="380" width="660" height="44" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="480" y="408" text-anchor="middle" font-size="15" fill="#111111"><tspan font-weight="bold">RESOURCES</tspan> for each stage: sources, practice settings, people</text>

  <!-- time axis -->
  <line x1="150" y1="452" x2="810" y2="452" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="474" text-anchor="middle" font-size="15" fill="#111111"><tspan font-weight="bold">TIME</tspan>: estimated as a range, not a single date</text>

  <!-- review loop -->
  <path d="M760 486 C 640 506, 320 506, 200 486" fill="none" stroke="#222222" stroke-width="2" stroke-dasharray="10 6" marker-end="url(#arrow)"/>
  
  <text x="480" y="536" text-anchor="middle" font-size="15" fill="#111111"><tspan font-weight="bold">REVIEW</tspan>: milestone results reshape the route</text>
</svg>
