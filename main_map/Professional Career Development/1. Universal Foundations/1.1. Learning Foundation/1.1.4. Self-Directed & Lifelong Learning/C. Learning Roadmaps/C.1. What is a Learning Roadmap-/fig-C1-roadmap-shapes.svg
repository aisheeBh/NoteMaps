<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Five common shapes of a learning roadmap</title>
  <desc>Five small diagrams: a linear path of stages; a branching tree with a common trunk and three specialisms; a dependency network with many links; a spiral revisiting one theme at rising depth; and a layered timeline with parallel tracks for study, work, credentials and people.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Five shapes of learning roadmap</text>

  <!-- panel frames -->
  <g fill="#FFFFFF" stroke="#555555" stroke-width="1.2">
    <rect x="24" y="56" width="292" height="260" rx="10"/>
    <rect x="334" y="56" width="292" height="260" rx="10"/>
    <rect x="644" y="56" width="292" height="260" rx="10"/>
    <rect x="24" y="336" width="440" height="280" rx="10"/>
    <rect x="496" y="336" width="440" height="280" rx="10"/>
  </g>

  <!-- 1 linear -->
  <text x="170" y="84" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">1. Linear path</text>
  <g fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2">
    <rect x="44" y="160" width="52" height="40" rx="6"/><rect x="116" y="160" width="52" height="40" rx="6"/>
    <rect x="188" y="160" width="52" height="40" rx="6"/>
  </g>
  <rect x="254" y="160" width="52" height="40" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <g stroke="#222222" stroke-width="2" marker-end="url(#arrow)">
    <line x1="96" y1="180" x2="114" y2="180"/><line x1="168" y1="180" x2="186" y2="180"/><line x1="240" y1="180" x2="252" y2="180"/>
  </g>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="70" y="185">A</text><text x="142" y="185">B</text><text x="214" y="185">C</text><text x="280" y="185">Goal</text>
    <text x="170" y="270">One ordered sequence;</text><text x="170" y="290">chain-like dependencies</text>
  </g>

  <!-- 2 tree -->
  <text x="480" y="84" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">2. Branching tree</text>
  <rect x="440" y="214" width="80" height="34" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <text x="480" y="236" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">Trunk</text>
  <g stroke="#222222" stroke-width="2" marker-end="url(#arrow)" fill="none">
    <path d="M470 214 L 390 150"/><path d="M480 214 L 480 150"/><path d="M490 214 L 570 150"/>
  </g>
  <g fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2">
    <rect x="352" y="112" width="76" height="34" rx="6"/><rect x="442" y="112" width="76" height="34" rx="6"/><rect x="532" y="112" width="76" height="34" rx="6"/>
  </g>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="390" y="134">Spec. 1</text><text x="480" y="134">Spec. 2</text><text x="570" y="134">Spec. 3</text>
    <text x="480" y="276">Shared foundation,</text><text x="480" y="296">then specialisms</text>
  </g>

  <!-- 3 network -->
  <text x="790" y="84" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">3. Dependency network</text>
  <g stroke="#222222" stroke-width="1.6" marker-end="url(#arrow)">
    <line x1="688" y1="128" x2="760" y2="168"/><line x1="688" y1="214" x2="760" y2="178"/>
    <line x1="780" y1="118" x2="784" y2="156"/><line x1="800" y1="178" x2="866" y2="140"/>
    <line x1="800" y1="182" x2="866" y2="214"/><line x1="688" y1="128" x2="760" y2="118"/>
    <line x1="884" y1="148" x2="886" y2="200"/>
  </g>
  <g fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2">
    <circle cx="676" cy="124" r="14"/><circle cx="676" cy="218" r="14"/><circle cx="776" cy="112" r="14"/>
    <circle cx="784" cy="176" r="16"/><circle cx="882" cy="134" r="14"/>
  </g>
  <circle cx="888" cy="218" r="16" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="790" y="276">Many-to-many links;</text><text x="790" y="296">several valid orders</text>
  </g>

  <!-- 4 spiral -->
  <text x="244" y="366" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">4. Spiral</text>
  <path d="M244 480 m 0 -12 a 12 12 0 1 1 -1 0 M244 480 m 0 -32 a 32 32 0 1 1 -1 0 M244 480 m 0 -56 a 56 56 0 1 1 -1 0 M244 480 m 0 -82 a 82 82 0 1 1 -1 0" fill="none" stroke="#1F3B5C" stroke-width="2"/>
  <g fill="#FFE6A8" stroke="#7A5200" stroke-width="2">
    <circle cx="244" cy="468" r="6"/><circle cx="244" cy="448" r="6"/><circle cx="244" cy="424" r="6"/><circle cx="244" cy="398" r="6"/>
  </g>
  <g font-size="14" fill="#111111">
    <text x="340" y="420">Same theme,</text><text x="340" y="440">revisited</text><text x="340" y="460">at rising depth</text>
    <text x="60" y="420">Pass 4</text><text x="60" y="474">Pass 1</text>
  </g>
  <g stroke="#222222" stroke-width="1" stroke-dasharray="2 4">
    <line x1="110" y1="416" x2="236" y2="398"/><line x1="110" y1="470" x2="236" y2="468"/>
  </g>
  <text x="244" y="596" text-anchor="middle" font-size="14" fill="#111111">Early usefulness, deepening understanding</text>

  <!-- 5 layered timeline -->
  <text x="716" y="366" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">5. Layered timeline</text>
  <g font-size="14" fill="#111111" font-weight="bold">
    <text x="512" y="407">Study</text><text x="512" y="451">Work</text><text x="512" y="495">Credential</text><text x="512" y="539">People</text>
  </g>
  <g stroke="#BBBBBB" stroke-width="1">
    <line x1="600" y1="380" x2="600" y2="556"/><line x1="680" y1="380" x2="680" y2="556"/><line x1="760" y1="380" x2="760" y2="556"/><line x1="840" y1="380" x2="840" y2="556"/>
  </g>
  <rect x="604" y="392" width="150" height="22" rx="4" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="1.5"/>
  <rect x="764" y="392" width="150" height="22" rx="4" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="1.5"/>
  <rect x="684" y="436" width="230" height="22" rx="4" fill="#D3ECD3" stroke="#1E5E24" stroke-width="2"/>
  <rect x="764" y="480" width="70" height="22" rx="4" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="604" y="524" width="310" height="22" rx="4" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <g stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="740" y1="414" x2="740" y2="434"/><line x1="800" y1="458" x2="800" y2="478"/>
  </g>
  <line x1="600" y1="572" x2="916" y2="572" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="758" y="596" text-anchor="middle" font-size="14" fill="#111111">Time: parallel tracks, linked across</text>
</svg>
