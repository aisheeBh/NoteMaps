<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The spectrum from prescribed to self-designed roadmaps</title>
  <desc>A horizontal spectrum. At the left, fully prescribed routes such as medical training and apprenticeships; then prescribed frames personalised by the learner, such as professional examinations with chosen experience; in the centre, co-designed routes built with a mentor from a community or role roadmap; then light self-designed roadmaps for experts extending their field; at the right, fully self-designed routes into open, fast-changing fields. Above the line, the advantages at each end; below, the risks.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
  </defs>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">From prescribed to self-designed</text>
  <polygon points="60,208 900,208 930,230 900,252 60,252 30,230" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
  <circle cx="85" cy="230" r="12" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <text x="85" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Fully</text>
  <text x="85" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">prescribed</text>
  <text x="85" y="282" text-anchor="middle" font-size="13" fill="#111111">medical training,</text>
  <text x="85" y="300" text-anchor="middle" font-size="13" fill="#111111">apprenticeship</text>
  <circle cx="287" cy="230" r="12" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <text x="287" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Prescribed frame,</text>
  <text x="287" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">personalised</text>
  <text x="287" y="282" text-anchor="middle" font-size="13" fill="#111111">examinations plus</text>
  <text x="287" y="300" text-anchor="middle" font-size="13" fill="#111111">chosen experience</text>
  <circle cx="480" cy="230" r="12" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <text x="480" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Co-designed</text>
  <text x="480" y="282" text-anchor="middle" font-size="13" fill="#111111">community route plus</text>
  <text x="480" y="300" text-anchor="middle" font-size="13" fill="#111111">mentor review</text>
  <circle cx="673" cy="230" r="12" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <text x="673" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Light</text>
  <text x="673" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">self-designed</text>
  <text x="673" y="282" text-anchor="middle" font-size="13" fill="#111111">expert extending</text>
  <text x="673" y="300" text-anchor="middle" font-size="13" fill="#111111">own field</text>
  <circle cx="875" cy="230" r="12" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <text x="875" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Fully</text>
  <text x="875" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">self-designed</text>
  <text x="875" y="282" text-anchor="middle" font-size="13" fill="#111111">open, fast-changing</text>
  <text x="875" y="300" text-anchor="middle" font-size="13" fill="#111111">fields</text>
  <rect x="40" y="360" width="400" height="80" rx="8" fill="#FFFFFF" stroke="#555555" stroke-width="1.2"/>
  <text x="56" y="384" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">Prescribed end</text>
  <text x="56" y="406" text-anchor="start" font-size="14" fill="#111111">Strength: expertise, standards, safety</text>
  <text x="56" y="428" text-anchor="start" font-size="14" fill="#111111">Risk: poor fit, slow to change, vested interests</text>
  <rect x="520" y="360" width="400" height="80" rx="8" fill="#FFFFFF" stroke="#555555" stroke-width="1.2"/>
  <text x="536" y="384" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">Self-designed end</text>
  <text x="536" y="406" text-anchor="start" font-size="14" fill="#111111">Strength: fit, ownership, speed of adaptation</text>
  <text x="536" y="428" text-anchor="start" font-size="14" fill="#111111">Risk: wrong map, missing tacit knowledge</text>
</svg>