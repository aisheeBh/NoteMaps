<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Whole-task sequencing with task classes and fading support</title>
  <desc>Three task classes rise in complexity from left to right. Each contains three whole tasks. Within each class, the share of the task supported by worked examples or guidance falls from most of the task, to about half, to none, before the next, more complex class begins with high support again.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
  </defs>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Whole tasks of rising complexity, with support fading in each class</text>
  <line x1="110" y1="450" x2="930" y2="450" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="110" y1="450" x2="110" y2="80" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="70" y="270" text-anchor="middle" font-size="15" fill="#111111" transform="rotate(-90 70 270)">Task complexity</text>
  <rect x="130" y="320" width="64" height="130" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
  <rect x="130" y="346" width="64" height="104" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="162.0" y="470" text-anchor="middle" font-size="13" fill="#111111">Worked</text>
  <rect x="206" y="320" width="64" height="130" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
  <rect x="206" y="392" width="64" height="58" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="238.0" y="470" text-anchor="middle" font-size="13" fill="#111111">Completion</text>
  <rect x="282" y="320" width="64" height="130" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
  <text x="314.0" y="470" text-anchor="middle" font-size="13" fill="#111111">Unaided</text>
  <rect x="158.0" y="268" width="160" height="40" fill="#FFFFFF" stroke="none"/>
  <text x="238.0" y="286" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Task class 1</text>
  <text x="238.0" y="304" text-anchor="middle" font-size="14" fill="#111111">simple whole task</text>
  <line x1="130" y1="482" x2="346" y2="482" stroke="#555555" stroke-width="1.5"/>
  <rect x="398" y="240" width="64" height="210" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
  <rect x="398" y="282" width="64" height="168" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="430.0" y="470" text-anchor="middle" font-size="13" fill="#111111">Worked</text>
  <rect x="474" y="240" width="64" height="210" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
  <rect x="474" y="356" width="64" height="94" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="506.0" y="470" text-anchor="middle" font-size="13" fill="#111111">Completion</text>
  <rect x="550" y="240" width="64" height="210" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
  <text x="582.0" y="470" text-anchor="middle" font-size="13" fill="#111111">Unaided</text>
  <rect x="426.0" y="188" width="160" height="40" fill="#FFFFFF" stroke="none"/>
  <text x="506.0" y="206" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Task class 2</text>
  <text x="506.0" y="224" text-anchor="middle" font-size="14" fill="#111111">more complex</text>
  <line x1="398" y1="482" x2="614" y2="482" stroke="#555555" stroke-width="1.5"/>
  <rect x="666" y="150" width="64" height="300" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
  <rect x="666" y="210" width="64" height="240" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="698.0" y="470" text-anchor="middle" font-size="13" fill="#111111">Worked</text>
  <rect x="742" y="150" width="64" height="300" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
  <rect x="742" y="315" width="64" height="135" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="774.0" y="470" text-anchor="middle" font-size="13" fill="#111111">Completion</text>
  <rect x="818" y="150" width="64" height="300" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
  <text x="850.0" y="470" text-anchor="middle" font-size="13" fill="#111111">Unaided</text>
  <rect x="694.0" y="98" width="160" height="40" fill="#FFFFFF" stroke="none"/>
  <text x="774.0" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Task class 3</text>
  <text x="774.0" y="134" text-anchor="middle" font-size="14" fill="#111111">close to real work</text>
  <line x1="666" y1="482" x2="882" y2="482" stroke="#555555" stroke-width="1.5"/>
  <text x="520" y="510" text-anchor="middle" font-size="15" fill="#111111">Sequence of practice over time</text>
  <rect x="200" y="540" width="36" height="22" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="246" y="556" font-size="14" fill="#111111">part of the task supported (examples, guidance)</text>
  <rect x="610" y="540" width="36" height="22" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
  <text x="656" y="556" font-size="14" fill="#111111">part done by the learner</text>
</svg>