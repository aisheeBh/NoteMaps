<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Formal, non-formal and informal learning across the life span</title>
<desc>Schematic bands showing how the relative weight of formal, non-formal and informal learning changes from childhood to old age.</desc>
<defs>
  <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
  </pattern>
  <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
    <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
  </pattern>
  <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
    <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
  </pattern>
  <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
    <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
  </pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#222222"/>
  </marker>
</defs>
<text x="480" y="40" font-size="22" fill="#111111" text-anchor="middle" font-weight="bold">Learning across the life span: three settings</text>
<polygon points="252.3,148.0 267.2,120.0 364.0,116.0 393.8,126.0 423.6,140.0 490.6,144.0 602.2,145.0 713.9,147.0 825.6,148.0 900.0,149.0 900.0,151.0 825.6,152.0 713.9,153.0 602.2,155.0 490.6,156.0 423.6,160.0 393.8,174.0 364.0,184.0 267.2,180.0 252.3,152.0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
<text x="36" y="150" font-size="18" fill="#111111" text-anchor="start" font-weight="bold">Formal</text>
<text x="36" y="172" font-size="14" fill="#111111" text-anchor="start" font-weight="normal">degree, diploma</text>
<polygon points="252.3,286.0 304.4,282.0 378.9,276.0 416.1,268.0 527.8,264.0 639.4,266.0 713.9,276.0 788.3,280.0 900.0,284.0 900.0,296.0 788.3,300.0 713.9,304.0 639.4,314.0 527.8,316.0 416.1,312.0 378.9,304.0 304.4,298.0 252.3,294.0" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
<text x="36" y="290" font-size="18" fill="#111111" text-anchor="start" font-weight="bold">Non-formal</text>
<text x="36" y="312" font-size="14" fill="#111111" text-anchor="start" font-weight="normal">courses, workshops</text>
<polygon points="230.0,400.0 304.4,396.0 416.1,392.0 565.0,390.0 713.9,392.0 825.6,396.0 900.0,400.0 900.0,460.0 825.6,464.0 713.9,468.0 565.0,470.0 416.1,468.0 304.4,464.0 230.0,460.0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
<text x="36" y="430" font-size="18" fill="#111111" text-anchor="start" font-weight="bold">Informal</text>
<text x="36" y="452" font-size="14" fill="#111111" text-anchor="start" font-weight="normal">work, life, leisure</text>
<rect x="468.22222222222223" y="100" width="230" height="24" fill="#FFFFFF" stroke="#333333" stroke-width="1"/><text x="476.22222222222223" y="117" font-size="14" fill="#111111" text-anchor="start" font-weight="normal">thin after initial education</text>
<rect x="646.8888888888889" y="232" width="180" height="24" fill="#FFFFFF" stroke="#333333" stroke-width="1"/><text x="654.8888888888889" y="249" font-size="14" fill="#111111" text-anchor="start" font-weight="normal">peaks in working life</text>
<rect x="453.33333333333337" y="418" width="200" height="24" fill="#FFFFFF" stroke="#333333" stroke-width="1"/><text x="461.33333333333337" y="435" font-size="14" fill="#111111" text-anchor="start" font-weight="normal">continuous, from birth on</text>
<line x1="230" y1="490" x2="920" y2="490" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="230.0" y1="490" x2="230.0" y2="497" stroke="#222222" stroke-width="1.5"/><text x="230.0" y="515" font-size="14" fill="#111111" text-anchor="middle" font-weight="normal">0</text>
<line x1="378.8888888888889" y1="490" x2="378.8888888888889" y2="497" stroke="#222222" stroke-width="1.5"/><text x="378.8888888888889" y="515" font-size="14" fill="#111111" text-anchor="middle" font-weight="normal">20</text>
<line x1="527.7777777777778" y1="490" x2="527.7777777777778" y2="497" stroke="#222222" stroke-width="1.5"/><text x="527.7777777777778" y="515" font-size="14" fill="#111111" text-anchor="middle" font-weight="normal">40</text>
<line x1="676.6666666666667" y1="490" x2="676.6666666666667" y2="497" stroke="#222222" stroke-width="1.5"/><text x="676.6666666666667" y="515" font-size="14" fill="#111111" text-anchor="middle" font-weight="normal">60</text>
<line x1="825.5555555555555" y1="490" x2="825.5555555555555" y2="497" stroke="#222222" stroke-width="1.5"/><text x="825.5555555555555" y="515" font-size="14" fill="#111111" text-anchor="middle" font-weight="normal">80</text>
<text x="920" y="515" font-size="14" fill="#111111" text-anchor="end" font-weight="bold">age</text>
<text x="480" y="545" font-size="13" fill="#111111" text-anchor="middle" font-weight="normal">Schematic; band thickness shows relative weight, not plotted from a single dataset.</text>
</svg>
