<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The planning fallacy</title>
  <desc>A timeline from the start of a task. The best-case prediction comes first, then the typical prediction, then the worst-case prediction. Average actual completion lies beyond even the worst-case prediction. An outside-view estimate based on similar past cases lies close to actual completion.</desc>
  <defs>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Actual completion lands beyond even the worst case</text>

  <line x1="80" y1="300" x2="900" y2="300" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="80" y="330" font-size="15" fill="#111111">start</text>
  <text x="890" y="330" text-anchor="end" font-size="15" fill="#111111">time</text>

  <!-- inside view band -->
  <rect x="250" y="250" width="320" height="40" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="300" y="208" width="220" height="30" fill="#FFFFFF"/>
  <text x="410" y="229" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">INSIDE-VIEW PREDICTIONS</text>

  <!-- markers -->
  <line x1="260" y1="300" x2="260" y2="380" stroke="#222222" stroke-width="2"/>
  <text x="260" y="400" text-anchor="middle" font-size="15" fill="#111111">best case</text>
  <line x1="400" y1="300" x2="400" y2="380" stroke="#222222" stroke-width="2"/>
  <text x="400" y="400" text-anchor="middle" font-size="15" fill="#111111">typical prediction</text>
  <line x1="560" y1="300" x2="560" y2="380" stroke="#222222" stroke-width="2"/>
  <text x="560" y="400" text-anchor="middle" font-size="15" fill="#111111">worst case</text>

  <!-- actual -->
  <circle cx="700" cy="300" r="11" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <line x1="700" y1="312" x2="700" y2="380" stroke="#1F3B5C" stroke-width="3"/>
  <text x="700" y="400" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">average actual</text>
  <text x="700" y="420" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">completion</text>

  <!-- outside view -->
  <rect x="640" y="130" width="140" height="40" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="600" y="80" width="220" height="40" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1.5"/>
  <text x="710" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">OUTSIDE VIEW</text>
  <text x="710" y="114" text-anchor="middle" font-size="14" fill="#111111">similar past cases</text>
  <line x1="710" y1="172" x2="702" y2="284" stroke="#1E5E24" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M562 270 C 600 240, 650 240, 690 284" fill="none" stroke="#8B0000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="620" y="236" text-anchor="middle" font-size="14" fill="#111111">overrun</text>

  <text x="480" y="480" text-anchor="middle" font-size="13" fill="#333333">Schematic of the pattern reported by Buehler, Griffin and Ross (1994); positions are illustrative, not data.</text>
</svg>
