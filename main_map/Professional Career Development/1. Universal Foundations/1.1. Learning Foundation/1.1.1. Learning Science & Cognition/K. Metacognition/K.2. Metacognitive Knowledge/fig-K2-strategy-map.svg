<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>A personal strategy map</title>
  <desc>A grid with four kinds of learning goal as rows: fast recall of facts, understanding principles, performing under pressure, using a new tool. Columns give the matching strategy and the condition that justifies it. Each row links goal, strategy and reason.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Goal, then strategy, then the reason it fits</text>

  <text x="160" y="86" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">LEARNING GOAL</text>
  <text x="480" y="86" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">STRATEGY</text>
  <text x="800" y="86" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">CONDITION AND REASON</text>

  <!-- row 1 -->
  <rect x="40" y="104" width="240" height="96" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <text x="160" y="146" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Fast recall</text>
  <text x="160" y="170" text-anchor="middle" font-size="15" fill="#FFFFFF">of facts and terms</text>
  <rect x="360" y="104" width="240" height="96" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="480" y="146" text-anchor="middle" font-size="16" fill="#111111">Spaced self-testing</text>
  <text x="480" y="168" text-anchor="middle" font-size="16" fill="#111111">with flashcards</text>
  <rect x="680" y="104" width="240" height="96" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="800" y="140" text-anchor="middle" font-size="14" fill="#111111">needed for months;</text>
  <text x="800" y="160" text-anchor="middle" font-size="14" fill="#111111">retrieval strengthens</text>
  <text x="800" y="180" text-anchor="middle" font-size="14" fill="#111111">memory more than review</text>
  <line x1="282" y1="152" x2="356" y2="152" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="602" y1="152" x2="676" y2="152" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- row 2 -->
  <rect x="40" y="220" width="240" height="96" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <text x="160" y="262" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Understanding</text>
  <text x="160" y="286" text-anchor="middle" font-size="15" fill="#FFFFFF">principles and themes</text>
  <rect x="360" y="220" width="240" height="96" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="480" y="262" text-anchor="middle" font-size="16" fill="#111111">Explain from memory,</text>
  <text x="480" y="284" text-anchor="middle" font-size="16" fill="#111111">then compare</text>
  <rect x="680" y="220" width="240" height="96" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="800" y="256" text-anchor="middle" font-size="14" fill="#111111">gist matters more than</text>
  <text x="800" y="276" text-anchor="middle" font-size="14" fill="#111111">detail; generating an</text>
  <text x="800" y="296" text-anchor="middle" font-size="14" fill="#111111">explanation exposes gaps</text>
  <line x1="282" y1="268" x2="356" y2="268" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="602" y1="268" x2="676" y2="268" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- row 3 -->
  <rect x="40" y="336" width="240" height="96" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <text x="160" y="378" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Performing</text>
  <text x="160" y="402" text-anchor="middle" font-size="15" fill="#FFFFFF">under pressure</text>
  <rect x="360" y="336" width="240" height="96" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="480" y="378" text-anchor="middle" font-size="16" fill="#111111">Rehearse aloud with</text>
  <text x="480" y="400" text-anchor="middle" font-size="16" fill="#111111">interruptions</text>
  <rect x="680" y="336" width="240" height="96" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="800" y="372" text-anchor="middle" font-size="14" fill="#111111">practice conditions should</text>
  <text x="800" y="392" text-anchor="middle" font-size="14" fill="#111111">resemble the real ones;</text>
  <text x="800" y="412" text-anchor="middle" font-size="14" fill="#111111">questions test fluency</text>
  <line x1="282" y1="384" x2="356" y2="384" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="602" y1="384" x2="676" y2="384" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- row 4 -->
  <rect x="40" y="452" width="240" height="96" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <text x="160" y="494" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Using a new tool</text>
  <text x="160" y="518" text-anchor="middle" font-size="15" fill="#FFFFFF">on real work</text>
  <rect x="360" y="452" width="240" height="96" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="480" y="494" text-anchor="middle" font-size="16" fill="#111111">Small real task first,</text>
  <text x="480" y="516" text-anchor="middle" font-size="16" fill="#111111">documentation second</text>
  <rect x="680" y="452" width="240" height="96" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="800" y="488" text-anchor="middle" font-size="14" fill="#111111">watching demos breeds</text>
  <text x="800" y="508" text-anchor="middle" font-size="14" fill="#111111">over-confidence; doing</text>
  <text x="800" y="528" text-anchor="middle" font-size="14" fill="#111111">reveals real gaps</text>
  <line x1="282" y1="500" x2="356" y2="500" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="602" y1="500" x2="676" y2="500" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="480" y="584" text-anchor="middle" font-size="14" fill="#333333">Each entry should rest on evidence or a measured outcome, not on preference.</text>
</svg>
