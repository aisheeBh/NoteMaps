<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Two scales for judging effect sizes</title>
  <desc>A common effect-size axis from 0 to 1.0. Upper band: Cohen's laboratory benchmarks of 0.2 small, 0.5 medium, 0.8 large, with testing-versus-restudy meta-analyses near 0.5. Lower band: Kraft's education field benchmarks of under 0.05 small, 0.05 to 0.20 medium, 0.20 or more large, with the average large education trial near 0.06.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">The same number means different things in different settings</text>

  <!-- Upper band: Cohen -->
  <text x="100" y="92" font-size="18" font-weight="bold" fill="#111111">LABORATORY BENCHMARKS (Cohen, 1988)</text>
  <rect x="100" y="104" width="152" height="56" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <rect x="252" y="104" width="228" height="56" fill="url(#dots)" stroke="#7A5200" stroke-width="1.5"/>
  <rect x="480" y="104" width="228" height="56" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/>
  <rect x="708" y="104" width="152" height="56" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="122" y="120" width="108" height="24" fill="#FFFFFF"/>
  <text x="176" y="138" text-anchor="middle" font-size="15" fill="#111111">trivial</text>
  <rect x="306" y="120" width="120" height="24" fill="#FFFFFF"/>
  <text x="366" y="138" text-anchor="middle" font-size="15" fill="#111111">small (0.2+)</text>
  <rect x="530" y="120" width="128" height="24" fill="#FFFFFF"/>
  <text x="594" y="138" text-anchor="middle" font-size="15" fill="#111111">medium (0.5+)</text>
  <rect x="728" y="120" width="112" height="24" fill="#FFFFFF"/>
  <text x="784" y="138" text-anchor="middle" font-size="15" fill="#111111">large (0.8+)</text>

  <!-- marker upper -->
  <line x1="480" y1="160" x2="480" y2="200" stroke="#111111" stroke-width="2.5"/>
  <circle cx="480" cy="204" r="6" fill="#111111"/>
  <text x="496" y="210" font-size="15" fill="#111111">testing vs restudy meta-analyses: about 0.5</text>

  <!-- shared axis -->
  <line x1="100" y1="270" x2="880" y2="270" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <line x1="100" y1="262" x2="100" y2="278" stroke="#222222" stroke-width="2"/><text x="100" y="298">0</text>
    <line x1="252" y1="262" x2="252" y2="278" stroke="#222222" stroke-width="2"/><text x="252" y="298">0.2</text>
    <line x1="404" y1="262" x2="404" y2="278" stroke="#222222" stroke-width="2"/><text x="404" y="298">0.4</text>
    <line x1="556" y1="262" x2="556" y2="278" stroke="#222222" stroke-width="2"/><text x="556" y="298">0.6</text>
    <line x1="708" y1="262" x2="708" y2="278" stroke="#222222" stroke-width="2"/><text x="708" y="298">0.8</text>
    <line x1="860" y1="262" x2="860" y2="278" stroke="#222222" stroke-width="2"/><text x="860" y="298">1.0</text>
  </g>
  <text x="480" y="322" text-anchor="middle" font-size="15" fill="#111111">Effect size (standard deviations)</text>

  <!-- Lower band: Kraft -->
  <text x="100" y="368" font-size="18" font-weight="bold" fill="#111111">EDUCATION FIELD-TRIAL BENCHMARKS (Kraft, 2020)</text>
  <rect x="100" y="380" width="38" height="56" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <rect x="138" y="380" width="114" height="56" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/>
  <rect x="252" y="380" width="608" height="56" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="146" y="396" width="98" height="24" fill="#FFFFFF"/>
  <text x="195" y="414" text-anchor="middle" font-size="15" fill="#111111">medium</text>
  <rect x="456" y="396" width="200" height="24" fill="#FFFFFF"/>
  <text x="556" y="414" text-anchor="middle" font-size="15" fill="#111111">large (0.20 and above)</text>
  <text x="160" y="456" font-size="14" fill="#111111">small: below 0.05 (unshaded)</text>

  <!-- marker lower -->
  <line x1="146" y1="436" x2="146" y2="476" stroke="#111111" stroke-width="2.5"/>
  <circle cx="146" cy="480" r="6" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
  <text x="162" y="486" font-size="15" fill="#111111">average of large UK and US education trials: about 0.06</text>

  <text x="480" y="522" text-anchor="middle" font-size="13" fill="#333333">Benchmarks are rough conventions; importance also depends on cost, scale and outcome.</text>
</svg>
