<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Focused attention and open monitoring compared</title>
  <desc>Two schematic panels. The left panel shows attention held on the breath with a drift and return. The right panel shows awareness receiving sounds, thoughts, sensations, emotions and images without following them.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
<text x="40" y="60" font-size="22" text-anchor="start" font-weight="bold" fill="#111111">Two styles of mindfulness practice</text>
<rect x="60" y="100" width="380" height="330" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
<rect x="520" y="100" width="380" height="330" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
<text x="250" y="130" font-size="18" text-anchor="middle" font-weight="bold" fill="#111111">Focused attention</text>
<text x="710" y="130" font-size="18" text-anchor="middle" font-weight="bold" fill="#111111">Open monitoring</text>
<circle cx="230" cy="260" r="50" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
<text x="230" y="266" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">Breath</text>
<path d="M280 250 C 330 170, 390 190, 370 240 S 320 300, 280 275" fill="none" stroke="#111111" stroke-width="2.5" stroke-dasharray="6 5"/>
<text x="370" y="180" font-size="14" text-anchor="start" font-weight="normal" fill="#333333">drift</text>
<text x="250" y="370" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">Hold attention on one object.</text>
<text x="250" y="392" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">Notice the drift, then return.</text>
<circle cx="710" cy="250" r="50" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="3"/>
<text x="710" y="256" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Awareness</text>
<text x="710" y="160" font-size="16" text-anchor="middle" font-weight="normal" fill="#111111">sound</text>
<text x="830" y="230" font-size="16" text-anchor="middle" font-weight="normal" fill="#111111">thought</text>
<text x="830" y="330" font-size="16" text-anchor="middle" font-weight="normal" fill="#111111">sensation</text>
<text x="590" y="330" font-size="16" text-anchor="middle" font-weight="normal" fill="#111111">emotion</text>
<text x="590" y="230" font-size="16" text-anchor="middle" font-weight="normal" fill="#111111">image</text>
<text x="710" y="370" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">Notice whatever arises.</text>
<text x="710" y="392" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">Do not follow any of it.</text>
<text x="40" y="490" font-size="14" text-anchor="start" font-weight="normal" fill="#333333">Schematic of two practice styles; not a measured result.</text>
</svg>
