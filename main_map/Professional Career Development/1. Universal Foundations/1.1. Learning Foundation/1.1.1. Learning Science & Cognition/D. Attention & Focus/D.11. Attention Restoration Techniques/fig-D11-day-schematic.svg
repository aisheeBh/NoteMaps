<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Schematic attention across a working day with and without breaks</title>
  <desc>Schematic line chart over a working day from 08:00 to 18:00. A solid line with breaks at mid-morning, lunch and mid-afternoon stays higher than a dashed line without breaks.</desc>
