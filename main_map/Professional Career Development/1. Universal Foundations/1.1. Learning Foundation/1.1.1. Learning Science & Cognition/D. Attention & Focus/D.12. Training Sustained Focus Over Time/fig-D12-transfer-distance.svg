<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Transfer of training from the trained task to everyday work</title>
  <desc>Horizontal axis from the trained task to everyday work. A thick arrow for practice in the real task reaches everyday work. A dotted arrow for brain-training games stays near the trained task.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
<text x="40" y="60" font-size="22" text-anchor="start" font-weight="bold" fill="#111111">Where the gains from different training tend to land</text>
<line x1="120" y1="300" x2="840" y2="300" stroke="#333333" stroke-width="3"/>
<circle cx="120" cy="300" r="12" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
<text x="120" y="340" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">Trained task</text>
<circle cx="400" cy="300" r="12" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
<text x="400" y="340" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">Similar tasks</text>
<circle cx="800" cy="300" r="12" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
<text x="800" y="340" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">Everyday work</text>
<text x="260" y="375" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">near transfer</text>
<text x="600" y="375" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">far transfer</text>
<line x1="135" y1="215" x2="800" y2="215" stroke="#1E5E24" stroke-width="6" marker-end="url(#arrow)"/>
<text x="465" y="190" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">Practice in the real task carries over most</text>
<line x1="135" y1="415" x2="330" y2="415" stroke="#8B0000" stroke-width="4" stroke-dasharray="4 5" marker-end="url(#arrow)"/>
<text x="232" y="445" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">Brain-training game gains stay close</text>
<text x="40" y="505" font-size="14" text-anchor="start" font-weight="normal" fill="#333333">Schematic of where gains from different training tend to land; not measured values.</text>
</svg>
