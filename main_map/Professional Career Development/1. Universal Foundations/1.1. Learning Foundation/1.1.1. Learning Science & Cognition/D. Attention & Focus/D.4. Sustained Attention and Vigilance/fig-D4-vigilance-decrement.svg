<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>Schematic vigilance decrement: detection falls with time on task</title>
  <desc>A schematic curve shows the proportion of signals detected falling steeply in the first part of a watch and more gradually afterwards. Schematic, not plotted data.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="480" y="52" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">The vigilance decrement</text>
  <text x="480" y="80" text-anchor="middle" font-size="15" fill="#111111">Schematic; the shape is typical of many monitoring studies, not a single dataset.</text>
  <text transform="translate(100 280) rotate(-90)" text-anchor="middle" font-size="15" fill="#111111">Proportion of signals detected (schematic)</text>
  <text x="480" y="500" text-anchor="middle" font-size="15" fill="#111111">Time on task (schematic minutes)</text>
  <line x1="160" y1="440" x2="800" y2="440" stroke="#222222" stroke-width="2"/>
  <line x1="160" y1="120" x2="160" y2="440" stroke="#222222" stroke-width="2"/>
  <line x1="160" y1="200" x2="800" y2="200" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 5"/>
  <line x1="160" y1="280" x2="800" y2="280" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 5"/>
  <line x1="160" y1="360" x2="800" y2="360" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 5"/>
  <text x="150" y="445" text-anchor="end" font-size="14" fill="#111111">0</text>
  <text x="150" y="365" text-anchor="end" font-size="14" fill="#111111">25</text>
  <text x="150" y="285" text-anchor="end" font-size="14" fill="#111111">50</text>
  <text x="150" y="205" text-anchor="end" font-size="14" fill="#111111">75</text>
  <text x="150" y="125" text-anchor="end" font-size="14" fill="#111111">100</text>
  <text x="160" y="462" text-anchor="middle" font-size="14" fill="#111111">0</text>
  <text x="320" y="462" text-anchor="middle" font-size="14" fill="#111111">30</text>
  <text x="480" y="462" text-anchor="middle" font-size="14" fill="#111111">60</text>
  <text x="640" y="462" text-anchor="middle" font-size="14" fill="#111111">90</text>
  <text x="800" y="462" text-anchor="middle" font-size="14" fill="#111111">120</text>
  <path d="M160 136 Q 240 200 320 200 T 480 229 T 640 248 T 800 261" fill="none" stroke="#111111" stroke-width="3.5"/>
  <text x="190" y="318" font-size="15" font-weight="bold" fill="#111111">Steepest fall early</text>
  <text x="190" y="338" font-size="14" fill="#111111">in the first half hour</text>
  <text x="560" y="332" font-size="15" font-weight="bold" fill="#111111">Gradual decline</text>
  <text x="560" y="352" font-size="14" fill="#111111">continues afterwards</text>
  <text x="480" y="522" text-anchor="middle" font-size="13" fill="#111111">Schematic; the values are illustrative and do not reproduce any study's numbers.</text>
</svg>
