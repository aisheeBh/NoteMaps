<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>Schematic time course of two kinds of attentional cue</title>
  <desc>Two schematic curves show how a brief peripheral cue and a central symbolic cue change the benefit to responses over time after the cue. The peripheral cue peaks early and fades; the central cue builds more slowly and is sustained. Schematic, not plotted data.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="480" y="56" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Two kinds of cue, two time courses</text>
  <text x="480" y="84" text-anchor="middle" font-size="15" fill="#111111">Schematic; the curves show the general pattern described in the text, not measured data.</text>
  <text transform="translate(92 290) rotate(-90)" text-anchor="middle" font-size="15" fill="#111111">Benefit to responses (schematic units)</text>
  <text x="480.0" y="500" text-anchor="middle" font-size="15" fill="#111111">Time after the cue (schematic milliseconds)</text>
  <line x1="160" y1="440" x2="800.0" y2="440" stroke="#222222" stroke-width="2"/>
  <line x1="160" y1="140.0" x2="160" y2="440" stroke="#222222" stroke-width="2"/>
  <line x1="160.0" y1="440" x2="160.0" y2="446" stroke="#222222" stroke-width="1.5"/><text x="160.0" y="468" text-anchor="middle" font-size="14" fill="#111111">0</text><line x1="320.0" y1="440" x2="320.0" y2="446" stroke="#222222" stroke-width="1.5"/><text x="320.0" y="468" text-anchor="middle" font-size="14" fill="#111111">200</text><line x1="480.0" y1="440" x2="480.0" y2="446" stroke="#222222" stroke-width="1.5"/><text x="480.0" y="468" text-anchor="middle" font-size="14" fill="#111111">400</text><line x1="640.0" y1="440" x2="640.0" y2="446" stroke="#222222" stroke-width="1.5"/><text x="640.0" y="468" text-anchor="middle" font-size="14" fill="#111111">600</text><line x1="800.0" y1="440" x2="800.0" y2="446" stroke="#222222" stroke-width="1.5"/><text x="800.0" y="468" text-anchor="middle" font-size="14" fill="#111111">800</text>
  <line x1="154" y1="440.0" x2="160" y2="440.0" stroke="#222222" stroke-width="1.5"/><text x="148" y="445.0" text-anchor="end" font-size="14" fill="#111111">0</text><line x1="154" y1="380.0" x2="160" y2="380.0" stroke="#222222" stroke-width="1.5"/><text x="148" y="385.0" text-anchor="end" font-size="14" fill="#111111">20</text><line x1="154" y1="320.0" x2="160" y2="320.0" stroke="#222222" stroke-width="1.5"/><text x="148" y="325.0" text-anchor="end" font-size="14" fill="#111111">40</text><line x1="154" y1="260.0" x2="160" y2="260.0" stroke="#222222" stroke-width="1.5"/><text x="148" y="265.0" text-anchor="end" font-size="14" fill="#111111">60</text><line x1="154" y1="200.0" x2="160" y2="200.0" stroke="#222222" stroke-width="1.5"/><text x="148" y="205.0" text-anchor="end" font-size="14" fill="#111111">80</text><line x1="154" y1="140.0" x2="160" y2="140.0" stroke="#222222" stroke-width="1.5"/><text x="148" y="145.0" text-anchor="end" font-size="14" fill="#111111">100</text>
  <path d="M160.0 440.0 L176.0 348.0 L192.0 284.2 L208.0 242.2 L224.0 216.7 L240.0 203.7 L256.0 200.0 L272.0 203.0 L288.0 210.7 L304.0 221.6 L320.0 234.6 L336.0 248.8 L352.0 263.4 L368.0 278.1 L384.0 292.4 L400.0 306.1 L416.0 319.1 L432.0 331.3 L448.0 342.6 L464.0 352.9 L480.0 362.4 L496.0 371.0 L512.0 378.9 L528.0 385.9 L544.0 392.2 L560.0 397.9 L576.0 402.9 L592.0 407.4 L608.0 411.4 L624.0 414.9 L640.0 418.0 L656.0 420.8 L672.0 423.2 L688.0 425.3 L704.0 427.2 L720.0 428.9 L736.0 430.3 L752.0 431.6 L768.0 432.7 L784.0 433.6 L800.0 434.5" fill="none" stroke="#111111" stroke-width="3" stroke-dasharray="10 6"/>
  <path d="M160.0 440.0 L176.0 440.0 L192.0 440.0 L208.0 440.0 L224.0 440.0 L240.0 440.0 L256.0 440.0 L272.0 440.0 L288.0 440.0 L304.0 440.0 L320.0 440.0 L336.0 412.4 L352.0 389.0 L368.0 369.2 L384.0 352.4 L400.0 338.2 L416.0 326.2 L432.0 316.1 L448.0 307.4 L464.0 300.2 L480.0 294.0 L496.0 288.8 L512.0 284.4 L528.0 280.6 L544.0 277.5 L560.0 274.8 L576.0 272.5 L592.0 270.6 L608.0 269.0 L624.0 267.6 L640.0 266.4 L656.0 265.4 L672.0 264.6 L688.0 263.9 L704.0 263.3 L720.0 262.8 L736.0 262.4 L752.0 262.0 L768.0 261.7 L784.0 261.4 L800.0 261.2" fill="none" stroke="#111111" stroke-width="3" stroke-dasharray="none"/>
  <text x="330" y="170" font-size="16" font-weight="bold" fill="#111111">Peripheral flash</text>
  <text x="330" y="190" font-size="14" fill="#111111">brief, fast, automatic</text>
  <text x="576.0" y="238.0" font-size="16" font-weight="bold" fill="#111111">Central arrow</text>
  <text x="576.0" y="258.0" font-size="14" fill="#111111">builds more slowly, sustained</text>
  <text x="480" y="520" text-anchor="middle" font-size="14" fill="#111111">Schematic. Dashed line: stimulus-driven cue. Solid line: goal-directed cue. Not plotted from a single dataset.</text>
</svg>
