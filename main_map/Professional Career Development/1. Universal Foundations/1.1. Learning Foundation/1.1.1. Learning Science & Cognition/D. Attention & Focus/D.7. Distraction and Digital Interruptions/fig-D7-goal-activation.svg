<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Schematic of goal activation during an interruption</title>
  <desc>Schematic line chart. The original goal's activation falls during an interruption and rises again on return. The interrupting goal's activation rises during the interruption and falls afterwards.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
<text x="40" y="60" font-size="22" text-anchor="start" font-weight="bold" fill="#111111">Goal activation during an interruption</text>
<rect x="305.0" y="110" width="259.0" height="320" fill="#E6E6E6"/>
<text x="434.5" y="132" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">Interruption</text>
<line x1="120" y1="430" x2="860" y2="430" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="120" y1="430" x2="120" y2="110" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="50" y="270" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111" transform="rotate(-90 50 270)">Activation (schematic)</text>
<text x="490" y="470" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">Time (schematic)</text>
<polyline points="120.0,160.0 305.0,175.0 342.0,220.0 416.0,280.0 490.0,325.0 564.0,355.0 601.0,295.0 638.0,220.0 712.0,175.0 860.0,166.0" fill="none" stroke="#111111" stroke-width="3"/>
<polyline points="120.0,400.0 305.0,400.0 342.0,325.0 416.0,250.0 490.0,220.0 564.0,250.0 601.0,325.0 638.0,370.0 712.0,394.0 860.0,400.0" fill="none" stroke="#111111" stroke-width="3" stroke-dasharray="10 6"/>
<text x="140" y="140" font-size="16" text-anchor="start" font-weight="bold" fill="#111111">Original goal</text>
<text x="140" y="392" font-size="16" text-anchor="start" font-weight="bold" fill="#111111">Interrupting goal</text>
<text x="620" y="300" font-size="15" text-anchor="start" font-weight="normal" fill="#111111">Original goal rises again after return</text>
<line x1="600" y1="306" x2="682.4" y2="196.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="120" y="500" font-size="14" text-anchor="start" font-weight="normal" fill="#333333">Schematic; not plotted from a dataset.</text>
</svg>
