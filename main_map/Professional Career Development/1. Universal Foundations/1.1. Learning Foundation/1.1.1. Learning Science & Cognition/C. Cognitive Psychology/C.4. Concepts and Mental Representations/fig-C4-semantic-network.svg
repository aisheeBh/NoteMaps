<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Spreading activation through a semantic network</title>
  <desc>A network of concepts linked by labelled associations. Activation starts at the concept canary and spreads along its links to bird and to the property can sing. Thicker lines mark stronger associations; dashed highlighted lines show the spread of activation. Schematic illustration.</desc>

  <text x="480" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#111111">Activation spreads from canary to related concepts</text>

  <!-- links: strength by stroke width -->
  <line x1="420" y1="133" x2="340" y2="207" stroke="#222222" stroke-width="4"/>
  <line x1="540" y1="133" x2="620" y2="207" stroke="#222222" stroke-width="2"/>
  <line x1="560" y1="110" x2="730" y2="110" stroke="#222222" stroke-width="2"/>
  <line x1="300" y1="253" x2="200" y2="357" stroke="#222222" stroke-width="4"/>
  <line x1="230" y1="230" x2="160" y2="230" stroke="#222222" stroke-width="2"/>
  <line x1="370" y1="240" x2="410" y2="300" stroke="#222222" stroke-width="2"/>
  <line x1="200" y1="403" x2="265" y2="448" stroke="#222222" stroke-width="2" stroke-dasharray="2 4"/>
  <line x1="660" y1="253" x2="700" y2="328" stroke="#222222" stroke-width="2"/>

  <!-- activation spreading (highlighted, dashed) -->
  <line x1="200" y1="357" x2="300" y2="253" stroke="#7A5200" stroke-width="3" stroke-dasharray="8 4"/>
  <line x1="265" y1="448" x2="200" y2="403" stroke="#7A5200" stroke-width="3" stroke-dasharray="8 4"/>

  <!-- link labels -->
  <rect x="356" y="160" width="46" height="24" fill="#FFFFFF"/>
  <text x="380" y="178" text-anchor="middle" font-size="15" fill="#111111">is a</text>
  <rect x="592" y="160" width="46" height="24" fill="#FFFFFF"/>
  <text x="615" y="178" text-anchor="middle" font-size="15" fill="#111111">is a</text>
  <rect x="620" y="92" width="50" height="24" fill="#FFFFFF"/>
  <text x="645" y="110" text-anchor="middle" font-size="15" fill="#111111">has</text>
  <rect x="236" y="300" width="46" height="24" fill="#FFFFFF"/>
  <text x="259" y="318" text-anchor="middle" font-size="15" fill="#111111">is a</text>
  <rect x="150" y="200" width="56" height="24" fill="#FFFFFF"/>
  <text x="178" y="218" text-anchor="middle" font-size="15" fill="#111111">can</text>
  <rect x="386" y="258" width="46" height="24" fill="#FFFFFF"/>
  <text x="409" y="276" text-anchor="middle" font-size="15" fill="#111111">has</text>
  <rect x="220" y="420" width="56" height="24" fill="#FFFFFF"/>
  <text x="248" y="438" text-anchor="middle" font-size="15" fill="#111111">can</text>
  <rect x="676" y="282" width="46" height="24" fill="#FFFFFF"/>
  <text x="699" y="300" text-anchor="middle" font-size="15" fill="#111111">has</text>

  <!-- nodes -->
  <rect x="400" y="87" width="160" height="46" rx="8" fill="#F2F2F2" stroke="#222222" stroke-width="2"/>
  <text x="480" y="116" text-anchor="middle" font-size="18" font-weight="700" fill="#111111">animal</text>

  <rect x="230" y="207" width="140" height="46" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="300" y="236" text-anchor="middle" font-size="18" font-weight="700" fill="#111111">bird</text>

  <rect x="590" y="207" width="140" height="46" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="660" y="236" text-anchor="middle" font-size="18" fill="#111111">fish</text>

  <rect x="75" y="357" width="150" height="46" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="150" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">canary</text>

  <rect x="60" y="208" width="100" height="44" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="110" y="236" text-anchor="middle" font-size="16" fill="#111111">fly</text>

  <rect x="410" y="278" width="120" height="44" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="470" y="306" text-anchor="middle" font-size="16" fill="#111111">wings</text>

  <rect x="240" y="448" width="120" height="44" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="300" y="476" text-anchor="middle" font-size="16" fill="#111111">sing</text>

  <rect x="730" y="88" width="120" height="44" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="790" y="116" text-anchor="middle" font-size="16" fill="#111111">skin</text>

  <rect x="645" y="328" width="110" height="44" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="700" y="356" text-anchor="middle" font-size="16" fill="#111111">gills</text>

  <text x="40" y="520" font-size="14" fill="#111111">Schematic. Thicker line: stronger association. Dark node: currently activated. Dashed line: activation spreading.</text>
</svg>
