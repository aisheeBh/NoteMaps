<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Two codes of dual-coding theory and their referential connections</title>
  <desc>Two panels. The left panel is the verbal system, with word units for lighthouse, beacon, coast and sea organised by association. The right panel is the imagery system, with image parts such as tower, lamp, rocks and light beam organised by part and whole. Dashed double arrows show referential connections between the two systems. A concept node at the bottom draws on both. Schematic illustration.</desc>

  <text x="480" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#111111">Two codes for one concept</text>

  <!-- panels -->
  <rect x="60" y="90" width="360" height="350" rx="10" fill="#FAFAFA" stroke="#555555" stroke-width="2"/>
  <rect x="540" y="90" width="360" height="350" rx="10" fill="#FAFAFA" stroke="#555555" stroke-width="2"/>
  <text x="240" y="122" text-anchor="middle" font-size="19" font-weight="700" fill="#111111">Verbal system</text>
  <text x="240" y="146" text-anchor="middle" font-size="15" fill="#111111">units linked by association and hierarchy</text>
  <text x="720" y="122" text-anchor="middle" font-size="19" font-weight="700" fill="#111111">Imagery system</text>
  <text x="720" y="146" text-anchor="middle" font-size="15" fill="#111111">units linked by part and whole</text>

  <!-- referential connections -->
  <line x1="330" y1="212" x2="578" y2="212" stroke="#7A5200" stroke-width="2.5" stroke-dasharray="8 4" marker-end="url(#arrow)"/>
  <line x1="578" y1="236" x2="330" y2="236" stroke="#7A5200" stroke-width="2.5" stroke-dasharray="8 4" marker-end="url(#arrow)"/>
  <rect x="368" y="176" width="172" height="26" fill="#FFFFFF"/>
  <text x="454" y="195" text-anchor="middle" font-size="15" fill="#111111">referential connections</text>

  <!-- verbal units -->
  <rect x="150" y="190" width="180" height="44" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="240" y="218" text-anchor="middle" font-size="18" font-weight="700" fill="#111111">lighthouse</text>
  <rect x="90" y="280" width="120" height="42" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="150" y="307" text-anchor="middle" font-size="16" fill="#111111">beacon</text>
  <rect x="250" y="280" width="120" height="42" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="310" y="307" text-anchor="middle" font-size="16" fill="#111111">coast</text>
  <rect x="170" y="360" width="140" height="42" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="240" y="387" text-anchor="middle" font-size="16" fill="#111111">sea</text>
  <line x1="240" y1="234" x2="150" y2="280" stroke="#222222" stroke-width="1.5"/>
  <line x1="240" y1="234" x2="310" y2="280" stroke="#222222" stroke-width="1.5"/>
  <line x1="150" y1="322" x2="240" y2="360" stroke="#222222" stroke-width="1.5"/>
  <line x1="310" y1="322" x2="240" y2="360" stroke="#222222" stroke-width="1.5"/>

  <!-- image units -->
  <rect x="600" y="190" width="110" height="44" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="2"/>
  <text x="655" y="218" text-anchor="middle" font-size="18" font-weight="700" fill="#111111">tower</text>
  <rect x="740" y="190" width="110" height="44" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="795" y="218" text-anchor="middle" font-size="16" fill="#111111">lamp</text>
  <rect x="600" y="280" width="110" height="42" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="655" y="307" text-anchor="middle" font-size="16" fill="#111111">rocks</text>
  <rect x="740" y="280" width="110" height="42" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="795" y="307" text-anchor="middle" font-size="16" fill="#111111">light beam</text>
  <line x1="655" y1="234" x2="655" y2="280" stroke="#222222" stroke-width="1.5"/>
  <line x1="795" y1="234" x2="795" y2="280" stroke="#222222" stroke-width="1.5"/>

  <!-- concept node -->
  <rect x="380" y="458" width="200" height="50" rx="10" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="480" y="489" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Concept: lighthouse</text>
  <line x1="480" y1="458" x2="240" y2="442" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="458" x2="720" y2="442" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="40" y="528" font-size="14" fill="#111111">Schematic illustration of Paivio's two codes; not measured data.</text>
</svg>
