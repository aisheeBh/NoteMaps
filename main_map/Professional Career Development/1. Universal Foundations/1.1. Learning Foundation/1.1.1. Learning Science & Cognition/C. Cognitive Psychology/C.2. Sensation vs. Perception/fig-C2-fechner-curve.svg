<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Sensation as a logarithmic function of stimulus intensity</title>
  <desc>Schematic. Sensation rises steeply at low intensities and more slowly at high intensities, following a logarithmic curve. A dashed straight line shows a linear relation for contrast only. Schematic; not plotted from a single dataset.</desc>
  <text x="480" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#111111">Sensation grows with the logarithm of intensity</text>
  <line x1="130" y1="440" x2="880" y2="440" stroke="#222222" stroke-width="2"/>
  <line x1="130" y1="120" x2="130" y2="440" stroke="#222222" stroke-width="2"/>
