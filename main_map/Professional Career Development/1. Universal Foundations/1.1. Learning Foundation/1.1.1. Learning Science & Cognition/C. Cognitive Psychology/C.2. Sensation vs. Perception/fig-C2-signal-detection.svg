  <rect x="640" y="150" width="280" height="150" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <rect x="656" y="166" width="28" height="18" fill="url(#hatch)" stroke="#1F3B5C"/>
  <text x="694" y="181" font-size="15" fill="#111111">Hit: signal, reported</text>
  <rect x="656" y="196" width="28" height="18" fill="url(#dots)" stroke="#7A5200"/>
  <text x="694" y="211" font-size="15" fill="#111111">False alarm: noise, reported</text>
