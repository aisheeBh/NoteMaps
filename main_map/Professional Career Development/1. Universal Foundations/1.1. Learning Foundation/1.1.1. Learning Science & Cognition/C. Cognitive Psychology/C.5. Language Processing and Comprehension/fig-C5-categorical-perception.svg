<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Identification changes sharply along a speech continuum while discrimination peaks at the boundary</title>
  <desc>Schematic line chart over seven steps of a synthetic speech continuum. The solid line shows the proportion of sounds identified as belonging to one category, rising steeply between the middle steps. The dashed line shows discrimination of neighbouring steps, which peaks where the identification curve crosses its middle. Schematic; not plotted from a single dataset.</desc>

  <text x="480" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#111111">Identification jumps at a boundary; discrimination peaks there</text>

  <!-- axes -->
  <line x1="120" y1="440" x2="840" y2="440" stroke="#222222" stroke-width="2"/>
  <line x1="120" y1="140" x2="120" y2="440" stroke="#222222" stroke-width="2"/>
  <line x1="112" y1="440" x2="120" y2="440" stroke="#222222" stroke-width="2"/>
  <line x1="112" y1="290" x2="120" y2="290" stroke="#222222" stroke-width="2"/>
  <line x1="112" y1="140" x2="120" y2="140" stroke="#222222" stroke-width="2"/>
  <text x="102" y="446" text-anchor="end" font-size="15" fill="#111111">0</text>
  <text x="102" y="296" text-anchor="end" font-size="15" fill="#111111">0.5</text>
  <text x="102" y="146" text-anchor="end" font-size="15" fill="#111111">1</text>
  <text transform="rotate(-90)" x="-290" y="70" text-anchor="middle" font-size="16" fill="#111111">Proportion (schematic)</text>

  <g font-size="16" fill="#111111" text-anchor="middle">
    <text x="160" y="466">1</text>
    <text x="266.7" y="466">2</text>
    <text x="373.3" y="466">3</text>
    <text x="480" y="466">4</text>
    <text x="586.7" y="466">5</text>
    <text x="693.3" y="466">6</text>
    <text x="800" y="466">7</text>
  </g>
  <text x="480" y="500" text-anchor="middle" font-size="16" fill="#111111">Position along the synthetic continuum, from one sound to the other</text>

  <!-- identification: solid -->
  <polyline points="160,431 266.7,416 373.3,374 480,275 586.7,170 693.3,149 800,143" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <g fill="#1F3B5C">
    <circle cx="160" cy="431" r="6"/><circle cx="266.7" cy="416" r="6"/><circle cx="373.3" cy="374" r="6"/><circle cx="480" cy="275" r="6"/>
    <circle cx="586.7" cy="170" r="6"/><circle cx="693.3" cy="149" r="6"/><circle cx="800" cy="143" r="6"/>
  </g>

  <!-- discrimination: dashed -->
  <polyline points="160,410 266.7,386 373.3,275 480,230 586.7,320 693.3,392 800,410" fill="none" stroke="#111111" stroke-width="3" stroke-dasharray="10 6"/>
  <g fill="#FFFFFF" stroke="#111111" stroke-width="2">
    <circle cx="160" cy="410" r="6"/><circle cx="266.7" cy="386" r="6"/><circle cx="373.3" cy="275" r="6"/><circle cx="480" cy="230" r="6"/>
    <circle cx="586.7" cy="320" r="6"/><circle cx="693.3" cy="392" r="6"/><circle cx="800" cy="410" r="6"/>
  </g>

  <!-- legend -->
  <rect x="640" y="236" width="270" height="74" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <line x1="656" y1="256" x2="692" y2="256" stroke="#1F3B5C" stroke-width="4"/>
  <text x="704" y="262" font-size="15" fill="#111111">Identification: proportion</text>
  <text x="704" y="282" font-size="15" fill="#111111">in one category</text>
  <line x1="656" y1="296" x2="692" y2="296" stroke="#111111" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="704" y="301" font-size="15" fill="#111111">Discrimination of neighbours</text>

  <text x="40" y="528" font-size="14" fill="#111111">Schematic; not plotted from a single dataset.</text>
</svg>
