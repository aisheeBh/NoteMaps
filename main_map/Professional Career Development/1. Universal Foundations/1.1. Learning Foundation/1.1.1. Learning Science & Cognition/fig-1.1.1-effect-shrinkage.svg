<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Effects shrink from the laboratory to large-scale practice</title>
  <desc>Four bars of decreasing height show typical effect sizes for a small laboratory study, a larger laboratory replication, a researcher-led classroom trial and a large multi-site randomised trial with an independent test. Notes between bars name the reasons for shrinkage.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Effects shrink from the laboratory to large-scale practice</text>

  <!-- axis -->
  <line x1="90" y1="440" x2="920" y2="440" stroke="#222222" stroke-width="2"/>
  <line x1="90" y1="440" x2="90" y2="70" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="56" y="260" text-anchor="middle" font-size="15" fill="#111111" transform="rotate(-90 56 260)">Typical reported effect size</text>

  <!-- bars -->
  <rect x="120" y="100" width="150" height="340" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <rect x="330" y="190" width="150" height="250" fill="url(#hatch)" stroke="#222222" stroke-width="2"/>
  <rect x="540" y="290" width="150" height="150" fill="url(#dots)" stroke="#222222" stroke-width="2"/>
  <rect x="750" y="390" width="150" height="50"  fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>

  <!-- reasons between bars -->
  <g font-size="14" fill="#111111" text-anchor="middle">
    <rect x="274" y="104" width="152" height="62" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
    <text x="350" y="126">larger samples remove</text>
    <text x="350" y="144">lucky small-study</text>
    <text x="350" y="162">results</text>
    <rect x="484" y="200" width="152" height="62" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
    <text x="560" y="222">real materials; control</text>
    <text x="560" y="240">classes already use</text>
    <text x="560" y="258">good practice</text>
    <rect x="696" y="300" width="176" height="62" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
    <text x="784" y="322">ordinary delivery,</text>
    <text x="784" y="340">lower fidelity, independent</text>
    <text x="784" y="358">delayed tests</text>
  </g>

  <!-- bar labels -->
  <g text-anchor="middle" font-size="14" fill="#111111">
    <text x="195" y="464" font-weight="bold">Small laboratory</text>
    <text x="195" y="482">study, researcher-</text>
    <text x="195" y="500">made test</text>
    <text x="405" y="464" font-weight="bold">Larger laboratory</text>
    <text x="405" y="482">replication,</text>
    <text x="405" y="500">pre-registered</text>
    <text x="615" y="464" font-weight="bold">Classroom trial</text>
    <text x="615" y="482">led by the</text>
    <text x="615" y="500">researchers</text>
    <text x="825" y="464" font-weight="bold">Large multi-site</text>
    <text x="825" y="482">trial, independent</text>
    <text x="825" y="500">standardised test</text>
  </g>

  <text x="480" y="548" text-anchor="middle" font-size="13" fill="#333333">Schematic; not plotted from a single dataset. A robust effect usually survives every stage, but smaller.</text>
</svg>
