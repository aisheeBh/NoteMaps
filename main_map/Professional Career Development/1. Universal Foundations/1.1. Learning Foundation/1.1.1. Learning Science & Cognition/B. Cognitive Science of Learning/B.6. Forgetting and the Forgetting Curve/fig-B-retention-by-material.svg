<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Retention for arbitrary material and for meaningful, practised material</title>
  <desc>Schematic retention curves over time since learning. Arbitrary material falls steeply and then levels off at a low level. Meaningful material that has been used keeps a much higher level of retention over the same span. Schematic; not plotted from a single dataset.</desc>

  <text x="480" y="48" text-anchor="middle" font-size="24" font-weight="700" fill="#111111">Retention by kind of material</text>

  <line x1="110" y1="110" x2="110" y2="440" stroke="#111111" stroke-width="2"/>
  <line x1="110" y1="440" x2="860" y2="440" stroke="#111111" stroke-width="2"/>
  <text x="62" y="275" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 62 275)">Retention (schematic)</text>

  <text x="150" y="466" text-anchor="middle" font-size="16" fill="#111111">0</text>
  <text x="270" y="466" text-anchor="middle" font-size="16" fill="#111111">1</text>
  <text x="390" y="466" text-anchor="middle" font-size="16" fill="#111111">2</text>
  <text x="510" y="466" text-anchor="middle" font-size="16" fill="#111111">3</text>
  <text x="630" y="466" text-anchor="middle" font-size="16" fill="#111111">4</text>
  <text x="750" y="466" text-anchor="middle" font-size="16" fill="#111111">5</text>
  <text x="485" y="496" text-anchor="middle" font-size="16" fill="#111111">Time since learning (schematic units)</text>

  <!-- arbitrary: dashed -->
  <path d="M150 140 L270 305 L390 356 L510 380 L630 395 L750 404" fill="none" stroke="#111111" stroke-width="2.5" stroke-dasharray="10 6"/>
  <g fill="#FFFFFF" stroke="#111111" stroke-width="2">
    <circle cx="150" cy="140" r="5"/><circle cx="270" cy="305" r="5"/><circle cx="390" cy="356" r="5"/>
    <circle cx="510" cy="380" r="5"/><circle cx="630" cy="395" r="5"/><circle cx="750" cy="404" r="5"/>
  </g>

  <!-- meaningful and used: solid, heavier -->
  <path d="M150 140 L270 200 L390 224 L510 236 L630 245 L750 251" fill="none" stroke="#111111" stroke-width="4"/>
  <g fill="#111111">
    <circle cx="150" cy="140" r="6"/><circle cx="270" cy="200" r="6"/><circle cx="390" cy="224" r="6"/>
    <circle cx="510" cy="236" r="6"/><circle cx="630" cy="245" r="6"/><circle cx="750" cy="251" r="6"/>
  </g>

  <text x="600" y="430" font-size="16" fill="#111111">Arbitrary material</text>
  <text x="560" y="214" font-size="16" fill="#111111">Meaningful and used</text>

  <text x="480" y="512" text-anchor="middle" font-size="14" fill="#111111">Schematic; not plotted from a single dataset.</text>
</svg>
