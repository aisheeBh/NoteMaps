<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Fluid and crystallised abilities across adulthood</title>
  <desc>Two schematic curves across ages 20 to 80. Fluid ability, dashed, is highest in early adulthood and declines steadily. Crystallised ability, solid, rises through adulthood and levels off in later life. Schematic; shows the general direction of change, not plotted data.</desc>

  <text x="480" y="48" text-anchor="middle" font-size="24" font-weight="700" fill="#111111">Two abilities across adulthood (schematic)</text>

  <line x1="110" y1="110" x2="110" y2="440" stroke="#111111" stroke-width="2"/>
  <line x1="110" y1="440" x2="870" y2="440" stroke="#111111" stroke-width="2"/>
  <text x="62" y="275" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 62 275)">Level of ability (schematic)</text>

  <text x="140" y="466" text-anchor="middle" font-size="16" fill="#111111">20</text>
  <text x="257" y="466" text-anchor="middle" font-size="16" fill="#111111">30</text>
  <text x="373" y="466" text-anchor="middle" font-size="16" fill="#111111">40</text>
  <text x="490" y="466" text-anchor="middle" font-size="16" fill="#111111">50</text>
  <text x="607" y="466" text-anchor="middle" font-size="16" fill="#111111">60</text>
  <text x="723" y="466" text-anchor="middle" font-size="16" fill="#111111">70</text>
  <text x="840" y="466" text-anchor="middle" font-size="16" fill="#111111">80</text>
  <text x="490" y="496" text-anchor="middle" font-size="16" fill="#111111">Age in years (schematic)</text>

  <!-- fluid: dashed -->
  <path d="M140 140 L257 164 L373 200 L490 236 L607 272 L723 305 L840 332" fill="none" stroke="#111111" stroke-width="2.5" stroke-dasharray="10 6"/>
  <g fill="#FFFFFF" stroke="#111111" stroke-width="2">
    <circle cx="140" cy="140" r="5"/><circle cx="257" cy="164" r="5"/><circle cx="373" cy="200" r="5"/>
    <circle cx="490" cy="236" r="5"/><circle cx="607" cy="272" r="5"/><circle cx="723" cy="305" r="5"/><circle cx="840" cy="332" r="5"/>
  </g>

  <!-- crystallised: solid -->
  <path d="M140 305 L257 254 L373 218 L490 194 L607 182 L723 179 L840 182" fill="none" stroke="#111111" stroke-width="4"/>
  <g fill="#111111">
    <circle cx="140" cy="305" r="6"/><circle cx="257" cy="254" r="6"/><circle cx="373" cy="218" r="6"/>
    <circle cx="490" cy="194" r="6"/><circle cx="607" cy="182" r="6"/><circle cx="723" cy="179" r="6"/><circle cx="840" cy="182" r="6"/>
  </g>

  <text x="500" y="330" font-size="16" fill="#111111">Fluid ability (novel reasoning)</text>
  <text x="620" y="160" font-size="16" fill="#111111">Crystallised ability (knowledge)</text>

  <text x="480" y="512" text-anchor="middle" font-size="14" fill="#111111">Schematic; shows the general direction reported in the research, not plotted data.</text>
</svg>
