<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Stimulus-response account compared with an account that has internal stages</title>
  <desc>Left: a stimulus enters a black box whose internal states are not examined, and a response leaves it. Right: the same stimulus passes through named internal stages (attention, representation, retrieval, decision) before a response.</desc>

  <text x="480" y="48" text-anchor="middle" font-size="24" font-weight="700" fill="#111111">Two accounts of the same behaviour</text>

  <text x="300" y="92" text-anchor="middle" font-size="20" font-weight="700" fill="#111111">A. Stimulus-response account</text>
  <text x="700" y="92" text-anchor="middle" font-size="20" font-weight="700" fill="#111111">B. Account with internal stages</text>

  <line x1="480" y1="110" x2="480" y2="470" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- Left panel -->
  <rect x="180" y="110" width="240" height="40" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="300" y="136" text-anchor="middle" font-size="16" fill="#111111">Stimulus</text>
  <line x1="300" y1="150" x2="300" y2="172" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="180" y="172" width="240" height="236" fill="#E6E6E6" stroke="#666666" stroke-width="2" stroke-dasharray="2 4"/>
  <text x="300" y="262" text-anchor="middle" font-size="18" font-weight="700" fill="#111111">Black box</text>
  <text x="300" y="292" text-anchor="middle" font-size="16" fill="#111111">Internal processes</text>
  <text x="300" y="314" text-anchor="middle" font-size="16" fill="#111111">are not examined</text>
  <text x="300" y="360" text-anchor="middle" font-size="15" fill="#111111">Only input and output</text>
  <text x="300" y="380" text-anchor="middle" font-size="15" fill="#111111">are recorded</text>

  <line x1="300" y1="408" x2="300" y2="420" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="180" y="420" width="240" height="40" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="300" y="446" text-anchor="middle" font-size="16" fill="#111111">Response</text>

  <!-- Right panel -->
  <rect x="580" y="110" width="240" height="40" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="700" y="136" text-anchor="middle" font-size="16" fill="#111111">Stimulus</text>

  <line x1="700" y1="150" x2="700" y2="172" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="580" y="172" width="240" height="40" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="700" y="198" text-anchor="middle" font-size="16" fill="#111111">Attention selects input</text>

  <line x1="700" y1="212" x2="700" y2="234" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="580" y="234" width="240" height="40" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="700" y="260" text-anchor="middle" font-size="16" fill="#111111">Representation is built</text>

  <line x1="700" y1="274" x2="700" y2="296" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="580" y="296" width="240" height="40" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="700" y="322" text-anchor="middle" font-size="16" fill="#111111">Stored knowledge retrieved</text>

  <line x1="700" y1="336" x2="700" y2="358" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="580" y="358" width="240" height="40" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="700" y="384" text-anchor="middle" font-size="16" fill="#111111">Decision is made</text>

  <line x1="700" y1="398" x2="700" y2="420" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="580" y="420" width="240" height="40" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="700" y="446" text-anchor="middle" font-size="16" fill="#111111">Response</text>

  <text x="480" y="496" text-anchor="middle" font-size="14" fill="#111111">Schematic; not drawn from a single dataset.</text>
</svg>
