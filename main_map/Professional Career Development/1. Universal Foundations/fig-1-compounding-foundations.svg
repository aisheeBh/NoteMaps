  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>How strong foundations compound across career transitions</title>
  <desc>Two capability curves over a thirty-year career with four transitions. The professional with strong foundations dips less at each transition, recovers faster and ends far higher than the one with weak foundations.</desc>
