  <text x="264" y="440" text-anchor="middle" font-size="14" fill="#111111">new role</text>
  <line x1="418" y1="420" x2="418" y2="100" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="418" y="440" text-anchor="middle" font-size="14" fill="#111111">new platform</text>
  <line x1="572" y1="420" x2="572" y2="100" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="572" y="440" text-anchor="middle" font-size="14" fill="#111111">into management</text>
  <line x1="726" y1="420" x2="726" y2="100" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="726" y="440" text-anchor="middle" font-size="14" fill="#111111">new industry</text>
