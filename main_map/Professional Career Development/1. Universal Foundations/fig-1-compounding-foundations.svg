  <line x1="110" y1="420" x2="110" y2="70" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="66" y="255" text-anchor="middle" font-size="15" fill="#111111" transform="rotate(-90 66 255)">Usable capability</text>
  <text x="495" y="462" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Years of career</text>
