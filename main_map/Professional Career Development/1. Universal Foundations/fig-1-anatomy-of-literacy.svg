<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The five layers of any literacy</title>
  <desc>A staircase of five steps rising from vocabulary and concepts, through interpretation, critical evaluation and appropriate action, to boundary judgement, with an example under each step.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">The five layers of any literacy</text>

  <!-- steps -->
  <rect x="40"  y="410" width="170" height="100" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <rect x="216" y="330" width="170" height="180" fill="url(#hatch)" stroke="#222222" stroke-width="2"/>
  <rect x="392" y="250" width="170" height="260" fill="url(#dots)" stroke="#222222" stroke-width="2"/>
  <rect x="568" y="170" width="170" height="340" fill="url(#cross)" stroke="#222222" stroke-width="2"/>
  <rect x="744" y="90"  width="170" height="420" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>

  <!-- labels on white backing -->
  <g text-anchor="middle" fill="#111111">
    <rect x="48" y="418" width="154" height="70" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
    <text x="125" y="442" font-size="15" font-weight="bold">1 VOCABULARY</text>
    <text x="125" y="462" font-size="14">knows what the</text>
    <text x="125" y="479" font-size="14">terms mean</text>

    <rect x="224" y="338" width="154" height="70" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1.5"/>
    <text x="301" y="362" font-size="15" font-weight="bold">2 INTERPRETATION</text>
    <text x="301" y="382" font-size="14">reads the domain's</text>
    <text x="301" y="399" font-size="14">artefacts correctly</text>

    <rect x="400" y="258" width="154" height="70" fill="#FFFFFF" stroke="#7A5200" stroke-width="1.5"/>
    <text x="477" y="282" font-size="15" font-weight="bold">3 EVALUATION</text>
    <text x="477" y="302" font-size="14">judges whether</text>
    <text x="477" y="319" font-size="14">it is sound</text>

    <rect x="576" y="178" width="154" height="70" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1.5"/>
    <text x="653" y="202" font-size="15" font-weight="bold">4 ACTION</text>
    <text x="653" y="222" font-size="14">does something</text>
    <text x="653" y="239" font-size="14">sensible with it</text>
  </g>
  <g text-anchor="middle" fill="#FFFFFF">
    <text x="829" y="122" font-size="15" font-weight="bold">5 BOUNDARY</text>
    <text x="829" y="141" font-size="15" font-weight="bold">JUDGEMENT</text>
    <text x="829" y="163" font-size="14">knows when a</text>
    <text x="829" y="180" font-size="14">specialist is needed</text>
  </g>

  <!-- rising arrow -->
  <line x1="60" y1="380" x2="700" y2="100" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="150" y="262" width="250" height="26" fill="#FFFFFF"/>
  <text x="275" y="281" text-anchor="middle" font-size="15" font-style="italic" fill="#111111">growing independence</text>

  <!-- examples -->
  <g text-anchor="middle" fill="#111111" font-size="14">
    <text x="125" y="535">e.g. revenue versus</text>
    <text x="125" y="553">profit</text>
    <text x="301" y="535">e.g. reads a</text>
    <text x="301" y="553">balance sheet</text>
    <text x="477" y="535">e.g. spots a</text>
    <text x="477" y="553">truncated axis</text>
    <text x="653" y="535">e.g. revises the</text>
    <text x="653" y="553">budget</text>
    <text x="829" y="535">e.g. calls in a</text>
    <text x="829" y="553">lawyer</text>
  </g>
  <text x="480" y="588" text-anchor="middle" font-size="13" fill="#333333">Each layer depends on those below it; the same five layers apply to data, digital, financial, legal and AI literacy.</text>
</svg>
