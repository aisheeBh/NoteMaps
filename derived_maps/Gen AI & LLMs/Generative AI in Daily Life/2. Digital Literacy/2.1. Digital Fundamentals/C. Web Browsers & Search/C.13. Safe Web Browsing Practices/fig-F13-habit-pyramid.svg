<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Habit pyramid</title>
  <desc>A pyramid of safe browsing habits. Foundation: updates and restart, password manager, passkeys. Middle: navigate rather than follow links, read the domain, official downloads only. Upper: refuse unexplained commands, remote access and notifications, keep extensions few. Top: report and ask.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Safe browsing habits, from the foundation up</text>
  <rect x="330.0" y="80.0" width="300.0" height="80.0" rx="4" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="480.0" y="127.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Report and ask when in doubt</text>
  <rect x="220.0" y="175.0" width="520.0" height="80.0" rx="4" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="270.0" y="201" width="420.0" height="30" fill="#FFFFFF"/>
  <text x="480.0" y="222.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Refuse commands, remote access, notifications</text>
  <rect x="130.0" y="270.0" width="700.0" height="80.0" rx="4" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="208.4" y="296" width="543.2" height="30" fill="#FFFFFF"/>
  <text x="480.0" y="317.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Navigate, don't follow; read the domain; official downloads</text>
  <rect x="50.0" y="365.0" width="860.0" height="80.0" rx="4" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="480.0" y="412.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Updates and restart; password manager; passkeys</text>
  <text x="480.0" y="480.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Foundation habits remove the most risk for the least effort</text>
  <text x="480.0" y="520.0" text-anchor="middle" font-size="13" fill="#333333">Keep extensions few and trusted alongside these habits.</text>
</svg>
