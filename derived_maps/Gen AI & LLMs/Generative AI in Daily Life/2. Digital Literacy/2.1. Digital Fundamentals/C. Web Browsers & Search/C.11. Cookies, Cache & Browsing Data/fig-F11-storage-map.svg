<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Browser storage compared</title>
  <desc>A grid comparing six kinds of browser storage: cookies, session storage, local storage, IndexedDB, Cache Storage and the HTTP cache, by lifetime, typical size and whether the data are sent to the server automatically.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Kinds of browser storage compared</text>
  <rect x="40.0" y="70.0" width="220.0" height="44.0" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="150.0" y="96.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Storage</text>
  <rect x="260.0" y="70.0" width="260.0" height="44.0" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="390.0" y="96.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Lifetime</text>
  <rect x="520.0" y="70.0" width="200.0" height="44.0" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="620.0" y="96.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Typical size</text>
  <rect x="720.0" y="70.0" width="200.0" height="44.0" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="820.0" y="96.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Sent to server?</text>
  <rect x="40.0" y="120.0" width="220.0" height="58.0" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="111.5" y="136.5" width="76.9" height="25.5" fill="#FFFFFF"/>
  <text x="150.0" y="153.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Cookies</text>
  <rect x="260.0" y="120.0" width="260.0" height="58.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="390.0" y="153.2" text-anchor="middle" font-size="14" fill="#000000">session or set expiry</text>
  <rect x="520.0" y="120.0" width="200.0" height="58.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="620.0" y="153.2" text-anchor="middle" font-size="14" fill="#000000">about 4 KB each</text>
  <rect x="720.0" y="120.0" width="200.0" height="58.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="820.0" y="153.2" text-anchor="middle" font-size="14" fill="#000000">yes, every request</text>
  <rect x="40.0" y="184.0" width="220.0" height="58.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="150.0" y="217.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Session storage</text>
  <rect x="260.0" y="184.0" width="260.0" height="58.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="390.0" y="217.2" text-anchor="middle" font-size="14" fill="#000000">until the tab closes</text>
  <rect x="520.0" y="184.0" width="200.0" height="58.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="620.0" y="217.2" text-anchor="middle" font-size="14" fill="#000000">a few MB</text>
  <rect x="720.0" y="184.0" width="200.0" height="58.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="820.0" y="217.2" text-anchor="middle" font-size="14" fill="#000000">no</text>
  <rect x="40.0" y="248.0" width="220.0" height="58.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="150.0" y="281.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Local storage</text>
  <rect x="260.0" y="248.0" width="260.0" height="58.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="390.0" y="281.2" text-anchor="middle" font-size="14" fill="#000000">until cleared</text>
  <rect x="520.0" y="248.0" width="200.0" height="58.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="620.0" y="281.2" text-anchor="middle" font-size="14" fill="#000000">a few MB</text>
  <rect x="720.0" y="248.0" width="200.0" height="58.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="820.0" y="281.2" text-anchor="middle" font-size="14" fill="#000000">no</text>
  <rect x="40.0" y="312.0" width="220.0" height="58.0" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="102.8" y="328.5" width="94.3" height="25.5" fill="#FFFFFF"/>
  <text x="150.0" y="345.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">IndexedDB</text>
  <rect x="260.0" y="312.0" width="260.0" height="58.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="390.0" y="345.2" text-anchor="middle" font-size="14" fill="#000000">until cleared or evicted</text>
  <rect x="520.0" y="312.0" width="200.0" height="58.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="620.0" y="345.2" text-anchor="middle" font-size="14" fill="#000000">large share of disk</text>
  <rect x="720.0" y="312.0" width="200.0" height="58.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="820.0" y="345.2" text-anchor="middle" font-size="14" fill="#000000">no</text>
  <rect x="40.0" y="376.0" width="220.0" height="58.0" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="85.5" y="392.5" width="129.1" height="25.5" fill="#FFFFFF"/>
  <text x="150.0" y="409.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Cache Storage</text>
  <rect x="260.0" y="376.0" width="260.0" height="58.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="390.0" y="409.2" text-anchor="middle" font-size="14" fill="#000000">controlled by the site</text>
  <rect x="520.0" y="376.0" width="200.0" height="58.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="620.0" y="409.2" text-anchor="middle" font-size="14" fill="#000000">large share of disk</text>
  <rect x="720.0" y="376.0" width="200.0" height="58.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="820.0" y="409.2" text-anchor="middle" font-size="14" fill="#000000">no</text>
  <rect x="40.0" y="440.0" width="220.0" height="58.0" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="98.5" y="456.5" width="103.0" height="25.5" fill="#FFFFFF"/>
  <text x="150.0" y="473.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">HTTP cache</text>
  <rect x="260.0" y="440.0" width="260.0" height="58.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="390.0" y="473.2" text-anchor="middle" font-size="14" fill="#000000">by Cache-Control rules</text>
  <rect x="520.0" y="440.0" width="200.0" height="58.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="620.0" y="473.2" text-anchor="middle" font-size="14" fill="#000000">managed by browser</text>
  <rect x="720.0" y="440.0" width="200.0" height="58.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="820.0" y="473.2" text-anchor="middle" font-size="14" fill="#000000">no, reused locally</text>
  <text x="480.0" y="540.0" text-anchor="middle" font-size="13" fill="#333333">Sizes are indicative; quotas vary by browser, device and available disk space.</text>
</svg>
