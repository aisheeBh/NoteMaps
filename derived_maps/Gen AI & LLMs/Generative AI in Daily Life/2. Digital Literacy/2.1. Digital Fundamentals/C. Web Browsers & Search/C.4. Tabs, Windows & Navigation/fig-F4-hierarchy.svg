<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Profile, window, tab and frame</title>
  <desc>Nested boxes: two profiles, Work and Personal, each with separate cookies; the Work profile holds two windows; one window holds tabs; one tab holds a page with an embedded payment frame from another site.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">From profile to window, tab and embedded frame</text>
  <rect x="40.0" y="70.0" width="600.0" height="430.0" rx="10" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="56" y="80" width="330" height="26" fill="#FFFFFF"/>
  <text x="60.0" y="99.0" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">Profile: Work (own cookies, history)</text>
  <rect x="70.0" y="120.0" width="540.0" height="300.0" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="90.0" y="144.0" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">Window 1</text>
  <rect x="95.0" y="160.0" width="250.0" height="240.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="110.0" y="184.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">Tab: supplier portal</text>
  <text x="110.0" y="206.0" text-anchor="start" font-size="14" fill="#111111">own Back/Forward list</text>
  <rect x="115.0" y="230.0" width="210.0" height="150.0" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="143.0" y="265.9" width="154.0" height="78.8" fill="#FFFFFF"/>
  <text x="220.0" y="281.9" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Embedded frame</text>
  <text x="220.0" y="300.1" text-anchor="middle" font-size="14" fill="#111111">payment form from</text>
  <text x="220.0" y="318.3" text-anchor="middle" font-size="14" fill="#111111">pay.example</text>
  <text x="220.0" y="336.5" text-anchor="middle" font-size="14" fill="#111111">(another site)</text>
  <rect x="365.0" y="160.0" width="225.0" height="100.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="477.5" y="204.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Tab: wiki</text>
  <text x="477.5" y="224.2" text-anchor="middle" font-size="15" fill="#000000">own history</text>
  <rect x="365.0" y="280.0" width="225.0" height="120.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="477.5" y="325.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Tab: email (pinned)</text>
  <text x="477.5" y="344.5" text-anchor="middle" font-size="15" fill="#000000">shares sign-ins</text>
  <text x="477.5" y="364.0" text-anchor="middle" font-size="15" fill="#000000">with Window 2</text>
  <rect x="70.0" y="435.0" width="540.0" height="50.0" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="340.0" y="464.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Window 2: same profile, same cookies</text>
  <rect x="680.0" y="70.0" width="240.0" height="430.0" rx="6" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="713.7" y="214.0" width="172.6" height="142.5" fill="#FFFFFF"/>
  <text x="800.0" y="231.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Profile: Personal</text>
  <text x="800.0" y="250.5" text-anchor="middle" font-size="15" fill="#111111">separate cookies,</text>
  <text x="800.0" y="270.0" text-anchor="middle" font-size="15" fill="#111111">history, passwords</text>
  <text x="800.0" y="289.5" text-anchor="middle" font-size="15" fill="#111111">and extensions</text>
  <text x="800.0" y="309.0" text-anchor="middle" font-size="15" fill="#111111"></text>
  <text x="800.0" y="328.5" text-anchor="middle" font-size="15" fill="#111111">nothing shared</text>
  <text x="800.0" y="348.0" text-anchor="middle" font-size="15" fill="#111111">with Work</text>
  <text x="480.0" y="535.0" text-anchor="middle" font-size="13" fill="#333333">Windows of one profile share an identity; separate profiles do not.</text>
</svg>
