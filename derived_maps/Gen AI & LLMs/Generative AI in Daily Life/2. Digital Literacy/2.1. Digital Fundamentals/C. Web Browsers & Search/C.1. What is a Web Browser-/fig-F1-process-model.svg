<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Multi-process browser model</title>
  <desc>A privileged browser process at the top communicates with a GPU process, a network process and three sandboxed renderer processes, one each for a bank site, a news site and an advertising frame.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">One privileged process, many sandboxed renderers</text>
  <rect x="250.0" y="70.0" width="460.0" height="90.0" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="480.0" y="109.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Browser process (privileged)</text>
  <text x="480.0" y="129.2" text-anchor="middle" font-size="15" fill="#FFFFFF">interface, storage, permissions, files</text>
  <rect x="60.0" y="210.0" width="220.0" height="70.0" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="170.0" y="239.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">GPU process</text>
  <text x="170.0" y="259.2" text-anchor="middle" font-size="15" fill="#000000">draws frames</text>
  <rect x="680.0" y="210.0" width="220.0" height="70.0" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="790.0" y="239.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Network process</text>
  <text x="790.0" y="259.2" text-anchor="middle" font-size="15" fill="#000000">all requests</text>
  <line x1="330.0" y1="160.0" x2="200.0" y2="208.0" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="630.0" y1="160.0" x2="780.0" y2="208.0" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="40.0" y="320.0" width="880.0" height="170.0" rx="8" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="330" y="466" width="300" height="22" fill="#FFFFFF"/>
  <text x="480.0" y="483.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Sandbox: restricted privileges</text>
  <rect x="70.0" y="370.0" width="250.0" height="90.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="195.0" y="409.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Renderer: bank.example</text>
  <text x="195.0" y="429.2" text-anchor="middle" font-size="15" fill="#000000">one site per process</text>
  <line x1="480.0" y1="160.0" x2="195.0" y2="368.0" stroke="#222222" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <rect x="355.0" y="370.0" width="250.0" height="90.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="480.0" y="409.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Renderer: news.example</text>
  <text x="480.0" y="429.2" text-anchor="middle" font-size="15" fill="#000000">page scripts run here</text>
  <line x1="480.0" y1="160.0" x2="480.0" y2="368.0" stroke="#222222" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <rect x="640.0" y="370.0" width="250.0" height="90.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="765.0" y="409.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Renderer: ads.example</text>
  <text x="765.0" y="429.2" text-anchor="middle" font-size="15" fill="#000000">embedded frame isolated</text>
  <line x1="480.0" y1="160.0" x2="765.0" y2="368.0" stroke="#222222" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="480.0" y="520.0" text-anchor="middle" font-size="13" fill="#333333">A compromised renderer must find a second flaw to escape the sandbox.</text>
</svg>
