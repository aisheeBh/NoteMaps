<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Boolean operators</title>
  <desc>Three pairs of overlapping circles labelled A and B. AND shades only the overlap; OR shades both circles entirely; A NOT B shades the part of A outside B.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">AND narrows, OR broadens, NOT excludes</text>
  <clipPath id="cA170"><circle cx="125" cy="210" r="80"/></clipPath>
  <circle cx="215" cy="210" r="80" fill="url(#hatch)" clip-path="url(#cA170)"/>
  <circle cx="125" cy="210" r="80" fill="none" stroke="#1F3B5C" stroke-width="2.5"/>
  <circle cx="215" cy="210" r="80" fill="none" stroke="#1F3B5C" stroke-width="2.5" stroke-dasharray="8 4"/>
  <rect x="72" y="194" width="26" height="24" fill="#FFFFFF"/>
  <text x="85.0" y="213.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">A</text>
  <rect x="242" y="194" width="26" height="24" fill="#FFFFFF"/>
  <text x="255.0" y="213.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">B</text>
  <text x="170.0" y="340.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">A AND B</text>
  <text x="170.0" y="366.0" text-anchor="middle" font-size="14" fill="#111111">both terms: fewer results</text>
  <clipPath id="cA480"><circle cx="435" cy="210" r="80"/></clipPath>
  <circle cx="435" cy="210" r="80" fill="url(#hatch)"/>
  <circle cx="525" cy="210" r="80" fill="url(#hatch)"/>
  <circle cx="435" cy="210" r="80" fill="none" stroke="#1F3B5C" stroke-width="2.5"/>
  <circle cx="525" cy="210" r="80" fill="none" stroke="#1F3B5C" stroke-width="2.5" stroke-dasharray="8 4"/>
  <rect x="382" y="194" width="26" height="24" fill="#FFFFFF"/>
  <text x="395.0" y="213.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">A</text>
  <rect x="552" y="194" width="26" height="24" fill="#FFFFFF"/>
  <text x="565.0" y="213.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">B</text>
  <text x="480.0" y="340.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">A OR B</text>
  <text x="480.0" y="366.0" text-anchor="middle" font-size="14" fill="#111111">either term: more results</text>
  <clipPath id="cA790"><circle cx="745" cy="210" r="80"/></clipPath>
  <circle cx="745" cy="210" r="80" fill="url(#hatch)"/>
  <circle cx="835" cy="210" r="80" fill="#FFFFFF"/>
  <circle cx="745" cy="210" r="80" fill="none" stroke="#1F3B5C" stroke-width="2.5"/>
  <circle cx="835" cy="210" r="80" fill="none" stroke="#1F3B5C" stroke-width="2.5" stroke-dasharray="8 4"/>
  <rect x="692" y="194" width="26" height="24" fill="#FFFFFF"/>
  <text x="705.0" y="213.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">A</text>
  <rect x="862" y="194" width="26" height="24" fill="#FFFFFF"/>
  <text x="875.0" y="213.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">B</text>
  <text x="790.0" y="340.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">A NOT B</text>
  <text x="790.0" y="366.0" text-anchor="middle" font-size="14" fill="#111111">A without B: use sparingly</text>
  <text x="480.0" y="420.0" text-anchor="middle" font-size="13" fill="#333333">Shaded area = documents returned.</text>
</svg>
