<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Query refinement funnel</title>
  <desc>Five stacked bars narrowing from top to bottom, one per query attempt in the worked example: natural-language question, keywords plus country, site restriction to the government domain, regulator site with file type, and date filter. The final bar is the authoritative guidance.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Each refinement narrows the search towards the authoritative source</text>
  <rect x="50.0" y="70.0" width="860.0" height="70.0" rx="4" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="480.0" y="100.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">1  Question as asked</text>
  <text x="480.0" y="122.0" text-anchor="middle" font-size="14" fill="#111111">millions of mixed pages</text>
  <rect x="130.0" y="160.0" width="700.0" height="70.0" rx="4" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="350.4" y="168" width="259.2" height="54" fill="#FFFFFF"/>
  <text x="480.0" y="190.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">2  Keywords + jurisdiction</text>
  <text x="480.0" y="212.0" text-anchor="middle" font-size="14" fill="#111111">still mostly commercial</text>
  <rect x="220.0" y="250.0" width="520.0" height="70.0" rx="4" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="382.6" y="258" width="194.8" height="54" fill="#FFFFFF"/>
  <text x="480.0" y="280.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">3  site:gov.uk</text>
  <text x="480.0" y="302.0" text-anchor="middle" font-size="14" fill="#111111">official pages only</text>
  <rect x="300.0" y="340.0" width="360.0" height="70.0" rx="4" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="322.8" y="348" width="314.4" height="54" fill="#FFFFFF"/>
  <text x="480.0" y="370.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">4  Regulator site + filetype:pdf</text>
  <text x="480.0" y="392.0" text-anchor="middle" font-size="14" fill="#111111">detailed guidance</text>
  <rect x="370.0" y="430.0" width="220.0" height="70.0" rx="4" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="480.0" y="460.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">5  Past two years</text>
  <text x="480.0" y="482.0" text-anchor="middle" font-size="14" fill="#111111">current version confirmed</text>
  <text x="480.0" y="535.0" text-anchor="middle" font-size="13" fill="#333333">Illustrative: result counts vary by engine and date; the narrowing pattern is what matters.</text>
</svg>
