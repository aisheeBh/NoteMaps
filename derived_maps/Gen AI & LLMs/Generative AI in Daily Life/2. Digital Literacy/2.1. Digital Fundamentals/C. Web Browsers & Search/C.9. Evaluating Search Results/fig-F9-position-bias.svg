<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Position bias</title>
  <desc>Schematic bar chart: the share of clicks falls steeply from the first organic result to the tenth, with the first result receiving many times the clicks of the fifth.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Clicks fall steeply with position (schematic)</text>
  <line x1="100.0" y1="400.0" x2="890.0" y2="400.0" stroke="#111111" stroke-width="2"/>
  <line x1="100.0" y1="400.0" x2="100.0" y2="80.0" stroke="#111111" stroke-width="2"/>
  <rect x="110.0" y="110.0" width="58.0" height="290.0" rx="2" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="139.0" y="422.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">1</text>
  <rect x="188.0" y="249.2" width="58.0" height="150.8" rx="2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="217.0" y="422.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">2</text>
  <rect x="266.0" y="301.4" width="58.0" height="98.6" rx="2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="295.0" y="422.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">3</text>
  <rect x="344.0" y="330.4" width="58.0" height="69.6" rx="2" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="373.0" y="422.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">4</text>
  <rect x="422.0" y="347.8" width="58.0" height="52.2" rx="2" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="451.0" y="422.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">5</text>
  <rect x="500.0" y="359.4" width="58.0" height="40.6" rx="2" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="529.0" y="422.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">6</text>
  <rect x="578.0" y="368.1" width="58.0" height="31.9" rx="2" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="607.0" y="422.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">7</text>
  <rect x="656.0" y="373.9" width="58.0" height="26.1" rx="2" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="685.0" y="422.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">8</text>
  <rect x="734.0" y="376.8" width="58.0" height="23.2" rx="2" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="763.0" y="422.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">9</text>
  <rect x="812.0" y="379.7" width="58.0" height="20.3" rx="2" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="841.0" y="422.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">10</text>
  <text x="490.0" y="448.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Position of organic result</text>
  <text x="60" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111" transform="rotate(-90 60 240)">Relative share of clicks</text>
  <text x="199.0" y="110.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">top result dominates</text>
  <text x="480.0" y="468.0" text-anchor="middle" font-size="13" fill="#333333">Schematic; not plotted from a single dataset. Studies agree on the steep decline, not on exact values.</text>
</svg>
