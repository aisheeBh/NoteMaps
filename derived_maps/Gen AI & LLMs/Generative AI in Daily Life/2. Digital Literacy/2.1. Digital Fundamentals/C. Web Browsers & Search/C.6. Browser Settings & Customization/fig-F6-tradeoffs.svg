<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Privacy and convenience of common settings</title>
  <desc>A two-axis chart. Horizontal axis: effect on privacy, from reduces to improves. Vertical axis: convenience cost, from none to high. Settings placed: Enhanced Safe Browsing reduces privacy slightly with no convenience cost; password manager improves security with a convenience gain; always-secure connections improve privacy at almost no cost; block third-party cookies improves privacy at a small cost; secure DNS improves privacy at small cost; clear cookies on exit improves privacy strongly at high cost; block all cookies improves privacy at very high cost.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Common settings: privacy gain against convenience cost</text>
  <rect x="140.0" y="70.0" width="760.0" height="400.0" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <line x1="406.0" y1="70.0" x2="406.0" y2="470.0" stroke="#333333" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="140.0" y1="500.0" x2="900.0" y2="500.0" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520.0" y="525.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Effect on privacy: reduces to strongly improves</text>
  <line x1="110.0" y1="470.0" x2="110.0" y2="70.0" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="95" y="270.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111" transform="rotate(-90 95 270.0)">Convenience cost: none to high</text>
  <rect x="146.0" y="404.0" width="198.4" height="50.0" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="154.3" y="409.5" width="181.9" height="39.8" fill="#FFFFFF"/>
  <text x="245.2" y="424.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">Enhanced Safe Browsing</text>
  <text x="245.2" y="441.4" text-anchor="middle" font-size="13" fill="#111111">more data to provider</text>
  <rect x="354.2" y="404.0" width="149.2" height="50.0" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="428.8" y="424.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Password manager</text>
  <text x="428.8" y="441.4" text-anchor="middle" font-size="13" fill="#000000">saves effort</text>
  <rect x="514.9" y="404.0" width="223.0" height="50.0" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="626.4" y="424.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Always secure connections</text>
  <text x="626.4" y="441.4" text-anchor="middle" font-size="13" fill="#000000">rare warnings</text>
  <rect x="474.4" y="308.0" width="121.6" height="50.0" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="535.2" y="328.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Secure DNS</text>
  <text x="535.2" y="345.4" text-anchor="middle" font-size="13" fill="#000000">rare conflicts</text>
  <rect x="606.1" y="276.0" width="223.0" height="50.0" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="717.6" y="296.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Block third-party cookies</text>
  <text x="717.6" y="313.4" text-anchor="middle" font-size="13" fill="#000000">some embeds break</text>
  <rect x="668.1" y="176.0" width="190.2" height="50.0" rx="6" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="763.2" y="196.4" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Clear cookies on exit</text>
  <text x="763.2" y="213.3" text-anchor="middle" font-size="13" fill="#000000">sign in daily</text>
  <rect x="736.6" y="84.0" width="157.4" height="50.0" rx="6" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="815.3" y="104.4" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Block all cookies</text>
  <text x="815.3" y="121.3" text-anchor="middle" font-size="13" fill="#000000">most sign-ins fail</text>
  <text x="480.0" y="565.0" text-anchor="middle" font-size="13" fill="#333333">Schematic placement for typical use; actual effects depend on browser, sites and configuration.</text>
</svg>
