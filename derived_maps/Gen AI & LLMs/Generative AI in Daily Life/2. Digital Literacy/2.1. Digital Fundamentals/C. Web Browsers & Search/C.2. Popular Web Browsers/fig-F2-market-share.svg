<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Browser market share June 2026</title>
  <desc>Horizontal bars of worldwide page-view share across all devices in June 2026: Chrome about 69.7 per cent, Safari about 15.3, Edge about 5.2, Firefox about 3.3, all others about 6.5.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Share of worldwide page views, all devices, June 2026</text>
  <text x="200.0" y="105.0" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Chrome</text>
  <rect x="210.0" y="80.0" width="557.6" height="40.0" rx="2" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="775.6" y="105.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">about 69.7%</text>
  <text x="200.0" y="163.0" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Safari</text>
  <rect x="210.0" y="138.0" width="122.4" height="40.0" rx="2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="340.4" y="163.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">about 15.3%</text>
  <text x="200.0" y="221.0" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Edge</text>
  <rect x="210.0" y="196.0" width="41.6" height="40.0" rx="2" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="259.6" y="221.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">about 5.2%</text>
  <text x="200.0" y="279.0" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Firefox</text>
  <rect x="210.0" y="254.0" width="26.4" height="40.0" rx="2" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="244.4" y="279.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">about 3.3%</text>
  <text x="200.0" y="337.0" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">All others</text>
  <rect x="210.0" y="312.0" width="52.0" height="40.0" rx="2" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="270.0" y="337.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">about 6.5%</text>
  <text x="480.0" y="395.0" text-anchor="middle" font-size="13" fill="#333333">Source: StatCounter page-view sample, June 2026. Others include Samsung Internet, Opera and smaller browsers.</text>
</svg>
