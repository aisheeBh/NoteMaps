<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Satellite orbits and delay</title>
  <desc>The Earth is shown at the bottom. Low-Earth-orbit satellites at a few hundred kilometres give round-trip delays of tens of milliseconds; geostationary satellites at about 36,000 kilometres add roughly half a second to a request and reply.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Altitude decides delay: LEO versus GEO</text>
  <path d="M40 500 Q480 420 920 500 L920 555 L40 555 Z" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="413.125" y="515" width="133.75" height="22" fill="#FFFFFF"/>
  <text x="480" y="530" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Earth's surface</text>
  <path d="M40 410 Q480 310 920 410" fill="none" stroke="#1F3B5C" stroke-width="2.5" stroke-dasharray="8 5"/>
  <path d="M40 110 Q480 50 920 110" fill="none" stroke="#7A5200" stroke-width="2.5"/>
  <rect x="208" y="369.4586776859504" width="24" height="16" fill="#1F3B5C" stroke="#000000" stroke-width="1.5"/>
  <rect x="348" y="355.7190082644628" width="24" height="16" fill="#1F3B5C" stroke="#000000" stroke-width="1.5"/>
  <rect x="488" y="352.10330578512395" width="24" height="16" fill="#1F3B5C" stroke="#000000" stroke-width="1.5"/>
  <rect x="628" y="358.61157024793386" width="24" height="16" fill="#1F3B5C" stroke="#000000" stroke-width="1.5"/>
  <rect x="768" y="375.24380165289256" width="24" height="16" fill="#1F3B5C" stroke="#000000" stroke-width="1.5"/>
  <rect x="466" y="70" width="28" height="20" fill="#FFE6A8" stroke="#7A5200" stroke-width="2"/>
  <text x="480" y="135" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">GEO satellite, about 36,000 km up</text>
  <text x="480" y="157" text-anchor="middle" font-size="15" fill="#111111">round trip for request and reply: roughly 0.5 seconds</text>
  <line x1="300" y1="468" x2="476" y2="94" stroke="#222222" stroke-width="1.8" stroke-dasharray="2 4" marker-end="url(#arrow)"/>
  <line x1="484" y1="94" x2="660" y2="468" stroke="#222222" stroke-width="1.8" stroke-dasharray="2 4" marker-end="url(#arrow)"/>
  <line x1="420" y1="460" x2="494" y2="372" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="506" y1="372" x2="580" y2="460" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="200" y="300" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">LEO constellation, a few hundred km up</text>
  <text x="770" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">LEO round trip:</text>
  <text x="770" y="320" text-anchor="middle" font-size="15" fill="#111111">tens of milliseconds</text>
  <text x="160" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Not to scale:</text>
  <text x="160" y="230" text-anchor="middle" font-size="14" fill="#111111">GEO is about 65 times</text>
  <text x="160" y="250" text-anchor="middle" font-size="14" fill="#111111">higher than typical LEO</text>
  <text x="480.0" y="585" text-anchor="middle" font-size="13" fill="#333333">Delays shown are propagation only; real connections add processing and ground-network delay.</text>
</svg>
