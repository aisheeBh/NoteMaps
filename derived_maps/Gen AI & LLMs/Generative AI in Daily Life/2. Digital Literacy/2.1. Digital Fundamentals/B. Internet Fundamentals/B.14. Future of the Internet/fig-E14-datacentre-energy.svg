<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Data-centre electricity</title>
  <desc>Two bars: about 415 terawatt-hours in 2024, roughly 1.5 percent of global electricity; and a central projection of about 945 terawatt-hours in 2030. A note says projections vary widely.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Data-centre electricity use (terawatt-hours per year)</text>
  <line x1="200" y1="420" x2="760" y2="420" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="420" x2="200" y2="100" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="188" y="425.0" text-anchor="end" font-size="14" fill="#111111">0</text>
  <text x="188" y="350.0" text-anchor="end" font-size="14" fill="#111111">250</text>
  <line x1="200" y1="345.0" x2="760" y2="345.0" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="188" y="275.0" text-anchor="end" font-size="14" fill="#111111">500</text>
  <line x1="200" y1="270.0" x2="760" y2="270.0" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="188" y="200.0" text-anchor="end" font-size="14" fill="#111111">750</text>
  <line x1="200" y1="195.0" x2="760" y2="195.0" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="188" y="125.0" text-anchor="end" font-size="14" fill="#111111">1000</text>
  <line x1="200" y1="120.0" x2="760" y2="120.0" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="120" y="270.0" text-anchor="middle" font-size="15" fill="#111111" transform="rotate(-90 120 270.0)">TWh per year</text>
  <rect x="280" y="295.5" width="140" height="124.5" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="307.875" y="268.5" width="84.25" height="22" fill="#FFFFFF"/>
  <text x="350" y="283.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">about 415</text>
  <text x="350" y="444" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">2024</text>
  <text x="350" y="464" text-anchor="middle" font-size="14" fill="#111111">estimate</text>
  <rect x="520" y="136.5" width="140" height="283.5" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="547.875" y="109.5" width="84.25" height="22" fill="#FFFFFF"/>
  <text x="590" y="124.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">about 945</text>
  <text x="590" y="444" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">2030</text>
  <text x="590" y="464" text-anchor="middle" font-size="14" fill="#111111">central projection</text>
  <text x="350" y="335.5" text-anchor="middle" font-size="1" fill="#111111"></text>
  <rect x="700" y="150" width="230" height="90" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="815.0" y="180.9" text-anchor="middle" font-size="14" fill="#111111">2024: roughly 1.5% of</text>
  <text x="815.0" y="199.9" text-anchor="middle" font-size="14" fill="#111111">global electricity</text>
  <text x="815.0" y="218.9" text-anchor="middle" font-size="14" fill="#111111">use</text>
  <text x="480.0" y="488" text-anchor="middle" font-size="13" fill="#333333">International Energy Agency estimates (2025); other projections differ substantially.</text>
</svg>
