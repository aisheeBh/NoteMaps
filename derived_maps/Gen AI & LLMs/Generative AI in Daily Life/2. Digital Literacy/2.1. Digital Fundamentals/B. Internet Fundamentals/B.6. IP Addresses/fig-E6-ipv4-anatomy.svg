<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Anatomy of an IPv4 address</title>
  <desc>The address 192.0.2.45 is shown as four octets, each with its eight binary digits beneath. A bracket shows that with a /24 prefix the first three octets form the network part and the last octet the host part.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">An IPv4 address: 32 bits in four octets</text>
  <rect x="90" y="90" width="170" height="70" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="175.0" y="135.5" text-anchor="middle" font-size="30" font-weight="bold" fill="#111111">192</text>
  <rect x="90" y="180" width="170" height="46" rx="8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="104.0" y="193.25" width="142.0" height="21" fill="#FFFFFF"/>
  <text x="175.0" y="208.25" text-anchor="middle" font-size="15" fill="#111111">1 1 0 0  0 0 0 0</text>
  <text x="175" y="250" text-anchor="middle" font-size="14" fill="#111111">octet 1: 8 bits</text>
  <text x="275" y="135" text-anchor="middle" font-size="34" font-weight="bold" fill="#111111">.</text>
  <rect x="295" y="90" width="170" height="70" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="380.0" y="135.5" text-anchor="middle" font-size="30" font-weight="bold" fill="#111111">0</text>
  <rect x="295" y="180" width="170" height="46" rx="8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="309.0" y="193.25" width="142.0" height="21" fill="#FFFFFF"/>
  <text x="380.0" y="208.25" text-anchor="middle" font-size="15" fill="#111111">0 0 0 0  0 0 0 0</text>
  <text x="380" y="250" text-anchor="middle" font-size="14" fill="#111111">octet 2: 8 bits</text>
  <text x="480" y="135" text-anchor="middle" font-size="34" font-weight="bold" fill="#111111">.</text>
  <rect x="500" y="90" width="170" height="70" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="585.0" y="135.5" text-anchor="middle" font-size="30" font-weight="bold" fill="#111111">2</text>
  <rect x="500" y="180" width="170" height="46" rx="8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="514.0" y="193.25" width="142.0" height="21" fill="#FFFFFF"/>
  <text x="585.0" y="208.25" text-anchor="middle" font-size="15" fill="#111111">0 0 0 0  0 0 1 0</text>
  <text x="585" y="250" text-anchor="middle" font-size="14" fill="#111111">octet 3: 8 bits</text>
  <text x="685" y="135" text-anchor="middle" font-size="34" font-weight="bold" fill="#111111">.</text>
  <rect x="705" y="90" width="170" height="70" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="790.0" y="135.5" text-anchor="middle" font-size="30" font-weight="bold" fill="#111111">45</text>
  <rect x="705" y="180" width="170" height="46" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="790.0" y="208.25" text-anchor="middle" font-size="15" fill="#111111">0 0 1 0  1 1 0 1</text>
  <text x="790" y="250" text-anchor="middle" font-size="14" fill="#111111">octet 4: 8 bits</text>
  <text x="48" y="135" text-anchor="middle" font-size="10" fill="#111111"></text>
  <line x1="90" y1="290" x2="665" y2="290" stroke="#222222" stroke-width="3"/>
  <line x1="90" y1="280" x2="90" y2="300" stroke="#222222" stroke-width="3"/>
  <line x1="665" y1="280" x2="665" y2="300" stroke="#222222" stroke-width="3"/>
  <text x="377" y="320" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Network part (first 24 bits with a /24 prefix)</text>
  <text x="377" y="342" text-anchor="middle" font-size="15" fill="#111111">tells routers which network: 192.0.2.0/24</text>
  <line x1="705" y1="290" x2="870" y2="290" stroke="#222222" stroke-width="3" stroke-dasharray="8 4"/>
  <line x1="705" y1="280" x2="705" y2="300" stroke="#222222" stroke-width="3"/>
  <line x1="870" y1="280" x2="870" y2="300" stroke="#222222" stroke-width="3"/>
  <text x="787" y="320" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Host part (last 8 bits)</text>
  <text x="787" y="342" text-anchor="middle" font-size="15" fill="#111111">which interface: 1 of 256</text>
  <rect x="150" y="385" width="660" height="80" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="480.0" y="420.25" text-anchor="middle" font-size="15" fill="#222222">32 bits in total: 2 to the power 32 = 4,294,967,296 possible addresses</text>
  <text x="480.0" y="440.25" text-anchor="middle" font-size="15" fill="#222222">Each octet ranges from 0 (00000000) to 255 (11111111)</text>
  <text x="480.0" y="505" text-anchor="middle" font-size="13" fill="#333333">192.0.2.0/24 is a range reserved for documentation examples.</text>
</svg>
