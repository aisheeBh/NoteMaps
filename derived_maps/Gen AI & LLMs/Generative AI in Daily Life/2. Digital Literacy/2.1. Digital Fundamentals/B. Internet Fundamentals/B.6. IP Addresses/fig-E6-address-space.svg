<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Address space sizes compared</title>
  <desc>Logarithmic bar chart of the number of addresses as powers of ten: a /24 IPv4 block 256 addresses (about 10 to the 2.4); the whole IPv4 space about 4.3 billion (10 to the 9.6); world population about 8 billion (10 to the 9.9); one standard IPv6 /64 network about 1.8 times 10 to the 19; the whole IPv6 space about 3.4 times 10 to the 38.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">How many addresses? (logarithmic scale)</text>
  <text x="276" y="110" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">One IPv4 /24 block</text>
  <rect x="290" y="88" width="37.0498456201823" height="34" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <rect x="394.6748456201823" y="96" width="34.75" height="22" fill="#FFFFFF"/>
  <text x="412.0498456201823" y="111" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">256</text>
  <text x="276" y="188" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Entire IPv4 Internet</text>
  <rect x="290" y="166" width="148.19165064899576" height="34" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="448.06665064899573" y="174" width="150.25" height="22" fill="#FFFFFF"/>
  <text x="523.1916506489957" y="189" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">about 4.3 billion</text>
  <text x="276" y="266" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">People on Earth</text>
  <rect x="290" y="244" width="152.52021311359564" height="34" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <rect x="460.6452131135957" y="252" width="133.75" height="22" fill="#FFFFFF"/>
  <text x="527.5202131135957" y="267" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">about 8 billion</text>
  <text x="276" y="344" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">One IPv6 /64 network</text>
  <rect x="290" y="322" width="296.3818126616852" height="34" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="596.2568126616852" y="330" width="150.25" height="22" fill="#FFFFFF"/>
  <text x="671.3818126616852" y="345" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">about 1.8 x 10^19</text>
  <text x="276" y="422" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Entire IPv6 space</text>
  <rect x="290" y="400" width="592.7919833391117" height="34" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="870.7919833391117" y="423" text-anchor="end" font-size="15" font-weight="bold" fill="#FFFFFF">about 3.4 x 10^38</text>
  <line x1="290" y1="75" x2="290" y2="475" stroke="#222222" stroke-width="2"/>
  <text x="290.0" y="495" text-anchor="middle" font-size="14" fill="#111111">10^0</text>
  <text x="443.8461538461538" y="495" text-anchor="middle" font-size="14" fill="#111111">10^10</text>
  <text x="597.6923076923076" y="495" text-anchor="middle" font-size="14" fill="#111111">10^20</text>
  <text x="751.5384615384615" y="495" text-anchor="middle" font-size="14" fill="#111111">10^30</text>
  <text x="590.0" y="520" text-anchor="middle" font-size="14" fill="#111111">Number of addresses (each step of 10 on the axis is ten billion times larger)</text>
  <text x="480.0" y="548" text-anchor="middle" font-size="13" fill="#333333">A single /64 IPv6 network is more than four billion times the whole IPv4 address space.</text>
</svg>
