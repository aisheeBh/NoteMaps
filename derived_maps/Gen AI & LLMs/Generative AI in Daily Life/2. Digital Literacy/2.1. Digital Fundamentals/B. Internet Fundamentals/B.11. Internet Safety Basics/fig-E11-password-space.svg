<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Password space by type</title>
  <desc>Logarithmic bar chart of the number of possible combinations: a 6-digit PIN 10 to the 6; 8 lower-case letters about 2 times 10 to the 11; 8 characters from 95 symbols about 6.6 times 10 to the 15; 12 characters from 95 symbols about 5.4 times 10 to the 23; 5 random words from a 7,776-word list about 2.8 times 10 to the 19; 7 random words about 1.7 times 10 to the 27.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Possible combinations, if chosen at random (logarithmic scale)</text>
  <text x="286" y="108" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">6-digit PIN</text>
  <rect x="300" y="86" width="120.0" height="32" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="451.5" y="94" width="87.0" height="21" fill="#FFFFFF"/>
  <text x="495.0" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">1.0 x 10^6</text>
  <text x="286" y="170" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">8 lower-case letters</text>
  <rect x="300" y="148" width="226.39573567533085" height="32" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="554.0457356753308" y="156" width="94.7" height="21" fill="#FFFFFF"/>
  <text x="601.3957356753308" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">2.1 x 10^11</text>
  <text x="286" y="232" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">8 characters, 95 symbols</text>
  <rect x="300" y="210" width="316.4357768462156" height="32" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="644.0857768462156" y="218" width="94.7" height="21" fill="#FFFFFF"/>
  <text x="691.4357768462156" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">6.6 x 10^15</text>
  <text x="286" y="294" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">5 random words</text>
  <rect x="300" y="272" width="389.0756251918218" height="32" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="716.7256251918218" y="280" width="94.7" height="21" fill="#FFFFFF"/>
  <text x="764.0756251918218" y="294" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">2.8 x 10^19</text>
  <text x="286" y="356" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">12 characters, 95 symbols</text>
  <rect x="300" y="334" width="474.6536652693235" height="32" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="802.3036652693235" y="342" width="94.7" height="21" fill="#FFFFFF"/>
  <text x="849.6536652693235" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">5.4 x 10^23</text>
  <text x="286" y="418" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">7 random words</text>
  <rect x="300" y="396" width="544.7058752685506" height="32" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <rect x="872.3558752685506" y="404" width="94.7" height="21" fill="#FFFFFF"/>
  <text x="919.7058752685506" y="418" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">1.7 x 10^27</text>
  <line x1="300" y1="75" x2="300" y2="457" stroke="#222222" stroke-width="2"/>
  <text x="300.0" y="477" text-anchor="middle" font-size="14" fill="#111111">10^0</text>
  <text x="440.0" y="477" text-anchor="middle" font-size="14" fill="#111111">10^7</text>
  <text x="580.0" y="477" text-anchor="middle" font-size="14" fill="#111111">10^14</text>
  <text x="720.0" y="477" text-anchor="middle" font-size="14" fill="#111111">10^21</text>
  <text x="860.0" y="477" text-anchor="middle" font-size="14" fill="#111111">10^28</text>
  <text x="580.0" y="502" text-anchor="middle" font-size="14" fill="#111111">Number of possible passwords</text>
  <text x="480.0" y="548" text-anchor="middle" font-size="13" fill="#333333">Human-chosen passwords are far weaker than these figures because people pick predictable patterns.</text>
</svg>
