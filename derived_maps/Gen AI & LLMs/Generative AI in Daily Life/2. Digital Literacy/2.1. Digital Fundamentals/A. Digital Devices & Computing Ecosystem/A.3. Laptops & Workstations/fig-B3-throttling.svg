<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Burst and sustained performance</title>
  <desc>Performance over time under a long, heavy task. A workstation stays near its peak throughout. A thin laptop starts near the same peak but within a minute or two drops to a lower sustained level as it reaches its temperature limit. A short benchmark window at the start captures only the burst.</desc>
  <defs>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Thermal throttling under a long, heavy task</text>
  <rect x="122" y="80" width="110" height="368" fill="url(#dots)" stroke="#7A5200" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="130" y="404" width="96" height="40" fill="#FFFFFF"/>
  <text x="178" y="421" text-anchor="middle" font-size="14" fill="#111111">short</text>
  <text x="178" y="439" text-anchor="middle" font-size="14" fill="#111111">benchmark</text>

  <line x1="120" y1="450" x2="800" y2="450" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="450" x2="120" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="460" y="490" text-anchor="middle" font-size="16" fill="#111111">Time under full load (minutes)</text>
  <text x="62" y="270" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 62 270)">Performance</text>

  <path d="M120 120 L780 125" fill="none" stroke="#1F3B5C" stroke-width="3.5"/>
  <path d="M120 130 L200 132 C 230 135, 250 230, 290 250 L780 255" fill="none" stroke="#8B0000" stroke-width="3.5" stroke-dasharray="10 6"/>

  <rect x="560" y="88" width="230" height="26" fill="#FFFFFF"/>
  <text x="570" y="107" font-size="15" fill="#111111">workstation: sustained</text>
  <rect x="560" y="262" width="230" height="46" fill="#FFFFFF"/>
  <text x="570" y="282" font-size="15" fill="#111111">thin laptop: settles lower</text>
  <text x="570" y="301" font-size="15" fill="#111111">once at temperature limit</text>
  <line x1="320" y1="180" x2="270" y2="225" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="300" y="150" width="200" height="26" fill="#FFFFFF"/>
  <text x="310" y="168" font-size="14" fill="#111111">throttling begins</text>
  <text x="920" y="540" text-anchor="end" font-size="13" fill="#111111">Schematic; real curves vary by model, cooling and room temperature.</text>
</svg>
