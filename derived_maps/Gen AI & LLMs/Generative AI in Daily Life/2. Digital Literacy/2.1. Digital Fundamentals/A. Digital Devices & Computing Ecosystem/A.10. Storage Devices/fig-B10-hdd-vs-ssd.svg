<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Inside a hard disk drive and a solid-state drive</title>
  <desc>Left: a hard disk drive seen from above, with a spinning platter, an arm carrying the read and write head across the tracks, and a motor at the centre. Labels note moving parts, seek time and rotation. Right: an M.2 solid-state drive, a small circuit board carrying a controller chip, several NAND flash chips and a connector; labels note no moving parts, the controller handling wear levelling and error correction.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Moving parts against trapped charge</text>
  <text x="240" y="80" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">Hard disk drive</text>
  <rect x="70" y="100" width="340" height="300" rx="12" fill="#F2F2F2" stroke="#333333" stroke-width="2"/>
  <circle cx="220" cy="250" r="120" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <circle cx="220" cy="250" r="90" fill="none" stroke="#BBBBBB" stroke-width="1.5"/>
  <circle cx="220" cy="250" r="60" fill="none" stroke="#BBBBBB" stroke-width="1.5"/>
  <circle cx="220" cy="250" r="18" fill="#1F3B5C"/>
  <path d="M220 110 A140 140 0 0 1 345 180" fill="none" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="125" font-size="14" fill="#111111">spins</text>
  <circle cx="370" cy="360" r="14" fill="#1F3B5C"/>
  <line x1="370" y1="360" x2="250" y2="200" stroke="#1F3B5C" stroke-width="8" stroke-linecap="round"/>
  <rect x="242" y="190" width="14" height="14" fill="#8B0000"/>
  <g font-size="14" fill="#111111">
    <text x="70" y="430" font-weight="bold">platter, arm, head, motor</text>
    <text x="70" y="452">• head must move to the track (seek)</text>
    <text x="70" y="474">• then wait for the data to rotate round</text>
    <text x="70" y="496">• sensitive to knocks while running</text>
  </g>

  <text x="720" y="80" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">Solid-state drive (M.2)</text>
  <rect x="540" y="200" width="380" height="90" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
  <rect x="550" y="215" width="70" height="60" fill="#1F3B5C" stroke="#000000"/>
  <text x="585" y="250" text-anchor="middle" font-size="13" fill="#FFFFFF">controller</text>
  <g fill="#FFFFFF" stroke="#111111" stroke-width="1.5">
    <rect x="635" y="215" width="60" height="60"/><rect x="705" y="215" width="60" height="60"/><rect x="775" y="215" width="60" height="60"/>
  </g>
  <g font-size="13" fill="#111111" text-anchor="middle"><text x="665" y="250">NAND</text><text x="735" y="250">NAND</text><text x="805" y="250">NAND</text></g>
  <g fill="#E6E6E6" stroke="#666666"><rect x="850" y="215" width="60" height="60"/></g>
  <text x="880" y="250" text-anchor="middle" font-size="13" fill="#111111">pins</text>
  <g font-size="14" fill="#111111">
    <text x="540" y="430" font-weight="bold">controller and flash chips</text>
    <text x="540" y="452">• no moving parts; resists shock</text>
    <text x="540" y="474">• controller spreads writes (wear levelling)</text>
    <text x="540" y="496">• fast random access in microseconds</text>
  </g>
  <text x="920" y="530" text-anchor="end" font-size="13" fill="#111111">Schematic; not to scale.</text>
</svg>
