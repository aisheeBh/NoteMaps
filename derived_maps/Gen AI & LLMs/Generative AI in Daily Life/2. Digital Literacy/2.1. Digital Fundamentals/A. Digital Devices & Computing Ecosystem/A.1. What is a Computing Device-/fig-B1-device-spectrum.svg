<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Computing devices by flexibility and number per person</title>
  <desc>A chart with flexibility on the vertical axis and number of devices per person on the horizontal axis. Servers and desktops are highly flexible and few per person; smartphones and laptops are flexible and one per person; wearables sit in the middle; embedded and IoT devices are fixed in function and numerous.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">From general-purpose to embedded</text>

  <line x1="130" y1="480" x2="900" y2="480" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="130" y1="480" x2="130" y2="80" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="515" y="520" text-anchor="middle" font-size="16" fill="#111111">Devices per person (shared → one each → many each)</text>
  <text x="70" y="280" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 70 280)">Flexibility of function</text>
  <text x="138" y="100" font-size="14" fill="#111111">runs any software</text>
  <text x="138" y="470" font-size="14" fill="#111111">fixed function</text>

  <!-- items -->
  <rect x="170" y="110" width="170" height="56" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="2.5"/>
  <text x="255" y="134" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Servers, cloud</text>
  <text x="255" y="155" text-anchor="middle" font-size="14" fill="#FFFFFF">shared by thousands</text>

  <rect x="300" y="190" width="170" height="56" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="385" y="214" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Desktops</text>
  <text x="385" y="235" text-anchor="middle" font-size="14" fill="#111111">one per desk</text>

  <rect x="430" y="125" width="200" height="56" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="530" y="149" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Laptops, smartphones</text>
  <text x="530" y="170" text-anchor="middle" font-size="14" fill="#111111">one or two per person</text>

  <rect x="560" y="260" width="170" height="56" rx="6" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="645" y="284" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Wearables</text>
  <text x="645" y="305" text-anchor="middle" font-size="14" fill="#111111">watch, ring, earbuds</text>

  <rect x="680" y="380" width="200" height="56" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <text x="780" y="404" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Embedded and IoT</text>
  <text x="780" y="425" text-anchor="middle" font-size="14" fill="#111111">dozens per person</text>

  <path d="M200 270 C 380 300, 560 370, 672 410" fill="none" stroke="#333333" stroke-width="2" stroke-dasharray="10 6"/>
  <rect x="160" y="395" width="250" height="48" fill="#FFFFFF" stroke="#BBBBBB"/>
  <text x="285" y="415" text-anchor="middle" font-size="14" fill="#111111">trend: more devices, each</text>
  <text x="285" y="434" text-anchor="middle" font-size="14" fill="#111111">more specialised</text>
  <text x="890" y="560" text-anchor="end" font-size="13" fill="#111111">Schematic; positions are illustrative, not measured.</text>
</svg>
