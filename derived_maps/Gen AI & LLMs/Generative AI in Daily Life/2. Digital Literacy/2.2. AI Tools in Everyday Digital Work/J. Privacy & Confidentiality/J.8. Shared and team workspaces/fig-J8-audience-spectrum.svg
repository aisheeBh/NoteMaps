<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Audience spectrum</title>
<desc>Six sharing modes as widening arcs from a central user: private conversation, named people, team project, anyone in the organisation, anyone with the link, discoverable or public. Each step enlarges the potential audience.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">Sharing modes by the size of their potential audience</text>
<path d="M50 520 A430 430 0 0 1 910 520 Z" fill="#F6CACA" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
<path d="M122 520 A358 358 0 0 1 838 520 Z" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
<path d="M194 520 A286 286 0 0 1 766 520 Z" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<path d="M266 520 A214 214 0 0 1 694 520 Z" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
<path d="M338 520 A142 142 0 0 1 622 520 Z" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
<path d="M410 520 A70 70 0 0 1 550 520 Z" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
<text x="480" y="490" font-size="16" text-anchor="middle" font-weight="bold" fill="#FFFFFF">Private</text>
<rect x="424.6" y="392" width="110.80000000000001" height="23.5" fill="#FFFFFF" stroke="none"/>
<text x="480" y="408.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Named people</text>
<rect x="424.6" y="320" width="110.80000000000001" height="23.5" fill="#FFFFFF" stroke="none"/>
<text x="480" y="336.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Team project</text>
<rect x="399.4" y="248" width="161.20000000000002" height="23.5" fill="#FFFFFF" stroke="none"/>
<text x="480" y="264.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Whole organisation</text>
<rect x="391.0" y="176" width="178.00000000000003" height="23.5" fill="#FFFFFF" stroke="none"/>
<text x="480" y="192.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Anyone with the link</text>
<rect x="382.6" y="104" width="194.8" height="23.5" fill="#FFFFFF" stroke="none"/>
<text x="480" y="120.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Discoverable or public</text>
</svg>
