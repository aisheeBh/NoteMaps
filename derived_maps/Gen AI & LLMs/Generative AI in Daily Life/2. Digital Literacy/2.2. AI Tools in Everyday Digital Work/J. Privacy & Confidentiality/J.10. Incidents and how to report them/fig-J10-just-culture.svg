<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Just culture</title>
<desc>Three columns. Human error, an inadvertent slip such as pasting the wrong text: console the person and fix the system. At-risk behaviour, a shortcut whose risk was not recognised, such as using a personal chatbot just this once: coach and remove the incentive. Reckless behaviour, conscious disregard of a known substantial risk: consider sanctions.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">Three kinds of behaviour and a just response to each</text>
<rect x="40" y="80" width="280" height="60" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
<text x="180.0" y="115.95" font-size="17" text-anchor="middle" font-weight="bold" fill="#000000">Human error</text>
<rect x="40" y="150" width="280" height="90" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="180.0" y="200.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">an inadvertent slip</text>
<rect x="40" y="250" width="280" height="100" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="180.0" y="286.7" font-size="14" text-anchor="middle" font-weight="bold" fill="#000000">Example</text>
<text x="180.0" y="304.9" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">pasting the wrong block of</text>
<text x="180.0" y="323.09999999999997" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">text</text>
<rect x="40" y="362" width="280" height="60" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
<text x="180.0" y="397.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#000000">Console; fix the system</text>
<rect x="340" y="80" width="280" height="60" rx="8" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<rect x="392.525" y="94.95" width="174.95000000000002" height="30.1" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="480.0" y="115.95" font-size="17" text-anchor="middle" font-weight="bold" fill="#111111">At-risk behaviour</text>
<rect x="340" y="150" width="280" height="90" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="480.0" y="190.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">a risky shortcut not seen as</text>
<text x="480.0" y="210.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">risky</text>
<rect x="340" y="250" width="280" height="100" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="480.0" y="286.7" font-size="14" text-anchor="middle" font-weight="bold" fill="#000000">Example</text>
<text x="480.0" y="304.9" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">a personal chatbot “just this</text>
<text x="480.0" y="323.09999999999997" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">once”</text>
<rect x="340" y="362" width="280" height="60" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
<text x="480.0" y="397.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#000000">Coach; remove the incentive</text>
<rect x="640" y="80" width="280" height="60" rx="8" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<rect x="687.85" y="94.95" width="184.3" height="30.1" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="780.0" y="115.95" font-size="17" text-anchor="middle" font-weight="bold" fill="#111111">Reckless behaviour</text>
<rect x="640" y="150" width="280" height="90" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="780.0" y="190.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">conscious disregard of known</text>
<text x="780.0" y="210.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">risk</text>
<rect x="640" y="250" width="280" height="100" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="780.0" y="286.7" font-size="14" text-anchor="middle" font-weight="bold" fill="#000000">Example</text>
<text x="780.0" y="304.9" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">uploading a client database</text>
<text x="780.0" y="323.09999999999997" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">after being told not to</text>
<rect x="640" y="362" width="280" height="60" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<text x="780.0" y="397.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#FFFFFF">Consider sanctions</text>
<line x1="60" y1="450" x2="900" y2="450" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="480" y="478" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">increasing culpability</text>
</svg>
