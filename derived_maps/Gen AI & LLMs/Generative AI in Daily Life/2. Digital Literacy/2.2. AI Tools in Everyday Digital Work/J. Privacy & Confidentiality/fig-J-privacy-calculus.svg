<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Privacy calculus</title>
<desc>A balance beam tilted towards disclosure. Left pan: benefits now, such as speed, better answers and convenience. Right pan: costs later, such as storage, review or training, legal disclosure, and harm to others. Four pressures push down on the benefits side: defaults and design, immediate gratification, uncertainty about distant harms, and resignation.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">The privacy calculus and what tilts it</text>
<polygon points="480,300 450,380 510,380" fill="#E6E6E6" stroke="#222222" stroke-width="2"/>
<line x1="200" y1="330" x2="760" y2="250" stroke="#222222" stroke-width="5"/>
<line x1="200" y1="330" x2="200" y2="360" stroke="#222222" stroke-width="2"/><line x1="760" y1="250" x2="760" y2="280" stroke="#222222" stroke-width="2"/>
<rect x="80" y="360" width="240" height="110" rx="8" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
<rect x="134.25" y="372.0" width="131.5" height="86.0" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="200.0" y="391.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Benefits now</text>
<text x="200.0" y="410.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">speed</text>
<text x="200.0" y="430.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">better answers</text>
<text x="200.0" y="449.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">convenience</text>
<rect x="640" y="280" width="240" height="130" rx="8" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<rect x="669.5" y="302.0" width="181.0" height="86.0" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="760.0" y="321.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Costs later</text>
<text x="760.0" y="340.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">storage and review</text>
<text x="760.0" y="360.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">training, disclosure</text>
<text x="760.0" y="379.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">harm to others</text>
<rect x="40" y="90" width="140" height="56" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<text x="110.0" y="113.80000000000001" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">Defaults and</text>
<text x="110.0" y="132.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">design</text>
<line x1="110" y1="148" x2="160" y2="352" stroke="#222222" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#arrow)"/>
<rect x="190" y="90" width="140" height="56" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<text x="260.0" y="113.80000000000001" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">Immediate</text>
<text x="260.0" y="132.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">gratification</text>
<line x1="260" y1="148" x2="190" y2="352" stroke="#222222" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#arrow)"/>
<rect x="340" y="90" width="140" height="56" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<text x="410.0" y="113.80000000000001" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">Uncertain,</text>
<text x="410.0" y="132.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">distant harms</text>
<line x1="410" y1="148" x2="220" y2="352" stroke="#222222" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#arrow)"/>
<rect x="490" y="90" width="140" height="56" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<text x="560.0" y="122.9" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">Resignation</text>
<line x1="560" y1="148" x2="250" y2="352" stroke="#222222" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#arrow)"/>
<text x="640" y="470" font-size="15" text-anchor="start" font-weight="normal" fill="#111111" font-style="italic">Disclosure follows when the near, certain</text>
<text x="640" y="492" font-size="15" text-anchor="start" font-weight="normal" fill="#111111" font-style="italic">benefit outweighs the far, uncertain cost.</text>
<text x="480.0" y="525" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">Schematic.</text>
</svg>
