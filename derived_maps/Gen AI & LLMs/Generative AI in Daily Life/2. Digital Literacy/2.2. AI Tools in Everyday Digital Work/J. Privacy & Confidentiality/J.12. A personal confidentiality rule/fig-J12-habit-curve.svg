<text x="869.6153846153846" y="460" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">250</text>
<text x="480.0" y="505" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">Schematic curve; not plotted from the study's data.</text>
</svg>
