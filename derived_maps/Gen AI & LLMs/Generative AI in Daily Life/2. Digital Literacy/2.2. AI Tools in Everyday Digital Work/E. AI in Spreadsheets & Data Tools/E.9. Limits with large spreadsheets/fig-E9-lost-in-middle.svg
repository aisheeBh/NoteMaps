<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Accuracy by position of the relevant information in a long input</title>
  <desc>Schematic U-shaped curve. Accuracy is highest when the needed information is at the beginning of a long input, lowest when it is in the middle, and recovers partly towards the end.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">Long inputs: information in the middle is used least well</text>
  <line x1="120" y1="400" x2="860" y2="400" stroke="#222222" stroke-width="2"/>
  <line x1="120" y1="400" x2="120" y2="112" stroke="#222222" stroke-width="2"/>
  <path d="M120.0 139.6 L127.4 144.0 L134.8 148.4 L142.2 152.7 L149.6 156.8 L157.0 160.9 L164.4 164.9 L171.8 168.9 L179.2 172.7 L186.6 176.5 L194.0 180.1 L201.4 183.7 L208.8 187.2 L216.2 190.6 L223.6 194.0 L231.0 197.2 L238.4 200.4 L245.8 203.5 L253.2 206.5 L260.6 209.4 L268.0 212.2 L275.4 214.9 L282.8 217.6 L290.2 220.1 L297.6 222.6 L305.0 225.0 L312.4 227.3 L319.8 229.5 L327.2 231.7 L334.6 233.7 L342.0 235.7 L349.4 237.6 L356.8 239.4 L364.2 241.1 L371.6 242.7 L379.0 244.3 L386.4 245.7 L393.8 247.1 L401.2 248.4 L408.6 249.6 L416.0 250.7 L423.4 251.7 L430.8 252.7 L438.2 253.5 L445.6 254.3 L453.0 255.0 L460.4 255.6 L467.8 256.1 L475.2 256.6 L482.6 256.9 L490.0 257.2 L497.4 257.4 L504.8 257.5 L512.2 257.5 L519.6 257.4 L527.0 257.3 L534.4 257.0 L541.8 256.7 L549.2 256.3 L556.6 255.8 L564.0 255.2 L571.4 254.5 L578.8 253.8 L586.2 252.9 L593.6 252.0 L601.0 251.0 L608.4 249.9 L615.8 248.7 L623.2 247.4 L630.6 246.1 L638.0 244.7 L645.4 243.1 L652.8 241.5 L660.2 239.8 L667.6 238.1 L675.0 236.2 L682.4 234.3 L689.8 232.2 L697.2 230.1 L704.6 227.9 L712.0 225.6 L719.4 223.2 L726.8 220.8 L734.2 218.2 L741.6 215.6 L749.0 212.9 L756.4 210.1 L763.8 207.2 L771.2 204.3 L778.6 201.2 L786.0 198.1 L793.4 194.8 L800.8 191.5 L808.2 188.1 L815.6 184.7 L823.0 181.1 L830.4 177.4 L837.8 173.7 L845.2 169.9 L852.6 166.0 L860.0 162.0" fill="none" stroke="#222222" stroke-width="3.5"/>
  <text x="120" y="426" text-anchor="start" font-size="14" fill="#111111">Beginning</text>
  <text x="490.0" y="426" text-anchor="middle" font-size="14" fill="#111111">Middle</text>
  <text x="860" y="426" text-anchor="end" font-size="14" fill="#111111">End</text>
  <text x="490.0" y="454" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Position of the needed information in the input</text>
  <text x="66" y="260.0" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold" transform="rotate(-90 66 260.0)">Answer accuracy</text>
  <text x="140" y="131.59999999999997" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">Best near the start</text>
  <text x="490.0" y="291.2" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Weakest in the middle</text>
  <text x="850" y="152.0" text-anchor="end" font-size="15" fill="#111111" font-weight="bold">Partial recovery at the end</text>
  <text x="480.0" y="488" text-anchor="middle" font-size="13" fill="#333333">Schematic after Liu and colleagues (2023); not plotted from their data. Newer models show a weaker effect.</text>
</svg>
