<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Capacity of common data tools on a logarithmic scale</title>
  <desc>Horizontal bars on a scale from 1,000 to 1 billion rows, each step ten times the last. Rows that fit comfortably in an AI context window as text: a few thousand. Legacy xls sheet: 65,536 rows. Modern xlsx sheet: 1,048,576 rows. Data model and databases: many millions to billions.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">How many rows each tool can hold</text>
  <text x="316" y="122" text-anchor="end" font-size="16" fill="#111111" font-weight="bold">AI reading a table as text</text>
  <rect x="330" y="90" width="65" height="48" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="405.23720040469505" y="121" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">a few thousand rows*</text>
  <text x="316" y="202" text-anchor="end" font-size="16" fill="#111111" font-weight="bold">Legacy .xls sheet</text>
  <rect x="330" y="170" width="170" height="48" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="509.53812685821197" y="201" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">65,536</text>
  <text x="316" y="282" text-anchor="end" font-size="16" fill="#111111" font-weight="bold">Modern .xlsx sheet</text>
  <rect x="330" y="250" width="282" height="48" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="621.9226585727649" y="281" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">1,048,576</text>
  <text x="316" y="362" text-anchor="end" font-size="16" fill="#111111" font-weight="bold">Data model / database</text>
  <rect x="330" y="330" width="532" height="48" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
  <rect x="642" y="342" width="210" height="26" fill="#FFFFFF"/>
  <text x="845.9038670713617" y="361" text-anchor="end" font-size="15" fill="#111111" font-weight="bold">many millions and beyond</text>
  <line x1="330" y1="420" x2="890" y2="420" stroke="#222222" stroke-width="2"/>
  <line x1="330.0" y1="420" x2="330.0" y2="426" stroke="#222222" stroke-width="2"/>
  <text x="330.0" y="444" text-anchor="middle" font-size="14" fill="#111111">1k</text>
  <line x1="423.3333333333333" y1="420" x2="423.3333333333333" y2="426" stroke="#222222" stroke-width="2"/>
  <text x="423.3333333333333" y="444" text-anchor="middle" font-size="14" fill="#111111">10k</text>
  <line x1="516.6666666666666" y1="420" x2="516.6666666666666" y2="426" stroke="#222222" stroke-width="2"/>
  <text x="516.6666666666666" y="444" text-anchor="middle" font-size="14" fill="#111111">100k</text>
  <line x1="610.0" y1="420" x2="610.0" y2="426" stroke="#222222" stroke-width="2"/>
  <text x="610.0" y="444" text-anchor="middle" font-size="14" fill="#111111">1m</text>
  <line x1="703.3333333333333" y1="420" x2="703.3333333333333" y2="426" stroke="#222222" stroke-width="2"/>
  <text x="703.3333333333333" y="444" text-anchor="middle" font-size="14" fill="#111111">10m</text>
  <line x1="796.6666666666667" y1="420" x2="796.6666666666667" y2="426" stroke="#222222" stroke-width="2"/>
  <text x="796.6666666666667" y="444" text-anchor="middle" font-size="14" fill="#111111">100m</text>
  <line x1="890.0" y1="420" x2="890.0" y2="426" stroke="#222222" stroke-width="2"/>
  <text x="890.0" y="444" text-anchor="middle" font-size="14" fill="#111111">1bn</text>
  <text x="610.0" y="470" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Rows (each step is ten times the last)</text>
  <text x="480.0" y="505" text-anchor="middle" font-size="13" fill="#333333">* Depends on columns, content and the model; Google Sheets limits cells (10 million) rather than rows.</text>
</svg>
