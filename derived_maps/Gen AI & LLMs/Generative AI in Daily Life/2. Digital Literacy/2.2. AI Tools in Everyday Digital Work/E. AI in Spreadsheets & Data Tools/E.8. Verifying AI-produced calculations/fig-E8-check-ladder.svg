<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>A ladder of verification checks</title>
  <desc>Six rising steps from left to right, from quick and cheap to thorough and costly: sense check, units and periods, independent recomputation, known cases and boundaries, reconciliation with control totals, trace to source with specification and peer review. An arrow along the bottom is labelled effort and assurance increase.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">Verification ladder: effort and assurance rise together</text>
  <rect x="40" y="380" width="140" height="90" rx="6" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="110" y="412" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">Sense check</text>
  <text x="110" y="430" text-anchor="middle" font-size="14" fill="#222222">right size and</text>
  <text x="110" y="450" text-anchor="middle" font-size="14" fill="#222222">direction?</text>
  <rect x="188" y="322" width="140" height="148" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="258" y="382" text-anchor="middle" font-size="15" fill="#000000" font-weight="bold">Units and</text>
  <text x="258" y="402" text-anchor="middle" font-size="15" fill="#000000" font-weight="bold">periods</text>
  <text x="258" y="421" text-anchor="middle" font-size="14" fill="#000000">do they work?</text>
  <rect x="336" y="264" width="140" height="206" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="406" y="354" text-anchor="middle" font-size="15" fill="#000000" font-weight="bold">Recompute</text>
  <text x="406" y="372" text-anchor="middle" font-size="14" fill="#000000">by a different</text>
  <text x="406" y="392" text-anchor="middle" font-size="14" fill="#000000">route</text>
  <rect x="484" y="206" width="140" height="264" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="554" y="315" text-anchor="middle" font-size="15" fill="#000000" font-weight="bold">Known cases</text>
  <text x="554" y="334" text-anchor="middle" font-size="14" fill="#000000">boundaries,</text>
  <text x="554" y="353" text-anchor="middle" font-size="14" fill="#000000">hand-worked</text>
  <text x="554" y="372" text-anchor="middle" font-size="14" fill="#000000">rows</text>
  <rect x="632" y="148" width="140" height="322" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="650" y="278" width="103" height="63" fill="#FFFFFF" stroke="none"/>
  <text x="702" y="296" text-anchor="middle" font-size="15" fill="#000000" font-weight="bold">Reconcile</text>
  <text x="702" y="314" text-anchor="middle" font-size="14" fill="#000000">with control</text>
  <text x="702" y="334" text-anchor="middle" font-size="14" fill="#000000">totals</text>
  <rect x="780" y="90" width="140" height="380" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="850" y="247" text-anchor="middle" font-size="15" fill="#FFFFFF" font-weight="bold">Trace and</text>
  <text x="850" y="267" text-anchor="middle" font-size="15" fill="#FFFFFF" font-weight="bold">review</text>
  <text x="850" y="286" text-anchor="middle" font-size="14" fill="#FFFFFF">source,</text>
  <text x="850" y="305" text-anchor="middle" font-size="14" fill="#FFFFFF">specification,</text>
  <text x="850" y="324" text-anchor="middle" font-size="14" fill="#FFFFFF">peer</text>
  <line x1="40" y1="500" x2="920" y2="500" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="480" y="528" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Effort and assurance increase</text>
  <text x="480.0" y="552" text-anchor="middle" font-size="13" fill="#333333">Schematic. Seconds at the left; hours at the right for complex figures.</text>
</svg>
