  <text x="700" y="470" text-anchor="middle" font-size="14" fill="#111111">Each panel: months 1–12; same vertical scale</text>
  <text x="480.0" y="525" text-anchor="middle" font-size="13" fill="#333333">Illustrative data.</text>
</svg>
