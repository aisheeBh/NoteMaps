  <path d="M50.0 294.6 L82.7 296.2 L115.5 303.0 L148.2 309.1 L180.9 324.3 L213.6 328.7 L246.4 328.1 L279.1 337.2 L311.8 314.3 L344.5 328.6 L377.3 314.4 L410.0 332.0" fill="none" stroke="#222222" stroke-width="2"/>
  <path d="M50.0 272.7 L82.7 273.7 L115.5 300.3 L148.2 290.1 L180.9 262.8 L213.6 275.2 L246.4 254.5 L279.1 271.9 L311.8 280.4 L344.5 258.0 L377.3 249.9 L410.0 264.8" fill="none" stroke="#222222" stroke-width="2" stroke-dasharray="10 6"/>
