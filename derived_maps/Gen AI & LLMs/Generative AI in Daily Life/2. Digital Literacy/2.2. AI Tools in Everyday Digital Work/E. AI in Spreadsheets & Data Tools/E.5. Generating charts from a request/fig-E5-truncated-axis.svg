<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The same two values with the value axis starting at zero and at 95</title>
  <desc>Two bar charts of customer satisfaction, 96 per cent for Site A and 98 per cent for Site B. Left: axis from 0 to 100; the bars look almost equal. Right: axis from 95 to 99; Site B's bar looks three times as tall as Site A's.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">Same data, two axes: satisfaction at two sites</text>
  <text x="285.0" y="92" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Axis from 0</text>
  <line x1="120" y1="440" x2="450" y2="440" stroke="#222222" stroke-width="2"/>
  <line x1="120" y1="440" x2="120" y2="132" stroke="#222222" stroke-width="2"/>
  <line x1="114" y1="440.0" x2="120" y2="440.0" stroke="#222222" stroke-width="2"/>
  <text x="110" y="445.0" text-anchor="end" font-size="14" fill="#111111">0%</text>
  <line x1="114" y1="365.0" x2="120" y2="365.0" stroke="#222222" stroke-width="2"/>
  <text x="110" y="370.0" text-anchor="end" font-size="14" fill="#111111">25%</text>
  <line x1="114" y1="290.0" x2="120" y2="290.0" stroke="#222222" stroke-width="2"/>
  <text x="110" y="295.0" text-anchor="end" font-size="14" fill="#111111">50%</text>
  <line x1="114" y1="215.0" x2="120" y2="215.0" stroke="#222222" stroke-width="2"/>
  <text x="110" y="220.0" text-anchor="end" font-size="14" fill="#111111">75%</text>
  <line x1="114" y1="140.0" x2="120" y2="140.0" stroke="#222222" stroke-width="2"/>
  <text x="110" y="145.0" text-anchor="end" font-size="14" fill="#111111">100%</text>
  <rect x="170" y="152.0" width="90" height="288.0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="215" y="142.0" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">96%</text>
  <text x="215" y="464" text-anchor="middle" font-size="15" fill="#111111">Site A</text>
  <rect x="310" y="146.0" width="90" height="294.0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="355" y="136.0" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">98%</text>
  <text x="355" y="464" text-anchor="middle" font-size="15" fill="#111111">Site B</text>
  <text x="285.0" y="496" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Difference looks small: it is small</text>
  <text x="725.0" y="92" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Axis from 95</text>
  <line x1="560" y1="440" x2="890" y2="440" stroke="#222222" stroke-width="2"/>
  <line x1="560" y1="440" x2="560" y2="132" stroke="#222222" stroke-width="2"/>
  <line x1="554" y1="440.0" x2="560" y2="440.0" stroke="#222222" stroke-width="2"/>
  <text x="550" y="445.0" text-anchor="end" font-size="14" fill="#111111">95%</text>
  <line x1="554" y1="365.0" x2="560" y2="365.0" stroke="#222222" stroke-width="2"/>
  <text x="550" y="370.0" text-anchor="end" font-size="14" fill="#111111">96%</text>
  <line x1="554" y1="290.0" x2="560" y2="290.0" stroke="#222222" stroke-width="2"/>
  <text x="550" y="295.0" text-anchor="end" font-size="14" fill="#111111">97%</text>
  <line x1="554" y1="215.0" x2="560" y2="215.0" stroke="#222222" stroke-width="2"/>
  <text x="550" y="220.0" text-anchor="end" font-size="14" fill="#111111">98%</text>
  <line x1="554" y1="140.0" x2="560" y2="140.0" stroke="#222222" stroke-width="2"/>
  <text x="550" y="145.0" text-anchor="end" font-size="14" fill="#111111">99%</text>
  <rect x="610" y="365.0" width="90" height="75.0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="655" y="355.0" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">96%</text>
  <text x="655" y="464" text-anchor="middle" font-size="15" fill="#111111">Site A</text>
  <rect x="750" y="215.0" width="90" height="225.0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="795" y="205.0" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">98%</text>
  <text x="795" y="464" text-anchor="middle" font-size="15" fill="#111111">Site B</text>
  <text x="725.0" y="496" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Site B looks three times higher</text>
  <text x="480.0" y="545" text-anchor="middle" font-size="13" fill="#333333">Illustrative values. Bar length encodes value, so a bar axis must start at zero.</text>
</svg>
