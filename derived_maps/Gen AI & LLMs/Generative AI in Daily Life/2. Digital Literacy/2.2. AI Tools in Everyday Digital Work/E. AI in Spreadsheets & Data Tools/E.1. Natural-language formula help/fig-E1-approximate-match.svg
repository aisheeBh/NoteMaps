<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>How an approximate-match lookup returns a wrong value without an error</title>
  <desc>A discount table sorted by customer name, not by customer number. An exact-match lookup for missing customer 1045 returns Not found. An approximate-match lookup for the same number returns the 12 per cent discount of a different customer, with no error.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">A missing key: exact match versus approximate match</text>
  <text x="220" y="82" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Discount table (sorted by name, not by number)</text>
  <rect x="60" y="96" width="100" height="40" rx="0" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="110.0" y="122" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Cust. no.</text>
  <rect x="160" y="96" width="140" height="40" rx="0" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="230.0" y="122" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Name</text>
  <rect x="300" y="96" width="90" height="40" rx="0" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="345.0" y="122" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Discount</text>
  <rect x="60" y="136" width="100" height="40" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="110.0" y="162" text-anchor="middle" font-size="15" fill="#111111">1120</text>
  <rect x="160" y="136" width="140" height="40" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="230.0" y="162" text-anchor="middle" font-size="15" fill="#111111">Abbott Ltd</text>
  <rect x="300" y="136" width="90" height="40" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="345.0" y="162" text-anchor="middle" font-size="15" fill="#111111">5%</text>
  <rect x="60" y="176" width="100" height="40" rx="0" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="110.0" y="202" text-anchor="middle" font-size="15" fill="#111111">1032</text>
  <rect x="160" y="176" width="140" height="40" rx="0" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="230.0" y="202" text-anchor="middle" font-size="15" fill="#111111">Baird &amp; Co</text>
  <rect x="300" y="176" width="90" height="40" rx="0" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="345.0" y="202" text-anchor="middle" font-size="15" fill="#111111">12%</text>
  <rect x="60" y="216" width="100" height="40" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="110.0" y="242" text-anchor="middle" font-size="15" fill="#111111">1210</text>
  <rect x="160" y="216" width="140" height="40" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="230.0" y="242" text-anchor="middle" font-size="15" fill="#111111">Carver plc</text>
  <rect x="300" y="216" width="90" height="40" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="345.0" y="242" text-anchor="middle" font-size="15" fill="#111111">8%</text>
  <rect x="60" y="256" width="100" height="40" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="110.0" y="282" text-anchor="middle" font-size="15" fill="#111111">1008</text>
  <rect x="160" y="256" width="140" height="40" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="230.0" y="282" text-anchor="middle" font-size="15" fill="#111111">Dunmore</text>
  <rect x="300" y="256" width="90" height="40" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="345.0" y="282" text-anchor="middle" font-size="15" fill="#111111">10%</text>
  <rect x="60" y="296" width="100" height="40" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="110.0" y="322" text-anchor="middle" font-size="15" fill="#111111">1301</text>
  <rect x="160" y="296" width="140" height="40" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="230.0" y="322" text-anchor="middle" font-size="15" fill="#111111">Ellis Trading</text>
  <rect x="300" y="296" width="90" height="40" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="345.0" y="322" text-anchor="middle" font-size="15" fill="#111111">4%</text>
  <text x="220" y="360" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Customer 1045 is not in the table.</text>
  <rect x="470" y="100" width="450" height="120" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="695" y="147" text-anchor="middle" font-size="18" fill="#000000" font-weight="bold">Exact match</text>
  <text x="695" y="167" text-anchor="middle" font-size="15" fill="#000000">XLOOKUP(1045, ..., 0) or VLOOKUP(..., FALSE) returns:</text>
  <text x="695" y="187" text-anchor="middle" font-size="15" fill="#000000">Not found / #N/A — the gap is visible</text>
  <rect x="470" y="250" width="450" height="150" rx="6" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="695" y="302" text-anchor="middle" font-size="18" fill="#000000" font-weight="bold">Approximate match (fourth argument omitted)</text>
  <text x="695" y="322" text-anchor="middle" font-size="15" fill="#000000">VLOOKUP(1045, ...) assumes the numbers are sorted and</text>
  <text x="695" y="342" text-anchor="middle" font-size="15" fill="#000000">stops at a nearby lower value. Here it returns 12% —</text>
  <text x="695" y="362" text-anchor="middle" font-size="15" fill="#000000">another customer’s discount, with no error shown</text>
  <line x1="392" y1="176" x2="466" y2="160" stroke="#222222" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="392" y1="176" x2="466" y2="320" stroke="#222222" stroke-width="2.2" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <rect x="60" y="420" width="860" height="80" rx="6" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="490" y="456" text-anchor="middle" font-size="16" fill="#000000">Test every lookup with a key known to be absent. A correct lookup must say so; a silent wrong</text>
  <text x="490" y="476" text-anchor="middle" font-size="16" fill="#000000">value means the match mode is wrong.</text>
  <text x="480.0" y="540" text-anchor="middle" font-size="13" fill="#333333">Illustrative data; the exact row returned by an approximate match depends on the table order.</text>
</svg>
