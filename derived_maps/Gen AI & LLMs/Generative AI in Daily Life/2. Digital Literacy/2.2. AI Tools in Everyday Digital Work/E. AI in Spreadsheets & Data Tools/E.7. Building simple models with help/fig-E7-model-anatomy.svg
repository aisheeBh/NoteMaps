<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The anatomy of a well-built spreadsheet model</title>
  <desc>Three blocks from left to right: inputs with unit and source, calculations laid out on a monthly timeline with one formula per row, and outputs such as break-even month and lowest cash balance. A checks block below confirms that totals agree. A timeline bar runs across the calculations block.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">Anatomy of a spreadsheet model</text>
  <rect x="40" y="90" width="240" height="280" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="160" y="188" text-anchor="middle" font-size="19" fill="#000000" font-weight="bold">INPUTS</text>
  <text x="160" y="208" text-anchor="middle" font-size="15" fill="#000000">One cell each, with unit,</text>
  <text x="160" y="228" text-anchor="middle" font-size="15" fill="#000000">source and date. Price</text>
  <text x="160" y="248" text-anchor="middle" font-size="15" fill="#000000">£4.20 (menu); rent £2,500 a</text>
  <text x="160" y="268" text-anchor="middle" font-size="15" fill="#000000">month (lease); growth 6% a</text>
  <text x="160" y="288" text-anchor="middle" font-size="15" fill="#000000">year (judgement)</text>
  <rect x="330" y="90" width="330" height="280" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="495" y="118" text-anchor="middle" font-size="19" fill="#111111" font-weight="bold">CALCULATIONS</text>
  <rect x="350" y="136" width="56" height="28" rx="0" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="378" y="156" text-anchor="middle" font-size="14" fill="#111111">Jan</text>
  <rect x="410" y="136" width="56" height="28" rx="0" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="438" y="156" text-anchor="middle" font-size="14" fill="#111111">Feb</text>
  <rect x="470" y="136" width="56" height="28" rx="0" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="498" y="156" text-anchor="middle" font-size="14" fill="#111111">Mar</text>
  <rect x="530" y="136" width="56" height="28" rx="0" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="558" y="156" text-anchor="middle" font-size="14" fill="#111111">Apr</text>
  <rect x="590" y="136" width="56" height="28" rx="0" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="618" y="156" text-anchor="middle" font-size="14" fill="#111111">May</text>
  <text x="495" y="186" text-anchor="middle" font-size="14" fill="#111111" font-style="italic">Timeline across the columns</text>
  <rect x="350" y="200" width="296" height="28" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="360" y="219" text-anchor="start" font-size="14" fill="#111111">Units sold</text>
  <rect x="350" y="232" width="296" height="28" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="360" y="251" text-anchor="start" font-size="14" fill="#111111">Revenue = units × price</text>
  <rect x="350" y="264" width="296" height="28" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="360" y="283" text-anchor="start" font-size="14" fill="#111111">Costs</text>
  <rect x="350" y="296" width="296" height="28" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="360" y="315" text-anchor="start" font-size="14" fill="#111111">Net cash flow</text>
  <rect x="350" y="328" width="296" height="28" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="360" y="347" text-anchor="start" font-size="14" fill="#111111">Closing cash</text>
  <rect x="710" y="90" width="210" height="280" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="815" y="198" text-anchor="middle" font-size="19" fill="#000000" font-weight="bold">OUTPUTS</text>
  <text x="815" y="218" text-anchor="middle" font-size="15" fill="#000000">Break-even month;</text>
  <text x="815" y="238" text-anchor="middle" font-size="15" fill="#000000">lowest cash balance;</text>
  <text x="815" y="258" text-anchor="middle" font-size="15" fill="#000000">three-year profit;</text>
  <text x="815" y="278" text-anchor="middle" font-size="15" fill="#000000">charts</text>
  <line x1="280" y1="230" x2="326" y2="230" stroke="#222222" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="660" y1="230" x2="706" y2="230" stroke="#222222" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="330" y="400" width="330" height="90" rx="6" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="495" y="423" text-anchor="middle" font-size="17" fill="#000000" font-weight="bold">CHECKS</text>
  <text x="495" y="442" text-anchor="middle" font-size="14" fill="#000000">Cash movements = change in cash;</text>
  <text x="495" y="461" text-anchor="middle" font-size="14" fill="#000000">sub-totals = totals. All differences</text>
  <text x="495" y="480" text-anchor="middle" font-size="14" fill="#000000">zero.</text>
  <line x1="495" y1="398" x2="495" y2="374" stroke="#222222" stroke-width="2.2" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <rect x="40" y="400" width="240" height="90" rx="6" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="160" y="440" text-anchor="middle" font-size="15" fill="#222222">Flow runs one way: inputs</text>
  <text x="160" y="460" text-anchor="middle" font-size="15" fill="#222222">to calculations to outputs</text>
  <rect x="710" y="400" width="210" height="90" rx="6" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="815" y="430" text-anchor="middle" font-size="15" fill="#222222">One formula per row,</text>
  <text x="815" y="450" text-anchor="middle" font-size="15" fill="#222222">the same in every</text>
  <text x="815" y="470" text-anchor="middle" font-size="15" fill="#222222">period</text>
  <text x="480.0" y="540" text-anchor="middle" font-size="13" fill="#333333">Schematic layout; the example values are illustrative figures.</text>
</svg>
