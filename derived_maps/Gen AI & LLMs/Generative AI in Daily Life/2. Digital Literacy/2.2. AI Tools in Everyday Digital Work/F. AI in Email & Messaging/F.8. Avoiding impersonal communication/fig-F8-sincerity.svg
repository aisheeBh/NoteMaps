<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Perceived sincerity of managers' messages by level of AI help</title>
  <desc>Horizontal bars from a 2025 survey experiment of about 1,100 professionals: 83 per cent judged supervisors sincere when messages had low AI assistance, compared with between 40 and 52 per cent when messages had high AI assistance.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Perceived sincerity of managers' messages by level of AI help</text>
  <text x="330" y="106" text-anchor="end" font-size="15" fill="#111111">Low AI assistance</text>
  <rect x="344" y="86" width="412" height="36" rx="3" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <text x="766" y="110" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">83%</text>
  <text x="330" y="168" text-anchor="end" font-size="15" fill="#111111">High AI assistance (upper value)</text>
  <rect x="344" y="148" width="258" height="36" rx="3" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5"/>
  <text x="612" y="172" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">52%</text>
  <text x="330" y="230" text-anchor="end" font-size="15" fill="#111111">High AI assistance (lower value)</text>
  <rect x="344" y="210" width="198" height="36" rx="3" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5"/>
  <text x="552" y="234" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">40%</text>
  <line x1="344" y1="76" x2="344" y2="266" stroke="#222222" stroke-width="2"/>
  <text x="480" y="328" text-anchor="middle" font-size="13" fill="#333333">Share rating the supervisor as sincere; the high-assistance range covers different message types. Survey experiment reported in</text>
  <text x="480" y="344" text-anchor="middle" font-size="13" fill="#333333">2025.</text>
</svg>
