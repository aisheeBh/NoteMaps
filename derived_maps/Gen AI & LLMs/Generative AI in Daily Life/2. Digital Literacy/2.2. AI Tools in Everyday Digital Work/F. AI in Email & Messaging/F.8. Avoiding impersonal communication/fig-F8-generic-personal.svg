<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Generic and personal versions of the same thank-you</title>
  <desc>Two columns compare a generic AI-style thank-you message with a personal version across five features: opening, specificity, effect described, voice and length.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Generic and personal versions of the same thank-you</text>
  <rect x="24" y="62" width="371" height="44" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="33" y="71" width="353" height="26" rx="4" fill="#FFFFFF"/>
  <text x="210" y="90" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Generic</text>
  <rect x="565" y="62" width="371" height="44" rx="6" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="574" y="71" width="353" height="26" rx="4" fill="#FFFFFF"/>
  <text x="750" y="90" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Personal</text>
  <rect x="405" y="120" width="150" height="66" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="480" y="158" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Opening</text>
  <rect x="24" y="120" width="371" height="66" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="210" y="158" text-anchor="middle" font-size="14.5" fill="#111111">"I hope this message finds you well!"</text>
  <rect x="565" y="120" width="371" height="66" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="750" y="158" text-anchor="middle" font-size="14.5" fill="#111111">"Amira - quick note before the weekend."</text>
  <rect x="405" y="196" width="150" height="66" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="480" y="234" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Specificity</text>
  <rect x="24" y="196" width="371" height="66" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="210" y="234" text-anchor="middle" font-size="14.5" fill="#111111">"Thanks for all your hard work"</text>
  <rect x="565" y="196" width="371" height="66" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="750" y="225" text-anchor="middle" font-size="14.5" fill="#111111">"Your rebuild of the pricing model on</text>
  <text x="750" y="244" text-anchor="middle" font-size="14.5" fill="#111111">Tuesday night"</text>
  <rect x="405" y="272" width="150" height="66" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="480" y="310" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Effect</text>
  <rect x="24" y="272" width="371" height="66" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="210" y="310" text-anchor="middle" font-size="14.5" fill="#111111">"It made a real difference"</text>
  <rect x="565" y="272" width="371" height="66" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="750" y="301" text-anchor="middle" font-size="14.5" fill="#111111">"We kept the client: they cited the clarity</text>
  <text x="750" y="320" text-anchor="middle" font-size="14.5" fill="#111111">of the numbers"</text>
  <rect x="405" y="348" width="150" height="66" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="480" y="386" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Voice</text>
  <rect x="24" y="348" width="371" height="66" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="210" y="386" text-anchor="middle" font-size="14.5" fill="#111111">Polished, interchangeable</text>
  <rect x="565" y="348" width="371" height="66" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="750" y="386" text-anchor="middle" font-size="14.5" fill="#111111">Recognisably the sender's words</text>
  <rect x="405" y="424" width="150" height="66" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="480" y="462" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Length</text>
  <rect x="24" y="424" width="371" height="66" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="210" y="462" text-anchor="middle" font-size="14.5" fill="#111111">Three paragraphs</text>
  <rect x="565" y="424" width="371" height="66" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="750" y="462" text-anchor="middle" font-size="14.5" fill="#111111">Four sentences</text>
  <text x="480" y="534" text-anchor="middle" font-size="13" fill="#333333">Specific detail is the strongest signal that a person, not a template, paid attention.</text>
</svg>
