<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Working hours across three time zones</title>
  <desc>A horizontal chart of 24 hours in Coordinated Universal Time with three bars showing 9 a.m. to 6 p.m. local working hours in summer: London (UTC plus 1) 08:00 to 17:00 UTC; Pune (UTC plus 5:30) 03:30 to 12:30 UTC; New York (UTC minus 4) 13:00 to 22:00 UTC. London overlaps with Pune from 08:00 to 12:30 UTC and with New York from 13:00 to 17:00 UTC, but no hour is inside working hours in all three.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Working hours across three time zones (summer)</text>
  <line x1="210" y1="80" x2="210" y2="330" stroke="#888888" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="210" y="355" text-anchor="middle" font-size="14" fill="#111111">00:00</text>
  <line x1="299" y1="80" x2="299" y2="330" stroke="#888888" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="299" y="355" text-anchor="middle" font-size="14" fill="#111111">03:00</text>
  <line x1="388" y1="80" x2="388" y2="330" stroke="#888888" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="388" y="355" text-anchor="middle" font-size="14" fill="#111111">06:00</text>
  <line x1="476" y1="80" x2="476" y2="330" stroke="#888888" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="476" y="355" text-anchor="middle" font-size="14" fill="#111111">09:00</text>
  <line x1="565" y1="80" x2="565" y2="330" stroke="#888888" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="565" y="355" text-anchor="middle" font-size="14" fill="#111111">12:00</text>
  <line x1="654" y1="80" x2="654" y2="330" stroke="#888888" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="654" y="355" text-anchor="middle" font-size="14" fill="#111111">15:00</text>
  <line x1="742" y1="80" x2="742" y2="330" stroke="#888888" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="742" y="355" text-anchor="middle" font-size="14" fill="#111111">18:00</text>
  <line x1="831" y1="80" x2="831" y2="330" stroke="#888888" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="831" y="355" text-anchor="middle" font-size="14" fill="#111111">21:00</text>
  <line x1="920" y1="80" x2="920" y2="330" stroke="#888888" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="920" y="355" text-anchor="middle" font-size="14" fill="#111111">24:00</text>
  <text x="565" y="385" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Time in UTC (Coordinated Universal Time)</text>
  <text x="196" y="126" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">London (UTC+1)</text>
  <rect x="447" y="100" width="266" height="40" rx="4" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="455" y="109" width="250" height="22" fill="#FFFFFF"/>
  <text x="580" y="125" text-anchor="middle" font-size="14" fill="#111111">09:00-18:00 local</text>
  <text x="196" y="201" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Pune (UTC+5:30)</text>
  <rect x="314" y="175" width="266" height="40" rx="4" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
  <rect x="322" y="184" width="250" height="22" fill="#FFFFFF"/>
  <text x="447" y="200" text-anchor="middle" font-size="14" fill="#111111">09:00-18:00 local</text>
  <text x="196" y="276" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">New York (UTC-4)</text>
  <rect x="595" y="250" width="266" height="40" rx="4" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5"/>
  <rect x="603" y="259" width="250" height="22" fill="#FFFFFF"/>
  <text x="728" y="275" text-anchor="middle" font-size="14" fill="#111111">09:00-18:00 local</text>
  <text x="480" y="424" text-anchor="middle" font-size="13" fill="#333333">Schematic of standard 9-to-6 working days during northern summer time; no single hour falls inside all three.</text>
</svg>
