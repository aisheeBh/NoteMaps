<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Choosing how much help to take for a reply</title>
  <desc>A two-by-two matrix. Horizontal axis: stakes of the message, low to high. Vertical axis: novelty of the content, low to high. Low stakes and routine: accept a chip or quick draft. High stakes and routine: template or AI draft with careful review. Low stakes and novel: AI draft after deciding the answer. High stakes and novel: write it yourself, use AI only to critique.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Choosing how much help to take for a reply</text>
  <rect x="156" y="76" width="373" height="178" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="342" y="146" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Decide, then draft</text>
  <text x="342" y="176" text-anchor="middle" font-size="14.5" fill="#000000">State the answer first; let AI phrase it;</text>
  <text x="342" y="194" text-anchor="middle" font-size="14.5" fill="#000000">edit</text>
  <rect x="541" y="76" width="373" height="178" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="550" y="85" width="355" height="160" rx="4" fill="#FFFFFF"/>
  <text x="728" y="146" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Write it yourself</text>
  <text x="728" y="176" text-anchor="middle" font-size="14.5" fill="#111111">Think and write unaided; AI may critique</text>
  <text x="728" y="194" text-anchor="middle" font-size="14.5" fill="#111111">only</text>
  <rect x="156" y="266" width="373" height="178" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="342" y="336" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Accept and go</text>
  <text x="342" y="366" text-anchor="middle" font-size="14.5" fill="#000000">Reply chip or one-line draft; glance and</text>
  <text x="342" y="384" text-anchor="middle" font-size="14.5" fill="#000000">send</text>
  <rect x="541" y="266" width="373" height="178" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="550" y="275" width="355" height="160" rx="4" fill="#FFFFFF"/>
  <text x="728" y="336" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Approved wording + review</text>
  <text x="728" y="366" text-anchor="middle" font-size="14.5" fill="#111111">Template or AI draft; check every fact and</text>
  <text x="728" y="384" text-anchor="middle" font-size="14.5" fill="#111111">promise</text>
  <line x1="136" y1="464" x2="920" y2="464" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="136" y1="464" x2="136" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="535" y="494" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Stakes: cost if the message is wrong</text>
  <text x="150" y="484" text-anchor="start" font-size="14" fill="#111111">Low</text>
  <text x="910" y="484" text-anchor="end" font-size="14" fill="#111111">High</text>
  <text x="72" y="240" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Novelty of</text>
  <text x="72" y="260" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">the content</text>
  <text x="124" y="446" text-anchor="end" font-size="14" fill="#111111">Routine</text>
  <text x="124" y="100" text-anchor="end" font-size="14" fill="#111111">New</text>
  <text x="480" y="544" text-anchor="middle" font-size="13" fill="#333333">Schematic guide, not a rule: real messages sit along both axes rather than in neat boxes.</text>
</svg>
