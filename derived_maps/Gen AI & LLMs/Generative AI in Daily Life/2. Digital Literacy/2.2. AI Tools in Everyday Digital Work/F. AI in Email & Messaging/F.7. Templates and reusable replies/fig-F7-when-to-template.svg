<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>When a reply should be templated</title>
  <desc>A two-by-two matrix. Horizontal axis: how often the reply is needed. Vertical axis: how much each case varies. Rare and uniform: a personal snippet. Frequent and uniform: a fixed template. Rare and varied: write it fresh. Frequent and varied: modular blocks with AI adaptation and review.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">When a reply should be templated</text>
  <rect x="156" y="76" width="373" height="178" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="342" y="156" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Write it fresh</text>
  <text x="342" y="185" text-anchor="middle" font-size="14.5" fill="#000000">Too rare and too varied to standardise</text>
  <rect x="541" y="76" width="373" height="178" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="550" y="85" width="355" height="160" rx="4" fill="#FFFFFF"/>
  <text x="728" y="146" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Modular + AI adaptation</text>
  <text x="728" y="176" text-anchor="middle" font-size="14.5" fill="#111111">Approved blocks fitted to each case;</text>
  <text x="728" y="194" text-anchor="middle" font-size="14.5" fill="#111111">reviewed</text>
  <rect x="156" y="266" width="373" height="178" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="342" y="346" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Personal snippet</text>
  <text x="342" y="375" text-anchor="middle" font-size="14.5" fill="#111111">Saved text for one's own occasional use</text>
  <rect x="541" y="266" width="373" height="178" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="728" y="336" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Fixed template</text>
  <text x="728" y="366" text-anchor="middle" font-size="14.5" fill="#000000">Approved wording with slots; the classic</text>
  <text x="728" y="384" text-anchor="middle" font-size="14.5" fill="#000000">case</text>
  <line x1="136" y1="464" x2="920" y2="464" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="136" y1="464" x2="136" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="535" y="494" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">How often the reply is needed</text>
  <text x="150" y="484" text-anchor="start" font-size="14" fill="#111111">Rarely</text>
  <text x="910" y="484" text-anchor="end" font-size="14" fill="#111111">Often</text>
  <text x="72" y="230" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">How much</text>
  <text x="72" y="250" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">each case</text>
  <text x="72" y="270" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">varies</text>
  <text x="124" y="446" text-anchor="end" font-size="14" fill="#111111">Little</text>
  <text x="124" y="100" text-anchor="end" font-size="14" fill="#111111">A lot</text>
  <text x="480" y="544" text-anchor="middle" font-size="13" fill="#333333">Schematic guide; regulated content may need fixed wording whatever its frequency.</text>
</svg>
