<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 522" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Anatomy of a well-designed reply template</title>
  <desc>Five layers of a reply template from top to bottom: personal opening written fresh each time; variable slots such as name, dates and reference numbers; the fixed core of approved wording; optional modules chosen to fit the case; and a metadata layer with owner, version and review date that the recipient never sees.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Anatomy of a well-designed reply template</text>
  <rect x="60" y="66" width="840" height="72" rx="6" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="69" y="75" width="822" height="54" rx="4" fill="#FFFFFF"/>
  <text x="82" y="96" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">Personal opening</text>
  <text x="82" y="118" text-anchor="start" font-size="14.5" fill="#111111">One line written fresh for this person and this message</text>
  <rect x="60" y="148" width="840" height="72" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="69" y="157" width="822" height="54" rx="4" fill="#FFFFFF"/>
  <text x="82" y="178" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">Variable slots</text>
  <text x="82" y="200" text-anchor="start" font-size="14.5" fill="#111111">{NAME}, {DATE}, {ORDER NO.} - visibly marked until filled</text>
  <rect x="60" y="230" width="840" height="72" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="82" y="260" text-anchor="start" font-size="16" font-weight="bold" fill="#FFFFFF">Fixed core</text>
  <text x="82" y="282" text-anchor="start" font-size="14.5" fill="#FFFFFF">Approved wording for facts, policy and commitments</text>
  <rect x="60" y="312" width="840" height="72" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="82" y="342" text-anchor="start" font-size="16" font-weight="bold" fill="#000000">Optional modules</text>
  <text x="82" y="364" text-anchor="start" font-size="14.5" fill="#000000">Paragraphs added only when they apply to this case</text>
  <rect x="60" y="394" width="840" height="72" rx="6" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="82" y="424" text-anchor="start" font-size="16" font-weight="bold" fill="#222222">Metadata (not sent)</text>
  <text x="82" y="446" text-anchor="start" font-size="14.5" fill="#222222">Owner, version, last review date, when not to use</text>
  <text x="480" y="506" text-anchor="middle" font-size="13" fill="#333333">The fixed core carries accuracy; the personal opening carries the relationship.</text>
</svg>
