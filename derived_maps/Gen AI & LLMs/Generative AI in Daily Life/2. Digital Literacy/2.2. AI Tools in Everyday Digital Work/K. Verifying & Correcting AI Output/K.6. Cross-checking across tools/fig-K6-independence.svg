<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>How independent is the second check?</title>
  <desc>Five boxes from left to right showing increasing independence of a cross-check: the same tool asked again, a different model from the same family, a model from a different developer, a non-AI method such as a calculator or search of an official database, and the primary authority itself.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="40" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">How independent is the second check?</text>
  <rect x="28.0" y="72" width="171.2" height="230" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="113.6" y="105" text-anchor="middle" font-size="17" fill="#222222" font-weight="bold">Same tool,</text>
  <text x="113.6" y="128.0" text-anchor="middle" font-size="17" fill="#222222" font-weight="bold">asked again</text>
  <text x="113.6" y="150.9" text-anchor="middle" font-size="15" fill="#222222">Shares everything:</text>
  <text x="113.6" y="171.2" text-anchor="middle" font-size="15" fill="#222222">data, design,</text>
  <text x="113.6" y="191.4" text-anchor="middle" font-size="15" fill="#222222">prompt framing</text>
  <text x="113.6" y="211.7" text-anchor="middle" font-size="15" fill="#222222"></text>
  <text x="113.6" y="231.9" text-anchor="middle" font-size="15" fill="#222222">Catches random</text>
  <text x="113.6" y="252.2" text-anchor="middle" font-size="15" fill="#222222">slips only</text>
  <rect x="211.2" y="72" width="171.2" height="230" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="296.79999999999995" y="105" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Related</text>
  <text x="296.79999999999995" y="128.0" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">model</text>
  <text x="296.79999999999995" y="150.9" text-anchor="middle" font-size="15" fill="#111111">Same developer</text>
  <text x="296.79999999999995" y="171.2" text-anchor="middle" font-size="15" fill="#111111">or family</text>
  <text x="296.79999999999995" y="191.4" text-anchor="middle" font-size="15" fill="#111111"></text>
  <text x="296.79999999999995" y="211.7" text-anchor="middle" font-size="15" fill="#111111">Shares much</text>
  <text x="296.79999999999995" y="231.9" text-anchor="middle" font-size="15" fill="#111111">training data</text>
  <rect x="394.4" y="72" width="171.2" height="230" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="480.0" y="105" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Different</text>
  <text x="480.0" y="128.0" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">developer</text>
  <text x="480.0" y="150.9" text-anchor="middle" font-size="15" fill="#111111">Different design,</text>
  <text x="480.0" y="171.2" text-anchor="middle" font-size="15" fill="#111111">overlapping data</text>
  <text x="480.0" y="191.4" text-anchor="middle" font-size="15" fill="#111111"></text>
  <text x="480.0" y="211.7" text-anchor="middle" font-size="15" fill="#111111">Errors still</text>
  <text x="480.0" y="231.9" text-anchor="middle" font-size="15" fill="#111111">often shared</text>
  <rect x="577.6" y="72" width="171.2" height="230" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="663.2" y="105" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Non-AI</text>
  <text x="663.2" y="128.0" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">method</text>
  <text x="663.2" y="150.9" text-anchor="middle" font-size="15" fill="#111111">Calculator, code,</text>
  <text x="663.2" y="171.2" text-anchor="middle" font-size="15" fill="#111111">search, database</text>
  <text x="663.2" y="191.4" text-anchor="middle" font-size="15" fill="#111111"></text>
  <text x="663.2" y="211.7" text-anchor="middle" font-size="15" fill="#111111">Different way</text>
  <text x="663.2" y="231.9" text-anchor="middle" font-size="15" fill="#111111">of failing</text>
  <rect x="760.8" y="72" width="171.2" height="230" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="846.4" y="105" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Primary</text>
  <text x="846.4" y="128.0" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">authority</text>
  <text x="846.4" y="150.9" text-anchor="middle" font-size="15" fill="#111111">The document,</text>
  <text x="846.4" y="171.2" text-anchor="middle" font-size="15" fill="#111111">record, official</text>
  <text x="846.4" y="191.4" text-anchor="middle" font-size="15" fill="#111111">source itself</text>
  <text x="846.4" y="211.7" text-anchor="middle" font-size="15" fill="#111111"></text>
  <text x="846.4" y="231.9" text-anchor="middle" font-size="15" fill="#111111">Settles the</text>
  <text x="846.4" y="252.2" text-anchor="middle" font-size="15" fill="#111111">question</text>
  <line x1="60" y1="330" x2="900" y2="330" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="480" y="358" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">more independent: errors less likely to be shared</text>
  <text x="480.0" y="398" text-anchor="middle" font-size="14" fill="#333333" font-style="italic">Schematic; the independence of any two tools depends on their data, design and the question asked.</text>
</svg>
