<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Effects of error management training</title>
  <desc>Three bars showing effect sizes reported in a 2008 meta-analysis of error management training by Keith and Frese: overall effect d equals 0.44; effect on performance after training d equals 0.56; effect on adaptive transfer to structurally different tasks d equals 0.80.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="40" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">Error management training compared with error-avoidant training</text>
  <rect x="170" y="234.8" width="160" height="145.2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
  <rect x="200" y="198.8" width="100" height="28" fill="#FFFFFF"/>
  <text x="250" y="219.8" text-anchor="middle" font-size="18" fill="#111111" font-weight="bold">d = 0.44</text>
  <text x="250" y="404" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Overall</text>
  <rect x="400" y="195.2" width="160" height="184.8" fill="url(#dots)" stroke="#7A5200" stroke-width="2.5"/>
  <rect x="430" y="159.2" width="100" height="28" fill="#FFFFFF"/>
  <text x="480" y="180.2" text-anchor="middle" font-size="18" fill="#111111" font-weight="bold">d = 0.56</text>
  <text x="480" y="404" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">After training</text>
  <text x="480" y="424" text-anchor="middle" font-size="15" fill="#111111">(post-training)</text>
  <rect x="630" y="116.0" width="160" height="264.0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="660" y="80.0" width="100" height="28" fill="#FFFFFF"/>
  <text x="710" y="101.0" text-anchor="middle" font-size="18" fill="#111111" font-weight="bold">d = 0.80</text>
  <text x="710" y="404" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Novel, different</text>
  <text x="710" y="424" text-anchor="middle" font-size="15" fill="#111111">tasks (adaptive)</text>
  <line x1="120" y1="380" x2="860" y2="380" stroke="#222222" stroke-width="2"/>
  <text x="480.0" y="455" text-anchor="middle" font-size="14" fill="#333333" font-style="italic">Effect sizes (Cohen's d) reported by Keith and Frese (2008): 24 studies, 2,183 participants.</text>
</svg>
