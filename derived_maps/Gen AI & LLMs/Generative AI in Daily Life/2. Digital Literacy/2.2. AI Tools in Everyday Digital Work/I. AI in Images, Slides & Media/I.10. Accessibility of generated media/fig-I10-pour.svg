<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Four principles of accessible media</title>
<desc>The four WCAG principles - perceivable, operable, understandable, robust - each applied to generated images, slides, audio and video.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<pattern id="grey" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#E6E6E6"/><circle cx="5" cy="5" r="1" fill="#666666"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40.0" font-size="22" font-weight="bold" text-anchor="middle" fill="#111111">Four principles applied to generated media</text>
<rect x="24" y="86.0" width="912" height="79.0" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<text x="48.0" y="130.5" font-size="16" font-weight="bold" text-anchor="start" fill="#FFFFFF">Perceivable</text>
<text x="254.0" y="121.4" font-size="14" font-weight="normal" text-anchor="start" fill="#FFFFFF">Alt text for images; captions and transcripts; audio description; contrast; no meaning</text>
<text x="254.0" y="139.6" font-size="14" font-weight="normal" text-anchor="start" fill="#FFFFFF">by colour alone</text>
<rect x="24" y="173.0" width="912" height="79.0" rx="6" fill="#EAF2FA" stroke="#1F3B5C" stroke-width="2"/>
<rect x="26" y="175.0" width="14" height="75.0" fill="url(#hatch)"/>
<text x="48.0" y="217.5" font-size="16" font-weight="bold" text-anchor="start" fill="#111111">Operable</text>
<text x="254.0" y="208.4" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">No flashing above safe thresholds; pausable motion and autoplay; keyboard-usable players</text>
<text x="254.0" y="226.6" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">and slides</text>
<rect x="24" y="260.0" width="912" height="79.0" rx="6" fill="#FFF6DD" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<rect x="26" y="262.0" width="14" height="75.0" fill="url(#dots)"/>
<text x="48.0" y="304.5" font-size="16" font-weight="bold" text-anchor="start" fill="#111111">Understandable</text>
<text x="254.0" y="304.5" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Plain language on visuals; consistent layouts; clear slide titles and reading order</text>
<rect x="24" y="347.0" width="912" height="79.0" rx="6" fill="#EEF7EE" stroke="#1E5E24" stroke-width="3"/>
<rect x="27" y="350.0" width="14" height="73.0" fill="url(#cross)"/>
<text x="48.0" y="391.5" font-size="16" font-weight="bold" text-anchor="start" fill="#111111">Robust</text>
<text x="254.0" y="391.5" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Real text not pictures of text; tagged documents and slides; standard caption formats</text>
<text x="480.0" y="456.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#333333" font-style="italic">Principles from the Web Content Accessibility Guidelines (WCAG).</text>
</svg>