<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>What AI changed in media work and what it did not</title>
<desc>Comparison of the aspects of media work transformed by AI with those that remain unchanged.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<pattern id="grey" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#E6E6E6"/><circle cx="5" cy="5" r="1" fill="#666666"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40.0" font-size="22" font-weight="bold" text-anchor="middle" fill="#111111">What changed, and what did not</text>
<text x="480.0" y="64.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#333333">New capability, old obligations</text>
<rect x="24.0" y="90" width="293.3333333333333" height="302" rx="6" fill="#FFF6DD" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<rect x="26.0" y="92" width="289.3333333333333" height="10" fill="url(#dots)"/>
<text x="170.7" y="124.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">Changed</text>
<text x="170.7" y="152.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">Cost of making images, audio and</text>
<text x="170.7" y="172.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">video falls towards zero</text>
<text x="170.7" y="198.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">Skill barrier to editing and</text>
<text x="170.7" y="218.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">design lowered</text>
<text x="170.7" y="244.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">Volume of media multiplied</text>
<text x="170.7" y="271.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">Realism no longer proves capture</text>
<rect x="333.3333333333333" y="90" width="293.3333333333333" height="302" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<text x="480.0" y="114.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Not changed</text>
<text x="480.0" y="142.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#FFFFFF">Audiences treat photographs and</text>
<text x="480.0" y="162.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#FFFFFF">recordings as evidence</text>
<text x="480.0" y="188.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#FFFFFF">Someone is accountable for what</text>
<text x="480.0" y="208.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#FFFFFF">is published</text>
<text x="480.0" y="234.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#FFFFFF">Rights of creators and people</text>
<text x="480.0" y="254.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#FFFFFF">depicted</text>
<text x="480.0" y="280.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#FFFFFF">Need for accessible, accurate</text>
<text x="480.0" y="300.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#FFFFFF">communication</text>
<rect x="642.6666666666666" y="90" width="293.3333333333333" height="302" rx="6" fill="#EEF7EE" stroke="#1E5E24" stroke-width="3"/>
<rect x="645.6666666666666" y="93" width="287.3333333333333" height="10" fill="url(#cross)"/>
<text x="789.3" y="124.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">Consequence</text>
<text x="789.3" y="152.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">Deciding and checking become the</text>
<text x="789.3" y="172.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">main work</text>
<text x="789.3" y="198.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">Process and records matter more</text>
<text x="789.3" y="225.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">Trust becomes a scarce asset</text>
<text x="789.3" y="251.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">Judgement is the professional</text>
<text x="789.3" y="271.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">skill</text>
</svg>