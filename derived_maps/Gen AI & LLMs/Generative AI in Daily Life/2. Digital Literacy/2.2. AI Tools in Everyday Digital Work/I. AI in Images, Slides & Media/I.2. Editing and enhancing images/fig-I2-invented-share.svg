<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>How much of an edited image is invented</title>
<desc>Schematic bars comparing common edits by the share of the final image that the software has newly created rather than taken from the camera.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<pattern id="grey" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#E6E6E6"/><circle cx="5" cy="5" r="1" fill="#666666"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40.0" font-size="22" font-weight="bold" text-anchor="middle" fill="#111111">How much of the result did the camera capture?</text>
<text x="480.0" y="64.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#333333">Share of the final image newly synthesised by software</text>
<text x="332.0" y="120.5" font-size="15" font-weight="normal" text-anchor="end" fill="#111111">Exposure and colour correction</text>
<rect x="344" y="100.0" width="9.5" height="31.0" fill="url(#hatch)" stroke="#222222" stroke-width="1.5"/>
<rect x="359.5" y="104.5" width="232" height="22" fill="#FFFFFF"/>
<text x="363.5" y="120.5" font-size="14" font-weight="bold" text-anchor="start" fill="#111111">values remapped, nothing new</text>
<text x="332.0" y="172.2" font-size="15" font-weight="normal" text-anchor="end" fill="#111111">Noise reduction</text>
<rect x="344" y="151.66666666666666" width="57.1" height="31.0" fill="url(#hatch)" stroke="#222222" stroke-width="1.5"/>
<rect x="407.1" y="156.2" width="176" height="22" fill="#FFFFFF"/>
<text x="411.1" y="172.2" font-size="14" font-weight="bold" text-anchor="start" fill="#111111">fine detail estimated</text>
<text x="332.0" y="223.8" font-size="15" font-weight="normal" text-anchor="end" fill="#111111">Background removal</text>
<rect x="344" y="203.33333333333331" width="38.1" height="31.0" fill="url(#dots)" stroke="#222222" stroke-width="1.5"/>
<rect x="388.1" y="207.8" width="128" height="22" fill="#FFFFFF"/>
<text x="392.1" y="223.8" font-size="14" font-weight="bold" text-anchor="start" fill="#111111">edges estimated</text>
<text x="332.0" y="275.5" font-size="15" font-weight="normal" text-anchor="end" fill="#111111">Object removal (inpainting)</text>
<rect x="344" y="255.0" width="142.8" height="31.0" fill="url(#dots)" stroke="#222222" stroke-width="1.5"/>
<rect x="492.8" y="259.5" width="224" height="22" fill="#FFFFFF"/>
<text x="496.8" y="275.5" font-size="14" font-weight="bold" text-anchor="start" fill="#111111">hole filled with new pixels</text>
<text x="332.0" y="327.2" font-size="15" font-weight="normal" text-anchor="end" fill="#111111">Generative expand (outpainting)</text>
<rect x="344" y="306.66666666666663" width="261.8" height="31.0" fill="url(#lines)" stroke="#222222" stroke-width="1.5"/>
<rect x="611.8" y="311.2" width="216" height="22" fill="#FFFFFF"/>
<text x="615.8" y="327.2" font-size="14" font-weight="bold" text-anchor="start" fill="#111111">new scene beyond the frame</text>
<text x="332.0" y="378.8" font-size="15" font-weight="normal" text-anchor="end" fill="#111111">4x upscaling</text>
<rect x="344" y="358.3333333333333" width="447.4" height="31.0" fill="url(#lines)" stroke="#222222" stroke-width="1.5"/>
<rect x="797.4" y="362.8" width="104" height="22" fill="#FFFFFF"/>
<text x="801.4" y="378.8" font-size="14" font-weight="bold" text-anchor="start" fill="#111111">15 of 16 new</text>
<line x1="344" y1="92" x2="344" y2="410" stroke="#222222" stroke-width="2"/>
<text x="582.0" y="414.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#333333">0%  to  100% of pixels synthesised</text>
<text x="480.0" y="466.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#333333" font-style="italic">Schematic, except 4x upscaling (1 - 1/16 of pixels are new); real shares depend on the image and tool.</text>
</svg>