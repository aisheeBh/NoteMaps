<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Four principles of layout</title>
<desc>Contrast, repetition, alignment and proximity, each with what it does and a typical fault.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<pattern id="grey" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#E6E6E6"/><circle cx="5" cy="5" r="1" fill="#666666"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40.0" font-size="22" font-weight="bold" text-anchor="middle" fill="#111111">Four principles behind most good design suggestions</text>
<text x="480.0" y="64.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#333333">After Robin Williams's summary of layout principles for non-designers</text>
<rect x="24.0" y="90" width="216.0" height="282" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<text x="132.0" y="114.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Contrast</text>
<text x="132.0" y="142.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#FFFFFF">Make different things</text>
<text x="132.0" y="162.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#FFFFFF">clearly different</text>
<text x="132.0" y="188.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#FFFFFF">Size, weight, colour,</text>
<text x="132.0" y="208.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#FFFFFF">space</text>
<text x="132.0" y="234.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#FFFFFF">Fault: five similar</text>
<text x="132.0" y="254.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#FFFFFF">font sizes</text>
<rect x="256.0" y="90" width="216.0" height="282" rx="6" fill="#EAF2FA" stroke="#1F3B5C" stroke-width="2"/>
<rect x="258.0" y="92" width="212.0" height="10" fill="url(#hatch)"/>
<text x="364.0" y="124.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">Repetition</text>
<text x="364.0" y="152.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">Repeat styles, colours</text>
<text x="364.0" y="172.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">and positions</text>
<text x="364.0" y="198.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">Builds unity across</text>
<text x="364.0" y="218.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">slides</text>
<text x="364.0" y="244.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">Fault: every slide a</text>
<text x="364.0" y="264.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">new layout</text>
<rect x="488.0" y="90" width="216.0" height="282" rx="6" fill="#FFF6DD" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<rect x="490.0" y="92" width="212.0" height="10" fill="url(#dots)"/>
<text x="596.0" y="124.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">Alignment</text>
<text x="596.0" y="152.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">Every element lines up</text>
<text x="596.0" y="172.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">with something</text>
<text x="596.0" y="198.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">An invisible grid</text>
<text x="596.0" y="225.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">Fault: boxes placed by</text>
<text x="596.0" y="244.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">eye</text>
<rect x="720.0" y="90" width="216.0" height="282" rx="6" fill="#EEF7EE" stroke="#1E5E24" stroke-width="3"/>
<rect x="723.0" y="93" width="210.0" height="10" fill="url(#cross)"/>
<text x="828.0" y="124.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">Proximity</text>
<text x="828.0" y="152.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">Group related items;</text>
<text x="828.0" y="172.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">separate unrelated ones</text>
<text x="828.0" y="198.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">Space shows structure</text>
<text x="828.0" y="225.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">Fault: label far from</text>
<text x="828.0" y="244.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">its chart</text>
</svg>