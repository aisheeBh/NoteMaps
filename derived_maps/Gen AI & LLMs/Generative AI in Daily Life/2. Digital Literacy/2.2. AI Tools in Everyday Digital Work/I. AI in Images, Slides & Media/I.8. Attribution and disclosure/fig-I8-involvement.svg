<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Degrees of AI involvement</title>
<desc>Five degrees of AI involvement in a piece of media, from routine tool features to fully synthetic content, with typical disclosure expectations.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<pattern id="grey" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#E6E6E6"/><circle cx="5" cy="5" r="1" fill="#666666"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40.0" font-size="22" font-weight="bold" text-anchor="middle" fill="#111111">Disclosure expectations rise with AI's part in what the audience sees</text>
<rect x="24.0" y="100" width="172.8" height="220" rx="6" fill="#F2F2F2" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/>
<rect x="25.5" y="101.5" width="169.8" height="10" fill="url(#grey)"/>
<text x="110.4" y="134.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">Routine tool</text>
<text x="110.4" y="153.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">features</text>
<text x="110.4" y="180.5" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">Auto-exposure,</text>
<text x="110.4" y="198.7" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">spell-check, noise</text>
<text x="110.4" y="216.9" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">reduction</text>
<text x="110.4" y="242.1" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">Disclosure not</text>
<text x="110.4" y="260.3" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">expected</text>
<rect x="208.8" y="100" width="172.8" height="220" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="295.2" y="124.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">AI-assisted</text>
<text x="295.2" y="143.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">drafting</text>
<text x="295.2" y="170.5" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">Layout suggestions,</text>
<text x="295.2" y="188.7" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">transcription,</text>
<text x="295.2" y="206.9" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">rough cuts</text>
<text x="295.2" y="232.1" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">Usually internal</text>
<text x="295.2" y="250.3" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">record only</text>
<rect x="393.6" y="100" width="172.8" height="220" rx="6" fill="#EAF2FA" stroke="#1F3B5C" stroke-width="2"/>
<rect x="395.6" y="102" width="168.8" height="10" fill="url(#hatch)"/>
<text x="480.0" y="134.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">AI-generated</text>
<text x="480.0" y="153.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">elements</text>
<text x="480.0" y="180.5" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">Generated</text>
<text x="480.0" y="198.7" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">background,</text>
<text x="480.0" y="216.9" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">illustration, music</text>
<text x="480.0" y="235.1" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">bed</text>
<text x="480.0" y="260.3" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">Credit line or</text>
<text x="480.0" y="278.5" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">policy disclosure</text>
<rect x="578.4000000000001" y="100" width="172.8" height="220" rx="6" fill="#FFF6DD" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<rect x="580.4000000000001" y="102" width="168.8" height="10" fill="url(#dots)"/>
<text x="664.8" y="134.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">Substantially</text>
<text x="664.8" y="153.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">synthetic</text>
<text x="664.8" y="180.5" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">Most of the image,</text>
<text x="664.8" y="198.7" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">video or voice</text>
<text x="664.8" y="216.9" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">generated</text>
<text x="664.8" y="242.1" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">Clear label to the</text>
<text x="664.8" y="260.3" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">audience</text>
<rect x="763.2" y="100" width="172.8" height="220" rx="6" fill="#FCEDED" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<rect x="765.7" y="102.5" width="167.8" height="10" fill="url(#lines)"/>
<text x="849.6" y="134.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">Realistic synthetic</text>
<text x="849.6" y="153.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">people or events</text>
<text x="849.6" y="180.5" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">Could be taken as</text>
<text x="849.6" y="198.7" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">real</text>
<text x="849.6" y="223.9" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">Prominent label;</text>
<text x="849.6" y="242.1" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">often a legal duty</text>
<line x1="40" y1="350" x2="920" y2="350" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
<text x="40.0" y="376.0" font-size="15" font-weight="bold" text-anchor="start" fill="#111111">AI in the background</text>
<text x="920.0" y="376.0" font-size="15" font-weight="bold" text-anchor="end" fill="#111111">AI is the content</text>
<text x="480.0" y="416.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#333333" font-style="italic">Schematic; laws, platforms and sector codes set specific thresholds.</text>
</svg>