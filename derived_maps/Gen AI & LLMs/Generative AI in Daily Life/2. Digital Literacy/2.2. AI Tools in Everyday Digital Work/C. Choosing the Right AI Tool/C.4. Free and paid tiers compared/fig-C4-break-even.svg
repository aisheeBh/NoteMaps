<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Subscription against metered cost</title>
  <desc>Line chart. Horizontal axis tasks per month from 0 to 800. A flat solid line at 20 dollars for a subscription. A dashed rising line for metered use at 5 cents per task, crossing the subscription at 400 tasks. Left of the crossing metered is cheaper; right of it the subscription is cheaper.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Below the break-even point, paying per use is cheaper</text>
  <line x1="130.0" y1="440.0" x2="890.0" y2="440.0" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="130.0" y1="440.0" x2="130.0" y2="80.0" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="510.0" y="484.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Tasks per month</text>
  <text x="86.0" y="260.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111" transform="rotate(-90 86 260.0)">Monthly cost (US$)</text>
  <text x="130.0" y="462.0" text-anchor="middle" font-size="14" fill="#111111">0</text>
  <text x="312.5" y="462.0" text-anchor="middle" font-size="14" fill="#111111">200</text>
  <text x="495.0" y="462.0" text-anchor="middle" font-size="14" fill="#111111">400</text>
  <text x="677.5" y="462.0" text-anchor="middle" font-size="14" fill="#111111">600</text>
  <text x="860.0" y="462.0" text-anchor="middle" font-size="14" fill="#111111">800</text>
  <line x1="130.0" y1="355.0" x2="860.0" y2="355.0" stroke="#999999" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="120.0" y="360.0" text-anchor="end" font-size="14" fill="#111111">10</text>
  <line x1="130.0" y1="270.0" x2="860.0" y2="270.0" stroke="#999999" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="120.0" y="275.0" text-anchor="end" font-size="14" fill="#111111">20</text>
  <line x1="130.0" y1="185.0" x2="860.0" y2="185.0" stroke="#999999" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="120.0" y="190.0" text-anchor="end" font-size="14" fill="#111111">30</text>
  <line x1="130.0" y1="100.0" x2="860.0" y2="100.0" stroke="#999999" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="120.0" y="105.0" text-anchor="end" font-size="14" fill="#111111">40</text>
  <path d="M130.0 270.0 L860.0 270.0" fill="none" stroke="#111111" stroke-width="4"/>
  <path d="M130.0 440.0 L860.0 100.0" fill="none" stroke="#111111" stroke-width="4" stroke-dasharray="10 6"/>
  <circle cx="495.0" cy="270.0" r="8" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <text x="511.0" y="300.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">Break-even: 400 tasks</text>
  <text x="860.0" y="258.0" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Subscription: flat US$20</text>
  <text x="604.5" y="151.0" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Metered: US$0.05 per task</text>
  <text x="312.5" y="426.0" text-anchor="middle" font-size="15" font-style="italic" fill="#111111">Fewer tasks: metered cheaper</text>
  <text x="714.0" y="426.0" text-anchor="middle" font-size="15" font-style="italic" fill="#111111">More tasks: subscription cheaper</text>
  <text x="480.0" y="522.0" text-anchor="middle" font-size="13.5" font-style="italic" fill="#333333">Illustrative prices; real per-task costs vary with model, task length and provider.</text>
</svg>
