  <text x="189.1" y="482.0" text-anchor="middle" font-size="14" fill="#111111">2</text>
  <text x="258.2" y="482.0" text-anchor="middle" font-size="14" fill="#111111">3</text>
  <text x="327.3" y="482.0" text-anchor="middle" font-size="14" fill="#111111">4</text>
  <text x="396.4" y="482.0" text-anchor="middle" font-size="14" fill="#111111">5</text>
  <text x="465.5" y="482.0" text-anchor="middle" font-size="14" fill="#111111">6</text>
  <text x="534.5" y="482.0" text-anchor="middle" font-size="14" fill="#111111">7</text>
  <text x="603.6" y="482.0" text-anchor="middle" font-size="14" fill="#111111">8</text>
  <text x="672.7" y="482.0" text-anchor="middle" font-size="14" fill="#111111">9</text>
