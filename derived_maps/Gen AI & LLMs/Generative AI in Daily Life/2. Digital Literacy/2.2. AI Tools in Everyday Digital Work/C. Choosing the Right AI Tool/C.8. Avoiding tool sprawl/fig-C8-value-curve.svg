<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Value curve of tools</title>
  <desc>Line chart. Horizontal axis number of AI tools in use, 1 to 12. A dashed rising and flattening line shows gross benefit. A dotted steadily rising line shows overhead: cost, switching, security and governance. A solid line shows net value, rising to a peak at about three tools then falling steadily as more tools are added.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">More tools add overhead faster than they add value</text>
  <line x1="120.0" y1="460.0" x2="900.0" y2="460.0" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="120.0" y1="460.0" x2="120.0" y2="80.0" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="510.0" y="504.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Number of AI tools in use</text>
  <text x="76.0" y="270.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111" transform="rotate(-90 76 270.0)">Value (relative)</text>
  <line x1="120.0" y1="380.0" x2="880.0" y2="380.0" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="128.0" y="400.0" text-anchor="start" font-size="14" fill="#111111">Zero net value</text>
