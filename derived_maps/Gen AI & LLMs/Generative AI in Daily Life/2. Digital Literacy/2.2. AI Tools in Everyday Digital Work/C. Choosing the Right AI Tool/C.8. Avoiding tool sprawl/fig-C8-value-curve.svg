  <text x="880.0" y="482.0" text-anchor="middle" font-size="14" fill="#111111">12</text>
  <text x="534.5" y="109.3" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Gross benefit</text>
  <text x="824.7" y="190.0" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Overhead</text>
  <text x="672.7" y="332.9" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Net value</text>
  <circle cx="275.5" cy="219.1" r="7" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <rect x="145.5" y="175.1" width="270" height="24" fill="#FFFFFF"/>
  <text x="280.5" y="193.1" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Smallest set covering distinct jobs</text>
  <text x="480.0" y="545.0" text-anchor="middle" font-size="13.5" font-style="italic" fill="#333333">Schematic; not plotted from a single dataset.</text>
</svg>
