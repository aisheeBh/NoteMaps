<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The jam study</title>
  <desc>Two pairs of bars. Share of passers-by who stopped: 24 jams about 60 percent, 6 jams about 40 percent. Share of those who stopped who bought: 24 jams about 3 percent, 6 jams about 30 percent.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">More options drew attention but fewer decisions</text>
  <text x="60.0" y="100.0" text-anchor="start" font-size="18" font-weight="bold" fill="#111111">Stopped at the stand</text>
  <text x="230.0" y="140.0" text-anchor="end" font-size="15" fill="#111111">24 jams</text>
  <rect x="240.0" y="118.0" width="390.0" height="36.0" rx="3" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="640.0" y="142.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">about 60%</text>
  <text x="230.0" y="190.0" text-anchor="end" font-size="15" fill="#111111">6 jams</text>
  <rect x="240.0" y="168.0" width="260.0" height="36.0" rx="3" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="510.0" y="192.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">about 40%</text>
  <text x="60.0" y="260.0" text-anchor="start" font-size="18" font-weight="bold" fill="#111111">Of those, bought jam</text>
  <text x="230.0" y="300.0" text-anchor="end" font-size="15" fill="#111111">24 jams</text>
  <rect x="240.0" y="278.0" width="19.5" height="36.0" rx="3" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="269.5" y="302.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">about 3%</text>
  <text x="230.0" y="350.0" text-anchor="end" font-size="15" fill="#111111">6 jams</text>
  <rect x="240.0" y="328.0" width="195.0" height="36.0" rx="3" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="445.0" y="352.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">about 30%</text>
  <text x="480.0" y="440.0" text-anchor="middle" font-size="13.5" font-style="italic" fill="#333333">Iyengar and Lepper (2000). Later meta-analyses found choice overload to be conditional, not universal.</text>
</svg>
