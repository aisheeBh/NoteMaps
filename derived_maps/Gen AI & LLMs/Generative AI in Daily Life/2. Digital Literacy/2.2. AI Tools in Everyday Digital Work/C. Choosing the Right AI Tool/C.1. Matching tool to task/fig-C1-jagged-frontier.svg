<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The jagged frontier of AI competence</title>
  <desc>Tasks arranged by apparent difficulty. A jagged boundary separates tasks the AI does well from those it does badly; some easy-looking tasks fall outside and some hard-looking tasks fall inside. Inside, AI raised speed and quality; outside, AI users were less often correct.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">The jagged frontier: similar-looking tasks, different outcomes</text>
  <line x1="110.0" y1="470.0" x2="900.0" y2="470.0" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="110.0" y1="470.0" x2="110.0" y2="80.0" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="505.0" y="514.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Apparent difficulty of the task to a person</text>
  <text x="66.0" y="275.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111" transform="rotate(-90 66 275.0)">AI performance</text>
  <text x="110.0" y="492.0" text-anchor="start" font-size="14" fill="#111111">Easy</text>
  <text x="900.0" y="492.0" text-anchor="end" font-size="14" fill="#111111">Hard</text>
  <text x="100.0" y="466.0" text-anchor="end" font-size="14" fill="#111111">Poor</text>
  <text x="100.0" y="94.0" text-anchor="end" font-size="14" fill="#111111">Strong</text>
  <path d="M110.0 150.0 L190.0 170.0 L230.0 300.0 L270.0 160.0 L350.0 190.0 L400.0 330.0 L440.0 210.0 L520.0 240.0 L560.0 380.0 L610.0 260.0 L690.0 300.0 L730.0 420.0 L780.0 330.0 L870.0 380.0" fill="none" stroke="#111111" stroke-width="3.5"/>
  <text x="790.0" y="316.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Frontier</text>
  <circle cx="160.0" cy="120.0" r="8" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <text x="174.0" y="125.0" text-anchor="start" font-size="14" fill="#111111">Rewording</text>
  <circle cx="300.0" cy="135.0" r="8" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <text x="314.0" y="140.0" text-anchor="start" font-size="14" fill="#111111">Summarising</text>
  <circle cx="470.0" cy="175.0" r="8" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <text x="484.0" y="180.0" text-anchor="start" font-size="14" fill="#111111">Idea generation</text>
  <circle cx="640.0" cy="230.0" r="8" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <text x="654.0" y="235.0" text-anchor="start" font-size="14" fill="#111111">Drafting a memo</text>
  <rect x="222" y="337" width="16" height="16" fill="#FFFFFF" stroke="#8B0000" stroke-width="2.5"/>
  <text x="244.0" y="350.0" text-anchor="start" font-size="14" fill="#111111">Counting words</text>
  <rect x="392" y="372" width="16" height="16" fill="#FFFFFF" stroke="#8B0000" stroke-width="2.5"/>
  <text x="414.0" y="385.0" text-anchor="start" font-size="14" fill="#111111">Exact citations</text>
  <rect x="552" y="417" width="16" height="16" fill="#FFFFFF" stroke="#8B0000" stroke-width="2.5"/>
  <text x="574.0" y="430.0" text-anchor="start" font-size="14" fill="#111111">Subtle evidence</text>
  <rect x="640.0" y="90.0" width="250.0" height="74.0" rx="8" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="648.0" y="105.2" width="234.0" height="45.4" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="765.0" y="122.7" text-anchor="middle" font-size="14.5" fill="#111111">Inside: about 25% faster,</text>
  <text x="765.0" y="141.5" text-anchor="middle" font-size="14.5" fill="#111111">about 40% higher quality</text>
  <rect x="130.0" y="392.0" width="220.0" height="62.0" rx="8" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="138.0" y="401.1" width="204.0" height="45.4" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="240.0" y="418.6" text-anchor="middle" font-size="14.5" fill="#111111">Outside: about 19 points</text>
  <text x="240.0" y="437.5" text-anchor="middle" font-size="14.5" fill="#111111">less often correct</text>
  <text x="130.0" y="70.0" text-anchor="start" font-size="14" fill="#111111">Circle: task inside the frontier.   Square: task outside it.</text>
  <text x="480.0" y="546.0" text-anchor="middle" font-size="13.5" font-style="italic" fill="#333333">Schematic; percentages from Dell'Acqua and colleagues (2023), one firm and one model generation.</text>
</svg>
