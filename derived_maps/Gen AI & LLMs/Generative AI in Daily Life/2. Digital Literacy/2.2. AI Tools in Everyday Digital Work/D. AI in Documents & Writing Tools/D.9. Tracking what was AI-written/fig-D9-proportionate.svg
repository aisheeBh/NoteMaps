<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Proportionate tracking</title>
  <desc>Three tiers: routine internal documents need tracked changes and version names; important documents add labels on AI-drafted sections; client and published documents add a provenance log, independent checks and a disclosure statement.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Tracking effort rises with stakes</text>
  <rect x="60" y="330" width="260" height="140" rx="6" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="190" y="384" text-anchor="middle" font-size="16" font-weight="bold" fill="#222222">Routine internal</text>
  <text x="190" y="410" text-anchor="middle" font-size="14" fill="#222222">Tracked changes for AI edits;</text>
  <text x="190" y="428" text-anchor="middle" font-size="14" fill="#222222">named versions</text>
  <rect x="350" y="240" width="260" height="230" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="480" y="339" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Important internal</text>
  <text x="480" y="365" text-anchor="middle" font-size="14" fill="#111111">Add labels on AI-drafted</text>
  <text x="480" y="383" text-anchor="middle" font-size="14" fill="#111111">sections and a reviewer check</text>
  <rect x="640" y="150" width="260" height="320" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="770" y="275" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Client, published or</text>
  <text x="770" y="295" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">regulated</text>
  <text x="770" y="321" text-anchor="middle" font-size="14" fill="#FFFFFF">Add provenance log, independent</text>
  <text x="770" y="339" text-anchor="middle" font-size="14" fill="#FFFFFF">checks of AI-drafted parts,</text>
  <text x="770" y="357" text-anchor="middle" font-size="14" fill="#FFFFFF">disclosure statement</text>
  <line x1="40" y1="470" x2="920" y2="470" stroke="#222222" stroke-width="2.5"/>
  <text x="480" y="505" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Stakes and readership →</text>
  <text x="480" y="545" text-anchor="middle" font-size="13" fill="#333333">Schematic.</text>
</svg>
