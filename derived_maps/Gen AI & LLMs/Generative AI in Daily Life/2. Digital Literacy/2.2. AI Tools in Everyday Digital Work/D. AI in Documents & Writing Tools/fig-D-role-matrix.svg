<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Matching AI's role to stakes and judgement</title>
  <desc>A two-by-two matrix. Low stakes and low importance of author judgement: AI drafts, light review. Low stakes and high judgement: author writes, AI polishes. High stakes and low judgement: AI drafts from verified sources with full checks. High stakes and high judgement: author writes, AI critiques and checks language only.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Who should write it?</text>
  <rect x="220" y="310" width="340" height="210" rx="6" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="228" y="378" width="324" height="72" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/>
  <text x="390" y="399" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">AI drafts; light review</text>
  <text x="390" y="425" text-anchor="middle" font-size="14" fill="#111111">Routine updates, standard letters, format</text>
  <text x="390" y="443" text-anchor="middle" font-size="14" fill="#111111">conversions</text>
  <rect x="220" y="80" width="340" height="210" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="390" y="169" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Author writes; AI polishes</text>
  <text x="390" y="195" text-anchor="middle" font-size="14" fill="#111111">Personal notes to the team, reflective</text>
  <text x="390" y="213" text-anchor="middle" font-size="14" fill="#111111">writing</text>
  <rect x="580" y="310" width="340" height="210" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="588" y="368" width="324" height="92" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="750" y="389" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">AI drafts from verified sources; full</text>
  <text x="750" y="409" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">checks</text>
  <text x="750" y="435" text-anchor="middle" font-size="14" fill="#111111">Standard tender sections, policy updates,</text>
  <text x="750" y="453" text-anchor="middle" font-size="14" fill="#111111">report evidence</text>
  <rect x="580" y="80" width="340" height="210" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="588" y="138" width="324" height="92" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
  <text x="750" y="159" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Author writes; AI critiques and</text>
  <text x="750" y="179" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">checks language</text>
  <text x="750" y="205" text-anchor="middle" font-size="14" fill="#111111">Recommendations, legal opinions,</text>
  <text x="750" y="223" text-anchor="middle" font-size="14" fill="#111111">leadership messages</text>
  <text x="390" y="560" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Lower stakes</text>
  <text x="750" y="560" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Higher stakes</text>
  <text x="200" y="185" text-anchor="end" font-size="16" font-weight="bold" fill="#111111">Author's</text>
  <text x="200" y="205" text-anchor="end" font-size="16" font-weight="bold" fill="#111111">judgement</text>
  <text x="200" y="225" text-anchor="end" font-size="16" font-weight="bold" fill="#111111">central</text>
  <text x="200" y="415" text-anchor="end" font-size="16" font-weight="bold" fill="#111111">Judgement</text>
  <text x="200" y="435" text-anchor="end" font-size="16" font-weight="bold" fill="#111111">less central</text>
  <text x="480" y="590" text-anchor="middle" font-size="13" fill="#333333">Schematic guidance; confidentiality rules can override any quadrant.</text>
</svg>
