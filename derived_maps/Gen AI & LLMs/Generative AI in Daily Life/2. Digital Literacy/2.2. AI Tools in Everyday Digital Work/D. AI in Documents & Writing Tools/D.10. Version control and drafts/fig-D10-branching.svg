<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Branching alternatives and merging</title>
  <desc>From version 0.4, two AI alternatives of the introduction are created as branches alongside the original; the author compares them and merges the chosen elements into version 0.5. The original remains recoverable.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Branch, compare, merge</text>
  <rect x="40" y="210" width="150" height="80" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="115" y="243" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">v0.4</text>
  <text x="115" y="269" text-anchor="middle" font-size="14" fill="#FFFFFF">current draft</text>
  <rect x="330" y="90" width="230" height="80" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="338" y="102" width="214" height="54" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="445" y="123" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Branch A</text>
  <text x="445" y="149" text-anchor="middle" font-size="14" fill="#111111">AI: concise introduction</text>
  <rect x="330" y="210" width="230" height="80" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="445" y="243" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Original kept</text>
  <text x="445" y="269" text-anchor="middle" font-size="14" fill="#111111">author's introduction</text>
  <rect x="330" y="330" width="230" height="80" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="338" y="342" width="214" height="54" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="445" y="363" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Branch B</text>
  <text x="445" y="389" text-anchor="middle" font-size="14" fill="#111111">AI: story-led introduction</text>
  <rect x="700" y="210" width="200" height="80" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="800" y="234" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">v0.5</text>
  <text x="800" y="260" text-anchor="middle" font-size="14" fill="#111111">merged: A's opening +</text>
  <text x="800" y="278" text-anchor="middle" font-size="14" fill="#111111">author's evidence</text>
  <line x1="190" y1="250" x2="330" y2="130" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="190" y1="250" x2="330" y2="250" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="190" y1="250" x2="330" y2="370" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="130" x2="700" y2="240" stroke="#222222" stroke-width="2" stroke-dasharray="10 6" marker-end="url(#arrow)"/>
  <line x1="560" y1="250" x2="700" y2="250" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="370" x2="700" y2="270" stroke="#222222" stroke-width="1.5" stroke-dasharray="2 4" marker-end="url(#arrow)"/>
  <text x="700" y="150" text-anchor="middle" font-size="14" fill="#111111">opening used</text>
  <text x="630" y="395" text-anchor="middle" font-size="14" fill="#111111">rejected</text>
  <text x="480" y="470" text-anchor="middle" font-size="15" fill="#111111">Rejected branches are deleted from the working document but remain in version history.</text>
  <text x="480" y="505" text-anchor="middle" font-size="13" fill="#333333">Illustrative example.</text>
</svg>
