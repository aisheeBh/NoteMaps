<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Weak and strong file naming</title>
  <desc>Weak names such as Report final, Report final2, Report FINAL v3 Sam edits, and Copy of Report new; strong names using ISO date, project, document, version number and status.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Which one is the latest approved version?</text>
  <rect x="40" y="70" width="420" height="50" rx="6" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="250" y="101" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Weak</text>
  <rect x="500" y="70" width="420" height="50" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="710" y="101" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Strong</text>
  <rect x="40" y="135" width="420" height="50" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="250" y="164" text-anchor="middle" font-size="15" fill="#111111">Report final.docx</text>
  <rect x="500" y="135" width="420" height="50" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="710" y="164" text-anchor="middle" font-size="14" fill="#111111">2026-09-14_Northgate_Review_v0.1_DRAFT</text>
  <rect x="40" y="197" width="420" height="50" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="48" y="206" width="404" height="30" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
  <text x="250" y="226" text-anchor="middle" font-size="15" fill="#111111">Report final2.docx</text>
  <rect x="500" y="197" width="420" height="50" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="710" y="226" text-anchor="middle" font-size="14" fill="#111111">2026-09-21_Northgate_Review_v0.2_DRAFT</text>
  <rect x="40" y="259" width="420" height="50" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="250" y="288" text-anchor="middle" font-size="15" fill="#111111">Report FINAL v3 Sam edits.docx</text>
  <rect x="500" y="259" width="420" height="50" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="710" y="288" text-anchor="middle" font-size="14" fill="#111111">2026-09-28_Northgate_Review_v0.3_REVIEW</text>
  <rect x="40" y="321" width="420" height="50" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="48" y="330" width="404" height="30" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
  <text x="250" y="350" text-anchor="middle" font-size="15" fill="#111111">Copy of Report new.docx</text>
  <rect x="500" y="321" width="420" height="50" rx="6" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="508" y="331" width="404" height="28" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/>
  <text x="710" y="350" text-anchor="middle" font-size="14" fill="#111111">2026-10-02_Northgate_Review_v1.0_APPROVED</text>
  <rect x="40" y="383" width="420" height="50" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="250" y="412" text-anchor="middle" font-size="15" fill="#111111">Report final AI version.docx</text>
  <rect x="500" y="383" width="420" height="50" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="710" y="412" text-anchor="middle" font-size="14" fill="#111111">2026-10-08_Northgate_Review_v1.1_DRAFT</text>
  <text x="480" y="470" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">date (YYYY-MM-DD) · project · document · version · status</text>
  <text x="480" y="500" text-anchor="middle" font-size="15" fill="#111111">sorts correctly, shows what is approved and what is newest</text>
  <text x="480" y="545" text-anchor="middle" font-size="13" fill="#333333">Illustrative names.</text>
</svg>
