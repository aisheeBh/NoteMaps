<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Many voices or one voice</title>
  <desc>Two panels. Left, a results page: several sources with names and dates, visible disagreement, reader compares. Right, a generated answer: one smooth paragraph, sources merged, disagreement may vanish, citations to check.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Many voices or one voice</text>
  <rect x="24" y="70" width="447" height="238" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="24" y="70" width="447" height="38" rx="8" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="248" y="98" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Results page</text>
  <circle cx="40" cy="131" r="3.2" fill="#111111"/>
  <text x="50" y="136" text-anchor="start" font-size="14" fill="#111111">Official guidance, dated 2026</text>
  <circle cx="40" cy="158" r="3.2" fill="#111111"/>
  <text x="50" y="162" text-anchor="start" font-size="14" fill="#111111">Accountancy firm article, dated 2025</text>
  <circle cx="40" cy="184" r="3.2" fill="#111111"/>
  <text x="50" y="189" text-anchor="start" font-size="14" fill="#111111">Forum thread with a contrary view</text>
  <circle cx="40" cy="210" r="3.2" fill="#111111"/>
  <text x="50" y="216" text-anchor="start" font-size="14" fill="#111111">Each item has an author and a date</text>
  <circle cx="40" cy="237" r="3.2" fill="#111111"/>
  <text x="50" y="242" text-anchor="start" font-size="14" fill="#111111">Disagreement is visible</text>
  <circle cx="40" cy="264" r="3.2" fill="#111111"/>
  <text x="50" y="268" text-anchor="start" font-size="14" fill="#111111">The reader compares and judges</text>
  <rect x="489" y="70" width="447" height="238" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="489" y="70" width="447" height="38" rx="8" fill="#FFFFFF" stroke="#7A5200" stroke-width="2"/>
  <text x="712" y="98" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Generated answer</text>
  <circle cx="505" cy="131" r="3.2" fill="#111111"/>
  <text x="515" y="136" text-anchor="start" font-size="14" fill="#111111">One fluent, confident paragraph</text>
  <circle cx="505" cy="158" r="3.2" fill="#111111"/>
  <text x="515" y="162" text-anchor="start" font-size="14" fill="#111111">Sources merged into a single voice</text>
  <circle cx="505" cy="184" r="3.2" fill="#111111"/>
  <text x="515" y="189" text-anchor="start" font-size="14" fill="#111111">Dissenting views may be averaged away</text>
  <circle cx="505" cy="210" r="3.2" fill="#111111"/>
  <text x="515" y="216" text-anchor="start" font-size="14" fill="#111111">Dates and conditions may drop out</text>
  <circle cx="505" cy="237" r="3.2" fill="#111111"/>
  <text x="515" y="242" text-anchor="start" font-size="14" fill="#111111">Citations, if any, must be opened</text>
  <circle cx="505" cy="264" r="3.2" fill="#111111"/>
  <text x="515" y="268" text-anchor="start" font-size="14" fill="#111111">The reader must verify, not just read</text>
</svg>
