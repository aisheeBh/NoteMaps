<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>AI tools beside familiar digital tools</title>
  <desc>Four panels comparing calculator or spreadsheet, search engine, database and AI assistant on what they do, repeatability and characteristic error.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">AI tools beside familiar digital tools</text>
  <rect x="24" y="70" width="214" height="228" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <rect x="24" y="70" width="214" height="38" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="131" y="98" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Spreadsheet</text>
  <circle cx="40" cy="131" r="3.2" fill="#111111"/>
  <text x="50" y="136" text-anchor="start" font-size="14" fill="#111111">Computes by fixed rules</text>
  <circle cx="40" cy="158" r="3.2" fill="#111111"/>
  <text x="50" y="162" text-anchor="start" font-size="14" fill="#111111">Same input, same output</text>
  <circle cx="40" cy="184" r="3.2" fill="#111111"/>
  <text x="50" y="189" text-anchor="start" font-size="14" fill="#111111">Errors come from the</text>
  <text x="50" y="208" text-anchor="start" font-size="14" fill="#111111">formula</text>
  <circle cx="40" cy="230" r="3.2" fill="#111111"/>
  <text x="50" y="235" text-anchor="start" font-size="14" fill="#111111">Author: the user</text>
  <rect x="256" y="70" width="214" height="228" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="256" y="70" width="214" height="38" rx="8" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="364" y="98" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Search engine</text>
  <circle cx="272" cy="131" r="3.2" fill="#111111"/>
  <text x="282" y="136" text-anchor="start" font-size="14" fill="#111111">Finds and ranks</text>
  <text x="282" y="156" text-anchor="start" font-size="14" fill="#111111">documents</text>
  <circle cx="272" cy="177" r="3.2" fill="#111111"/>
  <text x="282" y="182" text-anchor="start" font-size="14" fill="#111111">Mostly repeatable</text>
  <circle cx="272" cy="204" r="3.2" fill="#111111"/>
  <text x="282" y="208" text-anchor="start" font-size="14" fill="#111111">May rank poor sources</text>
  <text x="282" y="228" text-anchor="start" font-size="14" fill="#111111">high</text>
  <circle cx="272" cy="250" r="3.2" fill="#111111"/>
  <text x="282" y="254" text-anchor="start" font-size="14" fill="#111111">Author: the sources</text>
  <rect x="489" y="70" width="214" height="228" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/>
  <rect x="489" y="70" width="214" height="38" rx="8" fill="#FFFFFF" stroke="#666666" stroke-width="1.5"/>
  <text x="596" y="98" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Database</text>
  <circle cx="505" cy="131" r="3.2" fill="#222222"/>
  <text x="515" y="136" text-anchor="start" font-size="14" fill="#222222">Stores and returns</text>
  <text x="515" y="156" text-anchor="start" font-size="14" fill="#222222">records</text>
  <circle cx="505" cy="177" r="3.2" fill="#222222"/>
  <text x="515" y="182" text-anchor="start" font-size="14" fill="#222222">Exact retrieval</text>
  <circle cx="505" cy="204" r="3.2" fill="#222222"/>
  <text x="515" y="208" text-anchor="start" font-size="14" fill="#222222">Wrong only if data are</text>
  <text x="515" y="228" text-anchor="start" font-size="14" fill="#222222">wrong</text>
  <circle cx="505" cy="250" r="3.2" fill="#222222"/>
  <text x="515" y="254" text-anchor="start" font-size="14" fill="#222222">Author: whoever entered</text>
  <text x="515" y="274" text-anchor="start" font-size="14" fill="#222222">it</text>
  <rect x="722" y="70" width="214" height="228" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="722" y="70" width="214" height="38" rx="8" fill="#FFFFFF" stroke="#7A5200" stroke-width="2"/>
  <text x="829" y="98" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">AI assistant</text>
  <circle cx="738" cy="131" r="3.2" fill="#111111"/>
  <text x="748" y="136" text-anchor="start" font-size="14" fill="#111111">Infers and composes</text>
  <circle cx="738" cy="158" r="3.2" fill="#111111"/>
  <text x="748" y="162" text-anchor="start" font-size="14" fill="#111111">Replies may vary</text>
  <circle cx="738" cy="184" r="3.2" fill="#111111"/>
  <text x="748" y="189" text-anchor="start" font-size="14" fill="#111111">Fluent but false output</text>
  <circle cx="738" cy="210" r="3.2" fill="#111111"/>
  <text x="748" y="216" text-anchor="start" font-size="14" fill="#111111">Author: no one; user</text>
  <text x="748" y="235" text-anchor="start" font-size="14" fill="#111111">owns it</text>
</svg>
