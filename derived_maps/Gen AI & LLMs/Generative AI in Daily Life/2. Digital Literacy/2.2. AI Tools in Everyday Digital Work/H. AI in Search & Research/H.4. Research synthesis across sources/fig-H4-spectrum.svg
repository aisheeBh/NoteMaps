<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The spectrum of synthesis</title>
  <desc>A horizontal spectrum from aggregating, adding up comparable findings, to configuring, arranging diverse findings into understanding. Points from left to right: meta-analysis; structured evidence table; narrative synthesis; thematic synthesis; interpretive synthesis such as meta-ethnography.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">The spectrum of synthesis</text>
  <line x1="60" y1="250" x2="900" y2="250" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="900" y1="250" x2="60" y2="250" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="60" y="280" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">Aggregating: add up</text>
  <text x="900" y="280" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Configuring: arrange</text>
  <text x="900" y="300" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">and interpret</text>
  <line x1="90" y1="250" x2="90" y2="210" stroke="#222222" stroke-width="1.5"/>
  <circle cx="90" cy="250" r="7" fill="#111111"/>
  <rect x="24" y="90" width="190" height="120" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="119" y="134" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#FFFFFF">Meta-analysis</text>
  <text x="119" y="159" text-anchor="middle" font-size="13.5" fill="#FFFFFF">Pools comparable effect</text>
  <text x="119" y="177" text-anchor="middle" font-size="13.5" fill="#FFFFFF">sizes</text>
  <line x1="285" y1="250" x2="285" y2="298" stroke="#222222" stroke-width="1.5"/>
  <circle cx="285" cy="250" r="7" fill="#111111"/>
  <rect x="190" y="298" width="190" height="120" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="285" y="342" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#111111">Evidence table</text>
  <text x="285" y="367" text-anchor="middle" font-size="13.5" fill="#111111">Comparable findings</text>
  <text x="285" y="385" text-anchor="middle" font-size="13.5" fill="#111111">tabulated and counted</text>
  <line x1="480" y1="250" x2="480" y2="210" stroke="#222222" stroke-width="1.5"/>
  <circle cx="480" cy="250" r="7" fill="#111111"/>
  <rect x="385" y="90" width="190" height="120" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="480" y="125" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#111111">Narrative synthesis</text>
  <text x="480" y="150" text-anchor="middle" font-size="13.5" fill="#111111">Groups and explains</text>
  <text x="480" y="168" text-anchor="middle" font-size="13.5" fill="#111111">studies too different</text>
  <text x="480" y="185" text-anchor="middle" font-size="13.5" fill="#111111">to pool</text>
  <line x1="675" y1="250" x2="675" y2="298" stroke="#222222" stroke-width="1.5"/>
  <circle cx="675" cy="250" r="7" fill="#111111"/>
  <rect x="580" y="298" width="190" height="120" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="675" y="342" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#111111">Thematic synthesis</text>
  <text x="675" y="367" text-anchor="middle" font-size="13.5" fill="#111111">Develops themes across</text>
  <text x="675" y="385" text-anchor="middle" font-size="13.5" fill="#111111">qualitative findings</text>
  <line x1="870" y1="250" x2="870" y2="210" stroke="#222222" stroke-width="1.5"/>
  <circle cx="870" cy="250" r="7" fill="#111111"/>
  <rect x="746" y="90" width="190" height="120" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="841" y="124" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#111111">Interpretive</text>
  <text x="841" y="143" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#111111">synthesis</text>
  <text x="841" y="169" text-anchor="middle" font-size="13.5" fill="#111111">Builds new concepts, as</text>
  <text x="841" y="186" text-anchor="middle" font-size="13.5" fill="#111111">in meta-ethnography</text>
  <text x="480" y="510" text-anchor="middle" font-size="13.5" font-style="italic" fill="#333333">Most workplace synthesis sits in the middle: structured, but interpretive.</text>
</svg>
