<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 364" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Specialist sources that general tools under-use</title>
  <desc>Three columns. Law and policy: legislation databases, judgment databases, regulators, parliamentary records, audit-office reports. Health and science: biomedical literature databases, guideline bodies, drug regulators, preprint servers, standards and patents. Business and the organisation: company registries, securities filings, statistics offices, licensed financial databases, intranets and internal experts.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Specialist sources that general tools under-use</text>
  <rect x="24" y="70" width="292" height="264" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="170" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Law and policy</text>
  <line x1="38" y1="116" x2="302" y2="116" stroke="#555555" stroke-width="1.2"/>
  <text x="170" y="140" text-anchor="middle" font-size="14.5" fill="#111111">Official legislation databases</text>
  <text x="170" y="171" text-anchor="middle" font-size="14.5" fill="#111111">Court and tribunal judgments</text>
  <text x="170" y="202" text-anchor="middle" font-size="14.5" fill="#111111">Regulators' guidance and registers</text>
  <text x="170" y="233" text-anchor="middle" font-size="14.5" fill="#111111">Parliamentary records</text>
  <text x="170" y="264" text-anchor="middle" font-size="14.5" fill="#111111">Audit-office reports</text>
  <rect x="334" y="70" width="292" height="264" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="480" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Health and science</text>
  <line x1="348" y1="116" x2="612" y2="116" stroke="#555555" stroke-width="1.2"/>
  <text x="480" y="140" text-anchor="middle" font-size="14.5" fill="#111111">Biomedical literature databases</text>
  <text x="480" y="171" text-anchor="middle" font-size="14.5" fill="#111111">Clinical guideline bodies</text>
  <text x="480" y="202" text-anchor="middle" font-size="14.5" fill="#111111">Drug regulators' product</text>
  <text x="480" y="221" text-anchor="middle" font-size="14.5" fill="#111111">information</text>
  <text x="480" y="252" text-anchor="middle" font-size="14.5" fill="#111111">Preprint servers</text>
  <text x="480" y="283" text-anchor="middle" font-size="14.5" fill="#111111">Standards and patent databases</text>
  <rect x="644" y="70" width="292" height="264" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="790" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Business and the organisation</text>
  <line x1="658" y1="116" x2="922" y2="116" stroke="#555555" stroke-width="1.2"/>
  <text x="790" y="140" text-anchor="middle" font-size="14.5" fill="#111111">Company registries</text>
  <text x="790" y="171" text-anchor="middle" font-size="14.5" fill="#111111">Securities filings systems</text>
  <text x="790" y="202" text-anchor="middle" font-size="14.5" fill="#111111">Statistics offices and central</text>
  <text x="790" y="221" text-anchor="middle" font-size="14.5" fill="#111111">banks</text>
  <text x="790" y="252" text-anchor="middle" font-size="14.5" fill="#111111">Licensed financial databases</text>
  <text x="790" y="283" text-anchor="middle" font-size="14.5" fill="#111111">Intranets and internal experts</text>
</svg>
