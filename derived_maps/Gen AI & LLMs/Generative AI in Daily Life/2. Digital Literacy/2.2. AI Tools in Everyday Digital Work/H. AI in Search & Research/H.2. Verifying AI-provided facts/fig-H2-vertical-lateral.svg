<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 345" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Two ways of judging a source</title>
  <desc>Two panels. Vertical reading stays on the page: looks at design, logo, About page, domain, references and tone; slow and easily misled by professional presentation. Lateral reading leaves the page: opens new tabs, searches who is behind the source and what others say, traces the claim to the original; faster and more accurate in studies of fact-checkers.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Two ways of judging a source</text>
  <rect x="24" y="70" width="447" height="245" rx="8" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="248" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Vertical reading: stay on the page</text>
  <line x1="38" y1="116" x2="457" y2="116" stroke="#555555" stroke-width="1.2"/>
  <text x="248" y="140" text-anchor="middle" font-size="14.5" fill="#111111">Examines design, logos and domain name</text>
  <text x="248" y="171" text-anchor="middle" font-size="14.5" fill="#111111">Reads the About page and the source's own references</text>
  <text x="248" y="202" text-anchor="middle" font-size="14.5" fill="#111111">Judges by tone and polish</text>
  <text x="248" y="233" text-anchor="middle" font-size="14.5" fill="#111111">Slow; misled by professional presentation</text>
  <rect x="489" y="70" width="447" height="245" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="712" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Lateral reading: leave the page</text>
  <line x1="503" y1="116" x2="922" y2="116" stroke="#555555" stroke-width="1.2"/>
  <text x="712" y="140" text-anchor="middle" font-size="14.5" fill="#111111">Opens new tabs within seconds</text>
  <text x="712" y="171" text-anchor="middle" font-size="14.5" fill="#111111">Asks who is behind the source and what others say</text>
  <text x="712" y="202" text-anchor="middle" font-size="14.5" fill="#111111">Searches the specific claim elsewhere</text>
  <text x="712" y="233" text-anchor="middle" font-size="14.5" fill="#111111">Traces the claim to its original</text>
  <text x="712" y="264" text-anchor="middle" font-size="14.5" fill="#111111">Faster and more accurate in studies of fact-checkers</text>
</svg>
