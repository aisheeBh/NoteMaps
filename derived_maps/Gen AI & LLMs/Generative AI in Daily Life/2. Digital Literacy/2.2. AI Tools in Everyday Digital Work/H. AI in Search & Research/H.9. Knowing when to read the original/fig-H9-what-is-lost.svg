<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 375" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>What a summary characteristically drops</title>
  <desc>Two panels. Kept by summaries: the headline finding, the topic, the main number, the general direction. Often dropped: hedges and certainty, conditions and scope, exceptions and carve-outs, baselines and units, methods, status such as proposed or in force, attribution, exact wording.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">What a summary characteristically drops</text>
  <rect x="24" y="70" width="447" height="245" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="248" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Usually kept</text>
  <line x1="38" y1="116" x2="457" y2="116" stroke="#555555" stroke-width="1.2"/>
  <text x="248" y="140" text-anchor="middle" font-size="14.5" fill="#111111">The headline finding</text>
  <text x="248" y="171" text-anchor="middle" font-size="14.5" fill="#111111">The topic and main actors</text>
  <text x="248" y="202" text-anchor="middle" font-size="14.5" fill="#111111">The main number</text>
  <text x="248" y="233" text-anchor="middle" font-size="14.5" fill="#111111">The general direction</text>
  <rect x="489" y="70" width="447" height="245" rx="8" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="712" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Often dropped</text>
  <line x1="503" y1="116" x2="922" y2="116" stroke="#555555" stroke-width="1.2"/>
  <text x="712" y="140" text-anchor="middle" font-size="14.5" fill="#111111">Hedges: may, associated with, in this sample</text>
  <text x="712" y="171" text-anchor="middle" font-size="14.5" fill="#111111">Conditions, scope and exceptions</text>
  <text x="712" y="202" text-anchor="middle" font-size="14.5" fill="#111111">Baselines, units and periods behind numbers</text>
  <text x="712" y="233" text-anchor="middle" font-size="14.5" fill="#111111">Methods and status: proposed or in force</text>
  <text x="712" y="264" text-anchor="middle" font-size="14.5" fill="#111111">Attribution and exact wording</text>
  <text x="480" y="365" text-anchor="middle" font-size="13.5" font-style="italic" fill="#333333">Summaries keep the headline and drop the conditions.</text>
</svg>
