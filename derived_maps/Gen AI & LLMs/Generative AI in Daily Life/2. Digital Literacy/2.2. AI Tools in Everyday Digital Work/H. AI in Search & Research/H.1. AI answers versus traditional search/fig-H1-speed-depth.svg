<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Speed to a first answer and depth of understanding</title>
  <desc>Schematic chart. Horizontal axis time spent; vertical axis understanding. The AI answer line rises very quickly then flattens at a moderate level. The search and read line rises slowly but climbs higher. A combined line rises quickly and continues to climb highest.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Speed to a first answer and depth of understanding</text>
  <line x1="110" y1="430" x2="900" y2="430" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="110" y1="430" x2="110" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="495" y="470" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Time spent researching</text>
  <text x="60" y="255" text-anchor="middle" font-size="16" font-weight="bold" transform="rotate(-90 60 255)" fill="#111111">Depth of understanding</text>
  <text x="110" y="452" text-anchor="start" font-size="14" fill="#111111">Minutes</text>
  <text x="880" y="452" text-anchor="end" font-size="14" fill="#111111">Hours</text>
  <text x="100" y="426" text-anchor="end" font-size="14" fill="#111111">Low</text>
  <text x="100" y="90" text-anchor="end" font-size="14" fill="#111111">High</text>
  <path d="M110 430 L141 272 L202 248 L418 234 L695 227" fill="none" stroke="#111111" stroke-width="3"/>
  <rect x="707" y="215" width="123" height="24" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="711" y="232" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">AI answer only</text>
  <path d="M110 430 L233 367 L356 272 L541 178 L695 150" fill="none" stroke="#111111" stroke-width="3" stroke-dasharray="10 6"/>
  <rect x="707" y="138" width="197" height="24" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="711" y="155" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">Search and read sources</text>
  <path d="M110 430 L148 283 L264 220 L480 132 L695 104" fill="none" stroke="#111111" stroke-width="3" stroke-dasharray="2 4"/>
  <rect x="707" y="93" width="221" height="24" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="711" y="110" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">AI to orient, then sources</text>
  <text x="480" y="530" text-anchor="middle" font-size="13.5" font-style="italic" fill="#333333">Schematic; not plotted from a single dataset.</text>
</svg>
