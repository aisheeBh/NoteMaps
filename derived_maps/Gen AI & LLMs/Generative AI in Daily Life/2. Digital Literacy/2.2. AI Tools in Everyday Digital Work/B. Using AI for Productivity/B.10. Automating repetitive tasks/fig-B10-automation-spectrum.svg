<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>From shortcuts to agents</title>
  <desc>A scale of automation approaches from simplest and most predictable to most flexible and least predictable: templates and shortcuts, rules and macros, trigger-action workflows, workflows with AI steps, and AI agents.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">From shortcuts to agents</text>
  <line x1="60" y1="275" x2="905" y2="275" stroke="#222222" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="60" y1="265" x2="60" y2="285" stroke="#222222" stroke-width="4"/>
  <text x="60" y="303" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">Predictable, rigid</text>
  <text x="905" y="303" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Flexible, less predictable</text>
  <circle cx="70" cy="275" r="9" fill="#111111"/>
  <line x1="70" y1="266" x2="70" y2="235" stroke="#222222" stroke-width="1.5"/>
  <rect x="26" y="115" width="180" height="120" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="116" y="149" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Templates,</text>
  <text x="116" y="168" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">shortcuts</text>
  <text x="116" y="192" text-anchor="middle" font-size="13.5" fill="#111111">Text snippets, saved</text>
  <text x="116" y="210" text-anchor="middle" font-size="13.5" fill="#111111">replies</text>
  <circle cx="250" cy="275" r="9" fill="#111111"/>
  <line x1="250" y1="284" x2="250" y2="320" stroke="#222222" stroke-width="1.5"/>
  <rect x="160" y="320" width="180" height="120" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="250" y="364" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Rules and macros</text>
  <text x="250" y="388" text-anchor="middle" font-size="13.5" fill="#111111">Mail rules, recorded</text>
  <text x="250" y="405" text-anchor="middle" font-size="13.5" fill="#111111">actions</text>
  <circle cx="439" cy="275" r="9" fill="#111111"/>
  <line x1="439" y1="266" x2="439" y2="235" stroke="#222222" stroke-width="1.5"/>
  <rect x="349" y="115" width="180" height="120" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="439" y="158" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Trigger-action</text>
  <text x="439" y="177" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">workflows</text>
  <text x="439" y="201" text-anchor="middle" font-size="13.5" fill="#000000">When X happens, do Y</text>
  <circle cx="611" cy="275" r="9" fill="#111111"/>
  <line x1="611" y1="284" x2="611" y2="320" stroke="#222222" stroke-width="1.5"/>
  <rect x="521" y="320" width="180" height="120" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="529" y="335" width="164" height="91" fill="#FFFFFF" stroke="none" rx="4"/>
  <text x="611" y="354" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Workflows with AI</text>
  <text x="611" y="373" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">steps</text>
  <text x="611" y="397" text-anchor="middle" font-size="13.5" fill="#111111">Classify, extract,</text>
  <text x="611" y="415" text-anchor="middle" font-size="13.5" fill="#111111">draft inside a flow</text>
  <circle cx="742" cy="275" r="9" fill="#111111"/>
  <line x1="742" y1="266" x2="742" y2="235" stroke="#222222" stroke-width="1.5"/>
  <rect x="652" y="115" width="180" height="120" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="742" y="159" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">AI agents</text>
  <text x="742" y="183" text-anchor="middle" font-size="13.5" fill="#FFFFFF">Plan and act toward a</text>
  <text x="742" y="200" text-anchor="middle" font-size="13.5" fill="#FFFFFF">goal</text>
  <text x="480" y="506" text-anchor="middle" font-size="13" fill="#333333">Choose the simplest approach that handles the task reliably.</text>
</svg>
