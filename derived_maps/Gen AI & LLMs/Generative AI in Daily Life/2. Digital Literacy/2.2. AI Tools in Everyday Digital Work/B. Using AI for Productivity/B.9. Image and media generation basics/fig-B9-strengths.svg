<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>What image generation does well and badly</title>
  <desc>Three columns. Does well: mood boards, concept sketches, illustrations, backgrounds, variations of a style. Does badly: exact text, precise counts and diagrams, consistent characters across images, accurate technical detail, real products and logos. Should not be used for: realistic images of real people without consent, fake evidence or documents, imitation of a living artist's distinctive work for commercial use.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">What image generation does well and badly</text>
  <rect x="40" y="80" width="279" height="270" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="179" y="114" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">Does well</text>
  <text x="58" y="148" text-anchor="start" font-size="15" font-weight="bold" fill="#000000">•</text>
  <text x="72" y="148" text-anchor="start" font-size="15" fill="#000000">Mood boards and concepts</text>
  <text x="58" y="176" text-anchor="start" font-size="15" font-weight="bold" fill="#000000">•</text>
  <text x="72" y="176" text-anchor="start" font-size="15" fill="#000000">Illustrations and</text>
  <text x="72" y="196" text-anchor="start" font-size="15" fill="#000000">backgrounds</text>
  <text x="58" y="223" text-anchor="start" font-size="15" font-weight="bold" fill="#000000">•</text>
  <text x="72" y="223" text-anchor="start" font-size="15" fill="#000000">Many variations quickly</text>
  <text x="58" y="250" text-anchor="start" font-size="15" font-weight="bold" fill="#000000">•</text>
  <text x="72" y="250" text-anchor="start" font-size="15" fill="#000000">Styles and atmospheres</text>
  <rect x="341" y="80" width="279" height="270" rx="6" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="480" y="114" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">Does badly</text>
  <text x="359" y="148" text-anchor="start" font-size="15" font-weight="bold" fill="#000000">•</text>
  <text x="373" y="148" text-anchor="start" font-size="15" fill="#000000">Exact text and numbers</text>
  <text x="359" y="176" text-anchor="start" font-size="15" font-weight="bold" fill="#000000">•</text>
  <text x="373" y="176" text-anchor="start" font-size="15" fill="#000000">Accurate diagrams and</text>
  <text x="373" y="196" text-anchor="start" font-size="15" fill="#000000">charts</text>
  <text x="359" y="223" text-anchor="start" font-size="15" font-weight="bold" fill="#000000">•</text>
  <text x="373" y="223" text-anchor="start" font-size="15" fill="#000000">Consistent characters</text>
  <text x="359" y="250" text-anchor="start" font-size="15" font-weight="bold" fill="#000000">•</text>
  <text x="373" y="250" text-anchor="start" font-size="15" fill="#000000">Real products and technical</text>
  <text x="373" y="270" text-anchor="start" font-size="15" fill="#000000">detail</text>
  <rect x="641" y="80" width="279" height="270" rx="6" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="781" y="114" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">Should not be used for</text>
  <text x="659" y="148" text-anchor="start" font-size="15" font-weight="bold" fill="#000000">•</text>
  <text x="673" y="148" text-anchor="start" font-size="15" fill="#000000">Real people without consent</text>
  <text x="659" y="176" text-anchor="start" font-size="15" font-weight="bold" fill="#000000">•</text>
  <text x="673" y="176" text-anchor="start" font-size="15" fill="#000000">Fake evidence or documents</text>
  <text x="659" y="204" text-anchor="start" font-size="15" font-weight="bold" fill="#000000">•</text>
  <text x="673" y="204" text-anchor="start" font-size="15" fill="#000000">Passing off a living</text>
  <text x="673" y="223" text-anchor="start" font-size="15" fill="#000000">artist's style</text>
  <text x="659" y="250" text-anchor="start" font-size="15" font-weight="bold" fill="#000000">•</text>
  <text x="673" y="250" text-anchor="start" font-size="15" fill="#000000">Images presented as real</text>
  <text x="673" y="270" text-anchor="start" font-size="15" fill="#000000">events</text>
  <text x="480" y="386" text-anchor="middle" font-size="13" fill="#333333">Capabilities improve quickly; the right-hand column is about ethics and law, not capability.</text>
</svg>
