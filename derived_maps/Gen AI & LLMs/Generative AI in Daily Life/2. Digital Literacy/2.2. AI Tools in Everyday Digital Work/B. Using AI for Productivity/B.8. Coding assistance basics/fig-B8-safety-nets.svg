<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 565" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Safety nets for AI-written code</title>
  <desc>Five layers of protection: version control so any change can be undone; a sandbox or test copy so code never first runs on real data; tests that define correct behaviour; review by someone who reads the code; and least privilege so the code and any agent can only touch what they need.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Safety nets for AI-written code</text>
  <rect x="40" y="82" width="880" height="80" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="58" y="128" text-anchor="start" font-size="17" font-weight="bold" fill="#FFFFFF">Version control</text>
  <text x="310" y="118" text-anchor="start" font-size="15" fill="#FFFFFF">Every change recorded and reversible; nothing irreplaceable is ever</text>
  <text x="310" y="137" text-anchor="start" font-size="15" fill="#FFFFFF">overwritten.</text>
  <rect x="40" y="170" width="880" height="80" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="58" y="217" text-anchor="start" font-size="17" font-weight="bold" fill="#000000">Sandbox or copy</text>
  <text x="310" y="206" text-anchor="start" font-size="15" fill="#000000">Code runs first on test data or a copy, never first on live systems or</text>
  <text x="310" y="225" text-anchor="start" font-size="15" fill="#000000">originals.</text>
  <rect x="40" y="259" width="880" height="80" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="50" y="267" width="860" height="64" fill="#FFFFFF" rx="4"/>
  <text x="58" y="305" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Tests</text>
  <text x="310" y="294" text-anchor="start" font-size="15" fill="#111111">Examples of correct behaviour, including edge cases, run automatically</text>
  <text x="310" y="314" text-anchor="start" font-size="15" fill="#111111">after each change.</text>
  <rect x="40" y="347" width="880" height="80" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="58" y="393" text-anchor="start" font-size="17" font-weight="bold" fill="#111111">Review</text>
  <text x="310" y="383" text-anchor="start" font-size="15" fill="#111111">A person who understands the code reads it, especially anything that</text>
  <text x="310" y="402" text-anchor="start" font-size="15" fill="#111111">deletes, sends or pays.</text>
  <rect x="40" y="436" width="880" height="80" rx="6" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="58" y="482" text-anchor="start" font-size="17" font-weight="bold" fill="#000000">Least privilege</text>
  <text x="310" y="471" text-anchor="start" font-size="15" fill="#000000">Code and agents get only the access they need; no production</text>
  <text x="310" y="490" text-anchor="start" font-size="15" fill="#000000">credentials in prompts.</text>
  <text x="480" y="551" text-anchor="middle" font-size="13" fill="#333333">Each net catches what the others miss; agentic tools need all five.</text>
</svg>
