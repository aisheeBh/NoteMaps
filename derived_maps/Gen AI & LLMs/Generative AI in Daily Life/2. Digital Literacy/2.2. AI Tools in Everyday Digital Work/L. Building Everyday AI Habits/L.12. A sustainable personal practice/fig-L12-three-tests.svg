<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Three tests of a sustainable practice</title>
  <desc>Three pillars support a roof labelled sustainable personal AI practice. The pillars are: durable, meaning it keeps working when tools change; balanced, meaning it delivers value without unacceptable costs to skills, relationships, wellbeing or money; and self-correcting, meaning it notices and fixes problems through measurement and review. A foundation beneath reads professional expertise and values.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Three tests of a sustainable practice</text>
  <path d="M80 160 L480 92 L880 160 Z" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="480" y="148" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">A sustainable personal AI practice</text>
  <rect x="110" y="175" width="220" height="255" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="118" y="235" width="204" height="133" rx="4" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="220" y="258" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">Durable</text>
  <text x="220" y="290" text-anchor="middle" font-size="14" fill="#111111">Keeps working when tools,</text>
  <text x="220" y="308" text-anchor="middle" font-size="14" fill="#111111">models and prices change.</text>
  <text x="220" y="326" text-anchor="middle" font-size="14" fill="#111111">Built on transferable</text>
  <text x="220" y="345" text-anchor="middle" font-size="14" fill="#111111">skills and portable</text>
  <text x="220" y="363" text-anchor="middle" font-size="14" fill="#111111">prompts.</text>
  <rect x="370" y="175" width="220" height="255" rx="6" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
  <rect x="378" y="235" width="204" height="133" rx="4" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/>
  <text x="480" y="258" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">Balanced</text>
  <text x="480" y="290" text-anchor="middle" font-size="14" fill="#111111">Delivers value without</text>
  <text x="480" y="308" text-anchor="middle" font-size="14" fill="#111111">unacceptable costs to</text>
  <text x="480" y="326" text-anchor="middle" font-size="14" fill="#111111">skills, relationships,</text>
  <text x="480" y="345" text-anchor="middle" font-size="14" fill="#111111">wellbeing, money or</text>
  <text x="480" y="363" text-anchor="middle" font-size="14" fill="#111111">others.</text>
  <rect x="630" y="175" width="220" height="255" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="638" y="244" width="204" height="115" rx="4" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="740" y="267" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">Self-correcting</text>
  <text x="740" y="299" text-anchor="middle" font-size="14" fill="#111111">Notices drift and fixes</text>
  <text x="740" y="317" text-anchor="middle" font-size="14" fill="#111111">it through measurement,</text>
  <text x="740" y="335" text-anchor="middle" font-size="14" fill="#111111">rhythms of review and</text>
  <text x="740" y="354" text-anchor="middle" font-size="14" fill="#111111">honest reflection.</text>
  <rect x="80" y="445" width="800" height="60" rx="6" fill="#E6E6E6" stroke="#666666" stroke-width="2" stroke-dasharray="2 4"/>
  <text x="480" y="480" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Foundation: professional expertise and values</text>
  <text x="480" y="544" text-anchor="middle" font-size="13" fill="#333333">Conceptual model.</text>
</svg>
