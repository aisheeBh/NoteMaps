<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Technostress and its counters</title>
  <desc>Five columns, one for each creator of technostress identified by Tarafdar and colleagues in 2007: techno-overload, techno-invasion, techno-complexity, techno-insecurity and techno-uncertainty. Beneath each, an arrow leads to the element of a sustainable AI practice that counters it: time and regeneration limits; wellbeing limits and off-switches; anchored routines and a small stable core; protected skills and sharing; filtered information diet and periodic review.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Five creators of technostress, and what counters each</text>
  <rect x="30" y="100" width="168" height="170" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="38" y="147" width="152" height="74" rx="4" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
  <text x="114" y="167" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Techno-overload</text>
  <text x="114" y="195" text-anchor="middle" font-size="14" fill="#111111">Pressure to work</text>
  <text x="114" y="213" text-anchor="middle" font-size="14" fill="#111111">faster and longer</text>
  <line x1="114" y1="276" x2="114" y2="320" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="30" y="325" width="168" height="150" rx="6" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
  <rect x="38" y="353" width="152" height="93" rx="4" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/>
  <text x="114" y="373" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Counter</text>
  <text x="114" y="401" text-anchor="middle" font-size="14" fill="#111111">Time-boxes and</text>
  <text x="114" y="419" text-anchor="middle" font-size="14" fill="#111111">regeneration</text>
  <text x="114" y="437" text-anchor="middle" font-size="14" fill="#111111">limits</text>
  <rect x="213" y="100" width="168" height="170" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="221" y="147" width="152" height="74" rx="4" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
  <text x="297" y="167" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Techno-invasion</text>
  <text x="297" y="195" text-anchor="middle" font-size="14" fill="#111111">Work spills into</text>
  <text x="297" y="213" text-anchor="middle" font-size="14" fill="#111111">personal time</text>
  <line x1="297" y1="276" x2="297" y2="320" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="213" y="325" width="168" height="150" rx="6" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
  <rect x="221" y="362" width="152" height="74" rx="4" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/>
  <text x="297" y="382" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Counter</text>
  <text x="297" y="410" text-anchor="middle" font-size="14" fill="#111111">Wellbeing limits</text>
  <text x="297" y="428" text-anchor="middle" font-size="14" fill="#111111">and off-switches</text>
  <rect x="396" y="100" width="168" height="170" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="404" y="138" width="152" height="93" rx="4" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
  <text x="480" y="158" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Techno-complexity</text>
  <text x="480" y="186" text-anchor="middle" font-size="14" fill="#111111">Tools so complex</text>
  <text x="480" y="204" text-anchor="middle" font-size="14" fill="#111111">one feels</text>
  <text x="480" y="222" text-anchor="middle" font-size="14" fill="#111111">inadequate</text>
  <line x1="480" y1="276" x2="480" y2="320" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="396" y="325" width="168" height="150" rx="6" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
  <rect x="404" y="362" width="152" height="74" rx="4" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/>
  <text x="480" y="382" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Counter</text>
  <text x="480" y="410" text-anchor="middle" font-size="14" fill="#111111">Anchored routines,</text>
  <text x="480" y="428" text-anchor="middle" font-size="14" fill="#111111">small stable core</text>
  <rect x="579" y="100" width="168" height="170" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="587" y="147" width="152" height="74" rx="4" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
  <text x="663" y="167" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Techno-insecurity</text>
  <text x="663" y="195" text-anchor="middle" font-size="14" fill="#111111">Fear of being</text>
  <text x="663" y="213" text-anchor="middle" font-size="14" fill="#111111">replaced</text>
  <line x1="663" y1="276" x2="663" y2="320" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="579" y="325" width="168" height="150" rx="6" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
  <rect x="587" y="362" width="152" height="74" rx="4" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/>
  <text x="663" y="382" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Counter</text>
  <text x="663" y="410" text-anchor="middle" font-size="14" fill="#111111">Protected skills</text>
  <text x="663" y="428" text-anchor="middle" font-size="14" fill="#111111">and sharing</text>
  <rect x="762" y="100" width="168" height="170" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="770" y="147" width="152" height="74" rx="4" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
  <text x="846" y="167" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Techno-uncertainty</text>
  <text x="846" y="195" text-anchor="middle" font-size="14" fill="#111111">Constant change</text>
  <text x="846" y="213" text-anchor="middle" font-size="14" fill="#111111">and relearning</text>
  <line x1="846" y1="276" x2="846" y2="320" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="762" y="325" width="168" height="150" rx="6" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
  <rect x="770" y="362" width="152" height="74" rx="4" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/>
  <text x="846" y="382" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Counter</text>
  <text x="846" y="410" text-anchor="middle" font-size="14" fill="#111111">Filtered news and</text>
  <text x="846" y="428" text-anchor="middle" font-size="14" fill="#111111">periodic review</text>
  <text x="480" y="505" text-anchor="middle" font-size="14" font-style="italic" fill="#111111">Creators after Tarafdar and colleagues (2007); counters are practice recommendations.</text>
  <text x="480" y="544" text-anchor="middle" font-size="13" fill="#333333">Conceptual mapping; each counter also helps with other creators.</text>
</svg>
