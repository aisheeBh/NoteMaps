<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>How new it is, against what it adds</title>
  <desc>A two-by-two matrix. New and high value: worth a fair trial. Established and high value: the core toolset to keep and deepen. New and low value: distractions to ignore or note for later. Established and low value: candidates to retire.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">How new it is, against what it adds</text>
  <rect x="156" y="101" width="368" height="188" rx="6" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
  <rect x="164" y="155" width="352" height="78" rx="4" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/>
  <text x="340" y="176" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Core: keep and deepen</text>
  <text x="340" y="205" text-anchor="middle" font-size="15" fill="#111111">Proven on real work; invest in skill and</text>
  <text x="340" y="225" text-anchor="middle" font-size="15" fill="#111111">prompts</text>
  <rect x="536" y="101" width="368" height="188" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="544" y="155" width="352" height="78" rx="4" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="720" y="176" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Worth a fair trial</text>
  <text x="720" y="205" text-anchor="middle" font-size="15" fill="#111111">Possible genuine advance; test within the</text>
  <text x="720" y="225" text-anchor="middle" font-size="15" fill="#111111">exploration budget</text>
  <rect x="156" y="301" width="368" height="188" rx="6" fill="#E6E6E6" stroke="#666666" stroke-width="2" stroke-dasharray="2 4"/>
  <text x="340" y="386" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Retire</text>
  <text x="340" y="415" text-anchor="middle" font-size="15" fill="#111111">Familiar but no longer earning its place</text>
  <rect x="536" y="301" width="368" height="188" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="544" y="355" width="352" height="78" rx="4" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
  <text x="720" y="376" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Distraction</text>
  <text x="720" y="405" text-anchor="middle" font-size="15" fill="#111111">Exciting but adds little; note it, look</text>
  <text x="720" y="425" text-anchor="middle" font-size="15" fill="#111111">again later</text>
  <line x1="150" y1="509" x2="910" y2="509" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="136" y1="495" x2="136" y2="95" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="160" y="533" text-anchor="start" font-size="14" fill="#111111">established</text>
  <text x="910" y="533" text-anchor="end" font-size="14" fill="#111111">just released</text>
  <text x="530" y="555" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">How new the tool or feature is</text>
  <text x="120" y="495" text-anchor="start" font-size="14" fill="#111111" transform="rotate(-90 120 495)">low</text>
  <text x="120" y="95" text-anchor="end" font-size="14" fill="#111111" transform="rotate(-90 120 95)">high</text>
  <text x="90" y="295" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111" transform="rotate(-90 90 295.0)">Measured value on one's own tasks</text>
  <text x="480" y="584" text-anchor="middle" font-size="13" fill="#333333">Value is judged by measurement on the person's own tasks, not by announcements or benchmarks.</text>
</svg>
