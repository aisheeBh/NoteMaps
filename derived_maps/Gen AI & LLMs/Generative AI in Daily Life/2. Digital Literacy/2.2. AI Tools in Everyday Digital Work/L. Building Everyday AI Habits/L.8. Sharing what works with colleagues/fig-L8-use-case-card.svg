<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 670" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The anatomy of a use-case card</title>
  <desc>A card for sharing an AI routine. The title states input and output. Below are eight fields: task, tool, instruction template, the check, evidence from measured uses, limits, a data note and the owner with a review date.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">A use-case card for sharing an AI routine</text>
  <rect x="40" y="85" width="880" height="525" rx="10" fill="#FFFFFF" stroke="#333333" stroke-width="2.5"/>
  <rect x="60" y="100" width="840" height="70" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="480" y="127" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">Case file to claim chronology</text>
  <text x="480" y="159" text-anchor="middle" font-size="14" fill="#FFFFFF">Owner: claims handler; reviewed quarterly</text>
  <rect x="60" y="184" width="415" height="94" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="268" y="223" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Task</text>
  <text x="268" y="252" text-anchor="middle" font-size="14" fill="#111111">Dated chronology of events from a claim file</text>
  <rect x="485" y="184" width="415" height="94" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="692" y="223" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Tool</text>
  <text x="692" y="252" text-anchor="middle" font-size="14" fill="#111111">Approved assistant inside the case system</text>
  <rect x="60" y="288" width="415" height="94" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="68" y="306" width="399" height="57" rx="4" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="268" y="327" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Instruction</text>
  <text x="268" y="356" text-anchor="middle" font-size="14" fill="#111111">Template: use only stated dates; quote unclear ones</text>
  <rect x="485" y="288" width="415" height="94" rx="6" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
  <rect x="493" y="306" width="399" height="57" rx="4" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/>
  <text x="692" y="327" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Check</text>
  <text x="692" y="356" text-anchor="middle" font-size="14" fill="#111111">Every date against its source; no uncited documents</text>
  <rect x="60" y="392" width="415" height="94" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="68" y="400" width="399" height="76" rx="4" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="268" y="421" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Evidence</text>
  <text x="268" y="451" text-anchor="middle" font-size="14" fill="#111111">30 files, about 40 minutes saved each, net of</text>
  <text x="268" y="469" text-anchor="middle" font-size="14" fill="#111111">checking</text>
  <rect x="485" y="392" width="415" height="94" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="493" y="410" width="399" height="57" rx="4" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
  <text x="692" y="431" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Limits</text>
  <text x="692" y="460" text-anchor="middle" font-size="14" fill="#111111">Property claims only; not scanned handwriting</text>
  <rect x="60" y="496" width="415" height="94" rx="6" fill="#E6E6E6" stroke="#666666" stroke-width="2" stroke-dasharray="2 4"/>
  <text x="268" y="535" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Data note</text>
  <text x="268" y="564" text-anchor="middle" font-size="14" fill="#111111">Stay inside the case system</text>
  <rect x="485" y="496" width="415" height="94" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <text x="692" y="535" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Failures seen</text>
  <text x="692" y="564" text-anchor="middle" font-size="14" fill="#111111">Invented dates in week 1; fixed by rule</text>
  <text x="480" y="654" text-anchor="middle" font-size="13" fill="#333333">Illustrative card; figures are illustrative.</text>
</svg>
