<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Where to start: frequency against the cost of an error</title>
  <desc>A two-by-two matrix. Frequent tasks with low error cost are the best anchor tasks. Frequent high-cost tasks need strong checks and come later. Rare low-cost tasks are occasional uses. Rare high-cost tasks are the worst place to start.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Where to start: frequency against the cost of an error</text>
  <rect x="156" y="101" width="368" height="188" rx="6" fill="#F6CACA" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="340" y="176" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Worst first choice</text>
  <text x="340" y="205" text-anchor="middle" font-size="15" fill="#111111">Rare and high in stakes, e.g. the annual</text>
  <text x="340" y="225" text-anchor="middle" font-size="15" fill="#111111">board paper or a client opinion</text>
  <rect x="536" y="101" width="368" height="188" rx="6" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="720" y="176" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Later, with strong checks</text>
  <text x="720" y="205" text-anchor="middle" font-size="15" fill="#111111">Frequent but costly if wrong, e.g. figures</text>
  <text x="720" y="225" text-anchor="middle" font-size="15" fill="#111111">sent to clients</text>
  <rect x="156" y="301" width="368" height="188" rx="6" fill="#E6E6E6" stroke="#666666" stroke-width="2" stroke-dasharray="2 4"/>
  <text x="340" y="376" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Occasional use only</text>
  <text x="340" y="405" text-anchor="middle" font-size="15" fill="#111111">Rare and low in stakes; too infrequent to</text>
  <text x="340" y="425" text-anchor="middle" font-size="15" fill="#111111">form a habit</text>
  <rect x="536" y="301" width="368" height="188" rx="6" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
  <rect x="544" y="355" width="352" height="78" rx="4" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/>
  <text x="720" y="376" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Best anchor tasks</text>
  <text x="720" y="405" text-anchor="middle" font-size="15" fill="#111111">Frequent, bounded, easy to check, e.g.</text>
  <text x="720" y="425" text-anchor="middle" font-size="15" fill="#111111">weekly summary of call notes</text>
  <line x1="150" y1="509" x2="910" y2="509" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="136" y1="495" x2="136" y2="95" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="160" y="533" text-anchor="start" font-size="14" fill="#111111">rare</text>
  <text x="910" y="533" text-anchor="end" font-size="14" fill="#111111">daily or weekly</text>
  <text x="530" y="555" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">How often the task recurs</text>
  <text x="120" y="495" text-anchor="start" font-size="14" fill="#111111" transform="rotate(-90 120 495)">low</text>
  <text x="120" y="95" text-anchor="end" font-size="14" fill="#111111" transform="rotate(-90 120 95)">high</text>
  <text x="90" y="295" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111" transform="rotate(-90 90 295.0)">Cost of an undetected error</text>
  <text x="480" y="584" text-anchor="middle" font-size="13" fill="#333333">Placement is a judgement for each role; the examples are typical, not fixed.</text>
</svg>
