<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Practice scores and later unaided scores under three conditions</title>
  <desc>Schematic bar chart. For three conditions, a practice bar and a later unaided test bar are shown. Unrestricted AI raises practice scores but lowers the later unaided test score; guided AI with hints stays close to the no-AI control on the test.</desc>

  <text x="480" y="56" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Practice with and without AI, and later unaided performance</text>
  <text x="480" y="82" text-anchor="middle" font-size="16" fill="#111111">Practice = score while practising. Later test = unaided score afterwards.</text>

  <text x="110" y="108" font-size="14" fill="#111111">Score (schematic)</text>
  <line x1="110" y1="115" x2="110" y2="420" stroke="#222222" stroke-width="1.5"/>
  <line x1="110" y1="420" x2="900" y2="420" stroke="#222222" stroke-width="1.5"/>

  <!-- No AI -->
  <rect x="160" y="250" width="90" height="170" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="270" y="250" width="90" height="170" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="205" y="240" text-anchor="middle" font-size="14" fill="#111111">Practice</text>
  <text x="315" y="240" text-anchor="middle" font-size="14" fill="#111111">Later test</text>
  <text x="260" y="446" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">No AI</text>

  <!-- Unrestricted AI -->
  <rect x="380" y="150" width="90" height="270" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="490" y="300" width="90" height="120" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="425" y="140" text-anchor="middle" font-size="14" fill="#111111">Practice</text>
  <text x="535" y="290" text-anchor="middle" font-size="14" fill="#111111">Later test</text>
  <text x="480" y="446" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Unrestricted AI</text>

  <!-- Guided AI -->
  <rect x="600" y="180" width="90" height="240" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="710" y="245" width="90" height="175" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="645" y="170" text-anchor="middle" font-size="14" fill="#111111">Practice</text>
  <text x="755" y="235" text-anchor="middle" font-size="14" fill="#111111">Later test</text>
  <text x="700" y="446" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Guided AI (hints)</text>

  <text x="480" y="492" text-anchor="middle" font-size="14" fill="#333333">Schematic; not plotted from a single dataset. Bar heights show the direction of each effect, not its size.</text>
</svg>
