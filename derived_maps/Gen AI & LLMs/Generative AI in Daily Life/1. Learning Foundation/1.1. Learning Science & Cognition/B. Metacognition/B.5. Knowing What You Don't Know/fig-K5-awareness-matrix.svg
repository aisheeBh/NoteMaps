<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Knowledge crossed with awareness</title>
  <desc>A two-by-two grid. Columns: aware or unaware. Rows: known or not known. Known and aware: known knowns. Not known but aware: known unknowns. Not known and unaware: unknown unknowns, the dangerous cell. Known but unaware: unknown knowns. An arrow shows learning moving items from unknown unknowns to known unknowns to known knowns.</desc>
  <defs>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">What is known, and whether one knows it</text>

  <text x="425" y="84" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">AWARE of it</text>
  <text x="725" y="84" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">UNAWARE of it</text>
  <text x="150" y="205" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">KNOWN</text>
  <text x="150" y="425" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">NOT KNOWN</text>

  <rect x="280" y="100" width="290" height="210" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="580" y="100" width="290" height="210" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="280" y="320" width="290" height="210" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="580" y="320" width="290" height="210" fill="url(#lines)" stroke="#8B0000" stroke-width="3" stroke-dasharray="3 3"/>

  <rect x="300" y="150" width="250" height="110" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1.5"/>
  <text x="425" y="182" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">KNOWN KNOWNS</text>
  <text x="425" y="208" text-anchor="middle" font-size="14" fill="#111111">used with justified</text>
  <text x="425" y="226" text-anchor="middle" font-size="14" fill="#111111">confidence</text>

  <rect x="600" y="150" width="250" height="110" fill="#FFFFFF" stroke="#7A5200" stroke-width="1.5"/>
  <text x="725" y="182" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">UNKNOWN KNOWNS</text>
  <text x="725" y="208" text-anchor="middle" font-size="14" fill="#111111">tacit or neglected</text>
  <text x="725" y="226" text-anchor="middle" font-size="14" fill="#111111">knowledge left unused</text>

  <rect x="300" y="370" width="250" height="110" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1.5"/>
  <text x="425" y="402" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">KNOWN UNKNOWNS</text>
  <text x="425" y="428" text-anchor="middle" font-size="14" fill="#111111">visible gaps: questions</text>
  <text x="425" y="446" text-anchor="middle" font-size="14" fill="#111111">that can be researched</text>

  <rect x="600" y="370" width="250" height="110" fill="#FFFFFF" stroke="#8B0000" stroke-width="1.5"/>
  <text x="725" y="402" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">UNKNOWN UNKNOWNS</text>
  <text x="725" y="428" text-anchor="middle" font-size="14" fill="#111111">invisible gaps: the</text>
  <text x="725" y="446" text-anchor="middle" font-size="14" fill="#111111">source of confident error</text>

  <!-- learning path -->
  <path d="M640 500 C 600 560, 520 560, 480 500" fill="none" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M340 370 C 320 340, 320 300, 340 266" fill="none" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="470" y="548" width="200" height="24" fill="#FFFFFF"/>
  <text x="570" y="566" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">1. notice the gap</text>
  <rect x="186" y="304" width="88" height="44" fill="#FFFFFF"/>
  <text x="270" y="322" text-anchor="end" font-size="14" font-weight="bold" fill="#111111">2. learn</text>
  <text x="270" y="340" text-anchor="end" font-size="14" font-weight="bold" fill="#111111">it</text>
</svg>
