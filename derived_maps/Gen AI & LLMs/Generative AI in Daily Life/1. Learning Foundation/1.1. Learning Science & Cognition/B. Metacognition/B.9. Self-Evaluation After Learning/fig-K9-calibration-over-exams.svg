<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Self-estimate accuracy across repeated exams</title>
  <desc>The gap between estimated and actual score is plotted across four exams in a course. For high-scoring students the gap is small and shrinks towards zero. For low-scoring students the gap remains large and positive, showing persistent overconfidence.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Feedback recalibrates strong students more than weak ones</text>

  <line x1="140" y1="420" x2="860" y2="420" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="140" y1="440" x2="140" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="140" y1="380" x2="840" y2="380" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="846" y="384" font-size="14" fill="#111111">accurate</text>
  <g font-size="15" fill="#111111" text-anchor="middle">
    <text x="240" y="446">Exam 1</text><text x="420" y="446">Exam 2</text><text x="600" y="446">Exam 3</text><text x="780" y="446">Exam 4</text>
  </g>
  <text x="500" y="476" text-anchor="middle" font-size="16" fill="#111111">Successive exams with feedback</text>
  <text x="60" y="250" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 60 250)">Overconfidence: estimate minus score</text>

  <!-- low scorers: dashed, high and flat -->
  <polyline points="240,140 420,146 600,138 780,150" fill="none" stroke="#222222" stroke-width="3" stroke-dasharray="10 6"/>
  <g fill="#FFFFFF" stroke="#222222" stroke-width="2.5"><circle cx="240" cy="140" r="6"/><circle cx="420" cy="146" r="6"/><circle cx="600" cy="138" r="6"/><circle cx="780" cy="150" r="6"/></g>
  <!-- high scorers: solid, small and shrinking -->
  <polyline points="240,320 420,345 600,365 780,374" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <g fill="#1F3B5C"><circle cx="240" cy="320" r="6"/><circle cx="420" cy="345" r="6"/><circle cx="600" cy="365" r="6"/><circle cx="780" cy="374" r="6"/></g>

  <rect x="300" y="78" width="300" height="46" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="312" y="98" font-size="15" font-weight="bold" fill="#111111">Low-scoring students</text>
  <text x="312" y="116" font-size="14" fill="#111111">stay overconfident despite feedback</text>

  <rect x="300" y="250" width="300" height="46" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="312" y="270" font-size="15" font-weight="bold" fill="#111111">High-scoring students</text>
  <text x="312" y="288" font-size="14" fill="#111111">small gap that shrinks over time</text>

  <text x="480" y="520" text-anchor="middle" font-size="13" fill="#333333">Schematic of the pattern reported by Hacker, Bol and colleagues (2000); not plotted from their data.</text>
</svg>
