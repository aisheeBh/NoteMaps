<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>A ladder of evidence for claims that a method causes learning</title>
  <desc>Seven kinds of evidence arranged as rising steps, from testimonials and satisfaction data at the bottom, through before-after comparisons, correlational studies and quasi-experiments, to randomised experiments and replicated randomised trials in realistic settings at the top.</desc>
  <defs>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="38" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">How strongly does the evidence show that a method caused learning?</text>

  <!-- steps: base y=470; heights rise -->
  <rect x="90"  y="430" width="114" height="40"  fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="208" y="400" width="114" height="70"  fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="326" y="365" width="114" height="105" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="444" y="325" width="114" height="145" fill="url(#dots)"  stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="562" y="280" width="114" height="190" fill="url(#dots)"  stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="680" y="230" width="114" height="240" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="798" y="175" width="114" height="295" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>

  <!-- step labels (above each step) -->
  <g font-size="14" fill="#111111" text-anchor="middle">
    <rect x="94" y="370" width="106" height="52" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
    <text x="147" y="391">Testimonial</text><text x="147" y="410">or anecdote</text>

    <rect x="212" y="340" width="106" height="52" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
    <text x="265" y="361">Satisfaction,</text><text x="265" y="380">completion</text>

    <rect x="330" y="286" width="106" height="71" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
    <text x="383" y="307">Before and</text><text x="383" y="326">after, no</text><text x="383" y="345">comparison</text>

    <rect x="448" y="265" width="106" height="52" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
    <text x="501" y="286">Correlational</text><text x="501" y="305">study</text>

    <rect x="566" y="201" width="106" height="71" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
    <text x="619" y="222">Quasi-</text><text x="619" y="241">experiment,</text><text x="619" y="260">matched group</text>

    <rect x="684" y="151" width="106" height="71" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1.5"/>
    <text x="737" y="172">Randomised</text><text x="737" y="191">experiment,</text><text x="737" y="210">delayed test</text>

    <rect x="802" y="77" width="106" height="90" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1.5"/>
    <text x="855" y="98">Replicated</text><text x="855" y="117">randomised</text><text x="855" y="136">trials in real</text><text x="855" y="155">settings</text>
  </g>

  <!-- axis -->
  <line x1="70" y1="470" x2="930" y2="470" stroke="#222222" stroke-width="2"/>
  <line x1="60" y1="470" x2="60" y2="90" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="42" y="280" text-anchor="middle" font-size="15" fill="#111111" transform="rotate(-90 42 280)">confidence that the method caused it</text>

  <!-- group labels -->
  <text x="265" y="496" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">WEAK: cannot rule out</text>
  <text x="265" y="515" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">other explanations</text>
  <text x="560" y="496" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">MODERATE: some</text>
  <text x="560" y="515" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">alternatives remain</text>
  <text x="796" y="496" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">STRONG: chance decides</text>
  <text x="796" y="515" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">who gets the method</text>

  <text x="480" y="552" text-anchor="middle" font-size="14" fill="#111111">Quality within a design also matters: a small, badly run trial can be weaker than a careful quasi-experiment.</text>
  <text x="480" y="580" text-anchor="middle" font-size="13" fill="#333333">Schematic ranking; step heights are illustrative, not measured.</text>
</svg>
