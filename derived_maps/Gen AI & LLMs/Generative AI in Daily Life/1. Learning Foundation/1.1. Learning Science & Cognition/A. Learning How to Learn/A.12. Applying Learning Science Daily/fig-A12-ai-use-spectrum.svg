<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Spectrum of AI use for learning</title>
  <desc>Five modes of AI use arranged from replacing the learner's thinking to strengthening it: answer machine, explainer, tutor or quizmaster, critic of the learner's attempt, and sparring partner. Under each, who does the thinking: the AI; mostly the AI; the learner retrieves; the learner attempts first; the learner performs under pressure.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">The same tool can replace learning or strengthen it</text>

  <line x1="40" y1="90" x2="920" y2="90" stroke="#222222" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <rect x="40" y="62" width="250" height="20" fill="#FFFFFF"/>
  <text x="40" y="78" font-size="16" font-weight="bold" fill="#111111">REPLACES THE LEARNER'S THINKING</text>
  <text x="920" y="78" text-anchor="end" font-size="16" font-weight="bold" fill="#111111">STRENGTHENS IT</text>

  <!-- five columns, each 168 wide, gap 10, start 40 -->
  <g font-size="15" fill="#111111" text-anchor="middle">
    <rect x="40" y="110" width="168" height="250" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
    <rect x="52" y="122" width="144" height="226" fill="#FFFFFF"/>
    <text x="124" y="152" font-size="17" font-weight="bold">Answer</text>
    <text x="124" y="174" font-size="17" font-weight="bold">machine</text>
    <text x="124" y="214">"Write it</text>
    <text x="124" y="234">for me."</text>
    <text x="124" y="284">Thinking:</text>
    <text x="124" y="304" font-weight="bold">the AI</text>

    <rect x="218" y="110" width="168" height="250" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
    <rect x="230" y="122" width="144" height="226" fill="#FFFFFF"/>
    <text x="302" y="152" font-size="17" font-weight="bold">Explainer</text>
    <text x="302" y="214">"Explain</text>
    <text x="302" y="234">why."</text>
    <text x="302" y="284">Thinking:</text>
    <text x="302" y="304" font-weight="bold">mostly the AI</text>

    <rect x="396" y="110" width="168" height="250" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
    <rect x="408" y="122" width="144" height="226" fill="#FFFFFF"/>
    <text x="480" y="152" font-size="17" font-weight="bold">Tutor or</text>
    <text x="480" y="174" font-size="17" font-weight="bold">quizmaster</text>
    <text x="480" y="214">"Ask me</text>
    <text x="480" y="234">questions."</text>
    <text x="480" y="284">Thinking:</text>
    <text x="480" y="304" font-weight="bold">learner retrieves</text>

    <rect x="574" y="110" width="168" height="250" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
    <rect x="586" y="122" width="144" height="226" fill="#FFFFFF"/>
    <text x="658" y="152" font-size="17" font-weight="bold">Critic</text>
    <text x="658" y="214">"What is wrong</text>
    <text x="658" y="234">with my attempt?"</text>
    <text x="658" y="284">Thinking:</text>
    <text x="658" y="304" font-weight="bold">learner first</text>

    <rect x="752" y="110" width="168" height="250" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
    <rect x="764" y="122" width="144" height="226" fill="#FFFFFF"/>
    <text x="836" y="152" font-size="17" font-weight="bold">Sparring</text>
    <text x="836" y="174" font-size="17" font-weight="bold">partner</text>
    <text x="836" y="214">"Push back on</text>
    <text x="836" y="234">my proposal."</text>
    <text x="836" y="284">Thinking:</text>
    <text x="836" y="304" font-weight="bold">learner, under</text>
    <text x="836" y="324" font-weight="bold">pressure</text>
  </g>

  <rect x="40" y="384" width="880" height="96" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="60" y="414" font-size="16" font-weight="bold" fill="#111111">Rule of thumb for anything that should be learned:</text>
  <text x="60" y="440" font-size="15" fill="#111111">attempt first, then move right along the spectrum. Use the answer-machine mode only for tasks</text>
  <text x="60" y="462" font-size="15" fill="#111111">deliberately delegated — and verify the result.</text>
</svg>
