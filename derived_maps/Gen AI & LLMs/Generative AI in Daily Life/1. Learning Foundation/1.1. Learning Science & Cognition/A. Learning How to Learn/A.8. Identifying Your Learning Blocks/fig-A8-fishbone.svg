<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Cause-and-effect diagram of one learner's block</title>
  <desc>A fishbone diagram for an analyst who has failed a Python assessment twice. Three bones above the spine are cognitive, skill and habit causes; two below are emotional and environmental causes. Each bone lists two specific causes found during diagnosis.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Five families of cause behind one stuck learner</text>

  <!-- spine -->
  <line x1="50" y1="320" x2="762" y2="320" stroke="#222222" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="770" y="270" width="166" height="100" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="853" y="305" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Fails Python</text>
  <text x="853" y="327" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">assessment</text>
  <text x="853" y="349" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">twice</text>

  <!-- top bones: from (x-120,110) to (x,320) -->
  <g stroke="#1F3B5C" stroke-width="3">
    <line x1="140" y1="110" x2="260" y2="320"/>
    <line x1="370" y1="110" x2="490" y2="320"/>
    <line x1="600" y1="110" x2="720" y2="320"/>
  </g>
  <g fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2">
    <rect x="80" y="66" width="120" height="34" rx="4"/>
    <rect x="310" y="66" width="120" height="34" rx="4"/>
    <rect x="540" y="66" width="120" height="34" rx="4"/>
  </g>
  <g font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">
    <text x="140" y="89">Cognitive</text><text x="370" y="89">Skill</text><text x="600" y="89">Habit</text>
  </g>
  <g font-size="14" fill="#111111">
    <text x="184" y="170">loops never understood</text>
    <text x="224" y="240">misreads error messages</text>
    <text x="414" y="170">copies tutorial code</text>
    <text x="454" y="240">no self-testing</text>
    <text x="644" y="170">studies late at night</text>
    <text x="695" y="240">asks AI for</text>
    <text x="695" y="258">whole answers</text>
  </g>

  <!-- bottom bones: from (x-120,530) to (x,320) -->
  <g stroke="#8B0000" stroke-width="3" stroke-dasharray="6 4">
    <line x1="255" y1="530" x2="375" y2="320"/>
    <line x1="485" y1="530" x2="605" y2="320"/>
  </g>
  <g fill="#F6CACA" stroke="#8B0000" stroke-width="2">
    <rect x="185" y="534" width="140" height="34" rx="4"/>
    <rect x="415" y="534" width="140" height="34" rx="4"/>
  </g>
  <g font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">
    <text x="255" y="557">Emotional</text><text x="485" y="557">Environmental</text>
  </g>
  <g font-size="14" fill="#111111">
    <text x="339" y="400">dreads looking stupid</text>
    <text x="299" y="470">avoids asking colleagues</text>
    <text x="569" y="400">constant interruptions</text>
    <text x="529" y="470">no protected time</text>
  </g>

  <text x="480" y="592" text-anchor="middle" font-size="13" fill="#333333">Illustrative diagnosis from a worked example.</text>
</svg>
