<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The components of learning ability</title>
  <desc>Six bars for the components of learning ability, ordered from most fixed to most malleable: general cognitive ability, prior knowledge, dispositions, metacognition, environment and learning strategies. Bar height shows the schematic room for deliberate improvement.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">The components of learning ability</text>

  <!-- direction arrow -->
  <line x1="60" y1="72" x2="900" y2="72" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="80" width="140" height="22" fill="#FFFFFF"/>
  <text x="44" y="96" font-size="15" font-weight="bold" fill="#111111">MOST FIXED</text>
  <text x="916" y="96" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">MOST MALLEABLE</text>

  <!-- baseline -->
  <line x1="30" y1="470" x2="930" y2="470" stroke="#222222" stroke-width="2"/>

  <!-- bars: x step 148, width 136 -->
  <rect x="40"  y="400" width="136" height="70"  fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <rect x="188" y="330" width="136" height="140" fill="url(#hatch)" stroke="#222222" stroke-width="2"/>
  <rect x="336" y="290" width="136" height="180" fill="url(#lines)" stroke="#222222" stroke-width="2"/>
  <rect x="484" y="260" width="136" height="210" fill="url(#dots)" stroke="#222222" stroke-width="2"/>
  <rect x="632" y="230" width="136" height="240" fill="#FFFFFF" stroke="#222222" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="780" y="150" width="136" height="320" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>

  <!-- labels above bars -->
  <g text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">
    <text x="108" y="370">General</text><text x="108" y="389">cognitive ability</text>
    <text x="256" y="300">Prior</text><text x="256" y="319">knowledge</text>
    <text x="404" y="279">Dispositions</text>
    <text x="552" y="249">Metacognition</text>
    <text x="700" y="219">Environment</text>
    <text x="848" y="120">Learning</text><text x="848" y="139">strategies</text>
  </g>

  <!-- how to strengthen, on white backing inside bars where tall enough -->
  <g text-anchor="middle" font-size="14" fill="#111111">
    <rect x="196" y="380" width="120" height="44" fill="#FFFFFF"/>
    <text x="256" y="398">connected</text><text x="256" y="416">study</text>
    <rect x="344" y="350" width="120" height="44" fill="#FFFFFF"/>
    <text x="404" y="368">success after</text><text x="404" y="386">struggle</text>
    <rect x="492" y="330" width="120" height="44" fill="#FFFFFF"/>
    <text x="552" y="348">predict, then</text><text x="552" y="366">check</text>
    <text x="700" y="318">mentors, time,</text><text x="700" y="336">feedback</text>
    <rect x="788" y="250" width="120" height="44" fill="#FFFFFF"/>
    <text x="848" y="268">self-testing,</text><text x="848" y="286">spacing</text>
  </g>
  <text x="108" y="440" text-anchor="middle" font-size="14" fill="#FFFFFF">little change</text>

  <text x="480" y="500" text-anchor="middle" font-size="15" fill="#111111">Bar height: room for deliberate improvement in adulthood</text>
  <text x="480" y="560" text-anchor="middle" font-size="13" fill="#333333">Schematic; relative heights summarise research evidence qualitatively and are not measured quantities.</text>
</svg>
