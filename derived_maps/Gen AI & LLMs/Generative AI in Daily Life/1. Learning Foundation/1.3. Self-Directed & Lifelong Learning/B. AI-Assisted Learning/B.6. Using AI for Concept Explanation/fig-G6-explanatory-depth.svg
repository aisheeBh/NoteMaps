<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Confidence in understanding before and after explaining</title>
  <desc>Three bars of self-rated understanding of a mechanism. Initial rating is fairly high. After reading a fluent explanation the rating rises further. After trying to write a step-by-step explanation unaided the rating falls well below the initial level, revealing the illusion.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Feeling of understanding versus attempting to explain</text>

  <line x1="120" y1="440" x2="880" y2="440" stroke="#222222" stroke-width="2"/>
  <line x1="120" y1="440" x2="120" y2="80" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="70" y="260" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 70 260)">Self-rated understanding</text>

  <rect x="180" y="200" width="160" height="240" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="200" y="222" width="120" height="26" fill="#FFFFFF"/>
  <text x="260" y="241" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Initial</text>

  <rect x="400" y="130" width="160" height="310" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="408" y="152" width="144" height="46" fill="#FFFFFF"/>
  <text x="480" y="171" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">After reading a</text>
  <text x="480" y="190" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">fluent explanation</text>

  <rect x="620" y="320" width="160" height="120" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="628" y="340" width="144" height="46" fill="#FFFFFF"/>
  <text x="700" y="359" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">After trying to</text>
  <text x="700" y="378" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">explain it unaided</text>

  <path d="M565 140 C 610 160, 660 230, 690 312" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="640" y="190" width="240" height="46" fill="#FFFFFF"/>
  <text x="650" y="209" font-size="15" fill="#111111">The illusion is exposed only</text>
  <text x="650" y="228" font-size="15" fill="#111111">when something is produced</text>

  <text x="480" y="480" text-anchor="middle" font-size="15" fill="#111111">The fall after explaining was shown by Rozenblit and Keil (2002); the rise after reading</text>
  <text x="480" y="500" text-anchor="middle" font-size="15" fill="#111111">illustrates the fluency effect of polished explanations.</text>
  <text x="480" y="535" text-anchor="middle" font-size="13" fill="#333333">Schematic; bar heights are illustrative, not data from a single study.</text>
</svg>
