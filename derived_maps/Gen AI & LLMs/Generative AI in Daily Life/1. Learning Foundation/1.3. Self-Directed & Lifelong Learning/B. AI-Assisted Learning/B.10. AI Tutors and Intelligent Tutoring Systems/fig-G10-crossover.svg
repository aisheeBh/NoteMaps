<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Crossover design of the Harvard physics AI tutor trial</title>
  <desc>Students were split into two groups. In week one, group A learned topic 1 with the AI tutor at home while group B learned it in an active-learning class; in week two the conditions swapped for topic 2. Each topic had a pre-test and post-test, so each student served as their own control.</desc>
  <defs>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Each student experienced both conditions</text>

  <text x="420" y="80" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Week 1: surface tension</text>
  <text x="760" y="80" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Week 2: fluid flow</text>

  <rect x="40" y="120" width="160" height="90" rx="10" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="120" y="160" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Group A</text>
  <text x="120" y="184" text-anchor="middle" font-size="14" fill="#FFFFFF">half the class</text>
  <rect x="40" y="290" width="160" height="90" rx="10" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="120" y="330" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Group B</text>
  <text x="120" y="354" text-anchor="middle" font-size="14" fill="#FFFFFF">other half</text>

  <g font-size="16" fill="#111111" text-anchor="middle">
    <rect x="290" y="115" width="260" height="100" rx="10" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
    <rect x="305" y="135" width="230" height="60" fill="#FFFFFF"/>
    <text x="420" y="160" font-weight="bold">AI tutor at home</text>
    <text x="420" y="182">pre-test, session, post-test</text>
    <rect x="290" y="285" width="260" height="100" rx="10" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
    <rect x="305" y="305" width="230" height="60" fill="#FFFFFF"/>
    <text x="420" y="330" font-weight="bold">Active-learning class</text>
    <text x="420" y="352">pre-test, session, post-test</text>

    <rect x="630" y="115" width="260" height="100" rx="10" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
    <rect x="645" y="135" width="230" height="60" fill="#FFFFFF"/>
    <text x="760" y="160" font-weight="bold">Active-learning class</text>
    <text x="760" y="182">pre-test, session, post-test</text>
    <rect x="630" y="285" width="260" height="100" rx="10" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
    <rect x="645" y="305" width="230" height="60" fill="#FFFFFF"/>
    <text x="760" y="330" font-weight="bold">AI tutor at home</text>
    <text x="760" y="352">pre-test, session, post-test</text>
  </g>
  <g stroke="#222222" stroke-width="2" marker-end="url(#arrow)">
    <line x1="200" y1="165" x2="286" y2="165"/>
    <line x1="200" y1="335" x2="286" y2="335"/>
    <line x1="550" y1="165" x2="626" y2="165"/>
    <line x1="550" y1="335" x2="626" y2="335"/>
  </g>
  <text x="480" y="430" text-anchor="middle" font-size="16" fill="#111111">Comparing each student's gains across the two conditions controls for differences between students.</text>
  <text x="480" y="456" text-anchor="middle" font-size="16" fill="#111111">Result: median gains with the AI tutor were more than twice those in class.</text>
  <text x="480" y="486" text-anchor="middle" font-size="13" fill="#333333">Simplified schematic of the design reported by Kestin and colleagues (2025); 194 students.</text>
</svg>
