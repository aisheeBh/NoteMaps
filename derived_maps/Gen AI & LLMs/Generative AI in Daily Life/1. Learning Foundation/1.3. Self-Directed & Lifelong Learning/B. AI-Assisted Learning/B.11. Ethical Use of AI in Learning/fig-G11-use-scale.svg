<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>A scale of permitted AI use</title>
  <desc>Five steps from left to right: level 1 no AI, level 2 AI for ideas and structure, level 3 AI for editing the learner's own work, level 4 AI completes parts which the learner evaluates, level 5 full AI collaboration with disclosure. Below, example tasks: a certification exam at level 1, an essay plan at level 2, a report draft at level 3, a data analysis at level 4 and a team prototype at level 5.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Levels of permitted AI use for a task</text>
  <line x1="40" y1="80" x2="920" y2="80" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="40" y="68" font-size="15" fill="#111111">Shows unaided capability</text>
  <text x="920" y="68" text-anchor="end" font-size="15" fill="#111111">Produces the best result with AI</text>

  <g font-size="14" fill="#111111" text-anchor="middle">
    <rect x="40" y="250" width="160" height="110" fill="#FFFFFF" stroke="#222222" stroke-width="3"/>
    <text x="120" y="280" font-size="17" font-weight="bold">1</text>
    <text x="120" y="304" font-weight="bold">No AI</text>
    <text x="120" y="326">entirely one's</text>
    <text x="120" y="344">own work</text>

    <rect x="215" y="210" width="160" height="150" fill="#F2F2F2" stroke="#333333" stroke-width="2"/>
    <text x="295" y="240" font-size="17" font-weight="bold">2</text>
    <text x="295" y="264" font-weight="bold">Ideas and</text>
    <text x="295" y="282" font-weight="bold">structure</text>
    <text x="295" y="306">brainstorming,</text>
    <text x="295" y="324">planning only</text>

    <rect x="390" y="170" width="160" height="190" fill="#E6E6E6" stroke="#333333" stroke-width="2"/>
    <text x="470" y="200" font-size="17" font-weight="bold">3</text>
    <text x="470" y="224" font-weight="bold">Editing</text>
    <text x="470" y="248">improving the</text>
    <text x="470" y="266">learner's own</text>
    <text x="470" y="284">writing</text>

    <rect x="565" y="130" width="160" height="230" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
    <text x="645" y="160" font-size="17" font-weight="bold">4</text>
    <text x="645" y="184" font-weight="bold">AI completes</text>
    <text x="645" y="202" font-weight="bold">parts</text>
    <text x="645" y="226">learner critically</text>
    <text x="645" y="244">evaluates them</text>

    <rect x="740" y="100" width="180" height="260" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
    <text x="830" y="130" font-size="17" font-weight="bold" fill="#FFFFFF">5</text>
    <text x="830" y="154" font-weight="bold" fill="#FFFFFF">Full AI</text>
    <text x="830" y="178" fill="#FFFFFF">used freely as</text>
    <text x="830" y="196" fill="#FFFFFF">a collaborator,</text>
    <text x="830" y="214" fill="#FFFFFF">use disclosed</text>
  </g>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="120" y="392">certification exam</text>
    <text x="295" y="392">essay plan</text>
    <text x="470" y="392">report draft</text>
    <text x="645" y="392">data analysis</text>
    <text x="830" y="392">team prototype</text>
  </g>
  <text x="480" y="430" text-anchor="middle" font-size="15" fill="#111111">Example tasks shown under each level; the level is set for each task, not for a whole course.</text>
  <text x="480" y="470" text-anchor="middle" font-size="13" fill="#333333">After the AI Assessment Scale of Perkins, Furze, Roe and MacVaugh (2024); wording simplified.</text>
</svg>
