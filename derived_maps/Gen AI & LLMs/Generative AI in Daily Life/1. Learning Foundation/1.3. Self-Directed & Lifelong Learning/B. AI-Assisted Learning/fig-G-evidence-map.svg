<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Map of controlled evidence on AI and learning, 2024 to 2026</title>
  <desc>Studies placed on two dimensions. Horizontal: what the AI did, from guiding the learner's thinking to producing work or replacing study. Vertical: effect on later unaided learning, from loss to gain. Gains cluster where AI guided thinking: Harvard physics tutor, Nigeria supervised programme, Tutor CoPilot, AI as tutor in a 2026 experiment, hint-based tutor at about no change. Losses cluster where AI produced or displaced: unrestricted GPT-4 in Turkish maths, delegated code in 2026, a course-integrated tutor that displaced study in 2026.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">What the AI did, and what happened to unaided learning</text>

  <!-- plot: x 140..900, y 70..500; zero line at y=300 -->
  <rect x="140" y="70" width="380" height="230" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
  <rect x="520" y="300" width="380" height="200" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="140" y="70" width="760" height="430" fill="none" stroke="#222222" stroke-width="2"/>
  <line x1="140" y1="300" x2="900" y2="300" stroke="#222222" stroke-width="2.5"/>
  <text x="130" y="305" text-anchor="end" font-size="14" fill="#111111">No change</text>
  <text x="130" y="90" text-anchor="end" font-size="14" fill="#111111">Gain</text>
  <text x="130" y="495" text-anchor="end" font-size="14" fill="#111111">Loss</text>

  <g font-size="14" fill="#111111">
    <circle cx="210" cy="110" r="8" fill="#000000"/>
    <rect x="224" y="98" width="230" height="24" fill="#FFFFFF"/><text x="228" y="115">Harvard physics tutor (2025)</text>
    <circle cx="260" cy="190" r="8" fill="#000000"/>
    <rect x="274" y="178" width="236" height="24" fill="#FFFFFF"/><text x="278" y="195">Nigeria, supervised pairs (2025)</text>
    <circle cx="200" cy="232" r="8" fill="#000000"/>
    <rect x="214" y="220" width="210" height="24" fill="#FFFFFF"/><text x="218" y="237">Tutor CoPilot (2024)</text>
    <circle cx="330" cy="150" r="8" fill="#000000"/>
    <rect x="344" y="138" width="170" height="24" fill="#FFFFFF"/><text x="348" y="155">AI as tutor (2026)</text>
    <circle cx="380" cy="292" r="8" fill="#000000"/>
    <rect x="394" y="262" width="210" height="24" fill="#FFFFFF"/><text x="398" y="279">Hint tutor, Turkey (2025)</text>

    <circle cx="640" cy="380" r="8" fill="#000000"/>
    <rect x="654" y="368" width="230" height="24" fill="#FFFFFF"/><text x="658" y="385">Unrestricted GPT-4 (2025)</text>
    <circle cx="700" cy="420" r="8" fill="#000000"/>
    <rect x="714" y="408" width="180" height="24" fill="#FFFFFF"/><text x="718" y="425">Delegated code (2026)</text>
    <circle cx="820" cy="455" r="8" fill="#000000"/>
    <rect x="560" y="444" width="246" height="24" fill="#FFFFFF"/><text x="564" y="461">Tutor displacing study (2026)</text>
    <circle cx="610" cy="300" r="8" fill="#000000"/>
    <rect x="624" y="318" width="250" height="24" fill="#FFFFFF"/><text x="628" y="335">AI writing: gains faded (2026)</text>
  </g>

  <line x1="140" y1="530" x2="900" y2="530" stroke="#222222" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="140" y="552" font-size="15" fill="#111111">AI guides the learner's thinking</text>
  <text x="900" y="552" text-anchor="end" font-size="15" fill="#111111">AI produces the work or displaces study</text>
  <text x="480" y="586" text-anchor="middle" font-size="13" fill="#333333">Positions are qualitative; studies differ in measures and populations. The 2026 university trial is an unreviewed working paper.</text>
</svg>
