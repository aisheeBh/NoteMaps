<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The six CEFR levels as a roadmap with can-do milestones</title>
  <desc>A staircase of six steps from A1 to C2 grouped as basic, independent and proficient user. Each step carries a short can-do description. The steps become wider towards the top, indicating that each higher level takes longer to reach.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
  </defs>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">CEFR: a staircase of can-do milestones</text>
  <rect x="24" y="408" width="130" height="62" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <rect x="30" y="414" width="118" height="64" rx="3" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="89" y="436" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">A1</text>
  <text x="89" y="456" text-anchor="middle" font-size="13" fill="#111111">Basic user</text>
  <text x="89" y="378" text-anchor="middle" font-size="13" fill="#111111">Introduce oneself;</text>
  <text x="89" y="394" text-anchor="middle" font-size="13" fill="#111111">simple phrases</text>
  <rect x="158" y="346" width="135" height="124" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <rect x="164" y="352" width="123" height="64" rx="3" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="226" y="374" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">A2</text>
  <text x="226" y="394" text-anchor="middle" font-size="13" fill="#111111">Basic user</text>
  <text x="226" y="316" text-anchor="middle" font-size="13" fill="#111111">Routine exchanges;</text>
  <text x="226" y="332" text-anchor="middle" font-size="13" fill="#111111">own background</text>
  <rect x="297" y="284" width="140" height="186" rx="0" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="303" y="290" width="128" height="64" rx="3" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="367" y="312" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">B1</text>
  <text x="367" y="332" text-anchor="middle" font-size="13" fill="#111111">Independent user</text>
  <text x="367" y="254" text-anchor="middle" font-size="13" fill="#111111">Travel situations;</text>
  <text x="367" y="270" text-anchor="middle" font-size="13" fill="#111111">brief reasons</text>
  <rect x="441" y="222" width="155" height="248" rx="0" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="447" y="228" width="143" height="64" rx="3" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="518" y="250" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">B2</text>
  <text x="518" y="270" text-anchor="middle" font-size="13" fill="#111111">Independent user</text>
  <text x="518" y="192" text-anchor="middle" font-size="13" fill="#111111">Fluent with native</text>
  <text x="518" y="208" text-anchor="middle" font-size="13" fill="#111111">speakers; argue a view</text>
  <rect x="600" y="160" width="160" height="310" rx="0" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="606" y="166" width="148" height="64" rx="3" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="680" y="188" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">C1</text>
  <text x="680" y="208" text-anchor="middle" font-size="13" fill="#111111">Proficient user</text>
  <text x="680" y="130" text-anchor="middle" font-size="13" fill="#111111">Flexible use for work</text>
  <text x="680" y="146" text-anchor="middle" font-size="13" fill="#111111">and study; complex texts</text>
  <rect x="764" y="98" width="170" height="372" rx="0" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <rect x="770" y="104" width="158" height="64" rx="3" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="849" y="126" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">C2</text>
  <text x="849" y="146" text-anchor="middle" font-size="13" fill="#111111">Proficient user</text>
  <text x="849" y="68" text-anchor="middle" font-size="13" fill="#111111">Understand virtually</text>
  <text x="849" y="84" text-anchor="middle" font-size="13" fill="#111111">everything; fine nuance</text>
  <line x1="24" y1="470" x2="936" y2="470" stroke="#222222" stroke-width="2"/>
  <line x1="24" y1="506" x2="930" y2="506" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="528" text-anchor="middle" font-size="14" fill="#111111">Each higher level typically takes longer to reach than the one before</text>
</svg>