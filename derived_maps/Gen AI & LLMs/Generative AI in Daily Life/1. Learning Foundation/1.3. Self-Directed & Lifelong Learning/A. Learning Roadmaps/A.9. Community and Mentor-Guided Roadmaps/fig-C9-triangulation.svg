<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Combining four sources of guidance into one roadmap</title>
  <desc>Four sources surround the learner's roadmap. A senior mentor contributes what matters at the destination but may misjudge difficulty. A near-peer contributes realistic pacing but knows one route. A community contributes breadth of options but is fashion-driven. Role evidence such as job advertisements contributes current demand but lists tools more than judgement. The learner weighs all four.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
  </defs>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Triangulating guidance: each source adds something and distorts something</text>
  <rect x="360" y="270" width="240" height="100" rx="12" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="480" y="312" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">LEARNER'S</text>
  <text x="480" y="334" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">ROADMAP</text>
  <rect x="340" y="52" width="280" height="116" rx="10" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="350" y="60" width="260" height="100" rx="6" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="480" y="82" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">SENIOR MENTOR</text>
  <text x="480" y="104" text-anchor="middle" font-size="14" fill="#111111">adds: what matters at</text>
  <text x="480" y="122" text-anchor="middle" font-size="14" fill="#111111">the destination</text>
  <text x="480" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">distorts: difficulty, order</text>
  <rect x="30" y="262" width="280" height="116" rx="10" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="40" y="270" width="260" height="100" rx="6" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="170" y="292" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">NEAR-PEER</text>
  <text x="170" y="314" text-anchor="middle" font-size="14" fill="#111111">adds: realistic pace,</text>
  <text x="170" y="332" text-anchor="middle" font-size="14" fill="#111111">sticking points</text>
  <text x="170" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">distorts: one route only</text>
  <rect x="650" y="262" width="280" height="116" rx="10" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <rect x="660" y="270" width="260" height="100" rx="6" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="790" y="292" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">COMMUNITY</text>
  <text x="790" y="314" text-anchor="middle" font-size="14" fill="#111111">adds: breadth of</text>
  <text x="790" y="332" text-anchor="middle" font-size="14" fill="#111111">options, resources</text>
  <text x="790" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">distorts: fashion, copying</text>
  <rect x="340" y="472" width="280" height="116" rx="10" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <rect x="350" y="480" width="260" height="100" rx="6" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="480" y="502" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">ROLE EVIDENCE</text>
  <text x="480" y="524" text-anchor="middle" font-size="14" fill="#111111">adds: current demand</text>
  <text x="480" y="542" text-anchor="middle" font-size="14" fill="#111111">(advertisements, frameworks)</text>
  <text x="480" y="566" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">distorts: tools over judgement</text>
  <line x1="480" y1="168" x2="480" y2="266" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="320" x2="356" y2="320" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="650" y1="320" x2="604" y2="320" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="472" x2="480" y2="374" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>