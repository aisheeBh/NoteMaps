<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Predicted and actual success in the tapping study</title>
  <desc>Tappers predicted that listeners would identify about 50 per cent of tapped songs. Listeners actually identified about 2.5 per cent, three of 120 songs.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
  </defs>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">The curse of knowledge: what the tapper hears, the listener does not</text>
  <line x1="160" y1="380" x2="820" y2="380" stroke="#222222" stroke-width="2"/>
  <line x1="160" y1="380" x2="160" y2="80" stroke="#222222" stroke-width="2"/>
  <line x1="154" y1="380" x2="160" y2="380" stroke="#222222" stroke-width="2"/>
  <text x="148" y="385" text-anchor="end" font-size="14" fill="#111111">0%</text>
  <line x1="154" y1="332" x2="160" y2="332" stroke="#222222" stroke-width="2"/>
  <text x="148" y="337" text-anchor="end" font-size="14" fill="#111111">10%</text>
  <line x1="160" y1="332" x2="820" y2="332" stroke="#E0E0E0" stroke-width="1"/>
  <line x1="154" y1="283" x2="160" y2="283" stroke="#222222" stroke-width="2"/>
  <text x="148" y="288" text-anchor="end" font-size="14" fill="#111111">20%</text>
  <line x1="160" y1="283" x2="820" y2="283" stroke="#E0E0E0" stroke-width="1"/>
  <line x1="154" y1="235" x2="160" y2="235" stroke="#222222" stroke-width="2"/>
  <text x="148" y="240" text-anchor="end" font-size="14" fill="#111111">30%</text>
  <line x1="160" y1="235" x2="820" y2="235" stroke="#E0E0E0" stroke-width="1"/>
  <line x1="154" y1="187" x2="160" y2="187" stroke="#222222" stroke-width="2"/>
  <text x="148" y="192" text-anchor="end" font-size="14" fill="#111111">40%</text>
  <line x1="160" y1="187" x2="820" y2="187" stroke="#E0E0E0" stroke-width="1"/>
  <line x1="154" y1="138" x2="160" y2="138" stroke="#222222" stroke-width="2"/>
  <text x="148" y="143" text-anchor="end" font-size="14" fill="#111111">50%</text>
  <line x1="160" y1="138" x2="820" y2="138" stroke="#E0E0E0" stroke-width="1"/>
  <line x1="154" y1="90" x2="160" y2="90" stroke="#222222" stroke-width="2"/>
  <text x="148" y="95" text-anchor="end" font-size="14" fill="#111111">60%</text>
  <line x1="160" y1="90" x2="820" y2="90" stroke="#E0E0E0" stroke-width="1"/>
  <text x="70" y="235" text-anchor="middle" font-size="15" fill="#111111" transform="rotate(-90 70 235)">Songs identified</text>
  <rect x="260" y="138" width="160" height="242" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
  <rect x="560" y="368" width="160" height="12" rx="0" fill="url(#dots)" stroke="#7A5200" stroke-width="2.5"/>
  <text x="340" y="126" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">about 50%</text>
  <text x="640" y="356" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">about 2.5% (3 of 120)</text>
  <text x="340" y="406" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Tappers' prediction</text>
  <text x="640" y="406" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Listeners' actual success</text>
  <text x="936" y="460" text-anchor="end" font-size="13" fill="#333333">After Elizabeth Newton (1990).</text>
</svg>