<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Knowledge states and the outer fringe in a small domain</title>
  <desc>Four items: A percentages, B spreadsheet formulas, C compound growth which requires A, and D a linked model which requires A and B. Only eight of the sixteen possible sets of items are feasible knowledge states. A learner in state A and B has an outer fringe of C and D: both are ready to learn next. A state containing C without A is impossible.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker></defs>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Prerequisites shape which knowledge states are possible</text>
  <rect x="24" y="60" width="280" height="510" rx="10" fill="#FAFAFA" stroke="#555555" stroke-width="1.2"/>
  <text x="164" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Items and prerequisites</text>
  <circle cx="90" cy="150" r="22" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="90" y="156" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">A</text>
  <text x="90" y="194" text-anchor="middle" font-size="13" fill="#111111">Percentages</text>
  <circle cx="220" cy="150" r="22" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="220" y="156" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">B</text>
  <text x="220" y="194" text-anchor="middle" font-size="13" fill="#111111">Spreadsheet formulas</text>
  <circle cx="90" cy="300" r="22" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="90" y="306" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">C</text>
  <text x="90" y="344" text-anchor="middle" font-size="13" fill="#111111">Compound growth</text>
  <circle cx="220" cy="300" r="22" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="220" y="306" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">D</text>
  <text x="220" y="344" text-anchor="middle" font-size="13" fill="#111111">Linked model</text>
  <line x1="90" y1="194" x2="90" y2="276" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="100" y1="194" x2="206" y2="280" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="220" y1="194" x2="220" y2="276" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="164" y="390" text-anchor="middle" font-size="14" fill="#111111">Arrow: "is required for"</text>
  <text x="164" y="420" text-anchor="middle" font-size="14" fill="#111111">C requires A.</text>
  <text x="164" y="440" text-anchor="middle" font-size="14" fill="#111111">D requires A and B.</text>
  <text x="164" y="480" text-anchor="middle" font-size="14" fill="#111111">Of 16 possible sets,</text>
  <text x="164" y="500" text-anchor="middle" font-size="14" fill="#111111">only 8 are feasible</text>
  <text x="164" y="520" text-anchor="middle" font-size="14" fill="#111111">knowledge states.</text>
  <line x1="640" y1="480" x2="530" y2="422" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="640" y1="480" x2="750" y2="422" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="530" y1="380" x2="440" y2="322" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="530" y1="380" x2="640" y2="322" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="750" y1="380" x2="640" y2="322" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="440" y1="280" x2="530" y2="222" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="640" y1="280" x2="530" y2="222" stroke="#1F3B5C" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="640" y1="280" x2="750" y2="222" stroke="#1F3B5C" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="530" y1="180" x2="640" y2="122" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="750" y1="180" x2="640" y2="122" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="578" y="480" width="124" height="40" rx="20" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="640" y="506" text-anchor="middle" font-size="16" fill="#111111">{ }</text>
  <rect x="468" y="380" width="124" height="40" rx="20" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="530" y="406" text-anchor="middle" font-size="16" fill="#111111">{A}</text>
  <rect x="688" y="380" width="124" height="40" rx="20" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="750" y="406" text-anchor="middle" font-size="16" fill="#111111">{B}</text>
  <rect x="378" y="280" width="124" height="40" rx="20" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="440" y="306" text-anchor="middle" font-size="16" fill="#111111">{A, C}</text>
  <rect x="578" y="280" width="124" height="40" rx="20" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="640" y="306" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">{A, B}</text>
  <rect x="468" y="180" width="124" height="40" rx="20" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="530" y="206" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">{A, B, C}</text>
  <rect x="688" y="180" width="124" height="40" rx="20" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="750" y="206" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">{A, B, D}</text>
  <rect x="578" y="80" width="124" height="40" rx="20" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="640" y="106" text-anchor="middle" font-size="16" fill="#111111">{A, B, C, D}</text>
  <text x="712" y="306" font-size="14" font-weight="bold" fill="#111111">Current state</text>
  <text x="590" y="262" text-anchor="end" font-size="14" fill="#111111">learn C</text>
  <text x="702" y="262" font-size="14" fill="#111111">learn D</text>
  <text x="845" y="196" font-size="14" font-weight="bold" fill="#111111">Outer fringe:</text>
  <text x="845" y="214" font-size="14" fill="#111111">C and D are</text>
  <text x="845" y="232" font-size="14" fill="#111111">ready to learn</text>
  <rect x="822" y="380" width="114" height="40" rx="20" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="879" y="406" text-anchor="middle" font-size="16" fill="#111111">{C}</text>
  <text x="879" y="444" text-anchor="middle" font-size="14" fill="#111111">Impossible:</text>
  <text x="879" y="462" text-anchor="middle" font-size="14" fill="#111111">C without A</text>
  <g font-size="13" fill="#333333"><text x="318" y="505">0 items</text><text x="318" y="405">1 item</text><text x="318" y="305">2 items</text><text x="318" y="205">3 items</text><text x="318" y="105">4 items</text></g>
</svg>