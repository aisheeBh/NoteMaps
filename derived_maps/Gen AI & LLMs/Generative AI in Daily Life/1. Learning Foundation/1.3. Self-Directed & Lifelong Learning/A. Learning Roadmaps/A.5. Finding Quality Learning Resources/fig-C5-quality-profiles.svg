<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Quality profiles of three resources on the six facets</title>
  <desc>Scores from one to five for a video course, an open textbook and an interactive course on fit, accuracy, currency, exercises and feedback, teaching clarity and structure. The video course is strongest on teaching clarity but weakest by far on exercises and feedback; the interactive course scores four or five on every facet.</desc>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Three resources, six facets: where each is strong and weak</text>
  <rect x="24" y="60" width="912" height="64" fill="#F4F4F4" stroke="none"/>
  <rect x="24" y="196" width="912" height="64" fill="#F4F4F4" stroke="none"/>
  <rect x="24" y="332" width="912" height="64" fill="#F4F4F4" stroke="none"/>
  <line x1="330" y1="60" x2="330" y2="464" stroke="#BBBBBB" stroke-width="1"/>
  <text x="330" y="486" text-anchor="middle" font-size="14" fill="#111111">1</text>
  <line x1="462" y1="60" x2="462" y2="464" stroke="#BBBBBB" stroke-width="1"/>
  <text x="462" y="486" text-anchor="middle" font-size="14" fill="#111111">2</text>
  <line x1="595" y1="60" x2="595" y2="464" stroke="#BBBBBB" stroke-width="1"/>
  <text x="595" y="486" text-anchor="middle" font-size="14" fill="#111111">3</text>
  <line x1="728" y1="60" x2="728" y2="464" stroke="#BBBBBB" stroke-width="1"/>
  <text x="728" y="486" text-anchor="middle" font-size="14" fill="#111111">4</text>
  <line x1="860" y1="60" x2="860" y2="464" stroke="#BBBBBB" stroke-width="1"/>
  <text x="860" y="486" text-anchor="middle" font-size="14" fill="#111111">5</text>
  <text x="595" y="510" text-anchor="middle" font-size="15" fill="#111111">Score (1 = poor, 5 = excellent)</text>
  <text x="306" y="95" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Fit</text>
  <circle cx="728" cy="72" r="8" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
  <rect x="588" y="83" width="14" height="14" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2.5"/>
  <polygon points="860,99 869,115 851,115" fill="#1F3B5C" stroke="#000000" stroke-width="1.5"/>
  <text x="306" y="163" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Accuracy</text>
  <circle cx="595" cy="140" r="8" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
  <rect x="853" y="151" width="14" height="14" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2.5"/>
  <polygon points="728,167 736,183 718,183" fill="#1F3B5C" stroke="#000000" stroke-width="1.5"/>
  <text x="306" y="231" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Currency</text>
  <circle cx="728" cy="208" r="8" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
  <rect x="588" y="219" width="14" height="14" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2.5"/>
  <polygon points="860,235 869,251 851,251" fill="#1F3B5C" stroke="#000000" stroke-width="1.5"/>
  <text x="306" y="299" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Exercises and feedback</text>
  <circle cx="330" cy="276" r="8" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
  <rect x="720" y="287" width="14" height="14" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2.5"/>
  <polygon points="860,303 869,319 851,319" fill="#1F3B5C" stroke="#000000" stroke-width="1.5"/>
  <text x="306" y="367" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Teaching clarity</text>
  <circle cx="860" cy="344" r="8" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
  <rect x="588" y="355" width="14" height="14" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2.5"/>
  <polygon points="728,371 736,387 718,387" fill="#1F3B5C" stroke="#000000" stroke-width="1.5"/>
  <text x="306" y="435" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Structure</text>
  <circle cx="595" cy="412" r="8" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
  <rect x="720" y="423" width="14" height="14" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2.5"/>
  <polygon points="728,439 736,455 718,455" fill="#1F3B5C" stroke="#000000" stroke-width="1.5"/>
  <circle cx="150" cy="537" r="8" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
  <text x="168" y="542" font-size="14" fill="#111111">R1 video course</text>
  <rect x="393" y="530" width="14" height="14" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2.5"/>
  <text x="418" y="542" font-size="14" fill="#111111">R2 open textbook</text>
  <polygon points="650,528 659,544 641,544" fill="#1F3B5C" stroke="#000000" stroke-width="1.5"/>
  <text x="668" y="542" font-size="14" fill="#111111">R3 interactive course</text>
</svg>