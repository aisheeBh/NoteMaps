<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Approach to equilibrium under two decay rates</title>
  <desc>Line chart over 100 weeks starting from zero capability, with learning of 10 units a week. With 5 per cent weekly decay the stock levels off near 200 units; with 3 per cent weekly decay it keeps rising towards about 333 units. Horizontal dotted lines mark the two equilibria.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Same study, less decay: a higher ceiling</text>
  <line x1="120" y1="450" x2="870" y2="450" stroke="#222222" stroke-width="2.5"/>
  <line x1="120" y1="450" x2="120" y2="90" stroke="#222222" stroke-width="2.5"/>
  <text x="110" y="455" text-anchor="end" font-size="14" fill="#111111">0</text>
  <text x="110" y="355" text-anchor="end" font-size="14" fill="#111111">100</text>
  <text x="110" y="255" text-anchor="end" font-size="14" fill="#111111">200</text>
  <text x="110" y="155" text-anchor="end" font-size="14" fill="#111111">300</text>
  <text x="120" y="474" text-anchor="middle" font-size="14" fill="#111111">0</text>
  <text x="268" y="474" text-anchor="middle" font-size="14" fill="#111111">20</text>
  <text x="416" y="474" text-anchor="middle" font-size="14" fill="#111111">40</text>
  <text x="564" y="474" text-anchor="middle" font-size="14" fill="#111111">60</text>
  <text x="712" y="474" text-anchor="middle" font-size="14" fill="#111111">80</text>
  <text x="860" y="474" text-anchor="middle" font-size="14" fill="#111111">100</text>
  <text x="490" y="500" text-anchor="middle" font-size="15" fill="#111111">Weeks</text>
  <text x="62" y="275" text-anchor="middle" font-size="15" fill="#111111" transform="rotate(-90 62 275)">Capability (notional units)</text>
  <polyline points="120,450 127,440 135,430 142,421 150,413 157,405 164,397 172,390 179,383 187,376 194,370 201,364 209,358 216,353 224,348 231,343 238,338 246,334 253,329 261,325 268,322 275,318 283,315 290,311 298,308 305,305 312,303 320,300 327,298 335,295 342,293 349,291 357,289 364,287 372,285 379,283 386,282 394,280 401,278 409,277 416,276 423,274 431,273 438,272 446,271 453,270 460,269 468,268 475,267 483,266 490,265 497,265 505,264 512,263 520,263 527,262 534,261 542,261 549,260 557,260 564,259 571,259 579,258 586,258 594,258 601,257 608,257 616,256 623,256 631,256 638,256 645,255 653,255 660,255 668,254 675,254 682,254 690,254 697,254 705,253 712,253 719,253 727,253 734,253 742,253 749,253 756,252 764,252 771,252 779,252 786,252 793,252 801,252 808,252 816,252 823,252 830,251 838,251 845,251 853,251 860,251" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <line x1="120" y1="250.0" x2="860" y2="250.0" stroke="#666666" stroke-width="1.2" stroke-dasharray="2 4"/>
  <polyline points="120,450 127,440 135,430 142,421 150,412 157,403 164,394 172,386 179,378 187,370 194,362 201,355 209,348 216,341 224,334 231,328 238,321 246,315 253,309 261,304 268,298 275,292 283,287 290,282 298,277 305,272 312,268 320,263 327,259 335,254 342,250 349,246 357,242 364,239 372,235 379,231 386,228 394,225 401,221 409,218 416,215 423,212 431,209 438,207 446,204 453,201 460,199 468,196 475,194 483,192 490,189 497,187 505,185 512,183 520,181 527,179 534,177 542,175 549,174 557,172 564,170 571,169 579,167 586,166 594,164 601,163 608,161 616,160 623,159 631,157 638,156 645,155 653,154 660,153 668,152 675,151 682,150 690,149 697,148 705,147 712,146 719,145 727,144 734,143 742,142 749,142 756,141 764,140 771,140 779,139 786,138 793,138 801,137 808,136 816,136 823,135 830,135 838,134 845,134 853,133 860,133" fill="none" stroke="#7A5200" stroke-width="4" stroke-dasharray="10 6"/>
  <line x1="120" y1="116.69999999999999" x2="860" y2="116.69999999999999" stroke="#666666" stroke-width="1.2" stroke-dasharray="2 4"/>
  <rect x="479" y="295" width="318" height="20" fill="#FFFFFF"/>
  <text x="638" y="310" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">decay 5% a week: levels off near 200</text>
  <rect x="428" y="90" width="301" height="20" fill="#FFFFFF"/>
  <text x="579" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">decay 3% a week: rises towards 333</text>
  <text x="480" y="535" text-anchor="middle" font-size="13" font-style="italic" fill="#333333">Simplified model: 10 units learned a week; a fixed share forgotten each week.</text>
</svg>
