<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>A personal profile on seven learning tensions</title>
  <desc>Seven horizontal sliders, each with two labelled poles, and a marker showing one person's default position: depth versus breadth leaning to depth; just-in-case versus just-in-time near the middle; theory first versus practice first leaning to practice; learn versus delegate leaning to learn; solitary versus social slightly social; fundamentals versus frontier strongly fundamentals; exploit versus explore leaning to exploit.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">One learner's default positions on seven tensions</text>
  <text x="242" y="106" text-anchor="end" font-size="16" font-weight="bold" fill="#111111">Depth</text>
  <text x="718" y="106" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">Breadth</text>
  <line x1="260" y1="100" x2="700" y2="100" stroke="#555555" stroke-width="3"/>
  <line x1="260.0" y1="92" x2="260.0" y2="108" stroke="#555555" stroke-width="1.5"/>
  <line x1="370.0" y1="92" x2="370.0" y2="108" stroke="#555555" stroke-width="1.5"/>
  <line x1="480.0" y1="92" x2="480.0" y2="108" stroke="#555555" stroke-width="1.5"/>
  <line x1="590.0" y1="92" x2="590.0" y2="108" stroke="#555555" stroke-width="1.5"/>
  <line x1="700.0" y1="92" x2="700.0" y2="108" stroke="#555555" stroke-width="1.5"/>
  <circle cx="392" cy="100" r="13" fill="#1F3B5C" stroke="#000000" stroke-width="2.5"/>
  <text x="242" y="172" text-anchor="end" font-size="16" font-weight="bold" fill="#111111">Just-in-case</text>
  <text x="718" y="172" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">Just-in-time</text>
  <line x1="260" y1="166" x2="700" y2="166" stroke="#555555" stroke-width="3"/>
  <line x1="260.0" y1="158" x2="260.0" y2="174" stroke="#555555" stroke-width="1.5"/>
  <line x1="370.0" y1="158" x2="370.0" y2="174" stroke="#555555" stroke-width="1.5"/>
  <line x1="480.0" y1="158" x2="480.0" y2="174" stroke="#555555" stroke-width="1.5"/>
  <line x1="590.0" y1="158" x2="590.0" y2="174" stroke="#555555" stroke-width="1.5"/>
