  <line x1="260.0" y1="224" x2="260.0" y2="240" stroke="#555555" stroke-width="1.5"/>
  <line x1="370.0" y1="224" x2="370.0" y2="240" stroke="#555555" stroke-width="1.5"/>
  <line x1="480.0" y1="224" x2="480.0" y2="240" stroke="#555555" stroke-width="1.5"/>
