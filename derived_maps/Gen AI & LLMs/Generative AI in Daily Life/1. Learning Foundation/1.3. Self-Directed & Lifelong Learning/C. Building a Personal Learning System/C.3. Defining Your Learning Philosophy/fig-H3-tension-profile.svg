  <line x1="260" y1="298" x2="700" y2="298" stroke="#555555" stroke-width="3"/>
  <line x1="260.0" y1="290" x2="260.0" y2="306" stroke="#555555" stroke-width="1.5"/>
  <line x1="370.0" y1="290" x2="370.0" y2="306" stroke="#555555" stroke-width="1.5"/>
  <line x1="480.0" y1="290" x2="480.0" y2="306" stroke="#555555" stroke-width="1.5"/>
  <line x1="590.0" y1="290" x2="590.0" y2="306" stroke="#555555" stroke-width="1.5"/>
  <line x1="700.0" y1="290" x2="700.0" y2="306" stroke="#555555" stroke-width="1.5"/>
  <circle cx="414" cy="298" r="13" fill="#1F3B5C" stroke="#000000" stroke-width="2.5"/>
  <text x="242" y="370" text-anchor="end" font-size="16" font-weight="bold" fill="#111111">Solitary</text>
  <text x="718" y="370" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">Social</text>
  <line x1="260" y1="364" x2="700" y2="364" stroke="#555555" stroke-width="3"/>
  <line x1="260.0" y1="356" x2="260.0" y2="372" stroke="#555555" stroke-width="1.5"/>
  <line x1="370.0" y1="356" x2="370.0" y2="372" stroke="#555555" stroke-width="1.5"/>
  <line x1="480.0" y1="356" x2="480.0" y2="372" stroke="#555555" stroke-width="1.5"/>
  <line x1="590.0" y1="356" x2="590.0" y2="372" stroke="#555555" stroke-width="1.5"/>
  <line x1="700.0" y1="356" x2="700.0" y2="372" stroke="#555555" stroke-width="1.5"/>
  <circle cx="524" cy="364" r="13" fill="#1F3B5C" stroke="#000000" stroke-width="2.5"/>
  <text x="242" y="436" text-anchor="end" font-size="16" font-weight="bold" fill="#111111">Fundamentals</text>
  <text x="718" y="436" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">Frontier</text>
  <line x1="260" y1="430" x2="700" y2="430" stroke="#555555" stroke-width="3"/>
  <line x1="260.0" y1="422" x2="260.0" y2="438" stroke="#555555" stroke-width="1.5"/>
  <line x1="370.0" y1="422" x2="370.0" y2="438" stroke="#555555" stroke-width="1.5"/>
  <line x1="480.0" y1="422" x2="480.0" y2="438" stroke="#555555" stroke-width="1.5"/>
  <line x1="590.0" y1="422" x2="590.0" y2="438" stroke="#555555" stroke-width="1.5"/>
  <line x1="700.0" y1="422" x2="700.0" y2="438" stroke="#555555" stroke-width="1.5"/>
  <circle cx="348" cy="430" r="13" fill="#1F3B5C" stroke="#000000" stroke-width="2.5"/>
  <text x="242" y="502" text-anchor="end" font-size="16" font-weight="bold" fill="#111111">Exploit</text>
  <text x="718" y="502" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">Explore</text>
  <line x1="260" y1="496" x2="700" y2="496" stroke="#555555" stroke-width="3"/>
  <line x1="260.0" y1="488" x2="260.0" y2="504" stroke="#555555" stroke-width="1.5"/>
  <line x1="370.0" y1="488" x2="370.0" y2="504" stroke="#555555" stroke-width="1.5"/>
  <line x1="480.0" y1="488" x2="480.0" y2="504" stroke="#555555" stroke-width="1.5"/>
  <line x1="590.0" y1="488" x2="590.0" y2="504" stroke="#555555" stroke-width="1.5"/>
  <line x1="700.0" y1="488" x2="700.0" y2="504" stroke="#555555" stroke-width="1.5"/>
  <circle cx="427" cy="496" r="13" fill="#1F3B5C" stroke="#000000" stroke-width="2.5"/>
  <text x="480" y="570" text-anchor="middle" font-size="15" fill="#111111">Each marker is a default with stated exceptions, not a fixed rule.</text>
  <text x="480" y="600" text-anchor="middle" font-size="13" font-style="italic" fill="#333333">Hypothetical profile for illustration.</text>
