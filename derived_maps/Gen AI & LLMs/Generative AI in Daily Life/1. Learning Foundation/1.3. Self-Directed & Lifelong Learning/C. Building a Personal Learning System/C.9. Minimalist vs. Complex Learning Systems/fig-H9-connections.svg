  <line x1="680" y1="230" x2="712" y2="152" stroke="#555555" stroke-width="1.6"/>
  <circle cx="790" cy="120" r="15" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2.5"/>
  <circle cx="868" cy="152" r="15" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2.5"/>
  <circle cx="900" cy="230" r="15" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2.5"/>
