  <line x1="900" y1="230" x2="868" y2="308" stroke="#555555" stroke-width="1.6"/>
  <line x1="900" y1="230" x2="790" y2="340" stroke="#555555" stroke-width="1.6"/>
  <line x1="900" y1="230" x2="712" y2="308" stroke="#555555" stroke-width="1.6"/>
