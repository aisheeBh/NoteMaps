  <circle cx="365" cy="196" r="15" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2.5"/>
  <text x="470" y="385" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">5 tools</text>
  <text x="470" y="410" text-anchor="middle" font-size="15" fill="#111111">10 possible connections</text>
