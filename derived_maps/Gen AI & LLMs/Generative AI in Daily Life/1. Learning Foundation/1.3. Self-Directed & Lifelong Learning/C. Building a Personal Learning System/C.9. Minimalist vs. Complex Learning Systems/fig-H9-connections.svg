<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Possible connections among three, five and eight tools</title>
  <desc>Three complete networks. Three tools joined by 3 lines; five tools joined by 10 lines; eight tools joined by 28 lines. The number of possible connections grows much faster than the number of tools.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Tools grow by addition; connections grow faster</text>
  <line x1="160" y1="120" x2="255" y2="285" stroke="#555555" stroke-width="1.6"/>
  <line x1="160" y1="120" x2="65" y2="285" stroke="#555555" stroke-width="1.6"/>
  <line x1="255" y1="285" x2="65" y2="285" stroke="#555555" stroke-width="1.6"/>
  <circle cx="160" cy="120" r="15" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2.5"/>
  <circle cx="255" cy="285" r="15" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2.5"/>
  <circle cx="65" cy="285" r="15" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2.5"/>
  <text x="160" y="385" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">3 tools</text>
  <text x="160" y="410" text-anchor="middle" font-size="15" fill="#111111">3 possible connections</text>
  <line x1="470" y1="120" x2="575" y2="196" stroke="#555555" stroke-width="1.6"/>
  <line x1="470" y1="120" x2="535" y2="319" stroke="#555555" stroke-width="1.6"/>
