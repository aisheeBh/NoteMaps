  <circle cx="790" cy="340" r="15" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2.5"/>
  <circle cx="712" cy="308" r="15" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2.5"/>
  <circle cx="680" cy="230" r="15" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2.5"/>
  <circle cx="712" cy="152" r="15" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2.5"/>
  <text x="790" y="385" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">8 tools</text>
  <text x="790" y="410" text-anchor="middle" font-size="15" fill="#111111">28 possible connections</text>
  <text x="480" y="450" text-anchor="middle" font-size="15" font-style="italic" fill="#333333">Connections = n(n - 1) / 2</text>
</svg>
