  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>A weekly learning routine for an engineer with a young child</title>
  <desc>A grid of seven days by four slots. Weekday early mornings: practise or process, 35 minutes. Weekday morning train: acquire, 25 minutes. Weekday evening train: review and reflect, 10 minutes. Saturday morning: produce, 90 minutes. Sunday: rest. Evenings after 9 p.m. are left free.</desc>
