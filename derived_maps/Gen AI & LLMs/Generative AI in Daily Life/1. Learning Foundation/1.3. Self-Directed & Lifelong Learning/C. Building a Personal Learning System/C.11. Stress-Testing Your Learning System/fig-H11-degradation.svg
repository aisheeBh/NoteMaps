<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Four operating modes of a learning system</title>
  <desc>A grid with four columns for modes — full, reduced, minimum and hibernation — and seven rows for components. Full runs all seven. Reduced cuts inputs and shortens processing and practice. Minimum keeps capture and a few minutes of review or practice. Hibernation keeps only backups and a resume note.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Operating modes: what keeps running</text>
  <text x="300" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">FULL</text>
  <text x="480" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">REDUCED</text>
  <text x="660" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">MINIMUM</text>
  <text x="840" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">HIBERNATION</text>
  <text x="196" y="144" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Inputs</text>
  <rect x="216" y="114" width="168" height="48" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="300" y="143" text-anchor="middle" font-size="14" fill="#000000">on</text>
  <rect x="396" y="114" width="168" height="48" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="480" y="143" text-anchor="middle" font-size="14" fill="#222222">off</text>
  <rect x="576" y="114" width="168" height="48" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="660" y="143" text-anchor="middle" font-size="14" fill="#222222">off</text>
  <rect x="756" y="114" width="168" height="48" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="840" y="143" text-anchor="middle" font-size="14" fill="#222222">off</text>
  <text x="196" y="202" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Capture</text>
  <rect x="216" y="172" width="168" height="48" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="300" y="201" text-anchor="middle" font-size="14" fill="#000000">on</text>
  <rect x="396" y="172" width="168" height="48" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="480" y="201" text-anchor="middle" font-size="14" fill="#000000">on</text>
  <rect x="576" y="172" width="168" height="48" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="660" y="201" text-anchor="middle" font-size="14" fill="#000000">on</text>
  <rect x="756" y="172" width="168" height="48" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="840" y="201" text-anchor="middle" font-size="14" fill="#222222">off</text>
  <text x="196" y="260" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Processing</text>
  <rect x="216" y="230" width="168" height="48" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="300" y="259" text-anchor="middle" font-size="14" fill="#000000">on</text>
  <rect x="396" y="230" width="168" height="48" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="480" y="259" text-anchor="middle" font-size="14" fill="#000000">short</text>
  <rect x="576" y="230" width="168" height="48" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="660" y="259" text-anchor="middle" font-size="14" fill="#222222">off</text>
  <rect x="756" y="230" width="168" height="48" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="840" y="259" text-anchor="middle" font-size="14" fill="#222222">off</text>
  <text x="196" y="318" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Practice</text>
  <rect x="216" y="288" width="168" height="48" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="300" y="317" text-anchor="middle" font-size="14" fill="#000000">on</text>
  <rect x="396" y="288" width="168" height="48" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="480" y="317" text-anchor="middle" font-size="14" fill="#000000">short</text>
  <rect x="576" y="288" width="168" height="48" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="660" y="317" text-anchor="middle" font-size="14" fill="#000000">1 item</text>
  <rect x="756" y="288" width="168" height="48" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="840" y="317" text-anchor="middle" font-size="14" fill="#222222">off</text>
  <text x="196" y="376" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Review</text>
  <rect x="216" y="346" width="168" height="48" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="300" y="375" text-anchor="middle" font-size="14" fill="#000000">on</text>
  <rect x="396" y="346" width="168" height="48" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="480" y="375" text-anchor="middle" font-size="14" fill="#000000">on</text>
  <rect x="576" y="346" width="168" height="48" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="660" y="375" text-anchor="middle" font-size="14" fill="#000000">capped</text>
  <rect x="756" y="346" width="168" height="48" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="840" y="375" text-anchor="middle" font-size="14" fill="#000000">paused</text>
  <text x="196" y="434" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Output</text>
  <rect x="216" y="404" width="168" height="48" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="300" y="433" text-anchor="middle" font-size="14" fill="#000000">on</text>
  <rect x="396" y="404" width="168" height="48" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="480" y="433" text-anchor="middle" font-size="14" fill="#000000">small</text>
  <rect x="576" y="404" width="168" height="48" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="660" y="433" text-anchor="middle" font-size="14" fill="#222222">off</text>
  <rect x="756" y="404" width="168" height="48" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="840" y="433" text-anchor="middle" font-size="14" fill="#222222">off</text>
  <text x="196" y="492" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Reflection</text>
  <rect x="216" y="462" width="168" height="48" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="300" y="491" text-anchor="middle" font-size="14" fill="#000000">on</text>
  <rect x="396" y="462" width="168" height="48" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="480" y="491" text-anchor="middle" font-size="14" fill="#000000">on</text>
  <rect x="576" y="462" width="168" height="48" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="660" y="491" text-anchor="middle" font-size="14" fill="#000000">1 line</text>
  <rect x="756" y="462" width="168" height="48" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="840" y="491" text-anchor="middle" font-size="14" fill="#000000">resume note</text>
  <text x="480" y="532" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Backups run automatically in every mode.</text>
  <text x="480" y="556" text-anchor="middle" font-size="15" fill="#111111">Inputs are the first to stop; review and practice of existing knowledge the last.</text>
</svg>
