<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Backlog growth when capture exceeds processing</title>
  <desc>Line chart over twelve weeks. Unbalanced loop: capture 40, processing 15 a week, backlog rising in a straight line from 0 to 300 items. Rebalanced loop: starting from a backlog of 60, capture 20 and processing 22 a week after archiving old items, the backlog falls slowly to about 36.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Unprocessed items over twelve weeks</text>
  <line x1="120" y1="460" x2="870" y2="460" stroke="#222222" stroke-width="2.5"/>
  <line x1="120" y1="460" x2="120" y2="80" stroke="#222222" stroke-width="2.5"/>
  <text x="110" y="465" text-anchor="end" font-size="14" fill="#111111">0</text>
  <text x="110" y="349" text-anchor="end" font-size="14" fill="#111111">100</text>
  <line x1="120" y1="344.375" x2="860" y2="344.375" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="110" y="234" text-anchor="end" font-size="14" fill="#111111">200</text>
  <line x1="120" y1="228.75" x2="860" y2="228.75" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="110" y="118" text-anchor="end" font-size="14" fill="#111111">300</text>
  <line x1="120" y1="113.125" x2="860" y2="113.125" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="120" y="484" text-anchor="middle" font-size="14" fill="#111111">0</text>
  <text x="243" y="484" text-anchor="middle" font-size="14" fill="#111111">2</text>
  <text x="367" y="484" text-anchor="middle" font-size="14" fill="#111111">4</text>
  <text x="490" y="484" text-anchor="middle" font-size="14" fill="#111111">6</text>
  <text x="613" y="484" text-anchor="middle" font-size="14" fill="#111111">8</text>
  <text x="737" y="484" text-anchor="middle" font-size="14" fill="#111111">10</text>
  <text x="860" y="484" text-anchor="middle" font-size="14" fill="#111111">12</text>
  <text x="490" y="510" text-anchor="middle" font-size="15" fill="#111111">Weeks</text>
  <text x="70" y="280" text-anchor="middle" font-size="15" fill="#111111">Items</text>
  <polyline points="120,460 182,431 243,402 305,373 367,344 428,315 490,287 552,258 613,229 675,200 737,171 798,142 860,113" fill="none" stroke="#8B0000" stroke-width="4" stroke-dasharray="10 6"/>
  <polyline points="120,391 182,393 243,395 305,398 367,400 428,402 490,404 552,407 613,409 675,411 737,414 798,416 860,418" fill="none" stroke="#1E5E24" stroke-width="4"/>
  <rect x="529" y="156" width="207" height="20" fill="#FFFFFF"/>
  <text x="632" y="171" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">capture 40, process 15:</text>
  <rect x="535" y="176" width="193" height="20" fill="#FFFFFF"/>
  <text x="632" y="191" text-anchor="middle" font-size="15" fill="#111111">backlog grows 25 a week</text>
  <rect x="479" y="377" width="343" height="20" fill="#FFFFFF"/>
  <text x="650" y="392" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">capture 20, process 22: backlog shrinks</text>
  <text x="480" y="540" text-anchor="middle" font-size="13" font-style="italic" fill="#333333">Numbers from the worked example; straight lines assume steady weekly rates.</text>
</svg>
