<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Three levels of measurement</title>
  <desc>Three stacked tiers. Bottom tier, activity: is the system running — sessions done, reviews completed. Middle tier, flow: is material moving — inbox age, time to first use, overhead ratio. Top tier, outcome: is capability growing — delayed unaided performance, tasks done without help, outputs used by others. Arrows show activity measures steer and outcome measures judge.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Measuring a learning system at three levels</text>
  <rect x="270" y="90" width="420" height="100" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="480" y="135" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">OUTCOME: is capability growing?</text>
  <text x="480" y="155" text-anchor="middle" font-size="15" fill="#000000">delayed, unaided performance; outputs used by others</text>
  <rect x="200" y="210" width="560" height="100" rx="8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="361" y="240" width="238" height="21" fill="#FFFFFF"/>
  <text x="480" y="255" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">FLOW: is material moving?</text>
  <rect x="300" y="261" width="360" height="20" fill="#FFFFFF"/>
  <text x="480" y="275" text-anchor="middle" font-size="15" fill="#111111">inbox age; time to first use; overhead ratio</text>
  <rect x="130" y="330" width="700" height="100" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="480" y="375" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">ACTIVITY: is the system running?</text>
  <text x="480" y="395" text-anchor="middle" font-size="15" fill="#000000">sessions done; reviews completed; outputs started</text>
  <line x1="880" y1="420" x2="880" y2="110" stroke="#222222" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#arrow)"/>
  <text x="880" y="450" text-anchor="middle" font-size="14" fill="#111111">harder to</text>
  <text x="880" y="468" text-anchor="middle" font-size="14" fill="#111111">collect</text>
  <text x="80" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">JUDGE</text>
  <text x="80" y="170" text-anchor="middle" font-size="14" fill="#111111">success here</text>
  <text x="80" y="390" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">STEER</text>
  <text x="80" y="410" text-anchor="middle" font-size="14" fill="#111111">weekly here</text>
  <text x="480" y="510" text-anchor="middle" font-size="13" font-style="italic" fill="#333333">Activity measures are easiest to game; never let them become the goal.</text>
</svg>
