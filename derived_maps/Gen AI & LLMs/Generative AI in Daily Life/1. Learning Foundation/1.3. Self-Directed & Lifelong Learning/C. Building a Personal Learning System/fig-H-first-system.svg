<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Four weekly hours in a first learning system</title>
  <desc>Horizontal bars of weekly minutes: practice 80, inputs and processing 70, review 30, output 30, overhead 20, reflection 10; total 240 minutes.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">The analyst's 240 weekly minutes</text>
  <text x="316" y="106" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Practice: valuation exercises</text>
  <rect x="330" y="80" width="480" height="38" rx="0" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="822" y="106" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">80 min</text>
  <text x="316" y="164" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Inputs and processing</text>
  <rect x="330" y="138" width="420" height="38" rx="0" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="762" y="164" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">70 min</text>
  <text x="316" y="222" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Review: daily retrieval</text>
  <rect x="330" y="196" width="180" height="38" rx="0" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="522" y="222" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">30 min</text>
  <text x="316" y="280" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Output: one-page explanation</text>
  <rect x="330" y="254" width="180" height="38" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <text x="522" y="280" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">30 min</text>
  <text x="316" y="338" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">System upkeep</text>
  <rect x="330" y="312" width="120" height="38" rx="0" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="462" y="338" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">20 min</text>
  <text x="316" y="396" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Reflection: Friday look-back</text>
  <rect x="330" y="370" width="60" height="38" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="402" y="396" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">10 min</text>
  <line x1="330" y1="70" x2="330" y2="430" stroke="#222222" stroke-width="2"/>
  <text x="480" y="455" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Overhead 20 / 240 = about 8%; practice and output together take 46% of the time</text>
</svg>
