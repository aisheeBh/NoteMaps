  <text x="480" y="326" text-anchor="middle" font-size="13" fill="#111111">13</text>
  <line x1="548.3333333333334" y1="300" x2="548.3333333333334" y2="308" stroke="#222222" stroke-width="1.5"/>
  <text x="548" y="326" text-anchor="middle" font-size="13" fill="#111111">14</text>
  <line x1="616.6666666666666" y1="300" x2="616.6666666666666" y2="308" stroke="#222222" stroke-width="1.5"/>
  <text x="617" y="326" text-anchor="middle" font-size="13" fill="#111111">15</text>
  <line x1="685.0" y1="300" x2="685.0" y2="308" stroke="#222222" stroke-width="1.5"/>
  <text x="685" y="326" text-anchor="middle" font-size="13" fill="#111111">16</text>
  <line x1="753.3333333333334" y1="300" x2="753.3333333333334" y2="308" stroke="#222222" stroke-width="1.5"/>
  <text x="753" y="326" text-anchor="middle" font-size="13" fill="#111111">17</text>
  <line x1="821.6666666666666" y1="300" x2="821.6666666666666" y2="308" stroke="#222222" stroke-width="1.5"/>
