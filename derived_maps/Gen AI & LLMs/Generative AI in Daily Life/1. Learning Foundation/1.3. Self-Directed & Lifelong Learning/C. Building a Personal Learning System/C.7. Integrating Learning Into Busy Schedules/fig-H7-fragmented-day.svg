  <text x="70" y="326" text-anchor="middle" font-size="13" fill="#111111">07</text>
  <line x1="138.33333333333331" y1="300" x2="138.33333333333331" y2="308" stroke="#222222" stroke-width="1.5"/>
  <text x="138" y="326" text-anchor="middle" font-size="13" fill="#111111">08</text>
  <line x1="206.66666666666666" y1="300" x2="206.66666666666666" y2="308" stroke="#222222" stroke-width="1.5"/>
  <text x="207" y="326" text-anchor="middle" font-size="13" fill="#111111">09</text>
  <line x1="275.0" y1="300" x2="275.0" y2="308" stroke="#222222" stroke-width="1.5"/>
  <text x="275" y="326" text-anchor="middle" font-size="13" fill="#111111">10</text>
  <line x1="343.3333333333333" y1="300" x2="343.3333333333333" y2="308" stroke="#222222" stroke-width="1.5"/>
  <text x="343" y="326" text-anchor="middle" font-size="13" fill="#111111">11</text>
