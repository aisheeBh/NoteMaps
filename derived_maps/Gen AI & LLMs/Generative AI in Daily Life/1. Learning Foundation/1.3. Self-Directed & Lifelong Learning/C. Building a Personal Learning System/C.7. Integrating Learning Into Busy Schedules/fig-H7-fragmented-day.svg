  <line x1="121.25" y1="226" x2="121.25" y2="196" stroke="#555555" stroke-width="1.5"/>
  <rect x="51" y="146" width="140" height="48" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="121" y="166" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">train:</text>
  <text x="121" y="183" text-anchor="middle" font-size="13" fill="#000000">process notes</text>
  <line x1="314.6333333333333" y1="226" x2="314.6333333333333" y2="146" stroke="#555555" stroke-width="1.5"/>
  <rect x="245" y="96" width="140" height="48" rx="8" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="294" y="103" width="42" height="18" fill="#FFFFFF"/>
  <text x="315" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">gap:</text>
  <rect x="276" y="121" width="79" height="17" fill="#FFFFFF"/>
  <text x="315" y="133" text-anchor="middle" font-size="13" fill="#111111">flashcards</text>
  <line x1="428.75" y1="226" x2="428.75" y2="196" stroke="#555555" stroke-width="1.5"/>
  <rect x="359" y="146" width="140" height="48" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="429" y="166" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">lunch:</text>
  <text x="429" y="183" text-anchor="middle" font-size="13" fill="#000000">worked example</text>
  <line x1="587.9666666666667" y1="226" x2="587.9666666666667" y2="146" stroke="#555555" stroke-width="1.5"/>
  <rect x="518" y="96" width="140" height="48" rx="8" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="543" y="103" width="90" height="18" fill="#FFFFFF"/>
  <text x="588" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">after 1:1:</text>
  <rect x="538" y="121" width="100" height="17" fill="#FFFFFF"/>
  <text x="588" y="133" text-anchor="middle" font-size="13" fill="#111111">note a lesson</text>
  <line x1="690.4666666666665" y1="226" x2="690.4666666666665" y2="196" stroke="#555555" stroke-width="1.5"/>
  <rect x="620" y="146" width="140" height="48" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="690" y="166" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">gap:</text>
  <text x="690" y="183" text-anchor="middle" font-size="13" fill="#000000">one question</text>
  <line x1="814.8333333333333" y1="226" x2="814.8333333333333" y2="146" stroke="#555555" stroke-width="1.5"/>
  <rect x="745" y="96" width="140" height="48" rx="8" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="766" y="103" width="98" height="18" fill="#FFFFFF"/>
  <text x="815" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">train home:</text>
  <rect x="745" y="121" width="141" height="17" fill="#FFFFFF"/>
  <text x="815" y="133" text-anchor="middle" font-size="13" fill="#111111">one-line reflection</text>
  <text x="480" y="370" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Gaps of 5 to 30 minutes suit retrieval, review and brief processing.</text>
  <text x="480" y="394" text-anchor="middle" font-size="15" fill="#111111">Deep work still needs two or three protected blocks a week, outside this day.</text>
  <text x="480" y="430" text-anchor="middle" font-size="13" font-style="italic" fill="#333333">Illustrative day; times rounded. Unlabelled blocks: commute and lunch.</text>
</svg>
