  <rect x="207" y="230" width="103" height="64" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="258" y="267" text-anchor="middle" font-size="13" fill="#FFFFFF">meetings</text>
  <rect x="320" y="230" width="92" height="64" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="366" y="267" text-anchor="middle" font-size="13" fill="#FFFFFF">meetings</text>
  <rect x="446" y="230" width="34" height="64" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <rect x="480" y="230" width="102" height="64" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="531" y="267" text-anchor="middle" font-size="13" fill="#FFFFFF">meetings</text>
  <rect x="593" y="230" width="92" height="64" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="639" y="267" text-anchor="middle" font-size="13" fill="#FFFFFF">1:1s</text>
  <rect x="696" y="230" width="92" height="64" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="742" y="267" text-anchor="middle" font-size="13" fill="#FFFFFF">meetings</text>
