<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Five lenses for a learning practice audit</title>
  <desc>A central box labelled current learning practice is surrounded by five lens boxes: activities, time, strategies, flow and outcomes, each with its audit question. A dashed outer frame labelled context holds constraints, environment and affect.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Five lenses for auditing current practice</text>
  <rect x="40" y="64" width="880" height="500" rx="14" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="480" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">CONTEXT: constraints, environment, affect</text>
  <rect x="360" y="270" width="240" height="90" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="480" y="310" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Current learning</text>
  <text x="480" y="332" text-anchor="middle" font-size="17" fill="#FFFFFF">practice</text>
  <rect x="80" y="120" width="240" height="84" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="200" y="157" text-anchor="middle" font-size="17" font-weight="bold" fill="#000000">Activities</text>
  <text x="200" y="178" text-anchor="middle" font-size="16" fill="#000000">what is done?</text>
  <rect x="360" y="120" width="240" height="84" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="480" y="157" text-anchor="middle" font-size="17" font-weight="bold" fill="#000000">Time</text>
  <text x="480" y="178" text-anchor="middle" font-size="16" fill="#000000">how much, and when?</text>
  <rect x="640" y="120" width="240" height="84" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="760" y="157" text-anchor="middle" font-size="17" font-weight="bold" fill="#000000">Strategies</text>
  <text x="760" y="178" text-anchor="middle" font-size="16" fill="#000000">by what methods?</text>
  <rect x="150" y="420" width="240" height="84" rx="8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="246" y="441" width="49" height="22" fill="#FFFFFF"/>
  <text x="270" y="457" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Flow</text>
  <rect x="159" y="463" width="222" height="21" fill="#FFFFFF"/>
  <text x="270" y="478" text-anchor="middle" font-size="16" fill="#111111">what happens to material?</text>
  <rect x="570" y="420" width="240" height="84" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="690" y="457" text-anchor="middle" font-size="17" font-weight="bold" fill="#000000">Outcomes</text>
  <text x="690" y="478" text-anchor="middle" font-size="16" fill="#000000">with what results?</text>
  <line x1="200" y1="204" x2="380" y2="268" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="204" x2="480" y2="266" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="760" y1="204" x2="580" y2="268" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="362" x2="290" y2="416" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="362" x2="690" y2="416" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
