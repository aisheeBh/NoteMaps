  <rect x="316" y="90" width="273" height="24" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="453" y="104" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Criterion: say "old" to the right</text>
  <rect x="200" y="185" width="90" height="25" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="245" y="200" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">New items</text>
  <rect x="645" y="245" width="123" height="25" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="706" y="260" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Studied items</text>
  <rect x="601" y="370" width="48" height="25" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/>
  <text x="625" y="385" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Hits</text>
  <rect x="281" y="381" width="108" height="24" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
  <text x="335" y="395" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">False alarms</text>
