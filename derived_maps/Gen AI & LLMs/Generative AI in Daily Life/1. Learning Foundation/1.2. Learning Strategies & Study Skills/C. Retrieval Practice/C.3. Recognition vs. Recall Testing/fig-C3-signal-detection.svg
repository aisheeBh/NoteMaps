  <line x1="488" y1="172" x2="566" y2="172" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="593" y="136" width="226" height="24" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="706" y="150" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">d′ = distance between peaks</text>
  <text x="480" y="490" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Felt familiarity of an item  (low → high)</text>
  <text x="480" y="525" text-anchor="middle" font-size="13" fill="#333333">Schematic of the equal-variance signal detection model; distributions are illustrative.</text>
</svg>
