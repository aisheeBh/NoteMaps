<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Recall one week later by what continued after an item was learned</title>
  <desc>Approximate final recall in Karpicke and Roediger 2008: about 80 percent when testing continued, whether or not study continued; about a third when testing stopped. Predictions were similar across conditions.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" fill="#111111" font-weight="bold">After an item is learned: keep studying, or keep retrieving?</text>
  <line x1="140" y1="430" x2="880" y2="430" stroke="#222222" stroke-width="2.5"/>
  <line x1="140" y1="430" x2="140" y2="77" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="82" y="262" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 82 262.5)">Recalled one week later (%)</text>
  <text x="131" y="435" text-anchor="end" font-size="14" fill="#111111">0</text>
  <text x="131" y="368" text-anchor="end" font-size="14" fill="#111111">20</text>
  <line x1="140" y1="363" x2="880" y2="363" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="131" y="301" text-anchor="end" font-size="14" fill="#111111">40</text>
  <line x1="140" y1="296" x2="880" y2="296" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="131" y="234" text-anchor="end" font-size="14" fill="#111111">60</text>
  <line x1="140" y1="229" x2="880" y2="229" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="131" y="167" text-anchor="end" font-size="14" fill="#111111">80</text>
  <line x1="140" y1="162" x2="880" y2="162" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="131" y="100" text-anchor="end" font-size="14" fill="#111111">100</text>
  <line x1="140" y1="95" x2="880" y2="95" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <rect x="176" y="162" width="114" height="268" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="232" y="153" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">about 80%</text>
  <text x="232" y="456" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Study and test</text>
  <text x="232" y="475" text-anchor="middle" font-size="15" fill="#111111">both continued</text>
  <rect x="360" y="162" width="114" height="268" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="418" y="153" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">about 80%</text>
  <text x="418" y="456" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Study dropped,</text>
  <text x="418" y="475" text-anchor="middle" font-size="15" fill="#111111">testing continued</text>
  <text x="602" y="456" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Testing dropped,</text>
  <text x="602" y="475" text-anchor="middle" font-size="15" fill="#111111">study continued</text>
  <text x="788" y="456" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Both dropped</text>
  <rect x="546" y="309" width="114" height="121" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="602" y="300" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">about 36%</text>
  <rect x="730" y="319" width="114" height="111" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="788" y="310" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">about 33%</text>
  <line x1="140" y1="262" x2="880" y2="262" stroke="#1F3B5C" stroke-width="2.5" stroke-dasharray="10 6"/>
  <rect x="319" y="238" width="382" height="24" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="510" y="252" text-anchor="middle" font-size="14" fill="#111111">Students predicted about 50% in every condition</text>
  <text x="480" y="528" text-anchor="middle" font-size="13" fill="#333333">Approximate values from Karpicke and Roediger (2008); 40 Swahili–English word pairs.</text>
</svg>
