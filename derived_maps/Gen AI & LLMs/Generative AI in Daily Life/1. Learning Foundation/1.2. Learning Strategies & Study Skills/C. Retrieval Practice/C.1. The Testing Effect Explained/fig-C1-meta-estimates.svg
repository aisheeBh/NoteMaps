<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Pooled estimates of the testing effect</title>
  <desc>Horizontal bars: Rowland 2014 laboratory about 0.50; Adesope and colleagues 2017 practice tests versus restudy about 0.51; Yang and colleagues 2021 classrooms about 0.50, 0.43 after bias correction; mathematics meta-analysis 2025 about 0.18 with an interval including zero.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" fill="#111111" font-weight="bold">How large is the testing effect? Four syntheses</text>
  <line x1="360" y1="90" x2="360" y2="450" stroke="#222222" stroke-width="2.5"/>
  <line x1="360" y1="90" x2="360" y2="450" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="360" y="472" text-anchor="middle" font-size="14" fill="#111111">0.0</text>
  <line x1="500" y1="90" x2="500" y2="450" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="500" y="472" text-anchor="middle" font-size="14" fill="#111111">0.2</text>
  <line x1="640" y1="90" x2="640" y2="450" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="640" y="472" text-anchor="middle" font-size="14" fill="#111111">0.4</text>
  <line x1="780" y1="90" x2="780" y2="450" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="780" y="472" text-anchor="middle" font-size="14" fill="#111111">0.6</text>
  <line x1="920" y1="90" x2="920" y2="450" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="920" y="472" text-anchor="middle" font-size="14" fill="#111111">0.8</text>
  <text x="640" y="500" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Effect size over restudy (g)</text>
  <text x="346" y="124" text-anchor="end" font-size="16" fill="#111111" font-weight="bold">Rowland (2014)</text>
  <text x="346" y="144" text-anchor="end" font-size="14" fill="#111111">laboratory studies</text>
  <rect x="360" y="100" width="350" height="50" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="726" y="117" width="48" height="25" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="750" y="132" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">0.50</text>
  <text x="346" y="216" text-anchor="end" font-size="16" fill="#111111" font-weight="bold">Adesope et al. (2017)</text>
  <text x="346" y="236" text-anchor="end" font-size="14" fill="#111111">tests vs restudy</text>
  <rect x="360" y="192" width="357" height="50" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="733" y="209" width="48" height="25" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="757" y="224" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">0.51</text>
  <text x="346" y="308" text-anchor="end" font-size="16" fill="#111111" font-weight="bold">Yang et al. (2021)</text>
  <text x="346" y="328" text-anchor="end" font-size="14" fill="#111111">222 classroom studies</text>
  <rect x="360" y="284" width="350" height="50" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="726" y="301" width="48" height="25" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="750" y="316" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">0.50</text>
  <line x1="661" y1="278" x2="661" y2="340" stroke="#000000" stroke-width="3" stroke-dasharray="2 4"/>
  <text x="669" y="356" text-anchor="start" font-size="14" fill="#111111" font-style="italic">0.43 after bias correction</text>
  <text x="346" y="400" text-anchor="end" font-size="16" fill="#111111" font-weight="bold">Mathematics (2025)</text>
  <text x="346" y="420" text-anchor="end" font-size="14" fill="#111111">spaced or tested maths</text>
  <rect x="360" y="376" width="126" height="50" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="502" y="393" width="48" height="25" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="526" y="408" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">0.18</text>
  <text x="576" y="408" text-anchor="start" font-size="14" fill="#111111" font-style="italic">uncertainty range includes zero</text>
  <text x="480" y="530" text-anchor="middle" font-size="13" fill="#333333">Rounded pooled estimates. Reviews differ in inclusion rules and comparison conditions.</text>
</svg>
