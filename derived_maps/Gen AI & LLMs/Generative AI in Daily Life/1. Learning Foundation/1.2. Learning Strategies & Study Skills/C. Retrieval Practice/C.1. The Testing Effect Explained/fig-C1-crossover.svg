<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 545" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Restudy versus retrieval at three delays</title>
  <desc>Bar chart of approximate recall in Roediger and Karpicke 2006: restudy 81, 54 and 42 percent; tested 75, 68 and 56 percent after five minutes, two days and one week.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" fill="#111111" font-weight="bold">Retrieval loses at first, then wins</text>
  <line x1="140" y1="440" x2="700" y2="440" stroke="#222222" stroke-width="2.5"/>
  <line x1="140" y1="440" x2="140" y2="72" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="82" y="265" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 82 265.0)">Idea units recalled (%)</text>
  <text x="131" y="445" text-anchor="end" font-size="14" fill="#111111">0</text>
  <text x="131" y="375" text-anchor="end" font-size="14" fill="#111111">20</text>
  <line x1="140" y1="370" x2="700" y2="370" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="131" y="305" text-anchor="end" font-size="14" fill="#111111">40</text>
  <line x1="140" y1="300" x2="700" y2="300" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="131" y="235" text-anchor="end" font-size="14" fill="#111111">60</text>
  <line x1="140" y1="230" x2="700" y2="230" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="131" y="165" text-anchor="end" font-size="14" fill="#111111">80</text>
  <line x1="140" y1="160" x2="700" y2="160" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="131" y="95" text-anchor="end" font-size="14" fill="#111111">100</text>
  <line x1="140" y1="90" x2="700" y2="90" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <rect x="156" y="156" width="74" height="284" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="193" y="148" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">81%</text>
  <rect x="236" y="178" width="74" height="262" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="273" y="168" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">75%</text>
  <text x="233" y="466" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">5 minutes</text>
  <rect x="343" y="251" width="74" height="189" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="380" y="242" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">54%</text>
  <rect x="423" y="202" width="74" height="238" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="460" y="193" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">68%</text>
  <text x="420" y="466" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">2 days</text>
  <rect x="530" y="293" width="74" height="147" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="567" y="284" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">42%</text>
  <rect x="610" y="244" width="74" height="196" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="647" y="235" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">56%</text>
  <text x="607" y="466" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">1 week</text>
  <rect x="730" y="120" width="28" height="22" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="768" y="137" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">Read twice</text>
  <text x="768" y="157" text-anchor="start" font-size="14" fill="#111111">(restudy)</text>
  <rect x="730" y="185" width="28" height="22" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="768" y="202" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">Read once, then</text>
  <text x="768" y="222" text-anchor="start" font-size="14" fill="#111111">recall (test)</text>
  <rect x="722" y="265" width="214" height="140" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="829" y="312" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Crossover</text>
  <text x="829" y="331" text-anchor="middle" font-size="15" fill="#111111">restudy ahead at</text>
  <text x="829" y="350" text-anchor="middle" font-size="15" fill="#111111">5 minutes; testing</text>
  <text x="829" y="369" text-anchor="middle" font-size="15" fill="#111111">ahead after delay</text>
  <text x="420" y="505" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Final test delay</text>
  <text x="480" y="530" text-anchor="middle" font-size="13" fill="#333333">Approximate values from Roediger and Karpicke (2006), Experiment 1; no feedback was given after the recall test.</text>
</svg>
