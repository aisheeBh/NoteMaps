  <text x="880" y="445" text-anchor="middle" font-size="14" fill="#111111">12</text>
  <text x="515" y="475" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Week of term</text>
  <rect x="390" y="109" width="43" height="23" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="412" y="122" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">test</text>
  <rect x="788" y="90" width="43" height="23" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="810" y="103" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">test</text>
  <rect x="166" y="198" width="234" height="24" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
  <text x="283" y="212" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Tests only in weeks 6 and 12</text>
  <rect x="576" y="214" width="210" height="24" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="681" y="228" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Weekly low-stakes quizzes</text>
  <text x="480" y="525" text-anchor="middle" font-size="13" fill="#333333">Schematic of the study pattern often described with infrequent versus frequent testing; not plotted from a single dataset.</text>
</svg>
