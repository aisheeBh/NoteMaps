<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Study activity across a term</title>
  <desc>Schematic lines over twelve weeks. With tests only in weeks 6 and 12, study is near zero most weeks and spikes just before each test. With weekly low-stakes quizzes, study is moderate and steady every week.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" fill="#111111" font-weight="bold">Rare tests produce bursts; weekly quizzes produce steady study</text>
  <line x1="150" y1="420" x2="880" y2="420" stroke="#222222" stroke-width="2.5"/>
  <line x1="150" y1="420" x2="150" y2="82" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="92" y="260" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 92 260.0)">Hours of study that week</text>
  <text x="141" y="425" text-anchor="end" font-size="14" fill="#111111">0</text>
  <text x="141" y="265" text-anchor="end" font-size="14" fill="#111111">5</text>
  <line x1="150" y1="260" x2="880" y2="260" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="141" y="105" text-anchor="end" font-size="14" fill="#111111">10</text>
  <line x1="150" y1="100" x2="880" y2="100" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
