  <text x="283" y="445" text-anchor="middle" font-size="14" fill="#111111">3</text>
  <text x="349" y="445" text-anchor="middle" font-size="14" fill="#111111">4</text>
  <text x="415" y="445" text-anchor="middle" font-size="14" fill="#111111">5</text>
  <text x="482" y="445" text-anchor="middle" font-size="14" fill="#111111">6</text>
  <text x="548" y="445" text-anchor="middle" font-size="14" fill="#111111">7</text>
  <text x="615" y="445" text-anchor="middle" font-size="14" fill="#111111">8</text>
