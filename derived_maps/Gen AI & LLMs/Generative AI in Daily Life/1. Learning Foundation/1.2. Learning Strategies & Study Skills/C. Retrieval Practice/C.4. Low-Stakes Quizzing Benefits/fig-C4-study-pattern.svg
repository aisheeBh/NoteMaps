  <rect x="476" y="286" width="12" height="12" fill="#1F3B5C"/>
  <rect x="542" y="318" width="12" height="12" fill="#1F3B5C"/>
  <rect x="609" y="318" width="12" height="12" fill="#1F3B5C"/>
