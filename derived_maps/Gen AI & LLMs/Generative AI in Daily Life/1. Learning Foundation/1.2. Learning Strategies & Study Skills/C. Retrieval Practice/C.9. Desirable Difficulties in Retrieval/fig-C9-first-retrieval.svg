<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Expanding versus equally spaced retrieval</title>
  <desc>Schematic: two practice schedules shown as timelines, then grouped bars. The expanding schedule with an immediate first test is better on a test ten minutes later; the equally spaced schedule with a delayed first test is better two days later.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" fill="#111111" font-weight="bold">Make the first retrieval wait a little</text>
  <text x="70" y="95" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">Expanding: first test almost at once</text>
  <line x1="70" y1="115" x2="520" y2="115" stroke="#222222" stroke-width="2"/>
  <text x="70" y="165" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">Equal: first test after a delay</text>
  <line x1="70" y1="185" x2="520" y2="185" stroke="#222222" stroke-width="2"/>
  <rect x="70" y="103" width="30" height="24" rx="3" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="85" y="140" text-anchor="middle" font-size="13" fill="#111111">study</text>
  <rect x="70" y="173" width="30" height="24" rx="3" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="85" y="210" text-anchor="middle" font-size="13" fill="#111111">study</text>
  <circle cx="120" cy="115" r="9" fill="url(#lines)" stroke="#8B0000" stroke-width="2"/>
  <circle cx="190" cy="115" r="9" fill="url(#lines)" stroke="#8B0000" stroke-width="2"/>
  <circle cx="330" cy="115" r="9" fill="url(#lines)" stroke="#8B0000" stroke-width="2"/>
  <circle cx="200" cy="185" r="9" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <circle cx="310" cy="185" r="9" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <circle cx="420" cy="185" r="9" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="118" y="140" text-anchor="middle" font-size="13" fill="#111111">test</text>
  <text x="200" y="210" text-anchor="middle" font-size="13" fill="#111111">test</text>
  <text x="540" y="120" text-anchor="start" font-size="14" fill="#111111" font-style="italic">gaps grow</text>
  <text x="540" y="190" text-anchor="start" font-size="14" fill="#111111" font-style="italic">gaps equal</text>
  <line x1="170" y1="490" x2="690" y2="490" stroke="#222222" stroke-width="2.5"/>
  <line x1="170" y1="490" x2="170" y2="242" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="112" y="375" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 112 375.0)">Recall (%)</text>
  <text x="161" y="495" text-anchor="end" font-size="14" fill="#111111">0</text>
  <text x="161" y="380" text-anchor="end" font-size="14" fill="#111111">50</text>
  <line x1="170" y1="375" x2="690" y2="375" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="161" y="265" text-anchor="end" font-size="14" fill="#111111">100</text>
  <line x1="170" y1="260" x2="690" y2="260" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <rect x="213" y="329" width="84" height="161" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="303" y="364" width="84" height="126" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="300" y="516" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">10 minutes later</text>
  <rect x="473" y="403" width="84" height="87" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="563" y="380" width="84" height="110" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="560" y="516" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">2 days later</text>
  <rect x="730" y="300" width="28" height="22" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="768" y="317" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">Expanding,</text>
  <text x="768" y="337" text-anchor="start" font-size="14" fill="#111111">early first test</text>
  <rect x="730" y="360" width="28" height="22" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="768" y="377" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">Equal,</text>
  <text x="768" y="397" text-anchor="start" font-size="14" fill="#111111">delayed first test</text>
  <text x="480" y="565" text-anchor="middle" font-size="13" fill="#333333">Schematic of the pattern reported by Karpicke and Roediger (2007); other studies find different results.</text>
</svg>
