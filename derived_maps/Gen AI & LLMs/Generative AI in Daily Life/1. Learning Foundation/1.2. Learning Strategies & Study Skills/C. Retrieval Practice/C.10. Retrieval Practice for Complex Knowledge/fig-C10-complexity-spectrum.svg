<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>From isolated facts to integrated reasoning</title>
  <desc>A horizontal spectrum of element interactivity from low to high, with example material at each point and the retrieval prompt that suits it: what is, how does X affect Y, draw the model, explain why, decide what applies.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" fill="#111111" font-weight="bold">As complexity rises, retrieval must target structure and reasoning</text>
  <line x1="60" y1="130" x2="900" y2="130" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="60" y="105" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">Low element interactivity</text>
  <text x="900" y="105" text-anchor="end" font-size="15" fill="#111111" font-weight="bold">High element interactivity</text>
  <rect x="60" y="160" width="150" height="90" rx="6" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="135" y="210" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">Vocabulary</text>
  <text x="135" y="285" text-anchor="middle" font-size="13" fill="#111111" font-style="italic">Example prompt</text>
  <text x="135" y="308" text-anchor="middle" font-size="14" fill="#111111">"What is EBITDA?"</text>
  <text x="135" y="326" text-anchor="middle" font-size="14" fill="#111111"></text>
  <rect x="232" y="160" width="150" height="90" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="307" y="210" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Linked concepts</text>
  <text x="307" y="285" text-anchor="middle" font-size="13" fill="#111111" font-style="italic">Example prompt</text>
  <text x="307" y="308" text-anchor="middle" font-size="14" fill="#111111">"How does margin</text>
  <text x="307" y="326" text-anchor="middle" font-size="14" fill="#111111">affect cash flow?"</text>
  <rect x="404" y="160" width="150" height="90" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="432" y="190" width="94" height="29" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="479" y="210" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Mechanism</text>
  <text x="479" y="285" text-anchor="middle" font-size="13" fill="#111111" font-style="italic">Example prompt</text>
  <text x="479" y="308" text-anchor="middle" font-size="14" fill="#111111">"Draw the model</text>
  <text x="479" y="326" text-anchor="middle" font-size="14" fill="#111111">from memory"</text>
  <rect x="576" y="160" width="150" height="90" rx="6" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="651" y="201" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Principle with</text>
  <text x="651" y="220" text-anchor="middle" font-size="15" fill="#111111">conditions</text>
  <text x="651" y="285" text-anchor="middle" font-size="13" fill="#111111" font-style="italic">Example prompt</text>
  <text x="651" y="308" text-anchor="middle" font-size="14" fill="#111111">"When does it</text>
  <text x="651" y="326" text-anchor="middle" font-size="14" fill="#111111">not apply?"</text>
  <rect x="748" y="160" width="150" height="90" rx="6" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="776" y="190" width="94" height="29" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/>
  <text x="823" y="210" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Judgement</text>
  <text x="823" y="285" text-anchor="middle" font-size="13" fill="#111111" font-style="italic">Example prompt</text>
  <text x="823" y="308" text-anchor="middle" font-size="14" fill="#111111">"Which option, and</text>
  <text x="823" y="326" text-anchor="middle" font-size="14" fill="#111111">why?"</text>
  <text x="60" y="380" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">What is learned</text>
  <text x="135" y="404" text-anchor="middle" font-size="14" fill="#111111">single items</text>
  <text x="307" y="404" text-anchor="middle" font-size="14" fill="#111111">networks</text>
  <text x="479" y="404" text-anchor="middle" font-size="14" fill="#111111">causal models</text>
  <text x="651" y="404" text-anchor="middle" font-size="14" fill="#111111">rules with limits</text>
  <text x="823" y="404" text-anchor="middle" font-size="14" fill="#111111">integrated decisions</text>
  <text x="60" y="450" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">Support first</text>
  <text x="135" y="474" text-anchor="middle" font-size="14" fill="#111111">little</text>
  <text x="307" y="474" text-anchor="middle" font-size="14" fill="#111111">some</text>
  <text x="479" y="474" text-anchor="middle" font-size="14" fill="#111111">examples</text>
  <text x="651" y="474" text-anchor="middle" font-size="14" fill="#111111">contrast cases</text>
  <text x="823" y="474" text-anchor="middle" font-size="14" fill="#111111">worked cases</text>
  <text x="480" y="545" text-anchor="middle" font-size="13" fill="#333333">Conceptual spectrum; real material often mixes several levels.</text>
</svg>
