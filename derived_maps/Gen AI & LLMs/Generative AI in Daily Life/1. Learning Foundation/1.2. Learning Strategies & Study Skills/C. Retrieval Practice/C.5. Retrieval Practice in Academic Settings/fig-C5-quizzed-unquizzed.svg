<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Quizzed versus unquizzed content in a within-class design</title>
  <desc>Schematic grouped bars: at the unit exam, the end-of-semester exam and the end-of-year exam, content that had been quizzed in class scores higher than comparable unquizzed content, and the advantage persists months later.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" fill="#111111" font-weight="bold">Same pupils, same teacher: quizzed content is retained better</text>
  <line x1="140" y1="420" x2="680" y2="420" stroke="#222222" stroke-width="2.5"/>
  <line x1="140" y1="420" x2="140" y2="77" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="82" y="258" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 82 257.5)">Exam score on that content (%)</text>
  <text x="131" y="425" text-anchor="end" font-size="14" fill="#111111">0</text>
  <text x="131" y="344" text-anchor="end" font-size="14" fill="#111111">25</text>
  <line x1="140" y1="339" x2="680" y2="339" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="131" y="262" text-anchor="end" font-size="14" fill="#111111">50</text>
  <line x1="140" y1="258" x2="680" y2="258" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="131" y="181" text-anchor="end" font-size="14" fill="#111111">75</text>
  <line x1="140" y1="176" x2="680" y2="176" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="131" y="100" text-anchor="end" font-size="14" fill="#111111">100</text>
  <line x1="140" y1="95" x2="680" y2="95" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <rect x="159" y="166" width="68" height="254" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="233" y="121" width="68" height="299" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="230" y="446" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Unit exam</text>
  <rect x="339" y="209" width="68" height="211" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="413" y="160" width="68" height="260" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="410" y="446" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">End of semester</text>
  <rect x="519" y="241" width="68" height="179" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="593" y="186" width="68" height="234" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="590" y="446" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">End of year</text>
  <rect x="712" y="120" width="28" height="22" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="750" y="137" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">Taught, not quizzed</text>
  <rect x="712" y="160" width="28" height="22" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="750" y="177" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">Taught and quizzed</text>
  <text x="750" y="197" text-anchor="start" font-size="14" fill="#111111">(brief, low stakes,</text>
  <text x="750" y="215" text-anchor="start" font-size="14" fill="#111111">with feedback)</text>
  <rect x="705" y="255" width="235" height="120" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="822" y="301" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Advantage persists</text>
  <text x="822" y="320" text-anchor="middle" font-size="15" fill="#111111">to the end-of-year</text>
  <text x="822" y="339" text-anchor="middle" font-size="15" fill="#111111">exam, months later</text>
  <text x="410" y="492" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">When the exam was taken</text>
  <text x="480" y="528" text-anchor="middle" font-size="13" fill="#333333">Schematic in the pattern reported by McDaniel and colleagues (2011); heights are illustrative, not their data.</text>
</svg>
