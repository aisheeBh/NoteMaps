<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The two systems of dual coding theory</title>
  <desc>Verbal stimuli enter a verbal system of logogens organised sequentially; nonverbal stimuli enter a nonverbal system of imagens organised synchronously. Referential connections link the two systems; associative connections link units within each system. Both feed verbal and nonverbal responses.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Two linked systems of representation</text>

  <rect x="40" y="70" width="200" height="60" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="140" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Verbal stimuli</text>
  <text x="140" y="118" text-anchor="middle" font-size="14" fill="#111111">spoken and written words</text>
  <rect x="720" y="70" width="200" height="60" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="820" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Nonverbal stimuli</text>
  <text x="820" y="118" text-anchor="middle" font-size="14" fill="#111111">objects, scenes, sounds</text>

  <line x1="140" y1="130" x2="200" y2="175" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="820" y1="130" x2="760" y2="175" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="180" width="320" height="250" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="3"/>
  <rect x="90" y="190" width="260" height="56" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="220" y="214" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">VERBAL SYSTEM</text>
  <text x="220" y="236" text-anchor="middle" font-size="14" fill="#111111">logogens, sequential order</text>
  <g font-size="15" fill="#111111" text-anchor="middle">
    <rect x="90" y="280" width="110" height="40" fill="#FFFFFF" stroke="#222222" stroke-width="2"/><text x="145" y="305">"ladder"</text>
    <rect x="240" y="280" width="110" height="40" fill="#FFFFFF" stroke="#222222" stroke-width="2"/><text x="295" y="305">"climb"</text>
    <rect x="165" y="360" width="110" height="40" fill="#FFFFFF" stroke="#222222" stroke-width="2"/><text x="220" y="385">"rung"</text>
  </g>
  <g stroke="#333333" stroke-width="1.5" stroke-dasharray="2 4">
    <line x1="200" y1="300" x2="240" y2="300"/><line x1="160" y1="320" x2="200" y2="360"/><line x1="280" y1="320" x2="245" y2="360"/>
  </g>

  <rect x="580" y="180" width="320" height="250" fill="url(#dots)" stroke="#7A5200" stroke-width="3" stroke-dasharray="8 4"/>
  <rect x="610" y="190" width="260" height="56" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="740" y="214" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">NONVERBAL SYSTEM</text>
  <text x="740" y="236" text-anchor="middle" font-size="14" fill="#111111">imagens, synchronous whole</text>
  <g font-size="15" fill="#111111" text-anchor="middle">
    <rect x="605" y="280" width="120" height="40" fill="#FFFFFF" stroke="#222222" stroke-width="2"/><text x="665" y="305">ladder image</text>
    <rect x="755" y="280" width="120" height="40" fill="#FFFFFF" stroke="#222222" stroke-width="2"/><text x="815" y="305">wall image</text>
    <rect x="675" y="360" width="130" height="40" fill="#FFFFFF" stroke="#222222" stroke-width="2"/><text x="740" y="385">painter image</text>
  </g>
  <g stroke="#333333" stroke-width="1.5" stroke-dasharray="2 4">
    <line x1="725" y1="300" x2="755" y2="300"/><line x1="680" y1="320" x2="715" y2="360"/><line x1="800" y1="320" x2="765" y2="360"/>
  </g>

  <line x1="385" y1="290" x2="575" y2="290" stroke="#000000" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <rect x="400" y="250" width="160" height="28" fill="#FFFFFF"/>
  <text x="480" y="270" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">referential links</text>
  <text x="480" y="318" text-anchor="middle" font-size="14" fill="#111111">naming a picture</text>
  <text x="480" y="338" text-anchor="middle" font-size="14" fill="#111111">imaging a word</text>
  <rect x="85" y="406" width="270" height="22" fill="#FFFFFF"/>
  <text x="220" y="422" text-anchor="middle" font-size="14" fill="#111111">associative links within system</text>
  <rect x="605" y="406" width="270" height="22" fill="#FFFFFF"/>
  <text x="740" y="422" text-anchor="middle" font-size="14" fill="#111111">associative links within system</text>

  <line x1="220" y1="430" x2="220" y2="468" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="430" x2="740" y2="468" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="90" y="472" width="260" height="44" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="220" y="500" text-anchor="middle" font-size="15" fill="#111111">Verbal responses: say, write</text>
  <rect x="610" y="472" width="260" height="44" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="740" y="500" text-anchor="middle" font-size="15" fill="#111111">Nonverbal responses: draw, act</text>
  <text x="480" y="545" text-anchor="middle" font-size="13" fill="#333333">Schematic after Paivio (1986); the systems are functionally separate but richly interconnected.</text>
</svg>
