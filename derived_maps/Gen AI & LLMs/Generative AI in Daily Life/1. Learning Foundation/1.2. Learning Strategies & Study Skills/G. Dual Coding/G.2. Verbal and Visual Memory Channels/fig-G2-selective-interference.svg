<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Selective interference between channels</title>
  <desc>A two-by-two grid. Rows are primary tasks: holding words in mind, and holding a shape or route in mind. Columns are secondary tasks: speaking or hearing speech, and tapping or pointing in space. Interference is high where the channels match (words with speech; shape with tapping) and low where they differ.</desc>
  <defs>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Interference is greatest within a channel</text>

  <text x="470" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Secondary task</text>
  <text x="470" y="118" text-anchor="middle" font-size="16" fill="#111111">Speaking or hearing speech</text>
  <text x="760" y="118" text-anchor="middle" font-size="16" fill="#111111">Tapping or pointing in space</text>
  <text x="120" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Primary task</text>

  <rect x="320" y="135" width="300" height="160" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="620" y="135" width="290" height="160" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="320" y="295" width="300" height="160" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="620" y="295" width="290" height="160" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>

  <g font-size="16" fill="#111111" text-anchor="middle">
    <rect x="345" y="180" width="250" height="70" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
    <text x="470" y="208" font-weight="bold">HIGH interference</text>
    <text x="470" y="234">both use the verbal channel</text>
    <rect x="640" y="180" width="250" height="70" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/>
    <text x="765" y="208" font-weight="bold">LOW interference</text>
    <text x="765" y="234">different channels</text>
    <rect x="345" y="340" width="250" height="70" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/>
    <text x="470" y="368" font-weight="bold">LOW interference</text>
    <text x="470" y="394">different channels</text>
    <rect x="640" y="340" width="250" height="70" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
    <text x="765" y="368" font-weight="bold">HIGH interference</text>
    <text x="765" y="394">both use the spatial channel</text>
  </g>

  <rect x="40" y="135" width="270" height="160" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="175" y="200" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Holding words</text>
  <text x="175" y="226" text-anchor="middle" font-size="15" fill="#111111">a sentence, a list,</text>
  <text x="175" y="246" text-anchor="middle" font-size="15" fill="#111111">a reference number</text>
  <rect x="40" y="295" width="270" height="160" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="175" y="360" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Holding a shape</text>
  <text x="175" y="386" text-anchor="middle" font-size="15" fill="#111111">a drawn figure, a route,</text>
  <text x="175" y="406" text-anchor="middle" font-size="15" fill="#111111">a floor layout</text>

  <text x="480" y="500" text-anchor="middle" font-size="15" fill="#111111">Pattern reported by Brooks (1968) and many later dual-task studies.</text>
  <text x="480" y="530" text-anchor="middle" font-size="13" fill="#333333">Schematic summary; demanding central thinking still interferes across channels.</text>
</svg>
