<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Channel load in four study arrangements</title>
  <desc>Paired horizontal bars show visual and verbal channel load for four arrangements. Text plus a podcast overloads the verbal channel. A diagram with dense text loads both, with heavy visual search. A diagram with spoken explanation balances the load. A diagram drawn from memory and explained aloud uses both channels productively.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Where the load falls</text>

  <line x1="660" y1="70" x2="660" y2="500" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="600" y="62" width="120" height="22" fill="#FFFFFF"/>
  <text x="660" y="79" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">capacity limit</text>

  <g font-size="15" fill="#111111">
    <text x="40" y="128" font-weight="bold">Text with a podcast on</text>
    <text x="40" y="232" font-weight="bold">Diagram with dense text</text>
    <text x="40" y="336" font-weight="bold">Diagram with spoken</text>
    <text x="40" y="356" font-weight="bold">explanation</text>
    <text x="40" y="440" font-weight="bold">Diagram drawn from</text>
    <text x="40" y="460" font-weight="bold">memory, explained aloud</text>
  </g>

  <g font-size="14" fill="#111111" text-anchor="end">
    <text x="300" y="112">visual</text><text x="300" y="146">verbal</text>
    <text x="300" y="216">visual</text><text x="300" y="250">verbal</text>
    <text x="300" y="320">visual</text><text x="300" y="354">verbal</text>
    <text x="300" y="424">visual</text><text x="300" y="458">verbal</text>
  </g>

  <rect x="310" y="98" width="140" height="22" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/>
  <rect x="310" y="132" width="420" height="22" fill="url(#dots)" stroke="#7A5200" stroke-width="1.5"/>
  <text x="740" y="149" font-size="14" fill="#111111">overloaded: two speech streams</text>

  <rect x="310" y="202" width="380" height="22" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/>
  <text x="700" y="219" font-size="14" fill="#111111">eyes split, visual search</text>
  <rect x="310" y="236" width="320" height="22" fill="url(#dots)" stroke="#7A5200" stroke-width="1.5"/>

  <rect x="310" y="306" width="230" height="22" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/>
  <rect x="310" y="340" width="230" height="22" fill="url(#dots)" stroke="#7A5200" stroke-width="1.5"/>
  <text x="680" y="337" font-size="14" fill="#111111">balanced, within limits</text>

  <rect x="310" y="410" width="300" height="22" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/>
  <rect x="310" y="444" width="300" height="22" fill="url(#dots)" stroke="#7A5200" stroke-width="1.5"/>
  <text x="680" y="441" font-size="14" fill="#111111">high but productive effort</text>

  <rect x="310" y="520" width="28" height="18" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/>
  <text x="346" y="534" font-size="14" fill="#111111">visual channel load</text>
  <rect x="520" y="520" width="28" height="18" fill="url(#dots)" stroke="#7A5200" stroke-width="1.5"/>
  <text x="556" y="534" font-size="14" fill="#111111">verbal channel load</text>
  <text x="480" y="580" text-anchor="middle" font-size="13" fill="#333333">Schematic comparison based on working-memory research; bar lengths are illustrative, not measured.</text>
</svg>
