<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Search in text versus a diagram</title>
  <desc>Left: a list of sentences about a small office network, where facts about the router are scattered across lines 1, 4 and 6 and must be searched for. Right: the same facts as a diagram, where everything connected to the router sits next to it and can be read off at a glance.</desc>
  <defs>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Same information, different effort</text>
  <text x="240" y="78" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Sentential form</text>
  <text x="720" y="78" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Diagrammatic form</text>

  <rect x="30" y="95" width="420" height="330" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <g font-size="15" fill="#111111">
    <rect x="42" y="108" width="396" height="30" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="6 3"/>
    <text x="52" y="128">1. The router connects to the firewall.</text>
    <text x="52" y="168">2. The printer connects to the switch.</text>
    <text x="52" y="208">3. Laptop A connects to the switch.</text>
    <rect x="42" y="228" width="396" height="30" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="6 3"/>
    <text x="52" y="248">4. The switch connects to the router.</text>
    <text x="52" y="288">5. Laptop B connects to the switch.</text>
    <rect x="42" y="308" width="396" height="30" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="6 3"/>
    <text x="52" y="328">6. The Wi-Fi point connects to the router.</text>
    <text x="52" y="368">7. The firewall connects to the internet.</text>
  </g>
  <text x="240" y="460" text-anchor="middle" font-size="15" fill="#111111">"What links to the router?"</text>
  <text x="240" y="482" text-anchor="middle" font-size="15" fill="#111111">scan all lines; hold lines 1, 4, 6 in mind</text>

  <rect x="500" y="95" width="430" height="330" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <g font-size="15" fill="#111111" text-anchor="middle">
    <rect x="650" y="110" width="130" height="36" fill="#FFFFFF" stroke="#222222" stroke-width="2"/><text x="715" y="133">Internet</text>
    <rect x="650" y="170" width="130" height="36" fill="#FFFFFF" stroke="#222222" stroke-width="2"/><text x="715" y="193">Firewall</text>
    <rect x="640" y="234" width="150" height="40" fill="#1F3B5C" stroke="#000000" stroke-width="3"/><text x="715" y="260" fill="#FFFFFF" font-weight="bold">Router</text>
    <rect x="540" y="300" width="130" height="36" fill="#FFFFFF" stroke="#222222" stroke-width="2"/><text x="605" y="323">Switch</text>
    <rect x="770" y="300" width="130" height="36" fill="#FFFFFF" stroke="#222222" stroke-width="2"/><text x="835" y="323">Wi-Fi point</text>
    <rect x="515" y="370" width="100" height="36" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><text x="565" y="393">Laptop A</text>
    <rect x="625" y="370" width="100" height="36" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><text x="675" y="393">Laptop B</text>
    <rect x="735" y="370" width="90" height="36" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/><text x="780" y="393">Printer</text>
  </g>
  <g stroke="#222222" stroke-width="2">
    <line x1="715" y1="146" x2="715" y2="170"/>
    <line x1="715" y1="206" x2="715" y2="234"/>
    <line x1="680" y1="274" x2="620" y2="300"/>
    <line x1="750" y1="274" x2="820" y2="300"/>
    <line x1="590" y1="336" x2="565" y2="370"/>
    <line x1="620" y1="336" x2="670" y2="370"/>
    <line x1="650" y1="336" x2="770" y2="370"/>
  </g>
  <text x="715" y="460" text-anchor="middle" font-size="15" fill="#111111">"What links to the router?"</text>
  <text x="715" y="482" text-anchor="middle" font-size="15" fill="#111111">look next to the router; read it off</text>

  <text x="480" y="525" text-anchor="middle" font-size="15" fill="#111111">Related facts are stored together, so search, recognition and inference become perceptual.</text>
  <text x="480" y="560" text-anchor="middle" font-size="13" fill="#333333">Illustration of the argument of Larkin and Simon (1987) with an invented example.</text>
</svg>
