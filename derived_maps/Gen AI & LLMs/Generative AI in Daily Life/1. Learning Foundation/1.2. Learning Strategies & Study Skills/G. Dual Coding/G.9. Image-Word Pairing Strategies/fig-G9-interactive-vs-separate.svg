<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Separate versus interactive images</title>
  <desc>Left panel: a simple dog and a simple hat drawn apart, labelled separate images, weak link. Right panel: the same dog wearing the hat, labelled interactive image, strong link. Below, a schematic bar comparison shows cued recall lowest for rote repetition and separate images and highest for interactive images.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <g id="dog">
      <ellipse cx="0" cy="0" rx="55" ry="28" fill="#FFFFFF" stroke="#222222" stroke-width="2.5"/>
      <circle cx="58" cy="-22" r="22" fill="#FFFFFF" stroke="#222222" stroke-width="2.5"/>
      <path d="M48 -40 l-6 -20 l14 12z" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
      <circle cx="66" cy="-26" r="3" fill="#222222"/>
      <path d="M-35 25 v28 M-15 25 v28 M20 25 v28 M40 25 v28 M-55 -5 l-22 -18" stroke="#222222" stroke-width="3" fill="none"/>
    </g>
    <g id="hat">
      <rect x="-28" y="-40" width="56" height="40" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
      <rect x="-45" y="0" width="90" height="10" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
    </g>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Bind the items into one scene</text>

  <rect x="40" y="60" width="420" height="230" fill="#FFFFFF" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <use href="#dog" x="150" y="190"/>
  <use href="#hat" x="370" y="190"/>
  <text x="250" y="88" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Separate images</text>
  <text x="250" y="275" text-anchor="middle" font-size="15" fill="#111111">a dog ... and a hat: weak link</text>

  <rect x="500" y="60" width="420" height="230" fill="#FFFFFF" stroke="#1E5E24" stroke-width="3"/>
  <use href="#dog" x="660" y="200"/>
  <use href="#hat" x="718" y="150" transform="rotate(-10 718 150)"/>
  <text x="710" y="88" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Interactive image</text>
  <text x="710" y="275" text-anchor="middle" font-size="15" fill="#111111">a dog wearing a hat: strong link</text>

  <line x1="200" y1="470" x2="760" y2="470" stroke="#222222" stroke-width="2"/>
  <rect x="230" y="420" width="140" height="50" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="410" y="410" width="140" height="60" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="590" y="330" width="140" height="140" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="300" y="490">rote repetition</text><text x="480" y="490">separate images</text><text x="660" y="490">interactive images</text>
  </g>
  <text x="120" y="400" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Cued recall</text>
  <text x="480" y="512" text-anchor="middle" font-size="13" fill="#333333">Schematic of the pattern reported by Bower (1970); bar heights are illustrative.</text>
</svg>
