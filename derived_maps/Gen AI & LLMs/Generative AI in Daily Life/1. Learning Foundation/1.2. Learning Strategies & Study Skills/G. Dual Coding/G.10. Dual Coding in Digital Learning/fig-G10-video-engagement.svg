<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Engagement and video length</title>
  <desc>Schematic: minutes actually watched rise with video length up to about six minutes, then level off, so longer videos are increasingly abandoned. A dotted diagonal shows what full viewing would look like.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Watching levels off at around six minutes</text>
  <line x1="120" y1="430" x2="880" y2="430" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="430" x2="120" y2="80" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="500" y="470" text-anchor="middle" font-size="16" fill="#111111">Video length (minutes)</text>
  <text x="70" y="255" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 70 255)">Minutes actually watched</text>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="120" y="450">0</text><text x="240" y="450">3</text><text x="360" y="450">6</text><text x="480" y="450">9</text><text x="600" y="450">12</text><text x="720" y="450">15</text><text x="840" y="450">18</text>
  </g>
  <line x1="120" y1="430" x2="460" y2="90" stroke="#666666" stroke-width="2" stroke-dasharray="2 4"/>
  <rect x="380" y="96" width="170" height="24" fill="#FFFFFF"/>
  <text x="465" y="113" text-anchor="middle" font-size="14" fill="#111111">if every minute were watched</text>
  <path d="M120 430 C 220 332, 300 250, 360 205 C 420 188, 600 186, 840 192" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <rect x="560" y="150" width="250" height="26" fill="#FFFFFF"/>
  <text x="685" y="168" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">typical viewing: levels off</text>
  <line x1="360" y1="205" x2="360" y2="430" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="300" y="380" width="120" height="24" fill="#FFFFFF"/>
  <text x="360" y="397" text-anchor="middle" font-size="14" fill="#111111">about 6 min</text>
  <rect x="560" y="300" width="300" height="66" fill="#FFFFFF" stroke="#1E5E24" stroke-width="3"/>
  <text x="710" y="327" text-anchor="middle" font-size="15" fill="#111111">Design implication: short,</text>
  <text x="710" y="350" text-anchor="middle" font-size="15" fill="#111111">learner-paced segments</text>
  <text x="480" y="505" text-anchor="middle" font-size="13" fill="#333333">Schematic of the pattern reported by Guo, Kim and Rubin (2014); not plotted from their data.</text>
</svg>
