<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Strength of evidence for claims about dual coding</title>
  <desc>Three columns. Well established: picture superiority, concreteness effect, interactive imagery, multimedia effect, no benefit from decoration, drawing effect. Qualified: drawing complex content, animation, infographics versus text, imagery for text, keyword method durability. Contested: why pictures are remembered better, scale-up beyond the laboratory, AI-generated visuals.</desc>
  <defs>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">How secure is each claim?</text>

  <rect x="30" y="60" width="290" height="440" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="335" y="60" width="290" height="440" fill="url(#dots)" stroke="#7A5200" stroke-width="2.5" stroke-dasharray="8 4"/>
  <rect x="640" y="60" width="290" height="440" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>

  <g fill="#FFFFFF" stroke="#222222" stroke-width="1">
    <rect x="45" y="75" width="260" height="40"/><rect x="350" y="75" width="260" height="40"/><rect x="655" y="75" width="260" height="40"/>
  </g>
  <g font-size="18" font-weight="bold" fill="#111111" text-anchor="middle">
    <text x="175" y="102">WELL ESTABLISHED</text><text x="480" y="102">QUALIFIED</text><text x="785" y="102">CONTESTED</text>
  </g>

  <g fill="#FFFFFF" stroke="#1E5E24" stroke-width="1.5">
    <rect x="45" y="130" width="260" height="50"/><rect x="45" y="190" width="260" height="50"/><rect x="45" y="250" width="260" height="50"/>
    <rect x="45" y="310" width="260" height="50"/><rect x="45" y="370" width="260" height="50"/><rect x="45" y="430" width="260" height="50"/>
  </g>
  <g font-size="15" fill="#111111" text-anchor="middle">
    <text x="175" y="160">picture superiority</text>
    <text x="175" y="220">concreteness effect</text>
    <text x="175" y="280">interactive imagery for pairs</text>
    <text x="175" y="340">multimedia effect (transfer)</text>
    <text x="175" y="400">decoration does not help</text>
    <text x="175" y="460">drawing effect for words</text>
  </g>

  <g fill="#FFFFFF" stroke="#7A5200" stroke-width="1.5">
    <rect x="350" y="130" width="260" height="50"/><rect x="350" y="190" width="260" height="50"/><rect x="350" y="250" width="260" height="50"/>
    <rect x="350" y="310" width="260" height="50"/><rect x="350" y="370" width="260" height="50"/>
  </g>
  <g font-size="15" fill="#111111" text-anchor="middle">
    <text x="480" y="152">drawing complex content</text><text x="480" y="171">(needs knowledge, support)</text>
    <text x="480" y="212">animation versus</text><text x="480" y="231">static frames</text>
    <text x="480" y="280">infographics versus good text</text>
    <text x="480" y="340">imagery instructions for text</text>
    <text x="480" y="392">keyword method:</text><text x="480" y="411">durability, production</text>
  </g>

  <g fill="#FFFFFF" stroke="#8B0000" stroke-width="1.5">
    <rect x="655" y="130" width="260" height="50"/><rect x="655" y="190" width="260" height="50"/><rect x="655" y="250" width="260" height="50"/>
  </g>
  <g font-size="15" fill="#111111" text-anchor="middle">
    <text x="785" y="152">why pictures are remembered:</text><text x="785" y="171">two codes or distinctiveness</text>
    <text x="785" y="212">size of effects outside</text><text x="785" y="231">the laboratory</text>
    <text x="785" y="272">AI-generated versus</text><text x="785" y="291">learner-made visuals</text>
  </g>
  <text x="480" y="535" text-anchor="middle" font-size="13" fill="#333333">Summary judgement based on reviews and meta-analyses; placement is schematic.</text>
</svg>
