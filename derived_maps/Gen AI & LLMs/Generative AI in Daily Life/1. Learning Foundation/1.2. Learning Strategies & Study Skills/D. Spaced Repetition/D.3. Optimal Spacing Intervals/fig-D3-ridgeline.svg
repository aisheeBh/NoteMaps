<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Final recall as a function of gap for four test delays</title>
  <desc>For each test delay, recall first rises as the gap between study sessions lengthens and then slowly falls. The best gap moves to the right as the test delay grows, and overall recall is lower for longer test delays. Beyond the best gap recall declines only gently, while gaps that are too short cost much more.</desc>
