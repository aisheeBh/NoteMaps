<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Uniform, expanding and contracting review schedules</title>
  <desc>Three timelines over 60 days with four reviews each. The uniform schedule reviews every 12 days. The expanding schedule reviews at days 1, 5, 18 and 45. The contracting schedule reviews at days 15, 33, 45 and 52. All end with a test at day 60.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">Three shapes of schedule over the same 60 days</text>
  <text x="140" y="135" text-anchor="end" font-size="17" fill="#111111" font-weight="bold">Uniform</text>
  <line x1="160" y1="130" x2="850" y2="130" stroke="#222222" stroke-width="2.5"/>
  <rect x="152" y="122" width="16" height="16" fill="#111111"/>
  <circle cx="298" cy="130" r="9" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <text x="298" y="112" text-anchor="middle" font-size="14" fill="#111111">day 12</text>
  <circle cx="436" cy="130" r="9" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <text x="436" y="112" text-anchor="middle" font-size="14" fill="#111111">day 24</text>
  <circle cx="574" cy="130" r="9" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <text x="574" y="112" text-anchor="middle" font-size="14" fill="#111111">day 36</text>
  <circle cx="712" cy="130" r="9" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <text x="712" y="112" text-anchor="middle" font-size="14" fill="#111111">day 48</text>
  <path d="M840 118 L860 118 L850 138 Z" fill="#8B0000"/>
  <text x="850" y="160" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">test</text>
  <text x="140" y="255" text-anchor="end" font-size="17" fill="#111111" font-weight="bold">Expanding</text>
  <line x1="160" y1="250" x2="850" y2="250" stroke="#222222" stroke-width="2.5"/>
  <rect x="152" y="242" width="16" height="16" fill="#111111"/>
  <circle cx="172" cy="250" r="9" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <text x="172" y="232" text-anchor="middle" font-size="14" fill="#111111">day 1</text>
  <circle cx="218" cy="250" r="9" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <text x="218" y="232" text-anchor="middle" font-size="14" fill="#111111">day 5</text>
  <circle cx="367" cy="250" r="9" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <text x="367" y="232" text-anchor="middle" font-size="14" fill="#111111">day 18</text>
  <circle cx="678" cy="250" r="9" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <text x="678" y="232" text-anchor="middle" font-size="14" fill="#111111">day 45</text>
  <path d="M840 238 L860 238 L850 258 Z" fill="#8B0000"/>
  <text x="850" y="280" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">test</text>
  <text x="140" y="375" text-anchor="end" font-size="17" fill="#111111" font-weight="bold">Contracting</text>
  <line x1="160" y1="370" x2="850" y2="370" stroke="#222222" stroke-width="2.5"/>
  <rect x="152" y="362" width="16" height="16" fill="#111111"/>
  <circle cx="332" cy="370" r="9" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <text x="332" y="352" text-anchor="middle" font-size="14" fill="#111111">day 15</text>
  <circle cx="540" cy="370" r="9" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <text x="540" y="352" text-anchor="middle" font-size="14" fill="#111111">day 33</text>
  <circle cx="678" cy="370" r="9" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <text x="678" y="352" text-anchor="middle" font-size="14" fill="#111111">day 45</text>
  <circle cx="758" cy="370" r="9" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <text x="758" y="352" text-anchor="middle" font-size="14" fill="#111111">day 52</text>
  <path d="M840 358 L860 358 L850 378 Z" fill="#8B0000"/>
  <text x="850" y="400" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">test</text>
  <rect x="152" y="460" width="16" height="16" fill="#111111"/>
  <text x="176" y="474" text-anchor="start" font-size="14" fill="#111111">first study</text>
  <circle cx="356" cy="468" r="9" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <text x="372" y="474" text-anchor="start" font-size="14" fill="#111111">review</text>
  <path d="M495 458 L515 458 L505 478 Z" fill="#8B0000"/>
  <text x="521" y="474" text-anchor="start" font-size="14" fill="#111111">final test</text>
  <text x="480" y="520" text-anchor="middle" font-size="13" fill="#333333">Illustrative schedules; the review days are examples, not recommendations from a single study.</text>
</svg>
