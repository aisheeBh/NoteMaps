<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Code cards for a programmer</title>
  <desc>Three code cards: predict the output of a short snippet about mutable default arguments; name the cause of an error message; and choose the right data structure for a described need.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="34" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">Code cards: predict, diagnose, choose</text>
  <text x="170" y="68" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Predict the output</text>
  <rect x="20" y="80" width="300" height="290" rx="8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
  <rect x="30" y="90" width="280" height="270" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="46" y="120" font-family="Courier New, monospace" font-size="14" fill="#111111" xml:space="preserve">def add(x, items=[]):</text>
  <text x="46" y="142" font-family="Courier New, monospace" font-size="14" fill="#111111" xml:space="preserve">    items.append(x)</text>
  <text x="46" y="164" font-family="Courier New, monospace" font-size="14" fill="#111111" xml:space="preserve">    return items</text>
  <text x="46" y="186" font-family="Courier New, monospace" font-size="14" fill="#111111" xml:space="preserve">add(1)</text>
  <text x="46" y="208" font-family="Courier New, monospace" font-size="14" fill="#111111" xml:space="preserve">print(add(2))</text>
  <line x1="44" y1="300" x2="296" y2="300" stroke="#999999" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="170" y="326" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">[1, 2]</text>
  <text x="170" y="346" text-anchor="middle" font-size="14" fill="#111111">default list is shared</text>
  <text x="480" y="68" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Diagnose</text>
  <rect x="330" y="80" width="300" height="290" rx="8" fill="url(#dots)" stroke="#7A5200" stroke-width="2.5" stroke-dasharray="8 4"/>
  <rect x="340" y="90" width="280" height="270" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="480" y="120" text-anchor="middle" font-size="14" fill="#111111">KeyError: 'region'</text>
  <text x="480" y="142" text-anchor="middle" font-size="14" fill="#111111">raised in a loop over</text>
  <text x="480" y="164" text-anchor="middle" font-size="14" fill="#111111">a list of dictionaries.</text>
  <text x="480" y="186" text-anchor="middle" font-size="14" fill="#111111">Most likely cause?</text>
  <line x1="354" y1="300" x2="606" y2="300" stroke="#999999" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="480" y="326" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">a record lacks the key;</text>
  <text x="480" y="346" text-anchor="middle" font-size="14" fill="#111111">use .get or check first</text>
  <text x="790" y="68" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Choose</text>
  <rect x="640" y="80" width="300" height="290" rx="8" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="650" y="90" width="280" height="270" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/>
  <text x="790" y="120" text-anchor="middle" font-size="14" fill="#111111">Need: fast membership</text>
  <text x="790" y="142" text-anchor="middle" font-size="14" fill="#111111">tests on millions of</text>
  <text x="790" y="164" text-anchor="middle" font-size="14" fill="#111111">IDs, order irrelevant.</text>
  <text x="790" y="186" text-anchor="middle" font-size="14" fill="#111111">Which structure?</text>
  <line x1="664" y1="300" x2="916" y2="300" stroke="#999999" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="790" y="326" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">a set (hash-based)</text>
  <text x="790" y="346" text-anchor="middle" font-size="14" fill="#111111">average constant-time lookup</text>
  <text x="480" y="420" text-anchor="middle" font-size="16" fill="#111111">Cards test understanding of behaviour, not memorised syntax alone.</text>
  <text x="480" y="520" text-anchor="middle" font-size="13" fill="#333333">Illustrative Python examples.</text>
</svg>
