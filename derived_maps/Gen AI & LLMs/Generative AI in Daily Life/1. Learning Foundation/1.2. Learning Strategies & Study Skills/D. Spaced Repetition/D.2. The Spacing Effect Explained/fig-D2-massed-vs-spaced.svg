<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Massed and spaced study at two tests</title>
  <desc>At an immediate test, massed study scores slightly higher than spaced study. At a test one week later, spaced study scores far higher than massed study, which has fallen sharply.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="24" fill="#111111" font-weight="bold">The spacing effect appears at a delay</text>
  <line x1="120" y1="430" x2="860" y2="430" stroke="#222222" stroke-width="2.5"/>
  <line x1="120" y1="430" x2="120" y2="80" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="60" y="255" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 60 255)">Proportion recalled (%)</text>
  <line x1="114" y1="430" x2="120" y2="430" stroke="#222222" stroke-width="1.5"/>
  <text x="108" y="435" text-anchor="end" font-size="14" fill="#111111">0</text>
  <line x1="114" y1="350" x2="120" y2="350" stroke="#222222" stroke-width="1.5"/>
  <text x="108" y="355" text-anchor="end" font-size="14" fill="#111111">25</text>
  <line x1="120" y1="350" x2="860" y2="350" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="114" y1="270" x2="120" y2="270" stroke="#222222" stroke-width="1.5"/>
  <text x="108" y="275" text-anchor="end" font-size="14" fill="#111111">50</text>
  <line x1="120" y1="270" x2="860" y2="270" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="114" y1="190" x2="120" y2="190" stroke="#222222" stroke-width="1.5"/>
  <text x="108" y="195" text-anchor="end" font-size="14" fill="#111111">75</text>
  <line x1="120" y1="190" x2="860" y2="190" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="114" y1="110" x2="120" y2="110" stroke="#222222" stroke-width="1.5"/>
  <text x="108" y="115" text-anchor="end" font-size="14" fill="#111111">100</text>
  <line x1="120" y1="110" x2="860" y2="110" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <rect x="190" y="180" width="110" height="250" rx="0" fill="url(#dots)" stroke="#7A5200" stroke-width="2.5" stroke-dasharray="8 4"/>
  <text x="245" y="170" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">massed 78</text>
  <rect x="330" y="200" width="110" height="230" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
  <text x="385" y="190" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">spaced 72</text>
  <text x="315" y="458" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Immediate test</text>
  <rect x="630" y="334" width="110" height="96" rx="0" fill="url(#dots)" stroke="#7A5200" stroke-width="2.5" stroke-dasharray="8 4"/>
  <text x="685" y="324" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">massed 30</text>
  <rect x="770" y="244" width="110" height="186" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
  <text x="825" y="234" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">spaced 58</text>
  <text x="755" y="458" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Test one week later</text>
  <rect x="640" y="90" width="210" height="76" rx="0" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <rect x="655" y="104" width="26" height="18" rx="0" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="692" y="119" text-anchor="start" font-size="14" fill="#111111">massed: one session</text>
  <rect x="655" y="136" width="26" height="18" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="692" y="151" text-anchor="start" font-size="14" fill="#111111">spaced: two sessions</text>
  <text x="480" y="520" text-anchor="middle" font-size="13" fill="#333333">Schematic; values illustrate the typical pattern and are not taken from a single study.</text>
</svg>
