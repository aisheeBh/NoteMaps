<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Gain from a review depends on how hard recall has become</title>
  <desc>The gain in long-term storage from a review is small when the memory is still easy to retrieve, rises as retrieval becomes harder, and collapses to near zero when the memory can no longer be retrieved at all, unless feedback restores it.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" fill="#111111" font-weight="bold">Harder (but successful) recall produces bigger gains</text>
  <line x1="150" y1="420" x2="870" y2="420" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="150" y1="420" x2="150" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="186" y1="420" x2="186" y2="426" stroke="#222222" stroke-width="1.5"/>
  <text x="186" y="444" text-anchor="middle" font-size="14" fill="#111111">very easy</text>
  <line x1="505" y1="420" x2="505" y2="426" stroke="#222222" stroke-width="1.5"/>
  <text x="505" y="444" text-anchor="middle" font-size="14" fill="#111111">effortful</text>
  <line x1="824" y1="420" x2="824" y2="426" stroke="#222222" stroke-width="1.5"/>
  <text x="824" y="444" text-anchor="middle" font-size="14" fill="#111111">impossible</text>
  <text x="505" y="472" text-anchor="middle" font-size="16" fill="#111111">Difficulty of recall at the moment of review (time since last review)</text>
  <text x="88" y="250" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 88 250)">Gain in storage strength</text>
