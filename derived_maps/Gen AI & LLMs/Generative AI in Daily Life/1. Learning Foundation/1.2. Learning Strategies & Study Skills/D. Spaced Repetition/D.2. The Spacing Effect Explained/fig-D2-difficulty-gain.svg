  <rect x="199" y="302" width="158" height="24" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="278" y="318" text-anchor="middle" font-size="14" fill="#111111">massed: little gain</text>
  <rect x="486" y="74" width="151" height="24" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="562" y="90" text-anchor="middle" font-size="14" fill="#111111">spaced: large gain</text>
  <rect x="698" y="217" width="181" height="24" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
  <text x="789" y="233" text-anchor="middle" font-size="14" fill="#111111">too late: recall fails</text>
  <text x="480" y="520" text-anchor="middle" font-size="13" fill="#333333">Schematic of the new theory of disuse (Bjork and Bjork, 1992) and the study-phase retrieval account.</text>
</svg>
