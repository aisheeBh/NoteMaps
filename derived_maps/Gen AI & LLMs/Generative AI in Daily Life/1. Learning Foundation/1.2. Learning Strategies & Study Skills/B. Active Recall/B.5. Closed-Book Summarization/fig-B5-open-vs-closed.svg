<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Open-book and closed-book summaries</title>
  <desc>Two flows. Open-book: text feeds directly into the summary, with memory bypassed; the main work is selecting and paraphrasing. Closed-book: text is read, then closed; the summary is built from memory through retrieval, selection and organisation, then checked against the text.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Where the summary comes from</text>
  <text x="40" y="92" font-size="18" font-weight="bold" fill="#111111">OPEN-BOOK</text>
  <rect x="40" y="110" width="180" height="90" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="130.0" y="150.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">TEXT</text>
  <text x="130.0" y="170.2" text-anchor="middle" font-size="15" fill="#000000">open on the desk</text>
  <rect x="330" y="110" width="180" height="90" rx="6" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="420.0" y="150.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#222222">Memory</text>
  <text x="420.0" y="170.2" text-anchor="middle" font-size="15" fill="#222222">barely used</text>
  <rect x="620" y="110" width="300" height="90" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="770.0" y="140.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">SUMMARY</text>
  <text x="770.0" y="160.2" text-anchor="middle" font-size="15" fill="#111111">selected and paraphrased</text>
  <text x="770.0" y="180.2" text-anchor="middle" font-size="15" fill="#111111">from the page</text>
  <path d="M220 140 C 330 52, 510 52, 616 140" fill="none" stroke="#222222" stroke-width="3.5" marker-end="url(#arrow)"/>
  <rect x="296.8" y="219" width="246.4" height="44" fill="#FFFFFF" stroke="#666666" stroke-width="1"/>
  <text x="420" y="236" text-anchor="middle" font-size="14" fill="#111111">information flows page to page;</text>
  <text x="420" y="254" text-anchor="middle" font-size="14" fill="#111111">copying is easy</text>
  <text x="40" y="302" font-size="18" font-weight="bold" fill="#111111">CLOSED-BOOK</text>
  <rect x="40" y="320" width="180" height="90" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="130.0" y="360.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">TEXT</text>
  <text x="130.0" y="380.2" text-anchor="middle" font-size="15" fill="#000000">read, then closed</text>
  <rect x="330" y="320" width="180" height="90" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="420.0" y="350.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">MEMORY</text>
  <text x="420.0" y="370.2" text-anchor="middle" font-size="15" fill="#FFFFFF">retrieve, select,</text>
  <text x="420.0" y="390.2" text-anchor="middle" font-size="15" fill="#FFFFFF">organise</text>
  <rect x="620" y="320" width="300" height="90" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="770.0" y="350.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">SUMMARY</text>
  <text x="770.0" y="370.2" text-anchor="middle" font-size="15" fill="#000000">rebuilt from memory</text>
  <text x="770.0" y="390.2" text-anchor="middle" font-size="15" fill="#000000">in own words</text>
  <line x1="220" y1="365" x2="326" y2="365" stroke="#222222" stroke-width="3.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="365" x2="616" y2="365" stroke="#222222" stroke-width="3.5" marker-end="url(#arrow)"/>
  <path d="M770 410 C 770 480, 130 480, 130 414" fill="none" stroke="#222222" stroke-width="2.5" stroke-dasharray="10 6" marker-end="url(#arrow)"/>
  <rect x="266.3" y="483" width="367.3" height="26" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="450" y="500" text-anchor="middle" font-size="14" fill="#111111">then check against the text and repair the gaps</text>
</svg>
