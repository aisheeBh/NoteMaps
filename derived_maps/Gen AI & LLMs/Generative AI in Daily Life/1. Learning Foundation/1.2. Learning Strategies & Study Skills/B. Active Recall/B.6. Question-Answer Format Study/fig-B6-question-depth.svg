<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Question types from shallow to deep</title>
  <desc>Stacked bands from bottom to top: recall of fact, definition, explanation, comparison, application, analysis and prediction, evaluation; each with a sample stem. An arrow on the left indicates increasing depth.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">From shallow to deep questions</text>
  <rect x="160.0" y="458" width="760" height="54" rx="6" fill="#E6E6E6" stroke="#666666" stroke-width="2" stroke-dasharray="2 4"/>
  <text x="540.0" y="481" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">RECALL OF FACT</text>
  <text x="540.0" y="501" text-anchor="middle" font-size="14" fill="#111111">What is ...? When ...? Who ...?</text>
  <rect x="185.0" y="396" width="710" height="54" rx="6" fill="#E6E6E6" stroke="#666666" stroke-width="2" stroke-dasharray="2 4"/>
  <text x="540.0" y="419" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">DEFINITION</text>
  <text x="540.0" y="439" text-anchor="middle" font-size="14" fill="#111111">Define ... in one sentence.</text>
  <rect x="210.0" y="334" width="660" height="54" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="540.0" y="357" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">EXPLANATION</text>
  <text x="540.0" y="377" text-anchor="middle" font-size="14" fill="#111111">Why does ...? How does ... work?</text>
  <rect x="235.0" y="272" width="610" height="54" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="540.0" y="295" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">COMPARISON</text>
  <text x="540.0" y="315" text-anchor="middle" font-size="14" fill="#111111">How does ... differ from ...?</text>
  <rect x="260.0" y="210" width="560" height="54" rx="6" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="540.0" y="233" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">APPLICATION</text>
  <text x="540.0" y="253" text-anchor="middle" font-size="14" fill="#111111">Given this case, what would you do?</text>
  <rect x="285.0" y="148" width="510" height="54" rx="6" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="540.0" y="171" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">ANALYSIS AND PREDICTION</text>
  <text x="540.0" y="191" text-anchor="middle" font-size="14" fill="#111111">Which factor matters most? What if ...?</text>
  <rect x="310.0" y="86" width="460" height="54" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="2"/>
  <text x="540.0" y="109" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">EVALUATION</text>
  <text x="540.0" y="129" text-anchor="middle" font-size="14" fill="#111111">Is ... justified? Defend a judgement.</text>
  <line x1="70" y1="510" x2="70" y2="90" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="55" y="300" text-anchor="middle" font-size="15" fill="#111111" transform="rotate(-90 55 300)">Deeper: reasons, relations, transfer</text>
  <text x="480.0" y="585" text-anchor="middle" font-size="13" fill="#333333">Learners left to themselves mostly write the lowest two kinds.</text>
</svg>
