<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>A Cornell page used for recall</title>
  <desc>A page divided into a narrow left cue column holding questions, a wide right note column holding lecture notes, and a summary strip at the bottom. A card covers the note column while the learner answers the cue questions.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Cover the notes, answer the cues</text>
  <rect x="60" y="70" width="840" height="470" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <line x1="300" y1="70" x2="300" y2="450" stroke="#222222" stroke-width="2"/>
  <line x1="60" y1="450" x2="900" y2="450" stroke="#222222" stroke-width="2"/>
  <text x="180" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">CUE COLUMN</text>
  <text x="180" y="116" text-anchor="middle" font-size="13" fill="#111111">questions, written after</text>
  <text x="600" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">NOTE COLUMN</text>
  <text x="600" y="116" text-anchor="middle" font-size="13" fill="#111111">notes taken during the session</text>
  <text x="80" y="160" font-size="15" fill="#111111">Why does inflation help</text>
  <text x="80" y="184" font-size="15" fill="#111111">fixed-rate borrowers?</text>
  <text x="80" y="208" font-size="15" fill="#111111"></text>
  <text x="80" y="232" font-size="15" fill="#111111">What is the Fisher</text>
  <text x="80" y="256" font-size="15" fill="#111111">relation?</text>
  <text x="80" y="280" font-size="15" fill="#111111"></text>
  <text x="80" y="304" font-size="15" fill="#111111">When can rate rises</text>
  <text x="80" y="328" font-size="15" fill="#111111">fail to cut inflation?</text>
  <line x1="330" y1="160" x2="860" y2="160" stroke="#999999" stroke-width="1"/>
  <line x1="330" y1="190" x2="860" y2="190" stroke="#999999" stroke-width="1"/>
  <line x1="330" y1="220" x2="860" y2="220" stroke="#999999" stroke-width="1"/>
  <line x1="330" y1="250" x2="860" y2="250" stroke="#999999" stroke-width="1"/>
  <line x1="330" y1="280" x2="860" y2="280" stroke="#999999" stroke-width="1"/>
  <line x1="330" y1="310" x2="860" y2="310" stroke="#999999" stroke-width="1"/>
  <line x1="330" y1="340" x2="860" y2="340" stroke="#999999" stroke-width="1"/>
  <line x1="330" y1="370" x2="860" y2="370" stroke="#999999" stroke-width="1"/>
  <line x1="330" y1="400" x2="860" y2="400" stroke="#999999" stroke-width="1"/>
  <rect x="320" y="140" width="560" height="290" rx="4" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="448.2" y="272" width="303.6" height="67" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="600" y="290" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">COVERING CARD</text>
  <text x="600" y="310" text-anchor="middle" font-size="15" fill="#111111">answer each cue aloud or in writing,</text>
  <text x="600" y="330" text-anchor="middle" font-size="15" fill="#111111">then slide the card away and check</text>
  <text x="80" y="478" font-size="15" font-weight="bold" fill="#111111">SUMMARY</text>
  <text x="80" y="502" font-size="14" fill="#111111">Inflation redistributes from lenders to fixed-rate borrowers; real rates = nominal - expected</text>
  <text x="80" y="522" font-size="14" fill="#111111">inflation; supply shocks can blunt monetary policy.</text>
  <text x="480.0" y="580" text-anchor="middle" font-size="13" fill="#333333">Layout after Walter Pauk's Cornell system; content invented for illustration.</text>
</svg>
