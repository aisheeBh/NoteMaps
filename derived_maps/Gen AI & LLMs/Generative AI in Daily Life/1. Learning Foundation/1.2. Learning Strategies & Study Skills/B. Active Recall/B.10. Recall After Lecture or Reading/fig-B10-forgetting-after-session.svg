<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Retrievable content after a session</title>
  <desc>Schematic curves of retrievable content over seven days after a session. Without recall, the dashed curve falls steeply in the first day and then levels at a low value. With an exit recall and an evening recall, the solid curve shows small upward steps and falls more slowly, ending much higher.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Early recall slows the steepest part of forgetting</text>
  <line x1="120" y1="430" x2="900" y2="430" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="430" x2="120" y2="90" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="510.0" y="464" text-anchor="middle" font-size="16" fill="#111111"></text>
  <text x="62" y="260.0" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 62 260.0)">Retrievable content</text>
  <text x="510" y="476" text-anchor="middle" font-size="16" fill="#111111">Time after the session</text>
  <line x1="130.0" y1="430" x2="130.0" y2="436" stroke="#222222" stroke-width="2"/>
  <text x="130.0" y="452" text-anchor="middle" font-size="14" fill="#111111">end</text>
  <line x1="371.4" y1="430" x2="371.4" y2="436" stroke="#222222" stroke-width="2"/>
  <text x="371.4" y="452" text-anchor="middle" font-size="14" fill="#111111">evening</text>
  <line x1="483.7" y1="430" x2="483.7" y2="436" stroke="#222222" stroke-width="2"/>
  <text x="483.7" y="452" text-anchor="middle" font-size="14" fill="#111111">day 1</text>
  <line x1="693.7" y1="430" x2="693.7" y2="436" stroke="#222222" stroke-width="2"/>
  <text x="693.7" y="452" text-anchor="middle" font-size="14" fill="#111111">day 3</text>
  <line x1="870.0" y1="430" x2="870.0" y2="436" stroke="#222222" stroke-width="2"/>
  <text x="870.0" y="452" text-anchor="middle" font-size="14" fill="#111111">day 7</text>
