<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Recognition, cued recall and free recall</title>
  <desc>Three panels showing what the learner sees and what the learner must produce in recognition, cued recall and free recall, with support decreasing and demand increasing from left to right.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Three ways of remembering the same knowledge</text>
  <rect x="40" y="70" width="276" height="44" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="178.0" y="98.3" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">RECOGNITION</text>
  <rect x="58" y="130" width="240" height="210" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <text x="178.0" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">WHAT THE LEARNER SEES</text>
  <text x="178.0" y="182" text-anchor="middle" font-size="15" fill="#111111">Which is the capital</text>
  <text x="178.0" y="203" text-anchor="middle" font-size="15" fill="#111111">of Australia?</text>
  <text x="178.0" y="224" text-anchor="middle" font-size="15" fill="#111111"></text>
  <text x="178.0" y="245" text-anchor="middle" font-size="15" fill="#111111">A  Sydney</text>
  <text x="178.0" y="266" text-anchor="middle" font-size="15" fill="#111111">B  Canberra</text>
  <text x="178.0" y="287" text-anchor="middle" font-size="15" fill="#111111">C  Melbourne</text>
  <text x="178.0" y="308" text-anchor="middle" font-size="15" fill="#111111">D  Perth</text>
  <text x="178.0" y="372" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">WHAT THE LEARNER MUST DO</text>
  <text x="178.0" y="396" text-anchor="middle" font-size="15" fill="#111111">Choose the</text>
  <text x="178.0" y="416" text-anchor="middle" font-size="15" fill="#111111">familiar option</text>
  <rect x="342" y="70" width="276" height="44" rx="6" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="480.0" y="98.3" text-anchor="middle" font-size="19" font-weight="bold" fill="#000000">CUED RECALL</text>
  <rect x="360" y="130" width="240" height="210" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <text x="480.0" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">WHAT THE LEARNER SEES</text>
  <text x="480.0" y="182" text-anchor="middle" font-size="15" fill="#111111">Capital of</text>
  <text x="480.0" y="203" text-anchor="middle" font-size="15" fill="#111111">Australia?</text>
  <text x="480.0" y="224" text-anchor="middle" font-size="15" fill="#111111"></text>
  <text x="480.0" y="245" text-anchor="middle" font-size="15" fill="#111111"></text>
  <text x="480.0" y="266" text-anchor="middle" font-size="15" fill="#111111">____________</text>
  <text x="480.0" y="287" text-anchor="middle" font-size="15" fill="#111111"></text>
  <text x="480.0" y="308" text-anchor="middle" font-size="15" fill="#111111"></text>
  <text x="480.0" y="372" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">WHAT THE LEARNER MUST DO</text>
  <text x="480.0" y="396" text-anchor="middle" font-size="15" fill="#111111">Produce one answer</text>
  <text x="480.0" y="416" text-anchor="middle" font-size="15" fill="#111111">to a specific prompt</text>
  <rect x="644" y="70" width="276" height="44" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="782.0" y="98.3" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">FREE RECALL</text>
  <rect x="662" y="130" width="240" height="210" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <text x="782.0" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">WHAT THE LEARNER SEES</text>
  <text x="782.0" y="182" text-anchor="middle" font-size="15" fill="#111111">Write everything you</text>
  <text x="782.0" y="203" text-anchor="middle" font-size="15" fill="#111111">know about the</text>
  <text x="782.0" y="224" text-anchor="middle" font-size="15" fill="#111111">government of</text>
  <text x="782.0" y="245" text-anchor="middle" font-size="15" fill="#111111">Australia.</text>
  <text x="782.0" y="266" text-anchor="middle" font-size="15" fill="#111111"></text>
  <text x="782.0" y="287" text-anchor="middle" font-size="15" fill="#111111"></text>
  <text x="782.0" y="308" text-anchor="middle" font-size="15" fill="#111111"></text>
  <text x="782.0" y="372" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">WHAT THE LEARNER MUST DO</text>
  <text x="782.0" y="396" text-anchor="middle" font-size="15" fill="#111111">Find, organise and</text>
  <text x="782.0" y="416" text-anchor="middle" font-size="15" fill="#111111">produce many items</text>
  <line x1="70" y1="460" x2="890" y2="460" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="70" y="488" font-size="15" font-weight="bold" fill="#111111">More support</text>
  <text x="890" y="488" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Less support</text>
  <line x1="70" y1="510" x2="890" y2="510" stroke="#222222" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#arrow)"/>
  <text x="480" y="483" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Effort and diagnostic value of the attempt increase</text>
  <text x="480" y="532" text-anchor="middle" font-size="14" fill="#333333">Recognition is easiest and most likely to overstate what could be produced unaided</text>
</svg>
