<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Automaticity grows with repetition</title>
  <desc>Schematic asymptotic curve of automaticity against days of repetition, rising steeply then levelling; a marker at about 66 days shows the median time to near-maximum automaticity, with a shaded band from 18 to 254 days showing the individual range. A small dip shows that a missed day barely affects the curve.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Habits form gradually - and at very different speeds</text>
  <line x1="120" y1="420" x2="900" y2="420" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="420" x2="120" y2="90" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="510.0" y="454" text-anchor="middle" font-size="16" fill="#111111"></text>
  <text x="62" y="255.0" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 62 255.0)">Automaticity</text>
  <text x="510" y="466" text-anchor="middle" font-size="16" fill="#111111">Days of repetition in the same context</text>
  <line x1="130.0" y1="420" x2="130.0" y2="426" stroke="#222222" stroke-width="2"/>
  <text x="130.0" y="442" text-anchor="middle" font-size="14" fill="#111111">0</text>
  <line x1="276.2" y1="420" x2="276.2" y2="426" stroke="#222222" stroke-width="2"/>
  <text x="276.2" y="442" text-anchor="middle" font-size="14" fill="#111111">50</text>
  <line x1="422.3" y1="420" x2="422.3" y2="426" stroke="#222222" stroke-width="2"/>
  <text x="422.3" y="442" text-anchor="middle" font-size="14" fill="#111111">100</text>
  <line x1="568.5" y1="420" x2="568.5" y2="426" stroke="#222222" stroke-width="2"/>
  <text x="568.5" y="442" text-anchor="middle" font-size="14" fill="#111111">150</text>
  <line x1="714.6" y1="420" x2="714.6" y2="426" stroke="#222222" stroke-width="2"/>
  <text x="714.6" y="442" text-anchor="middle" font-size="14" fill="#111111">200</text>
  <line x1="860.8" y1="420" x2="860.8" y2="426" stroke="#222222" stroke-width="2"/>
  <text x="860.8" y="442" text-anchor="middle" font-size="14" fill="#111111">250</text>
  <rect x="182.6" y="100" width="689.8" height="316" rx="0" fill="#F2F2F2" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <rect x="633.0" y="353" width="163.2" height="44" fill="#FFFFFF" stroke="#666666" stroke-width="1"/>
  <text x="714.6" y="370" text-anchor="middle" font-size="14" fill="#111111">individual range</text>
  <text x="714.6" y="388" text-anchor="middle" font-size="14" fill="#111111">about 18 to 254 days</text>
