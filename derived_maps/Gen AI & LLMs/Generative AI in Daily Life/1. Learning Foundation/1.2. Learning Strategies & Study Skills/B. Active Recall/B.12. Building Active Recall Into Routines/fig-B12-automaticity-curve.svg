  <line x1="322.9" y1="100" x2="322.9" y2="420" stroke="#222222" stroke-width="2.5" stroke-dasharray="10 6"/>
  <rect x="324.9" y="283" width="163.2" height="26" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="330.9" y="300" font-size="14" fill="#111111">median about 66 days</text>
  <rect x="218.6" y="227.5" width="201.5" height="25" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="224.6" y="243.5" font-size="13" fill="#111111">a missed day: little effect</text>
  <text x="480.0" y="525" text-anchor="middle" font-size="13" fill="#333333">Schematic of the pattern reported by Lally and colleagues (2010); not their data.</text>
