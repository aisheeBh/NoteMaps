<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The spectrum of cue support</title>
  <desc>Six formats arranged left to right with a bar showing support given decreasing and a second showing retrieval effort increasing: recognition, heavily cued recall, fill in the blank, short answer, free recall, applied recall. Each has a short example.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Less support, more retrieval</text>
  <rect x="56" y="144" width="40" height="156" rx="0" fill="#D9D9D9" stroke="#444444" stroke-width="1.5"/>
  <rect x="114" y="274" width="40" height="26" rx="0" fill="url(#hatch)" stroke="#000000" stroke-width="1.5"/>
  <line x1="46" y1="300" x2="164" y2="300" stroke="#222222" stroke-width="2"/>
  <rect x="36" y="316" width="138" height="44" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="105.0" y="343.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Recognition</text>
  <text x="105.0" y="386" text-anchor="middle" font-size="14" fill="#111111">Pick from</text>
  <text x="105.0" y="405" text-anchor="middle" font-size="14" fill="#111111">A, B, C, D</text>
  <rect x="205" y="170" width="40" height="130" rx="0" fill="#D9D9D9" stroke="#444444" stroke-width="1.5"/>
  <rect x="263" y="248" width="40" height="52" rx="0" fill="url(#hatch)" stroke="#000000" stroke-width="1.5"/>
  <line x1="195" y1="300" x2="313" y2="300" stroke="#222222" stroke-width="2"/>
  <rect x="185" y="316" width="138" height="44" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="254.0" y="343.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Heavy cues</text>
  <text x="254.0" y="386" text-anchor="middle" font-size="14" fill="#111111">K _ _ b _ n</text>
  <text x="254.0" y="405" text-anchor="middle" font-size="14" fill="#111111">(6 letters)</text>
  <rect x="354" y="196" width="40" height="104" rx="0" fill="#D9D9D9" stroke="#444444" stroke-width="1.5"/>
  <rect x="412" y="222" width="40" height="78" rx="0" fill="url(#hatch)" stroke="#000000" stroke-width="1.5"/>
  <line x1="344" y1="300" x2="462" y2="300" stroke="#222222" stroke-width="2"/>
  <rect x="334" y="316" width="138" height="44" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="403.0" y="343.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Fill in</text>
  <text x="403.0" y="386" text-anchor="middle" font-size="14" fill="#111111">Safety stock</text>
  <text x="403.0" y="405" text-anchor="middle" font-size="14" fill="#111111">buffers ____</text>
  <rect x="503" y="222" width="40" height="78" rx="0" fill="#D9D9D9" stroke="#444444" stroke-width="1.5"/>
  <rect x="561" y="196" width="40" height="104" rx="0" fill="url(#hatch)" stroke="#000000" stroke-width="1.5"/>
  <line x1="493" y1="300" x2="611" y2="300" stroke="#222222" stroke-width="2"/>
  <rect x="483" y="316" width="138" height="44" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="552.0" y="343.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Short answer</text>
  <text x="552.0" y="386" text-anchor="middle" font-size="14" fill="#111111">What does</text>
  <text x="552.0" y="405" text-anchor="middle" font-size="14" fill="#111111">Kanban do?</text>
  <rect x="652" y="248" width="40" height="52" rx="0" fill="#D9D9D9" stroke="#444444" stroke-width="1.5"/>
  <rect x="710" y="170" width="40" height="130" rx="0" fill="url(#hatch)" stroke="#000000" stroke-width="1.5"/>
  <line x1="642" y1="300" x2="760" y2="300" stroke="#222222" stroke-width="2"/>
  <rect x="632" y="316" width="138" height="44" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="701.0" y="343.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Free recall</text>
  <text x="701.0" y="386" text-anchor="middle" font-size="14" fill="#111111">Everything</text>
  <text x="701.0" y="405" text-anchor="middle" font-size="14" fill="#111111">on pull systems</text>
  <rect x="801" y="274" width="40" height="26" rx="0" fill="#D9D9D9" stroke="#444444" stroke-width="1.5"/>
  <rect x="859" y="144" width="40" height="156" rx="0" fill="url(#hatch)" stroke="#000000" stroke-width="1.5"/>
  <line x1="791" y1="300" x2="909" y2="300" stroke="#222222" stroke-width="2"/>
  <rect x="781" y="316" width="138" height="44" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="850.0" y="343.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Applied</text>
  <text x="850.0" y="386" text-anchor="middle" font-size="14" fill="#111111">Stock-outs on</text>
  <text x="850.0" y="405" text-anchor="middle" font-size="14" fill="#111111">line 3 - why?</text>
  <rect x="250" y="470" width="24" height="24" rx="0" fill="#D9D9D9" stroke="#444444" stroke-width="1.5"/>
  <text x="284" y="488" font-size="15" fill="#111111">support given</text>
  <rect x="520" y="470" width="24" height="24" rx="0" fill="url(#hatch)" stroke="#000000" stroke-width="1.5"/>
  <text x="554" y="488" font-size="15" fill="#111111">retrieval effort required</text>
  <text x="480.0" y="540" text-anchor="middle" font-size="13" fill="#333333">Bar heights are schematic; the order, not the size, is the point.</text>
</svg>
