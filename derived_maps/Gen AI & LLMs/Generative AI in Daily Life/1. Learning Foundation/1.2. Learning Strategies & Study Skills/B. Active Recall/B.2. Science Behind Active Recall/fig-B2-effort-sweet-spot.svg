<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Difficulty of a recall attempt and long-term benefit</title>
  <desc>Schematic curve: benefit rises as successful recall becomes more effortful, peaks where recall is hard but still succeeds, then falls when recall fails; with feedback after failure a dashed line shows benefit remains moderate.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Hard but successful recall gives the largest gain</text>
  <line x1="120" y1="440" x2="900" y2="440" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="440" x2="120" y2="90" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="510.0" y="474" text-anchor="middle" font-size="16" fill="#111111">Difficulty of the recall attempt</text>
  <text x="62" y="265.0" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 62 265.0)">Long-term benefit</text>
  <rect x="130" y="100" width="230" height="330" rx="0" fill="#F2F2F2" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <rect x="360" y="100" width="250" height="330" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
  <rect x="610" y="100" width="280" height="330" rx="0" fill="#FBE5E5" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="163.4" y="111" width="163.2" height="44" fill="#FFFFFF" stroke="#666666" stroke-width="1"/>
  <text x="245" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">TOO EASY</text>
  <text x="245" y="146" text-anchor="middle" font-size="14" fill="#111111">answer still in mind</text>
  <rect x="414.7" y="111" width="140.5" height="44" fill="#FFFFFF" stroke="#1E5E24" stroke-width="2"/>
  <text x="485" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">DESIRABLE</text>
  <text x="485" y="146" text-anchor="middle" font-size="14" fill="#111111">effortful success</text>
  <rect x="698.6" y="111" width="102.7" height="44" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
  <text x="750" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">TOO HARD</text>
  <text x="750" y="146" text-anchor="middle" font-size="14" fill="#111111">recall fails</text>
