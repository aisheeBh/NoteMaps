  <path d="M601.2 170.0 L608.8 171.9 L616.4 177.4 L624.0 186.4 L631.6 198.4 L639.2 213.0 L646.8 229.7 L654.4 247.9 L662.0 266.9 L669.6 286.2 L677.2 295.3 L684.8 301.8 L692.4 306.4 L700.0 309.4 L707.6 311.4 L715.2 312.5 L722.8 313.2 L730.4 313.6 L738.0 313.8 L745.6 313.9 L753.2 314.0 L760.8 314.0 L768.4 314.0 L776.0 314.0 L783.6 314.0 L791.2 314.0 L798.8 314.0 L806.4 314.0 L814.0 314.0 L821.6 314.0 L829.2 314.0 L836.8 314.0 L844.4 314.0 L852.0 314.0 L859.6 314.0 L867.2 314.0 L874.8 314.0 L882.4 314.0 L890.0 314.0" fill="none" stroke="#222222" stroke-width="3" stroke-dasharray="10 6"/>
  <rect x="744.9" y="283" width="110.3" height="44" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="800" y="300" text-anchor="middle" font-size="14" fill="#111111">with feedback</text>
  <text x="800" y="318" text-anchor="middle" font-size="14" fill="#111111">after failure</text>
  <rect x="772.4" y="383" width="95.2" height="26" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="820" y="400" text-anchor="middle" font-size="14" fill="#111111">no feedback</text>
  <rect x="259.7" y="313" width="140.5" height="26" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="330" y="330" text-anchor="middle" font-size="14" fill="#111111">successful recall</text>
  <text x="480.0" y="545" text-anchor="middle" font-size="13" fill="#333333">Schematic summary of the desirable-difficulty principle; not plotted from a single dataset.</text>
</svg>
