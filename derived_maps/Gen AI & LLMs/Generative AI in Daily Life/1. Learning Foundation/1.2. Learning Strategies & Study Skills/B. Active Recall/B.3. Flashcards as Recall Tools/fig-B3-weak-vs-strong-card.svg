<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>A weak card and a strong card</title>
  <desc>Two flashcards for the idea of float in project scheduling. The weak card has the cue Float? and the answer Slack. The strong card asks what three days of float means for the schedule and has a one-sentence answer. Annotations list why each works or fails.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Same idea, two cards</text>
  <text x="250" y="84" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">WEAK CARD</text>
  <rect x="50" y="100" width="400" height="130" rx="6" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="66" y="122" font-size="13" font-weight="bold" fill="#111111">FRONT</text>
  <text x="250" y="176" text-anchor="middle" font-size="17" fill="#111111">Float?</text>
  <rect x="50" y="246" width="400" height="120" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <text x="66" y="268" font-size="13" font-weight="bold" fill="#111111">BACK</text>
  <text x="250" y="318" text-anchor="middle" font-size="16" fill="#111111">Slack.</text>
  <text x="80" y="404" font-size="15" fill="#111111">- cue admits many answers</text>
  <text x="80" y="428" font-size="15" fill="#111111">- synonym, not understanding</text>
  <text x="80" y="452" font-size="15" fill="#111111">- quick to guess, hard to use</text>
  <text x="710" y="84" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">STRONG CARD</text>
  <rect x="510" y="100" width="400" height="130" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="526" y="122" font-size="13" font-weight="bold" fill="#111111">FRONT</text>
  <text x="710" y="154" text-anchor="middle" font-size="17" fill="#111111">A task has 3 days of float.</text>
  <text x="710" y="176" text-anchor="middle" font-size="17" fill="#111111">What does that mean</text>
  <text x="710" y="198" text-anchor="middle" font-size="17" fill="#111111">for the schedule?</text>
  <rect x="510" y="246" width="400" height="120" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <text x="526" y="268" font-size="13" font-weight="bold" fill="#111111">BACK</text>
  <text x="710" y="296" text-anchor="middle" font-size="16" fill="#111111">It can slip up to 3 days</text>
  <text x="710" y="318" text-anchor="middle" font-size="16" fill="#111111">without delaying the</text>
  <text x="710" y="340" text-anchor="middle" font-size="16" fill="#111111">project end date.</text>
  <text x="540" y="404" font-size="15" fill="#111111">- one precise answer</text>
  <text x="540" y="428" font-size="15" fill="#111111">- tests meaning, not a label</text>
  <text x="540" y="452" font-size="15" fill="#111111">- matches real use</text>
</svg>
