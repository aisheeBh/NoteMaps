<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Simplicity and accuracy trade-off</title>
  <desc>Schematic chart: as an explanation becomes simpler, clarity for a novice rises while accuracy eventually falls. The target zone is where clarity is high and accuracy is still high; beyond it lies oversimplification.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">As simple as possible - but no simpler</text>
  <line x1="120" y1="430" x2="900" y2="430" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="430" x2="120" y2="80" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="510.0" y="464" text-anchor="middle" font-size="16" fill="#111111"></text>
  <text x="62" y="255.0" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 62 255.0)">Quality</text>
  <text x="510" y="464" text-anchor="middle" font-size="16" fill="#111111">Simplicity of the explanation</text>
  <text x="130" y="450" font-size="14" fill="#111111">technical</text>
  <text x="890" y="450" text-anchor="end" font-size="14" fill="#111111">very simple</text>
  <rect x="520" y="90" width="170" height="336" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
  <rect x="546.1" y="378" width="117.8" height="44" fill="#FFFFFF" stroke="#1E5E24" stroke-width="2"/>
  <text x="605" y="395" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">TARGET</text>
  <text x="605" y="413" text-anchor="middle" font-size="14" fill="#111111">clear and true</text>
  <path d="M130.0 390.0 L142.7 375.9 L155.3 362.4 L168.0 349.6 L180.7 337.4 L193.3 325.9 L206.0 314.8 L218.7 304.4 L231.3 294.4 L244.0 284.9 L256.7 275.9 L269.3 267.3 L282.0 259.2 L294.7 251.4 L307.3 244.0 L320.0 237.0 L332.7 230.3 L345.3 224.0 L358.0 217.9 L370.7 212.2 L383.3 206.7 L396.0 201.5 L408.7 196.5 L421.3 191.8 L434.0 187.3 L446.7 183.1 L459.3 179.0 L472.0 175.2 L484.7 171.5 L497.3 168.0 L510.0 164.7 L522.7 161.6 L535.3 158.5 L548.0 155.7 L560.7 153.0 L573.3 150.4 L586.0 147.9 L598.7 145.6 L611.3 143.4 L624.0 141.3 L636.7 139.2 L649.3 137.3 L662.0 135.5 L674.7 133.8 L687.3 132.1 L700.0 130.6 L712.7 129.1 L725.3 127.7 L738.0 126.3 L750.7 125.0 L763.3 123.8 L776.0 122.6 L788.7 121.5 L801.3 120.5 L814.0 119.5 L826.7 118.5 L839.3 117.6 L852.0 116.8 L864.7 116.0 L877.3 115.2 L890.0 114.4" fill="none" stroke="#222222" stroke-width="3.5" stroke-dasharray="10 6"/>
  <path d="M130.0 100.0 L142.7 100.0 L155.3 100.0 L168.0 100.0 L180.7 100.1 L193.3 100.1 L206.0 100.1 L218.7 100.1 L231.3 100.1 L244.0 100.2 L256.7 100.2 L269.3 100.2 L282.0 100.3 L294.7 100.3 L307.3 100.4 L320.0 100.5 L332.7 100.6 L345.3 100.8 L358.0 100.9 L370.7 101.2 L383.3 101.4 L396.0 101.7 L408.7 102.1 L421.3 102.5 L434.0 103.1 L446.7 103.8 L459.3 104.6 L472.0 105.6 L484.7 106.8 L497.3 108.3 L510.0 110.1 L522.7 112.2 L535.3 114.8 L548.0 117.9 L560.7 121.5 L573.3 125.9 L586.0 131.0 L598.7 137.0 L611.3 144.0 L624.0 152.1 L636.7 161.3 L649.3 171.6 L662.0 183.1 L674.7 195.6 L687.3 209.1 L700.0 223.3 L712.7 238.0 L725.3 253.0 L738.0 267.9 L750.7 282.5 L763.3 296.4 L776.0 309.5 L788.7 321.7 L801.3 332.7 L814.0 342.5 L826.7 351.3 L839.3 358.9 L852.0 365.5 L864.7 371.1 L877.3 375.9 L890.0 380.0" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <rect x="188.4" y="313" width="163.2" height="26" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="270" y="330" text-anchor="middle" font-size="14" fill="#111111">Clarity for a novice</text>
  <rect x="293.8" y="67" width="72.5" height="26" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="330" y="84" text-anchor="middle" font-size="14" fill="#111111">Accuracy</text>
  <rect x="742.3" y="313" width="125.4" height="44" fill="#FFFFFF" stroke="#8B0000" stroke-width="1.5"/>
  <text x="805" y="330" text-anchor="middle" font-size="14" fill="#111111">oversimplified:</text>
  <text x="805" y="348" text-anchor="middle" font-size="14" fill="#111111">clear but wrong</text>
  <rect x="149.7" y="213" width="140.5" height="26" fill="#FFFFFF" stroke="#666666" stroke-width="1"/>
  <text x="220" y="230" text-anchor="middle" font-size="14" fill="#111111">jargon hides gaps</text>
  <text x="480.0" y="525" text-anchor="middle" font-size="13" fill="#333333">Schematic; the position of the target zone depends on the audience and the purpose.</text>
</svg>
