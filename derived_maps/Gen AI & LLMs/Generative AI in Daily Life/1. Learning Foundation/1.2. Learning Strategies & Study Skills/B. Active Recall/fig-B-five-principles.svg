<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Five principles of effective recall</title>
  <desc>Five boxes in a row: Hide, Produce, Check, Return, Vary, each with a one-line description and a typical failure beneath it.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Five principles behind every recall method</text>
  <rect x="40" y="80" width="160" height="140" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="120.0" y="134.6" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">HIDE</text>
  <text x="120.0" y="155.6" text-anchor="middle" font-size="16" fill="#FFFFFF">answer out of</text>
  <text x="120.0" y="176.6" text-anchor="middle" font-size="16" fill="#FFFFFF">sight</text>
  <rect x="40" y="250" width="160" height="90" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="50" y="262" width="140" height="66" rx="3" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <text x="120" y="290" text-anchor="middle" font-size="14" fill="#111111">fails: notes open</text>
  <line x1="120" y1="222" x2="120" y2="248" stroke="#222222" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#arrow)"/>
  <rect x="220" y="80" width="160" height="140" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="300.0" y="134.6" text-anchor="middle" font-size="17" font-weight="bold" fill="#000000">PRODUCE</text>
  <text x="300.0" y="155.6" text-anchor="middle" font-size="16" fill="#000000">state it</text>
  <text x="300.0" y="176.6" text-anchor="middle" font-size="16" fill="#000000">in full</text>
  <rect x="220" y="250" width="160" height="90" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="230" y="262" width="140" height="66" rx="3" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <text x="300" y="281" text-anchor="middle" font-size="14" fill="#111111">fails: 'I know</text>
  <text x="300" y="299" text-anchor="middle" font-size="14" fill="#111111">this one'</text>
  <line x1="300" y1="222" x2="300" y2="248" stroke="#222222" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#arrow)"/>
  <rect x="400" y="80" width="160" height="140" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="480.0" y="134.6" text-anchor="middle" font-size="17" font-weight="bold" fill="#000000">CHECK</text>
  <text x="480.0" y="155.6" text-anchor="middle" font-size="16" fill="#000000">compare with</text>
  <text x="480.0" y="176.6" text-anchor="middle" font-size="16" fill="#000000">a source</text>
  <rect x="400" y="250" width="160" height="90" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="410" y="262" width="140" height="66" rx="3" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <text x="480" y="281" text-anchor="middle" font-size="14" fill="#111111">fails: errors</text>
  <text x="480" y="299" text-anchor="middle" font-size="14" fill="#111111">uncorrected</text>
  <line x1="480" y1="222" x2="480" y2="248" stroke="#222222" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#arrow)"/>
  <rect x="580" y="80" width="160" height="140" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="660.0" y="134.6" text-anchor="middle" font-size="17" font-weight="bold" fill="#000000">RETURN</text>
  <text x="660.0" y="155.6" text-anchor="middle" font-size="16" fill="#000000">bring items</text>
  <text x="660.0" y="176.6" text-anchor="middle" font-size="16" fill="#000000">back later</text>
  <rect x="580" y="250" width="160" height="90" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="590" y="262" width="140" height="66" rx="3" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <text x="660" y="281" text-anchor="middle" font-size="14" fill="#111111">fails: dropped</text>
  <text x="660" y="299" text-anchor="middle" font-size="14" fill="#111111">after one success</text>
  <line x1="660" y1="222" x2="660" y2="248" stroke="#222222" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#arrow)"/>
  <rect x="760" y="80" width="160" height="140" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="840.0" y="134.6" text-anchor="middle" font-size="17" font-weight="bold" fill="#000000">VARY</text>
  <text x="840.0" y="155.6" text-anchor="middle" font-size="16" fill="#000000">change cues,</text>
  <text x="840.0" y="176.6" text-anchor="middle" font-size="16" fill="#000000">order, setting</text>
  <rect x="760" y="250" width="160" height="90" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="770" y="262" width="140" height="66" rx="3" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <text x="840" y="281" text-anchor="middle" font-size="14" fill="#111111">fails: same cards,</text>
  <text x="840" y="299" text-anchor="middle" font-size="14" fill="#111111">same desk</text>
  <line x1="840" y1="222" x2="840" y2="248" stroke="#222222" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#arrow)"/>
  <text x="480" y="395" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Honest Practice Creates Real Value</text>
  <text x="480" y="420" text-anchor="middle" font-size="15" fill="#111111">Hide - Produce - Check - Return - Vary</text>
</svg>
