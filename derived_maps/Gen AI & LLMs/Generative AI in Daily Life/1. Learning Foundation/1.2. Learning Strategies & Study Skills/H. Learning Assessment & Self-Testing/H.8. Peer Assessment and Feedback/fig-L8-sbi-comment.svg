<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Anatomy of a Situation-Behaviour-Impact comment</title>
  <desc>A peer comment split into three labelled parts. Situation: in this morning's client call. Behaviour: you answered the pricing question before the client finished asking it. Impact: she repeated the question twice and seemed frustrated. An optional fourth part, a suggestion, follows: next time, let her finish, then summarise her question before answering. Beneath, the contrasting vague comment: you need to listen better.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">A specific comment in three parts, plus a suggestion</text>
  <rect x="40" y="70" width="200" height="170" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="250" y="70" width="250" height="170" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="3"/>
  <rect x="510" y="70" width="210" height="170" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="730" y="70" width="190" height="170" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <g font-size="15" fill="#111111">
    <rect x="52" y="82" width="176" height="146" fill="#FFFFFF"/>
    <text x="140" y="106" text-anchor="middle" font-size="18" font-weight="bold">Situation</text>
    <text x="64" y="140">"In this morning's</text><text x="64" y="160">client call..."</text>
    <text x="64" y="200" font-size="14" font-style="italic">when and where</text>
    <text x="375" y="106" text-anchor="middle" font-size="18" font-weight="bold">Behaviour</text>
    <text x="264" y="140">"...you answered the pricing</text><text x="264" y="160">question before the client</text><text x="264" y="180">finished asking it..."</text>
    <text x="264" y="214" font-size="14" font-style="italic">observable, not interpreted</text>
    <rect x="522" y="82" width="186" height="146" fill="#FFFFFF"/>
    <text x="615" y="106" text-anchor="middle" font-size="18" font-weight="bold">Impact</text>
    <text x="534" y="140">"...she repeated the</text><text x="534" y="160">question twice and</text><text x="534" y="180">seemed frustrated."</text>
    <text x="534" y="214" font-size="14" font-style="italic">effect on people or work</text>
    <rect x="742" y="82" width="166" height="146" fill="#FFFFFF"/>
    <text x="825" y="106" text-anchor="middle" font-size="18" font-weight="bold">Suggestion</text>
    <text x="752" y="140">"Next time, let her</text><text x="752" y="160">finish, then summarise</text><text x="752" y="180">before answering."</text>
    <text x="752" y="214" font-size="14" font-style="italic">optional next step</text>
  </g>
  <rect x="40" y="300" width="880" height="80" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="56" y="312" width="848" height="56" fill="#FFFFFF"/>
  <text x="70" y="336" font-size="17" font-weight="bold" fill="#111111">The vague version: "You need to listen better."</text>
  <text x="70" y="358" font-size="15" fill="#111111">No moment, no behaviour, no effect: the receiver cannot tell what to change, and may hear it as a judgement of character.</text>
  <rect x="40" y="410" width="880" height="80" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="70" y="440" font-size="16" fill="#111111">Behaviour is described as a camera would record it: "answered before she finished",</text>
  <text x="70" y="464" font-size="16" fill="#111111">not "were impatient" or "didn't care". Interpretations invite argument; observations invite reflection.</text>
</svg>
