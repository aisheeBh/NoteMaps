<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The self-assessment loop</title>
  <desc>Four stages arranged in a cycle: standard, what good looks like; evidence, what I can actually do; judgement, how far I am and how sure; action, what I will do and when I will check again. Around the cycle, five sources of evidence and judgement feed in: self, peers, experts, tools and real-work outcomes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Four questions, asked again and again</text>
  <g font-size="15" fill="#111111">
    <rect x="340" y="70" width="280" height="96" rx="10" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
    <text x="480" y="102" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">1. STANDARD</text>
    <text x="480" y="128" text-anchor="middle" fill="#FFFFFF">What does good look like?</text>
    <text x="480" y="150" text-anchor="middle" fill="#FFFFFF">criteria, exemplars, objectives</text>
    <rect x="620" y="260" width="290" height="96" rx="10" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
    <text x="765" y="292" text-anchor="middle" font-size="19" font-weight="bold">2. EVIDENCE</text>
    <text x="765" y="318" text-anchor="middle">What can I actually do?</text>
    <text x="765" y="340" text-anchor="middle">unaided, delayed, realistic</text>
    <rect x="340" y="450" width="280" height="96" rx="10" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
    <rect x="352" y="460" width="256" height="76" rx="6" fill="#FFFFFF"/>
    <text x="480" y="484" text-anchor="middle" font-size="19" font-weight="bold">3. JUDGEMENT</text>
    <text x="480" y="508" text-anchor="middle">How far am I, and how sure?</text>
    <text x="480" y="528" text-anchor="middle">gap and confidence checked</text>
    <rect x="50" y="260" width="290" height="96" rx="10" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
    <text x="195" y="292" text-anchor="middle" font-size="19" font-weight="bold">4. ACTION</text>
    <text x="195" y="318" text-anchor="middle">What will I do about it?</text>
    <text x="195" y="340" text-anchor="middle">study, practise, re-check by a date</text>
  </g>
  <path d="M620 140 Q 730 170 760 252" fill="none" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M760 362 Q 730 440 628 488" fill="none" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M340 488 Q 230 440 200 364" fill="none" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M200 254 Q 230 170 332 140" fill="none" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="380" y="250" width="200" height="110" fill="#FFFFFF" stroke="#555555" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="480" y="276" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Who judges?</text>
  <text x="480" y="300" text-anchor="middle" font-size="15" fill="#111111">self, peers, experts,</text>
  <text x="480" y="320" text-anchor="middle" font-size="15" fill="#111111">tools, real outcomes</text>
  <text x="480" y="344" text-anchor="middle" font-size="14" fill="#111111">compared, not trusted alone</text>
  <line x1="480" y1="360" x2="480" y2="444" stroke="#555555" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#arrow)"/>
  <line x1="580" y1="305" x2="614" y2="305" stroke="#555555" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#arrow)"/>
  <text x="480" y="590" text-anchor="middle" font-size="15" fill="#111111">The loop fails at its weakest step: no standard, dishonest evidence, unchecked confidence or no action.</text>
</svg>
