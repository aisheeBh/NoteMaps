  <rect x="330" y="252" width="170" height="22" fill="#FFFFFF"/>
  <text x="336" y="268" font-size="15" font-weight="bold" fill="#111111">Planned trajectory</text>
  <rect x="150" y="390" width="200" height="22" fill="#FFFFFF"/>
  <text x="156" y="406" font-size="15" font-weight="bold" fill="#111111">Actual mock results</text>
