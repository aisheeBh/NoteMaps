  <text x="44" y="275" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 44 275)">Overall score</text>
  <line x1="110" y1="240" x2="880" y2="240" stroke="#111111" stroke-width="2" stroke-dasharray="2 4"/>
  <rect x="790" y="244" width="88" height="20" fill="#FFFFFF"/>
  <text x="796" y="259" font-size="14" fill="#111111">pass mark</text>
  <polyline points="130,390 362,320 594,240 768,190" fill="none" stroke="#7A5200" stroke-width="3.5" stroke-dasharray="10 6"/>
  <polyline points="130,390 362,330 594,260 768,180" fill="none" stroke="#1F3B5C" stroke-width="4"/>
