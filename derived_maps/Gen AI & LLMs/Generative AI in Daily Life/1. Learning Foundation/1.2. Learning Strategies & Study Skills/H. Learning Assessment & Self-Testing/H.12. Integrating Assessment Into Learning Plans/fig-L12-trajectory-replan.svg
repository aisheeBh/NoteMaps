  <text x="362" y="462" text-anchor="middle" font-size="14" fill="#111111">4</text>
  <text x="420" y="462" text-anchor="middle" font-size="14" fill="#111111">5</text>
  <text x="478" y="462" text-anchor="middle" font-size="14" fill="#111111">6</text>
  <text x="536" y="462" text-anchor="middle" font-size="14" fill="#111111">7</text>
  <text x="594" y="462" text-anchor="middle" font-size="14" fill="#111111">8</text>
  <text x="652" y="462" text-anchor="middle" font-size="14" fill="#111111">9</text>
