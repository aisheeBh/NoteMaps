<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Planned trajectory and actual mock results</title>
  <desc>Overall score against week. The planned trajectory rises from 55 percent at the diagnostic to 75 percent by week 11. Actual results: 55 at week 0, 61 at mock 1 in week 4, close to plan; 68 at mock 2 in week 8, below the plan of 70, which triggered a re-plan; 76 at mock 3 in week 11, above the pass mark of 70. A method change in week 7, triggered by flat weekly governance scores, is marked before mock 2.</desc>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Checks that changed the plan</text>
  <line x1="110" y1="440" x2="880" y2="440" stroke="#222222" stroke-width="2.5"/>
  <line x1="110" y1="440" x2="110" y2="110" stroke="#222222" stroke-width="2.5"/>
  <text x="100" y="445" text-anchor="end" font-size="14" fill="#111111">50%</text>
  <text x="100" y="395" text-anchor="end" font-size="14" fill="#111111">55%</text>
  <text x="100" y="345" text-anchor="end" font-size="14" fill="#111111">60%</text>
  <text x="100" y="295" text-anchor="end" font-size="14" fill="#111111">65%</text>
  <text x="100" y="245" text-anchor="end" font-size="14" fill="#111111">70%</text>
  <text x="100" y="195" text-anchor="end" font-size="14" fill="#111111">75%</text>
  <text x="100" y="145" text-anchor="end" font-size="14" fill="#111111">80%</text>
  <text x="130" y="462" text-anchor="middle" font-size="14" fill="#111111">0</text>
