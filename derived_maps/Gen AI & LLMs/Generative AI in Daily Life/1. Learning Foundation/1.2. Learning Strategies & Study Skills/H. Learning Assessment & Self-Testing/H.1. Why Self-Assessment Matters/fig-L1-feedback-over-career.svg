<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>External feedback and the need for self-judgement across a career</title>
  <desc>Schematic. As a person moves from student to senior professional, the amount of structured external feedback falls while the share of work that must be judged by the person alone rises. The lines cross in early career.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Less feedback from others, more judgement by oneself</text>
  <line x1="110" y1="440" x2="880" y2="440" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="110" y1="440" x2="110" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="50" y="260" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 50 260)">Relative amount</text>
  <g font-size="15" fill="#111111" text-anchor="middle">
    <text x="170" y="466">Student</text>
    <text x="330" y="466">Graduate trainee</text>
    <text x="500" y="466">Early career</text>
    <text x="660" y="466">Mid-career</text>
    <text x="810" y="466">Senior</text>
  </g>
  <path d="M170 120 C 300 160, 420 300, 560 350 S 760 395, 830 400" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <path d="M170 400 C 300 380, 420 260, 560 200 S 760 130, 830 115" fill="none" stroke="#7A5200" stroke-width="4" stroke-dasharray="10 6"/>
  <text x="200" y="100" font-size="16" font-weight="bold" fill="#111111">Structured external feedback</text>
  <text x="200" y="120" font-size="14" fill="#111111">(marks, tutors, supervisors)</text>
  <text x="560" y="98" font-size="16" font-weight="bold" fill="#111111">Work judged only by oneself</text>
  <line x1="760" y1="104" x2="790" y2="122" stroke="#222222" stroke-width="1.5"/>
  <text x="590" y="425" font-size="14" fill="#111111">feedback becomes rare and late</text>
  <line x1="680" y1="410" x2="700" y2="390" stroke="#222222" stroke-width="1.5"/>
  <circle cx="428" cy="268" r="7" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="530" y="285" font-size="14" fill="#111111">crossover: self-assessment</text>
  <text x="530" y="303" font-size="14" fill="#111111">becomes the main source</text>
  <text x="110" y="510" font-size="13" fill="#333333">Schematic; not plotted from a single dataset.</text>
</svg>
