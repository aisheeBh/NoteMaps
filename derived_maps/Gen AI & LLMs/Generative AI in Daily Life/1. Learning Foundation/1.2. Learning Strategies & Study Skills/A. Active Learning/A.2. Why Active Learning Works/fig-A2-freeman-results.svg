<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Freeman et al. 2014 results</title>
<desc>Left panel: exam performance difference of 0.47 standard deviations favouring active learning. Right panel: average failure rates of about 34 percent under lecturing and 22 percent under active learning.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">Lecturing versus active learning: 225 STEM studies</text>
<text x="240" y="100" font-size="17" text-anchor="middle" font-weight="bold" fill="#111111">Exam and concept-test scores</text>
<line x1="80" y1="420" x2="400" y2="420" stroke="#333333" stroke-width="2"/>
<rect x="120" y="270" width="100" height="150" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<rect x="129.16" y="241" width="81.68" height="24.8" fill="#FFFFFF" stroke="none"/>
<text x="170.0" y="258.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">baseline</text>
<text x="170.0" y="444.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">Lecturing</text>
<rect x="260" y="213.6" width="100" height="206.4" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
<rect x="269.15999999999997" y="184.6" width="81.68" height="24.8" fill="#FFFFFF" stroke="none"/>
<text x="310.0" y="201.6" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">+0.47 SD</text>
<text x="310.0" y="444.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">Active</text>
<text x="310.0" y="463.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">learning</text>
<text x="240" y="490" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">about +6 percentage points on a typical exam</text>
<text x="720" y="100" font-size="17" text-anchor="middle" font-weight="bold" fill="#111111">Average failure rate</text>
<line x1="560" y1="420" x2="880" y2="420" stroke="#333333" stroke-width="2"/>
<rect x="600" y="182" width="100" height="238" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<rect x="604.68" y="153" width="90.64000000000001" height="24.8" fill="#FFFFFF" stroke="none"/>
<text x="650.0" y="170.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">about 34%</text>
<text x="650.0" y="444.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">Lecturing</text>
<rect x="740" y="266" width="100" height="154" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
<rect x="744.68" y="237" width="90.64000000000001" height="24.8" fill="#FFFFFF" stroke="none"/>
<text x="790.0" y="254.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">about 22%</text>
<text x="790.0" y="444.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">Active</text>
<text x="790.0" y="463.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">learning</text>
<text x="720" y="490" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">lecture-only students about 1.5 times as likely to fail</text>
<text x="480.0" y="528" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">Left bars schematic in height; difference shown in standard-deviation units. Source: Freeman et al., 2014.</text>
</svg>
