<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Feeling of learning versus measured learning</title>
<desc>Two groups of bars: feeling of learning is higher after the lecture; measured test performance is higher after the active lesson.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">Learning more, feeling it less</text>
<text x="480.0" y="64" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">Pattern found by Deslauriers and colleagues (2019)</text>
<text x="270" y="120" font-size="17" text-anchor="middle" font-weight="bold" fill="#111111">Feeling of learning (self-rating)</text>
<line x1="120" y1="400" x2="420" y2="400" stroke="#333333" stroke-width="2"/>
<rect x="150" y="170" width="110" height="230" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
<rect x="173.12" y="141" width="63.760000000000005" height="24.8" fill="#FFFFFF" stroke="none"/>
<text x="205.0" y="158.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">higher</text>
<text x="205.0" y="424.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">Polished</text>
<text x="205.0" y="443.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">lecture</text>
<rect x="280" y="250" width="110" height="150" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
<rect x="307.6" y="221" width="54.800000000000004" height="24.8" fill="#FFFFFF" stroke="none"/>
<text x="335.0" y="238.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">lower</text>
<text x="335.0" y="424.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">Active</text>
<text x="335.0" y="443.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">lesson</text>
<text x="690" y="120" font-size="17" text-anchor="middle" font-weight="bold" fill="#111111">Measured learning (test score)</text>
<line x1="540" y1="400" x2="840" y2="400" stroke="#333333" stroke-width="2"/>
<rect x="570" y="250" width="110" height="150" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
<rect x="597.6" y="221" width="54.800000000000004" height="24.8" fill="#FFFFFF" stroke="none"/>
<text x="625.0" y="238.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">lower</text>
<text x="625.0" y="424.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">Polished</text>
<text x="625.0" y="443.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">lecture</text>
<rect x="700" y="170" width="110" height="230" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
<rect x="723.12" y="141" width="63.760000000000005" height="24.8" fill="#FFFFFF" stroke="none"/>
<text x="755.0" y="158.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">higher</text>
<text x="755.0" y="424.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">Active</text>
<text x="755.0" y="443.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">lesson</text>
<text x="480.0" y="505" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">Schematic: bar heights show direction of the difference, not exact values.</text>
</svg>
