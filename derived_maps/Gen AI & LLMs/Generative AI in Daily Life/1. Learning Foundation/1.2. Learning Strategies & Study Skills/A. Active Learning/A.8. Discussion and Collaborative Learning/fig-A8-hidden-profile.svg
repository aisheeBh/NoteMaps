<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Hidden profile</title>
<desc>Three group members each hold shared facts and one unique fact. Discussion centres on the shared facts; the unique facts, which together point to the best option, are often never mentioned.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">Why groups miss what their members know</text>
<text x="480.0" y="64" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">A hidden profile (after Stasser and Titus, 1985)</text>
<rect x="80" y="100" width="240" height="190" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="200" y="128" font-size="17" text-anchor="middle" font-weight="bold" fill="#111111">Member 1</text>
<rect x="100" y="145" width="200" height="60" rx="8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
<rect x="138.1" y="152.8" width="123.80000000000001" height="44.4" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="200.0" y="170.8" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">Shared facts</text>
<text x="200.0" y="189.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">everyone knows</text>
<rect x="100" y="215" width="200" height="60" rx="8" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<rect x="130.39999999999998" y="222.8" width="139.20000000000002" height="44.4" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="200.0" y="240.8" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">Unique fact 1</text>
<text x="200.0" y="259.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">only this member</text>
<rect x="370" y="100" width="240" height="190" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="490" y="128" font-size="17" text-anchor="middle" font-weight="bold" fill="#111111">Member 2</text>
<rect x="390" y="145" width="200" height="60" rx="8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
<rect x="428.1" y="152.8" width="123.80000000000001" height="44.4" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="490.0" y="170.8" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">Shared facts</text>
<text x="490.0" y="189.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">everyone knows</text>
<rect x="390" y="215" width="200" height="60" rx="8" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<rect x="420.4" y="222.8" width="139.20000000000002" height="44.4" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="490.0" y="240.8" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">Unique fact 2</text>
<text x="490.0" y="259.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">only this member</text>
<rect x="660" y="100" width="240" height="190" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="780" y="128" font-size="17" text-anchor="middle" font-weight="bold" fill="#111111">Member 3</text>
<rect x="680" y="145" width="200" height="60" rx="8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
<rect x="718.1" y="152.8" width="123.80000000000001" height="44.4" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="780.0" y="170.8" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">Shared facts</text>
<text x="780.0" y="189.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">everyone knows</text>
<rect x="680" y="215" width="200" height="60" rx="8" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<rect x="710.4" y="222.8" width="139.20000000000002" height="44.4" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="780.0" y="240.8" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">Unique fact 3</text>
<text x="780.0" y="259.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">only this member</text>
<rect x="110" y="360" width="340" height="110" rx="8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
<rect x="173.0" y="381.75" width="214.00000000000003" height="66.5" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="280.0" y="400.75" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Discussed often</text>
<text x="280.0" y="420.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">shared facts repeated,</text>
<text x="280.0" y="439.75" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">favour the weaker option</text>
<rect x="510" y="360" width="340" height="110" rx="8" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<rect x="560.625" y="381.75" width="238.75000000000003" height="66.5" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="680.0" y="400.75" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Rarely mentioned</text>
<text x="680.0" y="420.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">unique facts which, pooled,</text>
<text x="680.0" y="439.75" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">reveal the best option</text>
<line x1="480" y1="290" x2="300" y2="358" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="480" y1="290" x2="680" y2="358" stroke="#222222" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#arrow)"/>
<text x="480.0" y="520" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">Remedy: each member states unique information before anyone states a preference.</text>
</svg>
