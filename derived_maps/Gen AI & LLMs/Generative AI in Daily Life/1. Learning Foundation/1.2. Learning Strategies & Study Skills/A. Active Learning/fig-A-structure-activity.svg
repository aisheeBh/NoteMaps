<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Structure and activity</title>
<desc>A two-by-two matrix: course structure low or high on the vertical axis, learner activity low or high on the horizontal. Quadrants: unstructured lecture; structured lecture with quizzes; unstructured activity; structured active course, which gives the strongest results and largest equity gains.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">Structure and learner activity: four kinds of course</text>
<rect x="170" y="90" width="360" height="200" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
<text x="350.0" y="175.75" font-size="15" text-anchor="middle" font-weight="bold" fill="#000000">STRUCTURED LECTURE</text>
<text x="350.0" y="195.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">Required preparation and quizzes,</text>
<text x="350.0" y="214.75" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">but class time is mostly listening</text>
<rect x="550" y="90" width="360" height="200" rx="8" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
<rect x="561.125" y="147.0" width="337.75" height="86.0" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="730.0" y="166.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">STRUCTURED ACTIVE COURSE</text>
<text x="730.0" y="185.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">Preparation, frequent practice,</text>
<text x="730.0" y="205.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">feedback; class time spent producing</text>
<text x="730.0" y="224.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">Strongest results, largest equity gains</text>
<rect x="170" y="310" width="360" height="200" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
<text x="350.0" y="395.75" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">UNSTRUCTURED LECTURE</text>
<text x="350.0" y="415.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">Learners listen; independent</text>
<text x="350.0" y="434.75" font-size="15" text-anchor="middle" font-weight="normal" fill="#222222">study left to them</text>
<rect x="550" y="310" width="360" height="200" rx="8" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<rect x="598.25" y="367.0" width="263.5" height="86.0" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="730.0" y="386.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">UNSTRUCTURED ACTIVITY</text>
<text x="730.0" y="405.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">Activities without required</text>
<text x="730.0" y="425.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">preparation or feedback;</text>
<text x="730.0" y="444.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">benefits most the already able</text>
<line x1="170" y1="545" x2="910" y2="545" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="540" y="572" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">LEARNER ACTIVITY IN CLASS: low  to  high</text>
<line x1="130" y1="510" x2="130" y2="90" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="108" y="300" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111" transform="rotate(-90 108 300)">COURSE STRUCTURE: low  to  high</text>
</svg>
