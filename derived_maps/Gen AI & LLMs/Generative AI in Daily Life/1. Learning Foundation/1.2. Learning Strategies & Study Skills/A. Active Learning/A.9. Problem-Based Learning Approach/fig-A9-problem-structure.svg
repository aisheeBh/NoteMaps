<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Problem structure spectrum</title>
<desc>Five problem types from well-structured to ill-structured: exercise, rule-using problem, diagnosis, design problem, dilemma, with properties shifting from one right answer to many defensible answers.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">From well-structured to ill-structured problems</text>
<rect x="50" y="110" width="160" height="130" rx="6" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
<text x="130" y="150" font-size="17" text-anchor="middle" font-weight="bold" fill="#111111">Exercise</text>
<text x="130" y="190.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">calculate a</text>
<text x="130" y="208.2" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">loan repayment</text>
<rect x="225" y="110" width="160" height="130" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="305" y="150" font-size="17" text-anchor="middle" font-weight="bold" fill="#111111">Rule-using</text>
<text x="305" y="190.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">apply a tax</text>
<text x="305" y="208.2" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">rule to a case</text>
<rect x="400" y="110" width="160" height="130" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
<text x="480" y="150" font-size="17" text-anchor="middle" font-weight="bold" fill="#111111">Diagnosis</text>
<text x="480" y="190.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">why is the</text>
<text x="480" y="208.2" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">system slow?</text>
<rect x="575" y="110" width="160" height="130" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
<rect x="585" y="118" width="140" height="114" rx="4" fill="#FFFFFF"/>
<text x="655" y="150" font-size="17" text-anchor="middle" font-weight="bold" fill="#111111">Design</text>
<text x="655" y="190.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">design a</text>
<text x="655" y="208.2" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">pricing model</text>
<rect x="750" y="110" width="160" height="130" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<text x="830" y="150" font-size="17" text-anchor="middle" font-weight="bold" fill="#FFFFFF">Dilemma</text>
<text x="830" y="190.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#FFFFFF">close a site or</text>
<text x="830" y="208.2" font-size="14" text-anchor="middle" font-weight="normal" fill="#FFFFFF">keep jobs?</text>
<line x1="50" y1="280" x2="910" y2="280" stroke="#222222" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="50" y="310" font-size="15" text-anchor="start" font-weight="bold" fill="#111111">WELL-STRUCTURED</text>
<text x="910" y="310" font-size="15" text-anchor="end" font-weight="bold" fill="#111111">ILL-STRUCTURED</text>
<text x="480" y="355" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Goal</text>
<text x="60" y="355" font-size="15" text-anchor="start" font-weight="normal" fill="#111111">clear</text>
<text x="900" y="355" font-size="15" text-anchor="end" font-weight="normal" fill="#111111">contested</text>
<line x1="165" y1="350" x2="430" y2="350" stroke="#333333" stroke-width="1.5" stroke-dasharray="2 4"/>
<line x1="530" y1="350" x2="822.5" y2="350" stroke="#333333" stroke-width="1.5" stroke-dasharray="2 4"/>
<text x="480" y="389" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Information</text>
<text x="60" y="389" font-size="15" text-anchor="start" font-weight="normal" fill="#111111">complete</text>
<text x="900" y="389" font-size="15" text-anchor="end" font-weight="normal" fill="#111111">incomplete</text>
<line x1="186" y1="384" x2="430" y2="384" stroke="#333333" stroke-width="1.5" stroke-dasharray="2 4"/>
<line x1="530" y1="384" x2="815.0" y2="384" stroke="#333333" stroke-width="1.5" stroke-dasharray="2 4"/>
<text x="480" y="423" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Method</text>
<text x="60" y="423" font-size="15" text-anchor="start" font-weight="normal" fill="#111111">known</text>
<text x="900" y="423" font-size="15" text-anchor="end" font-weight="normal" fill="#111111">must be invented</text>
<line x1="165" y1="418" x2="430" y2="418" stroke="#333333" stroke-width="1.5" stroke-dasharray="2 4"/>
<line x1="530" y1="418" x2="770.0" y2="418" stroke="#333333" stroke-width="1.5" stroke-dasharray="2 4"/>
<text x="480" y="457" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Answers</text>
<text x="60" y="457" font-size="15" text-anchor="start" font-weight="normal" fill="#111111">one right answer</text>
<text x="900" y="457" font-size="15" text-anchor="end" font-weight="normal" fill="#111111">several defensible</text>
<line x1="242" y1="452" x2="430" y2="452" stroke="#333333" stroke-width="1.5" stroke-dasharray="2 4"/>
<line x1="530" y1="452" x2="755.0" y2="452" stroke="#333333" stroke-width="1.5" stroke-dasharray="2 4"/>
<text x="480.0" y="505" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">PBL problems sit towards the right, matched to what learners already know.</text>
</svg>
