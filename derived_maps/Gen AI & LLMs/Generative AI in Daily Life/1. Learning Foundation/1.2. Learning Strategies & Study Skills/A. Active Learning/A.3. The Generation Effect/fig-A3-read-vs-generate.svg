<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Read versus generate over time</title>
<desc>Grouped bars at two test times. Generated items are remembered better than read items at both times, and the gap is larger after a delay.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">Remembering read and generated items</text>
<text x="480.0" y="64" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">The generation advantage persists, and tends to grow, with delay</text>
<line x1="120" y1="430" x2="860" y2="430" stroke="#333333" stroke-width="2"/>
<line x1="120" y1="430" x2="860" y2="430" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="120" y1="430" x2="120" y2="110" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="490.0" y="466" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111"></text>
<text x="90" y="270.0" font-size="15" text-anchor="middle" fill="#111111" transform="rotate(-90 90 270.0)">Proportion remembered</text>
<rect x="200" y="230" width="120" height="200" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
<rect x="238.2" y="202" width="43.6" height="23.5" fill="#FFFFFF" stroke="none"/>
<text x="260" y="218.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Read</text>
<rect x="340" y="180" width="120" height="250" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
<rect x="357.2" y="152" width="85.60000000000001" height="23.5" fill="#FFFFFF" stroke="none"/>
<text x="400" y="168.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Generated</text>
<text x="330" y="460" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">Immediate test</text>
<rect x="560" y="330" width="120" height="100" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
<rect x="598.2" y="302" width="43.6" height="23.5" fill="#FFFFFF" stroke="none"/>
<text x="620" y="318.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Read</text>
<rect x="700" y="260" width="120" height="170" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
<rect x="717.2" y="232" width="85.60000000000001" height="23.5" fill="#FFFFFF" stroke="none"/>
<text x="760" y="248.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Generated</text>
<text x="690" y="460" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">Test after a day or more</text>
<line x1="680" y1="330" x2="845" y2="330" stroke="#333333" stroke-width="1.5" stroke-dasharray="2 4"/>
<line x1="820" y1="260" x2="845" y2="260" stroke="#333333" stroke-width="1.5" stroke-dasharray="2 4"/>
<line x1="840" y1="328" x2="840" y2="262" stroke="#222222" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="850" y="300" font-size="14" text-anchor="start" font-weight="normal" fill="#111111">larger gap</text>
<line x1="320" y1="230" x2="485" y2="230" stroke="#333333" stroke-width="1.5" stroke-dasharray="2 4"/>
<line x1="460" y1="180" x2="485" y2="180" stroke="#333333" stroke-width="1.5" stroke-dasharray="2 4"/>
<line x1="480" y1="228" x2="480" y2="182" stroke="#222222" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="490" y="210" font-size="14" text-anchor="start" font-weight="normal" fill="#111111">gap</text>
<text x="480.0" y="520" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">Schematic; pattern summarised from meta-analyses (Bertsch et al., 2007; McCurdy et al., 2020), not plotted from one dataset.</text>
</svg>
