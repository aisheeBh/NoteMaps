<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Constraint on generation</title>
<desc>A horizontal spectrum from highly constrained generation tasks, which almost always succeed but strengthen little meaning, to open tasks, which risk failure but strengthen understanding if followed by feedback.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">How open should a generation task be?</text>
<line x1="80" y1="140" x2="880" y2="140" stroke="#222222" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="80" y="120" font-size="15" text-anchor="start" font-weight="bold" fill="#111111">HIGH CONSTRAINT</text>
<text x="880" y="120" font-size="15" text-anchor="end" font-weight="bold" fill="#111111">LOW CONSTRAINT</text>
<rect x="60" y="190" width="160" height="70" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="140.0" y="220.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">Fill a missing</text>
<text x="140.0" y="240.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">letter</text>
<rect x="250" y="190" width="160" height="70" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="330.0" y="220.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">Complete a</text>
<text x="330.0" y="240.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">definition</text>
<rect x="440" y="190" width="160" height="70" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="520.0" y="220.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">Give an</text>
<text x="520.0" y="240.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">example</text>
<rect x="630" y="190" width="160" height="70" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="710.0" y="220.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">Predict or</text>
<text x="710.0" y="240.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">explain why</text>
<text x="80" y="310" font-size="16" text-anchor="start" font-weight="bold" fill="#111111">Success:</text>
<text x="80" y="390" font-size="16" text-anchor="start" font-weight="bold" fill="#111111">Meaning processed:</text>
<circle cx="100" cy="335" r="7" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<circle cx="100" cy="415" r="7" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
