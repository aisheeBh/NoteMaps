<circle cx="330" cy="415" r="7" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<circle cx="350" cy="335" r="7" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<circle cx="350" cy="415" r="7" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<circle cx="370" cy="335" r="7" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<circle cx="370" cy="415" r="7" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<circle cx="480" cy="335" r="7" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<circle cx="480" cy="415" r="7" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<circle cx="500" cy="335" r="7" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<circle cx="500" cy="415" r="7" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<circle cx="520" cy="335" r="7" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<circle cx="520" cy="415" r="7" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<circle cx="540" cy="335" r="7" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<circle cx="540" cy="415" r="7" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<circle cx="560" cy="335" r="7" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<circle cx="560" cy="415" r="7" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
