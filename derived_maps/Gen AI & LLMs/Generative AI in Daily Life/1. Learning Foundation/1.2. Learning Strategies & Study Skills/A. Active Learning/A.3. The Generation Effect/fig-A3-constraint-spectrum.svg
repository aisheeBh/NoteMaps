<circle cx="730" cy="335" r="7" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<circle cx="730" cy="415" r="7" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<circle cx="750" cy="335" r="7" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<circle cx="750" cy="415" r="7" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<rect x="560" y="445" width="320" height="50" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
<text x="720.0" y="465.79999999999995" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">Best zone: meaningful and</text>
<text x="720.0" y="483.99999999999994" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">achievable, with feedback</text>
<line x1="620" y1="445" x2="560" y2="270" stroke="#222222" stroke-width="2" stroke-dasharray="10 6" marker-end="url(#arrow)"/>
<text x="480.0" y="510" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">Schematic ratings: filled circles show relative level.</text>
</svg>
