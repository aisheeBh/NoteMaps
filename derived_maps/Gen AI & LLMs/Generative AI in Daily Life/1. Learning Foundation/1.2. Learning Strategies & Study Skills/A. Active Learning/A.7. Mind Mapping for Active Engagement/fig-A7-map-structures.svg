<text x="795" y="390.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111111">cross-links</text>
<text x="795" y="420" font-size="17" text-anchor="middle" font-weight="bold" fill="#111111">NETWORK</text>
<text x="795" y="445.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">hierarchy plus</text>
<text x="795" y="464.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">cross-links between branches</text>
<text x="480.0" y="505" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">Mind maps are usually radial; concept maps are hierarchies with cross-links.</text>
