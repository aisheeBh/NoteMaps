<circle cx="165" cy="270" r="24" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<text x="165" y="420" font-size="17" text-anchor="middle" font-weight="bold" fill="#111111">RADIAL</text>
<text x="165" y="445.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">one centre;</text>
<text x="165" y="464.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">links unlabelled</text>
