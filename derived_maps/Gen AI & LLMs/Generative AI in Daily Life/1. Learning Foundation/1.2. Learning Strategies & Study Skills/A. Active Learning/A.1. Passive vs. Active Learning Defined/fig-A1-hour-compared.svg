<line x1="560" y1="360" x2="560" y2="368" stroke="#333333" stroke-width="1.5"/>
<text x="560" y="386" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">30</text>
<line x1="680" y1="360" x2="680" y2="368" stroke="#333333" stroke-width="1.5"/>
<text x="680" y="386" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">40</text>
<line x1="800" y1="360" x2="800" y2="368" stroke="#333333" stroke-width="1.5"/>
<text x="800" y="386" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">50</text>
<line x1="920" y1="360" x2="920" y2="368" stroke="#333333" stroke-width="1.5"/>
<text x="920" y="386" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">60</text>
<line x1="200" y1="360" x2="920" y2="360" stroke="#333333" stroke-width="1.5"/>
<text x="560" y="410" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">minutes</text>
<rect x="200" y="70" width="22" height="22" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
<text x="230" y="87" font-size="14" text-anchor="start" font-weight="normal" fill="#111111">learners receive</text>
<rect x="380" y="70" width="22" height="22" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
<text x="410" y="87" font-size="14" text-anchor="start" font-weight="normal" fill="#111111">learners produce</text>
<rect x="560" y="70" width="22" height="22" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
<text x="590" y="87" font-size="14" text-anchor="start" font-weight="normal" fill="#111111">feedback on learner thinking</text>
<text x="480.0" y="440" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">Illustrative session plans.</text>
