<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Retrieval practice compared with elaborative concept mapping</title>
  <desc>Schematic of Karpicke and Blunt (2011): on a test a week later, including inference questions, students who practised retrieval outperformed students who built concept maps with the text available, even though the mappers predicted they would do better.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
  </defs>

  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Elaborating with the book open did not beat recalling with it shut</text>

  <line x1="140" y1="420" x2="880" y2="420" stroke="#222222" stroke-width="2.5"/>
  <line x1="140" y1="420" x2="140" y2="80" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="90" y="250" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 90 250)">Score one week later</text>

  <rect x="260" y="250" width="160" height="170" fill="url(#dots)" stroke="#7A5200" stroke-width="2.5"/>
  <rect x="560" y="160" width="160" height="260" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>

  <g text-anchor="middle" fill="#111111">
    <text x="340" y="450" font-size="16" font-weight="bold">Elaborative concept mapping</text>
    <text x="340" y="470" font-size="14">built a map with the text open</text>
    <text x="640" y="450" font-size="16" font-weight="bold">Retrieval practice</text>
    <text x="640" y="470" font-size="14">recalled the text with it closed, twice</text>
  </g>

  <rect x="170" y="100" width="300" height="64" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
  <text x="182" y="124" font-size="14" fill="#111111">Mappers predicted they had learned</text>
  <text x="182" y="142" font-size="14" fill="#111111">more - the reverse of what the</text>
  <text x="182" y="160" font-size="14" fill="#111111">delayed test showed.</text>

  <text x="480" y="520" text-anchor="middle" font-size="13" fill="#333333">Schematic of the reported pattern; bar heights are illustrative, not data. The interpretation is debated.</text>
</svg>
