<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Narrative chaining compared with rehearsal</title>
  <desc>Schematic of Bower and Clark (1969): after learning twelve lists of ten words, people who linked each list into a story recalled the large majority of words at the end of the session, while people who rehearsed the words recalled only a small fraction. Immediately after each list, both groups recalled almost everything.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
  </defs>

  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Words linked into stories survive; rehearsed words do not</text>

  <line x1="140" y1="420" x2="880" y2="420" stroke="#222222" stroke-width="2.5"/>
  <line x1="140" y1="420" x2="140" y2="80" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="88" y="250" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 88 250)">Words recalled</text>

  <!-- immediate -->
  <text x="330" y="450" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Immediately after each list</text>
  <rect x="230" y="110" width="90" height="310" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <rect x="340" y="108" width="90" height="312" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <!-- end -->
  <text x="690" y="450" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">End of session, all 12 lists</text>
  <rect x="590" y="370" width="90" height="50" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <rect x="700" y="135" width="90" height="285" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>

  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="275" y="100">rehearsal</text>
    <text x="385" y="98">story</text>
    <text x="635" y="360">rehearsal</text>
    <text x="745" y="125">story</text>
  </g>

  <rect x="150" y="480" width="660" height="50" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
  <text x="164" y="502" font-size="14" fill="#111111">Story example: "A LUMBERJACK DARTED into a forest, where he met a QUEEN who handed him</text>
  <text x="164" y="520" font-size="14" fill="#111111">a SCROLL, which he used to light a FIRE..."  Each word becomes a cue for the next.</text>

  <text x="480" y="550" text-anchor="middle" font-size="13" fill="#333333">Schematic of the reported pattern; bar heights are illustrative, not data. Story wording invented.</text>
</svg>
