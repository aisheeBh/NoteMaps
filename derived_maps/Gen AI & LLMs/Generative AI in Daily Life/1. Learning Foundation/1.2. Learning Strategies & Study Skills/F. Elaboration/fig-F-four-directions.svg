<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Four directions of elaboration</title>
  <desc>A new idea at the centre with four directions of elaboration: downward to reasons and mechanisms, outward to prior knowledge and other domains, toward the concrete through examples, stories and images, and upward to the whole and its principles through explanation and comparison.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Four directions in which a new idea can be elaborated</text>

  <!-- centre -->
  <rect x="370" y="270" width="220" height="80" rx="12" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="480" y="302" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">NEW IDEA</text>
  <text x="480" y="326" text-anchor="middle" font-size="14" fill="#FFFFFF">"working capital"</text>

  <!-- up: principle -->
  <rect x="300" y="70" width="360" height="110" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="480" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">UP: TO THE WHOLE AND ITS PRINCIPLE</text>
  <text x="480" y="120" text-anchor="middle" font-size="14" fill="#111111">explain how it fits the business's cash cycle;</text>
  <text x="480" y="140" text-anchor="middle" font-size="14" fill="#111111">compare with long-term financing</text>
  <text x="480" y="162" text-anchor="middle" font-size="14" font-style="italic" fill="#111111">self-explanation, comparison, problem principles</text>

  <!-- down: reasons -->
  <rect x="300" y="440" width="360" height="110" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="480" y="466" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">DOWN: TO REASONS AND MECHANISMS</text>
  <text x="480" y="490" text-anchor="middle" font-size="14" fill="#111111">why do growing firms run short of cash?</text>
  <text x="480" y="510" text-anchor="middle" font-size="14" fill="#111111">how does slow invoicing tie up money?</text>
  <text x="480" y="532" text-anchor="middle" font-size="14" font-style="italic" fill="#111111">why and how questions, interrogation</text>

  <!-- left: prior knowledge -->
  <rect x="30" y="230" width="280" height="160" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="170" y="256" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">OUT: TO WHAT IS KNOWN</text>
  <text x="170" y="282" text-anchor="middle" font-size="14" fill="#111111">like a household waiting</text>
  <text x="170" y="302" text-anchor="middle" font-size="14" fill="#111111">for a salary while bills fall due;</text>
  <text x="170" y="322" text-anchor="middle" font-size="14" fill="#111111">my last project's late payments</text>
  <text x="170" y="350" text-anchor="middle" font-size="14" font-style="italic" fill="#111111">prior knowledge,</text>
  <text x="170" y="370" text-anchor="middle" font-size="14" font-style="italic" fill="#111111">analogy, self-reference</text>

  <!-- right: concrete -->
  <rect x="650" y="230" width="280" height="160" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="660" y="240" width="260" height="140" fill="#FFFFFF"/>
  <text x="790" y="264" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">ACROSS: TO THE CONCRETE</text>
  <text x="790" y="290" text-anchor="middle" font-size="14" fill="#111111">a bakery that sells on 60-day</text>
  <text x="790" y="310" text-anchor="middle" font-size="14" fill="#111111">terms but pays suppliers in 30;</text>
  <text x="790" y="330" text-anchor="middle" font-size="14" fill="#111111">a sketch of cash going round</text>
  <text x="790" y="358" text-anchor="middle" font-size="14" font-style="italic" fill="#111111">examples, stories, images</text>

  <g stroke="#222222" stroke-width="3">
    <line x1="480" y1="270" x2="480" y2="184" marker-end="url(#arrow)"/>
    <line x1="480" y1="350" x2="480" y2="436" marker-end="url(#arrow)"/>
    <line x1="370" y1="310" x2="314" y2="310" marker-end="url(#arrow)"/>
    <line x1="590" y1="310" x2="646" y2="310" marker-end="url(#arrow)"/>
  </g>

  <text x="480" y="595" text-anchor="middle" font-size="14" fill="#111111">Strong understanding usually needs movement in more than one direction.</text>
</svg>
