<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>A bare fact compared with an elaborated fact</title>
  <desc>Left: a newly read fact sits alone in memory with a single weak link. Right: after answering why it is true, the same fact is linked to several pieces of prior knowledge, giving many retrieval routes.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">The same fact, stored bare and stored with an explanation</text>

  <line x1="480" y1="70" x2="480" y2="500" stroke="#555555" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- LEFT: bare fact -->
  <text x="240" y="90" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">BARE FACT (read only)</text>
  <rect x="110" y="240" width="260" height="70" rx="10" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
  <rect x="122" y="252" width="236" height="46" fill="#FFFFFF"/>
  <text x="240" y="272" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Breaches must be reported</text>
  <text x="240" y="291" text-anchor="middle" font-size="15" fill="#111111">within 72 hours</text>
  <rect x="150" y="410" width="180" height="44" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="240" y="437" text-anchor="middle" font-size="15" fill="#111111">"page 14 of the policy"</text>
  <line x1="240" y1="310" x2="240" y2="410" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="240" y="490" text-anchor="middle" font-size="15" fill="#111111">One weak route back to the fact</text>

  <!-- RIGHT: elaborated fact -->
  <text x="720" y="90" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">ELABORATED FACT (asked why)</text>
  <rect x="590" y="250" width="260" height="70" rx="10" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
  <rect x="602" y="262" width="236" height="46" fill="#FFFFFF"/>
  <text x="720" y="282" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Breaches must be reported</text>
  <text x="720" y="301" text-anchor="middle" font-size="15" fill="#111111">within 72 hours</text>

  <g font-size="14" fill="#111111" text-anchor="middle">
    <rect x="505" y="120" width="190" height="56" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="2"/>
    <text x="600" y="143">stolen data is misused</text>
    <text x="600" y="162">fast, so delay harms people</text>
    <rect x="745" y="120" width="190" height="56" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="2"/>
    <text x="840" y="143">regulator needs time</text>
    <text x="840" y="162">to warn and contain</text>
    <rect x="505" y="390" width="190" height="56" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="2"/>
    <text x="600" y="413">three days is enough</text>
    <text x="600" y="432">to confirm a breach</text>
    <rect x="745" y="390" width="190" height="56" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="2"/>
    <text x="840" y="413">contrast: the clock is for</text>
    <text x="840" y="432">the regulator, not each person</text>
  </g>
  <line x1="600" y1="176" x2="660" y2="250" stroke="#1E5E24" stroke-width="3"/>
  <line x1="840" y1="176" x2="780" y2="250" stroke="#1E5E24" stroke-width="3"/>
  <line x1="600" y1="390" x2="660" y2="320" stroke="#1E5E24" stroke-width="3"/>
  <line x1="840" y1="390" x2="780" y2="320" stroke="#1E5E24" stroke-width="3"/>
  <text x="720" y="490" text-anchor="middle" font-size="15" fill="#111111">Four meaningful routes back to the fact</text>

  <text x="480" y="535" text-anchor="middle" font-size="13" fill="#333333">Schematic of memory links; the contents of the boxes are an illustrative explanation, not legal advice.</text>
</svg>
