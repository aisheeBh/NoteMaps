<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Context given before, after or not at all</title>
  <desc>Schematic of Bransford and Johnson (1972): a vague passage about washing clothes was understood and recalled far better when its topic was given before reading; giving the topic afterwards helped little compared with no topic.</desc>
  <defs>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Prior knowledge helps only if it is active while reading</text>

  <line x1="130" y1="430" x2="880" y2="430" stroke="#222222" stroke-width="2.5"/>
  <line x1="130" y1="430" x2="130" y2="80" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="80" y="255" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 80 255)">Ideas recalled from the passage</text>

  <rect x="200" y="340" width="140" height="90" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <rect x="420" y="325" width="140" height="105" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
  <rect x="640" y="140" width="140" height="290" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>

  <g text-anchor="middle" fill="#111111">
    <text x="270" y="460" font-size="16" font-weight="bold">No topic given</text>
    <text x="270" y="480" font-size="14">passage read cold</text>
    <text x="490" y="460" font-size="16" font-weight="bold">Topic given after</text>
    <text x="490" y="480" font-size="14">"it was about washing clothes"</text>
    <text x="710" y="460" font-size="16" font-weight="bold">Topic given before</text>
    <text x="710" y="480" font-size="14">knowledge active while reading</text>
  </g>

  <rect x="300" y="150" width="300" height="84" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
  <text x="314" y="174" font-size="14" fill="#111111">"First you arrange things into</text>
  <text x="314" y="194" font-size="14" fill="#111111">different groups... one pile may</text>
  <text x="314" y="214" font-size="14" fill="#111111">be sufficient..." (opening style)</text>

  <text x="480" y="535" text-anchor="middle" font-size="13" fill="#333333">Schematic of the reported pattern; bar heights are illustrative, not data. Passage wording paraphrased.</text>
</svg>
