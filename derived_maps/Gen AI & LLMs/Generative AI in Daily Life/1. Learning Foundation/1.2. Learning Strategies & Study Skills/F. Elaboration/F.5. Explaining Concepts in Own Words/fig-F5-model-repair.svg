<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Repairing a flawed mental model of the circulation</title>
  <desc>Left: a common flawed model in which blood leaves the heart, goes to the body and lungs in a single loop. Right: the correct double loop, heart to lungs and back, then heart to body and back. Self-explaining a text that contradicts the flawed model prompts the repair.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1F3B5C"/>
    </marker>
  </defs>

  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Self-explanation exposes and repairs a flawed mental model</text>

  <!-- LEFT flawed -->
  <text x="230" y="80" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">FLAWED MODEL: one loop</text>
  <rect x="160" y="250" width="140" height="56" rx="10" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="230" y="284" text-anchor="middle" font-size="16" fill="#111111">Heart</text>
  <rect x="60" y="120" width="130" height="50" rx="10" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="125" y="151" text-anchor="middle" font-size="15" fill="#111111">Body</text>
  <rect x="270" y="120" width="130" height="50" rx="10" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="335" y="151" text-anchor="middle" font-size="15" fill="#111111">Lungs</text>
  <path d="M200 250 L140 172" fill="none" stroke="#222222" stroke-width="2.5" stroke-dasharray="10 6" marker-end="url(#arrow)"/>
  <path d="M190 145 L268 145" fill="none" stroke="#222222" stroke-width="2.5" stroke-dasharray="10 6" marker-end="url(#arrow)"/>
  <path d="M330 172 L265 248" fill="none" stroke="#222222" stroke-width="2.5" stroke-dasharray="10 6" marker-end="url(#arrow)"/>
  <g font-size="14" fill="#111111">
    <text x="60" y="350">Text sentence: "The right side of the</text>
    <text x="60" y="370">heart pumps blood only to the lungs."</text>
    <text x="60" y="400" font-weight="bold">Self-explanation:</text>
    <text x="60" y="420">"That doesn't fit - in my picture the</text>
    <text x="60" y="440">blood goes to the body first. So there</text>
    <text x="60" y="460">must be two separate circuits."</text>
  </g>

  <!-- arrow between -->
  <line x1="440" y1="280" x2="520" y2="280" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="480" y="266" text-anchor="middle" font-size="14" fill="#111111">repair</text>

  <!-- RIGHT correct -->
  <text x="730" y="80" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">REPAIRED MODEL: two loops</text>
  <rect x="660" y="250" width="140" height="56" rx="10" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="730" y="284" text-anchor="middle" font-size="16" fill="#111111">Heart</text>
  <rect x="665" y="110" width="130" height="50" rx="10" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="730" y="141" text-anchor="middle" font-size="15" fill="#111111">Lungs</text>
  <rect x="665" y="400" width="130" height="50" rx="10" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="730" y="431" text-anchor="middle" font-size="15" fill="#111111">Body</text>
  <!-- lung loop -->
  <path d="M690 250 C 640 220, 640 190, 680 162" fill="none" stroke="#1F3B5C" stroke-width="3.5" marker-end="url(#arrowb)"/>
  <path d="M780 162 C 820 190, 820 220, 770 250" fill="none" stroke="#1F3B5C" stroke-width="3.5" marker-end="url(#arrowb)"/>
  <!-- body loop -->
  <path d="M770 306 C 830 340, 830 370, 780 398" fill="none" stroke="#1F3B5C" stroke-width="3.5" marker-end="url(#arrowb)"/>
  <path d="M680 398 C 630 370, 630 340, 690 308" fill="none" stroke="#1F3B5C" stroke-width="3.5" marker-end="url(#arrowb)"/>
  <g font-size="14" fill="#111111">
    <text x="840" y="200">lung</text>
    <text x="840" y="218">circuit</text>
    <text x="840" y="350">body</text>
    <text x="840" y="368">circuit</text>
  </g>

  <text x="480" y="530" text-anchor="middle" font-size="13" fill="#333333">Simplified illustration of the kind of model change described by Chi and colleagues; not an anatomical diagram.</text>
</svg>
