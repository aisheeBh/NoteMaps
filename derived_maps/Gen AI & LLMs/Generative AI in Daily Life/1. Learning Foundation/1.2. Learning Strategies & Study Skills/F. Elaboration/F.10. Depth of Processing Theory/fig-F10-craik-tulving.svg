<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Recognition by type of orienting question</title>
  <desc>Schematic of Craik and Tulving (1975): words judged for typeface case were recognised least, words judged for rhyme more, and words judged for fit in a sentence most; for the sentence question, words answered yes were recognised better than words answered no.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
  </defs>

  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Deeper questions about a word, better memory for it</text>

  <line x1="130" y1="420" x2="900" y2="420" stroke="#222222" stroke-width="2.5"/>
  <line x1="130" y1="420" x2="130" y2="80" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="80" y="250" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 80 250)">Words recognised later</text>

  <!-- case -->
  <rect x="180" y="375" width="80" height="45" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="270" y="385" width="80" height="35" fill="#FFFFFF" stroke="#222222" stroke-width="2" stroke-dasharray="10 6"/>
  <!-- rhyme -->
  <rect x="430" y="280" width="80" height="140" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="520" y="320" width="80" height="100" fill="#FFFFFF" stroke="#222222" stroke-width="2" stroke-dasharray="10 6"/>
  <!-- sentence -->
  <rect x="680" y="130" width="80" height="290" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="770" y="250" width="80" height="170" fill="#FFFFFF" stroke="#222222" stroke-width="2" stroke-dasharray="10 6"/>

  <g text-anchor="middle" fill="#111111">
    <text x="265" y="448" font-size="15" font-weight="bold">CASE</text>
    <text x="265" y="468" font-size="14">"Is it in capitals?"</text>
    <text x="515" y="448" font-size="15" font-weight="bold">RHYME</text>
    <text x="515" y="468" font-size="14">"Rhymes with WEIGHT?"</text>
    <text x="765" y="448" font-size="15" font-weight="bold">SENTENCE</text>
    <text x="765" y="468" font-size="14">"Fits: He met a ___ in the street?"</text>
    <text x="220" y="368" font-size="14">yes</text>
    <text x="310" y="378" font-size="14">no</text>
    <text x="470" y="272" font-size="14">yes</text>
    <text x="560" y="312" font-size="14">no</text>
    <text x="720" y="122" font-size="14">yes</text>
    <text x="810" y="242" font-size="14">no</text>
  </g>

  <rect x="170" y="110" width="330" height="64" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
  <text x="182" y="134" font-size="14" fill="#111111">"Yes" answers to the sentence question</text>
  <text x="182" y="152" font-size="14" fill="#111111">link the word into a meaningful whole -</text>
  <text x="182" y="170" font-size="14" fill="#111111">elaboration, not just depth.</text>

  <text x="480" y="540" text-anchor="middle" font-size="13" fill="#333333">Schematic of the reported pattern; bar heights are illustrative, not data.</text>
</svg>
