<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>German two-way prepositions</title>
  <desc>Decision diagram: a two-way preposition such as in, an, auf. If the sentence describes movement towards a place, use the accusative (den, die, das). If it describes location, use the dative (dem, der, dem).</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="38" font-size="24" text-anchor="middle" fill="#111111" font-weight="bold">One preposition, two cases: the meaning decides</text>
  <rect x="330" y="70" width="300" height="70" rx="0" fill="#FFFFFF" stroke="#222222" stroke-width="2.5"/>
  <text x="480.0" y="102.0" font-size="17" text-anchor="middle" fill="#111111" font-weight="bold">in, an, auf, über, unter ...</text>
  <text x="480.0" y="125.0" font-size="14" text-anchor="middle" fill="#111111">two-way preposition</text>
  <line x1="400" y1="140" x2="230" y2="200" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="140" x2="730" y2="200" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="270" y="170" font-size="15" text-anchor="end" fill="#111111" font-weight="bold">Wohin? (where to?)</text>
  <text x="690" y="170" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">Wo? (where?)</text>
  <rect x="60" y="205" width="360" height="120" rx="0" fill="url(#dots)" stroke="#222222" stroke-width="1.5"/>
  <rect x="91.6" y="232.5" width="296.8" height="69" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="240.0" y="251.5" font-size="17" text-anchor="middle" fill="#111111" font-weight="bold">Movement towards a place</text>
  <text x="240.0" y="275.5" font-size="15" text-anchor="middle" fill="#111111">ACCUSATIVE</text>
  <text x="240.0" y="295.5" font-size="15" text-anchor="middle" fill="#111111">den (masc.), die (fem.), das (neut.)</text>
  <rect x="540" y="205" width="360" height="120" rx="0" fill="url(#hatch)" stroke="#222222" stroke-width="2.5"/>
  <rect x="571.6" y="232.5" width="296.8" height="69" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="720.0" y="251.5" font-size="17" text-anchor="middle" fill="#111111" font-weight="bold">Location</text>
  <text x="720.0" y="275.5" font-size="15" text-anchor="middle" fill="#111111">DATIVE</text>
  <text x="720.0" y="295.5" font-size="15" text-anchor="middle" fill="#111111">dem (masc.), der (fem.), dem (neut.)</text>
  <rect x="60" y="350" width="360" height="110" rx="0" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="240.0" y="391.0" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Ich lege das Buch</text>
  <text x="240.0" y="415.0" font-size="15" text-anchor="middle" fill="#111111">auf den Tisch.</text>
  <text x="240.0" y="435.0" font-size="15" text-anchor="middle" fill="#111111">(I put the book onto the table)</text>
  <rect x="540" y="350" width="360" height="110" rx="0" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="720.0" y="391.0" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Das Buch liegt</text>
  <text x="720.0" y="415.0" font-size="15" text-anchor="middle" fill="#111111">auf dem Tisch.</text>
  <text x="720.0" y="435.0" font-size="15" text-anchor="middle" fill="#111111">(The book lies on the table)</text>
</svg>
