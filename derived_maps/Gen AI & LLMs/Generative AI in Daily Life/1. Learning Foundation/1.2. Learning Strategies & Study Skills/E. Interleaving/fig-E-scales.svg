<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Nested scales</title>
  <desc>Nested rectangles from career and organisation, to course and curriculum, to days and weeks, to session, to item order.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="38" font-size="24" text-anchor="middle" fill="#111111" font-weight="bold">Interleaving at nested scales</text>
  <rect x="60.0" y="70" width="840.0" height="460" rx="0" fill="#FFFFFF" stroke="#222222" stroke-width="2.0"/>
  <rect x="72.0" y="78" width="542.9000000000001" height="34" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="82.0" y="100" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">Career and organisation: role rotation, cross-domain comparison</text>
  <rect x="136.8" y="118" width="686.4" height="364" rx="0" fill="url(#dots)" stroke="#222222" stroke-width="2.0"/>
  <rect x="148.8" y="126" width="501.40000000000003" height="34" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="158.8" y="148" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">Course and curriculum: cumulative tests, spiral revisiting</text>
  <rect x="213.60000000000002" y="166" width="532.8" height="268" rx="0" fill="#F2F2F2" stroke="#222222" stroke-width="2.0"/>
  <rect x="225.60000000000002" y="174" width="443.3" height="34" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="235.60000000000002" y="196" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">Days and weeks: rotations, mixed-review assignments</text>
  <rect x="290.4" y="214" width="379.2" height="172" rx="0" fill="url(#hatch)" stroke="#222222" stroke-width="2.0"/>
  <rect x="302.4" y="222" width="352.0" height="34" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="312.4" y="244" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">Session: short block, mixed core, review</text>
  <rect x="367.20000000000005" y="262" width="225.5999999999999" height="76" rx="0" fill="#FFFFFF" stroke="#222222" stroke-width="3.5"/>
  <rect x="379.20000000000005" y="270" width="103.0" height="34" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="389.20000000000005" y="292" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">Item order</text>
  <rect x="378" y="300" width="30" height="30" rx="0" fill="url(#hatch)" stroke="#222222" stroke-width="1.5"/>
  <rect x="383.0" y="304.0" width="20" height="22" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="393.0" y="321.0" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">A</text>
  <rect x="412" y="300" width="30" height="30" rx="0" fill="url(#cross)" stroke="#222222" stroke-width="1.5"/>
  <rect x="417.0" y="304.0" width="20" height="22" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="427.0" y="321.0" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">C</text>
  <rect x="446" y="300" width="30" height="30" rx="0" fill="url(#dots)" stroke="#222222" stroke-width="1.5"/>
  <rect x="451.0" y="304.0" width="20" height="22" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="461.0" y="321.0" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">B</text>
  <rect x="480" y="300" width="30" height="30" rx="0" fill="url(#hatch)" stroke="#222222" stroke-width="1.5"/>
  <rect x="485.0" y="304.0" width="20" height="22" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="495.0" y="321.0" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">A</text>
  <rect x="514" y="300" width="30" height="30" rx="0" fill="url(#dots)" stroke="#222222" stroke-width="1.5"/>
  <rect x="519.0" y="304.0" width="20" height="22" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="529.0" y="321.0" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">B</text>
  <rect x="548" y="300" width="30" height="30" rx="0" fill="url(#cross)" stroke="#222222" stroke-width="1.5"/>
  <rect x="553.0" y="304.0" width="20" height="22" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="563.0" y="321.0" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">C</text>
  <text x="480.0" y="548" font-size="13" text-anchor="middle" fill="#333333">Each scale adds its own design decisions; the principles of mixing confusable types remain the same.</text>
</svg>
