  <text x="474.1666666666667" y="300" font-size="14" text-anchor="middle" fill="#111111">Week 3</text>
  <text x="595.8333333333333" y="300" font-size="14" text-anchor="middle" fill="#111111">Week 4</text>
  <text x="717.5" y="300" font-size="14" text-anchor="middle" fill="#111111">Week 5</text>
  <text x="839.1666666666666" y="300" font-size="14" text-anchor="middle" fill="#111111">Week 6</text>
  <line x1="466.0" y1="160" x2="896" y2="160" stroke="#222222" stroke-width="2" stroke-dasharray="10 6"/>
  <rect x="500" y="146" width="300" height="26" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
  <text x="650" y="165" font-size="15" text-anchor="middle" fill="#111111" font-weight="bold">more than three weeks with no study</text>
  <text x="316.0" y="180" font-size="15" text-anchor="middle" fill="#111111">intense burst</text>
  <rect x="170" y="330" width="26" height="20" rx="0" fill="url(#hatch)" stroke="#222222" stroke-width="1.5"/>
  <text x="206" y="346" font-size="15" text-anchor="start" fill="#111111">a day on which economics is studied</text>
  <text x="900" y="346" font-size="15" text-anchor="end" fill="#111111" font-style="italic">exam at end of week 6</text>
  <text x="480" y="400" font-size="16" text-anchor="middle" fill="#111111">Same total days of economics in both plans; only their distribution differs.</text>
  <text x="480.0" y="450" font-size="13" text-anchor="middle" fill="#333333">Illustrative schedule.</text>
