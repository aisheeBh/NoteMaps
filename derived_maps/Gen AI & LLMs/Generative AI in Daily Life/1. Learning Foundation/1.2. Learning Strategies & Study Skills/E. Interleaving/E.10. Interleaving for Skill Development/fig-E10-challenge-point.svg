  <line x1="326.0" y1="420" x2="326.0" y2="165.0" stroke="#222222" stroke-width="1.5" stroke-dasharray="2 4"/>
  <line x1="599.6" y1="420" x2="599.6" y2="114.0" stroke="#222222" stroke-width="1.5" stroke-dasharray="2 4"/>
  <rect x="206.0" y="107.0" width="200" height="44" rx="0" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="216.0" y="127.0" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">Beginner</text>
  <text x="216.0" y="145.0" font-size="14" text-anchor="start" fill="#111111">peak at low interference</text>
  <rect x="700" y="66" width="220" height="44" rx="0" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="710" y="86" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">Skilled learner</text>
  <text x="710" y="104" font-size="14" text-anchor="start" fill="#111111">peak at high interference</text>
  <text x="130" y="410" font-size="14" text-anchor="start" fill="#111111" font-style="italic">too easy</text>
  <text x="810" y="410" font-size="14" text-anchor="end" fill="#111111" font-style="italic">too hard</text>
  <text x="480.0" y="525" font-size="13" text-anchor="middle" fill="#333333">Schematic after Guadagnoli and Lee's challenge point framework; not plotted from data.</text>
</svg>
