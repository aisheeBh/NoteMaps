<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Share of clicks by result position</title>
  <desc>A bar chart of the schematic share of clicks received by organic results in positions 1 to 10 on a results page. Position 1 receives by far the largest share; positions 2 and 3 receive much less; from position 6 onwards each receives only a small share. A note explains that the exact numbers vary by query type, device and page layout.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" fill="#111111" font-weight="bold">Most clicks go to the first few results</text>
  <line x1="110" y1="440" x2="880" y2="440" stroke="#222222" stroke-width="2.5"/>
  <line x1="110" y1="440" x2="110" y2="80" stroke="#222222" stroke-width="2.5"/>
  <text x="60" y="265" text-anchor="middle" font-size="15" fill="#111111" transform="rotate(-90 60 265)">Relative clicks (position 1 = 100)</text>
  <rect x="122" y="90.0" width="62" height="350.0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="153" y="462" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">1</text>
  <rect x="137.45" y="65" width="31.1" height="22" fill="#FFFFFF"/>
  <text x="153" y="80" text-anchor="middle" font-size="14" fill="#111111">100</text>
  <rect x="198" y="258.0" width="62" height="182.0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="229" y="462" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">2</text>
  <rect x="217.3" y="233" width="23.4" height="22" fill="#FFFFFF"/>
  <text x="229" y="248" text-anchor="middle" font-size="14" fill="#111111">52</text>
  <rect x="274" y="321.0" width="62" height="119.0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="305" y="462" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">3</text>
  <rect x="293.3" y="296" width="23.4" height="22" fill="#FFFFFF"/>
  <text x="305" y="311" text-anchor="middle" font-size="14" fill="#111111">34</text>
  <rect x="350" y="356.0" width="62" height="84.0" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="381" y="462" text-anchor="middle" font-size="15" fill="#111111">4</text>
  <rect x="369.3" y="331" width="23.4" height="22" fill="#FFFFFF"/>
  <text x="381" y="346" text-anchor="middle" font-size="14" fill="#111111">24</text>
  <rect x="426" y="377.0" width="62" height="63.0" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="457" y="462" text-anchor="middle" font-size="15" fill="#111111">5</text>
  <rect x="445.3" y="352" width="23.4" height="22" fill="#FFFFFF"/>
  <text x="457" y="367" text-anchor="middle" font-size="14" fill="#111111">18</text>
  <rect x="502" y="391.0" width="62" height="49.0" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="533" y="462" text-anchor="middle" font-size="15" fill="#111111">6</text>
  <rect x="521.3" y="366" width="23.4" height="22" fill="#FFFFFF"/>
  <text x="533" y="381" text-anchor="middle" font-size="14" fill="#111111">14</text>
  <rect x="578" y="401.5" width="62" height="38.5" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="609" y="462" text-anchor="middle" font-size="15" fill="#111111">7</text>
  <rect x="597.3" y="376.5" width="23.4" height="22" fill="#FFFFFF"/>
  <text x="609" y="391.5" text-anchor="middle" font-size="14" fill="#111111">11</text>
  <rect x="654" y="408.5" width="62" height="31.5" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="685" y="462" text-anchor="middle" font-size="15" fill="#111111">8</text>
  <rect x="677.15" y="383.5" width="15.7" height="22" fill="#FFFFFF"/>
  <text x="685" y="398.5" text-anchor="middle" font-size="14" fill="#111111">9</text>
  <rect x="730" y="412.0" width="62" height="28.0" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="761" y="462" text-anchor="middle" font-size="15" fill="#111111">9</text>
  <rect x="753.15" y="387" width="15.7" height="22" fill="#FFFFFF"/>
  <text x="761" y="402" text-anchor="middle" font-size="14" fill="#111111">8</text>
  <rect x="806" y="415.5" width="62" height="24.5" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="837" y="462" text-anchor="middle" font-size="15" fill="#111111">10</text>
  <rect x="829.15" y="390.5" width="15.7" height="22" fill="#FFFFFF"/>
  <text x="837" y="405.5" text-anchor="middle" font-size="14" fill="#111111">7</text>
  <text x="490" y="490" text-anchor="middle" font-size="15" fill="#111111">Position on the first results page</text>
  <rect x="614.2" y="134" width="171.6" height="44" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="700" y="150" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Top three positions</text>
  <text x="700" y="169" text-anchor="middle" font-size="15" fill="#111111">take most clicks</text>
  <text x="480" y="522" text-anchor="middle" font-size="13" fill="#333333">Schematic; not plotted from a single dataset. Real shares vary by query, device and page features such as adverts.</text>
</svg>
