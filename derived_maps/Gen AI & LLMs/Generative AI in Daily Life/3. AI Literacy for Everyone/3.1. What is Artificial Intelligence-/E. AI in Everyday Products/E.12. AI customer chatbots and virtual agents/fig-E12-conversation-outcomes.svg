<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Outcomes of 100 conversations with a virtual agent</title>
  <desc>Two stacked bars each represent 100 conversations. In the containment view the bar shows 70 contained and 30 escalated, suggesting success. In the outcome view the same 70 contained conversations split into 42 resolved and 28 unresolved, where the customer gave up or came back later, while the 30 escalated conversations were handled by humans.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" fill="#111111" font-weight="bold">Contained is not the same as resolved</text>
  <text x="120" y="96" text-anchor="start" font-size="17" fill="#111111" font-weight="bold">What the containment rate shows</text>
  <rect x="120.0" y="110" width="518.0" height="70" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="325.5" y="136" width="107" height="23" fill="#FFFFFF"/>
  <text x="379" y="152" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">70 contained</text>
  <rect x="638.0" y="110" width="222.0" height="70" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2.5"/>
  <rect x="695.5" y="136" width="107" height="23" fill="#FFFFFF"/>
  <text x="749" y="152" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">30 escalated</text>
  <text x="120" y="256" text-anchor="start" font-size="17" fill="#111111" font-weight="bold">What customers experienced</text>
  <rect x="120.0" y="270" width="310.8" height="70" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="226.025" y="296" width="98.75" height="23" fill="#FFFFFF"/>
  <text x="275.4" y="312" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">42 resolved</text>
  <rect x="430.8" y="270" width="207.2" height="70" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="476.775" y="296" width="115.25" height="23" fill="#FFFFFF"/>
  <text x="534.4" y="312" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">28 unresolved</text>
  <rect x="638.0" y="270" width="222.0" height="70" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2.5"/>
  <rect x="695.5" y="296" width="107" height="23" fill="#FFFFFF"/>
  <text x="749" y="312" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">30 escalated</text>
  <path d="M534.4 360 L534.4 400" fill="none" stroke="#222222" stroke-width="2"/>
  <rect x="415" y="409" width="238.8" height="44" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
  <text x="534.4" y="425" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Gave up, or contacted again</text>
  <text x="534.4" y="444" text-anchor="middle" font-size="15" fill="#111111">by phone or e-mail later</text>
  <text x="480" y="505" text-anchor="middle" font-size="13" fill="#333333">Illustrative figures matching the worked example; real proportions vary by service and design.</text>
</svg>
