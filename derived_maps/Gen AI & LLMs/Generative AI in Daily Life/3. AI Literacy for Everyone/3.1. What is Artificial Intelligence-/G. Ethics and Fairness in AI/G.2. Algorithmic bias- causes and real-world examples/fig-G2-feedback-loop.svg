<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>A self-reinforcing feedback loop</title>
  <desc>Four boxes arranged in a cycle: the model flags a group or area; more attention is directed there; more incidents are recorded there because of that attention; the model is retrained on the new records and becomes more confident. A side note explains that areas receiving less attention record fewer incidents and appear safer.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">A feedback loop: the model creates the data that confirms it</text>

  <rect x="330" y="66" width="300" height="96" rx="10" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="480" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">1. Model flags an area</text>
  <text x="480" y="124" text-anchor="middle" font-size="14" fill="#FFFFFF">or group as higher risk</text>
  <text x="480" y="144" text-anchor="middle" font-size="14" fill="#FFFFFF">(perhaps from biased history)</text>

  <rect x="620" y="236" width="300" height="96" rx="10" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="770" y="270" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">2. More attention there</text>
  <text x="770" y="294" text-anchor="middle" font-size="14" fill="#111111">extra inspections, patrols</text>
  <text x="770" y="314" text-anchor="middle" font-size="14" fill="#111111">or investigations</text>

  <rect x="330" y="404" width="300" height="96" rx="10" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="480" y="438" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">3. More incidents recorded</text>
  <text x="480" y="462" text-anchor="middle" font-size="14" fill="#111111">because more people looked,</text>
  <text x="480" y="482" text-anchor="middle" font-size="14" fill="#111111">not necessarily more occurred</text>

  <rect x="40" y="236" width="300" height="96" rx="10" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="190" y="270" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">4. Model retrained</text>
  <text x="190" y="294" text-anchor="middle" font-size="14" fill="#111111">on the new records and becomes</text>
  <text x="190" y="314" text-anchor="middle" font-size="14" fill="#111111">more confident in step 1</text>

  <g stroke="#222222" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M630 130 Q 740 150 765 232"/>
    <path d="M765 336 Q 740 430 634 450"/>
    <path d="M326 450 Q 220 430 195 336"/>
    <path d="M195 232 Q 220 150 326 130"/>
  </g>

  <rect x="395" y="230" width="170" height="108" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
  <text x="480" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Self-reinforcing</text>
  <text x="480" y="286" text-anchor="middle" font-size="14" fill="#111111">each turn makes</text>
  <text x="480" y="306" text-anchor="middle" font-size="14" fill="#111111">the pattern look</text>
  <text x="480" y="326" text-anchor="middle" font-size="14" fill="#111111">more justified</text>

  <rect x="120" y="524" width="720" height="44" fill="#F2F2F2" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="480" y="552" text-anchor="middle" font-size="14" fill="#111111">Meanwhile, places given less attention record fewer incidents and appear safer than they are.</text>
  <text x="480" y="590" text-anchor="middle" font-size="13" fill="#333333">Schematic of a general mechanism; not drawn from a single dataset.</text>
</svg>
