<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Under-represented groups in training data receive higher error rates</title>
  <desc>Left: for three groups, paired bars compare each group's share of the training data with its share of the people the system will serve. Group A is over-represented; groups B and C are under-represented. Right: error rates rise from Group A to Group C.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
  </defs>
  <text x="480" y="40" font-size="22" font-weight="bold" fill="#111111" text-anchor="middle">Who is in the data shapes whom the model serves well</text>
  <text x="250" y="80" font-size="17" font-weight="bold" fill="#111111" text-anchor="middle">Share of training data and of users</text>
  <text x="730" y="80" font-size="17" font-weight="bold" fill="#111111" text-anchor="middle">Error rate of the model</text>
  <line x1="60" y1="420" x2="460" y2="420" stroke="#222222" stroke-width="2"/>
  <line x1="560" y1="420" x2="900" y2="420" stroke="#222222" stroke-width="2"/>
  <rect x="80" y="140" width="48" height="280" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="134" y="220" width="48" height="200" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
  <text x="104" y="132" font-size="15" fill="#111111" text-anchor="middle">70%</text>
  <text x="158" y="212" font-size="15" fill="#111111" text-anchor="middle">50%</text>
  <text x="131" y="444" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">Group A</text>
  <rect x="600" y="360" width="64" height="60" fill="url(#lines)" stroke="#8B0000" stroke-width="2"/>
  <text x="632" y="352" font-size="15" fill="#111111" text-anchor="middle">4%</text>
  <text x="632" y="444" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">Group A</text>
  <rect x="210" y="340" width="48" height="80" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="264" y="300" width="48" height="120" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
  <text x="234" y="332" font-size="15" fill="#111111" text-anchor="middle">20%</text>
  <text x="288" y="292" font-size="15" fill="#111111" text-anchor="middle">30%</text>
  <text x="261" y="444" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">Group B</text>
  <rect x="705" y="285" width="64" height="135" fill="url(#lines)" stroke="#8B0000" stroke-width="2"/>
  <text x="737" y="277" font-size="15" fill="#111111" text-anchor="middle">9%</text>
  <text x="737" y="444" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">Group B</text>
  <rect x="340" y="380" width="48" height="40" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="394" y="340" width="48" height="80" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
  <text x="364" y="372" font-size="15" fill="#111111" text-anchor="middle">10%</text>
  <text x="418" y="332" font-size="15" fill="#111111" text-anchor="middle">20%</text>
  <text x="391" y="444" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">Group C</text>
  <rect x="810" y="165" width="64" height="255" fill="url(#lines)" stroke="#8B0000" stroke-width="2"/>
  <text x="842" y="157" font-size="15" fill="#111111" text-anchor="middle">17%</text>
  <text x="842" y="444" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">Group C</text>
  <g font-size="15" fill="#111111">
    <rect x="80" y="470" width="22" height="18" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/><text x="110" y="484">Share of training data</text>
    <rect x="80" y="498" width="22" height="18" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/><text x="110" y="512">Share of people served</text>
  </g>
  <text x="730" y="484" font-size="15" fill="#111111" text-anchor="middle">Fewer examples of a group:</text>
  <text x="730" y="504" font-size="15" fill="#111111" text-anchor="middle">more errors for that group</text>
  <text x="480" y="560" font-size="13" fill="#333333" text-anchor="middle">Illustrative figures.</text>
</svg>
