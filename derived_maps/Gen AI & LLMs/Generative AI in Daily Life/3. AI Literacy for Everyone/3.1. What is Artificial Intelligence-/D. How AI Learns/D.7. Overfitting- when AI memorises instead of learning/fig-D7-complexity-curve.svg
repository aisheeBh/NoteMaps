  <rect x="422" y="304" width="150" height="46" fill="#FFFFFF" stroke="#555555" stroke-width="1.5"/>
  <text x="497" y="324" font-size="15" fill="#111111" text-anchor="middle">Best balance:</text>
  <text x="497" y="343" font-size="15" fill="#111111" text-anchor="middle">lowest new-data error</text>
  <rect x="150" y="100" width="200" height="30" fill="#FFFFFF"/>
  <text x="250" y="121" font-size="17" font-weight="bold" fill="#111111" text-anchor="middle">Underfitting</text>
  <text x="679" y="121" font-size="17" font-weight="bold" fill="#111111" text-anchor="middle">Overfitting</text>
  <rect x="700" y="197" width="170" height="26" fill="#FFFFFF"/>
  <text x="710" y="216" font-size="16" fill="#111111">Error on new data</text>
  <text x="700" y="411" font-size="16" fill="#111111">Error on training data</text>
  <text x="679" y="321" font-size="15" fill="#111111" text-anchor="middle">widening gap = memorising</text>
  <text x="480" y="540" font-size="13" fill="#333333" text-anchor="middle">Schematic; the classical picture. Very large modern networks can show a second fall in new-data error.</text>
</svg>
