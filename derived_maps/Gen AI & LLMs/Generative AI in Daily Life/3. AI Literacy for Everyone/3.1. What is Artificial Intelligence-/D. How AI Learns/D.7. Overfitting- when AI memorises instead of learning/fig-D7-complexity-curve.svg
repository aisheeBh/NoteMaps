  <line x1="120" y1="420" x2="880" y2="420" stroke="#222222" stroke-width="2"/>
  <text x="60" y="255" font-size="16" fill="#111111" text-anchor="middle" transform="rotate(-90 60 255)">Error</text>
  <text x="490" y="455" font-size="16" fill="#111111" text-anchor="middle">Model flexibility (more parameters, more features, longer training)</text>
