<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Training and new-data error as model flexibility increases</title>
  <desc>As a model becomes more flexible, error on training data keeps falling. Error on new data falls at first, reaches a minimum and then rises. The region left of the minimum is underfitting; the region right of it is overfitting.</desc>
  <text x="480" y="40" font-size="22" font-weight="bold" fill="#111111" text-anchor="middle">More flexibility always helps on training data, not on new data</text>
