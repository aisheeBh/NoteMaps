<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The effect of the learning rate on gradient descent</title>
  <desc>Three panels each show a bowl-shaped error curve and the steps taken downhill. With a learning rate that is too small, many tiny steps make slow progress. With a suitable rate, a few steps reach the bottom. With a rate that is too large, steps overshoot and bounce higher up the opposite side.</desc>
