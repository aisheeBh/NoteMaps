  <text x="480" y="448" font-size="16" fill="#111111" text-anchor="middle">Across: the value of one adjustable parameter. Up: the error it produces.</text>
  <rect x="60" y="466" width="840" height="50" fill="#FFFFFF" stroke="#555555" stroke-width="1.5"/>
  <text x="480" y="488" font-size="15" fill="#111111" text-anchor="middle">Each step moves against the slope by an amount set by the learning rate.</text>
  <text x="480" y="508" font-size="15" fill="#111111" text-anchor="middle">Real models adjust millions or billions of parameters at once, but the trade-off is the same.</text>
