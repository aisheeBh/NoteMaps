<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Occupations by overlap with what AI assistants do</title>
  <desc>A horizontal spectrum from low overlap on the left to high overlap on the right. Low: roofers and pile-driver operators, nursing assistants and phlebotomists, care workers, electricians and plumbers. Middle: nurses, teachers, managers. High: customer-service representatives, writers and editors, interpreters and translators.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" font-size="22" text-anchor="middle" fill="#111111" font-weight="bold">Overlap between occupations and current AI assistant tasks</text>
  <text x="80" y="80" font-size="16" text-anchor="start" fill="#111111" font-weight="bold">Low overlap: physical and hands-on care</text>
  <text x="880" y="80" font-size="16" text-anchor="end" fill="#111111" font-weight="bold">High overlap: information and writing</text>
  <line x1="90" y1="96" x2="870" y2="96" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="80" y="194" width="800" height="32" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <line x1="112" y1="194" x2="112" y2="180" stroke="#333333" stroke-width="1.5"/>
  <rect x="32" y="113" width="160" height="67" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="112" y="133" font-size="15" text-anchor="middle" fill="#111111">Roofers,</text>
  <text x="112" y="152" font-size="15" text-anchor="middle" fill="#111111">pile-driver</text>
  <text x="112" y="171" font-size="15" text-anchor="middle" fill="#111111">operators</text>
  <circle cx="112" cy="210" r="7" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="200" y1="226" x2="200" y2="240" stroke="#333333" stroke-width="1.5"/>
  <rect x="120" y="240" width="160" height="67" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="200" y="260" font-size="15" text-anchor="middle" fill="#111111">Nursing</text>
  <text x="200" y="279" font-size="15" text-anchor="middle" fill="#111111">assistants,</text>
  <text x="200" y="298" font-size="15" text-anchor="middle" fill="#111111">phlebotomists</text>
  <circle cx="200" cy="210" r="7" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="296" y1="194" x2="296" y2="180" stroke="#333333" stroke-width="1.5"/>
  <rect x="216" y="132" width="160" height="48" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="296" y="152" font-size="15" text-anchor="middle" fill="#111111">Electricians,</text>
  <text x="296" y="171" font-size="15" text-anchor="middle" fill="#111111">plumbers</text>
  <circle cx="296" cy="210" r="7" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="384" y1="226" x2="384" y2="240" stroke="#333333" stroke-width="1.5"/>
  <rect x="304" y="240" width="160" height="29" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="384" y="260" font-size="15" text-anchor="middle" fill="#111111">Care workers</text>
  <circle cx="384" cy="210" r="7" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="480" y1="194" x2="480" y2="180" stroke="#333333" stroke-width="1.5"/>
  <rect x="400" y="151" width="160" height="29" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="480" y="171" font-size="15" text-anchor="middle" fill="#111111">Nurses, teachers</text>
  <circle cx="480" cy="210" r="7" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="560" y1="226" x2="560" y2="240" stroke="#333333" stroke-width="1.5"/>
  <rect x="480" y="240" width="160" height="29" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="560" y="260" font-size="15" text-anchor="middle" fill="#111111">Managers</text>
  <circle cx="560" cy="210" r="7" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="664" y1="194" x2="664" y2="180" stroke="#333333" stroke-width="1.5"/>
  <rect x="584" y="132" width="160" height="48" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="664" y="152" font-size="15" text-anchor="middle" fill="#111111">Customer-service</text>
  <text x="664" y="171" font-size="15" text-anchor="middle" fill="#111111">agents</text>
  <circle cx="664" cy="210" r="7" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="752" y1="226" x2="752" y2="240" stroke="#333333" stroke-width="1.5"/>
  <rect x="672" y="240" width="160" height="48" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="752" y="260" font-size="15" text-anchor="middle" fill="#111111">Writers and</text>
  <text x="752" y="279" font-size="15" text-anchor="middle" fill="#111111">editors</text>
  <circle cx="752" cy="210" r="7" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="848" y1="194" x2="848" y2="180" stroke="#333333" stroke-width="1.5"/>
  <rect x="768" y="132" width="160" height="48" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="848" y="152" font-size="15" text-anchor="middle" fill="#111111">Interpreters and</text>
  <text x="848" y="171" font-size="15" text-anchor="middle" fill="#111111">translators</text>
  <circle cx="848" cy="210" r="7" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
  <text x="480" y="404" font-size="13" text-anchor="middle" fill="#333333">Schematic ordering based on published usage-based studies (2025); overlap is not a forecast of job loss.</text>
</svg>
