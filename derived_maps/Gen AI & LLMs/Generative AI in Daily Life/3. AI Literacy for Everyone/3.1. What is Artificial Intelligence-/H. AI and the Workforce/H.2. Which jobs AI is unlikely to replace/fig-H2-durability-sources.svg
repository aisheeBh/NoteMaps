<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Five sources of durability in human work</title>
  <desc>Five stacked bands. Hands in messy places: varied physical settings and little training data; could weaken with robot learning. Accountability: law assigns liability to named people; could weaken with regulatory change. Novel judgement: no stable right answer; could weaken with better AI reasoning. Desire for the human: value lies in human origin; could weaken as tastes change. Social skill: trust and relationships carry the value; could weaken if people accept AI agents.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" font-size="22" text-anchor="middle" fill="#111111" font-weight="bold">Five sources of durability (HANDS)</text>
  <rect x="40" y="70" width="260" height="72" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
  <rect x="52" y="88" width="236" height="36" fill="#FFFFFF" stroke="none"/>
  <text x="170" y="111" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Hands in messy places</text>
  <rect x="300" y="70" width="620" height="72" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="320" y="102" font-size="15" text-anchor="start" fill="#111111">Every house, patient and site differs; few datasets of physical action.</text>
  <text x="320" y="120" font-size="15" text-anchor="start" fill="#111111">Could weaken: robot learning, cheaper robots.</text>
  <rect x="40" y="156" width="260" height="72" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="52" y="174" width="236" height="36" fill="#FFFFFF" stroke="none"/>
  <text x="170" y="197" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Accountability</text>
  <rect x="300" y="156" width="620" height="72" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="320" y="188" font-size="15" text-anchor="start" fill="#111111">Law and professional rules assign liability to named people. Could weaken:</text>
  <text x="320" y="206" font-size="15" text-anchor="start" fill="#111111">regulators permitting AI sign-off.</text>
  <rect x="40" y="242" width="260" height="72" rx="0" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
  <rect x="52" y="260" width="236" height="36" fill="#FFFFFF" stroke="none"/>
  <text x="170" y="283" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Novel judgement</text>
  <rect x="300" y="242" width="620" height="72" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="320" y="274" font-size="15" text-anchor="start" fill="#111111">No stable right answer; goals are contested and negotiated. Could weaken:</text>
  <text x="320" y="292" font-size="15" text-anchor="start" fill="#111111">stronger AI reasoning and simulation.</text>
  <rect x="40" y="328" width="260" height="72" rx="0" fill="#F2F2F2" stroke="#333333" stroke-width="2"/>
  <rect x="52" y="346" width="236" height="36" fill="#FFFFFF" stroke="none"/>
  <text x="170" y="369" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Desire for the human</text>
  <rect x="300" y="328" width="620" height="72" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="320" y="360" font-size="15" text-anchor="start" fill="#111111">The value lies in a person having done it: performance, sport, craft,</text>
  <text x="320" y="378" font-size="15" text-anchor="start" fill="#111111">ceremony. Could weaken: changing tastes.</text>
  <rect x="40" y="414" width="260" height="72" rx="0" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="52" y="432" width="236" height="36" fill="#FFFFFF" stroke="none"/>
  <text x="170" y="455" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Social skill</text>
  <rect x="300" y="414" width="620" height="72" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="320" y="446" font-size="15" text-anchor="start" fill="#111111">Trust, persuasion, care and coordination carry the value. Could weaken:</text>
  <text x="320" y="464" font-size="15" text-anchor="start" fill="#111111">wider acceptance of AI agents and companions.</text>
  <text x="480" y="534" font-size="13" text-anchor="middle" fill="#333333">Each source protects specific tasks, not whole occupations.</text>
</svg>
