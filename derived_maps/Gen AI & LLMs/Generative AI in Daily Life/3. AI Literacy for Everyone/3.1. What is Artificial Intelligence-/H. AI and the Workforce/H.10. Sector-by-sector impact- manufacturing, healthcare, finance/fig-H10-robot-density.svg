<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 562" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Industrial robot density in selected economies, 2023</title>
  <desc>Horizontal bars of robots per 10,000 manufacturing employees, approximate: South Korea over 1,000; Singapore about 770; China about 470; Germany about 430; Japan about 420; United States about 295.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" font-size="22" text-anchor="middle" fill="#111111" font-weight="bold">Robots per 10,000 manufacturing employees (approximate)</text>
  <text x="266" y="104" font-size="15" text-anchor="end" fill="#111111">South Korea</text>
  <rect x="280" y="80" width="488" height="36" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="774" y="86" width="94" height="24" fill="#FFFFFF" stroke="none"/>
  <text x="778" y="104" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">over 1,000</text>
  <text x="266" y="166" font-size="15" text-anchor="end" fill="#111111">Singapore</text>
  <rect x="280" y="142" width="372" height="36" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="658" y="148" width="85" height="24" fill="#FFFFFF" stroke="none"/>
  <text x="662" y="166" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">about 770</text>
  <text x="266" y="228" font-size="15" text-anchor="end" fill="#111111">China</text>
  <rect x="280" y="204" width="227" height="36" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="513" y="210" width="85" height="24" fill="#FFFFFF" stroke="none"/>
  <text x="517" y="228" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">about 470</text>
  <text x="266" y="290" font-size="15" text-anchor="end" fill="#111111">Germany</text>
  <rect x="280" y="266" width="208" height="36" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="494" y="272" width="85" height="24" fill="#FFFFFF" stroke="none"/>
  <text x="498" y="290" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">about 430</text>
  <text x="266" y="352" font-size="15" text-anchor="end" fill="#111111">Japan</text>
  <rect x="280" y="328" width="203" height="36" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="489" y="334" width="85" height="24" fill="#FFFFFF" stroke="none"/>
  <text x="493" y="352" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">about 420</text>
  <text x="266" y="414" font-size="15" text-anchor="end" fill="#111111">United States</text>
  <rect x="280" y="390" width="143" height="36" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="429" y="396" width="85" height="24" fill="#FFFFFF" stroke="none"/>
  <text x="433" y="414" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">about 295</text>
  <line x1="280" y1="70" x2="280" y2="452" stroke="#333333" stroke-width="2"/>
  <line x1="280" y1="452" x2="860" y2="452" stroke="#333333" stroke-width="2"/>
  <line x1="280" y1="452" x2="280" y2="458" stroke="#333333" stroke-width="1.5"/>
  <text x="280" y="474" font-size="14" text-anchor="middle" fill="#111111">0</text>
  <line x1="425" y1="452" x2="425" y2="458" stroke="#333333" stroke-width="1.5"/>
  <text x="425" y="474" font-size="14" text-anchor="middle" fill="#111111">300</text>
  <line x1="570" y1="452" x2="570" y2="458" stroke="#333333" stroke-width="1.5"/>
  <text x="570" y="474" font-size="14" text-anchor="middle" fill="#111111">600</text>
  <line x1="715" y1="452" x2="715" y2="458" stroke="#333333" stroke-width="1.5"/>
  <text x="715" y="474" font-size="14" text-anchor="middle" fill="#111111">900</text>
  <line x1="860" y1="452" x2="860" y2="458" stroke="#333333" stroke-width="1.5"/>
  <text x="860" y="474" font-size="14" text-anchor="middle" fill="#111111">1200</text>
  <text x="570" y="496" font-size="15" text-anchor="middle" fill="#111111">Robots per 10,000 employees</text>
  <text x="480" y="546" font-size="13" text-anchor="middle" fill="#333333">Approximate figures from the International Federation of Robotics; rounded.</text>
</svg>
