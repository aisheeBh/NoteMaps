<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Policy tools by speed of effect and breadth of reach</title>
  <desc>Two-by-two matrix. Horizontal axis: breadth of reach, from targeted to broad. Vertical axis: speed of effect, from slow to fast. Fast and broad: unemployment insurance and short-time work. Fast and targeted: rapid-response teams and job-search help. Slow and broad: education reform and tax reform. Slow and targeted: retraining, wage insurance and place-based development.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" font-size="22" text-anchor="middle" fill="#111111" font-weight="bold">Policy tools by speed and reach</text>
  <rect x="140" y="70" width="380" height="200" rx="0" fill="#F2F2F2" stroke="#333333" stroke-width="2"/>
  <rect x="154" y="82" width="352" height="30" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <text x="330" y="103" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Fast and targeted</text>
  <rect x="158" y="123" width="344" height="26" fill="#FFFFFF" stroke="none"/>
  <circle cx="170" cy="135" r="5" fill="#000000"/>
  <text x="184" y="140" font-size="15" text-anchor="start" fill="#111111">Rapid-response teams</text>
  <rect x="158" y="153" width="344" height="26" fill="#FFFFFF" stroke="none"/>
  <circle cx="170" cy="165" r="5" fill="#000000"/>
  <text x="184" y="170" font-size="15" text-anchor="start" fill="#111111">Job-search and placement help</text>
  <rect x="520" y="70" width="380" height="200" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
  <rect x="534" y="82" width="352" height="30" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <text x="710" y="103" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Fast and broad</text>
  <rect x="538" y="123" width="344" height="26" fill="#FFFFFF" stroke="none"/>
  <circle cx="550" cy="135" r="5" fill="#000000"/>
  <text x="564" y="140" font-size="15" text-anchor="start" fill="#111111">Unemployment insurance</text>
  <rect x="538" y="153" width="344" height="26" fill="#FFFFFF" stroke="none"/>
  <circle cx="550" cy="165" r="5" fill="#000000"/>
  <text x="564" y="170" font-size="15" text-anchor="start" fill="#111111">Short-time work</text>
  <rect x="140" y="270" width="380" height="200" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <rect x="154" y="282" width="352" height="30" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <text x="330" y="303" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Slow and targeted</text>
  <rect x="158" y="323" width="344" height="26" fill="#FFFFFF" stroke="none"/>
  <circle cx="170" cy="335" r="5" fill="#000000"/>
  <text x="184" y="340" font-size="15" text-anchor="start" fill="#111111">Employer-linked retraining</text>
  <rect x="158" y="353" width="344" height="26" fill="#FFFFFF" stroke="none"/>
  <circle cx="170" cy="365" r="5" fill="#000000"/>
  <text x="184" y="370" font-size="15" text-anchor="start" fill="#111111">Wage insurance</text>
  <rect x="158" y="383" width="344" height="26" fill="#FFFFFF" stroke="none"/>
  <circle cx="170" cy="395" r="5" fill="#000000"/>
  <text x="184" y="400" font-size="15" text-anchor="start" fill="#111111">Place-based development</text>
  <rect x="520" y="270" width="380" height="200" rx="0" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
  <rect x="534" y="282" width="352" height="30" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <text x="710" y="303" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Slow and broad</text>
  <rect x="538" y="323" width="344" height="26" fill="#FFFFFF" stroke="none"/>
  <circle cx="550" cy="335" r="5" fill="#000000"/>
  <text x="564" y="340" font-size="15" text-anchor="start" fill="#111111">Education and skills reform</text>
  <rect x="538" y="353" width="344" height="26" fill="#FFFFFF" stroke="none"/>
  <circle cx="550" cy="365" r="5" fill="#000000"/>
  <text x="564" y="370" font-size="15" text-anchor="start" fill="#111111">Tax reform</text>
  <rect x="538" y="383" width="344" height="26" fill="#FFFFFF" stroke="none"/>
  <circle cx="550" cy="395" r="5" fill="#000000"/>
  <text x="564" y="400" font-size="15" text-anchor="start" fill="#111111">Rules on AI at work</text>
  <line x1="140" y1="492" x2="900" y2="492" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="520" y="518" font-size="15" text-anchor="middle" fill="#111111">Reach: targeted to broad →</text>
  <line x1="110" y1="470" x2="110" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="94" y="270" font-size="15" text-anchor="middle" fill="#111111" transform="rotate(-90 94 270)">Speed of effect: slow to fast →</text>
  <text x="480" y="564" font-size="13" text-anchor="middle" fill="#333333">Schematic placement; speed depends on design and administration.</text>
</svg>
