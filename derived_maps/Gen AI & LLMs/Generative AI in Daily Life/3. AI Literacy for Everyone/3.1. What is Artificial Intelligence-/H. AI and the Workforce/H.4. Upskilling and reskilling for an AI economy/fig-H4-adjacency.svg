<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 562" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Skill overlap between a contact-centre agent and possible destination roles</title>
  <desc>Horizontal bars of illustrative skill overlap with a contact-centre agent role: customer-success manager 75 per cent, complaints specialist 70, inside sales 65, fraud investigator 45, quality and AI-conversation reviewer 55, data analyst 25. Higher overlap means a shorter, likelier transition.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" font-size="22" text-anchor="middle" fill="#111111" font-weight="bold">Where can a contact-centre agent move?</text>
  <text x="326" y="104" font-size="15" text-anchor="end" fill="#111111">Customer-success manager</text>
  <rect x="340" y="80" width="390" height="36" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
  <rect x="736" y="86" width="34" height="24" fill="#FFFFFF" stroke="none"/>
  <text x="740" y="104" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">75%</text>
  <text x="326" y="166" font-size="15" text-anchor="end" fill="#111111">Complaints specialist</text>
  <rect x="340" y="142" width="364" height="36" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
  <rect x="710" y="148" width="34" height="24" fill="#FFFFFF" stroke="none"/>
  <text x="714" y="166" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">70%</text>
  <text x="326" y="228" font-size="15" text-anchor="end" fill="#111111">Inside sales</text>
  <rect x="340" y="204" width="338" height="36" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
  <rect x="684" y="210" width="34" height="24" fill="#FFFFFF" stroke="none"/>
  <text x="688" y="228" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">65%</text>
  <text x="326" y="290" font-size="15" text-anchor="end" fill="#111111">AI-conversation quality reviewer</text>
  <rect x="340" y="266" width="286" height="36" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="632" y="272" width="34" height="24" fill="#FFFFFF" stroke="none"/>
  <text x="636" y="290" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">55%</text>
  <text x="326" y="352" font-size="15" text-anchor="end" fill="#111111">Fraud investigator</text>
  <rect x="340" y="328" width="234" height="36" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="580" y="334" width="34" height="24" fill="#FFFFFF" stroke="none"/>
  <text x="584" y="352" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">45%</text>
  <text x="326" y="414" font-size="15" text-anchor="end" fill="#111111">Data analyst</text>
  <rect x="340" y="390" width="130" height="36" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2"/>
  <rect x="476" y="396" width="34" height="24" fill="#FFFFFF" stroke="none"/>
  <text x="480" y="414" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">25%</text>
  <line x1="340" y1="70" x2="340" y2="452" stroke="#333333" stroke-width="2"/>
  <line x1="340" y1="452" x2="860" y2="452" stroke="#333333" stroke-width="2"/>
  <line x1="340" y1="452" x2="340" y2="458" stroke="#333333" stroke-width="1.5"/>
  <text x="340" y="474" font-size="14" text-anchor="middle" fill="#111111">0</text>
  <line x1="470" y1="452" x2="470" y2="458" stroke="#333333" stroke-width="1.5"/>
  <text x="470" y="474" font-size="14" text-anchor="middle" fill="#111111">25</text>
  <line x1="600" y1="452" x2="600" y2="458" stroke="#333333" stroke-width="1.5"/>
  <text x="600" y="474" font-size="14" text-anchor="middle" fill="#111111">50</text>
  <line x1="730" y1="452" x2="730" y2="458" stroke="#333333" stroke-width="1.5"/>
  <text x="730" y="474" font-size="14" text-anchor="middle" fill="#111111">75</text>
  <line x1="860" y1="452" x2="860" y2="458" stroke="#333333" stroke-width="1.5"/>
  <text x="860" y="474" font-size="14" text-anchor="middle" fill="#111111">100</text>
  <text x="600" y="496" font-size="15" text-anchor="middle" fill="#111111">Share of destination-role skills already held (%)</text>
  <text x="480" y="546" font-size="13" text-anchor="middle" fill="#333333">Illustrative figures; overlap computed from a common skills taxonomy in practice.</text>
</svg>
