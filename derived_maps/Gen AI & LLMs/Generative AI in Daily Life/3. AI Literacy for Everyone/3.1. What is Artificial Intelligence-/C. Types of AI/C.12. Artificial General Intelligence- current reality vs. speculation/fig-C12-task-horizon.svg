<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Task length doubling and its extrapolation</title>
  <desc>Schematic chart with a logarithmic vertical axis of task length from seconds to a month and years from 2019 to 2030 on the horizontal axis. Solid measured points rise in a straight line to about an hour in 2025. A dashed extrapolation continues upward to days and weeks; a dotted alternative flattens out. A note says extrapolation assumes the trend continues.</desc>

  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">A measured trend, and two possible futures</text>
  <line x1="140" y1="430" x2="860" y2="430" stroke="#E0E0E0"/>
  <text x="130" y="435" text-anchor="end" font-size="14" fill="#111111">1 second</text>
  <line x1="140" y1="333" x2="860" y2="333" stroke="#E0E0E0"/>
  <text x="130" y="338" text-anchor="end" font-size="14" fill="#111111">1 minute</text>
  <line x1="140" y1="236" x2="860" y2="236" stroke="#E0E0E0"/>
  <text x="130" y="241" text-anchor="end" font-size="14" fill="#111111">1 hour</text>
  <line x1="140" y1="161" x2="860" y2="161" stroke="#E0E0E0"/>
  <text x="130" y="166" text-anchor="end" font-size="14" fill="#111111">1 day</text>
  <line x1="140" y1="115" x2="860" y2="115" stroke="#E0E0E0"/>
  <text x="130" y="120" text-anchor="end" font-size="14" fill="#111111">1 week</text>
  <line x1="140" y1="80" x2="860" y2="80" stroke="#E0E0E0"/>
  <text x="130" y="85" text-anchor="end" font-size="14" fill="#111111">1 month</text>
  <text x="140" y="452" text-anchor="middle" font-size="14" fill="#111111">2019</text>
  <text x="271" y="452" text-anchor="middle" font-size="14" fill="#111111">2021</text>
  <text x="402" y="452" text-anchor="middle" font-size="14" fill="#111111">2023</text>
  <text x="533" y="452" text-anchor="middle" font-size="14" fill="#111111">2025</text>
  <text x="664" y="452" text-anchor="middle" font-size="14" fill="#111111">2027</text>
  <text x="795" y="452" text-anchor="middle" font-size="14" fill="#111111">2029</text>
  <line x1="140" y1="430" x2="880" y2="430" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="140" y1="430" x2="140" y2="60" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="44" y="255" text-anchor="middle" font-size="15" fill="#111111" transform="rotate(-90 44 255)">Task length completed at 50% success</text>
  <path d="M140.0 413.6 L172.7 399.5 L205.5 385.4 L238.2 371.3 L270.9 357.3 L303.6 343.2 L336.4 329.1 L369.1 315.0 L401.8 301.0 L434.5 286.9 L467.3 272.8 L500.0 258.7 L532.7 244.6" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <circle cx="140.0" cy="413.6" r="6" fill="#1F3B5C" stroke="#000000" stroke-width="1.5"/>
  <circle cx="205.5" cy="385.4" r="6" fill="#1F3B5C" stroke="#000000" stroke-width="1.5"/>
  <circle cx="270.9" cy="357.3" r="6" fill="#1F3B5C" stroke="#000000" stroke-width="1.5"/>
  <circle cx="336.4" cy="329.1" r="6" fill="#1F3B5C" stroke="#000000" stroke-width="1.5"/>
  <circle cx="401.8" cy="301.0" r="6" fill="#1F3B5C" stroke="#000000" stroke-width="1.5"/>
  <circle cx="467.3" cy="272.8" r="6" fill="#1F3B5C" stroke="#000000" stroke-width="1.5"/>
  <circle cx="532.7" cy="244.6" r="6" fill="#1F3B5C" stroke="#000000" stroke-width="1.5"/>
  <path d="M532.7 244.6 L549.1 237.6 L565.5 230.6 L581.8 223.5 L598.2 216.5 L614.5 209.4 L630.9 202.4 L647.3 195.4 L663.6 188.3 L680.0 181.3 L696.4 174.3 L712.7 167.2 L729.1 160.2 L745.5 153.1 L761.8 146.1 L778.2 139.1 L794.5 132.0 L810.9 125.0 L827.3 117.9 L843.6 110.9 L860.0 103.9" fill="none" stroke="#222222" stroke-width="3" stroke-dasharray="10 6"/>
  <path d="M532.7 244.6 L549.1 238.4 L565.5 233.6 L581.8 229.8 L598.2 226.8 L614.5 224.6 L630.9 222.8 L647.3 221.4 L663.6 220.3 L680.0 219.5 L696.4 218.8 L712.7 218.3 L729.1 217.9 L745.5 217.6 L761.8 217.3 L778.2 217.1 L794.5 217.0 L810.9 216.9 L827.3 216.8 L843.6 216.7 L860.0 216.7" fill="none" stroke="#8B0000" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round"/>
  <rect x="205" y="196" width="250" height="44" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="215" y="215" font-size="15" font-weight="bold" fill="#111111">Measured, 2019 to 2025</text>
  <text x="215" y="233" font-size="14" fill="#111111">doubling about every 7 months</text>
  <rect x="637" y="86" width="230" height="44" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="647" y="105" font-size="15" font-weight="bold" fill="#111111">If the trend continues</text>
  <text x="647" y="123" font-size="14" fill="#111111">extrapolation, not evidence</text>
  <rect x="683" y="231" width="210" height="44" fill="#FFFFFF" stroke="#8B0000" stroke-width="1.5"/>
  <text x="693" y="250" font-size="15" font-weight="bold" fill="#111111">If limits bite</text>
  <text x="693" y="268" font-size="14" fill="#111111">the curve flattens</text>
  <text x="480" y="500" text-anchor="middle" font-size="15" fill="#111111">Mostly well-specified software tasks; reliability at higher success thresholds lags behind.</text>
  <text x="480" y="528" text-anchor="middle" font-size="13" fill="#333333">Schematic of the reported trend; points and future curves are not plotted from the original data.</text>
</svg>
