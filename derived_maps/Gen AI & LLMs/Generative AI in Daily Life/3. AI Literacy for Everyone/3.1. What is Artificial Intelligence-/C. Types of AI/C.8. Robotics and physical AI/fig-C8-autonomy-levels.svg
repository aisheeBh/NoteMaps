<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Six levels of driving automation</title>
  <desc>A staircase of six steps, levels 0 to 5. Levels 0 to 2 are shaded as human-driven: the person drives or supervises at all times. Levels 3 to 5 are shaded as system-driven within conditions. A heavy dividing line falls between levels 2 and 3, where responsibility shifts. Level 5 is marked not achieved.</desc>

  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Who is driving? Responsibility shifts at Level 3</text>
  <rect x="60" y="340" width="134" height="100" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2" />
  <rect x="68" y="348" width="118" height="88" fill="#FFFFFF" stroke="#999999" stroke-width="1"/>
  <text x="127" y="370" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Level 0</text>
  <text x="127" y="390" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">No automation</text>
  <text x="127" y="408" text-anchor="middle" font-size="13" fill="#111111">warnings only</text>
  <rect x="200" y="295" width="134" height="145" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2" />
  <rect x="208" y="303" width="118" height="88" fill="#FFFFFF" stroke="#999999" stroke-width="1"/>
  <text x="267" y="325" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Level 1</text>
  <text x="267" y="345" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Driver assistance</text>
  <text x="267" y="363" text-anchor="middle" font-size="13" fill="#111111">steering or speed</text>
  <rect x="340" y="250" width="134" height="190" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2" />
  <rect x="348" y="258" width="118" height="88" fill="#FFFFFF" stroke="#999999" stroke-width="1"/>
  <text x="407" y="280" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Level 2</text>
  <text x="407" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Partial</text>
  <text x="407" y="318" text-anchor="middle" font-size="13" fill="#111111">steering and speed;</text>
  <text x="407" y="342" text-anchor="middle" font-size="13" fill="#111111">human supervises</text>
  <rect x="480" y="205" width="134" height="235" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2" />
  <rect x="488" y="213" width="118" height="88" fill="#FFFFFF" stroke="#999999" stroke-width="1"/>
  <text x="547" y="235" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Level 3</text>
  <text x="547" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Conditional</text>
  <text x="547" y="273" text-anchor="middle" font-size="13" fill="#111111">system drives;</text>
  <text x="547" y="297" text-anchor="middle" font-size="13" fill="#111111">human on call</text>
  <rect x="620" y="160" width="134" height="280" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2" />
  <rect x="628" y="168" width="118" height="88" fill="#FFFFFF" stroke="#999999" stroke-width="1"/>
  <text x="687" y="190" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Level 4</text>
  <text x="687" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">High</text>
  <text x="687" y="228" text-anchor="middle" font-size="13" fill="#111111">no human needed</text>
  <text x="687" y="252" text-anchor="middle" font-size="13" fill="#111111">within its domain</text>
  <rect x="760" y="115" width="134" height="325" fill="url(#dots)" stroke="#1F3B5C" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="768" y="123" width="118" height="88" fill="#FFFFFF" stroke="#999999" stroke-width="1"/>
  <text x="827" y="145" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Level 5</text>
  <text x="827" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Full</text>
  <text x="827" y="183" text-anchor="middle" font-size="13" fill="#111111">anywhere: not</text>
  <text x="827" y="207" text-anchor="middle" font-size="13" fill="#111111">achieved</text>
  <line x1="477" y1="105" x2="477" y2="450" stroke="#000000" stroke-width="4"/>
  <text x="250" y="478" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">HUMAN DRIVES OR SUPERVISES</text>
  <text x="250" y="498" text-anchor="middle" font-size="14" fill="#111111">the person is responsible at all times</text>
  <text x="690" y="478" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">SYSTEM DRIVES IN ITS CONDITIONS</text>
  <text x="690" y="498" text-anchor="middle" font-size="14" fill="#111111">within the operational design domain</text>
  <text x="480" y="528" text-anchor="middle" font-size="13" fill="#333333">Based on the SAE J3016 levels; descriptions simplified.</text>
</svg>
