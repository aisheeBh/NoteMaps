<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Rules versus potential pairwise interactions</title>
  <desc>Paired bars on a logarithmic scale for rule bases of 10, 100, 300 and 1,000 rules. Potential pairwise interactions are 45, 4,950, 44,850 and 499,500, growing far faster than the number of rules.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Each new rule can interact with every rule already there</text>
  <line x1="130" y1="450.0" x2="900" y2="450.0" stroke="#CCCCCC" stroke-width="1"/>
  <text x="120" y="455.0" text-anchor="end" font-size="14" fill="#111111">1</text>
  <line x1="130" y1="390.0" x2="900" y2="390.0" stroke="#CCCCCC" stroke-width="1"/>
  <text x="120" y="395.0" text-anchor="end" font-size="14" fill="#111111">10</text>
  <line x1="130" y1="330.0" x2="900" y2="330.0" stroke="#CCCCCC" stroke-width="1"/>
  <text x="120" y="335.0" text-anchor="end" font-size="14" fill="#111111">100</text>
  <line x1="130" y1="270.0" x2="900" y2="270.0" stroke="#CCCCCC" stroke-width="1"/>
  <text x="120" y="275.0" text-anchor="end" font-size="14" fill="#111111">1,000</text>
  <line x1="130" y1="210.0" x2="900" y2="210.0" stroke="#CCCCCC" stroke-width="1"/>
  <text x="120" y="215.0" text-anchor="end" font-size="14" fill="#111111">10,000</text>
  <line x1="130" y1="150.0" x2="900" y2="150.0" stroke="#CCCCCC" stroke-width="1"/>
  <text x="120" y="155.0" text-anchor="end" font-size="14" fill="#111111">100,000</text>
  <line x1="130" y1="90.0" x2="900" y2="90.0" stroke="#CCCCCC" stroke-width="1"/>
  <text x="120" y="95.0" text-anchor="end" font-size="14" fill="#111111">1,000,000</text>
  <line x1="130" y1="450" x2="900" y2="450" stroke="#222222" stroke-width="2.5"/>
  <line x1="130" y1="450" x2="130" y2="80" stroke="#222222" stroke-width="2.5"/>
  <text x="40" y="270" text-anchor="middle" font-size="15" fill="#111111" transform="rotate(-90 40 270)">Count (logarithmic scale)</text>
  <rect x="170" y="390.0" width="55" height="60.0" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="162" y="364.0" width="71" height="20" fill="#FFFFFF"/>
  <text x="197.5" y="379.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">10</text>
  <rect x="235" y="350.8" width="55" height="99.2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2" />
  <rect x="227" y="324.8" width="71" height="20" fill="#FFFFFF"/>
  <text x="262.5" y="339.8" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">45</text>
  <text x="230" y="476" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">10 rules</text>
  <rect x="360" y="330.0" width="55" height="120.0" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="352" y="304.0" width="71" height="20" fill="#FFFFFF"/>
  <text x="387.5" y="319.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">100</text>
  <rect x="425" y="228.3" width="55" height="221.7" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2" />
  <rect x="417" y="202.3" width="71" height="20" fill="#FFFFFF"/>
  <text x="452.5" y="217.3" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">4,950</text>
  <text x="420" y="476" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">100 rules</text>
  <rect x="550" y="301.4" width="55" height="148.6" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="542" y="275.4" width="71" height="20" fill="#FFFFFF"/>
  <text x="577.5" y="290.4" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">300</text>
  <rect x="615" y="170.9" width="55" height="279.1" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2" />
  <rect x="607" y="144.9" width="71" height="20" fill="#FFFFFF"/>
  <text x="642.5" y="159.9" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">44,850</text>
  <text x="610" y="476" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">300 rules</text>
  <rect x="740" y="270.0" width="55" height="180.0" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="732" y="244.0" width="71" height="20" fill="#FFFFFF"/>
  <text x="767.5" y="259.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">1,000</text>
  <rect x="805" y="108.1" width="55" height="341.9" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2" />
  <rect x="797" y="82.1" width="71" height="20" fill="#FFFFFF"/>
  <text x="832.5" y="97.1" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">499,500</text>
  <text x="800" y="476" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">1,000 rules</text>
  <rect x="300" y="492" width="30" height="20" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="338" y="507" font-size="15" fill="#111111">number of rules</text>
  <rect x="520" y="492" width="30" height="20" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="558" y="507" font-size="15" fill="#111111">potential pairs, n(n - 1) / 2</text>
  <text x="480" y="545" text-anchor="middle" font-size="13" fill="#333333">Potential, not actual, interactions: most pairs never conflict, but each must be considered when rules change.</text>
</svg>
