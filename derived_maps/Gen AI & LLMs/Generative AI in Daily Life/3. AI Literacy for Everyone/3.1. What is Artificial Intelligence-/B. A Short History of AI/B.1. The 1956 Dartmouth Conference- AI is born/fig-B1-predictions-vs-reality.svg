<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Predicted and actual dates for three early AI forecasts</title>
  <desc>Three rows on a time axis from 1950 to 2030. Chess champion: forecast in 1958 for 1968, achieved 1997. Important new theorem: forecast in 1958 for 1968, achieved 1996 in a narrow area. General intelligence: forecast in 1967 for within a generation, not achieved by 2026.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Early forecasts: promised dates against actual dates</text>

  <rect x="200" y="58" width="40" height="18" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/>
  <text x="248" y="72" font-size="14" fill="#111111">promised waiting time</text>
  <rect x="440" y="58" width="40" height="18" fill="url(#lines)" stroke="#8B0000" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="488" y="72" font-size="14" fill="#111111">extra years actually needed</text>

  <line x1="200" y1="460" x2="910" y2="460" stroke="#222222" stroke-width="2"/>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <line x1="200" y1="460" x2="200" y2="468" stroke="#222222"/><text x="200" y="486">1950</text>
    <line x1="287.5" y1="460" x2="287.5" y2="468" stroke="#222222"/><text x="287.5" y="486">1960</text>
    <line x1="375" y1="460" x2="375" y2="468" stroke="#222222"/><text x="375" y="486">1970</text>
    <line x1="462.5" y1="460" x2="462.5" y2="468" stroke="#222222"/><text x="462.5" y="486">1980</text>
    <line x1="550" y1="460" x2="550" y2="468" stroke="#222222"/><text x="550" y="486">1990</text>
    <line x1="637.5" y1="460" x2="637.5" y2="468" stroke="#222222"/><text x="637.5" y="486">2000</text>
    <line x1="725" y1="460" x2="725" y2="468" stroke="#222222"/><text x="725" y="486">2010</text>
    <line x1="812.5" y1="460" x2="812.5" y2="468" stroke="#222222"/><text x="812.5" y="486">2020</text>
    <line x1="900" y1="460" x2="900" y2="468" stroke="#222222"/><text x="900" y="486">2030</text>
  </g>
  <g stroke="#CCCCCC" stroke-width="1" stroke-dasharray="3 4">
    <line x1="375" y1="100" x2="375" y2="460"/><line x1="550" y1="100" x2="550" y2="460"/><line x1="725" y1="100" x2="725" y2="460"/>
  </g>

  <g font-size="15" fill="#111111" text-anchor="end">
    <text x="185" y="146" font-weight="bold">Computer chess</text><text x="185" y="164">world champion</text>
    <text x="185" y="256" font-weight="bold">Computer proves</text><text x="185" y="274">new theorem</text>
    <text x="185" y="366" font-weight="bold">General machine</text><text x="185" y="384">intelligence</text>
  </g>

  <rect x="270" y="135" width="87.5" height="34" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="357.5" y="135" width="253.75" height="34" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="270" cy="152" r="7" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
  <rect x="604" y="145" width="14" height="14" fill="#111111"/>
  <text x="270" y="126" text-anchor="middle" font-size="14" fill="#111111">forecast 1958</text>
  <text x="372" y="126" text-anchor="start" font-size="14" fill="#111111">due 1968</text>
  <rect x="420" y="141" width="128" height="22" fill="#FFFFFF"/>
  <text x="484" y="157" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">29 years late</text>
  <text x="630" y="148" font-size="14" fill="#111111">1997: Deep Blue</text>
  <text x="630" y="166" font-size="14" fill="#111111">beats Kasparov</text>

  <rect x="270" y="245" width="87.5" height="34" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="357.5" y="245" width="245" height="34" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="270" cy="262" r="7" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
  <rect x="595.5" y="255" width="14" height="14" fill="#111111"/>
  <text x="270" y="236" text-anchor="middle" font-size="14" fill="#111111">forecast 1958</text>
  <text x="372" y="236" text-anchor="start" font-size="14" fill="#111111">due 1968</text>
  <rect x="420" y="251" width="128" height="22" fill="#FFFFFF"/>
  <text x="484" y="267" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">28 years late</text>
  <text x="622" y="259" font-size="14" fill="#111111">1996: Robbins conjecture</text>
  <text x="622" y="277" font-size="14" fill="#111111">proved by a program</text>

  <rect x="348.75" y="355" width="218.75" height="34" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="567.5" y="355" width="297.5" height="34" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="865" y1="372" x2="905" y2="372" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="348.75" cy="372" r="7" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
  <text x="348.75" y="346" text-anchor="middle" font-size="14" fill="#111111">forecast 1967</text>
  <text x="567.5" y="346" text-anchor="middle" font-size="14" fill="#111111">"within a generation"</text>
  <rect x="640" y="361" width="160" height="22" fill="#FFFFFF"/>
  <text x="720" y="377" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">not achieved by 2026</text>

  <text x="480" y="520" text-anchor="middle" font-size="13" fill="#333333">Forecasts by Simon and Newell (1958) and Minsky (1967). "Within a generation" is drawn as about 25 years; that end point is approximate.</text>
</svg>
