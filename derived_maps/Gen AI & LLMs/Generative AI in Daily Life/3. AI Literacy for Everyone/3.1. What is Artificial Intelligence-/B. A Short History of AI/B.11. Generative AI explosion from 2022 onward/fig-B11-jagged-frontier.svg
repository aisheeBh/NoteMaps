<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The jagged frontier of AI capability</title>
  <desc>Schematic chart. Tasks are arranged from easier to harder for people. A jagged line marks the frontier of AI capability. Below the line, inside the frontier, AI users work faster and often better; above it, outside the frontier, AI users do worse than people working alone. Three numbered example tasks: checking a fact against a specific record, an easy task, falls outside; counting objects in a photograph falls outside; drafting a market analysis, a harder task, falls inside.</desc>
  <defs>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">AI capability has a jagged edge</text>

  <path d="M100 440 L100 200 L190 200 L190 300 L280 300 L280 150 L380 150 L380 260 L470 260 L470 120 L580 120 L580 330 L670 330 L670 180 L770 180 L770 280 L860 280 L860 440 Z" fill="url(#cross)" stroke="none"/>
  <path d="M100 80 L100 200 L190 200 L190 300 L280 300 L280 150 L380 150 L380 260 L470 260 L470 120 L580 120 L580 330 L670 330 L670 180 L770 180 L770 280 L860 280 L860 80 Z" fill="url(#lines)" opacity="0.6" stroke="none"/>
  <path d="M100 200 L190 200 L190 300 L280 300 L280 150 L380 150 L380 260 L470 260 L470 120 L580 120 L580 330 L670 330 L670 180 L770 180 L770 280 L860 280" fill="none" stroke="#000000" stroke-width="4"/>

  <line x1="100" y1="440" x2="880" y2="440" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="480" y="470" text-anchor="middle" font-size="16" fill="#111111">Tasks, from easier to harder for a skilled person</text>

  <rect x="590" y="88" width="260" height="44" fill="#FFFFFF" stroke="#8B0000" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="720" y="107" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Outside the frontier:</text>
  <text x="720" y="125" text-anchor="middle" font-size="14" fill="#111111">AI users do worse than people alone</text>

  <rect x="590" y="370" width="260" height="44" fill="#FFFFFF" stroke="#1E5E24" stroke-width="2"/>
  <text x="720" y="389" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Inside the frontier:</text>
  <text x="720" y="407" text-anchor="middle" font-size="14" fill="#111111">faster work, often higher quality</text>

  <!-- numbered task markers -->
  <circle cx="235" cy="250" r="15" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <text x="235" y="256" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">1</text>
  <circle cx="425" cy="215" r="15" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <text x="425" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">2</text>
  <circle cx="525" cy="200" r="15" fill="#111111" stroke="#000000" stroke-width="3"/>
  <text x="525" y="206" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">3</text>

  <rect x="100" y="490" width="760" height="62" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="120" y="514" font-size="14" fill="#111111">1: check a fact against a specific record (outside)</text>
  <text x="500" y="514" font-size="14" fill="#111111">2: count objects in a photograph (outside)</text>
  <text x="120" y="538" font-size="14" fill="#111111">3: draft a market analysis (inside)</text>
  <text x="500" y="538" font-size="14" fill="#111111">open circle = outside; filled = inside</text>

  <text x="480" y="580" text-anchor="middle" font-size="13" fill="#333333">Schematic based on the idea reported in a 2023 field experiment; task placements are illustrative and shift as models improve.</text>
</svg>
