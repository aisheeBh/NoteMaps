<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>A ratings matrix with gaps filled by collaborative filtering</title>
  <desc>A grid with four users as rows and five films as columns. Known star ratings are shown in plain cells. Empty cells are filled with predicted ratings, shown in patterned cells with a question mark. User D has tastes like user A, so A's high rating of a film D has not seen leads to a high prediction for D.</desc>
  <defs>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Predicting the missing ratings from similar people</text>

  <!-- legend -->
  <rect x="250" y="56" width="26" height="20" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="284" y="71" font-size="14" fill="#111111">rating given by the user</text>
  <rect x="520" y="56" width="26" height="20" fill="url(#dots)" stroke="#7A5200" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="554" y="71" font-size="14" fill="#111111">rating predicted by the system</text>

  <!-- column headers: x start 260, cell 110 -->
  <g font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">
    <text x="315" y="112">Film 1</text><text x="425" y="112">Film 2</text><text x="535" y="112">Film 3</text>
    <text x="645" y="112">Film 4</text><text x="755" y="112">Film 5</text>
  </g>
  <g font-size="15" font-weight="bold" fill="#111111" text-anchor="end">
    <text x="245" y="160">User A</text><text x="245" y="225">User B</text><text x="245" y="290">User C</text><text x="245" y="355">User D</text>
  </g>

  <!-- grid rows y: 125,190,255,320 (h 60) -->
  <g stroke="#222222" stroke-width="1.5" fill="#FFFFFF">
    <rect x="260" y="125" width="110" height="60"/><rect x="370" y="125" width="110" height="60"/><rect x="480" y="125" width="110" height="60"/><rect x="590" y="125" width="110" height="60"/><rect x="700" y="125" width="110" height="60"/>
    <rect x="260" y="190" width="110" height="60"/><rect x="370" y="190" width="110" height="60"/><rect x="480" y="190" width="110" height="60"/><rect x="590" y="190" width="110" height="60"/><rect x="700" y="190" width="110" height="60"/>
    <rect x="260" y="255" width="110" height="60"/><rect x="370" y="255" width="110" height="60"/><rect x="480" y="255" width="110" height="60"/><rect x="590" y="255" width="110" height="60"/><rect x="700" y="255" width="110" height="60"/>
    <rect x="260" y="320" width="110" height="60"/><rect x="370" y="320" width="110" height="60"/><rect x="480" y="320" width="110" height="60"/><rect x="590" y="320" width="110" height="60"/><rect x="700" y="320" width="110" height="60"/>
  </g>
  <!-- predicted cells overlay -->
  <g fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4">
    <rect x="590" y="125" width="110" height="60"/>
    <rect x="480" y="190" width="110" height="60"/>
    <rect x="370" y="255" width="110" height="60"/><rect x="700" y="255" width="110" height="60"/>
    <rect x="700" y="320" width="110" height="60"/><rect x="590" y="320" width="110" height="60"/>
  </g>
  <!-- known ratings -->
  <g font-size="20" font-weight="bold" fill="#111111" text-anchor="middle">
    <text x="315" y="162">5</text><text x="425" y="162">4</text><text x="535" y="162">1</text><text x="755" y="162">5</text>
    <text x="315" y="227">1</text><text x="425" y="227">2</text><text x="645" y="227">5</text><text x="755" y="227">2</text>
    <text x="315" y="292">4</text><text x="535" y="292">2</text><text x="645" y="292">3</text>
    <text x="315" y="357">5</text><text x="425" y="357">5</text><text x="535" y="357">1</text>
  </g>
  <!-- predicted values with white backing -->
  <g font-size="17" font-weight="bold" fill="#111111" text-anchor="middle">
    <rect x="612" y="140" width="66" height="28" fill="#FFFFFF"/><text x="645" y="160">2 ?</text>
    <rect x="502" y="205" width="66" height="28" fill="#FFFFFF"/><text x="535" y="225">5 ?</text>
    <rect x="392" y="270" width="66" height="28" fill="#FFFFFF"/><text x="425" y="290">4 ?</text>
    <rect x="722" y="270" width="66" height="28" fill="#FFFFFF"/><text x="755" y="290">4 ?</text>
    <rect x="612" y="335" width="66" height="28" fill="#FFFFFF"/><text x="645" y="355">2 ?</text>
    <rect x="722" y="335" width="66" height="28" fill="#FFFFFF"/><text x="755" y="355">5 ?</text>
  </g>


  <rect x="120" y="400" width="720" height="86" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="480" y="424" text-anchor="middle" font-size="15" fill="#111111">A and D rate films 1-3 alike, so D's missing film 5 rating is predicted from A's: 5.</text>
  <text x="480" y="448" text-anchor="middle" font-size="15" fill="#111111">Real systems hold millions of users and items, and well over 99% of cells are empty.</text>
  <text x="480" y="472" text-anchor="middle" font-size="15" fill="#111111">Matrix factorisation learns hidden taste factors that predict every gap at once.</text>

  <text x="480" y="526" text-anchor="middle" font-size="13" fill="#333333">Illustrative ratings on a 1-5 scale.</text>
</svg>
