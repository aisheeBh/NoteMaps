<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Winning top-5 error in the ImageNet challenge, 2010 to 2017</title>
  <desc>Bar chart. Winning top-5 error was about 28 per cent in 2010 and 26 per cent in 2011 with hand-designed features. Deep networks then cut it to 15.3 per cent in 2012, about 11.7 in 2013, 6.7 in 2014, 3.6 in 2015, about 3.0 in 2016 and about 2.3 in 2017. A horizontal line marks a single-annotator human estimate of about 5.1 per cent.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Winning top-5 error fell from over a quarter to about 2%</text>

  <rect x="560" y="58" width="22" height="16" fill="#E6E6E6" stroke="#222222" stroke-width="1.5"/>
  <text x="590" y="71" font-size="14" fill="#111111">hand-designed features</text>
  <rect x="750" y="58" width="22" height="16" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/>
  <text x="780" y="71" font-size="14" fill="#111111">deep networks</text>

  <line x1="120" y1="440" x2="890" y2="440" stroke="#222222" stroke-width="2.5"/>
  <line x1="120" y1="440" x2="120" y2="96" stroke="#222222" stroke-width="2.5"/>
  <g font-size="14" fill="#111111" text-anchor="end">
    <text x="112" y="444">0%</text><text x="112" y="331">10%</text><text x="112" y="217">20%</text><text x="112" y="104">30%</text>
  </g>
  <g stroke="#CCCCCC" stroke-width="1" stroke-dasharray="3 4">
    <line x1="120" y1="326.7" x2="890" y2="326.7"/><line x1="120" y1="213.3" x2="890" y2="213.3"/><line x1="120" y1="100" x2="890" y2="100"/>
  </g>
  <text x="60" y="270" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 60 270)">Top-5 error of the winner</text>

  <rect x="150" y="120.5" width="60" height="319.5" fill="#E6E6E6" stroke="#222222" stroke-width="2"/>
  <rect x="240" y="147.7" width="60" height="292.3" fill="#E6E6E6" stroke="#222222" stroke-width="2"/>
  <rect x="330" y="266.7" width="60" height="173.3" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
  <rect x="420" y="307.4" width="60" height="132.6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
  <rect x="510" y="364.1" width="60" height="75.9" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
  <rect x="600" y="399.2" width="60" height="40.8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
  <rect x="690" y="406" width="60" height="34" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
  <rect x="780" y="413.9" width="60" height="26.1" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>

  <g font-size="14" font-weight="bold" fill="#111111" text-anchor="middle">
    <text x="180" y="112">28.2</text><text x="270" y="139">25.8</text><text x="360" y="258">15.3</text>
    <text x="450" y="299">11.7</text><text x="540" y="356">6.7</text>
  </g>
  <g font-size="14" font-weight="bold" fill="#111111" text-anchor="middle">
    <rect x="608" y="333" width="44" height="20" fill="#FFFFFF"/><text x="630" y="348">3.6</text>
    <rect x="698" y="333" width="44" height="20" fill="#FFFFFF"/><text x="720" y="348">3.0</text>
    <rect x="788" y="333" width="44" height="20" fill="#FFFFFF"/><text x="810" y="348">2.3</text>
  </g>

  <line x1="120" y1="382.2" x2="890" y2="382.2" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="10 6"/>
  <rect x="660" y="300" width="230" height="24" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
  <text x="775" y="317" text-anchor="middle" font-size="14" fill="#111111">human estimate, about 5.1%</text>
  <line x1="775" y1="324" x2="775" y2="380" stroke="#8B0000" stroke-width="1.5"/>

  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="180" y="462">2010</text><text x="270" y="462">2011</text><text x="360" y="462">2012</text><text x="450" y="462">2013</text>
    <text x="540" y="462">2014</text><text x="630" y="462">2015</text><text x="720" y="462">2016</text><text x="810" y="462">2017</text>
  </g>
  <g font-size="13" fill="#111111" text-anchor="middle">
    <text x="360" y="480">AlexNet</text><text x="540" y="480">GoogLeNet</text><text x="630" y="480">ResNet</text>
  </g>

  <text x="480" y="520" text-anchor="middle" font-size="15" fill="#111111">The 2012 drop of about ten points was larger than the previous several years of progress combined.</text>
  <text x="480" y="556" text-anchor="middle" font-size="13" fill="#333333">Values rounded from published challenge results; the human estimate comes from one trained annotator on a sample of images.</text>
</svg>
