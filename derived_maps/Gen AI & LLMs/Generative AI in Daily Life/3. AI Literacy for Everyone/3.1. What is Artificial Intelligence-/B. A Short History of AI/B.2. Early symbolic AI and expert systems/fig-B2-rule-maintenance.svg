<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Value and maintenance effort as a rule base grows</title>
  <desc>Schematic chart. As the number of rules grows, the extra value delivered levels off while the effort needed to maintain the rules rises ever faster, because each new rule can interact with all the existing ones. Beyond a crossover point, upkeep outweighs the gains.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">As a rule base grows, upkeep overtakes value</text>

  <line x1="120" y1="440" x2="880" y2="440" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="440" x2="120" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="500" y="484" text-anchor="middle" font-size="16" fill="#111111">Number of rules in the system</text>
  <text x="70" y="260" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 70 260)">Relative amount</text>
  <text x="130" y="462" font-size="14" fill="#111111">tens</text>
  <text x="440" y="462" font-size="14" fill="#111111">hundreds</text>
  <text x="790" y="462" font-size="14" fill="#111111">thousands</text>

  <path d="M120 440 C 250 260, 450 190, 860 165" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <path d="M120 440 C 500 430, 700 330, 860 100" fill="none" stroke="#8B0000" stroke-width="4" stroke-dasharray="10 6"/>

  <rect x="250" y="196" width="230" height="46" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="365" y="216" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Value delivered</text>
  <text x="365" y="234" text-anchor="middle" font-size="14" fill="#111111">levels off: easy wins first</text>

  <rect x="470" y="330" width="250" height="46" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
  <text x="595" y="350" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Maintenance effort</text>
  <text x="595" y="368" text-anchor="middle" font-size="14" fill="#111111">rises faster: rules interact</text>

  <circle cx="800" cy="172" r="9" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <line x1="800" y1="160" x2="760" y2="112" stroke="#222222" stroke-width="1.5"/>
  <rect x="560" y="76" width="230" height="40" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="675" y="101" text-anchor="middle" font-size="14" fill="#111111">upkeep starts to outweigh gains</text>

  <rect x="140" y="490" width="680" height="26" fill="#FFFFFF"/>
  <text x="480" y="508" text-anchor="middle" font-size="14" fill="#111111">With n rules there are n(n-1)/2 possible pairs that may conflict: 100 rules give 4,950 pairs; 1,000 rules give 499,500.</text>
  <text x="480" y="540" text-anchor="middle" font-size="13" fill="#333333">Schematic; not plotted from a single dataset. The pair counts are exact arithmetic.</text>
</svg>
