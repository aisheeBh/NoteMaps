<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Growth of possible rule interactions</title>
  <desc>Bar chart on a logarithmic scale of the number of possible pairs of rules, n times n minus one over two: 10 rules give 45 pairs, 100 rules 4,950, 500 rules 124,750, 1,000 rules 499,500, 2,500 rules about 3.1 million, 10,000 rules about 50 million.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Possible rule pairs: n(n − 1) ÷ 2</text>
  <line x1="150" y1="440" x2="900" y2="440" stroke="#222222" stroke-width="2.5"/>
  <line x1="150" y1="440" x2="150" y2="100" stroke="#222222" stroke-width="2.5"/>
  <line x1="150" y1="440.0" x2="900" y2="440.0" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="140" y="445.0" text-anchor="end" font-size="14" fill="#111111">1</text>
  <line x1="150" y1="355.0" x2="900" y2="355.0" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="140" y="360.0" text-anchor="end" font-size="14" fill="#111111">100</text>
  <line x1="150" y1="270.0" x2="900" y2="270.0" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="140" y="275.0" text-anchor="end" font-size="14" fill="#111111">10,000</text>
  <line x1="150" y1="185.0" x2="900" y2="185.0" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="140" y="190.0" text-anchor="end" font-size="14" fill="#111111">1 million</text>
  <line x1="150" y1="100.0" x2="900" y2="100.0" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="140" y="105.0" text-anchor="end" font-size="14" fill="#111111">100 million</text>
  <rect x="200" y="369.7" width="80" height="70.3" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="186" y="337.7" width="108" height="24" fill="#FFFFFF"/>
  <text x="240" y="355.7" text-anchor="middle" font-size="14" fill="#111111">45</text>
  <text x="240" y="464" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">10 rules</text>
  <rect x="315" y="283.0" width="80" height="157.0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="301" y="251.0" width="108" height="24" fill="#FFFFFF"/>
  <text x="355" y="269.0" text-anchor="middle" font-size="14" fill="#111111">4,950</text>
  <text x="355" y="464" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">100 rules</text>
  <rect x="430" y="223.4" width="80" height="216.6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="416" y="191.4" width="108" height="24" fill="#FFFFFF"/>
  <text x="470" y="209.4" text-anchor="middle" font-size="14" fill="#111111">124,750</text>
  <text x="470" y="464" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">500 rules</text>
  <rect x="545" y="197.8" width="80" height="242.2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="531" y="165.8" width="108" height="24" fill="#FFFFFF"/>
  <text x="585" y="183.8" text-anchor="middle" font-size="14" fill="#111111">499,500</text>
  <text x="585" y="464" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">1,000 rules</text>
  <rect x="660" y="164.0" width="80" height="276.0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="646" y="132.0" width="108" height="24" fill="#FFFFFF"/>
  <text x="700" y="150.0" text-anchor="middle" font-size="14" fill="#111111">3.1 million</text>
  <text x="700" y="464" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">2,500 rules</text>
  <rect x="775" y="112.8" width="80" height="327.2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="761" y="80.8" width="108" height="24" fill="#FFFFFF"/>
  <text x="815" y="98.8" text-anchor="middle" font-size="14" fill="#111111">50.0 million</text>
  <text x="815" y="464" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">10,000 rules</text>
  <text x="525" y="492" text-anchor="middle" font-size="15" fill="#111111">Doubling the rules roughly quadruples the pairs that could conflict</text>
  <text x="480" y="526" text-anchor="middle" font-size="13" fill="#333333">Exact values; the vertical axis is logarithmic. Not every pair interacts, but each must be considered when rules change.</text>
</svg>
