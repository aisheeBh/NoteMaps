<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Four approaches to defining artificial intelligence</title>
  <desc>A two-by-two grid. Columns: human standard and rational standard. Rows: thinking and acting. Cells: thinking humanly (cognitive modelling), thinking rationally (laws of logic), acting humanly (indistinguishable behaviour), acting rationally (rational agents, the dominant modern view).</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Four approaches to defining artificial intelligence</text>
  <text x="390.0" y="104" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Measured against humans</text>
  <text x="750.0" y="104" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Measured against an ideal</text>
  <text x="190" y="205.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111" transform="rotate(-90 190 205.0)">Thinking</text>
  <text x="190" y="395.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111" transform="rotate(-90 190 395.0)">Acting</text>
  <rect x="220" y="120" width="340" height="170" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="390.0" y="180.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Thinking humanly</text>
  <text x="390.0" y="200.2" text-anchor="middle" font-size="15" fill="#111111">model how people think;</text>
  <text x="390.0" y="220.2" text-anchor="middle" font-size="15" fill="#111111">test against human</text>
  <text x="390.0" y="240.2" text-anchor="middle" font-size="15" fill="#111111">thought processes</text>
  <rect x="580" y="120" width="340" height="170" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="588" y="128" width="324" height="154" fill="#FFFFFF"/>
  <text x="750.0" y="190.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Thinking rationally</text>
  <text x="750.0" y="210.2" text-anchor="middle" font-size="15" fill="#111111">reason correctly by</text>
  <text x="750.0" y="230.2" text-anchor="middle" font-size="15" fill="#111111">the laws of logic</text>
  <rect x="220" y="310" width="340" height="170" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="228" y="318" width="324" height="154" fill="#FFFFFF"/>
  <text x="390.0" y="370.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Acting humanly</text>
  <text x="390.0" y="390.2" text-anchor="middle" font-size="15" fill="#111111">behave in a way that</text>
  <text x="390.0" y="410.2" text-anchor="middle" font-size="15" fill="#111111">cannot be told apart</text>
  <text x="390.0" y="430.2" text-anchor="middle" font-size="15" fill="#111111">from a person</text>
  <rect x="580" y="310" width="340" height="170" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="750.0" y="370.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Acting rationally</text>
  <text x="750.0" y="390.2" text-anchor="middle" font-size="15" fill="#FFFFFF">do the best thing given</text>
  <text x="750.0" y="410.2" text-anchor="middle" font-size="15" fill="#FFFFFF">goals and information</text>
  <text x="750.0" y="430.2" text-anchor="middle" font-size="15" fill="#FFFFFF">(dominant modern view)</text>
  <text x="480" y="545" text-anchor="middle" font-size="13" fill="#333333">After the classification in Russell and Norvig's textbook (first edition 1995).</text>
</svg>
