<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Positions on whether a machine could have a mind</title>
  <desc>A horizontal spectrum from left, a machine could never have a mind, to right, the right program in any material would have one. Positions from left: non-computational views associated with Roger Penrose; biological naturalism associated with John Searle; embodied views associated with Hubert Dreyfus and Rodney Brooks, requiring a body acting in the world; functionalism, holding that the right organisation suffices; and Turing's behavioural stance, judging by behaviour.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Could a machine have a mind? A spectrum of positions</text>
  <line x1="70" y1="300" x2="890" y2="300" stroke="#222222" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="70" y="340" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">Computation can never</text>
  <text x="70" y="360" text-anchor="start" font-size="15" fill="#111111">be enough</text>
  <text x="890" y="340" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">The right program would</text>
  <text x="890" y="360" text-anchor="end" font-size="15" fill="#111111">be enough</text>
  <circle cx="150" cy="300" r="9" fill="#111111"/>
  <line x1="150" y1="291" x2="150" y2="210" stroke="#222222" stroke-width="2"/>
  <rect x="35" y="100" width="230" height="110" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="43" y="108" width="214" height="94" fill="#FFFFFF"/>
  <text x="150.0" y="140.9" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Non-computational</text>
  <text x="150.0" y="159.9" text-anchor="middle" font-size="14" fill="#111111">understanding exceeds</text>
  <text x="150.0" y="178.9" text-anchor="middle" font-size="14" fill="#111111">any algorithm (Penrose)</text>
  <circle cx="310" cy="300" r="9" fill="#111111"/>
  <line x1="310" y1="309" x2="310" y2="390" stroke="#222222" stroke-width="2"/>
  <rect x="195" y="390" width="230" height="110" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="203" y="398" width="214" height="94" fill="#FFFFFF"/>
  <text x="310.0" y="430.9" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Biological naturalism</text>
  <text x="310.0" y="449.9" text-anchor="middle" font-size="14" fill="#111111">brains have causal</text>
  <text x="310.0" y="468.9" text-anchor="middle" font-size="14" fill="#111111">powers programs lack (Searle)</text>
  <circle cx="480" cy="300" r="9" fill="#111111"/>
  <line x1="480" y1="291" x2="480" y2="210" stroke="#222222" stroke-width="2"/>
  <rect x="365" y="100" width="230" height="110" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="373" y="108" width="214" height="94" fill="#FFFFFF"/>
  <text x="480.0" y="140.9" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Embodied views</text>
  <text x="480.0" y="159.9" text-anchor="middle" font-size="14" fill="#111111">needs a body acting</text>
  <text x="480.0" y="178.9" text-anchor="middle" font-size="14" fill="#111111">in a world (Dreyfus, Brooks)</text>
  <circle cx="650" cy="300" r="9" fill="#111111"/>
  <line x1="650" y1="309" x2="650" y2="390" stroke="#222222" stroke-width="2"/>
  <rect x="535" y="390" width="230" height="110" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="543" y="398" width="214" height="94" fill="#FFFFFF"/>
  <text x="650.0" y="430.9" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Functionalism</text>
  <text x="650.0" y="449.9" text-anchor="middle" font-size="14" fill="#111111">the right organisation,</text>
  <text x="650.0" y="468.9" text-anchor="middle" font-size="14" fill="#111111">in any material</text>
  <circle cx="810" cy="300" r="9" fill="#111111"/>
  <line x1="810" y1="291" x2="810" y2="210" stroke="#222222" stroke-width="2"/>
  <rect x="695" y="100" width="230" height="110" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="810.0" y="140.9" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Behavioural stance</text>
  <text x="810.0" y="159.9" text-anchor="middle" font-size="14" fill="#FFFFFF">judge minds by</text>
  <text x="810.0" y="178.9" text-anchor="middle" font-size="14" fill="#FFFFFF">behaviour (Turing)</text>
  <text x="480" y="545" text-anchor="middle" font-size="13" fill="#333333">Simplified; thinkers' views are more nuanced than a single point, and positions can combine.</text>
</svg>
