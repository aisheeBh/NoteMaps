<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>What can be told and what can only be shown</title>
  <desc>An iceberg. Above the waterline, explicit knowledge that can be written as rules: tax rules, procedures, formulas, the rules of chess. Below the waterline, much larger tacit knowledge that can only be shown through examples: recognising faces, riding a bicycle, judging tone, sensing that a patient is unwell.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Explicit knowledge can be told; tacit knowledge must be shown</text>
  <polygon points="420,90 540,90 600,200 360,200" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="3"/>
  <polygon points="360,200 600,200 760,330 700,500 480,560 250,500 190,330" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="3"/>
  <line x1="40" y1="200" x2="920" y2="200" stroke="#222222" stroke-width="2.5" stroke-dasharray="10 6"/>
  <text x="910" y="222" text-anchor="end" font-size="14" fill="#111111">waterline</text>
  <rect x="390" y="112" width="180" height="76" rx="6" fill="none" stroke="none" stroke-width="0"/>
  <text x="480.0" y="135.9" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Explicit</text>
  <text x="480.0" y="154.9" text-anchor="middle" font-size="14" fill="#111111">rules, formulas,</text>
  <text x="480.0" y="173.9" text-anchor="middle" font-size="14" fill="#111111">procedures</text>
  <rect x="330" y="260" width="300" height="220" rx="6" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1.5"/>
  <text x="480.0" y="325.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Tacit</text>
  <text x="480.0" y="345.2" text-anchor="middle" font-size="15" fill="#111111">recognising a face</text>
  <text x="480.0" y="365.2" text-anchor="middle" font-size="15" fill="#111111">riding a bicycle</text>
  <text x="480.0" y="385.2" text-anchor="middle" font-size="15" fill="#111111">judging a tone of voice</text>
  <text x="480.0" y="405.2" text-anchor="middle" font-size="15" fill="#111111">sensing a patient is unwell</text>
  <text x="480.0" y="425.2" text-anchor="middle" font-size="15" fill="#111111">spotting a strong candidate</text>
  <rect x="40" y="80" width="280" height="100" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="180.0" y="115.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">TELL</text>
  <text x="180.0" y="135.2" text-anchor="middle" font-size="15" fill="#111111">write the rules down;</text>
  <text x="180.0" y="155.2" text-anchor="middle" font-size="15" fill="#111111">a machine can follow them</text>
  <rect x="680" y="80" width="240" height="100" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="800.0" y="115.9" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Examples</text>
  <text x="800.0" y="134.9" text-anchor="middle" font-size="14" fill="#111111">tax rules, chess rules,</text>
  <text x="800.0" y="153.9" text-anchor="middle" font-size="14" fill="#111111">a booking procedure</text>
  <rect x="30" y="380" width="200" height="110" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="38" y="388" width="184" height="94" fill="#FFFFFF"/>
  <text x="130.0" y="411.4" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">SHOW</text>
  <text x="130.0" y="430.4" text-anchor="middle" font-size="14" fill="#111111">give many examples;</text>
  <text x="130.0" y="449.4" text-anchor="middle" font-size="14" fill="#111111">the machine finds</text>
  <text x="130.0" y="468.4" text-anchor="middle" font-size="14" fill="#111111">the pattern</text>
  <rect x="760" y="380" width="170" height="110" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="845.0" y="411.4" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">We know</text>
  <text x="845.0" y="430.4" text-anchor="middle" font-size="14" fill="#111111">more than</text>
  <text x="845.0" y="449.4" text-anchor="middle" font-size="14" fill="#111111">we can tell</text>
  <text x="845.0" y="468.4" text-anchor="middle" font-size="14" fill="#111111">(Polanyi)</text>
  <text x="480" y="585" text-anchor="middle" font-size="13" fill="#333333">Schematic; the relative sizes are a metaphor, not a measurement.</text>
</svg>
