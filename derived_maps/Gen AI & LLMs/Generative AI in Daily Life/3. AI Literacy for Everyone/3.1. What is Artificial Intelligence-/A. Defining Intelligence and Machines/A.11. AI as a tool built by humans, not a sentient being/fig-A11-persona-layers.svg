<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Layers of design behind an AI persona</title>
  <desc>A stack of five layers from bottom to top: a model trained on large amounts of human writing; behaviour shaped by examples, ratings and principles; the deploying organisation's instructions giving a name, tone and rules; the interface with avatar, voice and first-person messages; and at the top the user, who perceives a someone.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">From trained model to perceived “someone”</text>
  <rect x="160.0" y="470" width="640" height="76" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="480.0" y="503.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">A model trained on human writing</text>
  <text x="480.0" y="523.2" text-anchor="middle" font-size="15" fill="#111111">patterns of language, including talk of feelings</text>
  <rect x="180.0" y="375" width="600" height="76" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="188.0" y="383" width="584" height="60" fill="#FFFFFF"/>
  <text x="480.0" y="408.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Behaviour shaped by the developer</text>
  <text x="480.0" y="428.2" text-anchor="middle" font-size="15" fill="#111111">examples, ratings, written principles</text>
  <rect x="200.0" y="280" width="560" height="76" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="208.0" y="288" width="544" height="60" fill="#FFFFFF"/>
  <text x="480.0" y="313.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Instructions from the deploying organisation</text>
  <text x="480.0" y="333.2" text-anchor="middle" font-size="15" fill="#111111">name, tone, topics, rules</text>
  <rect x="220.0" y="185" width="520" height="76" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="228.0" y="193" width="504" height="60" fill="#FFFFFF"/>
  <text x="480.0" y="218.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Interface design</text>
  <text x="480.0" y="238.2" text-anchor="middle" font-size="15" fill="#111111">avatar, voice, “I” messages, typing dots</text>
  <rect x="330" y="92" width="300" height="76" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="480.0" y="125.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">The user perceives</text>
  <text x="480.0" y="145.2" text-anchor="middle" font-size="15" fill="#FFFFFF">“someone who cares”</text>
  <line x1="480" y1="182" x2="480" y2="170" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="40" y="320" text-anchor="middle" font-size="15" fill="#111111" transform="rotate(-90 40 320)">Each layer is a human design choice</text>
  <line x1="70" y1="540" x2="70" y2="110" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="480" y="585" text-anchor="middle" font-size="13" fill="#333333">Simplified; real products combine these layers in different ways.</text>
</svg>
