<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Automation and intelligence as two dimensions</title>
  <desc>A grid. Horizontal axis: intelligence from low to high. Vertical axis: automation from low to high. Bottom left: pocket calculator, word processor. Top left: dishwasher, payroll batch job, timed traffic lights. Bottom right: AI assistant that drafts but does not send, diagnostic aid. Top right: driverless taxi, AI agent resolving tickets end to end, highest oversight needed.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Two separate questions: who acts, and how well it copes</text>
  <rect x="200" y="80" width="350" height="200" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="208" y="88" width="334" height="184" fill="#FFFFFF"/>
  <text x="375.0" y="155.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Automated, not intelligent</text>
  <text x="375.0" y="175.2" text-anchor="middle" font-size="15" fill="#111111">dishwasher</text>
  <text x="375.0" y="195.2" text-anchor="middle" font-size="15" fill="#111111">payroll batch job</text>
  <text x="375.0" y="215.2" text-anchor="middle" font-size="15" fill="#111111">timed traffic lights</text>
  <rect x="570" y="80" width="350" height="200" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="578" y="88" width="334" height="184" fill="#FFFFFF"/>
  <text x="745.0" y="155.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Automated and intelligent</text>
  <text x="745.0" y="175.2" text-anchor="middle" font-size="15" fill="#111111">driverless taxi</text>
  <text x="745.0" y="195.2" text-anchor="middle" font-size="15" fill="#111111">AI agent closing tickets</text>
  <text x="745.0" y="215.2" text-anchor="middle" font-size="15" fill="#111111">highest oversight needed</text>
  <rect x="200" y="300" width="350" height="200" rx="6" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="375.0" y="385.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Neither</text>
  <text x="375.0" y="405.2" text-anchor="middle" font-size="15" fill="#111111">pocket calculator</text>
  <text x="375.0" y="425.2" text-anchor="middle" font-size="15" fill="#111111">word processor</text>
  <rect x="570" y="300" width="350" height="200" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="578" y="308" width="334" height="184" fill="#FFFFFF"/>
  <text x="745.0" y="375.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Intelligent, not automated</text>
  <text x="745.0" y="395.2" text-anchor="middle" font-size="15" fill="#111111">AI assistant that drafts</text>
  <text x="745.0" y="415.2" text-anchor="middle" font-size="15" fill="#111111">but never sends</text>
  <text x="745.0" y="435.2" text-anchor="middle" font-size="15" fill="#111111">diagnostic suggestion aid</text>
  <line x1="180" y1="500" x2="180" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="150" y="290" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111" transform="rotate(-90 150 290)">Automation: the machine acts</text>
  <line x1="200" y1="520" x2="930" y2="520" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="560" y="548" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Intelligence: copes with variety and novelty</text>
  <text x="480" y="588" text-anchor="middle" font-size="13" fill="#333333">Examples are typical placements; individual products vary.</text>
</svg>
