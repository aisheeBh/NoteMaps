<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Calculating speed over time</title>
  <desc>Approximate operations per second on a logarithmic scale: a human computer about one every ten seconds; Harvard Mark I about three additions per second; ENIAC about five thousand; early 1980s personal computer about one million; a 2000 desktop about a billion; a modern AI accelerator chip well over a hundred trillion.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Operations per second, from human computers to modern chips</text>
  <line x1="160" y1="450" x2="900" y2="450" stroke="#222222" stroke-width="2.5"/>
  <line x1="160" y1="450" x2="160" y2="90" stroke="#222222" stroke-width="2.5"/>
  <line x1="160" y1="450.0" x2="900" y2="450.0" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="150" y="455.0" text-anchor="end" font-size="14" fill="#111111">0.1</text>
  <line x1="160" y1="427.5" x2="900" y2="427.5" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="150" y="432.5" text-anchor="end" font-size="14" fill="#111111">1</text>
  <line x1="160" y1="360.0" x2="900" y2="360.0" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="150" y="365.0" text-anchor="end" font-size="14" fill="#111111">thousand</text>
  <line x1="160" y1="292.5" x2="900" y2="292.5" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="150" y="297.5" text-anchor="end" font-size="14" fill="#111111">million</text>
  <line x1="160" y1="225.0" x2="900" y2="225.0" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="150" y="230.0" text-anchor="end" font-size="14" fill="#111111">billion</text>
  <line x1="160" y1="157.5" x2="900" y2="157.5" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="150" y="162.5" text-anchor="end" font-size="14" fill="#111111">trillion</text>
  <line x1="160" y1="90.0" x2="900" y2="90.0" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="150" y="95.0" text-anchor="end" font-size="14" fill="#111111">10¹⁵</text>
  <rect x="200" y="446.0" width="96" height="4.0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="248.0" y="474" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Human</text>
  <text x="248.0" y="492" text-anchor="middle" font-size="14" fill="#111111">c. 1900</text>
  <rect x="318" y="416.2" width="96" height="33.8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="366.0" y="474" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Mark I</text>
  <text x="366.0" y="492" text-anchor="middle" font-size="14" fill="#111111">1944</text>
  <rect x="436" y="344.2" width="96" height="105.8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="484.0" y="474" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">ENIAC</text>
  <text x="484.0" y="492" text-anchor="middle" font-size="14" fill="#111111">1946</text>
  <rect x="554" y="292.5" width="96" height="157.5" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="602.0" y="474" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Early PC</text>
  <text x="602.0" y="492" text-anchor="middle" font-size="14" fill="#111111">1980s</text>
  <rect x="672" y="225.0" width="96" height="225.0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="720.0" y="474" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Desktop</text>
  <text x="720.0" y="492" text-anchor="middle" font-size="14" fill="#111111">c. 2000</text>
  <rect x="790" y="105.8" width="96" height="344.2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="838.0" y="474" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">AI chip</text>
  <text x="838.0" y="492" text-anchor="middle" font-size="14" fill="#111111">2020s</text>
  <text x="480" y="545" text-anchor="middle" font-size="13" fill="#333333">Orders of magnitude only; the vertical axis is logarithmic and figures are rounded, approximate values.</text>
</svg>
