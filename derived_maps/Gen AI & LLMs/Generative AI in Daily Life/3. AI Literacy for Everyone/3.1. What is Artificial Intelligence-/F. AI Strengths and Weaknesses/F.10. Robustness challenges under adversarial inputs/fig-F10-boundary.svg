<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>A tiny step across a decision boundary</title>
  <desc>A two-dimensional picture of input space split by a decision boundary into a region labelled panda and a region labelled gibbon. A correctly classified input sits very close to the boundary. A short arrow, in the direction that crosses the boundary fastest, moves it into the other region. A longer arrow in a random direction does not cross.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Most inputs lie close to a boundary in some direction</text>
  <path d="M60 70 L 560 70 C 520 170, 640 230, 560 300 C 500 360, 560 440, 540 500 L 60 500 Z" fill="url(#hatch)" stroke="none"/>
  <path d="M560 70 L 900 70 L 900 500 L 540 500 C 560 440, 500 360, 560 300 C 640 230, 520 170, 560 70 Z" fill="url(#lines)" stroke="none"/>
  <path d="M560 70 C 520 170, 640 230, 560 300 C 500 360, 560 440, 540 500" fill="none" stroke="#000000" stroke-width="4"/>
  <rect x="150" y="90" width="260" height="40" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="280" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Region: "panda"</text>
  <text x="280" y="125" text-anchor="middle" font-size="14" fill="#111111">correct class</text>
  <rect x="690" y="90" width="190" height="40" fill="#FFFFFF" stroke="#8B0000" stroke-width="2"/>
  <text x="785" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Region: "gibbon"</text>
  <text x="785" y="125" text-anchor="middle" font-size="14" fill="#111111">wrong class</text>
  <circle cx="525" cy="270" r="10" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <circle cx="595" cy="262" r="10" fill="#000000" stroke="#000000" stroke-width="3"/>
  <line x1="537" y1="268" x2="581" y2="263" stroke="#000000" stroke-width="3.5" marker-end="url(#arrow)"/>
  <rect x="330" y="285" width="180" height="62" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="342" y="305" font-size="15" font-weight="bold" fill="#111111">Original input</text>
  <text x="342" y="323" font-size="14" fill="#111111">correct, near the</text>
  <text x="342" y="339" font-size="14" fill="#111111">boundary</text>
  <line x1="480" y1="285" x2="520" y2="278" stroke="#222222" stroke-width="1"/>
  <rect x="620" y="150" width="270" height="66" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="632" y="170" font-size="15" font-weight="bold" fill="#111111">Adversarial input</text>
  <text x="632" y="188" font-size="14" fill="#111111">a tiny, aimed step: looks the</text>
  <text x="632" y="206" font-size="14" fill="#111111">same to a person; now "gibbon"</text>
  <line x1="660" y1="216" x2="600" y2="254" stroke="#222222" stroke-width="1"/>
  <circle cx="300" cy="400" r="10" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <line x1="300" y1="400" x2="200" y2="440" stroke="#000000" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#arrow)"/>
  <rect x="320" y="420" width="190" height="62" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="332" y="440" font-size="15" font-weight="bold" fill="#111111">A large random change</text>
  <text x="332" y="458" font-size="14" fill="#111111">in a different direction</text>
  <text x="332" y="474" font-size="14" fill="#111111">stays in "panda"</text>
  <text x="480" y="524" text-anchor="middle" font-size="13" fill="#333333">Two-dimensional schematic of a space with thousands of dimensions; not to scale.</text>
</svg>
