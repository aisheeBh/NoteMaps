<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Saturation of a common-sense benchmark</title>
  <desc>Schematic: human accuracy on a common-sense benchmark is flat at about 95 per cent. The best model's accuracy starts below 50 per cent at release in 2019 and rises steeply over the following few years until it approaches the human line.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">From "hard for machines" to "solved" in a few years</text>
  <line x1="110" y1="440" x2="900" y2="440" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="110" y1="440" x2="110" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="505" y="490" text-anchor="middle" font-size="16" fill="#111111">Years after the benchmark's release</text>
  <text x="56" y="255" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 56 255)">Accuracy</text>
  <g font-size="14" fill="#111111">
    <text x="100" y="445" text-anchor="end">25%</text>
    <text x="100" y="321" text-anchor="end">50%</text>
    <text x="100" y="197" text-anchor="end">75%</text>
    <text x="100" y="98" text-anchor="end">95%</text>
  </g>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="150" y="462">release</text><text x="330" y="462">+1</text><text x="510" y="462">+2</text><text x="690" y="462">+3</text><text x="860" y="462">+4</text>
  </g>
  <line x1="110" y1="316" x2="880" y2="316" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="110" y1="192" x2="880" y2="192" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="150" y1="93" x2="880" y2="93" stroke="#222222" stroke-width="3" stroke-dasharray="10 6"/>
  <path d="M150 325 C 250 300, 300 200, 380 165 C 460 130, 560 112, 690 104 L 880 98" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <circle cx="150" cy="325" r="6" fill="#1F3B5C"/>
  <rect x="150" y="104" width="230" height="40" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="162" y="122" font-size="15" font-weight="bold" fill="#111111">People (dashed line)</text>
  <text x="162" y="138" font-size="14" fill="#111111">above 95% from the start</text>
  <rect x="420" y="240" width="330" height="64" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="432" y="262" font-size="15" font-weight="bold" fill="#111111">Best language model (solid line)</text>
  <text x="432" y="280" font-size="14" fill="#111111">below 50% at release, near human</text>
  <text x="432" y="296" font-size="14" fill="#111111">level within a few years</text>
  <line x1="470" y1="240" x2="420" y2="142" stroke="#1F3B5C" stroke-width="1"/>
  <rect x="140" y="350" width="270" height="64" fill="#FFFFFF" stroke="#555555" stroke-width="1" stroke-dasharray="8 4"/>
  <text x="152" y="372" font-size="14" font-weight="bold" fill="#111111">Open question</text>
  <text x="152" y="390" font-size="14" fill="#111111">common sense acquired, or the</text>
  <text x="152" y="406" font-size="14" fill="#111111">test's patterns learned?</text>
  <text x="480" y="524" text-anchor="middle" font-size="13" fill="#333333">Schematic of the reported trajectory on HellaSwag (released 2019); intermediate points are not plotted from data.</text>
</svg>
