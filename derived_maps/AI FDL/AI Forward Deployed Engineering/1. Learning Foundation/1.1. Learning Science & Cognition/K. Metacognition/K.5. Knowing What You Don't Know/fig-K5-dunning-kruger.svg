<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Perceived and actual performance by quartile</title>
  <desc>For four groups ranked by actual test score, actual percentile rises steeply from bottom to top quartile while self-estimated percentile rises only gently and stays above the 50th percentile. The bottom quartile overestimates most; the top quartile slightly underestimates.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Self-estimates rise far less steeply than actual scores</text>

  <g stroke="#DDDDDD" stroke-width="1">
    <line x1="140" y1="100" x2="820" y2="100"/><line x1="140" y1="180" x2="820" y2="180"/>
    <line x1="140" y1="260" x2="820" y2="260"/><line x1="140" y1="340" x2="820" y2="340"/>
  </g>
  <line x1="140" y1="420" x2="850" y2="420" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="140" y1="420" x2="140" y2="76" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g font-size="14" fill="#111111" text-anchor="end">
    <text x="130" y="425">0</text><text x="130" y="345">20</text><text x="130" y="265">40</text>
    <text x="130" y="185">60</text><text x="130" y="105">80</text>
  </g>
  <text x="60" y="250" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 60 250)">Percentile rank</text>
  <g font-size="15" fill="#111111" text-anchor="middle">
    <text x="230" y="446">Bottom</text><text x="400" y="446">Second</text><text x="570" y="446">Third</text><text x="740" y="446">Top</text>
  </g>
  <text x="485" y="478" text-anchor="middle" font-size="16" fill="#111111">Quartile of actual score</text>
  <line x1="140" y1="220" x2="820" y2="220" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="826" y="224" font-size="14" fill="#111111">50th</text>

  <!-- actual: dashed -->
  <polyline points="230,372 400,272 570,172 740,72" fill="none" stroke="#222222" stroke-width="3" stroke-dasharray="10 6"/>
  <g fill="#FFFFFF" stroke="#222222" stroke-width="2.5"><circle cx="230" cy="372" r="6"/><circle cx="400" cy="272" r="6"/><circle cx="570" cy="172" r="6"/><circle cx="740" cy="72" r="6"/></g>
  <!-- perceived: solid -->
  <polyline points="230,176 400,166 570,150 740,120" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <g fill="#1F3B5C"><circle cx="230" cy="176" r="6"/><circle cx="400" cy="166" r="6"/><circle cx="570" cy="150" r="6"/><circle cx="740" cy="120" r="6"/></g>

  <rect x="250" y="96" width="220" height="44" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="262" y="114" font-size="15" font-weight="bold" fill="#111111">Self-estimated rank</text>
  <text x="262" y="132" font-size="14" fill="#111111">fairly flat, above average</text>

  <rect x="430" y="320" width="200" height="44" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="442" y="338" font-size="15" font-weight="bold" fill="#111111">Actual rank</text>
  <text x="442" y="356" font-size="14" fill="#111111">rises by definition</text>

  <line x1="210" y1="184" x2="210" y2="364" stroke="#8B0000" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="250" y="270" font-size="14" font-weight="bold" fill="#111111">largest</text><text x="250" y="288" font-size="14" font-weight="bold" fill="#111111">overestimate</text>

  <text x="480" y="512" text-anchor="middle" font-size="13" fill="#333333">Schematic of the pattern in Kruger and Dunning (1999). Regression to the mean and the better-than-average effect</text>
  <text x="480" y="530" text-anchor="middle" font-size="13" fill="#333333">produce part or much of this shape; how much reflects a specific metacognitive deficit is debated.</text>
</svg>
