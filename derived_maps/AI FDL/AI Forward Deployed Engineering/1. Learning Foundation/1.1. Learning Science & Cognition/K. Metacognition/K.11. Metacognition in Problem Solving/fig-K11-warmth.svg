<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Feelings of warmth before a solution</title>
  <desc>Rated closeness to a solution in the minute before solving. For incremental problems such as algebra, warmth climbs steadily. For insight problems, warmth stays low and flat until a sudden jump at the moment of solution.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Felt progress tracks some problems and not others</text>

  <line x1="140" y1="420" x2="860" y2="420" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="140" y1="420" x2="140" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="500" y="460" text-anchor="middle" font-size="16" fill="#111111">Time approaching the solution</text>
  <text x="820" y="446" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">solved</text>
  <text x="160" y="446" font-size="14" fill="#111111">start</text>
  <text x="60" y="245" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 60 245)">Rated warmth: how close it feels</text>
  <line x1="820" y1="420" x2="820" y2="80" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/>

  <!-- incremental: solid rising -->
  <polyline points="160,380 260,350 360,320 460,280 560,240 660,190 760,140 820,100" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <!-- insight: dashed flat then jump -->
  <polyline points="160,390 260,388 360,392 460,386 560,390 660,384 760,382 800,378 820,96" fill="none" stroke="#222222" stroke-width="3" stroke-dasharray="10 6"/>

  <rect x="200" y="150" width="260" height="46" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="212" y="170" font-size="15" font-weight="bold" fill="#111111">Incremental problems</text>
  <text x="212" y="188" font-size="14" fill="#111111">warmth climbs steadily</text>

  <rect x="510" y="318" width="270" height="46" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="522" y="338" font-size="15" font-weight="bold" fill="#111111">Insight problems</text>
  <text x="522" y="356" font-size="14" fill="#111111">flat, then a sudden jump</text>

  <text x="480" y="515" text-anchor="middle" font-size="13" fill="#333333">Schematic of the pattern reported by Metcalfe and Wiebe (1987); not plotted from their data.</text>
</svg>
