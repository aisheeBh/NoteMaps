<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Predicted and actual recall for re-reading and self-testing</title>
  <desc>Paired bars for two study methods. Re-reading: predicted recall is high but recall a week later is low. Self-testing: predicted recall is lower but recall a week later is high. The feeling of learning runs opposite to the result.</desc>
  <defs>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">The method that feels best is not the one that works best</text>

  <line x1="120" y1="420" x2="860" y2="420" stroke="#222222" stroke-width="2.5"/>
  <line x1="120" y1="420" x2="120" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="60" y="250" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 60 250)">Recall: predicted or actual</text>

  <!-- re-reading -->
  <rect x="190" y="130" width="110" height="290" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="320" y="290" width="110" height="130" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <!-- self-testing -->
  <rect x="530" y="220" width="110" height="200" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="660" y="140" width="110" height="280" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>

  <!-- bar labels on white -->
  <rect x="195" y="96" width="100" height="26" fill="#FFFFFF"/>
  <text x="245" y="115" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">predicted</text>
  <rect x="320" y="256" width="110" height="26" fill="#FFFFFF"/>
  <text x="375" y="275" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">after a week</text>
  <rect x="535" y="186" width="100" height="26" fill="#FFFFFF"/>
  <text x="585" y="205" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">predicted</text>
  <rect x="660" y="106" width="110" height="26" fill="#FFFFFF"/>
  <text x="715" y="125" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">after a week</text>

  <text x="310" y="450" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">RE-READING</text>
  <text x="310" y="472" text-anchor="middle" font-size="14" fill="#111111">fluent, comfortable</text>
  <text x="650" y="450" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">SELF-TESTING</text>
  <text x="650" y="472" text-anchor="middle" font-size="14" fill="#111111">effortful, uncomfortable</text>

  <text x="480" y="525" text-anchor="middle" font-size="13" fill="#333333">Schematic of the pattern reported by Roediger and Karpicke (2006); bar heights are illustrative, not data.</text>
</svg>
