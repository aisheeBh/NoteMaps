<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Curiosity and prior knowledge: the information-gap account</title>
  <desc>An inverted-U curve. Curiosity is low when a learner knows almost nothing about a topic, because no gap is noticed; it peaks when the learner knows enough to see a small, specific gap; and it falls again when the learner already knows nearly everything. Three annotated points mark these zones.</desc>
  <defs>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Curiosity peaks when a gap becomes visible</text>

  <!-- sweet-spot band -->
  <rect x="470" y="90" width="180" height="350" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>

  <line x1="110" y1="440" x2="860" y2="440" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="110" y1="440" x2="110" y2="80" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="66" y="265" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 66 265)">Curiosity</text>
  <text x="480" y="500" text-anchor="middle" font-size="16" fill="#111111">How much the learner already knows about the topic</text>
  <text x="130" y="465" font-size="14" fill="#111111">almost nothing</text>
  <text x="840" y="465" text-anchor="end" font-size="14" fill="#111111">almost everything</text>

  <path d="M130 420 C 300 400, 430 130, 560 125 C 680 122, 760 330, 840 410" fill="none" stroke="#1F3B5C" stroke-width="4"/>

  <circle cx="200" cy="405" r="7" fill="#1F3B5C"/>
  <rect x="150" y="300" width="220" height="60" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="260" y="324" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">No gap noticed</text>
  <text x="260" y="345" text-anchor="middle" font-size="14" fill="#111111">too little to know what is missing</text>

  <circle cx="560" cy="125" r="8" fill="#1F3B5C"/>
  <rect x="480" y="150" width="160" height="80" fill="#FFFFFF" stroke="#7A5200" stroke-width="2"/>
  <text x="560" y="174" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">A small, specific</text>
  <text x="560" y="194" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">gap is visible</text>
  <text x="560" y="216" text-anchor="middle" font-size="14" fill="#111111">curiosity highest</text>

  <circle cx="820" cy="392" r="7" fill="#1F3B5C"/>
  <rect x="670" y="300" width="200" height="60" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="770" y="324" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">No gap left</text>
  <text x="770" y="345" text-anchor="middle" font-size="14" fill="#111111">nothing more to find out</text>

  <text x="480" y="540" text-anchor="middle" font-size="13" fill="#333333">Schematic of the information-gap account (Loewenstein, 1994); not plotted from a single dataset.</text>
</svg>
