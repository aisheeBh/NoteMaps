<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>How long new habits take to become automatic</title>
  <desc>Schematic of the pattern reported by Lally and colleagues in 2010. Automaticity rises steeply at first and then levels off. For a fast-forming habit it reaches its plateau in about 18 days, for the median participant in about 66 days, and for the slowest in about 254 days. The popular figure of 21 days lies near the fastest case, not the typical one.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Habits take weeks to months, not 21 days</text>
  <line x1="110" y1="450" x2="860" y2="450" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="110" y1="450" x2="110" y2="80" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="62" y="280" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 62 280)">Automaticity (self-rated)</text>
  <text x="465" y="500" text-anchor="middle" font-size="16" fill="#111111">Days of daily repetition in the same context</text>
  <text x="110" y="472" text-anchor="middle" font-size="14" fill="#111111">0</text>
  <line x1="110" y1="450" x2="110" y2="456" stroke="#222222" stroke-width="2"/>
  <text x="241" y="472" text-anchor="middle" font-size="14" fill="#111111">50</text>
  <line x1="241" y1="450" x2="241" y2="456" stroke="#222222" stroke-width="2"/>
  <text x="373" y="472" text-anchor="middle" font-size="14" fill="#111111">100</text>
  <line x1="373" y1="450" x2="373" y2="456" stroke="#222222" stroke-width="2"/>
  <text x="504" y="472" text-anchor="middle" font-size="14" fill="#111111">150</text>
  <line x1="504" y1="450" x2="504" y2="456" stroke="#222222" stroke-width="2"/>
  <text x="636" y="472" text-anchor="middle" font-size="14" fill="#111111">200</text>
  <line x1="636" y1="450" x2="636" y2="456" stroke="#222222" stroke-width="2"/>
  <text x="767" y="472" text-anchor="middle" font-size="14" fill="#111111">250</text>
  <line x1="767" y1="450" x2="767" y2="456" stroke="#222222" stroke-width="2"/>
  <line x1="110" y1="127" x2="820" y2="127" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="828" y="132" font-size="14" fill="#111111">plateau</text>
