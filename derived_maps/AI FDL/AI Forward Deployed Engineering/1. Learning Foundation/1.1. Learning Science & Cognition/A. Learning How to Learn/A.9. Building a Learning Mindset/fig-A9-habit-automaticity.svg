  <circle cx="157.3" cy="127.0" r="6" fill="#1E5E24"/>
  <circle cx="283.6" cy="127.0" r="6" fill="#1F3B5C"/>
  <circle cx="777.9" cy="127.0" r="6" fill="#8B0000"/>
  <rect x="150" y="56" width="190" height="44" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1.5"/>
  <text x="160" y="75" font-size="14" font-weight="bold" fill="#111111">Fastest: about 18 days</text>
  <text x="160" y="93" font-size="14" fill="#111111">simpler behaviours</text>
  <rect x="294" y="172" width="210" height="44" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="304" y="191" font-size="14" font-weight="bold" fill="#111111">Median: about 66 days</text>
  <text x="304" y="209" font-size="14" fill="#111111">typical participant</text>
  <rect x="557" y="300" width="230" height="44" fill="#FFFFFF" stroke="#8B0000" stroke-width="1.5"/>
  <text x="567" y="319" font-size="14" font-weight="bold" fill="#111111">Slowest: about 254 days</text>
  <text x="567" y="337" font-size="14" fill="#111111">estimated by extrapolation</text>
  <line x1="165" y1="450" x2="165" y2="390" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="171" y="392" width="150" height="26" fill="#FFFFFF"/>
  <text x="175" y="410" font-size="14" fill="#111111">popular "21 days"</text>
  <text x="480" y="560" text-anchor="middle" font-size="13" fill="#333333">Schematic curves shaped to the reported fastest, median and slowest times; not the study's raw data.</text>
</svg>
