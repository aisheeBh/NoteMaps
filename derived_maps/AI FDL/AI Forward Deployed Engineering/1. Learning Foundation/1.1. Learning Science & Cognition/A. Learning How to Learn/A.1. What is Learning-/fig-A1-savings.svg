<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>The savings method</title>
  <desc>A learner needs ten study trials to learn a list. A week later nothing can be recalled, yet only four trials are needed to relearn it. The six trials saved show that learning persisted even though recall failed.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Savings: hidden learning revealed by relearning</text>

  <line x1="120" y1="440" x2="640" y2="440" stroke="#222222" stroke-width="2.5"/>
  <line x1="120" y1="440" x2="120" y2="90" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="70" y="265" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 70 265)">Study trials needed</text>
  <g font-size="13" fill="#111111" text-anchor="end">
    <text x="112" y="444">0</text><text x="112" y="284">5</text><text x="112" y="124">10</text>
  </g>
  <g stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4">
    <line x1="120" y1="280" x2="640" y2="280"/><line x1="120" y1="120" x2="640" y2="120"/>
  </g>

  <rect x="170" y="120" width="120" height="320" fill="#1F3B5C" stroke="#000000" stroke-width="2.5"/>
  <text x="230" y="470" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Day 1</text>
  <text x="230" y="490" text-anchor="middle" font-size="14" fill="#111111">original learning</text>
  <text x="230" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">10 trials</text>

  <rect x="330" y="420" width="120" height="20" fill="#FFFFFF" stroke="#222222" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="390" y="470" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Day 8</text>
  <text x="390" y="490" text-anchor="middle" font-size="14" fill="#111111">recall test</text>
  <text x="390" y="408" text-anchor="middle" font-size="14" fill="#111111">nothing recalled</text>

  <rect x="490" y="312" width="120" height="128" fill="url(#hatch)" stroke="#222222" stroke-width="2.5"/>
  <rect x="490" y="120" width="120" height="192" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="550" y="470" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Day 8</text>
  <text x="550" y="490" text-anchor="middle" font-size="14" fill="#111111">relearning</text>
  <rect x="505" y="355" width="90" height="40" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="550" y="380" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">4 trials</text>
  <rect x="500" y="195" width="100" height="40" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="550" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">6 saved</text>

  <rect x="670" y="140" width="260" height="230" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="800" y="172" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Savings score</text>
  <text x="800" y="210" text-anchor="middle" font-size="15" fill="#111111">(original − relearning)</text>
  <line x1="700" y1="222" x2="900" y2="222" stroke="#222222" stroke-width="1.5"/>
  <text x="800" y="244" text-anchor="middle" font-size="15" fill="#111111">original</text>
  <text x="800" y="290" text-anchor="middle" font-size="15" fill="#111111">= (10 − 4) / 10</text>
  <text x="800" y="330" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">= 60 %</text>

  <text x="480" y="535" text-anchor="middle" font-size="13" fill="#333333">Worked illustration of the method Ebbinghaus introduced in 1885; the numbers are illustrative.</text>
</svg>
