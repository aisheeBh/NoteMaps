<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Sleep stages across a typical night</title>
  <desc>Schematic hypnogram of an eight-hour night in a young adult. Deep slow-wave sleep is concentrated in the first half of the night; REM sleep periods become longer towards the morning. Sleep cycles last roughly ninety minutes.</desc>
  <defs>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
  </defs>

  <text x="480" y="38" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">A night of sleep: deep sleep early, REM sleep late</text>

  <!-- stage labels -->
  <g font-size="15" fill="#111111" text-anchor="end">
    <text x="108" y="125">Awake</text>
    <text x="108" y="175">REM</text>
    <text x="108" y="225">Light (N1)</text>
    <text x="108" y="275">Light (N2)</text>
    <text x="108" y="335">Deep (N3)</text>
  </g>
  <g stroke="#CCCCCC" stroke-width="1">
    <line x1="120" y1="120" x2="880" y2="120"/><line x1="120" y1="170" x2="880" y2="170"/>
    <line x1="120" y1="220" x2="880" y2="220"/><line x1="120" y1="270" x2="880" y2="270"/>
    <line x1="120" y1="330" x2="880" y2="330"/>
  </g>

  <!-- N3 bars -->
  <g fill="url(#cross)" stroke="#1E5E24" stroke-width="2">
    <rect x="167" y="320" width="67" height="20"/>
    <rect x="329" y="320" width="57" height="20"/>
    <rect x="529" y="320" width="19" height="20"/>
  </g>
  <!-- REM bars -->
  <g fill="url(#dots)" stroke="#7A5200" stroke-width="2">
    <rect x="253" y="160" width="19" height="20"/>
    <rect x="415" y="160" width="38" height="20"/>
    <rect x="586" y="160" width="57" height="20"/>
    <rect x="719" y="160" width="76" height="20"/>
    <rect x="833" y="160" width="38" height="20"/>
  </g>

  <!-- hypnogram line -->
  <path d="M120 120 H130 V220 H144 V270 H167 V330 H234 V270 H253 V170 H272 V270 H329 V330 H386 V270 H415 V170 H453 V270 H529 V330 H548 V270 H586 V170 H643 V270 H719 V170 H795 V270 H833 V170 H871 V120 H880" fill="none" stroke="#111111" stroke-width="2.5"/>

  <!-- x axis -->
  <line x1="120" y1="370" x2="880" y2="370" stroke="#222222" stroke-width="2"/>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="120" y="392">0</text><text x="215" y="392">1</text><text x="310" y="392">2</text>
    <text x="405" y="392">3</text><text x="500" y="392">4</text><text x="595" y="392">5</text>
    <text x="690" y="392">6</text><text x="785" y="392">7</text><text x="880" y="392">8</text>
  </g>
  <text x="500" y="414" text-anchor="middle" font-size="15" fill="#111111">Hours after falling asleep</text>

  <!-- annotations -->
  <rect x="120" y="434" width="360" height="78" fill="#FFFFFF" stroke="#1E5E24" stroke-width="3"/>
  <text x="134" y="456" font-size="15" font-weight="bold" fill="#111111">First half: most deep slow-wave sleep</text>
  <text x="134" y="476" font-size="14" fill="#111111">hippocampal replay, slow oscillations and</text>
  <text x="134" y="494" font-size="14" fill="#111111">spindles; linked to consolidating facts and events</text>

  <rect x="510" y="434" width="370" height="78" fill="#FFFFFF" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="524" y="456" font-size="15" font-weight="bold" fill="#111111">Second half: longer REM periods</text>
  <text x="524" y="476" font-size="14" fill="#111111">vivid dreaming; proposed roles in emotional and</text>
  <text x="524" y="494" font-size="14" fill="#111111">integrative memory are still debated</text>

  <text x="480" y="540" text-anchor="middle" font-size="13" fill="#333333">Schematic of a typical young adult's night; cycles of roughly 90 minutes; real nights vary widely.</text>
</svg>
