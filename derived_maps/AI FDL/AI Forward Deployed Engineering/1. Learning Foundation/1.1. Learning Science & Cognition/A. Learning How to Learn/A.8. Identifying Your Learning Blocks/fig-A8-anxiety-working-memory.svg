<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>How worry competes with a task for limited working memory</title>
  <desc>Three horizontal bars against a fixed working-memory capacity. A calm learner on a simple task uses part of the capacity for the task and has spare capacity. An anxious learner on the same task uses part of the capacity for worry, leaving little spare. An anxious learner on a demanding task needs more than the remaining capacity, so part of the task demand cannot be met, producing errors and blanking.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Worry takes up room the task needs</text>

  <!-- capacity: x 260 to 780 -->
  <line x1="780" y1="70" x2="780" y2="430" stroke="#222222" stroke-width="3"/>
  <text x="780" y="64" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">capacity limit</text>
  <line x1="260" y1="80" x2="260" y2="430" stroke="#222222" stroke-width="1.5"/>

  <!-- bar 1 -->
  <text x="240" y="118" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Calm learner,</text>
  <text x="240" y="138" text-anchor="end" font-size="15" fill="#111111">simple task</text>
  <rect x="260" y="95" width="300" height="56" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="560" y="95" width="220" height="56" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <rect x="370" y="111" width="80" height="24" fill="#FFFFFF"/>
  <text x="410" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">task</text>
  <text x="670" y="128" text-anchor="middle" font-size="14" fill="#111111">spare</text>

  <!-- bar 2 -->
  <text x="240" y="228" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Anxious learner,</text>
  <text x="240" y="248" text-anchor="end" font-size="15" fill="#111111">simple task</text>
  <rect x="260" y="205" width="180" height="56" fill="url(#lines)" stroke="#8B0000" stroke-width="2"/>
  <rect x="440" y="205" width="300" height="56" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="740" y="205" width="40" height="56" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <rect x="305" y="221" width="90" height="24" fill="#FFFFFF"/>
  <text x="350" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">worry</text>
  <rect x="550" y="221" width="80" height="24" fill="#FFFFFF"/>
  <text x="590" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">task</text>

  <!-- bar 3 -->
  <text x="240" y="338" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Anxious learner,</text>
  <text x="240" y="358" text-anchor="end" font-size="15" fill="#111111">demanding task</text>
  <rect x="260" y="315" width="180" height="56" fill="url(#lines)" stroke="#8B0000" stroke-width="2"/>
  <rect x="440" y="315" width="340" height="56" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="780" y="315" width="120" height="56" fill="#FFFFFF" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="305" y="331" width="90" height="24" fill="#FFFFFF"/>
  <text x="350" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">worry</text>
  <rect x="570" y="331" width="80" height="24" fill="#FFFFFF"/>
  <text x="610" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">task</text>
  <text x="840" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">unmet</text>
  <text x="840" y="358" text-anchor="middle" font-size="14" fill="#111111">demand</text>
  <text x="840" y="394" text-anchor="middle" font-size="14" fill="#111111">errors, blanking</text>

  <rect x="60" y="446" width="840" height="50" fill="#F2F2F2" stroke="#222222" stroke-width="1.5"/>
  <text x="480" y="468" text-anchor="middle" font-size="15" fill="#111111">Worry matters most when the task itself is demanding: reduce the worry, reduce the</text>
  <text x="480" y="488" text-anchor="middle" font-size="15" fill="#111111">task's load, or build fluency so the task needs less working memory.</text>
  <text x="480" y="524" text-anchor="middle" font-size="13" fill="#333333">Schematic of the attentional account of anxiety; proportions are illustrative, not measured.</text>
</svg>
