<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Harlow's learning-set effect</title>
  <desc>Schematic curve: accuracy on the second trial of each new discrimination problem starts near chance (50 percent) for the first problems and rises towards nearly perfect after a few hundred problems, showing that the monkeys learned how to learn this class of problem.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Learning how to learn a class of problems</text>

  <!-- chance band -->
  <rect x="120" y="380" width="760" height="40" fill="url(#dots)" stroke="#7A5200" stroke-width="1" stroke-dasharray="8 4"/>
  <rect x="660" y="388" width="200" height="24" fill="#FFFFFF"/>
  <text x="760" y="406" text-anchor="middle" font-size="15" fill="#111111">chance level (guessing)</text>

  <!-- axes -->
  <line x1="120" y1="440" x2="900" y2="440" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="440" x2="120" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g font-size="14" fill="#111111" text-anchor="end">
    <text x="110" y="405">50%</text>
    <text x="110" y="245">75%</text>
    <text x="110" y="105">100%</text>
  </g>
  <line x1="114" y1="400" x2="126" y2="400" stroke="#222222" stroke-width="2"/>
  <line x1="114" y1="240" x2="126" y2="240" stroke="#222222" stroke-width="2"/>
  <line x1="114" y1="100" x2="126" y2="100" stroke="#222222" stroke-width="2"/>
  <line x1="126" y1="100" x2="880" y2="100" stroke="#999999" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="500" y="476" text-anchor="middle" font-size="16" fill="#111111">Number of different problems already experienced (first few to a few hundred)</text>
  <text x="50" y="260" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 50 260)">Correct on trial 2 of a new problem</text>

  <!-- curve -->
  <path d="M140 392 C 230 330, 300 210, 400 165 C 500 125, 640 112, 860 108" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <circle cx="140" cy="392" r="7" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="3"/>
  <circle cx="860" cy="108" r="7" fill="#1F3B5C" stroke="#000000" stroke-width="1.5"/>

  <!-- labels -->
  <rect x="160" y="300" width="290" height="50" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <text x="172" y="321" font-size="15" font-weight="bold" fill="#111111">Early problems</text>
  <text x="172" y="340" font-size="14" fill="#111111">each one learned slowly, by trial and error</text>

  <rect x="520" y="136" width="330" height="70" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="532" y="158" font-size="15" font-weight="bold" fill="#111111">After hundreds of problems</text>
  <text x="532" y="178" font-size="14" fill="#111111">one trial is enough: a general rule,</text>
  <text x="532" y="196" font-size="14" fill="#111111">"win, stay; lose, switch", has been learned</text>

  <text x="480" y="520" text-anchor="middle" font-size="13" fill="#333333">Schematic of the pattern reported by Harlow (1949); not plotted from his data.</text>
</svg>
