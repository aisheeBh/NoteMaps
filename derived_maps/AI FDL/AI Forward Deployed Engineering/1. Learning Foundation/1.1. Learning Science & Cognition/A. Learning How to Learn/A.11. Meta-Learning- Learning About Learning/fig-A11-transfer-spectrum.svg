<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>From near to far transfer</title>
  <desc>A horizontal spectrum from near transfer to far transfer with four example moves: one spreadsheet tool to another, one programming language to another, logistics analysis to hospital capacity planning, and learning a language to learning surgery. Below, three bands: specific content and techniques transfer well near and fade with distance; habits of approach such as deconstructing, planning feedback and reviewing carry across the whole range; general mind-training claims are not supported at any distance.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
  </defs>

  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">What carries over as fields grow further apart</text>

  <!-- spectrum axis -->
  <line x1="60" y1="90" x2="900" y2="90" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="60" y="72" font-size="17" font-weight="bold" fill="#111111">NEAR TRANSFER</text>
  <text x="900" y="72" text-anchor="end" font-size="17" font-weight="bold" fill="#111111">FAR TRANSFER</text>

  <!-- examples -->
  <g font-size="14" fill="#111111" text-anchor="middle">
    <circle cx="150" cy="90" r="8" fill="#111111"/>
    <rect x="62" y="106" width="176" height="46" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
    <text x="150" y="125">one spreadsheet tool</text>
    <text x="150" y="143">to another</text>
    <circle cx="370" cy="90" r="8" fill="#111111"/>
    <rect x="282" y="106" width="176" height="46" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
    <text x="370" y="125">one programming</text>
    <text x="370" y="143">language to another</text>
    <circle cx="590" cy="90" r="8" fill="#111111"/>
    <rect x="502" y="106" width="176" height="46" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
    <text x="590" y="125">logistics analysis to</text>
    <text x="590" y="143">hospital bed planning</text>
    <circle cx="810" cy="90" r="8" fill="#111111"/>
    <rect x="722" y="106" width="176" height="46" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
    <text x="810" y="125">learning a language</text>
    <text x="810" y="143">to learning surgery</text>
  </g>

  <!-- band 1: specific content, tapering wedge -->
  <path d="M60 190 L900 250 L900 262 L60 300 Z" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="80" y="222" width="430" height="48" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1.5"/>
  <text x="92" y="242" font-size="15" font-weight="bold" fill="#111111">Specific content and techniques</text>
  <text x="92" y="261" font-size="14" fill="#111111">transfer well when fields share elements; fade with distance</text>

  <!-- band 2: habits, full width -->
  <rect x="60" y="320" width="840" height="100" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="80" y="336" width="800" height="68" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1.5"/>
  <text x="96" y="360" font-size="15" font-weight="bold" fill="#111111">Habits of approach carry across the whole range</text>
  <text x="96" y="384" font-size="14" fill="#111111">deconstructing the field · planning for feedback · unaided checkpoints · reviewing each project · expecting difficulty</text>

  <!-- band 3: not supported -->
  <rect x="60" y="440" width="840" height="70" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="80" y="454" width="800" height="42" fill="#FFFFFF" stroke="#8B0000" stroke-width="1.5"/>
  <text x="96" y="480" font-size="15" fill="#111111"><tspan font-weight="bold">Not supported at any distance:</tspan> "brain training" that raises general learning power</text>

  <text x="480" y="548" text-anchor="middle" font-size="13" fill="#333333">Schematic synthesis of transfer research; band widths are illustrative, not measured.</text>
</svg>
