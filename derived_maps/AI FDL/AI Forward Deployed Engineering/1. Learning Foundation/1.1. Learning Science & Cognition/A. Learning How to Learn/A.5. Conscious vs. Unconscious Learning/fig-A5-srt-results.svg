<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The serial reaction time task</title>
  <desc>Schematic results. People responding to a hidden repeating sequence become steadily faster over blocks; when the sequence is secretly replaced by random order in block 8 their responses slow sharply, then speed up again when the sequence returns. A group that sees random order throughout improves only slightly.</desc>
  <defs>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="38" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Fingers learn a sequence the mind may not notice</text>

  <!-- random block band -->
  <rect x="680" y="80" width="60" height="330" fill="url(#lines)" stroke="#8B0000" stroke-width="1.5" stroke-dasharray="3 3"/>
  <rect x="640" y="84" width="140" height="44" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
  <text x="710" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Block 8: order</text>
  <text x="710" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">secretly random</text>

  <!-- axes -->
  <line x1="110" y1="410" x2="850" y2="410" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="110" y1="410" x2="110" y2="80" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="470" y="462" text-anchor="middle" font-size="16" fill="#111111">Block of trials</text>
  <text x="58" y="245" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 58 245)">Reaction time (higher = slower)</text>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="150" y="432">1</text><text x="230" y="432">2</text><text x="310" y="432">3</text>
    <text x="390" y="432">4</text><text x="470" y="432">5</text><text x="550" y="432">6</text>
    <text x="630" y="432">7</text><text x="710" y="432">8</text><text x="790" y="432">9</text>
  </g>

  <!-- random-throughout group: dashed -->
  <path d="M150 160 L230 182 L310 197 L390 212 L470 220 L550 227 L630 232 L710 235 L790 238" fill="none" stroke="#222222" stroke-width="3" stroke-dasharray="10 6"/>
  <g fill="#FFFFFF" stroke="#222222" stroke-width="2">
    <rect x="145" y="155" width="10" height="10"/><rect x="225" y="177" width="10" height="10"/><rect x="305" y="192" width="10" height="10"/>
    <rect x="385" y="207" width="10" height="10"/><rect x="465" y="215" width="10" height="10"/><rect x="545" y="222" width="10" height="10"/>
    <rect x="625" y="227" width="10" height="10"/><rect x="705" y="230" width="10" height="10"/><rect x="785" y="233" width="10" height="10"/>
  </g>

  <!-- sequence group: solid -->
  <path d="M150 160 L230 220 L310 265 L390 302 L470 332 L550 355 L630 370 L710 220 L790 362" fill="none" stroke="#1F3B5C" stroke-width="4.5"/>
  <g fill="#1F3B5C" stroke="#000000" stroke-width="1">
    <circle cx="150" cy="160" r="6"/><circle cx="230" cy="220" r="6"/><circle cx="310" cy="265" r="6"/>
    <circle cx="390" cy="302" r="6"/><circle cx="470" cy="332" r="6"/><circle cx="550" cy="355" r="6"/>
    <circle cx="630" cy="370" r="6"/><circle cx="710" cy="220" r="6"/><circle cx="790" cy="362" r="6"/>
  </g>

  <!-- direct labels -->
  <rect x="300" y="110" width="290" height="44" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="312" y="129" font-size="15" font-weight="bold" fill="#111111">Random order throughout</text>
  <text x="312" y="146" font-size="14" fill="#111111">small general speed-up only</text>
  <rect x="180" y="330" width="250" height="44" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="192" y="349" font-size="15" font-weight="bold" fill="#111111">Hidden repeating sequence</text>
  <text x="192" y="366" font-size="14" fill="#111111">steadily faster responses</text>

  <rect x="790" y="250" width="140" height="80" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
  <text x="800" y="270" font-size="14" fill="#111111">the jump back up</text>
  <text x="800" y="288" font-size="14" fill="#111111">shows that the</text>
  <text x="800" y="306" font-size="14" fill="#111111">sequence itself</text>
  <text x="800" y="324" font-size="14" fill="#111111">was learned</text>

  <text x="480" y="500" text-anchor="middle" font-size="14" fill="#111111">In the original study, many participants who showed the effect could not report the sequence; so did amnesic patients.</text>
  <text x="480" y="530" text-anchor="middle" font-size="13" fill="#333333">Schematic after Nissen and Bullemer (1987) and later replications; not plotted from a single dataset.</text>
</svg>
