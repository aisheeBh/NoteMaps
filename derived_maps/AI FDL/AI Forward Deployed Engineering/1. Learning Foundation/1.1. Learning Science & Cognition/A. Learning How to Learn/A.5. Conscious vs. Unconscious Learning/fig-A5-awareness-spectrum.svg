<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>A spectrum from explicit to implicit learning</title>
  <desc>A horizontal spectrum running from explicit learning, which is intentional, aware and reportable, to implicit learning, which is incidental, largely unaware and hard to report, with five workplace and everyday examples placed along it.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="38" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Learning runs from fully explicit to largely implicit</text>

  <!-- spectrum bar -->
  <rect x="80" y="250" width="400" height="44" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="480" y="250" width="400" height="44" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <line x1="60" y1="272" x2="78" y2="272" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="900" y1="272" x2="882" y2="272" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- end labels -->
  <rect x="80" y="310" width="250" height="66" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <text x="205" y="334" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">EXPLICIT</text>
  <text x="205" y="356" text-anchor="middle" font-size="14" fill="#FFFFFF">intentional, aware, reportable</text>
  <rect x="670" y="310" width="262" height="66" fill="#FFFFFF" stroke="#7A5200" stroke-width="3" stroke-dasharray="8 4"/>
  <text x="801" y="334" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">IMPLICIT</text>
  <text x="801" y="356" text-anchor="middle" font-size="14" fill="#111111">incidental, unaware, hard to report</text>

  <!-- markers -->
  <g fill="#FFFFFF" stroke="#111111" stroke-width="2">
    <circle cx="140" cy="272" r="9"/><circle cx="310" cy="272" r="9"/><circle cx="480" cy="272" r="9"/>
    <circle cx="650" cy="272" r="9"/><circle cx="820" cy="272" r="9"/>
  </g>

  <!-- examples above -->
  <line x1="140" y1="200" x2="140" y2="262" stroke="#222222" stroke-width="1.5"/>
  <rect x="60" y="100" width="190" height="100" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="155" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Memorising a</text>
  <text x="155" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">new tax threshold</text>
  <text x="155" y="172" text-anchor="middle" font-size="14" fill="#111111">deliberate; easily stated</text>

  <line x1="480" y1="200" x2="480" y2="262" stroke="#222222" stroke-width="1.5"/>
  <rect x="380" y="100" width="200" height="100" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="480" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Absorbing a team's</text>
  <text x="480" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">unwritten norms</text>
  <text x="480" y="172" text-anchor="middle" font-size="14" fill="#111111">partly noticed, rarely stated</text>

  <line x1="820" y1="200" x2="820" y2="262" stroke="#222222" stroke-width="1.5"/>
  <rect x="700" y="100" width="210" height="100" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="805" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Native-language</text>
  <text x="805" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">grammar</text>
  <text x="805" y="172" text-anchor="middle" font-size="14" fill="#111111">used perfectly, rules unknown</text>

  <!-- examples below -->
  <line x1="310" y1="282" x2="310" y2="400" stroke="#222222" stroke-width="1.5"/>
  <rect x="200" y="400" width="220" height="90" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="310" y="426" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Following a checklist</text>
  <text x="310" y="446" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">until it sticks</text>
  <text x="310" y="470" text-anchor="middle" font-size="14" fill="#111111">explicit start, fading awareness</text>

  <line x1="650" y1="282" x2="650" y2="400" stroke="#222222" stroke-width="1.5"/>
  <rect x="540" y="400" width="220" height="90" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="650" y="426" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Touch typing</text>
  <text x="650" y="446" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">fingers know the keys</text>
  <text x="650" y="470" text-anchor="middle" font-size="14" fill="#111111">fluent, location not reportable</text>

  <text x="480" y="522" text-anchor="middle" font-size="14" fill="#111111">Most real learning mixes both modes; the boundary between them is graded, not sharp.</text>
  <text x="480" y="546" text-anchor="middle" font-size="13" fill="#333333">Schematic; positions are illustrative.</text>
</svg>
