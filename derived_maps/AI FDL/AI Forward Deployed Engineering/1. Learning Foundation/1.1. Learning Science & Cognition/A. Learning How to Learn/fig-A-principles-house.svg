<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The core principles of learning how to learn</title>
  <desc>A house diagram. The roof is durable, transferable learning. Five pillars hold it up: retrieval, spacing, variation, explanation and feedback. They stand on a foundation of what learning is: learning differs from performance, prior knowledge matters most, working memory is small, and learning takes many forms. Beneath everything is the learner: calibration, beliefs about difficulty, self-regulation, and conditions such as attention, sleep and safety.</desc>
  <defs>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
  </defs>

  <text x="480" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">What durable learning rests on</text>

  <!-- roof -->
  <polygon points="480,56 900,170 60,170" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="276" y="116" width="408" height="40" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1.5"/>
  <text x="480" y="143" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">DURABLE, TRANSFERABLE LEARNING</text>

  <!-- pillars -->
  <g font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">
    <rect x="90" y="186" width="140" height="160" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="3"/>
    <text x="160" y="250">RETRIEVAL</text>
    <text x="160" y="276" font-size="14" font-weight="normal">recall to</text>
    <text x="160" y="294" font-size="14" font-weight="normal">strengthen</text>
    <rect x="250" y="186" width="140" height="160" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="3"/>
    <text x="320" y="250">SPACING</text>
    <text x="320" y="276" font-size="14" font-weight="normal">return after</text>
    <text x="320" y="294" font-size="14" font-weight="normal">gaps</text>
    <rect x="410" y="186" width="140" height="160" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="3"/>
    <text x="480" y="250">VARIATION</text>
    <text x="480" y="276" font-size="14" font-weight="normal">mixed, varied</text>
    <text x="480" y="294" font-size="14" font-weight="normal">practice</text>
    <rect x="570" y="186" width="140" height="160" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="3"/>
    <text x="640" y="250">EXPLANATION</text>
    <text x="640" y="276" font-size="14" font-weight="normal">connect and</text>
    <text x="640" y="294" font-size="14" font-weight="normal">ask why</text>
    <rect x="730" y="186" width="140" height="160" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="3"/>
    <text x="800" y="250">FEEDBACK</text>
    <text x="800" y="276" font-size="14" font-weight="normal">close the gap</text>
    <text x="800" y="294" font-size="14" font-weight="normal">on the task</text>
  </g>

  <!-- foundation -->
  <rect x="60" y="362" width="840" height="110" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="78" y="376" width="804" height="82" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="96" y="402" font-size="17" font-weight="bold" fill="#111111">FOUNDATION: WHAT LEARNING IS</text>
  <text x="96" y="426" font-size="15" fill="#111111">learning is not performance · prior knowledge matters most · working memory is small ·</text>
  <text x="96" y="446" font-size="15" fill="#111111">learning takes many forms, some without awareness</text>

  <!-- learner base -->
  <rect x="30" y="488" width="900" height="110" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="10 6"/>
  <rect x="48" y="502" width="864" height="82" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="66" y="528" font-size="17" font-weight="bold" fill="#111111">GROUND: THE LEARNER WHO APPLIES THEM</text>
  <text x="66" y="552" font-size="15" fill="#111111">calibration by testing, not feeling · difficulty seen as part of learning · self-regulation ·</text>
  <text x="66" y="572" font-size="15" fill="#111111">conditions: protected attention, sleep, safety to make mistakes</text>
</svg>
