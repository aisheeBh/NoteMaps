<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Average growth-mindset intervention effects on a standardised scale</title>
  <desc>A horizontal scale of standardised effect size from 0 to 0.9 with Cohen's conventional benchmarks of 0.2 small, 0.5 medium and 0.8 large. The 2018 meta-analysis average for growth-mindset interventions, about 0.08, sits far below the small benchmark. The 2023 analysis restricted to the highest-quality studies found an average indistinguishable from zero. An effect of 0.08 moves the average treated student from the 50th to about the 53rd percentile.</desc>
  <defs>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">How large are average mindset-intervention effects?</text>

  <!-- scale: d 0 at x=100, 0.9 at x=880 => 866.7 px per unit -->
  <line x1="100" y1="290" x2="890" y2="290" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <g stroke="#222222" stroke-width="2">
    <line x1="100" y1="290" x2="100" y2="302"/><line x1="187" y1="290" x2="187" y2="302"/><line x1="273" y1="290" x2="273" y2="302"/>
    <line x1="360" y1="290" x2="360" y2="302"/><line x1="447" y1="290" x2="447" y2="302"/><line x1="533" y1="290" x2="533" y2="302"/>
    <line x1="620" y1="290" x2="620" y2="302"/><line x1="707" y1="290" x2="707" y2="302"/><line x1="793" y1="290" x2="793" y2="302"/>
  </g>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="100" y="320">0</text><text x="187" y="320">0.1</text><text x="273" y="320">0.2</text><text x="360" y="320">0.3</text><text x="447" y="320">0.4</text>
    <text x="533" y="320">0.5</text><text x="620" y="320">0.6</text><text x="707" y="320">0.7</text><text x="793" y="320">0.8</text>
  </g>
  <text x="480" y="350" text-anchor="middle" font-size="16" fill="#111111">Standardised effect size (Cohen's d) on academic achievement</text>

  <!-- benchmarks -->
  <g stroke="#555555" stroke-width="1.5" stroke-dasharray="3 4">
    <line x1="273" y1="120" x2="273" y2="290"/><line x1="533" y1="120" x2="533" y2="290"/><line x1="793" y1="120" x2="793" y2="290"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">
    <text x="273" y="110">small 0.2</text><text x="533" y="110">medium 0.5</text><text x="793" y="110">large 0.8</text>
  </g>
  <text x="663" y="140" text-anchor="middle" font-size="14" fill="#111111">Cohen's conventional benchmarks</text>

  <!-- markers -->
  <line x1="169" y1="230" x2="169" y2="290" stroke="#1F3B5C" stroke-width="4"/>
  <circle cx="169" cy="225" r="8" fill="#1F3B5C"/>
  <rect x="290" y="176" width="300" height="50" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="440" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">2018 meta-analysis: about 0.08</text>
  <text x="440" y="218" text-anchor="middle" font-size="14" fill="#111111">average across intervention studies</text>
  <line x1="290" y1="201" x2="180" y2="222" stroke="#1F3B5C" stroke-width="2"/>

  <rect x="93" y="276" width="14" height="14" fill="#FFFFFF" stroke="#8B0000" stroke-width="3"/>
  <rect x="120" y="380" width="420" height="50" fill="#FFFFFF" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="330" y="402" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">2023, highest-quality studies only:</text>
  <text x="330" y="422" text-anchor="middle" font-size="14" fill="#111111">average not distinguishable from zero</text>
  <line x1="150" y1="380" x2="108" y2="292" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>

  <rect x="600" y="380" width="300" height="70" fill="#F2F2F2" stroke="#222222" stroke-width="1.5"/>
  <text x="750" y="404" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">d = 0.08 in plain terms</text>
  <text x="750" y="426" text-anchor="middle" font-size="14" fill="#111111">the average treated student moves</text>
  <text x="750" y="444" text-anchor="middle" font-size="14" fill="#111111">from the 50th to about the 53rd percentile</text>

  <text x="480" y="500" text-anchor="middle" font-size="13" fill="#333333">Averages hide variation: larger effects were reported for some lower-achieving and disadvantaged groups.</text>
</svg>
