<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The time scales at which learning is studied</title>
  <desc>A logarithmic time axis from a tenth of a millisecond to several months, with four bands after Allen Newell: biological, cognitive, rational and social, each with typical processes and the discipline that mainly studies it.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">The time scales at which learning is studied</text>

  <!-- bracket for linking scales -->
  <line x1="300" y1="86" x2="880" y2="86" stroke="#222222" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="420" y="72" width="340" height="26" fill="#FFFFFF"/>
  <text x="590" y="91" text-anchor="middle" font-size="15" font-style="italic" fill="#111111">do small effects add up to large ones?</text>

  <!-- bands -->
  <rect x="40"  y="110" width="200" height="300" fill="url(#lines)" stroke="#222222" stroke-width="2"/>
  <rect x="260" y="110" width="200" height="300" fill="url(#hatch)" stroke="#222222" stroke-width="2"/>
  <rect x="480" y="110" width="200" height="300" fill="url(#dots)" stroke="#222222" stroke-width="2"/>
  <rect x="700" y="110" width="200" height="300" fill="url(#cross)" stroke="#222222" stroke-width="2"/>

  <g text-anchor="middle" fill="#111111">
    <rect x="52" y="126" width="176" height="268" fill="#FFFFFF" stroke="#8B0000" stroke-width="1.5"/>
    <text x="140" y="156" font-size="17" font-weight="bold">BIOLOGICAL</text>
    <text x="140" y="180" font-size="14">0.1 ms to 10 ms</text>
    <text x="140" y="222" font-size="14">neurons firing,</text>
    <text x="140" y="240" font-size="14">synapses changing</text>
    <text x="140" y="340" font-size="14" font-weight="bold">Mainly studied by</text>
    <text x="140" y="360" font-size="14">neuroscience</text>

    <rect x="272" y="126" width="176" height="268" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1.5"/>
    <text x="360" y="156" font-size="17" font-weight="bold">COGNITIVE</text>
    <text x="360" y="180" font-size="14">0.1 s to 10 s</text>
    <text x="360" y="222" font-size="14">noticing, recognising,</text>
    <text x="360" y="240" font-size="14">one act of recall</text>
    <text x="360" y="340" font-size="14" font-weight="bold">Mainly studied by</text>
    <text x="360" y="360" font-size="14">cognitive psychology</text>

    <rect x="492" y="126" width="176" height="268" fill="#FFFFFF" stroke="#7A5200" stroke-width="1.5"/>
    <text x="580" y="156" font-size="17" font-weight="bold">RATIONAL</text>
    <text x="580" y="180" font-size="14">minutes to hours</text>
    <text x="580" y="222" font-size="14">solving a problem,</text>
    <text x="580" y="240" font-size="14">studying a chapter</text>
    <text x="580" y="340" font-size="14" font-weight="bold">Mainly studied by</text>
    <text x="580" y="360" font-size="14">problem-solving research</text>

    <rect x="712" y="126" width="176" height="268" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1.5"/>
    <text x="800" y="156" font-size="17" font-weight="bold">SOCIAL</text>
    <text x="800" y="180" font-size="14">days to months</text>
    <text x="800" y="222" font-size="14">courses, careers,</text>
    <text x="800" y="240" font-size="14">organisations</text>
    <text x="800" y="340" font-size="14" font-weight="bold">Mainly studied by</text>
    <text x="800" y="360" font-size="14">education research</text>
  </g>

  <!-- time axis -->
  <line x1="40" y1="450" x2="915" y2="450" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <g stroke="#222222" stroke-width="2">
    <line x1="40" y1="444" x2="40" y2="456"/>
    <line x1="260" y1="444" x2="260" y2="456"/>
    <line x1="480" y1="444" x2="480" y2="456"/>
    <line x1="700" y1="444" x2="700" y2="456"/>
    <line x1="900" y1="444" x2="900" y2="456"/>
  </g>
  <g text-anchor="middle" font-size="14" fill="#111111">
    <text x="40" y="476">0.1 ms</text>
    <text x="260" y="476">0.1 s</text>
    <text x="480" y="476">1 minute</text>
    <text x="700" y="476">1 day</text>
    <text x="890" y="476">months</text>
  </g>
  <text x="480" y="504" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Time scale of the process, logarithmic</text>
  <text x="480" y="540" text-anchor="middle" font-size="13" fill="#333333">After Allen Newell's bands of human action (1990); boundaries are approximate.</text>
</svg>
