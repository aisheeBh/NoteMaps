<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Schematic of progressive focus-block length over twelve weeks</title>
  <desc>Twelve bars for weeks one to twelve, rising in steps through baseline, build and extend phases, then levelling off in consolidation. Values are schematic.</desc>
