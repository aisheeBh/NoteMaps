<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>A spatial cueing trial in three steps</title>
  <desc>Three frames show a spatial cueing trial: fixation, a peripheral cue, and a target that appears on the cued side (valid) or the uncued side (invalid). The eyes stay on the central cross throughout. Schematic.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="480" y="56" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">A spatial cueing trial</text>
  <text x="480" y="84" text-anchor="middle" font-size="15" fill="#111111">The eyes stay on the central cross; attention is moved by the cue alone.</text>
  <!-- Frame 1: fixation -->
  <text x="190" y="142" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">1. Fixation</text>
  <rect x="60" y="160" width="260" height="200" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="190" y="272" text-anchor="middle" font-size="36" fill="#111111">+</text>
  <!-- Frame 2: cue -->
  <text x="480" y="142" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">2. Cue</text>
  <rect x="350" y="160" width="260" height="200" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="480" y="272" text-anchor="middle" font-size="36" fill="#111111">+</text>
  <circle cx="390" cy="260" r="14" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <text x="390" y="312" text-anchor="middle" font-size="14" fill="#111111">cue flashes</text>
  <text x="390" y="330" text-anchor="middle" font-size="14" fill="#111111">on the left</text>
  <!-- Frame 3: target -->
  <text x="770" y="142" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">3. Target</text>
  <rect x="640" y="160" width="260" height="200" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="770" y="272" text-anchor="middle" font-size="36" fill="#111111">+</text>
  <rect x="682" y="248" width="24" height="24" fill="#111111"/>
  <text x="694" y="312" text-anchor="middle" font-size="14" fill="#111111">Valid:</text>
  <text x="694" y="330" text-anchor="middle" font-size="14" fill="#111111">cued side</text>
  <rect x="824" y="248" width="24" height="24" fill="#FFFFFF" stroke="#111111" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="836" y="312" text-anchor="middle" font-size="14" fill="#111111">Invalid:</text>
  <text x="836" y="330" text-anchor="middle" font-size="14" fill="#111111">uncued side</text>
  <!-- Arrows between frames -->
  <line x1="326" y1="260" x2="342" y2="260" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="616" y1="260" x2="632" y2="260" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <!-- Measure box -->
  <rect x="160" y="394" width="640" height="92" fill="#F2F2F2" stroke="#555555" stroke-width="1.5"/>
  <text x="480" y="428" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Cueing effect = response time on invalid trials minus response time on valid trials</text>
  <text x="480" y="458" text-anchor="middle" font-size="14" fill="#111111">A larger positive difference means attention was drawn to the cued side.</text>
  <text x="480" y="520" text-anchor="middle" font-size="13" fill="#111111">Schematic of the general design; not drawn from a particular dataset.</text>
</svg>
