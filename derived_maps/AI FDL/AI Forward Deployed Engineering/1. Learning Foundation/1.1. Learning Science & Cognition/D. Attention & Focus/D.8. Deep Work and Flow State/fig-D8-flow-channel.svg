<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The flow channel between anxiety and boredom</title>
  <desc>Schematic diagram of a diagonal flow channel. Above it, challenge exceeds skill and anxiety results. Below it, skill exceeds challenge and boredom results. A dashed path shows a learner staying in the channel as skill grows.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
<text x="40" y="60" font-size="22" text-anchor="start" font-weight="bold" fill="#111111">The flow channel: challenge matched to skill</text>
<polygon points="140,300.0 820,120.0 820,240.0 140,420.0" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
<rect x="370" y="312" width="150" height="28" rx="4" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1.5"/>
<text x="445" y="332" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">Flow channel</text>
<text x="170" y="150" font-size="16" text-anchor="start" font-weight="bold" fill="#111111">Anxiety: challenge exceeds skill</text>
<text x="560" y="390" font-size="16" text-anchor="start" font-weight="bold" fill="#111111">Boredom: skill exceeds challenge</text>
<polyline points="200.0,344.0 400.0,291.0 600.0,238.0 780.0,191.0" fill="none" stroke="#111111" stroke-width="3" stroke-dasharray="10 6"/>
<line x1="760" y1="196" x2="780" y2="191" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
<text x="600" y="272" font-size="14" text-anchor="start" font-weight="normal" fill="#333333">learner raises challenge</text>
<text x="600" y="290" font-size="14" text-anchor="start" font-weight="normal" fill="#333333">as skill grows</text>
<line x1="120" y1="470" x2="840" y2="470" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="120" y1="470" x2="120" y2="100" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="480" y="505" font-size="16" text-anchor="middle" font-weight="normal" fill="#111111">Skill</text>
<text x="70" y="285" font-size="16" text-anchor="middle" font-weight="normal" fill="#111111" transform="rotate(-90 70 285)">Challenge</text>
<text x="40" y="530" font-size="14" text-anchor="start" font-weight="normal" fill="#333333">Schematic of Csikszentmihalyi's model; boundaries are illustrative.</text>
</svg>
