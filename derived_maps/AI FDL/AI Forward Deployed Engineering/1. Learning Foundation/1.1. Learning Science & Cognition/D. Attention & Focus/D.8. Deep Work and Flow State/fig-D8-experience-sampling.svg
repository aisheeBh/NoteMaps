<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The experience-sampling procedure</title>
  <desc>Five-step schematic: random signal, report of current activity, ratings of attention, mood and challenge, repetition across days, and comparison of states.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
<text x="40" y="60" font-size="22" text-anchor="start" font-weight="bold" fill="#111111">The experience-sampling procedure</text>
<rect x="40" y="200" width="150" height="110" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2" color="#111111"/>
<text x="115.0" y="241.2" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">Random signal</text>
<text x="115.0" y="260.2" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">at unpredictable</text>
<text x="115.0" y="279.2" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">times</text>
<line x1="190" y1="255" x2="220" y2="255" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="220" y="200" width="150" height="110" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5" color="#111111"/>
<text x="295.0" y="250.8" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">Report the current</text>
<text x="295.0" y="269.8" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">activity</text>
<line x1="370" y1="255" x2="400" y2="255" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="400" y="200" width="150" height="110" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5" color="#111111"/>
<text x="475.0" y="250.8" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">Rate attention,</text>
<text x="475.0" y="269.8" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">mood and challenge</text>
<line x1="550" y1="255" x2="580" y2="255" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="580" y="200" width="150" height="110" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5" color="#111111"/>
<text x="655.0" y="250.8" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">Repeat across</text>
<text x="655.0" y="269.8" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">days and tasks</text>
<line x1="730" y1="255" x2="760" y2="255" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="760" y="200" width="150" height="110" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3" color="#111111"/>
<text x="835.0" y="250.8" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">Compare states</text>
<text x="835.0" y="269.8" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">across conditions</text>
<text x="40" y="380" font-size="16" text-anchor="start" font-weight="normal" fill="#111111">Reports are taken as they happen, so they are not limited to memorable moments.</text>
<text x="40" y="420" font-size="16" text-anchor="start" font-weight="normal" fill="#111111">Responses are aggregated across many moments for each person and condition.</text>
<text x="40" y="500" font-size="14" text-anchor="start" font-weight="normal" fill="#333333">Schematic of the procedure; no results are shown.</text>
</svg>
