<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>Schematic: demand from competing tasks against a fixed attentional capacity</title>
  <desc>Three stacked bars show processing demand for one task, two tasks and three tasks. A dashed line marks the capacity limit. The third bar exceeds the limit. Schematic, not measured data.</desc>
  <defs>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="480" y="48" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Demand from competing tasks against a fixed capacity</text>
  <text x="480" y="76" text-anchor="middle" font-size="15" fill="#111111">Schematic; the units are illustrative, not measured.</text>
  <text transform="translate(112 290) rotate(-90)" text-anchor="middle" font-size="15" fill="#111111">Processing demand (schematic units)</text>
  <line x1="160" y1="170" x2="800" y2="170" stroke="#111111" stroke-width="2.5" stroke-dasharray="10 6"/>
  <text x="172" y="162" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">Capacity limit</text>
  <line x1="160" y1="450" x2="800" y2="450" stroke="#222222" stroke-width="1.5"/>
  <line x1="160" y1="114" x2="160" y2="450" stroke="#222222" stroke-width="1.5"/>
  <!-- Scenario 1: one task -->
  <rect x="220" y="282" width="120" height="168" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="280" y="372" text-anchor="middle" font-size="15" fill="#111111">Task A</text>
  <!-- Scenario 2: two tasks -->
  <rect x="420" y="338" width="120" height="112" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="480" y="398" text-anchor="middle" font-size="15" fill="#111111">Task A</text>
  <rect x="420" y="226" width="120" height="112" fill="#D3ECD3" stroke="#1E5E24" stroke-width="2"/>
  <text x="480" y="286" text-anchor="middle" font-size="15" fill="#111111">Task B</text>
  <!-- Scenario 3: three tasks, exceeds limit -->
  <rect x="620" y="338" width="120" height="112" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="680" y="398" text-anchor="middle" font-size="15" fill="#111111">Task A</text>
  <rect x="620" y="226" width="120" height="112" fill="#D3ECD3" stroke="#1E5E24" stroke-width="2"/>
  <text x="680" y="286" text-anchor="middle" font-size="15" fill="#111111">Task B</text>
  <rect x="620" y="114" width="120" height="112" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="628" y="138" width="104" height="30" fill="#FFFFFF"/>
  <text x="680" y="158" text-anchor="middle" font-size="15" fill="#111111">Task C</text>
  <!-- Scenario labels -->
  <text x="280" y="482" text-anchor="middle" font-size="16" fill="#111111">One task</text>
  <text x="480" y="482" text-anchor="middle" font-size="16" fill="#111111">Two tasks</text>
  <text x="680" y="482" text-anchor="middle" font-size="16" fill="#111111">Three tasks</text>
  <text x="680" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#8B0000">Demand exceeds capacity</text>
  <text x="480" y="516" text-anchor="middle" font-size="14" fill="#111111">Each block is the demand of one task. Schematic; not plotted from a single dataset.</text>
</svg>
