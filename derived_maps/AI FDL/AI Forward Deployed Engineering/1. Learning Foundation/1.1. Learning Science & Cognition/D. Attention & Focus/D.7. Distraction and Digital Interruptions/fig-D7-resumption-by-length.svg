<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Schematic of resumption lag by interruption length and demand</title>
  <desc>Four schematic bars showing that resumption lag is expected to be larger for longer and more demanding interruptions. The values are relative and illustrative.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
<text x="40" y="60" font-size="22" text-anchor="start" font-weight="bold" fill="#111111">Resumption lag by interruption length and demand</text>
<line x1="130" y1="430" x2="130" y2="120" stroke="#222222" stroke-width="2"/>
<line x1="130" y1="430" x2="860" y2="430" stroke="#222222" stroke-width="2"/>
<text x="60" y="275" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111" transform="rotate(-90 60 275)">Relative resumption lag (schematic)</text>
<rect x="180" y="346.0" width="130" height="84.0" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2" color="#111111"/>
<text x="245.0" y="392.9" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111"></text>
<text x="245" y="455" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">Brief,</text>
<text x="245" y="475" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">simple</text>
<rect x="350" y="290.0" width="130" height="140.0" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2" color="#111111"/>
<text x="415.0" y="364.9" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111"></text>
<text x="415" y="455" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">Brief,</text>
<text x="415" y="475" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">demanding</text>
<rect x="520" y="262.0" width="130" height="168.0" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2" color="#111111"/>
<text x="585.0" y="350.9" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111"></text>
<text x="585" y="455" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">Long,</text>
<text x="585" y="475" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">simple</text>
<rect x="690" y="178.0" width="130" height="252.0" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2" color="#111111"/>
<text x="755.0" y="308.9" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111"></text>
<text x="755" y="455" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">Long,</text>
<text x="755" y="475" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">demanding</text>
<text x="40" y="515" font-size="14" text-anchor="start" font-weight="normal" fill="#333333">Schematic: relative levels only; not measured values.</text>
</svg>
