<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Blocked and interleaved study of four categories</title>
  <desc>Two rows of the same twelve study items, each item drawn as a labelled tile. In the blocked row, the three items of each category appear together in turn. In the interleaved row, the categories alternate so that similar but different categories sit side by side. Schematic illustration of study order.</desc>

  <text x="480" y="52" text-anchor="middle" font-size="22" font-weight="700" fill="#111111">The same items, studied in two orders</text>

  <!-- Legend -->
  <rect x="150" y="80" width="28" height="22" fill="url(#hatch)" stroke="#1F3B5C"/>
  <text x="188" y="97" font-size="16" fill="#111111">Category 1</text>
  <rect x="320" y="80" width="28" height="22" fill="url(#dots)" stroke="#7A5200"/>
  <text x="358" y="97" font-size="16" fill="#111111">Category 2</text>
  <rect x="490" y="80" width="28" height="22" fill="url(#cross)" stroke="#1E5E24"/>
  <text x="528" y="97" font-size="16" fill="#111111">Category 3</text>
  <rect x="660" y="80" width="28" height="22" fill="#E6E6E6" stroke="#666666" stroke-dasharray="2 4"/>
  <text x="698" y="97" font-size="16" fill="#111111">Category 4</text>

  <!-- Blocked row -->
  <text x="40" y="160" font-size="18" font-weight="700" fill="#111111">Blocked</text>
  <text x="40" y="184" font-size="15" fill="#111111">all items of one category, then the next</text>
  <g font-size="15" font-weight="700" fill="#111111" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">
    <rect x="40" y="200" width="66" height="60" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/><text x="73" y="236">1a</text>
    <rect x="114" y="200" width="66" height="60" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/><text x="147" y="236">1b</text>
    <rect x="188" y="200" width="66" height="60" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/><text x="221" y="236">1c</text>
    <rect x="262" y="200" width="66" height="60" fill="url(#dots)" stroke="#7A5200" stroke-width="1.5"/><text x="295" y="236">2a</text>
    <rect x="336" y="200" width="66" height="60" fill="url(#dots)" stroke="#7A5200" stroke-width="1.5"/><text x="369" y="236">2b</text>
    <rect x="410" y="200" width="66" height="60" fill="url(#dots)" stroke="#7A5200" stroke-width="1.5"/><text x="443" y="236">2c</text>
    <rect x="484" y="200" width="66" height="60" fill="url(#cross)" stroke="#1E5E24" stroke-width="1.5"/><text x="517" y="236">3a</text>
    <rect x="558" y="200" width="66" height="60" fill="url(#cross)" stroke="#1E5E24" stroke-width="1.5"/><text x="591" y="236">3b</text>
    <rect x="632" y="200" width="66" height="60" fill="url(#cross)" stroke="#1E5E24" stroke-width="1.5"/><text x="665" y="236">3c</text>
    <rect x="706" y="200" width="66" height="60" fill="#E6E6E6" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/><text x="739" y="236">4a</text>
    <rect x="780" y="200" width="66" height="60" fill="#E6E6E6" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/><text x="813" y="236">4b</text>
    <rect x="854" y="200" width="66" height="60" fill="#E6E6E6" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/><text x="887" y="236">4c</text>
  </g>

  <!-- Interleaved row -->
  <text x="40" y="330" font-size="18" font-weight="700" fill="#111111">Interleaved</text>
  <text x="40" y="354" font-size="15" fill="#111111">categories alternate, so contrasts sit side by side</text>
  <g font-size="15" font-weight="700" fill="#111111" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">
    <rect x="40" y="370" width="66" height="60" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/><text x="73" y="406">1a</text>
    <rect x="114" y="370" width="66" height="60" fill="url(#dots)" stroke="#7A5200" stroke-width="1.5"/><text x="147" y="406">2a</text>
    <rect x="188" y="370" width="66" height="60" fill="url(#cross)" stroke="#1E5E24" stroke-width="1.5"/><text x="221" y="406">3a</text>
    <rect x="262" y="370" width="66" height="60" fill="#E6E6E6" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/><text x="295" y="406">4a</text>
    <rect x="336" y="370" width="66" height="60" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/><text x="369" y="406">1b</text>
    <rect x="410" y="370" width="66" height="60" fill="url(#dots)" stroke="#7A5200" stroke-width="1.5"/><text x="443" y="406">2b</text>
    <rect x="484" y="370" width="66" height="60" fill="url(#cross)" stroke="#1E5E24" stroke-width="1.5"/><text x="517" y="406">3b</text>
    <rect x="558" y="370" width="66" height="60" fill="#E6E6E6" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/><text x="591" y="406">4b</text>
    <rect x="632" y="370" width="66" height="60" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/><text x="665" y="406">1c</text>
    <rect x="706" y="370" width="66" height="60" fill="url(#dots)" stroke="#7A5200" stroke-width="1.5"/><text x="739" y="406">2c</text>
    <rect x="780" y="370" width="66" height="60" fill="url(#cross)" stroke="#1E5E24" stroke-width="1.5"/><text x="813" y="406">3c</text>
    <rect x="854" y="370" width="66" height="60" fill="#E6E6E6" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/><text x="887" y="406">4c</text>
  </g>

  <text x="40" y="480" font-size="15" fill="#111111">Each tile is one study item; letters show the item within its category. Items are the same in both rows.</text>
  <text x="40" y="508" font-size="14" fill="#111111">Schematic illustration of study order; not data.</text>
</svg>
