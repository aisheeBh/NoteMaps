<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#555555" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Deviation IQ scale on a normal curve</title>
  <desc>Bell curve with the deviation IQ scale on its base. Mean 100, standard deviation 15. About two-thirds of the population lies between 85 and 115, about 95 percent between 70 and 130, and the outer tails hold the remaining small share.</desc>

  <text x="480" y="60" text-anchor="middle" font-size="22" font-weight="700" fill="#111111">Deviation IQ scale and the share of a population</text>

  <!-- tails (hatched) -->
  <polygon points="80,440 80,440 180,436.7 230,426.8 280,399.4 280,440" fill="url(#hatch)" stroke="none"/>
  <polygon points="680,440 680,399.4 730,426.8 780,436.7 880,440" fill="url(#hatch)" stroke="none"/>

  <!-- 2 SD band: 70 to 130 (light tint) -->
  <polygon points="280,440 280,399.4 330,342.6 380,258 430,175.5 480,140 530,175.5 580,258 630,342.6 680,399.4 680,440" fill="#D9E6F5" stroke="none"/>

  <!-- 1 SD band: 85 to 115 (stronger tint) -->
  <polygon points="380,440 380,258 430,175.5 480,140 530,175.5 580,258 580,440" fill="#BCD5EE" stroke="none"/>

  <!-- curve -->
  <polyline points="80,439.9 180,436.7 230,426.8 280,399.4 330,342.6 380,258 430,175.5 480,140 530,175.5 580,258 630,342.6 680,399.4 730,426.8 780,436.7 880,439.9" fill="none" stroke="#1F3B5C" stroke-width="3"/>

  <!-- baseline -->
  <line x1="80" y1="440" x2="880" y2="440" stroke="#333333" stroke-width="1.5"/>

  <!-- ticks and scale labels -->
  <line x1="180" y1="440" x2="180" y2="448" stroke="#333333" stroke-width="1.5"/>
  <line x1="280" y1="440" x2="280" y2="448" stroke="#333333" stroke-width="1.5"/>
  <line x1="380" y1="440" x2="380" y2="448" stroke="#333333" stroke-width="1.5"/>
  <line x1="480" y1="440" x2="480" y2="448" stroke="#333333" stroke-width="1.5"/>
  <line x1="580" y1="440" x2="580" y2="448" stroke="#333333" stroke-width="1.5"/>
  <line x1="680" y1="440" x2="680" y2="448" stroke="#333333" stroke-width="1.5"/>
  <line x1="780" y1="440" x2="780" y2="448" stroke="#333333" stroke-width="1.5"/>

  <text x="180" y="466" text-anchor="middle" font-size="15" fill="#111111">55</text>
  <text x="280" y="466" text-anchor="middle" font-size="15" fill="#111111">70</text>
  <text x="380" y="466" text-anchor="middle" font-size="15" fill="#111111">85</text>
  <text x="480" y="466" text-anchor="middle" font-size="15" font-weight="700" fill="#111111">100</text>
  <text x="580" y="466" text-anchor="middle" font-size="15" fill="#111111">115</text>
  <text x="680" y="466" text-anchor="middle" font-size="15" fill="#111111">130</text>
  <text x="780" y="466" text-anchor="middle" font-size="15" fill="#111111">145</text>

  <text x="180" y="486" text-anchor="middle" font-size="14" fill="#111111">-3 SD</text>
  <text x="280" y="486" text-anchor="middle" font-size="14" fill="#111111">-2 SD</text>
  <text x="380" y="486" text-anchor="middle" font-size="14" fill="#111111">-1 SD</text>
  <text x="480" y="486" text-anchor="middle" font-size="14" font-weight="700" fill="#111111">mean</text>
  <text x="580" y="486" text-anchor="middle" font-size="14" fill="#111111">+1 SD</text>
  <text x="680" y="486" text-anchor="middle" font-size="14" fill="#111111">+2 SD</text>
  <text x="780" y="486" text-anchor="middle" font-size="14" fill="#111111">+3 SD</text>

  <!-- direct labels -->
  <text x="480" y="326" text-anchor="middle" font-size="17" font-weight="700" fill="#111111">About 68%</text>
  <text x="480" y="348" text-anchor="middle" font-size="15" fill="#111111">between 85 and 115</text>
  <text x="480" y="404" text-anchor="middle" font-size="16" font-weight="700" fill="#111111">About 95%</text>
  <text x="480" y="424" text-anchor="middle" font-size="14" fill="#111111">between 70 and 130</text>
  <text x="90" y="360" font-size="15" font-weight="700" fill="#111111">Outer tails: about 5%</text>
  <text x="690" y="360" font-size="15" font-weight="700" fill="#111111">Outer tails: about 5%</text>

  <text x="48" y="526" font-size="13" fill="#111111">Normal curve with mean 100 and standard deviation 15. Percentages are exact for a normal distribution; real test samples approximate it.</text>
</svg>
