<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Three strata of cognitive ability in Carroll's hierarchical model</title>
  <desc>Three layers. At the top, one general factor g. In the middle, five broad abilities that g influences. At the bottom, narrow abilities that feed into the broad ones, with one illustrative example under each broad ability.</desc>

  <text x="480" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#111111">Three strata of cognitive ability</text>

  <!-- Stratum III -->
  <rect x="330" y="72" width="300" height="72" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="480" y="103" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">General factor g</text>
  <text x="480" y="127" text-anchor="middle" font-size="15" fill="#FFFFFF">Stratum III</text>

  <!-- connectors g to broad -->
  <line x1="480" y1="144" x2="480" y2="170" stroke="#333333" stroke-width="2"/>
  <line x1="140" y1="170" x2="828" y2="170" stroke="#333333" stroke-width="2"/>
  <line x1="140" y1="170" x2="140" y2="200" stroke="#333333" stroke-width="2"/>
  <line x1="312" y1="170" x2="312" y2="200" stroke="#333333" stroke-width="2"/>
  <line x1="484" y1="170" x2="484" y2="200" stroke="#333333" stroke-width="2"/>
  <line x1="656" y1="170" x2="656" y2="200" stroke="#333333" stroke-width="2"/>
  <line x1="828" y1="170" x2="828" y2="200" stroke="#333333" stroke-width="2"/>

  <text x="60" y="162" font-size="14" font-weight="700" fill="#111111">Stratum II: broad abilities</text>

  <!-- Stratum II -->
  <rect x="60" y="200" width="160" height="80" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="140" y="233" text-anchor="middle" font-size="15" font-weight="700" fill="#111111">Fluid reasoning</text>
  <text x="140" y="255" text-anchor="middle" font-size="15" fill="#111111">(Gf)</text>

  <rect x="232" y="200" width="160" height="80" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="312" y="233" text-anchor="middle" font-size="15" font-weight="700" fill="#111111">Crystallised</text>
  <text x="312" y="255" text-anchor="middle" font-size="15" fill="#111111">knowledge (Gc)</text>

  <rect x="404" y="200" width="160" height="80" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="484" y="233" text-anchor="middle" font-size="15" font-weight="700" fill="#111111">Short-term</text>
  <text x="484" y="255" text-anchor="middle" font-size="15" fill="#111111">memory (Gsm)</text>

  <rect x="576" y="200" width="160" height="80" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="656" y="233" text-anchor="middle" font-size="15" font-weight="700" fill="#111111">Processing</text>
  <text x="656" y="255" text-anchor="middle" font-size="15" fill="#111111">speed (Gs)</text>

  <rect x="748" y="200" width="160" height="80" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="828" y="233" text-anchor="middle" font-size="15" font-weight="700" fill="#111111">Visual</text>
  <text x="828" y="255" text-anchor="middle" font-size="15" fill="#111111">processing (Gv)</text>

  <!-- connectors broad to narrow -->
  <line x1="140" y1="280" x2="140" y2="340" stroke="#333333" stroke-width="2"/>
  <line x1="312" y1="280" x2="312" y2="340" stroke="#333333" stroke-width="2"/>
  <line x1="484" y1="280" x2="484" y2="340" stroke="#333333" stroke-width="2"/>
  <line x1="656" y1="280" x2="656" y2="340" stroke="#333333" stroke-width="2"/>
  <line x1="828" y1="280" x2="828" y2="340" stroke="#333333" stroke-width="2"/>


  <!-- Stratum I -->
  <rect x="60" y="340" width="160" height="80" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="140" y="373" text-anchor="middle" font-size="15" fill="#111111">Rule induction</text>
  <text x="140" y="395" text-anchor="middle" font-size="15" fill="#111111">and reasoning</text>

  <rect x="232" y="340" width="160" height="80" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="312" y="373" text-anchor="middle" font-size="15" fill="#111111">Vocabulary and</text>
  <text x="312" y="395" text-anchor="middle" font-size="15" fill="#111111">general information</text>

  <rect x="404" y="340" width="160" height="80" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="484" y="373" text-anchor="middle" font-size="15" fill="#111111">Memory span</text>
  <text x="484" y="395" text-anchor="middle" font-size="15" fill="#111111">for digits or words</text>

  <rect x="576" y="340" width="160" height="80" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="656" y="373" text-anchor="middle" font-size="15" fill="#111111">Perceptual</text>
  <text x="656" y="395" text-anchor="middle" font-size="15" fill="#111111">speed on simple tasks</text>

  <rect x="748" y="340" width="160" height="80" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="828" y="373" text-anchor="middle" font-size="15" fill="#111111">Spatial scanning</text>
  <text x="828" y="395" text-anchor="middle" font-size="15" fill="#111111">and mental rotation</text>

  <text x="60" y="446" font-size="14" font-weight="700" fill="#111111">Stratum I: narrow abilities (illustrative examples)</text>
  <text x="60" y="490" font-size="14" fill="#111111">Schematic. The number and names of abilities vary between studies and models.</text>
</svg>
