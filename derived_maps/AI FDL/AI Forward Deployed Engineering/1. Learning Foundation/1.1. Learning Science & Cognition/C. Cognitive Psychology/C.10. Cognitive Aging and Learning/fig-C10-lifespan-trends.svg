<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Schematic lifespan trends for three kinds of cognitive ability</title>
  <desc>Three stacked panels across adult ages 18 to 80. Processing speed peaks early and declines from the late twenties. Accumulated knowledge rises until about 60 and then levels off. Memory measures peak in early adulthood and vary by task.</desc>

  <text x="480" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#111111">Schematic lifespan trends for three kinds of ability</text>

  <!-- panel 1: processing speed (baseline y=180) -->
  <line x1="120" y1="180" x2="840" y2="180" stroke="#333333" stroke-width="1.5"/>
  <text x="24" y="130" font-size="15" font-weight="700" fill="#111111">Processing</text>
  <text x="24" y="148" font-size="15" font-weight="700" fill="#111111">speed</text>
  <polyline points="120,99 166.5,90 224.5,92.7 317.4,99 433.5,108 549.6,117 665.8,127.8 782,138.6 840,144" fill="none" stroke="#8B0000" stroke-width="4"/>
  <text x="600" y="92" font-size="15" fill="#111111">Declines from the late twenties</text>

  <!-- panel 2: accumulated knowledge (baseline y=300) -->
  <line x1="120" y1="300" x2="840" y2="300" stroke="#333333" stroke-width="1.5"/>
  <text x="24" y="250" font-size="15" font-weight="700" fill="#111111">Accumulated</text>
  <text x="24" y="268" font-size="15" font-weight="700" fill="#111111">knowledge</text>
  <polyline points="120,264 259.4,246 375.5,235.2 491.6,226.2 607.7,219 723.8,218.1 840,219.9" fill="none" stroke="#1F3B5C" stroke-width="4" stroke-dasharray="10 6"/>
  <text x="520" y="206" font-size="15" fill="#111111">Keeps growing until about 60</text>

  <!-- panel 3: memory measures (baseline y=420) -->
  <line x1="120" y1="420" x2="840" y2="420" stroke="#333333" stroke-width="1.5"/>
  <text x="24" y="370" font-size="15" font-weight="700" fill="#111111">Memory</text>
  <text x="24" y="388" font-size="15" fill="#111111">(varies by task)</text>
  <polyline points="120,348 201.3,340.8 282.6,339 433.5,344.4 607.7,353.4 840,366" fill="none" stroke="#333333" stroke-width="3" stroke-dasharray="2 4"/>
  <text x="470" y="330" font-size="15" fill="#111111">Early-adulthood peak for many tasks</text>

  <!-- age axis -->
  <line x1="143.2" y1="420" x2="143.2" y2="426" stroke="#333333" stroke-width="1.5"/>
  <line x1="375.5" y1="420" x2="375.5" y2="426" stroke="#333333" stroke-width="1.5"/>
  <line x1="607.7" y1="420" x2="607.7" y2="426" stroke="#333333" stroke-width="1.5"/>
  <line x1="840" y1="420" x2="840" y2="426" stroke="#333333" stroke-width="1.5"/>
  <text x="143.2" y="446" text-anchor="middle" font-size="15" fill="#111111">20</text>
  <text x="375.5" y="446" text-anchor="middle" font-size="15" fill="#111111">40</text>
  <text x="607.7" y="446" text-anchor="middle" font-size="15" fill="#111111">60</text>
  <text x="840" y="446" text-anchor="middle" font-size="15" fill="#111111">80</text>
  <text x="480" y="472" text-anchor="middle" font-size="16" fill="#111111">Age (years)</text>

  <text x="48" y="508" font-size="13" fill="#111111">Schematic trends drawn from the studies described in this note; not plotted from a single dataset. Each panel is scaled separately.</text>
</svg>
