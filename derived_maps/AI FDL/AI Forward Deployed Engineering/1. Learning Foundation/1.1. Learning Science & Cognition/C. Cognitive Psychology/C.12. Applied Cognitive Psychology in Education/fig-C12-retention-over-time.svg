<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Recall after restudy and after repeated testing, at two time points</title>
  <desc>Schematic comparison. Restudying gives higher recall five minutes after learning. Repeated testing gives higher recall one week later, when restudying has fallen further.</desc>

  <text x="480" y="60" text-anchor="middle" font-size="22" font-weight="700" fill="#111111">Recall after restudy and after repeated testing</text>

  <!-- axes -->
  <line x1="160" y1="440" x2="800" y2="440" stroke="#333333" stroke-width="1.5"/>
  <line x1="160" y1="120" x2="160" y2="440" stroke="#333333" stroke-width="1.5"/>
  <text x="142" y="446" text-anchor="end" font-size="15" fill="#111111">Low</text>
  <text x="142" y="136" text-anchor="end" font-size="15" fill="#111111">High</text>
  <text x="150" y="108" font-size="16" fill="#111111">Recall (schematic)</text>

  <text x="260" y="470" text-anchor="middle" font-size="16" fill="#111111">After 5 minutes</text>
  <text x="700" y="470" text-anchor="middle" font-size="16" fill="#111111">After one week</text>

  <!-- restudy: solid -->
  <line x1="260" y1="184" x2="700" y2="296" stroke="#1F3B5C" stroke-width="4"/>
  <circle cx="260" cy="184" r="7" fill="#1F3B5C"/>
  <circle cx="700" cy="296" r="7" fill="#1F3B5C"/>
  <text x="716" y="302" font-size="16" font-weight="700" fill="#111111">Restudying</text>

  <!-- repeated testing: dashed -->
  <line x1="260" y1="232" x2="700" y2="216" stroke="#333333" stroke-width="3" stroke-dasharray="10 6"/>
  <circle cx="260" cy="232" r="7" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <circle cx="700" cy="216" r="7" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <text x="716" y="222" font-size="16" font-weight="700" fill="#111111">Repeated testing</text>

  <!-- reversal annotation -->
  <text x="300" y="370" font-size="15" fill="#111111">Restudying leads at 5 minutes</text>
  <text x="330" y="394" font-size="15" fill="#111111">Testing leads after a delay</text>

  <text x="48" y="512" font-size="13" fill="#111111">Schematic of the reported pattern: repeated testing overtakes restudying after a delay.</text>
  <text x="48" y="530" font-size="13" fill="#111111">Values are illustrative and not plotted from the study data.</text>
</svg>
