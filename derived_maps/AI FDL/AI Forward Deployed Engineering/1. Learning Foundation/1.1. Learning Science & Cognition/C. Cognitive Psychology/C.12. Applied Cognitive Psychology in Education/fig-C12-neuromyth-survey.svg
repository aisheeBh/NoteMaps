<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#555555" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Teachers' belief in neuromyths compared with their neuroscience knowledge</title>
  <desc>Two bars. About 49 percent of neuromyth statements were believed by teachers on average. About 70 percent of general neuroscience statements were answered correctly. Survey of 242 teachers in the United Kingdom and the Netherlands.</desc>

  <text x="480" y="60" text-anchor="middle" font-size="22" font-weight="700" fill="#111111">Teachers' beliefs and knowledge about the brain</text>
  <text x="480" y="90" text-anchor="middle" font-size="16" fill="#111111">Average rate across survey statements (242 teachers)</text>

  <!-- y axis and gridlines -->
  <line x1="200" y1="140" x2="200" y2="440" stroke="#333333" stroke-width="1.5"/>
  <line x1="200" y1="440" x2="800" y2="440" stroke="#333333" stroke-width="1.5"/>
  <line x1="194" y1="140" x2="200" y2="140" stroke="#333333" stroke-width="1.5"/>
  <line x1="194" y1="215" x2="200" y2="215" stroke="#333333" stroke-width="1.5"/>
  <line x1="194" y1="290" x2="200" y2="290" stroke="#333333" stroke-width="1.5"/>
  <line x1="194" y1="365" x2="200" y2="365" stroke="#333333" stroke-width="1.5"/>
  <text x="186" y="146" text-anchor="end" font-size="15" fill="#111111">100%</text>
  <text x="186" y="221" text-anchor="end" font-size="15" fill="#111111">75%</text>
  <text x="186" y="296" text-anchor="end" font-size="15" fill="#111111">50%</text>
  <text x="186" y="371" text-anchor="end" font-size="15" fill="#111111">25%</text>
  <text x="186" y="446" text-anchor="end" font-size="15" fill="#111111">0%</text>

  <!-- bar 1: neuromyths believed, about 49% -->
  <rect x="300" y="293" width="180" height="147" fill="url(#hatch)" stroke="#111111" stroke-width="2"/>
  <text x="390" y="278" text-anchor="middle" font-size="20" font-weight="700" fill="#111111">49%</text>
  <text x="390" y="478" text-anchor="middle" font-size="16" fill="#111111">Neuromyth statements</text>
  <text x="390" y="498" text-anchor="middle" font-size="16" fill="#111111">believed</text>

  <!-- bar 2: general knowledge correct, about 70% -->
  <rect x="560" y="230" width="180" height="210" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="650" y="215" text-anchor="middle" font-size="20" font-weight="700" fill="#111111">about 70%</text>
  <text x="650" y="478" text-anchor="middle" font-size="16" fill="#111111">General neuroscience statements</text>
  <text x="650" y="498" text-anchor="middle" font-size="16" fill="#111111">answered correctly</text>

  <text x="48" y="524" font-size="13" fill="#111111">Bars show average rates across statements, not separate groups of teachers.</text>
</svg>
