<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>S-shaped value function around a reference point</title>
  <desc>Schematic value curve. Outcomes to the right of the reference point are gains and rise at a decreasing rate. Outcomes to the left are losses and fall more steeply, so each loss weighs more than an equal gain.</desc>

  <text x="480" y="60" text-anchor="middle" font-size="22" font-weight="700" fill="#111111">Value of outcomes relative to a reference point</text>

  <!-- axes -->
  <line x1="100" y1="290" x2="860" y2="290" stroke="#333333" stroke-width="1.5"/>
  <line x1="480" y1="130" x2="480" y2="520" stroke="#333333" stroke-width="1.5"/>
  <text x="488" y="132" font-size="15" fill="#111111">Subjective value</text>

  <!-- reference point -->
  <circle cx="480" cy="290" r="6" fill="#111111"/>
  <text x="492" y="332" font-size="16" font-weight="700" fill="#111111">Reference point</text>

  <!-- loss side: steeper -->
  <polyline points="120,492 240,444 360,380 420,340 480,290" fill="none" stroke="#8B0000" stroke-width="4" stroke-dasharray="0"/>
  <text x="100" y="404" font-size="16" font-weight="700" fill="#111111">Losses weigh more</text>
  <text x="150" y="318" font-size="16" fill="#111111">Losses</text>

  <!-- gain side: concave -->
  <polyline points="480,290 540,268 600,250 720,224 840,204" fill="none" stroke="#1F3B5C" stroke-width="4" stroke-dasharray="10 6"/>
  <text x="600" y="186" font-size="15" fill="#111111">Gains: each extra unit adds less</text>
  <text x="790" y="318" font-size="16" fill="#111111">Gains</text>

  <!-- direct labels for the two segments -->
  <text x="250" y="470" font-size="15" fill="#8B0000">Steeper segment</text>
  <text x="640" y="276" font-size="15" fill="#1F3B5C">Shallower segment</text>

  <text x="48" y="528" font-size="13" fill="#111111">Schematic; not plotted from a single dataset. Shape follows the S-curve in prospect theory.</text>
</svg>
