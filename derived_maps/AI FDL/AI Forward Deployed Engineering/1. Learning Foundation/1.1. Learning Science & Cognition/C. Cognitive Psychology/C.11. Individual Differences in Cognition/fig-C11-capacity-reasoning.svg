  <circle cx="315" cy="358" r="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <circle cx="629" cy="170" r="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
