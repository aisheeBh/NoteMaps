<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Schematic scatter of working memory capacity against fluid reasoning</title>
  <desc>Schematic scatter of illustrative people. Each point is one person. The points cluster around a rising line, showing that people with higher working memory capacity tend to score higher on fluid reasoning, with much individual variation around the line.</desc>

  <text x="480" y="60" text-anchor="middle" font-size="22" font-weight="700" fill="#111111">Working memory capacity and fluid reasoning</text>

  <!-- axes -->
  <line x1="130" y1="440" x2="840" y2="440" stroke="#333333" stroke-width="1.5"/>
  <line x1="130" y1="120" x2="130" y2="440" stroke="#333333" stroke-width="1.5"/>
  <text x="112" y="446" text-anchor="end" font-size="15" fill="#111111">Low</text>
  <text x="112" y="146" text-anchor="end" font-size="15" fill="#111111">High</text>
  <text x="150" y="462" text-anchor="middle" font-size="15" fill="#111111">Low</text>
  <text x="810" y="462" text-anchor="middle" font-size="15" fill="#111111">High</text>
  <text x="480" y="492" text-anchor="middle" font-size="16" fill="#111111">Working memory capacity (standardised)</text>
  <text x="136" y="108" font-size="16" fill="#111111">Fluid reasoning (standardised)</text>

  <!-- trend line -->
  <line x1="150" y1="365" x2="810" y2="215" stroke="#333333" stroke-width="2.5" stroke-dasharray="10 6"/>
  <text x="560" y="340" font-size="15" font-weight="700" fill="#111111">Trend across people</text>

  <!-- illustrative points -->
  <circle cx="216" cy="380" r="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <circle cx="282" cy="320" r="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <circle cx="331" cy="365" r="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <circle cx="397" cy="312" r="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <circle cx="447" cy="305" r="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <circle cx="497" cy="298" r="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <circle cx="546" cy="253" r="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <circle cx="596" cy="275" r="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <circle cx="645" cy="223" r="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <circle cx="695" cy="260" r="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <circle cx="744" cy="185" r="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <circle cx="183" cy="335" r="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
