<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Three layers of representation built from a text</title>
  <desc>Three stacked layers for the sentences The engineer opened the cabinet. The fuse was blown. The top layer is the surface wording, held briefly. The middle layer is the text base: two propositions with no explicit link. The bottom layer is the situation model, which adds a bridging inference that the blown fuse is inside the cabinet. Arrows show that each layer is built from the one above. Schematic illustration.</desc>

  <text x="480" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#111111">Three layers built from one short text</text>

  <!-- layer 1: surface -->
  <rect x="60" y="90" width="520" height="104" rx="10" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="80" y="122" font-size="18" font-weight="700" fill="#111111">Surface representation</text>
  <text x="80" y="152" font-size="16" fill="#111111">"The engineer opened the cabinet. The fuse was blown."</text>
  <text x="80" y="178" font-size="15" fill="#111111">Exact wording, held only briefly</text>

  <!-- arrow 1 -->
  <line x1="320" y1="196" x2="320" y2="222" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- layer 2: text base -->
  <rect x="60" y="226" width="520" height="104" rx="10" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="80" y="258" font-size="18" font-weight="700" fill="#111111">Text base</text>
  <text x="80" y="288" font-size="16" fill="#111111">open(engineer, cabinet)    blown(fuse)</text>
  <text x="80" y="314" font-size="15" fill="#111111">Two propositions; no explicit link between them</text>

  <!-- arrow 2 -->
  <line x1="320" y1="332" x2="320" y2="358" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- layer 3: situation model -->
  <rect x="60" y="362" width="520" height="104" rx="10" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="80" y="394" font-size="18" font-weight="700" fill="#FFFFFF">Situation model</text>
  <text x="80" y="424" font-size="16" fill="#FFFFFF">A fuse inside the cabinet has blown, so the fault</text>
  <text x="80" y="450" font-size="16" fill="#FFFFFF">is probably there and the engineer is dealing with it.</text>

  <!-- right column notes -->
  <line x1="620" y1="142" x2="650" y2="142" stroke="#333333" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="664" y="130" font-size="16" fill="#111111">Held briefly, then</text>
  <text x="664" y="152" font-size="16" fill="#111111">largely discarded</text>

  <line x1="620" y1="278" x2="650" y2="278" stroke="#333333" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="664" y="266" font-size="16" fill="#111111">Propositions and their</text>
  <text x="664" y="288" font-size="16" fill="#111111">links, built in cycles</text>

  <line x1="620" y1="414" x2="650" y2="414" stroke="#333333" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="664" y="402" font-size="16" fill="#111111">Events and context, with</text>
  <text x="664" y="424" font-size="16" fill="#111111">a bridging inference made</text>
  <text x="664" y="446" font-size="16" fill="#111111">from knowledge of fuses</text>

  <rect x="640" y="470" width="260" height="30" fill="#F6CACA" stroke="#8B0000" stroke-dasharray="3 3"/>
  <text x="770" y="491" text-anchor="middle" font-size="15" fill="#111111">Bridging inference is not stated</text>

  <text x="40" y="524" font-size="14" fill="#111111">Schematic illustration of Kintsch and van Dijk's layers, not measured data.</text>
</svg>
