<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Response time rising with the number of items held in memory</title>
  <desc>Schematic line chart. Response time increases in a straight line as the number of items in the memory set grows from one to six. Positive and negative responses rise at about the same rate, with the negative responses offset upwards.</desc>

  <text x="480" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#111111">Response time grows with the number of items to check</text>

  <!-- axes -->
  <line x1="120" y1="460" x2="820" y2="460" stroke="#222222" stroke-width="2"/>
  <line x1="120" y1="120" x2="120" y2="460" stroke="#222222" stroke-width="2"/>

  <!-- y ticks -->
  <line x1="112" y1="460" x2="120" y2="460" stroke="#222222" stroke-width="2"/>
  <line x1="112" y1="290" x2="120" y2="290" stroke="#222222" stroke-width="2"/>
  <line x1="112" y1="120" x2="120" y2="120" stroke="#222222" stroke-width="2"/>
  <text x="100" y="466" text-anchor="end" font-size="15" fill="#111111">300</text>
  <text x="100" y="296" text-anchor="end" font-size="15" fill="#111111">500</text>
  <text x="100" y="126" text-anchor="end" font-size="15" fill="#111111">700</text>

  <!-- x ticks and labels -->
  <g font-size="15" fill="#111111" text-anchor="middle">
    <text x="180" y="484">1</text>
    <text x="290" y="484">2</text>
    <text x="400" y="484">3</text>
    <text x="510" y="484">4</text>
    <text x="620" y="484">5</text>
    <text x="730" y="484">6</text>
  </g>
  <text x="470" y="512" text-anchor="middle" font-size="16" fill="#111111">Items held in memory (set size)</text>
  <text transform="rotate(-90)" x="-290" y="52" text-anchor="middle" font-size="16" fill="#111111">Response time (ms, schematic)</text>

  <!-- positive responses: solid line -->
  <polyline points="180,325.7 290,293.4 400,261.1 510,228.8 620,196.5 730,164.2" fill="none" stroke="#1F3B5C" stroke-width="3"/>
  <g fill="#1F3B5C">
    <circle cx="180" cy="325.7" r="5"/>
    <circle cx="290" cy="293.4" r="5"/>
    <circle cx="400" cy="261.1" r="5"/>
    <circle cx="510" cy="228.8" r="5"/>
    <circle cx="620" cy="196.5" r="5"/>
    <circle cx="730" cy="164.2" r="5"/>
  </g>

  <!-- negative responses: dashed line, same slope, offset -->
  <polyline points="180,351.2 290,318.9 400,286.6 510,254.3 620,222.0 730,189.7" fill="none" stroke="#111111" stroke-width="2.5" stroke-dasharray="10 6"/>
  <g fill="#FFFFFF" stroke="#111111" stroke-width="2">
    <circle cx="180" cy="351.2" r="5"/>
    <circle cx="290" cy="318.9" r="5"/>
    <circle cx="400" cy="286.6" r="5"/>
    <circle cx="510" cy="254.3" r="5"/>
    <circle cx="620" cy="222.0" r="5"/>
    <circle cx="730" cy="189.7" r="5"/>
  </g>

  <!-- direct labels -->
  <text x="752" y="160" font-size="16" fill="#111111">Probe in the list</text>
  <text x="752" y="196" font-size="16" fill="#111111">Probe not in the list</text>

  <text x="40" y="530" font-size="14" fill="#111111">Schematic; not plotted from a single dataset. Slope is the point of interest.</text>
</svg>
