<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="8" stroke="#555555" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Share of attention across a task for a novice and an expert</title>
  <desc>Four parts of a task, each shown with a novice bar (hatched) and an expert bar (solid). The novice spends most attention on looking up rules and checking the plan; the expert spends most on recognising the situation and carrying out the action.</desc>

  <text x="480" y="56" text-anchor="middle" font-size="22" font-weight="700" fill="#111111">Where attention goes during a task</text>
  <text x="480" y="86" text-anchor="middle" font-size="16" fill="#111111">Share of attention by part of the task (novice hatched, expert solid)</text>

  <!-- Row 1 -->
  <text x="60" y="158" font-size="17" font-weight="700" fill="#111111">Looking up the rule</text>
  <rect x="320" y="140" width="210" height="26" fill="url(#hatch)" stroke="#111111" stroke-width="1.5"/>
  <text x="542" y="160" font-size="15" fill="#111111">Novice 35%</text>
  <rect x="320" y="172" width="30" height="26" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="362" y="192" font-size="15" fill="#111111">Expert 5%</text>

  <!-- Row 2 -->
  <text x="60" y="248" font-size="17" font-weight="700" fill="#111111">Checking the plan</text>
  <rect x="320" y="230" width="210" height="26" fill="url(#hatch)" stroke="#111111" stroke-width="1.5"/>
  <text x="542" y="250" font-size="15" fill="#111111">Novice 35%</text>
  <rect x="320" y="262" width="90" height="26" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="422" y="282" font-size="15" fill="#111111">Expert 15%</text>

  <!-- Row 3 -->
  <text x="60" y="338" font-size="17" font-weight="700" fill="#111111">Recognising the situation</text>
  <rect x="320" y="320" width="90" height="26" fill="url(#hatch)" stroke="#111111" stroke-width="1.5"/>
  <text x="422" y="340" font-size="15" fill="#111111">Novice 15%</text>
  <rect x="320" y="352" width="270" height="26" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="602" y="372" font-size="15" fill="#111111">Expert 45%</text>

  <!-- Row 4 -->
  <text x="60" y="428" font-size="17" font-weight="700" fill="#111111">Carrying out the action</text>
  <rect x="320" y="410" width="90" height="26" fill="url(#hatch)" stroke="#111111" stroke-width="1.5"/>
  <text x="422" y="430" font-size="15" fill="#111111">Novice 15%</text>
  <rect x="320" y="442" width="210" height="26" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="542" y="462" font-size="15" fill="#111111">Expert 35%</text>

  <text x="48" y="506" font-size="13" fill="#111111">Schematic with illustrative proportions, not measured data. Each pair of bars sums to 100%.</text>
</svg>
