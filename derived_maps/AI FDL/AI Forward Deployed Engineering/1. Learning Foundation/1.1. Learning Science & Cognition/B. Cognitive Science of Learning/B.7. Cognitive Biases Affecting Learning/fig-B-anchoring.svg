<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Estimates pulled toward irrelevant anchors</title>
  <desc>A number line from 0 to 100. A low irrelevant anchor and a high irrelevant anchor sit above it. Estimates made after the low anchor lie left of the unanchored estimate; estimates after the high anchor lie to the right. Schematic; positions illustrate the pattern and are not measured values.</desc>

  <text x="480" y="48" text-anchor="middle" font-size="24" font-weight="700" fill="#111111">Estimates pulled toward an anchor</text>

  <!-- anchors -->
  <line x1="214" y1="170" x2="214" y2="285" stroke="#111111" stroke-width="3"/>
  <line x1="708" y1="170" x2="708" y2="285" stroke="#111111" stroke-width="3"/>
  <text x="214" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#111111">Low anchor</text>
  <text x="214" y="168" text-anchor="middle" font-size="14" fill="#111111">irrelevant number</text>
  <text x="708" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#111111">High anchor</text>
  <text x="708" y="168" text-anchor="middle" font-size="14" fill="#111111">irrelevant number</text>

  <!-- number line -->
  <line x1="100" y1="300" x2="860" y2="300" stroke="#222222" stroke-width="2.5"/>
  <line x1="100" y1="294" x2="100" y2="306" stroke="#222222" stroke-width="2"/>
  <line x1="290" y1="294" x2="290" y2="306" stroke="#222222" stroke-width="2"/>
  <line x1="480" y1="294" x2="480" y2="306" stroke="#222222" stroke-width="2"/>
  <line x1="670" y1="294" x2="670" y2="306" stroke="#222222" stroke-width="2"/>
  <line x1="860" y1="294" x2="860" y2="306" stroke="#222222" stroke-width="2"/>
  <text x="100" y="330" text-anchor="middle" font-size="16" fill="#111111">0</text>
  <text x="290" y="330" text-anchor="middle" font-size="16" fill="#111111">25</text>
  <text x="480" y="330" text-anchor="middle" font-size="16" fill="#111111">50</text>
  <text x="670" y="330" text-anchor="middle" font-size="16" fill="#111111">75</text>
  <text x="860" y="330" text-anchor="middle" font-size="16" fill="#111111">100</text>

  <!-- estimates -->
  <line x1="442" y1="300" x2="442" y2="400" stroke="#333333" stroke-width="2" stroke-dasharray="6 5"/>
  <circle cx="328" cy="380" r="11" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
  <circle cx="442" cy="380" r="11" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <circle cx="556" cy="380" r="11" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>

  <text x="328" y="418" text-anchor="middle" font-size="16" fill="#111111">After low anchor</text>
  <text x="442" y="418" text-anchor="middle" font-size="16" font-weight="700" fill="#111111">No anchor</text>
  <text x="556" y="418" text-anchor="middle" font-size="16" fill="#111111">After high anchor</text>

  <text x="480" y="468" text-anchor="middle" font-size="18" fill="#111111">Estimates sit closer to the anchor than the unanchored estimate does.</text>
  <text x="480" y="512" text-anchor="middle" font-size="14" fill="#111111">Schematic; positions illustrate the pattern, not measured values.</text>
</svg>
