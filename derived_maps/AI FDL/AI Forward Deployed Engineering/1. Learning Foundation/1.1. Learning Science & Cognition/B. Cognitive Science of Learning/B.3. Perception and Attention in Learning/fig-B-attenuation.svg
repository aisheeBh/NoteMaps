<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Schematic processing strength under attenuation</title>
  <desc>Three bars compare processing strength: an attended message is highest, an unattended message is strongly weakened, and an unattended message that is personally significant rises partway back. Schematic, illustrating the attenuation account, not measured values.</desc>

  <text x="480" y="48" text-anchor="middle" font-size="24" font-weight="700" fill="#111111">Attenuation of unattended input</text>

  <!-- axes -->
  <line x1="130" y1="110" x2="130" y2="440" stroke="#111111" stroke-width="2"/>
  <line x1="130" y1="440" x2="860" y2="440" stroke="#111111" stroke-width="2"/>
  <text x="70" y="275" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 70 275)">Processing strength (schematic)</text>

  <!-- bars: heights 0.9, 0.25, 0.55 of 300px -->
  <rect x="220" y="170" width="150" height="270" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <rect x="440" y="365" width="150" height="75" fill="#FFFFFF" stroke="#333333" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="660" y="275" width="150" height="165" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>

  <!-- category labels under axis -->
  <text x="295" y="470" text-anchor="middle" font-size="16" font-weight="700" fill="#111111">Attended</text>
  <text x="295" y="492" text-anchor="middle" font-size="15" fill="#111111">the message being followed</text>
  <text x="515" y="470" text-anchor="middle" font-size="16" font-weight="700" fill="#111111">Unattended</text>
  <text x="515" y="492" text-anchor="middle" font-size="15" fill="#111111">the other message</text>
  <text x="735" y="470" text-anchor="middle" font-size="16" font-weight="700" fill="#111111">Unattended but significant</text>
  <text x="735" y="492" text-anchor="middle" font-size="15" fill="#111111">for example, one's own name</text>

  <!-- direct value labels -->
  <text x="295" y="158" text-anchor="middle" font-size="16" fill="#111111">Strong</text>
  <text x="515" y="352" text-anchor="middle" font-size="16" fill="#111111">Weakened</text>
  <text x="735" y="262" text-anchor="middle" font-size="16" fill="#111111">Partly restored</text>
</svg>
