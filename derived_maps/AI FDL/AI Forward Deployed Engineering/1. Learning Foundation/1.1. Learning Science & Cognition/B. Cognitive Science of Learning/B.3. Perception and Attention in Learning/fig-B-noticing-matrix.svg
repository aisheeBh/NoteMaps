<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Whether an event is noticed, by attention and expectation</title>
  <desc>A two-by-two matrix. Rows: attention on the event's location, or attention elsewhere. Columns: event expected, or event unexpected. Attended and expected is usually noticed; attended and unexpected is often noticed; not attended but expected is noticed only if searched for; not attended and unexpected is often missed.</desc>

  <text x="480" y="48" text-anchor="middle" font-size="24" font-weight="700" fill="#111111">What gets noticed</text>

  <text x="340" y="132" text-anchor="middle" font-size="18" font-weight="700" fill="#111111">Event expected</text>
  <text x="620" y="132" text-anchor="middle" font-size="18" font-weight="700" fill="#111111">Event unexpected</text>

  <text x="195" y="236" text-anchor="end" font-size="18" font-weight="700" fill="#111111">Attention</text>
  <text x="195" y="260" text-anchor="end" font-size="18" font-weight="700" fill="#111111">on location</text>
  <text x="195" y="406" text-anchor="end" font-size="18" font-weight="700" fill="#111111">Attention</text>
  <text x="195" y="430" text-anchor="end" font-size="18" font-weight="700" fill="#111111">elsewhere</text>

  <!-- top-left: attended, expected -->
  <rect x="210" y="150" width="260" height="160" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="340" y="212" text-anchor="middle" font-size="20" font-weight="700" fill="#111111">Usually noticed</text>
  <text x="340" y="244" text-anchor="middle" font-size="16" fill="#111111">Looked for, and in view</text>

  <!-- top-right: attended, unexpected -->
  <rect x="490" y="150" width="260" height="160" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <text x="620" y="212" text-anchor="middle" font-size="20" font-weight="700" fill="#111111">Often noticed</text>
  <text x="620" y="244" text-anchor="middle" font-size="16" fill="#111111">In view, but surprising</text>

  <!-- bottom-left: elsewhere, expected -->
  <rect x="210" y="330" width="260" height="160" fill="#E6E6E6" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="340" y="392" text-anchor="middle" font-size="20" font-weight="700" fill="#111111">Noticed if searched for</text>
  <text x="340" y="424" text-anchor="middle" font-size="16" fill="#111111">Expected, attention elsewhere</text>

  <!-- bottom-right: elsewhere, unexpected -->
  <rect x="490" y="330" width="260" height="160" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="620" y="392" text-anchor="middle" font-size="20" font-weight="700" fill="#111111">Often missed</text>
  <text x="620" y="424" text-anchor="middle" font-size="16" fill="#111111">Inattentional blindness</text>

  <text x="480" y="512" text-anchor="middle" font-size="14" fill="#111111">Schematic summary of the findings on noticing; not measured proportions.</text>
</svg>
