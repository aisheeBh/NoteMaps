<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Approximate peak ages for four abilities that change at different rates</title>
  <desc>Four horizontal bars on an age axis from 10 to 80. Processing speed peaks in the late teens and early twenties; working memory in the late twenties and early thirties; reading others' emotions in the forties and fifties; vocabulary keeps improving until the late sixties or early seventies. Approximate ranges from a large web-based study; schematic.</desc>

  <text x="480" y="48" text-anchor="middle" font-size="24" font-weight="700" fill="#111111">Peak ages differ across abilities (approximate)</text>

  <line x1="300" y1="430" x2="880" y2="430" stroke="#111111" stroke-width="2"/>
  <text x="300" y="458" text-anchor="middle" font-size="16" fill="#111111">10</text>
  <text x="390" y="458" text-anchor="middle" font-size="16" fill="#111111">20</text>
  <text x="480" y="458" text-anchor="middle" font-size="16" fill="#111111">30</text>
  <text x="570" y="458" text-anchor="middle" font-size="16" fill="#111111">40</text>
  <text x="660" y="458" text-anchor="middle" font-size="16" fill="#111111">50</text>
  <text x="750" y="458" text-anchor="middle" font-size="16" fill="#111111">60</text>
  <text x="840" y="458" text-anchor="middle" font-size="16" fill="#111111">70</text>
  <text x="590" y="488" text-anchor="middle" font-size="16" fill="#111111">Age in years</text>

  <text x="60" y="170" font-size="18" font-weight="700" fill="#111111">Processing speed</text>
  <rect x="363" y="150" width="45" height="36" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <text x="420" y="174" font-size="15" fill="#111111">late teens to early 20s</text>

  <text x="60" y="250" font-size="18" font-weight="700" fill="#111111">Working memory</text>
  <rect x="417" y="230" width="54" height="36" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="481" y="254" font-size="15" fill="#111111">late 20s to early 30s</text>

  <text x="60" y="330" font-size="18" font-weight="700" fill="#111111">Reading others' emotions</text>
  <rect x="570" y="310" width="171" height="36" fill="#FFFFFF" stroke="#333333" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="655.5" y="334" text-anchor="middle" font-size="15" fill="#111111">40s to 50s</text>

  <text x="60" y="410" font-size="18" font-weight="700" fill="#111111">Vocabulary</text>
  <rect x="660" y="390" width="198" height="36" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="759" y="414" text-anchor="middle" font-size="15" fill="#111111">rises into the early 70s</text>

  <text x="480" y="512" text-anchor="middle" font-size="14" fill="#111111">Approximate ranges from a large web-based study (Hartshorne and Germine, 2015); schematic.</text>
</svg>
