<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Restudy and repeated testing compared across delays before the final test</title>
  <desc>Schematic line chart of retention against delay. At the shortest delay, restudy is higher. At two days and one week, repeated testing is higher than restudy, and the gap widens. Schematic; values illustrate the direction reported by Roediger and Karpicke (2006), not plotted data.</desc>

  <text x="480" y="48" text-anchor="middle" font-size="24" font-weight="700" fill="#111111">Restudy and testing over delays</text>

  <line x1="120" y1="110" x2="120" y2="430" stroke="#111111" stroke-width="2"/>
  <line x1="120" y1="430" x2="860" y2="430" stroke="#111111" stroke-width="2"/>
  <text x="62" y="270" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 62 270)">Retention (schematic)</text>

  <text x="200" y="458" text-anchor="middle" font-size="16" fill="#111111">5 minutes</text>
  <text x="480" y="458" text-anchor="middle" font-size="16" fill="#111111">2 days</text>
  <text x="760" y="458" text-anchor="middle" font-size="16" fill="#111111">1 week</text>
  <text x="480" y="488" text-anchor="middle" font-size="16" fill="#111111">Delay before the final test</text>

  <!-- restudy: dashed, hollow markers -->
  <path d="M200 205 L480 310 L760 340" fill="none" stroke="#111111" stroke-width="2.5" stroke-dasharray="10 6"/>
  <g fill="#FFFFFF" stroke="#111111" stroke-width="2">
    <circle cx="200" cy="205" r="6"/><circle cx="480" cy="310" r="6"/><circle cx="760" cy="340" r="6"/>
  </g>

  <!-- repeated testing: solid, filled markers -->
  <path d="M200 250 L480 250 L760 265" fill="none" stroke="#111111" stroke-width="3.5"/>
  <g fill="#111111">
    <circle cx="200" cy="250" r="6"/><circle cx="480" cy="250" r="6"/><circle cx="760" cy="265" r="6"/>
  </g>

  <text x="730" y="372" font-size="16" fill="#111111">Restudy</text>
  <text x="790" y="250" font-size="16" fill="#111111">Testing</text>
  <text x="250" y="190" font-size="16" fill="#111111">Restudy higher</text>

  <text x="480" y="512" text-anchor="middle" font-size="14" fill="#111111">Schematic; shows the direction of the reported effect, not plotted data.</text>
</svg>
