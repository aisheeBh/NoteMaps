<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Two languages dividing the same range of blues differently</title>
  <desc>Six shades of blue in a row. Language A has one basic term covering all six. Language B has two terms, one for the three lighter shades and one for the three darker shades, so the boundary falls between shades three and four. Schematic; shades and boundary positions are illustrative.</desc>

  <text x="480" y="48" text-anchor="middle" font-size="24" font-weight="700" fill="#111111">One range of blues, two ways of dividing it</text>

  <text x="160" y="150" font-size="18" font-weight="700" fill="#111111">Language A: one basic term</text>
  <line x1="160" y1="172" x2="810" y2="172" stroke="#222222" stroke-width="2"/>
  <line x1="160" y1="166" x2="160" y2="178" stroke="#222222" stroke-width="2"/>
  <line x1="810" y1="166" x2="810" y2="178" stroke="#222222" stroke-width="2"/>
  <text x="485" y="162" text-anchor="middle" font-size="16" fill="#111111">one term: "blue"</text>

  <rect x="160" y="190" width="100" height="70" fill="#CFE3F5" stroke="#333333" stroke-width="1.5"/>
  <rect x="270" y="190" width="100" height="70" fill="#A9CDEB" stroke="#333333" stroke-width="1.5"/>
  <rect x="380" y="190" width="100" height="70" fill="#7FB2E0" stroke="#333333" stroke-width="1.5"/>
  <rect x="490" y="190" width="100" height="70" fill="#5796D2" stroke="#333333" stroke-width="1.5"/>
  <rect x="600" y="190" width="100" height="70" fill="#3577B8" stroke="#333333" stroke-width="1.5"/>
  <rect x="710" y="190" width="100" height="70" fill="#1E5A96" stroke="#333333" stroke-width="1.5"/>

  <text x="210" y="286" text-anchor="middle" font-size="16" fill="#111111">1</text>
  <text x="320" y="286" text-anchor="middle" font-size="16" fill="#111111">2</text>
  <text x="430" y="286" text-anchor="middle" font-size="16" fill="#111111">3</text>
  <text x="540" y="286" text-anchor="middle" font-size="16" fill="#111111">4</text>
  <text x="650" y="286" text-anchor="middle" font-size="16" fill="#111111">5</text>
  <text x="760" y="286" text-anchor="middle" font-size="16" fill="#111111">6</text>

  <text x="160" y="330" font-size="18" font-weight="700" fill="#111111">Language B: two basic terms</text>
  <line x1="160" y1="352" x2="435" y2="352" stroke="#222222" stroke-width="2"/>
  <line x1="490" y1="352" x2="810" y2="352" stroke="#222222" stroke-width="2"/>
  <text x="297" y="378" text-anchor="middle" font-size="16" fill="#111111">lighter term</text>
  <text x="650" y="378" text-anchor="middle" font-size="16" fill="#111111">darker term</text>
  <line x1="485" y1="352" x2="485" y2="392" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="485" y="410" text-anchor="middle" font-size="14" fill="#8B0000">boundary</text>

  <text x="160" y="440" font-size="16" fill="#111111">A pair of shades 3 and 4 crosses the boundary in Language B, but not in Language A.</text>
  <text x="480" y="512" text-anchor="middle" font-size="14" fill="#111111">Schematic; shades and boundary positions are illustrative, not measured data.</text>
</svg>
