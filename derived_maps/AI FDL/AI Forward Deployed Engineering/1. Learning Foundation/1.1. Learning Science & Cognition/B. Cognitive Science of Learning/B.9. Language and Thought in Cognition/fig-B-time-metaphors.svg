<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Horizontal and vertical spatial metaphors for time</title>
  <desc>Left panel: time arranged along a horizontal line, with the past behind and the future ahead. Right panel: time arranged along a vertical line, with last month above and next month below, as described for some Mandarin usage. Schematic; the reported effects of these metaphors are contested.</desc>

  <text x="480" y="48" text-anchor="middle" font-size="24" font-weight="700" fill="#111111">Spatial metaphors for time</text>

  <text x="260" y="120" text-anchor="middle" font-size="18" font-weight="700" fill="#111111">Horizontal: time ahead and behind</text>
  <line x1="110" y1="300" x2="410" y2="300" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="110" y="276" text-anchor="start" font-size="16" fill="#111111">behind</text>
  <text x="410" y="276" text-anchor="end" font-size="16" fill="#111111">ahead</text>
  <text x="260" y="336" text-anchor="middle" font-size="16" fill="#111111">the past lies behind us</text>
  <text x="260" y="360" text-anchor="middle" font-size="16" fill="#111111">the future lies ahead of us</text>

  <line x1="480" y1="130" x2="480" y2="450" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 5"/>

  <text x="700" y="120" text-anchor="middle" font-size="18" font-weight="700" fill="#111111">Vertical: time above and below</text>
  <line x1="700" y1="160" x2="700" y2="420" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="725" y="172" font-size="16" fill="#111111">last month (above)</text>
  <text x="725" y="296" font-size="16" fill="#111111">this month</text>
  <text x="725" y="420" font-size="16" fill="#111111">next month (below)</text>
  <text x="700" y="455" text-anchor="middle" font-size="16" fill="#111111">a previous month can be "above"</text>

  <text x="480" y="512" text-anchor="middle" font-size="14" fill="#111111">Schematic; the reported effects of these metaphors are contested.</text>
</svg>
