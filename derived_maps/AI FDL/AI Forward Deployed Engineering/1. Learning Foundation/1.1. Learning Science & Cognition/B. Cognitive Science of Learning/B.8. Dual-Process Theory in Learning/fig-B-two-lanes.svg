<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Two lanes of processing: a fast default and a slower deliberate check</title>
  <desc>Two horizontal bars on a shared time axis. The Type 1 bar is short: a fast default response with low effort. The Type 2 bar is long: a deliberate check that needs time, working memory and knowledge. Schematic; bar lengths show relative time, not measured durations.</desc>

  <text x="480" y="48" text-anchor="middle" font-size="24" font-weight="700" fill="#111111">Two lanes of processing</text>

  <text x="60" y="180" font-size="18" font-weight="700" fill="#111111">Type 1</text>
  <text x="60" y="204" font-size="16" fill="#111111">fast default</text>
  <rect x="260" y="150" width="140" height="50" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <text x="330" y="181" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Response</text>
  <text x="260" y="236" font-size="16" fill="#111111">Low effort; accurate in regular, familiar cases;</text>
  <text x="260" y="258" font-size="16" fill="#111111">accepted without checking unless a signal appears.</text>

  <text x="60" y="340" font-size="18" font-weight="700" fill="#111111">Type 2</text>
  <text x="60" y="364" font-size="16" fill="#111111">deliberate check</text>
  <rect x="260" y="310" width="600" height="50" fill="#FFE6A8" stroke="#7A5200" stroke-width="2"/>
  <text x="560" y="341" text-anchor="middle" font-size="16" font-weight="700" fill="#111111">Analysis, check, revision</text>
  <text x="260" y="396" font-size="16" fill="#111111">High effort; needs time, working memory and relevant knowledge;</text>
  <text x="260" y="418" font-size="16" fill="#111111">can override a default only if it is engaged.</text>

  <line x1="260" y1="462" x2="880" y2="462" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="880" y="488" text-anchor="end" font-size="16" fill="#111111">Time to response</text>

  <text x="480" y="512" text-anchor="middle" font-size="14" fill="#111111">Schematic; bar lengths show relative time, not measured durations.</text>
</svg>
