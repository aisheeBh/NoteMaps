<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Schematic of accuracy by position of the relevant passage</title>
  <desc>Schematic curves of answer accuracy against where the relevant passage sits in the input, from start to middle to end. The solid curve for a longer input dips in the middle. The dashed curve for a shorter input stays higher overall. Small print states the figure is schematic and not plotted from a single dataset.</desc>

  <text x="60" y="50" font-size="22" fill="#111111" font-weight="bold">Where the relevant passage sits, and accuracy</text>

  <!-- Axes -->
  <line x1="100" y1="90" x2="100" y2="430" stroke="#333333" stroke-width="2"/>
  <line x1="100" y1="430" x2="760" y2="430" stroke="#333333" stroke-width="2"/>
  <text x="92" y="100" font-size="15" fill="#111111" text-anchor="end">High</text>
  <text x="92" y="434" font-size="15" fill="#111111" text-anchor="end">Low</text>
  <text transform="translate(40,260) rotate(-90)" font-size="16" fill="#111111" text-anchor="middle">Accuracy of the answer (schematic)</text>

  <!-- Tick marks and position labels -->
  <line x1="130" y1="430" x2="130" y2="438" stroke="#333333" stroke-width="2"/>
  <line x1="415" y1="430" x2="415" y2="438" stroke="#333333" stroke-width="2"/>
  <line x1="700" y1="430" x2="700" y2="438" stroke="#333333" stroke-width="2"/>
  <text x="130" y="460" font-size="16" fill="#111111" text-anchor="middle">Start</text>
  <text x="415" y="460" font-size="16" fill="#111111" text-anchor="middle">Middle</text>
  <text x="700" y="460" font-size="16" fill="#111111" text-anchor="middle">End</text>
  <text x="415" y="492" font-size="16" fill="#111111" text-anchor="middle">Position of the relevant passage in the input</text>

  <!-- Dashed curve: shorter input -->
  <path d="M130 130 Q415 260 700 130" fill="none" stroke="#111111" stroke-width="2.5" stroke-dasharray="10 6"/>
  <text x="720" y="126" font-size="16" fill="#111111">Shorter input</text>

  <!-- Solid curve: longer input -->
  <path d="M130 150 Q415 530 700 150" fill="none" stroke="#111111" stroke-width="3"/>
  <text x="720" y="156" font-size="16" fill="#111111">Longer input</text>

  <text x="415" y="392" font-size="15" fill="#111111" text-anchor="middle">weakest when the passage is in the middle</text>

  <text x="100" y="520" font-size="14" fill="#333333">Schematic; not plotted from a single dataset. The shape follows the U-shaped pattern reported for long inputs.</text>
</svg>
