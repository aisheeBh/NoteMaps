<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Layers of a prompt converging on one model</title>
  <desc>Six prompt layers stacked on the left: role (optional), instruction, context, examples (optional), input data and output specification. An arrow carries them into a language model box, which leads to a response that is checked against criteria and revised if it fails.</desc>

  <text x="60" y="50" font-size="22" fill="#111111" font-weight="bold">Layers of a prompt converging on one model</text>

  <!-- Optional layers: dashed border -->
  <rect x="60" y="80" width="500" height="58" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="80" y="105" font-size="18" font-weight="bold" fill="#111111">Role (optional)</text>
  <text x="80" y="127" font-size="15" fill="#111111">perspective, register and amount of detail</text>

  <rect x="60" y="150" width="500" height="58" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="80" y="175" font-size="18" font-weight="bold" fill="#111111">Instruction</text>
  <text x="80" y="197" font-size="15" fill="#111111">the task and the action required</text>

  <rect x="60" y="220" width="500" height="58" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="80" y="245" font-size="18" font-weight="bold" fill="#111111">Context</text>
  <text x="80" y="267" font-size="15" fill="#111111">background the model cannot know</text>

  <rect x="60" y="290" width="500" height="58" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="80" y="315" font-size="18" font-weight="bold" fill="#111111">Examples (optional)</text>
  <text x="80" y="337" font-size="15" fill="#111111">the pattern the output should follow</text>

  <rect x="60" y="360" width="500" height="58" rx="6" fill="#F2F2F2" stroke="#333333" stroke-width="1.5"/>
  <text x="80" y="385" font-size="18" font-weight="bold" fill="#111111">Input data</text>
  <text x="80" y="407" font-size="15" fill="#111111">the material the model works on</text>

  <rect x="60" y="430" width="500" height="58" rx="6" fill="#F2F2F2" stroke="#333333" stroke-width="1.5"/>
  <text x="80" y="455" font-size="18" font-weight="bold" fill="#111111">Output specification</text>
  <text x="80" y="477" font-size="15" fill="#111111">format, length, fields and tone</text>

  <!-- Arrow from the stack to the model -->
  <line x1="560" y1="250" x2="636" y2="250" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Model box -->
  <rect x="640" y="190" width="270" height="120" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="660" y="230" font-size="20" font-weight="bold" fill="#FFFFFF">Language model</text>
  <text x="660" y="256" font-size="15" fill="#FFFFFF">reads one sequence and predicts</text>
  <text x="660" y="278" font-size="15" fill="#FFFFFF">the continuation, token by token</text>

  <!-- Arrow from model to response -->
  <line x1="775" y1="310" x2="775" y2="336" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Response box -->
  <rect x="640" y="340" width="270" height="110" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="660" y="376" font-size="20" font-weight="bold" fill="#111111">Response</text>
  <text x="660" y="402" font-size="15" fill="#111111">checked against written criteria</text>
  <text x="660" y="424" font-size="15" fill="#111111">if it fails, revise one layer</text>

  <text x="60" y="520" font-size="14" fill="#333333">Schematic: the layers are a teaching model, not a required template.</text>
</svg>
