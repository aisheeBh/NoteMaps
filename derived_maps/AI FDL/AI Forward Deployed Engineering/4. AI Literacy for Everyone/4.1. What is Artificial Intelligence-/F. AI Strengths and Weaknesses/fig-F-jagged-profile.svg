<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>A jagged capability profile compared with a smooth assumed profile</title>
  <desc>A horizontal row of ten task types along the bottom. A flat dashed line shows the smooth profile people tend to assume. A jagged solid line shows reliability that is high for well-defined, data-rich tasks and drops sharply for rare facts, unusual cases and tasks needing common sense or human presence.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Reliability varies by task, not with apparent difficulty</text>
  <line x1="100" y1="380" x2="920" y2="380" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="100" y1="380" x2="100" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="46" y="230" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 46 230)">Reliability of the system</text>
  <g font-size="14" fill="#111111" text-anchor="end"><text x="90" y="385">low</text><text x="90" y="95">high</text></g>
  <line x1="100" y1="170" x2="900" y2="170" stroke="#222222" stroke-width="3" stroke-dasharray="10 6"/>
  <polyline points="140,100 220,112 300,300 380,110 460,330 540,130 620,310 700,150 780,340 860,120" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <g fill="#FFFFFF" stroke="#000000" stroke-width="2.5">
    <circle cx="140" cy="100" r="7"/><circle cx="220" cy="112" r="7"/><circle cx="300" cy="300" r="7"/><circle cx="380" cy="110" r="7"/><circle cx="460" cy="330" r="7"/>
    <circle cx="540" cy="130" r="7"/><circle cx="620" cy="310" r="7"/><circle cx="700" cy="150" r="7"/><circle cx="780" cy="340" r="7"/><circle cx="860" cy="120" r="7"/>
  </g>
  <g font-size="13" fill="#111111" text-anchor="middle">
    <text x="140" y="404">Sorting</text><text x="140" y="420">and triage</text>
    <text x="220" y="404">Fluent</text><text x="220" y="420">drafting</text>
    <text x="300" y="404">Rare or</text><text x="300" y="420">recent facts</text>
    <text x="380" y="404">Image</text><text x="380" y="420">screening</text>
    <text x="460" y="404">Unusual</text><text x="460" y="420">cases</text>
    <text x="540" y="404">Translation</text><text x="540" y="420">of text</text>
    <text x="620" y="404">Common</text><text x="620" y="420">sense</text>
    <text x="700" y="404">Document</text><text x="700" y="420">search</text>
    <text x="780" y="404">Care and</text><text x="780" y="420">accountability</text>
    <text x="860" y="404">Routine</text><text x="860" y="420">extraction</text>
  </g>
  <rect x="120" y="440" width="330" height="46" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="132" y="460" font-size="15" font-weight="bold" fill="#111111">Dashed: the smooth profile people assume</text>
  <text x="132" y="478" font-size="14" fill="#111111">one level of "smartness" across tasks</text>
  <rect x="490" y="440" width="350" height="46" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="502" y="460" font-size="15" font-weight="bold" fill="#111111">Solid: the actual jagged profile</text>
  <text x="502" y="478" font-size="14" fill="#111111">peaks where data are rich and checkable</text>
  <text x="480" y="508" text-anchor="middle" font-size="16" fill="#111111">Kinds of task</text>
  <text x="480" y="530" text-anchor="middle" font-size="13" fill="#333333">Schematic; positions are illustrative and not plotted from data.</text>
</svg>
