<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Interpretability and typical accuracy across kinds of model</title>
  <desc>Schematic spectrum of six model types from hand-written rules to large language models. Interpretability falls steadily from left to right. Typical accuracy on perception and language tasks rises; on structured data the gap is small and contested, shown as a shaded band.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">The more flexible the model, the harder it is to read</text>
  <line x1="90" y1="400" x2="900" y2="400" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="90" y1="400" x2="90" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="50" y="235" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 50 235)">Level</text>
  <polygon points="110,250 880,170 880,230 110,290" fill="url(#dots)" opacity="0.9"/>
  <rect x="130" y="345" width="320" height="40" fill="#FFFFFF" stroke="#7A5200" stroke-width="1.5"/>
  <text x="142" y="363" font-size="14" font-weight="bold" fill="#111111">Structured data: gap small, contested</text>
  <text x="142" y="379" font-size="14" fill="#111111">(shaded band)</text>
  <path d="M110 330 C 300 300, 500 220, 880 90" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <path d="M110 110 C 300 140, 500 250, 880 360" fill="none" stroke="#222222" stroke-width="3" stroke-dasharray="10 6"/>
  <rect x="150" y="76" width="260" height="46" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="162" y="96" font-size="15" font-weight="bold" fill="#111111">Interpretability (dashed line)</text>
  <text x="162" y="114" font-size="14" fill="#111111">falls as models grow flexible</text>
  <rect x="450" y="70" width="290" height="46" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="462" y="90" font-size="15" font-weight="bold" fill="#111111">Typical accuracy on images, text</text>
  <text x="462" y="108" font-size="14" fill="#111111">(solid line) rises with flexibility</text>
  <g font-size="14" fill="#111111" text-anchor="middle" font-weight="bold">
    <line x1="130" y1="400" x2="130" y2="408" stroke="#222222"/><text x="130" y="428">Written</text><text x="130" y="446" font-weight="normal">rules</text>
    <line x1="260" y1="400" x2="260" y2="408" stroke="#222222"/><text x="260" y="428">Small</text><text x="260" y="446" font-weight="normal">tree</text>
    <line x1="400" y1="400" x2="400" y2="408" stroke="#222222"/><text x="400" y="428">Score-</text><text x="400" y="446" font-weight="normal">card</text>
    <line x1="560" y1="400" x2="560" y2="408" stroke="#222222"/><text x="560" y="428">Tree</text><text x="560" y="446" font-weight="normal">ensemble</text>
    <line x1="720" y1="400" x2="720" y2="408" stroke="#222222"/><text x="720" y="428">Deep</text><text x="720" y="446" font-weight="normal">network</text>
    <line x1="860" y1="400" x2="860" y2="408" stroke="#222222"/><text x="860" y="428">Large language</text><text x="860" y="446" font-weight="normal">model</text>
  </g>
  <text x="480" y="486" text-anchor="middle" font-size="16" fill="#111111">Kind of model, from simplest to most flexible</text>
  <text x="480" y="524" text-anchor="middle" font-size="13" fill="#333333">Schematic; not plotted from a single dataset. The order of scorecards and small trees is approximate.</text>
</svg>
