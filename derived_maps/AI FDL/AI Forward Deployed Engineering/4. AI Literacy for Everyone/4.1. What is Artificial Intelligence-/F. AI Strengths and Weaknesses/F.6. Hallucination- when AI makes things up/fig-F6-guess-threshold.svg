<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>When guessing pays under different penalties</title>
  <desc>A horizontal scale of the model's chance of being right from 0 to 1. For three scoring rules, a bar shows the region where abstaining is the better choice and the region where guessing is better. With no penalty guessing is always better; with a penalty of 1 the threshold is 0.5; with a penalty of 3 it is 0.75.</desc>
  <defs>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">The higher the penalty for error, the more caution pays</text>
  <!-- scale x from 200 (p=0) to 880 (p=1): 680 px -->
  <text x="190" y="136" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">No penalty</text>
  <text x="190" y="156" text-anchor="end" font-size="14" fill="#111111">wrong = 0</text>
  <rect x="200" y="110" width="680" height="60" fill="url(#cross)" stroke="#222222" stroke-width="2"/>
  <rect x="360" y="128" width="360" height="26" fill="#FFFFFF"/>
  <text x="540" y="147" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">always guess</text>

  <text x="190" y="256" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Penalty 1</text>
  <text x="190" y="276" text-anchor="end" font-size="14" fill="#111111">wrong = minus 1</text>
  <rect x="200" y="230" width="340" height="60" fill="url(#lines)" stroke="#222222" stroke-width="2"/>
  <rect x="540" y="230" width="340" height="60" fill="url(#cross)" stroke="#222222" stroke-width="2"/>
  <rect x="270" y="248" width="200" height="26" fill="#FFFFFF"/>
  <text x="370" y="267" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">say "not sure"</text>
  <rect x="640" y="248" width="140" height="26" fill="#FFFFFF"/>
  <text x="710" y="267" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">guess</text>

  <text x="190" y="376" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Penalty 3</text>
  <text x="190" y="396" text-anchor="end" font-size="14" fill="#111111">wrong = minus 3</text>
  <rect x="200" y="350" width="510" height="60" fill="url(#lines)" stroke="#222222" stroke-width="2"/>
  <rect x="710" y="350" width="170" height="60" fill="url(#cross)" stroke="#222222" stroke-width="2"/>
  <rect x="350" y="368" width="200" height="26" fill="#FFFFFF"/>
  <text x="450" y="387" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">say "not sure"</text>
  <rect x="740" y="368" width="110" height="26" fill="#FFFFFF"/>
  <text x="795" y="387" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">guess</text>

  <line x1="540" y1="100" x2="540" y2="420" stroke="#555555" stroke-width="1.5" stroke-dasharray="2 4"/>
  <line x1="710" y1="100" x2="710" y2="420" stroke="#555555" stroke-width="1.5" stroke-dasharray="2 4"/>
  <line x1="200" y1="430" x2="880" y2="430" stroke="#222222" stroke-width="2"/>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="200" y="452">0</text><text x="370" y="452">0.25</text><text x="540" y="452">0.5</text><text x="710" y="452">0.75</text><text x="880" y="452">1</text>
  </g>
  <text x="540" y="480" text-anchor="middle" font-size="16" fill="#111111">Model's chance of being right</text>
  <text x="480" y="520" text-anchor="middle" font-size="13" fill="#333333">Worked from the rule: guess when p exceeds c divided by (1 plus c). Illustrative scoring rules.</text>
</svg>
