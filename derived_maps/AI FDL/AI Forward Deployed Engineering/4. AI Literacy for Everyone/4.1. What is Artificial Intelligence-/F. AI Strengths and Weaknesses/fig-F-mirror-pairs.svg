<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Strengths and their mirror-image weaknesses</title>
  <desc>Four rows, each pairing a strength on the left with a mirror-image weakness on the right, joined by a double-headed arrow naming the shared cause: learning from many examples, cheap parallel computation, predicting likely text, and a fixed model applied identically.</desc>
  <defs>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Two faces of the same mechanism</text>
  <text x="200" y="76" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Strength</text>
  <text x="760" y="76" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Mirror weakness</text>
  <rect x="40" y="92" width="320" height="96" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="55" y="104" width="290" height="72" fill="#FFFFFF"/>
  <text x="200" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Superhuman pattern recognition</text>
  <text x="200" y="152" text-anchor="middle" font-size="14" fill="#111111">sees what experts cannot</text>
  <rect x="600" y="92" width="320" height="96" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="615" y="104" width="290" height="72" fill="#FFFFFF"/>
  <text x="760" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Brittle, cue-dependent</text>
  <text x="760" y="152" text-anchor="middle" font-size="14" fill="#111111">fails when the cues change</text>
  <line x1="372" y1="140" x2="588" y2="140" stroke="#222222" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="480" y="128" text-anchor="middle" font-size="14" fill="#111111">learns from</text>
  <text x="480" y="162" text-anchor="middle" font-size="14" fill="#111111">many examples</text>
  <rect x="40" y="206" width="320" height="96" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="55" y="218" width="290" height="72" fill="#FFFFFF"/>
  <text x="200" y="244" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Speed and scale</text>
  <text x="200" y="266" text-anchor="middle" font-size="14" fill="#111111">millions of cases, near-zero marginal cost</text>
  <rect x="600" y="206" width="320" height="96" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="615" y="218" width="290" height="72" fill="#FFFFFF"/>
  <text x="760" y="244" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Errors multiplied; heavy resource use</text>
  <text x="760" y="266" text-anchor="middle" font-size="14" fill="#111111">one flaw, everywhere at once</text>
  <line x1="372" y1="254" x2="588" y2="254" stroke="#222222" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="480" y="242" text-anchor="middle" font-size="14" fill="#111111">cheap, parallel</text>
  <text x="480" y="276" text-anchor="middle" font-size="14" fill="#111111">computation</text>
  <rect x="40" y="320" width="320" height="96" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="55" y="332" width="290" height="72" fill="#FFFFFF"/>
  <text x="200" y="358" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Fluent, flexible language</text>
  <text x="200" y="380" text-anchor="middle" font-size="14" fill="#111111">fits almost any topic and style</text>
  <rect x="600" y="320" width="320" height="96" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="615" y="332" width="290" height="72" fill="#FFFFFF"/>
  <text x="760" y="358" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Plausible falsehood</text>
  <text x="760" y="380" text-anchor="middle" font-size="14" fill="#111111">hallucination, no check on facts</text>
  <line x1="372" y1="368" x2="588" y2="368" stroke="#222222" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="480" y="356" text-anchor="middle" font-size="14" fill="#111111">predicts</text>
  <text x="480" y="390" text-anchor="middle" font-size="14" fill="#111111">likely text</text>
  <rect x="40" y="434" width="320" height="96" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="55" y="446" width="290" height="72" fill="#FFFFFF"/>
  <text x="200" y="472" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Consistency</text>
  <text x="200" y="494" text-anchor="middle" font-size="14" fill="#111111">same input, same treatment</text>
  <rect x="600" y="434" width="320" height="96" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="615" y="446" width="290" height="72" fill="#FFFFFF"/>
  <text x="760" y="472" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Same bias on every case</text>
  <text x="760" y="494" text-anchor="middle" font-size="14" fill="#111111">flaws in the data copied faithfully</text>
  <line x1="372" y1="482" x2="588" y2="482" stroke="#222222" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="480" y="470" text-anchor="middle" font-size="14" fill="#111111">a fixed model,</text>
  <text x="480" y="504" text-anchor="middle" font-size="14" fill="#111111">applied identically</text>
  <text x="480" y="552" text-anchor="middle" font-size="13" fill="#333333">Conceptual pairing; each strength shown has a counterpart that follows from the same cause.</text>
</svg>
