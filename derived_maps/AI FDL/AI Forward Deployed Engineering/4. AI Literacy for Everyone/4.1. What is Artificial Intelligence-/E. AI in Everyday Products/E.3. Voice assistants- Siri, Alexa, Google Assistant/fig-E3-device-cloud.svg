<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>What stays on the device and what is sent to the cloud</title>
  <desc>On the device, a rolling buffer of a few seconds of sound is checked continuously by a small wake-word model and then overwritten. Only after the wake word is detected is the following audio sent to the cloud, where speech recognition, understanding, fulfilment and speech synthesis run, and where recordings may be stored subject to the user’s settings.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" fill="#111111" font-weight="bold">Always listening locally; sending only after the wake word</text>
  <rect x="30" y="70" width="410" height="420" rx="10" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="235" y="100" text-anchor="middle" font-size="18" fill="#111111" font-weight="bold">On the device (in the home)</text>
  <rect x="60" y="120" width="350" height="70" rx="6" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="235" y="150.25" text-anchor="middle" font-size="15" fill="#222222" font-weight="bold">Rolling audio buffer</text>
  <text x="235" y="170.25" text-anchor="middle" font-size="15" fill="#222222">a few seconds, constantly overwritten</text>
  <line x1="235" y1="190" x2="235" y2="222" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="60" y="224" width="350" height="70" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="235" y="254.25" text-anchor="middle" font-size="15" fill="#000000" font-weight="bold">Small wake-word model</text>
  <text x="235" y="274.25" text-anchor="middle" font-size="15" fill="#000000">runs all day on low power</text>
  <line x1="235" y1="294" x2="235" y2="326" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="60" y="328" width="350" height="64" rx="6" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="235" y="355.25" text-anchor="middle" font-size="15" fill="#000000" font-weight="bold">Wake word detected?</text>
  <text x="235" y="375.25" text-anchor="middle" font-size="15" fill="#000000">light or tone shows it is listening</text>
  <text x="70" y="425" text-anchor="start" font-size="15" fill="#111111">No: audio discarded, nothing sent</text>
  <text x="70" y="452" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">Yes: start streaming the request</text>
  <text x="70" y="476" text-anchor="start" font-size="14" fill="#111111">Simple requests may be handled locally</text>
  <rect x="520" y="70" width="410" height="420" rx="10" fill="#F2F2F2" stroke="#1F3B5C" stroke-width="2"/>
  <text x="725" y="100" text-anchor="middle" font-size="18" fill="#111111" font-weight="bold">In the cloud (company servers)</text>
  <rect x="550" y="122" width="350" height="62" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="725" y="148.25" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Speech recognition</text>
  <text x="725" y="168.25" text-anchor="middle" font-size="15" fill="#111111">sound to text</text>
  <line x1="725" y1="184" x2="725" y2="198" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="550" y="200" width="350" height="62" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="725" y="226.25" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Language understanding</text>
  <text x="725" y="246.25" text-anchor="middle" font-size="15" fill="#111111">intent and slots</text>
  <line x1="725" y1="262" x2="725" y2="276" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="550" y="278" width="350" height="62" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="725" y="304.25" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Fulfilment</text>
  <text x="725" y="324.25" text-anchor="middle" font-size="15" fill="#111111">services, devices, answers</text>
  <line x1="725" y1="340" x2="725" y2="354" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="550" y="356" width="350" height="62" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="725" y="382.25" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Text-to-speech</text>
  <text x="725" y="402.25" text-anchor="middle" font-size="15" fill="#111111">reply audio sent back</text>
  <rect x="550" y="436" width="350" height="44" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="574.7" y="449" width="300.6" height="22" fill="#FFFFFF"/>
  <text x="725" y="464" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Recordings may be stored, per settings</text>
  <line x1="410" y1="360" x2="548" y2="160" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="458.125" y="222" width="43.75" height="21" fill="#FFFFFF"/>
  <text x="480" y="236" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">audio</text>
  <rect x="458.125" y="240" width="43.75" height="21" fill="#FFFFFF"/>
  <text x="480" y="254" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">after</text>
  <rect x="461.7" y="258" width="36.6" height="21" fill="#FFFFFF"/>
  <text x="480" y="272" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">wake</text>
  <rect x="461.7" y="276" width="36.6" height="21" fill="#FFFFFF"/>
  <text x="480" y="290" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">word</text>
  <text x="480" y="530" text-anchor="middle" font-size="13" fill="#333333">Schematic; the split between device and cloud differs by product, setting and request type.</text>
</svg>
