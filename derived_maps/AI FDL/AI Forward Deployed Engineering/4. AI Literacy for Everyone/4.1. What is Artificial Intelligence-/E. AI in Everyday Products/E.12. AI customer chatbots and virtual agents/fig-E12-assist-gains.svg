<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Productivity gains from an AI assistant by agent experience</title>
  <desc>Three horizontal bars show approximate increases in issues resolved per hour after customer-support agents gained an AI assistant: about 34 per cent for the least experienced and lowest-skilled agents, about 14 per cent on average across all agents, and little or no gain for the most skilled agents.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" fill="#111111" font-weight="bold">AI assistance helped novices most</text>
  <text x="314" y="138" text-anchor="end" font-size="17" fill="#111111" font-weight="bold">Least experienced agents</text>
  <rect x="330" y="100" width="510.0" height="60" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="852" y="121" width="87.2" height="24" fill="#FFFFFF"/>
  <text x="856" y="138" text-anchor="start" font-size="16" fill="#111111" font-weight="bold">about 34%</text>
  <text x="314" y="238" text-anchor="end" font-size="17" fill="#111111" font-weight="bold">All agents (average)</text>
  <rect x="330" y="200" width="210.0" height="60" fill="url(#dots)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="552" y="221" width="87.2" height="24" fill="#FFFFFF"/>
  <text x="556" y="238" text-anchor="start" font-size="16" fill="#111111" font-weight="bold">about 14%</text>
  <text x="314" y="338" text-anchor="end" font-size="17" fill="#111111" font-weight="bold">Most skilled agents</text>
  <rect x="330" y="300" width="18.0" height="60" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="360" y="321" width="131.2" height="24" fill="#FFFFFF"/>
  <text x="364" y="338" text-anchor="start" font-size="16" fill="#111111" font-weight="bold">little or none</text>
  <line x1="330" y1="85" x2="330" y2="385" stroke="#222222" stroke-width="2.5"/>
  <text x="630" y="420" text-anchor="middle" font-size="15" fill="#111111">Increase in issues resolved per hour</text>
  <text x="480" y="470" text-anchor="middle" font-size="13" fill="#333333">Approximate values reported by a field study of customer-support agents at one software company (2023).</text>
</svg>
