  <text x="850" y="506" text-anchor="end" font-size="14" fill="#111111">move right: less mail lost, more spam let in →</text>
  <text x="480" y="544" text-anchor="middle" font-size="13" fill="#333333">Schematic; not plotted from a single dataset. Real filters set the threshold so that lost wanted mail is very rare.</text>
