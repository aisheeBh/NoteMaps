<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Social graph and interest graph</title>
  <desc>Left: a user at the centre connected by solid lines to five followed accounts, whose posts form the candidates. Right: the same user connected by dashed lines to three interest topics, sourdough, hiking and football, each linked to many creators the user does not follow, whose posts become candidates.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" fill="#111111" font-weight="bold">Where feed candidates come from</text>
  <rect x="30" y="66" width="440" height="444" rx="10" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <rect x="490" y="66" width="440" height="444" rx="10" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="250" y="96" text-anchor="middle" font-size="18" fill="#111111" font-weight="bold">Social graph: people followed</text>
  <text x="710" y="96" text-anchor="middle" font-size="18" fill="#111111" font-weight="bold">Interest graph: inferred topics</text>
  <circle cx="250" cy="300" r="38" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="250" y="306" text-anchor="middle" font-size="16" fill="#FFFFFF" font-weight="bold">User</text>
  <line x1="250" y1="262" x2="250" y2="186" stroke="#222222" stroke-width="3"/>
  <rect x="198" y="138" width="104" height="44" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="250" y="164.9" text-anchor="middle" font-size="14" fill="#000000" font-weight="bold">Friend</text>
  <line x1="286.14" y1="288.257" x2="350.812" y2="264.772" stroke="#222222" stroke-width="3"/>
  <rect x="340.658" y="234.738" width="104" height="44" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="392.658" y="261.638" text-anchor="middle" font-size="14" fill="#000000" font-weight="bold">Sister</text>
  <line x1="272.336" y1="330.743" x2="312.305" y2="392.228" stroke="#222222" stroke-width="3"/>
  <rect x="286.168" y="391.262" width="104" height="44" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="338.168" y="418.162" text-anchor="middle" font-size="14" fill="#000000" font-weight="bold">Colleague</text>
  <line x1="227.664" y1="330.743" x2="187.695" y2="392.228" stroke="#222222" stroke-width="3"/>
  <rect x="109.832" y="391.262" width="104" height="44" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="161.832" y="418.162" text-anchor="middle" font-size="14" fill="#000000" font-weight="bold">News outlet</text>
  <line x1="213.86" y1="288.257" x2="149.188" y2="264.772" stroke="#222222" stroke-width="3"/>
  <rect x="55.3415" y="234.738" width="104" height="44" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="107.342" y="261.638" text-anchor="middle" font-size="14" fill="#000000" font-weight="bold">Club</text>
  <text x="250" y="494" text-anchor="middle" font-size="14" fill="#111111">Candidates: recent posts by these accounts</text>
  <circle cx="600" cy="300" r="38" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="600" y="306" text-anchor="middle" font-size="16" fill="#FFFFFF" font-weight="bold">User</text>
  <line x1="638" y1="300" x2="700" y2="170" stroke="#222222" stroke-width="2.5" stroke-dasharray="10 6"/>
  <rect x="700" y="148" width="110" height="44" rx="6" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="755" y="174.9" text-anchor="middle" font-size="14" fill="#000000" font-weight="bold">Sourdough</text>
  <line x1="810" y1="170" x2="850" y2="140" stroke="#555555" stroke-width="1.2"/>
  <rect x="850" y="133" width="40" height="14" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
  <line x1="810" y1="170" x2="850" y2="160" stroke="#555555" stroke-width="1.2"/>
  <rect x="850" y="153" width="40" height="14" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
  <line x1="810" y1="170" x2="850" y2="180" stroke="#555555" stroke-width="1.2"/>
  <rect x="850" y="173" width="40" height="14" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
  <line x1="810" y1="170" x2="850" y2="200" stroke="#555555" stroke-width="1.2"/>
  <rect x="850" y="193" width="40" height="14" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
  <line x1="638" y1="300" x2="700" y2="290" stroke="#222222" stroke-width="2.5" stroke-dasharray="10 6"/>
  <rect x="700" y="268" width="110" height="44" rx="6" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="755" y="294.9" text-anchor="middle" font-size="14" fill="#000000" font-weight="bold">Hiking</text>
  <line x1="810" y1="290" x2="850" y2="260" stroke="#555555" stroke-width="1.2"/>
  <rect x="850" y="253" width="40" height="14" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
  <line x1="810" y1="290" x2="850" y2="280" stroke="#555555" stroke-width="1.2"/>
  <rect x="850" y="273" width="40" height="14" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
  <line x1="810" y1="290" x2="850" y2="300" stroke="#555555" stroke-width="1.2"/>
  <rect x="850" y="293" width="40" height="14" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
  <line x1="810" y1="290" x2="850" y2="320" stroke="#555555" stroke-width="1.2"/>
  <rect x="850" y="313" width="40" height="14" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
  <line x1="638" y1="300" x2="700" y2="405" stroke="#222222" stroke-width="2.5" stroke-dasharray="10 6"/>
  <rect x="700" y="383" width="110" height="44" rx="6" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="755" y="409.9" text-anchor="middle" font-size="14" fill="#000000" font-weight="bold">Football</text>
  <line x1="810" y1="405" x2="850" y2="375" stroke="#555555" stroke-width="1.2"/>
  <rect x="850" y="368" width="40" height="14" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
  <line x1="810" y1="405" x2="850" y2="395" stroke="#555555" stroke-width="1.2"/>
  <rect x="850" y="388" width="40" height="14" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
  <line x1="810" y1="405" x2="850" y2="415" stroke="#555555" stroke-width="1.2"/>
  <rect x="850" y="408" width="40" height="14" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
  <line x1="810" y1="405" x2="850" y2="435" stroke="#555555" stroke-width="1.2"/>
  <rect x="850" y="428" width="40" height="14" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
  <text x="845" y="472" text-anchor="middle" font-size="13" fill="#111111">creators not followed</text>
  <text x="690" y="494" text-anchor="middle" font-size="14" fill="#111111">Candidates: any posts matching the topics</text>
  <text x="480" y="540" text-anchor="middle" font-size="13" fill="#333333">Schematic; most platforms now combine both sources.</text>
</svg>
