<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Typical and live speeds on a commuter road</title>
  <desc>A line chart of average speed against time of day from 5 a.m. to 11 a.m. The typical weekday profile, a solid line, dips from 60 to about 25 kilometres per hour at 8 a.m. and recovers by 10 a.m. Today’s live speeds, a dashed line, follow the typical curve until 7 a.m., then drop further after an incident. A dotted forecast line continues from the current time, 7:40, combining the typical pattern with today’s deviation.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" fill="#111111" font-weight="bold">An ETA forecasts the speed a road will have when it is reached</text>
  <line x1="110" y1="450" x2="880" y2="450" stroke="#222222" stroke-width="2.5"/>
  <line x1="110" y1="450" x2="110" y2="80" stroke="#222222" stroke-width="2.5"/>
  <line x1="110" y1="450" x2="110" y2="456" stroke="#222222" stroke-width="2"/>
  <text x="110" y="474" text-anchor="middle" font-size="14" fill="#111111">5:00</text>
  <line x1="238.333" y1="450" x2="238.333" y2="456" stroke="#222222" stroke-width="2"/>
  <text x="238.333" y="474" text-anchor="middle" font-size="14" fill="#111111">6:00</text>
  <line x1="366.667" y1="450" x2="366.667" y2="456" stroke="#222222" stroke-width="2"/>
  <text x="366.667" y="474" text-anchor="middle" font-size="14" fill="#111111">7:00</text>
  <line x1="495" y1="450" x2="495" y2="456" stroke="#222222" stroke-width="2"/>
  <text x="495" y="474" text-anchor="middle" font-size="14" fill="#111111">8:00</text>
  <line x1="623.333" y1="450" x2="623.333" y2="456" stroke="#222222" stroke-width="2"/>
  <text x="623.333" y="474" text-anchor="middle" font-size="14" fill="#111111">9:00</text>
  <line x1="751.667" y1="450" x2="751.667" y2="456" stroke="#222222" stroke-width="2"/>
  <text x="751.667" y="474" text-anchor="middle" font-size="14" fill="#111111">10:00</text>
  <line x1="880" y1="450" x2="880" y2="456" stroke="#222222" stroke-width="2"/>
  <text x="880" y="474" text-anchor="middle" font-size="14" fill="#111111">11:00</text>
  <text x="100" y="455" text-anchor="end" font-size="14" fill="#111111">0</text>
  <text x="100" y="352.143" text-anchor="end" font-size="14" fill="#111111">20</text>
  <line x1="110" y1="347.143" x2="880" y2="347.143" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="100" y="249.286" text-anchor="end" font-size="14" fill="#111111">40</text>
  <line x1="110" y1="244.286" x2="880" y2="244.286" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="100" y="146.429" text-anchor="end" font-size="14" fill="#111111">60</text>
  <line x1="110" y1="141.429" x2="880" y2="141.429" stroke="#BBBBBB" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="56" y="270" text-anchor="middle" font-size="15" fill="#111111" transform="rotate(-90 56 270)">Average speed (km/h)</text>
  <text x="495" y="500" text-anchor="middle" font-size="15" fill="#111111">Time of day</text>
