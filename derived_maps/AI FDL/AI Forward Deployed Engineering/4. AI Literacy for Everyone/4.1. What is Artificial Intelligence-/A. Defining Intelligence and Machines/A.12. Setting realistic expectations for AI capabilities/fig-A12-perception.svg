<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Expected, perceived and measured effects of AI tools</title>
  <desc>Bar chart. Developers forecast a 24 per cent speed-up before the study and believed afterwards they had been 20 per cent faster, but measured task completion time was 19 per cent longer with AI tools allowed.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Feeling faster is not being faster</text>
  <line x1="120" y1="290" x2="880" y2="290" stroke="#222222" stroke-width="2.5"/>
  <text x="110" y="295" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">0</text>
  <text x="110" y="163.0" text-anchor="end" font-size="14" fill="#111111">+24 %</text>
  <text x="110" y="399.5" text-anchor="end" font-size="14" fill="#111111">−19 %</text>
  <rect x="200" y="158.0" width="140" height="132.0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="270" y="146.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">24 % faster</text>
  <text x="270" y="316" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Forecast before</text>
  <text x="270" y="336" text-anchor="middle" font-size="14" fill="#111111">the study</text>
  <rect x="430" y="180.0" width="140" height="110.0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="500" y="168.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">20 % faster</text>
  <text x="500" y="316" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Belief after</text>
  <text x="500" y="336" text-anchor="middle" font-size="14" fill="#111111">the study</text>
  <rect x="660" y="290.0" width="140" height="104.5" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="730" y="420.5" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">19 % slower</text>
  <text x="730" y="256" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Measured</text>
  <text x="730" y="276" text-anchor="middle" font-size="14" fill="#111111">result</text>
  <text x="480" y="526" text-anchor="middle" font-size="13" fill="#333333">Data from METR's 2025 randomised trial with 16 experienced open-source developers on 246 tasks.</text>
</svg>
