<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Where responsibility sits</title>
  <desc>Three columns: the developer, responsible for training data, safeguards, testing and honest documentation; the deploying organisation, responsible for choosing uses, instructions, oversight, accuracy of outputs to customers and routes to a person; the user, responsible for checking outputs, using approved tools and owning decisions. The AI system sits below all three as the tool, with no responsibility of its own.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Responsibility stays with people</text>
  <rect x="50" y="80" width="260" height="60" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="58" y="88" width="244" height="44" fill="#FFFFFF"/>
  <text x="180.0" y="116.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Developer</text>
  <rect x="60" y="155" width="240" height="42" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="180.0" y="180.9" text-anchor="middle" font-size="14" fill="#111111">training data and design</text>
  <rect x="60" y="207" width="240" height="42" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="180.0" y="232.9" text-anchor="middle" font-size="14" fill="#111111">safeguards and testing</text>
  <rect x="60" y="259" width="240" height="42" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="180.0" y="284.9" text-anchor="middle" font-size="14" fill="#111111">honest documentation</text>
  <line x1="180" y1="372" x2="330" y2="418" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="350" y="80" width="260" height="60" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="480.0" y="116.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Deploying organisation</text>
  <rect x="360" y="155" width="240" height="42" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="480.0" y="180.9" text-anchor="middle" font-size="14" fill="#111111">which uses are allowed</text>
  <rect x="360" y="207" width="240" height="42" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="480.0" y="232.9" text-anchor="middle" font-size="14" fill="#111111">instructions and oversight</text>
  <rect x="360" y="259" width="240" height="42" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="480.0" y="284.9" text-anchor="middle" font-size="14" fill="#111111">accuracy to customers</text>
  <rect x="360" y="311" width="240" height="42" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="480.0" y="336.9" text-anchor="middle" font-size="14" fill="#111111">route to a person</text>
  <line x1="480" y1="372" x2="480" y2="418" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="650" y="80" width="260" height="60" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="658" y="88" width="244" height="44" fill="#FFFFFF"/>
  <text x="780.0" y="116.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">User</text>
  <rect x="660" y="155" width="240" height="42" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="780.0" y="180.9" text-anchor="middle" font-size="14" fill="#111111">check outputs</text>
  <rect x="660" y="207" width="240" height="42" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="780.0" y="232.9" text-anchor="middle" font-size="14" fill="#111111">use approved tools</text>
  <rect x="660" y="259" width="240" height="42" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="780.0" y="284.9" text-anchor="middle" font-size="14" fill="#111111">own the decision</text>
  <line x1="780" y1="372" x2="630" y2="418" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="330" y="420" width="300" height="80" rx="6" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="480.0" y="445.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">The AI system</text>
  <text x="480.0" y="465.2" text-anchor="middle" font-size="15" fill="#111111">a tool: no responsibility</text>
  <text x="480.0" y="485.2" text-anchor="middle" font-size="15" fill="#111111">of its own</text>
  <text x="480" y="545" text-anchor="middle" font-size="13" fill="#333333">After the reasoning in Moffatt v. Air Canada (2024): the deployer owns its chatbot's statements.</text>
</svg>
