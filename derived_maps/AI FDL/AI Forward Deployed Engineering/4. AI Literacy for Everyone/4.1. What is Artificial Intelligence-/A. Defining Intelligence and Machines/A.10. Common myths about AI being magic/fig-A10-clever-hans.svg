<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The Clever Hans test</title>
  <desc>Schematic bar chart. Two panels. Clever Hans: answers were mostly correct when the questioner knew the answer and was visible, and fell to near chance when the questioner did not know or was hidden. An AI classifier: accuracy is high on test images with the usual watermark cue and falls sharply when the cue is removed.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Remove the hidden cue and see what is left</text>
  <text x="240" y="92" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Clever Hans, 1907</text>
  <line x1="60" y1="430" x2="420" y2="430" stroke="#222222" stroke-width="2.5"/>
  <rect x="100" y="166.0" width="120" height="264.0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="160" y="456" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Cue present</text>
  <text x="160" y="476" text-anchor="middle" font-size="14" fill="#111111">questioner knows</text>
  <rect x="270" y="394.0" width="120" height="36.0" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="330" y="456" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Cue removed</text>
  <text x="330" y="476" text-anchor="middle" font-size="14" fill="#111111">questioner hidden</text>
  <text x="720" y="92" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">An image classifier</text>
  <line x1="540" y1="430" x2="900" y2="430" stroke="#222222" stroke-width="2.5"/>
  <rect x="580" y="160.0" width="120" height="270.0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="640" y="456" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Cue present</text>
  <text x="640" y="476" text-anchor="middle" font-size="14" fill="#111111">usual watermark</text>
  <rect x="750" y="340.0" width="120" height="90.0" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="810" y="456" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Cue removed</text>
  <text x="810" y="476" text-anchor="middle" font-size="14" fill="#111111">watermark gone</text>
  <line x1="500" y1="80" x2="500" y2="480" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="480" y="545" text-anchor="middle" font-size="13" fill="#333333">Schematic; bar heights are illustrative and show the pattern, not measured values.</text>
</svg>
