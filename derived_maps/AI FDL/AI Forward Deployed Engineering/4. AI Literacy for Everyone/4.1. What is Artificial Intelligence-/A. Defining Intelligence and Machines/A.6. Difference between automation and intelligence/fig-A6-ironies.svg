  <text x="403.2" y="270.9" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Monitoring only</text>
  <text x="403.2" y="289.9" text-anchor="middle" font-size="14" fill="#111111">attention fades; manual</text>
  <text x="403.2" y="308.9" text-anchor="middle" font-size="14" fill="#111111">skills are not practised</text>
  <rect x="652.8" y="120" width="210" height="90" rx="6" fill="#FFFFFF" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
