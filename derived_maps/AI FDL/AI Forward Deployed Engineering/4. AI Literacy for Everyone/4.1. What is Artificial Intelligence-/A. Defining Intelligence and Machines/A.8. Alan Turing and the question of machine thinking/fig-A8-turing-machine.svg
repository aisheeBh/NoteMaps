<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>A Turing machine</title>
  <desc>A long tape of cells holding the symbols blank, 1, 0, 1, 1, blank. A read-write head points at the rightmost 1. The head is in state carry. A rule table lists: in state carry reading 1, write 0, move left, stay in carry; reading 0, write 1, stop; reading blank, write 1, stop.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Tape, head, state and rules</text>
  <rect x="160.0" y="100" width="80" height="70" fill="#F2F2F2" stroke="#222222" stroke-width="2"/>
  <text x="200.0" y="147" text-anchor="middle" font-size="14" fill="#111111">blank</text>
  <rect x="240.0" y="100" width="80" height="70" fill="#F2F2F2" stroke="#222222" stroke-width="2"/>
  <text x="280.0" y="147" text-anchor="middle" font-size="14" fill="#111111">blank</text>
  <rect x="320.0" y="100" width="80" height="70" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="360.0" y="147" text-anchor="middle" font-size="26" font-weight="bold" fill="#111111">1</text>
  <rect x="400.0" y="100" width="80" height="70" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="440.0" y="147" text-anchor="middle" font-size="26" font-weight="bold" fill="#111111">0</text>
  <rect x="480.0" y="100" width="80" height="70" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="520.0" y="147" text-anchor="middle" font-size="26" font-weight="bold" fill="#111111">1</text>
  <rect x="560.0" y="100" width="80" height="70" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="600.0" y="147" text-anchor="middle" font-size="26" font-weight="bold" fill="#111111">1</text>
  <rect x="640.0" y="100" width="80" height="70" fill="#F2F2F2" stroke="#222222" stroke-width="2"/>
  <text x="680.0" y="147" text-anchor="middle" font-size="14" fill="#111111">blank</text>
  <rect x="720.0" y="100" width="80" height="70" fill="#F2F2F2" stroke="#222222" stroke-width="2"/>
  <text x="760.0" y="147" text-anchor="middle" font-size="14" fill="#111111">blank</text>
  <text x="140.0" y="147" text-anchor="end" font-size="24" font-weight="bold" fill="#111111">…</text>
  <text x="820.0" y="147" text-anchor="start" font-size="24" font-weight="bold" fill="#111111">…</text>
  <text x="480" y="92" text-anchor="middle" font-size="15" fill="#111111">Tape: unlimited in both directions</text>
  <polygon points="600.0,178 578.0,214 622.0,214" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <rect x="510.0" y="218" width="180" height="60" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="600.0" y="243.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">HEAD</text>
  <text x="600.0" y="263.2" text-anchor="middle" font-size="15" fill="#FFFFFF">state: carry</text>
  <text x="710.0" y="250" text-anchor="start" font-size="14" fill="#111111">reads, writes,</text>
  <text x="710.0" y="268" text-anchor="start" font-size="14" fill="#111111">moves one cell</text>
  <text x="480" y="308" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Rule table</text>
  <rect x="150" y="320" width="132" height="40" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="216.0" y="346" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">In state</text>
  <rect x="282" y="320" width="132" height="40" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="348.0" y="346" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Reading</text>
  <rect x="414" y="320" width="132" height="40" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="480.0" y="346" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Write</text>
  <rect x="546" y="320" width="132" height="40" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="612.0" y="346" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Move</text>
  <rect x="678" y="320" width="132" height="40" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="744.0" y="346" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Next state</text>
  <rect x="150" y="360" width="132" height="40" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="216.0" y="386" text-anchor="middle" font-size="15" fill="#111111">carry</text>
  <rect x="282" y="360" width="132" height="40" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="348.0" y="386" text-anchor="middle" font-size="15" fill="#111111">1</text>
  <rect x="414" y="360" width="132" height="40" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="480.0" y="386" text-anchor="middle" font-size="15" fill="#111111">0</text>
  <rect x="546" y="360" width="132" height="40" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="612.0" y="386" text-anchor="middle" font-size="15" fill="#111111">left</text>
  <rect x="678" y="360" width="132" height="40" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="744.0" y="386" text-anchor="middle" font-size="15" fill="#111111">carry</text>
  <rect x="150" y="400" width="132" height="40" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="216.0" y="426" text-anchor="middle" font-size="15" fill="#111111">carry</text>
  <rect x="282" y="400" width="132" height="40" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="348.0" y="426" text-anchor="middle" font-size="15" fill="#111111">0</text>
  <rect x="414" y="400" width="132" height="40" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="480.0" y="426" text-anchor="middle" font-size="15" fill="#111111">1</text>
  <rect x="546" y="400" width="132" height="40" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="612.0" y="426" text-anchor="middle" font-size="15" fill="#111111">stay</text>
  <rect x="678" y="400" width="132" height="40" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="744.0" y="426" text-anchor="middle" font-size="15" fill="#111111">done</text>
  <rect x="150" y="440" width="132" height="40" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="216.0" y="466" text-anchor="middle" font-size="15" fill="#111111">carry</text>
  <rect x="282" y="440" width="132" height="40" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="348.0" y="466" text-anchor="middle" font-size="15" fill="#111111">blank</text>
  <rect x="414" y="440" width="132" height="40" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="480.0" y="466" text-anchor="middle" font-size="15" fill="#111111">1</text>
  <rect x="546" y="440" width="132" height="40" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="612.0" y="466" text-anchor="middle" font-size="15" fill="#111111">stay</text>
  <rect x="678" y="440" width="132" height="40" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="744.0" y="466" text-anchor="middle" font-size="15" fill="#111111">done</text>
  <text x="480" y="545" text-anchor="middle" font-size="13" fill="#333333">The rules shown add one to a binary number; any computation can be expressed by some such table.</text>
</svg>
