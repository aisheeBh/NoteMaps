<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Turing's nine objections, grouped</title>
  <desc>Three groups. Belief and feeling: theological, heads in the sand, extrasensory perception. Limits of machines: mathematical, various disabilities, Lady Lovelace, continuity of the nervous system, informality of behaviour. The mind itself: the argument from consciousness, answered by the polite convention.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Nine objections, three kinds of doubt</text>
  <rect x="40" y="80" width="270" height="420" rx="6" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="175" y="112" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Belief and feeling</text>
  <rect x="60" y="140" width="230" height="60" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="175.0" y="175.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">1. Theological</text>
  <rect x="60" y="216" width="230" height="60" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="175.0" y="251.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">2. Heads in the sand</text>
  <rect x="60" y="292" width="230" height="60" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="175.0" y="317.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">9. Extrasensory</text>
  <text x="175.0" y="337.2" text-anchor="middle" font-size="15" fill="#111111">perception</text>
  <text x="175" y="430" text-anchor="middle" font-size="14" fill="#111111">Reply: not arguments</text>
  <text x="175" y="450" text-anchor="middle" font-size="14" fill="#111111">about machines at all</text>
  <rect x="345" y="80" width="290" height="420" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="355" y="92" width="270" height="30" fill="#FFFFFF"/>
  <text x="490" y="114" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Limits of machines</text>
  <rect x="365" y="136" width="250" height="48" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="490.0" y="165.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">3. Mathematical (Gödel)</text>
  <rect x="365" y="198" width="250" height="48" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="490.0" y="227.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">5. Various disabilities</text>
  <rect x="365" y="260" width="250" height="48" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="490.0" y="289.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">6. Lady Lovelace</text>
  <rect x="365" y="322" width="250" height="48" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="490.0" y="351.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">7. Continuity of nerves</text>
  <rect x="365" y="384" width="250" height="48" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="490.0" y="413.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">8. Informality of behaviour</text>
  <rect x="355" y="448" width="270" height="44" fill="#FFFFFF"/>
  <text x="490" y="466" text-anchor="middle" font-size="14" fill="#111111">Reply: humans share the limit,</text>
  <text x="490" y="485" text-anchor="middle" font-size="14" fill="#111111">or machines can overcome it</text>
  <rect x="670" y="80" width="250" height="420" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="795" y="114" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">The mind itself</text>
  <rect x="690" y="150" width="210" height="70" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="795.0" y="180.2" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">4. Consciousness</text>
  <text x="795.0" y="200.2" text-anchor="middle" font-size="15" fill="#111111">(Jefferson, 1949)</text>
  <rect x="690" y="300" width="210" height="110" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="795.0" y="331.4" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Reply:</text>
  <text x="795.0" y="350.4" text-anchor="middle" font-size="14" fill="#111111">the polite convention,</text>
  <text x="795.0" y="369.4" text-anchor="middle" font-size="14" fill="#111111">we judge others</text>
  <text x="795.0" y="388.4" text-anchor="middle" font-size="14" fill="#111111">by behaviour</text>
  <line x1="795" y1="222" x2="795" y2="296" stroke="#FFFFFF" stroke-width="3"/>
  <text x="795" y="460" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Still unresolved</text>
  <text x="480" y="585" text-anchor="middle" font-size="13" fill="#333333">Numbers follow the order in which Turing presented the objections in 1950.</text>
</svg>
