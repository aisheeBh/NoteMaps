<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Back-propagation in a small network</title>
  <desc>A network with three input units, three hidden units and one output unit. Signals flow forward from inputs through the hidden layer to the output. The output is compared with the correct answer to give an error, which is passed backwards through the same connections so that each connection weight can be adjusted to reduce the error.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
    <marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8B0000"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Signals go forward; error goes backward</text>

  <g font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">
    <text x="170" y="86">Input layer</text>
    <text x="420" y="86">Hidden layer</text>
    <text x="660" y="86">Output</text>
  </g>

  <!-- connections input to hidden -->
  <g stroke="#555555" stroke-width="1.8">
    <line x1="195" y1="150" x2="395" y2="150"/><line x1="195" y1="150" x2="395" y2="260"/><line x1="195" y1="150" x2="395" y2="370"/>
    <line x1="195" y1="260" x2="395" y2="150"/><line x1="195" y1="260" x2="395" y2="260"/><line x1="195" y1="260" x2="395" y2="370"/>
    <line x1="195" y1="370" x2="395" y2="150"/><line x1="195" y1="370" x2="395" y2="260"/><line x1="195" y1="370" x2="395" y2="370"/>
    <line x1="445" y1="150" x2="635" y2="260"/><line x1="445" y1="260" x2="635" y2="260"/><line x1="445" y1="370" x2="635" y2="260"/>
  </g>

  <!-- units -->
  <g stroke="#1F3B5C" stroke-width="3" fill="#BCD5EE">
    <circle cx="170" cy="150" r="25"/><circle cx="170" cy="260" r="25"/><circle cx="170" cy="370" r="25"/>
  </g>
  <g stroke="#000000" stroke-width="3" fill="#1F3B5C">
    <circle cx="420" cy="150" r="25"/><circle cx="420" cy="260" r="25"/><circle cx="420" cy="370" r="25"/>
  </g>
  <circle cx="660" cy="260" r="25" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <g font-size="14" fill="#111111" text-anchor="end">
    <text x="135" y="155">feature 1</text><text x="135" y="265">feature 2</text><text x="135" y="375">feature 3</text>
  </g>

  <!-- comparison -->
  <rect x="730" y="230" width="190" height="60" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="825" y="254" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Compare with</text>
  <text x="825" y="276" text-anchor="middle" font-size="15" fill="#111111">correct answer</text>
  <line x1="686" y1="260" x2="726" y2="260" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- forward arrow -->
  <line x1="170" y1="430" x2="650" y2="430" stroke="#222222" stroke-width="3.5" marker-end="url(#arrow)"/>
  <rect x="270" y="417" width="280" height="26" fill="#FFFFFF"/>
  <text x="410" y="436" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">1. Forward pass: compute output</text>

  <!-- backward arrow -->
  <path d="M825 296 L825 480 L180 480" fill="none" stroke="#8B0000" stroke-width="3.5" stroke-dasharray="10 6" marker-end="url(#arrowred)"/>
  <rect x="300" y="467" width="400" height="26" fill="#FFFFFF"/>
  <text x="500" y="486" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">2. Backward pass: share out the error</text>

  <rect x="160" y="508" width="640" height="30" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1.5"/>
  <text x="480" y="529" text-anchor="middle" font-size="15" fill="#111111">3. Nudge every connection to reduce the error; repeat over many examples.</text>

  <text x="480" y="566" text-anchor="middle" font-size="13" fill="#333333">Simplified network; real networks of the late 1980s had tens to thousands of units.</text>
</svg>
