<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Tasks by specifiability from data and ease of checking output</title>
  <desc>Two-by-two matrix. Horizontal axis: how easily the output can be checked, from hard to easy. Vertical axis: how well the task can be specified from rules or examples, from poorly to well. Well specified and easy to check: most automatable, e.g. invoice matching, code with tests, standard translation. Well specified but hard to check: automatable with human review, e.g. contract summaries, medical image triage. Poorly specified but easy to check: trial-and-error support, e.g. marketing variants. Poorly specified and hard to check: stays human, e.g. negotiation, strategy, care.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" font-size="22" text-anchor="middle" fill="#111111" font-weight="bold">Where tasks sit for automation</text>
  <rect x="140" y="70" width="380" height="210" rx="0" fill="#F2F2F2" stroke="#333333" stroke-width="2"/>
  <rect x="154" y="82" width="352" height="30" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <text x="330" y="103" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Automatable with human review</text>
  <rect x="158" y="123" width="344" height="26" fill="#FFFFFF" stroke="none"/>
  <circle cx="170" cy="135" r="5" fill="#000000"/>
  <text x="184" y="140" font-size="15" text-anchor="start" fill="#111111">contract and case summaries</text>
  <rect x="158" y="153" width="344" height="26" fill="#FFFFFF" stroke="none"/>
  <circle cx="170" cy="165" r="5" fill="#000000"/>
  <text x="184" y="170" font-size="15" text-anchor="start" fill="#111111">medical image triage</text>
  <rect x="158" y="183" width="344" height="26" fill="#FFFFFF" stroke="none"/>
  <circle cx="170" cy="195" r="5" fill="#000000"/>
  <text x="184" y="200" font-size="15" text-anchor="start" fill="#111111">fraud flags</text>
  <rect x="520" y="70" width="380" height="210" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
  <rect x="534" y="82" width="352" height="30" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <text x="710" y="103" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Most automatable</text>
  <rect x="538" y="123" width="344" height="26" fill="#FFFFFF" stroke="none"/>
  <circle cx="550" cy="135" r="5" fill="#000000"/>
  <text x="564" y="140" font-size="15" text-anchor="start" fill="#111111">invoice matching</text>
  <rect x="538" y="153" width="344" height="26" fill="#FFFFFF" stroke="none"/>
  <circle cx="550" cy="165" r="5" fill="#000000"/>
  <text x="564" y="170" font-size="15" text-anchor="start" fill="#111111">code that passes tests</text>
  <rect x="538" y="183" width="344" height="26" fill="#FFFFFF" stroke="none"/>
  <circle cx="550" cy="195" r="5" fill="#000000"/>
  <text x="564" y="200" font-size="15" text-anchor="start" fill="#111111">standard translation</text>
  <rect x="538" y="213" width="344" height="26" fill="#FFFFFF" stroke="none"/>
  <circle cx="550" cy="225" r="5" fill="#000000"/>
  <text x="564" y="230" font-size="15" text-anchor="start" fill="#111111">data extraction from forms</text>
  <rect x="140" y="280" width="380" height="210" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2"/>
  <rect x="154" y="292" width="352" height="30" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <text x="330" y="313" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Stays mainly human</text>
  <rect x="158" y="333" width="344" height="26" fill="#FFFFFF" stroke="none"/>
  <circle cx="170" cy="345" r="5" fill="#000000"/>
  <text x="184" y="350" font-size="15" text-anchor="start" fill="#111111">negotiating a settlement</text>
  <rect x="158" y="363" width="344" height="26" fill="#FFFFFF" stroke="none"/>
  <circle cx="170" cy="375" r="5" fill="#000000"/>
  <text x="184" y="380" font-size="15" text-anchor="start" fill="#111111">setting strategy</text>
  <rect x="158" y="393" width="344" height="26" fill="#FFFFFF" stroke="none"/>
  <circle cx="170" cy="405" r="5" fill="#000000"/>
  <text x="184" y="410" font-size="15" text-anchor="start" fill="#111111">caring for a distressed person</text>
  <rect x="520" y="280" width="380" height="210" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <rect x="534" y="292" width="352" height="30" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  <text x="710" y="313" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">AI assists by trial and error</text>
  <rect x="538" y="333" width="344" height="26" fill="#FFFFFF" stroke="none"/>
  <circle cx="550" cy="345" r="5" fill="#000000"/>
  <text x="564" y="350" font-size="15" text-anchor="start" fill="#111111">drafting marketing variants</text>
  <rect x="538" y="363" width="344" height="26" fill="#FFFFFF" stroke="none"/>
  <circle cx="550" cy="375" r="5" fill="#000000"/>
  <text x="564" y="380" font-size="15" text-anchor="start" fill="#111111">brainstorming product names</text>
  <rect x="538" y="393" width="344" height="26" fill="#FFFFFF" stroke="none"/>
  <circle cx="550" cy="405" r="5" fill="#000000"/>
  <text x="564" y="410" font-size="15" text-anchor="start" fill="#111111">layout options</text>
  <line x1="140" y1="512" x2="900" y2="512" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="520" y="538" font-size="15" text-anchor="middle" fill="#111111">How easily the output can be checked →</text>
  <line x1="110" y1="490" x2="110" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="94" y="280" font-size="15" text-anchor="middle" fill="#111111" transform="rotate(-90 94 280)">How well rules or examples specify the task →</text>
  <text x="480" y="584" font-size="13" text-anchor="middle" fill="#333333">Schematic placement; real tasks vary with context and cost of error.</text>
</svg>
