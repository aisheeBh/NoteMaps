<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Waves of technology and the work they changed</title>
  <desc>A timeline spectrum from the early nineteenth century to the 2020s. Mechanised textiles, 1810s: skilled weavers and croppers displaced, Luddite protests. Mechanised agriculture, 1850-1950: farm employment falls from about four in ten workers to under two in a hundred. Electricity and mass production, 1900-1960: factory work grows. Computers, 1980 onwards: routine middle-skill jobs hollow out. Automated tellers, 1970-2010: tellers per branch fall but branches multiply. Generative AI, 2022 onwards: writing, analysis and coding tasks reached.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" font-size="22" text-anchor="middle" fill="#111111" font-weight="bold">Technology waves and the work they changed</text>
  <text x="80" y="80" font-size="16" text-anchor="start" fill="#111111" font-weight="bold">Earlier</text>
  <text x="880" y="80" font-size="16" text-anchor="end" fill="#111111" font-weight="bold">Later</text>
  <line x1="90" y1="96" x2="870" y2="96" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="80" y="204" width="800" height="32" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <line x1="112" y1="204" x2="112" y2="190" stroke="#333333" stroke-width="1.5"/>
  <rect x="30" y="123" width="170" height="67" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="115" y="143" font-size="15" text-anchor="middle" fill="#111111">1810s: mechanised</text>
  <text x="115" y="162" font-size="15" text-anchor="middle" fill="#111111">textiles and</text>
  <text x="115" y="181" font-size="15" text-anchor="middle" fill="#111111">Luddite protests</text>
  <circle cx="112" cy="220" r="7" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="240" y1="236" x2="240" y2="250" stroke="#333333" stroke-width="1.5"/>
  <rect x="155" y="250" width="170" height="67" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="240" y="270" font-size="15" text-anchor="middle" fill="#111111">1850-1950: farm</text>
  <text x="240" y="289" font-size="15" text-anchor="middle" fill="#111111">work falls from</text>
  <text x="240" y="308" font-size="15" text-anchor="middle" fill="#111111">four in ten workers</text>
  <circle cx="240" cy="220" r="7" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="384" y1="204" x2="384" y2="190" stroke="#333333" stroke-width="1.5"/>
  <rect x="299" y="123" width="170" height="67" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="384" y="143" font-size="15" text-anchor="middle" fill="#111111">1900-1960:</text>
  <text x="384" y="162" font-size="15" text-anchor="middle" fill="#111111">electricity and</text>
  <text x="384" y="181" font-size="15" text-anchor="middle" fill="#111111">mass production</text>
  <circle cx="384" cy="220" r="7" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="528" y1="236" x2="528" y2="250" stroke="#333333" stroke-width="1.5"/>
  <rect x="443" y="250" width="170" height="48" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="528" y="270" font-size="15" text-anchor="middle" fill="#111111">1970-2010: ATMs and</text>
  <text x="528" y="289" font-size="15" text-anchor="middle" fill="#111111">bank tellers</text>
  <circle cx="528" cy="220" r="7" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="672" y1="204" x2="672" y2="190" stroke="#333333" stroke-width="1.5"/>
  <rect x="587" y="104" width="170" height="86" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="672" y="124" font-size="15" text-anchor="middle" fill="#111111">1980 onwards:</text>
  <text x="672" y="143" font-size="15" text-anchor="middle" fill="#111111">computers hollow</text>
  <text x="672" y="162" font-size="15" text-anchor="middle" fill="#111111">out routine</text>
  <text x="672" y="181" font-size="15" text-anchor="middle" fill="#111111">middle-skill jobs</text>
  <circle cx="672" cy="220" r="7" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="832" y1="236" x2="832" y2="250" stroke="#333333" stroke-width="1.5"/>
  <rect x="747" y="250" width="170" height="86" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="832" y="270" font-size="15" text-anchor="middle" fill="#111111">2022 onwards:</text>
  <text x="832" y="289" font-size="15" text-anchor="middle" fill="#111111">generative AI</text>
  <text x="832" y="308" font-size="15" text-anchor="middle" fill="#111111">reaches cognitive</text>
  <text x="832" y="327" font-size="15" text-anchor="middle" fill="#111111">tasks</text>
  <circle cx="832" cy="220" r="7" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
  <text x="480" y="424" font-size="13" text-anchor="middle" fill="#333333">Schematic timeline with approximate dates.</text>
</svg>
