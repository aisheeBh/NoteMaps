<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 438" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Target distribution of staff across AI literacy levels</title>
  <desc>Illustrative bars of target share of staff: aware 10 per cent, practitioner 70, advanced user 15, specialist 5. Leaders are drawn from all levels.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" font-size="22" text-anchor="middle" fill="#111111" font-weight="bold">A broad base of practitioners with small pockets of depth</text>
  <text x="346" y="104" font-size="15" text-anchor="end" fill="#111111">Aware (basics and rules)</text>
  <rect x="360" y="80" width="62" height="36" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <rect x="428" y="86" width="34" height="24" fill="#FFFFFF" stroke="none"/>
  <text x="432" y="104" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">10%</text>
  <text x="346" y="166" font-size="15" text-anchor="end" fill="#111111">Practitioner (daily use)</text>
  <rect x="360" y="142" width="438" height="36" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="804" y="148" width="34" height="24" fill="#FFFFFF" stroke="none"/>
  <text x="808" y="166" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">70%</text>
  <text x="346" y="228" font-size="15" text-anchor="end" fill="#111111">Advanced user (workflows, champions)</text>
  <rect x="360" y="204" width="94" height="36" rx="0" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
  <rect x="460" y="210" width="34" height="24" fill="#FFFFFF" stroke="none"/>
  <text x="464" y="228" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">15%</text>
  <text x="346" y="290" font-size="15" text-anchor="end" fill="#111111">Specialist (build, govern)</text>
  <rect x="360" y="266" width="31" height="36" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
  <rect x="397" y="272" width="25" height="24" fill="#FFFFFF" stroke="none"/>
  <text x="401" y="290" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">5%</text>
  <line x1="360" y1="70" x2="360" y2="328" stroke="#333333" stroke-width="2"/>
  <line x1="360" y1="328" x2="860" y2="328" stroke="#333333" stroke-width="2"/>
  <line x1="360" y1="328" x2="360" y2="334" stroke="#333333" stroke-width="1.5"/>
  <text x="360" y="350" font-size="14" text-anchor="middle" fill="#111111">0</text>
  <line x1="485" y1="328" x2="485" y2="334" stroke="#333333" stroke-width="1.5"/>
  <text x="485" y="350" font-size="14" text-anchor="middle" fill="#111111">20</text>
  <line x1="610" y1="328" x2="610" y2="334" stroke="#333333" stroke-width="1.5"/>
  <text x="610" y="350" font-size="14" text-anchor="middle" fill="#111111">40</text>
  <line x1="735" y1="328" x2="735" y2="334" stroke="#333333" stroke-width="1.5"/>
  <text x="735" y="350" font-size="14" text-anchor="middle" fill="#111111">60</text>
  <line x1="860" y1="328" x2="860" y2="334" stroke="#333333" stroke-width="1.5"/>
  <text x="860" y="350" font-size="14" text-anchor="middle" fill="#111111">80</text>
  <text x="610" y="372" font-size="15" text-anchor="middle" fill="#111111">Share of staff (%)</text>
  <text x="480" y="422" font-size="13" text-anchor="middle" fill="#333333">Illustrative target for a knowledge-work organisation; actual targets vary by role mix.</text>
</svg>
