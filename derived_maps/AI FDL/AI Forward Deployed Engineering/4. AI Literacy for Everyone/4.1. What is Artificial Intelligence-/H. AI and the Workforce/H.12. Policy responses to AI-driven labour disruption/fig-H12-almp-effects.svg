<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Schematic effects of active labour market programmes over time</title>
  <desc>Schematic lines of effect on employment over time since programme start. Job-search assistance: positive early effect that fades slightly. Training: negative or flat in the first year, rising to the largest effect after two to three years. Public job creation: flat or negative throughout.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" font-size="22" text-anchor="middle" fill="#111111" font-weight="bold">Different programmes pay off on different time scales</text>
  <line x1="120" y1="450" x2="900" y2="450" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="450" x2="120" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="510" y="490" font-size="15" text-anchor="middle" fill="#111111">Time since programme start →</text>
  <text x="90" y="265" font-size="15" text-anchor="middle" fill="#111111" transform="rotate(-90 90 265)">Effect on employment →</text>
  <path d="M120.0 320.5 L237.0 246.5 L354.0 228.0 L588.0 246.5 L900.0 265.0" fill="none" stroke="#111111" stroke-width="3.5"/>
  <rect x="389" y="182" width="182" height="25" fill="#FFFFFF" stroke="none"/>
  <text x="393" y="198" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">Job-search assistance</text>
  <path d="M120.0 320.5 L237.0 350.1 L354.0 327.9 L588.0 246.5 L900.0 183.6" fill="none" stroke="#111111" stroke-width="3.5" stroke-dasharray="10 6"/>
  <rect x="678" y="138" width="76" height="25" fill="#FFFFFF" stroke="none"/>
  <text x="682" y="154" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">Training</text>
  <path d="M120.0 320.5 L237.0 376.0 L354.0 368.6 L588.0 350.1 L900.0 339.0" fill="none" stroke="#111111" stroke-width="3.5" stroke-dasharray="2 4"/>
  <rect x="467" y="371" width="166" height="25" fill="#FFFFFF" stroke="none"/>
  <text x="471" y="387" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">Public job creation</text>
  <text x="198" y="470" font-size="14" text-anchor="middle" fill="#111111">Year 1</text>
  <text x="510" y="470" font-size="14" text-anchor="middle" fill="#111111">Year 2</text>
  <text x="822" y="470" font-size="14" text-anchor="middle" fill="#111111">Year 3</text>
  <text x="480" y="524" font-size="13" text-anchor="middle" fill="#333333">Schematic pattern summarising meta-analytic findings; not plotted from a single dataset.</text>
</svg>
