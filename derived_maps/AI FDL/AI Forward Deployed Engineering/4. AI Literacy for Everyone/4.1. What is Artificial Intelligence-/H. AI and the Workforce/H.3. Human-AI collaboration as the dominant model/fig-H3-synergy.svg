<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 562" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>When human-AI combinations beat either alone</title>
  <desc>Schematic horizontal bars in two scenarios. When the human alone is stronger than the AI alone, the combination tends to exceed both. When the AI alone is stronger, the combination tends to fall below the AI alone, because people override correct AI answers.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" font-size="22" text-anchor="middle" fill="#111111" font-weight="bold">Who is stronger alone decides whether combining helps</text>
  <text x="356" y="94" font-size="15" text-anchor="end" fill="#111111">Scenario A, human stronger: human</text>
  <text x="356" y="112" font-size="15" text-anchor="end" fill="#111111">alone</text>
  <rect x="370" y="80" width="343" height="36" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <rect x="719" y="86" width="25" height="24" fill="#FFFFFF" stroke="none"/>
  <text x="723" y="104" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">70</text>
  <text x="356" y="166" font-size="15" text-anchor="end" fill="#111111">Scenario A: AI alone</text>
  <rect x="370" y="142" width="294" height="36" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="670" y="148" width="25" height="24" fill="#FFFFFF" stroke="none"/>
  <text x="674" y="166" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">60</text>
  <text x="356" y="228" font-size="15" text-anchor="end" fill="#111111">Scenario A: human with AI</text>
  <rect x="370" y="204" width="382" height="36" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
  <rect x="758" y="210" width="111" height="24" fill="#FFFFFF" stroke="none"/>
  <text x="762" y="228" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">78 - synergy</text>
  <text x="356" y="290" font-size="15" text-anchor="end" fill="#111111">Scenario B, AI stronger: human alone</text>
  <rect x="370" y="266" width="294" height="36" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <rect x="670" y="272" width="25" height="24" fill="#FFFFFF" stroke="none"/>
  <text x="674" y="290" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">60</text>
  <text x="356" y="352" font-size="15" text-anchor="end" fill="#111111">Scenario B: AI alone</text>
  <rect x="370" y="328" width="392" height="36" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="768" y="334" width="25" height="24" fill="#FFFFFF" stroke="none"/>
  <text x="772" y="352" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">80</text>
  <text x="356" y="414" font-size="15" text-anchor="end" fill="#111111">Scenario B: human with AI</text>
  <rect x="370" y="390" width="353" height="36" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2"/>
  <rect x="729" y="396" width="171" height="24" fill="#FFFFFF" stroke="none"/>
  <text x="733" y="414" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">72 - below AI alone</text>
  <line x1="370" y1="70" x2="370" y2="452" stroke="#333333" stroke-width="2"/>
  <line x1="370" y1="452" x2="860" y2="452" stroke="#333333" stroke-width="2"/>
  <line x1="370" y1="452" x2="370" y2="458" stroke="#333333" stroke-width="1.5"/>
  <text x="370" y="474" font-size="14" text-anchor="middle" fill="#111111">0</text>
  <line x1="468" y1="452" x2="468" y2="458" stroke="#333333" stroke-width="1.5"/>
  <text x="468" y="474" font-size="14" text-anchor="middle" fill="#111111">20</text>
  <line x1="566" y1="452" x2="566" y2="458" stroke="#333333" stroke-width="1.5"/>
  <text x="566" y="474" font-size="14" text-anchor="middle" fill="#111111">40</text>
  <line x1="664" y1="452" x2="664" y2="458" stroke="#333333" stroke-width="1.5"/>
  <text x="664" y="474" font-size="14" text-anchor="middle" fill="#111111">60</text>
  <line x1="762" y1="452" x2="762" y2="458" stroke="#333333" stroke-width="1.5"/>
  <text x="762" y="474" font-size="14" text-anchor="middle" fill="#111111">80</text>
  <line x1="860" y1="452" x2="860" y2="458" stroke="#333333" stroke-width="1.5"/>
  <text x="860" y="474" font-size="14" text-anchor="middle" fill="#111111">100</text>
  <text x="615" y="496" font-size="15" text-anchor="middle" fill="#111111">Task performance (illustrative scale)</text>
  <text x="480" y="546" font-size="13" text-anchor="middle" fill="#333333">Schematic illustration of the pattern reported in a 2024 meta-analysis; not plotted from a single dataset.</text>
</svg>
