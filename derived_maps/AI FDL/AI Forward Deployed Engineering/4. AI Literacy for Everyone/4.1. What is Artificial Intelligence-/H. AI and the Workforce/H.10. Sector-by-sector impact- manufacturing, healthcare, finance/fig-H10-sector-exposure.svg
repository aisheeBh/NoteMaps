<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 378" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Relative exposure of sector tasks to AI</title>
  <desc>Three bands from most to least digital work. Financial services: mostly digital, codified tasks, so exposure is broad. Health care: mixed, administration highly exposed, hands-on care little. Manufacturing: mostly physical, so exposure is concentrated in inspection, planning and logistics.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" font-size="22" text-anchor="middle" fill="#111111" font-weight="bold">From digital to physical work: where AI reaches</text>
  <rect x="40" y="70" width="270" height="72" rx="0" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
  <rect x="52" y="88" width="246" height="36" fill="#FFFFFF" stroke="none"/>
  <text x="175" y="111" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Financial services</text>
  <rect x="310" y="70" width="610" height="72" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="330" y="102" font-size="15" text-anchor="start" fill="#111111">Mostly digital and codified: processing, analysis, service, coding.</text>
  <text x="330" y="120" font-size="15" text-anchor="start" fill="#111111">Exposure is broad across the workforce.</text>
  <rect x="40" y="156" width="270" height="72" rx="0" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="52" y="174" width="246" height="36" fill="#FFFFFF" stroke="none"/>
  <text x="175" y="197" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Health care</text>
  <rect x="310" y="156" width="610" height="72" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="330" y="188" font-size="15" text-anchor="start" fill="#111111">Mixed: administration, coding and scheduling are highly exposed;</text>
  <text x="330" y="206" font-size="15" text-anchor="start" fill="#111111">hands-on care and examination little.</text>
  <rect x="40" y="242" width="270" height="72" rx="0" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
  <rect x="52" y="260" width="246" height="36" fill="#FFFFFF" stroke="none"/>
  <text x="175" y="283" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Manufacturing</text>
  <rect x="310" y="242" width="610" height="72" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="330" y="274" font-size="15" text-anchor="start" fill="#111111">Mostly physical: exposure concentrated in inspection, planning,</text>
  <text x="330" y="292" font-size="15" text-anchor="start" fill="#111111">maintenance forecasting and logistics.</text>
  <text x="480" y="362" font-size="13" text-anchor="middle" fill="#333333">Schematic comparison of task exposure, not a forecast of job loss.</text>
</svg>
