  <rect x="540" y="189" width="16" height="16" fill="#9BB3CC" stroke="#111111" stroke-width="2"/>
  <rect x="488" y="145" width="16" height="16" fill="#9BB3CC" stroke="#111111" stroke-width="2"/>
