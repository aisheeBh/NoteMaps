<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Decision boundaries of three model families</title>
  <desc>The same two classes of points, circles and squares, separated in three panels. A linear model draws one straight line. A decision tree draws a staircase of horizontal and vertical segments. A nearest-neighbour model draws a flexible boundary that bends around individual points.</desc>
  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Same data, three different assumptions about the pattern</text>
