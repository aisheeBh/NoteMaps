  <circle cx="196" cy="254" r="8" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
  <rect x="214" y="124" width="16" height="16" fill="#9BB3CC" stroke="#111111" stroke-width="2"/>
  <rect x="240" y="189" width="16" height="16" fill="#9BB3CC" stroke="#111111" stroke-width="2"/>
  <rect x="188" y="145" width="16" height="16" fill="#9BB3CC" stroke="#111111" stroke-width="2"/>
  <rect x="261" y="254" width="16" height="16" fill="#9BB3CC" stroke="#111111" stroke-width="2"/>
  <rect x="162" y="103" width="16" height="16" fill="#9BB3CC" stroke="#111111" stroke-width="2"/>
  <rect x="227" y="163" width="16" height="16" fill="#9BB3CC" stroke="#111111" stroke-width="2"/>
  <rect x="266" y="111" width="16" height="16" fill="#9BB3CC" stroke="#111111" stroke-width="2"/>
