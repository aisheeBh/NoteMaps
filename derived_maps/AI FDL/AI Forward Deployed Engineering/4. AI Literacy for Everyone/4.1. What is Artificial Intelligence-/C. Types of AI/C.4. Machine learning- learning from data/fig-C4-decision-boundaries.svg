  <path d="M58 80 L300 322" fill="none" stroke="#1F3B5C" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="79" cy="288" r="8" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
  <circle cx="105" cy="197" r="8" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
  <circle cx="118" cy="262" r="8" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
  <circle cx="144" cy="301" r="8" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
  <circle cx="92" cy="145" r="8" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
  <circle cx="157" cy="223" r="8" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
  <circle cx="183" cy="288" r="8" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
