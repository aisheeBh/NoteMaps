  <text x="170" y="372" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Linear model</text>
  <text x="170" y="396" text-anchor="middle" font-size="15" fill="#111111">one straight boundary</text>
  <rect x="340" y="80" width="260" height="260" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <path d="M340 132 L444 132 L444 205 L501 205 L501 231 L543 231 L543 340" fill="none" stroke="#1F3B5C" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="379" cy="288" r="8" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
  <circle cx="405" cy="197" r="8" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
