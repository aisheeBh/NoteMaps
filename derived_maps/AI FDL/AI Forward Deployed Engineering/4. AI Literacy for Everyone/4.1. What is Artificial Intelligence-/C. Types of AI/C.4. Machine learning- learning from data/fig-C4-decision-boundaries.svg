  <rect x="749" y="145" width="16" height="16" fill="#9BB3CC" stroke="#111111" stroke-width="2"/>
  <text x="770" y="372" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Nearest neighbours</text>
  <text x="770" y="396" text-anchor="middle" font-size="15" fill="#111111">bends around points</text>
  <circle cx="310" cy="440" r="8" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/><text x="326" y="445" font-size="15" fill="#111111">class 1, e.g. stays</text>
  <rect x="512" y="432" width="16" height="16" fill="#9BB3CC" stroke="#111111" stroke-width="2"/><text x="536" y="445" font-size="15" fill="#111111">class 2, e.g. cancels</text>
  <text x="480" y="490" text-anchor="middle" font-size="15" fill="#111111">Simpler boundaries are easier to explain; flexible ones fit more closely but may follow noise.</text>
  <text x="480" y="522" text-anchor="middle" font-size="13" fill="#333333">Schematic; boundaries drawn by hand to show typical shapes, not fitted to these points.</text>
</svg>
