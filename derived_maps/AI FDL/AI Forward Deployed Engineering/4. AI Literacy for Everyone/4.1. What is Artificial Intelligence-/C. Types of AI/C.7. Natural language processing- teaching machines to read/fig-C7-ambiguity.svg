<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Two structures for one ambiguous sentence</title>
  <desc>Two tree diagrams for the sentence I saw the man with the telescope. In the left tree the phrase with the telescope attaches to the verb saw, meaning the telescope was used for seeing. In the right tree it attaches to the man, meaning the man had the telescope.</desc>

  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">"I saw the man with the telescope"</text>
  <rect x="20" y="62" width="440" height="410" fill="#FAFAFA" stroke="#999999" stroke-width="1"/>
  <rect x="198" y="84" width="84" height="32" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="2.5" />
  <text x="240" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Sentence</text>
  <rect x="50" y="164" width="60" height="32" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="2.5" />
  <text x="80" y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">I</text>
  <rect x="236" y="164" width="108" height="32" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2.5" />
  <text x="290" y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Verb phrase</text>
  <line x1="240" y1="116" x2="80" y2="164" stroke="#333333" stroke-width="2"/>
  <line x1="240" y1="116" x2="290" y2="164" stroke="#333333" stroke-width="2"/>
  <rect x="90" y="254" width="60" height="32" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="2.5" />
  <text x="120" y="275" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">saw</text>
  <rect x="202" y="254" width="76" height="32" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="2.5" />
  <text x="240" y="275" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">the man</text>
  <rect x="288" y="254" width="164" height="32" rx="6" fill="#FFE6A8" stroke="#7A5200" stroke-width="2.5" stroke-dasharray="8 4"/>
  <text x="370" y="275" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">with the telescope</text>
  <line x1="290" y1="196" x2="120" y2="254" stroke="#333333" stroke-width="2"/>
  <line x1="290" y1="196" x2="240" y2="254" stroke="#333333" stroke-width="2"/>
  <line x1="290" y1="196" x2="370" y2="254" stroke="#333333" stroke-width="4"/>
  <text x="240" y="370" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Reading A: the telescope</text>
  <text x="240" y="394" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">belongs to the seeing</text>
  <text x="240" y="430" text-anchor="middle" font-size="15" fill="#111111">"I looked through a telescope</text>
  <text x="240" y="452" text-anchor="middle" font-size="15" fill="#111111">and saw the man."</text>
  <rect x="500" y="62" width="440" height="410" fill="#FFFFFF" stroke="#999999" stroke-width="1"/>
  <rect x="678" y="84" width="84" height="32" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="2.5" />
  <text x="720" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Sentence</text>
  <rect x="530" y="164" width="60" height="32" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="2.5" />
  <text x="560" y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">I</text>
  <rect x="716" y="164" width="108" height="32" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2.5" />
  <text x="770" y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Verb phrase</text>
  <line x1="720" y1="116" x2="560" y2="164" stroke="#333333" stroke-width="2"/>
  <line x1="720" y1="116" x2="770" y2="164" stroke="#333333" stroke-width="2"/>
  <rect x="620" y="254" width="60" height="32" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="2.5" />
  <text x="650" y="275" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">saw</text>
  <rect x="766" y="254" width="108" height="32" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2.5" />
  <text x="820" y="275" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Noun phrase</text>
  <line x1="770" y1="196" x2="650" y2="254" stroke="#333333" stroke-width="2"/>
  <line x1="770" y1="196" x2="820" y2="254" stroke="#333333" stroke-width="2"/>
  <rect x="672" y="324" width="76" height="32" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="2.5" />
  <text x="710" y="345" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">the man</text>
  <rect x="768" y="324" width="164" height="32" rx="6" fill="#FFE6A8" stroke="#7A5200" stroke-width="2.5" stroke-dasharray="8 4"/>
  <text x="850" y="345" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">with the telescope</text>
  <line x1="820" y1="286" x2="710" y2="324" stroke="#333333" stroke-width="2"/>
  <line x1="820" y1="286" x2="850" y2="324" stroke="#333333" stroke-width="4"/>
  <text x="720" y="410" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Reading B: the man has the telescope</text>
  <text x="720" y="440" text-anchor="middle" font-size="15" fill="#111111">"I saw the man who was holding a telescope."</text>
  <text x="480" y="508" text-anchor="middle" font-size="15" fill="#111111">The words are identical; only the structure, and therefore the meaning, differs.</text>
  <text x="480" y="540" text-anchor="middle" font-size="13" fill="#333333">Simplified grammatical trees.</text>
</svg>
