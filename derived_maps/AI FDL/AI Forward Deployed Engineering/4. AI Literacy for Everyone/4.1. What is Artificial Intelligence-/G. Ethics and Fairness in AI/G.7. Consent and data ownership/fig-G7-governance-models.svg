<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Models of data governance from individual to collective</title>
  <desc>A horizontal spectrum from individual control on the left to collective control on the right. Five models are placed along it: individual property, individual rights, information fiduciary, data trust or cooperative, and data sovereignty. Beneath each is a one-line description of who decides.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Who governs data: one person, an institution, or a community?</text>

  <line x1="40" y1="110" x2="920" y2="110" stroke="#222222" stroke-width="4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="40" y="90" font-size="17" font-weight="bold" fill="#111111">Individual control</text>
  <text x="920" y="90" text-anchor="end" font-size="17" font-weight="bold" fill="#111111">Collective control</text>

  <g font-size="14" fill="#111111" text-anchor="middle">
    <rect x="24" y="150" width="172" height="150" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
    <text x="110" y="184" font-size="16" font-weight="bold" fill="#FFFFFF">Individual</text>
    <text x="110" y="204" font-size="16" font-weight="bold" fill="#FFFFFF">property</text>
    <text x="110" y="238" fill="#FFFFFF">Each person owns</text><text x="110" y="258" fill="#FFFFFF">and sells their data</text>

    <rect x="204" y="150" width="172" height="150" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
    <text x="290" y="184" font-size="16" font-weight="bold">Individual</text>
    <text x="290" y="204" font-size="16" font-weight="bold">rights</text>
    <text x="290" y="238">Rights that cannot</text><text x="290" y="258">be signed away</text>

    <rect x="384" y="150" width="172" height="150" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="2.5"/>
    <text x="470" y="184" font-size="16" font-weight="bold">Information</text>
    <text x="470" y="204" font-size="16" font-weight="bold">fiduciary</text>
    <text x="470" y="238">Holder owes loyalty</text><text x="470" y="258">and care to subjects</text>

    <rect x="564" y="150" width="172" height="150" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
    <text x="650" y="184" font-size="16" font-weight="bold">Data trust or</text>
    <text x="650" y="204" font-size="16" font-weight="bold">cooperative</text>
    <text x="650" y="238">Stewards negotiate</text><text x="650" y="258">for the whole group</text>

    <rect x="744" y="150" width="192" height="150" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
    <text x="840" y="184" font-size="16" font-weight="bold">Data</text>
    <text x="840" y="204" font-size="16" font-weight="bold">sovereignty</text>
    <text x="840" y="238">A community holds</text><text x="840" y="258">authority over its data</text>
  </g>

  <g font-size="14" fill="#111111" text-anchor="middle">
    <rect x="24" y="330" width="172" height="104" fill="#FFFFFF" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="110" y="356" font-weight="bold">Weakness</text><text x="110" y="378">Little value each;</text><text x="110" y="398">deepens inequality</text>
    <rect x="204" y="330" width="172" height="104" fill="#FFFFFF" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="290" y="356" font-weight="bold">Weakness</text><text x="290" y="378">Relies on people</text><text x="290" y="398">using their rights</text>
    <rect x="384" y="330" width="172" height="104" fill="#FFFFFF" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="470" y="356" font-weight="bold">Weakness</text><text x="470" y="378">Hard to enforce;</text><text x="470" y="398">still a proposal</text>
    <rect x="564" y="330" width="172" height="104" fill="#FFFFFF" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="650" y="356" font-weight="bold">Weakness</text><text x="650" y="378">Complex to set up</text><text x="650" y="398">and run</text>
    <rect x="744" y="330" width="192" height="104" fill="#FFFFFF" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="840" y="356" font-weight="bold">Weakness</text><text x="840" y="378">Limited recognition</text><text x="840" y="398">in law</text>
  </g>

  <text x="480" y="480" text-anchor="middle" font-size="14" fill="#111111">Data about one person is often data about many, which is why collective models exist.</text>
  <text x="480" y="508" text-anchor="middle" font-size="13" fill="#333333">Schematic ordering of governance models; real regimes combine several.</text>
</svg>
