<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Individual requests and collective action</title>
  <desc>On the left, several individuals each make a separate request and receive a generic reply. Arrows lead to a central box where an association pools the replies and gets expert analysis. From there, arrows lead to outcomes: a pattern is revealed, regulators act, and the organisation changes the system.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Alone, a generic reply; together, evidence</text>

  <g font-size="14" fill="#111111" text-anchor="middle">
    <rect x="30" y="80" width="200" height="70" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="2"/><text x="130" y="108" font-weight="bold">Tenant A</text><text x="130" y="130">generic reply</text>
    <rect x="30" y="170" width="200" height="70" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="2"/><text x="130" y="198" font-weight="bold">Tenant B</text><text x="130" y="220">generic reply</text>
    <rect x="30" y="260" width="200" height="70" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="2"/><text x="130" y="288" font-weight="bold">Tenant C</text><text x="130" y="310">partial data returned</text>
    <rect x="30" y="350" width="200" height="70" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="2"/><text x="130" y="378" font-weight="bold">And dozens more</text><text x="130" y="400">same-day requests</text>
  </g>

  <g stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)">
    <line x1="230" y1="115" x2="340" y2="215"/><line x1="230" y1="205" x2="340" y2="240"/>
    <line x1="230" y1="295" x2="340" y2="270"/><line x1="230" y1="385" x2="340" y2="300"/>
  </g>

  <rect x="345" y="170" width="270" height="170" rx="10" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="480" y="202" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Association or union</text>
  <text x="480" y="232" text-anchor="middle" font-size="14" fill="#FFFFFF">pools the replies</text>
  <text x="480" y="254" text-anchor="middle" font-size="14" fill="#FFFFFF">gets expert analysis of</text>
  <text x="480" y="276" text-anchor="middle" font-size="14" fill="#FFFFFF">group-level outcomes</text>
  <text x="480" y="308" text-anchor="middle" font-size="14" fill="#FFFFFF">files a joint complaint</text>

  <g stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)">
    <line x1="615" y1="215" x2="705" y2="130"/><line x1="615" y1="255" x2="705" y2="255"/><line x1="615" y1="295" x2="705" y2="380"/>
  </g>

  <g font-size="14" fill="#111111" text-anchor="middle">
    <rect x="710" y="90" width="220" height="80" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
    <text x="820" y="122" font-weight="bold" font-size="15">A pattern is revealed</text><text x="820" y="146">shared inputs, group gaps</text>
    <rect x="710" y="215" width="220" height="80" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
    <text x="820" y="247" font-weight="bold" font-size="15">Regulators act</text><text x="820" y="271">inquiry or enforcement</text>
    <rect x="710" y="340" width="220" height="80" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
    <text x="820" y="372" font-weight="bold" font-size="15">The system changes</text><text x="820" y="396">inputs removed, review added</text>
  </g>

  <text x="480" y="470" text-anchor="middle" font-size="15" fill="#111111">Coordinated requests give regulators and researchers evidence no single person holds.</text>
  <text x="480" y="504" text-anchor="middle" font-size="13" fill="#333333">Schematic of the tenants' association example; illustrative.</text>
</svg>
