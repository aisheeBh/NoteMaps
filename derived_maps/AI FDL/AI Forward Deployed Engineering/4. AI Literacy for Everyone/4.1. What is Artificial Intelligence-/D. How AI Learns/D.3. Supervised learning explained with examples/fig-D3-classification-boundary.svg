  <circle cx="356" cy="384" r="8" fill="#FFFFFF" stroke="#1E5E24" stroke-width="3"/>
  <circle cx="461" cy="402" r="8" fill="#FFFFFF" stroke="#1E5E24" stroke-width="3"/>
  <circle cx="182" cy="391" r="8" fill="#FFFFFF" stroke="#1E5E24" stroke-width="3"/>
  <circle cx="189" cy="392" r="8" fill="#FFFFFF" stroke="#1E5E24" stroke-width="3"/>
  <circle cx="624" cy="398" r="8" fill="#FFFFFF" stroke="#1E5E24" stroke-width="3"/>
  <circle cx="179" cy="289" r="8" fill="#FFFFFF" stroke="#1E5E24" stroke-width="3"/>
  <path d="M317 120L333 136M317 136L333 120" stroke="#8B0000" stroke-width="3.5"/>
  <path d="M835 309L851 325M835 325L851 309" stroke="#8B0000" stroke-width="3.5"/>
