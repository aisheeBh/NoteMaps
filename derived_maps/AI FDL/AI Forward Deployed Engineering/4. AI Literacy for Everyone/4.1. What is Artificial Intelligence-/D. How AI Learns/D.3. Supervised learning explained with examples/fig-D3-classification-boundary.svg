  <rect x="652" y="357" width="170" height="30" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1.5"/>
  <text x="737" y="377" font-size="15" fill="#111111" text-anchor="middle">Learned boundary</text>
  <rect x="640" y="84" width="230" height="30" fill="#FFFFFF"/>
  <text x="755" y="105" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">Side predicted: spam</text>
  <rect x="135" y="420" width="250" height="30" fill="#FFFFFF"/>
  <text x="260" y="441" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">Side predicted: not spam</text>
  <circle cx="591" cy="253" r="16" fill="#FFE6A8" stroke="#7A5200" stroke-width="2.5"/>
  <text x="591" y="259" font-size="18" font-weight="bold" fill="#111111" text-anchor="middle">?</text>
  <rect x="615" y="239" width="170" height="48" fill="#FFFFFF" stroke="#555555" stroke-width="1.5"/>
  <text x="625" y="258" font-size="15" fill="#111111">New email: falls on</text>
  <text x="625" y="278" font-size="15" fill="#111111">the spam side</text>
  <g font-size="15" fill="#111111">
    <path d="M152 532L168 548M152 548L168 532" stroke="#8B0000" stroke-width="3.5"/><text x="180" y="546">Labelled spam</text>
    <circle cx="360" cy="540" r="8" fill="#FFFFFF" stroke="#1E5E24" stroke-width="3"/><text x="376" y="546">Labelled not spam</text>
  </g>
  <text x="900" y="572" font-size="13" fill="#333333" text-anchor="end">Illustrative data; real filters use thousands of measured properties.</text>
</svg>
