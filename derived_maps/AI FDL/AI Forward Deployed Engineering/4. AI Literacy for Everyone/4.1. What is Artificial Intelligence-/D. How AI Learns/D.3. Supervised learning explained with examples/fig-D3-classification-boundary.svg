  <circle cx="480" cy="336" r="8" fill="#FFFFFF" stroke="#1E5E24" stroke-width="3"/>
  <circle cx="439" cy="381" r="8" fill="#FFFFFF" stroke="#1E5E24" stroke-width="3"/>
  <circle cx="193" cy="372" r="8" fill="#FFFFFF" stroke="#1E5E24" stroke-width="3"/>
  <circle cx="316" cy="340" r="8" fill="#FFFFFF" stroke="#1E5E24" stroke-width="3"/>
  <circle cx="275" cy="299" r="8" fill="#FFFFFF" stroke="#1E5E24" stroke-width="3"/>
  <circle cx="180" cy="223" r="8" fill="#FFFFFF" stroke="#1E5E24" stroke-width="3"/>
