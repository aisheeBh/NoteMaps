<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>A learned boundary separating spam from genuine email</title>
  <desc>Training emails plotted by two measured properties. Spam examples, drawn as crosses, cluster at the upper right; genuine emails, drawn as circles, cluster at the lower left. A learned boundary line separates them, and a new unlabelled email is classified by the side on which it falls.</desc>
  <text x="480" y="40" font-size="22" font-weight="bold" fill="#111111" text-anchor="middle">Learning a boundary from labelled examples</text>
  <line x1="120" y1="80" x2="120" y2="460" stroke="#222222" stroke-width="2"/>
  <line x1="120" y1="460" x2="890" y2="460" stroke="#222222" stroke-width="2"/>
  <text x="500" y="500" font-size="16" fill="#111111" text-anchor="middle">Count of words such as "free" or "winner"</text>
  <text x="60" y="275" font-size="16" fill="#111111" text-anchor="middle" transform="rotate(-90 60 275)">Number of links in the email</text>
  <circle cx="427" cy="396" r="8" fill="#FFFFFF" stroke="#1E5E24" stroke-width="3"/>
  <circle cx="197" cy="317" r="8" fill="#FFFFFF" stroke="#1E5E24" stroke-width="3"/>
