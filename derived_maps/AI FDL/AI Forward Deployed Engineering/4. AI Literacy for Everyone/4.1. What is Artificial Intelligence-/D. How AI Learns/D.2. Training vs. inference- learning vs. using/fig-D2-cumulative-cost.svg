<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Cumulative cost of training and inference over two years</title>
  <desc>Training cost arrives in large steps at the start and at a retraining point; inference cost grows steadily with every use and overtakes training cost for a heavily used system.</desc>
  <text x="480" y="40" font-size="22" font-weight="bold" fill="#111111" text-anchor="middle">Training is paid in steps; inference is paid with every use</text>
  <line x1="120" y1="80" x2="120" y2="440" stroke="#222222" stroke-width="2"/>
  <line x1="120" y1="440" x2="880" y2="440" stroke="#222222" stroke-width="2"/>
  <text x="60" y="260" font-size="16" fill="#111111" text-anchor="middle" transform="rotate(-90 60 260)">Cumulative cost</text>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <line x1="120" y1="440" x2="120" y2="448" stroke="#222222"/><text x="120" y="468">Launch</text>
    <line x1="310" y1="440" x2="310" y2="448" stroke="#222222"/><text x="310" y="468">6 months</text>
    <line x1="500" y1="440" x2="500" y2="448" stroke="#222222"/><text x="500" y="468">12 months</text>
    <line x1="690" y1="440" x2="690" y2="448" stroke="#222222"/><text x="690" y="468">18 months</text>
    <line x1="880" y1="440" x2="880" y2="448" stroke="#222222"/><text x="866" y="468">24 months</text>
  </g>
  <text x="500" y="500" font-size="16" fill="#111111" text-anchor="middle">Time in use</text>
  <!-- training: step function -->
  <path d="M120 440 V300 H500 V250 H880" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <!-- inference: steadily rising -->
  <path d="M120 440 L880 110" fill="none" stroke="#7A5200" stroke-width="4" stroke-dasharray="10 6"/>
  <!-- labels -->
  <rect x="140" y="262" width="220" height="26" fill="#FFFFFF"/>
  <text x="150" y="281" font-size="16" fill="#111111">Initial training run</text>
  <rect x="510" y="300" width="160" height="26" fill="#FFFFFF"/>
  <text x="520" y="319" font-size="16" fill="#111111">Retraining run</text>
  <rect x="380" y="150" width="230" height="48" fill="#FFFFFF"/>
  <text x="390" y="170" font-size="16" fill="#111111">Inference: grows with</text>
  <text x="390" y="191" font-size="16" fill="#111111">every request served</text>
  <rect x="690" y="262" width="180" height="26" fill="#FFFFFF"/>
  <text x="700" y="281" font-size="16" fill="#111111">Training total</text>
  <circle cx="442" cy="300" r="7" fill="none" stroke="#111111" stroke-width="2"/>
  <line x1="448" y1="306" x2="600" y2="366" stroke="#333333" stroke-width="1.5"/>
  <rect x="600" y="350" width="250" height="48" fill="#FFFFFF" stroke="#555555" stroke-width="1.5"/>
  <text x="725" y="370" font-size="15" fill="#111111" text-anchor="middle">Crossover: inference has</text>
  <text x="725" y="390" font-size="15" fill="#111111" text-anchor="middle">now cost more than training</text>
  <text x="480" y="540" font-size="13" fill="#333333" text-anchor="middle">Schematic with illustrative proportions for a heavily used system; a rarely used model may never reach the crossover.</text>
</svg>
