<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Accuracy against labelled examples, with and without a pre-trained starting point</title>
  <desc>Two curves of accuracy on new data against the number of labelled examples on a logarithmic scale. A model starting from pre-trained knowledge is far more accurate when few labelled examples exist; a model trained from scratch catches up only with very large amounts of data.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" font-size="22" font-weight="bold" fill="#111111" text-anchor="middle">Transfer pays most when labelled data is scarce</text>
  <line x1="120" y1="80" x2="120" y2="430" stroke="#222222" stroke-width="2"/>
  <line x1="120" y1="430" x2="890" y2="430" stroke="#222222" stroke-width="2"/>
  <text x="60" y="255" font-size="16" fill="#111111" text-anchor="middle" transform="rotate(-90 60 255)">Accuracy on new data</text>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <line x1="120" y1="430" x2="120" y2="438" stroke="#222222"/><text x="120" y="458">100</text>
    <line x1="373" y1="430" x2="373" y2="438" stroke="#222222"/><text x="373" y="458">1,000</text>
    <line x1="627" y1="430" x2="627" y2="438" stroke="#222222"/><text x="627" y="458">10,000</text>
    <line x1="880" y1="430" x2="880" y2="438" stroke="#222222"/><text x="880" y="458">100,000</text>
  </g>
  <g font-size="14" fill="#111111" text-anchor="end">
    <line x1="112" y1="373" x2="120" y2="373" stroke="#222222"/><text x="106" y="378">50%</text>
    <line x1="112" y1="317" x2="120" y2="317" stroke="#222222"/><text x="106" y="322">60%</text>
    <line x1="112" y1="260" x2="120" y2="260" stroke="#222222"/><text x="106" y="265">70%</text>
    <line x1="112" y1="203" x2="120" y2="203" stroke="#222222"/><text x="106" y="208">80%</text>
    <line x1="112" y1="147" x2="120" y2="147" stroke="#222222"/><text x="106" y="152">90%</text>
  </g>
