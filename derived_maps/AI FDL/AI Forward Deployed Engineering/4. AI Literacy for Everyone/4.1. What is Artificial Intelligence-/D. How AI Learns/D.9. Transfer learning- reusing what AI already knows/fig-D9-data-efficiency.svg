  <line x1="373" y1="195" x2="373" y2="373" stroke="#333333" stroke-width="2" stroke-dasharray="2 4"/>
  <line x1="373" y1="284" x2="640" y2="352" stroke="#333333" stroke-width="1.5"/>
  <rect x="640" y="330" width="250" height="46" fill="#FFFFFF" stroke="#555555" stroke-width="1.5"/>
  <text x="650" y="350" font-size="15" fill="#111111">With 1,000 examples, the</text>
  <text x="650" y="369" font-size="15" fill="#111111">pre-trained model is far ahead</text>
  <rect x="160" y="285" width="210" height="26" fill="#FFFFFF"/>
  <text x="170" y="304" font-size="16" fill="#111111">Starting from pre-training</text>
  <rect x="135" y="355" width="180" height="26" fill="#FFFFFF"/>
  <text x="140" y="374" font-size="16" fill="#111111">Training from scratch</text>
  <text x="505" y="490" font-size="16" fill="#111111" text-anchor="middle">Labelled examples for the new task (each step is ten times more)</text>
  <text x="480" y="540" font-size="13" fill="#333333" text-anchor="middle">Schematic with illustrative values; the size of the advantage varies greatly between tasks.</text>
</svg>
