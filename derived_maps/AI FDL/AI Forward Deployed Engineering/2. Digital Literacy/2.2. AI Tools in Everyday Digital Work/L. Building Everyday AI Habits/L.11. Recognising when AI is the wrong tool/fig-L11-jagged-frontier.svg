<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The jagged frontier</title>
  <desc>Tasks are placed along a horizontal axis of how difficult they seem to a person. A jagged boundary line separates tasks AI does well, inside the frontier, from tasks it does poorly, outside. Some easy-seeming tasks such as totalling a long column fall outside, while some hard-seeming tasks such as drafting a persuasive memo fall inside.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">The jagged frontier of AI capability</text>
  <rect x="80" y="110" width="820" height="380" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <path d="M80 490 L80 330 L160 330 L160 230 L250 230 L250 380 L330 380 L330 200 L450 200 L450 300 L540 300 L540 170 L640 170 L640 360 L720 360 L720 250 L820 250 L820 320 L900 320 L900 490 Z" fill="url(#cross)" stroke="none"/>
  <path d="M80 330 L160 330 L160 230 L250 230 L250 380 L330 380 L330 200 L450 200 L450 300 L540 300 L540 170 L640 170 L640 360 L720 360 L720 250 L820 250 L820 320 L900 320" fill="none" stroke="#111111" stroke-width="3.5"/>
  <rect x="96" y="122" width="300" height="30" fill="#FFFFFF" stroke="#999999" stroke-width="1"/>
  <text x="104" y="143" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">Outside the frontier: AI does poorly</text>
  <rect x="90" y="452" width="290" height="30" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/>
  <text x="100" y="473" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">Inside the frontier: AI does well</text>
  <circle cx="120" cy="340" r="7" fill="#111111"/>
  <rect x="84" y="350" width="72" height="38" fill="#FFFFFF" stroke="#666666" stroke-width="0.8"/>
  <text x="120" y="366" text-anchor="middle" font-size="13" fill="#111111">Rewrite</text>
  <text x="120" y="382" text-anchor="middle" font-size="13" fill="#111111">for tone</text>
  <circle cx="205" cy="205" r="7" fill="#111111"/>
  <rect x="158" y="215" width="95" height="38" fill="#FFFFFF" stroke="#666666" stroke-width="0.8"/>
  <text x="205" y="231" text-anchor="middle" font-size="13" fill="#111111">Total a</text>
  <text x="205" y="247" text-anchor="middle" font-size="13" fill="#111111">long column</text>
  <circle cx="290" cy="390" r="7" fill="#111111"/>
  <rect x="250" y="400" width="79" height="38" fill="#FFFFFF" stroke="#666666" stroke-width="0.8"/>
  <text x="290" y="416" text-anchor="middle" font-size="13" fill="#111111">Summarise</text>
  <text x="290" y="432" text-anchor="middle" font-size="13" fill="#111111">notes</text>
  <circle cx="390" cy="175" r="7" fill="#111111"/>
  <rect x="335" y="185" width="110" height="38" fill="#FFFFFF" stroke="#666666" stroke-width="0.8"/>
  <text x="390" y="201" text-anchor="middle" font-size="13" fill="#111111">Today's</text>
  <text x="390" y="217" text-anchor="middle" font-size="13" fill="#111111">exchange rate</text>
  <circle cx="495" cy="315" r="7" fill="#111111"/>
  <rect x="432" y="325" width="126" height="38" fill="#FFFFFF" stroke="#666666" stroke-width="0.8"/>
  <text x="495" y="341" text-anchor="middle" font-size="13" fill="#111111">Draft a</text>
  <text x="495" y="357" text-anchor="middle" font-size="13" fill="#111111">persuasive memo</text>
  <circle cx="590" cy="145" r="7" fill="#111111"/>
  <rect x="531" y="155" width="118" height="38" fill="#FFFFFF" stroke="#666666" stroke-width="0.8"/>
  <text x="590" y="171" text-anchor="middle" font-size="13" fill="#111111">Combine data</text>
  <text x="590" y="187" text-anchor="middle" font-size="13" fill="#111111">and interviews</text>
  <circle cx="680" cy="370" r="7" fill="#111111"/>
  <rect x="644" y="380" width="72" height="38" fill="#FFFFFF" stroke="#666666" stroke-width="0.8"/>
  <text x="680" y="396" text-anchor="middle" font-size="13" fill="#111111">Generate</text>
  <text x="680" y="412" text-anchor="middle" font-size="13" fill="#111111">ideas</text>
  <circle cx="770" cy="225" r="7" fill="#111111"/>
  <rect x="730" y="235" width="79" height="38" fill="#FFFFFF" stroke="#666666" stroke-width="0.8"/>
  <text x="770" y="251" text-anchor="middle" font-size="13" fill="#111111">Cite real</text>
  <text x="770" y="267" text-anchor="middle" font-size="13" fill="#111111">case law</text>
  <circle cx="860" cy="335" r="7" fill="#111111"/>
  <rect x="820" y="345" width="79" height="38" fill="#FFFFFF" stroke="#666666" stroke-width="0.8"/>
  <text x="860" y="361" text-anchor="middle" font-size="13" fill="#111111">Outline a</text>
  <text x="860" y="377" text-anchor="middle" font-size="13" fill="#111111">report</text>
  <line x1="80" y1="530" x2="900" y2="530" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="80" y="552" text-anchor="start" font-size="14" fill="#111111">seems easy to a person</text>
  <text x="900" y="552" text-anchor="end" font-size="14" fill="#111111">seems hard to a person</text>
  <text x="480" y="594" text-anchor="middle" font-size="13" fill="#333333">Schematic after Dell'Acqua and colleagues (2023); task placements are illustrative and shift as models change.</text>
</svg>
