<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Which skills need protecting?</title>
  <desc>A two-by-two matrix. Skills that matter without AI and are rarely practised now are at risk and need deliberate practice. Skills that matter and are still practised are safe for now. Skills that matter little and are rarely practised can be let go. Skills that matter little but are still practised are candidates for delegation.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Which skills need protecting?</text>
  <rect x="156" y="101" width="368" height="188" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="164" y="155" width="352" height="78" rx="4" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
  <text x="340" y="176" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">At risk: practise deliberately</text>
  <text x="340" y="205" text-anchor="middle" font-size="15" fill="#111111">Needed to verify or to work unaided, but</text>
  <text x="340" y="225" text-anchor="middle" font-size="15" fill="#111111">now seldom used</text>
  <rect x="536" y="101" width="368" height="188" rx="6" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
  <rect x="544" y="155" width="352" height="78" rx="4" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/>
  <text x="720" y="176" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Safe for now</text>
  <text x="720" y="205" text-anchor="middle" font-size="15" fill="#111111">Important and still exercised; watch for</text>
  <text x="720" y="225" text-anchor="middle" font-size="15" fill="#111111">drift</text>
  <rect x="156" y="301" width="368" height="188" rx="6" fill="#E6E6E6" stroke="#666666" stroke-width="2" stroke-dasharray="2 4"/>
  <text x="340" y="386" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Let go</text>
  <text x="340" y="415" text-anchor="middle" font-size="15" fill="#111111">Little needed without AI and little used</text>
  <rect x="536" y="301" width="368" height="188" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="720" y="376" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Delegate</text>
  <text x="720" y="405" text-anchor="middle" font-size="15" fill="#111111">Practised from habit but adds little; AI</text>
  <text x="720" y="425" text-anchor="middle" font-size="15" fill="#111111">can take it</text>
  <line x1="150" y1="509" x2="910" y2="509" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="136" y1="495" x2="136" y2="95" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="160" y="533" text-anchor="start" font-size="14" fill="#111111">rarely</text>
  <text x="910" y="533" text-anchor="end" font-size="14" fill="#111111">often</text>
  <text x="530" y="555" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">How often the skill is still practised unaided</text>
  <text x="120" y="495" text-anchor="start" font-size="14" fill="#111111" transform="rotate(-90 120 495)">little</text>
  <text x="120" y="95" text-anchor="end" font-size="14" fill="#111111" transform="rotate(-90 120 95)">a great deal</text>
  <text x="90" y="295" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111" transform="rotate(-90 90 295.0)">How much the skill matters without AI</text>
  <text x="480" y="584" text-anchor="middle" font-size="13" fill="#333333">Placement depends on role; the same skill may sit in different quadrants for different people.</text>
</svg>
