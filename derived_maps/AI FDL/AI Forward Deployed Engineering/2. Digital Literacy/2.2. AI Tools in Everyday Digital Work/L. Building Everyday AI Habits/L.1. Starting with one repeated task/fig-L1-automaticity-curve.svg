<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Automaticity rises steeply, then levels off</title>
  <desc>Two schematic curves of automaticity against days of repetition. A fast-forming habit plateaus within about a month; a slow-forming one is still rising after four months. The median person in habit studies reaches near-plateau at roughly two months.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Automaticity rises steeply, then levels off</text>
  <line x1="120" y1="450" x2="900" y2="450" stroke="#222222" stroke-width="2.5"/>
  <line x1="120" y1="450" x2="120" y2="90" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="450" x2="120" y2="456" stroke="#222222" stroke-width="1.5"/>
  <text x="120" y="474" text-anchor="middle" font-size="14" fill="#111111">0</text>
  <line x1="315" y1="450" x2="315" y2="456" stroke="#222222" stroke-width="1.5"/>
  <text x="315" y="474" text-anchor="middle" font-size="14" fill="#111111">30</text>
  <line x1="510" y1="450" x2="510" y2="456" stroke="#222222" stroke-width="1.5"/>
  <text x="510" y="474" text-anchor="middle" font-size="14" fill="#111111">60</text>
  <line x1="705" y1="450" x2="705" y2="456" stroke="#222222" stroke-width="1.5"/>
  <text x="705" y="474" text-anchor="middle" font-size="14" fill="#111111">90</text>
  <line x1="900" y1="450" x2="900" y2="456" stroke="#222222" stroke-width="1.5"/>
  <text x="900" y="474" text-anchor="middle" font-size="14" fill="#111111">120</text>
  <line x1="114" y1="450" x2="120" y2="450" stroke="#222222" stroke-width="1.5"/>
  <text x="110" y="455" text-anchor="end" font-size="14" fill="#111111">none</text>
  <line x1="114" y1="275" x2="120" y2="275" stroke="#222222" stroke-width="1.5"/>
  <text x="110" y="280" text-anchor="end" font-size="14" fill="#111111">moderate</text>
  <line x1="114" y1="118" x2="120" y2="118" stroke="#222222" stroke-width="1.5"/>
  <text x="110" y="122" text-anchor="end" font-size="14" fill="#111111">high</text>
  <text x="510" y="502" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Days of repeating the behaviour in the same context</text>
  <text x="50" y="275" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111" transform="rotate(-90 50 275.0)">Felt automaticity</text>
  <rect x="502" y="415" width="47" height="35" rx="0" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <path d="M120.0 450.0 L135.6 397.0 L151.2 352.7 L166.8 315.6 L182.4 284.7 L198.0 258.9 L213.6 237.3 L229.2 219.3 L244.8 204.3 L260.4 191.7 L276.0 181.2 L291.6 172.5 L307.2 165.1 L322.8 159.0 L338.4 153.9 L354.0 149.6 L369.6 146.1 L385.2 143.1 L400.8 140.6 L416.4 138.5 L432.0 136.8 L447.6 135.3 L463.2 134.1 L478.8 133.1 L494.4 132.3 L510.0 131.6 L525.6 131.0 L541.2 130.5 L556.8 130.1 L572.4 129.7 L588.0 129.5 L603.6 129.2 L619.2 129.0 L634.8 128.8 L650.4 128.7 L666.0 128.6 L681.6 128.5 L697.2 128.4 L712.8 128.3 L728.4 128.3 L744.0 128.2 L759.6 128.2 L775.2 128.2 L790.8 128.1 L806.4 128.1 L822.0 128.1 L837.6 128.1 L853.2 128.1 L868.8 128.1 L884.4 128.0 L900.0 128.0" fill="none" stroke="#111111" stroke-width="3.5"/>
  <rect x="545" y="55" width="196" height="44" fill="#FFFFFF" stroke="#999999" stroke-width="1"/>
  <text x="552" y="72" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">Fast former</text>
  <text x="552" y="91" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">(plateau within weeks)</text>
  <path d="M120.0 450.0 L135.6 434.9 L151.2 420.6 L166.8 407.0 L182.4 394.1 L198.0 381.9 L213.6 370.3 L229.2 359.2 L244.8 348.8 L260.4 338.8 L276.0 329.4 L291.6 320.4 L307.2 311.9 L322.8 303.8 L338.4 296.2 L354.0 288.9 L369.6 282.0 L385.2 275.4 L400.8 269.2 L416.4 263.3 L432.0 257.7 L447.6 252.3 L463.2 247.3 L478.8 242.5 L494.4 237.9 L510.0 233.6 L525.6 229.5 L541.2 225.6 L556.8 221.9 L572.4 218.4 L588.0 215.0 L603.6 211.8 L619.2 208.8 L634.8 206.0 L650.4 203.3 L666.0 200.7 L681.6 198.3 L697.2 195.9 L712.8 193.7 L728.4 191.7 L744.0 189.7 L759.6 187.8 L775.2 186.0 L790.8 184.3 L806.4 182.7 L822.0 181.2 L837.6 179.7 L853.2 178.3 L868.8 177.0 L884.4 175.8 L900.0 174.6" fill="none" stroke="#111111" stroke-width="3.5" stroke-dasharray="10 6"/>
  <rect x="584" y="265" width="229" height="44" fill="#FFFFFF" stroke="#999999" stroke-width="1"/>
  <text x="591" y="282" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">Slow former</text>
  <text x="591" y="301" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">(still rising at 4 months)</text>
  <text x="549" y="387" text-anchor="middle" font-size="14" fill="#111111">Median near-plateau in studies:</text>
  <text x="549" y="405" text-anchor="middle" font-size="14" fill="#111111">about two months (59 to 66 days)</text>
  <text x="480" y="544" text-anchor="middle" font-size="13" fill="#333333">Schematic; shapes follow the asymptotic pattern reported by Lally and colleagues (2010), not one dataset.</text>
</svg>
