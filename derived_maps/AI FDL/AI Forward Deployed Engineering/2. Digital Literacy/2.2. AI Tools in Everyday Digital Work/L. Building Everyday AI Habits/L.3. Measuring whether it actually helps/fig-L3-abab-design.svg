<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>An alternating design for one recurring task</title>
  <desc>Eight weeks shown as a row of blocks alternating between weeks without AI and weeks with AI, assigned by coin toss. Below, the comparison: average of the A weeks against average of the B weeks, for total time, quality rating and rework.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Testing a routine with an A-B-A-B design</text>
  <rect x="60" y="110" width="92" height="110" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <text x="106" y="156" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Week 1</text>
  <text x="106" y="184" text-anchor="middle" font-size="15" fill="#111111">no AI</text>
  <rect x="166" y="110" width="92" height="110" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="174" y="136" width="76" height="58" rx="4" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="212" y="156" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Week 2</text>
  <text x="212" y="184" text-anchor="middle" font-size="15" fill="#111111">with AI</text>
  <rect x="272" y="110" width="92" height="110" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="280" y="136" width="76" height="58" rx="4" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="318" y="156" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Week 3</text>
  <text x="318" y="184" text-anchor="middle" font-size="15" fill="#111111">with AI</text>
  <rect x="378" y="110" width="92" height="110" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <text x="424" y="156" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Week 4</text>
  <text x="424" y="184" text-anchor="middle" font-size="15" fill="#111111">no AI</text>
  <rect x="484" y="110" width="92" height="110" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="492" y="136" width="76" height="58" rx="4" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="530" y="156" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Week 5</text>
  <text x="530" y="184" text-anchor="middle" font-size="15" fill="#111111">with AI</text>
  <rect x="590" y="110" width="92" height="110" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <text x="636" y="156" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Week 6</text>
  <text x="636" y="184" text-anchor="middle" font-size="15" fill="#111111">no AI</text>
  <rect x="696" y="110" width="92" height="110" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <text x="742" y="156" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Week 7</text>
  <text x="742" y="184" text-anchor="middle" font-size="15" fill="#111111">no AI</text>
  <rect x="802" y="110" width="92" height="110" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="810" y="136" width="76" height="58" rx="4" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="848" y="156" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Week 8</text>
  <text x="848" y="184" text-anchor="middle" font-size="15" fill="#111111">with AI</text>
  <text x="480" y="250" text-anchor="middle" font-size="15" font-style="italic" fill="#111111">Each week's condition is decided by a coin toss, so easy and hard weeks fall on both sides.</text>
  <rect x="80" y="290" width="360" height="170" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <text x="260" y="356" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">A weeks: without AI</text>
  <text x="260" y="387" text-anchor="middle" font-size="15" fill="#111111">Average total minutes, average quality</text>
  <text x="260" y="406" text-anchor="middle" font-size="15" fill="#111111">rating, rework requested</text>
  <rect x="520" y="290" width="360" height="170" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="528" y="334" width="344" height="80" rx="4" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="700" y="356" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">B weeks: with AI</text>
  <text x="700" y="387" text-anchor="middle" font-size="15" fill="#111111">Average total minutes including review,</text>
  <text x="700" y="406" text-anchor="middle" font-size="15" fill="#111111">average quality rating, rework requested</text>
  <text x="480" y="382" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">vs</text>
  <text x="480" y="500" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Decision rule set in advance: keep if B saves at least 10 minutes with no loss of quality.</text>
  <text x="480" y="524" text-anchor="middle" font-size="13" fill="#333333">Schematic design adapted from n-of-1 trials in medicine; the decision threshold is an illustrative example.</text>
</svg>
