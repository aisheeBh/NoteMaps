<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 572" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Layers of defence against fabrication</title>
  <desc>Five stacked layers from first to last line of defence: choose retrieval or source-grounded tools; prompt to permit uncertainty and ask for both sides; check every decisive source and quote by opening it; second-person review for external work; organisational rules, disclosure and learning from incidents.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Layers of defence against fabrication</text>
  <rect x="50" y="72" width="680" height="78" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="390" y="103" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">1. Tool choice</text>
  <text x="390" y="130" text-anchor="middle" font-size="14.5" fill="#111111">Retrieval, source-grounded and specialist tools over memory-only answers</text>
  <rect x="50" y="162" width="680" height="78" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="390" y="193" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">2. Prompting</text>
  <text x="390" y="220" text-anchor="middle" font-size="14.5" fill="#111111">Permit "not sure"; ask for identifiers and evidence on both sides</text>
  <rect x="50" y="252" width="680" height="78" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="390" y="283" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">3. Personal checking</text>
  <text x="390" y="310" text-anchor="middle" font-size="14.5" fill="#FFFFFF">Open every decisive source; search every quotation</text>
  <rect x="50" y="342" width="680" height="78" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="390" y="373" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">4. Second reader</text>
  <text x="390" y="400" text-anchor="middle" font-size="14.5" fill="#111111">Independent check of references and quotations in external work</text>
  <rect x="50" y="432" width="680" height="78" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="390" y="463" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">5. Organisational rules</text>
  <text x="390" y="490" text-anchor="middle" font-size="14.5" fill="#111111">No unopened source in a deliverable; disclosure; incident learning</text>
  <line x1="775" y1="76" x2="775" y2="510" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="868" y="96" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#111111">First line</text>
  <text x="868" y="472" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#111111">Last line</text>
  <text x="480" y="562" text-anchor="middle" font-size="13.5" font-style="italic" fill="#333333">No single layer is sufficient; layer 3 is the one that cannot be skipped.</text>
</svg>
