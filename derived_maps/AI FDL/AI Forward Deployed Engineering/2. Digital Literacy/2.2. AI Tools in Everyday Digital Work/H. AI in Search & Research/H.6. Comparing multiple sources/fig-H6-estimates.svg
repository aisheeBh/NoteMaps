<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 402" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Four estimates of one market and what each measures</title>
  <desc>Horizontal bars, illustrative figures. Trade association survey, software licences to employers of 50 or more: 180 million pounds. Analyst model, all wellness technology including devices and services: 420 million pounds. News article quoting the analyst: 420 million pounds. AI answer blending both: about 300 million pounds, matching no definition.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Four estimates of one market and what each measures</text>
  <text x="446" y="97" text-anchor="end" font-size="15" fill="#111111">A. Trade association: software licences, employers</text>
  <text x="446" y="116" text-anchor="end" font-size="15" fill="#111111">of 50+</text>
  <rect x="460" y="88" width="129" height="32" rx="2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="599" y="110" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">£180m</text>
  <text x="446" y="155" text-anchor="end" font-size="15" fill="#111111">B. Analyst model: all wellness technology incl.</text>
  <text x="446" y="174" text-anchor="end" font-size="15" fill="#111111">devices and services</text>
  <rect x="460" y="146" width="300" height="32" rx="2" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <text x="770" y="168" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">£420m</text>
  <text x="446" y="222" text-anchor="end" font-size="15" fill="#111111">C. News article: quotes B, definition not stated</text>
  <rect x="460" y="204" width="300" height="32" rx="2" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="770" y="226" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">£420m (copy of B)</text>
  <text x="446" y="280" text-anchor="end" font-size="15" fill="#111111">D. AI answer: blends A and B</text>
  <rect x="460" y="262" width="214" height="32" rx="2" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="684" y="284" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">"about £300m": no definition</text>
  <line x1="460" y1="72" x2="460" y2="316" stroke="#222222" stroke-width="2"/>
  <text x="480" y="392" text-anchor="middle" font-size="13.5" font-style="italic" fill="#333333">Illustrative figures. Only A and B are independent, and they measure different markets.</text>
</svg>
