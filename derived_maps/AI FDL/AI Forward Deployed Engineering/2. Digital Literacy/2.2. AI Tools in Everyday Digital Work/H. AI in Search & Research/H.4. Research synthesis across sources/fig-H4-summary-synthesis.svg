<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 375" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>A stack of summaries and a synthesis</title>
  <desc>Two panels. Left, a stack of summaries organised by source: Report A says, Report B says, Report C says; no weighing; disagreements left implicit. Right, a synthesis organised by theme: where sources agree, where and why they differ, which evidence counts for more, confidence and gaps.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">A stack of summaries and a synthesis</text>
  <rect x="24" y="70" width="447" height="245" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="248" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#222222">Stack of summaries: by source</text>
  <line x1="38" y1="116" x2="457" y2="116" stroke="#555555" stroke-width="1.2"/>
  <text x="248" y="140" text-anchor="middle" font-size="14.5" fill="#222222">Report A says ...</text>
  <text x="248" y="171" text-anchor="middle" font-size="14.5" fill="#222222">Report B says ...</text>
  <text x="248" y="202" text-anchor="middle" font-size="14.5" fill="#222222">Report C says ...</text>
  <text x="248" y="233" text-anchor="middle" font-size="14.5" fill="#222222">Every source given equal space</text>
  <text x="248" y="264" text-anchor="middle" font-size="14.5" fill="#222222">Disagreements left for the reader to notice</text>
  <rect x="489" y="70" width="447" height="245" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="712" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Synthesis: by theme</text>
  <line x1="503" y1="116" x2="922" y2="116" stroke="#555555" stroke-width="1.2"/>
  <text x="712" y="140" text-anchor="middle" font-size="14.5" fill="#111111">On theme 1, sources agree that ...</text>
  <text x="712" y="171" text-anchor="middle" font-size="14.5" fill="#111111">On theme 2, estimates differ because of method and</text>
  <text x="712" y="190" text-anchor="middle" font-size="14.5" fill="#111111">definition</text>
  <text x="712" y="221" text-anchor="middle" font-size="14.5" fill="#111111">The strongest, most independent evidence shows ...</text>
  <text x="712" y="252" text-anchor="middle" font-size="14.5" fill="#111111">Confidence: moderate. Gap: no evidence on ...</text>
  <text x="480" y="365" text-anchor="middle" font-size="13.5" font-style="italic" fill="#333333">A synthesis says something about the evidence as a whole that no single source says.</text>
</svg>
