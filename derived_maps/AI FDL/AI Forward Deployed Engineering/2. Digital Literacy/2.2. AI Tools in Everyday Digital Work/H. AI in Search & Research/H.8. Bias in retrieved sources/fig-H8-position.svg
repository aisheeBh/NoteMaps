<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Attention falls steeply with rank</title>
  <desc>Schematic chart. Horizontal axis: position in the list from first to tenth. Vertical axis: share of attention and clicks. A solid curve falls steeply from the first position and flattens by the fifth. A dashed horizontal line marks the share each position would receive if attention followed quality alone and quality were equal.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Attention falls steeply with rank</text>
  <line x1="110" y1="430" x2="900" y2="430" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="110" y1="430" x2="110" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="495" y="470" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Position in the list</text>
  <text x="60" y="255" text-anchor="middle" font-size="16" font-weight="bold" transform="rotate(-90 60 255)" fill="#111111">Share of attention and clicks</text>
  <text x="110" y="452" text-anchor="start" font-size="14" fill="#111111">1st</text>
  <text x="880" y="452" text-anchor="end" font-size="14" fill="#111111">10th</text>
  <text x="100" y="426" text-anchor="end" font-size="14" fill="#111111">Low</text>
  <text x="100" y="90" text-anchor="end" font-size="14" fill="#111111">High</text>
  <path d="M110 80 L196 273 L281 333 L367 362 L452 378 L538 388 L623 396 L709 401 L794 405 L880 408" fill="none" stroke="#111111" stroke-width="3"/>
  <rect x="152" y="98" width="172" height="43" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="156" y="115" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">Typical attention by</text>
  <text x="156" y="134" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">position</text>
  <path d="M110 367 L880 367" fill="none" stroke="#111111" stroke-width="3" stroke-dasharray="10 6"/>
  <rect x="583" y="318" width="238" height="43" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="587" y="336" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">Equal attention, if rank did</text>
  <text x="587" y="355" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">not matter</text>
  <text x="480" y="530" text-anchor="middle" font-size="13.5" font-style="italic" fill="#333333">Schematic of the pattern reported in eye-tracking and click studies; not plotted from a single dataset.</text>
</svg>
