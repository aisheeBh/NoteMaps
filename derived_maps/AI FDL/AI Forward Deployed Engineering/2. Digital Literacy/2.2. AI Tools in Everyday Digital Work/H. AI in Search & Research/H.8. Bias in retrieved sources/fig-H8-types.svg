<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 351" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Seven types of bias in a retrieved set</title>
  <desc>Three columns. Before retrieval: coverage bias, publication bias, access limits. During retrieval: ranking and selection, commercial influence. From the people involved: framing and sycophancy, reader confirmation bias. Each item states its symptom.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Seven types of bias in a retrieved set</text>
  <rect x="24" y="70" width="292" height="221" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="170" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#222222">Before retrieval</text>
  <line x1="38" y1="116" x2="302" y2="116" stroke="#555555" stroke-width="1.2"/>
  <text x="170" y="140" text-anchor="middle" font-size="14.5" fill="#222222">Coverage: a few wealthy,</text>
  <text x="170" y="159" text-anchor="middle" font-size="14.5" fill="#222222">English-speaking countries</text>
  <text x="170" y="190" text-anchor="middle" font-size="14.5" fill="#222222">Publication: successes only</text>
  <text x="170" y="221" text-anchor="middle" font-size="14.5" fill="#222222">Access: paywalled and blocked</text>
  <text x="170" y="240" text-anchor="middle" font-size="14.5" fill="#222222">sources missing</text>
  <rect x="334" y="70" width="292" height="221" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="480" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">During retrieval</text>
  <line x1="348" y1="116" x2="612" y2="116" stroke="#555555" stroke-width="1.2"/>
  <text x="480" y="140" text-anchor="middle" font-size="14.5" fill="#111111">Ranking and selection: the same</text>
  <text x="480" y="159" text-anchor="middle" font-size="14.5" fill="#111111">few domains</text>
  <text x="480" y="190" text-anchor="middle" font-size="14.5" fill="#111111">Commercial: vendor material</text>
  <text x="480" y="209" text-anchor="middle" font-size="14.5" fill="#111111">presented as evidence</text>
  <rect x="644" y="70" width="292" height="221" rx="8" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="790" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">From the people involved</text>
  <line x1="658" y1="116" x2="922" y2="116" stroke="#555555" stroke-width="1.2"/>
  <text x="790" y="140" text-anchor="middle" font-size="14.5" fill="#111111">Framing and sycophancy: the answer</text>
  <text x="790" y="159" text-anchor="middle" font-size="14.5" fill="#111111">mirrors the question</text>
  <text x="790" y="190" text-anchor="middle" font-size="14.5" fill="#111111">Confirmation: the search stops at</text>
  <text x="790" y="209" text-anchor="middle" font-size="14.5" fill="#111111">agreement</text>
  <text x="480" y="341" text-anchor="middle" font-size="13.5" font-style="italic" fill="#333333">Symptoms in an AI answer; each has a countermeasure in varied framing, language, region or source type.</text>
</svg>
