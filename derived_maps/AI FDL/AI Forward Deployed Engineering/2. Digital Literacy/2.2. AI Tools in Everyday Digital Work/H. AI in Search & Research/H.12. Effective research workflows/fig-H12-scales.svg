<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 364" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Research workflows at three scales</title>
  <desc>Three columns. Fifteen-minute lookup: frame in a sentence; AI or direct search; open the primary source if relied on; note source and date. One-day brief: frame and orient; gather from official and specialist sources; read and build a matrix; verify decisive claims; draft, disclose and file the trail. Multi-week review: written protocol; systematic searching with checked AI screening; full trail and matrix; confidence ratings; second-person review.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Research workflows at three scales</text>
  <rect x="24" y="70" width="292" height="264" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="170" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Fifteen-minute lookup</text>
  <line x1="38" y1="116" x2="302" y2="116" stroke="#555555" stroke-width="1.2"/>
  <text x="170" y="140" text-anchor="middle" font-size="14.5" fill="#111111">Frame in one sentence</text>
  <text x="170" y="171" text-anchor="middle" font-size="14.5" fill="#111111">AI answer or direct search</text>
  <text x="170" y="202" text-anchor="middle" font-size="14.5" fill="#111111">Open the primary source if relied</text>
  <text x="170" y="221" text-anchor="middle" font-size="14.5" fill="#111111">on</text>
  <text x="170" y="252" text-anchor="middle" font-size="14.5" fill="#111111">Note source and date</text>
  <rect x="334" y="70" width="292" height="264" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="480" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">One-day brief</text>
  <line x1="348" y1="116" x2="612" y2="116" stroke="#555555" stroke-width="1.2"/>
  <text x="480" y="140" text-anchor="middle" font-size="14.5" fill="#111111">Frame and orient</text>
  <text x="480" y="171" text-anchor="middle" font-size="14.5" fill="#111111">Gather from official and</text>
  <text x="480" y="190" text-anchor="middle" font-size="14.5" fill="#111111">specialist sources</text>
  <text x="480" y="221" text-anchor="middle" font-size="14.5" fill="#111111">Read key sources; build a matrix</text>
  <text x="480" y="252" text-anchor="middle" font-size="14.5" fill="#111111">Verify decisive claims</text>
  <text x="480" y="283" text-anchor="middle" font-size="14.5" fill="#111111">Draft, disclose, file the trail</text>
  <rect x="644" y="70" width="292" height="264" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="790" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Multi-week review</text>
  <line x1="658" y1="116" x2="922" y2="116" stroke="#555555" stroke-width="1.2"/>
  <text x="790" y="140" text-anchor="middle" font-size="14.5" fill="#111111">Written protocol in advance</text>
  <text x="790" y="171" text-anchor="middle" font-size="14.5" fill="#111111">Systematic searching; AI screening</text>
  <text x="790" y="190" text-anchor="middle" font-size="14.5" fill="#111111">checked on samples</text>
  <text x="790" y="221" text-anchor="middle" font-size="14.5" fill="#111111">Full trail and synthesis matrix</text>
  <text x="790" y="252" text-anchor="middle" font-size="14.5" fill="#111111">Confidence ratings</text>
  <text x="790" y="283" text-anchor="middle" font-size="14.5" fill="#111111">Second-person review</text>
</svg>
