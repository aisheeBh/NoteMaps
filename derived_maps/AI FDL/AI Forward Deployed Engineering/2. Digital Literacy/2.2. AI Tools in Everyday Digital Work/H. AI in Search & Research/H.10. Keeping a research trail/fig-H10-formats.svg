<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 351" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Formats for a research trail</title>
  <desc>Three columns. Chronology: the research log and saved AI outputs record what was done and produced, session by session. Sources: reference managers, archived copies and annotated bibliographies record what was consulted and why. Reasoning: decision logs and synthesis matrices record how sources were weighed and choices made.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Formats for a research trail</text>
  <rect x="24" y="70" width="292" height="221" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="170" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Chronology</text>
  <line x1="38" y1="116" x2="302" y2="116" stroke="#555555" stroke-width="1.2"/>
  <text x="170" y="140" text-anchor="middle" font-size="14.5" fill="#111111">Research log: actions and findings</text>
  <text x="170" y="159" text-anchor="middle" font-size="14.5" fill="#111111">by session</text>
  <text x="170" y="190" text-anchor="middle" font-size="14.5" fill="#111111">Saved AI outputs: non-repeatable</text>
  <text x="170" y="209" text-anchor="middle" font-size="14.5" fill="#111111">answers kept in full</text>
  <rect x="334" y="70" width="292" height="221" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="480" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Sources</text>
  <line x1="348" y1="116" x2="612" y2="116" stroke="#555555" stroke-width="1.2"/>
  <text x="480" y="140" text-anchor="middle" font-size="14.5" fill="#111111">Reference manager: references and</text>
  <text x="480" y="159" text-anchor="middle" font-size="14.5" fill="#111111">files</text>
  <text x="480" y="190" text-anchor="middle" font-size="14.5" fill="#111111">Archived copies of web pages</text>
  <text x="480" y="221" text-anchor="middle" font-size="14.5" fill="#111111">Annotated bibliography: why each</text>
  <text x="480" y="240" text-anchor="middle" font-size="14.5" fill="#111111">source matters</text>
  <rect x="644" y="70" width="292" height="221" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="790" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Reasoning</text>
  <line x1="658" y1="116" x2="922" y2="116" stroke="#555555" stroke-width="1.2"/>
  <text x="790" y="140" text-anchor="middle" font-size="14.5" fill="#111111">Decision log: what, who, when, why</text>
  <text x="790" y="171" text-anchor="middle" font-size="14.5" fill="#111111">Synthesis matrix: sources against</text>
  <text x="790" y="190" text-anchor="middle" font-size="14.5" fill="#111111">themes</text>
  <text x="480" y="341" text-anchor="middle" font-size="13.5" font-style="italic" fill="#333333">Most projects need one format from each column.</text>
</svg>
