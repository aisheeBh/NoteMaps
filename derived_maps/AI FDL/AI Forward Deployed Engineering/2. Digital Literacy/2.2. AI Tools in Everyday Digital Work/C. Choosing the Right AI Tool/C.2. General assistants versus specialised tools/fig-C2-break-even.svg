<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Break-even hours for specialist premiums</title>
  <desc>Horizontal bars: a premium of 30 pounds per user per month needs 0.5 hours saved; 60 pounds needs 1 hour; 120 pounds needs 2 hours; 240 pounds needs 4 hours; assuming time valued at 60 pounds an hour.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Hours to be saved each month before a premium pays for itself</text>
  <text x="228.0" y="115.0" text-anchor="end" font-size="15" fill="#111111">£30 premium</text>
  <rect x="240.0" y="90.0" width="65.0" height="40.0" rx="3" fill="#F2F2F2" stroke="#555555" stroke-width="1.5"/>
  <text x="315.0" y="115.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">0.5 h per user per month</text>
  <text x="228.0" y="181.0" text-anchor="end" font-size="15" fill="#111111">£60 premium</text>
  <rect x="240.0" y="156.0" width="130.0" height="40.0" rx="3" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="380.0" y="181.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">1 h per user per month</text>
  <text x="228.0" y="247.0" text-anchor="end" font-size="15" fill="#111111">£120 premium</text>
  <rect x="240.0" y="222.0" width="260.0" height="40.0" rx="3" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="510.0" y="247.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">2 h per user per month</text>
  <text x="228.0" y="313.0" text-anchor="end" font-size="15" fill="#111111">£240 premium</text>
  <rect x="240.0" y="288.0" width="520.0" height="40.0" rx="3" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="770.0" y="313.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">4 h per user per month</text>
  <text x="480.0" y="372.0" text-anchor="middle" font-size="15" fill="#111111">Time valued at £60 an hour; gains counted against a configured general assistant.</text>
  <text x="480.0" y="400.0" text-anchor="middle" font-size="13.5" font-style="italic" fill="#333333">Illustrative figures.</text>
</svg>
