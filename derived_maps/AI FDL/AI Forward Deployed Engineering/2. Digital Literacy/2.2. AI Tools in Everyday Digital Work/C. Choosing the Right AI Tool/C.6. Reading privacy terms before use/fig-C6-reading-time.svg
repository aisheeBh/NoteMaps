<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Time needed versus time spent reading</title>
  <desc>Paired horizontal bars. Privacy policy: about 30 minutes needed to read, about 73 seconds actually spent. Terms of service: about 16 minutes needed, about 51 seconds spent.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Reading the terms takes minutes; people give them seconds</text>
  <text x="60.0" y="100.0" text-anchor="start" font-size="18" font-weight="bold" fill="#111111">Privacy policy</text>
  <text x="230.0" y="140.0" text-anchor="end" font-size="15" fill="#111111">Time needed</text>
  <rect x="240.0" y="118.0" width="510.0" height="34.0" rx="3" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="760.0" y="141.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">about 30 minutes</text>
  <text x="230.0" y="192.0" text-anchor="end" font-size="15" fill="#111111">Time spent</text>
  <rect x="240.0" y="170.0" width="20.7" height="34.0" rx="3" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="270.7" y="193.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">about 73 seconds</text>
  <text x="60.0" y="250.0" text-anchor="start" font-size="18" font-weight="bold" fill="#111111">Terms of service</text>
  <text x="230.0" y="290.0" text-anchor="end" font-size="15" fill="#111111">Time needed</text>
  <rect x="240.0" y="268.0" width="272.0" height="34.0" rx="3" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="522.0" y="291.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">about 16 minutes</text>
  <text x="230.0" y="342.0" text-anchor="end" font-size="15" fill="#111111">Time spent</text>
  <rect x="240.0" y="320.0" width="14.4" height="34.0" rx="3" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="264.4" y="343.0" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">about 51 seconds</text>
  <text x="480.0" y="440.0" text-anchor="middle" font-size="13.5" font-style="italic" fill="#333333">Obar and Oeldorf-Hirsch (2020): 543 students joining a fictitious social network; times are averages.</text>
</svg>
