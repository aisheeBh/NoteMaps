<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Expected, perceived and measured effect</title>
  <desc>Diverging bar chart about a zero line. Developers' forecast before the study: 24 percent faster. Developers' estimate afterwards: 20 percent faster. Measured result: 19 percent slower.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Feeling faster is not the same as being faster</text>
  <text x="490.0" y="100.0" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">Forecast before the study</text>
  <rect x="480.0" y="110.0" width="288.0" height="46.0" rx="3" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="780.0" y="139.0" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">24% faster</text>
  <text x="490.0" y="200.0" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">Belief after the study</text>
  <rect x="480.0" y="210.0" width="240.0" height="46.0" rx="3" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="732.0" y="239.0" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">20% faster</text>
  <text x="470.0" y="300.0" text-anchor="end" font-size="16" font-weight="bold" fill="#111111">Measured result</text>
  <rect x="252.0" y="310.0" width="228.0" height="46.0" rx="3" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="240.0" y="339.0" text-anchor="end" font-size="16" font-weight="bold" fill="#111111">19% slower</text>
  <line x1="480.0" y1="80.0" x2="480.0" y2="400.0" stroke="#222222" stroke-width="2.5"/>
  <text x="460.0" y="425.0" text-anchor="end" font-size="15" fill="#111111">Slower with AI</text>
  <text x="500.0" y="425.0" text-anchor="start" font-size="15" fill="#111111">Faster with AI</text>
  <text x="480.0" y="455.0" text-anchor="middle" font-size="13.5" font-style="italic" fill="#333333">METR (2025): 16 experienced developers, 246 tasks in their own repositories, early-2025 tools.</text>
</svg>
