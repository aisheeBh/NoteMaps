<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Example tool card</title>
  <desc>A card for a specialist transcription tool with labelled fields: role specialist; jobs transcribing recorded interviews and internal meetings; not for disciplinary, medical or client calls without consent; approved data internal, confidential with consent, organisation account only; known failure modes misattributes overlapping speakers, mangles product names; checks review speaker labels and names before sharing; settings training off, 90-day retention; cost business seat paid by team budget; exit export transcripts as text, fallback suite meeting assistant; last checked September 2026.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">A tool card: one page per tool</text>
  <rect x="60.0" y="60.0" width="840.0" height="560.0" rx="10" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <rect x="60.0" y="60.0" width="840.0" height="56.0" rx="10" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="480.0" y="96.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">Transcription tool  —  Role: Specialist</text>
  <rect x="80.0" y="128.0" width="190.0" height="40.0" rx="4" fill="#F2F2F2" stroke="#555555" stroke-width="1.5"/>
  <text x="175.0" y="154.0" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#111111">Jobs</text>
  <text x="290.0" y="154.0" text-anchor="start" font-size="15" fill="#111111">Transcribing recorded interviews and routine internal meetings</text>
  <rect x="80.0" y="180.0" width="190.0" height="40.0" rx="4" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="88.0" y="188.0" width="174.0" height="24.0" rx="3" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="175.0" y="206.0" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#111111">Not for</text>
  <text x="290.0" y="206.0" text-anchor="start" font-size="15" fill="#111111">Disciplinary, medical or client calls without recorded consent</text>
  <rect x="80.0" y="232.0" width="190.0" height="40.0" rx="4" fill="#F2F2F2" stroke="#555555" stroke-width="1.5"/>
  <text x="175.0" y="258.0" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#111111">Approved data</text>
  <text x="290.0" y="258.0" text-anchor="start" font-size="15" fill="#111111">Internal; confidential only with consent; organisation account only</text>
  <rect x="80.0" y="284.0" width="190.0" height="40.0" rx="4" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="88.0" y="292.0" width="174.0" height="24.0" rx="3" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="175.0" y="310.0" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#111111">Failure modes</text>
  <text x="290.0" y="310.0" text-anchor="start" font-size="15" fill="#111111">Misattributes overlapping speakers; mangles product and place names</text>
  <rect x="80.0" y="336.0" width="190.0" height="40.0" rx="4" fill="#F2F2F2" stroke="#555555" stroke-width="1.5"/>
  <text x="175.0" y="362.0" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#111111">Checks</text>
  <text x="290.0" y="362.0" text-anchor="start" font-size="15" fill="#111111">Review speaker labels, names and numbers before sharing</text>
  <rect x="80.0" y="388.0" width="190.0" height="40.0" rx="4" fill="#F2F2F2" stroke="#555555" stroke-width="1.5"/>
  <text x="175.0" y="414.0" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#111111">Settings</text>
  <text x="290.0" y="414.0" text-anchor="start" font-size="15" fill="#111111">Training off; 90-day retention; no connectors</text>
  <rect x="80.0" y="440.0" width="190.0" height="40.0" rx="4" fill="#F2F2F2" stroke="#555555" stroke-width="1.5"/>
  <text x="175.0" y="466.0" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#111111">Cost</text>
  <text x="290.0" y="466.0" text-anchor="start" font-size="15" fill="#111111">Business seat, paid from the team budget</text>
  <rect x="80.0" y="492.0" width="190.0" height="40.0" rx="4" fill="#F2F2F2" stroke="#555555" stroke-width="1.5"/>
  <text x="175.0" y="518.0" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#111111">Exit</text>
  <text x="290.0" y="518.0" text-anchor="start" font-size="15" fill="#111111">Export transcripts as text; fallback is the suite meeting assistant</text>
  <rect x="80.0" y="544.0" width="190.0" height="40.0" rx="4" fill="#F2F2F2" stroke="#555555" stroke-width="1.5"/>
  <text x="175.0" y="570.0" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#111111">Last checked</text>
  <text x="290.0" y="570.0" text-anchor="start" font-size="15" fill="#111111">September 2026, against current terms and behaviour</text>
  <text x="480.0" y="634.0" text-anchor="middle" font-size="13.5" font-style="italic" fill="#333333">Illustrative tool card.</text>
</svg>
