  <title>Run-to-run variation</title>
  <desc>Dot plot of quality scores from 1 to 4 for 60 outputs each from Assistant A and Assistant B. Assistant A's scores cluster between about 2.6 and 4 with mean 3.3. Assistant B's cluster slightly higher, mean 3.4, but with a longer tail of low scores down to about 1.9, including three critical errors marked with crosses.</desc>
