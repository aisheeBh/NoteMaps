  <text x="130.0" y="370.6" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">Older knowledge test</text>
  <text x="340.0" y="409.7" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Harder reasoning test</text>
  <text x="583.2" y="426.6" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Frontier test</text>
  <text x="880.0" y="90.0" text-anchor="end" font-size="14" font-style="italic" fill="#111111">Saturation: scores no longer separate leading models</text>
  <text x="480.0" y="525.0" text-anchor="middle" font-size="13.5" font-style="italic" fill="#333333">Schematic; not plotted from a single dataset.</text>
</svg>
