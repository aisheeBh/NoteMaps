<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Time to do a task oneself compared with time to delegate it to an AI tool</title>
  <desc>Three tasks. For each, one bar shows minutes to do the task unaided and one stacked bar shows minutes to delegate it: specifying, generating, checking and correcting. Delegation saves time on a routine follow-up email, saves less on a long tender summary, and costs more on a novel question outside the tool's reliable capability. Illustrative figures.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
  </defs>

  <text x="480" y="40" font-size="22" font-weight="bold" fill="#111111" text-anchor="middle">Where the minutes go when work is delegated</text>

  <!-- Legend: each item has pattern + label -->
  <g font-size="14" fill="#111111">
    <rect x="40" y="62" width="26" height="18" fill="#1F3B5C" stroke="#000000"/>
    <text x="72" y="76">Do it oneself</text>
    <rect x="190" y="62" width="26" height="18" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
    <text x="222" y="76">Specify</text>
    <rect x="300" y="62" width="26" height="18" fill="#E6E6E6" stroke="#666666"/>
    <text x="332" y="76">Generate</text>
    <rect x="420" y="62" width="26" height="18" fill="url(#hatch)" stroke="#1F3B5C"/>
    <text x="452" y="76">Check</text>
    <rect x="520" y="62" width="26" height="18" fill="url(#lines)" stroke="#8B0000"/>
    <text x="552" y="76">Correct</text>
  </g>

  <!-- scale: 6 px per minute, origin x=230 -->
  <g stroke="#BBBBBB" stroke-width="1">
    <line x1="230" y1="100" x2="230" y2="500"/>
    <line x1="410" y1="100" x2="410" y2="500" stroke-dasharray="2 4"/>
    <line x1="590" y1="100" x2="590" y2="500" stroke-dasharray="2 4"/>
    <line x1="770" y1="100" x2="770" y2="500" stroke-dasharray="2 4"/>
  </g>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="230" y="520">0</text>
    <text x="410" y="520">30</text>
    <text x="590" y="520">60</text>
    <text x="770" y="520">90 minutes</text>
  </g>

  <!-- Task A -->
  <text x="40" y="128" font-size="16" font-weight="bold" fill="#111111">A. Routine</text>
  <text x="40" y="148" font-size="14" fill="#111111">follow-up email</text>
  <rect x="230" y="112" width="120" height="26" fill="#1F3B5C" stroke="#000000"/>
  <text x="358" y="131" font-size="14" fill="#111111">20</text>
  <rect x="230" y="144" width="18" height="26" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <rect x="248" y="144" width="6" height="26" fill="#E6E6E6" stroke="#666666"/>
  <rect x="254" y="144" width="24" height="26" fill="url(#hatch)" stroke="#1F3B5C"/>
  <rect x="278" y="144" width="12" height="26" fill="url(#lines)" stroke="#8B0000"/>
  <text x="298" y="163" font-size="14" fill="#111111">10 — saves half</text>

  <!-- Task B -->
  <text x="40" y="258" font-size="16" font-weight="bold" fill="#111111">B. Summary of a</text>
  <text x="40" y="278" font-size="14" fill="#111111">60-page tender</text>
  <rect x="230" y="242" width="540" height="26" fill="#1F3B5C" stroke="#000000"/>
  <text x="778" y="261" font-size="14" fill="#111111">90</text>
  <rect x="230" y="274" width="30" height="26" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <rect x="260" y="274" width="12" height="26" fill="#E6E6E6" stroke="#666666"/>
  <rect x="272" y="274" width="210" height="26" fill="url(#hatch)" stroke="#1F3B5C"/>
  <rect x="482" y="274" width="60" height="26" fill="url(#lines)" stroke="#8B0000"/>
  <rect x="550" y="276" width="200" height="22" fill="#FFFFFF"/>
  <text x="552" y="293" font-size="14" fill="#111111">52 — checking dominates</text>

  <!-- Task C -->
  <text x="40" y="388" font-size="16" font-weight="bold" fill="#111111">C. Novel question</text>
  <text x="40" y="408" font-size="14" fill="#111111">outside the frontier</text>
  <rect x="230" y="372" width="360" height="26" fill="#1F3B5C" stroke="#000000"/>
  <text x="598" y="391" font-size="14" fill="#111111">60</text>
  <rect x="230" y="404" width="48" height="26" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <rect x="278" y="404" width="12" height="26" fill="#E6E6E6" stroke="#666666"/>
  <rect x="290" y="404" width="240" height="26" fill="url(#hatch)" stroke="#1F3B5C"/>
  <rect x="530" y="404" width="180" height="26" fill="url(#lines)" stroke="#8B0000"/>
  <rect x="716" y="406" width="230" height="22" fill="#FFFFFF"/>
  <text x="718" y="423" font-size="14" fill="#111111">80 — costs more</text>
  <text x="230" y="458" font-size="14" fill="#111111">plus the risk that an error survives checking</text>

  <text x="480" y="560" font-size="13" fill="#333333" text-anchor="middle">Illustrative figures for one practitioner; not measured data. Upper bar of each pair: unaided; lower bar: delegated.</text>
</svg>
