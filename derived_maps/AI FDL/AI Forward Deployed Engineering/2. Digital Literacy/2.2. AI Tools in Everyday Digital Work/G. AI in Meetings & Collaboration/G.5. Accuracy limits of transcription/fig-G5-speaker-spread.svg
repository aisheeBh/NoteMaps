<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Word error rate by speaker in one meeting</title>
<desc>Bar chart of illustrative word error rates for five speakers with a dashed line for the meeting average.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480" y="44" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">Word error rate by speaker in one meeting</text>
<line x1="300.0" y1="109" x2="300.0" y2="460" stroke="#999999" stroke-width="1" stroke-dasharray="2 4"/>
<text x="300.0" y="482" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">0%</text>
<line x1="416.0" y1="109" x2="416.0" y2="460" stroke="#999999" stroke-width="1" stroke-dasharray="2 4"/>
<text x="416.0" y="482" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">5%</text>
<line x1="532.0" y1="109" x2="532.0" y2="460" stroke="#999999" stroke-width="1" stroke-dasharray="2 4"/>
<text x="532.0" y="482" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">10%</text>
<line x1="648.0" y1="109" x2="648.0" y2="460" stroke="#999999" stroke-width="1" stroke-dasharray="2 4"/>
<text x="648.0" y="482" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">15%</text>
<line x1="764.0" y1="109" x2="764.0" y2="460" stroke="#999999" stroke-width="1" stroke-dasharray="2 4"/>
<text x="764.0" y="482" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">20%</text>
<line x1="880.0" y1="109" x2="880.0" y2="460" stroke="#999999" stroke-width="1" stroke-dasharray="2 4"/>
<text x="880.0" y="482" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">25%</text>
<line x1="300" y1="109" x2="300" y2="460" stroke="#222222" stroke-width="2"/>
<text x="288" y="146.5" font-size="15" text-anchor="end" font-weight="bold" fill="#111111">Speaker A</text>
<text x="288" y="165.5" font-size="14" text-anchor="end" font-weight="normal" fill="#111111">headset</text>
<rect x="300" y="129.5" width="92.8" height="40" rx="2" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
<text x="400.8" y="154.5" font-size="15" text-anchor="start" font-weight="bold" fill="#111111">4%</text>
<text x="288" y="215.5" font-size="15" text-anchor="end" font-weight="bold" fill="#111111">Speaker B</text>
<text x="288" y="234.5" font-size="14" text-anchor="end" font-weight="normal" fill="#111111">headset</text>
<rect x="300" y="198.5" width="116.0" height="40" rx="2" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
<text x="424.0" y="223.5" font-size="15" text-anchor="start" font-weight="bold" fill="#111111">5%</text>
<text x="288" y="284.5" font-size="15" text-anchor="end" font-weight="bold" fill="#111111">Speaker C</text>
<text x="288" y="303.5" font-size="14" text-anchor="end" font-weight="normal" fill="#111111">laptop microphone</text>
<rect x="300" y="267.5" width="162.4" height="40" rx="2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
<text x="493.6" y="292.5" font-size="15" text-anchor="start" font-weight="bold" fill="#111111">7%</text>
<text x="288" y="353.5" font-size="15" text-anchor="end" font-weight="bold" fill="#111111">Speaker D</text>
<text x="288" y="372.5" font-size="14" text-anchor="end" font-weight="normal" fill="#111111">second-language, in room</text>
<rect x="300" y="336.5" width="324.8" height="40" rx="2" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<text x="632.8" y="361.5" font-size="15" text-anchor="start" font-weight="bold" fill="#111111">14%</text>
<text x="288" y="422.5" font-size="15" text-anchor="end" font-weight="bold" fill="#111111">Speaker E</text>
<text x="288" y="441.5" font-size="14" text-anchor="end" font-weight="normal" fill="#111111">speakerphone</text>
<rect x="300" y="405.5" width="510.4" height="40" rx="2" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
<text x="818.4" y="430.5" font-size="15" text-anchor="start" font-weight="bold" fill="#111111">22%</text>
<line x1="485.6" y1="95" x2="485.6" y2="460" stroke="#111111" stroke-width="3" stroke-dasharray="10 6"/>
<rect x="491.6" y="77" width="190" height="24" fill="#FFFFFF"/>
<text x="495.6" y="95" font-size="15" text-anchor="start" font-weight="bold" fill="#111111">Meeting average about 8%</text>
<text x="40" y="520" font-size="13" text-anchor="start" font-weight="normal" fill="#333333" font-style="italic">Illustrative figures.</text>
</svg>