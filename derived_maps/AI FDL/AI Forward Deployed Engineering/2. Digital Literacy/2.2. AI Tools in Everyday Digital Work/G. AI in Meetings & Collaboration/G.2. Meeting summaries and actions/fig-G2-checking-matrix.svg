<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Depth of checking by stakes and complexity</title>
<desc>Two-by-two matrix: stakes of an error against complexity of the meeting, with the checking depth for each quadrant.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">How much to check an AI summary</text>
<rect x="176" y="86" width="348.0" height="188.0" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
<rect x="200" y="135.0" width="300.0" height="84" fill="#FFFFFF" rx="4"/>
<text x="350.0" y="155.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">Check every decision</text>
<text x="350.0" y="177.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">and action against</text>
<text x="350.0" y="199.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">the transcript</text>
<rect x="536.0" y="86" width="348.0" height="188.0" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
<rect x="560.0" y="135.0" width="300.0" height="84" fill="#FFFFFF" rx="4"/>
<text x="710.0" y="155.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">Full check, key passages</text>
<text x="710.0" y="177.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">against the audio;</text>
<text x="710.0" y="199.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">consider a human record</text>
<rect x="176" y="286.0" width="348.0" height="188.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
<rect x="200" y="346.0" width="300.0" height="62" fill="#FFFFFF" rx="4"/>
<text x="350.0" y="366.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">Skim and correct</text>
<text x="350.0" y="388.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">anything obviously wrong</text>
<rect x="536.0" y="286.0" width="348.0" height="188.0" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<rect x="560.0" y="335.0" width="300.0" height="84" fill="#FFFFFF" rx="4"/>
<text x="710.0" y="355.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">Spot-check decisions</text>
<text x="710.0" y="377.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">and actions using</text>
<text x="710.0" y="399.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111">timestamps</text>
<line x1="170" y1="500" x2="890" y2="500" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="530.0" y="532" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">Complexity of the meeting</text>
<text x="350.0" y="556" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">Simple: few topics, explicit outcomes</text>
<text x="710.0" y="556" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">Complex: long, contested, scattered</text>
<line x1="150" y1="480" x2="150" y2="80" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="40" y="280.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111" transform="rotate(-90 40 280.0)">Harm if the summary is wrong</text>
<text x="140" y="185.0" font-size="14" text-anchor="end" font-weight="normal" fill="#111111">High</text>
<text x="140" y="385.0" font-size="14" text-anchor="end" font-weight="normal" fill="#111111">Low</text>
</svg>