<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Workspace structure</title>
<desc>Left: one mixed workspace containing four clients' files, guests and leavers, with instructions naming confidential facts. Right: separate spaces per client and sensitivity, each with a named owner, guests in their own space and current members only.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">A single mixed workspace compared with separated spaces</text>
<rect x="40" y="80" width="400" height="52" rx="8" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<rect x="143.175" y="90.95" width="193.65" height="30.1" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="240.0" y="111.95" font-size="17" text-anchor="middle" font-weight="bold" fill="#111111">One mixed workspace</text>
<rect x="520" y="80" width="400" height="52" rx="8" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
<rect x="637.2" y="90.95" width="165.60000000000002" height="30.1" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="720.0" y="111.95" font-size="17" text-anchor="middle" font-weight="bold" fill="#111111">Separated spaces</text>
<rect x="40" y="144" width="400" height="330" rx="8" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<rect x="56" y="160" width="368" height="298" rx="6" fill="#FFFFFF"/>
<text x="76" y="196" font-size="15" text-anchor="start" font-weight="normal" fill="#111111">- Files from four clients together</text>
<text x="76" y="232" font-size="15" text-anchor="start" font-weight="normal" fill="#111111">- Guests from a partner firm</text>
<text x="76" y="268" font-size="15" text-anchor="start" font-weight="normal" fill="#111111">- Members who left the team</text>
<text x="76" y="304" font-size="15" text-anchor="start" font-weight="normal" fill="#111111">- Instructions naming client plans</text>
<text x="76" y="340" font-size="15" text-anchor="start" font-weight="normal" fill="#111111">- Share links to the whole firm</text>
<text x="76" y="376" font-size="15" text-anchor="start" font-weight="normal" fill="#111111">- No named owner</text>
<rect x="530" y="150" width="184" height="140" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
<text x="622.0" y="206.70000000000002" font-size="14" text-anchor="middle" font-weight="bold" fill="#000000">Client A —</text>
<text x="622.0" y="224.9" font-size="14" text-anchor="middle" font-weight="bold" fill="#000000">Confidential</text>
<text x="622.0" y="243.10000000000002" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">owner: R. Shah</text>
<rect x="726" y="150" width="184" height="140" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
<text x="818.0" y="206.70000000000002" font-size="14" text-anchor="middle" font-weight="bold" fill="#000000">Client B —</text>
<text x="818.0" y="224.9" font-size="14" text-anchor="middle" font-weight="bold" fill="#000000">Confidential</text>
<text x="818.0" y="243.10000000000002" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">owner: L. Moreau</text>
<rect x="530" y="310" width="184" height="140" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<text x="622.0" y="366.7" font-size="14" text-anchor="middle" font-weight="bold" fill="#000000">Client A — Partner</text>
<text x="622.0" y="384.9" font-size="14" text-anchor="middle" font-weight="bold" fill="#000000">guests</text>
<text x="622.0" y="403.09999999999997" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">expires end of bid</text>
<rect x="726" y="310" width="184" height="140" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
<text x="818.0" y="375.79999999999995" font-size="14" text-anchor="middle" font-weight="bold" fill="#000000">Public research</text>
<text x="818.0" y="393.99999999999994" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">owner: team lead</text>
<text x="480.0" y="520" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">Illustrative names.</text>
</svg>
