<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Layers of obligation</title>
<desc>Nested rectangles from outside in: law; professional code; client contract; employer policy; personal judgement. Each inner layer can add restrictions but cannot remove those of an outer layer.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">Nested layers that bound a confidentiality decision</text>
<rect x="60.0" y="80" width="840.0" height="440" rx="10" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
<rect x="218.79999999999995" y="92" width="522.4000000000001" height="23.5" fill="#FFFFFF" stroke="none"/>
<text x="480" y="108.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Law: confidence, trade secrets, market abuse, data protection</text>
<rect x="133.60000000000002" y="126" width="692.8" height="348" rx="10" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
<rect x="403.6" y="138" width="152.8" height="23.5" fill="#FFFFFF" stroke="none"/>
<text x="480" y="154.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Professional code</text>
<rect x="207.20000000000002" y="172" width="545.5999999999999" height="256" rx="10" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<rect x="315.4" y="184" width="329.20000000000005" height="23.5" fill="#FFFFFF" stroke="none"/>
<text x="480" y="200.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Client contract: NDA, engagement terms</text>
<rect x="280.8" y="218" width="398.4" height="164" rx="10" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
<rect x="286.0" y="230" width="388.00000000000006" height="23.5" fill="#FFFFFF" stroke="none"/>
<text x="480" y="246.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">Employer policy: approved tools, data classes</text>
<rect x="354.40000000000003" y="264" width="251.19999999999993" height="72" rx="10" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<text x="480" y="306.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#FFFFFF">Personal judgement</text>
<text x="480" y="545" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">Inner layers may add restrictions; none can relax an outer layer.</text>
</svg>
