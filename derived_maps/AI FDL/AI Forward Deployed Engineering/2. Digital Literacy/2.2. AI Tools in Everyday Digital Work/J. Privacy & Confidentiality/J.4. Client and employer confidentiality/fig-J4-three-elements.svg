<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Three elements</title>
<desc>Three pillars supporting a roof labelled breach of confidence: quality of confidence (the client strategy is not public); obligation of confidence (shared under an NDA limiting recipients); unauthorised use or disclosure (pasted into an unapproved AI tool). All three present means a likely breach.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">Breach of confidence: the three elements applied</text>
<polygon points="60,150 480,86 900,150" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
<text x="480" y="138" font-size="18" text-anchor="middle" font-weight="bold" fill="#FFFFFF">Likely breach of confidence</text>
<rect x="80" y="160" width="240" height="60" rx="8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
<rect x="92.99999999999999" y="176.25" width="214.00000000000003" height="27.5" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="200.0" y="195.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">1. Quality of confidence</text>
<rect x="80" y="226" width="240" height="190" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="200.0" y="316.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">The strategy is not</text>
<text x="200.0" y="336.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">public and not trivial</text>
<rect x="360" y="160" width="240" height="60" rx="8" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<rect x="368.0" y="176.25" width="224" height="27.5" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="480.0" y="195.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">2. Obligation of confidence</text>
<rect x="360" y="226" width="240" height="190" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="480.0" y="316.5" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">Shared under an NDA</text>
<text x="480.0" y="336.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">limiting who may see it</text>
<rect x="640" y="160" width="240" height="60" rx="8" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<rect x="673.625" y="176.25" width="172.75" height="27.5" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="760.0" y="195.25" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">3. Unauthorised use</text>
<rect x="640" y="226" width="240" height="190" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="760.0" y="306.75" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">Pasted into a tool</text>
<text x="760.0" y="326.25" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">outside the permitted</text>
<text x="760.0" y="345.75" font-size="15" text-anchor="middle" font-weight="normal" fill="#000000">circle of recipients</text>
<rect x="60" y="424" width="840" height="24" fill="#E6E6E6" stroke="#333333" stroke-width="1.5"/>
<text x="480" y="441" font-size="14" text-anchor="middle" font-weight="bold" fill="#111111">Test from Coco v A N Clark (Engineers) Ltd, 1969</text>
<text x="480" y="490" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">Remove any one pillar and the claim fails; consent from the owner removes the third.</text>
</svg>
