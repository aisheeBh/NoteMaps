<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Before and after</title>
<desc>Two panels. Before: a prompt pasting an email from a named senior designer with a named diagnosis, a named colleague, a project name and a date. After: a prompt describing three concerns in neutral terms with no names, a generalised health issue and the same request for a calm reply.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">The same request, before and after removing the people</text>
<rect x="40" y="80" width="420" height="52" rx="8" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<rect x="212.3" y="90.3" width="75.4" height="31.400000000000002" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="250.0" y="112.3" font-size="18" text-anchor="middle" font-weight="bold" fill="#111111">Before</text>
<rect x="500" y="80" width="420" height="52" rx="8" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
<rect x="677.25" y="90.3" width="65.5" height="31.400000000000002" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="710.0" y="112.3" font-size="18" text-anchor="middle" font-weight="bold" fill="#111111">After</text>
<rect x="40" y="144" width="420" height="200" rx="8" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<rect x="56" y="160" width="388" height="168" rx="6" fill="#FFFFFF"/>
<text x="72" y="192" font-size="15" text-anchor="start" font-weight="normal" fill="#111111">Help me reply to this: [email from Meera</text>
<text x="72" y="214" font-size="15" text-anchor="start" font-weight="normal" fill="#111111">Iyer, Senior Designer, about her depression</text>
<text x="72" y="236" font-size="15" text-anchor="start" font-weight="normal" fill="#111111">diagnosis, her dispute with Daniel Okafor</text>
<text x="72" y="258" font-size="15" text-anchor="start" font-weight="normal" fill="#111111">over credit for the Halden rebrand, and her</text>
<text x="72" y="280" font-size="15" text-anchor="start" font-weight="normal" fill="#111111">flexible-working request of 3 February]</text>
<rect x="500" y="144" width="420" height="200" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
<text x="516" y="192" font-size="15" text-anchor="start" font-weight="normal" fill="#111111">An employee is upset about three things: a</text>
<text x="516" y="214" font-size="15" text-anchor="start" font-weight="normal" fill="#111111">colleague taking credit for her work, a health</text>
<text x="516" y="236" font-size="15" text-anchor="start" font-weight="normal" fill="#111111">issue she has mentioned, and a</text>
<text x="516" y="258" font-size="15" text-anchor="start" font-weight="normal" fill="#111111">flexible-working request she feels was</text>
<text x="516" y="280" font-size="15" text-anchor="start" font-weight="normal" fill="#111111">ignored. Draft a calm, supportive reply</text>
<text x="516" y="302" font-size="15" text-anchor="start" font-weight="normal" fill="#111111">proposing a private meeting.</text>
<text x="250" y="380" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">names, diagnosis, project, date</text>
<text x="710" y="380" font-size="15" text-anchor="middle" font-weight="bold" fill="#111111">no names; health generalised</text>
<text x="480" y="430" font-size="16" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">The answer is equally useful in both cases.</text>
<text x="480.0" y="465" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">Illustrative names and details.</text>
</svg>
