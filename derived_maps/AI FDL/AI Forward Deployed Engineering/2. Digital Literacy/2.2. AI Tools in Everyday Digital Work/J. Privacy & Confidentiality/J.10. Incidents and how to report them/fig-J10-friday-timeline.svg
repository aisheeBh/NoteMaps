<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Friday timeline</title>
<desc>A timeline from 17:00 to 18:40 with events: 17:02 configuration pasted; 17:12 password noticed; 17:14 facts noted; 17:16 security called; 17:20 password rotated; 17:25 chat deleted; 17:40 report submitted; 18:30 logs show no misuse. The exposure window ran about 18 minutes, from 17:02 to 17:20. Monday review changes the deployment tool.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">The Friday password: about 18 minutes of exposure</text>
<rect x="86.4" y="230" width="147.6" height="40" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
<rect x="96.39999999999998" y="207" width="127.60000000000001" height="22.2" fill="#FFFFFF" stroke="none"/>
<text x="160.2" y="222.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111111">exposure window</text>
<line x1="70" y1="250" x2="890" y2="250" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="70.0" y="300" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">17:00</text>
<text x="234.0" y="300" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">17:20</text>
<text x="398.0" y="300" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">17:40</text>
<text x="562.0" y="300" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">18:00</text>
<text x="726.0" y="300" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">18:20</text>
<text x="890.0" y="300" font-size="14" text-anchor="middle" font-weight="normal" fill="#111111">18:40</text>
<circle cx="86.4" cy="250" r="6" fill="#111111"/>
<line x1="86.4" y1="250" x2="86.4" y2="172" stroke="#333333" stroke-width="1.2" stroke-dasharray="2 4"/>
<rect x="57.88" y="145" width="57.040000000000006" height="22.2" fill="#FFFFFF" stroke="none"/>
<text x="86.4" y="160.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111111">Pasted</text>
<circle cx="168.39999999999998" cy="250" r="6" fill="#111111"/>
<line x1="168.39999999999998" y1="250" x2="168.39999999999998" y2="314" stroke="#333333" stroke-width="1.2" stroke-dasharray="2 4"/>
<rect x="135.95999999999998" y="315" width="64.88" height="22.2" fill="#FFFFFF" stroke="none"/>
<text x="168.39999999999998" y="330.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111111">Noticed</text>
<circle cx="201.2" cy="250" r="6" fill="#111111"/>
<line x1="201.2" y1="250" x2="201.2" y2="122" stroke="#333333" stroke-width="1.2" stroke-dasharray="2 4"/>
<rect x="137.39999999999998" y="95" width="127.60000000000001" height="22.2" fill="#FFFFFF" stroke="none"/>
<text x="201.2" y="110.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111111">Security called</text>
<circle cx="234.0" cy="250" r="6" fill="#111111"/>
<line x1="234.0" y1="250" x2="234.0" y2="364" stroke="#333333" stroke-width="1.2" stroke-dasharray="2 4"/>
<rect x="166.28" y="365" width="135.44" height="22.2" fill="#FFFFFF" stroke="none"/>
<text x="234.0" y="380.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111111">Password rotated</text>
<circle cx="275.0" cy="250" r="6" fill="#111111"/>
<line x1="275.0" y1="250" x2="275.0" y2="172" stroke="#333333" stroke-width="1.2" stroke-dasharray="2 4"/>
<rect x="222.95999999999998" y="145" width="104.08000000000001" height="22.2" fill="#FFFFFF" stroke="none"/>
<text x="275.0" y="160.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111111">Chat deleted</text>
<circle cx="398.0" cy="250" r="6" fill="#111111"/>
<line x1="398.0" y1="250" x2="398.0" y2="314" stroke="#333333" stroke-width="1.2" stroke-dasharray="2 4"/>
<rect x="349.88" y="315" width="96.24000000000001" height="22.2" fill="#FFFFFF" stroke="none"/>
<text x="398.0" y="330.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111111">Report sent</text>
<circle cx="808.0" cy="250" r="6" fill="#111111"/>
<line x1="808.0" y1="250" x2="808.0" y2="122" stroke="#333333" stroke-width="1.2" stroke-dasharray="2 4"/>
<rect x="736.36" y="95" width="143.28" height="22.2" fill="#FFFFFF" stroke="none"/>
<text x="808.0" y="110.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111111">No misuse in logs</text>
<rect x="640" y="420" width="260" height="60" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
<text x="770.0" y="445.79999999999995" font-size="14" text-anchor="middle" font-weight="bold" fill="#000000">Monday review</text>
<text x="770.0" y="463.99999999999994" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">deployment tool masks secrets</text>
<text x="480.0" y="505" font-size="13" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">Illustrative scenario and times.</text>
</svg>
