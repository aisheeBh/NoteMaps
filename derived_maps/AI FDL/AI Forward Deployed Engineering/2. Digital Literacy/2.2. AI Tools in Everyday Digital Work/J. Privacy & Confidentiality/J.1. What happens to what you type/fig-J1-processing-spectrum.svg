<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Processing spectrum</title>
<desc>A spectrum from left to right: on-device model, protected cloud processing, enterprise tenant, consumer cloud service, chained third-party services. Moving right adds parties and copies.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#111111">Where an AI request is processed</text>
<line x1="60" y1="120" x2="900" y2="120" stroke="#222222" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<rect x="55" y="84" width="236.8" height="23.5" fill="#FFFFFF" stroke="none"/>
<text x="60" y="100.0" font-size="15" text-anchor="start" font-weight="bold" fill="#111111">Fewer parties, fewer copies</text>
<rect x="685.0" y="84" width="220.00000000000003" height="23.5" fill="#FFFFFF" stroke="none"/>
<text x="900" y="100.0" font-size="15" text-anchor="end" font-weight="bold" fill="#111111">More parties, more copies</text>
<rect x="40" y="160" width="160" height="70" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
<text x="120.0" y="200.6" font-size="16" text-anchor="middle" font-weight="bold" fill="#000000">On-device</text>
<rect x="40" y="245" width="160" height="110" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="120.0" y="286.7" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">model runs on</text>
<text x="120.0" y="304.9" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">the laptop or</text>
<text x="120.0" y="323.09999999999997" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">phone itself</text>
<line x1="120" y1="128" x2="120" y2="158" stroke="#333333" stroke-width="2"/>
<rect x="220" y="160" width="160" height="70" rx="8" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
<rect x="228.0" y="180.6" width="144" height="28.8" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="300.0" y="200.6" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">Protected cloud</text>
<rect x="220" y="245" width="160" height="110" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="300.0" y="286.7" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">hardened servers,</text>
<text x="300.0" y="304.9" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">stateless, built</text>
<text x="300.0" y="323.09999999999997" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">to bar staff access</text>
<line x1="300" y1="128" x2="300" y2="158" stroke="#333333" stroke-width="2"/>
<rect x="400" y="160" width="160" height="70" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
<text x="480.0" y="200.6" font-size="16" text-anchor="middle" font-weight="bold" fill="#000000">Enterprise tenant</text>
<rect x="400" y="245" width="160" height="110" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="480.0" y="286.7" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">business contract,</text>
<text x="480.0" y="304.9" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">admin controls,</text>
<text x="480.0" y="323.09999999999997" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">regional storage</text>
<line x1="480" y1="128" x2="480" y2="158" stroke="#333333" stroke-width="2"/>
<rect x="580" y="160" width="160" height="70" rx="8" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
<rect x="590.4" y="180.6" width="139.20000000000002" height="28.8" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="660.0" y="200.6" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">Consumer cloud</text>
<rect x="580" y="245" width="160" height="110" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="660.0" y="286.7" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">public app under</text>
<text x="660.0" y="304.9" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">consumer terms,</text>
<text x="660.0" y="323.09999999999997" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">history kept</text>
<line x1="660" y1="128" x2="660" y2="158" stroke="#333333" stroke-width="2"/>
<rect x="760" y="160" width="160" height="70" rx="8" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<rect x="768.0" y="180.6" width="144" height="28.8" rx="4" fill="#FFFFFF" stroke="none"/>
<text x="840.0" y="200.6" font-size="16" text-anchor="middle" font-weight="bold" fill="#111111">Chained services</text>
<rect x="760" y="245" width="160" height="110" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="840.0" y="286.7" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">wrapper app, plug-ins</text>
<text x="840.0" y="304.9" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">and model provider,</text>
<text x="840.0" y="323.09999999999997" font-size="14" text-anchor="middle" font-weight="normal" fill="#000000">each with a copy</text>
<line x1="840" y1="128" x2="840" y2="158" stroke="#333333" stroke-width="2"/>
<text x="480" y="400" font-size="15" text-anchor="middle" font-weight="normal" fill="#111111" font-style="italic">Capability usually rises to the right; control and privacy usually rise to the left.</text>
</svg>
