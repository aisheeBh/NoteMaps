<line x1="874.4" y1="440" x2="874.4" y2="448" stroke="#222222" stroke-width="2"/>
<rect x="128.6" y="232.0" width="150" height="24" fill="#FFFFFF"/>
<text x="203.6" y="250.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Cartoon or icon</text>
<rect x="409.4" y="154.0" width="150" height="24" fill="#FFFFFF"/>
<text x="484.4" y="172.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Stylised character</text>
<rect x="596.6" y="362.0" width="150" height="24" fill="#FFFFFF"/>
<text x="671.6" y="380.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Almost real:</text>
<rect x="791.6" y="72.0" width="150" height="24" fill="#FFFFFF"/>
<text x="866.6" y="90.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Real person</text>
<rect x="596.6" y="388.0" width="150" height="22" fill="#FFFFFF"/>
<text x="671.6" y="400.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">small faults stand out</text>
<text x="480.0" y="506.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#333333" font-style="italic">Schematic after Masahiro Mori (1970); the shape is a hypothesis, with mixed experimental support.</text>
</svg>