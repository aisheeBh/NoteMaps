<text x="500.0" y="470.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">Human likeness of the image or voice</text>
<text x="50" y="280.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111" transform="rotate(-90 50 280.0)">Viewer comfort</text>
