<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>Process labels and harm labels</title>
<desc>Comparison of labels describing how content was made with labels warning that content is misleading.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<pattern id="grey" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#E6E6E6"/><circle cx="5" cy="5" r="1" fill="#666666"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40.0" font-size="22" font-weight="bold" text-anchor="middle" fill="#111111">Two different jobs for a label</text>
<text x="480.0" y="64.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#333333">Viewers interpret labels; the wording decides what they infer</text>
<rect x="24.0" y="90" width="293.3333333333333" height="282" rx="6" fill="#EAF2FA" stroke="#1F3B5C" stroke-width="2"/>
<rect x="26.0" y="92" width="289.3333333333333" height="10" fill="url(#hatch)"/>
<text x="170.7" y="124.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">Process label</text>
<text x="170.7" y="152.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">Says how it was made</text>
<text x="170.7" y="179.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">e.g. 'Created with AI',</text>
<text x="170.7" y="198.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">'AI-edited'</text>
<text x="170.7" y="225.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">Neutral about truth</text>
<text x="170.7" y="251.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">Risk: read as 'false' or 'fully</text>
<text x="170.7" y="271.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">automated'</text>
<rect x="333.3333333333333" y="90" width="293.3333333333333" height="282" rx="6" fill="#FCEDED" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
<rect x="335.8333333333333" y="92.5" width="288.3333333333333" height="10" fill="url(#lines)"/>
<text x="480.0" y="124.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">Harm label</text>
<text x="480.0" y="152.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">Says it may mislead</text>
<text x="480.0" y="179.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">e.g. 'Manipulated media',</text>
<text x="480.0" y="198.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">'Altered: not a real event'</text>
<text x="480.0" y="225.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">Warns the viewer</text>
<text x="480.0" y="251.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">Risk: missing labels read as</text>
<text x="480.0" y="271.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">'true'</text>
<rect x="642.6666666666666" y="90" width="293.3333333333333" height="282" rx="6" fill="#EEF7EE" stroke="#1E5E24" stroke-width="3"/>
<rect x="645.6666666666666" y="93" width="287.3333333333333" height="10" fill="url(#cross)"/>
<text x="789.3" y="124.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">Explained label</text>
<text x="789.3" y="152.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">Says what AI did</text>
<text x="789.3" y="179.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">e.g. 'Background generated with</text>
<text x="789.3" y="198.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">AI; product photographed'</text>
<text x="789.3" y="225.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">Specific and scoped</text>
<text x="789.3" y="251.5" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">Reduces both risks</text>
</svg>