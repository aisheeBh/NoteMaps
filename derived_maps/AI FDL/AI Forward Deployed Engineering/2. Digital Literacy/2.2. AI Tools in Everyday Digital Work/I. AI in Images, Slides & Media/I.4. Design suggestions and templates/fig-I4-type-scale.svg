<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="100%" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<title>A typographic scale for slides</title>
<desc>Four text levels shown at their sizes with their roles, demonstrating a ratio-based type scale.</desc>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/></pattern>
<pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/></pattern>
<pattern id="grey" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#E6E6E6"/><circle cx="5" cy="5" r="1" fill="#666666"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker>
</defs>
<text x="480.0" y="40.0" font-size="22" font-weight="bold" text-anchor="middle" fill="#111111">A simple type scale: few sizes, clearly different</text>
<text x="480.0" y="64.0" font-size="15" font-weight="normal" text-anchor="middle" fill="#333333">Each level about 1.33 times the one below (illustrative presenting sizes)</text>
<text x="40.0" y="149.6" font-size="39" font-weight="bold" text-anchor="start" fill="#111111">Slide title  44 pt</text>
<text x="920.0" y="145.6" font-size="15" font-weight="normal" text-anchor="end" fill="#333333">One per slide; the message</text>
<line x1="40" y1="161.6" x2="920" y2="161.6" stroke="#999999" stroke-width="1" stroke-dasharray="2 4"/>
<text x="40.0" y="218.4" font-size="28" font-weight="bold" text-anchor="start" fill="#111111">Section or key figure  32 pt</text>
<text x="920.0" y="214.4" font-size="15" font-weight="normal" text-anchor="end" fill="#333333">Large numbers, section headers</text>
<line x1="40" y1="230.4" x2="920" y2="230.4" stroke="#999999" stroke-width="1" stroke-dasharray="2 4"/>
<text x="40.0" y="280.0" font-size="21" font-weight="normal" text-anchor="start" fill="#111111">Body text  24 pt</text>
<text x="920.0" y="276.0" font-size="15" font-weight="normal" text-anchor="end" fill="#333333">Main supporting text</text>
<line x1="40" y1="292.0" x2="920" y2="292.0" stroke="#999999" stroke-width="1" stroke-dasharray="2 4"/>
<text x="40.0" y="336.2" font-size="16" font-weight="normal" text-anchor="start" fill="#111111">Labels and sources  18 pt</text>
<text x="920.0" y="332.2" font-size="15" font-weight="normal" text-anchor="end" fill="#333333">Chart labels, footnotes; the minimum for presenting</text>
<line x1="40" y1="348.2" x2="920" y2="348.2" stroke="#999999" stroke-width="1" stroke-dasharray="2 4"/>
<text x="480.0" y="456.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#333333" font-style="italic">Point sizes are illustrative for a large-room presentation; reading decks can use smaller sizes.</text>
</svg>