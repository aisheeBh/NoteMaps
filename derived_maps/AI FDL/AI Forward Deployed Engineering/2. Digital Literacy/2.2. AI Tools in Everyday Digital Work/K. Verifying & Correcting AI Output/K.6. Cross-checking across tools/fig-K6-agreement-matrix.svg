<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>What agreement and disagreement between tools mean</title>
  <desc>A two-by-two grid. Columns: the tools agree, or disagree. Rows: the tools are independent, or share sources and design. Independent and agreeing: meaningful support. Independent and disagreeing: strong signal to investigate. Dependent and agreeing: weak evidence, possibly a shared error. Dependent and disagreeing: signal of instability, investigate.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="40" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">Reading agreement and disagreement</text>
  <text x="392.5" y="86" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Tools agree</text>
  <text x="747.5" y="86" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Tools disagree</text>
  <text x="110" y="195.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111" transform="rotate(-90 110 195.0)">Independent</text>
  <text x="110" y="395.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111" transform="rotate(-90 110 395.0)">Shared sources</text>
  <rect x="220" y="100" width="345" height="190" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="392.5" y="149.9" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">CORROBORATION</text>
  <text x="392.5" y="172.9" text-anchor="middle" font-size="15" fill="#111111">Meaningful support,</text>
  <text x="392.5" y="193.1" text-anchor="middle" font-size="15" fill="#111111">not proof</text>
  <text x="392.5" y="213.4" text-anchor="middle" font-size="15" fill="#111111"></text>
  <text x="392.5" y="233.6" text-anchor="middle" font-size="15" fill="#111111">Proceed; verify</text>
  <text x="392.5" y="253.9" text-anchor="middle" font-size="15" fill="#111111">high-stakes claims</text>
  <rect x="575" y="100" width="345" height="190" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="747.5" y="149.9" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">STRONG SIGNAL</text>
  <text x="747.5" y="172.9" text-anchor="middle" font-size="15" fill="#111111">At least one is wrong</text>
  <text x="747.5" y="193.1" text-anchor="middle" font-size="15" fill="#111111"></text>
  <text x="747.5" y="213.4" text-anchor="middle" font-size="15" fill="#111111">Go to the authority;</text>
  <text x="747.5" y="233.6" text-anchor="middle" font-size="15" fill="#111111">the disagreement shows</text>
  <text x="747.5" y="253.9" text-anchor="middle" font-size="15" fill="#111111">where to look</text>
  <rect x="220" y="300" width="345" height="190" rx="8" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="392.5" y="349.9" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">WEAK EVIDENCE</text>
  <text x="392.5" y="372.8" text-anchor="middle" font-size="15" fill="#111111">May be one error</text>
  <text x="392.5" y="393.1" text-anchor="middle" font-size="15" fill="#111111">repeated twice</text>
  <text x="392.5" y="413.3" text-anchor="middle" font-size="15" fill="#111111"></text>
  <text x="392.5" y="433.6" text-anchor="middle" font-size="15" fill="#111111">Treat as a single</text>
  <text x="392.5" y="453.8" text-anchor="middle" font-size="15" fill="#111111">unverified source</text>
  <rect x="575" y="300" width="345" height="190" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="747.5" y="349.9" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">INSTABILITY</text>
  <text x="747.5" y="372.8" text-anchor="middle" font-size="15" fill="#111111">The answer is unstable</text>
  <text x="747.5" y="393.1" text-anchor="middle" font-size="15" fill="#111111">even among similar tools</text>
  <text x="747.5" y="413.3" text-anchor="middle" font-size="15" fill="#111111"></text>
  <text x="747.5" y="433.6" text-anchor="middle" font-size="15" fill="#111111">Low confidence;</text>
  <text x="747.5" y="453.8" text-anchor="middle" font-size="15" fill="#111111">verify before use</text>
  <text x="480.0" y="530" text-anchor="middle" font-size="14" fill="#333333" font-style="italic">Agreement is evidence only to the extent that the tools could have been wrong in different ways.</text>
</svg>
