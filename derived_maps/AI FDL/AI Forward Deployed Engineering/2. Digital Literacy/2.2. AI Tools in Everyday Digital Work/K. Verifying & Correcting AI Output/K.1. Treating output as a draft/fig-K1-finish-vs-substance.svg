<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Surface finish and substantive readiness</title>
  <desc>Two columns compare a rough human first draft with an AI draft. The human draft looks unfinished and signals that work remains. The AI draft looks finished, with fluent prose and formatting, while its facts, fit and judgement remain unverified.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="40" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">Surface finish is not substantive readiness</text>
  <rect x="28" y="70" width="440" height="320" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="248.0" y="104" text-anchor="middle" font-size="18" fill="#222222" font-weight="bold">Rough human first draft</text>
  <text x="248.0" y="128.3" text-anchor="middle" font-size="16" fill="#222222">Gaps, notes to self, [check this]</text>
  <text x="248.0" y="149.9" text-anchor="middle" font-size="16" fill="#222222">Uneven wording and formatting</text>
  <text x="248.0" y="171.5" text-anchor="middle" font-size="16" fill="#222222">Missing sections are visible</text>
  <text x="248.0" y="193.1" text-anchor="middle" font-size="16" fill="#222222"></text>
  <text x="248.0" y="214.7" text-anchor="middle" font-size="16" fill="#222222">Signal to the reader:</text>
  <text x="248.0" y="236.3" text-anchor="middle" font-size="16" fill="#222222">work is still needed</text>
  <rect x="492" y="70" width="440" height="320" rx="8" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="712.0" y="104" text-anchor="middle" font-size="18" fill="#111111" font-weight="bold">AI-generated draft</text>
  <text x="712.0" y="128.3" text-anchor="middle" font-size="16" fill="#111111">Fluent prose, headings, tidy lists</text>
  <text x="712.0" y="149.9" text-anchor="middle" font-size="16" fill="#111111">Confident tone throughout</text>
  <text x="712.0" y="171.5" text-anchor="middle" font-size="16" fill="#111111">No visible gaps or doubts</text>
  <text x="712.0" y="193.1" text-anchor="middle" font-size="16" fill="#111111"></text>
  <text x="712.0" y="214.7" text-anchor="middle" font-size="16" fill="#111111">Facts, fit and judgement:</text>
  <text x="712.0" y="236.3" text-anchor="middle" font-size="16" fill="#111111">still unverified</text>
  <rect x="132" y="300" width="232" height="70" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="248.0" y="329.8" text-anchor="middle" font-size="15" fill="#111111">Looks unfinished</text>
  <text x="248.0" y="350.0" text-anchor="middle" font-size="15" fill="#111111">and is unfinished</text>
  <rect x="596" y="300" width="232" height="70" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="712.0" y="329.8" text-anchor="middle" font-size="15" fill="#FFFFFF">Looks finished</text>
  <text x="712.0" y="350.0" text-anchor="middle" font-size="15" fill="#FFFFFF">but is a draft</text>
  <text x="480.0" y="440" text-anchor="middle" font-size="14" fill="#333333" font-style="italic">The polish of generated text removes the cues that normally tell a reviewer a draft is unfinished.</text>
</svg>
