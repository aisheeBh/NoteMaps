<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Matching testing effort to reversibility and reach</title>
  <desc>A two-by-two grid. Horizontal axis: how easily the effect of an instruction can be undone, from easy to hard. Vertical axis: how much it affects, from one item to many people or systems. Easy to undo and small reach: try it, watch the result. Easy to undo and large reach: test on a copy first. Hard to undo and small reach: back up first and check against documentation. Hard to undo and large reach: sandbox, expert review and sign-off.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="40" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">How much testing an instruction needs</text>
  <rect x="200" y="92" width="360" height="190" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="380.0" y="141.9" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">TEST ON A COPY</text>
  <text x="380.0" y="164.9" text-anchor="middle" font-size="15" fill="#111111">Many files, records, people</text>
  <text x="380.0" y="185.1" text-anchor="middle" font-size="15" fill="#111111">but easily undone</text>
  <text x="380.0" y="205.4" text-anchor="middle" font-size="15" fill="#111111"></text>
  <text x="380.0" y="225.6" text-anchor="middle" font-size="15" fill="#111111">Test on a copy or a</text>
  <text x="380.0" y="245.9" text-anchor="middle" font-size="15" fill="#111111">small subset first</text>
  <rect x="572" y="92" width="360" height="190" rx="8" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="752.0" y="141.9" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">FULL TEST AND SIGN-OFF</text>
  <text x="752.0" y="164.9" text-anchor="middle" font-size="15" fill="#111111">Many people or systems,</text>
  <text x="752.0" y="185.1" text-anchor="middle" font-size="15" fill="#111111">hard or impossible to undo</text>
  <text x="752.0" y="205.4" text-anchor="middle" font-size="15" fill="#111111"></text>
  <text x="752.0" y="225.6" text-anchor="middle" font-size="15" fill="#111111">Sandbox, expert review,</text>
  <text x="752.0" y="245.9" text-anchor="middle" font-size="15" fill="#111111">sign-off, rollback plan</text>
  <rect x="200" y="294" width="360" height="190" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="380.0" y="354.0" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">TRY AND OBSERVE</text>
  <text x="380.0" y="377.0" text-anchor="middle" font-size="15" fill="#111111">One item, easily undone</text>
  <text x="380.0" y="397.2" text-anchor="middle" font-size="15" fill="#111111"></text>
  <text x="380.0" y="417.5" text-anchor="middle" font-size="15" fill="#111111">Try it and watch</text>
  <text x="380.0" y="437.7" text-anchor="middle" font-size="15" fill="#111111">the result closely</text>
  <rect x="572" y="294" width="360" height="190" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="752.0" y="343.9" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">BACK UP AND CHECK</text>
  <text x="752.0" y="366.8" text-anchor="middle" font-size="15" fill="#111111">One item, hard to undo</text>
  <text x="752.0" y="387.1" text-anchor="middle" font-size="15" fill="#111111"></text>
  <text x="752.0" y="407.3" text-anchor="middle" font-size="15" fill="#111111">Back up first; check each</text>
  <text x="752.0" y="427.6" text-anchor="middle" font-size="15" fill="#111111">step against official</text>
  <text x="752.0" y="447.8" text-anchor="middle" font-size="15" fill="#111111">documentation</text>
  <line x1="200" y1="502" x2="950" y2="502" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="566" y="528" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">harder to undo</text>
  <line x1="174" y1="484" x2="174" y2="86" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="154" y="282" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111" transform="rotate(-90 154 282)">wider reach</text>
  <text x="480.0" y="566" text-anchor="middle" font-size="14" fill="#333333" font-style="italic">Schematic decision aid; real cases sit on a continuum along both axes.</text>
</svg>
