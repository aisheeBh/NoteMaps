<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 346" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Two kinds of check routine</title>
  <desc>Two columns. Read-do: the person reads each step and then does it, suited to unfamiliar or rare tasks. Do-confirm: the person works from experience and then pauses to confirm that critical items were done, suited to familiar routine tasks.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="40" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">Two kinds of check routine</text>
  <rect x="28" y="70" width="440" height="220" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="248.0" y="105" text-anchor="middle" font-size="19" fill="#111111" font-weight="bold">READ-DO</text>
  <text x="248.0" y="130.7" text-anchor="middle" font-size="16" fill="#111111">Read a step, then do it</text>
  <text x="248.0" y="152.2" text-anchor="middle" font-size="16" fill="#111111"></text>
  <text x="248.0" y="173.8" text-anchor="middle" font-size="16" fill="#111111">Suits unfamiliar or rare tasks:</text>
  <text x="248.0" y="195.4" text-anchor="middle" font-size="16" fill="#111111">a first regulatory filing,</text>
  <text x="248.0" y="217.0" text-anchor="middle" font-size="16" fill="#111111">a new tool, an unusual request</text>
  <text x="248.0" y="238.6" text-anchor="middle" font-size="16" fill="#111111"></text>
  <text x="248.0" y="260.2" text-anchor="middle" font-size="16" fill="#111111">Slower, but nothing is skipped</text>
  <rect x="492" y="70" width="440" height="220" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="712.0" y="105" text-anchor="middle" font-size="19" fill="#111111" font-weight="bold">DO-CONFIRM</text>
  <text x="712.0" y="130.7" text-anchor="middle" font-size="16" fill="#111111">Work from experience, then pause</text>
  <text x="712.0" y="152.2" text-anchor="middle" font-size="16" fill="#111111">and confirm the critical items</text>
  <text x="712.0" y="173.8" text-anchor="middle" font-size="16" fill="#111111"></text>
  <text x="712.0" y="195.4" text-anchor="middle" font-size="16" fill="#111111">Suits familiar routine tasks:</text>
  <text x="712.0" y="217.0" text-anchor="middle" font-size="16" fill="#111111">the weekly report, client emails</text>
  <text x="712.0" y="238.6" text-anchor="middle" font-size="16" fill="#111111"></text>
  <text x="712.0" y="260.2" text-anchor="middle" font-size="16" fill="#111111">Fast; relies on a short list</text>
  <text x="480.0" y="326" text-anchor="middle" font-size="14" fill="#333333" font-style="italic">The distinction comes from aviation checklist design.</text>
</svg>
