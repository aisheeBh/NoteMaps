<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Faithfulness and truth: four outcomes for a claim</title>
  <desc>A two-by-two grid. Columns: claim matches the source, or does not. Rows: claim is true in the world, or is not. Faithful and true: safe to use. Faithful but false: the source itself is wrong or out of date. Unfaithful but true: the tool added outside knowledge, which must be checked and attributed. Unfaithful and false: an error introduced by the tool.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="40" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">Two separate questions for every claim</text>
  <text x="385.0" y="86" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Matches the source</text>
  <text x="745.0" y="86" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Does not match the source</text>
  <text x="120" y="195.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111" transform="rotate(-90 120 195.0)">True in the world</text>
  <text x="120" y="395.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111" transform="rotate(-90 120 395.0)">False in the world</text>
  <rect x="210" y="100" width="350" height="190" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="385.0" y="170.5" text-anchor="middle" font-size="18" fill="#111111" font-weight="bold">SAFE</text>
  <text x="385.0" y="194.8" text-anchor="middle" font-size="15" fill="#111111">Faithful and accurate</text>
  <text x="385.0" y="215.0" text-anchor="middle" font-size="15" fill="#111111"></text>
  <text x="385.0" y="235.3" text-anchor="middle" font-size="15" fill="#111111">Use it, citing the source</text>
  <rect x="570" y="100" width="350" height="190" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="745.0" y="149.9" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">UNSUPPORTED BUT TRUE</text>
  <text x="745.0" y="172.9" text-anchor="middle" font-size="15" fill="#111111">The tool added outside</text>
  <text x="745.0" y="193.1" text-anchor="middle" font-size="15" fill="#111111">knowledge that happens</text>
  <text x="745.0" y="213.4" text-anchor="middle" font-size="15" fill="#111111">to be right</text>
  <text x="745.0" y="233.6" text-anchor="middle" font-size="15" fill="#111111"></text>
  <text x="745.0" y="253.9" text-anchor="middle" font-size="15" fill="#111111">Verify and attribute it</text>
  <rect x="210" y="300" width="350" height="190" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="385.0" y="349.9" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">FAITHFUL BUT FALSE</text>
  <text x="385.0" y="372.8" text-anchor="middle" font-size="15" fill="#111111">The source itself is wrong</text>
  <text x="385.0" y="393.1" text-anchor="middle" font-size="15" fill="#111111">or out of date</text>
  <text x="385.0" y="413.3" text-anchor="middle" font-size="15" fill="#111111"></text>
  <text x="385.0" y="433.6" text-anchor="middle" font-size="15" fill="#111111">Correct at the source;</text>
  <text x="385.0" y="453.8" text-anchor="middle" font-size="15" fill="#111111">do not repeat the error</text>
  <rect x="570" y="300" width="350" height="190" rx="8" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="745.0" y="360.0" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">UNFAITHFUL AND FALSE</text>
  <text x="745.0" y="383.0" text-anchor="middle" font-size="15" fill="#111111">An error introduced</text>
  <text x="745.0" y="403.2" text-anchor="middle" font-size="15" fill="#111111">by the tool</text>
  <text x="745.0" y="423.5" text-anchor="middle" font-size="15" fill="#111111"></text>
  <text x="745.0" y="443.7" text-anchor="middle" font-size="15" fill="#111111">Remove or correct</text>
  <text x="480.0" y="530" text-anchor="middle" font-size="14" fill="#333333" font-style="italic">Checking against the source answers the first question only; checking against reality answers the second.</text>
</svg>
