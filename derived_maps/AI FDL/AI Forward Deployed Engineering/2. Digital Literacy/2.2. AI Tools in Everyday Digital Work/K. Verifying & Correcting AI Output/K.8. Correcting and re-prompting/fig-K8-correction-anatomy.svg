<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The five parts of an effective correction</title>
  <desc>A correction prompt is shown divided into five labelled parts: locate the error by quoting it, state what is wrong, supply the correct information or source, protect what should not change, and ask for a list of the changes made.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="40" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">Five parts of an effective correction</text>
  <rect x="28" y="72" width="250" height="70" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="153.0" y="112.2" text-anchor="middle" font-size="16" fill="#111111">1 LOCATE</text>
  <rect x="292" y="72" width="640" height="70" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="612.0" y="112.2" text-anchor="middle" font-size="16" fill="#111111">In paragraph 3 you wrote: the policy applies to all staff.</text>
  <rect x="28" y="156" width="250" height="70" rx="8" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="153.0" y="196.2" text-anchor="middle" font-size="16" fill="#111111">2 STATE THE PROBLEM</text>
  <rect x="292" y="156" width="640" height="70" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="612.0" y="196.2" text-anchor="middle" font-size="16" fill="#111111">That is wrong: it applies only to staff on permanent contracts.</text>
  <rect x="28" y="240" width="250" height="70" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="153.0" y="280.2" text-anchor="middle" font-size="16" fill="#111111">3 SUPPLY THE FIX</text>
  <rect x="292" y="240" width="640" height="70" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="612.0" y="280.2" text-anchor="middle" font-size="16" fill="#111111">Section 2.1 of the attached policy gives the scope.</text>
  <rect x="28" y="324" width="250" height="70" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="153.0" y="364.2" text-anchor="middle" font-size="16" fill="#111111">4 PROTECT THE REST</text>
  <rect x="292" y="324" width="640" height="70" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="612.0" y="364.2" text-anchor="middle" font-size="16" fill="#111111">Change only paragraph 3; keep everything else exactly as it is.</text>
  <rect x="28" y="408" width="250" height="70" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="153.0" y="448.2" text-anchor="middle" font-size="16" fill="#111111">5 ASK FOR THE CHANGES</text>
  <rect x="292" y="408" width="640" height="70" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="612.0" y="448.2" text-anchor="middle" font-size="16" fill="#111111">Then list every change you made.</text>
  <text x="480.0" y="500" text-anchor="middle" font-size="14" fill="#333333" font-style="italic">Illustrative wording; the order of parts matters less than having all five.</text>
</svg>
