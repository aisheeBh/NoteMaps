<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 544" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The rule of three: what an error-free sample can rule out</title>
  <desc>A curve showing the approximate 95 per cent upper bound on the error rate, three divided by the sample size, after a sample with no errors. With 10 items the bound is 30 per cent; with 30 items, 10 per cent; with 100 items, 3 per cent; with 300 items, 1 per cent.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="40" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">After a clean sample, how high could the error rate still be?</text>
  <line x1="120" y1="440" x2="910" y2="440" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="120" y1="440" x2="120" y2="80" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="108" y="445.0" text-anchor="end" font-size="15" fill="#111111">0%</text>
  <text x="108" y="345.0" text-anchor="end" font-size="15" fill="#111111">10%</text>
  <line x1="120" y1="340.0" x2="900" y2="340.0" stroke="#888888" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="108" y="245.0" text-anchor="end" font-size="15" fill="#111111">20%</text>
  <line x1="120" y1="240.0" x2="900" y2="240.0" stroke="#888888" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="108" y="145.0" text-anchor="end" font-size="15" fill="#111111">30%</text>
  <line x1="120" y1="140.0" x2="900" y2="140.0" stroke="#888888" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="120.0" y="464" text-anchor="middle" font-size="15" fill="#111111">0</text>
  <text x="250.0" y="464" text-anchor="middle" font-size="15" fill="#111111">50</text>
  <text x="380.0" y="464" text-anchor="middle" font-size="15" fill="#111111">100</text>
  <text x="510.0" y="464" text-anchor="middle" font-size="15" fill="#111111">150</text>
  <text x="640.0" y="464" text-anchor="middle" font-size="15" fill="#111111">200</text>
  <text x="770.0" y="464" text-anchor="middle" font-size="15" fill="#111111">250</text>
  <text x="900.0" y="464" text-anchor="middle" font-size="15" fill="#111111">300</text>
