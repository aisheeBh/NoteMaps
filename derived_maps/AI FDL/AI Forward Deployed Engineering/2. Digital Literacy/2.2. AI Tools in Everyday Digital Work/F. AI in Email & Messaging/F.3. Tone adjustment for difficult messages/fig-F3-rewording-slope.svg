<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>From raw draft to over-polished: the rewording slope</title>
  <desc>A scale of rewording from a raw, angry draft on the left through firm, professional and diplomatic versions to an evasive version on the right. The firm and professional region is usually the target for difficult messages.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">From raw draft to over-polished: the rewording slope</text>
  <line x1="60" y1="245" x2="60" y2="265" stroke="#222222" stroke-width="4"/>
  <line x1="60" y1="255" x2="905" y2="255" stroke="#222222" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="60" y="285" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">Raw</text>
  <text x="905" y="285" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Over-polished</text>
  <circle cx="96" cy="255" r="9" fill="#111111"/>
  <line x1="96" y1="246" x2="96" y2="195" stroke="#222222" stroke-width="1.5"/>
  <rect x="24" y="70" width="200" height="125" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="33" y="79" width="182" height="107" rx="4" fill="#FFFFFF"/>
  <text x="124" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Raw</text>
  <text x="124" y="129" text-anchor="middle" font-size="14" fill="#111111">Heated, blaming;</text>
  <text x="124" y="147" text-anchor="middle" font-size="14" fill="#111111">satisfying to write,</text>
  <text x="124" y="165" text-anchor="middle" font-size="14" fill="#111111">harmful to send</text>
  <circle cx="296" cy="255" r="9" fill="#111111"/>
  <line x1="296" y1="264" x2="296" y2="300" stroke="#222222" stroke-width="1.5"/>
  <rect x="196" y="300" width="200" height="125" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="296" y="330" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Firm</text>
  <text x="296" y="359" text-anchor="middle" font-size="14" fill="#000000">Facts, impact and</text>
  <text x="296" y="377" text-anchor="middle" font-size="14" fill="#000000">request stated plainly</text>
  <circle cx="496" cy="255" r="9" fill="#111111"/>
  <line x1="496" y1="246" x2="496" y2="195" stroke="#222222" stroke-width="1.5"/>
  <rect x="396" y="70" width="200" height="125" rx="6" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="405" y="79" width="182" height="107" rx="4" fill="#FFFFFF"/>
  <text x="496" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Professional</text>
  <text x="496" y="129" text-anchor="middle" font-size="14" fill="#111111">Firm, plus courtesy</text>
  <text x="496" y="147" text-anchor="middle" font-size="14" fill="#111111">and context</text>
  <circle cx="688" cy="255" r="9" fill="#111111"/>
  <line x1="688" y1="264" x2="688" y2="300" stroke="#222222" stroke-width="1.5"/>
  <rect x="588" y="300" width="200" height="125" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="597" y="309" width="182" height="107" rx="4" fill="#FFFFFF"/>
  <text x="688" y="330" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Diplomatic</text>
  <text x="688" y="359" text-anchor="middle" font-size="14" fill="#111111">Cushioned; point still</text>
  <text x="688" y="377" text-anchor="middle" font-size="14" fill="#111111">present but softer</text>
  <circle cx="864" cy="255" r="9" fill="#111111"/>
  <line x1="864" y1="246" x2="864" y2="195" stroke="#222222" stroke-width="1.5"/>
  <rect x="736" y="70" width="200" height="125" rx="6" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="836" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#222222">Evasive</text>
  <text x="836" y="129" text-anchor="middle" font-size="14" fill="#222222">Point buried in hedges</text>
  <text x="836" y="147" text-anchor="middle" font-size="14" fill="#222222">and thanks</text>
  <text x="480" y="484" text-anchor="middle" font-size="13" fill="#333333">Repeated 'make it more polite' requests move a message rightwards; stop where the point is still unmistakable.</text>
</svg>
