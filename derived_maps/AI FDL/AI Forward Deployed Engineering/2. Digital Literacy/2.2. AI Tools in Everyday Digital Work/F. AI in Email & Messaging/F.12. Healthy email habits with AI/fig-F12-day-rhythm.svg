  <text x="170" y="322" text-anchor="middle" font-size="14" fill="#111111">08:00</text>
  <line x1="322" y1="70" x2="322" y2="300" stroke="#888888" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="322" y="322" text-anchor="middle" font-size="14" fill="#111111">10:00</text>
  <line x1="474" y1="70" x2="474" y2="300" stroke="#888888" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="474" y="322" text-anchor="middle" font-size="14" fill="#111111">12:00</text>
