<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>How machines came to sort the inbox</title>
  <desc>Five stages left to right: spam filtering from the late 1990s and early 2000s; priority ranking from 2010; automatic categories and tabs from 2013; focused or other inbox from 2014 to 2016; language-model triage with summaries and suggested actions from 2023.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">How machines came to sort the inbox</text>
  <rect x="24" y="75" width="155" height="225" rx="6" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="102" y="106" text-anchor="middle" font-size="16" font-weight="bold" fill="#222222">Spam filters</text>
  <text x="102" y="136" text-anchor="middle" font-size="14.5" fill="#222222">Late 1990s</text>
  <text x="102" y="154" text-anchor="middle" font-size="14.5" fill="#222222">onward: rules,</text>
  <text x="102" y="173" text-anchor="middle" font-size="14.5" fill="#222222">then statistical</text>
  <text x="102" y="192" text-anchor="middle" font-size="14.5" fill="#222222">(Bayesian)</text>
  <text x="102" y="211" text-anchor="middle" font-size="14.5" fill="#222222">filters</text>
  <line x1="182" y1="188" x2="210" y2="188" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="213" y="75" width="155" height="225" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="291" y="106" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Priority</text>
  <text x="291" y="126" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">ranking</text>
  <text x="291" y="156" text-anchor="middle" font-size="14.5" fill="#000000">2010: Gmail</text>
  <text x="291" y="174" text-anchor="middle" font-size="14.5" fill="#000000">Priority Inbox</text>
  <text x="291" y="193" text-anchor="middle" font-size="14.5" fill="#000000">learns what each</text>
  <text x="291" y="212" text-anchor="middle" font-size="14.5" fill="#000000">person reads and</text>
  <text x="291" y="231" text-anchor="middle" font-size="14.5" fill="#000000">answers</text>
  <line x1="371" y1="188" x2="399" y2="188" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="402" y="75" width="155" height="225" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="480" y="106" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Categories</text>
  <text x="480" y="136" text-anchor="middle" font-size="14.5" fill="#111111">2013: tabs for</text>
  <text x="480" y="154" text-anchor="middle" font-size="14.5" fill="#111111">social,</text>
  <text x="480" y="173" text-anchor="middle" font-size="14.5" fill="#111111">promotions,</text>
  <text x="480" y="192" text-anchor="middle" font-size="14.5" fill="#111111">updates</text>
  <line x1="561" y1="188" x2="589" y2="188" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="592" y="75" width="155" height="225" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="601" y="84" width="137" height="207" rx="4" fill="#FFFFFF"/>
  <text x="669" y="106" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Focused /</text>
  <text x="669" y="126" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Other</text>
  <text x="669" y="156" text-anchor="middle" font-size="14.5" fill="#111111">2014-2016:</text>
  <text x="669" y="174" text-anchor="middle" font-size="14.5" fill="#111111">Outlook splits</text>
  <text x="669" y="193" text-anchor="middle" font-size="14.5" fill="#111111">likely-important</text>
  <text x="669" y="212" text-anchor="middle" font-size="14.5" fill="#111111">mail from the</text>
  <text x="669" y="231" text-anchor="middle" font-size="14.5" fill="#111111">rest</text>
  <line x1="750" y1="188" x2="778" y2="188" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="781" y="75" width="155" height="225" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="858" y="106" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Language-model</text>
  <text x="858" y="126" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">triage</text>
  <text x="858" y="156" text-anchor="middle" font-size="14.5" fill="#FFFFFF">2023 onward:</text>
  <text x="858" y="174" text-anchor="middle" font-size="14.5" fill="#FFFFFF">summaries,</text>
  <text x="858" y="193" text-anchor="middle" font-size="14.5" fill="#FFFFFF">priority</text>
  <text x="858" y="212" text-anchor="middle" font-size="14.5" fill="#FFFFFF">reasons,</text>
  <text x="858" y="231" text-anchor="middle" font-size="14.5" fill="#FFFFFF">suggested</text>
  <text x="858" y="250" text-anchor="middle" font-size="14.5" fill="#FFFFFF">actions</text>
</svg>
