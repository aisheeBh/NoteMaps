<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>From transactional to relational messages</title>
  <desc>A scale of message types from purely transactional on the left to deeply relational on the right: a receipt or notification, a routine request, a project update, thanks or recognition, and condolence or personal support. The value of visible personal effort rises to the right.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">From transactional to relational messages</text>
  <line x1="60" y1="245" x2="60" y2="265" stroke="#222222" stroke-width="4"/>
  <line x1="60" y1="255" x2="905" y2="255" stroke="#222222" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="60" y="285" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">Transactional</text>
  <text x="905" y="285" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">Relational</text>
  <circle cx="96" cy="255" r="9" fill="#111111"/>
  <line x1="96" y1="246" x2="96" y2="195" stroke="#222222" stroke-width="1.5"/>
  <rect x="24" y="70" width="200" height="125" rx="6" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="124" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#222222">Notification</text>
  <text x="124" y="129" text-anchor="middle" font-size="14" fill="#222222">Receipt, confirmation,</text>
  <text x="124" y="147" text-anchor="middle" font-size="14" fill="#222222">automated alert</text>
  <circle cx="288" cy="255" r="9" fill="#111111"/>
  <line x1="288" y1="264" x2="288" y2="300" stroke="#222222" stroke-width="1.5"/>
  <rect x="188" y="300" width="200" height="125" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="288" y="330" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Routine request</text>
  <text x="288" y="359" text-anchor="middle" font-size="14" fill="#111111">"Please send the March</text>
  <text x="288" y="377" text-anchor="middle" font-size="14" fill="#111111">figures"</text>
  <circle cx="480" cy="255" r="9" fill="#111111"/>
  <line x1="480" y1="246" x2="480" y2="195" stroke="#222222" stroke-width="1.5"/>
  <rect x="380" y="70" width="200" height="125" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="480" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Project update</text>
  <text x="480" y="129" text-anchor="middle" font-size="14" fill="#000000">Facts plus reassurance</text>
  <text x="480" y="147" text-anchor="middle" font-size="14" fill="#000000">and judgement</text>
  <circle cx="672" cy="255" r="9" fill="#111111"/>
  <line x1="672" y1="264" x2="672" y2="300" stroke="#222222" stroke-width="1.5"/>
  <rect x="572" y="300" width="200" height="125" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="581" y="309" width="182" height="107" rx="4" fill="#FFFFFF"/>
  <text x="672" y="330" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Thanks and</text>
  <text x="672" y="349" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">recognition</text>
  <text x="672" y="378" text-anchor="middle" font-size="14" fill="#111111">Value lies in the</text>
  <text x="672" y="396" text-anchor="middle" font-size="14" fill="#111111">sender's attention</text>
  <circle cx="864" cy="255" r="9" fill="#111111"/>
  <line x1="864" y1="246" x2="864" y2="195" stroke="#222222" stroke-width="1.5"/>
  <rect x="736" y="70" width="200" height="125" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="836" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Condolence, support</text>
  <text x="836" y="129" text-anchor="middle" font-size="14" fill="#FFFFFF">Value lies almost</text>
  <text x="836" y="147" text-anchor="middle" font-size="14" fill="#FFFFFF">wholly in personal</text>
  <text x="836" y="165" text-anchor="middle" font-size="14" fill="#FFFFFF">effort</text>
  <text x="480" y="484" text-anchor="middle" font-size="13" fill="#333333">Further right, the recipient values the sender's attention more than the words themselves.</text>
</svg>
