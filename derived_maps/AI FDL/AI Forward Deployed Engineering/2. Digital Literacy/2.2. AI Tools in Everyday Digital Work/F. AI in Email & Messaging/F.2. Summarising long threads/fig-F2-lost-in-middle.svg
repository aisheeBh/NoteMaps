<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Where in a long input a model is most likely to use information</title>
  <desc>A schematic U-shaped curve: the chance that a language model correctly uses a piece of information is higher when it sits near the start or end of a long input and lower when it sits in the middle. A flat dashed line shows the ideal of equal use at every position.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Where in a long input a model is most likely to use information</text>
  <line x1="120" y1="390" x2="900" y2="390" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="390" x2="120" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="510" y="430" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Position of the key information in a long input</text>
  <text x="62" y="203" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Chance the</text>
  <text x="62" y="221" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">information</text>
  <text x="62" y="239" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">is used</text>
  <text x="151" y="410" text-anchor="middle" font-size="14" fill="#111111">Start</text>
  <text x="510" y="410" text-anchor="middle" font-size="14" fill="#111111">Middle</text>
  <text x="869" y="410" text-anchor="middle" font-size="14" fill="#111111">End</text>
  <path d="M120 135 L234 192 L386 240 L500 249 L614 240 L766 201 L880 150" fill="none" stroke="#111111" stroke-width="3.5"/>
  <rect x="373" y="259" width="224" height="42" fill="#FFFFFF"/>
  <text x="377" y="275" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">Reported pattern in several</text>
  <text x="377" y="294" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">models</text>
  <path d="M120 120 L880 120" fill="none" stroke="#111111" stroke-width="3.5" stroke-dasharray="10 6"/>
  <rect x="397" y="64" width="176" height="42" fill="#FFFFFF"/>
  <text x="401" y="80" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">Ideal: equal at every</text>
  <text x="401" y="99" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">position</text>
  <text x="480" y="468" text-anchor="middle" font-size="13" fill="#333333">Schematic of the pattern reported by Liu and colleagues (2024); not plotted from their data. Newer models show the effect less</text>
  <text x="480" y="484" text-anchor="middle" font-size="13" fill="#333333">strongly, but long threads still lose middle detail.</text>
</svg>
