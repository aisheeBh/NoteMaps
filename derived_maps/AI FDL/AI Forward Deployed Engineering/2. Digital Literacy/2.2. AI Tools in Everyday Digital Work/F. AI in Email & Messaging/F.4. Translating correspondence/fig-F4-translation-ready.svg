<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Writing a message that translates well</title>
  <desc>Two columns compare an idiomatic English source message with a translation-ready version across five features: idioms, dates, sentence length, pronouns and the request.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Writing a message that translates well</text>
  <rect x="24" y="62" width="371" height="44" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="33" y="71" width="353" height="26" rx="4" fill="#FFFFFF"/>
  <text x="210" y="90" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Idiomatic source</text>
  <rect x="565" y="62" width="371" height="44" rx="6" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="574" y="71" width="353" height="26" rx="4" fill="#FFFFFF"/>
  <text x="750" y="90" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Translation-ready source</text>
  <rect x="405" y="120" width="150" height="66" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="480" y="158" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Idioms</text>
  <rect x="24" y="120" width="371" height="66" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="210" y="158" text-anchor="middle" font-size="14.5" fill="#111111">"Let's touch base and get the ball rolling"</text>
  <rect x="565" y="120" width="371" height="66" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="750" y="158" text-anchor="middle" font-size="14.5" fill="#111111">"Let us speak this week and start the work"</text>
  <rect x="405" y="196" width="150" height="66" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="480" y="234" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Dates</text>
  <rect x="24" y="196" width="371" height="66" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="210" y="234" text-anchor="middle" font-size="14.5" fill="#111111">"Due 03/04"</text>
  <rect x="565" y="196" width="371" height="66" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="750" y="234" text-anchor="middle" font-size="14.5" fill="#111111">"Due 3 April 2026"</text>
  <rect x="405" y="272" width="150" height="66" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="480" y="310" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Sentences</text>
  <rect x="24" y="272" width="371" height="66" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="210" y="310" text-anchor="middle" font-size="14.5" fill="#111111">One 45-word sentence with three clauses</text>
  <rect x="565" y="272" width="371" height="66" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="750" y="310" text-anchor="middle" font-size="14.5" fill="#111111">Three short sentences, one idea each</text>
  <rect x="405" y="348" width="150" height="66" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="480" y="386" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Pronouns</text>
  <rect x="24" y="348" width="371" height="66" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="210" y="386" text-anchor="middle" font-size="14.5" fill="#111111">"They said it would be fine"</text>
  <rect x="565" y="348" width="371" height="66" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="750" y="386" text-anchor="middle" font-size="14.5" fill="#111111">"The logistics team confirmed the delivery"</text>
  <rect x="405" y="424" width="150" height="66" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="480" y="462" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Request</text>
  <rect x="24" y="424" width="371" height="66" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="210" y="453" text-anchor="middle" font-size="14.5" fill="#111111">"It'd be great if you could maybe look at</text>
  <text x="210" y="472" text-anchor="middle" font-size="14.5" fill="#111111">this"</text>
  <rect x="565" y="424" width="371" height="66" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="750" y="462" text-anchor="middle" font-size="14.5" fill="#111111">"Please review the contract by Friday"</text>
  <text x="480" y="534" text-anchor="middle" font-size="13" fill="#333333">Plain, explicit source text is the single most effective way to improve machine translation.</text>
</svg>
