<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 458" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Where a 40-hour week goes</title>
  <desc>Bar chart of an illustrative 40-hour week for a manager: 14 hours of meetings, 8 hours of email and messages, 4 hours of buffer for interruptions and overruns, and 14 hours left for focused work. Focus time is far less than the nominal working week.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Where a 40-hour week goes</text>
  <text x="328" y="120" text-anchor="end" font-size="15" fill="#111111">Meetings</text>
  <rect x="340" y="96" width="287" height="38" rx="2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="637" y="120" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">14 h</text>
  <text x="328" y="191" text-anchor="end" font-size="15" fill="#111111">Email and messages</text>
  <rect x="340" y="167" width="164" height="38" rx="2" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="514" y="191" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">8 h</text>
  <text x="328" y="253" text-anchor="end" font-size="15" fill="#111111">Buffer for interruptions and</text>
  <text x="328" y="271" text-anchor="end" font-size="15" fill="#111111">overruns</text>
  <rect x="340" y="238" width="82" height="38" rx="2" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="432" y="262" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">4 h</text>
  <text x="328" y="333" text-anchor="end" font-size="15" fill="#111111">Left for focused work</text>
  <rect x="340" y="309" width="287" height="38" rx="2" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <text x="637" y="333" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">14 h</text>
  <line x1="340" y1="74" x2="340" y2="367" stroke="#222222" stroke-width="2"/>
  <line x1="340" y1="367" x2="750" y2="367" stroke="#222222" stroke-width="1.5"/>
  <line x1="340" y1="367" x2="340" y2="373" stroke="#222222" stroke-width="1.5"/>
  <text x="340" y="389" text-anchor="middle" font-size="13" fill="#111111">0</text>
  <line x1="442" y1="367" x2="442" y2="373" stroke="#222222" stroke-width="1.5"/>
  <text x="442" y="389" text-anchor="middle" font-size="13" fill="#111111">5</text>
  <line x1="545" y1="367" x2="545" y2="373" stroke="#222222" stroke-width="1.5"/>
  <text x="545" y="389" text-anchor="middle" font-size="13" fill="#111111">10</text>
  <line x1="648" y1="367" x2="648" y2="373" stroke="#222222" stroke-width="1.5"/>
  <text x="648" y="389" text-anchor="middle" font-size="13" fill="#111111">15</text>
  <line x1="750" y1="367" x2="750" y2="373" stroke="#222222" stroke-width="1.5"/>
  <text x="750" y="389" text-anchor="middle" font-size="13" fill="#111111">20</text>
  <text x="545" y="411" text-anchor="middle" font-size="14" fill="#111111">Hours per week (illustrative)</text>
  <text x="480" y="444" text-anchor="middle" font-size="13" fill="#333333">A plan that schedules 30 hours of project work into this week is already impossible.</text>
</svg>
