<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Whether and how to record a meeting</title>
  <desc>A two-by-two grid. Horizontal axis: sensitivity of the discussion. Vertical axis: need for a detailed record. Low sensitivity, low need: brief action notes, no recording. Low sensitivity, high need: record and transcribe with notice. High sensitivity, low need: no recording, human notes of decisions only. High sensitivity, high need: formal minutes by an appointed note-taker, recording only with explicit consent and controlled retention.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Whether and how to record a meeting</text>
  <rect x="156" y="92" width="366" height="199" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="339" y="175" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Record and transcribe</text>
  <text x="339" y="200" text-anchor="middle" font-size="14" fill="#000000">With notice; AI drafts minutes; owner</text>
  <text x="339" y="218" text-anchor="middle" font-size="14" fill="#000000">reviews</text>
  <rect x="534" y="92" width="366" height="199" rx="6" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="716" y="175" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Formal minutes by a person</text>
  <text x="716" y="200" text-anchor="middle" font-size="14" fill="#000000">Recording only with explicit consent; strict</text>
  <text x="716" y="218" text-anchor="middle" font-size="14" fill="#000000">retention</text>
  <rect x="156" y="303" width="366" height="199" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="339" y="395" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">Brief action notes</text>
  <text x="339" y="420" text-anchor="middle" font-size="14" fill="#000000">No recording; AI can tidy typed notes</text>
  <rect x="534" y="303" width="366" height="199" rx="6" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="716" y="395" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">No recording</text>
  <text x="716" y="420" text-anchor="middle" font-size="14" fill="#000000">Human notes of decisions only</text>
  <line x1="150" y1="508" x2="917" y2="508" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="150" y1="508" x2="150" y2="74" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="154" y="532" text-anchor="start" font-size="14" fill="#111111">Routine</text>
  <text x="905" y="532" text-anchor="end" font-size="14" fill="#111111">Sensitive</text>
  <text x="528" y="558" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Sensitivity of the discussion</text>
  <text x="132" y="502" text-anchor="start" font-size="14" fill="#111111" transform="rotate(-90 132 502)">Low</text>
  <text x="132" y="90" text-anchor="end" font-size="14" fill="#111111" transform="rotate(-90 132 90)">High</text>
  <text x="100" y="297" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111" transform="rotate(-90 100 297)">Need for a detailed record</text>
  <text x="480" y="586" text-anchor="middle" font-size="13" fill="#333333">Sensitive: personnel, legal advice, health, negotiations, whistle-blowing, early-stage strategy.</text>
</svg>
