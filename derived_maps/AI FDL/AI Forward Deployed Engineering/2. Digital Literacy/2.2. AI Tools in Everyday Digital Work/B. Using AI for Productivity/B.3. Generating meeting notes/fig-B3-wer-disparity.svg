<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Speech-recognition errors differ by speaker (Koenecke et al., 2020)</title>
  <desc>Bar chart: across five commercial speech-recognition systems tested in 2019, the average word error rate was about 0.35 for Black speakers and about 0.19 for white speakers.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Speech-recognition errors differ by speaker (Koenecke et al., 2020)</text>
  <text x="328" y="131" text-anchor="end" font-size="15" fill="#111111">Black speakers</text>
  <rect x="340" y="107" width="319" height="38" rx="2" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="669" y="131" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">about 0.35</text>
  <text x="328" y="224" text-anchor="end" font-size="15" fill="#111111">White speakers</text>
  <rect x="340" y="200" width="173" height="38" rx="2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="523" y="224" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">about 0.19</text>
  <line x1="340" y1="74" x2="340" y2="269" stroke="#222222" stroke-width="2"/>
  <line x1="340" y1="269" x2="750" y2="269" stroke="#222222" stroke-width="1.5"/>
  <line x1="340" y1="269" x2="340" y2="275" stroke="#222222" stroke-width="1.5"/>
  <text x="340" y="291" text-anchor="middle" font-size="13" fill="#111111">0</text>
  <line x1="431" y1="269" x2="431" y2="275" stroke="#222222" stroke-width="1.5"/>
  <text x="431" y="291" text-anchor="middle" font-size="13" fill="#111111">0.1</text>
  <line x1="522" y1="269" x2="522" y2="275" stroke="#222222" stroke-width="1.5"/>
  <text x="522" y="291" text-anchor="middle" font-size="13" fill="#111111">0.2</text>
  <line x1="613" y1="269" x2="613" y2="275" stroke="#222222" stroke-width="1.5"/>
  <text x="613" y="291" text-anchor="middle" font-size="13" fill="#111111">0.3</text>
  <line x1="704" y1="269" x2="704" y2="275" stroke="#222222" stroke-width="1.5"/>
  <text x="704" y="291" text-anchor="middle" font-size="13" fill="#111111">0.4</text>
  <text x="545" y="313" text-anchor="middle" font-size="14" fill="#111111">Average word error rate (errors per word spoken)</text>
  <text x="480" y="346" text-anchor="middle" font-size="13" fill="#333333">Interviews with US speakers; five commercial systems. Later systems have improved, but gaps by accent and dialect persist.</text>
</svg>
