<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 582" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Machine translation accuracy varies by language (Taira et al., 2021)</title>
  <desc>Bar chart of the share of emergency-department discharge-instruction sentences translated accurately by a free online machine-translation service, by target language: Spanish 94 per cent, Tagalog 90 per cent, Korean about 83 per cent, Chinese about 82 per cent, Farsi about 68 per cent and Armenian 55 per cent.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Machine translation accuracy varies by language (Taira et al., 2021)</text>
  <text x="228" y="119" text-anchor="end" font-size="15" fill="#111111">Spanish</text>
  <rect x="240" y="95" width="479" height="38" rx="2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="729" y="119" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">94%</text>
  <text x="228" y="187" text-anchor="end" font-size="15" fill="#111111">Tagalog</text>
  <rect x="240" y="163" width="459" height="38" rx="2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="709" y="187" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">90%</text>
  <text x="228" y="255" text-anchor="end" font-size="15" fill="#111111">Korean</text>
  <rect x="240" y="231" width="421" height="38" rx="2" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="671" y="255" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">about 83%</text>
  <text x="228" y="322" text-anchor="end" font-size="15" fill="#111111">Chinese</text>
  <rect x="240" y="298" width="417" height="38" rx="2" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="667" y="322" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">about 82%</text>
  <text x="228" y="390" text-anchor="end" font-size="15" fill="#111111">Farsi</text>
  <rect x="240" y="366" width="344" height="38" rx="2" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="594" y="390" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">about 68%</text>
  <text x="228" y="458" text-anchor="end" font-size="15" fill="#111111">Armenian</text>
  <rect x="240" y="434" width="280" height="38" rx="2" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="530" y="458" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">55%</text>
  <line x1="240" y1="74" x2="240" y2="491" stroke="#222222" stroke-width="2"/>
  <line x1="240" y1="491" x2="750" y2="491" stroke="#222222" stroke-width="1.5"/>
  <line x1="240" y1="491" x2="240" y2="497" stroke="#222222" stroke-width="1.5"/>
  <text x="240" y="513" text-anchor="middle" font-size="13" fill="#111111">0</text>
  <line x1="342" y1="491" x2="342" y2="497" stroke="#222222" stroke-width="1.5"/>
  <text x="342" y="513" text-anchor="middle" font-size="13" fill="#111111">20</text>
  <line x1="444" y1="491" x2="444" y2="497" stroke="#222222" stroke-width="1.5"/>
  <text x="444" y="513" text-anchor="middle" font-size="13" fill="#111111">40</text>
  <line x1="546" y1="491" x2="546" y2="497" stroke="#222222" stroke-width="1.5"/>
  <text x="546" y="513" text-anchor="middle" font-size="13" fill="#111111">60</text>
  <line x1="648" y1="491" x2="648" y2="497" stroke="#222222" stroke-width="1.5"/>
  <text x="648" y="513" text-anchor="middle" font-size="13" fill="#111111">80</text>
  <line x1="750" y1="491" x2="750" y2="497" stroke="#222222" stroke-width="1.5"/>
  <text x="750" y="513" text-anchor="middle" font-size="13" fill="#111111">100</text>
  <text x="495" y="535" text-anchor="middle" font-size="14" fill="#111111">Sentences judged accurate (per cent)</text>
  <text x="480" y="568" text-anchor="middle" font-size="13" fill="#333333">Evaluated by bilingual reviewers in 2019-2020; systems have improved since, but the ranking by language resources persists.</text>
</svg>
