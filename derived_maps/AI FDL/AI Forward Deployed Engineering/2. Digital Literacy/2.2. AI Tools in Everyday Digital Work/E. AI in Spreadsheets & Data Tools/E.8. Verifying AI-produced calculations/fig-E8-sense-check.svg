<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>A sense check against a rough estimate</title>
  <desc>A horizontal scale from 1,000 to 10 million pounds on a logarithmic axis. A plausible band from about 50,000 to 100,000 pounds surrounds a rough estimate of 70,000 pounds (2 million times 3.5 per cent). The stated figure of 184,275 pounds lies outside the band to the right; the recomputed figure of 66,619 lies inside it.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">Sense check: is the stated figure even the right size?</text>
  <rect x="421" y="196" width="59" height="58" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
  <line x1="90" y1="240" x2="870" y2="240" stroke="#222222" stroke-width="2.5"/>
  <line x1="90.0" y1="232" x2="90.0" y2="248" stroke="#222222" stroke-width="2"/>
  <text x="90.0" y="276" text-anchor="middle" font-size="14" fill="#111111">£1k</text>
  <line x1="285.0" y1="232" x2="285.0" y2="248" stroke="#222222" stroke-width="2"/>
  <text x="285.0" y="276" text-anchor="middle" font-size="14" fill="#111111">£10k</text>
  <line x1="480.0" y1="232" x2="480.0" y2="248" stroke="#222222" stroke-width="2"/>
  <text x="480.0" y="276" text-anchor="middle" font-size="14" fill="#111111">£100k</text>
  <line x1="675.0" y1="232" x2="675.0" y2="248" stroke="#222222" stroke-width="2"/>
  <text x="675.0" y="276" text-anchor="middle" font-size="14" fill="#111111">£1m</text>
  <line x1="870.0" y1="232" x2="870.0" y2="248" stroke="#222222" stroke-width="2"/>
  <text x="870.0" y="276" text-anchor="middle" font-size="14" fill="#111111">£10m</text>
  <text x="450.6495754227618" y="148" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Plausible range £50k–£100k</text>
  <text x="450.6495754227618" y="170" text-anchor="middle" font-size="14" fill="#111111">around the estimate £2m × 3.5% ≈ £70k</text>
  <line x1="450.6495754227618" y1="176" x2="450.6495754227618" y2="194" stroke="#222222" stroke-width="1.5"/>
  <circle cx="445.6" cy="240" r="8" fill="#111111"/>
  <circle cx="531.8" cy="240" r="8" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
  <text x="547.7659518749972" y="224" text-anchor="start" font-size="15" fill="#111111" font-weight="bold">Stated £184,275: outside the range</text>
  <line x1="445.60163131851465" y1="248" x2="445.60163131851465" y2="306" stroke="#222222" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="445.60163131851465" y="326" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Recomputed £66,619: inside the range</text>
  <text x="480" y="380" text-anchor="middle" font-size="14" fill="#111111">Order-of-magnitude scale: each step is ten times the last.</text>
  <text x="480.0" y="424" text-anchor="middle" font-size="13" fill="#333333">Illustrative figures from the pay-rise case study.</text>
</svg>
