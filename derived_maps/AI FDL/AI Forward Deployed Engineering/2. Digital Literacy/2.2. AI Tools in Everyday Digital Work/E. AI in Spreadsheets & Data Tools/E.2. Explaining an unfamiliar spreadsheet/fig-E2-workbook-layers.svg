<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The layers of a typical business workbook</title>
  <desc>Three visible layers from left to right: inputs, calculations and outputs, joined by arrows. Below them, a band of hidden structure that is not visible in the grid: hidden rows and sheets, named ranges, external links, macros and scripts, query steps, pivot caches, and validation rules.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">What a workbook contains: visible layers and hidden structure</text>
  <text x="480" y="74" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Visible in the grid</text>
  <rect x="40" y="90" width="260" height="150" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="170" y="152" text-anchor="middle" font-size="19" fill="#000000" font-weight="bold">Inputs</text>
  <text x="170" y="172" text-anchor="middle" font-size="15" fill="#000000">Pasted extracts, imported</text>
  <text x="170" y="192" text-anchor="middle" font-size="15" fill="#000000">data, typed assumptions</text>
  <rect x="350" y="90" width="260" height="150" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="480" y="142" text-anchor="middle" font-size="19" fill="#000000" font-weight="bold">Calculations</text>
  <text x="480" y="162" text-anchor="middle" font-size="15" fill="#000000">Formulas that transform</text>
  <text x="480" y="182" text-anchor="middle" font-size="15" fill="#000000">inputs, often across many</text>
  <text x="480" y="202" text-anchor="middle" font-size="15" fill="#000000">sheets</text>
  <rect x="660" y="90" width="260" height="150" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="790" y="142" text-anchor="middle" font-size="19" fill="#000000" font-weight="bold">Outputs</text>
  <text x="790" y="162" text-anchor="middle" font-size="15" fill="#000000">Summary tables, charts and</text>
  <text x="790" y="182" text-anchor="middle" font-size="15" fill="#000000">the figures people actually</text>
  <text x="790" y="202" text-anchor="middle" font-size="15" fill="#000000">read</text>
  <line x1="300" y1="165" x2="346" y2="165" stroke="#222222" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="610" y1="165" x2="656" y2="165" stroke="#222222" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="40" y1="275" x2="920" y2="275" stroke="#222222" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="480" y="305" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Not visible in the grid, but able to change every result</text>
  <rect x="40" y="325" width="210" height="74" rx="6" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="145" y="358" text-anchor="middle" font-size="15" fill="#000000">Hidden rows, columns,</text>
  <text x="145" y="378" text-anchor="middle" font-size="15" fill="#000000">sheets</text>
  <rect x="262" y="325" width="210" height="74" rx="6" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="367" y="368" text-anchor="middle" font-size="15" fill="#000000">Named ranges</text>
  <rect x="484" y="325" width="210" height="74" rx="6" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="589" y="358" text-anchor="middle" font-size="15" fill="#000000">External links to other</text>
  <text x="589" y="378" text-anchor="middle" font-size="15" fill="#000000">files</text>
  <rect x="706" y="325" width="210" height="74" rx="6" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="811" y="368" text-anchor="middle" font-size="15" fill="#000000">Macros and scripts</text>
  <rect x="40" y="415" width="210" height="74" rx="6" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="145" y="458" text-anchor="middle" font-size="15" fill="#000000">Query and refresh steps</text>
  <rect x="262" y="415" width="210" height="74" rx="6" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="367" y="458" text-anchor="middle" font-size="15" fill="#000000">Pivot caches</text>
  <rect x="484" y="415" width="210" height="74" rx="6" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="589" y="448" text-anchor="middle" font-size="15" fill="#222222">Validation and</text>
  <text x="589" y="468" text-anchor="middle" font-size="15" fill="#222222">formatting rules</text>
  <rect x="706" y="415" width="210" height="74" rx="6" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="811" y="458" text-anchor="middle" font-size="15" fill="#222222">Comments and notes</text>
  <text x="480.0" y="540" text-anchor="middle" font-size="13" fill="#333333">Schematic; real workbooks mix these layers, often on the same sheet.</text>
</svg>
