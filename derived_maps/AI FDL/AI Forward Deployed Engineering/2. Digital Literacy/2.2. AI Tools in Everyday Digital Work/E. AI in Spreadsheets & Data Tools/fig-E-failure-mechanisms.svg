<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>How spreadsheet failures arise</title>
  <desc>Four mechanisms in boxes, each linked to documented cases: wrong range or logic, as in the Reinhart and Rogoff spreadsheet and the London Whale risk model; silent limits and conversions, as in the Public Health England row limit and gene names turned into dates; hidden content, as in Barclays-Lehman hidden rows and a police hidden tab; and no independent rerun or check, which let each of the others pass.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38" text-anchor="middle" font-size="23" fill="#111111" font-weight="bold">Four mechanisms behind well-known spreadsheet failures</text>
  <rect x="40" y="80" width="280" height="230" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="180" y="162" text-anchor="middle" font-size="17" fill="#000000" font-weight="bold">Wrong range or logic</text>
  <text x="180" y="182" text-anchor="middle" font-size="15" fill="#000000">Debt-and-growth paper (2010):</text>
  <text x="180" y="202" text-anchor="middle" font-size="15" fill="#000000">average range omitted countries.</text>
  <text x="180" y="222" text-anchor="middle" font-size="15" fill="#000000">Bank risk model (2012): divided</text>
  <text x="180" y="242" text-anchor="middle" font-size="15" fill="#000000">by a sum, not an average.</text>
  <line x1="180" y1="312" x2="480" y2="388" stroke="#222222" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="340" y="80" width="280" height="230" rx="6" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="480" y="160" text-anchor="middle" font-size="17" fill="#000000" font-weight="bold">Silent limits and</text>
  <text x="480" y="182" text-anchor="middle" font-size="17" fill="#000000" font-weight="bold">conversions</text>
  <text x="480" y="202" text-anchor="middle" font-size="15" fill="#000000">Test results (2020): rows beyond</text>
  <text x="480" y="222" text-anchor="middle" font-size="15" fill="#000000">65,536 dropped. Genomics files:</text>
  <text x="480" y="242" text-anchor="middle" font-size="15" fill="#000000">gene names converted into dates.</text>
  <line x1="480" y1="312" x2="480" y2="388" stroke="#222222" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="640" y="80" width="280" height="230" rx="6" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="780" y="162" text-anchor="middle" font-size="17" fill="#000000" font-weight="bold">Hidden content</text>
  <text x="780" y="182" text-anchor="middle" font-size="15" fill="#000000">Acquisition filing (2008):</text>
  <text x="780" y="202" text-anchor="middle" font-size="15" fill="#000000">hidden rows of contracts. Police</text>
  <text x="780" y="222" text-anchor="middle" font-size="15" fill="#000000">FOI release (2023): hidden tab</text>
  <text x="780" y="242" text-anchor="middle" font-size="15" fill="#000000">of staff names.</text>
  <line x1="780" y1="312" x2="480" y2="388" stroke="#222222" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="230" y="392" width="500" height="100" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="480" y="439" text-anchor="middle" font-size="18" fill="#FFFFFF" font-weight="bold">No independent rerun or check</text>
  <text x="480" y="459" text-anchor="middle" font-size="15" fill="#FFFFFF">present in every case, and the reason each error passed</text>
  <text x="480.0" y="530" text-anchor="middle" font-size="14" fill="#333333">Each case is described in the text; dates are when the error occurred or came to light.</text>
</svg>
