<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Hidden layers of a document</title>
  <desc>A stack: visible text on top; beneath it comments, tracked changes and deleted text, hidden and white text, embedded objects and linked data, metadata, previous versions, and AI artefacts such as suggestions and pasted prompts. All travel with the file to an AI request or recipient.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">What travels with a document</text>
  <rect x="110" y="70" width="820" height="56" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="520" y="102" text-anchor="middle" font-size="15" fill="#FFFFFF">Visible text and images: what the author sees and means to send</text>
  <rect x="124" y="136" width="792" height="56" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="520" y="168" text-anchor="middle" font-size="15" fill="#111111">Comments, including resolved ones: reviewers' and AI reviewers' remarks</text>
  <rect x="138" y="202" width="764" height="56" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="146" y="214" width="748" height="30" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="520" y="234" text-anchor="middle" font-size="15" fill="#111111">Tracked changes and deleted text: earlier wording still in the file</text>
  <rect x="152" y="268" width="736" height="56" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="160" y="280" width="720" height="30" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
  <text x="520" y="300" text-anchor="middle" font-size="15" fill="#111111">Hidden, white or tiny text: invisible on screen; read by machines</text>
  <rect x="166" y="334" width="708" height="56" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="174" y="346" width="692" height="30" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="520" y="366" text-anchor="middle" font-size="15" fill="#111111">Embedded objects and linked data: whole spreadsheets behind small tables</text>
  <rect x="180" y="400" width="680" height="56" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="520" y="432" text-anchor="middle" font-size="15" fill="#111111">Metadata: authors, organisation, file paths, template</text>
  <rect x="194" y="466" width="652" height="56" rx="6" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="520" y="498" text-anchor="middle" font-size="15" fill="#222222">Previous versions and AI artefacts: history, suggestions, pasted prompts</text>
  <line x1="60" y1="80" x2="60" y2="520" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="44" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111" transform="rotate(-90 44 300)">less visible</text>
</svg>
