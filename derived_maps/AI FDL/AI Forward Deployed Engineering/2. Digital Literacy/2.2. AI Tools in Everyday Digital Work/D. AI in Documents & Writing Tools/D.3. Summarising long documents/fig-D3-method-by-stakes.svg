<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Choosing a reading approach by stakes</title>
  <desc>Four approaches from quick AI summary for orientation to reading the operative text for formal reliance, with verification increasing as stakes rise.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Stakes decide how far an AI summary can be trusted</text>
  <rect x="40" y="330" width="205" height="150" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="142" y="380" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Orientation</text>
  <text x="142" y="406" text-anchor="middle" font-size="14" fill="#111111">Quick AI summary to</text>
  <text x="142" y="424" text-anchor="middle" font-size="14" fill="#111111">decide whether to read</text>
  <text x="142" y="442" text-anchor="middle" font-size="14" fill="#111111">further</text>
  <rect x="265" y="260" width="205" height="150" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="368" y="310" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Working knowledge</text>
  <text x="368" y="336" text-anchor="middle" font-size="14" fill="#111111">Section digests plus</text>
  <text x="368" y="354" text-anchor="middle" font-size="14" fill="#111111">targeted questions; spot</text>
  <text x="368" y="372" text-anchor="middle" font-size="14" fill="#111111">checks</text>
  <rect x="490" y="190" width="205" height="150" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="498" y="209" width="189" height="111" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="592" y="230" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Consequential</text>
  <text x="592" y="250" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">decision</text>
  <text x="592" y="276" text-anchor="middle" font-size="14" fill="#111111">Layered summary; every</text>
  <text x="592" y="294" text-anchor="middle" font-size="14" fill="#111111">key point verified;</text>
  <text x="592" y="312" text-anchor="middle" font-size="14" fill="#111111">critical sections read</text>
  <rect x="715" y="120" width="205" height="150" rx="6" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="818" y="170" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Formal reliance</text>
  <text x="818" y="196" text-anchor="middle" font-size="14" fill="#111111">Professional reads the</text>
  <text x="818" y="214" text-anchor="middle" font-size="14" fill="#111111">operative text; AI only</text>
  <text x="818" y="232" text-anchor="middle" font-size="14" fill="#111111">for navigation</text>
  <line x1="40" y1="520" x2="920" y2="520" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="480" y="550" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Stakes and reliance on the result →</text>
  <line x1="34" y1="500" x2="34" y2="110" stroke="#222222" stroke-width="2.5" stroke-dasharray="10 6" marker-end="url(#arrow)"/>
  <text x="20" y="100" text-anchor="middle" font-size="1" fill="#111111"></text>
  <text x="60" y="120" text-anchor="start" font-size="15" font-weight="bold" fill="#111111">More verification</text>
  <text x="60" y="140" text-anchor="start" font-size="15" fill="#111111">and more human reading</text>
  <text x="480" y="580" text-anchor="middle" font-size="13" fill="#333333">Schematic.</text>
</svg>
