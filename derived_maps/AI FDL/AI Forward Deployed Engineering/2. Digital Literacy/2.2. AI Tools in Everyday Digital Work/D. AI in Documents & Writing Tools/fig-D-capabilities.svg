<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Four families of AI capability in documents</title>
  <desc>A central box for the document and its accountable author, surrounded by four capability families: generating, transforming, analysing and checking, each with examples and its characteristic failure.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">What AI does inside documents</text>
  <rect x="330" y="235" width="300" height="120" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="480" y="288" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">The document</text>
  <text x="480" y="318" text-anchor="middle" font-size="16" fill="#FFFFFF">and its accountable author</text>
  <rect x="40" y="70" width="300" height="140" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="48" y="100" width="284" height="78" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="190" y="123" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Generating</text>
  <text x="190" y="152" text-anchor="middle" font-size="15" fill="#111111">Draft, insert, continue, outline</text>
  <text x="190" y="171" text-anchor="middle" font-size="15" fill="#111111">Risk: invented specifics</text>
  <rect x="620" y="70" width="300" height="140" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="628" y="90" width="284" height="97" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="770" y="114" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Transforming</text>
  <text x="770" y="142" text-anchor="middle" font-size="15" fill="#111111">Rewrite, tone, shorten,</text>
  <text x="770" y="162" text-anchor="middle" font-size="15" fill="#111111">restructure, translate</text>
  <text x="770" y="181" text-anchor="middle" font-size="15" fill="#111111">Risk: meaning drift</text>
  <rect x="40" y="410" width="300" height="140" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="190" y="454" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Analysing</text>
  <text x="190" y="482" text-anchor="middle" font-size="15" fill="#111111">Summarise, extract actions,</text>
  <text x="190" y="502" text-anchor="middle" font-size="15" fill="#111111">compare</text>
  <text x="190" y="521" text-anchor="middle" font-size="15" fill="#111111">Risk: omission</text>
  <rect x="620" y="410" width="300" height="140" rx="6" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="628" y="440" width="284" height="78" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/>
  <text x="770" y="463" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Checking</text>
  <text x="770" y="492" text-anchor="middle" font-size="15" fill="#111111">Proofread, consistency, critique</text>
  <text x="770" y="511" text-anchor="middle" font-size="15" fill="#111111">Risk: missed facts, flattery</text>
  <line x1="340" y1="200" x2="400" y2="235" stroke="#222222" stroke-width="2.5"/>
  <line x1="620" y1="200" x2="560" y2="235" stroke="#222222" stroke-width="2.5"/>
  <line x1="340" y1="410" x2="400" y2="355" stroke="#222222" stroke-width="2.5"/>
  <line x1="620" y1="410" x2="560" y2="355" stroke="#222222" stroke-width="2.5"/>
</svg>
