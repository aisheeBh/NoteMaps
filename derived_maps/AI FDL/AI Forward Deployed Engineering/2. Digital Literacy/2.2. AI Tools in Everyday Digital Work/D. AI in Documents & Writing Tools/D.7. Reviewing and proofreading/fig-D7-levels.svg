<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Levels of review</title>
  <desc>Four stacked levels from substantive editing at the top, through fact-checking and copy-editing, to proofreading at the bottom, with the unit each examines: whole document, claims, sentences, characters.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Review from the whole down to the character</text>
  <rect x="130.0" y="80" width="640" height="80" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="450" y="113" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Substantive editing</text>
  <text x="450" y="140" text-anchor="middle" font-size="15" fill="#FFFFFF">Purpose, argument, structure</text>
  <text x="936" y="126" text-anchor="end" font-size="15" font-style="italic" fill="#111111">whole document</text>
  <rect x="185.0" y="175" width="530" height="80" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="193.0" y="186" width="514" height="57" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="450" y="208" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Fact-checking</text>
  <text x="450" y="235" text-anchor="middle" font-size="15" fill="#111111">Figures, names, references</text>
  <text x="936" y="221" text-anchor="end" font-size="15" font-style="italic" fill="#111111">claims</text>
  <rect x="240.0" y="270" width="420" height="80" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="450" y="303" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Copy-editing</text>
  <text x="450" y="330" text-anchor="middle" font-size="15" fill="#111111">Clarity, consistency, style</text>
  <text x="936" y="316" text-anchor="end" font-size="15" font-style="italic" fill="#111111">sentences</text>
  <rect x="295.0" y="365" width="310" height="80" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="450" y="398" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Proofreading</text>
  <text x="450" y="425" text-anchor="middle" font-size="15" fill="#111111">Spelling, punctuation, layout</text>
  <text x="936" y="411" text-anchor="end" font-size="15" font-style="italic" fill="#111111">words and characters</text>
  <line x1="50" y1="90" x2="50" y2="440" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="34" y="270" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111" transform="rotate(-90 34 270)">do in this order</text>
  <text x="936" y="70" text-anchor="end" font-size="14" font-weight="bold" fill="#111111">unit examined</text>
</svg>
