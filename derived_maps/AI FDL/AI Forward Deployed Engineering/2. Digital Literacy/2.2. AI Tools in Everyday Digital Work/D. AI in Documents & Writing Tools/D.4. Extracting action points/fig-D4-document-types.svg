<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Kinds of action in different document types</title>
  <desc>For six document types, where actions typically appear: explicitly assigned, as recommendations, or implied by findings.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Where the actions hide</text>
  <rect x="40" y="80" width="300" height="66" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="190" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Minutes and steering papers</text>
  <rect x="360" y="80" width="560" height="66" rx="6" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="640" y="118" text-anchor="middle" font-size="15" fill="#111111">Explicit, mixed with discussion</text>
  <rect x="40" y="160" width="300" height="66" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="190" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Audit and inspection reports</text>
  <rect x="360" y="160" width="560" height="66" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="368" y="177" width="544" height="30" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="640" y="198" text-anchor="middle" font-size="15" fill="#111111">Recommendations and management responses; implied by findings</text>
  <rect x="40" y="240" width="300" height="66" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="190" y="278" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Contracts</text>
  <rect x="360" y="240" width="560" height="66" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="368" y="257" width="544" height="30" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
  <text x="640" y="278" text-anchor="middle" font-size="15" fill="#111111">Conditional obligations for both parties; schedules</text>
  <rect x="40" y="320" width="300" height="66" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="190" y="358" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Policies and procedures</text>
  <rect x="360" y="320" width="560" height="66" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="640" y="358" text-anchor="middle" font-size="15" fill="#111111">Standing duties for roles</text>
  <rect x="40" y="400" width="300" height="66" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="190" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Project documents</text>
  <rect x="360" y="400" width="560" height="66" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="368" y="417" width="544" height="30" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="640" y="438" text-anchor="middle" font-size="15" fill="#111111">Tasks with dependencies and milestones</text>
  <rect x="40" y="480" width="300" height="66" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="190" y="518" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Pasted correspondence</text>
  <rect x="360" y="480" width="560" height="66" rx="6" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="640" y="518" text-anchor="middle" font-size="15" fill="#222222">Commitments made in passing</text>
</svg>
