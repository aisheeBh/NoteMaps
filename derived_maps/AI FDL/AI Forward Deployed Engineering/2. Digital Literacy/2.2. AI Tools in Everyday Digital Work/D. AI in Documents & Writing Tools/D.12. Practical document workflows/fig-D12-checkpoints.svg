<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Checkpoints after AI stages</title>
  <desc>A pipeline of AI stages with human checkpoints placed after each: after drafting, trace facts; after extraction, verify quotations; after rewriting, check invariants; after translation, check numbers and terms; before distribution, inspect file and version.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">A checkpoint after every error-prone AI stage</text>
  <rect x="24" y="100" width="168" height="90" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="32" y="120" width="152" height="49" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="108" y="140" text-anchor="middle" font-size="15" fill="#111111">AI drafts from</text>
  <text x="108" y="159" text-anchor="middle" font-size="15" fill="#111111">sources</text>
  <line x1="108" y1="190" x2="108" y2="240" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="24" y="240" width="168" height="110" rx="6" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="32" y="258" width="152" height="71" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/>
  <text x="108" y="279" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">CHECK</text>
  <text x="108" y="303" text-anchor="middle" font-size="14" fill="#111111">Trace facts and</text>
  <text x="108" y="322" text-anchor="middle" font-size="14" fill="#111111">figures</text>
  <line x1="192" y1="295" x2="210" y2="295" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="210" y="100" width="168" height="90" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="218" y="120" width="152" height="49" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="294" y="140" text-anchor="middle" font-size="15" fill="#111111">AI extracts</text>
  <text x="294" y="159" text-anchor="middle" font-size="15" fill="#111111">actions</text>
  <line x1="294" y1="190" x2="294" y2="240" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="210" y="240" width="168" height="110" rx="6" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="218" y="258" width="152" height="71" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/>
  <text x="294" y="279" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">CHECK</text>
  <text x="294" y="303" text-anchor="middle" font-size="14" fill="#111111">Verify quotations</text>
  <text x="294" y="322" text-anchor="middle" font-size="14" fill="#111111">and owners</text>
  <line x1="378" y1="295" x2="396" y2="295" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="396" y="100" width="168" height="90" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="404" y="129" width="152" height="30" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="480" y="150" text-anchor="middle" font-size="15" fill="#111111">AI rewrites</text>
  <line x1="480" y1="190" x2="480" y2="240" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="396" y="240" width="168" height="110" rx="6" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="404" y="268" width="152" height="53" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/>
  <text x="480" y="288" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">CHECK</text>
  <text x="480" y="313" text-anchor="middle" font-size="14" fill="#111111">Check invariants</text>
  <line x1="564" y1="295" x2="582" y2="295" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="582" y="100" width="168" height="90" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="590" y="129" width="152" height="30" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="666" y="150" text-anchor="middle" font-size="15" fill="#111111">AI translates</text>
  <line x1="666" y1="190" x2="666" y2="240" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="582" y="240" width="168" height="110" rx="6" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="590" y="258" width="152" height="71" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/>
  <text x="666" y="279" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">CHECK</text>
  <text x="666" y="303" text-anchor="middle" font-size="14" fill="#111111">Check numbers and</text>
  <text x="666" y="322" text-anchor="middle" font-size="14" fill="#111111">terms</text>
  <line x1="750" y1="295" x2="768" y2="295" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="768" y="100" width="168" height="90" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="776" y="129" width="152" height="30" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="852" y="150" text-anchor="middle" font-size="15" fill="#111111">Ready to send</text>
  <line x1="852" y1="190" x2="852" y2="240" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="768" y="240" width="168" height="110" rx="6" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="776" y="258" width="152" height="71" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/>
  <text x="852" y="279" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">CHECK</text>
  <text x="852" y="303" text-anchor="middle" font-size="14" fill="#111111">Inspect file;</text>
  <text x="852" y="322" text-anchor="middle" font-size="14" fill="#111111">confirm version</text>
  <rect x="24" y="400" width="912" height="90" rx="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="480" y="437" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Each checkpoint has:</text>
  <text x="480" y="463" text-anchor="middle" font-size="16" fill="#111111">an owner  ·  a method  ·  a record</text>
</svg>
