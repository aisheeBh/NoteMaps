<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Converting a paragraph into a comparison table</title>
  <desc>A paragraph about three suppliers is converted into a table. Checks: a cell the paragraph never stated (invented), a range flattened to a single value, and correct cells.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Prose to table: what to check</text>
  <rect x="40" y="70" width="880" height="110" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="52" y="120" text-anchor="start" font-size="15" fill="#111111">Supplier A quotes about £40,000, depending on scope, with delivery in six weeks. Supplier B is cheaper at</text>
  <text x="52" y="139" text-anchor="start" font-size="15" fill="#111111">£32,000 but has missed deadlines before. Supplier C quotes £45,000 and offers the strongest support.</text>
  <line x1="480" y1="185" x2="480" y2="225" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="40" y="230" width="160" height="44" rx="0" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="120" y="257" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Supplier</text>
  <rect x="200" y="230" width="200" height="44" rx="0" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="300" y="257" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Price</text>
  <rect x="400" y="230" width="200" height="44" rx="0" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="500" y="257" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Delivery</text>
  <rect x="600" y="230" width="320" height="44" rx="0" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="760" y="257" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Track record / support</text>
  <rect x="40" y="274" width="160" height="56" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="120" y="306" text-anchor="middle" font-size="15" fill="#111111">A</text>
  <rect x="200" y="274" width="200" height="56" rx="0" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="208" y="286" width="184" height="30" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="300" y="306" text-anchor="middle" font-size="15" fill="#111111">£40,000</text>
  <rect x="400" y="274" width="200" height="56" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="500" y="306" text-anchor="middle" font-size="15" fill="#111111">6 weeks</text>
  <rect x="600" y="274" width="320" height="56" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="760" y="306" text-anchor="middle" font-size="15" fill="#111111">—</text>
  <rect x="40" y="330" width="160" height="56" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="120" y="362" text-anchor="middle" font-size="15" fill="#111111">B</text>
  <rect x="200" y="330" width="200" height="56" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="300" y="362" text-anchor="middle" font-size="15" fill="#111111">£32,000</text>
  <rect x="400" y="330" width="200" height="56" rx="0" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="408" y="342" width="184" height="30" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
  <text x="500" y="362" text-anchor="middle" font-size="15" fill="#111111">4 weeks</text>
  <rect x="600" y="330" width="320" height="56" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="760" y="362" text-anchor="middle" font-size="15" fill="#111111">Missed deadlines before</text>
  <rect x="40" y="386" width="160" height="56" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="120" y="418" text-anchor="middle" font-size="15" fill="#111111">C</text>
  <rect x="200" y="386" width="200" height="56" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="300" y="418" text-anchor="middle" font-size="15" fill="#111111">£45,000</text>
  <rect x="400" y="386" width="200" height="56" rx="0" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="500" y="418" text-anchor="middle" font-size="15" fill="#111111">NOT STATED</text>
  <rect x="600" y="386" width="320" height="56" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="760" y="418" text-anchor="middle" font-size="15" fill="#111111">Strongest support</text>
  <rect x="40" y="460" width="280" height="100" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="48" y="473" width="264" height="71" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="180" y="494" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Flattened range</text>
  <text x="180" y="518" text-anchor="middle" font-size="14" fill="#111111">"about £40,000, depending on</text>
  <text x="180" y="537" text-anchor="middle" font-size="14" fill="#111111">scope" lost its qualification</text>
  <rect x="340" y="460" width="280" height="100" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="348" y="473" width="264" height="71" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
  <text x="480" y="494" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Invented cell</text>
  <text x="480" y="518" text-anchor="middle" font-size="14" fill="#111111">B's delivery time was never stated</text>
  <text x="480" y="537" text-anchor="middle" font-size="14" fill="#111111">in the paragraph</text>
  <rect x="640" y="460" width="280" height="100" rx="6" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="648" y="473" width="264" height="71" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/>
  <text x="780" y="494" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Correct gap</text>
  <text x="780" y="518" text-anchor="middle" font-size="14" fill="#111111">C's delivery shown as NOT STATED,</text>
  <text x="780" y="537" text-anchor="middle" font-size="14" fill="#111111">not guessed</text>
  <text x="480" y="590" text-anchor="middle" font-size="13" fill="#333333">Illustrative figures.</text>
</svg>
