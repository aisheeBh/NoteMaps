<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Which kind of software suits the task</title>
  <desc>A two by two grid. Horizontal axis how open-ended the input and output are, low to high. Vertical axis how much exactness the result needs, low to high. Quadrants: traditional software for exact closed tasks; hybrid with grounding and code for exact open tasks; simple automation for closed low-stakes tasks; generative AI with review for open low-exactness tasks.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Which kind of software suits the task</text>
  <rect x="176" y="82" width="358" height="198" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="355" y="178" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Traditional software</text>
  <text x="355" y="199" text-anchor="middle" font-size="14.5" fill="#111111">Payroll, ledgers, tax rules, access control.</text>
  <rect x="546" y="82" width="358" height="198" rx="8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="554" y="148" width="342" height="69" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="725" y="169" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Hybrid: model plus code</text>
  <text x="725" y="190" text-anchor="middle" font-size="14.5" fill="#111111">Contract queries with exact figures; policy</text>
  <text x="725" y="209" text-anchor="middle" font-size="14.5" fill="#111111">answers grounded in source text.</text>
  <rect x="176" y="292" width="358" height="198" rx="8" fill="#E6E6E6" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="355" y="388" text-anchor="middle" font-size="17" font-weight="bold" fill="#222222">Simple automation</text>
  <text x="355" y="409" text-anchor="middle" font-size="14.5" fill="#222222">Routing, reminders, fixed templates.</text>
  <rect x="546" y="292" width="358" height="198" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <text x="725" y="388" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Generative AI with review</text>
  <text x="725" y="409" text-anchor="middle" font-size="14.5" fill="#111111">Drafts, summaries, brainstorming, rewording.</text>
  <line x1="170" y1="512" x2="910" y2="512" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="540" y="542" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">How open-ended the input and output are</text>
  <text x="170" y="542" text-anchor="start" font-size="14" fill="#111111">Closed, structured</text>
  <text x="910" y="542" text-anchor="end" font-size="14" fill="#111111">Open, unstructured</text>
  <line x1="154" y1="496" x2="154" y2="76" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="126" y="286" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111" transform="rotate(-90 126 286)">Exactness the result needs</text>
  <text x="100" y="496" text-anchor="start" font-size="14" fill="#111111" transform="rotate(-90 100 496)">Approximate</text>
  <text x="100" y="76" text-anchor="end" font-size="14" fill="#111111" transform="rotate(-90 100 76)">Exact</text>
</svg>
