<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Three ways to reduce identifiability</title>
  <desc>Three panels: redaction removes details; pseudonymisation replaces identifiers with codes and remains personal data; anonymisation irreversibly prevents identification and is hard to achieve.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Three ways to reduce identifiability</text>
  <rect x="24" y="70" width="275" height="268" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <rect x="24" y="70" width="275" height="38" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="161" y="98" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Redaction</text>
  <circle cx="40" cy="131" r="3.2" fill="#111111"/>
  <text x="50" y="136" text-anchor="start" font-size="14" fill="#111111">Removes names, numbers,</text>
  <text x="50" y="156" text-anchor="start" font-size="14" fill="#111111">addresses</text>
  <circle cx="40" cy="177" r="3.2" fill="#111111"/>
  <text x="50" y="182" text-anchor="start" font-size="14" fill="#111111">Simple and quick</text>
  <circle cx="40" cy="204" r="3.2" fill="#111111"/>
  <text x="50" y="208" text-anchor="start" font-size="14" fill="#111111">Indirect details may still</text>
  <text x="50" y="228" text-anchor="start" font-size="14" fill="#111111">identify</text>
  <circle cx="40" cy="250" r="3.2" fill="#111111"/>
  <text x="50" y="254" text-anchor="start" font-size="14" fill="#111111">Status depends on what remains</text>
  <line x1="304" y1="204" x2="338" y2="204" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="343" y="70" width="275" height="268" rx="8" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="343" y="70" width="275" height="38" rx="8" fill="#FFFFFF" stroke="#7A5200" stroke-width="2"/>
  <text x="480" y="98" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Pseudonymisation</text>
  <circle cx="359" cy="131" r="3.2" fill="#111111"/>
  <text x="369" y="136" text-anchor="start" font-size="14" fill="#111111">Replaces identifiers with</text>
  <text x="369" y="156" text-anchor="start" font-size="14" fill="#111111">codes, such as Customer A</text>
  <circle cx="359" cy="177" r="3.2" fill="#111111"/>
  <text x="369" y="182" text-anchor="start" font-size="14" fill="#111111">Key kept separately and</text>
  <text x="369" y="202" text-anchor="start" font-size="14" fill="#111111">securely</text>
  <circle cx="359" cy="223" r="3.2" fill="#111111"/>
  <text x="369" y="228" text-anchor="start" font-size="14" fill="#111111">Still personal data under the</text>
  <text x="369" y="248" text-anchor="start" font-size="14" fill="#111111">GDPR</text>
  <circle cx="359" cy="269" r="3.2" fill="#111111"/>
  <text x="369" y="274" text-anchor="start" font-size="14" fill="#111111">Reversible by whoever holds the</text>
  <text x="369" y="294" text-anchor="start" font-size="14" fill="#111111">key</text>
  <line x1="622" y1="204" x2="656" y2="204" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="661" y="70" width="275" height="268" rx="8" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <rect x="661" y="70" width="275" height="38" rx="8" fill="#FFFFFF" stroke="#1E5E24" stroke-width="3"/>
  <text x="799" y="98" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Anonymisation</text>
  <circle cx="677" cy="131" r="3.2" fill="#111111"/>
  <text x="687" y="136" text-anchor="start" font-size="14" fill="#111111">Irreversibly prevents</text>
  <text x="687" y="156" text-anchor="start" font-size="14" fill="#111111">identification</text>
  <circle cx="677" cy="177" r="3.2" fill="#111111"/>
  <text x="687" y="182" text-anchor="start" font-size="14" fill="#111111">Outside data-protection law if</text>
  <text x="687" y="202" text-anchor="start" font-size="14" fill="#111111">genuine</text>
  <circle cx="677" cy="223" r="3.2" fill="#111111"/>
  <text x="687" y="228" text-anchor="start" font-size="14" fill="#111111">Hard: combinations of details</text>
  <text x="687" y="248" text-anchor="start" font-size="14" fill="#111111">identify</text>
  <circle cx="677" cy="269" r="3.2" fill="#111111"/>
  <text x="687" y="274" text-anchor="start" font-size="14" fill="#111111">Must consider who could</text>
  <text x="687" y="294" text-anchor="start" font-size="14" fill="#111111">recognise people</text>
</svg>
