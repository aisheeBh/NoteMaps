<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Broadband speed versus line length</title>
  <desc>Schematic chart: speed on the vertical axis against length of the copper line on the horizontal axis. DSL over copper starts high when the line is short and falls steeply as the line gets longer. Full fibre stays high and flat across the distances shown.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Copper slows with distance; fibre does not</text>
  <line x1="120" y1="450" x2="880" y2="450" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="450" x2="120" y2="90" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="500.0" y="490" text-anchor="middle" font-size="15" fill="#111111">Length of line from cabinet or exchange (schematic)</text>
  <text x="70" y="270.0" text-anchor="middle" font-size="15" fill="#111111" transform="rotate(-90 70 270.0)">Achievable speed</text>
  <text x="120" y="470" text-anchor="middle" font-size="14" fill="#111111">short</text>
  <text x="880" y="470" text-anchor="middle" font-size="14" fill="#111111">long</text>
  <path d="M120.0 161.2 L127.6 170.0 L135.2 178.6 L142.8 186.9 L150.4 194.9 L158.0 202.7 L165.6 210.3 L173.2 217.6 L180.8 224.6 L188.4 231.5 L196.0 238.1 L203.6 244.5 L211.2 250.7 L218.8 256.8 L226.4 262.6 L234.0 268.2 L241.6 273.7 L249.2 279.0 L256.8 284.2 L264.4 289.1 L272.0 293.9 L279.6 298.6 L287.2 303.1 L294.8 307.5 L302.4 311.7 L310.0 315.8 L317.6 319.8 L325.2 323.7 L332.8 327.4 L340.4 331.0 L348.0 334.5 L355.6 337.9 L363.2 341.1 L370.8 344.3 L378.4 347.4 L386.0 350.4 L393.6 353.3 L401.2 356.1 L408.8 358.8 L416.4 361.4 L424.0 363.9 L431.6 366.4 L439.2 368.8 L446.8 371.1 L454.4 373.3 L462.0 375.5 L469.6 377.6 L477.2 379.6 L484.8 381.6 L492.4 383.5 L500.0 385.3 L507.6 387.1 L515.2 388.8 L522.8 390.5 L530.4 392.1 L538.0 393.7 L545.6 395.2 L553.2 396.7 L560.8 398.1 L568.4 399.5 L576.0 400.8 L583.6 402.1 L591.2 403.4 L598.8 404.6 L606.4 405.8 L614.0 406.9 L621.6 408.0 L629.2 409.1 L636.8 410.1 L644.4 411.1 L652.0 412.1 L659.6 413.0 L667.2 414.0 L674.8 414.8 L682.4 415.7 L690.0 416.5 L697.6 417.3 L705.2 418.1 L712.8 418.9 L720.4 419.6 L728.0 420.3 L735.6 421.0 L743.2 421.6 L750.8 422.3 L758.4 422.9 L766.0 423.5 L773.6 424.1 L781.2 424.6 L788.8 425.2 L796.4 425.7 L804.0 426.2 L811.6 426.7 L819.2 427.2 L826.8 427.7 L834.4 428.1 L842.0 428.6 L849.6 429.0 L857.2 429.4 L864.8 429.8 L872.4 430.2 L880.0 430.6" fill="none" stroke="#7A5200" stroke-width="3.5" stroke-dasharray="10 6"/>
  <path d="M120 118.80000000000001 L880 118.80000000000001" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <rect x="674.25" y="89.80000000000001" width="191.50000000000003" height="22" fill="#FFFFFF"/>
  <text x="770" y="104.80000000000001" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Full fibre: stays high</text>
  <rect x="241.875" y="265" width="216.25000000000003" height="22" fill="#FFFFFF"/>
  <text x="350" y="280" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Copper DSL: falls steeply</text>
  <text x="480.0" y="520" text-anchor="middle" font-size="13" fill="#333333">Schematic shape only; not plotted from a single dataset. Real speeds depend on line quality and technology.</text>
</svg>
