  <line x1="120" y1="450" x2="120" y2="90" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="480.0" y="490" text-anchor="middle" font-size="15" fill="#111111">Number of users (n)</text>
  <text x="70" y="270.0" text-anchor="middle" font-size="15" fill="#111111" transform="rotate(-90 70 270.0)">Value (arbitrary units)</text>
