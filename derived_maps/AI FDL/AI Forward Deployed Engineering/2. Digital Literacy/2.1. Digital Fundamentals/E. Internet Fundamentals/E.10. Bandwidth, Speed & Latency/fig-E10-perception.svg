<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Response-time thresholds</title>
  <desc>A horizontal logarithmic time axis from 10 milliseconds to 100 seconds with three marked thresholds: about 0.1 second feels instantaneous; about 1 second keeps the flow of thought but is noticed; about 10 seconds loses attention.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480.0" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">How long users will wait</text>
  <rect x="100.0" y="150" width="190.0" height="60" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="290.0" y="150" width="190.0" height="60" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="480.0" y="150" width="190.0" height="60" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="670.0" y="150" width="190.0" height="60" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="136.375" y="171" width="117.25000000000001" height="22" fill="#FFFFFF"/>
  <text x="195.0" y="186" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">feels instant</text>
  <rect x="305.75" y="171" width="158.5" height="22" fill="#FFFFFF"/>
  <text x="385.0" y="186" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">noticed, flow kept</text>
  <rect x="504.0" y="171" width="142.0" height="22" fill="#FFFFFF"/>
  <text x="575.0" y="186" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">flow interrupted</text>
  <rect x="702.25" y="171" width="125.50000000000001" height="22" fill="#FFFFFF"/>
  <text x="765.0" y="186" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">attention lost</text>
  <line x1="100" y1="240" x2="860" y2="240" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="100.0" y1="234" x2="100.0" y2="246" stroke="#222222" stroke-width="2"/>
  <text x="100.0" y="268" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">10 ms</text>
  <line x1="290.0" y1="234" x2="290.0" y2="246" stroke="#222222" stroke-width="2"/>
  <text x="290.0" y="268" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">0.1 s</text>
  <line x1="480.0" y1="234" x2="480.0" y2="246" stroke="#222222" stroke-width="2"/>
  <text x="480.0" y="268" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">1 s</text>
  <line x1="670.0" y1="234" x2="670.0" y2="246" stroke="#222222" stroke-width="2"/>
  <text x="670.0" y="268" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">10 s</text>
  <line x1="860.0" y1="234" x2="860.0" y2="246" stroke="#222222" stroke-width="2"/>
  <text x="860.0" y="268" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">100 s</text>
  <text x="480" y="300" text-anchor="middle" font-size="15" fill="#111111">Response time (logarithmic scale)</text>
  <rect x="100" y="330" width="760" height="70" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="480.0" y="360.25" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Each network round trip uses part of the budget:</text>
  <text x="480.0" y="380.25" text-anchor="middle" font-size="15" fill="#111111">ten round trips of 100 ms each already reach one second.</text>
  <text x="480.0" y="448" text-anchor="middle" font-size="13" fill="#333333">Thresholds after Jakob Nielsen (1993), drawing on earlier human-factors research; approximate.</text>
</svg>
