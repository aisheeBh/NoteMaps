<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Hardware life compared with update support</title>
  <desc>Three horizontal bars compare how long a phone's hardware can keep working with how long it receives security updates. For an older budget phone, hardware lasts well beyond its short update period, leaving years of unsafe use. A phone with a long update promise has support covering most of its hardware life. A third bar shows the typical physical life of the hardware alone.</desc>
  <defs>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">When updates stop before the hardware does</text>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="300" y="80">0</text><text x="400" y="80">2</text><text x="500" y="80">4</text><text x="600" y="80">6</text><text x="700" y="80">8</text>
    <text x="500" y="62" font-size="15">years after purchase</text>
  </g>
  <g stroke="#BBBBBB" stroke-dasharray="3 4">
    <line x1="300" y1="88" x2="300" y2="420"/><line x1="400" y1="88" x2="400" y2="420"/><line x1="500" y1="88" x2="500" y2="420"/><line x1="600" y1="88" x2="600" y2="420"/><line x1="700" y1="88" x2="700" y2="420"/>
  </g>

  <g font-size="15" fill="#111111" text-anchor="end" font-weight="bold">
    <text x="285" y="135">Older budget phone</text>
    <text x="285" y="245">Long-support phone</text>
    <text x="285" y="355">Hardware alone</text>
  </g>
  <!-- row1 -->
  <rect x="300" y="110" width="125" height="40" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="425" y="110" width="200" height="40" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="440" y="120" width="170" height="22" fill="#FFFFFF"/>
  <text x="525" y="136" text-anchor="middle" font-size="14" fill="#111111">works, but unpatched</text>
  <rect x="308" y="120" width="110" height="22" fill="#FFFFFF"/>
  <text x="363" y="136" text-anchor="middle" font-size="14" fill="#111111">updates</text>
  <!-- row2 -->
  <rect x="300" y="220" width="325" height="40" fill="url(#cross)" stroke="#1E5E24" stroke-width="2.5"/>
  <rect x="380" y="230" width="170" height="22" fill="#FFFFFF"/>
  <text x="465" y="246" text-anchor="middle" font-size="14" fill="#111111">updates for most of its life</text>
  <!-- row3 -->
  <rect x="300" y="330" width="325" height="40" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="463" y="356" text-anchor="middle" font-size="14" fill="#111111">typical physical life with one battery replacement</text>

  <rect x="300" y="440" width="24" height="18" fill="url(#cross)" stroke="#1E5E24" stroke-width="2"/>
  <text x="332" y="454" font-size="14" fill="#111111">security updates supplied</text>
  <rect x="560" y="440" width="24" height="18" fill="url(#lines)" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="592" y="454" font-size="14" fill="#111111">no updates: unsafe for work and banking</text>
  <text x="920" y="505" text-anchor="end" font-size="13" fill="#111111">Schematic; illustrative durations, not data for particular models.</text>
</svg>
