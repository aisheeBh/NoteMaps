<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>A correctly arranged desktop workstation, side view</title>
  <desc>Side view of a seated person at a desk. The top of the monitor is level with or slightly below the eyes and about an arm's length away. Elbows are at about desk height with forearms level and wrists straight. The chair supports the lower back and the feet rest flat on the floor. The tower sits beside the desk with its vents clear.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">The fixed workstation, seen from the side</text>

  <!-- floor -->
  <line x1="60" y1="530" x2="900" y2="530" stroke="#222222" stroke-width="3"/>
  <!-- desk -->
  <rect x="380" y="330" width="420" height="14" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="780" y="344" width="14" height="186" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <!-- monitor -->
  <rect x="690" y="170" width="18" height="130" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>
  <rect x="680" y="300" width="40" height="30" fill="#555555" stroke="#000000" stroke-width="1.5"/>
  <!-- keyboard -->
  <rect x="470" y="320" width="90" height="10" fill="#333333"/>
  <!-- chair -->
  <rect x="200" y="380" width="170" height="18" fill="#E6E6E6" stroke="#333333" stroke-width="2"/>
  <rect x="180" y="250" width="20" height="148" fill="#E6E6E6" stroke="#333333" stroke-width="2"/>
  <line x1="285" y1="398" x2="285" y2="510" stroke="#333333" stroke-width="5"/>
  <line x1="230" y1="515" x2="340" y2="515" stroke="#333333" stroke-width="5"/>
  <!-- person -->
  <circle cx="250" cy="160" r="34" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <line x1="240" y1="195" x2="225" y2="375" stroke="#111111" stroke-width="6"/>
  <line x1="232" y1="250" x2="300" y2="330" stroke="#111111" stroke-width="5"/>
  <line x1="300" y1="330" x2="470" y2="325" stroke="#111111" stroke-width="5"/>
  <line x1="225" y1="375" x2="390" y2="375" stroke="#111111" stroke-width="6"/>
  <line x1="390" y1="375" x2="395" y2="525" stroke="#111111" stroke-width="6"/>
  <line x1="395" y1="525" x2="440" y2="525" stroke="#111111" stroke-width="6"/>
  <!-- tower -->
  <rect x="820" y="400" width="60" height="130" rx="4" fill="#1F3B5C" stroke="#000000" stroke-width="2"/>

  <!-- sight line -->
  <line x1="275" y1="155" x2="686" y2="180" stroke="#222222" stroke-width="2" stroke-dasharray="10 6" marker-end="url(#arrow)"/>

  <!-- labels -->
  <g font-size="15" fill="#111111">
    <rect x="560" y="70" width="330" height="70" fill="#FFFFFF" stroke="#BBBBBB"/>
    <text x="572" y="96">Top of screen at or slightly below</text>
    <text x="572" y="118">eye level, about an arm's length away</text>
    <rect x="330" y="230" width="230" height="50" fill="#FFFFFF" stroke="#BBBBBB"/>
    <text x="342" y="252">Forearms level, elbows</text>
    <text x="342" y="272">near desk height, wrists straight</text>
    <rect x="40" y="420" width="140" height="70" fill="#FFFFFF" stroke="#BBBBBB"/>
    <text x="50" y="444">Lower back</text>
    <text x="50" y="464">supported;</text>
    <text x="50" y="484">seat adjustable</text>
    <rect x="450" y="450" width="240" height="50" fill="#FFFFFF" stroke="#BBBBBB"/>
    <text x="462" y="472">Feet flat on the floor</text>
    <text x="462" y="492">or on a footrest</text>
    <rect x="770" y="350" width="0" height="0" fill="none"/>
    <text x="850" y="390" text-anchor="middle">vents clear</text>
  </g>
</svg>
