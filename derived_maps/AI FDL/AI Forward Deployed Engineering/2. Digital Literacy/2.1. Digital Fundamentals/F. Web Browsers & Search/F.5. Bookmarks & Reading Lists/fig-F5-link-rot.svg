<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Link rot by year</title>
  <desc>Bar chart from Pew Research Center 2024: about 38 per cent of pages that existed in 2013 were no longer accessible in late 2023; about a quarter of all pages from 2013 to 2023; about 8 per cent of pages from 2023.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Pages no longer accessible in late 2023</text>
  <text x="280.0" y="120.0" text-anchor="end" font-size="16" font-weight="bold" fill="#111111">Pages from 2013</text>
  <rect x="290.0" y="90.0" width="494.0" height="50.0" rx="2" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="792.0" y="120.0" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">about 38%</text>
  <text x="280.0" y="200.0" text-anchor="end" font-size="16" font-weight="bold" fill="#111111">All pages, 2013 to 2023</text>
  <rect x="290.0" y="170.0" width="325.0" height="50.0" rx="2" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <text x="623.0" y="200.0" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">about 25%</text>
  <text x="280.0" y="280.0" text-anchor="end" font-size="16" font-weight="bold" fill="#111111">Pages from 2023</text>
  <rect x="290.0" y="250.0" width="104.0" height="50.0" rx="2" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="402.0" y="280.0" text-anchor="start" font-size="16" font-weight="bold" fill="#111111">about 8%</text>
  <text x="480.0" y="380.0" text-anchor="middle" font-size="13" fill="#333333">Source: Pew Research Center, When Online Content Disappears (May 2024), sample of pages checked in late 2023.</text>
</svg>
