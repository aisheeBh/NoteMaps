<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Where to save a page</title>
  <desc>Two by two matrix. Horizontal axis: how long the page is needed, from short to long. Vertical axis: how certain reuse is, from uncertain to certain. Short and certain: keep the tab open. Long and certain: bookmark. Short and uncertain: reading list. Long and uncertain: rely on history and search, or archive if it is evidence.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Choosing where to save a page</text>
  <rect x="170.0" y="70.0" width="330.0" height="200.0" rx="0" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="500.0" y="70.0" width="330.0" height="200.0" rx="0" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <rect x="170.0" y="270.0" width="330.0" height="200.0" rx="0" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="500.0" y="270.0" width="330.0" height="200.0" rx="0" fill="#E6E6E6" stroke="#666666" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="335.0" y="156.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">Open tab</text>
  <text x="335.0" y="182.0" text-anchor="middle" font-size="15" fill="#111111">the task in progress</text>
  <text x="335.0" y="204.0" text-anchor="middle" font-size="15" fill="#111111">minutes to days</text>
  <text x="665.0" y="156.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">Bookmark</text>
  <text x="665.0" y="182.0" text-anchor="middle" font-size="15" fill="#111111">clear title, right folder</text>
  <text x="665.0" y="204.0" text-anchor="middle" font-size="15" fill="#111111">months to years</text>
  <text x="335.0" y="356.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">Reading list</text>
  <text x="335.0" y="382.0" text-anchor="middle" font-size="15" fill="#111111">read soon or delete</text>
  <text x="335.0" y="404.0" text-anchor="middle" font-size="15" fill="#111111">days to weeks</text>
  <text x="665.0" y="356.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">History and search</text>
  <text x="665.0" y="382.0" text-anchor="middle" font-size="15" fill="#111111">archive a copy if it</text>
  <text x="665.0" y="404.0" text-anchor="middle" font-size="15" fill="#111111">is evidence</text>
  <line x1="170.0" y1="500.0" x2="830.0" y2="500.0" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="500.0" y="525.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">How long the page is needed: short to long</text>
  <line x1="140.0" y1="470.0" x2="140.0" y2="70.0" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="125" y="270.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111" transform="rotate(-90 125 270.0)">How certain reuse is: low to high</text>
</svg>
