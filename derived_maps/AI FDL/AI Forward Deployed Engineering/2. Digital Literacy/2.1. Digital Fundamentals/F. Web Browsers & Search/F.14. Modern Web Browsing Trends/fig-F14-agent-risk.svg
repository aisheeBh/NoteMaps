<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Delegation to browsing agents</title>
  <desc>Two by two matrix. Horizontal axis: data sensitivity, public to private. Vertical axis: consequence of an error, from reversible to irreversible. Public and reversible: delegate then verify. Private and reversible: only in a restricted setup. Public and irreversible: confirm before acting. Private and irreversible: keep human.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">When to delegate a task to a browsing agent</text>
  <rect x="170.0" y="70.0" width="330.0" height="200.0" rx="0" fill="#FFE6A8" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="500.0" y="70.0" width="330.0" height="200.0" rx="0" fill="#F6CACA" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="170.0" y="270.0" width="330.0" height="200.0" rx="0" fill="#D3ECD3" stroke="#1E5E24" stroke-width="3"/>
  <rect x="500.0" y="270.0" width="330.0" height="200.0" rx="0" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="335.0" y="156.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">Confirm before acting</text>
  <text x="335.0" y="182.0" text-anchor="middle" font-size="15" fill="#111111">e.g. buying a ticket</text>
  <text x="335.0" y="204.0" text-anchor="middle" font-size="15" fill="#111111">from a public site</text>
  <text x="665.0" y="156.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">Keep human</text>
  <text x="665.0" y="182.0" text-anchor="middle" font-size="15" fill="#111111">e.g. changing supplier</text>
  <text x="665.0" y="204.0" text-anchor="middle" font-size="15" fill="#111111">bank details</text>
  <text x="335.0" y="356.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">Delegate, then verify</text>
  <text x="335.0" y="382.0" text-anchor="middle" font-size="15" fill="#111111">e.g. comparing</text>
  <text x="335.0" y="404.0" text-anchor="middle" font-size="15" fill="#111111">published prices</text>
  <text x="665.0" y="356.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">Only in a restricted setup</text>
  <text x="665.0" y="382.0" text-anchor="middle" font-size="15" fill="#111111">e.g. sorting files in a</text>
  <text x="665.0" y="404.0" text-anchor="middle" font-size="15" fill="#111111">separate, limited account</text>
  <line x1="170.0" y1="500.0" x2="830.0" y2="500.0" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="500.0" y="525.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Data sensitivity: public to private</text>
  <line x1="140.0" y1="470.0" x2="140.0" y2="70.0" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="125" y="270.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111" transform="rotate(-90 125 270.0)">Consequence of error: reversible to irreversible</text>
  <text x="480.0" y="565.0" text-anchor="middle" font-size="13" fill="#333333">Guidance for current tools, which remain vulnerable to prompt injection.</text>
</svg>
