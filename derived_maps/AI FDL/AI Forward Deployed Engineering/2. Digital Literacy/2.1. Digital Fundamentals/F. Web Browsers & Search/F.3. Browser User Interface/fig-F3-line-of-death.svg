<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>The line of death</title>
  <desc>A browser window: the tab strip and address bar above a heavy horizontal line are drawn by the browser and trusted; the page below the line, including a padlock image, a logo and a fake login pop-up, is drawn by the site and may be forged.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Trusted interface above the line, untrusted content below</text>
  <rect x="80.0" y="60.0" width="800.0" height="450.0" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <rect x="80.0" y="60.0" width="800.0" height="110.0" rx="8" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="100.0" y="72.0" width="180.0" height="34.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="190.0" y="93.2" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">Tab: Sign in</text>
  <rect x="100.0" y="118.0" width="520.0" height="38.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="360.0" y="141.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">site-info icon   accounts.example.com/login</text>
  <rect x="640.0" y="118.0" width="220.0" height="38.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="750.0" y="141.2" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">toolbar and menu</text>
  <line x1="60.0" y1="176.0" x2="900.0" y2="176.0" stroke="#000000" stroke-width="5"/>
  <text x="870.0" y="200.0" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">the line of death</text>
  <text x="300.0" y="205.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Drawn by the BROWSER above: trustworthy</text>
  <text x="300.0" y="232.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Drawn by the PAGE below: may be faked</text>
  <rect x="110.0" y="260.0" width="240.0" height="60.0" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="156.8" y="267.8" width="146.5" height="45.0" fill="#FFFFFF"/>
  <text x="230.0" y="284.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Padlock picture</text>
  <text x="230.0" y="304.2" text-anchor="middle" font-size="15" fill="#111111">just an image</text>
  <rect x="110.0" y="340.0" width="240.0" height="60.0" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="148.1" y="347.8" width="163.9" height="45.0" fill="#FFFFFF"/>
  <text x="230.0" y="364.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Company logo</text>
  <text x="230.0" y="384.2" text-anchor="middle" font-size="15" fill="#111111">copied in seconds</text>
  <rect x="110.0" y="420.0" width="240.0" height="60.0" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="152.4" y="427.8" width="155.2" height="45.0" fill="#FFFFFF"/>
  <text x="230.0" y="444.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">"Verified" badge</text>
  <text x="230.0" y="464.2" text-anchor="middle" font-size="15" fill="#111111">means nothing</text>
  <rect x="420.0" y="260.0" width="420.0" height="220.0" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="440.0" y="275.0" width="380.0" height="34.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="630.0" y="296.2" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">fake pop-up: accounts.example.com</text>
  <rect x="470.0" y="330.0" width="320.0" height="40.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="630.0" y="354.2" text-anchor="middle" font-size="14" fill="#000000">Email</text>
  <rect x="470.0" y="385.0" width="320.0" height="40.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="630.0" y="409.2" text-anchor="middle" font-size="14" fill="#000000">Password</text>
  <rect x="560.0" y="437.0" width="140.0" height="32.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="630.0" y="457.2" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">Sign in</text>
  <text x="480.0" y="540.0" text-anchor="middle" font-size="13" fill="#333333">A fake window drawn inside the page cannot be dragged outside the browser window.</text>
</svg>
