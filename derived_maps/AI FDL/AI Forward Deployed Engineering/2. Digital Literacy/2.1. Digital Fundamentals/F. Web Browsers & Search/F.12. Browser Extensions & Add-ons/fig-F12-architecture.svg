<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <title>Extension architecture</title>
  <desc>An extension package containing a manifest, a background service worker, a pop-up interface and storage, connected to browser features such as tabs, cookies and history, and injecting content scripts into web pages where it can read and change content.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>
  <text x="480.0" y="38.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">The parts of an extension and what they can reach</text>
  <rect x="40.0" y="70.0" width="420.0" height="420.0" rx="10" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2"/>
  <text x="250.0" y="98.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">Extension package</text>
  <rect x="70.0" y="120.0" width="360.0" height="60.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="250.0" y="144.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Manifest</text>
  <text x="250.0" y="164.2" text-anchor="middle" font-size="15" fill="#000000">declares permissions and parts</text>
  <rect x="70.0" y="200.0" width="360.0" height="70.0" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="250.0" y="229.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Background service worker</text>
  <text x="250.0" y="249.2" text-anchor="middle" font-size="15" fill="#FFFFFF">reacts to browser events</text>
  <rect x="70.0" y="290.0" width="170.0" height="80.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="155.0" y="324.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Pop-up and</text>
  <text x="155.0" y="344.2" text-anchor="middle" font-size="15" fill="#000000">options pages</text>
  <rect x="260.0" y="290.0" width="170.0" height="80.0" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="345.0" y="324.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Extension</text>
  <text x="345.0" y="344.2" text-anchor="middle" font-size="15" fill="#000000">storage</text>
  <rect x="70.0" y="390.0" width="360.0" height="80.0" rx="6" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="94.1" y="407.8" width="311.8" height="45.0" fill="#FFFFFF"/>
  <text x="250.0" y="424.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Content scripts</text>
  <text x="250.0" y="444.2" text-anchor="middle" font-size="15" fill="#111111">packaged here, injected into pages</text>
  <rect x="560.0" y="100.0" width="360.0" height="120.0" rx="6" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="623.2" y="128.0" width="233.5" height="64.5" fill="#FFFFFF"/>
  <text x="740.0" y="145.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Browser features</text>
  <text x="740.0" y="164.5" text-anchor="middle" font-size="15" fill="#111111">tabs, history, bookmarks,</text>
  <text x="740.0" y="184.0" text-anchor="middle" font-size="15" fill="#111111">cookies, downloads</text>
  <rect x="560.0" y="300.0" width="360.0" height="190.0" rx="6" fill="url(#lines)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="627.6" y="333.8" width="224.8" height="123.0" fill="#FFFFFF"/>
  <text x="740.0" y="350.8" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Web pages</text>
  <text x="740.0" y="370.2" text-anchor="middle" font-size="15" fill="#111111">email, banking, intranet</text>
  <text x="740.0" y="389.8" text-anchor="middle" font-size="15" fill="#111111"></text>
  <text x="740.0" y="409.2" text-anchor="middle" font-size="15" fill="#111111">content scripts can read</text>
  <text x="740.0" y="428.8" text-anchor="middle" font-size="15" fill="#111111">and change what is shown</text>
  <text x="740.0" y="448.2" text-anchor="middle" font-size="15" fill="#111111">and typed</text>
  <line x1="432.0" y1="235.0" x2="558.0" y2="165.0" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="438.3" y="172.0" width="113.4" height="19.0" fill="#FFFFFF"/>
  <text x="495.0" y="185.0" text-anchor="middle" font-size="13" fill="#111111">API permissions</text>
  <line x1="432.0" y1="430.0" x2="558.0" y2="400.0" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="434.9" y="427.0" width="120.2" height="19.0" fill="#FFFFFF"/>
  <text x="495.0" y="440.0" text-anchor="middle" font-size="13" fill="#111111">host permissions</text>
  <text x="480.0" y="535.0" text-anchor="middle" font-size="13" fill="#333333">Access is limited to what the manifest declares and the user allows.</text>
</svg>
