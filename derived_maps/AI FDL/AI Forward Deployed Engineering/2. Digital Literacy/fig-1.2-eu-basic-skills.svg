<rect x="220" y="136" width="531" height="28" fill="url(#hatch)" stroke="#000000" stroke-width="1.5"/>
<rect x="757" y="140" width="40" height="20" fill="#FFFFFF"/>
<text x="761.2" y="156" font-size="16" text-anchor="start" font-weight="bold" fill="#111111">83</text>
