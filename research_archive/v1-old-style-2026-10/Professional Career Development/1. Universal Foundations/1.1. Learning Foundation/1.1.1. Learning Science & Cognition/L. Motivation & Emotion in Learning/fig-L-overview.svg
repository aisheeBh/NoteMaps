<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>Motivation and emotion in learning: overview</title>
  <desc>Four stages of the subtopic shown as columns: why we learn (L.1 to L.4), how emotion shapes memory and performance (L.5, L.6), the emotions of learning (L.7 to L.10), and taking control (L.11, L.12). Below, a loop shows motivation driving engagement, engagement producing emotions, emotions shaping attention and memory, and results feeding back into motivation.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="grey" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#E6E6E6"/><circle cx="3" cy="3" r="0.9" fill="#666666"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">L. Motivation &amp; Emotion in Learning — the map</text>

  <!-- stage columns: header bands with patterns -->
  <g font-size="14" fill="#111111">
    <!-- Stage 1 -->
    <rect x="28" y="62" width="214" height="300" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
    <rect x="28" y="62" width="214" height="54" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
    <rect x="44" y="72" width="182" height="34" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
    <text x="135" y="94" text-anchor="middle" font-size="15" font-weight="bold">1 WHY WE LEARN</text>
    <text x="42" y="146" font-weight="bold">L.1</text><text x="74" y="146">Intrinsic vs.</text><text x="74" y="164">extrinsic</text>
    <text x="42" y="196" font-weight="bold">L.2</text><text x="74" y="196">Self-determination</text><text x="74" y="214">theory</text>
    <text x="42" y="246" font-weight="bold">L.3</text><text x="74" y="246">Expectancy-value</text><text x="74" y="264">theory</text>
    <text x="42" y="296" font-weight="bold">L.4</text><text x="74" y="296">Mastery vs.</text><text x="74" y="314">performance goals</text>

    <!-- Stage 2 -->
    <rect x="256" y="62" width="214" height="300" fill="#FFFFFF" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
    <rect x="256" y="62" width="214" height="54" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
    <rect x="272" y="72" width="182" height="34" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
    <text x="363" y="94" text-anchor="middle" font-size="15" font-weight="bold">2 EMOTION &amp; MEMORY</text>
    <text x="270" y="176" font-weight="bold">L.5</text><text x="302" y="176">Emotion and</text><text x="302" y="194">memory encoding</text>
    <text x="270" y="232" font-weight="bold">L.6</text><text x="302" y="232">Anxiety and</text><text x="302" y="250">learning performance</text>

    <!-- Stage 3 -->
    <rect x="484" y="62" width="214" height="300" fill="#FFFFFF" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/>
    <rect x="484" y="62" width="214" height="54" fill="url(#grey)" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/>
    <rect x="500" y="72" width="182" height="34" fill="#FFFFFF" stroke="#666666" stroke-width="1"/>
    <text x="591" y="94" text-anchor="middle" font-size="15" font-weight="bold">3 LEARNING EMOTIONS</text>
    <text x="498" y="166" font-weight="bold">L.7</text><text x="532" y="166">Curiosity</text>
    <text x="498" y="204" font-weight="bold">L.8</text><text x="532" y="204">Boredom and</text><text x="532" y="222">disengagement</text>
    <text x="498" y="258" font-weight="bold">L.9</text><text x="532" y="258">Positive emotions,</text><text x="532" y="276">broadened thinking</text>
    <text x="498" y="312" font-weight="bold">L.10</text><text x="540" y="312">Frustration,</text><text x="540" y="330">confusion, persistence</text>

    <!-- Stage 4 -->
    <rect x="712" y="62" width="220" height="300" fill="#FFFFFF" stroke="#1E5E24" stroke-width="3"/>
    <rect x="712" y="62" width="220" height="54" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
    <rect x="728" y="72" width="188" height="34" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/>
    <text x="822" y="94" text-anchor="middle" font-size="15" font-weight="bold">4 TAKING CONTROL</text>
    <text x="726" y="166" font-weight="bold">L.11</text><text x="768" y="166">Building intrinsic</text><text x="768" y="184">motivation</text>
    <text x="726" y="232" font-weight="bold">L.12</text><text x="768" y="232">Emotional</text><text x="768" y="250">regulation for</text><text x="768" y="268">optimal learning</text>
  </g>

  <!-- stage arrows -->
  <line x1="242" y1="340" x2="254" y2="340" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="340" x2="482" y2="340" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="698" y1="340" x2="710" y2="340" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- loop -->
  <text x="480" y="400" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">The loop running through every note</text>
  <g font-size="15" fill="#111111" text-anchor="middle">
    <rect x="40" y="420" width="190" height="62" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
    <text x="135" y="446" fill="#FFFFFF" font-weight="bold">MOTIVATION</text>
    <text x="135" y="468" fill="#FFFFFF" font-size="14">why and how hard</text>

    <rect x="270" y="420" width="190" height="62" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
    <text x="365" y="446" font-weight="bold">ENGAGEMENT</text>
    <text x="365" y="468" font-size="14">attention, effort</text>

    <rect x="500" y="420" width="190" height="62" fill="#FFFFFF" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
    <text x="595" y="446" font-weight="bold">EMOTIONS</text>
    <text x="595" y="468" font-size="14">control + value appraisals</text>

    <rect x="730" y="420" width="190" height="62" fill="#FFFFFF" stroke="#1E5E24" stroke-width="3"/>
    <text x="825" y="446" font-weight="bold">LEARNING</text>
    <text x="825" y="468" font-size="14">memory, performance</text>
  </g>
  <line x1="230" y1="451" x2="266" y2="451" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="460" y1="451" x2="496" y2="451" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="690" y1="451" x2="726" y2="451" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M825 482 V530 H135 V486" fill="none" stroke="#222222" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <rect x="300" y="518" width="360" height="24" fill="#FFFFFF"/>
  <text x="480" y="536" text-anchor="middle" font-size="14" fill="#111111">dashed feedback: success and failure reshape motivation</text>

  <text x="480" y="580" text-anchor="middle" font-size="14" fill="#111111">Regulation (L.11, L.12) acts on every box: you can steer motivation and emotion, not just endure them.</text>
  <text x="480" y="606" text-anchor="middle" font-size="13" fill="#333333">Stages are read left to right; header patterns differ so the stages stay distinct in black-and-white print.</text>
</svg>
