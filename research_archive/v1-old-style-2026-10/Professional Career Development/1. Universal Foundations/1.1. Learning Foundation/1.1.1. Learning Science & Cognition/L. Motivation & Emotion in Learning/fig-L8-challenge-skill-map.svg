<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>Challenge, skill and the emotions of learning</title>
  <desc>A map with skill on the horizontal axis and challenge on the vertical axis. A diagonal flow channel separates an upper-left anxiety and frustration zone from a lower-right under-challenge boredom zone; the lower-left corner is apathy. A note marks over-challenge boredom where control and value are both low.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><circle cx="5" cy="5" r="1.6" fill="#8B0000"/>
    </pattern>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="grey" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#E6E6E6"/><circle cx="3" cy="3" r="0.9" fill="#666666"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Boredom lives on both sides of the right challenge</text>

  <!-- plot area 140..860 x, 70..490 y -->
  <!-- anxiety zone: upper-left triangle -->
  <polygon points="140,70 790,70 140,420" fill="url(#dots)" stroke="#8B0000" stroke-width="1.5" stroke-dasharray="3 3"/>
  <!-- boredom zone: lower-right triangle -->
  <polygon points="210,490 860,490 860,140" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/>
  <!-- flow channel band -->
  <polygon points="140,420 790,70 860,70 860,140 210,490 140,490" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <!-- apathy corner -->
  <rect x="140" y="400" width="140" height="90" fill="url(#grey)" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/>

  <!-- axes -->
  <line x1="140" y1="490" x2="880" y2="490" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="140" y1="490" x2="140" y2="58" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="510" y="524" text-anchor="middle" font-size="16" fill="#111111">Learner's current skill (low to high)</text>
  <text x="92" y="280" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 92 280)">Task challenge (low to high)</text>

  <!-- labels -->
  <rect x="170" y="96" width="290" height="88" fill="#FFFFFF" stroke="#8B0000" stroke-width="2"/>
  <text x="315" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">ANXIETY / FRUSTRATION</text>
  <text x="315" y="142" text-anchor="middle" font-size="14" fill="#111111">challenge far above skill</text>
  <text x="315" y="164" text-anchor="middle" font-size="14" fill="#111111">+ low value = over-challenge boredom</text>

  <rect x="560" y="370" width="280" height="88" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="700" y="394" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">UNDER-CHALLENGE BOREDOM</text>
  <text x="700" y="416" text-anchor="middle" font-size="14" fill="#111111">skill far above challenge</text>
  <text x="700" y="438" text-anchor="middle" font-size="14" fill="#111111">"I already know this"</text>

  <g transform="rotate(-28.3 500 280)">
    <rect x="384" y="259" width="232" height="42" fill="#FFFFFF" stroke="#1E5E24" stroke-width="2.5"/>
    <text x="500" y="277" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">FLOW / OPTIMAL CHALLENGE</text>
    <text x="500" y="294" text-anchor="middle" font-size="13" fill="#111111">stretch just beyond skill</text>
  </g>

  <rect x="150" y="436" width="120" height="44" fill="#FFFFFF" stroke="#666666" stroke-width="1"/>
  <text x="210" y="456" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">APATHY</text>
  <text x="210" y="473" text-anchor="middle" font-size="13" fill="#111111">low and low</text>

  <text x="480" y="556" text-anchor="middle" font-size="14" fill="#111111">Moving the learner: raise challenge (down-right zone) or add support and value (up-left zone).</text>
  <text x="480" y="584" text-anchor="middle" font-size="13" fill="#333333">Schematic combining the flow channel model with control-value theory; zone borders are illustrative.</text>
</svg>
