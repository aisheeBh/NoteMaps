<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>When old learning helps and when it hurts</title>
  <desc>A two by two matrix. Horizontal axis: is the new situation similar to the old one. Vertical axis: is the required response the same as the old one. Similar situation with same response gives strong positive transfer. Similar situation with a different response gives negative transfer, the danger zone. Different situation with the same response gives modest positive transfer if recognised. Different situation with different response gives little transfer.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="hatchred" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#F6CACA"/><line x1="0" y1="0" x2="0" y2="8" stroke="#8B0000" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">When old learning helps, and when it hurts</text>

  <!-- axes labels -->
  <text x="555" y="86" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Does the new situation LOOK like the old one?</text>
  <text x="370" y="114" text-anchor="middle" font-size="16" fill="#111111">YES, similar cues</text>
  <text x="740" y="114" text-anchor="middle" font-size="16" fill="#111111">NO, different cues</text>

  <text x="60" y="400" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111" transform="rotate(-90 60 400)">Is the RIGHT ACTION the same as before?</text>
  <text x="140" y="260" text-anchor="middle" font-size="16" fill="#111111">YES,</text>
  <text x="140" y="280" text-anchor="middle" font-size="16" fill="#111111">same</text>
  <text x="140" y="300" text-anchor="middle" font-size="16" fill="#111111">action</text>
  <text x="140" y="520" text-anchor="middle" font-size="16" fill="#111111">NO,</text>
  <text x="140" y="540" text-anchor="middle" font-size="16" fill="#111111">different</text>
  <text x="140" y="560" text-anchor="middle" font-size="16" fill="#111111">action</text>

  <!-- quadrant 1: similar cue, same response -->
  <rect x="190" y="130" width="360" height="270" fill="url(#cross)" stroke="#1E5E24" stroke-width="4"/>
  <rect x="215" y="170" width="310" height="190" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1.5"/>
  <text x="370" y="200" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">STRONG POSITIVE</text>
  <text x="370" y="226" text-anchor="middle" font-size="15" fill="#111111">Old habit fires and is correct.</text>
  <text x="370" y="262" text-anchor="middle" font-size="14" fill="#111111">Example: new laptop, same</text>
  <text x="370" y="282" text-anchor="middle" font-size="14" fill="#111111">keyboard shortcuts.</text>
  <text x="370" y="318" text-anchor="middle" font-size="14" font-style="italic" fill="#111111">Design: just practise.</text>

  <!-- quadrant 2: different cue, same response -->
  <rect x="560" y="130" width="360" height="270" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="585" y="170" width="310" height="190" fill="#FFFFFF" stroke="#7A5200" stroke-width="1.5"/>
  <text x="740" y="200" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">POSITIVE IF NOTICED</text>
  <text x="740" y="226" text-anchor="middle" font-size="15" fill="#111111">Principle fits, cues do not.</text>
  <text x="740" y="262" text-anchor="middle" font-size="14" fill="#111111">Example: queueing logic from</text>
  <text x="740" y="282" text-anchor="middle" font-size="14" fill="#111111">a call centre fits a data pipeline.</text>
  <text x="740" y="318" text-anchor="middle" font-size="14" font-style="italic" fill="#111111">Design: name principle, compare.</text>

  <!-- quadrant 3: similar cue, different response (danger) -->
  <rect x="190" y="410" width="360" height="270" fill="url(#hatchred)" stroke="#8B0000" stroke-width="3" stroke-dasharray="3 3"/>
  <rect x="215" y="450" width="310" height="190" fill="#FFFFFF" stroke="#8B0000" stroke-width="1.5"/>
  <text x="370" y="480" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">NEGATIVE: DANGER</text>
  <text x="370" y="506" text-anchor="middle" font-size="15" fill="#111111">Old habit fires but is wrong.</text>
  <text x="370" y="542" text-anchor="middle" font-size="14" fill="#111111">Example: driving abroad on the</text>
  <text x="370" y="562" text-anchor="middle" font-size="14" fill="#111111">other side of the road.</text>
  <text x="370" y="598" text-anchor="middle" font-size="14" font-style="italic" fill="#111111">Design: flag differences, drill.</text>

  <!-- quadrant 4: different cue, different response -->
  <rect x="560" y="410" width="360" height="270" fill="#E6E6E6" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/>
  <rect x="585" y="450" width="310" height="190" fill="#FFFFFF" stroke="#666666" stroke-width="1.5"/>
  <text x="740" y="480" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">LITTLE TRANSFER</text>
  <text x="740" y="506" text-anchor="middle" font-size="15" fill="#111111">Old learning stays quiet.</text>
  <text x="740" y="542" text-anchor="middle" font-size="14" fill="#111111">Example: piano skill and</text>
  <text x="740" y="562" text-anchor="middle" font-size="14" fill="#111111">tax accounting.</text>
  <text x="740" y="598" text-anchor="middle" font-size="14" font-style="italic" fill="#111111">Design: learn it fresh.</text>

  <text x="480" y="704" text-anchor="middle" font-size="13" fill="#333333">Simplified from classic interference research; real cases sit on a continuum of similarity.</text>
</svg>
