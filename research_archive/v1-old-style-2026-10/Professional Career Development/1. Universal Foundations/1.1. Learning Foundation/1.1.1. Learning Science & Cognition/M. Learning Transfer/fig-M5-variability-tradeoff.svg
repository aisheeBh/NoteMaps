<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>The variability trade-off</title>
  <desc>Schematic bar chart. During practice, constant or blocked practice scores higher than varied or interleaved practice. On a delayed retention test and especially on a transfer test with new variations, varied practice scores higher.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Variety costs a little now and pays off later</text>

  <text x="480" y="68" text-anchor="middle" font-size="15" fill="#111111">Constant or blocked practice versus varied practice, measured at three moments</text>
  <g transform="translate(0,50)">
  <!-- axes -->
  <line x1="110" y1="460" x2="910" y2="460" stroke="#222222" stroke-width="2.5"/>
  <line x1="110" y1="460" x2="110" y2="80" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="60" y="270" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 60 270)">Performance</text>

  <!-- group 1: during practice -->
  <rect x="160" y="150" width="90" height="310" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
  <rect x="260" y="210" width="90" height="250" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="3"/>
  <text x="255" y="490" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">During practice</text>
  <text x="255" y="512" text-anchor="middle" font-size="14" fill="#111111">what trainers see</text>

  <!-- group 2: delayed retention -->
  <rect x="420" y="290" width="90" height="170" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
  <rect x="520" y="230" width="90" height="230" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="3"/>
  <text x="515" y="490" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Delayed retention</text>
  <text x="515" y="512" text-anchor="middle" font-size="14" fill="#111111">same tasks, days later</text>

  <!-- group 3: transfer -->
  <rect x="680" y="340" width="90" height="120" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
  <rect x="780" y="240" width="90" height="220" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="3"/>
  <text x="775" y="490" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">Transfer test</text>
  <text x="775" y="512" text-anchor="middle" font-size="14" fill="#111111">new variations</text>

  <!-- direct bar labels -->
  <g font-size="14" font-weight="bold" fill="#111111" text-anchor="middle">
    <text x="205" y="140">BLOCKED</text>
    <text x="305" y="200">VARIED</text>
    <text x="465" y="280">BLOCKED</text>
    <text x="565" y="220">VARIED</text>
    <text x="725" y="330">BLOCKED</text>
    <text x="825" y="230">VARIED</text>
  </g>

  <!-- legend -->
  <rect x="100" y="534" width="760" height="48" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <rect x="116" y="546" width="26" height="24" fill="url(#dots)" stroke="#7A5200" stroke-width="2"/>
  <text x="152" y="563" font-size="14" fill="#111111">Dotted, thin border: constant or blocked</text>
  <rect x="500" y="546" width="26" height="24" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="3"/>
  <text x="536" y="563" font-size="14" fill="#111111">Hatched, thick border: varied practice</text>

  </g>
  <text x="480" y="690" text-anchor="middle" font-size="13" fill="#333333">Illustrative schematic of a common pattern; bar heights are not data from one study.</text>
</svg>
