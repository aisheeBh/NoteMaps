<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>Learning transfer as a bridge</title>
  <desc>Overview of the subtopic. On the left bank is the learning context, on the right bank the moment of use at work. A bridge deck labelled transfer crosses the gap. Four pillars hold it up: learn deeply and support the environment, vary practice, extract principles and analogies, and match processing. The gap below is labelled transfer distance, with a hazard marked negative transfer. A foundation band lists teaching for transfer, domain knowledge, measurement and design.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="waves" width="40" height="16" patternUnits="userSpaceOnUse">
      <rect width="40" height="16" fill="#F2F2F2"/><path d="M0 8 Q10 2 20 8 T40 8" fill="none" stroke="#888888" stroke-width="1.2"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Learning transfer: building the bridge from learning to use</text>
  <text x="480" y="66" text-anchor="middle" font-size="15" fill="#111111">Labels in brackets show which notes in this subtopic cover each part</text>

  <!-- banks -->
  <rect x="30" y="170" width="170" height="250" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
  <rect x="42" y="190" width="146" height="96" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1.5"/>
  <text x="115" y="214" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">LEARNING</text>
  <text x="115" y="236" text-anchor="middle" font-size="14" fill="#111111">course, practice,</text>
  <text x="115" y="254" text-anchor="middle" font-size="14" fill="#111111">project, mentor</text>
  <text x="115" y="274" text-anchor="middle" font-size="14" fill="#111111">(source)</text>

  <rect x="760" y="170" width="170" height="250" fill="url(#cross)" stroke="#1E5E24" stroke-width="4"/>
  <rect x="772" y="190" width="146" height="96" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1.5"/>
  <text x="845" y="214" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">MOMENT</text>
  <text x="845" y="234" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">OF USE</text>
  <text x="845" y="256" text-anchor="middle" font-size="14" fill="#111111">real work, new</text>
  <text x="845" y="274" text-anchor="middle" font-size="14" fill="#111111">situation (target)</text>

  <!-- deck -->
  <rect x="200" y="160" width="560" height="34" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="480" y="183" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">TRANSFER: what is learned is used (M.1)</text>
  <line x1="220" y1="130" x2="740" y2="130" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="480" y="120" text-anchor="middle" font-size="14" fill="#111111">positive transfer crosses here</text>

  <!-- pillars -->
  <g stroke="#222222" stroke-width="2">
    <rect x="232" y="194" width="110" height="226" fill="#FFFFFF"/>
    <rect x="362" y="194" width="110" height="226" fill="#FFFFFF"/>
    <rect x="492" y="194" width="110" height="226" fill="#FFFFFF"/>
    <rect x="622" y="194" width="110" height="226" fill="#FFFFFF"/>
  </g>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="287" y="222" font-weight="bold">Right</text>
    <text x="287" y="240" font-weight="bold">conditions</text>
    <text x="287" y="262">learner,</text>
    <text x="287" y="280">design,</text>
    <text x="287" y="298">workplace</text>
    <text x="287" y="322">(M.4)</text>

    <text x="417" y="222" font-weight="bold">Varied</text>
    <text x="417" y="240" font-weight="bold">practice</text>
    <text x="417" y="262">many cases,</text>
    <text x="417" y="280">contexts,</text>
    <text x="417" y="298">orders</text>
    <text x="417" y="322">(M.5)</text>

    <text x="547" y="222" font-weight="bold">Principles</text>
    <text x="547" y="240" font-weight="bold">and analogy</text>
    <text x="547" y="262">see deep</text>
    <text x="547" y="280">structure</text>
    <text x="547" y="322">(M.6, M.7)</text>

    <text x="677" y="222" font-weight="bold">Matched</text>
    <text x="677" y="240" font-weight="bold">processing</text>
    <text x="677" y="262">practise the</text>
    <text x="677" y="280">thinking the</text>
    <text x="677" y="298">job demands</text>
    <text x="677" y="322">(M.8)</text>
  </g>

  <!-- water / gap -->
  <rect x="200" y="420" width="560" height="90" fill="url(#waves)" stroke="#555555" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="222" y="440" width="250" height="50" fill="#FFFFFF" stroke="#555555" stroke-width="1.5"/>
  <text x="347" y="461" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">THE GAP: transfer distance</text>
  <text x="347" y="480" text-anchor="middle" font-size="14" fill="#111111">near or far, on many dimensions (M.2)</text>
  <rect x="492" y="440" width="246" height="50" fill="url(#dots)" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <rect x="502" y="448" width="226" height="34" fill="#FFFFFF" stroke="#8B0000" stroke-width="1"/>
  <text x="615" y="463" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">HAZARD: negative transfer</text>
  <text x="615" y="478" text-anchor="middle" font-size="13" fill="#111111">old habits misfire (M.3)</text>

  <!-- foundation band -->
  <rect x="30" y="540" width="900" height="130" fill="#FAFAFA" stroke="#222222" stroke-width="1.5"/>
  <text x="480" y="566" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">FOUNDATIONS THAT KEEP THE BRIDGE STANDING</text>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <rect x="50" y="580" width="200" height="72" fill="#FFFFFF" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
    <text x="150" y="606" font-weight="bold">Teach for transfer</text>
    <text x="150" y="626">hugging and bridging</text>
    <text x="150" y="644">(M.9)</text>

    <rect x="270" y="580" width="200" height="72" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
    <text x="370" y="606" font-weight="bold">Domain knowledge</text>
    <text x="370" y="626">general skills are thin</text>
    <text x="370" y="644">(M.10)</text>

    <rect x="490" y="580" width="200" height="72" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
    <text x="590" y="606" font-weight="bold">Measure use</text>
    <text x="590" y="626">behavior, delay, comparison</text>
    <text x="590" y="644">(M.11)</text>

    <rect x="710" y="580" width="200" height="72" fill="#FFFFFF" stroke="#1E5E24" stroke-width="3.5"/>
    <text x="810" y="606" font-weight="bold">Design backward</text>
    <text x="810" y="626">from moments of use</text>
    <text x="810" y="644">(M.12)</text>
  </g>

  <text x="480" y="698" text-anchor="middle" font-size="13" fill="#333333">Conceptual overview; the bridge is a metaphor, not a measured model.</text>
</svg>
