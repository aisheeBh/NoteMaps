<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>Transfer-appropriate processing crossover</title>
  <desc>Schematic crossover plot. People who studied words for meaning do best on a standard meaning-based recognition test and worse on a rhyme test. People who studied words for sound do worse on the standard test but better on the rhyme test. The best study method depends on the test.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">The "best" way to learn depends on how you will be tested</text>
  <text x="480" y="66" text-anchor="middle" font-size="15" fill="#111111">Schematic of the classic crossover pattern (after Morris, Bransford and Franks, 1977)</text>

  <!-- axes -->
  <line x1="150" y1="440" x2="720" y2="440" stroke="#222222" stroke-width="2.5"/>
  <line x1="150" y1="440" x2="150" y2="100" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="96" y="270" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 96 270)">Memory performance</text>

  <text x="270" y="470" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Meaning-based test</text>
  <text x="270" y="490" text-anchor="middle" font-size="14" fill="#111111">"Was this word on the list?"</text>
  <text x="600" y="470" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Sound-based test</text>
  <text x="600" y="490" text-anchor="middle" font-size="14" fill="#111111">"Did a word rhyme with this?"</text>

  <!-- meaning study: solid -->
  <line x1="270" y1="150" x2="600" y2="350" stroke="#1F3B5C" stroke-width="4"/>
  <circle cx="270" cy="150" r="9" fill="#1F3B5C" stroke="#000000" stroke-width="1.5"/>
  <circle cx="600" cy="350" r="9" fill="#1F3B5C" stroke="#000000" stroke-width="1.5"/>

  <!-- sound study: dashed -->
  <line x1="270" y1="380" x2="600" y2="230" stroke="#222222" stroke-width="3" stroke-dasharray="10 6"/>
  <rect x="261" y="371" width="18" height="18" fill="#FFFFFF" stroke="#222222" stroke-width="2.5"/>
  <rect x="591" y="221" width="18" height="18" fill="#FFFFFF" stroke="#222222" stroke-width="2.5"/>

  <!-- direct labels -->
  <rect x="730" y="120" width="210" height="72" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="742" y="144" font-size="15" font-weight="bold" fill="#111111">Solid line, circles:</text>
  <text x="742" y="164" font-size="14" fill="#111111">studied for MEANING</text>
  <text x="742" y="182" font-size="14" fill="#111111">best on meaning test</text>

  <rect x="730" y="214" width="210" height="72" fill="#FFFFFF" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="742" y="238" font-size="15" font-weight="bold" fill="#111111">Dashed line, squares:</text>
  <text x="742" y="258" font-size="14" fill="#111111">studied for SOUND</text>
  <text x="742" y="276" font-size="14" fill="#111111">best on sound test</text>

  <rect x="730" y="320" width="210" height="96" fill="#F2F2F2" stroke="#222222" stroke-width="1"/>
  <text x="742" y="344" font-size="15" font-weight="bold" fill="#111111">The lesson</text>
  <text x="742" y="366" font-size="14" fill="#111111">Lines cross: no study</text>
  <text x="742" y="386" font-size="14" fill="#111111">method is best for every</text>
  <text x="742" y="406" font-size="14" fill="#111111">test. Match the processing.</text>

  <text x="480" y="520" text-anchor="middle" font-size="13" fill="#333333">Illustrative positions; the original study used words, but the principle applies to skills and work tasks.</text>
</svg>
