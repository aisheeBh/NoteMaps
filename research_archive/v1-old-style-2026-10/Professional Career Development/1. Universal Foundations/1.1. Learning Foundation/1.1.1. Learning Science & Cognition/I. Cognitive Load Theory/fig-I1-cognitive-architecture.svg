<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>The human cognitive architecture assumed by cognitive load theory</title>
  <desc>Information from the environment passes through a narrow working memory into a vast long-term memory. Novel information is tightly limited in working memory; organised schemas retrieved from long-term memory act as single large units and bypass the limit.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">A narrow gate between the world and a vast store</text>

  <!-- Environment -->
  <rect x="30" y="110" width="200" height="300" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="45" y="125" width="170" height="54" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="130" y="148" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">ENVIRONMENT</text>
  <text x="130" y="168" text-anchor="middle" font-size="14" fill="#111111">text, talk, screens, tasks</text>
  <rect x="60" y="212" width="140" height="26" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="130" y="230" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Unlimited input</text>
  <rect x="50" y="250" width="160" height="140" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="130" y="275" text-anchor="middle" font-size="14" fill="#111111">Most of it is never</text>
  <text x="130" y="295" text-anchor="middle" font-size="14" fill="#111111">attended to. What is</text>
  <text x="130" y="315" text-anchor="middle" font-size="14" fill="#111111">attended to enters</text>
  <text x="130" y="335" text-anchor="middle" font-size="14" fill="#111111">working memory as</text>
  <text x="130" y="355" text-anchor="middle" font-size="14" fill="#111111">novel elements.</text>

  <!-- Working memory (narrow) -->
  <rect x="330" y="170" width="220" height="180" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="3"/>
  <rect x="345" y="182" width="190" height="50" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1.5"/>
  <text x="440" y="204" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">WORKING MEMORY</text>
  <text x="440" y="223" text-anchor="middle" font-size="14" fill="#111111">conscious processing</text>
  <!-- slots -->
  <rect x="352" y="250" width="40" height="40" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <rect x="397" y="250" width="40" height="40" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <rect x="442" y="250" width="40" height="40" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <rect x="487" y="250" width="40" height="40" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <rect x="342" y="298" width="196" height="46" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="440" y="316" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">about 3 to 5 novel elements,</text>
  <text x="440" y="336" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">held for seconds</text>

  <!-- LTM -->
  <rect x="650" y="80" width="280" height="340" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="668" y="94" width="244" height="54" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1.5"/>
  <text x="790" y="117" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">LONG-TERM MEMORY</text>
  <text x="790" y="137" text-anchor="middle" font-size="14" fill="#111111">no known capacity limit</text>
  <rect x="680" y="170" width="220" height="70" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="790" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">SCHEMAS</text>
  <text x="790" y="218" text-anchor="middle" font-size="14" fill="#111111">many elements chunked as one</text>
  <rect x="680" y="260" width="220" height="70" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="790" y="286" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">AUTOMATED SKILLS</text>
  <text x="790" y="308" text-anchor="middle" font-size="14" fill="#111111">run with little effort</text>
  <rect x="680" y="348" width="220" height="56" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/>
  <text x="790" y="370" text-anchor="middle" font-size="14" fill="#111111">Expertise = a large store</text>
  <text x="790" y="390" text-anchor="middle" font-size="14" fill="#111111">of well-organised schemas</text>

  <!-- arrows -->
  <line x1="232" y1="260" x2="326" y2="260" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="279" y="248" text-anchor="middle" font-size="14" fill="#111111">attend</text>
  <line x1="552" y1="230" x2="646" y2="210" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="598" y="206" text-anchor="middle" font-size="14" fill="#111111">learn</text>
  <line x1="646" y1="300" x2="552" y2="300" stroke="#222222" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrow)"/>
  <text x="598" y="324" text-anchor="middle" font-size="14" fill="#111111">retrieve</text>
  <text x="598" y="342" text-anchor="middle" font-size="13" fill="#111111">(no tight limit)</text>

  <rect x="190" y="440" width="580" height="58" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="480" y="464" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Design rule: every element a learner must hold at once</text>
  <text x="480" y="485" text-anchor="middle" font-size="15" fill="#111111">must squeeze through the narrow middle box.</text>
  <text x="480" y="522" text-anchor="middle" font-size="13" fill="#333333">Schematic. Capacity figures are approximate and refer to novel, unrelated elements.</text>
</svg>
