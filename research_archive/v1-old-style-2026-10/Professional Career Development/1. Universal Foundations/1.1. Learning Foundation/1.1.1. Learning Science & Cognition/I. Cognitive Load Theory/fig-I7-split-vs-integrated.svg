<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>Split-source versus integrated format</title>
  <desc>Left: a diagram of a three-tier web application with numbered parts and a separate legend below, forcing the eye to travel back and forth. Right: the same diagram with each explanation placed directly beside its part, removing the search.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
    <marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8B0000"/>
    </marker>
  </defs>

  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Same content, two layouts</text>

  <!-- LEFT PANEL -->
  <rect x="30" y="60" width="430" height="490" fill="#FFFFFF" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="245" y="88" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">SPLIT SOURCE</text>
  <text x="245" y="108" text-anchor="middle" font-size="14" fill="#111111">diagram and legend apart</text>

  <rect x="70" y="135" width="110" height="50" fill="#F2F2F2" stroke="#222222" stroke-width="2"/>
  <text x="125" y="166" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">1</text>
  <rect x="190" y="225" width="110" height="50" fill="#F2F2F2" stroke="#222222" stroke-width="2"/>
  <text x="245" y="256" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">2</text>
  <rect x="310" y="315" width="110" height="50" fill="#F2F2F2" stroke="#222222" stroke-width="2"/>
  <text x="365" y="346" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">3</text>
  <line x1="180" y1="170" x2="208" y2="222" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="260" x2="328" y2="312" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="55" y="400" width="380" height="120" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="70" y="424" font-size="15" font-weight="bold" fill="#111111">Legend</text>
  <text x="70" y="448" font-size="14" fill="#111111">1 = Web tier: receives user requests</text>
  <text x="70" y="472" font-size="14" fill="#111111">2 = App tier: applies business rules</text>
  <text x="70" y="496" font-size="14" fill="#111111">3 = Data tier: stores and returns records</text>

  <!-- eye travel arrows -->
  <path d="M110 395 C 60 320, 60 230, 80 190" fill="none" stroke="#8B0000" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowr)"/>
  <path d="M260 395 C 280 340, 240 300, 240 282" fill="none" stroke="#8B0000" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowr)"/>
  <rect x="250" y="140" width="190" height="44" fill="#FFFFFF" stroke="#8B0000" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="345" y="159" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">CAUTION: eyes travel,</text>
  <text x="345" y="176" text-anchor="middle" font-size="14" fill="#111111">memory holds the codes</text>

  <!-- RIGHT PANEL -->
  <rect x="500" y="60" width="430" height="490" fill="#FFFFFF" stroke="#1E5E24" stroke-width="3.5"/>
  <text x="715" y="88" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">INTEGRATED</text>
  <text x="715" y="108" text-anchor="middle" font-size="14" fill="#111111">explanation sits on the part</text>

  <rect x="530" y="140" width="170" height="70" fill="#D3ECD3" stroke="#1E5E24" stroke-width="2"/>
  <text x="615" y="168" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Web tier</text>
  <text x="615" y="190" text-anchor="middle" font-size="14" fill="#111111">receives user requests</text>

  <rect x="620" y="260" width="170" height="70" fill="#D3ECD3" stroke="#1E5E24" stroke-width="2"/>
  <text x="705" y="288" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">App tier</text>
  <text x="705" y="310" text-anchor="middle" font-size="14" fill="#111111">applies business rules</text>

  <rect x="710" y="380" width="190" height="70" fill="#D3ECD3" stroke="#1E5E24" stroke-width="2"/>
  <text x="805" y="408" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Data tier</text>
  <text x="805" y="430" text-anchor="middle" font-size="14" fill="#111111">stores and returns records</text>

  <line x1="640" y1="212" x2="680" y2="256" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="332" x2="780" y2="376" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="480" font-size="14" fill="#111111">No legend, no codes to remember:</text>
  <text x="560" y="500" font-size="14" fill="#111111">working memory goes to how the</text>
  <text x="560" y="520" font-size="14" fill="#111111">tiers relate.</text>

  <text x="480" y="580" text-anchor="middle" font-size="13" fill="#333333">Dotted red border and dotted arrows: split format. Thick solid border: integrated format.</text>
</svg>
