<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>The expertise reversal effect</title>
  <desc>Schematic crossover chart. With low prior knowledge, high-guidance instruction produces better learning than low-guidance instruction. As prior knowledge increases the advantage shrinks and reverses, so that learners with high prior knowledge learn better from low-guidance instruction. The novice advantage is larger than the expert advantage.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#EEF4FA"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9BB3CC" stroke-width="1.2"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFF6DC"/><circle cx="5" cy="5" r="1.4" fill="#B08A3A"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Support that helps novices can hinder experts</text>

  <!-- zones -->
  <rect x="110" y="70" width="300" height="370" fill="url(#hatch)" stroke="#555555" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="560" y="70" width="330" height="370" fill="url(#dots)" stroke="#555555" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="150" y="80" width="220" height="44" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1.5"/>
  <text x="260" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">NOVICE ZONE</text>
  <text x="260" y="117" text-anchor="middle" font-size="14" fill="#111111">more guidance wins</text>
  <rect x="615" y="80" width="220" height="44" fill="#FFFFFF" stroke="#7A5200" stroke-width="1.5"/>
  <text x="725" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">EXPERT ZONE</text>
  <text x="725" y="117" text-anchor="middle" font-size="14" fill="#111111">less guidance wins</text>

  <!-- axes -->
  <line x1="100" y1="440" x2="905" y2="440" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="100" y1="440" x2="100" y2="65" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="500" y="475" text-anchor="middle" font-size="16" fill="#111111">Learner's prior knowledge (low to high)</text>
  <text x="52" y="255" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 52 255)">Learning gain</text>

  <!-- high guidance: solid, falls -->
  <path d="M120 170 C 300 175, 400 225, 520 270 S 780 295, 880 300" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <circle cx="120" cy="170" r="6" fill="#1F3B5C"/>
  <circle cx="880" cy="300" r="6" fill="#1F3B5C"/>

  <!-- low guidance: dashed, rises -->
  <path d="M120 360 C 280 340, 400 300, 480 268 S 760 200, 880 210" fill="none" stroke="#222222" stroke-width="3" stroke-dasharray="10 6"/>
  <circle cx="120" cy="360" r="6" fill="#FFFFFF" stroke="#222222" stroke-width="2.5"/>
  <circle cx="880" cy="210" r="6" fill="#FFFFFF" stroke="#222222" stroke-width="2.5"/>

  <!-- crossover marker -->
  <circle cx="487" cy="263" r="10" fill="none" stroke="#222222" stroke-width="2"/>
  <rect x="420" y="300" width="140" height="44" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="490" y="319" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">crossover:</text>
  <text x="490" y="336" text-anchor="middle" font-size="14" fill="#111111">time to fade support</text>

  <!-- direct labels -->
  <rect x="140" y="140" width="250" height="24" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1.5"/>
  <text x="150" y="157" font-size="14" font-weight="bold" fill="#111111">Solid: high guidance (examples)</text>
  <rect x="140" y="372" width="260" height="24" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="150" y="389" font-size="14" font-weight="bold" fill="#111111">Dashed: low guidance (problems)</text>

  <rect x="600" y="150" width="270" height="44" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="610" y="169" font-size="14" fill="#111111">Experts: low guidance better</text>
  <text x="610" y="186" font-size="14" fill="#111111">(smaller average gap)</text>
  <rect x="140" y="250" width="200" height="44" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="150" y="269" font-size="14" fill="#111111">Novices: big advantage</text>
  <text x="150" y="286" font-size="14" fill="#111111">for high guidance</text>

  <text x="480" y="510" text-anchor="middle" font-size="15" fill="#111111">A 2025 meta-analysis (60 studies) found the novice advantage for high assistance</text>
  <text x="480" y="530" text-anchor="middle" font-size="15" fill="#111111">was larger than the expert advantage for low assistance: the effect is asymmetric.</text>
  <text x="480" y="562" text-anchor="middle" font-size="13" fill="#333333">Schematic curves, not plotted from a single dataset.</text>
</svg>
