<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>Why some retrieval cues work and others fail</title>
  <desc>Three panels. Left: a cue that shares few features with the memory trace gives weak retrieval. Middle: a cue that shares many features with the trace gives strong retrieval. Right: one cue linked to many similar traces is overloaded and retrieves none of them reliably.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">A cue works when it overlaps the memory - and points to it alone</text>

  <!-- panel frames -->
  <rect x="30" y="64" width="284" height="400" fill="#FFFFFF" stroke="#555555" stroke-width="1.5"/>
  <rect x="338" y="64" width="284" height="400" fill="#FFFFFF" stroke="#555555" stroke-width="1.5"/>
  <rect x="646" y="64" width="284" height="400" fill="#FFFFFF" stroke="#555555" stroke-width="1.5"/>

  <text x="172" y="94" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">A. LOW OVERLAP</text>
  <text x="480" y="94" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">B. HIGH OVERLAP</text>
  <text x="788" y="94" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">C. CUE OVERLOAD</text>

  <!-- Panel A: circles barely overlapping -->
  <circle cx="120" cy="230" r="70" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
  <circle cx="240" cy="230" r="58" fill="url(#dots)" stroke="#7A5200" stroke-width="2.5" stroke-dasharray="8 5" fill-opacity="0.85"/>
  <text x="105" y="330" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Memory trace</text>
  <text x="105" y="348" text-anchor="middle" font-size="14" fill="#111111">(solid, hatched)</text>
  <text x="245" y="312" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Cue</text>
  <text x="245" y="330" text-anchor="middle" font-size="14" fill="#111111">(dashed, dotted)</text>
  <text x="172" y="395" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Weak retrieval</text>
  <text x="172" y="415" text-anchor="middle" font-size="14" fill="#111111">quiz wording differs</text>
  <text x="172" y="433" text-anchor="middle" font-size="14" fill="#111111">from how it was learned</text>

  <!-- Panel B: circles heavily overlapping -->
  <circle cx="455" cy="230" r="70" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
  <circle cx="510" cy="230" r="58" fill="url(#dots)" stroke="#7A5200" stroke-width="2.5" stroke-dasharray="8 5" fill-opacity="0.75"/>
  <text x="440" y="330" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Memory trace</text>
  <text x="548" y="312" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Cue</text>
  <text x="480" y="395" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Strong retrieval</text>
  <text x="480" y="415" text-anchor="middle" font-size="14" fill="#111111">the job situation matches</text>
  <text x="480" y="433" text-anchor="middle" font-size="14" fill="#111111">how it was practised</text>

  <!-- Panel C: one cue, many traces -->
  <rect x="740" y="130" width="96" height="44" fill="url(#dots)" stroke="#7A5200" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="788" y="158" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Cue</text>
  <rect x="668" y="262" width="72" height="40" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="752" y="262" width="72" height="40" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="836" y="262" width="72" height="40" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <line x1="770" y1="176" x2="710" y2="258" stroke="#222222" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#arrow)"/>
  <line x1="788" y1="176" x2="788" y2="258" stroke="#222222" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#arrow)"/>
  <line x1="806" y1="176" x2="868" y2="258" stroke="#222222" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#arrow)"/>
  <text x="788" y="330" text-anchor="middle" font-size="14" fill="#111111">three similar traces</text>
  <text x="788" y="395" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Confused retrieval</text>
  <text x="788" y="415" text-anchor="middle" font-size="14" fill="#111111">"the Q3 meeting" - which</text>
  <text x="788" y="433" text-anchor="middle" font-size="14" fill="#111111">of the twelve Q3 meetings?</text>

  <text x="480" y="496" text-anchor="middle" font-size="15" fill="#111111">Best cue = high overlap with the memory (B) and distinctive, not shared with many memories (C).</text>
  <text x="480" y="522" text-anchor="middle" font-size="13" fill="#333333">Conceptual schematic of encoding specificity and cue overload; sizes are illustrative, not measured.</text>
</svg>
