<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>Spaced retrieval flattens the forgetting curve</title>
  <desc>Schematic. A dashed curve shows a single study session followed by steep forgetting. A solid sawtooth curve shows spaced retrieval sessions at expanding intervals; after each effortful retrieval, memory is restored and then forgotten more slowly, so the curve flattens over time.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Spaced retrieval flattens the forgetting curve</text>

  <!-- axes -->
  <line x1="90" y1="430" x2="910" y2="430" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="90" y1="430" x2="90" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="500" y="500" text-anchor="middle" font-size="16" fill="#111111">Time since first learning</text>
  <text x="44" y="250" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 44 250)">Chance of recalling it</text>

  <!-- review markers on time axis -->
  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="100" y="452">learn</text>
    <text x="180" y="452">day 1</text>
    <text x="300" y="452">day 3</text>
    <text x="460" y="452">week 1</text>
    <text x="700" y="452">week 3</text>
    <text x="880" y="452">later</text>
  </g>

  <!-- desirable-difficulty zone shading: small dotted rectangles where retrieval happens -->
  <rect x="168" y="196" width="24" height="234" fill="url(#dots)" stroke="#7A5200" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="288" y="196" width="24" height="234" fill="url(#dots)" stroke="#7A5200" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="448" y="196" width="24" height="234" fill="url(#dots)" stroke="#7A5200" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="688" y="196" width="24" height="234" fill="url(#dots)" stroke="#7A5200" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- single study: dashed steep decline -->
  <path d="M100 90 C 150 250, 260 350, 900 395" fill="none" stroke="#222222" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="600" y="398" font-size="15" font-weight="bold" fill="#111111">Dashed: studied once</text>

  <!-- spaced retrieval: solid sawtooth -->
  <path d="M100 90 C 130 170, 160 220, 180 232 L 180 92 C 220 150, 270 190, 300 205 L 300 92 C 360 130, 420 160, 460 172 L 460 92 C 560 115, 650 135, 700 145 L 700 92 C 780 100, 850 110, 900 116" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <text x="480" y="74" font-size="15" font-weight="bold" fill="#111111">Solid: retrieved at spaced intervals</text>

  <!-- annotations -->
  <rect x="520" y="226" width="370" height="78" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="534" y="248" font-size="14" fill="#111111">Dotted bands = retrieval sessions (recall from</text>
  <text x="534" y="268" font-size="14" fill="#111111">memory, then check). Each effortful recall restores</text>
  <text x="534" y="288" font-size="14" fill="#111111">the memory and slows the next decline.</text>

  <text x="480" y="526" text-anchor="middle" font-size="13" fill="#333333">Schematic of a well-replicated pattern; real intervals and curve shapes depend on material, learner and target retention.</text>
</svg>
