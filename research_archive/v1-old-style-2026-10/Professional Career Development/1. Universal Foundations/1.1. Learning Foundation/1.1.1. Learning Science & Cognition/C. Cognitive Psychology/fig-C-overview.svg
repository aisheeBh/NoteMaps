<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>Structure of the Cognitive Psychology subtopic</title>
  <desc>Five stacked stages: Foundations (C.1); Input and meaning (C.2 to C.5); Thinking and deciding (C.6, C.7); How minds differ (C.8 to C.11); Application (C.12). Arrows run from top to bottom.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#EEF4FA"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9BB3CC" stroke-width="1.2"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFF4D6"/><circle cx="5" cy="5" r="1.3" fill="#B08A3A"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#EAF5EA"/><path d="M0 5H10M5 0V10" stroke="#9CC49C" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">C. Cognitive Psychology: from signals to applied learning</text>

  <!-- Stage labels column -->
  <g font-size="14" font-weight="bold" fill="#111111">
    <text x="40" y="100">STAGE 1</text>
    <text x="40" y="206">STAGE 2</text>
    <text x="40" y="340">STAGE 3</text>
    <text x="40" y="462">STAGE 4</text>
    <text x="40" y="616">STAGE 5</text>
  </g>

  <!-- Stage 1 -->
  <rect x="300" y="70" width="360" height="60" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="480" y="96" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">FOUNDATIONS</text>
  <text x="480" y="118" text-anchor="middle" font-size="15" fill="#FFFFFF">C.1 What the field is and how it knows</text>
  <line x1="480" y1="130" x2="480" y2="160" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 2 -->
  <rect x="130" y="164" width="800" height="110" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2"/>
  <rect x="436" y="171" width="188" height="21" fill="#FFFFFF"/>
  <text x="530" y="186" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">INPUT AND MEANING</text>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <rect x="150" y="200" width="180" height="60" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
    <text x="240" y="225" font-weight="bold">C.2</text><text x="240" y="245">sensation, perception</text>
    <rect x="345" y="200" width="180" height="60" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
    <text x="435" y="225" font-weight="bold">C.3</text><text x="435" y="245">recognition, categories</text>
    <rect x="540" y="200" width="180" height="60" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
    <text x="630" y="225" font-weight="bold">C.4</text><text x="630" y="245">concepts, representations</text>
    <rect x="735" y="200" width="180" height="60" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
    <text x="825" y="225" font-weight="bold">C.5</text><text x="825" y="245">language, comprehension</text>
  </g>
  <g stroke="#222222" stroke-width="2">
    <line x1="330" y1="230" x2="343" y2="230" marker-end="url(#arrow)"/>
    <line x1="525" y1="230" x2="538" y2="230" marker-end="url(#arrow)"/>
    <line x1="720" y1="230" x2="733" y2="230" marker-end="url(#arrow)"/>
  </g>
  <line x1="480" y1="274" x2="480" y2="300" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 3 -->
  <rect x="230" y="304" width="600" height="96" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="418" y="311" width="224" height="21" fill="#FFFFFF"/>
  <text x="530" y="326" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">THINKING AND DECIDING</text>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <rect x="260" y="336" width="250" height="52" fill="#FFFFFF" stroke="#7A5200" stroke-width="2"/>
    <text x="385" y="358" font-weight="bold">C.6</text><text x="385" y="378">problem solving, reasoning</text>
    <rect x="550" y="336" width="250" height="52" fill="#FFFFFF" stroke="#7A5200" stroke-width="2"/>
    <text x="675" y="358" font-weight="bold">C.7</text><text x="675" y="378">decisions under uncertainty</text>
  </g>
  <line x1="510" y1="362" x2="548" y2="362" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="400" x2="480" y2="426" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 4 -->
  <rect x="130" y="430" width="800" height="110" fill="#F2F2F2" stroke="#333333" stroke-width="1.5"/>
  <text x="530" y="452" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">HOW MINDS DIFFER</text>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <rect x="150" y="466" width="180" height="60" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
    <text x="240" y="491" font-weight="bold">C.8</text><text x="240" y="511">intelligence</text>
    <rect x="345" y="466" width="180" height="60" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
    <text x="435" y="491" font-weight="bold">C.9</text><text x="435" y="511">expertise</text>
    <rect x="540" y="466" width="180" height="60" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
    <text x="630" y="491" font-weight="bold">C.10</text><text x="630" y="511">aging and learning</text>
    <rect x="735" y="466" width="180" height="60" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
    <text x="825" y="491" font-weight="bold">C.11</text><text x="825" y="511">individual differences</text>
  </g>
  <line x1="480" y1="540" x2="480" y2="580" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 5 -->
  <rect x="280" y="584" width="400" height="66" rx="6" fill="url(#cross)" stroke="#1E5E24" stroke-width="3.5"/>
  <text x="480" y="611" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">APPLICATION</text>
  <text x="480" y="634" text-anchor="middle" font-size="15" fill="#111111">C.12 Applied cognitive psychology in education</text>

  <!-- legend -->
  <text x="480" y="690" text-anchor="middle" font-size="13" fill="#333333">Borders encode stage: dark solid = entry; diagonal hatch = input; long dash = thinking; plain grey = differences; thick cross-hatch = application.</text>
</svg>
