<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>Signal detection theory</title>
  <desc>Two overlapping bell curves: a noise-only distribution and a signal-plus-noise distribution. A vertical criterion line divides yes and no responses. Areas show hits and false alarms; the distance between peaks is sensitivity, d-prime.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.8" fill="#7A5200"/>
    </pattern>
    <clipPath id="rightOfCriterion">
      <rect x="500" y="0" width="460" height="440"/>
    </clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Signal detection: sensitivity versus criterion</text>

  <!-- hit area: signal curve right of criterion -->
  <path clip-path="url(#rightOfCriterion)" d="M350 438 C 430 425, 470 370, 510 280 C 540 200, 560 150, 590 150 C 620 150, 640 200, 670 280 C 710 370, 750 425, 830 438 L 830 440 L 350 440 Z" fill="url(#hatch)"/>
  <!-- false alarm area: noise curve right of criterion -->
  <path clip-path="url(#rightOfCriterion)" d="M140 438 C 220 425, 260 370, 300 280 C 330 200, 350 150, 380 150 C 410 150, 430 200, 460 280 C 500 370, 540 425, 620 438 L 620 440 L 140 440 Z" fill="url(#dots)"/>

  <!-- noise curve dashed -->
  <path d="M140 438 C 220 425, 260 370, 300 280 C 330 200, 350 150, 380 150 C 410 150, 430 200, 460 280 C 500 370, 540 425, 620 438" fill="none" stroke="#222222" stroke-width="3" stroke-dasharray="10 6"/>
  <!-- signal curve solid -->
  <path d="M350 438 C 430 425, 470 370, 510 280 C 540 200, 560 150, 590 150 C 620 150, 640 200, 670 280 C 710 370, 750 425, 830 438" fill="none" stroke="#1F3B5C" stroke-width="4"/>

  <!-- axis -->
  <line x1="60" y1="440" x2="910" y2="440" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- d prime -->
  <text x="485" y="78" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">d′ (sensitivity) = distance between the peaks</text>
  <line x1="382" y1="94" x2="588" y2="94" stroke="#222222" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="380" y1="94" x2="380" y2="146" stroke="#555555" stroke-width="1.5" stroke-dasharray="2 4"/>
  <line x1="590" y1="94" x2="590" y2="146" stroke="#555555" stroke-width="1.5" stroke-dasharray="2 4"/>

  <!-- criterion -->
  <line x1="500" y1="110" x2="500" y2="452" stroke="#000000" stroke-width="3"/>
  <text x="500" y="474" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">CRITERION</text>
  <text x="484" y="498" text-anchor="end" font-size="15" fill="#111111">← answer "no"</text>
  <text x="516" y="498" text-anchor="start" font-size="15" fill="#111111">answer "yes" →</text>
  <text x="485" y="530" text-anchor="middle" font-size="15" fill="#111111">Strength of internal evidence (how much it looks like a signal)</text>

  <!-- curve labels -->
  <rect x="80" y="180" width="200" height="48" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="92" y="200" font-size="15" font-weight="bold" fill="#111111">Dashed: noise only</text>
  <text x="92" y="219" font-size="14" fill="#111111">no real signal present</text>

  <rect x="700" y="180" width="210" height="48" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="712" y="200" font-size="15" font-weight="bold" fill="#111111">Solid: signal present</text>
  <text x="712" y="219" font-size="14" fill="#111111">signal plus noise</text>

  <!-- legend panel -->
  <rect x="40" y="556" width="880" height="136" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
  <rect x="60" y="574" width="26" height="22" fill="url(#hatch)" stroke="#1F3B5C"/>
  <text x="98" y="591" font-size="15" fill="#111111"><tspan font-weight="bold">Hatched = HITS:</tspan> signal present, answered "yes"</text>
  <rect x="60" y="610" width="26" height="22" fill="url(#dots)" stroke="#7A5200"/>
  <text x="98" y="627" font-size="15" fill="#111111"><tspan font-weight="bold">Dotted = FALSE ALARMS:</tspan> no signal, answered "yes"</text>
  <text x="60" y="664" font-size="15" fill="#111111"><tspan font-weight="bold">MISSES</tspan> = solid curve left of the criterion line.</text>
  <text x="500" y="591" font-size="15" fill="#111111">Move the line left: more hits AND more false alarms.</text>
  <text x="500" y="627" font-size="15" fill="#111111">Move the line right: fewer false alarms, more misses.</text>
  <text x="500" y="664" font-size="15" fill="#111111">Only a bigger d′ reduces both kinds of error.</text>
</svg>
