<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>Prospect theory value function</title>
  <desc>An S-shaped curve through the origin. It is concave for gains and convex and steeper for losses, showing loss aversion and diminishing sensitivity. A gain of 100 and a loss of 100 are marked to show the loss feels larger.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#F6CACA"/><line x1="0" y1="0" x2="0" y2="8" stroke="#8B0000" stroke-width="1.2"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Prospect theory: losses loom larger than gains</text>

  <!-- quadrant shading -->
  <rect x="480" y="80" width="420" height="220" fill="#FAFAFA"/>
  <rect x="60" y="300" width="420" height="230" fill="#FAFAFA"/>

  <!-- axes: origin at 480,300 -->
  <line x1="60" y1="300" x2="910" y2="300" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <line x1="480" y1="535" x2="480" y2="72" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="900" y="326" text-anchor="end" font-size="15" fill="#111111">GAINS (money) →</text>
  <text x="66" y="326" text-anchor="start" font-size="15" fill="#111111">← LOSSES (money)</text>
  <text x="492" y="88" font-size="15" fill="#111111">Felt value: good</text>
  <text x="492" y="528" font-size="15" fill="#111111">Felt value: bad</text>
  <text x="490" y="348" text-anchor="start" font-size="13" fill="#333333">origin = reference point</text>

  <!-- value function: gains concave, losses convex and steeper -->
  <path d="M480 300 C 560 230, 680 175, 880 140" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <path d="M480 300 C 420 420, 320 480, 100 515" fill="none" stroke="#1F3B5C" stroke-width="4"/>

  <!-- marks at +100 (x=600) and -100 (x=360) -->
  <line x1="600" y1="300" x2="600" y2="222" stroke="#1E5E24" stroke-width="2" stroke-dasharray="8 5"/>
  <line x1="480" y1="222" x2="600" y2="222" stroke="#1E5E24" stroke-width="2" stroke-dasharray="8 5"/>
  <rect x="482" y="222" width="16" height="78" fill="url(#cross)" stroke="#1E5E24" stroke-width="1.5"/>

  <line x1="360" y1="300" x2="360" y2="440" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="360" y1="440" x2="480" y2="440" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="462" y="300" width="16" height="140" fill="url(#hatch)" stroke="#8B0000" stroke-width="1.5"/>

  <text x="600" y="320" text-anchor="middle" font-size="14" fill="#111111">+100</text>
  <text x="360" y="290" text-anchor="middle" font-size="14" fill="#111111">−100</text>

  <!-- callouts -->
  <rect x="640" y="370" width="270" height="62" fill="#FFFFFF" stroke="#1E5E24" stroke-width="2"/>
  <text x="652" y="392" font-size="15" font-weight="bold" fill="#111111">Cross-hatched bar: joy of +100</text>
  <text x="652" y="412" font-size="14" fill="#111111">curve flattens: each extra gain</text>
  <text x="652" y="428" font-size="14" fill="#111111">adds less feeling</text>

  <rect x="80" y="348" width="270" height="62" fill="#FFFFFF" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="92" y="370" font-size="15" font-weight="bold" fill="#111111">Diagonal-hatched bar: pain of −100</text>
  <text x="92" y="390" font-size="14" fill="#111111">taller than the joy bar:</text>
  <text x="92" y="406" font-size="14" fill="#111111">LOSS AVERSION</text>

  <text x="760" y="125" text-anchor="middle" font-size="14" fill="#111111">concave for gains: risk averse</text>
  <text x="250" y="545" text-anchor="middle" font-size="14" fill="#111111">convex for losses: risk seeking</text>

  <text x="480" y="585" text-anchor="middle" font-size="13" fill="#333333">Schematic shape after Kahneman and Tversky; the loss-to-gain steepness ratio varies across studies and contexts.</text>
</svg>
