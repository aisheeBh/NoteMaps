<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>Novice versus expert knowledge organisation</title>
  <desc>Left panel: a novice's scattered facts grouped by surface features with few links. Right panel: an expert's knowledge organised under deep principles with dense links to conditions and actions.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.2"/>
    </pattern>
  </defs>

  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Same domain, different organisation</text>

  <!-- panels -->
  <rect x="30" y="64" width="430" height="440" fill="#FAFAFA" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/>
  <rect x="500" y="64" width="430" height="440" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2.5"/>
  <text x="245" y="92" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">NOVICE</text>
  <text x="245" y="112" text-anchor="middle" font-size="14" fill="#111111">isolated facts, grouped by surface</text>
  <text x="715" y="92" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">EXPERT</text>
  <text x="715" y="112" text-anchor="middle" font-size="14" fill="#111111">principles at the centre, densely linked</text>

  <!-- novice: two surface groups and scattered facts -->
  <rect x="56" y="140" width="170" height="130" fill="none" stroke="#555555" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="141" y="160" text-anchor="middle" font-size="14" font-style="italic" fill="#111111">"slope problems"</text>
  <rect x="264" y="140" width="170" height="130" fill="none" stroke="#555555" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="349" y="160" text-anchor="middle" font-size="14" font-style="italic" fill="#111111">"spring problems"</text>

  <g font-size="13" fill="#111111" text-anchor="middle">
    <circle cx="96" cy="200" r="24" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/><text x="96" y="205">fact</text>
    <circle cx="180" cy="236" r="24" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/><text x="180" y="241">fact</text>
    <circle cx="306" cy="204" r="24" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/><text x="306" y="209">fact</text>
    <circle cx="392" cy="236" r="24" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/><text x="392" y="241">fact</text>
    <circle cx="96" cy="340" r="24" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/><text x="96" y="345">rule</text>
    <circle cx="210" cy="320" r="24" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/><text x="210" y="325">fact</text>
    <circle cx="320" cy="350" r="24" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/><text x="320" y="355">rule</text>
    <circle cx="150" cy="420" r="24" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/><text x="150" y="425">fact</text>
    <circle cx="390" cy="420" r="24" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/><text x="390" y="425">fact</text>
  </g>
  <line x1="120" y1="205" x2="156" y2="230" stroke="#333333" stroke-width="1.5"/>
  <line x1="330" y1="210" x2="368" y2="230" stroke="#333333" stroke-width="1.5"/>
  <text x="245" y="482" text-anchor="middle" font-size="14" fill="#111111">Few links. Retrieval is slow; cues are visual details.</text>

  <!-- expert: principle hubs -->
  <g stroke="#222222" stroke-width="1.8">
    <line x1="620" y1="220" x2="560" y2="160"/><line x1="620" y1="220" x2="665" y2="160"/>
    <line x1="620" y1="220" x2="555" y2="290"/><line x1="620" y1="220" x2="680" y2="300"/>
    <line x1="810" y1="230" x2="785" y2="160"/><line x1="810" y1="230" x2="885" y2="165"/>
    <line x1="810" y1="230" x2="760" y2="320"/><line x1="810" y1="230" x2="885" y2="310"/>
    <line x1="715" y1="400" x2="680" y2="300"/><line x1="715" y1="400" x2="760" y2="320"/>
    <line x1="715" y1="400" x2="600" y2="440"/><line x1="715" y1="400" x2="840" y2="440"/>
    <line x1="620" y1="220" x2="810" y2="230"/>
    <line x1="700" y1="159" x2="750" y2="159"/>
  </g>
  <g font-size="13" fill="#111111" text-anchor="middle">
    <rect x="555" y="196" width="130" height="48" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="2.5"/>
    <text x="620" y="216" fill="#FFFFFF" font-weight="bold">PRINCIPLE A</text><text x="620" y="234" fill="#FFFFFF">energy</text>
    <rect x="745" y="206" width="130" height="48" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="2.5"/>
    <text x="810" y="226" fill="#FFFFFF" font-weight="bold">PRINCIPLE B</text><text x="810" y="244" fill="#FFFFFF">force</text>
    <rect x="650" y="376" width="130" height="48" rx="6" fill="#1F3B5C" stroke="#000000" stroke-width="2.5"/>
    <text x="715" y="396" fill="#FFFFFF" font-weight="bold">PRINCIPLE C</text><text x="715" y="414" fill="#FFFFFF">momentum</text>

    <rect x="525" y="144" width="70" height="30" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/><text x="560" y="164">when</text>
    <rect x="630" y="144" width="70" height="30" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/><text x="665" y="164">action</text>
    <rect x="520" y="276" width="70" height="30" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/><text x="555" y="296">when</text>
    <rect x="645" y="286" width="70" height="30" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/><text x="680" y="306">case</text>
    <rect x="750" y="144" width="70" height="30" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/><text x="785" y="164">when</text>
    <rect x="850" y="150" width="70" height="30" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/><text x="885" y="170">action</text>
    <rect x="725" y="306" width="70" height="30" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/><text x="760" y="326">case</text>
    <rect x="850" y="296" width="70" height="30" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/><text x="885" y="316">when</text>
    <rect x="565" y="426" width="70" height="30" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/><text x="600" y="446">action</text>
    <rect x="805" y="426" width="70" height="30" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="1.5"/><text x="840" y="446">when</text>
  </g>
  <text x="715" y="482" text-anchor="middle" font-size="14" fill="#111111">Dense links. The principle cues the method.</text>

  <!-- legend -->
  <rect x="40" y="528" width="880" height="54" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
  <rect x="56" y="542" width="26" height="22" fill="#1F3B5C" stroke="#000000"/>
  <text x="92" y="559" font-size="14" fill="#111111">Dark box = deep principle</text>
  <rect x="300" y="542" width="26" height="22" fill="url(#hatch)" stroke="#1F3B5C"/>
  <text x="336" y="559" font-size="14" fill="#111111">Hatched = conditions of use ("when")</text>
  <rect x="640" y="542" width="26" height="22" fill="none" stroke="#555555" stroke-dasharray="8 5"/>
  <text x="676" y="559" font-size="14" fill="#111111">Dashed frame = surface grouping</text>
</svg>
