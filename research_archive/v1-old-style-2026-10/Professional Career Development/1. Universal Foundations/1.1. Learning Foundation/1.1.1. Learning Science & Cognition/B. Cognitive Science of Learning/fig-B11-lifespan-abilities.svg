<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>Different cognitive abilities peak at different ages</title>
  <desc>Schematic curves from age 10 to 90. Processing speed (dotted) peaks around the late teens and declines steadily. Working memory and fluid reasoning (dashed) peak around the mid twenties to early thirties and decline gradually. Vocabulary and accumulated knowledge (solid) rise through midlife, peak around the sixties or later and decline only late.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#EEF4FA"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9BB3CC" stroke-width="1.2"/>
    </pattern>
  </defs>

  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">There is no single "peak age" for the mind</text>

  <!-- working-life band -->
  <rect x="210" y="70" width="450" height="360" fill="url(#hatch)" stroke="#555555" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="435" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">TYPICAL WORKING LIFE (about 20-65)</text>

  <!-- axes -->
  <line x1="110" y1="430" x2="900" y2="430" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="110" y1="430" x2="110" y2="62" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="44" y="250" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 44 250)">Relative performance</text>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <line x1="110" y1="430" x2="110" y2="438" stroke="#222222"/><text x="110" y="456">10</text>
    <line x1="210" y1="430" x2="210" y2="438" stroke="#222222"/><text x="210" y="456">20</text>
    <line x1="310" y1="430" x2="310" y2="438" stroke="#222222"/><text x="310" y="456">30</text>
    <line x1="410" y1="430" x2="410" y2="438" stroke="#222222"/><text x="410" y="456">40</text>
    <line x1="510" y1="430" x2="510" y2="438" stroke="#222222"/><text x="510" y="456">50</text>
    <line x1="610" y1="430" x2="610" y2="438" stroke="#222222"/><text x="610" y="456">60</text>
    <line x1="710" y1="430" x2="710" y2="438" stroke="#222222"/><text x="710" y="456">70</text>
    <line x1="810" y1="430" x2="810" y2="438" stroke="#222222"/><text x="810" y="456">80</text>
  </g>
  <text x="505" y="484" text-anchor="middle" font-size="16" fill="#111111">Age (years)</text>

  <!-- processing speed: dotted, peak ~ 18-19 -->
  <path d="M110 300 C 150 170, 175 130, 195 128 C 260 130, 400 200, 560 270 C 680 320, 760 350, 860 380" fill="none" stroke="#222222" stroke-width="3.5" stroke-dasharray="2 5" stroke-linecap="round"/>
  <!-- working memory / fluid: dashed, peak ~ 25-30 -->
  <path d="M110 330 C 170 200, 230 150, 280 145 C 330 145, 420 175, 560 225 C 680 270, 770 310, 860 350" fill="none" stroke="#1F3B5C" stroke-width="3" stroke-dasharray="10 6"/>
  <!-- vocabulary / knowledge: solid, peak ~ 65-70 -->
  <path d="M110 380 C 220 300, 360 200, 500 150 C 600 120, 660 112, 720 115 C 790 120, 830 150, 860 185" fill="none" stroke="#1F3B5C" stroke-width="4.5"/>

  <!-- peak markers -->
  <circle cx="195" cy="128" r="6" fill="#FFFFFF" stroke="#222222" stroke-width="2.5"/>
  <circle cx="280" cy="145" r="6" fill="#BCD5EE" stroke="#1F3B5C" stroke-width="2.5"/>
  <circle cx="700" cy="113" r="7" fill="#1F3B5C" stroke="#000000" stroke-width="1.5"/>

  <!-- direct labels -->
  <rect x="380" y="330" width="214" height="48" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="392" y="350" font-size="15" font-weight="bold" fill="#111111">Solid: vocabulary,</text>
  <text x="392" y="368" font-size="14" fill="#111111">knowledge - peaks late</text>

  <rect x="640" y="236" width="246" height="48" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="652" y="256" font-size="15" font-weight="bold" fill="#111111">Dashed: working memory,</text>
  <text x="652" y="274" font-size="14" fill="#111111">fluid reasoning - peak 25-35</text>

  <rect x="640" y="370" width="246" height="48" fill="#FFFFFF" stroke="#222222" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="652" y="390" font-size="15" font-weight="bold" fill="#111111">Dotted: processing speed</text>
  <text x="652" y="408" font-size="14" fill="#111111">peaks late teens</text>

  <text x="480" y="520" text-anchor="middle" font-size="13" fill="#333333">Schematic summary of large cross-sectional and longitudinal studies; individual differences are large,</text>
  <text x="480" y="540" text-anchor="middle" font-size="13" fill="#333333">and longitudinal data usually show later, gentler declines than cross-sectional data.</text>
</svg>
