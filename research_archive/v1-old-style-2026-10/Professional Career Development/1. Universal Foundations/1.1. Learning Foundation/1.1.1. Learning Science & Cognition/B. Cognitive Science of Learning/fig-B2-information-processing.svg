<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>The information processing model of memory</title>
  <desc>Schematic: environmental input passes through sensory memory, a filter of attention, into working memory, which exchanges information with long-term memory through encoding and retrieval. Unattended information decays; working memory items are lost through displacement unless rehearsed.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">The information processing model: from input to lasting memory</text>

  <!-- input -->
  <rect x="30" y="170" width="130" height="110" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="95" y="210" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">INPUT</text>
  <text x="95" y="234" text-anchor="middle" font-size="14" fill="#111111">sights, sounds,</text>
  <text x="95" y="254" text-anchor="middle" font-size="14" fill="#111111">words, touch</text>

  <!-- sensory memory: dots -->
  <rect x="200" y="150" width="170" height="150" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="212" y="172" width="146" height="78" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="285" y="196" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">SENSORY</text>
  <text x="285" y="216" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">MEMORY</text>
  <text x="285" y="238" text-anchor="middle" font-size="14" fill="#111111">large, under 1-3 s</text>

  <!-- attention gate -->
  <polygon points="400,175 440,205 440,245 400,275" fill="#FFFFFF" stroke="#222222" stroke-width="2.5"/>
  <text x="420" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">ATTENTION</text>
  <text x="420" y="318" text-anchor="middle" font-size="14" fill="#111111">filter</text>

  <!-- working memory: hatch -->
  <rect x="470" y="150" width="190" height="150" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
  <rect x="482" y="168" width="166" height="96" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="565" y="192" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">WORKING</text>
  <text x="565" y="212" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">MEMORY</text>
  <text x="565" y="234" text-anchor="middle" font-size="14" fill="#111111">about 4 chunks,</text>
  <text x="565" y="252" text-anchor="middle" font-size="14" fill="#111111">seconds unless used</text>

  <!-- long-term memory: cross -->
  <rect x="720" y="120" width="210" height="210" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="735" y="160" width="180" height="110" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/>
  <text x="825" y="186" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">LONG-TERM</text>
  <text x="825" y="206" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">MEMORY</text>
  <text x="825" y="228" text-anchor="middle" font-size="14" fill="#111111">vast, organised,</text>
  <text x="825" y="248" text-anchor="middle" font-size="14" fill="#111111">potentially lifelong</text>

  <!-- main arrows -->
  <line x1="160" y1="225" x2="196" y2="225" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="370" y1="225" x2="398" y2="225" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="440" y1="225" x2="466" y2="225" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- encoding / retrieval -->
  <line x1="660" y1="200" x2="716" y2="200" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="688" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">encode</text>
  <line x1="718" y1="255" x2="664" y2="255" stroke="#222222" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arrow)"/>
  <text x="690" y="282" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">retrieve</text>

  <!-- rehearsal loop -->
  <path d="M520 150 C 520 100, 610 100, 610 146" fill="none" stroke="#222222" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#arrow)"/>
  <text x="565" y="95" text-anchor="middle" font-size="14" fill="#111111">rehearse / manipulate</text>

  <!-- losses -->
  <line x1="285" y1="300" x2="285" y2="380" stroke="#222222" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#arrow)"/>
  <rect x="200" y="384" width="170" height="52" fill="#F2F2F2" stroke="#555555" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="285" y="406" text-anchor="middle" font-size="14" fill="#111111">LOST: unattended</text>
  <text x="285" y="426" text-anchor="middle" font-size="14" fill="#111111">input decays</text>

  <line x1="565" y1="300" x2="565" y2="380" stroke="#222222" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#arrow)"/>
  <rect x="470" y="384" width="190" height="52" fill="#F2F2F2" stroke="#555555" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="565" y="406" text-anchor="middle" font-size="14" fill="#111111">LOST: displaced</text>
  <text x="565" y="426" text-anchor="middle" font-size="14" fill="#111111">or not processed</text>

  <line x1="825" y1="330" x2="825" y2="380" stroke="#222222" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#arrow)"/>
  <rect x="730" y="384" width="190" height="52" fill="#F2F2F2" stroke="#555555" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="825" y="406" text-anchor="middle" font-size="14" fill="#111111">HARD TO REACH:</text>
  <text x="825" y="426" text-anchor="middle" font-size="14" fill="#111111">interference, weak cues</text>

  <text x="480" y="480" text-anchor="middle" font-size="15" fill="#111111">Solid arrows: main flow. Dashed arrow: retrieval back into working memory. Dotted lines: rehearsal loop and losses.</text>
  <text x="480" y="512" text-anchor="middle" font-size="13" fill="#333333">Simplified modal model; capacities and durations are typical approximations, not fixed constants.</text>
</svg>
