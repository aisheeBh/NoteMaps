<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>Gradual conceptual change</title>
  <desc>Schematic: over weeks of instruction and practice, the share of reasoning using the new schema rises slowly while the old schema declines but never reaches zero; under time pressure the old schema temporarily resurfaces.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Old and new schemas coexist for a long time</text>

  <!-- pressure band -->
  <rect x="590" y="70" width="90" height="350" fill="url(#dots)" opacity="0.7" stroke="#7A5200" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="635" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">time</text>
  <text x="635" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">pressure</text>

  <!-- axes -->
  <line x1="100" y1="420" x2="905" y2="420" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="100" y1="420" x2="100" y2="66" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="54" y="245" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 54 245)">Share of reasoning</text>
  <text x="500" y="452" text-anchor="middle" font-size="16" fill="#111111">Weeks of refutation, practice and revisits</text>
  <text x="110" y="476" font-size="14" fill="#111111">Before instruction</text>
  <text x="890" y="476" text-anchor="end" font-size="14" fill="#111111">Months later</text>

  <!-- old schema dashed: from high to low, bump in pressure band -->
  <path d="M110 110 C 250 120, 350 230, 470 290 C 540 320, 570 330, 600 330 C 620 300, 650 270, 670 300 C 700 340, 780 360, 890 370" fill="none" stroke="#222222" stroke-width="3" stroke-dasharray="10 6"/>
  <!-- new schema solid -->
  <path d="M110 400 C 250 395, 350 290, 470 230 C 540 200, 570 190, 600 190 C 620 220, 650 250, 670 222 C 700 180, 780 160, 890 150" fill="none" stroke="#1F3B5C" stroke-width="4"/>

  <!-- direct labels -->
  <rect x="140" y="140" width="210" height="44" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="152" y="160" font-size="15" font-weight="bold" fill="#111111">Dashed: old schema</text>
  <text x="152" y="177" font-size="14" fill="#111111">declines, never reaches zero</text>

  <rect x="200" y="330" width="200" height="44" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="212" y="350" font-size="15" font-weight="bold" fill="#111111">Solid: new schema</text>
  <text x="212" y="367" font-size="14" fill="#111111">rises slowly with practice</text>

  <rect x="700" y="220" width="190" height="62" fill="#FFFFFF" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="712" y="240" font-size="14" fill="#111111">Under pressure the old</text>
  <text x="712" y="258" font-size="14" fill="#111111">intuition resurfaces;</text>
  <text x="712" y="276" font-size="14" fill="#111111">revisits restore the new</text>

  <text x="480" y="520" text-anchor="middle" font-size="13" fill="#333333">Illustrative schematic of a widely reported pattern; curves are not plotted from a single dataset.</text>
</svg>
