<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>Novice versus expert knowledge organization</title>
  <desc>Left panel: novice knowledge as isolated facts grouped by surface features with few links. Right panel: expert knowledge organized under deep principles, with many cross-links and when-to-use conditions attached.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
  </defs>

  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Same facts, different organization</text>

  <rect x="28" y="60" width="430" height="490" fill="#FFFFFF" stroke="#555555" stroke-width="1.5"/>
  <rect x="502" y="60" width="430" height="490" fill="#FFFFFF" stroke="#555555" stroke-width="1.5"/>
  <text x="243" y="92" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">NOVICE</text>
  <text x="243" y="114" text-anchor="middle" font-size="14" fill="#111111">grouped by what problems look like</text>
  <text x="717" y="92" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">EXPERT</text>
  <text x="717" y="114" text-anchor="middle" font-size="14" fill="#111111">organized by underlying principle</text>

  <!-- NOVICE: three surface groups, dashed outlines, isolated facts -->
  <g stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4" fill="#F2F2F2">
    <rect x="50" y="140" width="180" height="150" rx="10"/>
    <rect x="250" y="160" width="190" height="140" rx="10"/>
    <rect x="110" y="330" width="230" height="150" rx="10"/>
  </g>
  <text x="140" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">"slope problems"</text>
  <text x="345" y="182" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">"spring problems"</text>
  <text x="225" y="352" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">"pulley problems"</text>

  <g fill="#FFFFFF" stroke="#222222" stroke-width="1.5">
    <rect x="66" y="180" width="70" height="30"/><rect x="146" y="200" width="70" height="30"/><rect x="86" y="240" width="70" height="30"/>
    <rect x="266" y="200" width="70" height="30"/><rect x="356" y="215" width="70" height="30"/><rect x="300" y="255" width="70" height="30"/>
    <rect x="130" y="375" width="70" height="30"/><rect x="240" y="370" width="80" height="30"/><rect x="180" y="425" width="70" height="30"/>
  </g>
  <g font-size="13" fill="#111111" text-anchor="middle">
    <text x="101" y="200">formula</text><text x="181" y="220">angle</text><text x="121" y="260">friction</text>
    <text x="301" y="220">formula</text><text x="391" y="235">stretch</text><text x="335" y="275">mass</text>
    <text x="165" y="395">rope</text><text x="280" y="390">formula</text><text x="215" y="445">weight</text>
  </g>
  <line x1="136" y1="195" x2="146" y2="212" stroke="#222222" stroke-width="1.5"/>
  <text x="243" y="525" text-anchor="middle" font-size="14" fill="#111111">few links; nothing says when to use what</text>

  <!-- EXPERT: two principle nodes -->
  <g stroke="#222222" stroke-width="2">
    <line x1="610" y1="185" x2="560" y2="290"/>
    <line x1="610" y1="185" x2="640" y2="290"/>
    <line x1="610" y1="185" x2="720" y2="290"/>
    <line x1="830" y1="185" x2="720" y2="290"/>
    <line x1="830" y1="185" x2="800" y2="290"/>
    <line x1="830" y1="185" x2="880" y2="290"/>
    <line x1="610" y1="185" x2="830" y2="185"/>
  </g>
  <rect x="530" y="145" width="160" height="56" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="610" y="169" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Conservation</text>
  <text x="610" y="189" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">of energy</text>
  <rect x="750" y="145" width="160" height="56" rx="8" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="830" y="169" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Newton's</text>
  <text x="830" y="189" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">second law</text>

  <g stroke="#1F3B5C" stroke-width="2">
    <rect x="525" y="290" width="70" height="30" fill="url(#hatch)"/>
    <rect x="605" y="290" width="70" height="30" fill="url(#hatch)"/>
    <rect x="685" y="290" width="70" height="30" fill="url(#hatch)"/>
    <rect x="765" y="290" width="70" height="30" fill="url(#hatch)"/>
    <rect x="845" y="290" width="70" height="30" fill="url(#hatch)"/>
  </g>
  <g fill="#FFFFFF">
    <rect x="531" y="296" width="58" height="18"/><rect x="611" y="296" width="58" height="18"/><rect x="691" y="296" width="58" height="18"/><rect x="771" y="296" width="58" height="18"/><rect x="851" y="296" width="58" height="18"/>
  </g>
  <g font-size="13" fill="#111111" text-anchor="middle">
    <text x="560" y="310">slope</text><text x="640" y="310">spring</text><text x="720" y="310">friction</text><text x="800" y="310">pulley</text><text x="880" y="310">mass</text>
  </g>

  <!-- when-to-use tags -->
  <rect x="525" y="370" width="185" height="60" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="533" y="378" width="169" height="44" fill="#FFFFFF"/>
  <text x="617" y="396" text-anchor="middle" font-size="13" fill="#111111">USE WHEN: only start</text>
  <text x="617" y="414" text-anchor="middle" font-size="13" fill="#111111">and end states matter</text>
  <rect x="730" y="370" width="185" height="60" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="738" y="378" width="169" height="44" fill="#FFFFFF"/>
  <text x="822" y="396" text-anchor="middle" font-size="13" fill="#111111">USE WHEN: forces or</text>
  <text x="822" y="414" text-anchor="middle" font-size="13" fill="#111111">acceleration are asked</text>

  <text x="717" y="470" text-anchor="middle" font-size="14" fill="#111111">principles on top, many cross-links,</text>
  <text x="717" y="490" text-anchor="middle" font-size="14" fill="#111111">conditions of use attached (dashed tags)</text>
  <text x="717" y="525" text-anchor="middle" font-size="14" fill="#111111">the same fact can belong to both principles</text>

  <text x="480" y="580" text-anchor="middle" font-size="13" fill="#333333">Schematic inspired by expert-novice sorting studies in physics; applies equally to medicine, software, finance and management.</text>
</svg>
