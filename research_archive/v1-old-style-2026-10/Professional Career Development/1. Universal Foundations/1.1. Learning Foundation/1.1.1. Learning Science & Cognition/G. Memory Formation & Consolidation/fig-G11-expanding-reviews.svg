<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>Spaced reviews flatten the forgetting curve</title>
  <desc>Schematic: after a single study session, retention (dashed line) falls steeply. With spaced retrieval sessions at expanding intervals (solid sawtooth line), each review restores retention and the following decline is shallower, so retention stays high at day 30.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Spaced reviews flatten the forgetting curve</text>

  <!-- axes: x 100..900 for days 0..30 => 26.67 px/day ; y 420 = 0%, 100 = 100% -->
  <line x1="100" y1="420" x2="910" y2="420" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="100" y1="420" x2="100" y2="80" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="500" y="474" text-anchor="middle" font-size="16" fill="#111111">Days after first learning</text>
  <text x="50" y="260" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 50 260)">How much you can recall</text>

  <g font-size="14" fill="#111111" text-anchor="middle">
    <text x="100" y="442">0</text>
    <text x="127" y="442">1</text>
    <text x="180" y="442">3</text>
    <text x="287" y="442">7</text>
    <text x="473" y="442">14</text>
    <text x="900" y="442">30</text>
  </g>

  <!-- review markers -->
  <g stroke="#555555" stroke-width="1.5" stroke-dasharray="2 4">
    <line x1="127" y1="100" x2="127" y2="420"/>
    <line x1="180" y1="100" x2="180" y2="420"/>
    <line x1="287" y1="100" x2="287" y2="420"/>
    <line x1="473" y1="100" x2="473" y2="420"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#111111" text-anchor="middle">
    <text x="127" y="94">R1</text>
    <text x="180" y="94">R2</text>
    <text x="287" y="94">R3</text>
    <text x="473" y="94">R4</text>
  </g>

  <!-- single study: dashed -->
  <path d="M100 110 C 115 230, 160 300, 260 340 C 420 375, 650 390, 900 398" fill="none" stroke="#222222" stroke-width="3" stroke-dasharray="10 6"/>
  <circle cx="900" cy="398" r="6" fill="#FFFFFF" stroke="#222222" stroke-width="2.5"/>

  <!-- spaced: solid sawtooth -->
  <path d="M100 110 C 108 160, 118 185, 127 195 L127 112 C 145 150, 165 170, 180 176 L180 112 C 215 140, 255 155, 287 160 L287 112 C 360 130, 420 142, 473 146 L473 112 C 600 120, 760 130, 900 136" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <circle cx="900" cy="136" r="6" fill="#1F3B5C" stroke="#000000" stroke-width="1.5"/>

  <!-- labels -->
  <rect x="560" y="166" width="330" height="48" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="572" y="186" font-size="15" font-weight="bold" fill="#111111">Solid: spaced retrieval at R1 to R4</text>
  <text x="572" y="204" font-size="14" fill="#111111">each drop is shallower than the one before</text>

  <rect x="560" y="300" width="330" height="48" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="572" y="320" font-size="15" font-weight="bold" fill="#111111">Dashed: one study session only</text>
  <text x="572" y="338" font-size="14" fill="#111111">steep early loss, little left by day 30</text>

  <rect x="100" y="488" width="800" height="44" fill="#FFFFFF" stroke="#555555" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="500" y="508" text-anchor="middle" font-size="14" fill="#111111">R1 to R4 = review by recalling, not re-reading. Intervals expand: about 1, 3, 7 and 14 days.</text>
  <text x="500" y="525" text-anchor="middle" font-size="13" fill="#333333">Illustrative schematic of a well-replicated pattern; curve shapes are not plotted from a single dataset.</text>
</svg>
