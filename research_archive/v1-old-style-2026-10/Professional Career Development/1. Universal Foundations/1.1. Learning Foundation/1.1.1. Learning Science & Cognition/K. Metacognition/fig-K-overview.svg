<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>Metacognition at a glance</title>
  <desc>Overview of the metacognition subtopic. A meta level containing metacognitive knowledge sits above an object level where learning and problem solving happen. Monitoring flows up and control flows down. Fluency illusions and blind spots distort monitoring. Below, a timeline shows planning before, monitoring and control during, and evaluation after a task. A side panel lists where the ideas are applied: self-regulated learning, developing awareness, problem solving and teaching others.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#EEF4FA"/><line x1="0" y1="0" x2="0" y2="10" stroke="#9BB3CC" stroke-width="1.2"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFF4D6"/><circle cx="5" cy="5" r="1.3" fill="#B08A3A"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="36" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">Metacognition at a glance: K.1 to K.12</text>

  <!-- META LEVEL -->
  <rect x="30" y="60" width="620" height="120" rx="8" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="3"/>
  <text x="46" y="86" font-size="17" font-weight="bold" fill="#111111">META LEVEL: your model of your own mind (K.1)</text>
  <rect x="150" y="100" width="380" height="64" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1.5"/>
  <text x="340" y="126" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Metacognitive knowledge (K.2)</text>
  <text x="340" y="148" text-anchor="middle" font-size="14" fill="#111111">person, task and strategy; when and why</text>

  <!-- OBJECT LEVEL -->
  <rect x="30" y="330" width="620" height="70" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="340" y="360" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">OBJECT LEVEL: learning, solving, working</text>
  <text x="340" y="384" text-anchor="middle" font-size="14" fill="#111111">reading, remembering, coding, analysing, deciding</text>

  <!-- monitoring up -->
  <line x1="120" y1="330" x2="120" y2="186" stroke="#222222" stroke-width="3.5" marker-end="url(#arrow)"/>
  <rect x="134" y="226" width="150" height="50" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="209" y="248" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">MONITORING</text>
  <text x="209" y="267" text-anchor="middle" font-size="14" fill="#111111">up (K.3)</text>

  <!-- control down -->
  <line x1="560" y1="186" x2="560" y2="326" stroke="#222222" stroke-width="3.5" stroke-dasharray="10 6" marker-end="url(#arrow)"/>
  <rect x="396" y="226" width="150" height="50" fill="#FFFFFF" stroke="#222222" stroke-width="1.5" stroke-dasharray="10 6"/>
  <text x="471" y="248" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">CONTROL</text>
  <text x="471" y="267" text-anchor="middle" font-size="14" fill="#111111">down (K.4)</text>

  <!-- distortions -->
  <rect x="296" y="200" width="90" height="100" fill="#FFFFFF" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="341" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">TRAPS</text>
  <text x="341" y="242" text-anchor="middle" font-size="13" fill="#111111">fluency</text>
  <text x="341" y="258" text-anchor="middle" font-size="13" fill="#111111">illusions</text>
  <text x="341" y="274" text-anchor="middle" font-size="13" fill="#111111">blind spots</text>
  <text x="341" y="290" text-anchor="middle" font-size="13" fill="#111111">(K.5, K.6)</text>
  <line x1="296" y1="250" x2="286" y2="250" stroke="#8B0000" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- timeline -->
  <text x="340" y="440" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">ACROSS TIME</text>
  <rect x="30" y="456" width="180" height="70" fill="url(#dots)" stroke="#7A5200" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="42" y="466" width="156" height="50" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="120" y="488" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">BEFORE: plan</text>
  <text x="120" y="507" text-anchor="middle" font-size="14" fill="#111111">(K.8)</text>
  <rect x="250" y="456" width="180" height="70" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="340" y="488" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">DURING: monitor</text>
  <text x="340" y="507" text-anchor="middle" font-size="14" fill="#111111">and control (K.3, K.4)</text>
  <rect x="470" y="456" width="180" height="70" fill="#FFFFFF" stroke="#1E5E24" stroke-width="3"/>
  <text x="560" y="488" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">AFTER: evaluate</text>
  <text x="560" y="507" text-anchor="middle" font-size="14" fill="#111111">(K.9)</text>
  <line x1="210" y1="491" x2="246" y2="491" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="491" x2="466" y2="491" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M560 526 C 560 570, 120 570, 120 530" fill="none" stroke="#222222" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#arrow)"/>
  <text x="340" y="586" text-anchor="middle" font-size="14" fill="#111111">dotted: lessons feed the next plan</text>

  <!-- side panel -->
  <rect x="690" y="60" width="244" height="466" fill="#FAFAFA" stroke="#555555" stroke-width="1.5"/>
  <text x="706" y="88" font-size="17" font-weight="bold" fill="#111111">PUTTING IT TOGETHER</text>
  <rect x="706" y="104" width="212" height="84" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="718" y="128" font-size="15" font-weight="bold" fill="#111111">K.7 Self-regulated</text>
  <text x="718" y="148" font-size="15" font-weight="bold" fill="#111111">learning</text>
  <text x="718" y="172" font-size="13" fill="#111111">adds motivation + behaviour</text>
  <rect x="706" y="200" width="212" height="84" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="718" y="224" font-size="15" font-weight="bold" fill="#111111">K.10 Developing</text>
  <text x="718" y="244" font-size="15" font-weight="bold" fill="#111111">awareness</text>
  <text x="718" y="268" font-size="13" fill="#111111">training the skill itself</text>
  <rect x="706" y="296" width="212" height="84" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="718" y="320" font-size="15" font-weight="bold" fill="#111111">K.11 Problem</text>
  <text x="718" y="340" font-size="15" font-weight="bold" fill="#111111">solving</text>
  <text x="718" y="364" font-size="13" fill="#111111">control when stuck</text>
  <rect x="706" y="392" width="212" height="84" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="718" y="416" font-size="15" font-weight="bold" fill="#111111">K.12 Teaching</text>
  <text x="718" y="436" font-size="15" font-weight="bold" fill="#111111">others</text>
  <text x="718" y="460" font-size="13" fill="#111111">making thinking visible</text>
  <text x="706" y="506" font-size="13" fill="#333333">All four apply the core loop.</text>

  <text x="480" y="610" text-anchor="middle" font-size="13" fill="#333333">Solid up-arrow: monitoring. Dashed down-arrow: control. Dotted red box: distortions of monitoring.</text>
</svg>
