<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>Zimmerman's cyclical model of self-regulated learning</title>
  <desc>Three phases arranged in a cycle: forethought (task analysis, goals, planning, self-efficacy, interest), performance (self-control strategies, self-observation and monitoring), and self-reflection (self-evaluation, causal attribution, satisfaction, adaptive or defensive reactions). Arrows run clockwise and self-reflection feeds the next forethought phase. A side panel lists Winne and Hadwin's four-phase model.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#EEF4FA"/><line x1="0" y1="0" x2="0" y2="10" stroke="#9BB3CC" stroke-width="1.2"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFF4D6"/><circle cx="5" cy="5" r="1.3" fill="#B08A3A"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#E3F2E3"/><path d="M0 5H10M5 0V10" stroke="#8DB591" stroke-width="0.8"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="36" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111">The self-regulated learning cycle</text>
  <text x="340" y="62" text-anchor="middle" font-size="15" fill="#333333">after Zimmerman's cyclical phase model</text>

  <!-- Forethought -->
  <rect x="200" y="80" width="280" height="140" rx="10" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="3"/>
  <rect x="214" y="92" width="252" height="116" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1"/>
  <text x="340" y="116" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">1. FORETHOUGHT</text>
  <text x="340" y="136" text-anchor="middle" font-size="13" fill="#333333">before</text>
  <text x="228" y="160" font-size="14" fill="#111111">Task analysis, goals, plan</text>
  <text x="228" y="180" font-size="14" fill="#111111">Self-efficacy, interest,</text>
  <text x="228" y="200" font-size="14" fill="#111111">expected outcomes</text>

  <!-- Performance -->
  <rect x="380" y="370" width="280" height="140" rx="10" fill="url(#dots)" stroke="#7A5200" stroke-width="2.5" stroke-dasharray="8 4"/>
  <rect x="394" y="382" width="252" height="116" fill="#FFFFFF" stroke="#7A5200" stroke-width="1"/>
  <text x="520" y="406" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">2. PERFORMANCE</text>
  <text x="520" y="426" text-anchor="middle" font-size="13" fill="#333333">during</text>
  <text x="408" y="450" font-size="14" fill="#111111">Strategies, focus, time use</text>
  <text x="408" y="470" font-size="14" fill="#111111">Self-observation and</text>
  <text x="408" y="490" font-size="14" fill="#111111">monitoring</text>

  <!-- Self-reflection -->
  <rect x="24" y="370" width="290" height="140" rx="10" fill="url(#cross)" stroke="#1E5E24" stroke-width="3"/>
  <rect x="38" y="382" width="262" height="116" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1"/>
  <text x="169" y="406" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">3. SELF-REFLECTION</text>
  <text x="169" y="426" text-anchor="middle" font-size="13" fill="#333333">after</text>
  <text x="52" y="450" font-size="14" fill="#111111">Self-evaluation, attributions</text>
  <text x="52" y="470" font-size="14" fill="#111111">Satisfaction; adaptive or</text>
  <text x="52" y="490" font-size="14" fill="#111111">defensive reactions</text>

  <!-- cycle arrows -->
  <path d="M480 160 C 570 170, 600 260, 560 362" fill="none" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M380 470 L 324 470" fill="none" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M120 370 C 90 280, 130 180, 192 160" fill="none" stroke="#222222" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arrow)"/>
  <text x="568" y="262" text-anchor="end" font-size="14" fill="#111111">carry out</text>
  <text x="568" y="280" text-anchor="end" font-size="14" fill="#111111">the plan</text>
  <text x="38" y="262" font-size="14" fill="#111111">feeds the</text>
  <text x="38" y="280" font-size="14" fill="#111111">next cycle</text>

  <!-- centre label -->
  <text x="340" y="292" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">Metacognition +</text>
  <text x="340" y="312" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">motivation + behaviour</text>

  <!-- side panel -->
  <rect x="700" y="80" width="236" height="430" fill="#FAFAFA" stroke="#555555" stroke-width="1.5"/>
  <text x="714" y="108" font-size="16" font-weight="bold" fill="#111111">A second lens:</text>
  <text x="714" y="128" font-size="16" font-weight="bold" fill="#111111">Winne and Hadwin</text>
  <text x="714" y="160" font-size="14" fill="#111111">1. Define the task</text>
  <text x="714" y="186" font-size="14" fill="#111111">2. Set goals and plans</text>
  <text x="714" y="212" font-size="14" fill="#111111">3. Enact tactics</text>
  <text x="714" y="238" font-size="14" fill="#111111">4. Adapt for the future</text>
  <line x1="714" y1="258" x2="922" y2="258" stroke="#999999" stroke-width="1"/>
  <text x="714" y="284" font-size="14" font-weight="bold" fill="#111111">Inside every phase:</text>
  <text x="714" y="306" font-size="14" fill="#111111">Conditions</text>
  <text x="714" y="326" font-size="14" fill="#111111">Operations</text>
  <text x="714" y="346" font-size="14" fill="#111111">Products</text>
  <text x="714" y="366" font-size="14" fill="#111111">Evaluations</text>
  <text x="714" y="386" font-size="14" fill="#111111">Standards (COPES)</text>
  <text x="714" y="420" font-size="13" fill="#333333">Products are compared with</text>
  <text x="714" y="438" font-size="13" fill="#333333">standards: that comparison</text>
  <text x="714" y="456" font-size="13" fill="#333333">is monitoring; acting on it</text>
  <text x="714" y="474" font-size="13" fill="#333333">is control.</text>

  <text x="480" y="560" text-anchor="middle" font-size="14" fill="#111111">Solid arrows: within one cycle. Dashed arrow: reflection shapes the next round of forethought.</text>
</svg>
