<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>Learning How to Learn: four stages</title>
  <desc>A four-step staircase showing the twelve notes of the subtopic grouped into four stages: understand learning (A.1 to A.3), know the kinds and the myths (A.4 to A.6), manage the learner (A.7 to A.9), and practise effectively (A.10 to A.12). Each step rises from novice towards professional.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#EEF4FA"/><line x1="0" y1="0" x2="0" y2="8" stroke="#B5C8DC" stroke-width="1.2"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFF4D6"/><circle cx="5" cy="5" r="1.3" fill="#C9A86A"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#EAF5EA"/><path d="M0 5H10M5 0V10" stroke="#B9D8B9" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Learning How to Learn — four stages, twelve notes</text>

  <!-- Step 1 -->
  <rect x="40" y="380" width="210" height="130" fill="#FFFFFF" stroke="#222222" stroke-width="2.5"/>
  <text x="145" y="405" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">1. UNDERSTAND</text>
  <text x="145" y="424" text-anchor="middle" font-size="14" fill="#111111">what learning is</text>
  <text x="56" y="452" font-size="14" fill="#111111">A.1 What is learning?</text>
  <text x="56" y="472" font-size="14" fill="#111111">A.2 The science</text>
  <text x="56" y="492" font-size="14" fill="#111111">A.3 The brain</text>

  <!-- Step 2 -->
  <rect x="260" y="290" width="210" height="220" fill="url(#hatch)" stroke="#1F3B5C" stroke-width="2.5"/>
  <rect x="270" y="300" width="190" height="112" fill="#FFFFFF" stroke="none"/>
  <text x="365" y="324" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">2. DISTINGUISH</text>
  <text x="365" y="343" text-anchor="middle" font-size="14" fill="#111111">kinds of learning, myths</text>
  <text x="278" y="368" font-size="14" fill="#111111">A.4 Types of learning</text>
  <text x="278" y="386" font-size="14" fill="#111111">A.5 (Un)conscious learning</text>
  <text x="278" y="404" font-size="14" fill="#111111">A.6 Learning-styles myth</text>

  <!-- Step 3 -->
  <rect x="480" y="200" width="210" height="310" fill="url(#dots)" stroke="#7A5200" stroke-width="2.5" stroke-dasharray="8 4"/>
  <rect x="490" y="210" width="190" height="112" fill="#FFFFFF" stroke="none"/>
  <text x="585" y="234" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">3. MANAGE</text>
  <text x="585" y="253" text-anchor="middle" font-size="14" fill="#111111">the learner's mind</text>
  <text x="498" y="278" font-size="14" fill="#111111">A.7 Growth mindset</text>
  <text x="498" y="296" font-size="14" fill="#111111">A.8 Learning blocks</text>
  <text x="498" y="314" font-size="14" fill="#111111">A.9 Learning mindset</text>

  <!-- Step 4 -->
  <rect x="700" y="110" width="220" height="400" fill="url(#cross)" stroke="#1E5E24" stroke-width="3.5"/>
  <rect x="710" y="120" width="200" height="112" fill="#FFFFFF" stroke="none"/>
  <text x="810" y="144" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">4. PRACTISE</text>
  <text x="810" y="163" text-anchor="middle" font-size="14" fill="#111111">what works, every day</text>
  <text x="718" y="188" font-size="14" fill="#111111">A.10 Proven techniques</text>
  <text x="718" y="206" font-size="14" fill="#111111">A.11 Meta-learning</text>
  <text x="718" y="224" font-size="14" fill="#111111">A.12 Daily application</text>

  <!-- rising arrow -->
  <path d="M110 360 C 260 260, 480 170, 690 92" fill="none" stroke="#222222" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrow)"/>
  <rect x="120" y="140" width="290" height="58" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="265" y="164" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Dashed arrow: Novice → Pro</text>
  <text x="265" y="184" text-anchor="middle" font-size="14" fill="#111111">each stage builds on the one before</text>

  <!-- step-level badges -->
  <text x="145" y="530" text-anchor="middle" font-size="13" fill="#333333">start here</text>
  <text x="365" y="530" text-anchor="middle" font-size="13" fill="#333333">clear the myths</text>
  <text x="585" y="530" text-anchor="middle" font-size="13" fill="#333333">beliefs, barriers, habits</text>
  <text x="810" y="530" text-anchor="middle" font-size="13" fill="#333333">apply and keep improving</text>
  <text x="480" y="552" text-anchor="middle" font-size="13" fill="#333333">Border styles also distinguish the stages: thin solid, hatched, long-dash, thick solid.</text>
</svg>
