<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>The crossover test for learning styles</title>
  <desc>Two schematic interaction plots. Left: the crossing lines the meshing hypothesis requires, where each style group scores best with its matched method. Right: the typical finding, parallel lines where one method is better for both groups.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#F7F7F7"/><line x1="0" y1="0" x2="0" y2="8" stroke="#D0D0D0" stroke-width="1"/>
    </pattern>
  </defs>

  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">The learning-styles test: do the lines cross?</text>

  <!-- LEFT PANEL -->
  <rect x="30" y="60" width="430" height="430" fill="url(#hatch)" stroke="#555555" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="245" y="88" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">WHAT MESHING REQUIRES</text>
  <text x="245" y="110" text-anchor="middle" font-size="14" fill="#111111">(each group best with its own style)</text>
  <line x1="90" y1="410" x2="90" y2="130" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="90" y1="410" x2="440" y2="410" stroke="#222222" stroke-width="2.5"/>
  <text x="62" y="275" text-anchor="middle" font-size="15" fill="#111111" transform="rotate(-90 62 275)">Test score</text>
  <text x="140" y="434" text-anchor="middle" font-size="14" fill="#111111">Visual</text>
  <text x="140" y="452" text-anchor="middle" font-size="14" fill="#111111">teaching</text>
  <text x="300" y="434" text-anchor="middle" font-size="14" fill="#111111">Auditory</text>
  <text x="300" y="452" text-anchor="middle" font-size="14" fill="#111111">teaching</text>
  <line x1="140" y1="180" x2="300" y2="340" stroke="#1F3B5C" stroke-width="4"/>
  <circle cx="140" cy="180" r="6" fill="#1F3B5C"/><circle cx="300" cy="340" r="6" fill="#1F3B5C"/>
  <line x1="140" y1="340" x2="300" y2="180" stroke="#222222" stroke-width="3" stroke-dasharray="10 6"/>
  <circle cx="140" cy="340" r="6" fill="#FFFFFF" stroke="#222222" stroke-width="2.5"/><circle cx="300" cy="180" r="6" fill="#FFFFFF" stroke="#222222" stroke-width="2.5"/>
  <text x="312" y="346" font-size="14" font-weight="bold" fill="#111111">Solid:</text>
  <text x="312" y="364" font-size="14" fill="#111111">"visual learners"</text>
  <text x="312" y="176" font-size="14" font-weight="bold" fill="#111111">Dashed:</text>
  <text x="312" y="194" font-size="14" fill="#111111">"auditory learners"</text>
  <text x="245" y="478" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Lines CROSS = matching helps</text>

  <!-- RIGHT PANEL -->
  <rect x="500" y="60" width="430" height="430" fill="#FFFFFF" stroke="#1E5E24" stroke-width="3"/>
  <text x="715" y="88" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">WHAT STUDIES USUALLY FIND</text>
  <text x="715" y="110" text-anchor="middle" font-size="14" fill="#111111">(one method is better for everyone)</text>
  <line x1="560" y1="410" x2="560" y2="130" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="410" x2="910" y2="410" stroke="#222222" stroke-width="2.5"/>
  <text x="532" y="275" text-anchor="middle" font-size="15" fill="#111111" transform="rotate(-90 532 275)">Test score</text>
  <text x="610" y="434" text-anchor="middle" font-size="14" fill="#111111">Method that</text>
  <text x="610" y="452" text-anchor="middle" font-size="14" fill="#111111">fits content</text>
  <text x="770" y="434" text-anchor="middle" font-size="14" fill="#111111">Method that</text>
  <text x="770" y="452" text-anchor="middle" font-size="14" fill="#111111">does not</text>
  <line x1="610" y1="175" x2="770" y2="300" stroke="#1F3B5C" stroke-width="4"/>
  <circle cx="610" cy="175" r="6" fill="#1F3B5C"/><circle cx="770" cy="300" r="6" fill="#1F3B5C"/>
  <line x1="610" y1="205" x2="770" y2="330" stroke="#222222" stroke-width="3" stroke-dasharray="10 6"/>
  <circle cx="610" cy="205" r="6" fill="#FFFFFF" stroke="#222222" stroke-width="2.5"/><circle cx="770" cy="330" r="6" fill="#FFFFFF" stroke="#222222" stroke-width="2.5"/>
  <text x="782" y="286" font-size="14" font-weight="bold" fill="#111111">Solid:</text>
  <text x="782" y="304" font-size="14" fill="#111111">"visual learners"</text>
  <text x="782" y="338" font-size="14" font-weight="bold" fill="#111111">Dashed:</text>
  <text x="782" y="356" font-size="14" fill="#111111">"auditory learners"</text>
  <text x="715" y="478" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Lines PARALLEL = no style effect</text>

  <text x="480" y="522" text-anchor="middle" font-size="13" fill="#333333">Schematic of the test design proposed in 2008; values are illustrative, not from one study.</text>
</svg>
