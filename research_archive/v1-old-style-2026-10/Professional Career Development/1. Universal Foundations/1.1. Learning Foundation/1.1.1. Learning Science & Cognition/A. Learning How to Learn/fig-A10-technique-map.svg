<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>Feels effective versus is effective</title>
  <desc>A two-by-two map of learning techniques. Horizontal axis: how easy the technique feels during study. Vertical axis: typical long-term learning benefit. Practice testing, distributed practice, interleaving, self-explanation and elaborative interrogation are top-left (effective, feel hard). Worked examples for novices are top-right. Re-reading, highlighting, summarising and keyword mnemonics are lower right (popular, weaker). Imagery for text is lower left.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#EEF7EE"/><path d="M0 5H10M5 0V10" stroke="#B9D8B9" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FDF3E3"/><circle cx="5" cy="5" r="1.2" fill="#C9A86A"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">What feels effective is often not what is effective</text>

  <!-- quadrants -->
  <rect x="120" y="70" width="390" height="195" fill="url(#cross)" stroke="none"/>
  <rect x="510" y="70" width="390" height="195" fill="#FFFFFF" stroke="none"/>
  <rect x="120" y="265" width="390" height="195" fill="#FFFFFF" stroke="none"/>
  <rect x="510" y="265" width="390" height="195" fill="url(#dots)" stroke="none"/>
  <rect x="120" y="70" width="780" height="390" fill="none" stroke="#222222" stroke-width="2"/>
  <line x1="510" y1="70" x2="510" y2="460" stroke="#555555" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="120" y1="265" x2="900" y2="265" stroke="#555555" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- quadrant titles -->
  <text x="132" y="94" font-size="16" font-weight="bold" fill="#111111">WORKS WELL, FEELS HARD</text>
  <text x="888" y="94" text-anchor="end" font-size="16" font-weight="bold" fill="#111111">WORKS WELL, FEELS EASIER</text>
  <text x="132" y="448" font-size="16" font-weight="bold" fill="#111111">FEELS HARD, WEAKER</text>
  <text x="888" y="448" text-anchor="end" font-size="16" font-weight="bold" fill="#111111">POPULAR, WEAKER</text>

  <!-- TL points -->
  <circle cx="160" cy="130" r="8" fill="#1F3B5C" stroke="#000000" stroke-width="1.5"/>
  <text x="174" y="135" font-size="15" font-weight="bold" fill="#111111">Practice testing</text>
  <circle cx="310" cy="165" r="8" fill="#1F3B5C" stroke="#000000" stroke-width="1.5"/>
  <text x="324" y="170" font-size="15" font-weight="bold" fill="#111111">Distributed practice</text>
  <circle cx="160" cy="205" r="8" fill="#FFFFFF" stroke="#222222" stroke-width="2.5"/>
  <text x="174" y="210" font-size="15" fill="#111111">Interleaving</text>
  <circle cx="330" cy="210" r="8" fill="#FFFFFF" stroke="#222222" stroke-width="2.5"/>
  <text x="344" y="215" font-size="15" fill="#111111">Self-explanation</text>
  <circle cx="250" cy="245" r="8" fill="#FFFFFF" stroke="#222222" stroke-width="2.5"/>
  <text x="264" y="250" font-size="15" fill="#111111">Elaborative interrogation</text>

  <!-- TR -->
  <circle cx="560" cy="175" r="8" fill="#FFFFFF" stroke="#222222" stroke-width="2.5"/>
  <text x="574" y="180" font-size="15" fill="#111111">Worked examples (for novices)</text>

  <!-- BR -->
  <rect x="553" y="298" width="14" height="14" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="575" y="310" font-size="15" fill="#111111">Keyword mnemonic</text>
  <rect x="633" y="333" width="14" height="14" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="655" y="345" font-size="15" fill="#111111">Summarising</text>
  <rect x="793" y="368" width="14" height="14" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="785" y="380" text-anchor="end" font-size="15" fill="#111111">Highlighting</text>
  <rect x="853" y="398" width="14" height="14" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="845" y="410" text-anchor="end" font-size="15" fill="#111111">Re-reading</text>

  <!-- BL -->
  <rect x="443" y="318" width="14" height="14" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="435" y="330" text-anchor="end" font-size="15" fill="#111111">Imagery for text</text>

  <!-- axes -->
  <line x1="200" y1="482" x2="820" y2="482" stroke="#222222" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="190" y="487" text-anchor="end" font-size="14" fill="#111111">Feels harder</text>
  <text x="830" y="487" font-size="14" fill="#111111">Feels easier</text>
  <text x="510" y="476" text-anchor="middle" font-size="14" fill="#111111">How the technique feels during study</text>
  <line x1="92" y1="440" x2="92" y2="90" stroke="#222222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="72" y="265" text-anchor="middle" font-size="14" fill="#111111" transform="rotate(-90 72 265)">Long-term learning benefit</text>

  <!-- legend -->
  <circle cx="250" cy="515" r="8" fill="#1F3B5C" stroke="#000000" stroke-width="1.5"/>
  <text x="264" y="520" font-size="14" fill="#111111">High utility (2013 review)</text>
  <circle cx="470" cy="515" r="8" fill="#FFFFFF" stroke="#222222" stroke-width="2.5"/>
  <text x="484" y="520" font-size="14" fill="#111111">Moderate / well supported</text>
  <rect x="683" y="508" width="14" height="14" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="705" y="520" font-size="14" fill="#111111">Low utility</text>
  <text x="480" y="548" text-anchor="middle" font-size="13" fill="#333333">Schematic placements; "low utility" means limited or inconsistent benefit, not zero.</text>
</svg>
