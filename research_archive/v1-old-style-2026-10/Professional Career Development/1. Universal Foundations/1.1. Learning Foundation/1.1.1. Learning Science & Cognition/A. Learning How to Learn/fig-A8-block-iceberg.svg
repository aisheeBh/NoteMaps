<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>The learning-block iceberg</title>
  <desc>An iceberg schematic. Above the waterline, visible symptoms: procrastinating, blanking in tests, forgetting what was read, nothing making sense. Below the waterline, six root causes: knowledge gaps, poor strategies, cognitive overload, anxiety and fear, low value or expectancy, environment and sleep.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <pattern id="water" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#EEF4FA"/><line x1="0" y1="0" x2="0" y2="8" stroke="#B5C8DC" stroke-width="1.2"/>
    </pattern>
    <pattern id="ice" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F4F4F4"/><circle cx="5" cy="5" r="1.2" fill="#9A9A9A"/>
    </pattern>
  </defs>

  <text x="480" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">What you notice is not what you need to fix</text>

  <!-- water -->
  <rect x="30" y="210" width="900" height="295" fill="url(#water)" stroke="none"/>
  <line x1="30" y1="210" x2="930" y2="210" stroke="#222222" stroke-width="2.5"/>
  <text x="40" y="232" font-size="14" font-weight="bold" fill="#111111">WATERLINE</text>

  <!-- tip -->
  <polygon points="350,210 410,120 480,100 550,122 610,210" fill="#FFFFFF" stroke="#222222" stroke-width="2.5"/>
  <text x="480" y="160" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">SYMPTOMS</text>
  <text x="480" y="180" text-anchor="middle" font-size="14" fill="#111111">what you notice</text>

  <rect x="50" y="80" width="250" height="40" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="175" y="106" text-anchor="middle" font-size="15" fill="#111111">"I keep procrastinating"</text>
  <rect x="50" y="140" width="250" height="40" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="175" y="166" text-anchor="middle" font-size="15" fill="#111111">"I blank in tests"</text>
  <rect x="660" y="80" width="250" height="40" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="785" y="106" text-anchor="middle" font-size="15" fill="#111111">"I forget what I read"</text>
  <rect x="660" y="140" width="250" height="40" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <text x="785" y="166" text-anchor="middle" font-size="15" fill="#111111">"Nothing makes sense"</text>

  <!-- underwater mass -->
  <polygon points="210,210 750,210 860,300 820,460 480,495 140,460 100,300" fill="url(#ice)" stroke="#1F3B5C" stroke-width="3"/>
  <rect x="330" y="222" width="300" height="26" fill="#FFFFFF" stroke="none"/>
  <text x="480" y="241" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">ROOT CAUSES — what to fix</text>

  <rect x="160" y="262" width="200" height="50" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="260" y="284" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">1. Knowledge gaps</text>
  <text x="260" y="303" text-anchor="middle" font-size="13" fill="#111111">missing basics, misconceptions</text>

  <rect x="380" y="262" width="200" height="50" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="480" y="284" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">2. Poor strategies</text>
  <text x="480" y="303" text-anchor="middle" font-size="13" fill="#111111">re-reading, cramming</text>

  <rect x="600" y="262" width="200" height="50" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="700" y="284" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">3. Overload</text>
  <text x="700" y="303" text-anchor="middle" font-size="13" fill="#111111">too much new at once</text>

  <rect x="160" y="332" width="200" height="50" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="260" y="354" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">4. Anxiety and fear</text>
  <text x="260" y="373" text-anchor="middle" font-size="13" fill="#111111">worry fills working memory</text>

  <rect x="380" y="332" width="200" height="50" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="480" y="354" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">5. Low motivation</text>
  <text x="480" y="373" text-anchor="middle" font-size="13" fill="#111111">low value, distant reward</text>

  <rect x="600" y="332" width="200" height="50" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="700" y="354" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">6. Environment, body</text>
  <text x="700" y="373" text-anchor="middle" font-size="13" fill="#111111">distraction, sleep, time</text>

  <rect x="250" y="408" width="460" height="44" fill="#FFFFFF" stroke="#222222" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="480" y="428" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">One symptom can come from several causes.</text>
  <text x="480" y="445" text-anchor="middle" font-size="14" fill="#111111">Diagnose before you fix.</text>

  <text x="480" y="528" text-anchor="middle" font-size="13" fill="#333333">Schematic. Neurodivergence, disability and tool over-reliance can also sit below the waterline.</text>
</svg>
