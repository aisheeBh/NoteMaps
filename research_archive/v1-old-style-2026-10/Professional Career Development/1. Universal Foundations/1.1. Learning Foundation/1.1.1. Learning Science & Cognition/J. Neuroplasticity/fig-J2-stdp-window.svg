<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>The spike-timing-dependent plasticity window</title>
  <desc>Schematic STDP curve: when the presynaptic spike precedes the postsynaptic spike by a few to tens of milliseconds the synapse strengthens; when the order is reversed the synapse weakens. Effects shrink as the time gap grows.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#D3ECD3"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1E5E24" stroke-width="1.2"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><circle cx="5" cy="5" r="1.6" fill="#8B0000"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Order matters: the spike-timing window</text>

  <!-- filled areas -->
  <path d="M482 270 L482 110 C 520 150, 580 220, 700 255 C 760 266, 820 269, 860 270 Z" fill="url(#hatch)" stroke="none"/>
  <path d="M478 270 L478 370 C 440 345, 380 300, 260 282 C 200 275, 140 271, 100 270 Z" fill="url(#dots)" stroke="none"/>

  <!-- axes -->
  <line x1="90" y1="270" x2="880" y2="270" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="460" x2="480" y2="72" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- curves -->
  <path d="M482 110 C 520 150, 580 220, 700 255 C 760 266, 820 269, 860 270" fill="none" stroke="#1E5E24" stroke-width="4"/>
  <path d="M478 370 C 440 345, 380 300, 260 282 C 200 275, 140 271, 100 270" fill="none" stroke="#8B0000" stroke-width="3" stroke-dasharray="10 6"/>

  <!-- axis labels -->
  <text x="500" y="90" font-size="15" fill="#111111">Change in synaptic strength</text>
  <text x="870" y="296" text-anchor="end" font-size="15" fill="#111111">time gap (ms)</text>
  <text x="488" y="292" font-size="14" fill="#111111">0</text>
  <text x="680" y="296" text-anchor="middle" font-size="14" fill="#111111">+20 to +40</text>
  <text x="280" y="258" text-anchor="middle" font-size="14" fill="#111111">-20 to -40</text>
  <text x="466" y="118" text-anchor="end" font-size="14" fill="#111111">up</text>
  <text x="456" y="380" text-anchor="end" font-size="14" fill="#111111">down</text>

  <!-- region labels -->
  <rect x="590" y="120" width="300" height="78" fill="#FFFFFF" stroke="#1E5E24" stroke-width="3"/>
  <text x="604" y="144" font-size="16" font-weight="bold" fill="#111111">PRE fires BEFORE POST</text>
  <text x="604" y="166" font-size="15" fill="#111111">Solid line, hatched area:</text>
  <text x="604" y="186" font-size="15" fill="#111111">synapse STRENGTHENS (LTP)</text>

  <rect x="90" y="350" width="300" height="78" fill="#FFFFFF" stroke="#8B0000" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="104" y="374" font-size="16" font-weight="bold" fill="#111111">POST fires BEFORE PRE</text>
  <text x="104" y="396" font-size="15" fill="#111111">Dashed line, dotted area:</text>
  <text x="104" y="416" font-size="15" fill="#111111">synapse WEAKENS (LTD)</text>

  <!-- explanatory bottom -->
  <text x="480" y="486" text-anchor="middle" font-size="15" fill="#111111">The closer the two spikes are in time, the larger the change; beyond tens of milliseconds the effect fades.</text>
  <text x="480" y="516" text-anchor="middle" font-size="13" fill="#333333">Schematic of the classic pattern; real windows vary by region, cell type, firing rate and neuromodulators.</text>
</svg>
