<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>The expansion-renormalisation pattern</title>
  <desc>Schematic: during early learning, brain volume in task-relevant regions rises, then returns toward baseline as circuits are selected and pruned, while performance rises and stays high.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#EEF4FA"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9BB3CC" stroke-width="1.2"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFF4D6"/><circle cx="5" cy="5" r="1.4" fill="#B08A30"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Skill stays high while brain volume returns toward baseline</text>

  <!-- phase bands -->
  <rect x="100" y="70" width="270" height="350" fill="url(#hatch)" stroke="#555555" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="370" y="70" width="250" height="350" fill="url(#dots)" stroke="#555555" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="235" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">1. EXPANSION</text>
  <text x="235" y="112" text-anchor="middle" font-size="14" fill="#111111">many candidate circuits grow</text>
  <text x="495" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">2. SELECTION</text>
  <text x="495" y="112" text-anchor="middle" font-size="14" fill="#111111">useful circuits kept</text>
  <text x="755" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">3. RENORMALISATION</text>
  <text x="755" y="112" text-anchor="middle" font-size="14" fill="#111111">surplus pruned, skill efficient</text>

  <!-- axes -->
  <line x1="100" y1="420" x2="900" y2="420" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="100" y1="420" x2="100" y2="66" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="500" y="452" text-anchor="middle" font-size="16" fill="#111111">Weeks of practice</text>
  <text x="56" y="250" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 56 250)">Relative change</text>

  <!-- baseline -->
  <line x1="100" y1="360" x2="890" y2="360" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="886" y="380" text-anchor="end" font-size="14" fill="#333333">baseline</text>

  <!-- volume: dashed -->
  <path d="M100 360 C 180 340, 240 170, 330 160 C 420 155, 520 300, 640 335 C 720 350, 800 352, 880 352" fill="none" stroke="#222222" stroke-width="3" stroke-dasharray="10 6"/>
  <!-- performance: solid -->
  <path d="M100 400 C 200 330, 300 250, 420 215 C 540 190, 700 185, 880 182" fill="none" stroke="#1F3B5C" stroke-width="4"/>

  <!-- labels -->
  <rect x="640" y="140" width="240" height="30" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="652" y="161" font-size="15" font-weight="bold" fill="#111111">Solid: performance</text>
  <rect x="640" y="290" width="240" height="30" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="652" y="311" font-size="15" font-weight="bold" fill="#111111">Dashed: regional volume</text>

  <text x="480" y="486" text-anchor="middle" font-size="15" fill="#111111">Bigger is not the goal: expertise ends in efficient, selected circuitry.</text>
  <text x="480" y="516" text-anchor="middle" font-size="13" fill="#333333">Schematic of the model described by Wenger, Lovden and colleagues (2017); timing varies by task and brain region.</text>
</svg>
