<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>Working memory capacity: accuracy versus number of items</title>
  <desc>Schematic: accuracy stays near ceiling for one to three items and falls steadily beyond about four items. A dashed line shows a person with higher capacity whose knee comes later; a dotted line shows the same person under stress or distraction whose knee comes earlier.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#EEF4FA"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9BB3CC" stroke-width="1.2"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">The capacity "knee": more items, less held</text>

  <!-- capacity zone band -->
  <rect x="300" y="70" width="140" height="370" fill="url(#hatch)" stroke="#555555" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="310" y="372" width="120" height="58" fill="#FFFFFF" stroke="#555555" stroke-width="1"/>
  <text x="370" y="392" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">TYPICAL LIMIT</text>
  <text x="370" y="410" text-anchor="middle" font-size="14" fill="#111111">about 3 to 5</text>
  <text x="370" y="426" text-anchor="middle" font-size="14" fill="#111111">chunks</text>

  <!-- axes -->
  <line x1="100" y1="440" x2="900" y2="440" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="100" y1="440" x2="100" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="500" y="500" text-anchor="middle" font-size="16" fill="#111111">Number of separate items to hold at once</text>
  <text x="50" y="255" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 50 255)">Accuracy of recall</text>

  <!-- x ticks -->
  <g font-size="14" fill="#111111" text-anchor="middle">
    <line x1="170" y1="440" x2="170" y2="448" stroke="#222222" stroke-width="2"/><text x="170" y="468">1</text>
    <line x1="240" y1="440" x2="240" y2="448" stroke="#222222" stroke-width="2"/><text x="240" y="468">2</text>
    <line x1="310" y1="440" x2="310" y2="448" stroke="#222222" stroke-width="2"/><text x="310" y="468">3</text>
    <line x1="380" y1="440" x2="380" y2="448" stroke="#222222" stroke-width="2"/><text x="380" y="468">4</text>
    <line x1="450" y1="440" x2="450" y2="448" stroke="#222222" stroke-width="2"/><text x="450" y="468">5</text>
    <line x1="520" y1="440" x2="520" y2="448" stroke="#222222" stroke-width="2"/><text x="520" y="468">6</text>
    <line x1="590" y1="440" x2="590" y2="448" stroke="#222222" stroke-width="2"/><text x="590" y="468">7</text>
    <line x1="660" y1="440" x2="660" y2="448" stroke="#222222" stroke-width="2"/><text x="660" y="468">8</text>
    <line x1="730" y1="440" x2="730" y2="448" stroke="#222222" stroke-width="2"/><text x="730" y="468">9</text>
    <line x1="800" y1="440" x2="800" y2="448" stroke="#222222" stroke-width="2"/><text x="800" y="468">10</text>
  </g>
  <text x="92" y="112" text-anchor="end" font-size="14" fill="#111111">high</text>
  <text x="92" y="432" text-anchor="end" font-size="14" fill="#111111">low</text>

  <!-- typical: solid -->
  <path d="M170 110 L 310 118 C 350 125, 380 150, 430 200 C 500 270, 600 320, 700 345" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <!-- higher capacity: dashed -->
  <path d="M170 106 L 400 112 C 450 120, 490 150, 540 200 C 600 255, 650 280, 700 295" fill="none" stroke="#222222" stroke-width="3" stroke-dasharray="10 6"/>
  <!-- under stress: dotted -->
  <path d="M170 128 L 240 140 C 280 160, 300 200, 340 250 C 420 330, 560 375, 700 395" fill="none" stroke="#222222" stroke-width="3" stroke-dasharray="2 5"/>

  <!-- labels at line ends -->
  <rect x="712" y="262" width="220" height="42" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="720" y="280" font-size="15" font-weight="bold" fill="#111111">Dashed: higher capacity</text>
  <text x="720" y="297" font-size="14" fill="#111111">knee comes later</text>

  <rect x="712" y="320" width="220" height="42" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="720" y="338" font-size="15" font-weight="bold" fill="#111111">Solid: typical adult</text>
  <text x="720" y="355" font-size="14" fill="#111111">near perfect, then drops</text>

  <rect x="712" y="378" width="220" height="42" fill="#FFFFFF" stroke="#222222" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="720" y="396" font-size="15" font-weight="bold" fill="#111111">Dotted: same person</text>
  <text x="720" y="413" font-size="14" fill="#111111">stressed or distracted</text>

  <text x="480" y="540" text-anchor="middle" font-size="13" fill="#333333">Illustrative schematic of change-detection and span findings; not plotted from a single dataset.</text>
</svg>
