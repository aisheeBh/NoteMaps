<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>Working memory and knowledge across the lifespan</title>
  <desc>Schematic: working-memory capacity rises steeply through childhood and adolescence, peaks roughly in the twenties to early thirties, then declines gradually, more steeply in late life. Accumulated knowledge and vocabulary keep rising through most of adulthood and stay high into later life. A shaded band marks the peak period.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#EEF4FA"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9BB3CC" stroke-width="1.2"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Working memory and knowledge follow different paths</text>

  <!-- peak band: ages 20-35 ; x = 100 + age*9 -->
  <rect x="280" y="70" width="135" height="370" fill="url(#hatch)" stroke="#555555" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="347" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">PEAK</text>
  <text x="347" y="110" text-anchor="middle" font-size="14" fill="#111111">about 20 to 35</text>

  <!-- axes -->
  <line x1="100" y1="440" x2="900" y2="440" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="100" y1="440" x2="100" y2="70" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="500" y="500" text-anchor="middle" font-size="16" fill="#111111">Age in years</text>
  <text x="50" y="255" text-anchor="middle" font-size="16" fill="#111111" transform="rotate(-90 50 255)">Relative level</text>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <line x1="145" y1="440" x2="145" y2="448" stroke="#222222" stroke-width="2"/><text x="145" y="468">5</text>
    <line x1="190" y1="440" x2="190" y2="448" stroke="#222222" stroke-width="2"/><text x="190" y="468">10</text>
    <line x1="280" y1="440" x2="280" y2="448" stroke="#222222" stroke-width="2"/><text x="280" y="468">20</text>
    <line x1="370" y1="440" x2="370" y2="448" stroke="#222222" stroke-width="2"/><text x="370" y="468">30</text>
    <line x1="460" y1="440" x2="460" y2="448" stroke="#222222" stroke-width="2"/><text x="460" y="468">40</text>
    <line x1="550" y1="440" x2="550" y2="448" stroke="#222222" stroke-width="2"/><text x="550" y="468">50</text>
    <line x1="640" y1="440" x2="640" y2="448" stroke="#222222" stroke-width="2"/><text x="640" y="468">60</text>
    <line x1="730" y1="440" x2="730" y2="448" stroke="#222222" stroke-width="2"/><text x="730" y="468">70</text>
    <line x1="820" y1="440" x2="820" y2="448" stroke="#222222" stroke-width="2"/><text x="820" y="468">80</text>
  </g>

  <!-- working memory: solid -->
  <path d="M120 410 C 170 330, 230 200, 300 140 C 340 125, 380 125, 420 140 C 520 175, 640 220, 730 270 C 780 300, 810 330, 840 360" fill="none" stroke="#1F3B5C" stroke-width="4"/>
  <!-- knowledge: dashed -->
  <path d="M120 425 C 200 380, 280 290, 380 230 C 480 175, 600 140, 700 135 C 760 135, 800 150, 840 175" fill="none" stroke="#222222" stroke-width="3" stroke-dasharray="10 6"/>

  <!-- labels -->
  <rect x="440" y="340" width="270" height="46" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="2"/>
  <text x="450" y="360" font-size="15" font-weight="bold" fill="#111111">Solid: working-memory capacity</text>
  <text x="450" y="378" font-size="14" fill="#111111">rises, peaks, declines gradually</text>

  <rect x="560" y="82" width="300" height="46" fill="#FFFFFF" stroke="#222222" stroke-width="1"/>
  <text x="570" y="102" font-size="15" font-weight="bold" fill="#111111">Dashed: knowledge and vocabulary</text>
  <text x="570" y="120" font-size="14" fill="#111111">keep growing, stay high late in life</text>


  <text x="480" y="540" text-anchor="middle" font-size="13" fill="#333333">Illustrative schematic of cross-sectional findings; individuals vary widely and curves are not from one dataset.</text>
</svg>
