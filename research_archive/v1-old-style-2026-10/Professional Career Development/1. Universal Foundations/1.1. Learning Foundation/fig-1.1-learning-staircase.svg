<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>The learning staircase of Section 1.1</title>
  <desc>Four ascending steps: understand how learning works, study with evidence-based strategies, build skills to mastery, and sustain self-directed lifelong learning. Two supporting rails run underneath: core thinking skills and productivity with knowledge management.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#222222"/>
    </marker>
  </defs>

  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Section 1.1 — The learning staircase</text>

  <!-- steps -->
  <rect x="60"  y="330" width="200" height="100" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <rect x="260" y="260" width="200" height="170" fill="url(#hatch)" stroke="#222222" stroke-width="2.5"/>
  <rect x="460" y="190" width="200" height="240" fill="url(#cross)" stroke="#222222" stroke-width="2.5"/>
  <rect x="660" y="120" width="240" height="310" fill="url(#dots)" stroke="#222222" stroke-width="2.5" stroke-dasharray="8 4"/>

  <!-- step labels -->
  <text x="160" y="360" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">STEP 1 · UNDERSTAND</text>
  <text x="160" y="384" text-anchor="middle" font-size="15" fill="#FFFFFF">1.1.1 Learning</text>
  <text x="160" y="404" text-anchor="middle" font-size="15" fill="#FFFFFF">Science &amp; Cognition</text>

  <rect x="272" y="272" width="176" height="74" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1.5"/>
  <text x="360" y="294" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">STEP 2 · STUDY</text>
  <text x="360" y="315" text-anchor="middle" font-size="14" fill="#111111">1.1.2 Learning Strategies</text>
  <text x="360" y="334" text-anchor="middle" font-size="14" fill="#111111">&amp; Study Skills</text>

  <rect x="472" y="202" width="176" height="74" fill="#FFFFFF" stroke="#1E5E24" stroke-width="1.5"/>
  <text x="560" y="224" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">STEP 3 · MASTER</text>
  <text x="560" y="245" text-anchor="middle" font-size="14" fill="#111111">1.1.3 Skill Development</text>
  <text x="560" y="264" text-anchor="middle" font-size="14" fill="#111111">&amp; Mastery</text>

  <rect x="672" y="132" width="216" height="74" fill="#FFFFFF" stroke="#7A5200" stroke-width="1.5"/>
  <text x="780" y="154" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">STEP 4 · SUSTAIN</text>
  <text x="780" y="175" text-anchor="middle" font-size="14" fill="#111111">1.1.4 Self-Directed</text>
  <text x="780" y="194" text-anchor="middle" font-size="14" fill="#111111">&amp; Lifelong Learning</text>

  <!-- climb arrow -->
  <path d="M110 300 L 330 230 L 530 160 L 720 92" fill="none" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="250" y="232" font-size="14" fill="#111111" transform="rotate(-17 250 232)">from knowing how learning works to learning for life</text>

  <!-- rails -->
  <rect x="60" y="450" width="840" height="48" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
  <text x="480" y="480" text-anchor="middle" font-size="16" fill="#111111"><tspan font-weight="bold">RAIL A · 1.1.5 Core Thinking Skills</tspan> — how you reason about what you learn</text>
  <rect x="60" y="506" width="840" height="48" fill="#E6E6E6" stroke="#666666" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="480" y="536" text-anchor="middle" font-size="16" fill="#111111"><tspan font-weight="bold">RAIL B · 1.1.6 Productivity &amp; Knowledge Management</tspan> — how you organise time and knowledge</text>

  <text x="480" y="584" text-anchor="middle" font-size="14" fill="#333333">The steps are climbed in order; the two rails support every step.</text>
</svg>
