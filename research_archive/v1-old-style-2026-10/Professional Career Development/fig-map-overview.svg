<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" font-family="Arial, Helvetica, sans-serif">
  <title>The career house: the five pillars of the Professional Career Development map</title>
  <desc>A house diagram. Universal Foundations is the base slab, Technical Foundations sits on it, Career Domains are the columns, Professional Growth is the beam across all columns, and Career Development is the roof that gives direction.</desc>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#BCD5EE"/><line x1="0" y1="0" x2="0" y2="8" stroke="#1F3B5C" stroke-width="1.5"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFE6A8"/><circle cx="5" cy="5" r="1.6" fill="#7A5200"/>
    </pattern>
    <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#D3ECD3"/><path d="M0 5H10M5 0V10" stroke="#1E5E24" stroke-width="1"/>
    </pattern>
    <pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F6CACA"/><path d="M0 5H10" stroke="#8B0000" stroke-width="1"/>
    </pattern>
  </defs>

  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">The Career House — how the five pillars fit together</text>

  <!-- 5 roof -->
  <polygon points="110,200 480,70 850,200" fill="url(#dots)" stroke="#222222" stroke-width="3"/>
  <rect x="320" y="132" width="320" height="52" fill="#FFFFFF" stroke="#7A5200" stroke-width="1.5"/>
  <text x="480" y="154" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">5. CAREER DEVELOPMENT</text>
  <text x="480" y="175" text-anchor="middle" font-size="14" fill="#111111">direction: explore, land, advance, transition</text>

  <!-- 4 beam -->
  <rect x="130" y="206" width="700" height="56" fill="url(#lines)" stroke="#222222" stroke-width="2.5"/>
  <rect x="300" y="212" width="360" height="44" fill="#FFFFFF" stroke="#8B0000" stroke-width="1.5"/>
  <text x="480" y="231" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">4. PROFESSIONAL GROWTH</text>
  <text x="480" y="249" text-anchor="middle" font-size="14" fill="#111111">leadership, influence, effectiveness, ethics</text>

  <!-- 3 columns -->
  <g stroke="#222222" stroke-width="2.5">
    <rect x="160" y="268" width="96" height="164" fill="url(#cross)"/>
    <rect x="296" y="268" width="96" height="164" fill="url(#cross)"/>
    <rect x="432" y="268" width="96" height="164" fill="url(#cross)"/>
    <rect x="568" y="268" width="96" height="164" fill="url(#cross)"/>
    <rect x="704" y="268" width="96" height="164" fill="url(#cross)"/>
  </g>
  <g font-size="14" fill="#111111" text-anchor="middle">
    <rect x="164" y="280" width="88" height="24" fill="#FFFFFF" stroke="#1E5E24"/><text x="208" y="297">Software</text>
    <rect x="300" y="280" width="88" height="24" fill="#FFFFFF" stroke="#1E5E24"/><text x="344" y="297">AI &amp; Data</text>
    <rect x="436" y="280" width="88" height="24" fill="#FFFFFF" stroke="#1E5E24"/><text x="480" y="297">Cloud</text>
    <rect x="572" y="280" width="88" height="24" fill="#FFFFFF" stroke="#1E5E24"/><text x="616" y="297">Security</text>
    <rect x="708" y="280" width="88" height="24" fill="#FFFFFF" stroke="#1E5E24"/><text x="752" y="297">+ 24 more</text>
  </g>
  <rect x="290" y="340" width="380" height="50" fill="#FFFFFF" stroke="#1E5E24" stroke-width="2"/>
  <text x="480" y="362" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">3. CAREER DOMAINS</text>
  <text x="480" y="381" text-anchor="middle" font-size="14" fill="#111111">28 specialisations — choose one or two to stand on</text>

  <!-- 2 technical -->
  <rect x="120" y="438" width="720" height="58" fill="url(#hatch)" stroke="#222222" stroke-width="2.5"/>
  <rect x="290" y="445" width="380" height="44" fill="#FFFFFF" stroke="#1F3B5C" stroke-width="1.5"/>
  <text x="480" y="464" text-anchor="middle" font-size="18" font-weight="bold" fill="#111111">2. TECHNICAL FOUNDATIONS</text>
  <text x="480" y="482" text-anchor="middle" font-size="14" fill="#111111">computing, programming, systems, data, math</text>

  <!-- 1 universal -->
  <rect x="90" y="502" width="780" height="70" fill="#1F3B5C" stroke="#000000" stroke-width="3"/>
  <text x="480" y="530" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">1. UNIVERSAL FOUNDATIONS</text>
  <text x="480" y="556" text-anchor="middle" font-size="15" fill="#FFFFFF">learning, thinking, digital, business, data, communication, AI, money, law</text>

  <line x1="50" y1="578" x2="910" y2="578" stroke="#222222" stroke-width="2"/>
  <text x="480" y="612" text-anchor="middle" font-size="14" fill="#333333">Build from the bottom up; every layer rests on the one beneath it. The roof only stays up if the foundation holds.</text>
</svg>
